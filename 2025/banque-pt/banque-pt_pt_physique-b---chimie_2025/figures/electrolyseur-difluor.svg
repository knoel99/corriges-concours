<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="sans-serif" font-size="14"><rect width="100%" height="100%" fill="white"/><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b3261e"/></marker><marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1a5fb4"/></marker></defs><text x="20" y="26" font-size="16">Électrolyseur à difluor : branchements, courant et réactions</text><path d="M150,190 L150,430 L610,430 L610,190" fill="none" stroke="#222" stroke-width="2.5"/><rect x="152" y="235" width="456" height="193" fill="#dcecf7"/><text x="380" y="418" text-anchor="middle" font-size="13">HF(ℓ) anhydre</text><line x1="380" y1="170" x2="380" y2="400" stroke="#555" stroke-width="3" stroke-dasharray="7 5"/><text x="380" y="162" text-anchor="middle" font-size="12">membrane étanche aux gaz</text><rect x="225" y="150" width="26" height="240" fill="#444"/><rect x="509" y="150" width="26" height="240" fill="#9aa3ad" stroke="#555"/><text x="238" y="452" text-anchor="middle">Anode (graphite)</text><text x="522" y="452" text-anchor="middle">Cathode (acier)</text><text x="238" y="472" text-anchor="middle" font-size="13" fill="#b3261e">oxydation : 2 HF = F₂ + 2 H⁺ + 2 e⁻</text><text x="532" y="472" text-anchor="middle" font-size="13" fill="#1a5fb4">réduction : 2 HF + 2 e⁻ = H₂ + 2 F⁻</text><path d="M238,150 L238,70 L340,70" fill="none" stroke="#222" stroke-width="2"/><path d="M420,70 L522,70 L522,150" fill="none" stroke="#222" stroke-width="2"/><circle cx="380" cy="70" r="40" fill="white" stroke="#222" stroke-width="2"/><text x="380" y="66" text-anchor="middle" font-size="13">générateur</text><text x="380" y="84" text-anchor="middle" font-size="13">continu</text><text x="328" y="62" text-anchor="middle" font-size="20" fill="#b3261e">+</text><text x="432" y="62" text-anchor="middle" font-size="22" fill="#1a5fb4">−</text><line x1="325" y1="92" x2="262" y2="92" stroke="#b3261e" stroke-width="2" marker-end="url(#flr)"/><text x="294" y="110" text-anchor="middle" fill="#b3261e">I</text><line x1="498" y1="92" x2="436" y2="92" stroke="#b3261e" stroke-width="2" marker-end="url(#flr)"/><text x="467" y="110" text-anchor="middle" fill="#b3261e">I</text><line x1="270" y1="330" x2="490" y2="330" stroke="#b3261e" stroke-width="2" marker-end="url(#flr)"/><text x="330" y="316" text-anchor="middle" fill="#b3261e" font-size="13">I dans l'électrolyte</text><line x1="262" y1="48" x2="325" y2="48" stroke="#1a5fb4" stroke-width="2" marker-end="url(#flb)"/><text x="290" y="40" text-anchor="middle" fill="#1a5fb4">e⁻</text><line x1="436" y1="48" x2="498" y2="48" stroke="#1a5fb4" stroke-width="2" marker-end="url(#flb)"/><text x="470" y="40" text-anchor="middle" fill="#1a5fb4">e⁻</text><circle cx="205" cy="300" r="6" fill="white" stroke="#b3261e"/><circle cx="212" cy="262" r="6" fill="white" stroke="#b3261e"/><circle cx="200" cy="225" r="6" fill="white" stroke="#b3261e"/><circle cx="262" cy="285" r="6" fill="white" stroke="#b3261e"/><circle cx="268" cy="245" r="6" fill="white" stroke="#b3261e"/><circle cx="495" cy="300" r="6" fill="white" stroke="#1a5fb4"/><circle cx="490" cy="262" r="6" fill="white" stroke="#1a5fb4"/><circle cx="498" cy="225" r="6" fill="white" stroke="#1a5fb4"/><circle cx="548" cy="285" r="6" fill="white" stroke="#1a5fb4"/><circle cx="552" cy="245" r="6" fill="white" stroke="#1a5fb4"/><line x1="190" y1="215" x2="190" y2="160" stroke="#b3261e" stroke-width="1.6" marker-end="url(#flr)"/><text x="182" y="150" text-anchor="end" fill="#b3261e">F₂(g)</text><line x1="570" y1="215" x2="570" y2="160" stroke="#1a5fb4" stroke-width="1.6" marker-end="url(#flb)"/><text x="578" y="150" fill="#1a5fb4">H₂(g)</text></svg>
