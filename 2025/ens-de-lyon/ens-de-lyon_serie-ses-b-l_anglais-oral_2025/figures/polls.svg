<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">How close state estimates can produce a clear winner</title>
<desc id="description">State margin Difference in vote share. A small change may flip a close state. Electoral votes Votes attached to states won. A shift can affect several states. National vote Individual votes nationwide. A different aggregation.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">How close state estimates can produce a clear winner</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Measure</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What is counted</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Scope</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">State margin</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Difference in vote share.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">A small change may flip a</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">close state.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Electoral votes</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Votes attached to states</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">won.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">A shift can affect several</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">states.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">National vote</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Individual votes</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">nationwide.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">A different aggregation.</text>
</g>
</svg>
