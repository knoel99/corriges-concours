<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">One presidential calendar, three different counts</title>
<desc id="description">Day at a property 16 of 31 full days A visit can occupy part of a day. Day playing golf 10 days May overlap with a property visit. Night away 12 nights at properties Different unit from a visit.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">One presidential calendar, three different counts</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Unit</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Reported count</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Interpretation</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Day at a property</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">16 of 31 full days</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">A visit can occupy part of</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">a day.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Day playing golf</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">10 days</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">May overlap with a property</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">visit.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Night away</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">12 nights at properties</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Different unit from a</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">visit.</text>
</g>
</svg>
