<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">From a policy announcement to its political effects</title>
<desc id="description">Trading partner Postpones a decision. Timing and reason for delay. Household Faces a changed price. Price and available substitutes. Opponent Chooses what to contest. Public message and audience.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">From a policy announcement to its political effects</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Level</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Possible response</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Evidence to look for</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Trading partner</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Postpones a decision.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Timing and reason for</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">delay.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Household</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Faces a changed price.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Price and available</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">substitutes.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Opponent</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Chooses what to contest.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Public message and</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">audience.</text>
</g>
</svg>
