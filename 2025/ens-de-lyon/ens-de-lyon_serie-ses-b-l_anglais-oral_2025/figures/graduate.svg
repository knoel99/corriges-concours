<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What is reported</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Time frame</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
