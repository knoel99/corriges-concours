<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Three questions beyond the size of a pay packet</title>
<desc id="description">Meaning Does the work feel meaningful? Early-career assessment. Plans Does the work fit future plans? Expectations at survey date. Skills Does the job use acquired skills? Self-reported match.</desc>
