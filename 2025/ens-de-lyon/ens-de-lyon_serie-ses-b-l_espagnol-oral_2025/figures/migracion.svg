<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">¿Qué mide cada indicador?</title>
<desc id="description">Llegadas irregulares Entradas en un período. ¿Qué flujo se registró? Población nacida fuera Personas residentes en una fecha. ¿Dónde nacieron? Capacidad de acogida Plazas disponibles en un centro. ¿A cuántas personas puede recibir?</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿Qué mide cada indicador?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Indicador</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Unidad y tiempo</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Pregunta que responde</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Llegadas irregulares</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Entradas en un período.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">¿Qué flujo se registró?</text>
<rect x="10" y="137" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Población nacida</text>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">fuera</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Personas residentes en una</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">fecha.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">¿Dónde nacieron?</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Capacidad de acogida</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Plazas disponibles en un</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">centro.</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">¿A cuántas personas puede</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">recibir?</text>
</g>
</svg>
