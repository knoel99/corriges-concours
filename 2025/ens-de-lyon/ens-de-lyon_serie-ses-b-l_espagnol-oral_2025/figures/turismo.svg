<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Previsión de llegadas en 2040 según el cuerpo del artículo</title>
<desc id="description">España 110 millones Referencia de la comparación. Francia 105 millones 5 millones menos. Estados Unidos 100 millones 10 millones menos. El subtítulo dice cinco.</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Previsión de llegadas en 2040 según el cuerpo del artículo</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Destino</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Viajeros previstos</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Diferencia con España</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">España</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">110 millones</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Referencia de la</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">comparación.</text>
<rect x="10" y="159" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Francia</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">105 millones</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">5 millones menos.</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Estados Unidos</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">100 millones</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">10 millones menos. El</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">subtítulo dice cinco.</text>
</g>
</svg>
