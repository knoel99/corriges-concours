<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Какие выводы позволяет сделать источник?</title>
<desc id="description">Специалист Объясняет перемены в своей области. При каких условиях? Опрос Фиксирует ответы людей. Кто отвечал и когда? Журналист Сопоставляет четыре области. Какие различия сохраняются?</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Какие выводы позволяет сделать источник?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Источник</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">О чём он говорит</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Что надо уточнить</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Специалист</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Объясняет перемены в своей</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">области.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">При каких условиях?</text>
<rect x="10" y="159" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Опрос</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Фиксирует ответы людей.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Кто отвечал и когда?</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Журналист</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Сопоставляет четыре</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">области.</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Какие различия сохраняются?</text>
</g>
</svg>
