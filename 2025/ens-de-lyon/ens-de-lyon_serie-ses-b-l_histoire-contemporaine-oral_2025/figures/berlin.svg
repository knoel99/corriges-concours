<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 176" width="880" height="176"><title>Berlin, trois moments de la frontière</title><rect x="0" y="0" width="880" height="176" rx="4" fill="#f4f6f2" /><text x="18" y="30" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:22px;font-weight:bold">Berlin, trois moments de la frontière</text><rect x="15" y="48" width="273" height="116" rx="4" fill="#dce9e4" /><text x="27" y="77" fill="#155b56" style="font-family:DejaVu Sans,sans-serif;font-size:19px;font-weight:bold">1948–1949</text><text x="27" y="111" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:17px;font-weight:bold">Blocus et pont aérien</text><text x="27" y="140" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:normal">Ravitailler Berlin-Ouest</text><rect x="304" y="48" width="273" height="116" rx="4" fill="#dce9e4" /><text x="316" y="77" fill="#155b56" style="font-family:DejaVu Sans,sans-serif;font-size:19px;font-weight:bold">1961</text><text x="316" y="111" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:17px;font-weight:bold">Construction du Mur</text><text x="316" y="140" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:normal">Fermer les passages</text><rect x="593" y="48" width="273" height="116" rx="4" fill="#dce9e4" /><text x="605" y="77" fill="#155b56" style="font-family:DejaVu Sans,sans-serif;font-size:19px;font-weight:bold">1989–1990</text><text x="605" y="111" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:17px;font-weight:bold">Ouverture, puis unité</text><text x="605" y="140" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:normal">Deux décisions distinctes</text></svg>