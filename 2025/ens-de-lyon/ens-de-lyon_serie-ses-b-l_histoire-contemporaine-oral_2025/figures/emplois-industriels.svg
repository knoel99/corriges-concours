<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 176" width="880" height="176"><title>Pourquoi l’emploi industriel peut-il reculer ?</title><rect x="0" y="0" width="880" height="176" rx="4" fill="#f4f6f2" /><text x="18" y="30" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:22px;font-weight:bold">Pourquoi l’emploi industriel peut-il reculer ?</text><rect x="15" y="48" width="273" height="116" rx="4" fill="#dce9e4" /><text x="27" y="77" fill="#155b56" style="font-family:DejaVu Sans,sans-serif;font-size:19px;font-weight:bold">Productivité</text><text x="27" y="111" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:17px;font-weight:bold">Même production</text><text x="27" y="140" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:normal">Moins d’heures nécessaires</text><rect x="304" y="48" width="273" height="116" rx="4" fill="#dce9e4" /><text x="316" y="77" fill="#155b56" style="font-family:DejaVu Sans,sans-serif;font-size:19px;font-weight:bold">Externalisation</text><text x="316" y="111" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:17px;font-weight:bold">Tâche encore assurée</text><text x="316" y="140" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:normal">Emploi classé en services</text><rect x="593" y="48" width="273" height="116" rx="4" fill="#dce9e4" /><text x="605" y="77" fill="#155b56" style="font-family:DejaVu Sans,sans-serif;font-size:19px;font-weight:bold">Fermeture</text><text x="605" y="111" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:17px;font-weight:bold">Production supprimée</text><text x="605" y="140" fill="#173a48" style="font-family:DejaVu Sans,sans-serif;font-size:15px;font-weight:normal">Bassin local touché</text></svg>