<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Woran wäre die Wirkung des Titels zu erkennen?</title>
<desc id="description">Vor dem Festjahr Vereine und Nachbarn arbeiten zusammen. Welche Beziehungen bestehen schon? Im Festjahr Projekte werden öffentlich sichtbar. Wer nimmt tatsächlich teil? Nach dem Festjahr Eine Partnerschaft dauert an. Besteht das gemeinsame Projekt weiter?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Woran wäre die Wirkung des Titels zu erkennen?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Zeitraum</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Beispiel</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Prüfbare Frage</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Vor dem Festjahr</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Vereine und Nachbarn</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">arbeiten zusammen.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Welche Beziehungen bestehen</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">schon?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Im Festjahr</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Projekte werden öffentlich</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">sichtbar.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Wer nimmt tatsächlich teil?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Nach dem Festjahr</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Eine Partnerschaft dauert</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">an.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Besteht das gemeinsame</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Projekt weiter?</text>
</g>
</svg>
