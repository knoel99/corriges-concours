<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Wer entscheidet über welche Frage?</title>
<desc id="description">Verfassungsschutz Bewertung einer Partei im Mai 2025. Einstufung durch eine Behörde. Verwaltungsgericht Prüfung einer angefochtenen Maßnahme. Entscheidung im jeweiligen Verfahren. Verfassungsgericht Gesondertes Parteiverbotsverfahren. Nur hier wäre ein Verbot möglich.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Wer entscheidet über welche Frage?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Institution</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Vorgang</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Reichweite</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Verfassungsschutz</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Bewertung einer Partei im</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Mai 2025.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Einstufung durch eine</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Behörde.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Verwaltungsgericht</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Prüfung einer</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">angefochtenen Maßnahme.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Entscheidung im jeweiligen</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Verfahren.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Verfassungsgericht</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Gesondertes</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Parteiverbotsverfahren.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Nur hier wäre ein Verbot</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">möglich.</text>
</g>
</svg>
