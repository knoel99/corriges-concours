<svg xmlns="http://www.w3.org/2000/svg" width="620" height="222" viewBox="0 0 620 222" role="img" aria-labelledby="titre d"><title id="titre">Dosage en retour de la vitamine C</title><desc id="d">Le thiosulfate mesure le triiodure restant. La différence avec la quantité apportée donne la quantité de vitamine C.</desc><rect width="620" height="222" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#233a40"><text x="20" y="38" font-size="22">Dosage en retour de la vitamine C</text><rect x="18" y="64" width="584" height="55" rx="5" fill="#eef4f4"/><text x="32" y="87" font-size="16" font-weight="bold">Triiodure introduit</text><text x="32" y="108" font-size="15">0,100 mol/L × 10,0 mL</text><text x="577" y="98" font-size="18" text-anchor="end">1,000 mmol</text><rect x="18" y="127" width="584" height="55" rx="5" fill="#f7f2e9"/><text x="32" y="150" font-size="16" font-weight="bold">Triiodure en excès</text><text x="32" y="171" font-size="15">½ × 0,100 mol/L × 7,2 mL</text><text x="577" y="161" font-size="18" text-anchor="end">0,360 mmol</text><text x="22" y="209" font-size="15">Vitamine C dans l’extrait : 1,000 − 0,360 = 0,640 mmol.</text></g></svg>
