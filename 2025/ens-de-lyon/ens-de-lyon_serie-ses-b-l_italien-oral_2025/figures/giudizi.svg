<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Chi giudica nel testo di Malaguti?</title>
<desc id="description">Il padre La vita della figlia. Rende alla persona un nome e una storia. Il pubblico Il comportamento della vittima. Sposta la responsabilità con parole quotidiane. Il giornalista Le proprie abitudini di uomo e padre. Include chi scrive nella domanda educativa.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Chi giudica nel testo di Malaguti?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voce</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Oggetto del discorso</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effetto</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Il padre</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La vita della figlia.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Rende alla persona un nome</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">e una storia.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Il pubblico</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Il comportamento della</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">vittima.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Sposta la responsabilità</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">con parole quotidiane.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Il giornalista</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le proprie abitudini di</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">uomo e padre.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Include chi scrive nella</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">domanda educativa.</text>
</g>
</svg>
