<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Dal paragone alla verifica</title>
<desc id="description">Garibaldi Richiama la memoria del Risorgimento. Chi propone il paragone? Vanterie Esprime già un giudizio. Quale frase va verificata? Realtà Chiede una prova esterna. Quale dato sarebbe pertinente?</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Dal paragone alla verifica</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Parola del titolo</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Effetto</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Domanda da porre</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Garibaldi</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Richiama la memoria del</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Risorgimento.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Chi propone il paragone?</text>
<rect x="10" y="159" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Vanterie</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Esprime già un giudizio.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Quale frase va verificata?</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Realtà</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Chiede una prova esterna.</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Quale dato sarebbe</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">pertinente?</text>
</g>
</svg>
