<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">D’une même manifestation à deux lectures de la réforme</title>
<desc id="description">Qui parle ? Les agriculteurs, leur syndicat et le gouvernement. Un économiste fiscaliste et une spécialiste de la pauvreté. Quel enjeu ? La transmission des fermes aux héritiers. La distribution des allègements et l’accès aux médias. Quel geste journalistique ? Rapporter les motifs invoqués et les réactions. Prendre position et discuter la difficulté de réformer.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">D’une même manifestation à deux lectures de la réforme</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de comparaison</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Le Figaro</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Polly Toynbee, The Guardian</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Qui parle ?</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Les agriculteurs, leur</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">syndicat et le</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">gouvernement.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Un économiste fiscaliste et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">une spécialiste de la</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">pauvreté.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Quel enjeu ?</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">La transmission des fermes</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">aux héritiers.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">La distribution des</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">allègements et l’accès aux</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">médias.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Quel geste</text>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">journalistique ?</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Rapporter les motifs</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">invoqués et les réactions.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Prendre position et</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">discuter la difficulté de</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">réformer.</text>
</g>
</svg>
