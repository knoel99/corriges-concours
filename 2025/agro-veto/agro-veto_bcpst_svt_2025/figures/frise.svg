<svg xmlns="http://www.w3.org/2000/svg" width="750" height="460" viewBox="0 0 750 460"><rect width="750" height="460" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#253e49">
<text x="17" y="31" fill="#253e49" text-anchor="start" font-weight="700" font-size="21">Développement mammaire, production puis éjection</text>
<text x="22" y="105" fill="#253e49" text-anchor="start" font-weight="700" font-size="15">Gestation</text>
<rect x="173" y="61" width="544" height="69" rx="8" fill="#eef3e9" stroke="#397451" stroke-width="1.8"/>
<text x="445.0" y="91.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Œstrogènes et progestérone</text>
<text x="445.0" y="110.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Prolifération des cellules épithéliales et myoépithéliales.</text>
<path d="M443 132 L443 154" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M443 154 L438.69 146.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M443 154 L447.31 146.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<text x="22" y="201" fill="#253e49" text-anchor="start" font-weight="700" font-size="15">Fin de gestation</text>
<rect x="173" y="157" width="544" height="69" rx="8" fill="#eef3e9" stroke="#397451" stroke-width="1.8"/>
<text x="445.0" y="187.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Formation des alvéoles et des lobules</text>
<text x="445.0" y="206.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Tissu glandulaire de plus en plus développé.</text>
<path d="M443 228 L443 250" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M443 250 L438.69 242.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M443 250 L447.31 242.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<text x="22" y="295" fill="#253e49" text-anchor="start" font-weight="700" font-size="15">Après mise bas</text>
<rect x="173" y="251" width="544" height="69" rx="8" fill="#edf4f6" stroke="#247b93" stroke-width="1.8"/>
<text x="445.0" y="281.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Prolactine → épithélium sécréteur</text>
<text x="445.0" y="300.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Synthèse du lait et accumulation dans la lumière alvéolaire.</text>
<path d="M443 322 L443 344" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M443 344 L438.69 336.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M443 344 L447.31 336.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<text x="22" y="392" fill="#253e49" text-anchor="start" font-weight="700" font-size="15">À chaque éjection</text>
<rect x="173" y="348" width="544" height="69" rx="8" fill="#faf0e5" stroke="#a96528" stroke-width="1.8"/>
<text x="445.0" y="378.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Ocytocine → cellules myoépithéliales</text>
<text x="445.0" y="397.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Contraction avec Ca²⁺ et actine → lait dans le canal.</text>
</g></svg>
