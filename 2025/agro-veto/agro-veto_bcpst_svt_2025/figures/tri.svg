<svg xmlns="http://www.w3.org/2000/svg" width="750" height="288" viewBox="0 0 750 288"><rect width="750" height="288" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#253e49">
<text x="17" y="31" fill="#253e49" text-anchor="start" font-weight="700" font-size="21">Deux diamètres, deux seuils de courant</text>
<rect x="33" y="59" width="328" height="101" rx="8" fill="#ecf4f5" stroke="#247b93" stroke-width="1.8"/>
<text x="197.0" y="95.5" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Sables de 1 mm</text>
<text x="197.0" y="114.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Arrachement : ≈ 35–45 cm/s</text>
<text x="197.0" y="133.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Dépôt : quelques cm/s</text>
<rect x="389" y="59" width="328" height="101" rx="8" fill="#ecf4f5" stroke="#247b93" stroke-width="1.8"/>
<text x="553.0" y="95.5" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Galets de 10 mm</text>
<text x="553.0" y="114.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Arrachement : ≈ 100–150 cm/s</text>
<text x="553.0" y="133.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Dépôt : ≈ 30 cm/s</text>
<path d="M66 199 L675 199" fill="none" stroke="#397451" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M675 199 L667.1 203.31" fill="none" stroke="#397451" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M675 199 L667.1 194.69" fill="none" stroke="#397451" stroke-width="2.2" stroke-dasharray="none"/>
<text x="375" y="190" fill="#397451" text-anchor="middle" font-weight="400" font-size="15">Dans le sens d’un courant qui ralentit</text>
<text x="45" y="232" fill="#253e49" text-anchor="start" font-weight="700" font-size="16">Galets</text>
<text x="370" y="232" fill="#a74d49" text-anchor="middle" font-weight="700" font-size="16">Grenats</text>
<text x="680" y="232" fill="#247b93" text-anchor="end" font-weight="700" font-size="16">Quartz et calcite</text>
<text x="32" y="270" fill="#253e49" text-anchor="start" font-weight="400" font-size="14">À diamètre égal, les grenats plus denses se déposent plus tôt que le sable blanc.</text>
</g></svg>
