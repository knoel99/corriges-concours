<svg xmlns="http://www.w3.org/2000/svg" width="750" height="598" viewBox="0 0 750 598"><rect width="750" height="598" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#253e49">
<text x="17" y="31" fill="#253e49" text-anchor="start" font-weight="700" font-size="21">El Niño, alimentation des mères et croissance des jeunes</text>
<rect x="86" y="54" width="572" height="58" rx="8" fill="#ecf4f5" stroke="#247b93" stroke-width="1.8"/>
<text x="372.0" y="78.5" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Fort El Niño en hiver • doc. 12-1D</text>
<text x="372.0" y="97.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Pacifique oriental plus chaud en surface et remontées d’eaux froides amoindries.</text>
<path d="M371 113 L371 137" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M371 137 L366.69 129.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M371 137 L375.31 129.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<rect x="35" y="141" width="320" height="82" rx="8" fill="#edf4e7" stroke="#397451" stroke-width="1.8"/>
<text x="195.0" y="168.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Ressource moins abondante</text>
<text x="195.0" y="187.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Moins de nutriments et de plancton.</text>
<text x="195.0" y="206.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Biomasse et captures moindres (B).</text>
<rect x="392" y="141" width="323" height="82" rx="8" fill="#edf4e7" stroke="#397451" stroke-width="1.8"/>
<text x="553.5" y="168.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Ressource plus profonde</text>
<text x="553.5" y="187.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Médiane en mars ≈ 15–18 m,</text>
<text x="553.5" y="206.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">contre ≈ 9–10 m en année normale (C).</text>
<path d="M371 133 L193 133" fill="none" stroke="#253e49" stroke-width="2" stroke-dasharray="none"/>
<path d="M193 133 L193 138" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M193 138 L188.69 130.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M193 138 L197.31 130.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M371 133 L550 133" fill="none" stroke="#253e49" stroke-width="2" stroke-dasharray="none"/>
<path d="M550 133 L550 138" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M550 138 L545.69 130.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M550 138 L554.31 130.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M194 228 L194 242" fill="none" stroke="#253e49" stroke-width="2" stroke-dasharray="none"/>
<path d="M194 242 L550 242" fill="none" stroke="#253e49" stroke-width="2" stroke-dasharray="none"/>
<path d="M550 227 L550 242" fill="none" stroke="#253e49" stroke-width="2" stroke-dasharray="none"/>
<path d="M371 242 L371 257" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M371 257 L366.69 249.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M371 257 L375.31 249.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<rect x="79" y="261" width="590" height="63" rx="8" fill="#faf0e5" stroke="#a96528" stroke-width="1.8"/>
<text x="374.0" y="288.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Mères • anchois moins accessibles, capture plus coûteuse</text>
<text x="374.0" y="307.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Hypothèse reliant les ressources de pêche et les apports observés au jeune.</text>
<path d="M370 326 L370 344" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M370 344 L365.69 336.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M370 344 L374.31 336.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<rect x="31" y="348" width="687" height="81" rx="8" fill="#ecf4f5" stroke="#247b93" stroke-width="1.8"/>
<text x="374.5" y="374.5" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Moins de lait et d’énergie par jour • tableau 12-2, 1982 → 1984</text>
<text x="374.5" y="393.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Lait (g/j) : mâles 831 → 683, femelles 641 → 596.</text>
<text x="374.5" y="412.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Énergie (kcal/j) : mâles 2 834 → 2 328, femelles 2 187 → 2 032.</text>
<path d="M370 432 L370 449" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M370 449 L365.69 441.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M370 449 L374.31 441.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<rect x="30" y="453" width="689" height="84" rx="8" fill="#f7ebe7" stroke="#a74d49" stroke-width="1.8"/>
<text x="374.5" y="481.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Croissance plus lente des jeunes • tableau 12-2 et doc. 12-1A</text>
<text x="374.5" y="500.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Gain (g/j) : mâles 144 → 108, femelles 120 → 95 ; masse initiale comparable.</text>
<text x="374.5" y="519.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">En février 1983, à ≈ 23 °C, les jeunes pèsent ≈ 6,4 kg contre ≈ 10 kg en 1982.</text>
<text x="35" y="570" fill="#253e49" text-anchor="start" font-weight="400" font-size="13">Les captures péruviennes indiquent une tendance à l’échelle de l’est du Pacifique (B).</text>
<text x="35" y="591" fill="#253e49" text-anchor="start" font-weight="400" font-size="13">Elles ne mesurent pas directement les proies prises autour de San Nicolas, en Californie.</text>
</g></svg>
