<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">À quelle condition un élève peut-il prendre la parole ?</title>
<desc id="description">Comprendre son voisin Majadla part du message personnel d’un lecteur. La langue donne accès à un autre récit. Poursuivre des études Rozovsky confronte ressources et orientations scolaires. Une difficulté provisoire peut fermer une filière. Discuter en classe Liron rapproche la peur de parler du silence des adultes. Les désaccords trouvent-ils un interlocuteur ?</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">À quelle condition un élève peut-il prendre la parole ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Appui dans le dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet ou difficulté</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Comprendre son voisin</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Majadla part du message</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">personnel d’un lecteur.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La langue donne accès à un</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">autre récit.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Poursuivre des études</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Rozovsky confronte</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">ressources et orientations</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">scolaires.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Une difficulté provisoire</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">peut fermer une filière.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Discuter en classe</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Liron rapproche la peur de</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">parler du silence des</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">adultes.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Les désaccords trouvent-ils</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">un interlocuteur ?</text>
</g>
</svg>
