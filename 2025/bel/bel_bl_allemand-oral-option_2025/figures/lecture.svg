<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Wessen Geschichte wird erzählt?</title>
<desc id="description">Zeitzeugnis Was erlebte eine bestimmte Person 1945? Ihr Erlebnis erklärt keine kollektive Unschuld. Städtisches Gedenken Wer erinnerte wie an die zivilen Opfer? Die Feier allein erklärt keine gemeinsame Deutung. Pressebericht 2025 Was hat sich an diesem Aufmarsch verändert? Beobachtungen erlauben Aussagen über diese Veranstaltung.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Wessen Geschichte wird erzählt?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Perspektive</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Historische Frage</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Grenze des Schlusses</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Zeitzeugnis</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Was erlebte eine bestimmte</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Person 1945?</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Ihr Erlebnis erklärt keine</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">kollektive Unschuld.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Städtisches Gedenken</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Wer erinnerte wie an die</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">zivilen Opfer?</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Die Feier allein erklärt</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">keine gemeinsame Deutung.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Pressebericht 2025</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Was hat sich an diesem</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Aufmarsch verändert?</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Beobachtungen erlauben</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Aussagen über diese</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Veranstaltung.</text>
</g>
</svg>
