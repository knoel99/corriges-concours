<svg xmlns="http://www.w3.org/2000/svg" width="775" height="242" viewBox="0 0 775 242" role="img"><title>Le septennat de Valéry Giscard d’Estaing</title><desc>1974 Majorité civile. 1975 Lois sociales. 1976 Gouvernement Barre. 1981 Alternance</desc><rect width="775" height="242" fill="white"/>
<text x="17" y="24" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#223642" font-weight="700">Le septennat de Valéry Giscard d’Estaing</text>
<rect x="12" y="39" width="748" height="44" fill="#e8efed"/>
<text x="22" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1974</text>
<text x="157" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Majorité civile</text>
<text x="157" y="76" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">La majorité est abaissée de 21 à 18 ans.</text>
<rect x="12" y="88" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1975</text>
<text x="157" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Lois sociales</text>
<text x="157" y="125" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">La loi Veil encadre l’IVG et une réforme autorise le divorce par consentement mutuel.</text>
<rect x="12" y="137" width="748" height="44" fill="#e8efed"/>
<text x="22" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1976</text>
<text x="157" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Gouvernement Barre</text>
<text x="157" y="174" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">La lutte contre l’inflation pèse sur les choix économiques.</text>
<rect x="12" y="186" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1981</text>
<text x="157" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Alternance</text>
<text x="157" y="223" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">François Mitterrand remporte l’élection présidentielle.</text>
</svg>
