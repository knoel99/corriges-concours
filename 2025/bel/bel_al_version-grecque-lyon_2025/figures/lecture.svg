<svg xmlns="http://www.w3.org/2000/svg" width="760" height="130" viewBox="0 0 760 130">
<title>Trois étapes de la lecture de la version grecque</title>
<g font-family="DejaVu Sans, sans-serif">
<rect x="3" y="6" width="239" height="112" rx="7" fill="#f3f7f6" stroke="#78938a"/><text x="15" y="32" font-size="16" fill="#263e43">L’invitation</text><text x="15" y="61" font-size="18" font-weight="bold" fill="#006a57">εἴσιθι</text><text x="15" y="93" font-size="11.5" fill="#263e43">Chrémyle presse Ploutos d’entrer.</text>
<rect x="254" y="6" width="239" height="112" rx="7" fill="#f3f7f6" stroke="#78938a"/><text x="266" y="32" font-size="16" fill="#263e43">Les deux hôtes</text><text x="266" y="61" font-size="18" font-weight="bold" fill="#006a57">ἤν</text><text x="266" y="93" font-size="11.5" fill="#263e43">L’avare enfouit, le fou dépense.</text>
<rect x="505" y="6" width="239" height="112" rx="7" fill="#f3f7f6" stroke="#78938a"/><text x="517" y="32" font-size="16" fill="#263e43">La persuasion</text><text x="517" y="61" font-size="18" font-weight="bold" fill="#006a57">Πείθομαι</text><text x="517" y="93" font-size="11.5" fill="#263e43">Le dieu se déclare convaincu.</text>
</g>
</svg>
