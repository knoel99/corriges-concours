<svg xmlns="http://www.w3.org/2000/svg" width="730" height="340" viewBox="0 0 730 340" role="img"><title>Une réduction de la quantité échangée entraîne une perte sèche</title><desc>Demande décroissante, coût marginal constant. Le triangle coloré correspond au surplus perdu sur les unités qui ne sont plus échangées.</desc>
<rect x="0" y="0" width="730" height="340" fill="white"/>
<text x="18" y="25" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#20333e">Une réduction de la quantité échangée entraîne une perte sèche</text>
<text x="52" y="55" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">Prix ou coût</text>
<path d="M 80 67 V 250 H 625" stroke="#566872" stroke-width="2" fill="none"/>
<path d="M 90 71 L 555 237" stroke="#176674" stroke-width="3" fill="none"/>
<path d="M 80 181 H 605" stroke="#715176" stroke-width="3" fill="none"/>
<path d="M 270 135 L 270 181 L 398 181 Z" stroke="#ad5840" stroke-width="1" fill="#ebc3ac"/>
<path d="M 80 135 H 270 V 250" stroke="#6d797e" stroke-width="1" fill="none"/>
<path d="M 398 181 V 250" stroke="#6d797e" stroke-width="1" fill="none"/>
<text x="485" y="200" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#176674">Demande</text>
<text x="488" y="171" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#715176">Coût marginal</text>
<text x="101" y="125" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">Prix relevé</text>
<text x="15" y="278" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">Quantité réduite</text>
<path d="M 142 272 H 267 V 251" stroke="#64757c" stroke-width="1" fill="none"/>
<text x="370" y="279" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">Quantité concurrentielle</text>
<text x="575" y="272" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">Quantité</text>
<rect x="20" y="301" width="16" height="13" fill="#ebc3ac"/>
<text x="45" y="313" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">Valeur des échanges possibles qui disparaissent</text>
</svg>
