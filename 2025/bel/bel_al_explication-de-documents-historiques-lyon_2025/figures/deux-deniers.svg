<svg xmlns="http://www.w3.org/2000/svg" width="780" height="174" viewBox="0 0 780 174" role="img"><title>Lire les deux deniers de Toul, face par face</title><rect width="780" height="174" fill="white"/><rect x="8" y="12" width="249" height="148" rx="6" fill="#eef4f7" stroke="#2a586a"/><text x="132.5" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2a586a">Denier 2 A</text><text x="132.5" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#2a586a">Avers · Conrad diadémé</text><text x="132.5" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#2a586a">Revers · cité de Brunon</text><rect x="266" y="12" width="249" height="148" rx="6" fill="#edf5f1" stroke="#1f6d62"/><text x="390.5" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f6d62">Denier 2 B</text><text x="390.5" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1f6d62">Avers · Brunon et croix</text><text x="390.5" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#1f6d62">Revers · Toul et temple</text><rect x="524" y="12" width="249" height="148" rx="6" fill="#f7f2ea" stroke="#79532c"/><text x="648.5" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#79532c">Ce qui demeure</text><text x="648.5" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#79532c">La frappe à Toul</text><text x="648.5" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#79532c">reste liée au siège épiscopal</text></svg>