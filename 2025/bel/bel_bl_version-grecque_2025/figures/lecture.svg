<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment Zeus déplace-t-il le débat ?</title>
<desc id="description">Zeus généralise Même les dieux sont soumis à l’amour. Héra rappelle les actes de Zeus. Zeus propose une image Une nuée prendrait la forme d’Héra. Héra maudit les désirs d’Ixion. Zeus insiste Une nuée serait seule auprès d’Ixion. Le passage finit sur sa question.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment Zeus déplace-t-il le débat ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Réplique</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Argument ou geste</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Réaction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Zeus généralise</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Même les dieux sont soumis</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">à l’amour.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Héra rappelle les actes de</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Zeus.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Zeus propose une</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">image</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Une nuée prendrait la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">forme d’Héra.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Héra maudit les désirs</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">d’Ixion.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Zeus insiste</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Une nuée serait seule</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">auprès d’Ixion.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le passage finit sur sa</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">question.</text>
</g>
</svg>
