<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="titre description">
  <title id="titre">Qui peut demander de rectifier le registre ?</title>
  <desc id="description">La position hiérarchique du locuteur et la légitimité de la raison qu’il donne peuvent varier indépendamment.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="42" font-size="27" fill="#182f43" font-weight="bold" text-anchor="start">Qui peut demander de rectifier le registre ?</text>
  <rect x="24" y="70" width="852" height="90" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="44" y="104" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Le chef impose un faux.</text>
  <text x="44" y="137" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Il peut sanctionner un refus. Ce pouvoir ne justifie pas la falsification.</text>
  <rect x="24" y="180" width="852" height="90" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="44" y="214" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Le subordonné rappelle le tort causé.</text>
  <text x="44" y="247" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Il peut donner une raison de rectifier sans avoir de pouvoir de sanction.</text>
  <rect x="24" y="290" width="852" height="90" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="44" y="324" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">L’agent qui doit agir demande des raisons.</text>
  <text x="44" y="357" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Il reste capable de contester un ordre ou de reconnaître une obligation.</text>
  </g>
</svg>
