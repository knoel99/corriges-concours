<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="titre description">
  <title id="titre">Que veut dire « tu dois » ?</title>
  <desc id="description">Le même verbe peut exprimer une conjecture, la condition de réussite d’un projet ou une exigence pratique.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="42" font-size="27" fill="#182f43" font-weight="bold" text-anchor="start">Que veut dire « tu dois » ?</text>
  <rect x="24" y="70" width="852" height="90" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="44" y="104" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Tu dois déjà être arrivé.</text>
  <text x="44" y="137" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le voyage a commencé tôt. Le locuteur conjecture que tu es à destination.</text>
  <rect x="24" y="180" width="852" height="90" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="44" y="214" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Tu dois prendre le premier train pour être à l’heure.</text>
  <text x="44" y="247" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">La nécessité du moyen dépend du but que tu poursuis.</text>
  <rect x="24" y="290" width="852" height="90" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="44" y="324" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Tu dois rendre le dépôt.</text>
  <text x="44" y="357" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Changer de projet ne supprime pas la raison donnée par la promesse.</text>
  </g>
</svg>
