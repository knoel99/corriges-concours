<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="titre description">
  <title id="titre">Que reste-t-il à faire après un tort public ?</title>
  <desc id="description">L’agent doit préciser quel dommage réparer avant de déterminer la conduite qui répond à l’exigence.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="42" font-size="27" fill="#182f43" font-weight="bold" text-anchor="start">Que reste-t-il à faire après un tort public ?</text>
  <rect x="24" y="70" width="852" height="90" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="44" y="104" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Une faute attribuée en réunion à un absent</text>
  <text x="44" y="137" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Celui qui se sait responsable se rappelle en privé ce qu’il doit.</text>
  <rect x="24" y="180" width="852" height="90" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="44" y="214" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">S’excuser en tête-à-tête</text>
  <text x="44" y="247" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">L’absent peut apprendre la vérité. Les autres gardent leur fausse croyance.</text>
  <rect x="24" y="290" width="852" height="90" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="44" y="324" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Rectifier devant les participants</text>
  <text x="44" y="357" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">La réparation porte cette fois sur le public devant lequel le tort a été fait.</text>
  </g>
</svg>
