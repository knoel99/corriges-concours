<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Trois apparences construites par Caligula</title>
<desc id="description">Chef sévère Il dégrade des officiers. Il présente sa décision comme de la rigueur. Vainqueur des Bretons Un prince se rend avec quelques hommes. À Rome, la lettre suggère la reddition de toute l’île. Vainqueur des Germains Des hommes de sa propre garde sont cachés. Les arbres deviennent trophées et les proches sont couronnés.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois apparences construites par Caligula</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Rôle affiché</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Action réelle</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Mise en scène</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Chef sévère</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Il dégrade des officiers.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Il présente sa décision</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">comme de la rigueur.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Vainqueur des Bretons</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Un prince se rend avec</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">quelques hommes.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">À Rome, la lettre suggère</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">la reddition de toute</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">l’île.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Vainqueur des</text>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Germains</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Des hommes de sa propre</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">garde sont cachés.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Les arbres deviennent</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">trophées et les proches</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">sont couronnés.</text>
</g>
</svg>
