<svg xmlns="http://www.w3.org/2000/svg" width="880" height="296" viewBox="0 0 880 296" role="img"><title>Les destinataires et le retour de l’alibi</title><defs><marker id="end" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#496976"/></marker></defs><rect width="880" height="296" fill="white"/><rect x="16" y="17" width="312" height="72" rx="8" fill="#e4f0ee"/><text x="172.0" y="50.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Florence parle à Muriel</text><text x="172.0" y="79.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">du · deine</text><rect x="16" y="111" width="312" height="72" rx="8" fill="#e8edf5"/><text x="172.0" y="144.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Elle évoque les époux</text><text x="172.0" y="173.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">ihr · eure</text><rect x="16" y="205" width="312" height="72" rx="8" fill="#f4ecde"/><text x="172.0" y="238.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Elle cite une inconnue</text><text x="172.0" y="267.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Sie · politesse</text><rect x="539" y="64" width="311" height="74" rx="8" fill="#e8edf5"/><text x="694.5" y="98.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Muriel en public</text><text x="694.5" y="127.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">auf Dienstreise</text><rect x="539" y="184" width="311" height="74" rx="8" fill="#f4ecde"/><text x="694.5" y="218.0" text-anchor="middle" fill="#1