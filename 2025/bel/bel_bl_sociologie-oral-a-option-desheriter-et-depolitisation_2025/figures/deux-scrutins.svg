<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="t d">
<title id="t">Mêmes taux de participation, trajectoires différentes</title>
<desc id="d">Sur 100 inscrits, 60 votent à chaque scrutin dans les deux scénarios. Les votants à au moins un scrutin sont 60 dans le premier et 100 dans le second.</desc>
<rect width="920" height="340" fill="#fff"/>
<g font-family="DejaVu Sans,sans-serif" fill="#223744">
<text x="26" y="36" font-size="24" font-weight="700" fill="#223744">Qui a voté au cours des deux scrutins ?</text>
<text x="26" y="66" font-size="16" font-weight="400" fill="#223744">Exemple fictif. Même population de 100 inscrits aux deux dates.</text>
<rect x="25" y="87" width="16" height="16" fill="#285f70"/>
<text x="48" y="101" font-size="16" font-weight="400" fill="#223744">Deux votes</text>
<rect x="233" y="87" width="16" height="16" fill="#a05b37"/>
<text x="256" y="101" font-size="16" font-weight="400" fill="#223744">Premier seul</text>
<rect x="441" y="87" width="16" height="16" fill="#785681"/>
<text x="464" y="101" font-size="16" font-weight="400" fill="#223744">Second seul</text>
<rect x="649" y="87" width="16" height="16" fill="#59676b"/>
<text x="672" y="101" font-size="16" font-weight="400" fill="#223744">Aucun</text>
<text x="25" y="154" font-size="17" font-weight="700" fill="#223744">Scénario A</text>
<rect x="149" y="128" width="441.0" height="40" fill="#285f70"/>
<text x="161" y="155" font-size="18" font-weight="700" fill="#fff">60</text>
<rect x="590.0" y="128" width="294.0" height="40" fill="#59676b"/>
<text x="602.0" y="155" font-size="18" font-weight="700" fill="#fff">40</text>
<text x="25" y="229" font-size="17" font-weight="700" fill="#223744">Scénario B</text>
<rect x="149" y="203" width="147.0" height="40" fill="#285f70"/>
<text x="161" y="230" font-size="18" font-weight="700" fill="#fff">20</text>
<rect x="296.0" y="203" width="294.0" height="40" fill="#a05b37"/>
<text x="308.0" y="230" font-size="18" font-weight="700" fill="#fff">40</text>
<rect x="590.0" y="203" width="294.0" height="40" fill="#785681"/>
<text x="602.0" y="230" font-size="18" font-weight="700" fill="#fff">40</text>
<text x="25" y="282" font-size="18" font-weight="700" fill="#223744">À chaque scrutin, 60 votants sur 100 dans les deux scénarios.</text>
<text x="25" y="315" font-size="16" font-weight="400" fill="#223744">Au moins un vote sur les deux scrutins : 60 inscrits dans le scénario A et 100 dans le scénario B.</text>
</g></svg>
