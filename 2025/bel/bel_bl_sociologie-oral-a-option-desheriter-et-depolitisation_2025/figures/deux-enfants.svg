<svg xmlns="http://www.w3.org/2000/svg" width="920" height="236" viewBox="0 0 920 236" role="img" aria-labelledby="t d">
<title id="t">Comment répartir 300 000 euros avec deux enfants ?</title>
<desc id="d">Deux réserves de 100 000 euros et une part disponible de 100 000 euros forment un actif net de 300 000 euros.</desc>
<rect width="920" height="236" fill="#fff"/>
<g font-family="DejaVu Sans,sans-serif" fill="#223744">
<text x="26" y="38" font-size="24" font-weight="700" fill="#223744">Qui peut décider de la destination de chaque tiers ?</text>
<text x="26" y="71" font-size="16" font-weight="400" fill="#223744">Cas fictif. Parent veuf, deux enfants, 300 000 € nets, aucune donation antérieure.</text>
<rect x="26" y="99" width="284" height="48" fill="#296976"/>
<text x="43" y="130" font-size="21" font-weight="700" fill="#ffffff">100 000 €</text>
<text x="26" y="178" font-size="18" font-weight="700" fill="#223744">Réserve de l’aînée</text>
<rect x="314" y="99" width="284" height="48" fill="#345382"/>
<text x="331" y="130" font-size="21" font-weight="700" fill="#ffffff">100 000 €</text>
<text x="314" y="178" font-size="18" font-weight="700" fill="#223744">Réserve du cadet</text>
<rect x="602" y="99" width="284" height="48" fill="#9b5432"/>
<text x="619" y="130" font-size="21" font-weight="700" fill="#ffffff">100 000 €</text>
<text x="602" y="178" font-size="18" font-weight="700" fill="#223744">Part disponible</text>
<text x="26" y="216" font-size="15" font-weight="400" fill="#223744">La part disponible peut revenir à un enfant ou à un tiers. Exemple tiré des articles 912 et 913 du Code civil.</text>
</g></svg>
