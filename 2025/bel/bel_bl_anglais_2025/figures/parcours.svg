<svg xmlns="http://www.w3.org/2000/svg" width="720" height="407" viewBox="0 0 720 407" role="img" aria-labelledby="titre description">
<title id="titre">Par quel moyen une autorité se maintient-elle ?</title>
<desc id="description">Justifier Chamberlain distingue parenté et obligation. Roosevelt invoque le devoir. Qui peut consentir ? Se transformer Menzies sépare le rôle intérieur de la Couronne de son statut commun. Que change une république membre ? Rendre visible Porter suit le pouvoir commercial ; King les effets sur les populations. Qui garde les bénéfices ?</desc>
<rect width="720" height="407" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Par quel moyen une autorité se maintient-elle ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Appui dans le dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet ou difficulté</text>
<rect x="10" y="92" width="700" height="105" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Justifier</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Chamberlain distingue</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">parenté et obligation.</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">Roosevelt invoque le</text>
<text x="229" y="183" font-size="15" font-weight="400" fill="#162d3b">devoir.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Qui peut consentir ?</text>
<rect x="10" y="203" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">Se transformer</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">Menzies sépare le rôle</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">intérieur de la Couronne</text>
<text x="229" y="272" font-size="15" font-weight="400" fill="#162d3b">de son statut commun.</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">Que change une république</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">membre ?</text>
<rect x="10" y="292" width="700" height="105" rx="3" fill="#e7efed"/>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">Rendre visible</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">Porter suit le pouvoir</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">commercial ; King les</text>
<text x="229" y="361" font-size="15" font-weight="400" fill="#162d3b">effets sur les</text>
<text x="229" y="383" font-size="15" font-weight="400" fill="#162d3b">populations.</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">Qui garde les bénéfices ?</text>
</g>
</svg>
