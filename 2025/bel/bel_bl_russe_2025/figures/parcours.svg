<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Que prouve la tenue du sommet de Kazan ?</title>
<desc id="description">Présences constatées Des chefs de gouvernement et des invités rencontrent Poutine. L’isolement diplomatique est incomplet. Intérêts distincts La Chine et l’Inde ont leurs propres objectifs. Le reportage questionne la cohésion du groupe. Lecture de Baounov Élargissement et rivalité sino-indienne. Moscou peut y chercher une position de médiation.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que prouve la tenue du sommet de Kazan ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Appui dans le dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet ou difficulté</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Présences constatées</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Des chefs de gouvernement</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">et des invités rencontrent</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">Poutine.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’isolement diplomatique</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">est incomplet.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Intérêts distincts</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">La Chine et l’Inde ont</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">leurs propres objectifs.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Le reportage questionne la</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">cohésion du groupe.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Lecture de Baounov</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Élargissement et rivalité</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">sino-indienne.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Moscou peut y chercher une</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">position de médiation.</text>
</g>
</svg>
