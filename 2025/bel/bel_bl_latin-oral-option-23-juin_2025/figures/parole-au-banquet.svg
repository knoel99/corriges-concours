<svg xmlns="http://www.w3.org/2000/svg" width="800" height="272" viewBox="0 0 800 272" role="img" aria-labelledby="titre description">
<title id="titre">Pourquoi parle-t-on du maître ?</title><desc id="description">Les deux régimes de parole au banquet ont des effets opposés. En assumant le verbe faire au pluriel, Sénèque attribue aux maîtres la responsabilité de l’hostilité.</desc>
<defs><marker id="pointe" viewBox="0 0 9 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#425955"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="5" y="5" rx="7" width="384" height="109" fill="#f9f6ee" stroke="#8c7956" stroke-width="2"/><text x="197" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#392f1d">Lignes 1–9 · Silence imposé</text><text x="197" y="63" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">Debout et muets au banquet,</text><text x="197" y="92" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">ils parlent de lui (de domino).</text>
<rect x="411" y="5" rx="7" width="384" height="109" fill="#f9f6ee" stroke="#8c7956" stroke-width="2"/><text x="603" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#392f1d">Lignes 9–12 · Échange permis</text><text x="603" y="63" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">Ils parlent avec eux (cum ipsis),</text><text x="603" y="92" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">sous la torture ils se taisent.</text>
<path d="M197 117 L330 152" stroke="#425955" stroke-width="2.5" fill="none" marker-end="url(#pointe)"/>
<path d="M603 117 L470 152" stroke="#425955" stroke-width="2.5" fill="none" marker-end="url(#pointe)"/>
<rect x="100" y="156" rx="7" width="600" height="109" fill="#e2efed" stroke="#31736b" stroke-width="2"/><text x="400" y="185" text-anchor="middle" font-size="22" font-weight="bold" fill="#143e3a">Lignes 12–13 · Le proverbe mis à l’épreuve</text><text x="400" y="214" text-anchor="middle" font-size="22" font-weight="normal" fill="#143e3a">Le passage de habemus à facimus rend les maîtres</text><text x="400" y="243" text-anchor="middle" font-size="22" font-weight="normal" fill="#143e3a">responsables de l’hostilité qu’ils dénoncent.</text></g>
</svg>
