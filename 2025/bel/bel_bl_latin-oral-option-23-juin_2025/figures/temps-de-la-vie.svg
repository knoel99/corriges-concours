<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img" aria-labelledby="titre description">
<title id="titre">De la crainte des Enfers au temps vécu</title><desc id="description">Sénèque écarte la peur des récits infernaux puis envisage deux issues qui excluent un mal à éprouver. Il fait ensuite appliquer à Lucilius ses propres mots sur le temps écoulé.</desc>
<defs><marker id="pointe" viewBox="0 0 9 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#425955"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="104" y="3" rx="7" width="592" height="51" fill="#f9f6ee" stroke="#8c7956" stroke-width="2"/><text x="400" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#392f1d">Lignes 1–4 · Écarter la peur des Enfers</text>
<path d="M306 56 L200 86" stroke="#425955" stroke-width="2.5" fill="none" marker-end="url(#pointe)"/>
<path d="M494 56 L600 86" stroke="#425955" stroke-width="2.5" fill="none" marker-end="url(#pointe)"/>
<rect x="5" y="90" rx="7" width="385" height="109" fill="#f9f6ee" stroke="#8c7956" stroke-width="2"/><text x="197.5" y="119" text-anchor="middle" font-size="22" font-weight="bold" fill="#392f1d">Lignes 5–6 · Aut consumit</text><text x="197.5" y="148" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">Si la mort anéantit, il ne reste</text><text x="197.5" y="177" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">ni biens ni maux à éprouver.</text>
<rect x="410" y="90" rx="7" width="385" height="109" fill="#f9f6ee" stroke="#8c7956" stroke-width="2"/><text x="602.5" y="119" text-anchor="middle" font-size="22" font-weight="bold" fill="#392f1d">Lignes 5–6 · Aut exuit</text><text x="602.5" y="148" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">Si elle délivre du fardeau,</text><text x="602.5" y="177" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">il reste des choses meilleures.</text>
<path d="M200 201 L330 232" stroke="#425955" stroke-width="2.5" fill="none" marker-end="url(#pointe)"/>
<path d="M600 201 L470 232" stroke="#425955" stroke-width="2.5" fill="none" marker-end="url(#pointe)"/>
<rect x="42" y="236" rx="7" width="716" height="109" fill="#e2efed" stroke="#31736b" stroke-width="2"/><text x="400" y="265" text-anchor="middle" font-size="22" font-weight="bold" fill="#143e3a">Lignes 6–13 · À Lucilius de s’appliquer ses propres mots</text><text x="400" y="294" text-anchor="middle" font-size="22" font-weight="normal" fill="#143e3a">Le vers est le sien (l. 6–10). Chaque âge passé rend sensible</text><text x="400" y="323" text-anchor="middle" font-size="22" font-weight="normal" fill="#143e3a">la diminution quotidienne de la vie (l. 10–13).</text></g>
</svg>
