<svg xmlns="http://www.w3.org/2000/svg" width="800" height="256" viewBox="0 0 800 256" role="img" aria-labelledby="titre description">
<title id="titre">Qui fait le noble ?</title><desc id="description">Les exemples de philosophes fondent une parenté choisie selon la conduite. La généalogie mêlée des hommes conduit à chercher le critère de noblesse dans la disposition à la vertu.</desc>
<defs><marker id="pointe" viewBox="0 0 9 8" refX="8" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#425955"/></marker></defs>
<g font-family="DejaVu Sans, sans-serif">
<rect x="5" y="4" rx="7" width="364" height="109" fill="#f9f6ee" stroke="#8c7956" stroke-width="2"/><text x="187" y="33" text-anchor="middle" font-size="22" font-weight="bold" fill="#392f1d">Lignes 1–3 · Les exemples</text><text x="187" y="62" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">La philosophie brille pour tous.</text><text x="187" y="91" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">De Platon elle fait un noble.</text>
<rect x="429" y="4" rx="7" width="366" height="109" fill="#f9f6ee" stroke="#8c7956" stroke-width="2"/><text x="612" y="33" text-anchor="middle" font-size="22" font-weight="bold" fill="#392f1d">Lignes 3–5 · Lucilius</text><text x="612" y="62" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">Il peut avoir pour ancêtres</text><text x="612" y="91" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">ces sages s’il vit dignement.</text>
<path d="M372 60 L424 60" stroke="#425955" stroke-width="2.5" fill="none" marker-end="url(#pointe)"/>
<path d="M612 115 L612 138" stroke="#425955" stroke-width="2.5" fill="none" marker-end="url(#pointe)"/>
<rect x="429" y="143" rx="7" width="366" height="109" fill="#f9f6ee" stroke="#8c7956" stroke-width="2"/><text x="612" y="172" text-anchor="middle" font-size="22" font-weight="bold" fill="#392f1d">Lignes 5–8 · La généalogie</text><text x="612" y="201" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">Rois issus d’esclaves, esclaves</text><text x="612" y="230" text-anchor="middle" font-size="22" font-weight="normal" fill="#392f1d">issus de rois. La fortune agit.</text>
<rect x="5" y="143" rx="7" width="364" height="109" fill="#e2efed" stroke="#31736b" stroke-width="2"/><text x="187" y="172" text-anchor="middle" font-size="22" font-weight="bold" fill="#143e3a">Lignes 8–12 · Le critère</text><text x="187" y="201" text-anchor="middle" font-size="22" font-weight="normal" fill="#143e3a">Est noble qui est bien disposé</text><text x="187" y="230" text-anchor="middle" font-size="22" font-weight="normal" fill="#143e3a">à la vertu. Que peut l’atrium ?</text>
<path d="M425 198 L373 198" stroke="#425955" stroke-width="2.5" fill="none" marker-end="url(#pointe)"/></g>
</svg>
