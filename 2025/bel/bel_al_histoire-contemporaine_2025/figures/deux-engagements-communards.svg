<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-labelledby="titre description"><title id="titre">La Commune de Paris, mars–mai 1871</title><desc id="description">Frankel est élu et siège à la Commune. Dmitrieff anime une association qui porte des revendications ouvrières.</desc><rect width="940" height="360" fill="#ffffff"/><g font-family="DejaVu Sans, sans-serif">
<text x="25" y="37" fill="#172f39" font-size="25" font-weight="bold">La Commune de Paris, mars–mai 1871</text>
<rect x="25" y="55" width="890" height="93" rx="8" fill="#e9f2f5"/>
<text x="41" y="82" fill="#172f39" font-size="21" font-weight="bold">Léo Frankel</text>
<text x="41" y="109" fill="#172f39" font-size="18" font-weight="normal">Ouvrier hongrois élu dans le XIIIᵉ arrondissement.</text>
<text x="41" y="133" fill="#172f39" font-size="18" font-weight="normal">La Commune valide son élection et lui confie le Travail et l’Échange.</text>
<rect x="25" y="160" width="890" height="93" rx="8" fill="#f4ece5"/>
<text x="41" y="187" fill="#172f39" font-size="21" font-weight="bold">Élisabeth Dmitrieff</text>
<text x="41" y="214" fill="#172f39" font-size="18" font-weight="normal">Militante russe, elle participe à la fondation de l’Union des femmes.</text>
<text x="41" y="238" fill="#172f39" font-size="18" font-weight="normal">L’Union défend les ouvrières et débat de l’organisation du travail.</text>
<path d="M50 257 v16 h20" fill="none" stroke="#386659" stroke-width="3"/>
<text x="40" y="308" fill="#215749" font-size="20" font-weight="bold">Deux traces de participation</text>
<text x="40" y="335" fill="#172f39" font-size="18" font-weight="normal">un mandat et des délibérations, des affiches et des revendications.</text>
</g></svg>
