<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="titre description">
<title id="titre">Où devient visible le rapport de pouvoir ?</title>
<desc id="description">Une parole en public Questions de Pasolini, rires et conditionnel de la jeune fille. Le genre détermine la permission de juger. Gestes et mémoire Delia reste au sol ; Modesta se rappelle les paroles de ses compagnes. L’image et la voix intérieure rendent la hiérarchie perceptible. Droit et usages Iotti défend une égalité concrète. Camilli interroge la fin juridique du patriarcat. Le principe et ses effets n’ont pas la même chronologie.</desc>
<rect width="720" height="385" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Où devient visible le rapport de pouvoir ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Appui dans le dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet ou difficulté</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Une parole en public</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Questions de Pasolini,</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">rires et conditionnel de</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">la jeune fille.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le genre détermine la</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">permission de juger.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Gestes et mémoire</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Delia reste au sol ;</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">Modesta se rappelle les</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">paroles de ses compagnes.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">L’image et la voix</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">intérieure rendent la</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">hiérarchie perceptible.</text>
<rect x="10" y="270" width="700" height="105" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Droit et usages</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Iotti défend une égalité</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">concrète. Camilli</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">interroge la fin juridique</text>
<text x="229" y="361" font-size="15" font-weight="400" fill="#162d3b">du patriarcat.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Le principe et ses effets</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">n’ont pas la même</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">chronologie.</text>
</g>
</svg>
