<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Les regards changent de place</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Les regards changent de place</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">La route</text>
<text x="205" y="62" font-size="15">Les voitures s’immobilisent. Les</text>
<text x="205" y="79" font-size="15">curieux peuvent enfin s’approcher.</text>
<text x="524" y="70" font-size="15">Un regard collectif</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">La vitre</text>
<text x="205" y="123" font-size="15">Les occupants regardent en retour. La</text>
<text x="205" y="140" font-size="15">veuve, elle, garde les yeux clos.</text>
<text x="524" y="131" font-size="15">Un regard interrompu</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">La foule</text>
<text x="205" y="184" font-size="15">La dame disparaît et reparaît, puis un</text>
<text x="205" y="201" font-size="15">jeune homme la rejoint.</text>
<text x="524" y="192" font-size="15">Un geste entrevu</text>
</g></svg>
