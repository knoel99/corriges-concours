<svg xmlns="http://www.w3.org/2000/svg" width="705" height="216" viewBox="0 0 705 216" role="img"><title>Célibat et souhait de couple</title><desc>Pour 100 femmes, 40 sont célibataires et environ 12 sont célibataires et voudraient être en couple. Pour 100 hommes, les valeurs sont 55 et environ 20.</desc>
<rect x="0" y="0" width="705" height="216" fill="white"/>
<text x="20" y="28" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#263b42" font-weight="700">Sur 100 jeunes adultes de chaque groupe</text>
<rect x="21" y="47" width="15" height="15" fill="#12646a"/>
<text x="43" y="60" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#263b42" font-weight="400">Célibataires souhaitant être en couple</text>
<rect x="365" y="47" width="15" height="15" fill="#97c3c1"/>
<text x="388" y="60" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#263b42" font-weight="400">Autres célibataires</text>
<text x="20" y="110" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#263b42" font-weight="400">Femmes</text>
<rect x="103" y="91" width="410" height="25" fill="#edf1ef"/>
<rect x="103" y="91" width="49.199999999999996" height="25" fill="#12646a"/>
<rect x="152.2" y="91" width="114.79999999999998" height="25" fill="#97c3c1"/>
<text x="526" y="110" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#263b42" font-weight="400">40 célibataires</text>
<text x="103" y="136" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#263b42" font-weight="400">≈ 12 sur 100 souhaitent être en couple (30 % des célibataires).</text>
<text x="20" y="174" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#263b42" font-weight="400">Hommes</text>
<rect x="103" y="155" width="410" height="25" fill="#edf1ef"/>
<rect x="103" y="155" width="81.17999999999999" height="25" fill="#12646a"/>
<rect x="184.18" y="155" width="144.32" height="25" fill="#97c3c1"/>
<text x="526" y="174" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#263b42" font-weight="400">55 célibataires</text>
<text x="103" y="200" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#263b42" font-weight="400">≈ 20 sur 100 souhaitent être en couple (36 % des célibataires).</text>
</svg>
