<svg xmlns="http://www.w3.org/2000/svg" width="685" height="188" viewBox="0 0 685 188" role="img"><title>De la connexion à la rencontre</title><desc>Seize utilisateurs sur cent n’ont pas échangé, trente et un ont échangé sans se rencontrer. Cinquante-trois ont fait une rencontre.</desc>
<rect x="0" y="0" width="685" height="188" fill="white"/>
<text x="20" y="28" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#263b42" font-weight="700">Sur 100 hommes utilisateurs de 18 à 21 ans</text>
<rect x="20.0" y="48" width="102.4" height="42" fill="#9b513e"/>
<text x="61.2" y="75" font-family="DejaVu Sans, sans-serif" font-size="16" fill="white" font-weight="700">16</text>
<rect x="122.4" y="48" width="198.4" height="42" fill="#d2a471"/>
<text x="211.60000000000002" y="75" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#24363b" font-weight="700">31</text>
<rect x="320.8" y="48" width="339.20000000000005" height="42" fill="#247478"/>
<text x="480.40000000000003" y="75" font-family="DejaVu Sans, sans-serif" font-size="16" fill="white" font-weight="700">53</text>
<rect x="20" y="114" width="15" height="15" fill="#9b513e"/>
<text x="41" y="128" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#263b42" font-weight="400">Aucun échange</text>
<rect x="205" y="114" width="15" height="15" fill="#d2a471"/>
<text x="226" y="128" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#263b42" font-weight="400">Échange sans rencontre</text>
<rect x="452" y="114" width="15" height="15" fill="#247478"/>
<text x="473" y="128" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#263b42" font-weight="400">Au moins une rencontre</text>
<text x="20" y="166" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#263b42" font-weight="400">Les deux premiers groupes réunissent 47 utilisateurs sans rencontre.</text>
</svg>
