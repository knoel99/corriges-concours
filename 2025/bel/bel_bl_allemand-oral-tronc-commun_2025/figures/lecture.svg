<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Drei Ebenen des politischen Urteils</title>
<desc id="description">Haushalt Die Grünen kritisieren Pläne aus dem Finanzministerium. Eine geplante Maßnahme hat geschätzte Kosten. Staatsangehörigkeit Der Innenminister und die Grünen begründen ihre Positionen. Welche Frist soll sich für wen ändern? Koalition Ein Kommentator bewertet die Verhandlungen. Welche Entscheidung wurde vertagt?</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Drei Ebenen des politischen Urteils</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Artikel</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Wer spricht?</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Was ist überprüfbar?</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Haushalt</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Die Grünen kritisieren</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Pläne aus dem</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">Finanzministerium.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Eine geplante Maßnahme hat</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">geschätzte Kosten.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Staatsangehörigkeit</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Der Innenminister und die</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">Grünen begründen ihre</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">Positionen.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Welche Frist soll sich für</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">wen ändern?</text>
<rect x="10" y="270" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Koalition</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Ein Kommentator bewertet</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">die Verhandlungen.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Welche Entscheidung wurde</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">vertagt?</text>
</g>
</svg>
