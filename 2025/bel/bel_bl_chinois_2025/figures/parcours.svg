<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Comment les deux articles passent-ils du chiffre à une conclusion ?</title>
<desc id="description">Production nationale 134,9 mille milliards de yuans de PIB en 2024. Le seuil de 130 donne au chiffre une place dans une série. Échanges Achats chinois et emplois américains liés aux exportations. Le public américain entre dans le calcul des avantages. Portée Écarts de développement et canaux de dialogue. Les résultats mesurés ne garantissent pas l’issue politique.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment les deux articles passent-ils du chiffre à une conclusion ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Appui dans le dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet ou difficulté</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Production nationale</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">134,9 mille milliards de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">yuans de PIB en 2024.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le seuil de 130 donne au</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">chiffre une place dans une</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">série.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Échanges</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Achats chinois et emplois</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">américains liés aux</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">exportations.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Le public américain entre</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">dans le calcul des</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">avantages.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Portée</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Écarts de développement et</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">canaux de dialogue.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Les résultats mesurés ne</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">garantissent pas l’issue</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">politique.</text>
</g>
</svg>
