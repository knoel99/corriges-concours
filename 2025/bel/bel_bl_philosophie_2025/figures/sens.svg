<svg xmlns="http://www.w3.org/2000/svg" width="950" height="285" viewBox="0 0 950 285" role="img" aria-labelledby="titre desc"><title id="titre">Trois moments pour analyser le verbe « aimer »</title><desc id="desc">Être affecté Une rencontre ou une qualité compte pour moi. S’engager L’attention et les actes peuvent se transformer. Rencontrer une réponse L’autre demeure libre de prendre part à la relation.</desc><rect width="950" height="285" fill="#f7f4ed"/><g fill="#23362f" font-family="DejaVu Sans,sans-serif"><text x="23" y="37" font-size="24" font-weight="bold">Trois moments pour analyser le verbe « aimer »</text><rect x="24" y="58" width="900" height="56" rx="8" fill="white" stroke="#859c8b"/><rect x="24" y="58" width="276" height="56" rx="8" fill="#365e50"/><text x="38" y="93" font-size="17" font-weight="bold" fill="white">Être affecté</text><text x="316" y="93" font-size="17">Une rencontre ou une qualité compte pour moi.</text><path d="M159 114 v12 m-5 -4 l5 6 l5 -6" fill="none" stroke="#365e50" stroke-width="2.5"/><rect x="24" y="130" width="900" height="56" rx="8" fill="white" stroke="#859c8b"/><rect x="24" y="130" width="276" height="56" rx="8" fill="#365e50"/><text x="38" y="165" font-size="17" font-weight="bold" fill="white">S’engager</text><text x="316" y="165" font-size="17">L’attention et les actes peuvent se transformer.</text><path d="M159 186 v12 m-5 -4 l5 6 l5 -6" fill="none" stroke="#365e50" stroke-width="2.5"/><rect x="24" y="202" width="900" height="56" rx="8" fill="white" stroke="#859c8b"/><rect x="24" y="202" width="276" height="56" rx="8" fill="#365e50"/><text x="38" y="237" font-size="17" font-weight="bold" fill="white">Rencontrer une réponse</text><text x="316" y="237" font-size="17">L’autre demeure libre de prendre part à la relation.</text></g></svg>
