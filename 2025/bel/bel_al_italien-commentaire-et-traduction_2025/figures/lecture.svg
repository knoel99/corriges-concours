<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Trois voix autour du malade</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Trois voix autour du malade</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">Les paysans</text>
<text x="205" y="62" font-size="15">Ils auraient voulu qu’on laisse venir le</text>
<text x="205" y="79" font-size="15">médecin au plus vite.</text>
<text x="524" y="70" font-size="15">Certitude du salut</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">Le médecin</text>
<text x="205" y="123" font-size="15">Il se souvient des moyens chirurgicaux</text>
<text x="205" y="140" font-size="15">et du transport qui manquaient.</text>
<text x="524" y="131" font-size="15">Réserve clinique</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">Le mémorialiste</text>
<text x="205" y="184" font-size="15">Il observe les visages quand le village</text>
<text x="205" y="201" font-size="15">a retrouvé le calme.</text>
<text x="524" y="192" font-size="15">Colère persistante</text>
</g></svg>
