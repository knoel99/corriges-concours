<svg xmlns="http://www.w3.org/2000/svg" width="712" height="198" viewBox="0 0 712 198" role="img" aria-labelledby="t d"><title id="t">Trois mécanismes de ressemblance des goûts</title><desc id="d">Exemples hypothétiques. Une recommandation peut précéder la découverte du titre, un goût antérieur peut précéder une amitié, et une exposition commune peut toucher les deux personnes.</desc>
<rect x="0" y="0" width="712" height="198" fill="white" rx="4"/>
<text x="12" y="37" font-family="DejaVu Sans,sans-serif" fill="#1d3443" font-size="16" font-weight="bold">Influence</text>
<rect x="181" y="9" width="237" height="43" fill="#e9f3f0" rx="4"/>
<text x="191" y="36" font-family="DejaVu Sans,sans-serif" fill="#1d3443" font-size="16" font-weight="normal">A écoute et recommande</text>
<path d="M425 30 h37 m-7 -5 7 5 -7 5" stroke="#3e676c" stroke-width="2.2" fill="none"/>
<rect x="468" y="9" width="230" height="43" fill="#eef1f6" rx="4"/>
<text x="478" y="36" font-family="DejaVu Sans,sans-serif" fill="#1d3443" font-size="16" font-weight="normal">B découvre le titre</text>
<text x="12" y="100" font-family="DejaVu Sans,sans-serif" fill="#1d3443" font-size="16" font-weight="bold">Homophilie</text>
<rect x="181" y="72" width="237" height="43" fill="#e9f3f0" rx="4"/>
<text x="191" y="99" font-family="DejaVu Sans,sans-serif" fill="#1d3443" font-size="16" font-weight="normal">A et B aiment déjà le titre</text>
<path d="M425 93 h37 m-7 -5 7 5 -7 5" stroke="#3e676c" stroke-width="2.2" fill="none"/>
<rect x="468" y="72" width="230" height="43" fill="#eef1f6" rx="4"/>
<text x="478" y="99" font-family="DejaVu Sans,sans-serif" fill="#1d3443" font-size="16" font-weight="normal">A et B deviennent amis</text>
<text x="12" y="163" font-family="DejaVu Sans,sans-serif" fill="#1d3443" font-size="16" font-weight="bold">Contexte commun</text>
<rect x="181" y="135" width="237" height="43" fill="#e9f3f0" rx="4"/>
<text x="191" y="162" font-family="DejaVu Sans,sans-serif" fill="#1d3443" font-size="16" font-weight="normal">Même programmation locale</text>
<path d="M425 156 h37 m-7 -5 7 5 -7 5" stroke="#3e676c" stroke-width="2.2" fill="none"/>
<rect x="468" y="135" width="230" height="43" fill="#eef1f6" rx="4"/>
<text x="478" y="162" font-family="DejaVu Sans,sans-serif" fill="#1d3443" font-size="16" font-weight="normal">A et B entendent le titre</text>
</svg>
