<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="titre description">
  <title id="titre">La cinquième lettre</title>
  <desc id="description">Un même geste sert à prendre congé et à solliciter de nouveau l’attention de l’officier.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="41" font-size="28" fill="#182f43" font-weight="bold" text-anchor="start">Comment Mariane écrit-elle une dernière lettre ?</text>
  <rect x="24" y="67" width="417" height="136" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="42" y="102" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Le geste annoncé</text>
  <text x="42" y="140" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Renvoyer le portrait et les bracelets.</text><text x="42" y="167" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Confier le paquet à Dona Brites.</text>
  <rect x="460" y="67" width="416" height="136" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="478" y="102" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Le geste accompli</text>
  <text x="478" y="140" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Écrire encore à l’officier pour lui</text><text x="478" y="167" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">faire connaître le prix de ce retour.</text>
  <path d="M 232 206 V 235 H 348 V 255" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 667 206 V 235 H 580 V 255" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="58" y="264" width="784" height="97" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="82" y="301" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Ce que le lecteur éprouve</text>
  <text x="82" y="335" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">L’absent reste le destinataire de la rupture que Mariane lui annonce.</text>
  </g>
</svg>
