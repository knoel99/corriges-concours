<svg xmlns="http://www.w3.org/2000/svg" width="950" height="285" viewBox="0 0 950 285" role="img" aria-labelledby="titre desc"><title id="titre">À quel niveau les ruines font-elles preuve ?</title><desc id="desc">Le promeneur voit Les deux cabanes ruinées appellent une question. Le vieillard raconte Le récit relie les lieux au sort de deux familles. Le lecteur construit Les ruines et le témoin lui sont donnés par le même roman.</desc><rect width="950" height="285" fill="#f7f4ed"/><g fill="#23362f" font-family="DejaVu Sans,sans-serif"><text x="23" y="37" font-size="24" font-weight="bold">À quel niveau les ruines font-elles preuve ?</text><rect x="24" y="58" width="900" height="56" rx="8" fill="white" stroke="#859c8b"/><rect x="24" y="58" width="250" height="56" rx="8" fill="#365e50"/><text x="38" y="93" font-size="17" font-weight="bold" fill="white">Le promeneur voit</text><text x="290" y="93" font-size="17">Les deux cabanes ruinées appellent une question.</text><path d="M146 114 v12 m-5 -4 l5 6 l5 -6" fill="none" stroke="#365e50" stroke-width="2.5"/><rect x="24" y="130" width="900" height="56" rx="8" fill="white" stroke="#859c8b"/><rect x="24" y="130" width="250" height="56" rx="8" fill="#365e50"/><text x="38" y="165" font-size="17" font-weight="bold" fill="white">Le vieillard raconte</text><text x="290" y="165" font-size="17">Le récit relie les lieux au sort de deux familles.</text><path d="M146 186 v12 m-5 -4 l5 6 l5 -6" fill="none" stroke="#365e50" stroke-width="2.5"/><rect x="24" y="202" width="900" height="56" rx="8" fill="white" stroke="#859c8b"/><rect x="24" y="202" width="250" height="56" rx="8" fill="#365e50"/><text x="38" y="237" font-size="17" font-weight="bold" fill="white">Le lecteur construit</text><text x="290" y="237" font-size="17">Les ruines et le témoin lui sont donnés par le même roman.</text></g></svg>
