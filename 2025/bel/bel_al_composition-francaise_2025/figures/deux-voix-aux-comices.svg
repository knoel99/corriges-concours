<svg xmlns="http://www.w3.org/2000/svg" width="900" height="397" viewBox="0 0 900 397" role="img" aria-labelledby="titre description">
  <title id="titre">Deux voix aux comices</title>
  <desc id="description">La succession des paroles dans le roman construit une ironie dont la perception revient au lecteur.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="397" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="42" font-size="29" fill="#182f43" font-weight="bold" text-anchor="start">Qu’entend le lecteur pendant les comices ?</text>
  <rect x="24" y="69" width="416" height="133" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="42" y="104" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">À l’étage de la mairie</text>
  <text x="42" y="142" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Rodolphe parle à Emma de ce qui</text><text x="42" y="169" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">les attire l’un vers l’autre.</text>
  <rect x="460" y="69" width="416" height="133" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="478" y="104" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">À la tribune</text>
  <text x="478" y="142" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Les récompenses du concours</text><text x="478" y="169" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">agricole sont énumérées.</text>
  <path d="M 232 207 V 228 H 365 V 249" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 668 207 V 228 H 551 V 249" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="41" y="257" width="818" height="118" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="60" y="294" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Le montage des deux discours</text>
  <text x="60" y="331" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">L’alternance des répliques donne à entendre les formules de la séduction</text><text x="60" y="358" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">au rythme d’une distribution de prix.</text>
  </g>
</svg>
