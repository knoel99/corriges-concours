<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Qui reconnaît qui à Scyros ?</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Qui reconnaît qui à Scyros ?</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">350–362 · Thétis</text>
<text x="205" y="62" font-size="15">La mère présente son fils sous les</text>
<text x="205" y="79" font-size="15">traits d’une sœur d’Achille.</text>
<text x="524" y="70" font-size="15">Le secret</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="123" font-size="15">363–371 · Le roi et les</text>
<text x="19" y="140" font-size="15">filles</text>
<text x="205" y="123" font-size="15">Le roi accepte. Les jeunes filles</text>
<text x="205" y="140" font-size="15">détaillent une silhouette frappante.</text>
<text x="524" y="131" font-size="15">La rencontre</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">372–378 · Les oiseaux</text>
<text x="205" y="176" font-size="15">L’étonnement demeure un instant,</text>
<text x="205" y="193" font-size="15">puis le cercle se referme autour de</text>
<text x="205" y="210" font-size="15">l’étrangère.</text>
<text x="524" y="192" font-size="15">L’accueil</text>
</g></svg>
