<svg xmlns="http://www.w3.org/2000/svg" width="840" height="127" viewBox="0 0 840 127" role="img"><title>La panne modifie le sens de la cabine. À la voix des voisins succèdent la question de l’enfant et le souvenir de la protection du père.</title><rect width="840" height="127" fill="white"/><rect x="5" y="6" width="260" height="115" rx="8" fill="#e4efec"/><text x="135" y="33" text-anchor="middle" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="600" fill="#344849">Głos sąsiadów</text><text x="135" y="70" text-anchor="middle" font-size="21" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#153d44">Superman?</text><text x="135" y="103" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="400" fill="#2c434a">kpina po awarii</text><path d="M267 64h17m-6-6 7 6-7 6" fill="none" stroke="#486a68" stroke-width="2"/><rect x="288" y="6" width="260" height="115" rx="8" fill="#e9edf2"/><text x="418" y="33" text-anchor="middle" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="600" fill="#344849">Głos dziecka</text><text x="418" y="70" text-anchor="middle" font-size="21" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#153d44">Tatusiu…</text><text x="418" y="103" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="400" fill="#2c434a">pamięć dłoni i zarostu</text><path d="M550 64h17m-6-6 7 6-7 6" fill="none" stroke="#486a68" stroke-width="2"/><rect x="571" y="6" width="260" height="115" rx="8" fill="#f3eddf"/><text x="701" y="33" text-anchor="middle" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="600" fill="#344849">Ostatnie pytanie</text><text x="701" y="70" text-anchor="middle" font-size="21" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#153d44">jeśli taty zabraknie?</text><text x="701" y="103" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="400" fill="#2c434a">powrót do samotności</text></svg>
