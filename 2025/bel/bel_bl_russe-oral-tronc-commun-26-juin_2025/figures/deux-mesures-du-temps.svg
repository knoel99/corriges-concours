<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 225" width="840" height="225" role="img" aria-label="Repères dans la narration de la mort de Praskoukhine"><rect width="840" height="225" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#263945"><text x="16" y="28" font-size="19" font-weight="bold">Deux secondes avant le choc</text><path d="M 42 60 H 790" stroke="#697e86" stroke-width="3"/><g fill="#16706c"><circle cx="55" cy="60" r="7"/><circle cx="335" cy="60" r="7"/><circle cx="610" cy="60" r="7"/></g><g font-size="17" font-weight="bold"><text x="16" y="95">Première seconde</text><text x="303" y="95">Seconde suivante</text><text x="579" y="95">Après le choc</text></g><g font-size="15"><text x="16" y="122">«показавшаяся часом»</text><text x="16" y="146">Le délai semble durer une heure.</text><text x="16" y="170">Il regarde son camarade.</text><text x="303" y="122">«целый мир»</text><text x="303" y="146">Hypothèses et souvenirs</text><text x="303" y="170">se superposent à la peur.</text><text x="579" y="122">«я только контужен»</text><text x="579" y="146">Il croit pouvoir être secouru.</text><text x="579" y="170">Le narrateur rétablit les faits.</text></g><text x="16" y="210" font-size="14" fill="#4a5e68">La durée des perceptions après le choc est laissée indéterminée.</text></g></svg>