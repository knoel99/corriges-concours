<svg xmlns="http://www.w3.org/2000/svg" width="775" height="242" viewBox="0 0 775 242" role="img"><title>Sortir de guerre à des dates différentes en Europe</title><desc>Nov. 1918 Armistice à l’Ouest. Juin 1919 Traité de Versailles. Mars 1921 Paix de Riga. Juil. 1923 Traité de Lausanne</desc><rect width="775" height="242" fill="white"/>
<text x="17" y="24" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#223642" font-weight="700">Sortir de guerre à des dates différentes en Europe</text>
<rect x="12" y="39" width="748" height="44" fill="#e8efed"/>
<text x="22" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">Nov. 1918</text>
<text x="157" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Armistice à l’Ouest</text>
<text x="157" y="76" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Le conflit franco-allemand cesse sur le front occidental.</text>
<rect x="12" y="88" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">Juin 1919</text>
<text x="157" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Traité de Versailles</text>
<text x="157" y="125" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Le traité définit les conditions de paix avec l’Allemagne.</text>
<rect x="12" y="137" width="748" height="44" fill="#e8efed"/>
<text x="22" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">Mars 1921</text>
<text x="157" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Paix de Riga</text>
<text x="157" y="174" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Le règlement redessine la frontière orientale de la Pologne.</text>
<rect x="12" y="186" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">Juil. 1923</text>
<text x="157" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Traité de Lausanne</text>
<text x="157" y="223" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">La souveraineté de la Turquie reçoit une reconnaissance internationale.</text>
</svg>
