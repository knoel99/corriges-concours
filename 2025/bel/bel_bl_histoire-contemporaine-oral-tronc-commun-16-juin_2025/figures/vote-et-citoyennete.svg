<svg xmlns="http://www.w3.org/2000/svg" width="775" height="242" viewBox="0 0 775 242" role="img"><title>Quatre transformations du vote en France</title><desc>1913 Secret du vote. 1944–1945 Électorat. 1962–1965 Présidence. 1974 Majorité</desc><rect width="775" height="242" fill="white"/>
<text x="17" y="24" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#223642" font-weight="700">Quatre transformations du vote en France</text>
<rect x="12" y="39" width="748" height="44" fill="#e8efed"/>
<text x="22" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1913</text>
<text x="157" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Secret du vote</text>
<text x="157" y="76" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">L’isoloir et l’enveloppe protègent le choix individuel.</text>
<rect x="12" y="88" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1944–1945</text>
<text x="157" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Électorat</text>
<text x="157" y="125" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Les femmes obtiennent les droits politiques et votent en 1945.</text>
<rect x="12" y="137" width="748" height="44" fill="#e8efed"/>
<text x="22" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1962–1965</text>
<text x="157" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Présidence</text>
<text x="157" y="174" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">La réforme prévoit le suffrage universel direct, appliqué en 1965.</text>
<rect x="12" y="186" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1974</text>
<text x="157" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Majorité</text>
<text x="157" y="223" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Le droit de vote est étendu aux jeunes de 18 à 20 ans.</text>
</svg>
