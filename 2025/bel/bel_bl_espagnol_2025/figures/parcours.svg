<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="titre description">
<title id="titre">Quel pouvoir chaque document revendique-t-il ?</title>
<desc id="description">Adresse au roi Maspons invoque les provinces et les droits lésés. Changer le centre pour consolider la patrie espagnole. Essai et programme Prat distingue nation et État. Les Irmandades répartissent les compétences. Une affirmation culturelle appelle des institutions différentes. Manifeste du PNV Restaurer les pouvoirs des assemblées sur deux territoires étatiques. La prétention va au-delà du cadre administratif espagnol.</desc>
<rect width="720" height="385" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quel pouvoir chaque document revendique-t-il ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Appui dans le dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet ou difficulté</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Adresse au roi</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Maspons invoque les</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">provinces et les droits</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">lésés.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Changer le centre pour</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">consolider la patrie</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">espagnole.</text>
<rect x="10" y="181" width="700" height="105" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Essai et programme</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Prat distingue nation et</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">État. Les Irmandades</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">répartissent les</text>
<text x="229" y="272" font-size="15" font-weight="400" fill="#162d3b">compétences.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Une affirmation culturelle</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">appelle des institutions</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">différentes.</text>
<rect x="10" y="292" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">Manifeste du PNV</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">Restaurer les pouvoirs des</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">assemblées sur deux</text>
<text x="229" y="361" font-size="15" font-weight="400" fill="#162d3b">territoires étatiques.</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">La prétention va au-delà du</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">cadre administratif</text>
<text x="473" y="361" font-size="15" font-weight="400" fill="#162d3b">espagnol.</text>
</g>
</svg>
