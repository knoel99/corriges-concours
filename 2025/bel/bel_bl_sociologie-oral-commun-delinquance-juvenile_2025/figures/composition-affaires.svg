<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img"><title>Part de chaque rubrique au sein du groupe d’âge (%)</title><desc>Parmi les moins de 25 ans puis les 25 ans ou plus, les parts respectives sont de 25 et 12 % pour les vols et recels, 17 et 5 % pour les stupéfiants, 15 et 25 % pour la circulation et les transports.</desc>
<rect x="0" y="0" width="720" height="260" fill="white"/>
<text x="16" y="25" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#273941">Part de chaque rubrique au sein du groupe d’âge (%)</text>
<rect x="16" y="43" width="14" height="14" fill="#176674"/>
<text x="38" y="55" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#273941">Moins de 25 ans</text>
<rect x="345" y="43" width="14" height="14" fill="#a95437"/>
<text x="367" y="55" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#273941">25 ans ou plus</text>
<text x="16" y="93" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#273941">Vols et recels</text>
<rect x="216" y="75" width="387.5" height="12" fill="#176674"/>
<text x="609.5" y="86" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#273941">25</text>
<rect x="216" y="91" width="186.0" height="12" fill="#a95437"/>
<text x="408.0" y="102" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#273941">12</text>
<text x="16" y="146" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#273941">Stupéfiants</text>
<rect x="216" y="128" width="263.5" height="12" fill="#176674"/>
<text x="485.5" y="139" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#273941">17</text>
<rect x="216" y="144" width="77.5" height="12" fill="#a95437"/>
<text x="299.5" y="155" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#273941">5</text>
<text x="16" y="199" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#273941">Circulation et transports</text>
<rect x="216" y="181" width="232.5" height="12" fill="#176674"/>
<text x="454.5" y="192" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#273941">15</text>
<rect x="216" y="197" width="387.5" height="12" fill="#a95437"/>
<text x="609.5" y="208" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#273941">25</text>
<rect x="216" y="225" width="465.0" height="1" fill="#5f6e73"/>
<text x="214" y="244" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#273941">0</text>
<text x="671.0" y="244" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#273941">30 %</text>
</svg>
