<svg xmlns="http://www.w3.org/2000/svg" width="880" height="197" viewBox="0 0 880 197" role="img"><title>Une assertion vraie et son effet dans un échange</title><defs><marker id="end" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#496976"/></marker></defs><rect width="880" height="197" fill="white"/><text x="145" y="30" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700">Les portes sont fermées.</text><text x="440" y="30" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700">Le train est-il parti ?</text><text x="729" y="30" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700">Que croit le voyageur ?</text><rect x="12" y="48" width="264" height="80" rx="8" fill="#e4f0ee"/><text x="144.0" y="85.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Un fait exact</text><text x="144.0" y="114.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">les portes sont fermées</text><rect x="308" y="48" width="265" height="80" rx="8" fill="#f4ecde"/><text x="440.5" y="85.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Une question précise</text><text x="440.5" y="114.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">le départ a-t-il eu lieu ?</text><rect x="601" y="48" width="265" height="80" rx="8" fill="#e8edf5"/><text x="733.5" y="85.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Une conclusion fausse</text><text x="733.5" y="114.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">le train est parti</text><path d="M277 88 L302 88" stroke="#496976" stroke-width="2.5" fill="none" marker-end="url(#end)"/><path d="M574 88 L596 88" stroke="#496976" stroke-width="2.5" fill="none" marker-end="url(#end)"/><text x="440" y="174" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400">Une réponse peut induire en erreur tout en s’appuyant sur un fait exact.</text></svg>
