<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Qui parle des pouvoirs de l’art ?</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Qui parle des pouvoirs de l’art ?</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">Le fils</text>
<text x="205" y="62" font-size="15">Il se souvient du métier que son père</text>
<text x="205" y="79" font-size="15">lui destinait.</text>
<text x="524" y="70" font-size="15">Voleva che diventassi</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">Les jeunes artistes</text>
<text x="205" y="131" font-size="15">Le groupe croit enfin venue son heure.</text>
<text x="524" y="131" font-size="15">Fosse giunto</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">Le narrateur</text>
<text x="205" y="184" font-size="15">À distance, il avoue ce qu’il feignait de</text>
<text x="205" y="201" font-size="15">croire.</text>
<text x="524" y="192" font-size="15">Fingevo di crederci</text>
</g></svg>
