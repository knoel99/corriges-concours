<svg xmlns="http://www.w3.org/2000/svg" width="730" height="230" viewBox="0 0 730 230" role="img"><title>Sur 100 contrats de niveau bac + 2 commencés en 2021</title><desc>75,9 contrats sur 100 sans rupture à neuf mois, 9,4 rompus puis suivis d’un autre contrat et 14,7 rompus sans nouveau contrat dans les six mois.</desc>
<rect x="0" y="0" width="730" height="230" fill="white"/>
<text x="18" y="26" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#20333e">Sur 100 contrats de niveau bac + 2 commencés en 2021</text>
<rect x="25.0" y="64" width="500.94" height="35" fill="#74888c"/>
<text x="259.47" y="87" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="white">75,9</text>
<rect x="20" y="116" width="15" height="15" fill="#74888c"/>
<text x="44" y="128" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#20333e">Sans rupture à neuf mois</text>
<rect x="525.94" y="64" width="62.04" height="35" fill="#d7a56c"/>
<text x="540.96" y="87" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#23333d">9,4</text>
<rect x="20" y="140" width="15" height="15" fill="#d7a56c"/>
<text x="44" y="152" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#20333e">Rupture et nouveau contrat</text>
<rect x="587.98" y="64" width="97.02" height="35" fill="#176674"/>
<text x="620.49" y="87" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="white">14,7</text>
<rect x="20" y="164" width="15" height="15" fill="#176674"/>
<text x="44" y="176" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#20333e">Rupture sans nouveau contrat</text>
<text x="20" y="210" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">Le délai de suivi est de six mois à partir de la rupture.</text>
</svg>
