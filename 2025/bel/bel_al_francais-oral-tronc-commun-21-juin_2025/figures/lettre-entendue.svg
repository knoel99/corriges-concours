<svg xmlns="http://www.w3.org/2000/svg" width="640" height="174" viewBox="0 0 640 174" role="img" aria-labelledby="title desc"><title id="title">Dans L’École des femmes, la même lettre prend trois sens selon la place de celui qui parle ou écoute.</title><desc id="desc">Dans L’École des femmes, la même lettre prend trois sens selon la place de celui qui parle ou écoute.</desc><defs><marker id="p" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#37596a"/></marker></defs><rect width="640" height="174" rx="9" fill="#faf9f7"/><g font-family="DejaVu Sans, sans-serif" fill="#1c303b">
<rect x="13" y="30" width="168" height="91" rx="6" fill="#e9f1ed" stroke="#849698"/>
<text x="97" y="59" text-anchor="middle" font-size="18" font-weight="700">Agnès</text>
<text x="97" y="89" text-anchor="middle" font-size="12" font-weight="400">écrit ce qu’elle éprouve</text>
<rect x="236" y="30" width="168" height="91" rx="6" fill="#f4e7d8" stroke="#849698"/>
<text x="320" y="59" text-anchor="middle" font-size="18" font-weight="700">Horace</text>
<text x="320" y="89" text-anchor="middle" font-size="12" font-weight="400">partage la lettre</text>
<rect x="456" y="30" width="168" height="91" rx="6" fill="#e9f1ed" stroke="#849698"/>
<text x="540" y="59" text-anchor="middle" font-size="18" font-weight="700">Arnolphe</text>
<text x="540" y="89" text-anchor="middle" font-size="12" font-weight="400">doit cacher son trouble</text>
<path d="M184 78L228 78" stroke="#37596a" fill="none" stroke-width="2" marker-end="url(#p)"/>
<path d="M407 78L450 78" stroke="#37596a" fill="none" stroke-width="2" marker-end="url(#p)"/>
<text x="320" y="152" text-anchor="middle" font-size="15" font-weight="400">La salle sait qui est Arnolphe. Horace le croit son confident.</text>
</g></svg>
