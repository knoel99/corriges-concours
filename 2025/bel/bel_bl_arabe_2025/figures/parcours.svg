<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Qui peut dire ce qui est arrivé ?</title>
<desc id="description">Parole professionnelle Le responsable médical précise la population comptée. La responsabilité de l’hôpital est discutée. Voix des voyageurs Deux arrivants donnent au voyage des sens différents. Arriver ne règle pas la suite. Voix des familles Une photo et une question rassemblent les proches à Zarzis. Le silence institutionnel devient un enjeu public.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui peut dire ce qui est arrivé ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Appui dans le dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet ou difficulté</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Parole</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">professionnelle</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le responsable médical</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">précise la population</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">comptée.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La responsabilité de</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">l’hôpital est discutée.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Voix des voyageurs</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Deux arrivants donnent au</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">voyage des sens</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">différents.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Arriver ne règle pas la</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">suite.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Voix des familles</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Une photo et une question</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">rassemblent les proches à</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">Zarzis.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Le silence institutionnel</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">devient un enjeu public.</text>
</g>
</svg>
