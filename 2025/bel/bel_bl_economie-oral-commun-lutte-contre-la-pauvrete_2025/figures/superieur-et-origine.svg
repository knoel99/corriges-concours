<svg xmlns="http://www.w3.org/2000/svg" width="730" height="221" viewBox="0 0 730 221" role="img"><title>Enfants accédant au supérieur ou y obtenant un diplôme</title><desc>Accès au supérieur : 35 et 90 %. Obtention du diplôme : 30 et 80 %.</desc>
<rect x="0" y="0" width="730" height="221" fill="white"/>
<text x="18" y="25" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#20333e">Enfants accédant au supérieur ou y obtenant un diplôme</text>
<rect x="18" y="44" width="13" height="13" fill="#176674"/>
<text x="37" y="55" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#20333e">1 % de familles aux revenus les plus bas</text>
<rect x="360" y="44" width="13" height="13" fill="#ac5038"/>
<text x="379" y="55" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#20333e">1 % de familles aux revenus les plus hauts</text>
<text x="18" y="98" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#20333e">Accès au supérieur</text>
<rect x="218" y="82" width="148.75" height="14" fill="#176674"/>
<text x="372.75" y="94" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">35 %</text>
<rect x="218" y="100" width="382.5" height="14" fill="#ac5038"/>
<text x="606.5" y="112" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">90 %</text>
<text x="18" y="155" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#20333e">Diplôme obtenu</text>
<rect x="218" y="139" width="127.5" height="14" fill="#176674"/>
<text x="351.5" y="151" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">30 %</text>
<rect x="218" y="157" width="340.0" height="14" fill="#ac5038"/>
<text x="564.0" y="169" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#20333e">80 %</text>
<rect x="218" y="192" width="425.0" height="1" fill="#5c6b70"/>
<text x="215" y="210" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#20333e">0</text>
<text x="623.0" y="210" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#20333e">100 %</text>
</svg>
