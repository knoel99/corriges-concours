<svg xmlns="http://www.w3.org/2000/svg" width="880" height="257" viewBox="0 0 880 257" role="img"><title>Deux perspectives sur la même arrivée</title><defs><marker id="end" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#496976"/></marker></defs><rect width="880" height="257" fill="white"/><rect x="15" y="15" width="283" height="70" rx="8" fill="#e4f0ee"/><text x="156.5" y="47.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Dans la voiture</text><text x="156.5" y="76.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Arthur et les jumeaux</text><rect x="555" y="15" width="310" height="70" rx="8" fill="#f4ecde"/><text x="710.0" y="47.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">À la fenêtre</text><text x="710.0" y="76.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Martin compte les voitures</text><path d="M156 91 L335 133" stroke="#496976" stroke-width="2.5" fill="none" marker-end="url(#end)"/><path d="M711 91 L547 133" stroke="#496976" stroke-width="2.5" fill="none" marker-end="url(#end)"/><rect x="282" y="136" width="316" height="68" rx="8" fill="#e8edf5"/><text x="440.0" y="167.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Un seul signal</text><text x="440.0" y="196.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">l. 12 et l. 20</text><text x="440" y="240" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Le bref arrêt met fin aux deux heures d’attente de Martin.</text></svg>
