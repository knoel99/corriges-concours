<svg xmlns="http://www.w3.org/2000/svg" width="945" height="325" viewBox="0 0 945 325" role="img" aria-labelledby="t d"><title id="t">Taux de rappel à qualifications comparables</title><desc id="d">Pour cent dossiers fictifs par profil, les résultats sont 30, 25, 20 et 10 rappels avec les combinaisons A masculin, A féminin, B masculin et B féminin.</desc>
<rect x="0" y="0" width="945" height="325" fill="#ffffff"/>
<g font-family="DejaVu Sans,sans-serif">
<text x="22" y="37" font-size="24" font-weight="700" fill="#233949">Taux de rappel à qualifications comparables</text>
<text x="22" y="67" font-size="16" font-weight="400" fill="#233949">Exemple fictif. Chaque barre porte sur 100 candidatures. Même échelle pour les quatre profils.</text>
<text x="22" y="110" font-size="16" font-weight="400" fill="#233949">A, prénom masculin</text>
<rect x="218" y="90" width="460" height="26" fill="#edf0f1"/>
<rect x="218" y="90" width="394.2857142857143" height="26" fill="#246a70"/>
<text x="690" y="110" font-size="17" font-weight="700" fill="#233949">30 %</text>
<text x="22" y="154" font-size="16" font-weight="400" fill="#233949">A, prénom féminin</text>
<rect x="218" y="134" width="460" height="26" fill="#edf0f1"/>
<rect x="218" y="134" width="328.57142857142856" height="26" fill="#246a70"/>
<text x="690" y="154" font-size="17" font-weight="700" fill="#233949">25 %</text>
<text x="22" y="198" font-size="16" font-weight="400" fill="#233949">B, prénom masculin</text>
<rect x="218" y="178" width="460" height="26" fill="#edf0f1"/>
<rect x="218" y="178" width="262.85714285714283" height="26" fill="#8c512f"/>
<text x="690" y="198" font-size="17" font-weight="700" fill="#233949">20 %</text>
<text x="22" y="242" font-size="16" font-weight="400" fill="#233949">B, prénom féminin</text>
<rect x="218" y="222" width="460" height="26" fill="#edf0f1"/>
<rect x="218" y="222" width="131.42857142857142" height="26" fill="#8c512f"/>
<text x="690" y="242" font-size="17" font-weight="700" fill="#233949">10 %</text>
<text x="22" y="290" font-size="17" font-weight="700" fill="#233949">Écart féminin–masculin : −5 points parmi les profils A, −10 points parmi les profils B.</text>
<text x="22" y="315" font-size="15" font-weight="400" fill="#233949">A et B sont deux origines supposées à partir des noms dans cet exercice.</text>
</g></svg>
