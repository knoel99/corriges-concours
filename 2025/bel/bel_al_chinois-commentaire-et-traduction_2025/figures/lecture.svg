<svg xmlns="http://www.w3.org/2000/svg" width="896" height="158" viewBox="0 0 896 158" role="img"><title>Repères pour la lecture du passage</title><rect x="9" y="9" width="270" height="139" fill="#e0eee9" stroke="#93a5a4" stroke-width="1.5" rx="13"/><text x="144" y="42" fill="#23424a" font-size="21" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Ce soir-là</text><text x="144" y="77" fill="#23424a" font-size="17" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Une heure et demie</text><text x="144" y="103" fill="#23424a" font-size="17" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Elle guette le jeune homme</text><text x="144" y="132" fill="#485b61" font-size="16" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">l. 1–15</text><path d="M285 78h21m-8 -6 8 6-8 6" fill="none" stroke="#315866" stroke-width="2.3"/><rect x="313" y="9" width="270" height="139" fill="#f3ecde" stroke="#93a5a4" stroke-width="1.5" rx="13"/><text x="448" y="42" fill="#23424a" font-size="21" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Autrefois</text><text x="448" y="77" fill="#23424a" font-size="17" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Trois nuits de suite</text><text x="448" y="103" fill="#23424a" font-size="17" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">On danse et se réchauffe</text><text x="448" y="132" fill="#485b61" font-size="16" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">l. 16–19</text><path d="M589 78h21m-8 -6 8 6-8 6" fill="none" stroke="#315866" stroke-width="2.3"/><rect x="617" y="9" width="270" height="139" fill="#dfeaf0" stroke="#93a5a4" stroke-width="1.5" rx="13"/><text x="752" y="42" fill="#23424a" font-size="21" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="700">Au pas du vieil homme</text><text x="752" y="77" fill="#23424a" font-size="17" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">Un temps à lui</text><text x="752" y="103" fill="#23424a" font-size="17" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">La partenaire imaginée</text><text x="752" y="132" fill="#485b61" font-size="16" font-family="DejaVu Sans,sans-serif" text-anchor="middle" font-weight="400">l. 20–31</text></svg>
