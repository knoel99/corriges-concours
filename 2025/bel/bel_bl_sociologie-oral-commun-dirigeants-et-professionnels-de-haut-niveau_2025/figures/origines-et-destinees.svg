<svg xmlns="http://www.w3.org/2000/svg" width="950" height="420" viewBox="0 0 950 420" role="img" aria-labelledby="titre description">
<title id="titre">Deux lectures de la table de mobilité</title>
<desc id="description">À gauche, part des personnes accédant à l’élite selon leur origine, 14 %, 6 % et 3 %. À droite, part des personnes ayant un parent de l’élite selon leur destination, 23 %, 9 % et 5 %. Les axes vont de zéro à 25 %.</desc>
<rect width="950" height="420" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#203342">
<text x="25" y="37" font-size="24" font-weight="700">Qui accède au sommet, et de quelles familles est-on issu ?</text>
<text x="25" y="88" font-size="22" font-weight="700">Destinées</text>
<text x="25" y="113" font-size="15" font-weight="400">Part des enfants occupant un emploi de l’élite</text>
<text x="25" y="150" font-size="16" font-weight="400">Parents de l’élite</text>
<rect x="25" y="158" width="360" height="16" fill="#edf0f1"/>
<rect x="25" y="158" width="201.60" height="16" fill="#1c6675"/>
<text x="393" y="173" font-size="17" font-weight="700">14 %</text>
<text x="25" y="215" font-size="16" font-weight="400">Parents en A* hors élite</text>
<rect x="25" y="223" width="360" height="16" fill="#edf0f1"/>
<rect x="25" y="223" width="86.40" height="16" fill="#1c6675"/>
<text x="393" y="238" font-size="17" font-weight="700">6 %</text>
<text x="25" y="280" font-size="16" font-weight="400">Toutes origines</text>
<rect x="25" y="288" width="360" height="16" fill="#edf0f1"/>
<rect x="25" y="288" width="43.20" height="16" fill="#1c6675"/>
<text x="393" y="303" font-size="17" font-weight="700">3 %</text>
<path d="M25.0 307v6" stroke="#53646a"/>
<text x="25.0" y="332" font-size="14" text-anchor="middle">0</text>
<path d="M97.0 307v6" stroke="#53646a"/>
<text x="97.0" y="332" font-size="14" text-anchor="middle">5</text>
<path d="M169.0 307v6" stroke="#53646a"/>
<text x="169.0" y="332" font-size="14" text-anchor="middle">10</text>
<path d="M241.0 307v6" stroke="#53646a"/>
<text x="241.0" y="332" font-size="14" text-anchor="middle">15</text>
<path d="M313.0 307v6" stroke="#53646a"/>
<text x="313.0" y="332" font-size="14" text-anchor="middle">20</text>
<path d="M385.0 307v6" stroke="#53646a"/>
<text x="385.0" y="332" font-size="14" text-anchor="middle">25</text>
<text x="495" y="88" font-size="22" font-weight="700">Origines</text>
<text x="495" y="113" font-size="15" font-weight="400">Part ayant au moins un parent de l’élite</text>
<text x="495" y="150" font-size="16" font-weight="400">Emploi de l’élite</text>
<rect x="495" y="158" width="360" height="16" fill="#edf0f1"/>
<rect x="495" y="158" width="331.20" height="16" fill="#99572c"/>
<text x="863" y="173" font-size="17" font-weight="700">23 %</text>
<text x="495" y="215" font-size="16" font-weight="400">Emploi en A* hors élite</text>
<rect x="495" y="223" width="360" height="16" fill="#edf0f1"/>
<rect x="495" y="223" width="129.60" height="16" fill="#99572c"/>
<text x="863" y="238" font-size="17" font-weight="700">9 %</text>
<text x="495" y="280" font-size="16" font-weight="400">Toutes destinations</text>
<rect x="495" y="288" width="360" height="16" fill="#edf0f1"/>
<rect x="495" y="288" width="72.00" height="16" fill="#99572c"/>
<text x="863" y="303" font-size="17" font-weight="700">5 %</text>
<path d="M495.0 307v6" stroke="#53646a"/>
<text x="495.0" y="332" font-size="14" text-anchor="middle">0</text>
<path d="M567.0 307v6" stroke="#53646a"/>
<text x="567.0" y="332" font-size="14" text-anchor="middle">5</text>
<path d="M639.0 307v6" stroke="#53646a"/>
<text x="639.0" y="332" font-size="14" text-anchor="middle">10</text>
<path d="M711.0 307v6" stroke="#53646a"/>
<text x="711.0" y="332" font-size="14" text-anchor="middle">15</text>
<path d="M783.0 307v6" stroke="#53646a"/>
<text x="783.0" y="332" font-size="14" text-anchor="middle">20</text>
<path d="M855.0 307v6" stroke="#53646a"/>
<text x="855.0" y="332" font-size="14" text-anchor="middle">25</text>
<text x="25" y="373" font-size="16" font-weight="400">A* hors élite regroupe les autres emplois supérieurs. Personnes de 35 à 59 ans ayant déjà travaillé.</text>
<text x="25" y="398" font-size="15" font-weight="400">Source : dossier du jury, document 6. Insee, enquête Emploi 2021, France hors Mayotte.</text>
</g></svg>
