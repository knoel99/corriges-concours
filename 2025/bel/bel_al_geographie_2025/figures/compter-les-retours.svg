<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 347" role="img" aria-labelledby="t d"><title id="t">Prélèvement et consommation dans un bassin irrigué</title><desc id="d">Deux bilans pédagogiques comparent les prélèvements, la consommation et les retours vers l’aval. Les valeurs hypothétiques font apparaître que quinze unités de prélèvement économisées peuvent être quinze unités de retour en moins.</desc><rect width="920" height="347" fill="white"/><defs><marker id="p" orient="auto" markerWidth="7" markerHeight="7" refX="5.5" refY="3.1"><path d="M0 0 L6 3.1 L0 6.2Z" fill="#50656b"/></marker></defs><g font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="38.0" font-size="24" fill="#263944" font-weight="bold">Prélèvement et consommation dans un bassin irrigué</text>
<text x="21.0" y="62.0" font-size="15" fill="#263944" font-weight="normal">Exemple fictif en unités de volume, sur une même période, sans variation de stock ni transfert hors bassin</text>
<text x="22.0" y="112.0" font-size="17" fill="#263944" font-weight="bold">Avant modification</text>
<text x="23.0" y="139.0" font-size="15" fill="#263944" font-weight="normal">Prélèvement : 100</text>
<rect x="244" y="90" width="312.0" height="46" rx="0" fill="#d5e8d2"/>
<rect x="556.0" y="90" width="208.0" height="46" rx="0" fill="#cce2ec"/>
<text x="258.0" y="118.0" font-size="16" fill="#263944" font-weight="bold">Consommation : 60</text>
<text x="566.0" y="118.0" font-size="16" fill="#263944" font-weight="bold">Retour : 40</text>
<text x="22.0" y="196.0" font-size="17" fill="#263944" font-weight="bold">Après amélioration</text>
<text x="23.0" y="223.0" font-size="15" fill="#263944" font-weight="normal">Prélèvement : 85</text>
<rect x="244" y="174" width="312.0" height="46" rx="0" fill="#d5e8d2"/>
<rect x="556.0" y="174" width="130.0" height="46" rx="0" fill="#cce2ec"/>
<text x="258.0" y="202.0" font-size="16" fill="#263944" font-weight="bold">Consommation : 60</text>
<text x="566.0" y="202.0" font-size="16" fill="#263944" font-weight="bold">Retour : 25</text>
<text x="22.0" y="270.0" font-size="17" fill="#263944" font-weight="normal">À consommation égale, le prélèvement baisse de 15 et les retours diminuent également de 15.</text>
<text x="22.0" y="299.0" font-size="17" fill="#263944" font-weight="normal">L’effet en aval dépend des anciens retours, de leur qualité et des autres usages.</text>
<text x="22.0" y="329.0" font-size="14" fill="#263944" font-weight="normal">Dans ce bilan simple, le prélèvement est la somme de la consommation et du retour au bassin.</text>
</g></svg>
