<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 348" role="img" aria-labelledby="t d"><title id="t">Restaurer un milieu, deux interventions différentes</title><desc id="d">Comparaison de la circulation retrouvée après effacement d’un obstacle dans le bassin de la Loire et du maintien d’eau dans la mer d’Aral du Nord par le barrage de Kok-Aral.</desc><rect width="920" height="348" fill="white"/><defs><marker id="p" orient="auto" markerWidth="7" markerHeight="7" refX="5.5" refY="3.1"><path d="M0 0 L6 3.1 L0 6.2Z" fill="#50656b"/></marker></defs><g font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="38.0" font-size="24" fill="#263944" font-weight="bold">Restaurer un milieu, deux interventions différentes</text>
<rect x="20" y="68" width="434" height="173" rx="7" fill="#e7efdf"/>
<text x="35.0" y="99.0" font-size="20" fill="#263944" font-weight="bold">Bassin de la Loire</text>
<text x="35.0" y="134.0" font-size="17" fill="#263944" font-weight="bold">1998 : effacer des obstacles</text>
<text x="35.0" y="160.0" font-size="16" fill="#263944" font-weight="normal">Vienne et haut Allier.</text>
<text x="35.0" y="197.0" font-size="17" fill="#263944" font-weight="normal">Faciliter la circulation des poissons</text>
<text x="35.0" y="223.0" font-size="17" fill="#263944" font-weight="normal">et des sédiments.</text>
<rect x="465" y="68" width="434" height="173" rx="7" fill="#e2edf3"/>
<text x="480.0" y="99.0" font-size="20" fill="#263944" font-weight="bold">Mer d’Aral du Nord</text>
<text x="480.0" y="134.0" font-size="17" fill="#263944" font-weight="bold">2005 : construire Kok-Aral</text>
<text x="480.0" y="160.0" font-size="16" fill="#263944" font-weight="normal">Kazakhstan, apports du Syr-Daria.</text>
<text x="480.0" y="197.0" font-size="17" fill="#263944" font-weight="normal">Maintenir une partie des apports</text>
<text x="480.0" y="223.0" font-size="17" fill="#263944" font-weight="normal">dans le bassin septentrional.</text>
<text x="20.0" y="282.0" font-size="20" fill="#263944" font-weight="bold">À quelle échelle juge-t-on les effets ?</text>
<text x="20.0" y="314.0" font-size="15" fill="#263944" font-weight="normal">Un tronçon reconnecté ou une amélioration au nord de l’Aral ne garantissent pas la restauration de tout le bassin.</text>
</g></svg>
