<svg xmlns="http://www.w3.org/2000/svg" width="775" height="242" viewBox="0 0 775 242" role="img"><title>L’année 1956 à plusieurs échelles</title><desc>Février Moscou. Mars Maghreb. Juillet Égypte. Oct.–nov. Budapest et Suez</desc><rect width="775" height="242" fill="white"/>
<text x="17" y="24" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#223642" font-weight="700">L’année 1956 à plusieurs échelles</text>
<rect x="12" y="39" width="748" height="44" fill="#e8efed"/>
<text x="22" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">Février</text>
<text x="157" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Moscou</text>
<text x="157" y="76" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Le rapport Khrouchtchev critique le culte de Staline.</text>
<rect x="12" y="88" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">Mars</text>
<text x="157" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Maghreb</text>
<text x="157" y="125" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Le Maroc et la Tunisie obtiennent leur indépendance.</text>
<rect x="12" y="137" width="748" height="44" fill="#e8efed"/>
<text x="22" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">Juillet</text>
<text x="157" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Égypte</text>
<text x="157" y="174" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Nasser nationalise la Compagnie du canal de Suez.</text>
<rect x="12" y="186" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">Oct.–nov.</text>
<text x="157" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Budapest et Suez</text>
<text x="157" y="223" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">La répression soviétique et la crise de Suez se déroulent simultanément.</text>
</svg>
