<svg xmlns="http://www.w3.org/2000/svg" width="775" height="242" viewBox="0 0 775 242" role="img"><title>Les transformations du régime monétaire international</title><desc>Années 1920 Étalon-or restauré. 1944 Bretton Woods. 1971–1973 Fin du système. 1979 Échelle européenne</desc><rect width="775" height="242" fill="white"/>
<text x="17" y="24" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#223642" font-weight="700">Les transformations du régime monétaire international</text>
<rect x="12" y="39" width="748" height="44" fill="#e8efed"/>
<text x="22" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">Années 1920</text>
<text x="157" y="57" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Étalon-or restauré</text>
<text x="157" y="76" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Tentative de retrouver des parités stables après la guerre.</text>
<rect x="12" y="88" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1944</text>
<text x="157" y="106" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Bretton Woods</text>
<text x="157" y="125" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Des parités ajustables ancrent les monnaies au dollar.</text>
<rect x="12" y="137" width="748" height="44" fill="#e8efed"/>
<text x="22" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1971–1973</text>
<text x="157" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Fin du système</text>
<text x="157" y="174" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Les États-Unis suspendent la convertibilité du dollar en or.</text>
<rect x="12" y="186" width="748" height="44" fill="#f3ede5"/>
<text x="22" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#223642" font-weight="700">1979</text>
<text x="157" y="204" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176674" font-weight="700">Échelle européenne</text>
<text x="157" y="223" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#223642" font-weight="400">Le Système monétaire européen encadre les fluctuations.</text>
</svg>
