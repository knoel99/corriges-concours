<svg xmlns="http://www.w3.org/2000/svg" width="690" height="202" viewBox="0 0 690 202" role="img"><title>Comment une expérience entre dans les archives judiciaires</title>
<rect x="0" y="0" width="690" height="202" rx="6" fill="#ffffff"/>
<text x="15" y="27" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#203d47" font-weight="700">Comment une expérience entre dans les archives judiciaires</text>
<rect x="14" y="41" width="662" height="44" rx="6" fill="#e7f1f0"/>
<text x="26" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="700">Percevoir un dommage</text>
<text x="215" y="59" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">Une personne identifie ce qui lui est arrivé</text>
<text x="215" y="77" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">comme une atteinte dont elle subit les conséquences.</text>
<rect x="14" y="92" width="662" height="44" rx="6" fill="#f4eee6"/>
<text x="26" y="118" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="700">Attribuer et réclamer</text>
<text x="215" y="110" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">Elle désigne un responsable et formule</text>
<text x="215" y="128" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">une demande susceptible d’être entendue ou écartée.</text>
<rect x="14" y="143" width="662" height="44" rx="6" fill="#e7f1f0"/>
<text x="26" y="169" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="700">Constituer un litige</text>
<text x="215" y="161" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">Une demande refusée fait apparaître le litige.</text>
<text x="215" y="179" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">Seule une partie de ces litiges aboutit devant un tribunal.</text>
</svg>
