<svg xmlns="http://www.w3.org/2000/svg" width="690" height="202" viewBox="0 0 690 202" role="img"><title>Suivre un soin dans l’organisation du travail</title>
<rect x="0" y="0" width="690" height="202" rx="6" fill="#ffffff"/>
<text x="15" y="27" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#203d47" font-weight="700">Suivre un soin dans l’organisation du travail</text>
<rect x="14" y="41" width="662" height="44" rx="6" fill="#e7f1f0"/>
<text x="26" y="67" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="700">Prescription</text>
<text x="215" y="59" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">Qui attribue le soin quotidien ?</text>
<text x="215" y="77" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">Quelles tâches figurent sur la fiche de poste ?</text>
<rect x="14" y="92" width="662" height="44" rx="6" fill="#f4eee6"/>
<text x="26" y="118" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="700">Réalisation</text>
<text x="215" y="110" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">Qui aide, écoute, observe et s’adapte</text>
<text x="215" y="128" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">à ce que peut faire la personne soignée ?</text>
<rect x="14" y="143" width="662" height="44" rx="6" fill="#e7f1f0"/>
<text x="26" y="169" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="700">Reconnaissance</text>
<text x="215" y="161" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">Qui transmet les observations à l’équipe ?</text>
<text x="215" y="179" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#203d47" font-weight="400">Où le temps consacré et les compétences sont-ils reconnus ?</text>
</svg>
