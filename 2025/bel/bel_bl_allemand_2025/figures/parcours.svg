<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Comment reconnaître une unité effective ?</title>
<desc id="description">Dans la vie ordinaire Goethe souhaite franchir les frontières sans contrôles. Les centres culturels restent multiples. Dans une cérémonie Une estrade à Versailles, des poignées de main au Reichstag. L’accord devient visible dans un groupe précis. Dans la décision et ses effets Grass veut préserver l’autonomie ; le bilan de 2023 mesure des écarts. La date juridique laisse ouverte l’évaluation.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment reconnaître une unité effective ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Appui dans le dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet ou difficulté</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Dans la vie ordinaire</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Goethe souhaite franchir</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">les frontières sans</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">contrôles.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les centres culturels</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">restent multiples.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Dans une cérémonie</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Une estrade à Versailles,</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">des poignées de main au</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">Reichstag.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">L’accord devient visible</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">dans un groupe précis.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Dans la décision et</text>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">ses effets</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Grass veut préserver</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">l’autonomie ; le bilan de</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">2023 mesure des écarts.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">La date juridique laisse</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">ouverte l’évaluation.</text>
</g>
</svg>
