<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 305" role="img" aria-labelledby="titre desc">
  <title id="titre">Cotes du champ photovoltaïque</title>
  <desc id="desc">Sur une même échelle, trois panneaux au-dessus des trois panneaux centraux d’une rangée de sept. Largeur haute 3 149 millimètres, largeur basse 7 321 millimètres, hauteur totale 3 452 millimètres.</desc>
  <rect width="580" height="305" fill="#fff"/>
  <g stroke="#316077" fill="#dce9ed" stroke-width="0.8">
    <rect x="169.25" y="42.00" width="60.36" height="101.24"/>
    <rect x="230.79" y="42.00" width="60.36" height="101.24"/>
    <rect x="292.33" y="42.00" width="60.36" height="101.24"/>
    <rect x="46.18" y="144.42" width="60.36" height="101.24"/>
    <rect x="107.72" y="144.42" width="60.36" height="101.24"/>
    <rect x="169.25" y="144.42" width="60.36" height="101.24"/>
    <rect x="230.79" y="144.42" width="60.36" height="101.24"/>
    <rect x="292.33" y="144.42" width="60.36" height="101.24"/>
    <rect x="353.87" y="144.42" width="60.36" height="101.24"/>
    <rect x="415.40" y="144.42" width="60.36" height="101.24"/>
  </g>
  <g fill="#203642" font-family="sans-serif" font-size="15">
    <path d="M 168.07 31 H 353.87 m 0 -4 v 8 M 168.07 27 v 8" stroke="#243744" fill="none"/><text x="260.97" y="24" text-anchor="middle">C = 3 149 mm</text>
    <path d="M 45.00 280 H 476.94 m 0 -4 v 8 M 45.00 276 v 8" stroke="#243744" fill="none"/><text x="260.97" y="273" text-anchor="middle">A = 7 321 mm</text>
    <path d="M 492 42 h 8 m -4 0 V 245.67 m -4 0 h 8" stroke="#243744" fill="none"/>
    <text transform="translate(521 144) rotate(-90)" text-anchor="middle">B = 3 452 mm</text>
  </g>
</svg>
