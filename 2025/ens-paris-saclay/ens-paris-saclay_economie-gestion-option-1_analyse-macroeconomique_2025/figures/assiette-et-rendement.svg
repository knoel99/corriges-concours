<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 289" width="830" height="289" role="img" aria-labelledby="t d"><title id="t">Un même patrimoine, trois rendements</title><desc id="d">Un impôt annuel de 1 % sur un patrimoine net de 100 000 € prélève 1 000 €. Son poids rapporté au revenu courant du patrimoine change avec le rendement, contrairement à celui d’un prélèvement strictement proportionnel à ce revenu.</desc><rect width="830" height="289" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#193946"><text x="18" y="28" font-size="21" font-weight="bold">Un même patrimoine, trois rendements</text><text x="18" y="52" font-size="15">Impôt sur le stock / revenu annuel du patrimoine (%)</text><text x="18" y="84" font-size="17" font-weight="bold">Rendement de 2 %</text><text x="18" y="107" font-size="15">1 000 / 2 000</text><rect x="291" y="71" width="405.45" height="24" fill="#315775"/><text x="704.45" y="90" font-weight="bold" font-size="17">50</text><text x="18" y="148" font-size="17" font-weight="bold">Rendement de 5 %</text><text x="18" y="171" font-size="15">1 000 / 5 000</text><rect x="291" y="135" width="162.18" height="24" fill="#28776c"/><text x="461.18" y="154" font-weight="bold" font-size="17">20</text><text x="18" y="212" font-size="17" font-weight="bold">Rendement de 10 %</text><text x="18" y="235" font-size="15">1 000 / 10 000</text><rect x="291" y="199" width="81.09" height="24" fill="#456e8d"/><text x="380.09" y="218" font-weight="bold" font-size="17">10</text></g></svg>
