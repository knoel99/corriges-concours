<svg xmlns="http://www.w3.org/2000/svg" width="740" height="220" viewBox="0 0 740 220" role="img" aria-labelledby="title desc"><title id="title">Productivité du suiveur rapportée à la frontière</title><desc id="desc">Avec une croissance de 6 % contre 2 %, le ratio des productivités passe de 50 % à 51,96 %. L’axe des barres part de zéro.</desc><rect width="740" height="220" fill="white"/><g fill="#183642" font-family="sans-serif"><text x="17" y="31" font-size="22" font-weight="bold">Productivité du suiveur rapportée à la frontière</text><text x="17" y="61" font-size="17">Exemple construit · en pourcentage du niveau de référence</text><path d="M282 79V192" stroke="#8c9ba2"/><text x="17" y="111" font-size="18">Situation initiale</text><rect x="282" y="91" width="313.60" height="23" fill="#296175"/><text x="605.60" y="110" font-size="18">50</text><text x="17" y="174" font-size="18">Après un an</text><rect x="282" y="154" width="325.89" height="23" fill="#9b511f"/><text x="617.89" y="173" font-size="18">51,96</text></g></svg>
