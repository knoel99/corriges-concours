<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" width="820" height="255" role="img" aria-labelledby="titre desc"><title id="titre">Mexique : trois nombres à lire ensemble</title><desc id="desc">Plus de 121 000. Effectif cumulé indiqué par le titre de DW. Il ne correspond pas aux seuls cent premiers jours. 25 puis 40 par jour. Comparaison d’une moyenne sur le mandat précédent avec celle des cent premiers jours du nouveau mandat. Une hausse de 60 %. La différence de 15 est rapportée à la moyenne initiale de 25. Elle ne mesure pas la variation du total cumulé.</desc><rect width="820" height="255" fill="#f6f5ef"/><g font-family="DejaVu Sans, sans-serif" fill="#153139"><text x="24" y="32" font-size="22" font-weight="bold">Mexique : trois nombres à lire ensemble</text><path d="M24 62h241" stroke="#39756e" stroke-width="4"/><text x="24" y="93" font-size="18" font-weight="bold">Plus de 121 000</text><text x="24" y="123" font-size="15">Effectif cumulé indiqué par</text><text x="24" y="145" font-size="15">le titre de DW. Il ne</text><text x="24" y="167" font-size="15">correspond pas aux seuls</text><text x="24" y="189" font-size="15">cent premiers jours.</text><path d="M289 62h241" stroke="#39756e" stroke-width="4"/><text x="289" y="93" font-size="18" font-weight="bold">25 puis 40 par jour</text><text x="289" y="123" font-size="15">Comparaison d’une moyenne</text><text x="289" y="145" font-size="15">sur le mandat précédent</text><text x="289" y="167" font-size="15">avec celle des cent</text><text x="289" y="189" font-size="15">premiers jours du nouveau</text><text x="289" y="211" font-size="15">mandat.</text><path d="M554 62h241" stroke="#39756e" stroke-width="4"/><text x="554" y="93" font-size="18" font-weight="bold">Une hausse de 60 %</text><text x="554" y="123" font-size="15">La différence de 15 est</text><text x="554" y="145" font-size="15">rapportée à la moyenne</text><text x="554" y="167" font-size="15">initiale de 25. Elle ne</text><text x="554" y="189" font-size="15">mesure pas la variation du</text><text x="554" y="211" font-size="15">total cumulé.</text></g></svg>
