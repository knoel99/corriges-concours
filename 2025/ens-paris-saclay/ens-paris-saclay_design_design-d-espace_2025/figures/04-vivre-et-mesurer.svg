<text x="257" y="235.0" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Retirer une rangée de planches avant de réduire la largeur des axes</text>
<text x="257" y="239.9" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">partagés. Repositionner le signal au droit de l’entrée réelle.</text>
