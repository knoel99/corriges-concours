<text x="311" y="197.0" font-family="DejaVu Sans, sans-serif" font-size="3.35" font-weight="400" fill="#212e2c" text-anchor="start">Atelier au nord, eau et chemin mutualisés.</text>
<text x="311" y="201.3" font-family="DejaVu Sans, sans-serif" font-size="3.35" font-weight="400" fill="#212e2c" text-anchor="start">Cette piste est développée.</text>
