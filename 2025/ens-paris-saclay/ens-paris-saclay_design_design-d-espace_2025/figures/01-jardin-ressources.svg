<text x="311" y="88" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" fill="#3b665b" text-anchor="start">Îlots dispersés</text>
<text x="311" y="97.0" font-family="DejaVu Sans, sans-serif" font-size="3.35" font-weight="400" fill="#212e2c" text-anchor="start">Abris au plus près de la terre. Les</text>
<text x="311" y="101.3" font-family="DejaVu Sans, sans-serif" font-size="3.35" font-weight="400" fill="#212e2c" text-anchor="start">échanges deviennent occasionnels.</text>
