<text x="19" y="220" font-family="DejaVu Sans, sans-serif" font-size="4.2" font-weight="700" fill="#3b665b" text-anchor="start">Lorsqu’il pleut, une bande orange monte au bord du préau.</text>
<text x="19" y="234" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Depuis la rue on lit la réserve. Depuis le jardin on atteint le robinet. Sous le</text>
<text x="19" y="239" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">même toit on échange les arrosoirs et les récoltes.</text>
<text x="281" y="70" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Trois implantations</text>
