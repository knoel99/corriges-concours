<rect x="286" y="148" width="9" height="6" rx="0" fill="#3b665b" stroke="none" stroke-width="0.6"/>
<path d="M284 158 L303 158" stroke="#7aa9ac" stroke-width="1.8" fill="none"/>
<text x="311" y="138" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" fill="#3b665b" text-anchor="start">Maison au centre</text>
<text x="311" y="147.0" font-family="DejaVu Sans, sans-serif" font-size="3.35" font-weight="400" fill="#212e2c" text-anchor="start">Point de rencontre puissant. Le bâtiment</text>
<text x="311" y="151.3" font-family="DejaVu Sans, sans-serif" font-size="3.35" font-weight="400" fill="#212e2c" text-anchor="start">ombrage les planches.</text>
