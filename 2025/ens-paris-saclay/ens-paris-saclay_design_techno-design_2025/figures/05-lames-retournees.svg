<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
<title>Esquisse — Retourner une lame</title>
<desc>Le geste du régisseur échange une face colorée contre sa tranche et le fond du foyer grandit d’un jour à l’autre.</desc>
<g font-family="DejaVu Sans, sans-serif">
<rect x="0" y="0" width="420" height="297" rx=".3" fill="#f9f5ee" stroke="none" stroke-width="0"/>
<path d="M19 26 L401 26" fill="none" stroke="#262f30" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" />
<text x="20" y="20" fill="#3d675c" font-size="6.2" font-weight="700" text-anchor="start">Esquisse</text>
<text x="400" y="20" fill="#262f30" font-size="5.0" font-weight="700" text-anchor="end">5 / 8</text>
<text x="20" y="51" fill="#262f30" font-size="10.4" font-weight="700" text-anchor="start">Retourner une lame</text>
<text x="20" y="78" fill="#3d675c" font-size="6" font-weight="700" text-anchor="start">Élévation · sept positions</text>
<g transform="translate(21 98) scale(2.23)">
<rect x="3" y="1" width="1.05" height="29" rx=".3" fill="#262f30" stroke="none" stroke-width="0.6"/>
<rect x="12" y="1" width="1.05" height="29" rx=".3" fill="#262f30" stroke="none" stroke-width="0.6"/>
<rect x="21" y="1" width="1.05" height="29" rx=".3" fill="#262f30" stroke="none" stroke-width="0.6"/>
<rect x="30" y="1" width="8" height="29" rx=".3" fill="#a84830" stroke="none" stroke-width="0.6"/>
<rect x="39" y="1" width="8" height="29" rx=".3" fill="#705c79" stroke="none" stroke-width="0.6"/>
<rect x="48" y="1" width="8" height="29" rx=".3" fill="#3d675c" stroke="none" stroke-width="0.6"/>
<rect x="57" y="1" width="8" height="29" rx=".3" fill="#a84830" stroke="none" stroke-width="0.6"/>
<rect x="0" y="0" width="68" height="32" rx=".3" fill="none" stroke="#262f30" stroke-width="0.7"/>
</g>
<text x="21" y="198" fill="#262f30" font-size="4.1" font-weight="400" text-anchor="start">Largeur intérieure 700 mm · une lame tous les 100 mm</text>
<text x="220" y="78" fill="#3d675c" font-size="6" font-weight="700" text-anchor="start">Plan · pivot et butées</text>
<circle cx="245" cy="135" r="21" fill="none" stroke="#c8c9bb" stroke-width="0.4"/>
<g transform="rotate(0 245 135)">
<rect x="227" y="133.3" width="36" height="3.4" rx=".3" fill="#a84830" stroke="#262f30" stroke-width="0.5"/>
</g>
<circle cx="245" cy="135" r="1.5" fill="#262f30" stroke="#262f30" stroke-width="0.5"/>
<text x="245" y="172" fill="#262f30" font-size="4.5" font-weight="400" text-anchor="middle">0°</text>
<circle cx="304" cy="135" r="21" fill="none" stroke="#c8c9bb" stroke-width="0.4"/>
<g transform="rotate(47 304 135)">
<rect x="286" y="133.3" width="36" height="3.4" rx=".3" fill="#705c79" stroke="#262f30" stroke-width="0.5"/>
</g>
<circle cx="304" cy="135" r="1.5" fill="#262f30" stroke="#262f30" stroke-width="0.5"/>
<text x="304" y="172" fill="#262f30" font-size="4.5" font-weight="400" text-anchor="middle">47°</text>
<circle cx="363" cy="135" r="21" fill="none" stroke="#c8c9bb" stroke-width="0.4"/>
<g transform="rotate(90 363 135)">
<rect x="345" y="133.3" width="36" height="3.4" rx=".3" fill="#3d675c" stroke="#262f30" stroke-width="0.5"/>
</g>
<circle cx="363" cy="135" r="1.5" fill="#262f30" stroke="#262f30" stroke-width="0.5"/>
<text x="363" y="172" fill="#262f30" font-size="4.5" font-weight="400" text-anchor="middle">90°</text>
<text x="221" y="199.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">Une goupille immobilise les deux positions d’usage.</text>
<text x="221" y="205.1" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">Le public voit le champ du foyer à travers les vides.</text>
<path d="M19 256 L401 256" fill="none" stroke="#262f30" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" />
<text x="20" y="267.0" fill="#262f30" font-size="4.45" font-weight="400" text-anchor="start">Le geste du régisseur échange une face colorée contre sa tranche et le fond du foyer grandit d’un jour</text>
<text x="20" y="273.4" fill="#262f30" font-size="4.45" font-weight="400" text-anchor="start">à l’autre.</text>
