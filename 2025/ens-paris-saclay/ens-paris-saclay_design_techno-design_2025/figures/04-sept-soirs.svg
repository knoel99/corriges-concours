<text x="23" y="213.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">Le public entre par deux portes. Qui voit le changement le soir même ?</text>
<text x="23" y="219.1" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">Qui retrouve, en revenant deux jours plus tard, la trace de ce qui s’est passé ?</text>
