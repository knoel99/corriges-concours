<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img"><title>Que veut dire « libre » dans un agenda partagé ?</title><desc>Deux agendas illustrent la différence entre visibilité d’un temps réservé, publicité de son motif et consentement à une réunion.</desc><rect width="880" height="372" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="24" y="38" font-size="25" fill="#17394c" font-weight="bold">Que veut dire « libre » dans un agenda partagé ?</text><rect x="23" y="66" width="400" height="244" fill="#e8efea" stroke="none" stroke-width="1"/><text x="35" y="95" font-size="19" fill="#17394c" font-weight="bold">Version A · deux états</text><text x="38" y="134" font-size="16" fill="#17394c">10 h à 11 h</text><rect x="38" y="146" width="365" height="35" fill="#b7d1c5" stroke="none" stroke-width="1"/><text x="52" y="171" font-size="18" fill="#17394c" font-weight="bold">Libre</text><text x="38" y="213" font-size="16" fill="#17394c">Le travail de concentration</text><text x="38" y="236" font-size="16" fill="#17394c">ne figure pas dans l’agenda.</text><text x="38" y="278" font-size="16" fill="#17394c" font-weight="bold">Réunion ajoutée sans négociation.</text><rect x="454" y="66" width="400" height="244" fill="#e8efea" stroke="none" stroke-width="1"/><text x="466" y="95" font-size="19" fill="#17394c" font-weight="bold">Version B · trois états</text><text x="469" y="134" font-size="16" fill="#17394c">10 h à 11 h</text><rect x="469" y="146" width="365" height="35" fill="#b7d1c5" stroke="none" stroke-width="1"/><text x="483" y="171" font-size="18" fill="#17394c" font-weight="bold">Temps réservé</text><text x="469" y="213" font-size="16" fill="#17394c">Le motif reste privé.</text><text x="469" y="236" font-size="16" fill="#17394c">Une invitation reste possible.</text><text x="469" y="278" font-size="16" fill="#17394c" font-weight="bold">La réunion attend une réponse.</text><text x="24" y="351" font-size="16" fill="#17394c">Même matinée de travail. La visibilité du temps réservé et la règle de prise de rendez-vous changent.</text></g></svg>
