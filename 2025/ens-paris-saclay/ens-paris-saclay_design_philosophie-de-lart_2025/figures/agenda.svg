<svg xmlns="http://www.w3.org/2000/svg" width="900" height="245" viewBox="0 0 900 245" role="img"><title>Ce que modifie la règle de l’agenda</title><rect width="900" height="245" fill="#faf9f4"/><text x="450" y="32" font-weight="700" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="24">Même créneau vide, deux engagements possibles</text><rect x="25" y="58" width="411" height="131" rx="6" fill="#f3e8d4"/><rect x="464" y="58" width="411" height="131" rx="6" fill="#e3eee8"/><text x="231" y="88" font-weight="700" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21">Inscription automatique</text><text x="670" y="88" font-weight="700" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21">Invitation à accepter</text><text x="231" y="123" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19">L’agenda affiche « libre ».</text><text x="670" y="123" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19">Le motif privé reste masqué.</text><text x="231" y="159" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17">La collègue doit faire annuler la réunion.</text><text x="670" y="159" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17">Elle peut proposer un autre créneau.</text><text x="450" y="226" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19">Dans les deux cas, le travail en cours est le même.</text></svg>
