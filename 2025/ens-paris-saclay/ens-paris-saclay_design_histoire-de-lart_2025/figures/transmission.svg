<svg xmlns="http://www.w3.org/2000/svg" width="840" height="231" viewBox="0 0 840 231" role="img" aria-labelledby="titre description"><title id="titre">Qui fixe les règles du projet ?</title><desc id="description">Trois situations : à Francfort, les postes de la cuisine se rapprochent ; à la Nouvelle Gourna la construction en terre accompagne une décision de relogement ; à Gando la toiture et le plafond sont séparés pour ventiler.</desc><defs><marker id="a" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65639"/></marker></defs><g font-family="DejaVu Sans, sans-serif">
<rect x="5" y="8" width="261" height="213" rx="3" fill="#fffaf1" stroke="#233f43" stroke-width="1.7"/>
<rect x="290" y="8" width="261" height="213" rx="3" fill="#e3edeb" stroke="#233f43" stroke-width="1.7"/>
<rect x="574" y="8" width="261" height="213" rx="3" fill="#fffaf1" stroke="#233f43" stroke-width="1.7"/>
<text x="135" y="38" text-anchor="middle" fill="#233f43" font-size="23" font-weight="700">Francfort · 1926</text>
<text x="420" y="38" text-anchor="middle" fill="#233f43" font-size="23" font-weight="700">Nouvelle Gourna</text>
<text x="704" y="38" text-anchor="middle" fill="#233f43" font-size="23" font-weight="700">Gando · 2001</text>
<path d="M49 125 V61 H219 V125 M50 86 H219 M86 64 V87 M180 64 V87" fill="none" stroke="#233f43" stroke-width="2"/>
<path d="M71 105 H197" fill="none" stroke="#a65639" stroke-width="2" marker-end="url(#a)"/>
<path d="M335 125 V97 Q349 59 373 63 Q397 59 411 97 V125 M411 97 Q427 59 450 63 Q475 59 490 97 V125" fill="#f3e8d3" stroke="#233f43" stroke-width="2"/>
<path d="M334 126 H502" fill="none" stroke="#233f43" stroke-width="2"/>
<path d="M606 85 L791 59" fill="none" stroke="#233f43" stroke-width="4"/>
<path d="M622 105 H779 M632 107 V128 M770 107 V128" fill="none" stroke="#233f43" stroke-width="3"/>
<path d="M652 96 Q704 87 760 86" fill="none" stroke="#a65639" stroke-width="2" marker-end="url(#a)"/>
<text x="135" y="159" text-anchor="middle" fill="#233f43" font-size="19" font-weight="400">Les postes de travail</text>
<text x="135" y="182" text-anchor="middle" fill="#233f43" font-size="19" font-weight="400">se rapprochent.</text>
<text x="135" y="210" text-anchor="middle" fill="#233f43" font-size="19" font-weight="700">Qui règle les gestes ?</text>
<text x="420" y="159" text-anchor="middle" fill="#233f43" font-size="19" font-weight="400">Un savoir de la terre</text>
<text x="420" y="182" text-anchor="middle" fill="#233f43" font-size="19" font-weight="400">entre dans le projet.</text>
<text x="420" y="210" text-anchor="middle" fill="#233f43" font-size="19" font-weight="700">Qui choisit le lieu ?</text>
<text x="704" y="159" text-anchor="middle" fill="#233f43" font-size="19" font-weight="400">Le toit se détache</text>
<text x="704" y="182" text-anchor="middle" fill="#233f43" font-size="19" font-weight="400">du plafond.</text>
<text x="704" y="210" text-anchor="middle" fill="#233f43" font-size="19" font-weight="700">Qui construit ?</text></g></svg>
