<svg xmlns="http://www.w3.org/2000/svg" width="880" height="325" viewBox="0 0 880 325" role="img"><title>Qui reprend la règle et à quelle fin ?</title><desc>Comparaison de trois réalisations du programme à partir de deux questions : quel procédé et qui décide ?</desc><rect width="880" height="325" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="24" y="38" font-size="25" fill="#17394c" font-weight="bold">Qui reprend la règle et à quelle fin ?</text><rect x="23" y="61" width="262" height="204" fill="#e8efea" stroke="none" stroke-width="1"/><text x="35" y="92" font-size="19" fill="#17394c" font-weight="bold">Francfort · 1926</text><text x="35" y="127" font-size="17" fill="#17394c" font-weight="bold">Planifier une série</text><text x="35" y="158" font-size="15" fill="#17394c">Rangements et travail</text><text x="35" y="180" font-size="15" fill="#17394c">rapprochés dans une pièce.</text><text x="35" y="217" font-size="15" fill="#17394c">Quelle personne occupe</text><text x="35" y="240" font-size="15" fill="#17394c">cette cuisine rationalisée ?</text><rect x="306" y="61" width="262" height="204" fill="#e8efea" stroke="none" stroke-width="1"/><text x="318" y="92" font-size="19" fill="#17394c" font-weight="bold">Nouvelle Gourna</text><text x="318" y="127" font-size="17" fill="#17394c" font-weight="bold">Transmettre un savoir</text><text x="318" y="158" font-size="15" fill="#17394c">La terre et la voûte</text><text x="318" y="180" font-size="15" fill="#17394c">entrent dans un projet neuf.</text><text x="318" y="217" font-size="15" fill="#17394c">Qui décide du déplacement</text><text x="318" y="240" font-size="15" fill="#17394c">des familles ?</text><rect x="589" y="61" width="262" height="204" fill="#e8efea" stroke="none" stroke-width="1"/><text x="601" y="92" font-size="19" fill="#17394c" font-weight="bold">Gando · 2001</text><text x="601" y="127" font-size="17" fill="#17394c" font-weight="bold">Adapter une technique</text><text x="601" y="158" font-size="15" fill="#17394c">La couverture est séparée</text><text x="601" y="180" font-size="15" fill="#17394c">du plafond ventilé.</text><text x="601" y="217" font-size="15" fill="#17394c">Comment les habitants</text><text x="601" y="240" font-size="15" fill="#17394c">prennent-ils part au projet ?</text><text x="23" y="304" font-size="16" fill="#17394c">Chaque exemple distingue un procédé matériel et la décision sociale qui gouverne son emploi.</text></g></svg>
