<text x="22" y="221" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#744e43" text-anchor="start">Un bac commun à toutes les hauteurs</text>
<text x="22" y="233" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Tôle inox pliée avec deux nervures de 3 mm. Elles dégagent les orifices. Les bords</text>
<text x="22" y="238" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">du bac sont rabattus. Format proposé 118 × 76 mm.</text>
<text x="202" y="78" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#744e43" text-anchor="start">Stabilité</text>
<text x="202" y="90.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Charger six outils représentatifs, puis en retirer cinq du même côté. Vérifier le</text>
<text x="202" y="95.4" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">retour stable en usage.</text>
<text x="202" y="139" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#744e43" text-anchor="start">Écoulement</text>
<text x="202" y="151.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Verser un même volume d’eau propre dans deux modules et comparer le temps</text>
<text x="202" y="156.4" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">d’égouttage et le nettoyage.</text>
<text x="202" y="200" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#744e43" text-anchor="start">Entretien</text>
<text x="202" y="212.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Séparer support et module, brosser l’intérieur puis contrôler les rives après dix</text>
<text x="202" y="217.4" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">lavages. Garder les eaux chargées de pigment dans un bac adapté.</text>
<path d="M13 276 L407 276" stroke="#744e43" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#744e43" text-anchor="start">Oral de dix minutes : présenter un outil, expliquer la section, chiffrer le retrait et choisir un essai qui pourrait conduire à modifier le</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#744e43" text-anchor="start">dessin.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#744e43" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée · 25 novembre 2026</text>
</svg>
