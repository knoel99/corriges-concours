<text x="24" y="208" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Trois colonnes, deux rangées. Les parois verticales et les rives</text>
<text x="24" y="213" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">ont 9 mm ; les trois bandes horizontales ont 8 mm. Un léger rayon</text>
<text x="24" y="218" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">remplace les arêtes vives.</text>
<text x="185" y="74" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#744e43" text-anchor="start">Une pâte qui passe partout</text>
<text x="185" y="87.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Un seul profil évite de changer la filière entre les trois hauteurs. La section</text>
<text x="185" y="92.4" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">régulière limite les différences de séchage. Les angles et les soudures de flux</text>
<text x="185" y="97.8" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">seront examinés après cuisson.</text>
