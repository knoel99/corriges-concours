<text x="20" y="228" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#744e43" text-anchor="start">Les outils sèchent séparés, leur pointe hors de l’eau.</text>
<text x="20" y="240" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Les alvéoles laissent circuler l’air. Une petite tôle amovible recueille les gouttes et protège</text>
<text x="20" y="245" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">l’établi.</text>
<text x="310" y="72" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#744e43" text-anchor="start">Trois essais d’usage</text>
<text x="310" y="91" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#744e43" text-anchor="start">Porter des fleurs</text>
<text x="310" y="100.0" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Les tiges demanderaient un réservoir</text>
<text x="310" y="104.8" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">étanche.</text>
<text x="310" y="141" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#744e43" text-anchor="start">Garder des lettres</text>
<text x="310" y="150.0" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Le format des enveloppes oblige à fendre</text>
<text x="310" y="154.8" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">trop de cloisons.</text>
<text x="310" y="191" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#744e43" text-anchor="start">Sécher des outils</text>
<text x="310" y="200.0" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Chaque vide calibre un rangement et les</text>
<text x="310" y="204.8" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">modules restent lavables.</text>
<path d="M13 276 L407 276" stroke="#744e43" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#744e43" text-anchor="start">Hypothèse de laboratoire. Le profil de la machine illustrée au concours reste à relever sur sa photographie originale.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#744e43" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée · 25 novembre 2026</text>
</svg>
