<svg xmlns="http://www.w3.org/2000/svg" width="830" height="239" viewBox="0 0 830 239" role="img" aria-labelledby="t d"><title id="t">Essenciel : diagnostic financier, implantation aux États-Unis et diversification vers les spas</title><desc id="d">Au lancement, le projet américain doit financer les équipements et trente jours de chiffre d’affaires. Le budget de 680 000 € de capitaux ne couvre pas ce besoin initial.</desc><rect width="830" height="239" fill="white"/><g fill="#234451" font-family="sans-serif"><rect x="10" y="11" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="47" font-weight="bold" font-size="18">Investissement</text><text x="196" y="35" font-size="18" font-weight="bold">652 000 € au début de 2026</text><text x="196" y="59" font-size="16">Aménagement, installations, marque, site et dépôt.</text><rect x="10" y="86" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="122" font-weight="bold" font-size="18">Cycle initial</text><text x="196" y="110" font-size="18" font-weight="bold">149 083,33 € de besoin d’exploitation</text><text x="196" y="134" font-size="16">30 jours de ventes sur une année de 360 jours.</text><rect x="10" y="161" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="197" font-weight="bold" font-size="18">Financement</text><text x="196" y="185" font-size="18" font-weight="bold">801 083,33 € à couvrir ; 680 000 € annoncés</text><text x="196" y="209" font-size="16">Reste 121 083,33 € à financer avant les premières recettes.</text></g></svg>
