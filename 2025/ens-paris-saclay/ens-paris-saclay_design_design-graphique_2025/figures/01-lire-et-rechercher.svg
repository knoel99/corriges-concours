<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Faire vibrer une scène jurassienne</title><desc>Le plateau répond · deux tests de spectacle inventés. La créativité de la proposition se lit dans les différences entre les supports.</desc>
