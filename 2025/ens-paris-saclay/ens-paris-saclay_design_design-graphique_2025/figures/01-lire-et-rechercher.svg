<path d="M27 127 Q47 93 71 114 T125 90" fill="none" stroke="#272a4a" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M27 122 Q47 88 71 110 T125 86" fill="none" stroke="#272a4a" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="15" y="183" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#272a4a" text-anchor="start">Une carte</text>
<text x="15" y="194.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une courbe topographique parle d’une vue aérienne.</text>
<text x="15" y="199.2" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Elle perd la voix et le corps de l’interprète.</text>
<rect x="149" y="72" width="123" height="94" rx="0" fill="#94dbcc" stroke="none" stroke-width="0.6"/>
<polygon points="175,123.2 195.8,123.2 195.8,107.6 214,107.6 214,92 240,92 240,102.4 224.4,102.4 224.4,118 206.2,118 206.2,133.6 175,133.6" fill="#272a4a" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<path d="M165 143 L257 143" stroke="#272a4a" stroke-width="1" fill="none"/>
<text x="149" y="183" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#272a4a" text-anchor="start">Un balisage</text>
<text x="149" y="194.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Un signe simple se reconnaît en déplacement. Reste</text>
<text x="149" y="199.2" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">à faire lire une scène, sans imiter une marque de</text>
<text x="149" y="204.4" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">randonnée.</text>
