<polygon points="364.98,145 369.1,145 377.34,81.14 373.22,81.14" fill="#272a4a" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<text x="283" y="183" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#272a4a" text-anchor="start">Une vibration</text>
<text x="283" y="194.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une ligne de plateau peut s’écarter selon le</text>
<text x="283" y="199.2" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">rythme. Le signe demeure stable en petit, la</text>
<text x="283" y="204.4" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">composition change en grand.</text>
<text x="15" y="241" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#272a4a" text-anchor="start">Regarder un dispositif de près</text>
<text x="15" y="252.0" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="400" fill="#212e2c" text-anchor="start">Le balisage de randonnée règle la répétition d’un signe le long d’un trajet. L’affiche Beethoven de Josef Müller-Brockmann (1955) donne une forme à l’écoute. Ici le graphisme</text>
<text x="15" y="256.6" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="400" fill="#212e2c" text-anchor="start">procède de la même attention au temps.</text>
<path d="M13 276 L407 276" stroke="#314b76" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#314b76" text-anchor="start">Lecture étayée par le rapport, p. 4–6. L’identité originale et les informations des deux spectacles demeurent indisponibles.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#314b76" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée · 25 novembre 2026</text>
