<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Faire vibrer une scène jurassienne</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Le plateau répond · deux tests de spectacle inventés. La créativité de la proposition se lit dans les différences entre les supports.</text>
