<text x="170" y="77" font-family="DejaVu Sans, sans-serif" font-size="5.4" font-weight="700" fill="#272a4a" text-anchor="start">Affiche abribus</text>
<text x="170" y="89" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" fill="#272a4a" text-anchor="start">Format choisi 120 × 176 cm · dessin au 1/10.</text>
<text x="170" y="105.0" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Les danseurs avancent par impulsions contrariées. La masse typographique se déplace</text>
<text x="170" y="110.7" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">d’une ligne à l’autre et les barres montent en décalé. La géométrie et le titre</text>
<text x="170" y="116.4" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">construisent ensemble le mouvement.</text>
<text x="170" y="153" font-family="DejaVu Sans, sans-serif" font-size="4.5" font-weight="700" fill="#272a4a" text-anchor="start">Lire depuis le trottoir</text>
<text x="170" y="165.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Premier regard, le titre et le mouvement. En s’approchant, la discipline, la date et</text>
<text x="170" y="170.2" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">l’heure. Au pied du support, la salle et la réservation.</text>
