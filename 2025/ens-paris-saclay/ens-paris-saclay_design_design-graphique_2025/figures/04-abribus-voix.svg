<text x="170" y="105.0" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Les voix partent du même souffle et s’étagent par nappes. Une forme ouverte s’élargit</text>
<text x="170" y="110.7" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">et le blanc du centre retarde la lecture. Le titre et les courbes partagent le même axe</text>
<text x="170" y="116.4" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">vertical.</text>
<text x="170" y="153" font-family="DejaVu Sans, sans-serif" font-size="4.5" font-weight="700" fill="#272a4a" text-anchor="start">Lire depuis le trottoir</text>
<text x="170" y="165.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Premier regard, le titre et le mouvement. En s’approchant, la discipline, la date et</text>
<text x="170" y="170.2" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">l’heure. Au pied du support, la salle et la réservation.</text>
