<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <rect x="0" y="0" width="440" height="260" fill="#ffffff"/>
  <!-- grille légère : une unité = s = 50 px ; origine (220, 210) -->
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="70" y1="60" x2="70" y2="210"/>
    <line x1="120" y1="60" x2="120" y2="210"/>
    <line x1="170" y1="60" x2="170" y2="210"/>
    <line x1="270" y1="60" x2="270" y2="210"/>
    <line x1="320" y1="60" x2="320" y2="210"/>
    <line x1="370" y1="60" x2="370" y2="210"/>
    <line x1="60" y1="160" x2="390" y2="160"/>
    <line x1="60" y1="110" x2="390" y2="110"/>
    <line x1="60" y1="60" x2="390" y2="60"/>
  </g>
  <!-- axes -->
  <g stroke="#000000" stroke-width="1.4" fill="none">
    <line x1="40" y1="210" x2="410" y2="210"/>
    <polyline points="402,205 410,210 402,215"/>
    <line x1="220" y1="240" x2="220" y2="30"/>
    <polyline points="215,38 220,30 225,38"/>
  </g>
  <text x="412" y="228">x</text>
  <text x="228" y="36">y</text>
  <!-- graduations -->
  <g font-size="13" text-anchor="middle" fill="#000000">
    <text x="70" y="228">−3s</text>
    <text x="120" y="228">−2s</text>
    <text x="170" y="228">−s</text>
    <text x="210" y="228">0</text>
    <text x="270" y="228">s</text>
    <text x="320" y="228">2s</text>
    <text x="370" y="228">3s</text>
  </g>
  <g font-size="13" text-anchor="end" fill="#000000">
    <text x="214" y="164">s</text>
    <text x="214" y="114">2s</text>
    <text x="214" y="64">3s</text>
  </g>
  <!-- courbe de φ_s -->
  <g stroke="#1f4e9c" stroke-width="2.6" fill="none" stroke-linecap="round">
    <line x1="70" y1="60" x2="170" y2="160"/>
    <line x1="170" y1="210" x2="270" y2="210"/>
    <line x1="270" y1="160" x2="370" y2="60"/>
  </g>
  <!-- points : valeur prise en ±s (pleins), valeur exclue (vides) -->
  <g stroke="#1f4e9c" stroke-width="2">
    <circle cx="170" cy="210" r="4.5" fill="#1f4e9c"/>
    <circle cx="270" cy="210" r="4.5" fill="#1f4e9c"/>
    <circle cx="170" cy="160" r="4.5" fill="#ffffff"/>
    <circle cx="270" cy="160" r="4.5" fill="#ffffff"/>
  </g>
  <!-- pointillés de lecture -->
  <g stroke="#888888" stroke-width="1" stroke-dasharray="4 3">
    <line x1="170" y1="165" x2="170" y2="205"/>
    <line x1="270" y1="165" x2="270" y2="205"/>
  </g>
  <text x="312" y="150" fill="#1f4e9c">y = |x|</text>
  <text x="80" y="150" fill="#1f4e9c">y = |x|</text>
  <text x="232" y="200" fill="#1f4e9c" font-size="13">y = 0</text>
</svg>
