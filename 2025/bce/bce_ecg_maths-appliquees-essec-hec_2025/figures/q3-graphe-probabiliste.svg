<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="260" fill="#ffffff"/>
  <!-- boucles -->
  <path d="M 88 108 C 40 40, 160 40, 112 108" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="100" y="40" font-size="18" text-anchor="middle" fill="#1f2937">1/3</text>
  <path d="M 488 108 C 440 40, 560 40, 512 108" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="500" y="40" font-size="18" text-anchor="middle" fill="#1f2937">1/3</text>
  <!-- 1 -> 2 (haut) et 2 -> 1 (bas) -->
  <path d="M 124 118 Q 200 70 276 118" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="200" y="82" font-size="18" text-anchor="middle" fill="#1f2937">2/3</text>
  <path d="M 276 142 Q 200 190 124 142" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="200" y="196" font-size="18" text-anchor="middle" fill="#1f2937">1/3</text>
  <!-- 2 -> 3 (haut) et 3 -> 2 (bas) -->
  <path d="M 324 118 Q 400 70 476 118" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="400" y="82" font-size="18" text-anchor="middle" fill="#1f2937">2/3</text>
  <path d="M 476 142 Q 400 190 324 142" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="400" y="196" font-size="18" text-anchor="middle" fill="#1f2937">2/3</text>
  <!-- sommets -->
  <circle cx="100" cy="130" r="24" fill="#eef2ff" stroke="#1f2937" stroke-width="2"/>
  <text x="100" y="137" font-size="20" text-anchor="middle" fill="#1f2937">1</text>
  <circle cx="300" cy="130" r="24" fill="#eef2ff" stroke="#1f2937" stroke-width="2"/>
  <text x="300" y="137" font-size="20" text-anchor="middle" fill="#1f2937">2</text>
  <circle cx="500" cy="130" r="24" fill="#eef2ff" stroke="#1f2937" stroke-width="2"/>
  <text x="500" y="137" font-size="20" text-anchor="middle" fill="#1f2937">3</text>
  <text x="300" y="245" font-size="15" text-anchor="middle" fill="#4b5563">Aucune transition entre 1 et 3 ; l'état 2 ne reboucle pas sur lui-même.</text>
</svg>
