<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">La sensibilité commune mise à l’épreuve</title>
<desc id="description">Argos accueille les suppliantes Des étrangères demandent protection. Le vote crée une obligation envers elles. Le dîner d’adieu à Ellen Le groupe se comprend sans explication. Les égards rendent l’exclusion acceptable. Le citoyen selon Spinoza Un jugement divergent peut s’exprimer. L’obéissance à la loi permet sa critique.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">La sensibilité commune mise à l’épreuve</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Scène ou raisonnement</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qui est entendu ?</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet à examiner</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Argos accueille les</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">suppliantes</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Des étrangères demandent</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">protection.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le vote crée une obligation</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">envers elles.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le dîner d’adieu à</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Ellen</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le groupe se comprend sans</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">explication.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Les égards rendent</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">l’exclusion acceptable.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le citoyen selon</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Spinoza</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Un jugement divergent peut</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">s’exprimer.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">L’obéissance à la loi</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">permet sa critique.</text>
</g>
</svg>
