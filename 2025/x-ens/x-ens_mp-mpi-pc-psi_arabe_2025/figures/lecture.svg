<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">De la reconnaissance à l’accès effectif</title>
<desc id="description">Enquête régionale et dessin Droit annoncé et porte ouverte Le trajet est-il praticable ? Projet algérien École, emploi, droits et protections Quels moyens pour les exercer ? Conférence régionale Observatoire arabe proposé Qui recueillerait les signalements ?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De la reconnaissance à l’accès effectif</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Document</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dispositif</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question à vérifier</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Enquête régionale et</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">dessin</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Droit annoncé et porte</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">ouverte</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le trajet est-il praticable</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Projet algérien</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">École, emploi, droits et</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">protections</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Quels moyens pour les</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">exercer ?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Conférence régionale</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Observatoire arabe proposé</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Qui recueillerait les</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">signalements ?</text>
</g>
</svg>
