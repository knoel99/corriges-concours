<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Que mesure chaque document ?</title>
<desc id="description">Difficultés matérielles Graphique britannique, neuf postes Aucune mesure directe du revenu universel Travail et bien-être Essais néerlandais, finlandais et américain Populations, durées et montants distincts Effet collectif Versements en Amazonie péruvienne Choix libres dans trois communautés sélectionnées</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que mesure chaque document ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Témoin précis</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Limite d’interprétation</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Difficultés</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">matérielles</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Graphique britannique,</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">neuf postes</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Aucune mesure directe du</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">revenu universel</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Travail et bien-être</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Essais néerlandais,</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">finlandais et américain</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Populations, durées et</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">montants distincts</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Effet collectif</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Versements en Amazonie</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">péruvienne</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Choix libres dans trois</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">communautés sélectionnées</text>
</g>
</svg>
