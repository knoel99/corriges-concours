<desc id="description">Étude Shell 12–25 ans, optimisme et influence ressentie Jugement sur soi et sur le pays Jugend in Deutschland 14–29 ans, vote envisagé en 2024 Intention, résultat et indécision Reportage et dessin Salariés différents ; banquier sans réponse Exemples et portrait d’une génération</desc>
