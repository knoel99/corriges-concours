<svg xmlns="http://www.w3.org/2000/svg" width="760" height="248" viewBox="0 0 760 248" role="img" aria-labelledby="titre">
  <title id="titre">Arbre optimal. Après le nombre de pétales, la couleur est demandée seulement pour cinq pétales.</title>
  <rect width="760" height="248" fill="#ffffff"/>
  <g stroke="#334155" stroke-width="2.4" fill="none">
    <path d="M195 113 L295 54 M195 113 L295 165 M443 165 L546 116 M443 165 L546 209"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#273344">
    <text x="209" y="64">4 · 1/2</text><text x="209" y="163">5 · 1/2</text>
    <text x="461" y="114">blanc · 3/25</text><text x="447" y="222">bleu · 22/25</text>
  </g>
  <g fill="#e6eff8" stroke="#315875" stroke-width="2">
    <rect x="23" y="90" width="172" height="46" rx="8"/><rect x="295" y="142" width="148" height="46" rx="8"/>
  </g>
  <g fill="#f3f5ee" stroke="#587253" stroke-width="2">
    <rect x="295" y="31" width="148" height="46" rx="8"/><rect x="549" y="93" width="182" height="46" rx="8"/><rect x="549" y="181" width="182" height="55" rx="8"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" fill="#132331" font-size="17">
    <text x="109" y="119">Nombre de pétales</text><text x="369" y="171">Couleur</text>
    <text x="369" y="60">Gaillet</text><text x="640" y="122">Myosotis</text>
    <text x="640" y="204">Myosotis · 6/11</text><text x="640" y="225">Lin · 5/11</text>
  </g>
</svg>
