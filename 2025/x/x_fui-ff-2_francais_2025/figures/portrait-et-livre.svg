<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 315" role="img" aria-labelledby="titre desc"><title id="titre">Pourquoi une photographie éloigne et un livre rapproche</title><desc id="desc">Le portrait rend sensible une époque révolue. La lecture permet d’en retrouver une voix.</desc><rect width="900" height="315" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="20" y="36" font-size="24" font-weight="bold" fill="#223c49">Pourquoi une photographie éloigne et un livre rapproche</text>
<rect x="231" y="65" width="438" height="58" rx="6" fill="#e9eff2"/>
<text x="251" y="100" font-size="19" font-weight="bold" fill="#223c49">Les écrivains d’une génération passée</text>
<path d="M450 123 v24 H228 v26 m-4 -6 4 6 4 -6 M450 147 H666 v26 m-4 -6 4 6 4 -6" fill="none" stroke="#506874" stroke-width="2.5"/>
<rect x="20" y="181" width="421" height="114" rx="6" fill="#f4ecdf"/>
<text x="33" y="214" font-size="20" font-weight="bold" fill="#223c49">Regarder les portraits</text>
<text x="33" y="250" font-size="17" font-weight="normal" fill="#223c49">Costumes, lunettes, attitudes.</text>
<text x="33" y="276" font-size="17" font-weight="normal" fill="#223c49">Leur monde semble lointain.</text>
<rect x="458" y="181" width="421" height="114" rx="6" fill="#e5f0e7"/>
<text x="471" y="214" font-size="20" font-weight="bold" fill="#223c49">Ouvrir leurs livres</text>
<text x="471" y="250" font-size="17" font-weight="normal" fill="#223c49">Une voix se fait entendre.</text>
<text x="471" y="276" font-size="17" font-weight="normal" fill="#223c49">La relation peut recommencer.</text>
</g></svg>
