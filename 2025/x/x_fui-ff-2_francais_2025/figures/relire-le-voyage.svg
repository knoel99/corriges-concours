<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 255" role="img" aria-labelledby="titre desc"><title id="titre">Le trajet change de sens à la relecture du poème</title><desc id="desc">Le dénouement oblige à reprendre une première hypothèse et permet d’argumenter un avis personnel.</desc><rect width="900" height="255" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="20" y="36" font-size="24" font-weight="bold" fill="#223c49">Le trajet change de sens à la relecture du poème</text>
<rect x="20" y="70" width="263" height="112" rx="6" fill="#e5eff1"/>
<text x="33" y="100" font-size="18" font-weight="bold" fill="#223c49">Première hypothèse</text>
<text x="33" y="138" font-size="17" font-weight="normal" fill="#223c49">Le lecteur imagine</text>
<text x="33" y="163" font-size="17" font-weight="normal" fill="#223c49">des retrouvailles.</text>
<path d="M284 124 h29 m-6 -5 6 5 -6 5" fill="none" stroke="#506874" stroke-width="2.5"/>
<rect x="318" y="70" width="263" height="112" rx="6" fill="#f5ebdf"/>
<text x="331" y="100" font-size="18" font-weight="bold" fill="#223c49">Derniers vers</text>
<text x="331" y="138" font-size="17" font-weight="normal" fill="#223c49">La tombe donne</text>
<text x="331" y="163" font-size="17" font-weight="normal" fill="#223c49">un autre sens au trajet.</text>
<path d="M582 124 h29 m-6 -5 6 5 -6 5" fill="none" stroke="#506874" stroke-width="2.5"/>
<rect x="616" y="70" width="263" height="112" rx="6" fill="#e8eee6"/>
<text x="629" y="100" font-size="18" font-weight="bold" fill="#223c49">Deuxième lecture</text>
<text x="629" y="138" font-size="17" font-weight="normal" fill="#223c49">Les détails du chemin</text>
<text x="629" y="163" font-size="17" font-weight="normal" fill="#223c49">font entendre le deuil.</text>
<path d="M746 187 v23 H151 v19 m-4 -6 4 6 4 -6" fill="none" stroke="#506874" stroke-width="2.5"/>
<text x="167" y="234" font-size="16" font-weight="normal" fill="#223c49">Relire permet au lecteur de rectifier lui-même sa première interprétation.</text>
</g></svg>
