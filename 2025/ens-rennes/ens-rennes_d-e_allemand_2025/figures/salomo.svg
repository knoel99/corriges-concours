<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Wie sich Abwanderung auswirken kann</title>
<desc id="description">2020, 20 bis 29 Jahre 115 Männer auf 100 Frauen. Nicht die gesamte Bevölkerung. Weniger Familien vor Ort Schulen und Treffpunkte fehlen. Nicht alle Regionen sind betroffen. Politische Präsenz Parteien nutzen örtliche Lücken. Keine individuelle Wahlprognose.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Wie sich Abwanderung auswirken kann</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Beobachtung</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Mögliche Folge</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Grenze der Aussage</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">2020, 20 bis 29 Jahre</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">115 Männer auf 100 Frauen.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Nicht die gesamte</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Bevölkerung.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Weniger Familien vor</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Ort</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Schulen und Treffpunkte</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">fehlen.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Nicht alle Regionen sind</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">betroffen.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Politische Präsenz</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Parteien nutzen örtliche</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Lücken.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Keine individuelle</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Wahlprognose.</text>
</g>
</svg>
