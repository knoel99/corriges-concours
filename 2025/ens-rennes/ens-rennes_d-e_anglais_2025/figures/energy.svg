<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">How a computing contract reaches the power grid</title>
<desc id="description">Open a data centre Continuous supply and cooling. How much extra power is needed? Buy output from a reactor A plant must be running first. Who pays if the project is late? Approve grid investments Networks serve many users. Who benefits from new capacity?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">How a computing contract reaches the power grid</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Decision</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Time horizon</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What to check</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Open a data centre</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Continuous supply and</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">cooling.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">How much extra power is</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">needed?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Buy output from a</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">reactor</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">A plant must be running</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">first.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Who pays if the project is</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">late?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Approve grid</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">investments</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Networks serve many users.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Who benefits from new</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">capacity?</text>
</g>
</svg>
