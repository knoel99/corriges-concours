<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Tres medidas de la economía ambiental</title>
<desc id="description">Producción 1.519 millones de euros en 2021. Valor añadido del sector vasco. Peso económico 1,95 % del PIB vasco. Parte de la producción regional. Empleo 2,3 % de la población activa. Una proporción de personas.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Tres medidas de la economía ambiental</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Medida</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dato del artículo</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué se puede afirmar</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Producción</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">1.519 millones de euros en</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">2021.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Valor añadido del sector</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">vasco.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Peso económico</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">1,95 % del PIB vasco.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Parte de la producción</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">regional.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Empleo</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">2,3 % de la población</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">activa.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Una proporción de personas.</text>
</g>
</svg>
