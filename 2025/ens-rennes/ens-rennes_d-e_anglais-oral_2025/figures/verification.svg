<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">What can the available evidence establish?</title>
<desc id="description">What is visible? Footage and ordinary objects. No evidence for the allegation. Who relayed it? Accounts and public statements. Amplification can be documented. Where did it start? Later fact-check in the footnote. An earlier French post is identified.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What can the available evidence establish?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Relevant evidence</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Inference</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">What is visible?</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Footage and ordinary</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">objects.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">No evidence for the</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">allegation.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Who relayed it?</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Accounts and public</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">statements.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Amplification can be</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">documented.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Where did it start?</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Later fact-check in the</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">footnote.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">An earlier French post is</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">identified.</text>
</g>
</svg>
