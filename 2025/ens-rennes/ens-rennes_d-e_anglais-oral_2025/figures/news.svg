<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">From public funding to audience trust</title>
<desc id="description">Funding Congress funds the agency. The executive disputes its role. How much reporting capacity returns? Supply OAN offers reports free of charge. What choices will editors have? Reception Listeners judge the resulting programmes. Will an established audience trust them?</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">From public funding to audience trust</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Decision</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Who acts?</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What remains uncertain?</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Funding</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Congress funds the agency.</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">The executive disputes its</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">role.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">How much reporting capacity</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">returns?</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Supply</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">OAN offers reports free of</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">charge.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">What choices will editors</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">have?</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Reception</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Listeners judge the</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">resulting programmes.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Will an established</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">audience trust them?</text>
</g>
</svg>
