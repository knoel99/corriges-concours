<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Who can ask whom to act?</title>
<desc id="description">Visiting MEPs Call on the Commission to act. The call is a political request. Commission Could apply to the Court of Justice. Its statement announces no order. Court of Justice Could examine interim relief. A decision could affect the planned event.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who can ask whom to act?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Institution</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Action in the article</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Legal effect at that stage</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Visiting MEPs</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Call on the Commission to</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">act.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">The call is a political</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">request.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Commission</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Could apply to the Court</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">of Justice.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Its statement announces no</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">order.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Court of Justice</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Could examine interim</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">relief.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">A decision could affect the</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">planned event.</text>
</g>
</svg>
