<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">A chi si riferiscono i dati sul lavoro?</title>
<desc id="description">Circa tre milioni Lavoratori con reddito insufficiente. Quante ore sono retribuite? Sessanta per cento Peso del fattore salariale nella scelta. Quali condizioni si includono? Tremila ogni anno Rifugiati assunti da Adecco in Italia. Quali prospettive di carriera?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">A chi si riferiscono i dati sul lavoro?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Dato</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Popolazione</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Domanda da porre</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Circa tre milioni</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Lavoratori con reddito</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">insufficiente.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Quante ore sono retribuite?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Sessanta per cento</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Peso del fattore salariale</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">nella scelta.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Quali condizioni si</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">includono?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Tremila ogni anno</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Rifugiati assunti da</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Adecco in Italia.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Quali prospettive di</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">carriera?</text>
</g>
</svg>
