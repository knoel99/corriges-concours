<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Le temps du geste et celui du récit</title>
<desc id="description">Woolf, le bas Mesure, impatience et pensées de la mère Le geste fait sentir des relations. Proust, le goût Sensation présente et retour de Combray La reconnaissance demande du travail. Woolf, la réception Une nouvelle croise deux journées Clarissa ne possède pas la vie de Septimus.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Le temps du geste et celui du récit</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Fragment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Durées réunies</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Limite de l’interprétation</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Woolf, le bas</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Mesure, impatience et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">pensées de la mère</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le geste fait sentir des</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">relations.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Proust, le goût</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Sensation présente et</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">retour de Combray</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La reconnaissance demande</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">du travail.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Woolf, la réception</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Une nouvelle croise deux</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">journées</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Clarissa ne possède pas la</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">vie de Septimus.</text>
</g>
</svg>
