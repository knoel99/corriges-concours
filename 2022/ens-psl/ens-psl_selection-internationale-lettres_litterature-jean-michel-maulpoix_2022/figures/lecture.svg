<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment un poème examine sa propre parole</title>
<desc id="description">Williams Les coupes d’un billet domestique Que fait cette excuse à son destinataire ? Ponge Des sons voisins autour du cageot Combien de temps l’image reste-t-elle juste ? Apollinaire L’ancien rejoint les signes de la ville Qui parle lorsqu’il se dit « tu » ?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment un poème examine sa propre parole</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Texte</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Procédé à entendre</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question de lecture</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Williams</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Les coupes d’un billet</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">domestique</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Que fait cette excuse à son</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">destinataire ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Ponge</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Des sons voisins autour du</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">cageot</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Combien de temps l’image</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">reste-t-elle juste ?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Apollinaire</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">L’ancien rejoint les</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">signes de la ville</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Qui parle lorsqu’il se dit</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">« tu » ?</text>
</g>
</svg>
