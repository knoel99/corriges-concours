<svg xmlns="http://www.w3.org/2000/svg" width="840" height="248" viewBox="0 0 840 248" role="img"><title>Une carte et deux façons de choisir</title><desc>La carte de Borges éclaire le désaccord sur les effets de la représentation.</desc><rect width="840" height="248" fill="#faf9f2"/><text x="25" y="36" fill="#193e46" font-size="25" font-family="DejaVu Sans" font-weight="bold" >Une carte et deux façons de choisir</text><rect x="23" y="60" width="793" height="48" fill="#e3ede8"/><text x="36" y="90" fill="#193e46" font-size="18" font-family="DejaVu Sans" font-weight="bold" >Doubler le terrain</text><text x="240" y="90" fill="#193e46" font-size="17" font-family="DejaVu Sans" font-weight="normal" >La carte à l’échelle du territoire ne guide plus le voyageur.</text><rect x="23" y="118" width="793" height="48" fill="#eee4d0"/><text x="36" y="148" fill="#193e46" font-size="18" font-family="DejaVu Sans" font-weight="bold" >Choisir un détail</text><text x="240" y="148" fill="#193e46" font-size="17" font-family="DejaVu Sans" font-weight="normal" >Une formulation retenue peut isoler ce qui passait inaperçu.</text><rect x="23" y="176" width="793" height="48" fill="#e3ede8"/><text x="36" y="206" fill="#193e46" font-size="18" font-family="DejaVu Sans" font-weight="bold" >Éprouver une page</text><text x="240" y="206" fill="#193e46" font-size="17" font-family="DejaVu Sans" font-weight="normal" >Quel écart entre la phrase lue et ce qu’on attendait ?</text></svg>
