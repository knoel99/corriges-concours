<svg xmlns="http://www.w3.org/2000/svg" width="880" height="304" viewBox="0 0 880 304" role="img"><title>À quoi reconnaît-on un style ?</title><desc>Le nom propre. Proust, Beckett et trois autres écrivains. La liste réunit cinq singularités de langues différentes. Le corps. Visage, silhouette, démarche. La reconnaissance passe du contour au mouvement. Le personnage. Une figure peut être « campée ».. Un être fait de mots peut prendre consistance.</desc><rect width="880" height="304" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="23" y="38" font-size="24" fill="#17394c" font-weight="bold">À quoi reconnaît-on un style ?</text><rect x="23" y="59" width="833" height="71" fill="#e6edef" stroke="none" stroke-width="1"/><rect x="23" y="59" width="7" height="71" fill="#92652f" stroke="none" stroke-width="1"/><text x="43" y="96" font-size="16" fill="#17394c" font-weight="bold">Le nom propre</text><text x="224" y="87" font-size="17" fill="#17394c" font-weight="bold">Proust, Beckett et trois autres écrivains</text><text x="224" y="112" font-size="15" fill="#17394c">La liste réunit cinq singularités de langues différentes.</text><rect x="23" y="139" width="833" height="71" fill="#e6edef" stroke="none" stroke-width="1"/><rect x="23" y="139" width="7" height="71" fill="#92652f" stroke="none" stroke-width="1"/><text x="43" y="176" font-size="16" fill="#17394c" font-weight="bold">Le corps</text><text x="224" y="167" font-size="17" fill="#17394c" font-weight="bold">Visage, silhouette, démarche</text><text x="224" y="192" font-size="15" fill="#17394c">La reconnaissance passe du contour au mouvement.</text><rect x="23" y="219" width="833" height="71" fill="#e6edef" stroke="none" stroke-width="1"/><rect x="23" y="219" width="7" height="71" fill="#92652f" stroke="none" stroke-width="1"/><text x="43" y="256" font-size="16" fill="#17394c" font-weight="bold">Le personnage</text><text x="224" y="247" font-size="17" fill="#17394c" font-weight="bold">Une figure peut être « campée ».</text><text x="224" y="272" font-size="15" fill="#17394c">Un être fait de mots peut prendre consistance.</text></g></svg>
