<svg xmlns="http://www.w3.org/2000/svg" width="900" height="422" viewBox="0 0 900 422" role="img"><title>Deux régimes de croissance en France</title><rect width="900" height="422" fill="#faf9f3"/><g font-family="DejaVu Sans,sans-serif" fill="#203b49">
<text x="26" y="42" font-size="26" font-weight="700">Deux régimes de croissance en France</text>
<text x="28" y="85" font-size="19" font-weight="400">Taux annuel moyen de croissance du PIB réel, en %.</text>
<text x="30" y="156" font-size="19" font-weight="400">1949–1974</text>
<rect x="203" y="132" width="498.2" height="32" fill="#00766d"/>
<text x="716.2" y="156" font-size="20" font-weight="700">5,3 %</text>
<text x="30" y="237" font-size="19" font-weight="400">1974–2007</text>
<rect x="203" y="213" width="206.8" height="32" fill="#ad6535"/>
<text x="424.8" y="237" font-size="20" font-weight="700">2,2 %</text>
<path d="M203 282 L767 282" stroke="#526c72" stroke-width="2" fill="none"/>
<path d="M203 279 L203 289" stroke="#526c72" stroke-width="2" fill="none"/>
<text x="199" y="310" font-size="16" font-weight="400">0</text>
<path d="M297 279 L297 289" stroke="#526c72" stroke-width="2" fill="none"/>
<text x="293" y="310" font-size="16" font-weight="400">1</text>
<path d="M391 279 L391 289" stroke="#526c72" stroke-width="2" fill="none"/>
<text x="387" y="310" font-size="16" font-weight="400">2</text>
<path d="M485 279 L485 289" stroke="#526c72" stroke-width="2" fill="none"/>
<text x="481" y="310" font-size="16" font-weight="400">3</text>
<path d="M579 279 L579 289" stroke="#526c72" stroke-width="2" fill="none"/>
<text x="575" y="310" font-size="16" font-weight="400">4</text>
<path d="M673 279 L673 289" stroke="#526c72" stroke-width="2" fill="none"/>
<text x="669" y="310" font-size="16" font-weight="400">5</text>
<path d="M767 279 L767 289" stroke="#526c72" stroke-width="2" fill="none"/>
<text x="763" y="310" font-size="16" font-weight="400">6</text>
<text x="28" y="365" font-size="19" font-weight="400">Les deux taux sont positifs. La seconde période est un ralentissement.</text>
<text x="28" y="396" font-size="16" font-weight="400">Source : Insee, données publiées avant la session de 2022.</text>
</g></svg>
