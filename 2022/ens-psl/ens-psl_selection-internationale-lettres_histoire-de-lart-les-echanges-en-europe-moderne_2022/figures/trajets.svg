<svg xmlns="http://www.w3.org/2000/svg" width="880" height="439" viewBox="0 0 880 439" role="img"><title>Des personnes, des œuvres et des usages en circulation</title><desc>Suite chronologique commentée. 1479 · Diplomatie — Venise → Constantinople. Gentile Bellini travaille à la cour de Mehmed II.. 1506 · Commande — Nuremberg → Venise. Dürer peint le retable pour San Bartolomeo.. 1606 · Collection — Venise → Prague. Le retable entre dans la collection de Rodolphe II.. Vers 1660 · Image — Chine → marché néerlandais. Kalf donne une place à la porcelaine dans la nature morte.. XVIIIe siècle · Objet — Porcelaine chinoise → monture parisienne. L’aiguière rejoint la collection de Louis XVI en 1782.</desc><rect width="880" height="439" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="39" font-size="25" fill="#17394c" font-weight="bold">Des personnes, des œuvres et des usages en circulation</text><rect x="24" y="59" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="59" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="88" font-size="17" fill="#17394c" font-weight="bold">1479 · Diplomatie</text><text x="256" y="87" font-size="18" fill="#17394c" font-weight="bold">Venise → Constantinople</text><text x="256" y="111" font-size="16" fill="#17394c">Gentile Bellini travaille à la cour de Mehmed II.</text><rect x="24" y="133" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="133" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="162" font-size="17" fill="#17394c" font-weight="bold">1506 · Commande</text><text x="256" y="161" font-size="18" fill="#17394c" font-weight="bold">Nuremberg → Venise</text><text x="256" y="185" font-size="16" fill="#17394c">Dürer peint le retable pour San Bartolomeo.</text><rect x="24" y="207" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="207" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="236" font-size="17" fill="#17394c" font-weight="bold">1606 · Collection</text><text x="256" y="235" font-size="18" fill="#17394c" font-weight="bold">Venise → Prague</text><text x="256" y="259" font-size="16" fill="#17394c">Le retable entre dans la collection de Rodolphe II.</text><rect x="24" y="281" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="281" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="310" font-size="17" fill="#17394c" font-weight="bold">Vers 1660 · Image</text><text x="256" y="309" font-size="18" fill="#17394c" font-weight="bold">Chine → marché néerlandais</text><text x="256" y="333" font-size="16" fill="#17394c">Kalf donne une place à la porcelaine dans la nature morte.</text><rect x="24" y="355" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="355" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="384" font-size="17" fill="#17394c" font-weight="bold">XVIIIe siècle · Objet</text><text x="256" y="383" font-size="18" fill="#17394c" font-weight="bold">Porcelaine chinoise → monture parisienne</text><text x="256" y="407" font-size="16" fill="#17394c">L’aiguière rejoint la collection de Louis XVI en 1782.</text></g></svg>
