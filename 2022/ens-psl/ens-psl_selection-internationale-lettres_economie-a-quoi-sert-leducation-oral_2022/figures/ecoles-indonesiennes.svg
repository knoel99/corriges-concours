<svg xmlns="http://www.w3.org/2000/svg" width="900" height="422" viewBox="0 0 900 422" role="img"><title>Ce que mesure le programme scolaire indonésien</title><rect width="900" height="422" fill="#faf9f3"/><g font-family="DejaVu Sans,sans-serif" fill="#203b49">
<text x="26" y="42" font-size="26" font-weight="700">Ce que mesure le programme scolaire indonésien</text>
<text x="28" y="82" font-size="19" font-weight="400">Une école primaire supplémentaire pour mille enfants dans la région de naissance.</text>
<text x="28" y="146" font-size="19" font-weight="700">Études</text>
<path d="M280 142 L595 142" stroke="#00766d" stroke-width="7" fill="none"/>
<path d="M280 132 L280 152" stroke="#00766d" stroke-width="2" fill="none"/>
<path d="M595 132 L595 152" stroke="#00766d" stroke-width="2" fill="none"/>
<text x="248" y="179" font-size="18" font-weight="700">0,12</text>
<text x="569" y="179" font-size="18" font-weight="700">0,19</text>
<text x="655" y="146" font-size="17" font-weight="400">année de scolarité</text>
<text x="28" y="232" font-size="19" font-weight="700">Salaires</text>
<path d="M280 228 L595 228" stroke="#00766d" stroke-width="7" fill="none"/>
<path d="M280 218 L280 238" stroke="#00766d" stroke-width="2" fill="none"/>
<path d="M595 218 L595 238" stroke="#00766d" stroke-width="2" fill="none"/>
<text x="248" y="265" font-size="18" font-weight="700">1,5 %</text>
<text x="569" y="265" font-size="18" font-weight="700">2,7 %</text>
<text x="655" y="232" font-size="17" font-weight="400">hausse du salaire</text>
<text x="28" y="326" font-size="19" font-weight="400">Fourchettes d’estimations pour deux résultats différents.</text>
<text x="28" y="356" font-size="19" font-weight="400">Les unités diffèrent. La longueur des segments ne compare pas les effets.</text>
<text x="28" y="397" font-size="16" font-weight="400">Source : E. Duflo, American Economic Review, 2001.</text>
</g></svg>
