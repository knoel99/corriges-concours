<svg xmlns="http://www.w3.org/2000/svg" width="810" height="278" viewBox="0 0 810 278" role="img" aria-labelledby="titre description"><title id="titre">Arbitrages à examiner avant d’aménager un quartier de vallée</title><desc id="description">Trois décisions lient réduction du risque et accès au logement, aux déplacements et aux décisions publiques.</desc><rect width="810" height="278" fill="#fff"/>
<rect x="9" y="12" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Localiser les logements</text>
<text x="167.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Comparer friches et secteurs de crue</text>
<rect x="384" y="12" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Qui reste exposé ou doit se déplacer ?</text>
<text x="592.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Mesurer le risque et le reste à charge.</text>
<path d="M330 48 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="100" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Relier le site aux emplois</text>
<text x="167.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Cheminements et services accessibles</text>
<rect x="384" y="100" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Qui peut atteindre ses destinations ?</text>
<text x="592.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Tester des horaires et aptitudes variés.</text>
<path d="M330 136 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="188" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Réserver des espaces perméables</text>
<text x="167.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Sols, ombre et usages des berges</text>
<rect x="384" y="188" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Qui bénéficie de l’aménagement ?</text>
<text x="592.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Suivre les usages, les loyers et la chaleur.</text>
<path d="M330 224 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
</svg>
