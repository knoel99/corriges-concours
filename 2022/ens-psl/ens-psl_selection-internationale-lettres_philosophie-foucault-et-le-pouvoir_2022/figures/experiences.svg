<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 194" role="img" aria-labelledby="titre desc">
<title id="titre">De la pratique de notation à la règle commune</title>
<desc id="desc">Des notes conservées en classe rendent possible un classement, qui peut être repris dans une règle de l’établissement. La règle modifie en retour les pratiques des professeurs.</desc>
<rect width="900" height="194" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="8" y="9" width="284" height="116" rx="6" fill="#e7eeef"/>
<text x="19" y="39" font-size="21" font-weight="bold" fill="#213d4c">Des notes</text>
<text x="19" y="74" font-size="19" font-weight="normal" fill="#213d4c">Un professeur consigne</text>
<text x="19" y="100" font-size="19" font-weight="normal" fill="#213d4c">les résultats.</text>
<rect x="305" y="9" width="284" height="116" rx="6" fill="#eeeae2"/>
<text x="316" y="39" font-size="21" font-weight="bold" fill="#213d4c">Un classement</text>
<text x="316" y="74" font-size="19" font-weight="normal" fill="#213d4c">Les résultats de chacun</text>
<text x="316" y="100" font-size="19" font-weight="normal" fill="#213d4c">deviennent comparables.</text>
<rect x="602" y="9" width="284" height="116" rx="6" fill="#e6eee7"/>
<text x="613" y="39" font-size="21" font-weight="bold" fill="#213d4c">Une règle</text>
<text x="613" y="74" font-size="19" font-weight="normal" fill="#213d4c">L’établissement adopte</text>
<text x="613" y="100" font-size="19" font-weight="normal" fill="#213d4c">la moyenne commune.</text>
<path d="M741 128 v16 H145 v-15 m -5 6 l 5 -6 l 5 6" fill="none" stroke="#3d6272" stroke-width="2"/>
<text x="110" y="178" font-size="20" font-weight="normal" fill="#213d4c">Une fois adoptée, la règle influence le choix des prochains exercices.</text>
</g>
</svg>
