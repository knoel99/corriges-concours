<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 191" role="img" aria-labelledby="titre desc">
<title id="titre">Deux formes de veille</title>
<desc id="desc">Le point commun est la perte de l’initiative. Dans l’insomnie la veille est anonyme, tandis que dans la veille éthique le sujet est appelé à répondre à autrui.</desc>
<rect width="900" height="191" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="8" y="10" width="429" height="166" rx="6" fill="#eeebe4"/>
<rect x="453" y="10" width="438" height="166" rx="6" fill="#e7eeef"/>
<text x="24" y="43" font-size="22" font-weight="bold" fill="#213d4c">Veiller sans pouvoir se retirer</text>
<text x="24" y="84" font-size="20" font-weight="normal" fill="#213d4c">Rien de particulier ne me retient.</text>
<text x="24" y="117" font-size="20" font-weight="normal" fill="#213d4c">L’existence persiste et je ne peux</text>
<text x="24" y="145" font-size="20" font-weight="normal" fill="#213d4c">prendre congé de cette présence.</text>
<text x="470" y="43" font-size="22" font-weight="bold" fill="#213d4c">Veiller pour quelqu’un</text>
<text x="470" y="84" font-size="20" font-weight="normal" fill="#213d4c">Autrui m’appelle.</text>
<text x="470" y="117" font-size="20" font-weight="normal" fill="#213d4c">Sa demande m’atteint avant même</text>
<text x="470" y="145" font-size="20" font-weight="normal" fill="#213d4c">que j’aie choisi d’y répondre.</text>
</g>
</svg>
