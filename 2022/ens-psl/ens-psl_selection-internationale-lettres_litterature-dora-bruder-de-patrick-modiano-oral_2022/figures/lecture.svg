<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Trois seuils et trois rapports au passé</title>
<desc id="description">Hôtel et écoles L’adresse et l’étage avant la guerre La fenêtre exacte et le registre scolaire. État civil Une date et un lieu de naissance Le demandeur n’a pas de case de parenté. Palais de Justice Des coordonnées, puis un contrôle Le document demandé n’apparaît pas dans l’extrait.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois seuils et trois rapports au passé</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Seuil</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Donnée obtenue</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui reste en suspens</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Hôtel et écoles</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">L’adresse et l’étage avant</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">la guerre</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La fenêtre exacte et le</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">registre scolaire.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">État civil</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Une date et un lieu de</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">naissance</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le demandeur n’a pas de</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">case de parenté.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Palais de Justice</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Des coordonnées, puis un</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">contrôle</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le document demandé</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">n’apparaît pas dans</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">l’extrait.</text>
</g>
</svg>
