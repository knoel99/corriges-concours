<svg xmlns="http://www.w3.org/2000/svg" width="900" height="422" viewBox="0 0 900 422" role="img"><title>Deux trajectoires pour une même hausse du PIB</title><rect width="900" height="422" fill="#faf9f3"/><g font-family="DejaVu Sans,sans-serif" fill="#203b49">
<text x="26" y="42" font-size="26" font-weight="700">Deux trajectoires pour une même hausse du PIB</text>
<text x="28" y="81" font-size="19" font-weight="400">PIB réel +2 % dans les deux cas. Émissions initiales fixées à l’indice 100.</text>
<text x="28" y="147" font-size="19" font-weight="400">Intensité −1 %</text>
<path d="M285 140 L735 140" stroke="#c8d0cd" stroke-width="2" fill="none"/>
<path d="M510 140 L617.8000000000004 140" stroke="#ad6535" stroke-width="10" fill="none"/>
<circle cx="617.8000000000004" cy="140" r="9" fill="#ad6535"/>
<text x="594.8000000000004" y="176" font-size="17" font-weight="700">100,98</text>
<text x="28" y="230" font-size="19" font-weight="400">Intensité −3 %</text>
<path d="M285 223 L735 223" stroke="#c8d0cd" stroke-width="2" fill="none"/>
<path d="M510 223 L393.39999999999975 223" stroke="#00766d" stroke-width="10" fill="none"/>
<circle cx="393.39999999999975" cy="223" r="9" fill="#00766d"/>
<text x="370.39999999999975" y="259" font-size="17" font-weight="700">98,94</text>
<path d="M510 100 L510 254" stroke="#394550" stroke-width="2" fill="none"/>
<text x="475" y="287" font-size="17" font-weight="400">Base 100</text>
<text x="28" y="335" font-size="19" font-weight="400">Avec une baisse de 1 %, les émissions augmentent encore de 0,98 %.</text>
<text x="28" y="372" font-size="19" font-weight="400">Avec une baisse de 3 %, les émissions diminuent de 1,06 %.</text>
</g></svg>
