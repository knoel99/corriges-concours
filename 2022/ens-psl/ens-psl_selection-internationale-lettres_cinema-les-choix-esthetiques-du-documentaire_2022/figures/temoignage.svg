<svg xmlns="http://www.w3.org/2000/svg" width="880" height="365" viewBox="0 0 880 365" role="img"><title>Marceline dans Chronique d’un été</title><desc>Suite chronologique commentée. Situation — Une marche dans le Paris présent. Le film donne à Marceline les conditions d’une adresse.. Mémoire — Une fille s’adresse à son père disparu. La personne filmée est la source de sa propre parole.. Forme — Voix proche, silhouette parfois éloignée. Le son et l’image construisent deux distances différentes.. Discussion — Les participants confrontent leurs impressions. Leur réception fait à son tour partie du documentaire.</desc><rect width="880" height="365" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="39" font-size="25" fill="#17394c" font-weight="bold">Marceline dans Chronique d’un été</text><rect x="24" y="59" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="59" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="88" font-size="17" fill="#17394c" font-weight="bold">Situation</text><text x="256" y="87" font-size="18" fill="#17394c" font-weight="bold">Une marche dans le Paris présent</text><text x="256" y="111" font-size="16" fill="#17394c">Le film donne à Marceline les conditions d’une adresse.</text><rect x="24" y="133" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="133" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="162" font-size="17" fill="#17394c" font-weight="bold">Mémoire</text><text x="256" y="161" font-size="18" fill="#17394c" font-weight="bold">Une fille s’adresse à son père disparu</text><text x="256" y="185" font-size="16" fill="#17394c">La personne filmée est la source de sa propre parole.</text><rect x="24" y="207" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="207" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="236" font-size="17" fill="#17394c" font-weight="bold">Forme</text><text x="256" y="235" font-size="18" fill="#17394c" font-weight="bold">Voix proche, silhouette parfois éloignée</text><text x="256" y="259" font-size="16" fill="#17394c">Le son et l’image construisent deux distances différentes.</text><rect x="24" y="281" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="281" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="310" font-size="17" fill="#17394c" font-weight="bold">Discussion</text><text x="256" y="309" font-size="18" fill="#17394c" font-weight="bold">Les participants confrontent leurs impressions</text><text x="256" y="333" font-size="16" fill="#17394c">Leur réception fait à son tour partie du documentaire.</text></g></svg>
