<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" role="img" aria-labelledby="titre desc">
<title id="titre">Trois réponses possibles au démon</title>
<desc id="desc">Le retour concerne toute la vie dans le même ordre. Le regret, la résignation et l’affirmation donnent trois sens différents à la réponse du lecteur.</desc>
<rect width="900" height="176" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="8" y="11" width="284" height="150" rx="6" fill="#f2e8dd"/>
<text x="21" y="47" font-size="22" font-weight="bold" fill="#213d4c">Choisir les joies</text>
<text x="21" y="91" font-size="20" font-weight="normal" fill="#213d4c">Je garderais ce moment</text>
<text x="21" y="124" font-size="20" font-weight="normal" fill="#213d4c">en effaçant les autres.</text>
<rect x="305" y="11" width="284" height="150" rx="6" fill="#e9eeef"/>
<text x="318" y="47" font-size="22" font-weight="bold" fill="#213d4c">Se résigner</text>
<text x="318" y="91" font-size="20" font-weight="normal" fill="#213d4c">Je le subirais puisqu’il</text>
<text x="318" y="124" font-size="20" font-weight="normal" fill="#213d4c">doit revenir.</text>
<rect x="602" y="11" width="284" height="150" rx="6" fill="#e6eee7"/>
<text x="615" y="47" font-size="22" font-weight="bold" fill="#213d4c">Apposer le sceau</text>
<text x="615" y="91" font-size="20" font-weight="normal" fill="#213d4c">Je voudrais cette vie</text>
<text x="615" y="124" font-size="20" font-weight="normal" fill="#213d4c">avec tout son parcours.</text>
</g>
</svg>
