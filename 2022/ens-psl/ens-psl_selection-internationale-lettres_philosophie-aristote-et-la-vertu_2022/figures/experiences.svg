<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 193" role="img" aria-labelledby="titre desc">
<title id="titre">Trois conditions pour agir en personne juste</title>
<desc id="desc">Le geste observé est identique. Il faut encore savoir si l’agent comprend son acte, le choisit pour lui-même et agit selon une disposition stable.</desc>
<rect width="900" height="193" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="14" y="34" font-size="23" font-weight="bold" fill="#213d4c">Un commerçant rend exactement la somme due.</text>
<rect x="8" y="53" width="284" height="126" rx="6" fill="#e7eeef"/>
<text x="20" y="86" font-size="21" font-weight="bold" fill="#213d4c">Savoir</text>
<text x="20" y="124" font-size="20" font-weight="normal" fill="#213d4c">Il connaît la somme</text>
<text x="20" y="152" font-size="20" font-weight="normal" fill="#213d4c">qu’il doit rendre.</text>
<rect x="305" y="53" width="284" height="126" rx="6" fill="#f0e9df"/>
<text x="317" y="86" font-size="21" font-weight="bold" fill="#213d4c">Choisir</text>
<text x="317" y="124" font-size="20" font-weight="normal" fill="#213d4c">Il rend la somme parce</text>
<text x="317" y="152" font-size="20" font-weight="normal" fill="#213d4c">que cela est juste.</text>
<rect x="602" y="53" width="284" height="126" rx="6" fill="#e6eee7"/>
<text x="614" y="86" font-size="21" font-weight="bold" fill="#213d4c">Avoir un caractère</text>
<text x="614" y="124" font-size="20" font-weight="normal" fill="#213d4c">Il agit ainsi même</text>
<text x="614" y="152" font-size="20" font-weight="normal" fill="#213d4c">sans surveillance.</text>
</g>
</svg>
