<svg xmlns="http://www.w3.org/2000/svg" width="700" height="239" viewBox="0 0 700 239" role="img" aria-labelledby="titre description">
<title id="titre">Poids dans les actifs et dans les émissions pendulaires</title>
<desc id="description">Dans le périmètre étudié, les actifs interurbains comptent pour 9 % des actifs et 29 % des émissions pendulaires. Les périurbains en représentent respectivement 15 et 24 %.</desc>
<rect width="700" height="239" fill="white"/>
<g font-family="DejaVu Sans,sans-serif" fill="#24354a">
<rect x="170" y="14" width="20" height="12" fill="#265b78"/><text x="197" y="26" font-size="16">Part des actifs</text>
<rect x="347" y="14" width="20" height="12" fill="#aa5126"/><text x="375" y="26" font-size="16">Part des émissions pendulaires</text>
<path d="M166 50 V185 M316 50 V185 M466 50 V185 M616 50 V185" fill="none" stroke="#d8dde3"/>
<text x="153" y="90" text-anchor="end" font-size="18">Interurbains</text>
<rect x="166" y="60" width="135" height="19" fill="#265b78"/><text x="310" y="76" font-size="16">9 %</text>
<rect x="166" y="83" width="435" height="19" fill="#aa5126"/><text x="610" y="98" font-size="16">29 %</text>
<text x="153" y="159" text-anchor="end" font-size="18">Périurbains</text>
<rect x="166" y="129" width="225" height="19" fill="#265b78"/><text x="400" y="145" font-size="16">15 %</text>
<rect x="166" y="152" width="360" height="19" fill="#aa5126"/><text x="535" y="168" font-size="16">24 %</text>
<g font-size="15" text-anchor="middle"><text x="166" y="202">0 %</text><text x="316" y="202">10 %</text><text x="466" y="202">20 %</text><text x="616" y="202">30 %</text></g>
<text x="350" y="228" text-anchor="middle" font-size="14">Données citées par Jean-Pierre Orfeuil, Constructif, n° 57, 2020, p. 20.</text>
</g></svg>
