<svg xmlns="http://www.w3.org/2000/svg" width="900" height="422" viewBox="0 0 900 422" role="img"><title>Deux possibilités de réduction, un prix de 50 euros</title><rect width="900" height="422" fill="#faf9f3"/><g font-family="DejaVu Sans,sans-serif" fill="#203b49">
<text x="26" y="42" font-size="26" font-weight="700">Deux possibilités de réduction, un prix de 50 euros</text>
<text x="28" y="85" font-size="19" font-weight="400">Exemple hypothétique. Coût pour éviter une tonne de CO₂.</text>
<text x="25" y="162" font-size="19" font-weight="400">Établissement A</text>
<rect x="246" y="140" width="138.0" height="30" fill="#00766d"/>
<text x="397.0" y="161" font-size="18" font-weight="700">20 €</text>
<text x="25" y="228" font-size="19" font-weight="400">Établissement B</text>
<rect x="246" y="206" width="483.0" height="30" fill="#ad6535"/>
<text x="742.0" y="227" font-size="18" font-weight="700">70 €</text>
<path d="M591 112 L591 257" stroke="#33303c" stroke-width="3" fill="none"/>
<text x="534" y="104" font-size="16" font-weight="700">Taxe : 50 €</text>
<text x="28" y="298" font-size="19" font-weight="400">A réduit sa tonne pour 20 €. B préfère acquitter 50 € plutôt que dépenser 70 €.</text>
<text x="28" y="352" font-size="19" font-weight="400">Le taux illustratif oriente les réductions vers les coûts les plus faibles.</text>
<text x="28" y="386" font-size="16" font-weight="400">Le dommage climatique marginal n’est pas estimé par cet exemple.</text>
</g></svg>
