<svg xmlns="http://www.w3.org/2000/svg" width="880" height="301" viewBox="0 0 880 301" role="img"><title>Trois affirmations à l’épreuve des traces</title><desc>Comparaison de lectures. Califat de Cordoue : 1031 · Fait politique ; La disparition du califat se distingue d’un bilan des savoirs.. Renaissance : Périodisation à éprouver ; Le jugement change si l’on compare d’autres positions sociales.. Martin Guerre : Mobile privé incertain ; Une décision judiciaire ne prouve pas l’intention de Bertrande.</desc><rect width="880" height="301" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="21" y="37" font-size="25" fill="#17394c" font-weight="bold">Trois affirmations à l’épreuve des traces</text><rect x="24" y="61" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="61" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="89" font-size="16" fill="#17394c" font-weight="bold">Califat de Cordoue</text><text x="240" y="86" font-size="18" fill="#17394c" font-weight="bold">1031 · Fait politique</text><text x="240" y="111" font-size="15" fill="#17394c">La disparition du califat se distingue d’un bilan des savoirs.</text><rect x="24" y="136" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="136" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="164" font-size="16" fill="#17394c" font-weight="bold">Renaissance</text><text x="240" y="161" font-size="18" fill="#17394c" font-weight="bold">Périodisation à éprouver</text><text x="240" y="186" font-size="15" fill="#17394c">Le jugement change si l’on compare d’autres positions sociales.</text><rect x="24" y="211" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="211" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="239" font-size="16" fill="#17394c" font-weight="bold">Martin Guerre</text><text x="24