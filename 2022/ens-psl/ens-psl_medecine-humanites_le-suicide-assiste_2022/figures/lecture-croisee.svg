<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 245" width="780" height="245" role="img" aria-labelledby="titre exp"><title id="titre">Quelles voix entend-on dans une décision dite personnelle ?</title><desc id="exp">Le dossier met en regard les mots d’une demande, les conditions sociales du choix et ses effets sur d’autres personnes.</desc><rect width="780" height="245" rx="14" fill="#f6f4ed"/>
<text x="23" y="37" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#163635">Quelles voix entend-on dans une décision dite personnelle ?</text>
<rect x="20" y="49" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="49" width="5" height="58" fill="#176a63"/>
<text x="38" y="73" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Nommer</text>
<text x="233" y="71" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Lunel suit l’histoire des mots. L’Ifop mesure des réponses</text>
<text x="233" y="92" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">à plusieurs formulations.</text>
<rect x="20" y="112" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="112" width="5" height="58" fill="#176a63"/>
<text x="38" y="136" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Faire entendre</text>
<text x="233" y="134" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Bernheim montre les écarts entre une parole adressée à ses</text>
<text x="233" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">filles et une parole enregistrée.</text>
<rect x="20" y="175" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="175" width="5" height="58" fill="#176a63"/>
<text x="38" y="199" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Rendre accessible</text>
<text x="233" y="197" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">La caricature interroge l’accès au soutien. La tribune</text>
<text x="233" y="218" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">fait entendre proches et soignants.</text>
</svg>
