<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Ce que conserve et déplace une réécriture</title>
<desc id="description">Cassandre Troie vaincue et la parole sans secours Comment apprend-on à juger sa propre cité ? Médée L’étrangère à Corinthe et la mort des enfants Qui a imposé la mémoire du crime ? Antigone Le frère sans sépulture et le refus Quel bonheur supposerait le consentement ?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Ce que conserve et déplace une réécriture</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Figure</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Cadre reconnaissable</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question rendue possible</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Cassandre</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Troie vaincue et la parole</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">sans secours</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Comment apprend-on à juger</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">sa propre cité ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Médée</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">L’étrangère à Corinthe et</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">la mort des enfants</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Qui a imposé la mémoire du</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">crime ?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Antigone</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le frère sans sépulture et</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">le refus</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Quel bonheur supposerait le</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">consentement ?</text>
</g>
</svg>
