<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Que signifie le changement de nom dans The Beano ?</title>
<desc id="description">Décision Le magazine Le nom du personnage cesse de le définir par son apparence. Critique Un tabloïd et un élu Ils y voient une concession aux sensibilités du moment. Approbation La dermatologue Refuser la banalisation des sobriquets peut protéger les jeunes lecteurs.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que signifie le changement de nom dans The Beano ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Interlocuteur</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Portée</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Décision</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le magazine</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le nom du personnage cesse</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">de le définir par son</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">apparence.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Critique</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Un tabloïd et un élu</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Ils y voient une concession</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">aux sensibilités du moment.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Approbation</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">La dermatologue</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Refuser la banalisation des</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">sobriquets peut protéger</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">les jeunes lecteurs.</text>
</g>
</svg>
