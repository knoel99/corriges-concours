<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Qui donne forme à la voix de l’enfant ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Qui donne forme à la voix de l’enfant ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Un témoin</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Devant l’empereur, une voix isolée change</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">le sens du spectacle.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">Le conte</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Un élève</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">Le gouverneur construit la situation où son</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">élève jugera par lui-même.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Le traité</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Un ancien enfant</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Le narrateur adulte retrouve la logique</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">d’une initiative enfantine.</text>
<text x="549" y="189" font-size="14" font-weight="700" fill="#203c49">L’autobiographie</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
