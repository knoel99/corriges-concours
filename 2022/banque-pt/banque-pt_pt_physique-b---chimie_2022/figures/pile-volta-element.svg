<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="sans-serif" font-size="14"><rect width="100%" height="100%" fill="white"/><defs><marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b3261e"/></marker><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1a5fb4"/></marker></defs><text x="20.0" y="26.0" text-anchor="start" font-size="16" fill="#222" >Un élément de la pile de Volta en fonctionnement</text><rect x="170" y="150" width="300" height="34" fill="#d9894a" stroke="#7a431b" stroke-width="1.5"/><text x="320.0" y="172.0" text-anchor="middle" font-size="14" fill="#fff" >disque de cuivre : cathode, pôle +</text><rect x="170" y="184" width="300" height="110" fill="#efe6c8" stroke="#8a7c46" stroke-width="1.5"/><text x="320.0" y="208.0" text-anchor="middle" font-size="13" fill="#222" >carton imbibé de H₂SO₄(aq)</text><rect x="170" y="294" width="300" height="34" fill="#9aa3ad" stroke="#555" stroke-width="1.5"/><text x="320.0" y="316.0" text-anchor="middle" font-size="14" fill="#111" >disque de zinc : anode, pôle −</text><line x1="230.0" y1="280.0" x2="230.0" y2="222.0" stroke="#b3261e" stroke-width="1.8" marker-end="url(#fr)"/><text x="238.0" y="262.0" text-anchor="start" font-size="13" fill="#b3261e" >H⁺, Zn²⁺</text><line x1="410.0" y1="222.0" x2="410.0" y2="280.0" stroke="#1a5fb4" stroke-width="1.8" marker-end="url(#fb)"/><text x="402.0" y="262.0" text-anchor="end" font-size="13" fill="#1a5fb4" >SO₄²⁻</text><line x1="320.0" y1="222.0" x2="320.0" y2="280.0" stroke="#b3261e" stroke-width="1.8" marker-start="url(#fr)"/><text x="326.0" y="250.0" text-anchor="start" font-size="13" fill="#b3261e" >I</text><circle cx="190" cy="196" r="5" fill="white" stroke="#555"/><circle cx="455" cy="198" r="5" fill="white" stroke="#555"/><circle cx="200" cy="212" r="5" fill="white" stroke="#555"/><circle cx="445" cy="214" r="5" fill="white" stroke="#555"/><text x="150.0" y="205.0" text-anchor="end" font-size="13" fill="#222" >H₂(g)</text><path d="M470,167 L600,167 L600,205" fill="none" stroke="#222" stroke-width="2"/><path d="M600,275 L600,311 L470,311" fill="none" stroke="#222" stroke-width="2"/><rect x="585" y="205" width="30" height="70" fill="white" stroke="#222" stroke-width="2"/><text x="625.0" y="245.0" text-anchor="start" font-size="13" fill="#222" >R (circuit extérieur)</text><line x1="500.0" y1="152.0" x2="560.0" y2="152.0" stroke="#b3261e" stroke-width="2" marker-end="url(#fr)"/><text x="530.0" y="142.0" text-anchor="middle" font-size="14" fill="#b3261e" >I</text><line x1="560.0" y1="327.0" x2="500.0" y2="327.0" stroke="#b3261e" stroke-width="2" marker-end="url(#fr)"/><text x="530.0" y="346.0" text-anchor="middle" font-size="14" fill="#b3261e" >I</text><line x1="560.0" y1="181.0" x2="500.0" y2="181.0" stroke="#1a5fb4" stroke-width="2" marker-end="url(#fb)"/><text x="530.0" y="199.0" text-anchor="middle" font-size="14" fill="#1a5fb4" >e⁻</text><line x1="500.0" y1="297.0" x2="560.0" y2="297.0" stroke="#1a5fb4" stroke-width="2" marker-end="url(#fb)"/><text x="530.0" y="290.0" text-anchor="middle" font-size="14" fill="#1a5fb4" >e⁻</text><text x="170.0" y="110.0" text-anchor="start" font-size="14" fill="#1a5fb4" >Sur le cuivre (réduction) : 2 H⁺(aq) + 2 e⁻ = H₂(g)</text><text x="170.0" y="372.0" text-anchor="start" font-size="14" fill="#b3261e" >Sur le zinc (oxydation) : Zn(s) = Zn²⁺(aq) + 2 e⁻</text><text x="170.0" y="410.0" text-anchor="start" font-size="14" fill="#222" >Bilan : Zn(s) + 2 H⁺(aq) = Zn²⁺(aq) + H₂(g). Le cuivre n'est pas consommé.</text><text x="170.0" y="70.0" text-anchor="start" font-size="13" fill="#222" >Dans le circuit extérieur, le courant va du cuivre vers le zinc ;</text><text x="170.0" y="88.0" text-anchor="start" font-size="13" fill="#222" >dans le carton, il est porté par les ions et va du zinc vers le cuivre.</text></svg>
