<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" font-family="sans-serif" font-size="14"><rect width="100%" height="100%" fill="white"/><defs><marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b3261e"/></marker><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1a5fb4"/></marker></defs><text x="20.0" y="26.0" text-anchor="start" font-size="16" fill="#222" >Titrage conductimétrique des ions baryum : allure de G = f(V)</text><line x1="100.0" y1="360.0" x2="720.0" y2="360.0" stroke="#222" stroke-width="1.5" marker-end="url(#fn)"/><line x1="100.0" y1="360.0" x2="100.0" y2="70.0" stroke="#222" stroke-width="1.5" marker-end="url(#fn)"/><text x="720.0" y="398.0" text-anchor="end" font-size="14" fill="#222" >V versé (mL)</text><text x="90.0" y="65.0" text-anchor="start" font-size="14" fill="#222" >G (unité arbitraire)</text><line x1="100.0" y1="360.0" x2="100.0" y2="365.0" stroke="#222" stroke-width="1.5" /><text x="100.0" y="380.0" text-anchor="middle" font-size="13" fill="#222" >0</text><line x1="236.4" y1="360.0" x2="236.4" y2="365.0" stroke="#222" stroke-width="1.5" /><text x="236.4" y="380.0" text-anchor="middle" font-size="13" fill="#222" >5</text><line x1="400.0" y1="360.0" x2="400.0" y2="365.0" stroke="#222" stroke-width="1.5" /><text x="400.0" y="380.0" text-anchor="middle" font-size="13" fill="#222" >11,0</text><line x1="509.1" y1="360.0" x2="509.1" y2="365.0" stroke="#222" stroke-width="1.5" /><text x="509.1" y="380.0" text-anchor="middle" font-size="13" fill="#222" >15</text><line x1="645.5" y1="360.0" x2="645.5" y2="365.0" stroke="#222" stroke-width="1.5" /><text x="645.5" y="380.0" text-anchor="middle" font-size="13" fill="#222" >20</text><polyline points="100.0,225.0 400.0,240.0 700.0,110.0" fill="none" stroke="#1a5fb4" stroke-width="2.5"/><line x1="400.0" y1="240.0" x2="400.0" y2="360.0" stroke="#b3261e" stroke-width="1.3" stroke-dasharray="5 4"/><circle cx="400.0" cy="240.0" r="4.5" fill="#b3261e"/><text x="408.0" y="300.0" text-anchor="start" font-size="13" fill="#b3261e" >équivalence</text><text x="408.0" y="317.0" text-anchor="start" font-size="13" fill="#b3261e" >Véq = 11,0 mL</text><text x="127.3" y="180.0" text-anchor="start" font-size="13" fill="#222" >avant l'équivalence : Ba²⁺ remplacé</text><text x="127.3" y="197.0" text-anchor="start" font-size="13" fill="#222" >par 2 Na⁺, pente ∝ 2×5 − 13 = −3</text><text x="686.4" y="225.0" text-anchor="end" font-size="13" fill="#222" >après : Na⁺ et SO₄²⁻</text><text x="686.4" y="242.0" text-anchor="end" font-size="13" fill="#222" >s'accumulent,</text><text x="686.4" y="259.0" text-anchor="end" font-size="13" fill="#222" >pente ∝ 2×5 + 16 = +26</text></svg>
