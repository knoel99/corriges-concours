<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="sans-serif" font-size="14"><rect width="100%" height="100%" fill="white"/><defs><marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b3261e"/></marker><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1a5fb4"/></marker></defs><text x="20.0" y="26.0" text-anchor="start" font-size="15" fill="#222" >Quantité de dioxyde de carbone dans l'enceinte en fonction du volume (298 K)</text><line x1="110.0" y1="330.0" x2="700.0" y2="330.0" stroke="#222" stroke-width="1.5" marker-end="url(#fn)"/><line x1="110.0" y1="330.0" x2="110.0" y2="55.0" stroke="#222" stroke-width="1.5" marker-end="url(#fn)"/><text x="700.0" y="352.0" text-anchor="end" font-size="14" fill="#222" >V</text><text x="98.0" y="58.0" text-anchor="end" font-size="14" fill="#222" >n(CO₂)</text><polyline points="110,330 380,130 670,130" fill="none" stroke="#1a5fb4" stroke-width="2.5"/><line x1="110.0" y1="130.0" x2="380.0" y2="130.0" stroke="#888" stroke-width="1" stroke-dasharray="5 4"/><line x1="380.0" y1="130.0" x2="380.0" y2="330.0" stroke="#888" stroke-width="1" stroke-dasharray="5 4"/><text x="100.0" y="135.0" text-anchor="end" font-size="14" fill="#222" >1 mol</text><text x="100.0" y="335.0" text-anchor="end" font-size="14" fill="#222" >0</text><text x="380.0" y="352.0" text-anchor="middle" font-size="13" fill="#222" >V limite = n₀RT / Péq ≈ 5·10³⁶ m³</text><circle cx="380" cy="130" r="4.5" fill="#1a5fb4"/><text x="395.0" y="262.0" text-anchor="start" font-size="13" fill="#222" >équilibre établi :</text><text x="395.0" y="280.0" text-anchor="start" font-size="13" fill="#222" >P(CO₂) = Péq,  n = Péq V / (RT)</text><text x="420.0" y="160.0" text-anchor="start" font-size="13" fill="#222" >rupture d'équilibre : BaCO₃ épuisé,</text><text x="420.0" y="178.0" text-anchor="start" font-size="13" fill="#222" >n = 1 mol et P(CO₂) = n₀RT / V</text></svg>
