<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" width="700" height="390" font-family="sans-serif" font-size="14">
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
<rect x="0" y="0" width="700" height="390" fill="#ffffff"/>
<line x1="60.0" y1="190.0" x2="650.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
<line x1="350.0" y1="350.0" x2="350.0" y2="30.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
<text x="655.0" y="210.0" text-anchor="end" fill="#1a1a1a" font-size="14" font-style="italic">ε = V₊ − V₋</text>
<text x="360.0" y="40.0" text-anchor="start" fill="#1a1a1a" font-size="14" font-style="italic">Vs</text>
<polyline fill="none" stroke="#1f5fbf" stroke-width="2.6" stroke-linejoin="round" points="70.0,300.0 280.0,300.0 420.0,80.0 630.0,80.0"/>
<line x1="350.0" y1="80.0" x2="420.0" y2="80.0" stroke="#666666" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="350.0" y1="300.0" x2="280.0" y2="300.0" stroke="#666666" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="420.0" y1="190.0" x2="420.0" y2="80.0" stroke="#666666" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="280.0" y1="190.0" x2="280.0" y2="300.0" stroke="#666666" stroke-width="1" stroke-dasharray="4 4"/>
<text x="342.0" y="85.0" text-anchor="end" fill="#1a1a1a" font-size="14">+Vsat = +15 V</text>
<text x="358.0" y="305.0" text-anchor="start" fill="#1a1a1a" font-size="14">−Vsat = −15 V</text>
<text x="420.0" y="210.0" text-anchor="middle" fill="#1a1a1a" font-size="13">+Vsat/μ₀ ≈ +150 μV</text>
<text x="280.0" y="180.0" text-anchor="middle" fill="#1a1a1a" font-size="13">−150 μV</text>
<text x="530.0" y="68.0" text-anchor="middle" fill="#1f5fbf" font-size="14">saturation haute</text>
<text x="170.0" y="322.0" text-anchor="middle" fill="#1f5fbf" font-size="14">saturation basse</text>
<text x="398.0" y="142.0" text-anchor="start" fill="#c0392b" font-size="14">régime linéaire</text>
<text x="398.0" y="160.0" text-anchor="start" fill="#c0392b" font-size="14">Vs = μ₀ ε, μ₀ ≈ 10⁵</text>
<text x="350.0" y="375.0" text-anchor="middle" fill="#666666" font-size="13">L'axe des abscisses est gradué en microvolts, celui des ordonnées en volts.</text>
</svg>
