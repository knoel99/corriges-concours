<svg xmlns="http://www.w3.org/2000/svg" width="810" height="315" viewBox="0 0 810 315" role="img"><title>Deux contraintes actives au minimum</title><desc>Dans le premier quadrant, la demi-droite de coût coupe le domaine admissible en son sommet (2, 0).</desc><rect width="810" height="315" fill="#fbfaf5"/><g font-family="DejaVu Sans" fill="#183949"><text x="20" y="31" font-size="23" font-weight="bold">Deux contraintes actives au minimum</text><path d="M 60 150 L 240 255 H 420 V 67 H 60 Z" fill="#d2ebe5"/><path d="M 60 150 L 240 255" fill="none" stroke="#197469" stroke-width="4"/><path d="M 60 185 L 240 255" fill="none" stroke="#af581e" stroke-width="3" stroke-dasharray="7 4"/><path d="M 60 55 V 255 H 435" fill="none" stroke="#344654" stroke-width="2"/><g font-size="16"><text x="32" y="260">0</text><text x="34" y="155">1</text><text x="233" y="279">2</text><text x="426" y="278">x₁</text><text x="40" y="56">x₂</text><text x="181" y="112">Domaine admissible</text></g><circle cx="240" cy="255" r="6" fill="#243b46"/><g font-size="18"><text x="472" y="100" fill="#197469">Frontière : x₁ + 2x₂ = 2</text><text x="472" y="150" fill="#934413">Coût minimal : x₁ + 3x₂ = 2</text><text x="472" y="219">Point de contact : (2, 0)</text></g></g></svg>