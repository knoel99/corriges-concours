<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">What counts as access to education?</title>
<desc id="description">Chart, April 2020 Internet and broadcast support different responses National provision does not measure individual attainment Virtual courses Reach particular learners or share a rare course Equipment, attention and isolation vary Platforms Continue lessons and reduce some routine tasks Data use and dependence affect public control Experience beyond tests Creative work and renewed family contact Teachers need time to recognise those gains</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What counts as access to education?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Evidence</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Opportunity</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Limit to check</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Chart, April 2020</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Internet and broadcast</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">support different</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">responses</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">National provision does not</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">measure individual</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">attainment</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Virtual courses</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Reach particular learners</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">or share a rare course</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Equipment, attention and</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">isolation vary</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Platforms</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Continue lessons and</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">reduce some routine tasks</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Data use and dependence</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">affect public control</text>
<rect x="10" y="315" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">Experience beyond</text>
<text x="24" y="362" font-size="15" font-weight="700" fill="#162d3b">tests</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">Creative work and renewed</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">family contact</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Teachers need time to</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">recognise those gains</text>
</g>
</svg>
