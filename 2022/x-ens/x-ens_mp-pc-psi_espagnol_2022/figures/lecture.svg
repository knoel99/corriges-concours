<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Cuba en 2021, trois questions à distinguer</title>
<desc id="description">D’où vient la crise ? Modèle intérieur, embargo, Venezuela et pandémie Les causes ne s’excluent pas Où circulent les images ? Téléphones à La Havane, pancarte à Miami Le relais extérieur ne prouve pas la direction du mouvement Qui peut manifester ? Marche annoncée pour novembre et droit constitutionnel La visibilité ne mesure pas les soutiens électoraux</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Cuba en 2021, trois questions à distinguer</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Éléments du dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Limite d’interprétation</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">D’où vient la crise ?</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Modèle intérieur, embargo,</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Venezuela et pandémie</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les causes ne s’excluent</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">pas</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Où circulent les</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">images ?</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Téléphones à La Havane,</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">pancarte à Miami</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le relais extérieur ne</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">prouve pas la direction du</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">mouvement</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Qui peut manifester ?</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Marche annoncée pour</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">novembre et droit</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">constitutionnel</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La visibilité ne mesure pas</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">les soutiens électoraux</text>
</g>
</svg>
