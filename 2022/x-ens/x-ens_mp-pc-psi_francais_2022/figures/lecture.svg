<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">Qui donne un nom à ce qui arrive ?</title>
<desc id="description">L’enfant tend la main chez Rousseau Un adulte peut y lire un ordre L’expérience de la distance se forme encore L’empereur défile chez Andersen Un enfant nomme sa nudité Il ne nomme pas la portée politique de son constat Le narrateur d’Aké nomme ses parents Le surnom fixe une relation familière Son sens change d’une expérience à l’autre Les allumettes sont brûlées Les passants comprennent le besoin de chaleur Le lecteur seul accompagne chaque vision</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui donne un nom à ce qui arrive ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Scène</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Désignation disponible</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’elle laisse échapper</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">L’enfant tend la main</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">chez Rousseau</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un adulte peut y lire un</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">ordre</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’expérience de la distance</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">se forme encore</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">L’empereur défile</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">chez Andersen</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Un enfant nomme sa nudité</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Il ne nomme pas la portée</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">politique de son constat</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le narrateur d’Aké</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">nomme ses parents</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le surnom fixe une</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">relation familière</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Son sens change d’une</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">expérience à l’autre</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Les allumettes sont</text>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">brûlées</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Les passants comprennent</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">le besoin de chaleur</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">Le lecteur seul accompagne</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">chaque vision</text>
</g>
</svg>
