<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">Comment juger une politique de gestion de crise ?</title>
<desc id="description">Avant Former les personnels, anticiper les dépendances Les responsabilités et les moyens sont-ils définis ? Pendant Informer et soutenir les foyers au Maroc Le public peut-il comprendre et appliquer la décision ? Entre deux vagues Chiffrer les mesures économiques en Égypte Quelle part est prévue, quelle part exécutée ? Après Rétablir les services et tirer des leçons Qu’est-ce qui changera lors du prochain incident ?</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment juger une politique de gestion de crise ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Exemple du dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question à poser</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Avant</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Former les personnels,</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">anticiper les dépendances</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les responsabilités et les</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">moyens sont-ils définis ?</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Pendant</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Informer et soutenir les</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">foyers au Maroc</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le public peut-il</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">comprendre et appliquer la</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">décision ?</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Entre deux vagues</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Chiffrer les mesures</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">économiques en Égypte</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Quelle part est prévue,</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">quelle part exécutée ?</text>
<rect x="10" y="315" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">Après</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">Rétablir les services et</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">tirer des leçons</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Qu’est-ce qui changera lors</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">du prochain incident ?</text>
</g>
</svg>
