<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="titre description">
<title id="titre">Trois dates pour lire le départ d’Angela Merkel</title>
<desc id="description">2018 Séparer parti et chancellerie Les regards étrangers divergent sur la portée du geste Septembre 2021 Faire le bilan avant les élections Crises, décisions et réputation de stabilité Octobre 2021 Dire le discrédit de parcours est-allemands Le discours de l’unité confronte les mots aux expériences Dessin de 2021 Une transition pourrait durer La veste des vœux maintient la chancelière en fonction au conditionnel</desc>
<rect width="720" height="430" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois dates pour lire le départ d’Angela Merkel</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui se joue</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Voix ou indice</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">2018</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Séparer parti et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">chancellerie</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les regards étrangers</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">divergent sur la portée du</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">geste</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Septembre 2021</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Faire le bilan avant les</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">élections</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Crises, décisions et</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">réputation de stabilité</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Octobre 2021</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Dire le discrédit de</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">parcours est-allemands</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Le discours de l’unité</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">confronte les mots aux</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">expériences</text>
<rect x="10" y="337" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="362" font-size="15" font-weight="700" fill="#162d3b">Dessin de 2021</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">Une transition pourrait</text>
<text x="229" y="384" font-size="15" font-weight="400" fill="#162d3b">durer</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">La veste des vœux maintient</text>
<text x="473" y="384" font-size="15" font-weight="400" fill="#162d3b">la chancelière en fonction</text>
<text x="473" y="406" font-size="15" font-weight="400" fill="#162d3b">au conditionnel</text>
</g>
</svg>
