<text x="334" y="87" font-family="DejaVu Sans, sans-serif" font-size="4.1" font-weight="700" fill="#3b665b" text-anchor="start">Du quai à la salle</text>
<text x="334" y="98" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Entrée par l’accueil.</text>
<text x="334" y="103" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Le stock dessert les</text>
<text x="334" y="108" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">établis. Les panneaux</text>
<text x="334" y="113" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">coulissent pour ouvrir</text>
<text x="334" y="118" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">la promenade sur les</text>
<text x="334" y="123" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">travaux.</text>
<text x="334" y="177" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Le WC de chantier est</text>
<text x="334" y="182" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">accessible par le</text>
<text x="334" y="187" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">dégagement latéral. Les</text>
<text x="334" y="192" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">modules sont raccordés</text>
<text x="334" y="197" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">et entretenus selon</text>
<text x="334" y="202" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">leur type.</text>
