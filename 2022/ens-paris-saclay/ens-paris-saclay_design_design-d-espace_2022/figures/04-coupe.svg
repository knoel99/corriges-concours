<text x="238" y="83" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Assembler à sec</text>
<text x="238" y="96" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Portiques bois contrôlés, platines et boulons</text>
<text x="238" y="101" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">accessibles. Couverture métallique démontable. Les</text>
<text x="238" y="106" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">panneaux de réemploi sont classés par état et par</text>
<text x="238" y="111" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">résistance.</text>
<text x="238" y="147" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Lire le niveau</text>
<text x="238" y="159" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une règle graduée reçoit les hauteurs datées et mesurées</text>
<text x="238" y="164" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">par le gestionnaire. Elle n’indique jamais à elle seule</text>
<text x="238" y="169" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">une tendance climatique.</text>
<text x="238" y="207" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Démonter en avance</text>
<text x="238" y="219" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Fermer l’atelier dès le seuil d’alerte défini. Mettre</text>
<text x="238" y="224" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">hors tension, évacuer outils, stocks, WC et pièces selon</text>
<text x="238" y="229" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">le plan communal.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Le léger plancher n’est pas un refuge en crue. Dimensionner lest, ancrage, vent et stratégie de repli avec les gestionnaires du site.</text>
