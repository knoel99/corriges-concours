<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Le bâtiment expose ses gestes</title><desc>Trois temps pour un même visiteur · observer le repère de la Seine, réparer un objet, puis documenter la matière évitée.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#3b665b" text-anchor="start">RELEVÉ DE RIVES</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#3b665b" text-anchor="end">5 / 5</text>
<path d="M13 20 L407 20" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Le bâtiment expose ses gestes</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Trois temps pour un même visiteur · observer le repère de la Seine, réparer un objet, puis documenter la matière évitée.</text>
<rect x="17" y="66" width="121" height="115" rx="0" fill="#eadfca" stroke="none" stroke-width="0.6"/>
<text x="22" y="81" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Voir</text>
<rect x="71" y="92" width="9" height="70" rx="0" fill="#a6ad77" stroke="#212e2c" stroke-width="0.6"/>
<path d="M71 98 L75 98" stroke="#212e2c" stroke-width="0.6" fill="none"/>
<path d="M71 105 L76 105" stroke="#212e2c" stroke-width="0.6" fill="none"/>
<path d="M71 112 L75 112" stroke="#212e2c" stroke-width="0.6" fill="none"/>
<path d="M71 119 L76 119" stroke="#212e2c" stroke-width="0.6" fill="none"/>
<path d="M71 126 L75 126" stroke="#212e2c" stroke-width="0.6" fill="none"/>
<path d="M71 133 L76 133" stroke="#212e2c" stroke-width="0.6" fill="none"/>
<path d="M71 140 L75 140" stroke="#212e2c" stroke-width="0.6" fill="none"/>
<path d="M71 147 L76 147" stroke="#212e2c" stroke-width="0.6" fill="none"/>
<path d="M71 154 L75 154" stroke="#212e2c" stroke-width="0.6" fill="none"/>
<path d="M33 145 L119 145" stroke="#7aa9ac" stroke-width="1.4" fill="none"/>
<text x="20" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Une règle et des relevés datés se lisent</text>
<text x="20" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">avant l’entrée. Un plan montre ce qui</text>
<text x="20" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">est démontable.</text>
<rect x="149" y="66" width="121" height="115" rx="0" fill="#eadfca" stroke="none" stroke-width="0.6"/>
<text x="154" y="81" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Faire</text>
<rect x="168" y="137" width="83" height="3" rx="0" fill="#e7cca6" stroke="#212e2c" stroke-width="0.6"/>
<path d="M173 140 L173 166" stroke="#212e2c" stroke-width="1.5" fill="none"/>
<path d="M246 140 L246 166" stroke="#212e2c" stroke-width="1.5" fill="none"/>
<rect x="187" y="123" width="26" height="14" rx="0" fill="#a6ad77" stroke="#212e2c" stroke-width="0.6"/>
<ellipse cx="234" cy="103.36" rx="4.32" ry="4.32" fill="#c55d42" stroke="none" stroke-width="0.65"/>
<path d="M234 108.4 L234 121.6" stroke="#c55d42" stroke-width="4.32" fill="none"/>
<path d="M234 121.6 L229.2 136" stroke="#c55d42" stroke-width="2.4" fill="none"/>
<path d="M234 121.6 L238.8 136" stroke="#c55d42" stroke-width="2.4" fill="none"/>
<path d="M227.76 116.8 L238.56 111.28" stroke="#c55d42" stroke-width="2.16" fill="none"/>
<text x="152" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">L’objet passe du bureau au stock de</text>
<text x="152" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">pièces, puis à l’établi. Une fenêtre de</text>
<text x="152" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">la halle cadre le fleuve.</text>
<rect x="281" y="66" width="121" height="115" rx="0" fill="#eadfca" stroke="none" stroke-width="0.6"/>
<text x="286" y="81" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Transmettre</text>
<rect x="295" y="102" width="25" height="48" rx="0" fill="#a6ad77" stroke="#212e2c" stroke-width="0.6"/>
<path d="M299 133 L314 133" stroke="#212e2c" stroke-width="0.45" fill="none"/>
<rect x="327" y="102" width="25" height="48" rx="0" fill="#e7cca6" stroke="#212e2c" stroke-width="0.6"/>
<path d="M331 133 L346 133" stroke="#212e2c" stroke-width="0.45" fill="none"/>
<rect x="359" y="102" width="25" height="48" rx="0" fill="#d0d9c7" stroke="#212e2c" stroke-width="0.6"/>
<path d="M363 133 L378 133" stroke="#212e2c" stroke-width="0.45" fill="none"/>
<text x="284" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Pièces remplacées, masse et usage</text>
<text x="284" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">prolongé sont relevés. Les étiquettes</text>
<text x="284" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">accompagnent la petite exposition.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Ne pas confondre une crue locale, la variation saisonnière du fleuve et la montée moyenne du niveau de la mer. Le repère ouvre cette</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">discussion.</text>
</svg>
