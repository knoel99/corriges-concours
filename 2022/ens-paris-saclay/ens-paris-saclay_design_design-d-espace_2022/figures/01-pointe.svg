<text x="20" y="215" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Une plate-forme inondable</text>
<text x="20" y="226" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le lieu change de largeur et de cote. L’atelier s’installe sur</text>
<text x="20" y="231" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">la plate-forme aval, conserve la promenade et dégage l’accès à</text>
<text x="20" y="236" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">la statue.</text>
<text x="229" y="215" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Rendre la crue visible</text>
<text x="229" y="226" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une règle de niveau graduée d’après relevé local relie le</text>
<text x="229" y="231" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">fleuve à la salle. Les marques datées déclenchent la</text>
<text x="229" y="236" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">discussion.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Situation schématique d’après le plan cadastral et les photographies du sujet. Niveaux de crue, accès et flux doivent être relevés avant</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">implantation.</text>
