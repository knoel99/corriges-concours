<svg xmlns="http://www.w3.org/2000/svg" width="830" height="239" viewBox="0 0 830 239" role="img" aria-labelledby="t d"><title id="t">Julien de Sachs : rentabilité, responsabilité de la marque et choix d’un site industriel</title><desc id="d">Passer de Jakarta à Chalon exige 5 M€ de plus au début de 2023 et apporte des flux supplémentaires concentrés sur les dernières années. À 5 %, leur valeur actuelle excède de 103 k€ la dépense additionnelle.</desc><rect width="830" height="239" fill="white"/><g fill="#234451" font-family="sans-serif"><rect x="10" y="11" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="47" font-weight="bold" font-size="18">Début 2023</text><text x="196" y="35" font-size="18" font-weight="bold">Investissement additionnel à Chalon : 5 000 k€</text><text x="196" y="59" font-size="16">Écart de trésorerie immédiat : −5 000 k€.</text><rect x="10" y="86" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="122" font-weight="bold" font-size="18">2023 à 2026</text><text x="196" y="110" font-size="18" font-weight="bold">Flux annuels supplémentaires : 0, 1 000, 2 000, 3 000 k€</text><text x="196" y="134" font-size="16">Valeur actualisée de ces quatre flux à 5 % : 5 103 k€.</text><rect x="10" y="161" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="197" font-weight="bold" font-size="18">Décision</text><text x="196" y="185" font-size="18" font-weight="bold">VAN supplémentaire : +103 k€</text><text x="196" y="209" font-size="16">Le taux d’indifférence entre les projets est de 5,65 %.</text></g></svg>
