<svg xmlns="http://www.w3.org/2000/svg" width="820" height="296" viewBox="0 0 820 296" role="img"><title>Un même axe, deux réglages</title><desc>Deux positions possibles des lames horizontales, vues en coupe.</desc><rect x="0" y="0" width="820" height="296" fill="#fbfaf5" stroke="none"/><text x="26" y="42" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#203f49">Un même axe, deux réglages</text><text x="35" y="82" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#203f49">Lames presque horizontales</text><text x="420" y="82" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#203f49">Lames inclinées</text><rect x="259" y="100" width="33" height="121" fill="#bcd6dc" stroke="none"/><line x1="257" y1="99" x2="257" y2="222" stroke="#385d68" stroke-width="3" stroke-linecap="round"/><line x1="92" y1="123.5" x2="179" y2="126.5" stroke="#2e676e" stroke-width="9" stroke-linecap="round"/><circle cx="135" cy="125" r="5" fill="#e8b94a"/><line x1="92" y1="163.5" x2="179" y2="166.5" stroke="#2e676e" stroke-width="9" stroke-linecap="round"/><circle cx="135" cy="165" r="5" fill="#e8b94a"/><line x1="92" y1="203.5" x2="179" y2="206.5" stroke="#2e676e" stroke-width="9" stroke-linecap="round"/><circle cx="135" cy="205" r="5" fill="#e8b94a"/><text x="38" y="256" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#203f49">Écart visible entre les lames</text><rect x="649" y="100" width="33" height="121" fill="#bcd6dc" stroke="none"/><line x1="647" y1="99" x2="647" y2="222" stroke="#385d68" stroke-width="3" stroke-linecap="round"/><line x1="482" y1="110.0" x2="569" y2="140.0" stroke="#2e676e" stroke-width="9" stroke-linecap="round"/><circle cx="525" cy="125" r="5" fill="#e8b94a"/><line x1="482" y1="150.0" x2="569" y2="180.0" stroke="#2e676e" stroke-width="9" stroke-linecap="round"/><circle cx="525" cy="165" r="5" fill="#e8b94a"/><line x1="482" y1="190.0" x2="569" y2="220.0" stroke="#2e676e" stroke-width="9" stroke-linecap="round"/><circle cx="525" cy="205" r="5" fill="#e8b94a"/><text x="428" y="256" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#203f49">Écart apparent plus faible</text><text x="35" y="284" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#203f49">Coupe de principe. Le point marque l’axe de rotation. Le vitrage est à droite.</text></svg>
