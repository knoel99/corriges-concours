<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Faire circuler un petit livre</title><desc>Présentation au CRAFT, lecture sur table puis circulation hors de l’atelier · le cahier doit rester manipulable.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#2d6659" text-anchor="start">LE POIDS DU DESSIN</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#2d6659" text-anchor="end">5 / 5</text>
<path d="M13 20 L407 20" stroke="#2d6659" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Faire circuler un petit livre</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Présentation au CRAFT, lecture sur table puis circulation hors de l’atelier · le cahier doit rester manipulable.</text>
<rect x="17" y="72" width="230" height="133" rx="0" fill="#e5ddcc" stroke="none" stroke-width="0.6"/>
<polygon points="27,161 190,161 234,140 68,140" fill="#e7cca6" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="49,154 85,154 104,145 67,145" fill="#2d6659" stroke="#212e2c" stroke-width="0.5" stroke-linejoin="round"/>
<polygon points="49,152 85,152 104,143 67,143" fill="#2d6659" stroke="#212e2c" stroke-width="0.5" stroke-linejoin="round"/>
<polygon points="49,150 85,150 104,141 67,141" fill="#2d6659" stroke="#212e2c" stroke-width="0.5" stroke-linejoin="round"/>
<polygon points="112,147 130,105 152,99 138,143" fill="#2d6659" stroke="#212e2c" stroke-width="0.6" stroke-linejoin="round"/>
<polygon points="154,143 176,132 197,139 214,131 224,136 201,151 179,145 166,151" fill="#fcf5e8" stroke="#212e2c" stroke-width="0.6" stroke-linejoin="round"/>
<text x="24" y="188" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#2d6659" text-anchor="start">Stock bas / exemplaire dressé / exemplaire ouvert</text>
<text x="265" y="80" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#2d6659" text-anchor="start">Au centre</text>
<text x="265" y="92" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Livre ouvert près des sculptures, lumière</text>
<text x="265" y="97" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">douce et table accessible. Un autre</text>
<text x="265" y="102" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">exemplaire reste disponible pour</text>
<text x="265" y="107" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">feuilleter.</text>
<text x="265" y="147" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#2d6659" text-anchor="start">Après la visite</text>
<text x="265" y="159" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Vente ou consultation au centre, envoi aux</text>
<text x="265" y="164" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">bibliothèques d’art. PDF de lecture avec</text>
<text x="265" y="169" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">ordre de pages, titres et descriptions des</text>
<text x="265" y="174" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">photographies.</text>
<text x="20" y="225" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Épreuve de lecture : comparer le reflet de la page au reflet de la sculpture, lire les légendes assis, vérifier le</text>
<text x="20" y="230" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">contraste du vert sur le papier crème.</text>
<path d="M13 276 L407 276" stroke="#2d6659" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#2d6659" text-anchor="start">Le lecteur peut feuilleter sans défaire la reliure. Les alternatives aux images doivent décrire la matière, le geste et la forme montrés.</text>
</svg>
