<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>La couverture donne le geste</title><desc>Couverture et quatrième, format réduit · un contour interrompu s’ouvre comme la pièce montée puis renversée.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#2d6659" text-anchor="start">LE POIDS DU DESSIN</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#2d6659" text-anchor="end">3 / 5</text>
<path d="M13 20 L407 20" stroke="#2d6659" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">La couverture donne le geste</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Couverture et quatrième, format réduit · un contour interrompu s’ouvre comme la pièce montée puis renversée.</text>
<rect x="28" y="64" width="118" height="167" rx="0" fill="#f7ecd8" stroke="#212e2c" stroke-width="0.5"/>
<rect x="28" y="64" width="118" height="167" rx="0" fill="#2d6659" stroke="#212e2c" stroke-width="0.45"/>
<text x="38.62" y="95.73" font-family="DejaVu Sans, sans-serif" font-size="14.16" font-weight="700" fill="#f6ecd8" text-anchor="start">LE POIDS</text>
<text x="38.62" y="114.1" font-family="DejaVu Sans, sans-serif" font-size="12.389999999999999" font-weight="700" fill="#f6ecd8" text-anchor="start">DU DESSIN</text>
<path d="M42.16 180.89999999999998 Q39.8 139.15 83.46 137.48000000000002 T131.84 172.55" fill="none" stroke="#f6ecd8" stroke-width="4.130000000000001" stroke-linejoin="round" stroke-linecap="round"/>
<text x="38.62" y="215.97" font-family="DejaVu Sans, sans-serif" font-size="7.1979999999999995" font-weight="700" fill="#f6ecd8" text-anchor="start">JULIA HUTEAU</text>
<rect x="170" y="64" width="118" height="167" rx="0" fill="#f7ecd8" stroke="#212e2c" stroke-width="0.5"/>
<text x="180.62" y="104.08" font-family="DejaVu Sans, sans-serif" font-size="15.34" font-weight="700" fill="#2d6659" text-anchor="start">CRAFT</text>
<text x="180.62" y="132.47" font-family="DejaVu Sans, sans-serif" font-size="6.136" font-weight="400" fill="#212e2c" text-anchor="start">Résidence de Julia</text>
<text x="180.62" y="141.556" font-family="DejaVu Sans, sans-serif" font-size="6.136" font-weight="400" fill="#212e2c" text-anchor="start">Huteau / trois séries</text>
<text x="180.62" y="150.642" font-family="DejaVu Sans, sans-serif" font-size="6.136" font-weight="400" fill="#212e2c" text-anchor="start">céramiques / douze</text>
<text x="180.62" y="159.728" font-family="DejaVu Sans, sans-serif" font-size="6.136" font-weight="400" fill="#212e2c" text-anchor="start">semaines.</text>
<text x="304" y="77" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#2d6659" text-anchor="start">Titre et crédit</text>
<text x="304" y="89" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Sans sérif humaniste en capitales</text>
<text x="304" y="94" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">pour le titre et les légendes.</text>
<text x="304" y="99" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Serif pour les textes continus, au</text>
<text x="304" y="104" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">corps 10,5 à 11 points.</text>
<text x="304" y="151" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#2d6659" text-anchor="start">Imprimer</text>
<text x="304" y="163" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Couverture 200 g/m², intérieur mat</text>
<text x="304" y="168" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">120 g/m². Impression quadri</text>
<text x="304" y="173" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">numérique en court tirage, profil</text>
<text x="304" y="178" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">et épreuve couleur contrôlés.</text>
<path d="M13 276 L407 276" stroke="#2d6659" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#2d6659" text-anchor="start">Le nom de l’artiste paraît en couverture. La quatrième identifie le centre et le contexte. Les crédits photographiques sont réservés aux</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#2d6659" text-anchor="start">pages 2 et 15.</text>
</svg>
