<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>De la section à la trace</title><desc>Trois pistes pour une édition consacrée à la résidence de douze semaines de Julia Huteau au CRAFT.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#2d6659" text-anchor="start">LE POIDS DU DESSIN</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#2d6659" text-anchor="end">1 / 5</text>
<path d="M13 20 L407 20" stroke="#2d6659" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">De la section à la trace</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Trois pistes pour une édition consacrée à la résidence de douze semaines de Julia Huteau au CRAFT.</text>
<rect x="18" y="65" width="120" height="113" rx="0" fill="#e9e4d7" stroke="none" stroke-width="0.6"/>
<text x="22" y="79" font-family="DejaVu Sans, sans-serif" font-size="4.45" font-weight="700" fill="#2d6659" text-anchor="start">Classement par couleur</text>
<rect x="29" y="106" width="29" height="39" rx="0" fill="#fcf5e8" stroke="#212e2c" stroke-width="0.5"/>
<rect x="63" y="106" width="29" height="39" rx="0" fill="#2d6659" stroke="#212e2c" stroke-width="0.5"/>
<rect x="97" y="106" width="29" height="39" rx="0" fill="#b94336" stroke="#212e2c" stroke-width="0.5"/>
<text x="19" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Blanc, vert, rouge guident rapidement le</text>
<text x="19" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">regard, mais masquent les différences de</text>
<text x="19" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">fabrication.</text>
<rect x="150" y="65" width="120" height="113" rx="0" fill="#e9e4d7" stroke="none" stroke-width="0.6"/>
<text x="154" y="79" font-family="DejaVu Sans, sans-serif" font-size="4.45" font-weight="700" fill="#2d6659" text-anchor="start">Cahier de gestes</text>
<g transform="translate(165 96) scale(1.6)">
<rect x="0" y="0" width="54" height="39" rx="0" fill="#e9e4dc" stroke="#212e2c" stroke-width="0.35"/>
<path d="M7 27 Q5 11 20 6 Q36 2 45 15 Q49 22 46 28 L34 27 Q35 20 30 16 Q21 9 17 21 L19 29Z" fill="#2d6659" stroke="#212e2c" stroke-width="0.45" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="3" y="30" width="44" height="4" rx="0" fill="#c5bdb0" stroke="#212e2c" stroke-width="0.35"/>
<path d="M44 2 L43 15" stroke="#212e2c" stroke-width="0.65" fill="none"/>
</g>
<text x="151" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Une séquence de mains révèle la</text>
<text x="151" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">collaboration. Elle peut laisser les</text>
<text x="151" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">sculptures achevées hors champ.</text>
<rect x="282" y="65" width="120" height="113" rx="0" fill="#e9e4d7" stroke="none" stroke-width="0.6"/>
<text x="286" y="79" font-family="DejaVu Sans, sans-serif" font-size="4.45" font-weight="700" fill="#2d6659" text-anchor="start">Forme / opération</text>
<g transform="translate(287 104) scale(0.96)">
<rect x="0" y="0" width="54" height="39" rx="0" fill="#e9e4dc" stroke="#212e2c" stroke-width="0.35"/>
<path d="M8 13 L27 8 L44 12 L43 16 L28 12 L8 17Z" fill="#c5bdb0" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M8 16 L27 11 L44 15 L43 19 L28 15 L8 20Z" fill="#c5bdb0" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M8 19 L27 14 L44 18 L43 22 L28 18 L8 23Z" fill="#c5bdb0" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M8 22 L27 17 L44 21 L43 25 L28 21 L8 26Z" fill="#c5bdb0" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M8 25 L27 20 L44 24 L43 28 L28 24 L8 29Z" fill="#c5bdb0" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<g transform="translate(343 104) scale(0.96)">
<rect x="0" y="0" width="54" height="39" rx="0" fill="#e9e4dc" stroke="#212e2c" stroke-width="0.35"/>
<path d="M8 13 L27 8 L44 12 L43 16 L28 12 L8 17Z" fill="#b94336" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M8 16 L27 11 L44 15 L43 19 L28 15 L8 20Z" fill="#b94336" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M8 19 L27 14 L44 18 L43 22 L28 18 L8 23Z" fill="#b94336" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M8 22 L27 17 L44 21 L43 25 L28 21 L8 26Z" fill="#b94336" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M8 25 L27 20 L44 24 L43 28 L28 24 L8 29Z" fill="#b94336" stroke="#212e2c" stroke-width="0.38" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="283" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Face à une photographie de travail, une</text>
<text x="283" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">seconde vue donne la pièce. Le lecteur</text>
<text x="283" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">compare un contour et ce qui l’a</text>
<text x="283" y="214" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">transformé.</text>
<path d="M13 276 L407 276" stroke="#2d6659" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#2d6659" text-anchor="start">Le parti retenu confronte un geste et une forme. Les vues dessinées sont des schémas de cadrage à partir des documents du concours.</text>
</svg>
