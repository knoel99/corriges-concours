<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" width="820" height="255" role="img" aria-labelledby="titre desc"><title id="titre">Analyser une chanson et son industrie</title><desc id="desc">Le rythme. Une même structure musicale peut accompagner des propos très différents. Les paroles. Qui parle, à qui, et qui peut dire oui ou non ? Ces questions rendent précise l’analyse de la représentation. La production. L’accès au studio, à la programmation et aux revenus détermine quelles voix parviennent à être entendues.</desc><rect width="820" height="255" fill="#f6f5ef"/><g font-family="DejaVu Sans, sans-serif" fill="#153139"><text x="24" y="32" font-size="22" font-weight="bold">Analyser une chanson et son industrie</text><path d="M24 62h241" stroke="#39756e" stroke-width="4"/><text x="24" y="93" font-size="18" font-weight="bold">Le rythme</text><text x="24" y="123" font-size="15">Une même structure musicale</text><text x="24" y="145" font-size="15">peut accompagner des propos</text><text x="24" y="167" font-size="15">très différents.</text><path d="M289 62h241" stroke="#39756e" stroke-width="4"/><text x="289" y="93" font-size="18" font-weight="bold">Les paroles</text><text x="289" y="123" font-size="15">Qui parle, à qui, et qui</text><text x="289" y="145" font-size="15">peut dire oui ou non ? Ces</text><text x="289" y="167" font-size="15">questions rendent précise</text><text x="289" y="189" font-size="15">l’analyse de la</text><text x="289" y="211" font-size="15">représentation.</text><path d="M554 62h241" stroke="#39756e" stroke-width="4"/><text x="554" y="93" font-size="18" font-weight="bold">La production</text><text x="554" y="123" font-size="15">L’accès au studio, à la</text><text x="554" y="145" font-size="15">programmation et aux</text><text x="554" y="167" font-size="15">revenus détermine quelles</text><text x="554" y="189" font-size="15">voix parviennent à être</text><text x="554" y="211" font-size="15">entendues.</text></g></svg>
