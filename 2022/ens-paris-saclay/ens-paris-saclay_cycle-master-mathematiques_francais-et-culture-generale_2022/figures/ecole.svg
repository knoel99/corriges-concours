<svg xmlns="http://www.w3.org/2000/svg" width="846" height="284" viewBox="0 0 846 284" role="img"><title>Quels choix faut-il distinguer à l’école ?</title><desc>Les finalités de l’école, les moyens de les atteindre et les indicateurs mobilisent des jugements distincts.</desc><rect x="0" y="0" width="846" height="284" fill="#faf9f3"/><text x="24" y="38" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1d434d">Quels choix faut-il distinguer à l’école ?</text><rect x="24" y="67" width="798" height="53" fill="#e4ede8"/><text x="36" y="100" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Finalité</text><text x="260" y="100" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#1d434d">Que voulons-nous rendre possible pour les élèves ?</text><rect x="24" y="134" width="798" height="53" fill="#efe4d1"/><text x="36" y="167" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Moyen</text><text x="260" y="167" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#1d434d">Dans quelles conditions un exercice favorise-t-il cet acquis ?</text><rect x="24" y="201" width="798" height="53" fill="#e4ede8"/><text x="36" y="234" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Indicateur</text><text x="260" y="234" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#1d434d">Quelle épreuve permet de voir ce que l’élève a appris ?</text></svg>
