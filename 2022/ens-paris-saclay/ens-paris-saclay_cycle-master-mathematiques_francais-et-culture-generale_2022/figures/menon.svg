<svg xmlns="http://www.w3.org/2000/svg" width="846" height="284" viewBox="0 0 846 284" role="img"><title>Doubler la surface du carré</title><desc>La diagonale dans le problème du Ménon</desc><rect x="0" y="0" width="846" height="284" fill="#faf9f3"/><text x="24" y="38" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1d434d">Doubler la surface du carré</text><rect x="36" y="68" width="176" height="176" fill="#f0e4cd"/><line x1="36" y1="68" x2="36" y2="244" stroke="#9ea9a7" stroke-width="1"/><line x1="36" y1="68" x2="212" y2="68" stroke="#9ea9a7" stroke-width="1"/><line x1="80" y1="68" x2="80" y2="244" stroke="#9ea9a7" stroke-width="1"/><line x1="36" y1="112" x2="212" y2="112" stroke="#9ea9a7" stroke-width="1"/><line x1="124" y1="68" x2="124" y2="244" stroke="#9ea9a7" stroke-width="1"/><line x1="36" y1="156" x2="212" y2="156" stroke="#9ea9a7" stroke-width="1"/><line x1="168" y1="68" x2="168" y2="244" stroke="#9ea9a7" stroke-width="1"/><line x1="36" y1="200" x2="212" y2="200" stroke="#9ea9a7" stroke-width="1"/><line x1="212" y1="68" x2="212" y2="244" stroke="#9ea9a7" stroke-width="1"/><line x1="36" y1="244" x2="212" y2="244" stroke="#9ea9a7" stroke-width="1"/><polygon points="124,68 212,156 124,244 36,156" stroke="#266767" stroke-width="4" fill="#73a6a0" fill-opacity=".58"/><rect x="36" y="68" width="88" height="88" fill="none" stroke="#825122" stroke-width="3" stroke-dasharray="6 4"/><text x="248" y="82" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Chaque petit carreau a une aire de 1.</text><text x="248" y="117" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Carré en pointillé : 2 × 2 = 4.</text><text x="248" y="152" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Grand carré : 4 × 4 = 16.</text><text x="248" y="187" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Les quatre triangles de coin ont chacun une aire de 2.</text><text x="248" y="222" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Carré sur la diagonale : 16 − (4 × 2) = 8.</text></svg>
