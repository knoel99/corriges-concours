<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Le frais au retour du marché</title><desc>Deux contenants pour un couple en logement locatif · conserver une petite récolte de fruits ou légumes dans un espace ombragé et ventilé.</desc>
