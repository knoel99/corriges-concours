<text x="274" y="77" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#ae6248" text-anchor="start">Un pot de garde</text>
<text x="274" y="91" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Pour les légumes du marché, un grand volume</text>
<text x="274" y="96" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">intérieur amovible et une réserve annulaire</text>
<text x="274" y="101" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">de sable humide.</text>
<text x="274" y="146" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#ae6248" text-anchor="start">Une paire de service</text>
<text x="274" y="159" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Pour de petites portions, deux pots</text>
<text x="274" y="164" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">indépendants que l’on ouvre séparément. Une</text>
<text x="274" y="169" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">place à l’ombre reste nécessaire.</text>
<text x="19" y="225" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#ae6248" text-anchor="start">Avant le repas</text>
<text x="19" y="236" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Arroser le sable sans mouiller la récolte, sortir ce qui sera mangé, remettre le couvercle. Le dessin des lèvres</text>
<text x="19" y="241" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">distingue les deux gestes.</text>
<path d="M13 276 L407 276" stroke="#ae6248" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#ae6248" text-anchor="start">L’évaporation rafraîchit selon la température, l’humidité et le renouvellement de l’air. Les légumes restent visibles et accessibles.</text>
</svg>
