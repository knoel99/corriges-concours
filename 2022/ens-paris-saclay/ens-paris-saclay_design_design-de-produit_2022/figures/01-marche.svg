<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Le frais au retour du marché</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Deux contenants pour un couple en logement locatif · conserver une petite récolte de fruits ou légumes dans un espace ombragé et ventilé.</text>
