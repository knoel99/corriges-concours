<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Vérifier le transfert et le poids</title><desc>Terre, sable, eau et air · faire un essai comparatif en situation d’usage et régler la production en petites séries.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#ae6248" text-anchor="start">À L’OMBRE</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#ae6248" text-anchor="end">4 / 4</text>
<path d="M13 20 L407 20" stroke="#ae6248" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Vérifier le transfert et le poids</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Terre, sable, eau et air · faire un essai comparatif en situation d’usage et régler la production en petites séries.</text>
<text x="17" y="76" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#ae6248" text-anchor="start">Tourner</text>
<text x="17" y="90" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Mettre au tour les deux pots non</text>
<text x="17" y="95" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">émaillés. Prévoir le retrait mesuré de</text>
<text x="17" y="100" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">la pâte. Le couvercle est estampé et</text>
<text x="17" y="105" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">muni de sa prise avant cuisson.</text>
<text x="149" y="76" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#ae6248" text-anchor="start">Installer</text>
<text x="149" y="90" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Poser à l’ombre sur un support ventilé.</text>
<text x="149" y="95" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Intercaler sable propre et eau, ajuster</text>
<text x="149" y="100" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">la stabilité, laisser l’air libre autour</text>
<text x="149" y="105" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">de la terre poreuse.</text>
<text x="281" y="76" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#ae6248" text-anchor="start">Mesurer</text>
<text x="281" y="90" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Noter température intérieure, extérieure</text>
<text x="281" y="95" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">et humidité. Peser l’eau apportée et</text>
<text x="281" y="100" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">l’eau perdue durant une journée, avec le</text>
<text x="281" y="105" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">même lot témoin à l’ombre.</text>
<rect x="18" y="156" width="382" height="99" rx="0" fill="#e8ddc6" stroke="none" stroke-width="0.6"/>
<text x="25" y="170" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#ae6248" text-anchor="start">De l’eau vers l’air</text>
<rect x="25" y="186" width="75" height="24" rx="2" fill="#e0c583" stroke="#212e2c" stroke-width="0.5"/>
<text x="62.5" y="200" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#212e2c" text-anchor="middle">Sable humide</text>
<path d="M100 198 L120 198" stroke="#212e2c" stroke-width="0.7" fill="none"/>
<polygon points="120,198 115,196 115,200" fill="#212e2c" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<rect x="122" y="186" width="75" height="24" rx="2" fill="#d1916c" stroke="#212e2c" stroke-width="0.5"/>
<text x="159.5" y="200" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#212e2c" text-anchor="middle">Paroi poreuse</text>
<path d="M197 198 L217 198" stroke="#212e2c" stroke-width="0.7" fill="none"/>
<polygon points="217,198 212,196 212,200" fill="#212e2c" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<rect x="219" y="186" width="75" height="24" rx="2" fill="#7aa9ac" stroke="#212e2c" stroke-width="0.5"/>
<text x="256.5" y="200" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#212e2c" text-anchor="middle">Évaporation</text>
<path d="M294 198 L314 198" stroke="#212e2c" stroke-width="0.7" fill="none"/>
<polygon points="314,198 309,196 309,200" fill="#212e2c" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<rect x="316" y="186" width="75" height="24" rx="2" fill="#a6ad77" stroke="#212e2c" stroke-width="0.5"/>
<text x="353.5" y="200" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#212e2c" text-anchor="middle">Air renouvelé</text>
<text x="25" y="229" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">L’évaporation mobilise de la chaleur. Si l’air est déjà très humide, le gain de température se réduit. La température du</text>
<text x="25" y="234" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">pot doit être mesurée.</text>
<path d="M13 276 L407 276" stroke="#ae6248" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#ae6248" text-anchor="start">Les 7 à 10 °C d’écart évoqués dans le sujet varient selon les conditions. Aucun maintien à une température médicale ou alimentaire garantie.</text>
</svg>
