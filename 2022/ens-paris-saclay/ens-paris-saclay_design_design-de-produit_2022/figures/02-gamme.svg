<text x="285" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">s’ouvrent à tour de rôle. Les formes de</text>
<text x="285" y="206" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">révolution se répètent sur le tour de la</text>
<text x="285" y="211" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">manufacture.</text>
