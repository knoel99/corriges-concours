<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 316" role="img" aria-labelledby="titre desc"><title id="titre">Le raisonnement de l’essai</title><desc id="desc">Une date établie : Les Françaises votent aux élections municipales de 1945.. Une trace à examiner : Un témoignage local précise une expérience singulière.. Le regard contemporain : On peut interroger les conditions concrètes de la participation.</desc><rect width="890" height="316" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="20" y="35" font-size="24" font-weight="bold" fill="#243c46">Le raisonnement de l’essai</text>
<rect x="20" y="57" width="849" height="68" rx="7" fill="#e5eff1"/>
<text x="35" y="84" font-size="19" font-weight="bold" fill="#243c46">Une date établie</text>
<text x="35" y="110" font-size="17" font-weight="normal" fill="#243c46">Les Françaises votent aux élections municipales de 1945.</text>
<path d="M49 125 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="142" width="849" height="68" rx="7" fill="#f4ebdd"/>
<text x="35" y="169" font-size="19" font-weight="bold" fill="#243c46">Une trace à examiner</text>
<text x="35" y="195" font-size="17" font-weight="normal" fill="#243c46">Un témoignage local précise une expérience singulière.</text>
<path d="M49 210 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="227" width="849" height="68" rx="7" fill="#e7efdf"/>
<text x="35" y="254" font-size="19" font-weight="bold" fill="#243c46">Le regard contemporain</text>
<text x="35" y="280" font-size="17" font-weight="normal" fill="#243c46">On peut interroger les conditions concrètes de la participation.</text>
</g></svg>
