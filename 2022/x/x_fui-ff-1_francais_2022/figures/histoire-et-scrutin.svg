<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 185" role="img" aria-labelledby="titre description">
<title id="titre">Du droit reconnu à la représentation</title>
<desc id="description">Trois dates distinguent la reconnaissance d’un droit, son exercice lors d’un scrutin municipal et l’entrée de femmes dans l’Assemblée constituante.</desc>
<rect x="0" y="0" width="900" height="185" rx="0" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<path d="M32 63 L871 63" fill="none" stroke="#236278" stroke-width="3"/><polygon points="861.0,68.0 871.0,63.0 861.0,58.0" fill="#236278"/>
<circle cx="47" cy="63" r="6" fill="#236278"/>
<circle cx="332" cy="63" r="6" fill="#236278"/>
<circle cx="617" cy="63" r="6" fill="#236278"/>
<text x="18" y="38" font-size="23" font-weight="bold" fill="#173749">21 avril 1944</text>
<text x="305" y="38" font-size="23" font-weight="bold" fill="#173749">29 avril 1945</text>
<text x="590" y="38" font-size="23" font-weight="bold" fill="#173749">21 octobre 1945</text>
<text x="18" y="103" font-size="21" font-weight="normal" fill="#173749">Une ordonnance</text>
<text x="18" y="131" font-size="21" font-weight="normal" fill="#173749">reconnaît le droit de</text>
<text x="18" y="159" font-size="21" font-weight="normal" fill="#173749">voter et d’être élue.</text>
<text x="305" y="103" font-size="21" font-weight="normal" fill="#173749">Des électrices votent</text>
<text x="305" y="131" font-size="21" font-weight="normal" fill="#173749">au premier tour</text>
<text x="305" y="159" font-size="21" font-weight="normal" fill="#173749">des municipales.</text>
<text x="590" y="103" font-size="21" font-weight="normal" fill="#173749">33 femmes sont élues</text>
<text x="590" y="131" font-size="21" font-weight="normal" fill="#173749">à l’Assemblée</text>
<text x="590" y="159" font-size="21" font-weight="normal" fill="#173749">constituante.</text>
</g>
</svg>
