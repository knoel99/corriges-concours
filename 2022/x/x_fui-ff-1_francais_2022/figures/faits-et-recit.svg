<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-labelledby="titre description">
<title id="titre">À quel moment le récit commence-t-il ?</title>
<desc id="description">Deux bandes alignées comparent les temps vécus à la place que leur fait le récit. La prospérité paisible reste dans l’ombre avant que ne surviennent les crises.</desc>
<rect x="0" y="0" width="900" height="190" rx="0" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="35" font-size="23" font-weight="bold" fill="#173749">Vie du peuple</text>
<rect x="222" y="8" width="391" height="51" rx="8" fill="#e5efea"/>
<text x="239" y="41" font-size="21" font-weight="normal" fill="#173749">Une longue prospérité</text>
<rect x="616" y="8" width="270" height="51" rx="8" fill="#f5e7de"/>
<text x="631" y="41" font-size="21" font-weight="normal" fill="#173749">Crises et dépendance</text>
<text x="12" y="101" font-size="23" font-weight="bold" fill="#173749">Récit historique</text>
<rect x="222" y="74" width="391" height="51" rx="8" fill="#eff1ef"/>
<text x="239" y="107" font-size="21" font-weight="normal" fill="#173749">Le récit garde le silence</text>
<rect x="616" y="74" width="270" height="51" rx="8" fill="#f5e7de"/>
<text x="631" y="107" font-size="21" font-weight="bold" fill="#8a4b31">Le récit s’ouvre ici</text>
<path d="M225 146 L875 146" fill="none" stroke="#236278" stroke-width="3"/><polygon points="865.0,151.0 875.0,146.0 865.0,141.0" fill="#236278"/>
<text x="223" y="177" font-size="20" font-weight="normal" fill="#173749">La chronologie du peuple est plus longue que celle du récit.</text>
</g>
</svg>
