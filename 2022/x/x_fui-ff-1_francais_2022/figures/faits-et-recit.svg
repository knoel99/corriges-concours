<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 316" role="img" aria-labelledby="titre desc"><title id="titre">Ce que sélectionne le récit</title><desc id="desc">Le temps vécu : Une communauté connaît une longue période de prospérité.. Le fait saillant : Une crise modifie visiblement sa situation.. Le jugement du lecteur : La place du récit peut exagérer le poids de la crise.</desc><rect width="890" height="316" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="20" y="35" font-size="24" font-weight="bold" fill="#243c46">Ce que sélectionne le récit</text>
<rect x="20" y="57" width="849" height="68" rx="7" fill="#e5eff1"/>
<text x="35" y="84" font-size="19" font-weight="bold" fill="#243c46">Le temps vécu</text>
<text x="35" y="110" font-size="17" font-weight="normal" fill="#243c46">Une communauté connaît une longue période de prospérité.</text>
<path d="M49 125 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="142" width="849" height="68" rx="7" fill="#f4ebdd"/>
<text x="35" y="169" font-size="19" font-weight="bold" fill="#243c46">Le fait saillant</text>
<text x="35" y="195" font-size="17" font-weight="normal" fill="#243c46">Une crise modifie visiblement sa situation.</text>
<path d="M49 210 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="227" width="849" height="68" rx="7" fill="#e7efdf"/>
<text x="35" y="254" font-size="19" font-weight="bold" fill="#243c46">Le jugement du lecteur</text>
<text x="35" y="280" font-size="17" font-weight="normal" fill="#243c46">La place du récit peut exagérer le poids de la crise.</text>
</g></svg>
