<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 223" role="img" aria-labelledby="titre description">
<title id="titre">Qui peut faire entendre une objection ?</title>
<desc id="description">La discussion en classe et l’affaire du chauffeur devant les juges illustrent la différence entre disposer du premier mot et disposer du dernier.</desc>
<rect x="0" y="0" width="900" height="223" rx="0" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="12" y="8" width="420" height="204" rx="8" fill="#f4e9df"/>
<rect x="449" y="8" width="439" height="204" rx="8" fill="#e5eff0"/>
<text x="30" y="44" font-size="23" font-weight="bold" fill="#173749">Dans le groupe de classe</text>
<text x="467" y="44" font-size="23" font-weight="bold" fill="#173749">Devant un tribunal</text>
<text x="30" y="86" font-size="21" font-weight="normal" fill="#173749">Le premier message fixe la version</text>
<text x="30" y="115" font-size="21" font-weight="normal" fill="#173749">que les autres vont relayer.</text>
<text x="30" y="158" font-size="21" font-weight="normal" fill="#173749">La réponse doit pouvoir atteindre</text>
<text x="30" y="187" font-size="21" font-weight="normal" fill="#173749">les mêmes destinataires.</text>
<text x="467" y="86" font-size="21" font-weight="normal" fill="#173749">La plateforme fixe les tarifs.</text>
<text x="467" y="115" font-size="21" font-weight="normal" fill="#173749">Le chauffeur peut saisir un juge.</text>
<text x="467" y="158" font-size="21" font-weight="normal" fill="#173749">Une autorité indépendante décide</text>
<text x="467" y="187" font-size="21" font-weight="normal" fill="#173749">comment qualifier le travail.</text>
</g>
</svg>
