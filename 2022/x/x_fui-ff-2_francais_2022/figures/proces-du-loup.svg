<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 294" role="img" aria-labelledby="titre description">
<title id="titre">Des preuves examinables à la rumeur</title>
<desc id="description">L’agneau peut réfuter trois griefs particuliers. L’accusation collective et la rumeur ferment le dialogue.</desc>
<rect x="0" y="0" width="900" height="294" rx="0" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="15" y="30" font-size="23" font-weight="bold" fill="#173749">Ce qu’allègue le loup</text>
<text x="459" y="30" font-size="23" font-weight="bold" fill="#173749">Ce que l’agneau peut répondre</text>
<rect x="9" y="46" width="429" height="49" rx="8" fill="#f0f2f1"/>
<rect x="452" y="46" width="437" height="49" rx="8" fill="#e8f0ed"/>
<text x="22" y="78" font-size="20" font-weight="normal" fill="#173749">L’eau est troublée.</text>
<text x="466" y="78" font-size="20" font-weight="normal" fill="#173749">Le courant va du loup vers lui.</text>
<rect x="9" y="106" width="429" height="49" rx="8" fill="#f0f2f1"/>
<rect x="452" y="106" width="437" height="49" rx="8" fill="#e8f0ed"/>
<text x="22" y="138" font-size="20" font-weight="normal" fill="#173749">Il a médit l’année précédente.</text>
<text x="466" y="138" font-size="20" font-weight="normal" fill="#173749">Il n’était pas encore né.</text>
<rect x="9" y="166" width="429" height="49" rx="8" fill="#f0f2f1"/>
<rect x="452" y="166" width="437" height="49" rx="8" fill="#e8f0ed"/>
<text x="22" y="198" font-size="20" font-weight="normal" fill="#173749">Un frère l’a fait.</text>
<text x="466" y="198" font-size="20" font-weight="normal" fill="#173749">Il n’a aucun frère.</text>
<rect x="9" y="226" width="429" height="49" rx="8" fill="#f6ebe3"/>
<rect x="452" y="226" width="437" height="49" rx="8" fill="#f6ebe3"/>
<text x="22" y="258" font-size="20" font-weight="normal" fill="#173749">La faute incombe à tout son groupe.</text>
<text x="466" y="258" font-size="20" font-weight="normal" fill="#173749">Le loup agit sans lui laisser la parole.</text>
</g>
</svg>
