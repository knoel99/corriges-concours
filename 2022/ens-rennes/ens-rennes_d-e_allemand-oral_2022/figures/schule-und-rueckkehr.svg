<svg xmlns="http://www.w3.org/2000/svg" width="870" height="297" viewBox="0 0 870 297" role="img"><title>Schule bei ungewisser Aufenthaltsdauer</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Schule bei ungewisser Aufenthaltsdauer</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Bedarf</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Berliner bzw. ukrainischer Ansatz</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Offene Frage</text><rect x="12" y="84" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Kontakte vor Ort</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Gemeinsame Fächer und</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Deutschlernen</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Wann ist der Übergang sinnvoll?</text><rect x="12" y="151" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Anschluss in der</text><text x="23" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Ukraine</text><text x="225" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Ukrainische Lehrpläne und</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Onlineunterricht</text><text x="505" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Wie lassen sich Abschlüsse</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">sichern?</text><rect x="12" y="218" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Beide Wege</text><text x="23" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">offenhalten</text><text x="225" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Sprache und Fächer</text><text x="225" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">sinnvoll verbinden</text><text x="505" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Welche Doppelbelastung entsteht?</text></svg>
