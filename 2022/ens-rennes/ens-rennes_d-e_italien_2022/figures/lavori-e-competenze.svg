<svg xmlns="http://www.w3.org/2000/svg" width="870" height="297" viewBox="0 0 870 297" role="img"><title>Dal settore al mestiere</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Dal settore al mestiere</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Settore</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Mansione in trasformazione</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Competenze da combinare</text><rect x="12" y="84" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Turismo e cultura</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Progettare una visita</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">virtuale</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Mediazione culturale e strumenti</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">digitali.</text><rect x="12" y="151" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Commercio</text><text x="225" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Gestire vendite su una</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">piattaforma</text><text x="505" y=