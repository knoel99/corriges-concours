<svg xmlns="http://www.w3.org/2000/svg" width="870" height="345" viewBox="0 0 870 345" role="img"><title>Three ways an investor can enter a housing market</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Three ways an investor can enter a housing market</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Transaction</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Immediate change</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Question for policy</text><rect x="12" y="84" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Buy existing homes</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Ownership changes. The</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">number of dwellings stays</text><text x="225" y="158" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">the same.</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Can tenants still choose among</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">competing landlords?</text><rect x="12" y="175" width="842" height="91" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Convert an office</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Usable housing increases</text><text x="225" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">if the project is</text><text x="225" y="249" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">feasible.</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Will plans protect safety and</text><text x="505" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">provide decent homes?</text><rect x="12" y="266" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Build new flats</text><text x="225" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Construction adds</text><text x="225" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">dwellings on completion.</text><text x="505" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">What rents will local households</text><text x="505" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">be able to afford?</text></svg>
