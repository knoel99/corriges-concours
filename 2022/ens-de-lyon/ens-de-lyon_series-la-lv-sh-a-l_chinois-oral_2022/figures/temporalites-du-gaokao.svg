<svg xmlns="http://www.w3.org/2000/svg" width="870" height="321" viewBox="0 0 870 321" role="img"><title>Le gaokao, de la mémoire à la chronique</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Le gaokao, de la mémoire à la chronique</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Année</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Scène dans le texte</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Enjeu du témoignage</text><rect x="12" y="84" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">1977</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Retour du concours et</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">préparation au travail</text><text x="225" y="158" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">agricole</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Le narrateur échoue à la seconde</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">épreuve dans le Jiangsu.</text><rect x="12" y="175" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">1978</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Changement de dominante</text><text x="225" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">et réussite</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Une orientation dépend aussi des</text><text x="505" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">livres disponibles.</text><rect x="12" y="242" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">2021</text><text x="225" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Familles, écoles,</text><text x="225" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">transports se mobilisent</text><text x="505" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Le souvenir tempère la pression du</text><text x="505" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">concours contemporain.</text></svg>
