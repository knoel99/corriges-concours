<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Trois temps dans la parole d’Aphrodite</title>
<desc id="description">Règle générale Honorer les fidèles et faire choir les orgueilleux. Définir son pouvoir. Conduite d’Hippolyte Il méprise Aphrodite et honore Artémis. Appliquer la règle à un cas. Aujourd’hui Les préparatifs de la vengeance sont déjà avancés. Annoncer le drame imminent.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois temps dans la parole d’Aphrodite</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce que dit la déesse</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Fonction dramatique</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Règle générale</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Honorer les fidèles et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">faire choir les</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">orgueilleux.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Définir son pouvoir.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Conduite d’Hippolyte</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Il méprise Aphrodite et</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">honore Artémis.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Appliquer la règle à un</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">cas.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Aujourd’hui</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Les préparatifs de la</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">vengeance sont déjà</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">avancés.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Annoncer le drame imminent.</text>
</g>
</svg>
