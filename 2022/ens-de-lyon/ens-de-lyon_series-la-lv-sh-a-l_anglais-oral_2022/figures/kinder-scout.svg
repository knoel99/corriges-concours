<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 294" width="960" height="294"><title>What makes a park public?</title><rect x="1" y="1" width="958" height="292" rx="12" fill="#FCFAF5" stroke="#CCD3CD" stroke-width="2"/><text x="32" y="48" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="650" text-anchor="start">What makes a park public?</text><text x="32" y="82" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">Two walks bring different obstacles to access into view.</text><rect x="32" y="113" width="290" height="152" rx="12" fill="#E0EDE7" stroke="none" stroke-width="2"/><text x="46" y="144" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start">1932</text><text x="46" y="182" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" text-anchor="start">Kinder Scout</text><text x="46" y="218" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Working people challenge</text><text x="46" y="244" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">restrictions on the moors.</text><rect x="333" y="113" width="290" height="152" rx="12" fill="#F1E5D7" stroke="none" stroke-width="2"/><text x="347" y="144" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start">2022</text><text x="347" y="182" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" text-anchor="start">Kinder in Colour</text><text x="347" y="218" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Edale station makes the</text><text x="347" y="244" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">starting point reachable.</text><rect x="634" y="113" width="290" height="152" rx="12" fill="#E4EAF1" stroke="none" stroke-width="2"/><text x="648" y="144" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start">Question</text><text x="648" y="182" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" text-anchor="start">National parks</text><text x="648" y="218" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Who can visit regularly?</text><text x="648" y="244" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Who sits on park boards?</text></svg>
