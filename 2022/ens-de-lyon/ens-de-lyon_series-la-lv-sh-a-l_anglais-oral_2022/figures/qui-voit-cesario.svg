<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 294" width="960" height="294"><title>Three readings of Cesario</title><rect x="1" y="1" width="958" height="292" rx="12" fill="#FCFAF5" stroke="#CCD3CD" stroke-width="2"/><text x="32" y="48" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="650" text-anchor="start">Three readings of Cesario</text><text x="32" y="82" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">One disguise produces different expectations in Twelfth Night.</text><rect x="32" y="113" width="290" height="152" rx="12" fill="#E0EDE7" stroke="none" stroke-width="2"/><text x="46" y="144" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start">Orsino</text><text x="46" y="182" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" text-anchor="start">A trusted page</text><text x="46" y="218" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Takes Cesario as a messenger</text><text x="46" y="244" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">when addressing Olivia.</text><rect x="333" y="113" width="290" height="152" rx="12" fill="#F1E5D7" stroke="none" stroke-width="2"/><text x="347" y="144" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start">Olivia</text><text x="347" y="182" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" text-anchor="start">A desired visitor</text><text x="347" y="218" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Receives the message and</text><text x="347" y="244" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">becomes interested in its bearer.</text><rect x="634" y="113" width="290" height="152" rx="12" fill="#E4EAF1" stroke="none" stroke-width="2"/><text x="648" y="144" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start">The audience</text><text x="648" y="182" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" text-anchor="start">Viola in disguise</text><text x="648" y="218" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Understands why Cesario</text><text x="648" y="244" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">cannot simply explain.</text></svg>
