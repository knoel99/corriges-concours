<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Entendre les voix dans le récit</title>
<desc id="description">L’avenir imaginé Un espoir antérieur de Charles Recul initial, puis futur rapporté. Les visiteurs Deux conduites provoquent deux plaintes Reprendre la même construction conditionnelle. La demande du soir Deux objets pour un seul verbe Garder le sirop et l’amour dans une même cadence.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Entendre les voix dans le récit</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Passage</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Valeur</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Choix en arabe</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">L’avenir imaginé</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un espoir antérieur de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Charles</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Recul initial, puis futur</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">rapporté.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Les visiteurs</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Deux conduites provoquent</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">deux plaintes</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Reprendre la même</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">construction</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">conditionnelle.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">La demande du soir</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Deux objets pour un seul</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">verbe</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Garder le sirop et l’amour</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">dans une même cadence.</text>
</g>
</svg>
