<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">Le temps de Don Juan dans le portrait</title>
<desc id="description">Un nom impérieux Apellido et mandato. Le nom de famille impose un rôle. Cinquième acte Don Juan revient au seuil du dénouement. Le portrait annonce déjà la fin du drame. Cheveux blancs et barbares Les signes du temps deviennent une invasion. La grandeur impériale prend un tour ironique. Deux soupers Distinguer le dîner redouté de celui que les femmes offrent. L’hospitalité diffère d’un moment le dernier repas.</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Le temps de Don Juan dans le portrait</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Image de départ</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Choix du thème</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet à conserver</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Un nom impérieux</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Apellido et mandato.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le nom de famille impose un</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">rôle.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Cinquième acte</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Don Juan revient au seuil</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">du dénouement.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le portrait annonce déjà la</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">fin du drame.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Cheveux blancs et</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">barbares</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Les signes du temps</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">deviennent une invasion.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La grandeur impériale prend</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">un tour ironique.</text>
<rect x="10" y="293" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Deux soupers</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Distinguer le dîner</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">redouté de celui que les</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">femmes offrent.</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">L’hospitalité diffère d’un</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">moment le dernier repas.</text>
</g>
</svg>
