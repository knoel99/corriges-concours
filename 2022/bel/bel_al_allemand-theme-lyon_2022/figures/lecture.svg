<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Qui juge l’apprentissage du garçon ?</title>
<desc id="description">Le père Il oppose la difficulté du trait à celle du son. Faire entendre le jugement et l’exclamation. Le narrateur Une parenthèse apprécie cette idée du père. Marquer la distance ironique. Louis Prades Sa réponse se réduit à un oui. Préserver la brièveté du consentement.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui juge l’apprentissage du garçon ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voix</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice dans la scène</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet de traduction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le père</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Il oppose la difficulté du</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">trait à celle du son.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Faire entendre le jugement</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">et l’exclamation.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le narrateur</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Une parenthèse apprécie</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">cette idée du père.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Marquer la distance</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">ironique.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Louis Prades</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Sa réponse se réduit à un</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">oui.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Préserver la brièveté du</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">consentement.</text>
</g>
</svg>
