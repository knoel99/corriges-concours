<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment le paysage change-t-il de présence ?</title>
<desc id="description">Arrêt au sommet Le chemin devient dessin et réseau de failles. Fragments et prétérit arrêtent le mouvement. Lumière rasante Le glacier semble se soulever comme un corps. L’hypothèse conserve l’apparence. Nuages et cimetière La scène paraît immédiate, la ville lointaine. Présent et dernière exclamation.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment le paysage change-t-il de présence ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Effet du regard</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ressource en anglais</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Arrêt au sommet</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le chemin devient dessin</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">et réseau de failles.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Fragments et prétérit</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">arrêtent le mouvement.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Lumière rasante</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le glacier semble se</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">soulever comme un corps.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">L’hypothèse conserve</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">l’apparence.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Nuages et cimetière</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">La scène paraît immédiate,</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">la ville lointaine.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Présent et dernière</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">exclamation.</text>
</g>
</svg>
