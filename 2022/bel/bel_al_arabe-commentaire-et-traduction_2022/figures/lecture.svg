<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment mettre une définition à l’épreuve ?</title>
<desc id="description">Mots et contraires Gouvernants et gouvernés Qui peut disposer des droits de qui ? Organisation du pouvoir Exécutants, législateurs et nation Qui est effectivement responsable devant qui ? Degrés et exemples Contrôle dans des régimes différents Peut-on demander des comptes sans entrave ?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment mettre une définition à l’épreuve ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Forme du raisonnement</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Objet observé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question concrète</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Mots et contraires</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Gouvernants et gouvernés</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Qui peut disposer des</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">droits de qui ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Organisation du</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">pouvoir</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Exécutants, législateurs</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">et nation</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Qui est effectivement</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">responsable devant qui ?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Degrés et exemples</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Contrôle dans des régimes</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">différents</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Peut-on demander des</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">comptes sans entrave ?</text>
</g>
</svg>
