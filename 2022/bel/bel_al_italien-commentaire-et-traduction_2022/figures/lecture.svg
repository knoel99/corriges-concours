<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" role="img" aria-labelledby="titre description">
<title id="titre">Entrare in una lingua, ricordare un luogo</title>
<desc id="description">Il primo ciao Una straniera ripete e una ragazza ascolta. L’accento suscita un sorriso. Il cartellone La nuova artista riconosce il proprio volto. La pubblicità fa riaffiorare la casa lontana. La danza con Tognazzi L’attore allude a un programma, lei impara a contare. Un malinteso diventa una lezione. Le rovine di Ercolano Il gesto indica l’antichità, la memoria torna alle città bombardate. Passato antico e guerra recente si incontrano.</desc>
<rect width="720" height="452" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Entrare in una lingua, ricordare un luogo</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Scena</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Doppio sguardo</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effetto</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Il primo ciao</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Una straniera ripete e una</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">ragazza ascolta.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’accento suscita un</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">sorriso.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Il cartellone</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La nuova artista riconosce</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">il proprio volto.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La pubblicità fa</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">riaffiorare la casa</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">lontana.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">La danza con Tognazzi</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">L’attore allude a un</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">programma, lei impara a</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">contare.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Un malinteso diventa una</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">lezione.</text>
<rect x="10" y="337" width="700" height="105" rx="3" fill="#f2ebdf"/>
<text x="24" y="362" font-size="15" font-weight="700" fill="#162d3b">Le rovine di Ercolano</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">Il gesto indica</text>
<text x="229" y="384" font-size="15" font-weight="400" fill="#162d3b">l’antichità, la memoria</text>
<text x="229" y="406" font-size="15" font-weight="400" fill="#162d3b">torna alle città</text>
<text x="229" y="428" font-size="15" font-weight="400" fill="#162d3b">bombardate.</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">Passato antico e guerra</text>
<text x="473" y="384" font-size="15" font-weight="400" fill="#162d3b">recente si incontrano.</text>
</g>
</svg>
