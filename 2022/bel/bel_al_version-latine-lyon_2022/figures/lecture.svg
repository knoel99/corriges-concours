<svg xmlns="http://www.w3.org/2000/svg" width="720" height="274" viewBox="0 0 720 274" role="img" aria-labelledby="titre description">
<title id="titre">Deux malades et un même intérêt</title>
<desc id="description">Vérania Régulus lui prédit qu’elle vivra. Le legs est inscrit et la malade meurt en le maudissant. Velléius Blaesus Régulus presse les médecins de le maintenir en vie. Dès le testament scellé, il réclame qu’on le laisse mourir.</desc>
<rect width="720" height="274" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux malades et un même intérêt</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Malade</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Avant l’avantage attendu</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Après le geste décisif</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Vérania</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Régulus lui prédit qu’elle</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">vivra.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le legs est inscrit et la</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">malade meurt en le</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">maudissant.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Velléius Blaesus</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Régulus presse les</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">médecins de le maintenir</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">en vie.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Dès le testament scellé, il</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">réclame qu’on le laisse</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">mourir.</text>
</g>
</svg>
