<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">Le regard du narrateur sur les Grangier</title>
<desc id="description">Âge des parents Il avance une estimation. Dovevano avere la stessa età. Habitude de la mère Son récit annonce une observation ultérieure. Avrei notato che… Marthe au train L’imprudence est immédiatement séduisante. Quell’imprudente mi incantò. Les fleurs Une parole future et un jugement gardé secret. Mi avrebbe mostrato qualcosa di meglio.</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Le regard du narrateur sur les Grangier</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’il perçoit</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Valeur à rendre</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Solution italienne</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Âge des parents</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Il avance une estimation.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Dovevano avere la stessa</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">età.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Habitude de la mère</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Son récit annonce une</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">observation ultérieure.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Avrei notato che…</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Marthe au train</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">L’imprudence est</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">immédiatement séduisante.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Quell’imprudente mi</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">incantò.</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Les fleurs</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Une parole future et un</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">jugement gardé secret.</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">Mi avrebbe mostrato</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">qualcosa di meglio.</text>
</g>
</svg>
