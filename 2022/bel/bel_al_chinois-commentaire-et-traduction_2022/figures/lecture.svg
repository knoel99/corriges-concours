<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">De la rue à la fenêtre</title>
<desc id="description">Les yeux allumés Les passants regardent en face L’enseigne lumineuse échappe au regard. Les quatre caractères Lu Na se souvient de la commande Une dépense passée mesure le vide actuel. La canne et la commande Un lecteur a mis Lu Na en attente La dernière phrase laisse son objet ouvert.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De la rue à la fenêtre</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Détail</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qui regarde ou attend ?</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce que le récit déplace</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Les yeux allumés</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Les passants regardent en</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">face</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’enseigne lumineuse</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">échappe au regard.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Les quatre caractères</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Lu Na se souvient de la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">commande</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Une dépense passée mesure</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">le vide actuel.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La canne et la</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">commande</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Un lecteur a mis Lu Na en</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">attente</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La dernière phrase laisse</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">son objet ouvert.</text>
</g>
</svg>
