<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Regarder l’enfant, la bonne ou Sara</title>
<desc id="description">Dans la chambre Sara observe la respiration et le front. L’homme a remarqué son amour. Autour de la fenêtre La bonne oublie le même geste. Sara répète « каждый день ». Sur la véranda L’homme énumère ce qu’il a remarqué. Il répète qu’il n’a pas remarqué Sara.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Regarder l’enfant, la bonne ou Sara</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Situation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce que la phrase isole</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Écho dans le dialogue</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Dans la chambre</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Sara observe la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">respiration et le front.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’homme a remarqué son</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">amour.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Autour de la fenêtre</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La bonne oublie le même</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">geste.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Sara répète « каждый день</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">».</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Sur la véranda</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">L’homme énumère ce qu’il a</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">remarqué.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Il répète qu’il n’a pas</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">remarqué Sara.</text>
</g>
</svg>
