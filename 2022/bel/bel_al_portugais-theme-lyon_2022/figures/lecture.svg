<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">O tempo percebido pelo narrador</title>
<desc id="description">O que ela conta A ação anterior e as palavras entre aspas. A versão da mulher continua atribuída a ela. A saída Ações concluídas no pretérito perfeito. O percurso avança enquanto ela se impacienta. O olhar do porteiro Imobilidade e duração no imperfeito. O instante parece se alongar. A distância final Lento, cada vez mais lento. A percepção do corpo se sobrepõe à distância medida.</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">O tempo percebido pelo narrador</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Momento</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Forma de relato</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Efeito</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">O que ela conta</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A ação anterior e as</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">palavras entre aspas.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">A versão da mulher continua</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">atribuída a ela.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">A saída</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Ações concluídas no</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">pretérito perfeito.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">O percurso avança enquanto</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">ela se impacienta.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">O olhar do porteiro</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Imobilidade e duração no</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">imperfeito.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">O instante parece se</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">alongar.</text>
<rect x="10" y="293" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">A distância final</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Lento, cada vez mais</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">lento.</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">A percepção do corpo se</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">sobrepõe à distância</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">medida.</text>
</g>
</svg>
