<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Où peut-on voir le visage des autres ?</title>
<desc id="description">Le pont Deux femmes et leurs reflets dans l’eau. Leur destination demeure inconnue. Le hall Des dos, des cheveux, le visage agrandi de la contremaîtresse. Les ouvrières assises perdent de vue leurs visages. Les toilettes Les visages réapparaissent dans la pause. Le néon et la surveillance prolongent le travail.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Où peut-on voir le visage des autres ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lieu</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui devient visible</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui échappe</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le pont</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Deux femmes et leurs</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">reflets dans l’eau.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Leur destination demeure</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">inconnue.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le hall</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Des dos, des cheveux, le</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">visage agrandi de la</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">contremaîtresse.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Les ouvrières assises</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">perdent de vue leurs</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">visages.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Les toilettes</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Les visages réapparaissent</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">dans la pause.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Le néon et la surveillance</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">prolongent le travail.</text>
</g>
</svg>
