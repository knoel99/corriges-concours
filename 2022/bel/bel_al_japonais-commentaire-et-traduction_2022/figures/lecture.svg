<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Qui est proche, qui se trouve seul ?</title>
<desc id="description">Cabines en fête Rires, chants, table des responsables. Des groupes passent la même soirée séparément. Poupe dans le noir Onatsu voit un homme de dos. Le récit passe de son regard à la solitude de Komizu. Deux personnes sur le pont Un pas, un signe de tête incertain. Komizu propose un avenir dont la réponse manque.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui est proche, qui se trouve seul ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Espace</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est perceptible</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Relation entre les personnes</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Cabines en fête</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Rires, chants, table des</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">responsables.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Des groupes passent la même</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">soirée séparément.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Poupe dans le noir</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Onatsu voit un homme de</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">dos.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le récit passe de son</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">regard à la solitude de</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">Komizu.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Deux personnes sur le</text>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">pont</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Un pas, un signe de tête</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">incertain.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Komizu propose un avenir</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">dont la réponse manque.</text>
</g>
</svg>
