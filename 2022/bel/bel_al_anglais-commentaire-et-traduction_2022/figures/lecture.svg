<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Quel âge le miroir donne-t-il à Cecilia ?</title>
<desc id="description">Noir, au palier Une veuve de quatre-vingt-cinq ans, un coléoptère. Elle tourne les talons. Rose, au palier Une fillette en robe de fête. Elle remonte ses cheveux pour essayer l’image. Vert, dans sa chambre Une sirène insaisissable. La sensation de sécurité précède le cri.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quel âge le miroir donne-t-il à Cecilia ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Tenue et lieu</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Image qui s’impose</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Réaction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Noir, au palier</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Une veuve de quatre-vingt-</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">cinq ans, un coléoptère.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Elle tourne les talons.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Rose, au palier</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Une fillette en robe de</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">fête.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Elle remonte ses cheveux</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">pour essayer l’image.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Vert, dans sa chambre</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Une sirène insaisissable.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La sensation de sécurité</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">précède le cri.</text>
</g>
</svg>
