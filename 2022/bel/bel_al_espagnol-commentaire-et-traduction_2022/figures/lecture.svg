<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" role="img" aria-labelledby="titre description">
<title id="titre">Les objets font changer d’époque</title>
<desc id="description">Fenêtre et lunettes Chantiers, froid des carreaux, recherche à tâtons. Le présent se perçoit par plusieurs sens. Lit, lampe, chaussures Modernité des années soixante, atelier du cordonnier. Le narrateur et le prêtre évaluent autrement les objets. Genoux et soutane absente Rumeur de la ville et rejet du prêtre. Le corps conserve des habitudes anciennes. Terrain de sport Le marquage demeure, les joueurs ont disparu. La seconde chute des lunettes ramène au présent.</desc>
<rect width="720" height="408" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Les objets font changer d’époque</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Objet ou lieu</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’il fait surgir</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Point de vue</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Fenêtre et lunettes</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Chantiers, froid des</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">carreaux, recherche à</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">tâtons.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le présent se perçoit par</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">plusieurs sens.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Lit, lampe,</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">chaussures</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Modernité des années</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">soixante, atelier du</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">cordonnier.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Le narrateur et le prêtre</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">évaluent autrement les</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">objets.</text>
<rect x="10" y="270" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Genoux et soutane</text>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">absente</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Rumeur de la ville et</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">rejet du prêtre.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Le corps conserve des</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">habitudes anciennes.</text>
<rect x="10" y="337" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="362" font-size="15" font-weight="700" fill="#162d3b">Terrain de sport</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">Le marquage demeure, les</text>
<text x="229" y="384" font-size="15" font-weight="400" fill="#162d3b">joueurs ont disparu.</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">La seconde chute des</text>
<text x="473" y="384" font-size="15" font-weight="400" fill="#162d3b">lunettes ramène au présent.</text>
</g>
</svg>
