<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Qui peut dire ce qu’il voit ?</title>
<desc id="description">Le jardin Le bolet pousse où il veut. Le mot de liberté amuse le maître. Le rire du jardinier Son regard s’arrête au menton. Les deux regards possibles sont suspects. La liste sur la table Des vies sont classées par catégories. La formule cache au signataire l’effet de sa décision.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui peut dire ce qu’il voit ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Détail concret</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet du langage</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le jardin</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le bolet pousse où il</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">veut.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le mot de liberté amuse le</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">maître.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le rire du jardinier</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Son regard s’arrête au</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">menton.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Les deux regards possibles</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">sont suspects.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La liste sur la table</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Des vies sont classées par</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">catégories.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La formule cache au</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">signataire l’effet de sa</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">décision.</text>
</g>
</svg>
