<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">De uma lapela ao céu da fábrica</title>
<desc id="description">O passeio Medalha e fita O título ganha um suporte material. O canto do Conde Apitos, teares, vozes Muitos produzem o som atribuído a um homem. O bonde Bonés dos empregados Um objeto basta para tornar a função visível. O voo final Medalha no bico Fica em aberto quem merece a honra.</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De uma lapela ao céu da fábrica</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Momento da crônica</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Sinal de autoridade</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Deslocamento</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">O passeio</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Medalha e fita</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">O título ganha um suporte</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">material.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">O canto do Conde</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Apitos, teares, vozes</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Muitos produzem o som</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">atribuído a um homem.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">O bonde</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Bonés dos empregados</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Um objeto basta para tornar</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">a função visível.</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">O voo final</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Medalha no bico</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">Fica em aberto quem merece</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">a honra.</text>
</g>
</svg>
