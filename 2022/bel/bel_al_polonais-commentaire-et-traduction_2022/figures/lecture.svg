<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">À quel moment Kelvin sait-il qu’il tombe ?</title>
<desc id="description">Voix de Moddard Le vol a déjà commencé. Le corps ne sent pas le départ. Chiffres et corps La chute est rapide, puis sensible. L’apparition même de la planète est manquée. Vue de la station Le damier grandit devant lui. La voix qui accueille est celle d’un appareil.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">À quel moment Kelvin sait-il qu’il tombe ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Source d’information</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’elle lui apprend</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui lui échappe</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Voix de Moddard</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le vol a déjà commencé.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le corps ne sent pas le</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">départ.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Chiffres et corps</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La chute est rapide, puis</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">sensible.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">L’apparition même de la</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">planète est manquée.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Vue de la station</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le damier grandit devant</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">lui.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La voix qui accueille est</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">celle d’un appareil.</text>
</g>
</svg>
