<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Le parcours de la dilatation</title>
<desc id="description">Souffle et voix Un défilé étroit devient gué Faire entendre le passage. Ce qui arrive Le futur surgit déjà ici Répéter la venue dans la réponse. Ici et là La promesse exige un départ Conserver les deux pôles du mouvement.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Le parcours de la dilatation</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Mouvement</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Difficulté</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Choix de traduction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Souffle et voix</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un défilé étroit devient</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">gué</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Faire entendre le passage.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Ce qui arrive</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le futur surgit déjà ici</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Répéter la venue dans la</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">réponse.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Ici et là</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">La promesse exige un</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">départ</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Conserver les deux pôles du</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">mouvement.</text>
</g>
</svg>
