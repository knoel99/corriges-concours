<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="t d"><title id="t">Matthieu Letourneux et l’indifférence de l’aventure à la justice</title><desc id="d">Un même épisode met en jeu trois questions différentes. Le dénouement d’un danger, le droit de l’hôte et le jugement du public ne coïncident pas.</desc><rect width="760" height="240" fill="white"/><g font-family="sans-serif"><rect x="10" y="14" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="49" fill="#194754" font-size="18" font-weight="bold">Épreuve</text><text x="212" y="37" fill="#253a40" font-size="18" font-weight="bold">Ulysse veut sortir de la caverne.</text><text x="212" y="62" fill="#193f4b" font-size="16" font-weight="normal">L’urgence fait d’une issue possible le seul horizon.</text><rect x="10" y="88" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="123" fill="#194754" font-size="18" font-weight="bold">Hospitalité</text><text x="212" y="111" fill="#253a40" font-size="18" font-weight="bold">Que peut demander un étranger à celui qui l’accueille ?</text><text x="212" y="136" fill="#193f4b" font-size="16" font-weight="normal">Le voyageur transporte avec lui des obligations.</text><rect x="10" y="162" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="197" fill="#194754" font-size="18" font-weight="bold">Récit</text><text x="212" y="185" fill="#253a40" font-size="18" font-weight="bold">Ulysse raconte l’épisode aux Phéaciens.</text><text x="212" y="210" fill="#193f4b" font-size="16" font-weight="normal">Il dépend désormais de la justice de ses auditeurs.</text></g></svg>