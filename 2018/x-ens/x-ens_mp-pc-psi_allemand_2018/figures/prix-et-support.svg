<svg xmlns="http://www.w3.org/2000/svg" width="780" height="221" viewBox="0 0 780 221" role="img"><title>Trois prix à distinguer pour lire l’entretien sur les livres numériques en Allemagne et aux États-Unis.</title><rect width="780" height="221" fill="#f5f7f5"/>
<text x="18" y="33" fill="#173c44" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Trois prix à distinguer</text>
<rect x="18" y="49" width="744" height="50" fill="#e2efea"/>
<text x="31" y="80" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Allemagne</text>
<text x="277" y="70" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Une édition numérique coûte environ</text>
<text x="277" y="91" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">20 % de moins que l’édition imprimée.</text>
<rect x="18" y="103" width="744" height="50" fill="#edf1f2"/>
<text x="31" y="134" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">États-Unis</text>
<text x="277" y="124" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Certaines éditions numériques coûtent</text>
<text x="277" y="145" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">jusqu’à 50 % de moins que l’imprimé.</text>
<rect x="18" y="157" width="744" height="50" fill="#e4edf0"/>
<text x="31" y="188" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Prix fixe allemand</text>
<text x="277" y="178" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Un même titre numérique a le même prix</text>
<text x="277" y="199" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">entre les deux points de vente comparés.</text></svg>
