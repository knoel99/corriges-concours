<svg xmlns="http://www.w3.org/2000/svg" width="740" height="215" viewBox="0 0 740 215" role="img"><title>Utilisateurs du paiement en ligne et du paiement sur mobile, en millions de personnes, selon le CNNIC.</title>
<rect x="0" y="0" width="740" height="215" fill="#f4f8f6"/>
<text x="22" y="34" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start">Utilisateurs en millions</text>
<text x="432" y="72" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Décembre 2016</text>
<text x="625" y="72" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Juin 2017</text>
<rect x="20" y="88" width="700" height="37" fill="#deebe7"/>
<text x="30" y="113" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">Paiement en ligne</text>
<text x="432" y="113" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">474,50</text>
<text x="625" y="113" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle">511,04</text>
<rect x="20" y="130" width="700" height="37" fill="#eaf1ef"/>
<text x="30" y="155" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">Paiement sur mobile</text>
<text x="432" y="155" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle">469,20</text>
<text x="625" y="155" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle">501,85</text>
<text x="22" y="198" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Les utilisateurs mobiles figurent aussi dans le total des paiements en ligne.</text></svg>
