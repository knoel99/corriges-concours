<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Ce que le dossier révèle quand on suit une journée de travail plutôt qu’un seul salaire.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Gagner sa vie</text>
<text x="27" y="123" font-size="16">La travailleuse paie le</text>
<text x="27" y="145" font-size="16">trajet et parfois la</text>
<text x="27" y="167" font-size="16">garde de son enfant.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Assurer les soins</text>
<text x="298" y="123" font-size="16">Quand la mère part tôt,</text>
<text x="298" y="145" font-size="16">une fille peut prendre</text>
<text x="298" y="167" font-size="16">en charge le petit</text>
<text x="298" y="189" font-size="16">déjeuner.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Ouvrir une option</text>
<text x="569" y="123" font-size="16">Au Fayoum, un projet</text>
<text x="569" y="145" font-size="16">associe formation,</text>
<text x="569" y="167" font-size="16">activité économique et</text>
<text x="569" y="189" font-size="16">accueil des enfants.</text>
</g></svg>
