<svg xmlns="http://www.w3.org/2000/svg" width="810" height="282" viewBox="0 0 810 282" role="img" aria-labelledby="titre description">
<title id="titre">À qui se rapporte la maîtrise dans la lettre ?</title>
<desc id="description">Il déclare la victoire — L’exclamation prend Merteuil à témoin.. Il s’examine — La durée du trouble dément son calcul.. Il invoque la gloire — Il attend encore le jugement de sa lectrice..</desc>
<rect width="810" height="282" fill="#ffffff" rx="6"/>
<rect x="1" y="1" width="808" height="51" fill="#234555" rx="5"/>
<text x="17" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Position de Valmont</text>
<text x="311" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Indice laissé au lecteur</text>
<rect x="1" y="56" width="808" height="70" rx="3" fill="#edf4f3"/>
<text x="17" y="99" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Il déclare la victoire</text>
<text x="311" y="99" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">L’exclamation prend Merteuil à témoin.</text>
<rect x="1" y="130" width="808" height="70" rx="3" fill="#f4f2ed"/>
<text x="17" y="173" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Il s’examine</text>
<text x="311" y="173" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">La durée du trouble dément son calcul.</text>
<rect x="1" y="204" width="808" height="70" rx="3" fill="#edf1f8"/>
<text x="17" y="247" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Il invoque la gloire</text>
<text x="311" y="233" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Il attend encore le jugement de sa</text>
<text x="311" y="258" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">lectrice.</text>
<path d="M292 55 V274" stroke="#acb9bc" stroke-width="1"/>
</svg>
