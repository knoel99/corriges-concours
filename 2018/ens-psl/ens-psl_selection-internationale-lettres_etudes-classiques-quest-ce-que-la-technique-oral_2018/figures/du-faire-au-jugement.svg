<svg xmlns="http://www.w3.org/2000/svg" width="810" height="278" viewBox="0 0 810 278" role="img" aria-labelledby="titre description"><title id="titre">Trois épreuves du savoir technique</title><desc id="description">Le navire engage un jugement sur l’usage de la puissance, l’écriture un examen de l’apprentissage, et la maison un savoir du possible.</desc><rect width="810" height="278" fill="#fff"/>
<rect x="9" y="12" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Le navire chez Sophocle</text>
<text x="167.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">L’homme trouve un passage</text>
<rect x="384" y="12" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Un pouvoir à orienter</text>
<text x="592.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Vers quel bien emploie-t-on ce moyen ?</text>
<path d="M330 48 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="100" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Les lettres chez Platon</text>
<text x="167.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">La trace se conserve au-dehors</text>
<rect x="384" y="100" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Un effet à examiner</text>
<text x="592.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Qui peut restituer les raisons du savoir ?</text>
<path d="M330 136 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="188" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">La maison chez Heidegger</text>
<text x="167.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">La forme guide les opérations</text>
<rect x="384" y="188" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Un possible à dévoiler</text>
<text x="592.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Qu’est-il possible de faire venir au jour ?</text>
<path d="M330 224 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
</svg>
