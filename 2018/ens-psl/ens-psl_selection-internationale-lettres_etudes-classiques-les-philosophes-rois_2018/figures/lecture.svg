<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Ce que la philosophie exige du pouvoir</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Ce que la philosophie exige du pouvoir</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Le bien des gouvernés</text>
<text x="75" y="129" font-size="17">Un art se juge par sa fin. Réussir à commander ne suffit pas à gouverner</text>
<text x="75" y="151" font-size="17">justement.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">Le retour à la cité</text>
<text x="75" y="219" font-size="17">Le philosophe formé revient dans la caverne et rencontre la difficulté de</text>
<text x="75" y="241" font-size="17">convaincre.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">La mise à l’épreuve</text>
<text x="75" y="309" font-size="17">La sagesse individuelle a besoin de procédures par lesquelles on puisse la</text>
<text x="75" y="331" font-size="17">contredire.</text>
</g></svg>
