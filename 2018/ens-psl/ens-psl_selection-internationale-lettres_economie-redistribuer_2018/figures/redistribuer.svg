<svg xmlns="http://www.w3.org/2000/svg" width="948" height="397" viewBox="0 0 948 397" role="img">
<title>Du revenu initial aux ressources effectivement accessibles</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Opération</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Exemple</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Question d’évaluation</text>
<rect x="13" y="62" width="302" height="69" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Prélèvement obligatoire</text>
<rect x="323" y="62" width="302" height="69" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Impôt progressif sur le</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">revenu</text>
<rect x="633" y="62" width="302" height="69" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Qui supporte effectivement la</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">charge ?</text>
<rect x="13" y="140" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="167" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Prestation monétaire</text>
<rect x="323" y="140" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="167" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Transfert sous condition de</text>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">ressources</text>
<rect x="633" y="140" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="167" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Qui reçoit le droit ouvert et</text>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">comment le montant varie-t-il</text>
<text x="644" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">avec le revenu ?</text>
<rect x="13" y="241" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Service financé</text>
<text x="24" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">collectivement</text>
<rect x="323" y="241" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Enseignement accessible aux</text>
<text x="334" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">ménages</text>
<rect x="633" y="241" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Qui utilise le service et</text>
<text x="644" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">comment en évaluer le</text>
<text x="644" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">bénéfice ?</text>
<text x="19" y="359" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">Prélèvements et prestations monétaires entrent dans le revenu disponible. Les services en</text>
<text x="19" y="383" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">nature élargissent le périmètre.</text>
</svg>
