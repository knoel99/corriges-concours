<svg xmlns="http://www.w3.org/2000/svg" width="948" height="466" viewBox="0 0 948 466" role="img">
<title>Des flux migratoires au marché du travail</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Canal</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Mécanisme</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Observation nécessaire</text>
<rect x="13" y="62" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Tâches substituables</text>
<rect x="323" y="62" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">À capital donné, l’offre d’un</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">type de travail augmente</text>
<rect x="633" y="62" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Salaires et emploi dans les</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">professions directement</text>
<text x="644" y="135" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">exposées</text>
<rect x="13" y="163" width="302" height="115" rx="7" fill="#e0edef"/>
<text x="24" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Tâches complémentaires</text>
<rect x="323" y="163" width="302" height="115" rx="7" fill="#edf1e5"/>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Une équipe plus diversifiée</text>
<text x="334" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">peut accroître la</text>
<text x="334" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">productivité d’autres</text>
<text x="334" y="259" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">salariés</text>
<rect x="633" y="163" width="302" height="115" rx="7" fill="#f7eddf"/>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Répartition effective des</text>
<text x="644" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">tâches et adaptation des</text>
<text x="644" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">entreprises</text>
<rect x="13" y="287" width="302" height="115" rx="7" fill="#e0edef"/>
<text x="24" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Intégration des arrivants</text>
<rect x="323" y="287" width="302" height="115" rx="7" fill="#edf1e5"/>
<text x="334" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Durée, langue et</text>
<text x="334" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">reconnaissance des diplômes</text>
<text x="334" y="360" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">peuvent modifier l’accès à</text>
<text x="334" y="383" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">l’emploi</text>
<rect x="633" y="287" width="302" height="115" rx="7" fill="#f7eddf"/>
<text x="644" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Cohorte, motif d’entrée,</text>
<text x="644" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">emploi et niveau des postes</text>
<text x="644" y="360" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">obtenus</text>
<text x="19" y="428" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">Un changement local après des arrivées doit être comparé à une trajectoire contrefactuelle</text>
<text x="19" y="452" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">crédible.</text>
</svg>
