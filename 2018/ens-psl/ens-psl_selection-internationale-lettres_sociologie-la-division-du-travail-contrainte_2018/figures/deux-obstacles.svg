<svg xmlns="http://www.w3.org/2000/svg" width="780" height="197" viewBox="0 0 780 197" role="img"><title>Deux formes de fermeture peuvent subsister après une ouverture juridique.</title><rect width="100%" height="100%" fill="#fbfcf9"/>
<text x="16" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Obstacle</text>
<text x="245" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">À quel moment ?</text>
<text x="490" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Observation possible</text>
<rect x="7" y="43" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Coût de la formation</text>
<text x="245" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Avant la candidature</text>
<text x="490" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Qui peut se présenter ?</text>
<rect x="7" y="90" width="765" height="40" rx="6" fill="#f1f1e6"/>
<text x="16" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Préjugé au recrutement</text>
<text x="245" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Au tri des candidatures</text>
<text x="490" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Qui obtient un rappel ?</text>
<rect x="7" y="137" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Garanties possibles</text>
<text x="245" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Aux deux étapes</text>
<text x="490" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Bourse, puis recours</text></svg>
