<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 312" width="780" height="312" role="img" aria-labelledby="titre exp"><title id="titre">Où passe la frontière du corps ?</title><desc id="exp">Trois opérations de la peau relient une description du corps aux relations entre personnes.</desc><rect width="780" height="312" rx="14" fill="#f6f4ed"/>
<text x="23" y="37" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#163635">Où passe la frontière du corps ?</text>
<rect x="20" y="58" width="740" height="72" rx="6" fill="#ffffff"/><rect x="20" y="58" width="5" height="72" fill="#176a63"/>
<text x="38" y="87" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Protéger</text>
<text x="233" y="86" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Les Annales décrivent une enveloppe sensible. Anzieu y</text>
<text x="233" y="109" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">adosse une représentation du moi.</text>
<rect x="20" y="139" width="740" height="72" rx="6" fill="#ffffff"/><rect x="20" y="139" width="5" height="72" fill="#176a63"/>
<text x="38" y="168" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Toucher</text>
<text x="233" y="167" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Chez Flaubert, la chaleur échangée transforme la rencontre</text>
<text x="233" y="190" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">entre Julien et son hôte.</text>
<rect x="20" y="220" width="740" height="72" rx="6" fill="#ffffff"/><rect x="20" y="220" width="5" height="72" fill="#176a63"/>
<text x="38" y="249" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Être vu</text>
<text x="233" y="248" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">McConkey détache la surface. À Brazzaville, le teint est</text>
<text x="233" y="271" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">pris dans des jugements concurrents.</text>
</svg>
