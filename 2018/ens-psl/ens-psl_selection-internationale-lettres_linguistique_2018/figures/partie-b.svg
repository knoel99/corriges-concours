<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Que reçoit la seconde proposition ?</title>
<desc id="description">Et La composante de gauche est vraie : w1 et w3. Les deux étudiants vont bien en w3. Ou La composante de gauche est fausse : w2 et w4. Le seul étudiant est malade en w2. Union finale pour « ou » Réunir w2 avec les mondes où la gauche est vraie. w1, w2, w3.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que reçoit la seconde proposition ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Connecteur</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Contexte transmis à droite</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Résultat sur les quatre mondes</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Et</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La composante de gauche</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">est vraie : w1 et w3.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les deux étudiants vont</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">bien en w3.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Ou</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La composante de gauche</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">est fausse : w2 et w4.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le seul étudiant est malade</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">en w2.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Union finale pour «</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">ou »</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Réunir w2 avec les mondes</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">où la gauche est vraie.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">w1, w2, w3.</text>
</g>
</svg>
