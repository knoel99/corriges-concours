<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Deux analyses d’une même phrase négative</title>
<desc id="description">Globale Le classement impossible est projeté : réponse « faux ». 2,47 secondes. Locale La négation porte sur le classement et la croyance : réponse « vrai ». 3,47 secondes. Hypothèse comparée Une réparation locale après projection devrait coûter du temps. Sens de l’effet observé dans l’expérience 1.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux analyses d’une même phrase négative</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lecture</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Résultat dans le scénario</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Temps moyen observé</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Globale</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le classement impossible</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">est projeté : réponse «</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">faux ».</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">2,47 secondes.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Locale</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">La négation porte sur le</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">classement et la croyance</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">: réponse « vrai ».</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">3,47 secondes.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Hypothèse comparée</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Une réparation locale</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">après projection devrait</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">coûter du temps.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Sens de l’effet observé</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">dans l’expérience 1.</text>
</g>
</svg>
