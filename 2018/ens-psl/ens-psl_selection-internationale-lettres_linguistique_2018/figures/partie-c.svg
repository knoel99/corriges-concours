<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Pourquoi allonger avant de dévoiser ?</title>
<desc id="description">/lad/ · ordre retenu L’allongement reconnaît le d final sonore. Le dévoisement laisse une voyelle longue devant t. /lad/ · ordre inverse Le dévoisement supprime le d sonore. L’allongement ne s’applique plus, contrairement aux données. /lad+e/ La consonne est suivie d’une voyelle. Les deux règles finales restent sans effet.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Pourquoi allonger avant de dévoiser ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Entrée</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Première opération</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Sortie</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">/lad/ · ordre retenu</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">L’allongement reconnaît le</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">d final sonore.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le dévoisement laisse une</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">voyelle longue devant t.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">/lad/ · ordre inverse</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le dévoisement supprime le</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">d sonore.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">L’allongement ne s’applique</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">plus, contrairement aux</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">données.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">/lad+e/</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">La consonne est suivie</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">d’une voyelle.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Les deux règles finales</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">restent sans effet.</text>
</g>
</svg>
