<svg xmlns="http://www.w3.org/2000/svg" width="820" height="376" viewBox="0 0 820 376" role="img" aria-labelledby="titre desc">
<title id="titre">Quatre conceptions de l’intervention culturelle</title>
<desc id="desc">Quatre logiques distinctes : contrôle, substitution, autonomie et développement.</desc>
<rect x="0.5" y="0.5" width="819" height="375" rx="10" fill="#fffdf7" stroke="#a9b7b1"/>
<text x="20" y="32" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#243f48" font-size="22">Quatre conceptions de l’intervention culturelle</text><text x="20" y="55" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">Types idéaux pour comparer les années 1980. Un pays peut combiner plusieurs logiques.</text>
<rect x="18" y="69" width="784" height="58" rx="5" fill="#f0efe6"/><text x="30" y="102" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#243f48" font-size="17">Encadrement étatique</text><text x="237" y="93" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">Régulation étendue, pouvant aller jusqu’à la censure.</text><text x="237" y="114" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">La politique culturelle participe au contrôle idéologique.</text>
<rect x="18" y="135" width="784" height="58" rx="5" fill="#e3ede9"/><text x="30" y="168" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#243f48" font-size="17">Relais public</text><text x="237" y="159" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">L’État supplée des initiatives privées jugées insuffisantes.</text><text x="237" y="180" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">Les fonctions du public et du privé restent distinctes.</text>
<rect x="18" y="201" width="784" height="58" rx="5" fill="#f0efe6"/><text x="30" y="234" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#243f48" font-size="17">Autonomie</text><text x="237" y="225" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">La gestion publique directe peut menacer la création.</text><text x="237" y="246" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">Les industries culturelles peuvent être fortes sur le marché mondial.</text>
<rect x="18" y="267" width="784" height="58" rx="5" fill="#e3ede9"/><text x="30" y="300" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#243f48" font-size="17">Développement</text><text x="237" y="291" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">L’intervention vise des besoins sociaux ou une identité nationale.</text><text x="237" y="312" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">L’ambition affichée peut dépasser les moyens publics et privés.</text>
<text x="20" y="362" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="14">Comparer la justification de l’intervention, ses instruments et les ressources mobilisables.</text>
</svg>
