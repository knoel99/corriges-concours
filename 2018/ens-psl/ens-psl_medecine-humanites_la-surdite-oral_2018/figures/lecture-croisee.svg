<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 245" width="780" height="245" role="img" aria-labelledby="titre exp"><title id="titre">Qui apprend de qui ?</title><desc id="exp">Le statut du geste change avec la question posée et avec la personne qui a le pouvoir de l’évaluer.</desc><rect width="780" height="245" rx="14" fill="#f6f4ed"/>
<text x="23" y="37" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#163635">Qui apprend de qui ?</text>
<rect x="20" y="49" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="49" width="5" height="58" fill="#176a63"/>
<text x="38" y="73" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Mesurer</text>
<text x="233" y="71" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Le rapport de 2007 expose des critères auditifs</text>
<text x="233" y="92" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">historiques pour une question clinique précise.</text>
<rect x="20" y="112" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="112" width="5" height="58" fill="#176a63"/>
<text x="38" y="136" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Transmettre</text>
<text x="233" y="134" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Pereire enseigne à son élève. Léonard conseille au peintre</text>
<text x="233" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">de prendre le geste pour maître.</text>
<rect x="20" y="175" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="175" width="5" height="58" fill="#176a63"/>
<text x="38" y="199" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Appartenir</text>
<text x="233" y="197" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Encrevé et Baillet interrogent les conditions collectives</text>
<text x="233" y="218" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">d’une éducation et d’une langue.</text>
</svg>
