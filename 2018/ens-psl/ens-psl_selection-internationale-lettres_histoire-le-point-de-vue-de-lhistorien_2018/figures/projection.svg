<svg xmlns="http://www.w3.org/2000/svg" width="880" height="327" viewBox="0 0 880 327" role="img"><title>Un événement commun à deux chronologies ?</title><desc>Deux lignes de récit ne donnent pas la même importance à l’arrivée des navires à Banten. Aucun ordre des autres événements n’est supposé.</desc><rect width="880" height="327" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="21" y="37" font-size="25" fill="#17394c" font-weight="bold">Un événement commun à deux chronologies ?</text><rect x="22" y="71" width="836" height="86" fill="#eaf0ea" stroke="none" stroke-width="1"/><text x="32" y="112" font-size="17" fill="#17394c" font-weight="bold">Récit de l’expédition</text><line x1="260" y1="112" x2="431" y2="112" stroke="#566d78" stroke-width="2"/><text x="451" y="110" font-size="15" fill="#17394c" font-weight="bold">Arrivée de la flotte à Banten en 1596.</text><text x="451" y="135" font-size="14" fill="#17394c">L’événement structure le récit néerlandais.</text><rect x="22" y="176" width="836" height="86" fill="#eaf0ea" stroke="none" stroke-width="1"/><text x="32" y="217" font-size="17" fill="#17394c" font-weight="bold">Chroniques locales</text><line x1="260" y1="217" x2="431" y2="217" stroke="#566d78" stroke-width="2"/><text x="451" y="215" font-size="15" fill="#17394c" font-weight="bold">D’autres événements font date.</text><text x="451" y="240" font-size="14" fill="#17394c">Aucun silence ne démontre une absence de témoins.</text><circle cx="354" cy="112" r="6" fill="#995f32" stroke="none" stroke-width="1"/><line x1="354" y1="126" x2="354" y2="195" stroke="#87978d" stroke-width="1"/><circle cx="354" cy="217" r="6" fill="#eaf0ea" stroke="#995f32" stroke-width="2"/><text x="23" y="304" font-size="15" fill="#17394c">Le cercle vide signale une question sur la place du fait dans le récit local, non sur la réalité de l’arrivée.</text></g></svg>
