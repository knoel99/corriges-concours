<svg xmlns="http://www.w3.org/2000/svg" width="780" height="197" viewBox="0 0 780 197" role="img"><title>Quels indices permettent de reconnaître un espace scolaire international ?</title><rect width="100%" height="100%" fill="#fbfcf9"/>
<text x="16" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Indice</text>
<text x="245" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Ce qu’il documente</text>
<text x="490" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Question encore ouverte</text>
<rect x="7" y="43" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Diplôme commun</text>
<text x="245" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Coordination des cursus</text>
<text x="490" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Quels savoirs en commun ?</text>
<rect x="7" y="90" width="765" height="40" rx="6" fill="#f1f1e6"/>
<text x="16" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Brochure et fêtes</text>
<text x="245" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Différences mises en scène</text>
<text x="490" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Quels usages par les élèves ?</text>
<rect x="7" y="137" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Choix des familles</text>
<text x="245" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Valeur attendue des filières</text>
<text x="490" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Qui peut y accéder ?</text></svg>
