<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">À qui attribuer chaque prise de position ?</title>
<desc id="description">Cédric Sauviat Envisager l’arrêt des recherches. Thèse défendue au nom de l’AFCIA. Irénée Régnauld Rappeler des découvertes possibles. Objection adressée à son interlocuteur. À la fin Reconnaître les limites du débat. Le journaliste maintient la place de la parole citoyenne.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">À qui attribuer chaque prise de position ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voix</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Proposition</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Statut</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Cédric Sauviat</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Envisager l’arrêt des</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">recherches.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Thèse défendue au nom de</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">l’AFCIA.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Irénée Régnauld</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Rappeler des découvertes</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">possibles.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Objection adressée à son</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">interlocuteur.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">À la fin</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Reconnaître les limites du</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">débat.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le journaliste maintient la</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">place de la parole</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">citoyenne.</text>
</g>
</svg>
