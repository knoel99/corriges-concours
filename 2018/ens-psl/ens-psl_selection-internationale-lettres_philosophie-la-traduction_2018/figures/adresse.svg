<svg xmlns="http://www.w3.org/2000/svg" width="880" height="325" viewBox="0 0 880 325" role="img"><title>Quel geste de parole faut-il rendre ?</title><desc>Comparaison de situations. Accueil : Asseyez-vous, je vous en prie. ; Le ton transforme la permission en invitation.. Autorisation : Vous pouvez vous asseoir. ; La scène indique qui peut lever une interdiction.. Relation familière : Tu peux t’asseoir. ; Le choix du tutoiement exige un indice dans le dialogue.</desc><rect width="880" height="325" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="21" y="37" font-size="25" fill="#17394c" font-weight="bold">Quel geste de parole faut-il rendre ?</text><text x="24" y="67" font-size="17" fill="#17394c" font-weight="bold">Énoncé de départ : « You may sit down. »</text><rect x="24" y="85" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="85" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="113" font-size="16" fill="#17394c" font-weight="bold">Accueil</text><text x="231" y="110" font-size="18" fill="#17394c" font-weight="bold">Asseyez-vous, je vous en prie.</text><text x="231" y="135" font-size="15" fill="#17394c">Le ton transforme la permission en invitation.</text><rect x="24" y="160" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="160" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="188" font-size="16" fill="#17394c" font-weight="bold">Autorisation</text><text x="231" y="185" font-size="18" fill="#17394c" font-weight="bold">Vous pouvez vous asseoir.</text><text x="231" y="210" font-size="15" fill="#17394c">La scène indique qui peut lever une interdiction.</text><rect x="24" y="235" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="235" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="263" font-size="16" fill="#17394c" font-weight="bold">Relation familière</text><text x="231" y="260" font-size="18" fill="#17394c" font-weight="bold">Tu peux t’asseoir.</text><text x="231" y="285" font-size="15" fill="#17394c">Le choix du tutoiement exige un indice dans le dialogue.</text></g></svg>
