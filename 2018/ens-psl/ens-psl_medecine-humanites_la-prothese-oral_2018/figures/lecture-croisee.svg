<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 312" width="780" height="312" role="img" aria-labelledby="titre exp"><title id="titre">Qui fixe le critère de réussite ?</title><desc id="exp">L’unité d’un corps, les gestes permis et la destination sociale appellent des jugements différents.</desc><rect width="780" height="312" rx="14" fill="#f6f4ed"/>
<text x="23" y="37" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#163635">Qui fixe le critère de réussite ?</text>
<rect x="20" y="58" width="740" height="72" rx="6" fill="#ffffff"/><rect x="20" y="58" width="5" height="72" fill="#176a63"/>
<text x="38" y="87" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Intégrité</text>
<text x="233" y="86" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Ovide réunit les membres de Pélops. La différence de</text>
<text x="233" y="109" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">matière reste visible.</text>
<rect x="20" y="139" width="740" height="72" rx="6" fill="#ffffff"/><rect x="20" y="139" width="5" height="72" fill="#176a63"/>
<text x="38" y="168" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Usage</text>
<text x="233" y="167" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Le crochet de Barrie nourrit une vantardise. Jarassé</text>
<text x="233" y="190" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">demande quels gestes sont réellement possibles.</text>
<rect x="20" y="220" width="740" height="72" rx="6" fill="#ffffff"/><rect x="20" y="220" width="5" height="72" fill="#176a63"/>
<text x="38" y="249" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Destination</text>
<text x="233" y="248" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Atwood donne à voir des moules individuels. Nicogossian</text>
<text x="233" y="271" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">distingue service actif et retour au front.</text>
</svg>
