<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titre description" viewBox="0 0 850 212">
<title id="titre">Trois questions pour comparer les six documents</title><desc id="description">Participation aux affaires, représentation du monde commun et jugement public sont distingués à partir de trois rapprochements du corpus.</desc>
<rect width="850" height="212" fill="white"/>
<rect x="6" y="8" width="273" height="189" rx="10" stroke="#b3c6cf" fill="#f5f8f9"/><path d="M23 69 h238" fill="none" stroke="#a1b7c2"/>
<text x="22" y="49" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#173548">Participer</text>
<text x="22" y="99" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#1c5263">Périclès et Rousseau</text>
<text x="22" y="135" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#172c34">Voter, proposer, administrer</text>
<text x="22" y="169" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172c34">Qui a le temps de participer ?</text>
<rect x="288" y="8" width="273" height="189" rx="10" stroke="#b3c6cf" fill="#f5f8f9"/><path d="M305 69 h238" fill="none" stroke="#a1b7c2"/>
<text x="304" y="49" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#173548">Représenter</text>
<text x="304" y="99" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#1c5263">Tocqueville et James</text>
<text x="304" y="135" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#172c34">Voir une humanité commune</text>
<text x="304" y="169" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172c34">Que voit chacun de sa fenêtre ?</text>
<rect x="570" y="8" width="273" height="189" rx="10" stroke="#b3c6cf" fill="#f5f8f9"/><path d="M587 69 h238" fill="none" stroke="#a1b7c2"/>
<text x="586" y="49" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" fill="#173548">Départager</text>
<text x="586" y="99" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" fill="#1c5263">Dator et Cohen-Tanugi</text>
<text x="586" y="135" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#172c34">Entendre, vérifier, décider</text>
<text x="586" y="169" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" fill="#172c34">Quelle parole obtient du poids ?</text>
</svg>
