<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 245" width="780" height="245" role="img" aria-labelledby="titre exp"><title id="titre">Qui a autorité sur la naissance ?</title><desc id="exp">Les cinq documents distribuent différemment l’action, la compétence et le droit de raconter.</desc><rect width="780" height="245" rx="14" fill="#f6f4ed"/>
<text x="23" y="37" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#163635">Qui a autorité sur la naissance ?</text>
<rect x="20" y="49" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="49" width="5" height="58" fill="#176a63"/>
<text x="38" y="73" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Accompagner</text>
<text x="233" y="71" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">La formation donne une compétence professionnelle. Socrate</text>
<text x="233" y="92" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">emprunte à sa mère un modèle de savoir.</text>
<rect x="20" y="112" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="112" width="5" height="58" fill="#176a63"/>
<text x="38" y="136" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Voir et raconter</text>
<text x="233" y="134" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Dubuffet recentre la figure qui accouche. Grass donne au</text>
<text x="233" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">nouveau-né la parole sur sa naissance.</text>
<rect x="20" y="175" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="175" width="5" height="58" fill="#176a63"/>
<text x="38" y="199" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Organiser</text>
<text x="233" y="197" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">L’enquête en Inde distingue incitation au recours à</text>
<text x="233" y="218" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">l’hôpital et prise en charge des coûts.</text>
</svg>
