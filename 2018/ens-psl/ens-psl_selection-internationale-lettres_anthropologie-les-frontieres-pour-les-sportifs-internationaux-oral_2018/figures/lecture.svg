<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Les frontières de la carrière sportive apparaissent avant, pendant et après le passage entre États.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="47" font-size="15" fill="white">Au Ghana</text><text x="237" y="31" font-size="15" fill="#173946">Transformation des débouchés scolaires, attentes</text><text x="237" y="48" font-size="15" fill="#173946">familiales et travail du corps nourrissent une</text><text x="237" y="65" font-size="15" fill="#173946">aspiration.</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="117" font-size="15" fill="white">À l’académie</text><text x="237" y="109" font-size="15" fill="#173946">Entraîneurs, proches et recruteurs évaluent différemment</text><text x="237" y="126" font-size="15" fill="#173946">les chances et répartissent les coûts du départ.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="187" font-size="15" fill="white">Dans les clubs</text><text x="237" y="179" font-size="15" fill="#173946">Sélections et contrats distribuent revenus, mobilité et</text><text x="237" y="196" font-size="15" fill="#173946">choix de la prochaine destination.</text></g></svg>
