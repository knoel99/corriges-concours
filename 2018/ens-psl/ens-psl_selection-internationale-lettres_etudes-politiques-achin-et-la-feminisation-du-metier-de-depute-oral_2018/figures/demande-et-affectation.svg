<svg xmlns="http://www.w3.org/2000/svg" width="820" height="310" viewBox="0 0 820 310" role="img" aria-labelledby="titre desc">
<title id="titre">Comment une demande devient-elle une affectation ?</title>
<desc id="desc">K. illustre le premier type, O. et L. le deuxième. Le troisième n’a pas de témoin nommé.</desc>
<rect x="0.5" y="0.5" width="819" height="309" rx="10" fill="#fffdf7" stroke="#a9b7b1"/>
<text x="20" y="32" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#243f48" font-size="22">Comment une demande devient-elle une affectation ?</text><text x="20" y="55" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">Trois manières de raconter une nomination ; le deuxième type comporte deux cas.</text>
<rect x="18" y="69" width="784" height="58" rx="5" fill="#f0efe6"/><text x="30" y="102" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#243f48" font-size="17">1 · Demande admise</text><text x="237" y="93" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">K. demande la commission correspondant à son expérience scolaire.</text><text x="237" y="114" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">Sa demande et l’appréciation du groupe concordent.</text>
<rect x="18" y="135" width="784" height="58" rx="5" fill="#e3ede9"/><text x="30" y="168" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#243f48" font-size="17">2 · Demande spécifique</text><text x="237" y="159" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">O. invoque l’industrie locale et doit insister pour être nommée.</text><text x="237" y="180" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">L. mobilise sa carrière internationale et obtient la place sans difficulté.</text>
<rect x="18" y="201" width="784" height="58" rx="5" fill="#f0efe6"/><text x="30" y="234" font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#243f48" font-size="17">3 · Placement</text><text x="237" y="225" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">Certaines élues sont affectées avant d’avoir pu exprimer un vœu.</text><text x="237" y="246" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="15">La commission peut être haut ou bas placée. La satisfaction reste ouverte.</text>
<text x="20" y="296" font-family="DejaVu Sans, sans-serif" font-weight="normal" fill="#243f48" font-size="14">La seule liste des sièges ne restitue ni la demande ni la négociation.</text>
</svg>
