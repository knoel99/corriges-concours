<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titre" viewBox="0 0 720 170">
<title id="titre">De la pratique d’une institution à l’habitude citoyenne.</title><rect width="720" height="170" fill="white"/>
<rect x="6" y="6" width="230" height="155" rx="9" stroke="#acc5c7" fill="#f2f7f6"/><path d="M18 57 h206" stroke="#b8caca"/>
<text x="19" y="41" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#17363b">Un droit</text>
<text x="19" y="86" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">Le citoyen connaît</text>
<text x="19" y="113" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">une règle et sait</text>
<text x="19" y="140" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">à qui s’adresser.</text>
<rect x="245" y="6" width="230" height="155" rx="9" stroke="#acc5c7" fill="#f2f7f6"/><path d="M257 57 h206" stroke="#b8caca"/>
<text x="258" y="41" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#17363b">Une pratique</text>
<text x="258" y="86" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">Juré, il écoute</text>
<text x="258" y="113" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">les parties et doit</text>
<text x="258" y="140" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">porter un jugement.</text>
<rect x="484" y="6" width="230" height="155" rx="9" stroke="#acc5c7" fill="#f2f7f6"/><path d="M496 57 h206" stroke="#b8caca"/>
<text x="497" y="41" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#17363b">Une habitude</text>
<text x="497" y="86" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">Un jeu reprend le jury,</text>
<text x="497" y="113" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">un banquet emprunte</text>
<text x="497" y="140" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">ses formes au parlement.</text>
</svg>
