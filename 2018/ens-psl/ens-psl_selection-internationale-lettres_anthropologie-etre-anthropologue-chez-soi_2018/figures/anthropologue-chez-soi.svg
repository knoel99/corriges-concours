<svg xmlns="http://www.w3.org/2000/svg" width="948" height="420" viewBox="0 0 948 420" role="img">
<title>Transformer une proximité supposée en question de recherche</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Position dans l’enquête</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Indice accessible</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Vérification possible</text>
<rect x="13" y="62" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Un proche présente</text>
<text x="24" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">l’enquêteur</text>
<rect x="323" y="62" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Il accède facilement à un</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">premier cercle</text>
<rect x="633" y="62" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Observer quels interlocuteurs</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">cette médiation laisse à</text>
<text x="644" y="135" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">l’écart</text>
<rect x="13" y="163" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Un mot courant paraît</text>
<text x="24" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">familier</text>
<rect x="323" y="163" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">L’enquêteur lui attribue un</text>
<text x="334" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">sens évident</text>
<rect x="633" y="163" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Comparer plusieurs usages en</text>
<text x="644" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">situation et demander des</text>
<text x="644" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">exemples</text>
<rect x="13" y="264" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Deux groupes racontent</text>
<text x="24" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">différemment le même épisode</text>
<rect x="323" y="264" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Les positions sociales</text>
<text x="334" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">orientent l’accès aux récits</text>
<rect x="633" y="264" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Comparer un document, une</text>
<text x="644" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">observation et des</text>
<text x="644" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">témoignages situés</text>
<text x="19" y="382" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">L’origine commune ne règle ni l’accès au terrain, ni l’interprétation. Une vérification doit</text>
<text x="19" y="406" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">pouvoir modifier la première lecture.</text>
</svg>
