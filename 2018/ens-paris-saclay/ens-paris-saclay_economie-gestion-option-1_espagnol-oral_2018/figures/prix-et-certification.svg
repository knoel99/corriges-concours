<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" width="820" height="255" role="img" aria-labelledby="titre desc"><title id="titre">Que paie le consommateur ?</title><desc id="desc">Au champ. Une méthode de production modifie le travail du producteur et ses coûts. Lors du contrôle. Un organisme examine les pratiques. Un label crédible réduit l’incertitude. En magasin. L’acheteur dispose d’une information supplémentaire. Son budget limite toujours son choix.</desc><rect width="820" height="255" fill="#f6f5ef"/><g font-family="DejaVu Sans, sans-serif" fill="#153139"><text x="24" y="32" font-size="22" font-weight="bold">Que paie le consommateur ?</text><path d="M24 62h241" stroke="#39756e" stroke-width="4"/><text x="24" y="93" font-size="18" font-weight="bold">Au champ</text><text x="24" y="123" font-size="15">Une méthode de production</text><text x="24" y="145" font-size="15">modifie le travail du</text><text x="24" y="167" font-size="15">producteur et ses coûts.</text><path d="M289 62h241" stroke="#39756e" stroke-width="4"/><text x="289" y="93" font-size="18" font-weight="bold">Lors du contrôle</text><text x="289" y="123" font-size="15">Un organisme examine les</text><text x="289" y="145" font-size="15">pratiques. Un label</text><text x="289" y="167" font-size="15">crédible réduit</text><text x="289" y="189" font-size="15">l’incertitude.</text><path d="M554 62h241" stroke="#39756e" stroke-width="4"/><text x="554" y="93" font-size="18" font-weight="bold">En magasin</text><text x="554" y="123" font-size="15">L’acheteur dispose d’une</text><text x="554" y="145" font-size="15">information supplémentaire.</text><text x="554" y="167" font-size="15">Son budget limite toujours</text><text x="554" y="189" font-size="15">son choix.</text></g></svg>
