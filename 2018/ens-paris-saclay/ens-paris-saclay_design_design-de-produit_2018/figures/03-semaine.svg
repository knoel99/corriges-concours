<text x="117" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">La médiatrice fait une tournée</text>
<text x="117" y="191" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">groupée, vérifie les cales,</text>
<text x="117" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">remet la fiche au commerçant et</text>
<text x="117" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">garde le numéro de la valise.</text>
