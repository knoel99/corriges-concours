<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Storyboard de quatre actions · associer une personne responsable et une trace vérifiable à chaque passage.</text>
