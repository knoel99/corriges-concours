<text x="217" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">L’hôte déplie le couvercle,</text>
<text x="217" y="191" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">verrouille les compas et remet</text>
<text x="217" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">au visiteur le bon de commande</text>
<text x="217" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">ou de réservation.</text>
<rect x="316" y="70" width="91" height="95" rx="0" fill="#e5e1d0" stroke="none" stroke-width="0.6"/>
<text x="320" y="83" font-family="DejaVu Sans, sans-serif" font-size="4.2" font-weight="700" fill="#245962" text-anchor="start">Retourner</text>
<rect x="323" y="107" width="45" height="46" rx="0" fill="#a6ad77" stroke="#212e2c" stroke-width="0.5"/>
<rect x="332" y="122" width="23" height="22" rx="0" fill="#fff1cf" stroke="#212e2c" stroke-width="0.5"/>
<ellipse cx="392" cy="119.0" rx="4.5" ry="4.5" fill="#c55d42" stroke="none" stroke-width="0.65"/>
<path d="M392 124.25 L392 138.0" stroke="#c55d42" stroke-width="4.5" fill="none"/>
<path d="M392 138.0 L387.0 153" stroke="#c55d42" stroke-width="2.5" fill="none"/>
<path d="M392 138.0 L397.0 153" stroke="#c55d42" stroke-width="2.5" fill="none"/>
<path d="M385.5 133.0 L396.75 127.25" stroke="#c55d42" stroke-width="2.25" fill="none"/>
<text x="317" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">L’atelier répond à la demande et</text>
<text x="317" y="191" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">rémunère la vente selon</text>
<text x="317" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">l’accord. Valise, fiches et</text>
<text x="317" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">échantillons repartent vers la</text>
<text x="317" y="206" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">prochaine halte.</text>
<path d="M13 276 L407 276" stroke="#245962" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#245962" text-anchor="start">Trois documents papier : fiche d’état à l’aller et au retour, bon remis au client, relevé des commandes transmis à l’atelier.</text>
</svg>
