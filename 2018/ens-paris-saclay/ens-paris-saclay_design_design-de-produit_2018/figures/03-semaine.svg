<text x="17" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">L’artisane place trois</text>
<text x="17" y="191" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">échantillons et signe la fiche</text>
<text x="17" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">d’état. Elle choisit un prix, un</text>
<text x="17" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">délai et le contenu de la</text>
<text x="17" y="206" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">démonstration.</text>
<rect x="116" y="70" width="91" height="95" rx="0" fill="#e5e1d0" stroke="none" stroke-width="0.6"/>
<text x="120" y="83" font-family="DejaVu Sans, sans-serif" font-size="4.2" font-weight="700" fill="#245962" text-anchor="start">Transporter</text>
<polygon points="125,151 187.25,151 201.5,139.75 139.25,139.75" fill="#c9b28d" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="125,151 187.25,151 187.25,158.5 125,158.5" fill="#e7cca6" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
