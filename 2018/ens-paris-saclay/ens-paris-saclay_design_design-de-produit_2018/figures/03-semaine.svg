<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Une semaine avec la valise</title><desc>Storyboard de quatre actions · associer une personne responsable et une trace vérifiable à chaque passage.</desc>
