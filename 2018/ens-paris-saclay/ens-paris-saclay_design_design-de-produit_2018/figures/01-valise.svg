<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Faire voyager des savoir-faire</title><desc>Quimper, appel « 222 » · proposer à de petits ateliers une entrée temporaire dans un commerce du centre-ville.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#245962" text-anchor="start">LA VALISE DES GESTES</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#245962" text-anchor="end">1 / 4</text>
<path d="M13 20 L407 20" stroke="#245962" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Faire voyager des savoir-faire</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Quimper, appel « 222 » · proposer à de petits ateliers une entrée temporaire dans un commerce du centre-ville.</text>
<polygon points="21,183 149.65,183 179.1,159.75 50.45,159.75" fill="#c9b28d" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="21,183 149.65,183 149.65,198.5 21,198.5" fill="#e7cca6" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="149.65,183 179.1,159.75 179.1,175.25 149.65,198.5" fill="#a6ad77" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="50.45,159.75 179.1,159.75 179.1,82.25 50.45,82.25" fill="#ede1c7" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<rect x="59.75" y="96.2" width="26.35" height="37.2" rx="0" fill="#60849a" stroke="#212e2c" stroke-width="0.4"/>
<path d="M59.75 141.15 L83.0 141.15" stroke="#212e2c" stroke-width="0.55" fill="none"/>
<rect x="96.95" y="96.2" width="26.35" height="37.2" rx="0" fill="#a6ad77" stroke="#212e2c" stroke-width="0.4"/>
<path d="M96.95 141.15 L120.2 141.15" stroke="#212e2c" stroke-width="0.55" fill="none"/>
<rect x="134.15" y="96.2" width="26.35" height="37.2" rx="0" fill="#c55d42" stroke="#212e2c" stroke-width="0.4"/>
<path d="M134.15 141.15 L157.4 141.15" stroke="#212e2c" stroke-width="0.55" fill="none"/>
<text x="23" y="213" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#245962" text-anchor="start">Casier · présentoir · valise</text>
<text x="23" y="225" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le même objet transporte les échantillons, les donne à voir et organise</text>
<text x="23" y="230" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">une rencontre autour d’un geste.</text>
<text x="229" y="80" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#245962" text-anchor="start">Une équipe de conception</text>
<text x="229" y="92" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Un designer produit indépendant s’associe à un menuisier</text>
<text x="229" y="97" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">et à une médiatrice. Les artisans choisissent ce qu’ils</text>
<text x="229" y="102" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">montrent et les conditions de vente.</text>
<text x="229" y="148" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#245962" text-anchor="start">Du territoire au centre</text>
<text x="229" y="160" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Un atelier de faïence ou de textile remplit la valise. Un</text>
<text x="229" y="165" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">commerce hôte reçoit le kit une semaine. Les visiteurs</text>
<text x="229" y="170" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">peuvent commander ou réserver un atelier.</text>
<path d="M13 276 L407 276" stroke="#245962" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#245962" text-anchor="start">Proposition pour l’appel prospectif de 2018. Les commerces et artisans du scénario sont des partenaires à solliciter.</text>
</svg>
