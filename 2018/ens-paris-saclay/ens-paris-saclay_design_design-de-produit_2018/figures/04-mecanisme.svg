<text x="240" y="104" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#245962" text-anchor="start">Couvercle calé</text>
<text x="238" y="114" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Deux compas verrouillables empêchent la</text>
<text x="238" y="119" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">retombée. Les cales d’échantillons se déposent</text>
<text x="238" y="124" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">sans outil.</text>
<text x="222" y="205" font-family="DejaVu Sans, sans-serif" font-size="4.3" font-weight="700" fill="#245962" text-anchor="start">Coupe ouverte de principe</text>
<text x="20" y="230" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Contreplaqué de peuplier, coins protégés, poches textiles lavables. Caler chaque pièce selon sa fragilité et limiter la masse</text>
<text x="20" y="235" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">chargée après pesée.</text>
<path d="M13 276 L407 276" stroke="#245962" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#245962" text-anchor="start">La caisse vide et sa charge sont pesées avant transport. La démonstration inclut montage, stabilité, lecture des fiches, retours et</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#245962" text-anchor="start">réparations.</text>
