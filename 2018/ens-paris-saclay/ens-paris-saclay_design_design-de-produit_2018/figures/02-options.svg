<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Comparer trois dispositifs</title><desc>Le commerce, le service et l’éducation doivent se rencontrer dans un objet manipulable.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#245962" text-anchor="start">LA VALISE DES GESTES</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#245962" text-anchor="end">2 / 4</text>
<path d="M13 20 L407 20" stroke="#245962" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Comparer trois dispositifs</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Le commerce, le service et l’éducation doivent se rencontrer dans un objet manipulable.</text>
<rect x="17" y="65" width="121" height="116" rx="0" fill="#e9e4d3" stroke="none" stroke-width="0.6"/>
<text x="22" y="79" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#245962" text-anchor="start">Vitrine connectée</text>
<rect x="43" y="97" width="68" height="47" rx="0" fill="#626767" stroke="#212e2c" stroke-width="0.6"/>
<rect x="46" y="100" width="62" height="38" rx="0" fill="#60849a" stroke="#212e2c" stroke-width="0.6"/>
<path d="M77 144 L77 155" stroke="#212e2c" stroke-width="1.1" fill="none"/>
<text x="19" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Un écran annonce des artisans mais exige</text>
<text x="19" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">maintenance, alimentation et espace</text>
<text x="19" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">permanent.</text>
<rect x="149" y="65" width="121" height="116" rx="0" fill="#e9e4d3" stroke="none" stroke-width="0.6"/>
<text x="154" y="79" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#245962" text-anchor="start">Marché ponctuel</text>
<polygon points="162,119 182,102 236,102 255,119" fill="#c55d42" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<path d="M172 119 L172 156" stroke="#212e2c" stroke-width="1" fill="none"/>
<path d="M243 119 L243 156" stroke="#212e2c" stroke-width="1" fill="none"/>
<rect x="175" y="139" width="64" height="3" rx="0" fill="#e7cca6" stroke="#212e2c" stroke-width="0.6"/>
<text x="151" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Les artisans se rencontrent directement.</text>
<text x="151" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Chacun interrompt cependant sa</text>
<text x="151" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">production pour tenir un stand.</text>
<rect x="281" y="65" width="121" height="116" rx="0" fill="#e9e4d3" stroke="none" stroke-width="0.6"/>
<text x="286" y="79" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#245962" text-anchor="start">Valise déposée</text>
<polygon points="297,154 367.55,154 383.7,141.25 313.15,141.25" fill="#c9b28d" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="297,154 367.55,154 367.55,162.5 297,162.5" fill="#e7cca6" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="367.55,154 383.7,141.25 383.7,149.75 367.55,162.5" fill="#a6ad77" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="313.15,141.25 383.7,141.25 383.7,98.75 313.15,98.75" fill="#ede1c7" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<rect x="318.25" y="106.4" width="14.45" height="20.4" rx="0" fill="#60849a" stroke="#212e2c" stroke-width="0.4"/>
<path d="M318.25 131.05 L331.0 131.05" stroke="#212e2c" stroke-width="0.55" fill="none"/>
<rect x="338.65" y="106.4" width="14.45" height="20.4" rx="0" fill="#a6ad77" stroke="#212e2c" stroke-width="0.4"/>
<path d="M338.65 131.05 L351.4 131.05" stroke="#212e2c" stroke-width="0.55" fill="none"/>
<rect x="359.05" y="106.4" width="14.45" height="20.4" rx="0" fill="#c55d42" stroke="#212e2c" stroke-width="0.4"/>
<path d="M359.05 131.05 L371.8 131.05" stroke="#212e2c" stroke-width="0.55" fill="none"/>
<text x="283" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">La boutique ouvre et ferme la</text>
<text x="283" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">présentation. L’artisan ne se déplace</text>
<text x="283" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">que pour l’installation et la séance de</text>
<text x="283" y="214" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">démonstration.</text>
<path d="M13 276 L407 276" stroke="#245962" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#245962" text-anchor="start">Le dispositif retenu se déploie sur une table ou un comptoir existant. La communication et l’organisation reposent aussi sur une fiche</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#245962" text-anchor="start">papier.</text>
</svg>
