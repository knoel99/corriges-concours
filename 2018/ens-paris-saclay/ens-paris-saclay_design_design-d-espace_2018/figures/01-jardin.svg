<text x="20" y="190" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Traverser / s’arrêter / revenir après la pluie</text>
<text x="20" y="202" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Des bosses basses et des rainures permettent d’inventer une rivière par temps</text>
<text x="20" y="207" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">sec. La pluie en révèle le vrai sens d’écoulement.</text>
<text x="280" y="78" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Van Eyck</text>
<text x="280" y="89" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">À Amsterdam, peu de formes suffisent à</text>
<text x="280" y="94" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">multiplier les règles de jeu. Ici, les</text>
<text x="280" y="99" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">mêmes îlots servent de seuils, d’étapes</text>
<text x="280" y="104" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">ou de sièges.</text>
<text x="280" y="152" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Îlot Amaranthe</text>
<text x="280" y="164" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le jardin lyonnais s’est transformé avec</text>
<text x="280" y="169" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">ses usagers. Les plantations de notre</text>
<text x="280" y="174" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">cour restent accessibles à une</text>
<text x="280" y="179" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">association de quartier.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Échelle choisie : la petite parcelle urbaine. Le jeu libre partage le site avec l’infiltration des pluies et l’apprentissage du vivant.</text>
</svg>
