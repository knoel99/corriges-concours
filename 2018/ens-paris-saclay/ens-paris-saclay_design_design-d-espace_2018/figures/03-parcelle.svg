<text x="288" y="145" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">La noue plantée</text>
<text x="288" y="156" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Seule l’eau de la parcelle rejoint le</text>
<text x="288" y="161" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">jardin après filtration. Éviter toute</text>
<text x="288" y="166" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">cuvette durablement en eau dans l’aire</text>
<text x="288" y="171" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">de jeu.</text>
<text x="288" y="216" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">Les accompagnants</text>
<text x="288" y="228" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Deux bancs laissent vue sur les îlots</text>
<text x="288" y="233" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">et les deux accès étudiés.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Le plan dessine un parti. L’analyse du sol, de l’eau, des risques de chute et des accès aux rues conditionne le choix d’un emplacement réel.</text>
