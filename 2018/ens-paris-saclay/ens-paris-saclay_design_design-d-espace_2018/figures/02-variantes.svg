<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Essayer trois terrains</title><desc>Du catalogue de modules à un sol que l’on peut parcourir, toucher et observer · les volumes demeurent visibles depuis les assises.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#3b665b" text-anchor="start">LA COUR OÙ PASSE LA PLUIE</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#3b665b" text-anchor="end">2 / 4</text>
<path d="M13 20 L407 20" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Essayer trois terrains</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Du catalogue de modules à un sol que l’on peut parcourir, toucher et observer · les volumes demeurent visibles depuis les assises.</text>
<rect x="17" y="67" width="120" height="108" rx="0" fill="#e8e5d3" stroke="none" stroke-width="0.6"/>
<text x="22" y="81" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">L’archipel</text>
<ellipse cx="38" cy="135" rx="12" ry="7" fill="#a6ad77" stroke="#212e2c" stroke-width="0.6"/>
<ellipse cx="73" cy="135" rx="17" ry="7" fill="#a6ad77" stroke="#212e2c" stroke-width="0.6"/>
<ellipse cx="112" cy="135" rx="10" ry="7" fill="#a6ad77" stroke="#212e2c" stroke-width="0.6"/>
<text x="20" y="193" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Trois bosses réunies par des pas. Le jeu</text>
<text x="20" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">de poursuite est immédiat, mais un</text>
<text x="20" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">trajet accessible doit aussi les relier.</text>
<rect x="150" y="67" width="120" height="108" rx="0" fill="#e8e5d3" stroke="none" stroke-width="0.6"/>
<text x="155" y="81" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Le ruisseau</text>
<path d="M158 145 Q189 121 203 135 T259 117" fill="none" stroke="#7aa9ac" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="153" y="193" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Une seule ligne porte les parcours</text>
<text x="153" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">tactiles et raconte la pluie. Seule,</text>
<text x="153" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">elle intéresse moins lorsque le sol</text>
<text x="153" y="208" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">sèche.</text>
<rect x="283" y="67" width="120" height="108" rx="0" fill="#e8e5d3" stroke="none" stroke-width="0.6"/>
<text x="288" y="81" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Le jardin traversé</text>
<polygon points="289,145 377.45,145 398.8,130.36 311.57,130.36" fill="#e7cca6" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<ellipse cx="301.81" cy="139.51" rx="5.49" ry="2.44" fill="#a6ad77" stroke="#212e2c" stroke-width="0.5"/>
<ellipse cx="319.5" cy="135.85" rx="5.49" ry="2.44" fill="#a6ad77" stroke="#212e2c" stroke-width="0.5"/>
<ellipse cx="337.19" cy="139.51" rx="5.49" ry="2.44" fill="#a6ad77" stroke="#212e2c" stroke-width="0.5"/>
<path d="M293.88 143.78 Q317.67 138.9 332.92 141.95 T374.4 136.46" fill="none" stroke="#7aa9ac" stroke-width="1.22" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M297.54 125.23599999999999 L297.54 134.63" stroke="#626767" stroke-width="0.2989" fill="none"/>
<polygon points="297.54,123.528 295.832,129.079 299.248,129.079" fill="#3b665b" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="297.54,125.236 294.978,130.787 300.102,130.787" fill="#3b665b" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="297.54,126.944 294.338,132.495 300.743,132.495" fill="#3b665b" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<path d="M358.53999999999996 124.626 L358.53999999999996 134.02" stroke="#626767" stroke-width="0.2989" fill="none"/>
<polygon points="358.54,122.918 356.832,128.469 360.248,128.469" fill="#3b665b" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="358.54,124.626 355.978,130.177 361.102,130.177" fill="#3b665b" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="358.54,126.334 355.337,131.885 361.742,131.885" fill="#3b665b" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<path d="M372.57 131.946 L372.57 141.34" stroke="#626767" stroke-width="0.2989" fill="none"/>
<polygon points="372.57,130.238 370.862,135.789 374.278,135.789" fill="#3b665b" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="372.57,131.946 370.008,137.497 375.132,137.497" fill="#3b665b" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<polygon points="372.57,133.654 369.368,139.205 375.772,139.205" fill="#3b665b" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<text x="286" y="193" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Îlots et ligne s’entrecroisent. Une</text>
<text x="286" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">bande plane permet de jouer à côté des</text>
<text x="286" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">bosses ; le jardin devient une</text>
<text x="286" y="208" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">destination.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">La proposition finale garde l’ouverture des formes et ajoute un jardin entretenu. Les matériaux sont choisis pour le toucher de jeunes</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">enfants.</text>
</svg>
