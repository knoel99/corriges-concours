<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="DejaVu Sans, sans-serif"><title>Une résistance peut rester muette ou devenir perceptible et ouvrir une enquête.</title><rect width="900" height="250" fill="#faf9f4"/><text x="450" y="32" text-anchor="middle" font-size="24" fill="#163945">À quel moment la résistance devient-elle instructive ?</text><rect x="53" y="90" width="330" height="79" fill="#ecdfc6" stroke="#335563" stroke-width="2"/><rect x="133" y="112" width="150" height="16" fill="#335d67" stroke="#335563" stroke-width="2"/><rect x="485" y="90" width="330" height="79" fill="#ecdfc6" stroke="#335563" stroke-width="2"/><rect x="565" y="112" width="150" height="16" fill="#335d67" stroke="#335563" stroke-width="2"/><rect x="230" y="104" width="24" height="52" fill="#97bdb2" stroke="#335563" stroke-width="2"/><path d="M 118 143 l 39 0 m -8 -6 l 8 6 l -8 6" fill="none" stroke="#a34a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="650" y="105" width="24" height="51" fill="#97bdb2" stroke="#335563" stroke-width="2"/><path d="M 713 96 l 14 -18 m -4 35 l 18 -4 m -20 19 l 18 8" fill="none" stroke="#a34a22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="202" text-anchor="middle" font-size="19" fill="#163945">Je cherche ce qui bloque.</text><text x="650" y="202" text-anchor="middle" font-size="19" fill="#163945">Le retour signale ce qui bloque.</text><text x="450" y="233" text-anchor="middle" font-size="17" fill="#163945">Deux expériences possibles après l’arrêt d’un mécanisme</text></svg>
