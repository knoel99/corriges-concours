<ellipse cx="241" cy="117" rx="4" ry="4" fill="#db785e" stroke="none" stroke-width="0.65"/>
<text x="151" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Un bouton active le tracé qui analyse</text>
<text x="151" y="227" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">le décor. Retour possible à l’image</text>
<text x="151" y="232" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">seule.</text>
<rect x="283" y="67" width="120" height="136" rx="4" fill="#3a3358" stroke="none" stroke-width="0.5"/>
<rect x="287" y="77" width="112" height="116" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="292" y="88" font-family="DejaVu Sans, sans-serif" font-size="4.1" font-weight="700" fill="#3a3358" text-anchor="start">IMMERSION</text>
<text x="291" y="184" font-family="DejaVu Sans, sans-serif" font-size="4.1" font-weight="700" fill="#3a3358" text-anchor="start">03 / Lire</text>
<text x="293" y="105" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#3a3358" text-anchor="start">Le décor continue derrière le</text>
<text x="293" y="110" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#3a3358" text-anchor="start">cadre. Le corps du personnage</text>
<text x="293" y="115" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#3a3358" text-anchor="start">s’arrête. L’auteur de la scène a</text>
<text x="293" y="120" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#3a3358" text-anchor="start">dessiné deux espaces de tailles</text>
<text x="293" y="125" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#3a3358" text-anchor="start">différentes.</text>
<text x="293" y="151" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3a3358" text-anchor="start">Lire l’analyse complète</text>
<text x="284" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Les légendes donnent auteur, source et</text>
<text x="284" y="227" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">accès au texte du numéro.</text>
<path d="M13 276 L407 276" stroke="#3a3358" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3a3358" text-anchor="start">Une annotation contrôlée par le lecteur fonctionne sans son. Prévoir clavier, contraste, légendes et texte de remplacement.</text>
</svg>
