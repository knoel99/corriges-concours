<text x="159" y="88" font-family="DejaVu Sans, sans-serif" font-size="4.1" font-weight="700" fill="#3a3358" text-anchor="start">IMMERSION</text>
<text x="158" y="184" font-family="DejaVu Sans, sans-serif" font-size="4.1" font-weight="700" fill="#3a3358" text-anchor="start">02 / Superposer</text>
