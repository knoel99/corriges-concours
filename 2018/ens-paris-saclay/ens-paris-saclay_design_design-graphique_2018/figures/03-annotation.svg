<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Faire de l’écran une annotation</title><desc>Maquette web : lecture guidée d’une scène, alternative en texte et accès direct vers la revue.</desc>
