<text x="18" y="227" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">se chargent ensemble.</text>
<rect x="150" y="67" width="120" height="136" rx="4" fill="#3a3358" stroke="none" stroke-width="0.5"/>
