<text x="151" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">Un auteur et un lecteur annotent deux</text>
<text x="151" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">images devant le public. Une</text>
<text x="151" y="206" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">bibliothèque peut héberger l’atelier</text>
<text x="151" y="211" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">sans imposer de console.</text>
<rect x="281" y="66" width="121" height="112" rx="0" fill="#ecd1ba" stroke="none" stroke-width="0.6"/>
<text x="286" y="81" font-family="DejaVu Sans, sans-serif" font-size="4.9" font-weight="700" fill="#3a3358" text-anchor="start">La contribution</text>
<rect x="307" y="100" width="69" height="45" rx="0" fill="#fcf5e8" stroke="#3a3358" stroke-width="0.7"/>
<path d="M307 100 L341 126 L376 100" fill="none" stroke="#3a3358" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="283" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">Une consigne d’envoi demande une</text>
<text x="283" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">question critique, une image autorisée</text>
<text x="283" y="206" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">et un court paragraphe. La rédaction</text>
<text x="283" y="211" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">répond et fixe les droits.</text>
<path d="M13 276 L407 276" stroke="#3a3358" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3a3358" text-anchor="start">Suivre séparément les ventes, la lecture des extraits et les propositions effectivement reçues. Rendre compte aux libraires et auteurs de ce</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3a3358" text-anchor="start">qui a changé.</text>
</svg>
