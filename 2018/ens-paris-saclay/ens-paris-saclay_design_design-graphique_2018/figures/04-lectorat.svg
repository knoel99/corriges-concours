<text x="19" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">Une librairie ouvre la revue sur un</text>
<text x="19" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">essai. Le visiteur prend un triptyque.</text>
<text x="19" y="206" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">La couverture reste visible à côté de la</text>
<text x="19" y="211" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">double page.</text>
<rect x="149" y="66" width="121" height="112" rx="0" fill="#c8d6b5" stroke="none" stroke-width="0.6"/>
<text x="154" y="81" font-family="DejaVu Sans, sans-serif" font-size="4.9" font-weight="700" fill="#3a3358" text-anchor="start">La rencontre</text>
