<path d="M237 73 L237 142" stroke="#3a3358" stroke-width="0.45" fill="none" stroke-dasharray="2 1"/>
<text x="242" y="85" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3a3358" text-anchor="start">2 / RELIRE</text>
<text x="242" y="99.0" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" fill="#3a3358" text-anchor="start">Une frontière de jeu</text>
<text x="242" y="103.35" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" fill="#3a3358" text-anchor="start">apparaît quand le décor</text>
<text x="242" y="107.7" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" fill="#3a3358" text-anchor="start">autorise le regard à</text>
<text x="242" y="112.05" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" fill="#3a3358" text-anchor="start">passer plus loin que le</text>
<text x="242" y="116.4" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" fill="#3a3358" text-anchor="start">personnage.</text>
<path d="M313 73 L313 142" stroke="#3a3358" stroke-width="0.45" fill="none" stroke-dasharray="2 1"/>
<text x="318" y="85" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3a3358" text-anchor="start">3 / ESSAYER</text>
<text x="318" y="99.0" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" fill="#3a3358" text-anchor="start">Dessinez le lieu où vous</text>
<text x="318" y="103.35" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" fill="#3a3358" text-anchor="start">vous arrêtez. Que</text>
<text x="318" y="107.7" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" fill="#3a3358" text-anchor="start">faudrait-il modifier</text>
<text x="318" y="112.05" font-family="DejaVu Sans, sans-serif" font-size="3.15" font-weight="400" fill="#3a3358" text-anchor="start">pour changer le récit ?</text>
<text x="161" y="158" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3a3358" text-anchor="start">Trois volets détachables</text>
<text x="161" y="170" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une feuille de présentation pliée accompagne un exemplaire de</text>
<text x="161" y="175" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">consultation. Le troisième panneau invite le lecteur à dessiner sa</text>
<text x="161" y="180" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">limite et à laisser une réponse.</text>
<text x="161" y="224" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le prix de 14,90 € appartient au premier numéro. Les informations de</text>
<text x="161" y="229" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">vente du prochain tirage seront reprises de l’éditeur.</text>
<path d="M13 276 L407 276" stroke="#3a3358" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3a3358" text-anchor="start">Maquette d’une bande de lecture à deux plis. Impression recto-verso en deux encres sur papier opaque ; conserver du blanc pour écrire.</text>
</svg>
