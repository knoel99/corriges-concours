<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Détacher un fragment imprimé</title><desc>Affiche de librairie et bande de lecture · un extrait critique de poche garde un lien clair avec les 136 pages de l’objet édité.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#3a3358" text-anchor="start">IMMERSION / LE SEUIL</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#3a3358" text-anchor="end">2 / 4</text>
