<text x="6" y="127" font-family="DejaVu Sans, sans-serif" font-size="5.7" font-weight="700" fill="#3a3358" text-anchor="start">QUI A DESSINÉ</text>
<text x="6" y="137" font-family="DejaVu Sans, sans-serif" font-size="6.6" font-weight="700" fill="#3a3358" text-anchor="start">LA LIMITE ?</text>
</g>
<rect x="161" y="73" width="227" height="69" rx="0" fill="#f4eedf" stroke="#3a3358" stroke-width="0.6"/>
<text x="166" y="85" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3a3358" text-anchor="start">1 / REGARDER</text>
<g transform="translate(169 90) scale(0.74)">
<path d="M2.0 3.0 H62.0 V55.0 H2.0 V35.0" fill="none" stroke="#3a3358" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M7.4 7.2 H56.6 V50.8 H7.4 V33.95" fill="none" stroke="#3a3358" stroke-width="1.04" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M12.8 11.4 H51.2 V46.6 H12.8 V32.9" fill="none" stroke="#3a3358" stroke-width="1.1800000000000002" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M18.200000000000003 15.600000000000001 H45.8 V42.4 H18.200000000000003 V31.85" fill="none" stroke="#3a3358" stroke-width="1.32" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M2 35 Q20 37 27 28 T50 21" fill="none" stroke="#db785e" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>
