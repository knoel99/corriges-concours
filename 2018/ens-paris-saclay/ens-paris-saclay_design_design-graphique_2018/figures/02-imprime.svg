<text x="6" y="28" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="400" fill="#3a3358" text-anchor="start">REVUE / CULTURE DU JEU VIDÉO</text>
<g transform="translate(9 38) scale(1.45)">
