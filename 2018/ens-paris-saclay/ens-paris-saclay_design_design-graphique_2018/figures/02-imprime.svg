<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Détacher un fragment imprimé</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Affiche de librairie et bande de lecture · un extrait critique de poche garde un lien clair avec les 136 pages de l’objet édité.</text>
<g transform="translate(19 64) scale(1.06)">
<rect x="0" y="0" width="109" height="145" rx="0" fill="#ccc2dd" stroke="#3a3358" stroke-width="0.7"/>
