<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>La revue se lit par un seuil</title><desc>Réflexion graphique pour développer le lectorat d’Immersion à l’approche du deuxième numéro.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#3a3358" text-anchor="start">IMMERSION / LE SEUIL</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#3a3358" text-anchor="end">1 / 4</text>
<path d="M13 20 L407 20" stroke="#3a3358" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">La revue se lit par un seuil</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Réflexion graphique pour développer le lectorat d’Immersion à l’approche du deuxième numéro.</text>
<g transform="translate(24 64) scale(1.18)">
<rect x="0" y="0" width="109" height="145" rx="0" fill="#ccc2dd" stroke="#3a3358" stroke-width="0.7"/>
<text x="6" y="18" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#3a3358" text-anchor="start">IMMERSION</text>
<text x="6" y="28" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="400" fill="#3a3358" text-anchor="start">REVUE / CULTURE DU JEU VIDÉO</text>
<g transform="translate(9 38) scale(1.45)">
<path d="M2.0 3.0 H62.0 V55.0 H2.0 V35.0" fill="none" stroke="#3a3358" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M7.4 7.2 H56.6 V50.8 H7.4 V33.95" fill="none" stroke="#3a3358" stroke-width="1.04" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M12.8 11.4 H51.2 V46.6 H12.8 V32.9" fill="none" stroke="#3a3358" stroke-width="1.1800000000000002" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M18.200000000000003 15.600000000000001 H45.8 V42.4 H18.200000000000003 V31.85" fill="none" stroke="#3a3358" stroke-width="1.32" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M2 35 Q20 37 27 28 T50 21" fill="none" stroke="#db785e" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="6" y="127" font-family="DejaVu Sans, sans-serif" font-size="5.7" font-weight="700" fill="#3a3358" text-anchor="start">QUI A DESSINÉ</text>
<text x="6" y="137" font-family="DejaVu Sans, sans-serif" font-size="6.6" font-weight="700" fill="#3a3358" text-anchor="start">LA LIMITE ?</text>
</g>
<text x="183" y="77" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3a3358" text-anchor="start">La revue de départ</text>
<text x="183" y="89" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">136 pages, 225 × 300 mm, publication semestrielle. Le premier numéro</text>
<text x="183" y="94" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">de décembre 2017 étudie l’espace virtuel et le récit environnemental.</text>
<text x="183" y="143" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3a3358" text-anchor="start">Une question publique</text>
<text x="183" y="155" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Plutôt que de reconnaître un jeu célèbre, le lecteur cherche où le</text>
<text x="183" y="160" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">cadre lui permet vraiment de passer. Une ligne change de plan à chaque</text>
<text x="183" y="165" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">support.</text>
<text x="183" y="211" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3a3358" text-anchor="start">Un public plus large</text>
<text x="183" y="223" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Joueurs, lecteurs d’art, bibliothèques et étudiants en design peuvent</text>
<text x="183" y="228" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">discuter du même cadre sans connaître le titre d’un jeu.</text>
<path d="M13 276 L407 276" stroke="#3a3358" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3a3358" text-anchor="start">La question « Qui a dessiné la limite ? » est un prototype éditorial. Le contenu effectif du deuxième numéro ne figure pas dans le sujet.</text>
</svg>
