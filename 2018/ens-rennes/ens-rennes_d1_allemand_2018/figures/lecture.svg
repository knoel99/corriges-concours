<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Que devient la fin de la journée de travail ?</title>
<desc id="description">Connexion Vouloir suivre les échanges. Risque de stress. Fin de journée Sollicitations professionnelles persistantes. Repos difficile. JOMO Accepter de manquer quelque chose. Pouvoir se déconnecter.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que devient la fin de la journée de travail ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Situation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Point de vue</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conséquence</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Connexion</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Vouloir suivre les</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">échanges.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Risque de stress.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Fin de journée</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Sollicitations</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">professionnelles</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">persistantes.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Repos difficile.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">JOMO</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Accepter de manquer</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">quelque chose.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Pouvoir se déconnecter.</text>
</g>
</svg>
