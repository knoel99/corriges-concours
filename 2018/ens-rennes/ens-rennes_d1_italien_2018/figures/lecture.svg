<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Come passa un oggetto nella vita quotidiana?</title>
<desc id="description">Cellulare multifunzione Riunire più usi. Modificare i modi di comunicare. Detersivo Lavare il bucato. Cambiare il lavoro domestico. Un esempio personale Descrivere che cosa si fa. Spiegare perché è difficile rinunciarvi.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Come passa un oggetto nella vita quotidiana?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Oggetto</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Azione</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effetto concreto</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Cellulare</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">multifunzione</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Riunire più usi.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Modificare i modi di</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">comunicare.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Detersivo</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Lavare il bucato.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Cambiare il lavoro</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">domestico.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Un esempio personale</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Descrivere che cosa si fa.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Spiegare perché è difficile</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">rinunciarvi.</text>
</g>
</svg>
