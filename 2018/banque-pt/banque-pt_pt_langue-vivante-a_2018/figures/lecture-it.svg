<svg xmlns="http://www.w3.org/2000/svg" width="760" height="214" viewBox="0 0 760 214">
<rect width="760" height="214" rx="8" fill="#f7f8f6"/>
<text x="20" y="36" font-family="DejaVu Sans" font-weight="bold" font-size="21" fill="#213c46">Eau perdue dans la chaîne alimentaire italienne</text>
<rect x="20" y="55" width="229" height="140" rx="8" fill="white" stroke="#b5ccc7"/>
<rect x="20" y="55" width="229" height="7" fill="#42786e"/>
<text x="32" y="94" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#213c46">1 226 millions de m³</text>
<text x="32" y="143" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#213c46">Total de la filière</text>
<rect x="266" y="55" width="229" height="140" rx="8" fill="white" stroke="#b5ccc7"/>
<rect x="266" y="55" width="229" height="7" fill="#42786e"/>
<text x="278" y="94" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#213c46">706 millions de m³</text>
<text x="278" y="143" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#213c46">Aliments inutilisés</text>
<text x="278" y="164" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#213c46">par les personnes</text>
<rect x="512" y="55" width="229" height="140" rx="8" fill="white" stroke="#b5ccc7"/>
<rect x="512" y="55" width="229" height="7" fill="#42786e"/>
<text x="524" y="94" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#213c46">43 % de ces 706</text>
<text x="524" y="143" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#213c46">Part attribuée à la</text>
<text x="524" y="164" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#213c46">viande</text>
</svg>
