<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268"><rect width="720" height="268" fill="white"/><g font-family="DejaVu Sans" fill="#1b4052"><text x="20" y="29" font-size="20" fill="#1b4052">Deux façons d’arriver à k cases occupées</text><text x="44" y="75" font-size="16" fill="#1b4052">Après n lancers</text><text x="506" y="75" font-size="16" fill="#1b4052">Après n + 1 lancers</text><text x="57" y="125" font-size="16" fill="#1b4052">k occupées</text><text x="57" y="208" font-size="16" fill="#1b4052">k − 1 occupées</text><text x="590" y="166" font-size="16" fill="#1b4052">k occupées</text><line x1="187" y1="122" x2="573" y2="151" stroke="#2a6e74" stroke-width="2"/><line x1="187" y1="200" x2="573" y2="158" stroke="#2a6e74" stroke-width="2"/><circle cx="573" cy="155" r="5" fill="#26766b"/><text x="238" y="108" font-size="15" fill="#1b4052">Case déjà occupée : k/N</text><text x="242" y="222" font-size="15" fill="#1b4052">Case libre : (N − k + 1)/N</text></g></svg>