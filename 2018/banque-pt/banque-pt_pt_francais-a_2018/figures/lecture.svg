<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Du risque vécu à l’aventure racontée</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Du risque vécu à l’aventure racontée</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Devant les Sirènes</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Ulysse prépare la possibilité d’entendre et</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">celle de revenir.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">Un danger encadré</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Sur le vapeur</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">La perte du timonier oblige Marlow à revoir</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">le prix de l’expédition.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Un risque subi</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Chez les Phéaciens</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Le récit rétablit l’attente chez des auditeurs</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">désormais en sûreté.</text>
<text x="549" y="180" font-size="14" font-weight="700" fill="#203c49">Un risque</text>
<text x="549" y="197" font-size="14" font-weight="700" fill="#203c49">représenté</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
