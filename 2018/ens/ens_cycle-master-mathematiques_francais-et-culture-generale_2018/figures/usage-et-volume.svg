<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img"><title>De la consommation unitaire au total</title><desc>Dans cet exemple fictif, la baisse par trajet et la hausse du nombre de trajets se combinent.</desc><rect x="0" y="0" width="820" height="290" fill="#faf9f3"/><text x="26" y="38" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#173e48">De la consommation unitaire au total</text><text x="32" y="76" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e48">Situation</text><text x="215" y="76" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e48">Trajets</text><text x="341" y="76" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e48">Unités par trajet</text><text x="559" y="76" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e48">Total</text><text x="32" y="116" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#173e48">Initialement</text><text x="225" y="116" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#173e48">100</text><text x="375" y="116" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#173e48">4</text><rect x="554" y="97" width="124.0" height="23" fill="#5b9090"/><text x="718" y="116" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e48">400</text><text x="32" y="174" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#173e48">Après le gain</text><text x="225" y="174" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#173e48">160</text><text x="375" y="174" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#173e48">3</text><rect x="554" y="155" width="148.8" height="23" fill="#d1a467"/><text x="718" y="174" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e48">480</text><line x1="30" y1="206" x2="795" y2="206" stroke="#cbd8d0" stroke-width="2"/><text x="32" y="239" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e48">Par trajet : baisse de 25 %. Nombre de trajets : hausse de 60 %.</text><text x="32" y="269" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e48">La dépense totale augmente de 20 % dans cette hypothèse.</text></svg>
