<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img"><title>How the audience interprets Lily’s pose</title><desc>The pose remains fixed while the meaning changes with the spectator.</desc><rect width="960" height="330" rx="12" fill="#f7f7f3"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="37" fill="#19344a" font-size="25" font-weight="700">How the audience interprets Lily’s pose</text><rect x="26" y="54" width="908" height="57" rx="6" fill="#173b4a"/><text x="42" y="88" fill="#ffffff" font-size="21" font-weight="700">The shared sight</text><text x="348" y="89" fill="#ffffff" font-size="18">Lily poses as the sitter in a Reynolds portrait.</text><path d="M480 111v18M176 129h608M176 129v16M480 129v16M784 129v16" fill="none" stroke="#547b80" stroke-width="2.5"/><rect x="26" y="145" width="296" height="104" rx="7" fill="#e3ece9" stroke="#8fa7a6"/><text x="38" y="178" fill="#19344a" font-size="21" font-weight="700">Selden</text><text x="38" y="207" fill="#19344a" font-size="15">An upward line suggests flight.</text><text x="38" y="230" fill="#19344a" font-size="15">He imagines a private appeal.</text><rect x="332" y="145" width="296" height="104" rx="7" fill="#e3ece9" stroke="#8fa7a6"/><text x="344" y="178" fill="#19344a" font-size="21" font-weight="700">Van Alstyne</text><text x="344" y="207" fill="#19344a" font-size="15">He admires the unbroken line.</text><text x="344" y="230" fill="#19344a" font-size="15">He ascribes a motive to Lily.</text><rect x="638" y="145" width="296" height="104" rx="7" fill="#e3ece9" stroke="#8fa7a6"/><text x="650" y="178" fill="#19344a" font-size="21" font-weight="700">Gerty Farish</text><text x="650" y="207" fill="#19344a" font-size="15">She recognises a familiar Lily.</text><text x="650" y="230" fill="#19344a" font-size="15">She will report Selden’s words.</text><path d="M27 271H933" stroke="#afbbb7"/><text x="27" y="304" fill="#19344a" font-size="18">The pose remains fixed while the meaning changes with the spectator.</text></g></svg>
