<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-labelledby="titre description">
<title id="titre">Un enfant, deux prénoms</title>
<desc id="description">Avant le voyage, Les parents choisissent le prénom, Claude. Au registre, Le dernier bébé inscrit donne le sien, René. À Recife, Vie intime et carrière divergent, Claude drängte René</desc>
<rect width="720" height="218" fill="#f8f7f2"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="17" y="31" font-size="23" font-weight="700" fill="#153c48">Un enfant, deux prénoms</text>
<rect x="12" y="52" width="219" height="152" rx="5" fill="#dfeee9"/>
<text x="22" y="79" font-size="15" font-weight="700" fill="#18555a">Avant le voyage</text>
<text x="22" y="110" font-size="15" font-weight="400" fill="#20373e">Les parents choisissent le</text>
<text x="22" y="128" font-size="15" font-weight="400" fill="#20373e">prénom</text>
<text x="22" y="167" font-size="14" font-weight="700" fill="#193750">Claude</text>
<path d="M228 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="250" y="52" width="219" height="152" rx="5" fill="#f3e9d8"/>
<text x="260" y="79" font-size="15" font-weight="700" fill="#18555a">Au registre</text>
<text x="260" y="110" font-size="15" font-weight="400" fill="#20373e">Le dernier bébé inscrit</text>
<text x="260" y="128" font-size="15" font-weight="400" fill="#20373e">donne le sien</text>
<text x="260" y="167" font-size="14" font-weight="700" fill="#193750">René</text>
<path d="M466 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="488" y="52" width="219" height="152" rx="5" fill="#e1eaf0"/>
<text x="498" y="79" font-size="15" font-weight="700" fill="#18555a">À Recife</text>
<text x="498" y="110" font-size="15" font-weight="400" fill="#20373e">Vie intime et carrière</text>
<text x="498" y="128" font-size="15" font-weight="400" fill="#20373e">divergent</text>
<text x="498" y="167" font-size="14" font-weight="700" fill="#193750">Claude drängte René</text>
</g>
</svg>
