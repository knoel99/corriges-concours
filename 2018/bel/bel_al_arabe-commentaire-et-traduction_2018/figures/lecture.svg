<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 132" width="900" height="132" role="img"><title>La parole littéraire exprime une vie intérieure, participe à la formation de la personne et permet à une communauté de se reconnaître.</title><rect width="900" height="132" rx="8" fill="#f6f9f9"/><rect x="12" y="10" width="269" height="112" rx="6" fill="#deecea"/><text x="146.5" y="43" font-weight="700" font-size="23" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Exprimer</text><text x="146.5" y="75" font-weight="400" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Vie intérieure</text><text x="146.5" y="104" font-weight="400" font-size="17" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">l. 1–6</text><path d="M285 66 h23 m-7 -6 l7 6 -7 6" fill="none" stroke="#395667" stroke-width="2"/><rect x="315" y="10" width="269" height="112" rx="6" fill="#f5e9d3"/><text x="449.5" y="43" font-weight="700" font-size="23" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Former</text><text x="449.5" y="75" font-weight="400" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Individu et communauté</text><text x="449.5" y="104" font-weight="400" font-size="17" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">l. 7–12</text><path d="M588 66 h23 m-7 -6 l7 6 -7 6" fill="none" stroke="#395667" stroke-width="2"/><rect x="618" y="10" width="269" height="112" rx="6" fill="#e2e9f2"/><text x="752.5" y="43" font-weight="700" font-size="23" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Se transformer</text><text x="752.5" y="75" font-weight="400" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Trois propriétés</text><text x="752.5" y="104" font-weight="400" font-size="17" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">l. 13–25</text></svg>
