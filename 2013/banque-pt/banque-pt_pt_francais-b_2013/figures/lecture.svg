<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>De qui dépend l’effet d’une parole ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">De qui dépend l’effet d’une parole ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Dubois</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Il laisse Araminte demander elle-même</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">l’explication.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">Initiative ménagée</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Dorante</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">Ses hésitations trahissent son trouble sous</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">la dictée.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Effet involontaire</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Socrate</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Il recherche le discours qui convient à telle</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">âme.</text>
<text x="549" y="189" font-size="14" font-weight="700" fill="#203c49">Réponse attendue</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
