<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Del diagnóstico a la invitación al lector</title>
<desc id="description">Diagnóstico Distingue dos formas de bienestar. Opinión del autor, seguida de un apoyo experto. Pregunta Examina una aparente contradicción. Elección de un camino fácil o temor a decepcionarse. Invitación Propone aprovechar la crisis para pensar. Paso a la segunda persona.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Del diagnóstico a la invitación al lector</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Etapa</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Función</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Indicio</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Diagnóstico</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Distingue dos formas de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">bienestar.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Opinión del autor, seguida</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">de un apoyo experto.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Pregunta</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Examina una aparente</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">contradicción.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Elección de un camino fácil</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">o temor a decepcionarse.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Invitación</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Propone aprovechar la</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">crisis para pensar.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Paso a la segunda persona.</text>
</g>
</svg>
