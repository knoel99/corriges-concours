<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Lire les trois informations de la carte de 2013</title>
<desc id="description">État des liaisons Câbles en couleur ou en gris. Existants ou projetés. Vitesse Premier type d’information des diagrammes. Performance des connexions. Utilisation Autre donnée des diagrammes. Importance du trafic.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Lire les trois informations de la carte de 2013</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Information</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice graphique</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Sens</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">État des liaisons</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Câbles en couleur ou en</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">gris.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Existants ou projetés.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Vitesse</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Premier type d’information</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">des diagrammes.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Performance des connexions.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Utilisation</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Autre donnée des</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">diagrammes.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Importance du trafic.</text>
</g>
</svg>
