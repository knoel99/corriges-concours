<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Quels périmètres comparent les chiffres ?</title>
<desc id="description">2,4 % Direction des 500 plus grands groupes. Part observée de femmes. 20 % et 8 % Direction de sociétés de tailles différentes. Données d’une autre enquête. 30 % Conseils de surveillance des sociétés cotées. Quota proposé dans la question.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quels périmètres comparent les chiffres ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Chiffre</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Population ou instance</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Statut</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">2,4 %</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Direction des 500 plus</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">grands groupes.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Part observée de femmes.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">20 % et 8 %</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Direction de sociétés de</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">tailles différentes.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Données d’une autre</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">enquête.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">30 %</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Conseils de surveillance</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">des sociétés cotées.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Quota proposé dans la</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">question.</text>
</g>
</svg>
