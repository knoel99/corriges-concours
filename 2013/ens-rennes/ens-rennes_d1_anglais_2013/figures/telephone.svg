<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Why would someone hide a working phone?</title>
<desc id="description">Technical features Photography or navigation. Differences in performance. Access to others Unavailable social apps. The choices made by one’s peers. Public image A device hidden under an iPad. Fear of being judged.</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Why would someone hide a working phone?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Dimension</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Example in the text</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Reason to care</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Technical features</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Photography or navigation.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Differences in performance.</text>
<rect x="10" y="137" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Access to others</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Unavailable social apps.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">The choices made by one’s</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">peers.</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Public image</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">A device hidden under an</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">iPad.</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Fear of being judged.</text>
</g>
</svg>
