<svg xmlns="http://www.w3.org/2000/svg" width="740" height="220" viewBox="0 0 740 220" role="img"><title>Ce qu’il reste du revenu annuel moyen cité à Pékin face au prix d’une année d’études.</title><rect width="100%" height="100%" fill="#fafbf9"/>
<text x="18" y="29" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#172e3b" text-anchor="start" font-weight="700">Montants annuels en yuans</text>
<text x="18" y="72" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172e3b" text-anchor="start" font-weight="400">Reste à Pékin</text>
<rect x="160" y="56" height="18" width="81" fill="#25807d"/>
<text x="550" y="71" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172e3b" text-anchor="start" font-weight="400">64 800</text>
<text x="18" y="117" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172e3b" text-anchor="start" font-weight="400">Royaume-Uni</text>
<rect x="160" y="101" height="18" width="225" fill="#4c6c86"/>
<text x="550" y="116" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172e3b" text-anchor="start" font-weight="400">180 000 à 250 000</text>
<rect x="385" y="101" width="87.5" height="18" fill="#9ab2c2"/>
<text x="18" y="162" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172e3b" text-anchor="start" font-weight="400">États-Unis</text>
<rect x="160" y="146" height="18" width="375" fill="#4c6c86"/>
<text x="550" y="161" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172e3b" text-anchor="start" font-weight="400">au moins 300 000</text>
<text x="18" y="198" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172e3b" text-anchor="start" font-weight="400">Reste calculé : (10 000 de revenus − 4 600 de dépenses) × 12 mois.</text></svg>
