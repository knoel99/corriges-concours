<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Deux branches de la famille restituées par le vocabulaire arabe.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Du côté du père</text>
<text x="27" y="123" font-size="16">Sa sœur est la tante qui</text>
<text x="27" y="145" font-size="16">sert le dîner et rougit.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">La narratrice</text>
<text x="298" y="123" font-size="16">Elle guette les gestes</text>
<text x="298" y="145" font-size="16">de sa tante et interroge</text>
<text x="298" y="167" font-size="16">son oncle.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Du côté de la mère</text>
<text x="569" y="123" font-size="16">Son frère est l’étudiant</text>
<text x="569" y="145" font-size="16">auquel sa nièce demande</text>
<text x="569" y="167" font-size="16">des souvenirs.</text>
</g></svg>
