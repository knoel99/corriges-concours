<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Du débat public à l’observation des trajectoires internationales.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Deux témoignages</text>
<text x="27" y="118" font-size="16">Les intervenants libyen</text>
<text x="27" y="137" font-size="16">et syrien demandent</text>
<text x="27" y="156" font-size="16">reconnaissance,</text>
<text x="27" y="175" font-size="16">formation et moyens de</text>
<text x="27" y="194" font-size="16">vivre.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Un départ collectif</text>
<text x="298" y="118" font-size="16">Les ailes et les</text>
<text x="298" y="137" font-size="16">attributs des métiers</text>
<text x="298" y="156" font-size="16">rendent visible la</text>
<text x="298" y="175" font-size="16">variété des départs.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Un marché mondial</text>
<text x="569" y="118" font-size="16">Recrutement sélectif,</text>
<text x="569" y="137" font-size="16">mobilité en entreprise</text>
<text x="569" y="156" font-size="16">et déclassement</text>
<text x="569" y="175" font-size="16">modifient les parcours.</text>
</g></svg>
