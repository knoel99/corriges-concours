<svg xmlns="http://www.w3.org/2000/svg" width="740" height="212" viewBox="0 0 740 212" role="img"><title>Les trois premières raisons données pour expliquer l’absence de demande, enquête de 2014, document A3.</title><rect width="740" height="212" rx="7" fill="#f5f8f7"/>
<text x="22" y="33" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="22" fill="#173d42">Motifs invoqués pour ne pas déposer de demande</text>
<text x="24" y="75" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="18" fill="#173d42">Coût financier</text>
<rect x="237" y="57" width="349" height="23" fill="#337a77"/>
<text x="600" y="75" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#173d42">58,1 %</text>
<text x="24" y="121" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="18" fill="#173d42">Temps nécessaire</text>
<rect x="237" y="103" width="219" height="23" fill="#337a77"/>
<text x="470" y="121" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#173d42">36,5 %</text>
<text x="24" y="167" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="18" fill="#173d42">Un enfant suffit</text>
<rect x="237" y="149" width="194" height="23" fill="#337a77"/>
<text x="445" y="167" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="18" fill="#173d42">32,3 %</text>
<text x="24" y="198" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#173d42">Les répondants pouvaient donner plusieurs raisons.</text></svg>
