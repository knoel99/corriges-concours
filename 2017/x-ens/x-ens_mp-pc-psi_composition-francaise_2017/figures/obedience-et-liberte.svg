<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="t d"><title id="t">Hannah Arendt, l’autorité et la liberté de ceux qui obéissent</title><desc id="d">Trois conduites apparemment consenties éprouvent la définition d’Arendt. Le critère décisif est la place laissée au jugement de celui qui obéit.</desc><rect width="760" height="240" fill="white"/><g font-family="sans-serif"><rect x="10" y="14" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="49" fill="#194754" font-size="18" font-weight="bold">Usbek et Roxane</text><text x="212" y="37" fill="#253a40" font-size="18" font-weight="bold">La lettre finale reprend les signes d’obéissance.</text><text x="212" y="62" fill="#193f4b" font-size="16" font-weight="normal">Usbek découvre leur autre sens sans avoir jamais écouté.</text><rect x="10" y="88" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="123" fill="#194754" font-size="18" font-weight="bold">Les Troglodytes</text><text x="212" y="111" fill="#253a40" font-size="18" font-weight="bold">Le vieillard interroge ceux qui veulent le couronner.</text><text x="212" y="136" fill="#193f4b" font-size="16" font-weight="normal">Le peuple doit répondre de son propre désir d’obéir.</text><rect x="10" y="162" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="197" fill="#194754" font-size="18" font-weight="bold">Nora et Torvald</text><text x="212" y="185" fill="#253a40" font-size="18" font-weight="bold">Nora s’assied pour parler sérieusement.</text><text x="212" y="210" fill="#193f4b" font-size="16" font-weight="normal">Sa demande de juger fait apparaître la limite du foyer.</text></g></svg>