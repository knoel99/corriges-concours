<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois degrés de réalité pour le berger</title>
<desc id="description">L’arrivée La jeune fille explique son retard. Il imagine un détour par les danses. Le dialogue Elle le taquine à propos d’une fée. Il lui trouve à elle-même l’air d’une fée. Le départ Les cailloux roulent sous les sabots. Ils semblent lui tomber sur le cœur.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois degrés de réalité pour le berger</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice perçu</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce que le berger y ajoute</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">L’arrivée</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La jeune fille explique</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">son retard.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Il imagine un détour par</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">les danses.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le dialogue</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Elle le taquine à propos</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">d’une fée.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Il lui trouve à elle-même</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">l’air d’une fée.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le départ</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Les cailloux roulent sous</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">les sabots.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Ils semblent lui tomber sur</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">le cœur.</text>
</g>
</svg>
