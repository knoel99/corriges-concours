<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Que peut-on prendre au poète ?</title>
<desc id="description">La beauté Perilla se voit dans le miroir du futur. Le temps agit sans bruit. La fortune Crésus peut devenir un Irus. La richesse peut changer de mains. Les biens de l’exilé Auguste a pu priver Ovide de son foyer. Son talent l’accompagne. On le lira tant que Rome dominera le monde.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que peut-on prendre au poète ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Perte possible</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Expérience ou exemple</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui en découle</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">La beauté</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Perilla se voit dans le</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">miroir du futur.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le temps agit sans bruit.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">La fortune</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Crésus peut devenir un</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Irus.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La richesse peut changer de</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">mains.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Les biens de l’exilé</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Auguste a pu priver Ovide</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">de son foyer.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">On le lira tant que Rome</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">dominera le monde.</text>

</g>
</svg>
