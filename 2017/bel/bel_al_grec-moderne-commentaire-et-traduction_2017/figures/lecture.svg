<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Les deux chemins vers l’hellénisme</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Les deux chemins vers l’hellénisme</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Les regards étrangers</text>
<text x="75" y="129" font-size="17">Chaque observateur entre dans un monde différent par une qualité qui lui</text>
<text x="75" y="151" font-size="17">est familière.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">La question personnelle</text>
<text x="75" y="219" font-size="17">L’admiration de l’étranger ramène l’essayiste à son propre regard sur la</text>
<text x="75" y="241" font-size="17">Grèce.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">Le travail des héritiers</text>
<text x="75" y="309" font-size="17">La graine est vivante, parfois assoupie. Se connaître demande un effort.</text>
</g></svg>
