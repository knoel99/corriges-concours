<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Les regards dans le désert</title>
<desc id="description">La chambre Le confort appelle son contraire Garder l’élan et les reprises. Le talus Une femme et un nomade se surprennent Faire passer le regard d’un côté à l’autre. Les ruines La route s’ouvre sur une autre époque Rendre visibles les relais du souvenir.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Les regards dans le désert</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de départ</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Bascule</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet dans la traduction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">La chambre</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le confort appelle son</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">contraire</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Garder l’élan et les</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">reprises.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le talus</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Une femme et un nomade se</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">surprennent</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Faire passer le regard d’un</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">côté à l’autre.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Les ruines</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">La route s’ouvre sur une</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">autre époque</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Rendre visibles les relais</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">du souvenir.</text>
</g>
</svg>
