<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Qui a autorité sur les enfants ?</title>
<desc id="description">Chaque famille dispose d’un pédagogue privé. La cité confie les enfants au pédonome. Le contraste porte sur le détenteur de l’autorité. Les maîtres enseignent lettres, musique et exercices. Des auxiliaires exécutent les sanctions. Distinguer les enseignants des assistants du magistrat. Vêtements et chaussures protègent. Le législateur vise l’endurance au froid et au chaud. Rapporter les motifs à celui qui les formule.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui a autorité sur les enfants ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Chez les autres Grecs</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dans le modèle de Lycurgue</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Fonction dans la phrase</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Chaque famille</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">dispose d’un</text>
<text x="24" y="161" font-size="15" font-weight="700" fill="#162d3b">pédagogue privé.</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La cité confie les enfants</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">au pédonome.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le contraste porte sur le</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">détenteur de l’autorité.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Les maîtres</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">enseignent lettres,</text>
<text x="24" y="250" font-size="15" font-weight="700" fill="#162d3b">musique et exercices.</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Des auxiliaires exécutent</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">les sanctions.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Distinguer les enseignants</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">des assistants du</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">magistrat.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Vêtements et</text>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">chaussures protègent.</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Le législateur vise</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">l’endurance au froid et au</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">chaud.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Rapporter les motifs à</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">celui qui les formule.</text>
</g>
</svg>
