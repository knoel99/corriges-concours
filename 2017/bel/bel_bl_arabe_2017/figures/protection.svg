<svg xmlns="http://www.w3.org/2000/svg" width="720" height="138" viewBox="0 0 720 138" role="img" aria-labelledby="titre"><title id="titre">Quitter son domicile — trois situations</title><rect width="720" height="138" rx="8" fill="#f5f7f8"/><text x="15" y="29" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#193442">Quitter son domicile — trois situations</text>
<rect x="15" y="46" width="220" height="78" rx="5" fill="white" stroke="#577080"/>
<text x="125" y="68" text-anchor="middle" font-family="DejaVu Sans" font-size="14.5" font-weight="bold" fill="#254352">Déplacement interne</text>
<text x="125" y="90" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">Même pays</text>
<text x="125" y="110" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">Autre lieu de résidence</text>
<rect x="250" y="46" width="220" height="78" rx="5" fill="white" stroke="#577080"/>
<text x="360" y="68" text-anchor="middle" font-family="DejaVu Sans" font-size="14.5" font-weight="bold" fill="#254352">Refuge</text>
<text x="360" y="90" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">Frontière franchie</text>
<text x="360" y="110" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">Protection recherchée</text>
<rect x="485" y="46" width="220" height="78" rx="5" fill="white" stroke="#577080"/>
<text x="595" y="68" text-anchor="middle" font-family="DejaVu Sans" font-size="14.5" font-weight="bold" fill="#254352">Migration économique</text>
<text x="595" y="90" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">Départ pour améliorer</text>
<text x="595" y="110" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">ses perspectives</text>
