<svg xmlns="http://www.w3.org/2000/svg" width="720" height="138" viewBox="0 0 720 138" role="img" aria-labelledby="titre"><title id="titre">Trois documents, trois manières de connaître une réalité</title><rect width="720" height="138" rx="8" fill="#f5f7f8"/><text x="15" y="29" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#193442">Trois documents, trois manières de connaître une réalité</text>
