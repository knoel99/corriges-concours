<text x="360" y="110" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">et des identités plurielles</text>
<rect x="485" y="46" width="220" height="78" rx="5" fill="white" stroke="#577080"/>
<text x="595" y="68" text-anchor="middle" font-family="DejaVu Sans" font-size="14.5" font-weight="bold" fill="#254352">Rencontre associative</text>
<text x="595" y="90" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">Des procédures</text>
<text x="595" y="110" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">et des obstacles concrets</text>
