<text x="125" y="68" text-anchor="middle" font-family="DejaVu Sans" font-size="14.5" font-weight="bold" fill="#254352">Définition du HCR</text>
<text x="125" y="90" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">Un statut juridique</text>
<text x="125" y="110" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" font-weight="normal" fill="#254352">et ses conséquences</text>
