<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Ce qui est dit, entendu et interrompu</title>
<desc id="description">La sommation Pröckl réclame une littérature militante Le narrateur montre aussi la veste et les chutes. La réponse Tüverlin retourne la prescription La suite aurait expliqué son intention. Le traîneau Le lecteur connaît la suite non dite Pröckl répond à une explication incomplète.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Ce qui est dit, entendu et interrompu</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Voix</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet du déplacement</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">La sommation</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Pröckl réclame une</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">littérature militante</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le narrateur montre aussi</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">la veste et les chutes.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">La réponse</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Tüverlin retourne la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">prescription</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La suite aurait expliqué</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">son intention.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le traîneau</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le lecteur connaît la</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">suite non dite</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Pröckl répond à une</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">explication incomplète.</text>
</g>
</svg>
