<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Voir le même objet autrement</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Voir le même objet autrement</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">L’arbre recherché</text>
<text x="75" y="129" font-size="17">André cherche le chêne tel qu’il l’a connu. Il admire déjà celui qu’il</text>
<text x="75" y="151" font-size="17">croit absent.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">Le souvenir retrouvé</text>
<text x="75" y="219" font-size="17">Les feuilles nouvelles font resurgir à la fois Austerlitz, l’épouse,</text>
<text x="75" y="241" font-size="17">Pierre et la jeune fille.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">Le regard au retour</text>
<text x="75" y="309" font-size="17">Le portrait de Lise paraît transformé. Les visiteurs verront seulement la</text>
<text x="75" y="331" font-size="17">froideur du prince.</text>
</g></svg>
