<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Du mur à la maison</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Du mur à la maison</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Un poste d’observation</text>
<text x="75" y="129" font-size="17">Perchés sur les murs, les urubus voient les habitants chez eux.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">Un seuil franchi</text>
<text x="75" y="219" font-size="17">Les coups de balai se font rares. Les habitants laissent exprès de la</text>
<text x="75" y="241" font-size="17">nourriture.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">Une liberté menacée</text>
<text x="75" y="309" font-size="17">La ville s’attache aux oiseaux. La Compagnie les chasse et barre les</text>
<text x="75" y="331" font-size="17">raccourcis.</text>
</g></svg>
