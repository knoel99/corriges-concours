<svg xmlns="http://www.w3.org/2000/svg" width="880" height="365" viewBox="0 0 880 365" role="img"><title>Ce qui souffre, ce qui montre et ce qui porte la trace</title><desc>Suite chronologique commentée. Condition — Une expérience de douleur. Giotto distingue le corps mort et les proches qui pleurent.. Animal — Un être vivant vulnérable. Le cheval de Picasso participe à une scène collective.. Paysage — Une ligne qui oriente le regard. La pente chez Giotto accompagne le groupe des endeuillés.. Objet — L’indice d’une personne absente. Le vêtement chez Boltanski conserve une échelle humaine.</desc><rect width="880" height="365" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="39" font-size="25" fill="#17394c" font-weight="bold">Ce qui souffre, ce qui montre et ce qui porte la trace</text><rect x="24" y="59" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="59" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="88" font-size="17" fill="#17394c" font-weight="bold">Condition</text><text x="256" y="87" font-size="18" fill="#17394c" font-weight="bold">Une expérience de douleur</text><text x="256" y="111" font-size="16" fill="#17394c">Giotto distingue le corps mort et les proches qui pleurent.</text><rect x="24" y="133" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="133" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="162" font-size="17" fill="#17394c" font-weight="bold">Animal</text><text x="256" y="161" font-size="18" fill="#17394c" font-weight="bold">Un être vivant vulnérable</text><text x="256" y="185" font-size="16" fill="#17394c">Le cheval de Picasso participe à une scène collective.</text><rect x="24" y="207" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="207" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="236" font-size="17" fill="#17394c" font-weight="bold">Paysage</text><text x="256" y="235" font-size="18" fill="#17394c" font-weight="bold">Une ligne qui oriente le regard</text><text x="256" y="259" font-size="16" fill="#17394c">La pente chez Giotto accompagne le groupe des endeuillés.</text><rect x="24" y="281" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="281" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="310" font-size="17" fill="#17394c" font-weight="bold">Objet</text><text x="256" y="309" font-size="18" fill="#17394c" font-weight="bold">L’indice d’une personne absente</text><text x="256" y="333" font-size="16" fill="#17394c">Le vêtement chez Boltanski conserve une échelle humaine.</text></g></svg>
