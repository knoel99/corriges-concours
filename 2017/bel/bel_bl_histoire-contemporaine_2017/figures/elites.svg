<svg xmlns="http://www.w3.org/2000/svg" width="880" height="439" viewBox="0 0 880 439" role="img"><title>Des ressources à une position dirigeante</title><desc>Suite chronologique commentée. 1872 · Formation — Recruter les futurs dirigeants. L’École libre des sciences politiques organise une formation privée.. 1898 · Réputation — Convertir une autorité littéraire. Zola intervient dans la presse au cours de l’affaire Dreyfus.. 1936 · Nomination — Entrer au gouvernement. Trois sous-secrétaires d’État sont nommées avant le suffrage féminin.. 1944–1945 · Mandat — Élire et être élue. Après l’ordonnance de 1944, 33 femmes entrent à la Constituante.. 1999 · Sélection — Interroger l’accès aux candidatures. La révision constitutionnelle porte sur l’égal accès aux mandats.</desc><rect width="880" height="439" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="39" font-size="25" fill="#17394c" font-weight="bold">Des ressources à une position dirigeante</text><rect x="24" y="59" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="59" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="88" font-size="17" fill="#17394c" font-weight="bold">1872 · Formation</text><text x="256" y="87" font-size="18" fill="#17394c" font-weight="bold">Recruter les futurs dirigeants</text><text x="256" y="111" font-size="16" fill="#17394c">L’École libre des sciences politiques organise une formation privée.</text><rect x="24" y="133" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="133" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="162" font-size="17" fill="#17394c" font-weight="bold">1898 · Réputation</text><text x="256" y="161" font-size="18" fill="#17394c" font-weight="bold">Convertir une autorité littéraire</text><text x="256" y="185" font-size="16" fill="#17394c">Zola intervient dans la presse au cours de l’affaire Dreyfus.</text><rect x="24" y="207" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="207" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="236" font-size="17" fill="#17394c" font-weight="bold">1936 · Nomination</text><text x="256" y="235" font-size="18" fill="#17394c" font-weight="bold">Entrer au gouvernement</text><text x="256" y="259" font-size="16" fill="#17394c">Trois sous-secrétaires d’État sont nommées avant le suffrage féminin.</text><rect x="24" y="281" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="281" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="310" font-size="17" fill="#17394c" font-weight="bold">1944–1945 · Mandat</text><text x="256" y="309" font-size="18" fill="#17394c" font-weight="bold">Élire et être élue</text><text x="256" y="333" font-size="16" fill="#17394c">Après l’ordonnance de 1944, 33 femmes entrent à la Constituante.</text><rect x="24" y="355" width="832" height="65" fill="#f0ede1" stroke="none" stroke-width="1"/><rect x="24" y="355" width="7" height="65" fill="#927438" stroke="none" stroke-width="1"/><text x="43" y="384" font-size="17" fill="#17394c" font-weight="bold">1999 · Sélection</text><text x="256" y="383" font-size="18" fill="#17394c" font-weight="bold">Interroger l’accès aux candidatures</text><text x="256" y="407" font-size="16" fill="#17394c">La révision constitutionnelle porte sur l’égal accès aux mandats.</text></g></svg>
