<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img"><title>Une chaise et trois moments de l’attention au plateau</title><desc>Étude hypothétique d’une chaise immobile lors de l’approche et du départ d’un acteur. Schéma original, sans attribution à une production existante.</desc><rect width="880" height="350" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="38" font-size="25" fill="#17394c" font-weight="bold">Une chaise et trois moments de l’attention au plateau</text><rect x="26" y="59" width="262" height="173" fill="#e7ede8" stroke="#a7b1a1" stroke-width="1"/><text x="35" y="88" font-size="19" fill="#17394c" font-weight="bold">Placer</text><line x1="153" y1="144" x2="153" y2="173" stroke="#8b6342" stroke-width="5"/><line x1="151" y1="173" x2="185" y2="173" stroke="#8b6342" stroke-width="5"/><line x1="155" y1="173" x2="153" y2="197" stroke="#8b6342" stroke-width="4"/><line x1="180" y1="174" x2="182" y2="197" stroke="#8b6342" stroke-width="4"/><circle cx="70" cy="140" r="8" fill="#345c70" stroke="none" stroke-width="1"/><line x1="70" y1="148" x2="70" y2="179" stroke="#345c70" stroke-width="4"/><line x1="70" y1="179" x2="59" y2="195" stroke="#345c70" stroke-width="4"/><line x1="70" y1="179" x2="79" y2="195" stroke="#345c70" stroke-width="4"/><text x="31" y="262" font-size="16" fill="#17394c">L’objet occupe le passage.</text><text x="31" y="288" font-size="16" fill="#17394c">Les acteurs doivent le voir.</text><rect x="309" y="59" width="262" height="173" fill="#e7ede8" stroke="#a7b1a1" stroke-width="1"/><text x="318" y="88" font-size="19" fill="#17394c" font-weight="bold">Attendre</text><line x1="436" y1="144" x2="436" y2="173" stroke="#8b6342" stroke-width="5"/><line x1="434" y1="173" x2="468" y2="173" stroke="#8b6342" stroke-width="5"/><line x1="438" y1="173" x2="436" y2="197" stroke="#8b6342" stroke-width="4"/><line x1="463" y1="174" x2="465" y2="197" stroke="#8b6342" stroke-width="4"/><circle cx="391" cy="140" r="8" fill="#345c70" stroke="none" stroke-width="1"/><line x1="391" y1="148" x2="391" y2="179" stroke="#345c70" stroke-width="4"/><line x1="391" y1="179" x2="380" y2="195" stroke="#345c70" stroke-width="4"/><line x1="391" y1="179" x2="400" y2="195" stroke="#345c70" stroke-width="4"/><line x1="402" y1="141" x2="433" y2="155" stroke="#738f8b" stroke-width="1.5"/><text x="314" y="262" font-size="16" fill="#17394c">La place reste disponible.</text><text x="314" y="288" font-size="16" fill="#17394c">Le regard fait durer l’attente.</text><rect x="592" y="59" width="262" height="173" fill="#e7ede8" stroke="#a7b1a1" stroke-width="1"/><text x="601" y="88" font-size="19" fill="#17394c" font-weight="bold">Repartir</text><line x1="719" y1="144" x2="719" y2="173" stroke="#8b6342" stroke-width="5"/><line x1="717" y1="173" x2="751" y2="173" stroke="#8b6342" stroke-width="5"/><line x1="721" y1="173" x2="719" y2="197" stroke="#8b6342" stroke-width="4"/><line x1="746" y1="174" x2="748" y2="197" stroke="#8b6342" stroke-width="4"/><text x="597" y="262" font-size="16" fill="#17394c">Le siège demeure vide.</text><text x="597" y="288" font-size="16" fill="#17394c">L’absence devient sensible.</text><text x="27" y="330" font-size="16" fill="#17394c">Proposition de mise en espace. L’objet garde la même position dans les trois vues.</text></g></svg>
