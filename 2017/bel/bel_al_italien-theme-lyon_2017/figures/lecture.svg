<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">À quel moment le narrateur sait-il ?</title>
<desc id="description">La nuit Danièle et lui entendent un bruit. Avevamo udito. Le lendemain Il apprend qu’un bal avait eu lieu. Seppi soltanto l’indomani. L’enquête Il imagine ce que fera Renaud. Avrebbe archiviato il caso.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">À quel moment le narrateur sait-il ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est accessible</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Forme dans la traduction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">La nuit</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Danièle et lui entendent</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">un bruit.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Avevamo udito.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le lendemain</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Il apprend qu’un bal avait</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">eu lieu.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Seppi soltanto l’indomani.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">L’enquête</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Il imagine ce que fera</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Renaud.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Avrebbe archiviato il caso.</text>
</g>
</svg>
