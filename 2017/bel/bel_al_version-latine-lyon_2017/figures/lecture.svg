<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Trois regards sur les défenses</title>
<desc id="description">Au repos Enfouir une dent tombée. Soustraire l’ivoire aux hommes. Dans le danger Ménager une dent, employer l’autre, puis briser les deux. Conserver une arme ou racheter sa vie. Devant une empreinte Déterrer et transmettre la trace découverte. Donner l’alerte à la troupe.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois regards sur les défenses</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Action attribuée aux éléphants</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Au repos</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Enfouir une dent tombée.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Soustraire l’ivoire aux</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">hommes.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Dans le danger</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Ménager une dent, employer</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">l’autre, puis briser les</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">deux.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Conserver une arme ou</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">racheter sa vie.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Devant une empreinte</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Déterrer et transmettre la</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">trace découverte.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Donner l’alerte à la</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">troupe.</text>
</g>
</svg>
