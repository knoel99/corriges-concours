<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Ce qui peut faire signe</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Ce qui peut faire signe</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Le récit rêvé</text>
<text x="75" y="129" font-size="17">Le voyage promet de devenir une autre et d’écrire un récit facile à</text>
<text x="75" y="151" font-size="17">goûter.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">La piste de Sandra</text>
<text x="75" y="219" font-size="17">Le dernier lieu attesté et les rencontres ne fournissent aucune preuve de</text>
<text x="75" y="241" font-size="17">son destin.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">L’anneau d’herbe</text>
<text x="75" y="309" font-size="17">Le cadeau est réel. La lettre S que cherche la narratrice est un effet de</text>
<text x="75" y="331" font-size="17">son désir.</text>
</g></svg>
