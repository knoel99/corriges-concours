<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346" role="img"><title>Du côté que l’on double à l’aire que l’on double</title><desc>Trois figures à une même échelle montrent que doubler une longueur quadruple l’aire. Le carré vert a pour côté la diagonale du carré initial.</desc><rect width="880" height="346" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="22" y="38" font-size="25" fill="#17394c" font-weight="bold">Du côté que l’on double à l’aire que l’on double</text><rect x="24" y="63" width="267" height="221" fill="#e9eeea" stroke="none" stroke-width="1"/><text x="33" y="89" font-size="17" fill="#17394c" font-weight="bold">1 · Carré de départ</text><rect x="131.5" y="156.5" width="53" height="53" fill="#b6ccbf" stroke="#405b64" stroke-width="2"/><rect x="308" y="63" width="267" height="221" fill="#e9eeea" stroke="none" stroke-width="1"/><text x="317" y="89" font-size="17" fill="#17394c" font-weight="bold">2 · Doubler le côté</text><rect x="389" y="130" width="106" height="106" fill="#f8f4e8" stroke="#405b64" stroke-width="2"/><line x1="389" y1="183" x2="495" y2="183" stroke="#506d78" stroke-width="1.2"/><line x1="442" y1="130" x2="442" y2="236" stroke="#506d78" stroke-width="1.2"/><rect x="592" y="63" width="267" height="221" fill="#e9eeea" stroke="none" stroke-width="1"/><text x="601" y="89" font-size="17" fill="#17394c" font-weight="bold">3 · Prendre la diagonale</text><rect x="673" y="130" width="106" height="106" fill="#f8f4e8" stroke="#405b64" stroke-width="2"/><path d="M726,130 l53,53 l-53,53 l-53,-53 Z" fill="#87b0a5" stroke="#24495a" stroke-width="2.3"/><line x1="673" y1="183" x2="779" y2="183" stroke="#506d78" stroke-width="1.2"/><line x1="726" y1="130" x2="726" y2="236" stroke="#506d78" stroke-width="1.2"/><text x="34" y="270" font-size="16" fill="#17394c">Côté un, aire un.</text><text x="317" y="270" font-size="16" fill="#17394c">Côté deux, aire quatre.</text><text x="602" y="257" font-size="15" fill="#17394c">Quatre demi-carrés de départ</text><text x="602" y="277" font-size="15" fill="#17394c">ont une aire totale de deux.</text><text x="24" y="324" font-size="17" fill="#17394c">Le contour oblique a pour côté la diagonale du carré initial. Les traits partagent son aire.</text></g></svg>
