<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>De l’emprunt au théâtre national</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">De l’emprunt au théâtre national</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Un débat polarisé</text>
<text x="75" y="129" font-size="17">Les deux partis jugent l’Occident en bloc. La métaphore du souffle change</text>
<text x="75" y="151" font-size="17">de sens.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">Une leçon mise à l’épreuve</text>
<text x="75" y="219" font-size="17">Poésie et roman s’ouvrent à la vie présente. La scène reste à faire.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">Le regard des spectateurs</text>
<text x="75" y="309" font-size="17">Un public pourra découvrir le théâtre lorsque les écrivains y feront voir</text>
<text x="75" y="331" font-size="17">sa vie.</text>
</g></svg>
