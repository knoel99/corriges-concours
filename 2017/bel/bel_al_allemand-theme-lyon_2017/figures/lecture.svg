<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Voir une maison, perdre un quartier de vue</title>
<desc id="description">L’habitation Un souvenir unique, peut-être pas une maison Les trois temps introduisent le doute. Le dossier Logements sociaux horizontaux ou verticaux L’appartenance dépend d’une pièce administrative. La rocade La ville se laisse voir de haut Le regard touristique exclut ce qu’il cadre.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Voir une maison, perdre un quartier de vue</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Niveau</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Détail</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Tension à rendre</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">L’habitation</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un souvenir unique, peut-</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">être pas une maison</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les trois temps</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">introduisent le doute.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le dossier</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Logements sociaux</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">horizontaux ou verticaux</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">L’appartenance dépend d’une</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">pièce administrative.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La rocade</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">La ville se laisse voir de</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">haut</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le regard touristique</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">exclut ce qu’il cadre.</text>
</g>
</svg>
