<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">De la trace visible à la question politique</title>
<desc id="description">Les vestiges Le portail des pauvres Qui pouvait autrefois réclamer un secours ? Le cloître Egremont monte un escalier familier À quel titre a-t-il accès au lieu ? La méditation Les meules des abbés et des comtes Qui profite des transformations nationales ?</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De la trace visible à la question politique</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Détail du texte</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question qui en découle</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Les vestiges</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le portail des pauvres</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Qui pouvait autrefois</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">réclamer un secours ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le cloître</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Egremont monte un escalier</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">familier</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">À quel titre a-t-il accès</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">au lieu ?</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La méditation</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Les meules des abbés et</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">des comtes</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Qui profite des</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">transformations nationales</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">?</text>
</g>
</svg>
