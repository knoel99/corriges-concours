<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Un espace ouvert, une intimité recherchée</title>
<desc id="description">Chambre On ne peut y allumer un feu. Elle s’installe dans le salon. Salon La porte ouverte et la mère qui circule. Sa lecture demeure exposée. Galeries Le regard se tourne vers la peinture. Elle éprouve une possibilité de sortir de soi.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Un espace ouvert, une intimité recherchée</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lieu</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Présence d’autrui</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet sur la narratrice</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Chambre</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">On ne peut y allumer un</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">feu.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Elle s’installe dans le</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">salon.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Salon</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La porte ouverte et la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">mère qui circule.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Sa lecture demeure exposée.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Galeries</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le regard se tourne vers</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">la peinture.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Elle éprouve une</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">possibilité de sortir de</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">soi.</text>
</g>
</svg>
