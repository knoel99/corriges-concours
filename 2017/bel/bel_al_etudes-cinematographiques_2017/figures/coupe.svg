<svg xmlns="http://www.w3.org/2000/svg" width="880" height="402" viewBox="0 0 880 402" role="img"><title>Trois cas où la coupe change le sens</title><desc>Trois rythmes relatifs. Les traits délimitent des plans ou des images proposées à l’attention. Les durées ne sont pas mesurées.</desc><rect width="880" height="402" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="38" font-size="25" fill="#17394c" font-weight="bold">Trois cas où la coupe change le sens</text><rect x="22" y="60" width="835" height="86" fill="#e5ebe6" stroke="none" stroke-width="1"/><text x="36" y="92" font-size="19" fill="#17394c" font-weight="bold">Eisenstein</text><rect x="200" y="73" width="200.66666666666666" height="21" fill="#497384" stroke="none" stroke-width="1"/><rect x="404.66666666666663" y="73" width="200.66666666666666" height="21" fill="#497384" stroke="none" stroke-width="1"/><rect x="609.3333333333333" y="73" width="200.66666666666666" height="21" fill="#497384" stroke="none" stroke-width="1"/><text x="201" y="123" font-size="16" fill="#17394c">Trois sculptures immobiles semblent s’éveiller.</text><rect x="22" y="159" width="835" height="86" fill="#e5ebe6" stroke="none" stroke-width="1"/><text x="36" y="191" font-size="19" fill="#17394c" font-weight="bold">Ozu</text><rect x="200" y="172" width="149.5" height="21" fill="#497384" stroke="none" stroke-width="1"/><rect x="353.5" y="172" width="303.0" height="21" fill="#a86635" stroke="none" stroke-width="1"/><rect x="660.5" y="172" width="149.5" height="21" fill="#497384" stroke="none" stroke-width="1"/><text x="201" y="222" font-size="16" fill="#17394c">Le vase ménage un intervalle entre deux expressions.</text><rect x="22" y="258" width="835" height="86" fill="#e5ebe6" stroke="none" stroke-width="1"/><text x="36" y="290" font-size="19" fill="#17394c" font-weight="bold">Marker</text><rect x="200" y="271" width="98.33333333333333" height="21" fill="#497384" stroke="none" stroke-width="1"/><rect x="302.3333333333333" y="271" width="98.33333333333333" height="21" fill="#497384" stroke="none" stroke-width="1"/><rect x="404.66666666666663" y="271" width="98.33333333333333" height="21" fill="#497384" stroke="none" stroke-width="1"/><rect x="506.99999999999994" y="271" width="98.33333333333333" height="21" fill="#497384" stroke="none" stroke-width="1"/><rect x="609.3333333333333" y="271" width="98.33333333333333" height="21" fill="#a86635" stroke="none" stroke-width="1"/><rect x="711.6666666666666" y="271" width="98.33333333333333" height="21" fill="#497384" stroke="none" stroke-width="1"/><text x="201" y="321" font-size="16" fill="#17394c">Une image animée survient parmi les photographies.</text><text x="25" y="383" font-size="16" fill="#17394c">Schéma des relations au montage. Les longueurs figurées ne sont pas chronométrées.</text></g></svg>
