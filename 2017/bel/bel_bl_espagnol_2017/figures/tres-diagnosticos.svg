<svg xmlns="http://www.w3.org/2000/svg" width="870" height="297" viewBox="0 0 870 297" role="img"><title>¿Qué pasado se convierte en argumento?</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">¿Qué pasado se convierte en argumento?</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Intervención</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Prueba escogida</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Salida imaginada</text><rect x="12" y="84" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Unamuno, 1895</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Cádiz y el Dos de Mayo</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">La tradición puede apropiarse de</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">una idea extranjera.</text><rect x="12" y="151" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Ortega, 1921</text><text x="225" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Crónicas medievales y</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">unidad peninsular</text><text x="505" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">La unidad visible encubre una</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">debilidad de origen.</text><rect x="12" y="218" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Manifiesto, 1930</text><text x="225" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Derrotas coloniales y</text><text x="225" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">fraude electoral</text><text x="505" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">La nación debe darse una asamblea</text><text x="505" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">constituyente.</text></svg>
