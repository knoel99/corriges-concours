<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Deux directions du raisonnement</title>
<desc id="description">Méthode écartée Quelques exemples très frappants. Une définition laisse échapper des faits. Méthode retenue La portée sociale du rire. La lumière est dirigée du haut vers le bas. Premier objet La personne dans la société. L’analyse porte d’abord sur le caractère.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux directions du raisonnement</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Chemin</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Point de départ</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conséquence</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Méthode écartée</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Quelques exemples très</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">frappants.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Une définition laisse</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">échapper des faits.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Méthode retenue</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La portée sociale du rire.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La lumière est dirigée du</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">haut vers le bas.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Premier objet</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">La personne dans la</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">société.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">L’analyse porte d’abord sur</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">le caractère.</text>
</g>
</svg>
