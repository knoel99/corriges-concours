<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Ce qu’un discours transmet à l’autre</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Ce qu’un discours transmet à l’autre</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Février 1939 · la route</text>
<text x="75" y="129" font-size="17">Le photographe cadre la réfugiée. Le témoin retrouve son intention et son</text>
<text x="75" y="151" font-size="17">silence.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">Février 1939 · la frontière</text>
<text x="75" y="219" font-size="17">Le discours de Del Barrio fait relever les têtes. Les camps attendent les</text>
<text x="75" y="241" font-size="17">soldats.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">Juillet 1944 · la place</text>
<text x="75" y="309" font-size="17">González reprend le salut et revendique une continuité au-delà de la</text>
<text x="75" y="331" font-size="17">frontière.</text>
</g></svg>
