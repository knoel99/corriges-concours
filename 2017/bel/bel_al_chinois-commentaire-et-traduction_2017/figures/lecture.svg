<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Comment la valeur accordée aux filles change</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Comment la valeur accordée aux filles change</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Les premiers cris</text>
<text x="75" y="129" font-size="17">Une naissance unit les parents. Deux sœurs promettent une vieillesse</text>
<text x="75" y="151" font-size="17">entourée.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">Le changement de voix</text>
<text x="75" y="219" font-size="17">À la troisième naissance, la même image des fleurs devient un reproche.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">La fête prévue</text>
<text x="75" y="309" font-size="17">Le couple interprète des signes incertains et réserve le festin à un</text>
<text x="75" y="331" font-size="17">garçon.</text>
</g></svg>
