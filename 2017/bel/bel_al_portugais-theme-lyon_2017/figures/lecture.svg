<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment la chambre devient un lieu à soi</title>
<desc id="description">Le regard Le corps du frère. L’enfant s’interroge sur ce qu’elle voit. L’ouïe et le toucher La machine derrière la cloison. La vibration accompagne le sommeil. Le mouvement La porte, la fenêtre, le miroir. Elle peut décider seule de ses gestes.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment la chambre devient un lieu à soi</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Perception</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Objet concret</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Mouvement dans le récit</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le regard</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le corps du frère.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’enfant s’interroge sur ce</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">qu’elle voit.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">L’ouïe et le toucher</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La machine derrière la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">cloison.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La vibration accompagne le</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">sommeil.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le mouvement</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">La porte, la fenêtre, le</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">miroir.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Elle peut décider seule de</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">ses gestes.</text>
</g>
</svg>
