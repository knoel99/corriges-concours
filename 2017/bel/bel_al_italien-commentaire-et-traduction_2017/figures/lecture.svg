<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Les destins possibles du bourgeon</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Les destins possibles du bourgeon</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Dans la vie du berger</text>
<text x="75" y="129" font-size="17">Le corps apprend très tôt les gestes des anciens. Les forces intérieures</text>
<text x="75" y="151" font-size="17">attendent.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">Sur la route du bandit</text>
<text x="75" y="219" font-size="17">La plante grandit vite, puis brûle. Le récit teste cette voie à la</text>
<text x="75" y="241" font-size="17">deuxième personne.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">Au moment d’écrire</text>
<text x="75" y="309" font-size="17">L’adolescent attend encore. L’écrivain sait déjà mettre en mots les causes</text>
<text x="75" y="331" font-size="17">de l’attente.</text>
</g></svg>
