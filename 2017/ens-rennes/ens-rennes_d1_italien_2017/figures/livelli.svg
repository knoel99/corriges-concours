<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Quale traguardo viene proposto agli alunni?</title>
<desc id="description">Attese diverse in partenza Talento attribuito e ambiente sociale. Ad alcuni si chiede meno. Riferimento medio La media dei risultati. Si cerca di portarvi tutti. Riferimento alto I risultati migliori. La responsabilità di aiutare tutti è collettiva.</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quale traguardo viene proposto agli alunni?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Scelta</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Punto di riferimento</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conseguenza</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Attese diverse in</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">partenza</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Talento attribuito e</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">ambiente sociale.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Ad alcuni si chiede meno.</text>
<rect x="10" y="159" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Riferimento medio</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La media dei risultati.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Si cerca di portarvi tutti.</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Riferimento alto</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">I risultati migliori.</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">La responsabilità di</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">aiutare tutti è collettiva.</text>
</g>
</svg>
