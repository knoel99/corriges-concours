<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">¿Cómo se selecciona el pasado?</title>
<desc id="description">Añadir Atribuir una victoria a una intervención milagrosa. Dar al relato una fuerza extraordinaria. Silenciar Desatender huellas fenicias o romanas. Reducir la visibilidad de un pasado compartido. Prolongar un origen Relacionar el pueblo vasco con Túbal. Atribuir a una lengua una antigüedad excepcional.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿Cómo se selecciona el pasado?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Operación</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ejemplo del texto</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Efecto</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Añadir</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Atribuir una victoria a</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">una intervención</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">milagrosa.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Dar al relato una fuerza</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">extraordinaria.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Silenciar</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Desatender huellas</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">fenicias o romanas.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Reducir la visibilidad de</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">un pasado compartido.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Prolongar un origen</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Relacionar el pueblo vasco</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">con Túbal.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Atribuir a una lengua una</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">antigüedad excepcional.</text>
</g>
</svg>
