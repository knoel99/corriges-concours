<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">What does the poll actually measure?</title>
<desc id="description">Girl plays with toys marketed to boys Approval is widespread. Most parents. Boy plays with a Barbie Approval is much less common. One in three parents. Behaviour of the children themselves Not measured by these answers. The survey concerns adult approval.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What does the poll actually measure?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Case</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Reported response</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Population</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Girl plays with toys</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">marketed to boys</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Approval is widespread.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Most parents.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Boy plays with a</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Barbie</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Approval is much less</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">common.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">One in three parents.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Behaviour of the</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">children themselves</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Not measured by these</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">answers.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">The survey concerns adult</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">approval.</text>
</g>
</svg>
