<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="DejaVu Sans, sans-serif"><title>Lignée, manière de vivre et reconnaissance répondent à trois questions distinctes.</title><rect width="900" height="250" fill="#faf9f4"/><text x="450" y="35" text-anchor="middle" font-size="25" fill="#163945">Un même cas, trois questions de frontière</text><rect x="30" y="76" width="240" height="109" fill="#dbeae2" stroke="#335563" stroke-width="2"/><text x="150" y="108" text-anchor="middle" font-size="22" fill="#163945">Espèce</text><text x="150" y="144" text-anchor="middle" font-size="16" fill="#163945">À quelle lignée appartient</text><text x="150" y="166" text-anchor="middle" font-size="16" fill="#163945">cet enfant ?</text><rect x="330" y="76" width="240" height="109" fill="#dbeae2" stroke="#335563" stroke-width="2"/><text x="450" y="108" text-anchor="middle" font-size="22" fill="#163945">Pratique</text><text x="450" y="144" text-anchor="middle" font-size="16" fill="#163945">Comment apprend-il les</text><text x="450" y="166" text-anchor="middle" font-size="16" fill="#163945">tours de parole ?</text><rect x="630" y="76" width="240" height="109" fill="#dbeae2" stroke="#335563" stroke-width="2"/><text x="750" y="108" text-anchor="middle" font-size="22" fill="#163945">Statut</text><text x="750" y="144" text-anchor="middle" font-size="16" fill="#163945">Le droit d’être reconnu</text><text x="750" y="166" text-anchor="middle" font-size="16" fill="#163945">dépend-il de cet acquis ?</text><text x="450" y="224" text-anchor="middle" font-size="18" fill="#163945">Le passage d’une réponse à l’autre demande une justification.</text></svg>
