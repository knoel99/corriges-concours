<text x="27" y="270" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="400" fill="#1b3641">À travers des nourritures successives, la nature constitue des organismes doués de sensibilité.</text>
