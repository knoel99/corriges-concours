<svg xmlns="http://www.w3.org/2000/svg" width="860" height="292" viewBox="0 0 860 292" role="img"><title>Peut-on emprunter un geste ?</title>
<defs>
<marker id="a-sea" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#145f59"/></marker>
<marker id="a-clay" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8b432e"/></marker>
<marker id="a-navy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334a65"/></marker>
</defs>
<rect x="1" y="1" width="858" height="290" rx="13" fill="#fbf9f2" stroke="#ccd6d0"/>
<text x="25" y="38" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="24" font-style="normal" font-weight="700" fill="#1b3641">Peut-on emprunter un geste ?</text>
<rect x="311" y="58" width="238" height="38" rx="8" fill="#d8e8e2" stroke="none"/>
<text x="430.0" y="83" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="700" fill="#145f59">Un mouvement du corps</text>
<path d="M428 100 V111 H225 Q211 111 211 125 V140" fill="none" stroke="#145f59" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sea)"/>
<path d="M428 100 V111 H634 Q647 111 647 125 V140" fill="none" stroke="#8b432e" stroke-width="3" stroke-linecap="round" marker-end="url(#a-clay)"/>
<text x="211" y="169" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-style="normal" font-weight="700" fill="#145f59">Sur scène</text>
<text x="647" y="169" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-style="normal" font-weight="700" fill="#8b432e">Devant les juges</text>
<text x="211" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-style="normal" font-weight="400" fill="#1b3641">Donner à voir l’hésitation du personnage.</text>
<text x="647" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-style="normal" font-weight="400" fill="#1b3641">Régler le geste sur la parole que l’on porte.</text>
<path d="M25 220 L833 220" fill="none" stroke="#ccd6d0" stroke-width="1" stroke-linecap="round"/>
<text x="27" y="245" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-style="normal" font-weight="700" fill="#1b3641">Pourquoi le même geste peut-il déplaire ?</text>
<text x="27" y="270" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="400" fill="#1b3641">Pour Quintilien, il faut compter avec le corps de l’interprète, le lieu et le but de la parole.</text>
</svg>
