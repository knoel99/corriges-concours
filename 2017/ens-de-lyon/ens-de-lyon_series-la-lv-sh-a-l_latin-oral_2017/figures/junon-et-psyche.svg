<svg xmlns="http://www.w3.org/2000/svg" width="860" height="294" viewBox="0 0 860 294" role="img">
<title>Une même suppliante devant Junon</title>
<rect x="1" y="1" width="858" height="292" rx="14" fill="#fbfaf5" stroke="#c4c4bc"/>
<text x="24" y="35" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#162e36" font-weight="700">Une même suppliante devant Junon</text>
<rect x="24" y="54" width="5" height="62" rx="2" fill="#17605d"/>
<text x="43" y="69" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17605d" font-weight="700">Dans la prière de Psyché</text>
<text x="43" y="91" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#192a31" font-weight="400">Les noms Zygia et Lucina rappellent le mariage et la naissance.</text>
<text x="43" y="111" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#344650" font-weight="400">Enceinte et en danger, Psyché se place sous la protection de Junon.</text>
<rect x="24" y="131" width="5" height="62" rx="2" fill="#8e482f"/>
<text x="43" y="146" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#8e482f" font-weight="700">Dans la réponse de Junon</text>
<text x="43" y="168" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#192a31" font-weight="400">Vénus est sa bru. Junon invoque ensuite le droit des propriétaires.</text>
<text x="43" y="188" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#344650" font-weight="400">Psyché se voit assimilée à une esclave fugitive.</text>
<rect x="24" y="208" width="5" height="62" rx="2" fill="#384966"/>
<text x="43" y="223" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#384966" font-weight="700">À l’oral</text>
<text x="43" y="245" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#192a31" font-weight="400">Comparer les mots praegnatibus et perfugas avant de conclure.</text>
<text x="43" y="265" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#344650" font-weight="400">Le changement de catégorie explique pourquoi la prière échoue.</text>
</svg>
