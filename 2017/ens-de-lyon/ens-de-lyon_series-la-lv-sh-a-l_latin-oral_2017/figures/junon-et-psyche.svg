<svg xmlns="http://www.w3.org/2000/svg" width="860" height="292" viewBox="0 0 860 292" role="img"><title>Une même suppliante devant Junon</title>
<defs>
<marker id="a-sea" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#145f59"/></marker>
<marker id="a-clay" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8b432e"/></marker>
<marker id="a-navy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334a65"/></marker>
</defs>
<rect x="1" y="1" width="858" height="290" rx="13" fill="#fbf9f2" stroke="#ccd6d0"/>
<text x="25" y="38" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="24" font-style="normal" font-weight="700" fill="#1b3641">Une même suppliante devant Junon</text>
<rect x="31" y="112" width="154" height="38" rx="8" fill="#d8e8e2" stroke="none"/>
<text x="108.0" y="137" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="700" fill="#145f59">Psyché</text>
<path d="M190 130 H255 Q271 130 280 101 L291 82 H319" fill="none" stroke="#145f59" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sea)"/>
<path d="M190 130 H255 Q271 130 280 157 L291 177 H319" fill="none" stroke="#8b432e" stroke-width="3" stroke-linecap="round" marker-end="url(#a-clay)"/>
<rect x="324" y="54" width="497" height="61" rx="8" fill="#d8e8e2" stroke="none"/>
<text x="342" y="78" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-style="normal" font-weight="700" fill="#145f59">Dans sa prière · praegnatibus</text>
<text x="342" y="102" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="400" fill="#1b3641">Une femme enceinte réclame la protection de Junon.</text>
<rect x="324" y="145" width="497" height="61" rx="8" fill="#f4e2d7" stroke="none"/>
<text x="342" y="169" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-style="normal" font-weight="700" fill="#8b432e">Dans la réponse · servos alienos perfugas</text>
<text x="342" y="193" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="400" fill="#1b3641">La déesse invoque la loi sur les esclaves fugitifs.</text>
<path d="M25 220 L833 220" fill="none" stroke="#ccd6d0" stroke-width="1" stroke-linecap="round"/>
<text x="27" y="245" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-style="normal" font-weight="700" fill="#1b3641">Deux qualifications, deux obligations différentes</text>
<text x="27" y="270" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="400" fill="#1b3641">L’hospitalité attendue au nom de la maternité cède devant les intérêts d’une famille divine.</text>
</svg>
