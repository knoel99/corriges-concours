<svg xmlns="http://www.w3.org/2000/svg" width="860" height="294" viewBox="0 0 860 294" role="img">
<title>La fable de Ménénius</title>
<rect x="1" y="1" width="858" height="292" rx="14" fill="#fbfaf5" stroke="#c4c4bc"/>
<text x="24" y="35" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#162e36" font-weight="700">La fable de Ménénius</text>
<rect x="24" y="54" width="5" height="62" rx="2" fill="#17605d"/>
<text x="43" y="69" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17605d" font-weight="700">Les membres se plaignent</text>
<text x="43" y="91" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#192a31" font-weight="400">Les mains, la bouche, les dents se disent au service du seul ventre.</text>
<text x="43" y="111" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#344650" font-weight="400">Suum consilium donne à chaque partie une voix propre.</text>
<rect x="24" y="131" width="5" height="62" rx="2" fill="#8e482f"/>
<text x="43" y="146" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#8e482f" font-weight="700">Le refus a un effet commun</text>
<text x="43" y="168" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#192a31" font-weight="400">En cessant de nourrir le ventre, les membres dépérissent à leur tour.</text>
<text x="43" y="188" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#344650" font-weight="400">Le corps fournit lui-même l’objection à la plainte.</text>
<rect x="24" y="208" width="5" height="62" rx="2" fill="#384966"/>
<text x="43" y="223" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#384966" font-weight="700">Ménénius tire parti du récit</text>
<text x="43" y="245" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#192a31" font-weight="400">La fable rapproche la discordia civile de la révolte des membres.</text>
<text x="43" y="265" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#344650" font-weight="400">Fertur maintient une distance entre l’historien et le discours.</text>
</svg>
