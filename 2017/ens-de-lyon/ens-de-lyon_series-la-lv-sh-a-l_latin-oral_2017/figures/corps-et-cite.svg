<svg xmlns="http://www.w3.org/2000/svg" width="860" height="292" viewBox="0 0 860 292" role="img"><title>La fable de Ménénius</title>
<defs>
<marker id="a-sea" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#145f59"/></marker>
<marker id="a-clay" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8b432e"/></marker>
<marker id="a-navy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334a65"/></marker>
</defs>
<rect x="1" y="1" width="858" height="290" rx="13" fill="#fbf9f2" stroke="#ccd6d0"/>
<text x="25" y="38" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="24" font-style="normal" font-weight="700" fill="#1b3641">La fable de Ménénius</text>
<rect x="45" y="110" width="210" height="38" rx="8" fill="#d8e8e2" stroke="none"/>
<text x="150.0" y="135" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="700" fill="#145f59">Mains, bouche, dents</text>
<rect x="602" y="110" width="180" height="38" rx="8" fill="#d8e8e2" stroke="none"/>
<text x="692.0" y="135" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="700" fill="#145f59">Ventre</text>
<path d="M255 119 Q426 26 599 119" fill="none" stroke="#145f59" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sea)"/>
<text x="427" y="64" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="700" fill="#145f59">Nourrir</text>
<path d="M602 142 Q427 237 258 142" fill="none" stroke="#8b432e" stroke-width="3" stroke-linecap="round" marker-end="url(#a-clay)"/>
<text x="427" y="176" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="700" fill="#8b432e">Nourrir en retour</text>
<text x="427" y="208" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="400" fill="#8b432e">le corps entier</text>
<path d="M25 220 L833 220" fill="none" stroke="#ccd6d0" stroke-width="1" stroke-linecap="round"/>
<text x="27" y="245" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-style="normal" font-weight="700" fill="#1b3641">Pourquoi les membres s’affaiblissent-ils en cessant leur travail ?</text>
<text x="27" y="270" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="400" fill="#1b3641">La seconde flèche représente l’activité du ventre que les membres ignoraient.</text>
</svg>
