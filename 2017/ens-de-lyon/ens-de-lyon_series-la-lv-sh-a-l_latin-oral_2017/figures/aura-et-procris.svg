<svg xmlns="http://www.w3.org/2000/svg" width="860" height="292" viewBox="0 0 860 292" role="img"><title>Le malentendu de Procris</title>
<defs>
<marker id="a-sea" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#145f59"/></marker>
<marker id="a-clay" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8b432e"/></marker>
<marker id="a-navy" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334a65"/></marker>
</defs>
<rect x="1" y="1" width="858" height="290" rx="13" fill="#fbf9f2" stroke="#ccd6d0"/>
<text x="25" y="38" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="24" font-style="normal" font-weight="700" fill="#1b3641">Le malentendu de Procris</text>
<rect x="29" y="100" width="174" height="38" rx="8" fill="#d8e8e2" stroke="none"/>
<text x="116.0" y="125" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="700" fill="#145f59">Céphale</text>
<rect x="345" y="100" width="170" height="38" rx="8" fill="#f4e2d7" stroke="none"/>
<text x="430.0" y="125" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="700" fill="#8b432e">Le témoin</text>
<rect x="658" y="100" width="171" height="38" rx="8" fill="#d8e8e2" stroke="none"/>
<text x="743.5" y="125" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="700" fill="#145f59">Procris</text>
<path d="M207 119 L339 119" fill="none" stroke="#145f59" stroke-width="3" stroke-linecap="round" marker-end="url(#a-sea)"/>
<path d="M520 119 L651 119" fill="none" stroke="#8b432e" stroke-width="3" stroke-linecap="round" marker-end="url(#a-clay)"/>
<text x="274" y="96" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-style="italic" font-weight="400" fill="#145f59">dit aura</text>
<text x="585" y="96" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-style="italic" font-weight="400" fill="#8b432e">répète aura</text>
<text x="115" y="167" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-style="normal" font-weight="700" fill="#145f59">« la brise »</text>
<text x="430" y="167" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-style="normal" font-weight="400" fill="#8b432e">mêmes sons</text>
<text x="743" y="167" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-style="normal" font-weight="700" fill="#145f59">« Aura »</text>
<text x="115" y="193" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-style="normal" font-weight="400" fill="#1b3641">un souffle dans le bois</text>
<text x="743" y="193" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-style="normal" font-weight="400" fill="#1b3641">une rivale supposée</text>
<path d="M25 220 L833 220" fill="none" stroke="#ccd6d0" stroke-width="1" stroke-linecap="round"/>
<text x="27" y="245" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-style="normal" font-weight="700" fill="#1b3641">À quel moment l’information change-t-elle ?</text>
<text x="27" y="270" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-style="normal" font-weight="400" fill="#1b3641">Le témoin retient les paroles. Procris leur attribue un nouveau référent.</text>
</svg>
