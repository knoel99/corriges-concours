<svg xmlns="http://www.w3.org/2000/svg" width="860" height="294" viewBox="0 0 860 294" role="img">
<title>Le malentendu de Procris</title>
<rect x="1" y="1" width="858" height="292" rx="14" fill="#fbfaf5" stroke="#c4c4bc"/>
<text x="24" y="35" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#162e36" font-weight="700">Le malentendu de Procris</text>
<rect x="24" y="54" width="5" height="62" rx="2" fill="#17605d"/>
<text x="43" y="69" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17605d" font-weight="700">Céphale parle à la brise</text>
<text x="43" y="91" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#192a31" font-weight="400">Dans le bois de l’Hymette, aura nomme le souffle qui le rafraîchit.</text>
<text x="43" y="111" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#344650" font-weight="400">Le lecteur a déjà vu frémir le feuillage.</text>
<rect x="24" y="131" width="5" height="62" rx="2" fill="#8e482f"/>
<text x="43" y="146" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#8e482f" font-weight="700">Un tiers répète le son</text>
<text x="43" y="168" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#192a31" font-weight="400">Le messager transmet des paroles retenues dans sa mémoire.</text>
<text x="43" y="188" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#344650" font-weight="400">Il sépare le mot du lieu où Céphale le prononçait.</text>
<rect x="24" y="208" width="5" height="62" rx="2" fill="#384966"/>
<text x="43" y="223" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#384966" font-weight="700">Procris croit entendre un nom</text>
<text x="43" y="245" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#192a31" font-weight="400">Aura devient pour elle le nom que porterait une rivale.</text>
<text x="43" y="265" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#344650" font-weight="400">Quasi marque la distance entre le narrateur et cette hypothèse.</text>
</svg>
