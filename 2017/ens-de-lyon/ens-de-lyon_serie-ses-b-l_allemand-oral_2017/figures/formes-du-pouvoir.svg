<svg xmlns="http://www.w3.org/2000/svg" width="870" height="321" viewBox="0 0 870 321" role="img"><title>Drei Formen öffentlicher Verantwortung</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Drei Formen öffentlicher Verantwortung</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Akteur</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Befugnis</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Frage des Beitrags</text><rect x="12" y="84" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Bund und Länder</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Gesetz und Vollzug</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Warum können ähnliche Fälle</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">unterschiedlich ausgehen?</text><rect x="12" y="151" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Karlsruhe</text><text x="225" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Parteiverbot prüfen</text><text x="505" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Welche Schwelle setzt das</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Grundgesetz?</text><rect x="12" y="218" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Bundespräsident</text><text x="225" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">öffentlich sprechen</text><text x="505" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Wie wirkt das Wort eines</text><text x="505" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Amtsträgers ohne</text><text x="505" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Richtlinienkompetenz?</text></svg>
