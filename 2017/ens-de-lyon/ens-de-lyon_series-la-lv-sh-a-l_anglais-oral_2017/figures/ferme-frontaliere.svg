<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 331" width="960" height="331"><title>One farm across two jurisdictions</title><rect x="1" y="1" width="958" height="329" rx="12" fill="#FCFAF5" stroke="#CCD3CD" stroke-width="2"/><text x="32" y="48" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="650" text-anchor="start">One farm across two jurisdictions</text><text x="32" y="82" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">David Crockett’s account in March 2017. Areas shown in proportion.</text><rect x="32" y="109" width="306" height="120" rx="12" fill="#DFECE4" stroke="none" stroke-width="2"/><rect x="338" y="109" width="590" height="120" rx="12" fill="#E8E1CD" stroke="none" stroke-width="2"/><text x="53" y="145" fill="#165E60" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="650" text-anchor="start">Northern Ireland</text><text x="53" y="183" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">100 acres and the house</text><text x="378" y="145" fill="#87472D" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="650" text-anchor="start">Republic of Ireland</text><text x="378" y="183" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start">200 acres</text><path d="M 333 111 L 333 155 M 333 193 L 333 226" fill="none" stroke="#87472D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 264 175 L 363 175 M 350 163 L 364 175 L 350 187" fill="none" stroke="#165E60" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="33" y="269" fill="#165E60" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650" text-anchor="start">Working unit</text><text x="195" y="269" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">One farmer can pass through a gate in the course of a day.</text><text x="33" y="304" fill="#87472D" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650" text-anchor="start">Legal boundary</text><text x="195" y="304" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">A customs rule could turn routine movement into a transaction.</text></svg>
