<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 294" width="960" height="294"><title>Who sees what in The Winter’s Tale?</title><rect x="1" y="1" width="958" height="292" rx="12" fill="#FCFAF5" stroke="#CCD3CD" stroke-width="2"/><text x="32" y="48" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="650" text-anchor="start">Who sees what in The Winter’s Tale?</text><text x="32" y="82" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start">The accusation and the public hearing make different demands on an audience.</text><rect x="32" y="113" width="290" height="152" rx="12" fill="#E0EDE7" stroke="none" stroke-width="2"/><text x="46" y="144" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start">Private suspicion</text><text x="46" y="182" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" text-anchor="start">Leontes</text><text x="46" y="218" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Sees conversation and gestures.</text><text x="46" y="244" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Treats his reading as proof.</text><rect x="333" y="113" width="290" height="152" rx="12" fill="#F1E5D7" stroke="none" stroke-width="2"/><text x="347" y="144" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start">Public hearing</text><text x="347" y="182" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" text-anchor="start">Hermione</text><text x="347" y="218" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Asks by what evidence</text><text x="347" y="244" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">a charge can be sustained.</text><rect x="634" y="113" width="290" height="152" rx="12" fill="#E4EAF1" stroke="none" stroke-width="2"/><text x="648" y="144" fill="#52616A" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="start">Test on stage</text><text x="648" y="182" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" text-anchor="start">Spectators</text><text x="648" y="218" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Hear both accounts.</text><text x="648" y="244" fill="#20313D" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start">Observe what each omits.</text></svg>
