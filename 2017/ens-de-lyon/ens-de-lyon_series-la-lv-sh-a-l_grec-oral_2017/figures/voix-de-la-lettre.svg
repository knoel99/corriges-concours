<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 247" role="img" aria-label="Trois voix font entendre la lettre de Clinias dans le dialogue X de Lucien.">
<rect width="100%" height="100%" fill="#faf9f6"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="15" y="20" width="10" height="54" fill="#265367"/>
<text x="41" y="41" font-size="18" font-weight="bold" fill="#265367">Clinias, absent</text>
<text x="41" y="65" font-size="16" fill="#222">Il écrit à Drosis et rapporte le discours du maître.</text>
<rect x="15" y="90" width="10" height="54" fill="#744d36"/>
<text x="41" y="111" font-size="18" font-weight="bold" fill="#744d36">Chélidonion, présente</text>
<text x="41" y="135" font-size="16" fill="#222">Elle prête sa voix au billet et observe l’écriture.</text>
<rect x="15" y="160" width="10" height="54" fill="#38654d"/>
<text x="41" y="181" font-size="18" font-weight="bold" fill="#38654d">Drosis, destinataire</text>
<text x="41" y="205" font-size="16" fill="#222">Elle interrompt la lecture et commente les formules du jeune homme.</text>
</g>
</svg>
