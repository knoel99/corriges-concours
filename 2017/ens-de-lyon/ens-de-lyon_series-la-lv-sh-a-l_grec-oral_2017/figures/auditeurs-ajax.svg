<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 247" role="img" aria-label="Le discours d’Ajax à Eurysakès possède plusieurs destinataires.">
<rect width="100%" height="100%" fill="#faf9f6"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="15" y="20" width="10" height="54" fill="#265367"/>
<text x="41" y="41" font-size="18" font-weight="bold" fill="#265367">Eurysakès</text>
<text x="41" y="65" font-size="16" fill="#222">Le père parle au jeune enfant au vocatif.</text>
<rect x="15" y="90" width="10" height="54" fill="#744d36"/>
<text x="41" y="111" font-size="18" font-weight="bold" fill="#744d36">Les proches présents</text>
<text x="41" y="135" font-size="16" fill="#222">Ils entendent les dispositions prises pour l’avenir de l’enfant.</text>
<rect x="15" y="160" width="10" height="54" fill="#38654d"/>
<text x="41" y="181" font-size="18" font-weight="bold" fill="#38654d">Ajax lui-même</text>
<text x="41" y="205" font-size="16" fill="#222">En imaginant un héritier, le héros formule sa propre conception de l’honneur.</text>
</g>
</svg>
