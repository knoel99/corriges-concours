<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 317" role="img" aria-label="Longus déplace le récit du visible à la conscience de Chloé.">
<rect width="100%" height="100%" fill="#faf9f6"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="15" y="20" width="10" height="54" fill="#265367"/>
<text x="41" y="41" font-size="18" font-weight="bold" fill="#265367">Le narrateur</text>
<text x="41" y="65" font-size="16" fill="#222">Il décrit la source, la chevelure et l’effet du soleil.</text>
<rect x="15" y="90" width="10" height="54" fill="#744d36"/>
<text x="41" y="111" font-size="18" font-weight="bold" fill="#744d36">Chloé observe</text>
<text x="41" y="135" font-size="16" fill="#222">Elle constate que Daphnis lui semble beau aujourd’hui.</text>
<rect x="15" y="160" width="10" height="54" fill="#38654d"/>
<text x="41" y="181" font-size="18" font-weight="bold" fill="#38654d">Chloé interprète</text>
<text x="41" y="205" font-size="16" fill="#222">Elle attribue au bain un changement qui touche son propre regard.</text>
<rect x="15" y="230" width="10" height="54" fill="#564970"/>
<text x="41" y="251" font-size="18" font-weight="bold" fill="#564970">Le narrateur conclut</text>
<text x="41" y="275" font-size="16" fill="#222">Un souhait de revoir Daphnis infléchit le retour des troupeaux.</text>
</g>
</svg>
