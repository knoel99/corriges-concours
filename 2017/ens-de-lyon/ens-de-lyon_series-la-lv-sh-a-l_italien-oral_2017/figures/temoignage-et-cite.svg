<svg xmlns="http://www.w3.org/2000/svg" width="870" height="297" viewBox="0 0 870 297" role="img"><title>Una persona, tre generi di scrittura</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Una persona, tre generi di scrittura</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Caso</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Genere e distanza</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Domanda da portare all’orale</text><rect x="12" y="84" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Casalegno</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Il figlio torna sulla</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">posizione del padre</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Fermezza significa chiedere leggi</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">eccezionali?</text><rect x="12" y="151" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">De Mauro</text><text x="225" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Un necrologio</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">ricostruisce un metodo</text><text x="505" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Che cosa distingue una storia dei</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">parlanti da una storia di testi?</text><rect x="12" y="218" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Falcone</text><text x="225" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">La commemorazione</text><text x="225" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">recupera l’isolamento</text><text x="505" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Chi si assume la responsabilità</text><text x="505" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">della memoria?</text></svg>
