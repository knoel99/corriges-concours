<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Une prétention à l’épreuve d’une analogie</title>
<desc id="description">Affaires publiques Euthydème se vanterait de ne rien avoir appris. Il se croit prêt à conseiller la cité. Médecine Le candidat médecin revendique la même ignorance. Il demande à apprendre aux risques de ses patients. Auditoire Les assistants éclatent de rire. La seconde candidature éclaire la première.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Une prétention à l’épreuve d’une analogie</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Discours fictif</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Affaires publiques</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Euthydème se vanterait de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">ne rien avoir appris.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Il se croit prêt à</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">conseiller la cité.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Médecine</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le candidat médecin</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">revendique la même</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">ignorance.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Il demande à apprendre aux</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">risques de ses patients.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Auditoire</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Les assistants éclatent de</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">rire.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La seconde candidature</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">éclaire la première.</text>
</g>
</svg>
