<svg xmlns="http://www.w3.org/2000/svg" width="810" height="282" viewBox="0 0 810 282" role="img" aria-labelledby="titre description">
<title id="titre">Du journal personnel au jugement collectif</title>
<desc id="description">Inventaire du je — Le corps, la voix et la part d’héritage.. Vie au conditionnel — Une autre naissance et une solitude choisie.. Fiction du on — Une violence visible que chacun tait..</desc>
<rect width="810" height="282" fill="#ffffff" rx="6"/>
<rect x="1" y="1" width="808" height="51" fill="#234555" rx="5"/>
<text x="17" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Forme de parole</text>
<text x="311" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Ce que l’écriture met en jeu</text>
<rect x="1" y="56" width="808" height="70" rx="3" fill="#edf4f3"/>
<text x="17" y="99" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Inventaire du je</text>
<text x="311" y="99" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Le corps, la voix et la part d’héritage.</text>
<rect x="1" y="130" width="808" height="70" rx="3" fill="#f4f2ed"/>
<text x="17" y="173" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Vie au conditionnel</text>
<text x="311" y="159" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Une autre naissance et une solitude</text>
<text x="311" y="184" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">choisie.</text>
<rect x="1" y="204" width="808" height="70" rx="3" fill="#edf1f8"/>
<text x="17" y="247" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Fiction du on</text>
<text x="311" y="247" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Une violence visible que chacun tait.</text>
<path d="M292 55 V274" stroke="#acb9bc" stroke-width="1"/>
