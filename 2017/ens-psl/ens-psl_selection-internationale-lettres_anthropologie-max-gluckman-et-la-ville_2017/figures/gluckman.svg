<svg xmlns="http://www.w3.org/2000/svg" width="948" height="420" viewBox="0 0 948 420" role="img">
<title>Quelles relations deviennent décisives d’une situation à l’autre ?</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Situation à documenter</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Relations à éprouver</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Contre-épreuve</text>
<rect x="13" y="62" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Dans une équipe de travail</text>
<rect x="323" y="62" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Hiérarchie du poste,</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">qualification, entraide entre</text>
<text x="334" y="135" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">collègues</text>
<rect x="633" y="62" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Un recrutement ou une aide</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">matérielle mobilise-t-il</text>
<text x="644" y="135" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">aussi de la parenté ?</text>
<rect x="13" y="163" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Dans une association urbaine</text>
<rect x="323" y="163" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Origine régionale</text>
<text x="334" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">revendiquée, voisinage,</text>
<text x="334" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">sociabilité citadine</text>
<rect x="633" y="163" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Les membres venus d’un même</text>
<text x="644" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">lieu agissent-ils toujours</text>
<text x="644" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">ensemble ?</text>
<rect x="13" y="264" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Lors du retour au village</text>
<rect x="323" y="264" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Droits familiaux, autorités</text>
<text x="334" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">locales, obligations</text>
<text x="334" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">rituelles</text>
<rect x="633" y="264" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Un salaire urbain ou un</text>
<text x="644" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">contact syndical modifie-t-il</text>
<text x="644" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">les rapports locaux ?</text>
<text x="19" y="382" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">Ces situations sont des pistes d’observation. La preuve requiert des scènes datées et des</text>
<text x="19" y="406" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">relations effectivement établies.</text>
</svg>
