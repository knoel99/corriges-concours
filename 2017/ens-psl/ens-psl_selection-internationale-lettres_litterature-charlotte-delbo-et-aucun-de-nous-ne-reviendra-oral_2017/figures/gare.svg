<svg xmlns="http://www.w3.org/2000/svg" width="810" height="282" viewBox="0 0 810 282" role="img" aria-labelledby="titre description">
<title id="titre">Comment change le sens des mots du voyage ?</title>
<desc id="description">Arriver — La fin du trajet ne garantit aucune arrivée.. Attendre — Prévoir le pire laisse l’inconcevable entier.. Nommer — Les pays ont des noms, la gare leur échappe..</desc>
<rect width="810" height="282" fill="#ffffff" rx="6"/>
<rect x="1" y="1" width="808" height="51" fill="#234555" rx="5"/>
<text x="17" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Le mot familier</text>
<text x="311" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Ce qui lui arrive dans l’incipit</text>
<rect x="1" y="56" width="808" height="70" rx="3" fill="#edf4f3"/>
<text x="17" y="99" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Arriver</text>
<text x="311" y="85" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">La fin du trajet ne garantit aucune</text>
<text x="311" y="110" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">arrivée.</text>
<rect x="1" y="130" width="808" height="70" rx="3" fill="#f4f2ed"/>
<text x="17" y="173" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Attendre</text>
<text x="311" y="159" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Prévoir le pire laisse l’inconcevable</text>
<text x="311" y="184" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">entier.</text>
<rect x="1" y="204" width="808" height="70" rx="3" fill="#edf1f8"/>
<text x="17" y="247" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Nommer</text>
<text x="311" y="233" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Les pays ont des noms, la gare leur</text>
<text x="311" y="258" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">échappe.</text>
<path d="M292 55 V274" stroke="#acb9bc" stroke-width="1"/>
</svg>
