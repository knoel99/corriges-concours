<svg xmlns="http://www.w3.org/2000/svg" width="810" height="282" viewBox="0 0 810 282" role="img" aria-labelledby="titre description">
<title id="titre">Qui accomplit ou perçoit la résurrection ?</title>
<desc id="description">1 à 10 · Âmes et corps — Chacun retrouve le partenaire qu’il cherchait.. 11 à 24 · Terre et eau — Le monde perçoit les corps en train de naître.. 25 à 34 · Les dispersés — L’intégrité retrouvée devient une joie partagée..</desc>
<rect width="810" height="282" fill="#ffffff" rx="6"/>
<rect x="1" y="1" width="808" height="51" fill="#234555" rx="5"/>
<text x="17" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Vers du feuillet</text>
<text x="311" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Déplacement de la vision</text>
<rect x="1" y="56" width="808" height="70" rx="3" fill="#edf4f3"/>
<text x="17" y="99" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">1 à 10 · Âmes et corps</text>
<text x="311" y="85" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Chacun retrouve le partenaire qu’il</text>
<text x="311" y="110" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">cherchait.</text>
<rect x="1" y="130" width="808" height="70" rx="3" fill="#f4f2ed"/>
<text x="17" y="173" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">11 à 24 · Terre et eau</text>
<text x="311" y="159" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Le monde perçoit les corps en train de</text>
<text x="311" y="184" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">naître.</text>
<rect x="1" y="204" width="808" height="70" rx="3" fill="#edf1f8"/>
<text x="17" y="247" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">25 à 34 · Les dispersés</text>
<text x="311" y="233" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">L’intégrité retrouvée devient une joie</text>
<text x="311" y="258" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">partagée.</text>
<path d="M292 55 V274" stroke="#acb9bc" stroke-width="1"/>
</svg>
