<svg xmlns="http://www.w3.org/2000/svg" width="810" height="282" viewBox="0 0 810 282" role="img" aria-labelledby="titre description">
<title id="titre">Comment Natacha connaît-elle les invités de son père ?</title>
<desc id="description">Un repas, un gant — Elle reconnaît des personnes et garde des lacunes.. Des récits entendus — Elle compose une scène héroïque commune.. Une voix, des noms — Elle aime Ivanov et écoute les rumeurs..</desc>
<rect width="810" height="282" fill="#ffffff" rx="6"/>
<rect x="1" y="1" width="808" height="51" fill="#234555" rx="5"/>
<text x="17" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Ce qui lui parvient</text>
<text x="311" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Ce qu’elle en fait</text>
<rect x="1" y="56" width="808" height="70" rx="3" fill="#edf4f3"/>
<text x="17" y="99" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Un repas, un gant</text>
<text x="311" y="85" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Elle reconnaît des personnes et garde des</text>
<text x="311" y="110" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">lacunes.</text>
<rect x="1" y="130" width="808" height="70" rx="3" fill="#f4f2ed"/>
<text x="17" y="173" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Des récits entendus</text>
<text x="311" y="173" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Elle compose une scène héroïque commune.</text>
<rect x="1" y="204" width="808" height="70" rx="3" fill="#edf1f8"/>
<text x="17" y="247" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Une voix, des noms</text>
<text x="311" y="247" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Elle aime Ivanov et écoute les rumeurs.</text>
<path d="M292 55 V274" stroke="#acb9bc" stroke-width="1"/>
</svg>
