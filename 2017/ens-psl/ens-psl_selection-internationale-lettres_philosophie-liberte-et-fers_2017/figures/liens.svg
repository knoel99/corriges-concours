<svg xmlns="http://www.w3.org/2000/svg" width="880" height="301" viewBox="0 0 880 301" role="img"><title>Qui impose une limite, et à quel titre ?</title><desc>Comparaison de situations. La pluie : Une limite naturelle ; Elle retarde le trajet sans exercer de volonté.. Un maître : Une volonté particulière ; Il exige une permission qui dépend de son bon vouloir.. Une règle commune : Une condition de la liberté civile ; Qui l’a faite, à quelle fin et pour quels destinataires ?</desc><rect width="880" height="301" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="21" y="37" font-size="25" fill="#17394c" font-weight="bold">Qui impose une limite, et à quel titre ?</text><rect x="24" y="61" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="61" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="89" font-size="16" fill="#17394c" font-weight="bold">La pluie</text><text x="231" y="86" font-size="18" fill="#17394c" font-weight="bold">Une limite naturelle</text><text x="231" y="111" font-size="15" fill="#17394c">Elle retarde le trajet sans exercer de volonté.</text><rect x="24" y="136" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="136" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="164" font-size="16" fill="#17394c" font-weight="bold">Un maître</text><text x="231" y="161" font-size="18" fill="#17394c" font-weight="bold">Une volonté particulière</text><text x="231" y="186" font-size="15" fill="#17394c">Il exige une permission qui dépend de son bon vouloir.</text><rect x="24" y="211" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="211" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="239" font-size="16" fill="#17394c" font-weight="bold">Une règle commune</text><text x="231" y="236" font-size="18" fill="#17394c" font-weight="bold">Une condition de la liberté civile</text><text x="231" y="261" font-size="15" fill="#17394c">Qui l’a faite, à quelle fin et pour quels destinataires ?</text></g></svg>
