<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Le raisonnement qui relie une transformation physique à une histoire des sociétés.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="47" font-size="15" fill="white">Trace matérielle</text><text x="237" y="39" font-size="15" fill="#173946">Dater une variation du milieu et son étendue. Quelle</text><text x="237" y="56" font-size="15" fill="#173946">incertitude sur le lieu et la chronologie ?</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="117" font-size="15" fill="white">Médiation</text><text x="237" y="109" font-size="15" fill="#173946">Par quel mécanisme l’accès, les récoltes ou les prix</text><text x="237" y="126" font-size="15" fill="#173946">changent-ils ? Chercher un cas de comparaison.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="187" font-size="15" fill="white">Réponse sociale</text><text x="237" y="179" font-size="15" fill="#173946">Quelles techniques, décisions et ressources amplifient</text><text x="237" y="196" font-size="15" fill="#173946">ou amortissent les effets ?</text></g></svg>
