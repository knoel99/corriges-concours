<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Trois opérations par lesquelles l’enquête de terrain lie établissement des faits et responsabilité.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="47" font-size="15" fill="white">Qualifier</text><text x="237" y="31" font-size="15" fill="#173946">Distinguer fait allégué, mots des acteurs et</text><text x="237" y="48" font-size="15" fill="#173946">appréciation du juste. Qui peut faire entendre sa</text><text x="237" y="65" font-size="15" fill="#173946">qualification ?</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="117" font-size="15" fill="white">Établir</text><text x="237" y="101" font-size="15" fill="#173946">Distinguer observation directe, récit et traces.</text><text x="237" y="118" font-size="15" fill="#173946">Identifier la position depuis laquelle chaque élément</text><text x="237" y="135" font-size="15" fill="#173946">est accessible.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="187" font-size="15" fill="white">Publier</text><text x="237" y="171" font-size="15" fill="#173946">Rendre les responsabilités intelligibles. Choisir les</text><text x="237" y="188" font-size="15" fill="#173946">détails nécessaires à la preuve et examiner leurs</text><text x="237" y="205" font-size="15" fill="#173946">effets.</text></g></svg>
