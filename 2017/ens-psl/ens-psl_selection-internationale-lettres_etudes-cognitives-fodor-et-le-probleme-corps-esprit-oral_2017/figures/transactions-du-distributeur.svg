<svg xmlns="http://www.w3.org/2000/svg" width="710" height="270" viewBox="0 0 710 270" role="img" aria-labelledby="t d"><title id="t">Transactions du distributeur à deux états</title><desc id="d">Crédit nul : cinq cents ne donnent rien et établissent le crédit, dix cents donnent la boisson. Avec un crédit de cinq cents : cinq cents donnent la boisson, dix cents rendent aussi cinq cents. Chaque vente rétablit le crédit nul.</desc><rect width="710" height="270" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#183646" font-size="18"><text x="20" y="31" font-weight="bold">Prix de la boisson : 10 cents</text><rect x="14" y="56" width="682" height="193" fill="#f0f5f5" stroke="#64827d" stroke-width="2"/><path d="M14 100H696M14 174H696M194 56V249M443 56V249" stroke="#64827d" stroke-width="2"/><text x="27" y="85" font-weight="bold">État avant</text><text x="204" y="85" font-weight="bold">Pièce de 5 cents</text><text x="453" y="85" font-weight="bold">Pièce de 10 cents</text><text x="27" y="130">S1</text><text x="27" y="155">Crédit nul</text><text x="204" y="130">Aucune sortie</text><text x="204" y="155">Puis S2</text><text x="453" y="130">Une boisson</text><text x="453" y="155">Reste en S1</text><text x="27" y="204">S2</text><text x="27" y="231">Crédit de 5 cents</text><text x="204" y="204">Une boisson</text><text x="204" y="231">Retour en S1</text><text x="453" y="204">Une boisson et 5 cents</text><text x="453" y="231">Retour en S1</text></g></svg>
