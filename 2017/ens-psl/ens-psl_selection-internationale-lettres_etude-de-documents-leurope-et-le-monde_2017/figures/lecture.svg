<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Trois rapprochements qui rendent compte des huit documents dans une même synthèse.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="47" font-size="15" fill="white">Transmettre</text><text x="237" y="39" font-size="15" fill="#173946">Valéry (2), Husserl (3), Kundera (4) font varier les</text><text x="237" y="56" font-size="15" fill="#173946">critères d’une appartenance au-delà de la carte.</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="109" font-size="15" fill="white">Interroger</text><text x="13" y="126" font-size="15" fill="white">l’universel</text><text x="237" y="109" font-size="15" fill="#173946">Valéry (1), Césaire (5), Said (6) changent le point de</text><text x="237" y="126" font-size="15" fill="#173946">vue depuis lequel l’Europe est jugée.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="179" font-size="15" fill="white">Délimiter en</text><text x="13" y="196" font-size="15" fill="white">pratique</text><text x="237" y="179" font-size="15" fill="#173946">La scène parlementaire (7) et le montage aux frontières</text><text x="237" y="196" font-size="15" fill="#173946">(8) confrontent signes politiques et conditions d’accès.</text></g></svg>
