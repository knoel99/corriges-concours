<svg xmlns="http://www.w3.org/2000/svg" width="650" height="275" viewBox="0 0 650 275" role="img" aria-labelledby="title desc">
<title id="title">Une même cache après rotation du plan</title><desc id="desc">Exemple construit. Le sommet inférieur gauche d’une base horizontale devient le sommet inférieur d’une base verticale après un quart de tour. Les récipients sont identiques. Les pointillés aident à lire leurs positions.</desc>
<rect width="650" height="275" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="28" y="34" fill="#172c37" font-size="21" font-weight="700" text-anchor="start">Carte</text>
<text x="350" y="34" fill="#172c37" font-size="21" font-weight="700" text-anchor="start">Terrain après rotation</text>
<line x1="140" y1="85" x2="65" y2="210" stroke="#4b5e64" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="65" y1="210" x2="215" y2="210" stroke="#4b5e64" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="215" y1="210" x2="140" y2="85" stroke="#4b5e64" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="65" cy="210" r="12" fill="white" stroke="#1c6667" stroke-width="3"/>
<circle cx="65" cy="210" r="6" fill="#90551b"/>
<circle cx="215" cy="210" r="12" fill="white" stroke="#1c6667" stroke-width="3"/>
<circle cx="140" cy="85" r="12" fill="white" stroke="#1c6667" stroke-width="3"/>
<line x1="417" y1="147" x2="542" y2="222" stroke="#4b5e64" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="542" y1="222" x2="542" y2="72" stroke="#4b5e64" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="542" y1="72" x2="417" y2="147" stroke="#4b5e64" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="542" cy="222" r="12" fill="white" stroke="#1c6667" stroke-width="3"/>
<circle cx="542" cy="222" r="6" fill="#90551b"/>
<circle cx="542" cy="72" r="12" fill="white" stroke="#1c6667" stroke-width="3"/>
<circle cx="417" cy="147" r="12" fill="white" stroke="#1c6667" stroke-width="3"/>
<text x="27" y="254" fill="#4b5e64" font-size="17" font-weight="400" text-anchor="start">Le point indique la cache.</text>
<text x="350" y="254" fill="#4b5e64" font-size="17" font-weight="400" text-anchor="start">Le point donne la solution.</text></g>
</svg>
