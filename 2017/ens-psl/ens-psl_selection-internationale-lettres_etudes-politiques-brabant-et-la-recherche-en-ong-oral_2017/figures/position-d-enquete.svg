<svg xmlns="http://www.w3.org/2000/svg" width="830" height="228" viewBox="0 0 830 228" role="img">
<title>La même affiliation change deux conditions de l’enquête</title>
<rect width="830" height="228" rx="14" fill="#f6f8f5"/>
<text x="23" y="35" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="23" fill="#153352">La même affiliation change deux conditions de l’enquête</text>
<rect x="22" y="53" width="386" height="153" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/>
<text x="36" y="82" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="20" fill="#165951">Conditions matérielles</text>
<text x="36" y="113" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Le soutien de l’ONG rend possibles des</text>
<text x="36" y="136" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">séjours hors de Bukavu.</text>
<path d="M36 153h356" stroke="#c6d9d3"/>
<text x="36" y="178" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#284e68">Des groupes variés sont rencontrés.</text>
<rect x="421" y="53" width="386" height="153" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/>
<text x="435" y="82" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="20" fill="#165951">Interprétation locale</text>
<text x="435" y="113" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Le personnel humanitaire est associé à</text>
<text x="435" y="136" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">une aide potentielle.</text>
<path d="M435 153h356" stroke="#c6d9d3"/>
<text x="435" y="178" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#284e68">Le sens de l’entretien se transforme.</text>
</svg>
