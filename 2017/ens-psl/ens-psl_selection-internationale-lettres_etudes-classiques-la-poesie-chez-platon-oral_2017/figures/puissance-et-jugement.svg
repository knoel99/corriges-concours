<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-labelledby="title desc"><title id="title">Puissance d’entraînement et jugement</title><desc id="desc">L’aimant explique la transmission dans l’Ion. Dans la République, l’éducation donne deux issues à cette puissance. Dans le Banquet, une image invite à ouvrir le Silène.</desc><rect width="720" height="250" fill="#fff"/><g font-family="DejaVu Sans, sans-serif" font-size="17" fill="#222f40"><text x="16" y="39" font-weight="bold">Ion</text><text x="16" y="130" font-weight="bold">République</text><text x="16" y="219" font-weight="bold">Banquet</text></g><g fill="none" stroke="#26645c" stroke-width="3"><path d="M199 33H262 M250 27l12 6-12 6 M358 33h46 M392 27l12 6-12 6 M515 33h48 M551 27l12 6-12 6"/><path d="M303 123h34l25-24h20 M337 123l25 25h20"/><path d="M266 215h45 M300 209l12 6-12 6 M420 215h55 M463 209l12 6-12 6"/></g><g font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172f45"><text x="149" y="39">Muse</text><text x="278" y="39">poète</text><text x="414" y="39">rhapsode</text><text x="575" y="39">auditeurs</text><text x="150" y="129">Modèles imités</text><text x="392" y="104">Tous les rôles : renvoi du virtuose</text><text x="392" y="154">Caractère mesuré : accueil du poète</text><text x="150" y="221">Silène fermé</text><text x="327" y="221">ouverture</text><text x="487" y="221">figures divines</text></g><g stroke="#c3cdc9"><path d="M14 68h690 M14 180h690"/></g></svg>
