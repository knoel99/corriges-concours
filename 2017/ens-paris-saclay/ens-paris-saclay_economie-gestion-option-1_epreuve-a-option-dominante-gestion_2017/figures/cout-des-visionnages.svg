<svg xmlns="http://www.w3.org/2000/svg" width="830" height="239" viewBox="0 0 830 239" role="img" aria-labelledby="t d"><title id="t">KRYPTON et WAFER MADRIE : vidéo à la demande, flux financiers et écritures comptables</title><desc id="d">Les deux méthodes répartissent les mêmes 4,77 M€ de charges indirectes sur les mêmes clients. Le coût moyen d’un visionnage varie surtout chez les professionnels, qui consomment davantage d’activités spécifiques.</desc><rect width="830" height="239" fill="white"/><g fill="#234451" font-family="sans-serif"><rect x="10" y="11" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="47" font-weight="bold" font-size="18">Particuliers</text><text x="196" y="35" font-size="18" font-weight="bold">Centres : 1,1032 € par visionnage</text><text x="196" y="59" font-size="16">ABC : 1,0559 € par visionnage.</text><rect x="10" y="86" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="122" font-weight="bold" font-size="18">Professionnels</text><text x="196" y="110" font-size="18" font-weight="bold">Centres : environ 1,0528 €</text><text x="196" y="134" font-size="16">ABC : 2,2289 € par visionnage.</text><rect x="10" y="161" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="197" font-weight="bold" font-size="18">Occasionnels</text><text x="196" y="185" font-size="18" font-weight="bold">Centres : environ 0,9817 €</text><text x="196" y="209" font-size="16">ABC : 1,7536 € par visionnage.</text></g></svg>
