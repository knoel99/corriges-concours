<svg xmlns="http://www.w3.org/2000/svg" width="840" height="242" viewBox="0 0 840 242" role="img" aria-labelledby="titre description"><title id="titre">Paris 1925, deux adresses au visiteur</title><desc id="description">Schémas de principe sans échelle. À gauche le visiteur fait l’expérience d’un ensemble décoratif coordonné. À droite la cellule et sa terrasse invitent à imaginer la répétition du logement.</desc><defs><marker id="a" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65639"/></marker></defs><g font-family="DejaVu Sans, sans-serif">
<text x="209" y="22" text-anchor="middle" fill="#233f43" font-size="23" font-weight="700">Hôtel du Collectionneur</text>
<text x="632" y="22" text-anchor="middle" fill="#233f43" font-size="23" font-weight="700">Pavillon de l’Esprit nouveau</text>
<rect x="18" y="39" width="382" height="117" rx="3" fill="#f3e8d3" stroke="#233f43" stroke-width="1.7"/>
<rect x="441" y="39" width="382" height="117" rx="3" fill="#fbfaf6" stroke="#233f43" stroke-width="1.7"/>
<ellipse cx="209" cy="97" rx="99" ry="46" fill="#fdfaf1" stroke="#455957" stroke-width="2"/>
<ellipse cx="209" cy="97" rx="43" ry="20" fill="#d6b66b" stroke="#455957" stroke-width="2"/>
<path d="M457 51 H582 V104 H750 V143 H457 Z" fill="#dcece7" stroke="#233f43" stroke-width="2"/>
<path d="M585 51 H750 V103" fill="none" stroke="#879d90" stroke-width="2"/>
<circle cx="665" cy="77" r="19" fill="#b2cbb7"/>
<text x="209" y="184" text-anchor="middle" fill="#233f43" font-size="21" font-weight="400">Habiter un ensemble singulier.</text>
<text x="632" y="184" text-anchor="middle" fill="#233f43" font-size="21" font-weight="400">Imaginer une cellule répétable.</text>
<text x="420" y="226" text-anchor="middle" fill="#233f43" font-size="20" font-weight="400">Schémas de principe des modes d’habiter présentés en 1925.</text></g></svg>
