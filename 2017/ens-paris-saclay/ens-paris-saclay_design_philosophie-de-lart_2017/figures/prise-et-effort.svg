<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="DejaVu Sans, sans-serif"><title>Une variation de diamètre redistribue l’effort de préhension pour certains usagers.</title><rect width="900" height="250" fill="#faf9f4"/><text x="450" y="35" text-anchor="middle" font-size="25" fill="#163945">Un éplucheur, deux distributions de l’effort</text><text x="222" y="74" text-anchor="middle" font-size="20" fill="#163945">Manche étroit</text><text x="677" y="74" text-anchor="middle" font-size="20" fill="#163945">Manche épais</text><rect x="98" y="142" width="160" height="14" fill="#bcd9d0" stroke="#335563" stroke-width="2"/><path d="M 258 149 l 45 -32 l 60 0 l 0 27 l -60 0 Z" fill="none" stroke="#455966" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="300" y1="131" x2="347" y2="131" stroke="#294c58" stroke-width="3"/><path d="M 173 99 l 0 18 m -5 -6 l 5 6 l 5 -6" fill="none" stroke="#a34a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="551" y="125" width="160" height="49" fill="#bcd9d0" stroke="#335563" stroke-width="2"/><path d="M 711 149 l 45 -32 l 60 0 l 0 27 l -60 0 Z" fill="none" stroke="#455966" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="753" y1="131" x2="800" y2="131" stroke="#294c58" stroke-width="3"/><path d="M 626 99 l 0 18 m -5 -6 l 5 6 l 5 -6" fill="none" stroke="#a34a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="217" text-anchor="middle" font-size="17" fill="#163945">La prise peut exiger une pince serrée.</text><text x="679" y="217" text-anchor="middle" font-size="17" fill="#163945">La paume peut participer à la prise.</text></svg>
