<text x="14" y="41" font-family="DejaVu Sans, sans-serif" font-size="6.35" font-weight="700" fill="#3b665b" text-anchor="start">Un seuil en trois temps</text>
<text x="14" y="65" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#3b665b" text-anchor="start">8 h · déposer</text>
<text x="14" y="75.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">La livraison reste au bord de rue. Le banc orienté vers le</text>
<text x="14" y="80.1" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">square garde le passage libre.</text>
<path d="M14 110 L187 110" stroke="#a6ad77" stroke-width="0.65" fill="none"/>
<text x="14" y="128" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#3b665b" text-anchor="start">14 h · apprendre</text>
<text x="14" y="138.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">L’agent de jardinage montre l’arrivée de pluie dans la noue. Un</text>
<text x="14" y="143.1" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">groupe reste côté public.</text>
<path d="M14 173 L187 173" stroke="#a6ad77" stroke-width="0.65" fill="none"/>
<text x="14" y="191" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#3b665b" text-anchor="start">19 h · rentrer</text>
<text x="14" y="201.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Le seuil partagé ferme à l’heure convenue. Le trottoir et le</text>
<text x="14" y="206.1" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">banc restent accessibles.</text>
