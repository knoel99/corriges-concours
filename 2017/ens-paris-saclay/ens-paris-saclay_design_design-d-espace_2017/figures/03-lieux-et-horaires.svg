<text x="225" y="194" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#3b665b" text-anchor="start">Relevé morphologique d’après la vue du territoire 1.</text>
<text x="224" y="208.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Le square arboré se trouve près d’un volume à longs pans. Les îlots</text>
<text x="224" y="213.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">voisins présentent des vides intérieurs ponctuels. Les rues forment</text>
<text x="224" y="219.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">des liaisons continues. Le dessin schématise les voisins visibles et</text>
<text x="224" y="224.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">garde les limites de propriété à vérifier.</text>
