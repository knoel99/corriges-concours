<text x="223" y="285" font-family="DejaVu Sans, sans-serif" font-size="2.8" font-weight="400" fill="#3b665b" text-anchor="start">ENS PARIS-SACLAY · DESIGN D’ESPACE 2017</text>
<text x="407" y="291" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#3b665b" text-anchor="end">GPT-6.2 Astra Ultra · vitesse non renseignée</text>
<text x="14" y="42" font-family="DejaVu Sans, sans-serif" font-size="6.35" font-weight="700" fill="#3b665b" text-anchor="start">Texte fondateur</text>
<text x="14" y="63.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Une ville dense possède des pièces sans plafond. Une rue porte le</text>
<text x="14" y="68.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">marché du matin puis les conversations du soir. Une cour éclaire les</text>
<text x="14" y="74.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">chambres avant de devenir, si ses habitants le souhaitent, un seuil</text>
<text x="14" y="79.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">partagé. Ces transformations commencent par un accord sur les heures,</text>
<text x="14" y="85.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">l’entretien et les limites.</text>
<text x="14" y="129.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Nous proposons de relier un square, un trottoir et quelques seuils</text>
<text x="14" y="134.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">existants. Une table, un banc et un sol qui reçoit la pluie marquent</text>
<text x="14" y="140.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">le passage. Chaque ouverture se décide avec les occupants, se mesure</text>
<text x="14" y="145.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">et peut être suspendue. Pendant vingt ans, on vérifie qui passe, qui</text>
<text x="14" y="151.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">reste et qui peut encore rentrer chez soi au calme.</text>
<text x="14" y="211.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">La continuité publique repose d’abord sur les rues. Les cours offrent</text>
<text x="14" y="216.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">des prolongements négociés. Le projet donne au vide un usage, une</text>
<text x="14" y="222.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">adresse et un responsable.</text>
<text x="224" y="50" font-family="DejaVu Sans, sans-serif" font-size="6.35" font-weight="700" fill="#3b665b" text-anchor="start">Les pièces ouvertes</text>
<text x="225" y="69" font-family="DejaVu Sans, sans-serif" font-size="4.2" font-weight="400" fill="#3b665b" text-anchor="start">Construire le vide · Paris, territoire 1</text>
