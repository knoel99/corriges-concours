<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Du type haussmannien à la décision collective</title><desc>Livret A3 plié en deux · pages 2 et 7</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<path d="M210 3 L210 10" stroke="#3b665b" stroke-width="0.3" fill="none"/>
<path d="M210 287 L210 294" stroke="#3b665b" stroke-width="0.3" fill="none"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#3b665b" text-anchor="start">LES PIÈCES OUVERTES</text>
<text x="197" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="400" fill="#3b665b" text-anchor="end">2/8</text>
<path d="M13 20 L197 20" stroke="#3b665b" stroke-width="0.45" fill="none"/>
<path d="M13 277 L197 277" stroke="#3b665b" stroke-width="0.35" fill="none"/>
<text x="13" y="285" font-family="DejaVu Sans, sans-serif" font-size="2.8" font-weight="400" fill="#3b665b" text-anchor="start">ENS PARIS-SACLAY · DESIGN D’ESPACE 2017</text>
<text x="197" y="291" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#3b665b" text-anchor="end">GPT-6.2 Astra Ultra · vitesse non renseignée</text>
<text x="223" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#3b665b" text-anchor="start">LES PIÈCES OUVERTES</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="400" fill="#3b665b" text-anchor="end">7/8</text>
<path d="M223 20 L407 20" stroke="#3b665b" stroke-width="0.45" fill="none"/>
<path d="M223 277 L407 277" stroke="#3b665b" stroke-width="0.35" fill="none"/>
<text x="223" y="285" font-family="DejaVu Sans, sans-serif" font-size="2.8" font-weight="400" fill="#3b665b" text-anchor="start">ENS PARIS-SACLAY · DESIGN D’ESPACE 2017</text>
<text x="407" y="291" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#3b665b" text-anchor="end">GPT-6.2 Astra Ultra · vitesse non renseignée</text>
<text x="14" y="41" font-family="DejaVu Sans, sans-serif" font-size="6.35" font-weight="700" fill="#3b665b" text-anchor="start">Percer, border, creuser</text>
<text x="14" y="57.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Le tracé relie les lieux publics. Le bâti forme le front de rue et</text>
<text x="14" y="62.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">réserve une cour pour l’air et la lumière. Les trois décisions ne</text>
<text x="14" y="68.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">produisent pas les mêmes droits d’accès.</text>
<rect x="14" y="111" width="53" height="58" rx="0" fill="#dfd6c2" stroke="#212e2c" stroke-width="0.5"/>
<polygon points="19,120 60,115 63,153 20,162" fill="#626767" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<path d="M16 158 L63 118" stroke="#fcf5e8" stroke-width="4" fill="none"/>
<text x="14" y="182" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3b665b" text-anchor="start">Percée</text>
<rect x="75" y="111" width="53" height="58" rx="0" fill="#dfd6c2" stroke="#212e2c" stroke-width="0.5"/>
<polygon points="80,120 121,115 124,153 81,162" fill="#626767" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<rect x="91" y="132" width="22" height="14" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="75" y="182" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3b665b" text-anchor="start">Îlot de rapport</text>
<rect x="136" y="111" width="53" height="58" rx="0" fill="#dfd6c2" stroke="#212e2c" stroke-width="0.5"/>
<polygon points="141,120 182,115 185,153 142,162" fill="#626767" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<rect x="152" y="132" width="22" height="14" rx="0" fill="#a6ad77" stroke="none" stroke-width="0.6"/>
<text x="136" y="182" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3b665b" text-anchor="start">Cour</text>
<text x="14" y="209.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Les plans et vues de la planche « Le modèle » distinguent les échelles</text>
<text x="14" y="214.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">du Châtelet, du square Boucicaut et de la place Pierre-Lafue. Une rue</text>
<text x="14" y="220.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">peut devenir partageable sans produire une deuxième percée.</text>
<text x="224" y="41" font-family="DejaVu Sans, sans-serif" font-size="6.35" font-weight="700" fill="#3b665b" text-anchor="start">Vingt ans de révisions</text>
<text x="225" y="67" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">0–1 an · écouter</text>
<text x="225" y="77.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Comptages et marches à trois horaires. Les copropriétés et le</text>
<text x="225" y="82.1" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">gestionnaire du square identifient horaires, bruit et accès de</text>
<text x="225" y="87.2" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">secours.</text>
<text x="225" y="125" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">2–5 ans · essayer</text>
<text x="225" y="135.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Assises démontables sur domaine public. Une convention d’usage ouvre</text>
<text x="225" y="140.1" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">un seul seuil test à horaires affichés.</text>
<text x="225" y="183" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">6–20 ans · transmettre</text>
<text x="225" y="193.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Budget municipal pour les sols et l’eau. Un fonds annuel finance</text>
<text x="225" y="198.1" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">l’entretien. Tous les trois ans, le collectif peut déplacer ou fermer</text>
<text x="225" y="203.2" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">une halte.</text>
<text x="224" y="252.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Indicateurs annuels : passages, conflits signalés, durée des haltes et</text>
<text x="224" y="257.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">surface de sol perméable.</text>
</svg>
