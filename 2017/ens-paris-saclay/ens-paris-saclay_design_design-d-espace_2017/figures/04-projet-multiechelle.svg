<text x="14" y="200.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Le chapelet orange suit le bord du square, tourne vers le grand toit</text>
<text x="14" y="205.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">et s’arrête aux seuils volontaires. Trois haltes raccourcissent le</text>
<text x="14" y="211.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">trajet pour les marcheurs qui se fatiguent. Chaque halte demeure</text>
