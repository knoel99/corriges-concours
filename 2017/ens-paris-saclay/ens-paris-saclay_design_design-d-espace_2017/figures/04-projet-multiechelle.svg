<text x="224" y="177.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Coupe de principe. Banc démontable sur sol déjà minéral, bande plane</text>
<text x="224" y="182.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">continue et noue plantée en bord de square. Un trop-plein rejoint le</text>
