<text x="280" y="177" font-family="DejaVu Sans, sans-serif" font-size="4.5" font-weight="700" fill="#406764" text-anchor="start">Couvercle indépendant</text>
<text x="280" y="189.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Les verrous sont accessibles de face. Le couvercle</text>
<text x="280" y="194.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">inversé reçoit le godet. Cette variante est retenue.</text>
<text x="15" y="237" font-family="DejaVu Sans, sans-serif" font-size="4.75" font-weight="700" fill="#406764" text-anchor="start">Essai main occupée</text>
<text x="15" y="249" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Placer le sac contre le banc, sortir la boîte, ouvrir les deux clips l’un après l’autre, puis trouver une assise stable au couvercle. Refaire la</text>
<text x="15" y="254" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">séquence avec des gants fins.</text>
<path d="M13 276 L407 276" stroke="#406764" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#406764" text-anchor="start">Le récipient fermé tient dans une enveloppe de 176 × 102 × 61 mm. Le couvercle libre peut se glisser sous la boîte après le repas.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#406764" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
