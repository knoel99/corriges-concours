<text x="147" y="177" font-family="DejaVu Sans, sans-serif" font-size="4.5" font-weight="700" fill="#406764" text-anchor="start">Couvercle articulé</text>
<text x="147" y="189.0" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Une main ouvre le couvercle. Une charnière fixe</text>
<text x="147" y="194.5" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">augmente l’encombrement sur les genoux.</text>
