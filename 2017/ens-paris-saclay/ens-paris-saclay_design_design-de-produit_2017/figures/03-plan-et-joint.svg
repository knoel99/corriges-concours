<text x="18" y="233" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le volume utile tient compte des rayons, des dépouilles et du godet amovible. Cibles après essai à l’eau : environ 510 mL pour le plat et 130</text>
<text x="18" y="238" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">mL pour le godet.</text>
<path d="M13 276 L407 276" stroke="#406764" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#406764" text-anchor="start">Une nervure douce sous le fond limite le glissement. Toutes les pièces mouillées se séparent pour le lavage et le séchage.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#406764" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
