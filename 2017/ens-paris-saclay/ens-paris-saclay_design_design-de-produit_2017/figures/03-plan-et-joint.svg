<text x="223" y="160.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Corps et couvercle en polypropylène injecté apte au contact alimentaire.</text>
<text x="223" y="165.1" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Joint en silicone démontable. Deux clips orange pivotent chacun sur un axe</text>
<text x="223" y="170.2" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">court.</text>
