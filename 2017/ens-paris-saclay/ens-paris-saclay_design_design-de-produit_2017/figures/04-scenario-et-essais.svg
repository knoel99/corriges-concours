<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#406764" text-anchor="start">Le service étudié reste individuel et réutilisable. Des pièces de rechange prolongent son usage en conservant les éléments principaux.</text>
