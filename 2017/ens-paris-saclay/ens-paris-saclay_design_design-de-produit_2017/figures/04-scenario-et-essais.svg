<text x="280" y="183.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Retirer couvercles et joint, brosser la gorge puis</text>
<text x="280" y="188.3" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">laisser les éléments égoutter.</text>
<text x="15" y="227" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#406764" text-anchor="start">Valider avant industrialisation</text>
<text x="15" y="239" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Tester un godet rempli d’eau colorée sur les six faces. Comparer l’ouverture avec main droite et main gauche. Faire vérifier le matériau, le</text>
<text x="15" y="244" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">nettoyage et la longévité réelle des clips.</text>
