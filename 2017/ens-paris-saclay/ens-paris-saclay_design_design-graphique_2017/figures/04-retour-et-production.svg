<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Du dépôt à la prochaine version</title><desc>Proposition finale · verso et protocole d’emploi. Une matrice papier, un relais par lieu et un cahier conservé sur place.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#493258" text-anchor="start">LA FEUILLE QUI REVIENT</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#493258" text-anchor="end">4 / 4</text>
<path d="M13 20 L407 20" stroke="#493258" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Du dépôt à la prochaine version</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Proposition finale · verso et protocole d’emploi. Une matrice papier, un relais par lieu et un cahier conservé sur place.</text>
<rect x="16" y="62" width="184" height="200" rx="0" fill="#f4ebda" stroke="#273c42" stroke-width="0.6"/>
<text x="24" y="81" font-family="DejaVu Sans, sans-serif" font-size="6.4" font-weight="700" fill="#493258" text-anchor="start">FICHE DE RETOUR</text>
<text x="24" y="95" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#273c42" text-anchor="start">Je réponds à la feuille no 17 – version B. Donner mon nom est</text>
<text x="24" y="100" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#273c42" text-anchor="start">facultatif.</text>
<text x="24" y="121" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" fill="#493258" text-anchor="start">Mon observation</text>
<path d="M24 132 L189 132" stroke="#273c42" stroke-width="0.4" fill="none"/>
<path d="M24 140 L174 140" stroke="#273c42" stroke-width="0.35" fill="none"/>
<text x="24" y="151" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" fill="#493258" text-anchor="start">D’où vient cette information ?</text>
<path d="M24 162 L189 162" stroke="#273c42" stroke-width="0.4" fill="none"/>
<path d="M24 170 L174 170" stroke="#273c42" stroke-width="0.35" fill="none"/>
<text x="24" y="181" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" fill="#493258" text-anchor="start">Formulation proposée</text>
<path d="M24 192 L189 192" stroke="#273c42" stroke-width="0.4" fill="none"/>
<path d="M24 200 L174 200" stroke="#273c42" stroke-width="0.35" fill="none"/>
<text x="24" y="211" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" fill="#493258" text-anchor="start">Accord pour reproduire le texte</text>
<path d="M24 222 L189 222" stroke="#273c42" stroke-width="0.4" fill="none"/>
<path d="M24 230 L174 230" stroke="#273c42" stroke-width="0.35" fill="none"/>
<text x="216" y="78" font-family="DejaVu Sans, sans-serif" font-size="5.2" font-weight="700" fill="#493258" text-anchor="start">Produire trois exemplaires</text>
<text x="216" y="96" font-family="DejaVu Sans, sans-serif" font-size="4.25" font-weight="700" fill="#493258" text-anchor="start">Composer</text>
<text x="216" y="105.0" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#273c42" text-anchor="start">L’atelier rassemble les retours et indique la source ou le caractère de</text>
<text x="216" y="109.75" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#273c42" text-anchor="start">témoignage. Un second lecteur contrôle la version.</text>
<text x="216" y="134" font-family="DejaVu Sans, sans-serif" font-size="4.25" font-weight="700" fill="#493258" text-anchor="start">Dupliquer</text>
<text x="216" y="143.0" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#273c42" text-anchor="start">Inscrire les textes sur un stencil, imprimer à la manivelle ou recopier</text>
<text x="216" y="147.75" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#273c42" text-anchor="start">lisiblement. Conserver une épreuve de référence.</text>
<text x="216" y="172" font-family="DejaVu Sans, sans-serif" font-size="4.25" font-weight="700" fill="#493258" text-anchor="start">Distribuer</text>
<text x="216" y="181.0" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#273c42" text-anchor="start">Un porteur suit trois lieux en deux jours. Chaque relais date sa copie. Une séance</text>
<text x="216" y="185.75" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#273c42" text-anchor="start">de lecture orale accompagne l’affichage.</text>
<text x="216" y="210" font-family="DejaVu Sans, sans-serif" font-size="4.25" font-weight="700" fill="#493258" text-anchor="start">Archiver</text>
<text x="216" y="219.0" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#273c42" text-anchor="start">Conserver les versions A, B et suivantes avec les réponses. Chaque lieu garde son</text>
<text x="216" y="223.75" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#273c42" text-anchor="start">propre cahier indexé par numéro.</text>
<path d="M13 276 L407 276" stroke="#493258" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#493258" text-anchor="start">Objet final 2/2. Une fiche retour peut être recopiée sur papier libre. Les lecteurs qui ne peuvent pas écrire peuvent dicter leur</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#493258" text-anchor="start">observation au relais.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#493258" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
</svg>
