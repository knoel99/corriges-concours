<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Choisir un support qui accueille la réponse</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Trois pistes de communication hors ligne. La décision porte sur le droit de corriger, sur la distance et sur la conservation.</text>
