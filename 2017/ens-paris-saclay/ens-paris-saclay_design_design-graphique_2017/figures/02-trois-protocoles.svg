<text x="148" y="173" font-family="DejaVu Sans, sans-serif" font-size="4.5" font-weight="700" fill="#493258" text-anchor="start">La valise d’archives</text>
<text x="148" y="185.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#273c42" text-anchor="start">Le fonds peut voyager et montrer des objets</text>
<text x="148" y="190.3" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#273c42" text-anchor="start">disparus. Sa malle est lourde et la consultation</text>
<text x="148" y="195.6" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#273c42" text-anchor="start">reste un événement.</text>
