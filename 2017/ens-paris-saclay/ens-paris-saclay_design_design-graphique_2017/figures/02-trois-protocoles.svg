<text x="281" y="173" font-family="DejaVu Sans, sans-serif" font-size="4.5" font-weight="700" fill="#493258" text-anchor="start">La feuille qui revient</text>
<text x="281" y="185.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#273c42" text-anchor="start">Un exemplaire circule et sa copie demeure. Une</text>
<text x="281" y="190.3" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#273c42" text-anchor="start">nouvelle version porte la correction publiquement,</text>
<text x="281" y="195.6" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#273c42" text-anchor="start">même après le départ du premier porteur.</text>
<text x="15" y="235" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#493258" text-anchor="start">Ce que conserve le papier</text>
<text x="15" y="247" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le Museum of Obsolete Media documente les supports. L’Atlas critique d’Internet de Louise Drulhe rend visibles des relations. Notre feuille</text>
<text x="15" y="252" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">conserve à la fois un message et les lieux où sa version a été lue.</text>
<path d="M13 276 L407 276" stroke="#493258" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#493258" text-anchor="start">Les deux références sont introduites dans les annexes 2 et 3 de l’épreuve. Le dispositif d’impression proposé fonctionne sans connexion.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#493258" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
