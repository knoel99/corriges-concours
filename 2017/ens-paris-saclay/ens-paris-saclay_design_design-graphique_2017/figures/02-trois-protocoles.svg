<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Choisir un support qui accueille la réponse</title><desc>Trois pistes de communication hors ligne. La décision porte sur le droit de corriger, sur la distance et sur la conservation.</desc>
