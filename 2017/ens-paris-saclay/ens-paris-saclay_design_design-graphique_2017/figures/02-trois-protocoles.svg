<text x="15" y="173" font-family="DejaVu Sans, sans-serif" font-size="4.5" font-weight="700" fill="#493258" text-anchor="start">Le mur de nouvelles</text>
<text x="15" y="185.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#273c42" text-anchor="start">Le tableau mural est lisible sans appareil. Une</text>
<text x="15" y="190.3" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#273c42" text-anchor="start">place seule devient le centre de toutes les prises</text>
<text x="15" y="195.6" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#273c42" text-anchor="start">de parole.</text>
