<text x="16" y="232" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#493258" text-anchor="start">Qui perd quoi ?</text>
<text x="16" y="244" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une permanence associative perd sa liste de diffusion. Une lectrice perd les commentaires qui corrigeaient les premières annonces. Un atelier de</text>
