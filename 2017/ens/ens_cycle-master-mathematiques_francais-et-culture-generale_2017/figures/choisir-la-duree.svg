<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img"><title>Ce que cache le délai moyen</title><desc>À délai moyen égal, deux répartitions de l’attente.</desc><rect x="0" y="0" width="820" height="290" fill="#faf9f3"/><text x="26" y="38" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#173e48">Ce que cache le délai moyen</text><text x="30" y="75" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#173e48">Attentes de deux patients (minutes)</text><text x="30" y="112" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e48">Service A</text><text x="30" y="183" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e48">Service B</text><rect x="156" y="91" width="100" height="17" fill="#366e73"/><text x="269" y="106" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#173e48">10</text><rect x="156" y="118" width="300" height="17" fill="#be9058"/><text x="469" y="133" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#173e48">30</text><text x="541" y="114" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#173e48">Moyenne : 20 min</text><rect x="156" y="163" width="200" height="17" fill="#366e73"/><text x="369" y="178" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#173e48">20</text><rect x="156" y="190" width="200" height="17" fill="#be9058"/><text x="369" y="205" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#173e48">20</text><text x="541" y="186" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#173e48">Moyenne : 20 min</text><text x="30" y="250" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e48">Le maximum passe de 30 à 20 minutes. La gravité des cas reste à connaître.</text></svg>
