<svg xmlns="http://www.w3.org/2000/svg" width="720" height="268" viewBox="0 0 720 268"><rect width="720" height="268" fill="white"/><g font-family="DejaVu Sans" fill="#1b4052"><text x="20" y="29" font-size="20" fill="#1b4052">Décomposition dans le plan du vecteur X et de U</text><line x1="25" y1="209" x2="325" y2="209" stroke="#2a6e74" stroke-width="2"/><line x1="65" y1="227" x2="156" y2="48" stroke="#2a6e74" stroke-width="2"/><line x1="224" y1="209" x2="284" y2="91" stroke="#ab7145" stroke-width="2" stroke-dasharray="5 4"/><line x1="134" y1="91" x2="284" y2="91" stroke="#ab7145" stroke-width="2" stroke-dasharray="5 4"/><line x1="74" y1="209" x2="284" y2="91" stroke="#324958" stroke-width="2"/><circle cx="74" cy="209" r="5" fill="#26766b"/><circle cx="284" cy="91" r="5" fill="#26766b"/><circle cx="134" cy="91" r="5" fill="#26766b"/><circle cx="224" cy="209" r="5" fill="#26766b"/><text x="290" y="89" font-size="16" fill="#1b4052">X</text><text x="101" y="85" font-size="16" fill="#1b4052">X₂</text><text x="225" y="235" font-size="16" fill="#1b4052">X₁</text><text x="55" y="236" font-size="16" fill="#1b4052">O</text><text x="345" y="99" font-size="16" fill="#1b4052">X₁ appartient au noyau de V transposé.</text><text x="345" y="139" font-size="16" fill="#1b4052">X₂ appartient à la droite de U.</text><text x="345" y="178" font-size="16" fill="#1b4052">Les côtés opposés sont parallèles.</text><text x="345" y="208" font-size="16" fill="#1b4052">On lit la somme X = X₁ + X₂.</text></g></svg>