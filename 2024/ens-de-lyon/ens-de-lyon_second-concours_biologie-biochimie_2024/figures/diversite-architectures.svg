<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 620 236" width="620" height="236"><title id="t">Trois particules, trois organisations</title><desc id="d">Les dessins présentent la forme des particules. La longueur ou le diamètre de chacune est indiqué séparément.</desc><rect width="620" height="236" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#223640"><text x="19" y="31" font-size="21">Trois particules, trois organisations</text><g stroke="#306568" stroke-width="2"><polygon points="87,67 110,58 133,67 141,92 128,113 100,118 80,98" fill="#d6edf0"/><path d="M87 67l23 15 23-15M110 82l-10 36m10-36 18 31m-48-15 30-16" fill="none"/><path d="M102 88q8-18 17-1t-3 12" fill="none" stroke="#9d492d"/>
<rect x="243" y="76" width="117" height="26" rx="11" fill="#d6edf0"/><path d="M250 76l14 26m-2-26 14 26m-2-26 14 26m-2-26 14 26m-2-26 14 26m-2-26 14 26m-2-26 14 26m-2-26 14 26" stroke="#306568"/><polygon points="480,53 505,53 521,73 515,95 487,102 471,82" fill="#d6edf0"/><path d="M493 101v30h12v-32M486 133h27m-20 0-23 13m35-13 22 13" fill="none"/></g><g font-size="15" text-anchor="middle"><text x="111" y="164">MS2</text><text x="111" y="186">Diamètre ≈ 27 nm</text><text x="302" y="164">Mosaïque du tabac</text><text x="302" y="186">Longueur ≈ 300 nm</text><text x="502" y="164">Bactériophage T4</text><text x="502" y="186">Longueur ≈ 200 nm</text></g><text x="19" y="220" font-size="13">MS2 et T4 sont des phages. Les trois dessins ne sont pas à la même échelle.</text></g></svg>
