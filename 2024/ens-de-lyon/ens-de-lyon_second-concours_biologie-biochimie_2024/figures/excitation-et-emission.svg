<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 620 221" width="620" height="221"><title id="t">Un fluorophore reçoit puis réémet de la lumière</title><desc id="d">Après absorption, le fluorophore perd une partie de son énergie avant de réémettre un photon de plus grande longueur d’onde.</desc><rect width="620" height="221" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#223640"><text x="19" y="31" font-size="21">Un fluorophore reçoit puis réémet de la lumière</text><g stroke="#4a6169" stroke-width="2"><path d="M46 153H579M46 67h237M307 84h272"/></g><path d="M145 147V78l-5 8m5-8 5 8" fill="none" stroke="#2d6382" stroke-width="3"/><path d="M239 68l8 9 8-5 8 9 8-5 8 9h26" fill="none" stroke="#937430" stroke-width="2"/><path d="M430 88v57l-5-8m5 8 5-8" fill="none" stroke="#33805e" stroke-width="3"/><g font-size="14"><text x="64" y="116">Absorption</text><text x="307" y="66">État excité relaxé</text><text x="443" y="122">Émission</text><text x="49" y="178">État fondamental</text><text x="50" y="205">La lumière d’excitation et la fluorescence sont séparées par des filtres.</text></g></g></svg>
