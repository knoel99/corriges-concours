<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 620 205" width="620" height="205"><title id="t">Une proportion dépend aussi de son dénominateur</title><desc id="d">Dans cet exemple fictif, le nombre de cellules B reste à 100 alors que leur proportion double quand le nombre total de lymphocytes diminue de moitié.</desc><rect width="620" height="205" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#223640"><text x="19" y="31" font-size="21">Une proportion dépend aussi de son dénominateur</text><g font-size="15"><text x="21" y="66">Exemple A</text><text x="21" y="124">Exemple B</text></g><g fill="#e3e8e9"><rect x="128" y="48" width="422" height="26"/><rect x="128" y="106" width="211" height="26"/></g><g fill="#3a7473"><rect x="128" y="48" width="42.2" height="26"/><rect x="128" y="106" width="42.2" height="26"/></g><g font-size="14"><text x="129" y="92">100 B sur 1 000 lymphocytes : 10 %</text><text x="129" y="151">100 B sur 500 lymphocytes : 20 %</text><rect x="22" y="174" width="15" height="12" fill="#3a7473"/><text x="43" y="185">Lymphocytes B</text><rect x="208" y="174" width="15" height="12" fill="#e3e8e9"/><text x="229" y="185">Autres lymphocytes</text></g></g></svg>
