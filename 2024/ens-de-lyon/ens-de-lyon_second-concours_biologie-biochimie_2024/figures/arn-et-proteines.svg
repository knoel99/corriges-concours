<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 620 202" width="620" height="202"><title id="t">Deux mesures dans des compartiments distincts</title><desc id="d">Le dosage plasmatique intègre les apports de plusieurs tissus et la disparition de la protéine. L’ARN mesuré ne concerne que les cellules échantillonnées.</desc><rect width="620" height="202" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#223640"><text x="19" y="31" font-size="21">Deux mesures dans des compartiments distincts</text><g fill="#eaf2f2" stroke="#386c6c" stroke-width="2"><rect x="20" y="62" width="270" height="87" rx="7"/><rect x="330" y="62" width="270" height="87" rx="7"/></g><g text-anchor="middle" font-size="16"><text x="155" y="90">ARN des lymphocytes</text><text x="155" y="114">prélevés dans le sang</text><text x="465" y="90">Protéine présente</text><text x="465" y="114">dans le plasma</text></g><g text-anchor="middle" font-size="14"><text x="155" y="139">Quantité de transcrit</text><text x="465" y="139">Concentration circulante</text></g><text x="22" y="180" font-size="15">Une variation de la protéine peut provenir d’autres cellules ou tissus.</text></g></svg>
