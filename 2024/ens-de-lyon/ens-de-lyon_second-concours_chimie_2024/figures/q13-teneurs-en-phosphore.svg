<svg xmlns="http://www.w3.org/2000/svg" width="620" height="222" viewBox="0 0 620 222" role="img" aria-labelledby="titre d"><title id="titre">Deux estimations de la teneur en phosphore</title><desc id="d">Pour 100 g d’engrais, convertir l’étiquette et le résultat de l’analyse en masse de phosphore élémentaire permet de les comparer.</desc><rect width="620" height="222" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#233a40"><text x="20" y="38" font-size="22">Deux estimations de la teneur en phosphore</text><rect x="18" y="64" width="584" height="55" rx="5" fill="#eef4f4"/><text x="32" y="87" font-size="16" font-weight="bold">Étiquette de l’engrais</text><text x="32" y="108" font-size="15">7,0 g de P₂O₅ équivalent</text><text x="577" y="98" font-size="18" text-anchor="end">3,06 g de P</text><rect x="18" y="127" width="584" height="55" rx="5" fill="#f7f2e9"/><text x="32" y="150" font-size="16" font-weight="bold">Analyse de l’échantillon</text><text x="32" y="171" font-size="15">0,23 g de P pour 2,5 g</text><text x="577" y="161" font-size="18" text-anchor="end">Environ 9,3 g de P</text><text x="22" y="209" font-size="15">Les deux valeurs de droite sont rapportées à 100 g d’engrais.</text></g></svg>
