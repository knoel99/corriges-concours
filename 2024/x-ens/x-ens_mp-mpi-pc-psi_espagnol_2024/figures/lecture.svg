<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Une victoire sportive, trois lieux de décision</title>
<desc id="description">Fédération Une remise de médaille sous l’autorité du président Tenir compte du consentement et de la hiérarchie Travail sportif Conventions, hébergement et maternité Le titre mondial ne supprime pas les inégalités Rédaction sportive Photographie du trophée et gros titre d’AS Le cadrage attribue aux personnes des rôles différents</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Une victoire sportive, trois lieux de décision</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lieu</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice du dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Interprétation</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Fédération</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Une remise de médaille</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">sous l’autorité du</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">président</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Tenir compte du</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">consentement et de la</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">hiérarchie</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Travail sportif</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Conventions, hébergement</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">et maternité</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Le titre mondial ne</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">supprime pas les inégalités</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Rédaction sportive</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Photographie du trophée et</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">gros titre d’AS</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Le cadrage attribue aux</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">personnes des rôles</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">différents</text>
</g>
</svg>
