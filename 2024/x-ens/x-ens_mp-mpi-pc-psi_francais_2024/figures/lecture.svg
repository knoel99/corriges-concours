<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">Comment reconnaître un usage moral de la persuasion ?</title>
<desc id="description">Valmont fait observer sa charité Le geste a eu lieu, son intention est masquée Tourvel est privée d’un jugement éclairé Lorenzo avertit les républicains Une annonce exacte semble invraisemblable Le discrédit du témoin entrave l’action Documents du Pentagone La trace écrite permet la confrontation Le citoyen retrouve la possibilité de juger Laclos croise les lettres Le lecteur peut vérifier les récits entre eux La persuasion rend possible sa propre critique</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment reconnaître un usage moral de la persuasion ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Épisode</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Épreuve du vrai</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conséquence morale</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Valmont fait observer</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">sa charité</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le geste a eu lieu, son</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">intention est masquée</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Tourvel est privée d’un</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">jugement éclairé</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Lorenzo avertit les</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">républicains</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Une annonce exacte semble</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">invraisemblable</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le discrédit du témoin</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">entrave l’action</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Documents du</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Pentagone</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">La trace écrite permet la</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">confrontation</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le citoyen retrouve la</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">possibilité de juger</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Laclos croise les</text>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">lettres</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Le lecteur peut vérifier</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">les récits entre eux</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">La persuasion rend possible</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">sa propre critique</text>
</g>
</svg>
