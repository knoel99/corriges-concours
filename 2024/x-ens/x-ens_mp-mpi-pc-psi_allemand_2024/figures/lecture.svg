<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">Quand le gain de temps préserve-t-il la compétence ?</title>
<desc id="description">Industrie Compenser des postes vacants Former aussi les salariés les moins qualifiés Médecine Assister le diagnostic Garder le jugement clinique et protéger les données Administration Émettre une recommandation Examiner le cas individuel et rendre le recours possible École Rédiger puis noter un devoir Vérifier qui a appris et qui a évalué</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quand le gain de temps préserve-t-il la compétence ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Terrain</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Tâche déléguée</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Condition à examiner</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Industrie</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Compenser des postes</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">vacants</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Former aussi les salariés</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">les moins qualifiés</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Médecine</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Assister le diagnostic</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Garder le jugement clinique</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">et protéger les données</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Administration</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Émettre une recommandation</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Examiner le cas individuel</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">et rendre le recours</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">possible</text>
<rect x="10" y="315" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">École</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">Rédiger puis noter un</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">devoir</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Vérifier qui a appris et</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">qui a évalué</text>
</g>
</svg>
