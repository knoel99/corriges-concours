<svg xmlns="http://www.w3.org/2000/svg" width="790" height="320" viewBox="0 0 790 320" role="img"><title>Polynôme de Taylor sur le bloc de taille quatre</title><desc>Pour le décalage de taille quatre, les quatre coefficients de Taylor de l’exponentielle occupent chacun une surdiagonale.</desc><rect width="790" height="320" fill="#fbfaf5"/><text x="20" y="35" font-family="DejaVu Sans" font-size="23" fill="#183949" font-weight="bold">Polynôme de Taylor sur le bloc de taille quatre</text><rect x="42" y="69" width="64" height="53" fill="#c6e6da" stroke="white" stroke-width="2"/><text x="74" y="103" font-family="DejaVu Sans" font-size="22" fill="#183949" text-anchor="middle">1</text><rect x="106" y="69" width="64" height="53" fill="#d6e2f0" stroke="white" stroke-width="2"/><text x="138" y="103" font-family="DejaVu Sans" font-size="22" fill="#183949" text-anchor="middle">1</text><rect x="170" y="69" width="64" height="53" fill="#f2dec4" stroke="white" stroke-width="2"/><text x="202" y="103" font-family="DejaVu Sans" font-size="22" fill="#183949" text-anchor="middle">1/2</text><rect x="234" y="69" width="64" height="53" fill="#edc9b8" stroke="white" stroke-width="2"/><text x="266" y="103" font-family="DejaVu Sans" font-size="22" fill="#183949" text-anchor="middle">1/6</text><rect x="42" y="122" width="64" height="53" fill="#f1f1ed" stroke="white" stroke-width="2"/><text x="74" y="156" font-family="DejaVu Sans" font-size="22" fill="#183949" text-anchor="middle">0</text><rect x="106" y="122" width="64" height="53" fill="#c6e6da" stroke="white" stroke-width="2"/><text x="138" y="156" font-family="DejaVu Sans" font-size="22" fill="#183949" text-anchor="middle">1</text><rect x="170" y="122" width="64" height="53" fill="#d6e2f0" stroke="white" stroke-width="2"/><text x="202" y="156" font-family="DejaVu Sans" font-size="22" fill="#183949" text-anchor="middle">1</text><rect x="234" y="122" width="64" height="53" fill="#f2dec4" stroke="white" stroke-width="2"/><text x="266" y="156"