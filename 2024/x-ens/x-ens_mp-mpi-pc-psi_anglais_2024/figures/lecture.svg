<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">Forecasts, dependencies and choices</title>
<desc id="description">Metaculus, 2022–23 Median predicted year moves closer When will a general system actually arrive? Models and infrastructure One essential bottleneck can limit progress Which tasks will still require people? Artists and training data Current tools draw on earlier human work Who can consent, object or seek redress? Participation and care People value the relationship as well as the result Which decisions will they delegate?</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Forecasts, dependencies and choices</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Evidence</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What it establishes</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question left open</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Metaculus, 2022–23</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Median predicted year</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">moves closer</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">When will a general system</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">actually arrive?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Models and</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">infrastructure</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">One essential bottleneck</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">can limit progress</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Which tasks will still</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">require people?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Artists and training</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">data</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Current tools draw on</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">earlier human work</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Who can consent, object or</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">seek redress?</text>
<rect x="10" y="293" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Participation and</text>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">care</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">People value the</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">relationship as well as</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">the result</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">Which decisions will they</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">delegate?</text>
</g>
</svg>
