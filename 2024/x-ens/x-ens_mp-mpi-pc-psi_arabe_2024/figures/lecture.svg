<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Du phénomène naturel à la vulnérabilité sociale</title>
<desc id="description">Villages du Haut Atlas Pistes effondrées et écarts anciens d’équipement Secours aériens et services de proximité Ville de Derna Deux barrages rompus, accès terrestre endommagé Demande de voies maritimes et de secours Dessin d’Hespress La dalle des régions délaissées jouxte des plans sur papier Confronter les politiques à leurs effets locaux</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Du phénomène naturel à la vulnérabilité sociale</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Observation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui aggrave la crise</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Réponse évoquée</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Villages du Haut</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">Atlas</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Pistes effondrées et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">écarts anciens</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">d’équipement</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Secours aériens et services</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">de proximité</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Ville de Derna</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Deux barrages rompus,</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">accès terrestre endommagé</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Demande de voies maritimes</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">et de secours</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Dessin d’Hespress</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">La dalle des régions</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">délaissées jouxte des</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">plans sur papier</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Confronter les politiques à</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">leurs effets locaux</text>
</g>
</svg>
