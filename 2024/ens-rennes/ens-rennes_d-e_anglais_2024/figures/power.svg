<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">How is international power distributed?</title>
<desc id="description">Coalition building The United States organised a coalition over Kuwait. Who can bring partners together? Economic influence China finances infrastructure. Does investment imply political alignment? Regional influence Russia seeks to dominate its region. Does regional power extend to every issue?</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">How is international power distributed?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Dimension</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Example in the text</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question to test</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Coalition building</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">The United States</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">organised a coalition over</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">Kuwait.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Who can bring partners</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">together?</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Economic influence</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">China finances</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">infrastructure.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Does investment imply</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">political alignment?</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Regional influence</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Russia seeks to dominate</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">its region.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Does regional power extend</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">to every issue?</text>
</g>
</svg>
