<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Welche Haushalte vergleicht der Autor?</title>
<desc id="description">Alleinstehende 532 Euro mehr mit Mindestlohn. Abstand beim verfügbaren Monatseinkommen. Eltern mit zwei Kindern unter sechs 674 Euro mehr bei Erwerbsarbeit. Der Haushaltstyp beeinflusst den Abstand. Seit 2015 Mindestlohn plus 46 %, Leistung plus 41 %. Wachstumsraten, keine Monatsbeträge.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Welche Haushalte vergleicht der Autor?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Vergleich</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Befund im Text</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Was die Zahl bedeutet</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Alleinstehende</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">532 Euro mehr mit</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Mindestlohn.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Abstand beim verfügbaren</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Monatseinkommen.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Eltern mit zwei</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Kindern unter sechs</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">674 Euro mehr bei</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Erwerbsarbeit.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Der Haushaltstyp</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">beeinflusst den Abstand.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Seit 2015</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Mindestlohn plus 46 %,</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Leistung plus 41 %.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Wachstumsraten, keine</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Monatsbeträge.</text>
</g>
</svg>
