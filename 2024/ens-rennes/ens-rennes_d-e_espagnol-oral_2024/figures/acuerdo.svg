<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">¿Qué aporta cada instrumento negociador?</title>
<desc id="description">Ayuda existente Unos 200 millones de euros. No es el aumento ofrecido. Aumento posible Facilitar la adaptación de sectores. La cifra final se negociaba. Reglas ambientales Fijar compromisos de sostenibilidad. La ayuda no fija esas reglas.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿Qué aporta cada instrumento negociador?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Instrumento</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Función</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Límite</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Ayuda existente</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Unos 200 millones de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">euros.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">No es el aumento ofrecido.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Aumento posible</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Facilitar la adaptación de</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">sectores.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La cifra final se</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">negociaba.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Reglas ambientales</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Fijar compromisos de</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">sostenibilidad.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La ayuda no fija esas</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">reglas.</text>
</g>
</svg>
