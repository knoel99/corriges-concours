<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Tres voces sobre una misión electoral</title>
<desc id="description">Consejo Electoral Retira la invitación a la UE. Invoca la soberanía nacional. Unión Europea Mantiene y suspende distintas sanciones. Habla de elecciones competitivas. Oposición Solicita formalizar la misión. Invoca el acuerdo de Barbados.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Tres voces sobre una misión electoral</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Actor</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Actuación</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué sostiene</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Consejo Electoral</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Retira la invitación a la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">UE.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Invoca la soberanía</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">nacional.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Unión Europea</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Mantiene y suspende</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">distintas sanciones.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Habla de elecciones</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">competitivas.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Oposición</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Solicita formalizar la</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">misión.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Invoca el acuerdo de</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Barbados.</text>
</g>
</svg>
