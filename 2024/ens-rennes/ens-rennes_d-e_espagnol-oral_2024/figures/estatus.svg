<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Tres ámbitos del debate sobre Puerto Rico</title>
<desc id="description">Comité de la ONU Aprueba una resolución. El resultado de un proceso vinculante. Comparecientes Defienden varias opciones. Las preferencias de todo el electorado. Congreso de EE. UU. Tramita legislación sobre una consulta. La aprobación definitiva de la ley.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Tres ámbitos del debate sobre Puerto Rico</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Institución o grupo</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qué puede hacer</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué falta por establecer</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Comité de la ONU</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Aprueba una resolución.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">El resultado de un proceso</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">vinculante.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Comparecientes</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Defienden varias opciones.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Las preferencias de todo el</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">electorado.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Congreso de EE. UU.</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Tramita legislación sobre</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">una consulta.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La aprobación definitiva de</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">la ley.</text>
</g>
</svg>
