<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Which decision is being discussed?</title>
<desc id="description">New York trial A conviction in 2020. The original jury’s decision. New York appeal Conviction overturned, four votes to three. Ruling on the trial procedure. California Separate conviction under appeal. Custody continues at publication.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Which decision is being discussed?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Forum</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Status in April 2024</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Scope</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">New York trial</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A conviction in 2020.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">The original jury’s</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">decision.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">New York appeal</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Conviction overturned,</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">four votes to three.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Ruling on the trial</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">procedure.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">California</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Separate conviction under</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">appeal.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Custody continues at</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">publication.</text>
</g>
</svg>
