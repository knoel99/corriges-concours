<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Who bears the risk of uncertainty?</title>
<desc id="description">State Defines a legal exception. How clearly does it specify the threshold? Doctor Must decide before the outcome is known. What may follow from acting now? Patient Lives with the consequences of delay. Whose risk increases while waiting?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who bears the risk of uncertainty?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Actor</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Decision or exposure</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">State</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Defines a legal exception.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">How clearly does it specify</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">the threshold?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Doctor</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Must decide before the</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">outcome is known.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">What may follow from acting</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">now?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Patient</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Lives with the</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">consequences of delay.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Whose risk increases while</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">waiting?</text>
</g>
</svg>
