<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Which population does the number describe?</title>
<desc id="description">Reinterviews Nearly 2,000 earlier respondents. A reported change in voting intentions. Georgia survey Voters in one state. Different margins with different choices. Focus group Eleven undecided participants. Possible reasons for individual choices.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Which population does the number describe?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Evidence</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Population</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conclusion it supports</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Reinterviews</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Nearly 2,000 earlier</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">respondents.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">A reported change in voting</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">intentions.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Georgia survey</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Voters in one state.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Different margins with</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">different choices.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Focus group</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Eleven undecided</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">participants.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Possible reasons for</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">individual choices.</text>
</g>
</svg>
