<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trabajar, decidir y ser escuchada</title>
<desc id="description">Chus Fernández Dirige un equipo y coordina laboratorios. Acceso al empleo y promoción. Charo Arredondo Su madre trabajaba sin dirigir la explotación. Participación laboral y poder de decisión. Cecilia y Laura Explican de forma distinta su experiencia. Varias voces dentro del mismo sector.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trabajar, decidir y ser escuchada</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Retrato</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qué se observa</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué permite comparar</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Chus Fernández</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Dirige un equipo y</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">coordina laboratorios.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Acceso al empleo y</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">promoción.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Charo Arredondo</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Su madre trabajaba sin</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">dirigir la explotación.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Participación laboral y</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">poder de decisión.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Cecilia y Laura</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Explican de forma distinta</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">su experiencia.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Varias voces dentro del</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">mismo sector.</text>
</g>
</svg>
