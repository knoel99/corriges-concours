<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Mobilità e aspettative dei dipendenti</title>
<desc id="description">Vuole cambiare impiego entro un anno 25 per cento. 26 per cento. Prevede competenze diverse entro cinque anni Circa un terzo. 51 per cento. Prevede benefici di produttività ed efficienza dall’IA 21 per cento. 31 per cento.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Mobilità e aspettative dei dipendenti</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Indicatore</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Italia</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Mondo</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Vuole cambiare</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">impiego entro un anno</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">25 per cento.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">26 per cento.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Prevede competenze</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">diverse entro cinque</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">anni</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Circa un terzo.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">51 per cento.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Prevede benefici di</text>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">produttività ed</text>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">efficienza dall’IA</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">21 per cento.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">31 per cento.</text>
</g>
</svg>
