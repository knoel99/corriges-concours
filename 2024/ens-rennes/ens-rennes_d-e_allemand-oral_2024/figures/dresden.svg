<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Wie aus einem Angriff eine öffentliche Frage wird</title>
<desc id="description">Einzelner Wahlhelfer Ecke hängt Plakate auf. Politische Mitarbeit braucht Sicherheit. Öffentlicher Raum Menschen versammeln sich in Striesen. Die Straße bleibt ein Ort der Beteiligung. Parteien Abgeordnete unterschreiben eine Erklärung. Streit braucht gemeinsame Regeln.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Wie aus einem Angriff eine öffentliche Frage wird</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Ebene</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Handlung</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Bedeutung</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Einzelner Wahlhelfer</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Ecke hängt Plakate auf.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Politische Mitarbeit</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">braucht Sicherheit.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Öffentlicher Raum</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Menschen versammeln sich</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">in Striesen.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Die Straße bleibt ein Ort</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">der Beteiligung.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Parteien</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Abgeordnete unterschreiben</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">eine Erklärung.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Streit braucht gemeinsame</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Regeln.</text>
</g>
</svg>
