<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Zwei Erwartungen an den Klimaschutz</title>
<desc id="description">Arbeitsplätze 57 % erwarten mehr neue als verlorene Jobs. Gesamtwirkung auf die Beschäftigung. Preise 46 % erwarten Bezahlbarkeit für alle. Zugang von Haushalten zu Produkten. Politische Antwort Gezielte Unterstützung und Erklärung. Eine Belastung lässt sich konkret verringern.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Zwei Erwartungen an den Klimaschutz</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Aussage</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">EU-Umfrage 2022</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Was die Zahl beschreibt</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Arbeitsplätze</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">57 % erwarten mehr neue</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">als verlorene Jobs.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Gesamtwirkung auf die</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Beschäftigung.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Preise</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">46 % erwarten</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Bezahlbarkeit für alle.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Zugang von Haushalten zu</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Produkten.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Politische Antwort</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Gezielte Unterstützung und</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Erklärung.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Eine Belastung lässt sich</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">konkret verringern.</text>
</g>
</svg>
