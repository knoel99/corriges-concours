<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Drei Formen politischer Beteiligung</title>
<desc id="description">Stimme Wahlrecht ab 16 bei der Europawahl. Wer darf entscheiden? Aufmerksamkeit Ein Video erreicht junge Zuschauer. Wer wird angesprochen? Einfluss Ein Vorschlag verändert eine Entscheidung. Wer bestimmt tatsächlich mit?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Drei Formen politischer Beteiligung</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Form</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Beispiel</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Frage an die Politik</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Stimme</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Wahlrecht ab 16 bei der</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Europawahl.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Wer darf entscheiden?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Aufmerksamkeit</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Ein Video erreicht junge</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Zuschauer.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Wer wird angesprochen?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Einfluss</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Ein Vorschlag verändert</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">eine Entscheidung.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Wer bestimmt tatsächlich</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">mit?</text>
</g>
</svg>
