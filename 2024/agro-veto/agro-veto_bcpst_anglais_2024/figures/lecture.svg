<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Comment les deux articles éclairent-ils la même rue ?</title>
<desc id="description">Local commercial Les magasins Wilko ferment. Les locaux vacants accueillent artistes, commerces et associations. Économie locale Emplois menacés et concurrence des périphéries. Approvisionnement local et achats de bâtiments par les habitants. Vie du centre Le modèle fondé sur les grandes enseignes recule. Plusieurs usages du centre-ville peuvent coexister.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment les deux articles éclairent-ils la même rue ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Échelle</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Disparition chez Escande</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Réemploi chez Norris</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Local commercial</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Les magasins Wilko</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">ferment.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les locaux vacants</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">accueillent artistes,</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">commerces et associations.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Économie locale</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Emplois menacés et</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">concurrence des</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">périphéries.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Approvisionnement local et</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">achats de bâtiments par les</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">habitants.</text>
<rect x="10" y="270" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Vie du centre</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Le modèle fondé sur les</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">grandes enseignes recule.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Plusieurs usages du centre-</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">ville peuvent coexister.</text>
</g>
</svg>
