<svg xmlns="http://www.w3.org/2000/svg" width="750" height="316" viewBox="0 0 750 316"><rect width="750" height="316" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#253e49">
<text x="17" y="31" fill="#253e49" text-anchor="start" font-weight="700" font-size="21">À la plaque motrice, les deux faces ont des fonctions distinctes</text>
<rect x="26" y="64" width="315" height="77" rx="8" fill="#e7f0f5" stroke="#247b93" stroke-width="1.8"/>
<text x="183.5" y="98.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Terminaison du motoneurone</text>
<text x="183.5" y="117.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Potentiel d’action → canaux Ca²⁺ ouverts.</text>
<rect x="409" y="64" width="315" height="77" rx="8" fill="#e7f0f5" stroke="#247b93" stroke-width="1.8"/>
<text x="566.5" y="98.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Libération dans la fente</text>
<text x="566.5" y="117.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Ca²⁺ → fusion des vésicules d’acétylcholine.</text>
<path d="M345 103 L402 103" fill="none" stroke="#247b93" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M402 103 L394.1 107.31" fill="none" stroke="#247b93" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M402 103 L394.1 98.69" fill="none" stroke="#247b93" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M565 146 L565 169" fill="none" stroke="#247b93" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M565 169 L560.69 161.1" fill="none" stroke="#247b93" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M565 169 L569.31 161.1" fill="none" stroke="#247b93" stroke-width="2.2" stroke-dasharray="none"/>
<rect x="409" y="175" width="315" height="73" rx="8" fill="#f7eddf" stroke="#a96528" stroke-width="1.8"/>
<text x="566.5" y="207.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Sarcolemme de la fibre</text>
<text x="566.5" y="226.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Récepteurs nicotiniques → courant entrant.</text>
<rect x="26" y="175" width="315" height="73" rx="8" fill="#f7eddf" stroke="#a96528" stroke-width="1.8"/>
<text x="183.5" y="207.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Réponse musculaire</text>
<text x="183.5" y="226.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Potentiel de plaque, puis potentiel d’action.</text>
<path d="M405 213 L348 213" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M348 213 L355.9 208.69" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M348 213 L355.9 217.31" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<text x="37" y="283" fill="#253e49" text-anchor="start" font-weight="400" font-size="14">Dans la fente synaptique, l’acétylcholinestérase hydrolyse le médiateur et limite son action.</text>
</g></svg>
