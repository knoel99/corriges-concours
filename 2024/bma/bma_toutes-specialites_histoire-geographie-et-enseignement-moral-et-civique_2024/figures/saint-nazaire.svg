<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 664" role="img" aria-labelledby="title desc">
<title id="title">Le parc éolien de Saint-Nazaire et son raccordement</title>
<desc id="desc">Au sud-ouest du Croisic, les deux liaisons sous-marines vont du poste en mer à la côte de Saint-Nazaire. Le raccordement souterrain se prolonge vers Prinquiau. La base de maintenance est au port de La Turballe.</desc>
