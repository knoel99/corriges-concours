<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img">
<title>Graphe de structure du droïde</title>
<desc>Le châssis est relié aux deux roues par des pivots motorisés et au sol par la roulette arrière. Chaque roue est au contact du sol.</desc>
<rect width="720" height="390" fill="white"/>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9a4128"/></marker></defs>
<g fill="none" stroke="#516471" stroke-width="2">
<path d="M305 99 L167 183 M415 99 L553 183"/>
<path d="M150 225 L301 329 M570 225 L419 329 M360 107 V329"/>
</g>
<path d="M360 29 V66" stroke="#9a4128" stroke-width="2.5" marker-end="url(#fleche)"/>
<g fill="#e7eff4" stroke="#195c85" stroke-width="1.6">
<rect x="286" y="68" width="148" height="40" rx="6"/>
<rect x="75" y="183" width="150" height="42" rx="6"/>
<rect x="495" y="183" width="150" height="42" rx="6"/>
<rect x="287" y="329" width="146" height="39" rx="6"/>
</g>
<g font-family="sans-serif" font-size="16" fill="#15252e" text-anchor="middle">
<text x="360" y="93">Châssis (c)</text>
<text x="150" y="209">Roue gauche (g)</text>
<text x="570" y="209">Roue droite (d)</text>
<text x="360" y="353">Sol (0)</text>
<text x="410" y="29" fill="#9a4128" text-anchor="start">Poids en G</text>
<text x="192" y="123">Pivot (M, y<tspan baseline-shift="sub" font-size="11">c</tspan>)</text>
<text x="142" y="145">Couple moteur C<tspan baseline-shift="sub" font-size="11">g</tspan></text>
<text x="528" y="123">Pivot (M, y<tspan baseline-shift="sub" font-size="11">c</tspan>)</text>
<text x="578" y="145">Couple moteur C<tspan baseline-shift="sub" font-size="11">d</tspan></text>
<text x="157" y="279">Contact en I</text>
<text x="568" y="279">Contact en J</text>
<rect x="293" y="203" width="134" height="28" fill="white"/>
<text x="360" y="223">Contact en K</text>
</g>
</svg>
