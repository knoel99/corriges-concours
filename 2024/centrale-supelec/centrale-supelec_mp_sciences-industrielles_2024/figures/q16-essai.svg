<svg xmlns="http://www.w3.org/2000/svg" width="710" height="274" viewBox="0 0 710 274" role="img" aria-labelledby="titre">
<title id="titre">Réglages et mesures pour isoler le frottement de la motorisation</title>
<rect width="710" height="274" fill="white"/>
<g font-family="DejaVu Sans,sans-serif" font-size="16" fill="#23394d">
<rect x="23" y="28" width="316" height="215" rx="7" fill="#f0f5f9" stroke="#89a1b3"/>
<rect x="371" y="28" width="316" height="215" rx="7" fill="#f0f5f9" stroke="#89a1b3"/>
<text x="43" y="61" font-weight="bold">Conditions matérielles nº 2</text>
<text x="43" y="104">Attelle en mouvement</text><text x="313" y="104" text-anchor="end">Non</text>
<text x="43" y="139">Jambe et cuisse sur l’attelle</text><text x="313" y="139" text-anchor="end">Non</text>
<text x="43" y="174">Boucle de vitesse connectée</text><text x="313" y="174" text-anchor="end">Oui</text>
<text x="43" y="209">Boucle de position active</text><text x="313" y="209" text-anchor="end">Non</text>
<text x="391" y="61" font-weight="bold">Protocole de mesure nº 1</text>
<text x="391" y="104">1. Envoyer plusieurs échelons.</text>
<text x="391" y="139">2. Relever iₘ et ωₘ stabilisés.</text>
<text x="391" y="174">3. Ajuster iₘ en fonction de ωₘ.</text>
<text x="391" y="209">4. Comparer pente et ordonnée.</text>
</g>
</svg>
