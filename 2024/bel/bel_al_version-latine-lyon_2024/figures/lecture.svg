<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Deux façons de juger le projet</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Deux façons de juger le projet</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">L’architecte</text>
<text x="205" y="54" font-size="15">Sa mise en scène rend visible la</text>
<text x="205" y="71" font-size="15">silhouette qu’il imagine pour le mont</text>
<text x="205" y="88" font-size="15">Athos.</text>
<text x="524" y="70" font-size="15">La forme</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">Le roi interroge</text>
<text x="205" y="123" font-size="15">Les habitants auraient besoin de</text>
<text x="205" y="140" font-size="15">céréales et de terres aux environs.</text>
<text x="524" y="131" font-size="15">La subsistance</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">Le roi décide</text>
<text x="205" y="184" font-size="15">Il écarte le site et garde l’architecte à</text>
<text x="205" y="201" font-size="15">ses côtés.</text>
<text x="524" y="192" font-size="15">Deux verdicts</text>
</g></svg>
