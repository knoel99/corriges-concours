<svg xmlns="http://www.w3.org/2000/svg" width="840" height="265" viewBox="0 0 840 265" role="img"><title>Construction de la dernière période</title><rect width="840" height="265" fill="white"/><rect x="18" y="81" width="200" height="72" rx="10" fill="#e3efef"/><text x="118" y="111" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Sujet</text><text x="118" y="138" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">a cup of wine</text><rect x="286" y="15" width="262" height="71" rx="10" fill="#edf1e0"/><text x="417" y="43" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">En plein soleil</text><text x="417" y="69" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">whether drunk …</text><rect x="286" y="146" width="262" height="71" rx="10" fill="#f5ebdf"/><text x="417" y="173" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Un soir d’hiver</text><text x="417" y="201" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">or … when …</text><rect x="619" y="81" width="198" height="72" rx="10" fill="#e3efef"/><text x="718" y="111" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Verbe principal</text><text x="718" y="138" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">brings</text><line x1="217" x2="285" y1="117" y2="51" stroke="#426776" stroke-width="3" /><line x1="217" x2="285" y1="117" y2="181" stroke="#426776" stroke-width="3" /><line x1="548" x2="619" y1="51" y2="117" stroke="#426776" stroke-width="3" /><line x1="548" x2="619" y1="181" y2="117" stroke="#426776" stroke-width="3" /><text x="416" y="246" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">La sensation physique développée dans la seconde branche retarde le verbe.</text></svg>
