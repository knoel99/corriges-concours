<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Une sirène entendue par quatre personnages</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Une sirène entendue par quatre personnages</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">Ida</text>
<text x="205" y="62" font-size="15">Elle agrafe son corset et prend Useppe</text>
<text x="205" y="79" font-size="15">dans ses bras.</text>
<text x="524" y="70" font-size="15">Se mettre à l’abri</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">Blitz et Useppe</text>
<text x="205" y="123" font-size="15">Le chien réclame toute la famille. Le</text>
<text x="205" y="140" font-size="15">petit réinvente le cri de la sirène.</text>
<text x="524" y="131" font-size="15">Rester ensemble</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">Nino / Ninnarieddu</text>
<text x="205" y="184" font-size="15">Il accepte de descendre, puis soigne</text>
<text x="205" y="201" font-size="15">sa pose devant les voisines.</text>
<text x="524" y="184" font-size="15">Se donner en</text>
<text x="524" y="201" font-size="15">spectacle</text>
</g></svg>
