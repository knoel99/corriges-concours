<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-labelledby="t"><title id="t">Le délai moyen d’un guichet fictif</title><rect width="860" height="220" fill="#fff"/><g font-family="DejaVu Sans,sans-serif" fill="#193641"><text x="15" y="32" font-size="24" font-weight="bold">Le délai moyen d’un guichet fictif</text><rect x="15" y="53" width="830" height="45" fill="#e4eeed"/><text x="26" y="81" font-weight="bold" font-size="17">Dossiers simples</text><text x="270" y="81" font-size="17">8 dossiers simples × 5 min = 40 min</text><rect x="15" y="106" width="830" height="45" fill="#eff3f4"/><text x="26" y="134" font-weight="bold" font-size="17">Dossiers complexes</text><text x="270" y="134" font-size="17">2 dossiers complexes × 25 min = 50 min</text><rect x="15" y="159" width="830" height="45" fill="#e8eef5"/><text x="26" y="187" font-weight="bold" font-size="17">Avant et après transfert</text><text x="270" y="187" font-size="17">90 min ÷ 10 = 9 min ; 40 min ÷ 8 = 5 min</text></g></svg>
