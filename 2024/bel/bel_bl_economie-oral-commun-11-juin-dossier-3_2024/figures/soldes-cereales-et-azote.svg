 <title id="figure-title">Deux soldes extérieurs de la France en 2021</title>
 <desc id="figure-desc">Les céréales représentent 2,9 Mt exportées et 0,4 Mt importée en équivalent protéines, soit un solde de +2,5 Mt. Les engrais azotés représentent 0,9 Mt exportée et 6 Mt importées après conversion, soit −5,1 Mt. Calcul sur les valeurs arrondies du graphique 2b, p. 4 du fascicule. Pour les engrais, la conversion de l’azote en équivalent protéines mesure une dépendance aux intrants.</desc>
