<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 143" width="714" height="143">
<rect width="100%" height="100%" fill="white"/>
<rect x="10" y="14" width="218" height="112" rx="7" fill="#f4f6f6" stroke="#184954"/>
<path d="M 25 53 L 213 53" stroke="#184954" stroke-width="1"/>
<text x="119.0" y="40" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#184954" text-anchor="middle">En public</text>
<text x="119.0" y="81" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#184954" text-anchor="middle">Domitius promet</text>
<text x="119.0" y="103" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#184954" text-anchor="middle">un secours prochain.</text>
<rect x="248" y="14" width="218" height="112" rx="7" fill="#f4f6f6" stroke="#86612b"/>
<path d="M 263 53 L 451 53" stroke="#86612b" stroke-width="1"/>
<text x="357.0" y="40" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#86612b" text-anchor="middle">Dans la lettre</text>
<text x="357.0" y="81" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#86612b" text-anchor="middle">Pompée invite Domitius</text>
<text x="357.0" y="103" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#86612b" text-anchor="middle">à le rejoindre.</text>
<rect x="486" y="14" width="218" height="112" rx="7" fill="#f4f6f6" stroke="#385576"/>
<path d="M 501 53 L 689 53" stroke="#385576" stroke-width="1"/>
<text x="595.0" y="40" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#385576" text-anchor="middle">Entre soldats</text>
<text x="595.0" y="81" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#385576" text-anchor="middle">Les hommes disent</text>
<text x="595.0" y="103" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#385576" text-anchor="middle">leur confiance rompue.</text>
</svg>
