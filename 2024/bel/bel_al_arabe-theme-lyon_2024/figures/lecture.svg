<svg xmlns="http://www.w3.org/2000/svg" width="840" height="127" viewBox="0 0 840 127" role="img"><title>Le dernier membre de la phrase déplace le critère du romantisme, du motif représenté vers l’expérience sensible de l’artiste.</title><rect width="840" height="127" fill="white"/><rect x="5" y="6" width="260" height="115" rx="8" fill="#e4efec"/><text x="135" y="33" text-anchor="middle" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="600" fill="#344849">Sujet choisi</text><text x="135" y="70" text-anchor="middle" font-size="21" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#153d44">Les Anciens</text><text x="135" y="103" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="400" fill="#2c434a">motif représenté</text><path d="M267 64h17m-6-6 7 6-7 6" fill="none" stroke="#486a68" stroke-width="2"/><rect x="288" y="6" width="260" height="115" rx="8" fill="#e9edf2"/><text x="418" y="33" text-anchor="middle" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="600" fill="#344849">Exactitude</text><text x="418" y="70" text-anchor="middle" font-size="21" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#153d44">La couleur locale</text><text x="418" y="103" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="400" fill="#2c434a">détail vérifiable</text><path d="M550 64h17m-6-6 7 6-7 6" fill="none" stroke="#486a68" stroke-width="2"/><rect x="571" y="6" width="260" height="115" rx="8" fill="#f3eddf"/><text x="701" y="33" text-anchor="middle" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="600" fill="#344849">Manière de sentir</text><text x="701" y="70" text-anchor="middle" font-size="21" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#153d44">Le point décisif</text><text x="701" y="103" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="400" fill="#2c434a">disposition de l’artiste</text></svg>
