 <title id="figure-title">Inventaire territorial et empreinte de la consommation européenne</title>
 <desc id="figure-desc">Les émissions européennes destinées à la consommation européenne entrent dans les deux mesures. Les émissions européennes destinées à l’étranger comptent dans l’inventaire territorial. Les émissions étrangères destinées à l’Union européenne comptent dans l’empreinte. Schéma de comptabilité construit pour la lecture du document 2, p. 3 du fascicule. Les cases décrivent des périmètres, sans représenter des volumes.</desc>
