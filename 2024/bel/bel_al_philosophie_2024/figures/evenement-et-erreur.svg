<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 348" role="img" aria-labelledby="titre description"><title id="titre">Deux jugements sur une même perception</title><desc id="description">La réalité de l’expérience ne suffit pas à établir l’existence de l’objet qu’elle semblait donner.</desc><rect width="924" height="348" fill="#fff"/><g font-family="DejaVu Sans, sans-serif">
<text x="24" y="39" fill="#1e3440" font-size="25" font-weight="bold">Deux jugements sur une même perception</text>
<rect x="24" y="61" width="876" height="77" rx="7" fill="#e8f2f4"/>
<text x="39" y="89" fill="#1e3440" font-size="21" font-weight="bold">Le visiteur voit une poignée</text>
<text x="39" y="117" fill="#1e3440" font-size="18" font-weight="normal">La paroi peinte et le point de vue expliquent l’impression éprouvée.</text>
<path d="M46 138 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="154" width="876" height="77" rx="7" fill="#f7eee5"/>
<text x="39" y="182" fill="#1e3440" font-size="21" font-weight="bold">Il attend un passage</text>
<text x="39" y="210" fill="#1e3440" font-size="18" font-weight="normal">En avançant la main, il découvre que cette attente ne peut pas être satisfaite.</text>
<path d="M46 231 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="247" width="876" height="77" rx="7" fill="#f0ebf4"/>
<text x="39" y="275" fill="#1e3440" font-size="21" font-weight="bold">Il rectifie son jugement</text>
<text x="39" y="303" fill="#1e3440" font-size="18" font-weight="normal">La méprise a bien eu lieu. Ce qui lui manque est une porte utilisable.</text>
</g></svg>
