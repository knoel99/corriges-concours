<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 348" role="img" aria-labelledby="titre description"><title id="titre">Le dessin peut être achevé avant que la porte existe</title><desc id="description">Déterminer le contenu d’un projet et déterminer s’il est réalisé exigent des raisons différentes.</desc><rect width="924" height="348" fill="#fff"/><g font-family="DejaVu Sans, sans-serif">
<text x="24" y="39" fill="#1e3440" font-size="25" font-weight="bold">Le dessin peut être achevé avant que la porte existe</text>
<rect x="24" y="61" width="876" height="77" rx="7" fill="#e8f2f4"/>
<text x="39" y="89" fill="#1e3440" font-size="21" font-weight="bold">Concevoir</text>
<text x="39" y="117" fill="#1e3440" font-size="18" font-weight="normal">Les dimensions et les matériaux déterminent le type de porte prévu.</text>
<path d="M46 138 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="154" width="876" height="77" rx="7" fill="#f7eee5"/>
<text x="39" y="182" fill="#1e3440" font-size="21" font-weight="bold">Réaliser</text>
<text x="39" y="210" fill="#1e3440" font-size="18" font-weight="normal">L’aménagement du mur change les possibilités de passage dans le couloir.</text>
<path d="M46 231 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="247" width="876" height="77" rx="7" fill="#f0ebf4"/>
<text x="39" y="275" fill="#1e3440" font-size="21" font-weight="bold">Vérifier</text>
<text x="39" y="303" fill="#1e3440" font-size="18" font-weight="normal">La question « puis-je passer ici ? » porte sur cet agencement effectif.</text>
</g></svg>
