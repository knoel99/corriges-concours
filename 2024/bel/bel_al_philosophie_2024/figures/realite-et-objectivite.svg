<svg xmlns="http://www.w3.org/2000/svg" width="950" height="285" viewBox="0 0 950 285" role="img" aria-labelledby="titre desc"><title id="titre">Une même situation, trois affirmations à distinguer</title><desc id="desc">Vécu La douleur est éprouvée par une personne. Hypothèse Cette personne l’attribue à une fracture. Examen Une fracture écartée ne fait pas disparaître la douleur.</desc><rect width="950" height="285" fill="#f7f4ed"/><g fill="#23362f" font-family="DejaVu Sans,sans-serif"><text x="23" y="37" font-size="24" font-weight="bold">Une même situation, trois affirmations à distinguer</text><rect x="24" y="58" width="900" height="56" rx="8" fill="white" stroke="#859c8b"/><rect x="24" y="58" width="250" height="56" rx="8" fill="#365e50"/><text x="38" y="93" font-size="17" font-weight="bold" fill="white">Vécu</text><text x="290" y="93" font-size="17">La douleur est éprouvée par une personne.</text><path d="M146 114 v12 m-5 -4 l5 6 l5 -6" fill="none" stroke="#365e50" stroke-width="2.5"/><rect x="24" y="130" width="900" height="56" rx="8" fill="white" stroke="#859c8b"/><rect x="24" y="130" width="250" height="56" rx="8" fill="#365e50"/><text x="38" y="165" font-size="17" font-weight="bold" fill="white">Hypothèse</text><text x="290" y="165" font-size="17">Cette personne l’attribue à une fracture.</text><path d="M146 186 v12 m-5 -4 l5 6 l5 -6" fill="none" stroke="#365e50" stroke-width="2.5"/><rect x="24" y="202" width="900" height="56" rx="8" fill="white" stroke="#859c8b"/><rect x="24" y="202" width="250" height="56" rx="8" fill="#365e50"/><text x="38" y="237" font-size="17" font-weight="bold" fill="white">Examen</text><text x="290" y="237" font-size="17">Une fracture écartée ne fait pas disparaître la douleur.</text></g></svg>
