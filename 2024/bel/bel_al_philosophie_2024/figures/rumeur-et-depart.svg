<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 348" role="img" aria-labelledby="titre description"><title id="titre">La rumeur du train supprimé</title><desc id="description">L’effet de la croyance renseigne sur sa réalité comme croyance et laisse à vérifier son contenu.</desc><rect width="924" height="348" fill="#fff"/><g font-family="DejaVu Sans, sans-serif">
<text x="24" y="39" fill="#1e3440" font-size="25" font-weight="bold">La rumeur du train supprimé</text>
<rect x="24" y="61" width="876" height="77" rx="7" fill="#e8f2f4"/>
<text x="39" y="89" fill="#1e3440" font-size="21" font-weight="bold">Transmission</text>
<text x="39" y="117" fill="#1e3440" font-size="18" font-weight="normal">Un voyageur reçoit un message et croit que le train est supprimé.</text>
<path d="M46 138 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="154" width="876" height="77" rx="7" fill="#f7eee5"/>
<text x="39" y="182" fill="#1e3440" font-size="21" font-weight="bold">Conséquence</text>
<text x="39" y="210" fill="#1e3440" font-size="18" font-weight="normal">Il renonce au déplacement et manque son rendez-vous.</text>
<path d="M46 231 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="247" width="876" height="77" rx="7" fill="#f0ebf4"/>
<text x="39" y="275" fill="#1e3440" font-size="21" font-weight="bold">Contrôle indépendant</text>
<text x="39" y="303" fill="#1e3440" font-size="18" font-weight="normal">Le registre des départs montre pourtant que le train a circulé.</text>
</g></svg>
