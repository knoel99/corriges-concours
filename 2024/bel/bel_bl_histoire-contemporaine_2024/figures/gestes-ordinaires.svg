<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 204" width="780" height="204" role="img">
<rect x="0" y="0" width="780" height="50" fill="#203944" stroke="none"/>
<text x="9" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Situation</text>
<text x="205" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Règle imposée</text>
<text x="484" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Effet dans la vie ordinaire</text>
<rect x="0" y="51" width="780" height="50" fill="#edf4f0" stroke="none"/>
<text x="9" y="82" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Berlin, 1961</text>
<text x="205" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Fermeture de la frontière</text>
<text x="205" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">entre les deux secteurs</text>
<text x="484" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Visites familiales et trajets</text>
<text x="484" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">professionnels interrompus</text>
<rect x="0" y="102" width="780" height="50" fill="#f7f6ee" stroke="none"/>
<text x="9" y="133" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Ouganda, 1972</text>
<text x="205" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Ordre de départ visant des</text>
<text x="205" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">habitants d’origine asiatique</text>
<text x="484" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Perte du domicile ou du</text>
<text x="484" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">commerce, familles dispersées</text>
<rect x="0" y="153" width="780" height="50" fill="#edf4f0" stroke="none"/>
<text x="9" y="184" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Buenos Aires, 1977</text>
<text x="205" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Refus de renseigner les</text>
<text x="205" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">familles des disparus</text>
<text x="484" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Une démarche familiale</text>
<text x="484" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">devient une demande publique</text>
</svg>
