<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 204" width="780" height="204" role="img">
<rect x="0" y="0" width="780" height="50" fill="#203944" stroke="none"/>
<text x="9" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Trace</text>
<text x="205" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Ce qu’elle permet de voir</text>
<text x="484" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Ce qui reste à établir</text>
<rect x="0" y="51" width="780" height="50" fill="#edf4f0" stroke="none"/>
<text x="9" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Photo d’une sortie</text>
<text x="9" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">du Dopolavoro</text>
<text x="205" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Présence et activité collective</text>
<text x="205" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">organisée par le régime</text>
<text x="484" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Les raisons de participer</text>
<text x="484" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">et le plaisir éprouvé</text>
<rect x="0" y="102" width="780" height="50" fill="#f7f6ee" stroke="none"/>
<text x="9" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Dossier de police</text>
<text x="9" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">politique en RDA</text>
<text x="205" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Personnes surveillées et faits</text>
<text x="205" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">qui intéressent le service</text>
<text x="484" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">La justesse des soupçons</text>
<text x="484" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">et les solidarités ignorées</text>
<rect x="0" y="153" width="780" height="50" fill="#edf4f0" stroke="none"/>
<text x="9" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Témoignage après</text>
<text x="9" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">une transition</text>
<text x="205" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Sens rétrospectivement donné</text>
<text x="205" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">à une expérience vécue</text>
<text x="484" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">L’effet du temps écoulé</text>
<text x="484" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">et des silences du récit</text>
</svg>
