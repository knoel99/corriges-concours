<svg xmlns="http://www.w3.org/2000/svg" width="780" height="150" viewBox="0 0 780 150">
<rect width="780" height="150" fill="#f6f6f1"/>
<text x="13" y="24" text-anchor="start" font-family="DejaVu Sans" font-size="19" fill="#203944" font-weight="bold">Le vote, un apprentissage matériel et politique</text>
<rect x="10" y="39" width="245" height="30" rx="3" fill="#245361"/>
<text x="132" y="60" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="white" font-weight="bold">1913</text>
<text x="132" y="94" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#203944" font-weight="bold">Isoloir et enveloppe</text>
<text x="132" y="117" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#203944" font-weight="normal">Renforcer le secret du vote</text>
<rect x="267" y="39" width="245" height="30" rx="3" fill="#146f70"/>
<text x="389" y="60" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="white" font-weight="bold">1944-1945</text>
<text x="389" y="94" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#203944" font-weight="bold">Droit de vote des femmes</text>
<text x="389" y="117" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#203944" font-weight="normal">Premières élections en 1945</text>
<rect x="524" y="39" width="245" height="30" rx="3" fill="#805830"/>
<text x="646" y="60" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="white" font-weight="bold">1974</text>
<text x="646" y="94" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#203944" font-weight="bold">Majorité à 18 ans</text>
<text x="646" y="117" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#203944" font-weight="normal">Élargir le corps électoral</text>
</svg>
