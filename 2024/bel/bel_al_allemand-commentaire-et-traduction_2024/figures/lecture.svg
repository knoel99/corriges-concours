<svg xmlns="http://www.w3.org/2000/svg" width="880" height="226" viewBox="0 0 880 226" role="img"><title>Deux trajets dans la maison</title><defs><marker id="end" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#496976"/></marker></defs><rect width="880" height="226" fill="white"/><rect x="294" y="14" width="298" height="75" rx="8" fill="#f4ecde"/><text x="443.0" y="48.5" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Dans la mansarde</text><text x="443.0" y="77.5" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">les pages restent au tiroir</text><rect x="16" y="135" width="300" height="78" rx="8" fill="#e4f0ee"/><text x="166.0" y="171.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Dans la cuisine</text><text x="166.0" y="200.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">elle ouvre l’enveloppe</text><rect x="566" y="135" width="298" height="78" rx="8" fill="#e8edf5"/><text x="715.0" y="171.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">De retour à la cuisine</text><text x="715.0" y="200.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">elle prépare le strudel</text><path d="M169 128 L330 91" stroke="#496976" stroke-width="2.5" fill="none" marker-end="url(#end)"/><path d="M553 92 L715 128" stroke="#496976" stroke-width="2.5" fill="none" marker-end="url(#end)"/></svg>
