<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Du chevet imaginé au souvenir de Paris</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Du chevet imaginé au souvenir de Paris</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">À bord</text>
<text x="205" y="62" font-size="15">Le petit-fils répète à l’avance son rôle</text>
<text x="205" y="79" font-size="15">de visiteur.</text>
<text x="524" y="70" font-size="15">Avrei dovuto</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">À Cherbourg</text>
<text x="205" y="123" font-size="15">Le grand-père est déjà là, canne et</text>
<text x="205" y="140" font-size="15">chapeau en scène.</text>
<text x="524" y="131" font-size="15">Mi pare di vederlo</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">À Paris</text>
<text x="205" y="184" font-size="15">Les soirées se répètent puis le</text>
<text x="205" y="201" font-size="15">narrateur connaît la fin.</text>
<text x="524" y="192" font-size="15">Sarebbe vissuto</text>
</g></svg>
