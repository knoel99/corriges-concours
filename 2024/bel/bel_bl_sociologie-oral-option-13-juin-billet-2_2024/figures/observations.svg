<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-labelledby="t"><title id="t">Comment un classement administratif devient-il effectif ?</title><rect width="860" height="220" fill="#fff"/><g font-family="DejaVu Sans,sans-serif" fill="#193641"><text x="15" y="32" font-size="24" font-weight="bold">Comment un classement administratif devient-il effectif ?</text><rect x="15" y="53" width="830" height="45" fill="#e4eeed"/><text x="26" y="81" font-weight="bold" font-size="17">Enregistrement</text><text x="270" y="81" font-size="17">L’âge est inscrit à l’état civil.</text><rect x="15" y="106" width="830" height="45" fill="#eff3f4"/><text x="26" y="134" font-weight="bold" font-size="17">Droit formel</text><text x="270" y="134" font-size="17">Une règle donne un seuil pour voter.</text><rect x="15" y="159" width="830" height="45" fill="#e8eef5"/><text x="26" y="187" font-weight="bold" font-size="17">Pratique effective</text><text x="270" y="187" font-size="17">L’inscription et la participation se constatent.</text></g></svg>
