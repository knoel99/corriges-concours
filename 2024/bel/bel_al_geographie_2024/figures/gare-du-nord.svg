<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 348" role="img" aria-labelledby="titre description"><title id="titre">Une gare parisienne, plusieurs régimes de passage</title><desc id="description">Schéma fonctionnel de la gare du Nord. Le voyageur qui prend un train pour Londres rejoint des contrôles juxtaposés avant le quai. Le voyageur vers Bruxelles ou une banlieue parisienne emprunte un autre circuit.</desc><rect width="886" height="348" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="18" y="33" fill="#243a47" font-size="24" font-weight="bold" >Une gare parisienne, plusieurs régimes de passage</text>
<text x="18" y="59" fill="#243a47" font-size="16" font-weight="normal" >Gare du Nord, parcours schématiques des voyageurs au départ</text>
<text x="32" y="174" fill="#243a47" font-size="19" font-weight="bold" >Entrer</text>
<text x="32" y="201" fill="#243a47" font-size="17" font-weight="normal" >en gare</text>
<path d="M113 179 L160 179" fill="none" stroke="#243a47" stroke-width="2"/>
<path d="M160 109 L160 250" fill="none" stroke="#243a47" stroke-width="2"/>
<path d="M160 119 L183 119" fill="none" stroke="#243a47" stroke-width="2"/>
<path d="M182 115l6 4 -6 4Z" fill="#243a47"/>
<rect x="192" y="81" width="487" height="87" fill="#e5f1ee" rx="5"/>
<text x="205" y="110" fill="#243a47" font-size="17" font-weight="bold" >Destination Londres</text>
<text x="205" y="137" fill="#243a47" font-size="15" font-weight="normal" >Contrôles français et britanniques avant le départ.</text>
<path d="M679 124 L707 124" fill="none" stroke="#243a47" stroke-width="2"/>
<path d="M706 120l6 4 -6 4Z" fill="#243a47"/>
<text x="719" y="131" fill="#243a47" font-size="16" font-weight="bold" >Quai Eurostar</text>
<path d="M160 240 L183 240" fill="none" stroke="#243a47" stroke-width="2"/>
<path d="M182 236l6 4 -6 4Z" fill="#243a47"/>
<rect x="192" y="202" width="487" height="87" fill="#f5edde" rx="5"/>
<text x="205" y="231" fill="#243a47" font-size="17" font-weight="bold" >Destination Bruxelles ou Île-de-France</text>
<text x="205" y="258" fill="#243a47" font-size="15" font-weight="normal" >Pas de passage régulier par le circuit frontalier londonien.</text>
<path d="M679 245 L707 245" fill="none" stroke="#243a47" stroke-width="2"/>
<path d="M706 241l6 4 -6 4Z" fill="#243a47"/>
<text x="719" y="252" fill="#243a47" font-size="16" font-weight="bold" >Quais concernés</text>
<text x="18" y="323" fill="#243a47" font-size="14" font-weight="normal" >Le schéma distingue les fonctions des circuits. Il ne représente pas un plan des quais.</text>
</g></svg>
