 <title id="figure-title">Accessibilité aux médecins généralistes en France hors Mayotte</title>
 <desc id="figure-desc">Pour les 10 % d’habitants les mieux dotés, l’accessibilité passe de 5,9 consultations ou visites par an et par habitant standardisé en 2016 à 5,7 en 2019. Chez les 10 % les moins bien dotés, elle passe de 1,8 à 1,6. Le rapport publié passe de 3,2 à 3,5. Tableau de la DREES, document 1, p. 2 du fascicule. Les valeurs représentées sont arrondies. Le rapport publié repose sur les données avant arrondi.</desc>
