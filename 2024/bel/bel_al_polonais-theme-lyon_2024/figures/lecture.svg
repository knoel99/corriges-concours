<svg xmlns="http://www.w3.org/2000/svg" width="840" height="127" viewBox="0 0 840 127" role="img"><title>Do wieczora traverse trois situations. Manuel emploie les mêmes mots que les époux dans le message qui fait battre le cœur d’Hélène.</title><rect width="840" height="127" fill="white"/><rect x="5" y="6" width="260" height="115" rx="8" fill="#e4efec"/><text x="135" y="33" text-anchor="middle" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="600" fill="#344849">Philippe → Hélène</text><text x="135" y="70" text-anchor="middle" font-size="21" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#153d44">do wieczora</text><text x="135" y="103" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="400" fill="#2c434a">départ de la maison</text><path d="M267 64h17m-6-6 7 6-7 6" fill="none" stroke="#486a68" stroke-width="2"/><rect x="288" y="6" width="260" height="115" rx="8" fill="#e9edf2"/><text x="418" y="33" text-anchor="middle" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="600" fill="#344849">Hélène → Philippe</text><text x="418" y="70" text-anchor="middle" font-size="21" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#153d44">do wieczora</text><text x="418" y="103" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="400" fill="#2c434a">réponse ordinaire</text><path d="M550 64h17m-6-6 7 6-7 6" fill="none" stroke="#486a68" stroke-width="2"/><rect x="571" y="6" width="260" height="115" rx="8" fill="#f3eddf"/><text x="701" y="33" text-anchor="middle" font-size="18" font-family="DejaVu Sans,sans-serif" font-weight="600" fill="#344849">Manuel → Hélène</text><text x="701" y="70" text-anchor="middle" font-size="21" font-family="DejaVu Sans,sans-serif" font-weight="700" fill="#153d44">do wieczora</text><text x="701" y="103" text-anchor="middle" font-size="17" font-family="DejaVu Sans,sans-serif" font-weight="400" fill="#2c434a">promesse sur écran</text></svg>
