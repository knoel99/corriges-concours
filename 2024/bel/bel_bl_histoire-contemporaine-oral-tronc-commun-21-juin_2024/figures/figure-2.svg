<svg xmlns="http://www.w3.org/2000/svg" width="780" height="150" viewBox="0 0 780 150">
<rect width="780" height="150" fill="#f6f6f1"/>
<text x="13" y="24" text-anchor="start" font-family="DejaVu Sans" font-size="19" fill="#203944" font-weight="bold">Deux frontières construites pendant la guerre froide</text>
<rect x="10" y="39" width="245" height="30" rx="3" fill="#245361"/>
<text x="132" y="60" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="white" font-weight="bold">Berlin</text>
<text x="132" y="94" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#203944" font-weight="bold">Mur à partir de 1961</text>
<text x="132" y="117" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#203944" font-weight="normal">Séparation au sein de la ville</text>
<rect x="267" y="39" width="245" height="30" rx="3" fill="#146f70"/>
<text x="389" y="60" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="white" font-weight="bold">Corée</text>
<text x="389" y="94" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#203944" font-weight="bold">Armistice en 1953</text>
<text x="389" y="117" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#203944" font-weight="normal">Zone démilitarisée</text>
<rect x="524" y="39" width="245" height="30" rx="3" fill="#805830"/>
<text x="646" y="60" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="white" font-weight="bold">1989-1990</text>
<text x="646" y="94" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#203944" font-weight="bold">Évolutions divergentes</text>
<text x="646" y="117" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#203944" font-weight="normal">Ouverture à Berlin, Corée</text>
<text x="646" y="134" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#203944" font-weight="normal">divisée</text>
</svg>
