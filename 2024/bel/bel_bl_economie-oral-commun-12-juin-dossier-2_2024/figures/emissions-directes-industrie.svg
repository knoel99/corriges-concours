 <title id="figure-title">Émissions directes de l’industrie manufacturière en France</title>
 <desc id="figure-desc">Les émissions directes passent de 139,3 Mt équivalent CO₂ en 1990 à 76,3 en 2019. La baisse atteint 63,0 Mt, soit 45,2 % de la valeur de 1990. Calcul aux deux dates du document 2, graphique 2 de la DGE. Le total couvre les émissions directes territoriales. Isoler les effets du volume produit, de la composition et de l’efficacité exige une décomposition.</desc>
