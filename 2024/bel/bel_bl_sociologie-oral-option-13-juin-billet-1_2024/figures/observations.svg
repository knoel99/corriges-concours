<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-labelledby="t"><title id="t">Dans un atelier, trois observations distinctes</title><rect width="860" height="220" fill="#fff"/><g font-family="DejaVu Sans,sans-serif" fill="#193641"><text x="15" y="32" font-size="24" font-weight="bold">Dans un atelier, trois observations distinctes</text><rect x="15" y="53" width="830" height="45" fill="#e4eeed"/><text x="26" y="81" font-weight="bold" font-size="17">Équipe prescrite</text><text x="270" y="81" font-size="17">Le chef affiche une liste de postes.</text><rect x="15" y="106" width="830" height="45" fill="#eff3f4"/><text x="26" y="134" font-weight="bold" font-size="17">Entraide observée</text><text x="270" y="134" font-size="17">Un ancien aide une recrue en cas de panne.</text><rect x="15" y="159" width="830" height="45" fill="#e8eef5"/><text x="26" y="187" font-weight="bold" font-size="17">Revendication collective</text><text x="270" y="187" font-size="17">Plusieurs ouvriers demandent une prime.</text></g></svg>
