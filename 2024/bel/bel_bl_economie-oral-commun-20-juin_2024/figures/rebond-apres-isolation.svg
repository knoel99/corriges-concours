 <title id="figure-title">Calcul de l’effet rebond après isolation</title>
 <desc id="figure-desc">Dans cet exemple, l’énergie consommée vaut 100 avant rénovation, 60 après rénovation à confort constant et 75 après adaptation des usages. Sur les 40 unités d’économie technique, 15 sont reprises et 25 économisées. Le taux de rebond est de 37,5 %. Exemple chiffré construit pour expliquer le mécanisme du document 2, p. 3 du fascicule. La consommation initiale est fixée à 100 unités.</desc>
