<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-labelledby="t"><title id="t">Mettre à l’épreuve un effet du soutien de voisinage</title><rect width="860" height="220" fill="#fff"/><g font-family="DejaVu Sans,sans-serif" fill="#193641"><text x="15" y="32" font-size="24" font-weight="bold">Mettre à l’épreuve un effet du soutien de voisinage</text><rect x="15" y="53" width="830" height="45" fill="#e4eeed"/><text x="26" y="81" font-weight="bold" font-size="17">Première comparaison</text><text x="270" y="81" font-size="17">Comparer des enfants du même âge.</text><rect x="15" y="106" width="830" height="45" fill="#eff3f4"/><text x="26" y="134" font-weight="bold" font-size="17">Explication concurrente</text><text x="270" y="134" font-size="17">Relever aussi horaires et ressources familiales.</text><rect x="15" y="159" width="830" height="45" fill="#e8eef5"/><text x="26" y="187" font-weight="bold" font-size="17">Épreuve empirique</text><text x="270" y="187" font-size="17">Chercher si le lien persiste à ressources proches.</text></g></svg>
