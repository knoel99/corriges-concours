<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-labelledby="t"><title id="t">Comment identifier une relation de représentation ?</title><rect width="860" height="220" fill="#fff"/><g font-family="DejaVu Sans,sans-serif" fill="#193641"><text x="15" y="32" font-size="24" font-weight="bold">Comment identifier une relation de représentation ?</text><rect x="15" y="53" width="830" height="45" fill="#e4eeed"/><text x="26" y="81" font-weight="bold" font-size="17">Désignation</text><text x="270" y="81" font-size="17">Un vote ou des statuts autorisent la parole.</text><rect x="15" y="106" width="830" height="45" fill="#eff3f4"/><text x="26" y="134" font-weight="bold" font-size="17">Contrôle en cours</text><text x="270" y="134" font-size="17">Des membres contestent un mot d’ordre.</text><rect x="15" y="159" width="830" height="45" fill="#e8eef5"/><text x="26" y="187" font-weight="bold" font-size="17">Reddition de comptes</text><text x="270" y="187" font-size="17">Le mandat peut être renouvelé ou retiré.</text></g></svg>
