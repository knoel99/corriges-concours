<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 348" role="img" aria-labelledby="titre description"><title id="titre">Trois circuits de recrutement à comparer</title><desc id="description">Des produits destinés au marché mondial peuvent mobiliser une main-d’œuvre régionale ou intercontinentale.</desc><rect width="924" height="348" fill="#fff"/><g font-family="DejaVu Sans, sans-serif">
<text x="24" y="39" fill="#1e3440" font-size="25" font-weight="bold">Trois circuits de recrutement à comparer</text>
<rect x="24" y="61" width="876" height="77" rx="7" fill="#e8f2f4"/>
<text x="39" y="89" fill="#1e3440" font-size="21" font-weight="bold">Italie vers Argentine</text>
<text x="39" y="117" fill="#1e3440" font-size="18" font-weight="normal">Les récoltes de la Pampa attirent notamment des ouvriers saisonniers.</text>
<path d="M46 138 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="154" width="876" height="77" rx="7" fill="#f7eee5"/>
<text x="39" y="182" fill="#1e3440" font-size="21" font-weight="bold">Inde du Sud vers Ceylan et Malaisie</text>
<text x="39" y="210" fill="#1e3440" font-size="18" font-weight="normal">Les recruteurs du système kangani s’appuient sur les attaches villageoises.</text>
<path d="M46 231 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="247" width="876" height="77" rx="7" fill="#f0ebf4"/>
<text x="39" y="275" fill="#1e3440" font-size="21" font-weight="bold">Japon vers Brésil</text>
<text x="39" y="303" fill="#1e3440" font-size="18" font-weight="normal">En 1908, le Kasato Maru transporte des migrants recrutés pour les plantations de café.</text>
</g></svg>
