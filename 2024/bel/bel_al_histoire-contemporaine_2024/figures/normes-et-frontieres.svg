<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 348" role="img" aria-labelledby="titre description"><title id="titre">Deux régulations internationales dans l’entre-deux-guerres</title><desc id="description">La fermeture de certaines routes migratoires et la diffusion de normes communes peuvent être simultanées.</desc><rect width="924" height="348" fill="#fff"/><g font-family="DejaVu Sans, sans-serif">
<text x="24" y="39" fill="#1e3440" font-size="25" font-weight="bold">Deux régulations internationales dans l’entre-deux-guerres</text>
<rect x="24" y="61" width="876" height="77" rx="7" fill="#e8f2f4"/>
<text x="39" y="89" fill="#1e3440" font-size="21" font-weight="bold">Entrer et séjourner</text>
<text x="39" y="117" fill="#1e3440" font-size="18" font-weight="normal">Accords de recrutement, quotas par origine et exclusions sélectionnent les travailleurs.</text>
<path d="M46 138 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="154" width="876" height="77" rx="7" fill="#f7eee5"/>
<text x="39" y="182" fill="#1e3440" font-size="21" font-weight="bold">Régler le travail</text>
<text x="39" y="210" fill="#1e3440" font-size="18" font-weight="normal">Convention sur la durée du travail dans l’industrie en 1919, sur le travail forcé en 1930.</text>
<path d="M46 231 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="247" width="876" height="77" rx="7" fill="#f0ebf4"/>
<text x="39" y="275" fill="#1e3440" font-size="21" font-weight="bold">Vérifier les effets</text>
<text x="39" y="303" fill="#1e3440" font-size="18" font-weight="normal">Comparer la portée juridique d’un texte avec son application dans les lieux de travail.</text>
</g></svg>
