<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" role="img" aria-labelledby="titre desc"><title id="titre">Les routes du travail pendant la Grande Guerre</title><desc id="desc">Une diminution des arrivées européennes et une hausse des besoins de production accompagnent un recrutement chinois transcontinental et une migration intérieure aux États-Unis, dans des contextes différents.</desc><rect width="940" height="355" fill="#ffffff"/><g font-family="DejaVu Sans, sans-serif">
<text x="24" y="37" fill="#203944" font-size="25" font-weight="bold">Comment la guerre modifie les routes du travail</text>
<rect x="24" y="57" width="892" height="63" rx="8" fill="#eaf1f5"/>
<text x="42" y="84" fill="#203944" font-size="19" font-weight="bold">Des besoins de main-d’œuvre transformés</text>
<text x="42" y="108" fill="#203944" font-size="18" font-weight="normal">Les mobilisations et les commandes industrielles modifient les recrutements.</text>
<path d="M470 120 v25 H242 v22 M470 145 H698 v22" fill="none" stroke="#4c626d" stroke-width="2.6"/>
<rect x="24" y="165" width="437" height="158" rx="8" fill="#e9f4ed"/>
<text x="38" y="194" fill="#203944" font-size="21" font-weight="bold">Chine → Europe</text>
<text x="38" y="220" fill="#203944" font-size="17" font-weight="normal">Recrutement de travailleurs chinois par</text>
<text x="38" y="243" fill="#203944" font-size="17" font-weight="normal">les autorités françaises et britanniques.</text>
<text x="38" y="266" fill="#203944" font-size="17" font-weight="normal">Dans le corps britannique, des équipes</text>
<text x="38" y="289" fill="#203944" font-size="17" font-weight="normal">effectuent des travaux de manutention.</text>
<rect x="479" y="165" width="437" height="158" rx="8" fill="#f7eee5"/>
<text x="493" y="194" fill="#203944" font-size="21" font-weight="bold">Sud → Nord des États-Unis</text>
<text x="493" y="220" fill="#203944" font-size="17" font-weight="normal">La contraction des arrivées européennes</text>
<text x="493" y="243" fill="#203944" font-size="17" font-weight="normal">et les emplois industriels contribuent à la</text>
<text x="493" y="266" fill="#203944" font-size="17" font-weight="normal">Grande Migration. Familles, salaires et</text>
<text x="493" y="289" fill="#203944" font-size="17" font-weight="normal">ségrégation orientent aussi les départs.</text>
</g></svg>
