<svg xmlns="http://www.w3.org/2000/svg" width="880" height="215" viewBox="0 0 880 215" role="img"><title>Distinguer l’objet de l’expérience et sa voie d’accès</title><defs><marker id="end" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#496976"/></marker></defs><rect width="880" height="215" fill="white"/><rect x="18" y="18" width="265" height="86" rx="8" fill="#e4f0ee"/><text x="150.5" y="58.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Une absence</text><text x="150.5" y="87.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">le fauteuil vide</text><rect x="308" y="18" width="265" height="86" rx="8" fill="#f4ecde"/><text x="440.5" y="58.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Une relation physique</text><text x="440.5" y="87.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">la colonne de mercure</text><rect x="598" y="18" width="265" height="86" rx="8" fill="#e8edf5"/><text x="730.5" y="58.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">La douleur d’autrui</text><text x="730.5" y="87.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">le geste ou le témoignage</text><text x="150" y="143" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Une attente est déçue.</text><text x="441" y="143" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Une hypothèse est testée.</text><text x="734" y="143" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Une autre personne parle.</text><text x="440" y="193" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400">L’accès détermine ce que l’on peut effectivement dire avoir éprouvé.</text></svg>
