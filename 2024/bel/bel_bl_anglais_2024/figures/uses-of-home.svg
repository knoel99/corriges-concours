<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 204" width="780" height="204" role="img">
<rect x="0" y="0" width="780" height="50" fill="#203944" stroke="none"/>
<text x="9" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Speaker and setting</text>
<text x="205" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">What the home represents</text>
<text x="484" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Political claim</text>
<rect x="0" y="51" width="780" height="50" fill="#edf4f0" stroke="none"/>
<text x="9" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Bodichon, 1866</text>
<text x="9" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">a reform audience</text>
<text x="205" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Responsibilities already borne</text>
<text x="205" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">by women who pay taxes</text>
<text x="484" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">A voice in making the laws</text>
<text x="484" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">that govern their lives</text>
<rect x="0" y="102" width="780" height="50" fill="#f7f6ee" stroke="none"/>
<text x="9" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Friedan, 1963</text>
<text x="9" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">American readers</text>
<text x="205" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">An ideal that makes shared</text>
<text x="205" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">discontent hard to express</text>
<text x="484" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">A vocabulary for aspirations</text>
<text x="484" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">beyond full-time homemaking</text>
<rect x="0" y="153" width="780" height="50" fill="#edf4f0" stroke="none"/>
<text x="9" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Thatcher, 1988</text>
<text x="9" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Conservative women</text>
<text x="205" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Work whose skills can qualify</text>
<text x="205" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">a woman for public office</text>
<text x="484" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">More women candidates and</text>
<text x="484" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">continued esteem for family care</text>
</svg>
