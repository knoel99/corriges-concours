<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 204" width="780" height="204" role="img">
<rect x="0" y="0" width="780" height="50" fill="#203944" stroke="none"/>
<text x="9" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Date and place</text>
<text x="205" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Opening in law</text>
<text x="484" y="31" font-family="DejaVu Sans" font-size="15" fill="white" text-anchor="start" font-weight="bold">Limits and differences</text>
<rect x="0" y="51" width="780" height="50" fill="#edf4f0" stroke="none"/>
<text x="9" y="82" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Britain, 1918</text>
<text x="205" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Some women aged 30 or over</text>
<text x="205" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">gain the parliamentary vote.</text>
<text x="484" y="71" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Age and property-related rules</text>
<text x="484" y="90" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">exclude many women.</text>
<rect x="0" y="102" width="780" height="50" fill="#f7f6ee" stroke="none"/>
<text x="9" y="133" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">United States, 1920</text>
<text x="205" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">The Nineteenth Amendment</text>
<text x="205" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">bars sex-based voting denial.</text>
<text x="484" y="122" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Jim Crow practices continue</text>
<text x="484" y="141" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">to exclude Black voters.</text>
<rect x="0" y="153" width="780" height="50" fill="#edf4f0" stroke="none"/>
<text x="9" y="184" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Britain, 1928</text>
<text x="205" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Women vote on the same age</text>
<text x="205" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">terms as men, from 21.</text>
<text x="484" y="173" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">Party selection and domestic</text>
<text x="484" y="192" font-family="DejaVu Sans" font-size="15" fill="#203944" text-anchor="start" font-weight="normal">labour still shape access to office.</text>
</svg>
