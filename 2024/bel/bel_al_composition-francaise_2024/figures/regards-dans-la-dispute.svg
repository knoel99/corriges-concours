<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 348" role="img" aria-labelledby="titre description"><title id="titre">Trois places pour regarder dans La Dispute</title><desc id="description">Le spectateur de la comédie peut voir le dispositif qui demeure caché aux jeunes gens.</desc><rect width="924" height="348" fill="#fff"/><g font-family="DejaVu Sans, sans-serif">
<text x="24" y="39" fill="#1e3440" font-size="25" font-weight="bold">Trois places pour regarder dans La Dispute</text>
<rect x="24" y="61" width="876" height="77" rx="7" fill="#e8f2f4"/>
<text x="39" y="89" fill="#1e3440" font-size="21" font-weight="bold">Églé se regarde</text>
<text x="39" y="117" fill="#1e3440" font-size="18" font-weight="normal">Le reflet dans l’eau surprend celle qui découvre son visage.</text>
<path d="M46 138 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="154" width="876" height="77" rx="7" fill="#f7eee5"/>
<text x="39" y="182" fill="#1e3440" font-size="21" font-weight="bold">Le prince et Hermiane observent</text>
<text x="39" y="210" fill="#1e3440" font-size="18" font-weight="normal">Le spectacle qu’ils regardent repose sur une éducation organisée en secret.</text>
<path d="M46 231 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="247" width="876" height="77" rx="7" fill="#f0ebf4"/>
<text x="39" y="275" fill="#1e3440" font-size="21" font-weight="bold">Le public du théâtre voit aussi les observateurs</text>
<text x="39" y="303" fill="#1e3440" font-size="18" font-weight="normal">Il peut interroger les conditions de l’expérience et la question posée par le prince.</text>
</g></svg>
