<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 348" role="img" aria-labelledby="titre description"><title id="titre">Que change le dénouement pour la lecture de la comédie ?</title><desc id="description">La satisfaction des personnages et le jugement du spectateur peuvent diverger.</desc><rect width="924" height="348" fill="#fff"/><g font-family="DejaVu Sans, sans-serif">
<text x="24" y="39" fill="#1e3440" font-size="25" font-weight="bold">Que change le dénouement pour la lecture de la comédie ?</text>
<rect x="24" y="61" width="876" height="77" rx="7" fill="#e8f2f4"/>
<text x="39" y="89" fill="#1e3440" font-size="21" font-weight="bold">Au début</text>
<text x="39" y="117" fill="#1e3440" font-size="18" font-weight="normal">Silvia et Arlequin ont été séparés à la demande du prince.</text>
<path d="M46 138 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="154" width="876" height="77" rx="7" fill="#f7eee5"/>
<text x="39" y="182" fill="#1e3440" font-size="21" font-weight="bold">Dans le palais</text>
<text x="39" y="210" fill="#1e3440" font-size="18" font-weight="normal">Flaminia agit sur les rencontres et gagne peu à peu la confiance d’Arlequin.</text>
<path d="M46 231 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="247" width="876" height="77" rx="7" fill="#f0ebf4"/>
<text x="39" y="275" fill="#1e3440" font-size="21" font-weight="bold">À la fin</text>
<text x="39" y="303" fill="#1e3440" font-size="18" font-weight="normal">Les sentiments ont changé. Le public connaît toujours les conditions de ce changement.</text>
</g></svg>
