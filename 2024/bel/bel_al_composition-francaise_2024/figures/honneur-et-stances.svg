<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 348" role="img" aria-labelledby="titre description"><title id="titre">L’intervalle ouvert par les stances de Rodrigue</title><desc id="description">La variation du vers fait éprouver le coût d’un geste que commande le code de l’honneur.</desc><rect width="924" height="348" fill="#fff"/><g font-family="DejaVu Sans, sans-serif">
<text x="24" y="39" fill="#1e3440" font-size="25" font-weight="bold">L’intervalle ouvert par les stances de Rodrigue</text>
<rect x="24" y="61" width="876" height="77" rx="7" fill="#e8f2f4"/>
<text x="39" y="89" fill="#1e3440" font-size="21" font-weight="bold">Geste du père</text>
<text x="39" y="117" fill="#1e3440" font-size="18" font-weight="normal">Don Diègue remet son épée à son fils et fait de la vengeance une dette.</text>
<path d="M46 138 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="154" width="876" height="77" rx="7" fill="#f7eee5"/>
<text x="39" y="182" fill="#1e3440" font-size="21" font-weight="bold">Temps du fils</text>
<text x="39" y="210" fill="#1e3440" font-size="18" font-weight="normal">Dans les stances, les deux fidélités incompatibles se font entendre tour à tour.</text>
<path d="M46 231 v12 m-3 -3 l3 3 3 -3" fill="none" stroke="#4a656a" stroke-width="2"/>
<rect x="24" y="247" width="876" height="77" rx="7" fill="#f0ebf4"/>
<text x="39" y="275" fill="#1e3440" font-size="21" font-weight="bold">Expérience du spectateur</text>
<text x="39" y="303" fill="#1e3440" font-size="18" font-weight="normal">Entre la remise de l’épée et le duel, la décision cesse de paraître immédiate.</text>
</g></svg>
