<svg xmlns="http://www.w3.org/2000/svg" width="780" height="174" viewBox="0 0 780 174" role="img"><title>Où et quand la parole du guide est-elle entendue ?</title><rect width="780" height="174" fill="white"/><rect x="8" y="12" width="249" height="148" rx="6" fill="#eef4f7" stroke="#2a586a"/><text x="132.5" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2a586a">Posadas</text><text x="132.5" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#2a586a">Le témoin écoute</text><text x="132.5" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#2a586a">le guide près de l’école</text><rect x="266" y="12" width="249" height="148" rx="6" fill="#edf5f1" stroke="#1f6d62"/><text x="390.5" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f6d62">Les chutes en mémoire</text><text x="390.5" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1f6d62">Les anciens visiteurs</text><text x="390.5" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#1f6d62">écoutaient les poèmes</text><rect x="524" y="12" width="249" height="148" rx="6" fill="#f7f2ea" stroke="#79532c"/><text x="648.5" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#79532c">Retour à Posadas</text><text x="648.5" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#79532c">Le groupe revient</text><text x="648.5" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#79532c">la parole reste en suspens</text></svg>