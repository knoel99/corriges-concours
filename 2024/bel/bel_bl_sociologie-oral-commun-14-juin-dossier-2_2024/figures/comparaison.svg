<svg xmlns="http://www.w3.org/2000/svg" width="870" height="252" viewBox="0 0 870 252" role="img" aria-labelledby="t"><title id="t">Part pessimiste pour son propre avenir</title><rect width="870" height="252" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#193641"><text x="12" y="29" font-size="23" font-weight="bold">Part pessimiste pour son propre avenir</text><rect x="15" y="48" width="18" height="13" fill="#17636a"/><text x="40" y="61" font-size="17">se déclare pauvre</text><rect x="370" y="48" width="18" height="13" fill="#ad5729"/><text x="395" y="61" font-size="17">ne se déclare pas pauvre</text><text x="15" y="104" font-size="18">Sous le seuil de pauvreté</text><rect x="272" y="83" width="413.3" height="14" fill="#17636a"/><text x="692.3" y="96" font-size="15">62 %</text><rect x="272" y="103" width="293.3" height="14" fill="#ad5729"/><text x="572.3" y="116" font-size="15">44 %</text><text x="15" y="160" font-size="18">Au-dessus du seuil</text><rect x="272" y="139" width="420.0" height="14" fill="#17636a"/><text x="699.0" y="152" font-size="15">63 %</text><rect x="272" y="159" width="260.0" height="14" fill="#ad5729"/><text x="539.0" y="172" font-size="15">39 %</text><text x="15" y="216" font-size="18">Ensemble</text><rect x="272" y="195" width="420.0" height="14" fill="#17636a"/><text x="699.0" y="208" font-size="15">63 %</text><rect x="272" y="215" width="266.7" height="14" fill="#ad5729"/><text x="545.7" y="228" font-size="15">40 %</text></g></svg>
