<svg xmlns="http://www.w3.org/2000/svg" width="850" height="272" viewBox="0 0 850 272" role="img"><title>Deux dessertes soumises au même vote</title><desc>Un vote décide du tracé. Le tableau permet ensuite de discuter la répartition des temps de trajet.</desc><rect x="0" y="0" width="850" height="272" fill="#faf9f3"/><text x="25" y="36" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#1d434d">Deux dessertes soumises au même vote</text><text x="29" y="84" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#1d434d">Projet fictif</text><text x="267" y="84" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#1d434d">Centre → mairie</text><text x="536" y="84" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#1d434d">Hameau → mairie</text><rect x="24" y="104" width="797" height="40" fill="#e1ece6"/><text x="29" y="131" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#1d434d">A</text><text x="270" y="131" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#1d434d">10 minutes</text><text x="541" y="131" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#1d434d">60 minutes</text><rect x="24" y="151" width="797" height="40" fill="#eee5d4"/><text x="29" y="178" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#1d434d">B</text><text x="270" y="178" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#1d434d">14 minutes</text><text x="541" y="178" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#1d434d">28 minutes</text><text x="26" y="224" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Supposons que 51 habitants préfèrent A et 49, B.</text><text x="26" y="251" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Quel temps maximal doit rester acceptable dans chaque quartier ?</text></svg>
