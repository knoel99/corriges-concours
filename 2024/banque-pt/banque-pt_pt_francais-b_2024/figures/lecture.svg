<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Qui peut reconnaître le mensonge dès le début ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Qui peut reconnaître le mensonge dès le début ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Tourvel</text>
<text x="201" y="71" font-size="15" font-weight="400" fill="#203c49">Elle reçoit une lettre sans voir sa rédaction.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">Apparence sincère</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Le lecteur de Laclos</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">La lettre à Merteuil lui a donné la seconde</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">scène.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Double sens lisible</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Le public d’Arendt</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Il confronte discours publics et documents</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">rendus publics.</text>
<text x="549" y="180" font-size="14" font-weight="700" fill="#203c49">Vérification des</text>
<text x="549" y="197" font-size="14" font-weight="700" fill="#203c49">faits</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
