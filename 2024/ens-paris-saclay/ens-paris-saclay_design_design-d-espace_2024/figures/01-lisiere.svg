<text x="14" y="249" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">Vue d’approche depuis le chemin</text>
<text x="14" y="258" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une façade basse regarde l’eau. À l’arrière, le toit se relève vers le chemin pour éclairer le coin de</text>
<text x="14" y="263" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">repas.</text>
