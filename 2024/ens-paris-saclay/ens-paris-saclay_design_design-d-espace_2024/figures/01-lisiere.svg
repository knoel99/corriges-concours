<text x="282" y="72" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="700" fill="#3b665b" text-anchor="start">Croquis de situation</text>
<text x="283" y="144" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Pont</text>
<path d="M295 141 L323 122" stroke="#212e2c" stroke-width="0.65" fill="none"/>
<text x="365" y="107" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Verdon</text>
<text x="281" y="189" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Lire la pièce jointe</text>
<text x="281" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Le lac, la route et le pont sont visibles</text>
<text x="281" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">sur les vues fournies. Les modules indiquent</text>
<text x="281" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">une hypothèse d’implantation à vérifier sur</text>
<text x="281" y="214" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">place.</text>
<text x="281" y="230" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Relever pente, crues, racines et accès avant</text>
<text x="281" y="235" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">tout choix réel. Orienter la fenêtre après</text>
<text x="281" y="240" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">repérage de la vue et des vents.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Le croquis situe le principe sans fixer de parcelle. Le chemin de desserte s’arrête à distance de la rive.</text>
</svg>
