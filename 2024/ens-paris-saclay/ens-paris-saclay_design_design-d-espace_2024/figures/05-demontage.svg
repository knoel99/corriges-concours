<text x="291" y="160" font-family="DejaVu Sans, sans-serif" font-size="3.3" font-weight="400" fill="#212e2c" text-anchor="start">Appui réglable et platelage de répartition</text>
<text x="288" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Le patin répartit la charge sur une plaque</text>
<text x="288" y="191" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">sèche amovible. Les longrines reçoivent</text>
<text x="288" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">les cassettes vissées. Les boulons</text>
<text x="288" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">traversants restent accessibles derrière</text>
<text x="288" y="206" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">les plinthes.</text>
<text x="21" y="241" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Dépose</text>
<text x="21" y="251" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Débrancher les réserves → déposer toiture et parois → sortir cassettes et longrines → retirer les plaques et photographier le sol.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Quatre bandes de plancher de 1,20 × 4,00 m. Les charges, les plaques et le lest temporaire dépendent des essais de portance et de vent.</text>
</svg>
