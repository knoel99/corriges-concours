<text x="118.0" y="229.3" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#3b665b" text-anchor="middle">4,00 m</text>
<text x="245" y="73" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Une coupe, deux lumières</text>
<text x="245" y="84" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">La vue principale part d’une personne assise. Le second</text>
<text x="245" y="89" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">ouvrant, haut côté chemin, laisse sortir l’air chaud. Un</text>
<text x="245" y="94" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">volet coulissant intérieur assombrit le lit.</text>
<text x="245" y="135" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Un hiver démonté</text>
<text x="245" y="146" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Plancher et murs en caissons isolés. Toiture métallique</text>
<text x="245" y="151" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">ventilée, pente vers la façade basse. Gouttière contenue</text>
<text x="245" y="156" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">dans l’enveloppe du module. Vérifier les surchauffes au</text>
<text x="245" y="161" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">soleil du soir sur site.</text>
<text x="245" y="205" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Épreuve en grandeur réelle</text>
<text x="245" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Marquer les yeux assis et debout sur un gabarit en</text>
<text x="245" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">carton. Ajuster la baie pour garder le lac visible</text>
<text x="245" y="227" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">depuis les couchettes.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">L’écart entre rives vaut 0,73 m sur 4,00 m, soit une pente proche de 18 %. Coupe de principe, fondations et vent à dimensionner selon le</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">terrain.</text>
