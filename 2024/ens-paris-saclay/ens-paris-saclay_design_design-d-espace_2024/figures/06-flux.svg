<text x="340" y="139.8" font-family="DejaVu Sans, sans-serif" font-size="4.0" font-weight="400" fill="#212e2c" text-anchor="middle">Batterie protégée</text>
<path d="M340 145 L340 154" stroke="#c55d42" stroke-width="0.65" fill="none"/>
<polygon points="338,151 342,151 340,154" fill="#c55d42" stroke="none" stroke-width="0.65" stroke-linejoin="round"/>
<rect x="291" y="154" width="98" height="15" rx="2" fill="#f0e7d5" stroke="#c55d42" stroke-width="0.6"/>
<text x="340" y="163.8" font-family="DejaVu Sans, sans-serif" font-size="4.0" font-weight="400" fill="#212e2c" text-anchor="middle">Lumière et USB</text>
<text x="23" y="200" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Eau sous contrôle</text>
<text x="23" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">4 personnes × 6 L/j × 3 jours = 72 L pour boire</text>
<text x="23" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">et cuisiner, avec une toilette légère. Douche</text>
<text x="23" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">sur la base d’accueil.</text>
<text x="154" y="200" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Retour au point d’accueil</text>
<text x="154" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Emporter deux bidons de 40 L pour les eaux</text>
<text x="154" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">grises. Cartouche de WC sec changée par le</text>
<text x="154" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">gestionnaire, selon la filière locale.</text>
<text x="288" y="200" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Une réserve de trois nuits</text>
<text x="288" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Éclairage et recharge, environ 60 Wh/j. Une</text>
<text x="288" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">batterie de 300 Wh utiles couvre les trois</text>
<text x="288" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">jours avec marge.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">La pluie alimente uniquement un point de nettoyage non potable. Les volumes et l’ensoleillement se vérifient en essai de séjour.</text>
</svg>
