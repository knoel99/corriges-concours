<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#3b665b" text-anchor="start">LA LISIÈRE HABITÉE</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#3b665b" text-anchor="end">6 / 6</text>
<path d="M13 20 L407 20" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Habiter trois nuits hors réseau</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Un gîte autonome pour les usages de base · les visiteurs entrent à pied, le gestionnaire entretient les réserves.</text>
<text x="20" y="70" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#7aa9ac" text-anchor="start">EAU POTABLE</text>
