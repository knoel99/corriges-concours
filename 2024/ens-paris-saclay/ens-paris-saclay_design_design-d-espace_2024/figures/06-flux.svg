<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Habiter trois nuits hors réseau</title><desc>Un gîte autonome pour les usages de base · les visiteurs entrent à pied, le gestionnaire entretient les réserves.</desc>
