<text x="213" y="109.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">1. Aligner le coin du papier et celui du cadre.</text>
<text x="213" y="136.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">2. Charger les pointes de la même manière.</text>
<text x="213" y="163.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">3. Changer la feuille, reproduire le passage.</text>
<text x="213" y="190.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">4. Comparer attaque, largeur, interruptions.</text>
<text x="20" y="231.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">La feuille se retire. Le gabarit ressert pour une autre personne et une autre prise en main.</text>
