<text x="24" y="195.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">Deux joues reçoivent la racine.</text>
<text x="24" y="201.1" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">Leur face interne garde la composition.</text>
<text x="203" y="195.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">Bague mobile</text>
<text x="294" y="195.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">Canne montée,</text>
<text x="294" y="201.1" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">bague au repère.</text>
<text x="24" y="235.0" fill="#262f30" font-size="4.2" font-weight="400" text-anchor="start">Le brin témoin reste visible après montage. Tester son glissement avant la séance.</text>
