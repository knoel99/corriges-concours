<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Trois écritures pour une rue</title><desc>Tester la fumée, le rythme et la pellicule · choisir un motif qui puisse se peindre en aplats et se lire en passant.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#45213b" text-anchor="start">LES PEAUX DU LIVINGSTON</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#45213b" text-anchor="end">2 / 5</text>
<path d="M13 20 L407 20" stroke="#45213b" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Trois écritures pour une rue</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Tester la fumée, le rythme et la pellicule · choisir un motif qui puisse se peindre en aplats et se lire en passant.</text>
<rect x="18" y="68" width="118" height="103" rx="0" fill="#45213b" stroke="none" stroke-width="0.6"/>
<path d="M31 159 C66 125 21 115 47 82" fill="none" stroke="#f07232" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M48 159 C80 125 39 115 64 82" fill="none" stroke="#fff1cf" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M65 159 C94 125 57 115 81 82" fill="none" stroke="#f07232" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M82 159 C108 125 75 115 98 82" fill="none" stroke="#fff1cf" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M99 159 C122 125 93 115 115 82" fill="none" stroke="#f07232" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="18" y="187" font-family="DejaVu Sans, sans-serif" font-size="6" font-weight="700" fill="#45213b" text-anchor="start">Fumée</text>
<text x="18" y="200" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Le filet de fumée parle du feu. Sur un</text>
<text x="18" y="205" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">grand mur, il peut évoquer un incendie</text>
<text x="18" y="210" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">ou disparaître dans les inscriptions</text>
<text x="18" y="215" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">voisines.</text>
<rect x="151" y="68" width="118" height="103" rx="0" fill="#efe1bf" stroke="none" stroke-width="0.6"/>
<rect x="159" y="127" width="4" height="29" rx="0" fill="#45213b" stroke="none" stroke-width="0.6"/>
<rect x="168" y="109" width="4" height="47" rx="0" fill="#f07232" stroke="none" stroke-width="0.6"/>
<rect x="177" y="92" width="4" height="64" rx="0" fill="#45213b" stroke="none" stroke-width="0.6"/>
<rect x="186" y="122" width="4" height="34" rx="0" fill="#f07232" stroke="none" stroke-width="0.6"/>
<rect x="195" y="79" width="4" height="77" rx="0" fill="#45213b" stroke="none" stroke-width="0.6"/>
<rect x="204" y="115" width="4" height="41" rx="0" fill="#f07232" stroke="none" stroke-width="0.6"/>
<rect x="213" y="97" width="4" height="59" rx="0" fill="#45213b" stroke="none" stroke-width="0.6"/>
<rect x="222" y="134" width="4" height="22" rx="0" fill="#f07232" stroke="none" stroke-width="0.6"/>
<rect x="231" y="88" width="4" height="68" rx="0" fill="#45213b" stroke="none" stroke-width="0.6"/>
<rect x="240" y="120" width="4" height="36" rx="0" fill="#f07232" stroke="none" stroke-width="0.6"/>
<rect x="249" y="104" width="4" height="52" rx="0" fill="#45213b" stroke="none" stroke-width="0.6"/>
<text x="151" y="187" font-family="DejaVu Sans, sans-serif" font-size="6" font-weight="700" fill="#45213b" text-anchor="start">Mesure</text>
<text x="151" y="200" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Des barres scandent le service et le</text>
<text x="151" y="205" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">rap. L’image reste proche d’un égaliseur</text>
<text x="151" y="210" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">de salle de concert.</text>
<rect x="284" y="68" width="118" height="103" rx="0" fill="#fff1cf" stroke="none" stroke-width="0.6"/>
<g transform="translate(292 79) scale(1.64)">
<path d="M0 22 Q10 -8 39 1 Q62 8 58 26 Q52 49 27 48 Q4 47 0 33 Q-1 28 0 22Z" fill="#f07232" stroke="#f07232" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M6 22 Q16 0 35 7 Q55 13 50 27 Q45 41 28 40 Q12 40 7 31" fill="none" stroke="#fff1cf" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M13 24 Q22 8 35 14 Q45 19 42 27 Q36 36 25 32 Q19 31 16 27" fill="none" stroke="#45213b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M24 22 Q30 16 35 22 Q37 25 32 27 Q26 28 24 22Z" fill="#fff1cf" stroke="#fff1cf" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="284" y="187" font-family="DejaVu Sans, sans-serif" font-size="6" font-weight="700" fill="#45213b" text-anchor="start">Pellicule</text>
<text x="284" y="200" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Le contour dédoublé d’un grain ouvert</text>
<text x="284" y="205" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">dit le contact des peaux avec le jus. Il</text>
<text x="284" y="210" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">peut aussi évoquer une assiette vue de</text>
<text x="284" y="215" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">dessus.</text>
<path d="M13 276 L407 276" stroke="#45213b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#45213b" text-anchor="start">La pellicule devient l’image principale. La cadence subsiste dans les décalages et les interruptions du dessin aux ouvertures.</text>
</svg>
