<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Lire le mur à hauteur de rue</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Cours Julien, Marseille · le regard arrive par l’angle, longe les tables puis cherche l’entrée rue Crudère.</text>
