<path d="M22 82 L13 91" stroke="#212e2c" stroke-width="0.8" fill="none"/>
<path d="M13 91 L13 173" stroke="#212e2c" stroke-width="0.8" fill="none"/>
<text x="23" y="70" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#45213b" text-anchor="start">Relevé de proportions d’après la vue frontale</text>
<path d="M109 166 L111 187" stroke="#45213b" stroke-width="0.45" fill="none"/>
<text x="111" y="194" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="400" fill="#45213b" text-anchor="middle">Entrée</text>
<path d="M221 166 L223 183" stroke="#45213b" stroke-width="0.45" fill="none"/>
<text x="223" y="190" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="400" fill="#45213b" text-anchor="middle">Baie cintrée</text>
<path d="M268 166 L270 198" stroke="#45213b" stroke-width="0.45" fill="none"/>
<text x="270" y="205" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="400" fill="#45213b" text-anchor="middle">Second retrait</text>
<text x="313" y="82" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#45213b" text-anchor="start">Le lieu</text>
<text x="313" y="95" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le mur d’angle rue Vian porte</text>
<text x="313" y="100" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">les couches de graffitis. La</text>
<text x="313" y="105" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">terrasse le longe. Rue Crudère,</text>
<text x="313" y="110" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">le bandeau continu et les</text>
<text x="313" y="115" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">travées rythment le</text>
<text x="313" y="120" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">rez-de-chaussée.</text>
<text x="23" y="232" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#45213b" text-anchor="start">Vin blanc macéré avec les peaux</text>
<text x="23" y="244" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">L’ambre et l’amertume viennent du contact avec la pellicule. Ce</text>
<text x="23" y="249" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">principe de couches fournit une image pour la façade.</text>
<text x="229" y="232" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#45213b" text-anchor="start">Flamme, assiettes partagées, rap</text>
<text x="229" y="244" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le feu et la vitesse du service suggèrent des ruptures de</text>
<text x="229" y="249" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">cadence. L’exigence de cuisine demande aussi une enseigne</text>
<text x="229" y="254" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">facile à lire.</text>
<path d="M13 276 L407 276" stroke="#45213b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#45213b" text-anchor="start">Le dessin reprend la composition de la photographie de l’annexe 2. Les cotes réelles doivent être relevées avant exécution.</text>
</svg>
