<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Lire le mur à hauteur de rue</title><desc>Cours Julien, Marseille · le regard arrive par l’angle, longe les tables puis cherche l’entrée rue Crudère.</desc>
