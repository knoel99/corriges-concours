<text x="178" y="164" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#45213b" text-anchor="start">Séquence de pose</text>
<text x="178" y="177" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Relever le mur et reporter les réserves sur calque. Préparer un échantillon de</text>
<text x="178" y="182" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">fond, laisser sécher. Reporter les contours au carreau et remplir les trois</text>
<text x="178" y="187" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">teintes. Tracer les lettres au poncif.</text>
<text x="178" y="224" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#45213b" text-anchor="start">Lecture en service</text>
<text x="178" y="236" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Placer deux personnes devant la porte et une table près de l’angle. Faire</text>
<text x="178" y="241" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">lire le nom depuis les deux approches, en journée puis sous les lampes</text>
<text x="178" y="246" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">existantes.</text>
<path d="M13 276 L407 276" stroke="#45213b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#45213b" text-anchor="start">Le poncif ajouré transfère le contour des lettres à la poudre. Une photographie frontale et le plan des mélanges facilitent les retouches.</text>
