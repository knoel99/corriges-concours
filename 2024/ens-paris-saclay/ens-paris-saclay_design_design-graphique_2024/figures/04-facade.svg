<text x="19" y="225" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#45213b" text-anchor="start">Couper le dessin au tableau des baies</text>
<text x="19" y="237" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Les courbes passent d’un trumeau à l’autre. Le relief, le vitrage,</text>
<text x="19" y="242" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">les grilles et la porte arrêtent la peinture.</text>
<text x="228" y="225" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#45213b" text-anchor="start">Conserver l’usage de la rue</text>
<text x="228" y="237" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le bord côté angle se termine nettement sur l’arête du mur.</text>
<text x="228" y="242" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Tables, chaises, accès et mur libre rue Vian restent</text>
<text x="228" y="247" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">disponibles.</text>
<path d="M13 276 L407 276" stroke="#45213b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#45213b" text-anchor="start">Simulation d’un projet de concours. Les surfaces et les supports existants, la conservation des peintures et les accords se vérifient avec</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#45213b" text-anchor="start">le lieu.</text>
</svg>
