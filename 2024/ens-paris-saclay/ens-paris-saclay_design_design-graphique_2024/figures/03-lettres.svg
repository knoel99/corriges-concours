<text x="307" y="219" font-family="DejaVu Sans, sans-serif" font-size="3.9" font-weight="700" fill="#45213b" text-anchor="start">Essai réduit</text>
<path d="M13 276 L407 276" stroke="#45213b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#45213b" text-anchor="start">Nuancier indicatif : lie #45213B, ambre #F07232, crème #FFF1CF. Échantillons sur enduit à contrôler en lumière réelle.</text>
