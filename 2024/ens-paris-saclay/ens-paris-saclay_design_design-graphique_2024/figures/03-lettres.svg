<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Un alphabet de petites entailles</title><desc>Dessiner le mot complet · un jambage net et une terminaison franche contrastent avec les courbes du motif.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#45213b" text-anchor="start">LES PEAUX DU LIVINGSTON</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#45213b" text-anchor="end">3 / 5</text>
<path d="M13 20 L407 20" stroke="#45213b" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Un alphabet de petites entailles</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Dessiner le mot complet · un jambage net et une terminaison franche contrastent avec les courbes du motif.</text>
