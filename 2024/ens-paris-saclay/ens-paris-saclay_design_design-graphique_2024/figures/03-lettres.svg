<text x="35" y="121" font-family="DejaVu Sans, sans-serif" font-size="4.0" font-weight="700" fill="#fff1cf" text-anchor="start">BISTROT À VINS ORANGES</text>
<rect x="22" y="161" width="37" height="30" rx="0" fill="#45213b" stroke="#212e2c" stroke-width="0.45"/>
<text x="22" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#45213b" text-anchor="start">Lie</text>
<rect x="67" y="161" width="37" height="30" rx="0" fill="#f07232" stroke="#212e2c" stroke-width="0.45"/>
<text x="67" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#45213b" text-anchor="start">Ambre</text>
<rect x="112" y="161" width="37" height="30" rx="0" fill="#fff1cf" stroke="#212e2c" stroke-width="0.45"/>
<text x="112" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#45213b" text-anchor="start">Crème</text>
<text x="175" y="158" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#45213b" text-anchor="start">Lecture à distance</text>
<text x="175" y="171" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le I est réduit à un montant. Le G s’ouvre à droite, le S garde ses</text>
<text x="175" y="176" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">contreformes. Le mot se dessine sur une trame de dix modules espacés.</text>
