<svg xmlns="http://www.w3.org/2000/svg" width="820" height="296" viewBox="0 0 820 296" role="img"><title>Le meuble, le réseau et les places</title><desc>Deux lectures de la table-terminal de La Pietra, Milan, 1983.</desc><rect x="0" y="0" width="820" height="296" fill="#fbfaf5" stroke="none"/><text x="26" y="42" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#203f49">Le meuble, le réseau et les places</text><text x="30" y="85" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#203f49">Ce que la photographie montre</text><text x="432" y="85" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#203f49">Ce que décrit l’article de 1983</text><rect x="35" y="129" width="108" height="15" fill="#345d68" stroke="none"/><rect x="49" y="103" width="33" height="25" fill="#9ac1be" stroke="#345d68"/><line x1="46" y1="146" x2="40" y2="201" stroke="#385d68" stroke-width="3" stroke-linecap="round"/><line x1="132" y1="146" x2="140" y2="201" stroke="#385d68" stroke-width="3" stroke-linecap="round"/><text x="164" y="129" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">Plateau, moniteur</text><text x="164" y="156" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">et sièges composent</text><text x="164" y="183" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">une scène domestique.</text><rect x="434" y="99" width="260" height="31" fill="#e4efeb" stroke="none"/><text x="444" y="120" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">Banque de données</text><rect x="434" y="139" width="260" height="31" fill="#e4efeb" stroke="none"/><text x="444" y="160" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">Centre de traitement</text><rect x="434" y="179" width="260" height="31" fill="#e4efeb" stroke="none"/><text x="444" y="200" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">Images familiales</text><text x="30" y="249" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">Une place dans la pièce peut donner accès à plusieurs activités.</text><text x="30" y="279" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#203f49">La photographie ne permet pas de connaître les connexions actives lors de la prise de vue.</text></svg>
