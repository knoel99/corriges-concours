<svg xmlns="http://www.w3.org/2000/svg" width="880" height="363" viewBox="0 0 880 363" role="img"><title>Où se distribue la fonction ?</title><desc>Branchement au réseau, convergence de services, puis zones sonores traversées par le visiteur.</desc><rect width="880" height="363" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="24" y="38" font-size="25" fill="#17394c" font-weight="bold">Où se distribue la fonction ?</text><rect x="23" y="62" width="264" height="241" fill="#e8efea" stroke="none" stroke-width="1"/><text x="33" y="91" font-size="17" fill="#17394c" font-weight="bold">1909 · Bouilloire</text><text x="33" y="123" font-size="15" fill="#17394c" font-weight="bold">Un branchement</text><rect x="66" y="161" width="41" height="31" fill="#b28650" stroke="none" stroke-width="1"/><rect x="192" y="153" width="30" height="44" fill="#477588" stroke="none" stroke-width="1"/><line x1="106" y1="178" x2="193" y2="178" stroke="#41606e" stroke-width="3"/><text x="33" y="248" font-size="16" fill="#17394c">L’objet rejoint un point</text><text x="33" y="271" font-size="16" fill="#17394c">du réseau électrique.</text><rect x="306" y="62" width="264" height="241" fill="#e8efea" stroke="none" stroke-width="1"/><text x="316" y="91" font-size="17" fill="#17394c" font-weight="bold">1983 · Table-terminal</text><text x="316" y="123" font-size="15" fill="#17394c" font-weight="bold">Un point, plusieurs services</text><circle cx="356" cy="149" r="7" fill="#477588" stroke="none" stroke-width="1"/><line x1="367" y1="149" x2="464" y2="178" stroke="#986033" stroke-width="2.5"/><line x1="464" y1="178" x2="454.1789943876055" y2="179.8835734021577" stroke="#986033" stroke-width="2.5"/><line x1="464" y1="178" x2="456.82444954863837" y2="171.0349820014616" stroke="#986033" stroke-width="2.5"/><circle cx="356" cy="178" r="7" fill="#477588" stroke="none" stroke-width="1"/><line x1="367" y1="178" x2="464" y2="178" stroke="#986033" stroke-width="2.5"/><line x1="464" y1="178" x2="455.13005077220714" y2="182.61779175541483" stroke="#986033" stroke-width="2.5"/><line x1="464" y1="178" x2="455.13005077220714" y2="173.38220824458517" stroke="#986033" stroke-width="2.5"/><circle cx="356" cy="207" r="7" fill="#477588" stroke="none" stroke-width="1"/><line x1="367" y1="207" x2="464" y2="178" stroke="#986033" stroke-width="2.5"/><line x1="464" y1="178" x2="456.82444954863837" y2="184.9650179985384" stroke="#986033" stroke-width="2.5"/><line x1="464" y1="178" x2="454.1789943876055" y2="176.1164265978423" stroke="#986033" stroke-width="2.5"/><rect x="468" y="158" width="40" height="40" fill="#b28650" stroke="none" stroke-width="1"/><text x="316" y="248" font-size="16" fill="#17394c">Travail, loisirs ou images</text><text x="316" y="271" font-size="16" fill="#17394c">arrivent au même meuble.</text><rect x="589" y="62" width="264" height="241" fill="#e8efea" stroke="none" stroke-width="1"/><text x="599" y="91" font-size="17" fill="#17394c" font-weight="bold">1985 · Casque infrarouge</text><text x="599" y="123" font-size="15" fill="#17394c" font-weight="bold">Plusieurs zones d’écoute</text><rect x="608" y="154" width="70" height="50" fill="#bdd3ca" stroke="none" stroke-width="1"/><rect x="685" y="154" width="70" height="50" fill="#a2c1bc" stroke="none" stroke-width="1"/><rect x="762" y="154" width="70" height="50" fill="#82a6ac" stroke="none" stroke-width="1"/><circle cx="627" cy="178" r="6" fill="#244d62" stroke="none" stroke-width="1"/><line x1="638" y1="178" x2="801" y2="178" stroke="#986033" stroke-width="2.5"/><line x1="801" y1="178" x2="792.1300507722071" y2="182.61779175541483" stroke="#986033" stroke-width="2.5"/><line x1="801" y1="178" x2="792.1300507722071" y2="173.38220824458517" stroke="#986033" stroke-width="2.5"/><text x="599" y="248" font-size="16" fill="#17394c">Le déplacement du visiteur</text><text x="599" y="271" font-size="16" fill="#17394c">change la bande reçue.</text><text x="23" y="344" font-size="15" fill="#17394c">Schémas de relations. Les pictogrammes indiquent un objet, des points de connexion ou un trajet.</text></g></svg>
