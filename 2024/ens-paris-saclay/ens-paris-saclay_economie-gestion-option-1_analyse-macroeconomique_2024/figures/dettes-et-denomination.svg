<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 289" width="830" height="289" role="img" aria-labelledby="t d"><title id="t">Un même choc de prix, trois contrats de dette</title><desc id="d">Pour un principal initial de 100, après une hausse du niveau des prix de 10 %, le principal en pouvoir d’achat initial dépend de la clause d’indexation ou de la monnaie de libellé.</desc><rect width="830" height="289" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#193946"><text x="18" y="28" font-size="21" font-weight="bold">Un même choc de prix, trois contrats de dette</text><text x="18" y="52" font-size="15">Principal réel en euros de départ (hors intérêts)</text><text x="18" y="84" font-size="17" font-weight="bold">Dette nominale fixe</text><text x="18" y="107" font-size="15">100 / 1,10</text><rect x="291" y="71" width="324.36" height="24" fill="#315775"/><text x="623.36" y="90" font-weight="bold" font-size="17">90,91</text><text x="18" y="148" font-size="17" font-weight="bold">Dette indexée sur les prix</text><text x="18" y="171" font-size="15">110 / 1,10</text><rect x="291" y="135" width="356.80" height="24" fill="#28776c"/><text x="655.80" y="154" font-weight="bold" font-size="17">100</text><text x="18" y="212" font-size="17" font-weight="bold">Dette en devise</text><text x="18" y="235" font-size="15">125 / 1,10</text><rect x="291" y="199" width="405.45" height="24" fill="#456e8d"/><text x="704.45" y="218" font-weight="bold" font-size="17">113,64</text><line x1="647.8" x2="647.8" y1="62" y2="271" stroke="#555" stroke-dasharray="3 4" /></g></svg>
