<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Reconnaître un genre dans une situation</title>
<desc id="description">Lettre du dirigeant Le personnel reçoit le PDF par courriel. Que cherche à obtenir la direction ? Rapport annuel Des rubriques et des images évoluent. Quels publics et quelles obligations ? Note interne Une forme circule et devient familière. Quels usages la communauté reconnaît-elle ?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Reconnaître un genre dans une situation</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Situation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice observable</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question de genre</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Lettre du dirigeant</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le personnel reçoit le PDF</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">par courriel.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Que cherche à obtenir la</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">direction ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Rapport annuel</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Des rubriques et des</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">images évoluent.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Quels publics et quelles</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">obligations ?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Note interne</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Une forme circule et</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">devient familière.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Quels usages la communauté</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">reconnaît-elle ?</text>
</g>
</svg>
