<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Ce que les données de l’entreprise permettent de conclure</title>
<desc id="description">Danisco, quatre périodes La série se transforme par étapes. La même rupture dans tout le secteur ? 157 lettres internes Des thèmes réapparaissent dans une entreprise. Des effets mesurés auprès des destinataires ? Deux dirigeants Des écarts entre deux ensembles de lettres. Un effet distinct de la période et de la situation ?</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Ce que les données de l’entreprise permettent de conclure</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Donnée</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’elle établit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui reste à vérifier</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Danisco, quatre</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">périodes</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La série se transforme par</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">étapes.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La même rupture dans tout</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">le secteur ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">157 lettres internes</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Des thèmes réapparaissent</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">dans une entreprise.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Des effets mesurés auprès</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">des destinataires ?</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Deux dirigeants</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Des écarts entre deux</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">ensembles de lettres.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Un effet distinct de la</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">période et de la situation</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">?</text>
</g>
</svg>
