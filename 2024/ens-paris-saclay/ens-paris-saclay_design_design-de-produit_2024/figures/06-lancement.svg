<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Lancer une collaboration</title><desc>De la scierie de Bellême à la première exposition · organiser des séries de tailles différentes et un retour d’usage.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#704729" text-anchor="start">À PORTÉE DE MAIN</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#704729" text-anchor="end">6 / 6</text>
<path d="M13 20 L407 20" stroke="#704729" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Lancer une collaboration</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">De la scierie de Bellême à la première exposition · organiser des séries de tailles différentes et un retour d’usage.</text>
<text x="20" y="72" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#b97842" text-anchor="start">01</text>
<text x="37" y="72" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#704729" text-anchor="start">Matière</text>
<text x="20" y="87" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Bellême et propriétaires locaux : lot</text>
<text x="20" y="92" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">identifié, débit sec, singularités</text>
<text x="20" y="97" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">relevées. Une fiche garde l’origine et la</text>
<text x="20" y="102" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">date.</text>
<text x="154" y="72" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#d69d68" text-anchor="start">02</text>
<text x="171" y="72" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#704729" text-anchor="start">Atelier</text>
<text x="154" y="87" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Le designer met au point gabarits et</text>
<text x="154" y="92" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">usages. Le tourneur décide des prises,</text>
<text x="154" y="97" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">ajuste les rayons et identifie les pertes.</text>
<text x="287" y="72" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#b68a53" text-anchor="start">03</text>
<text x="304" y="72" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#704729" text-anchor="start">Édition</text>
<text x="287" y="87" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Un même socle bas reçoit les cinq pièces.</text>
<text x="287" y="92" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Les profils se lisent de côté ; un</text>
<text x="287" y="97" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">exemplaire de chaque se manipule.</text>
