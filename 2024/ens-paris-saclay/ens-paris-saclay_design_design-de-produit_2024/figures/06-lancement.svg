<text x="24" y="249" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#704729" text-anchor="start">Petites séries</text>
<text x="24" y="259" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Galet et bobine réassortissables · porte-bagues et pot sur commande · îlot numéroté par panneau de chutes.</text>
<path d="M13 276 L407 276" stroke="#704729" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#704729" text-anchor="start">Photographier le profil, la main et la provenance de la chute. Un tarif distinct rémunère le temps de prototype et la petite série.</text>
