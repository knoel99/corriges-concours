<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Du billon au profil</title><desc>Trois recherches sur une même chute · pièce massive, collage alterné et réserve tactile.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#704729" text-anchor="start">À PORTÉE DE MAIN</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#704729" text-anchor="end">2 / 6</text>
<path d="M13 20 L407 20" stroke="#704729" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Du billon au profil</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Trois recherches sur une même chute · pièce massive, collage alterné et réserve tactile.</text>
<text x="19" y="68" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#704729" text-anchor="start">A / Lisse</text>
<path d="M36 100 Q66 68 96 100 Q66 108 36 100" fill="#d69d68" stroke="#704729" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M36 134 Q66 102 96 134 Q66 142 36 134" fill="#d69d68" stroke="#704729" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M36 168 Q66 136 96 168 Q66 176 36 168" fill="#d69d68" stroke="#704729" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="19" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">La forme continue est douce, mais le bord</text>
<text x="19" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">échappe quand on la soulève.</text>
<text x="151" y="68" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#704729" text-anchor="start">B / Empilé</text>
<rect x="169.0" y="100" width="58.0" height="5" rx="0" fill="#b97842" stroke="#704729" stroke-width="0.4"/>
<rect x="170.6" y="95" width="54.8" height="5" rx="0" fill="#d69d68" stroke="#704729" stroke-width="0.4"/>
<rect x="172.2" y="90" width="51.6" height="5" rx="0" fill="#b68a53" stroke="#704729" stroke-width="0.4"/>
<rect x="169.0" y="134" width="58.0" height="5" rx="0" fill="#d69d68" stroke="#704729" stroke-width="0.4"/>
<rect x="170.6" y="129" width="54.8" height="5" rx="0" fill="#b68a53" stroke="#704729" stroke-width="0.4"/>
<rect x="172.2" y="124" width="51.6" height="5" rx="0" fill="#c9a877" stroke="#704729" stroke-width="0.4"/>
<rect x="169.0" y="168" width="58.0" height="5" rx="0" fill="#b68a53" stroke="#704729" stroke-width="0.4"/>
<rect x="170.6" y="163" width="54.8" height="5" rx="0" fill="#c9a877" stroke="#704729" stroke-width="0.4"/>
<rect x="172.2" y="158" width="51.6" height="5" rx="0" fill="#a46e42" stroke="#704729" stroke-width="0.4"/>
<text x="151" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Le joint rend le débit visible. Trop</text>
<text x="151" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">d’alternances donnent au collage le</text>
<text x="151" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">premier rôle.</text>
<text x="283" y="68" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#704729" text-anchor="start">C / Incisé</text>
<path d="M298 103 Q314 77 328 88 L333 93 Q336 87 339 88 L364 103 Z" fill="#c9a877" stroke="#704729" stroke-width="0.65" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M298 137 Q314 111 328 122 L333 127 Q336 121 339 122 L364 137 Z" fill="#c9a877" stroke="#704729" stroke-width="0.65" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M298 171 Q314 145 328 156 L333 161 Q336 155 339 156 L364 171 Z" fill="#c9a877" stroke="#704729" stroke-width="0.65" stroke-linejoin="round" stroke-linecap="round"/>
<text x="283" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Un seul décroché appelle l’index. Le</text>
<text x="283" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">profil peut être contrôlé par un petit</text>
<text x="283" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">gabarit.</text>
<path d="M13 276 L407 276" stroke="#704729" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#704729" text-anchor="start">Choix C pour les profils, avec un collage raisonné sur le grand plateau. Éprouver le creux en main avant de fixer son rayon.</text>
</svg>
