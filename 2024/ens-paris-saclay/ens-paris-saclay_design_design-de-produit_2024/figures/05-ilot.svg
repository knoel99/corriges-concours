<text x="121" y="202" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Lames de chêne sec, fil parallèle. Le disque est</text>
<text x="121" y="207" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">débité dans le panneau après collage. Traits minces</text>
<text x="121" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">= sens du fil.</text>
<text x="304" y="81" font-family="DejaVu Sans, sans-serif" font-size="4.4" font-weight="700" fill="#704729" text-anchor="start">Bord saisi du dessous</text>
<text x="304" y="95" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Diamètre maximal 260 au niveau</text>
<text x="304" y="100" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">21. Gorge douce au niveau 26.</text>
<text x="304" y="105" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Épaisseur au centre 10. Dessous</text>
<text x="304" y="110" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">en retrait pour loger les doigts.</text>
<text x="304" y="162" font-family="DejaVu Sans, sans-serif" font-size="4.4" font-weight="700" fill="#704729" text-anchor="start">Série courte</text>
<text x="304" y="176" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Conserver l’ordre réel des lames et</text>
<text x="304" y="181" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">reporter leur provenance sur la</text>
<text x="304" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">fiche de pièce. Faire un essai de</text>
<text x="304" y="191" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">voile après un cycle sec et humide.</text>
