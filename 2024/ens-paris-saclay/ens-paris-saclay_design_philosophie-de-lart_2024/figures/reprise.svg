<svg xmlns="http://www.w3.org/2000/svg" width="880" height="358" viewBox="0 0 880 358" role="img"><title>Quand une partie a cédé, qu’est-ce qui continue ?</title><desc>Exemple fictif. L’échelle de référence détermine le verdict sur le fonctionnement.</desc><rect width="880" height="358" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="24" y="38" font-size="25" fill="#17394c" font-weight="bold">Quand une partie a cédé, qu’est-ce qui continue ?</text><rect x="23" y="65" width="262" height="229" fill="#e8efea" stroke="none" stroke-width="1"/><text x="33" y="94" font-size="18" fill="#17394c" font-weight="bold">Siège indisponible</text><line x1="107" y1="178" x2="152" y2="178" stroke="#735c42" stroke-width="5"/><line x1="111" y1="178" x2="104" y2="203" stroke="#735c42" stroke-width="4"/><line x1="148" y1="178" x2="153" y2="203" stroke="#735c42" stroke-width="4"/><line x1="108" y1="176" x2="104" y2="160" stroke="#735c42" stroke-width="4"/><line x1="92" y1="145" x2="87" y2="125" stroke="#735c42" stroke-width="3"/><text x="33" y="238" font-size="16" fill="#17394c">Le dossier a cédé.</text><text x="33" y="263" font-size="16" fill="#17394c">S’adosser est impossible.</text><rect x="306" y="65" width="262" height="229" fill="#e8efea" stroke="none" stroke-width="1"/><text x="316" y="94" font-size="18" fill="#17394c" font-weight="bold">Autre usage</text><line x1="390" y1="178" x2="435" y2="178" stroke="#735c42" stroke-width="5"/><line x1="394" y1="178" x2="387" y2="203" stroke="#735c42" stroke-width="4"/><line x1="431" y1="178" x2="436" y2="203" stroke="#735c42" stroke-width="4"/><line x1="391" y1="176" x2="387" y2="160" stroke="#735c42" stroke-width="4"/><line x1="375" y1="145" x2="370" y2="125" stroke="#735c42" stroke-width="3"/><rect x="395" y="171" width="38" height="4" fill="#55818c" stroke="none" stroke-width="1"/><rect x="397" y="165" width="36" height="4" fill="#55818c" stroke="none" stroke-width="1"/><rect x="399" y="159" width="34" height="4" fill="#55818c" stroke="none" stroke-width="1"/><text x="316" y="238" font-size="16" fill="#17394c">Des journaux occupent</text><text x="316" y="263" font-size="16" fill="#17394c">l’assise restée stable.</text><rect x="589" y="65" width="262" height="229" fill="#e8efea" stroke="none" stroke-width="1"/><text x="599" y="94" font-size="18" fill="#17394c" font-weight="bold">Service maintenu</text><line x1="673" y1="178" x2="718" y2="178" stroke="#735c42" stroke-width="5"/><line x1="677" y1="178" x2="670" y2="203" stroke="#735c42" stroke-width="4"/><line x1="714" y1="178" x2="719" y2="203" stroke="#735c42" stroke-width="4"/><line x1="674" y1="176" x2="668" y2="125" stroke="#735c42" stroke-width="4"/><text x="599" y="238" font-size="16" fill="#17394c">Une autre chaise prend</text><text x="599" y="263" font-size="16" fill="#17394c">le relais dans la salle.</text><text x="24" y="338" font-size="15" fill="#17394c">Le même mot « fonctionner » porte successivement sur un siège, un support ou une salle de lecture.</text></g></svg>
