<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" width="820" height="255" role="img" aria-labelledby="titre desc"><title id="titre">Trois façons de mesurer la hausse des prix</title><desc id="desc">Avril / mars. 8,8 % : hausse en un mois. Le niveau des prix a continué d’augmenter. Avril / décembre. Environ 65 % : cumul depuis le début de l’année 2024. Avril / avril précédent. Près de 290 % : hausse sur douze mois, d’avril 2023 à avril 2024.</desc><rect width="820" height="255" fill="#f6f5ef"/><g font-family="DejaVu Sans, sans-serif" fill="#153139"><text x="24" y="32" font-size="22" font-weight="bold">Trois façons de mesurer la hausse des prix</text><path d="M24 62h241" stroke="#39756e" stroke-width="4"/><text x="24" y="93" font-size="18" font-weight="bold">Avril / mars</text><text x="24" y="123" font-size="15">8,8 % : hausse en un mois.</text><text x="24" y="145" font-size="15">Le niveau des prix a</text><text x="24" y="167" font-size="15">continué d’augmenter.</text><path d="M289 62h241" stroke="#39756e" stroke-width="4"/><text x="289" y="93" font-size="18" font-weight="bold">Avril / décembre</text><text x="289" y="123" font-size="15">Environ 65 % : cumul depuis</text><text x="289" y="145" font-size="15">le début de l’année 2024.</text><path d="M554 62h241" stroke="#39756e" stroke-width="4"/><text x="554" y="93" font-size="18" font-weight="bold">Avril / avril précédent</text><text x="554" y="123" font-size="15">Près de 290 % : hausse sur</text><text x="554" y="145" font-size="15">douze mois, d’avril 2023 à</text><text x="554" y="167" font-size="15">avril 2024.</text></g></svg>
