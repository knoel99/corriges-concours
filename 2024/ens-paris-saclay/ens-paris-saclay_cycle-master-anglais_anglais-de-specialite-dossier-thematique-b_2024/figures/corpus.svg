<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Du relevé à une affirmation sur le discours</title>
<desc id="description">Délimiter Isoler les résumés adressés aux décideurs. Les textes ont une situation comparable. Examiner Lire le voisinage de chaque emploi de balance. Le contexte aide à distinguer bilan et arbitrage. Comparer Ramener les comptes à une même base. Les tailles et la dispersion des textes importent.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Du relevé à une affirmation sur le discours</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Opération</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Exemple de travail</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui la justifie</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Délimiter</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Isoler les résumés</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">adressés aux décideurs.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les textes ont une</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">situation comparable.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Examiner</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Lire le voisinage de</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">chaque emploi de balance.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le contexte aide à</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">distinguer bilan et</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">arbitrage.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Comparer</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Ramener les comptes à une</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">même base.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Les tailles et la</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">dispersion des textes</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">importent.</text>
</g>
</svg>
