<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment une représentation voyage</title>
<desc id="description">Circuit et circulation Quesnay représente les échanges de richesses. Quelles relations le circuit sélectionne-t-il ? Récit et scénario Les futurs possibles se comparent par familles. Quelles hypothèses changent entre deux trames ? Équilibre de forces Le mot balance intervient dans plusieurs bilans. Quelles grandeurs compare-t-on ici ?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment une représentation voyage</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de départ</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Usage spécialisé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question à vérifier</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Circuit et</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">circulation</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Quesnay représente les</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">échanges de richesses.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Quelles relations le</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">circuit sélectionne-t-il ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Récit et scénario</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Les futurs possibles se</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">comparent par familles.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Quelles hypothèses changent</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">entre deux trames ?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Équilibre de forces</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le mot balance intervient</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">dans plusieurs bilans.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Quelles grandeurs compare-</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">t-on ici ?</text>
</g>
</svg>
