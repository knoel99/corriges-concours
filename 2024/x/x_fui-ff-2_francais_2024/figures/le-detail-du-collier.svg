<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 316" role="img" aria-labelledby="titre desc"><title id="titre">Un détail fait changer la question du lecteur</title><desc id="desc">L’offre : Le chien fait espérer au loup une vie plus confortable. L’indice : La marque au cou du chien fait découvrir le prix du confort. La relecture : Le lecteur reconsidère sa première idée du bonheur.</desc><rect width="890" height="316" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="20" y="35" font-size="24" font-weight="bold" fill="#243c46">Un détail fait changer la question du lecteur</text>
<rect x="20" y="57" width="849" height="68" rx="7" fill="#e5eff1"/>
<text x="35" y="84" font-size="19" font-weight="bold" fill="#243c46">L’offre</text>
<text x="35" y="110" font-size="17" font-weight="normal" fill="#243c46">Le chien fait espérer au loup une vie plus confortable.</text>
<path d="M49 125 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="142" width="849" height="68" rx="7" fill="#f4ebdd"/>
<text x="35" y="169" font-size="19" font-weight="bold" fill="#243c46">L’indice</text>
<text x="35" y="195" font-size="17" font-weight="normal" fill="#243c46">La marque au cou du chien fait découvrir le prix du confort.</text>
<path d="M49 210 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="227" width="849" height="68" rx="7" fill="#e7efdf"/>
<text x="35" y="254" font-size="19" font-weight="bold" fill="#243c46">La relecture</text>
<text x="35" y="280" font-size="17" font-weight="normal" fill="#243c46">Le lecteur reconsidère sa première idée du bonheur.</text>
</g></svg>
