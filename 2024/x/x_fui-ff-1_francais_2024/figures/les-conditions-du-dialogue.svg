<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 316" role="img" aria-labelledby="titre desc"><title id="titre">De la précision des mots à la possibilité du dialogue</title><desc id="desc">Peser ses termes : Définir le désaccord pour pouvoir en parler. Entendre une autre pensée : Laisser son interlocuteur préciser ou corriger la sienne. Chercher une issue : Éviter que la force devienne le seul recours.</desc><rect width="890" height="316" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="20" y="35" font-size="24" font-weight="bold" fill="#243c46">De la précision des mots à la possibilité du dialogue</text>
<rect x="20" y="57" width="849" height="68" rx="7" fill="#e5eff1"/>
<text x="35" y="84" font-size="19" font-weight="bold" fill="#243c46">Peser ses termes</text>
<text x="35" y="110" font-size="17" font-weight="normal" fill="#243c46">Définir le désaccord pour pouvoir en parler.</text>
<path d="M49 125 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="142" width="849" height="68" rx="7" fill="#f4ebdd"/>
<text x="35" y="169" font-size="19" font-weight="bold" fill="#243c46">Entendre une autre pensée</text>
<text x="35" y="195" font-size="17" font-weight="normal" fill="#243c46">Laisser son interlocuteur préciser ou corriger la sienne.</text>
<path d="M49 210 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="227" width="849" height="68" rx="7" fill="#e7efdf"/>
<text x="35" y="254" font-size="19" font-weight="bold" fill="#243c46">Chercher une issue</text>
<text x="35" y="280" font-size="17" font-weight="normal" fill="#243c46">Éviter que la force devienne le seul recours.</text>
</g></svg>
