<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>À quel moment devient-on responsable des effets d’une intervention ?</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Avant le geste</text>
<text x="27" y="118" font-size="16">Le CCNE demande quelles</text>
<text x="27" y="137" font-size="16">fins justifient le</text>
<text x="27" y="156" font-size="16">risque et qui peut en</text>
<text x="27" y="175" font-size="16">décider.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Devant le vivant</text>
<text x="298" y="118" font-size="16">Chez Shelley, le premier</text>
<text x="298" y="137" font-size="16">souffle appelle une</text>
<text x="298" y="156" font-size="16">réponse du créateur.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Après le geste</text>
<text x="569" y="118" font-size="16">L’aquarelle garde la</text>
<text x="569" y="137" font-size="16">trace d’une anomalie qui</text>
<text x="569" y="156" font-size="16">appelle une enquête.</text>
</g></svg>
