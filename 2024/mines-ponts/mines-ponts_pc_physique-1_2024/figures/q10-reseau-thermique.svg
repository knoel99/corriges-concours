    <rect x="155" y="53" width="62" height="22"/>
    <rect x="273" y="53" width="62" height="22"/>
    <rect x="391" y="53" width="62" height="22"/>
    <rect x="279" y="101" width="62" height="22"/>
    <rect x="279" y="149" width="62" height="22"/>
    <path d="M75 112H96 M524 112H545"/>
  </g>
  <g fill="#253748">
    <circle cx="96" cy="112" r="4"/>
    <circle cx="524" cy="112" r="4"/>
  </g>
  <g fill="#253748" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">
    <text x="310" y="24">Paroi latérale</text>
    <text x="186" y="47">R<tspan baseline-shift="sub" font-size="10">pc</tspan></text>
    <text x="304" y="47">R<tspan baseline-shift="sub" font-size="10">p</tspan></text>
    <text x="422" y="47">R<tspan baseline-shift="sub" font-size="10">ℓ,a</tspan></text>
    <text x="310" y="95">Fond · R<tspan baseline-shift="sub" font-size="10">t</tspan></text>
    <text x="310" y="144">Surface · R<tspan baseline-shift="sub" font-size="10">s</tspan></text>
    <text x="48" y="117">Eau</text>
    <text x="576" y="117">Extérieur</text>
  </g>
</svg>
