<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 208" width="620" height="208" role="img" aria-labelledby="titre desc">
  <title id="titre">Réseau thermique du spa ouvert</title>
  <desc id="desc">L’eau et l’extérieur forment deux nœuds reliés par trois branches parallèles. La branche latérale comporte trois résistances en série, le tapis est dans la branche inférieure et la convection en surface dans la branche supérieure.</desc>
  <g fill="none" stroke="#253748" stroke-width="2" stroke-linecap="round">
