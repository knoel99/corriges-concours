<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 795 442" width="795" height="442" role="img" aria-labelledby="titre desc">
<title id="titre">Substitution nucléophile d’acyle sur le chlorure de pivaloyle</title><desc id="desc">L’alcool attaque le chlorure d’acyle. L’intermédiaire tétraédrique expulse le chlorure, puis l’amine enlève le proton.</desc>
<defs><marker id="pointe" markerWidth="7" markerHeight="7" refX="8" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b6f75"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<g transform="translate(0 0)"><text x="12" y="23" text-anchor="start" font-size="17" fill="#284355">1. Addition de l’alcool de 4</text><text x="33" y="87" text-anchor="middle" font-size="18" fill="#182433">R</text><text x="88" y="87" text-anchor="middle" font-size="18" fill="#182433">O</text><text x="88" y="114" text-anchor="middle" font-size="18" fill="#182433">H</text><text x="232" y="87" text-anchor="middle" font-size="18" fill="#182433">C</text><text x="232" y="37" text-anchor="middle" font-size="18" fill="#182433">O</text><text x="302" y="87" text-anchor="middle" font-size="18" fill="#182433">Cl</text><text x="262" y="113" text-anchor="middle" font-size="18" fill="#182433">tBu</text><path d="M44 81L75 81" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M88 90L88 100" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M245 81L290 81" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M236 87L248 101" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M229 46L229 69" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M235 46L235 69" fill="none" stroke="#182433" stroke-width="1.7"/><circle cx="98" cy="73" r="1.7" fill="#182433"/><circle cx="104" cy="73" r="1.7" fill="#182433"/><circle cx="229" cy="25" r="1.7" fill="#182433"/><circle cx="235" cy="25" r="1.7" fill="#182433"/><path d="M101 72Q161 41 218 73" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><path d="M235 60Q252 53 240 41" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><text x="475" y="78" text-anchor="middle" font-size="26" fill="#284355">→</text><text x="505" y="72" text-anchor="start" font-size="15" fill="#182433">R–O⁺(H)–C(O⁻)(Cl)(tBu)</text><text x="14" y="132" text-anchor="start" font-size="14" fill="#425867">R est la chaîne de 4 portée par l’oxygène de l’alcool primaire.</text></g>
<path d="M12 139H783" stroke="#d1dce1" stroke-width="1"/>
<g transform="translate(0 144)"><text x="12" y="23" text-anchor="start" font-size="17" fill="#284355">2. Retour du carbonyle et élimination du chlorure</text><text x="40" y="86" text-anchor="middle" font-size="18" fill="#182433">R</text><text x="94" y="86" text-anchor="middle" font-size="18" fill="#182433">O⁺</text><text x="94" y="119" text-anchor="middle" font-size="18" fill="#182433">H</text><text x="195" y="86" text-anchor="middle" font-size="18" fill="#182433">C</text><text x="195" y="44" text-anchor="middle" font-size="18" fill="#182433">O⁻</text><text x="270" y="86" text-anchor="middle" font-size="18" fill="#182433">Cl</text><text x="195" y="121" text-anchor="middle" font-size="18" fill="#182433">tBu</text><path d="M50 80L77 80" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M111 80L181 80" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M94 90L94 104" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M195 48L195 70" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M208 80L257 80" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M195 89L195 106" fill="none" stroke="#182433" stroke-width="1.7"/><circle cx="208" cy="43" r="1.7" fill="#182433"/><circle cx="214" cy="43" r="1.7" fill="#182433"/><circle cx="183" cy="27" r="1.7" fill="#182433"/><circle cx="189" cy="27" r="1.7" fill="#182433"/><circle cx="170" cy="42" r="1.7" fill="#182433"/><circle cx="176" cy="42" r="1.7" fill="#182433"/><path d="M211 43Q232 56 203 66" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><path d="M238 79Q251 58 266 74" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><text x="475" y="78" text-anchor="middle" font-size="26" fill="#284355">→</text><text x="505" y="72" text-anchor="start" font-size="15" fill="#182433">R–O⁺(H)–C(=O)–tBu + Cl⁻</text></g>
<path d="M12 283H783" stroke="#d1dce1" stroke-width="1"/>
<g transform="translate(0 288)"><text x="12" y="23" text-anchor="start" font-size="17" fill="#284355">3. Déprotonation</text><text x="46" y="82" text-anchor="middle" font-size="18" fill="#182433">Et₃N</text><text x="151" y="82" text-anchor="middle" font-size="18" fill="#182433">H</text><text x="218" y="82" text-anchor="middle" font-size="18" fill="#182433">O⁺</text><text x="289" y="82" text-anchor="middle" font-size="18" fill="#182433">C(=O)–tBu</text><text x="218" y="112" text-anchor="middle" font-size="18" fill="#182433">R</text><path d="M161 76L201 76" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M237 76L249 76" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M218 84L218 98" fill="none" stroke="#182433" stroke-width="1.7"/><circle cx="69" cy="67" r="1.7" fill="#182433"/><circle cx="75" cy="67" r="1.7" fill="#182433"/><path d="M72 67Q108 41 144 70" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><path d="M178 73Q190 47 214 66" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><text x="475" y="78" text-anchor="middle" font-size="26" fill="#284355">→</text><text x="505" y="72" text-anchor="start" font-size="15" fill="#182433">R–O–C(=O)–tBu</text><text x="505" y="95" text-anchor="start" font-size="15" fill="#182433">Et₃NH⁺ et Cl⁻</text></g>
</g></svg>
