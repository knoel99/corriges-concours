<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 795 442" width="795" height="442" role="img" aria-labelledby="titre desc">
<title id="titre">Hémiacétalisation du sucre en milieu acide</title><desc id="desc">L’aldéhyde est protoné, le doublet de O5 ferme le cycle, puis l’eau déprotone l’oxonium.</desc>
<defs><marker id="pointe" markerWidth="7" markerHeight="7" refX="8" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b6f75"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<g transform="translate(0 0)"><text x="12" y="23" text-anchor="start" font-size="17" fill="#284355">1. Protonation de l’aldéhyde</text><text x="60" y="85" text-anchor="middle" font-size="18" fill="#182433">R</text><text x="124" y="85" text-anchor="middle" font-size="18" fill="#182433">C₁</text><text x="124" y="112" text-anchor="middle" font-size="18" fill="#182433">H</text><text x="184" y="85" text-anchor="middle" font-size="18" fill="#182433">O</text><text x="274" y="85" text-anchor="middle" font-size="18" fill="#182433">H</text><text x="329" y="85" text-anchor="middle" font-size="18" fill="#182433">O⁺H₂</text><path d="M70 79L109 79" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M123 88L123 98" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M283 79L307 79" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M139 76L172 76 M139 82L172 82" fill="none" stroke="#182433" stroke-width="1.7"/><circle cx="195" cy="72" r="1.7" fill="#182433"/><circle cx="201" cy="72" r="1.7" fill="#182433"/><circle cx="180" cy="61" r="1.7" fill="#182433"/><circle cx="186" cy="61" r="1.7" fill="#182433"/><circle cx="343" cy="66" r="1.7" fill="#182433"/><circle cx="349" cy="66" r="1.7" fill="#182433"/><path d="M198 71Q231 40 263 73" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><path d="M295 77Q312 48 324 71" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><text x="475" y="78" text-anchor="middle" font-size="26" fill="#284355">⇌</text><text x="505" y="72" text-anchor="start" font-size="15" fill="#182433">R–C₁(H)=OH⁺ + H₂O</text><text x="14" y="132" text-anchor="start" font-size="14" fill="#425867">R porte l’alcool O₅–H à l’autre bout de la chaîne.</text></g>
