<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 795 298" width="795" height="298" role="img" aria-labelledby="titre desc">
<title id="titre">Addition de l’organozincique et hydrolyse</title><desc id="desc">Les électrons de C–Zn rejoignent le carbone de l’aldéhyde. La liaison pi remonte sur O. L’alcoolate est protoné au traitement aqueux.</desc>
<defs><marker id="pointe" markerWidth="7" markerHeight="7" refX="8" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b6f75"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<g transform="translate(0 0)"><text x="12" y="23" text-anchor="start" font-size="17" fill="#284355">1. Addition de l’organozincique sur l’aldéhyde 7</text><text x="56" y="93" text-anchor="middle" font-size="18" fill="#182433">HC≡C</text><text x="125" y="93" text-anchor="middle" font-size="18" fill="#182433">CH₂</text><text x="214" y="93" text-anchor="middle" font-size="18" fill="#182433">ZnBr</text><text x="332" y="93" text-anchor="middle" font-size="18" fill="#182433">C</text><text x="332" y="46" text-anchor="middle" font-size="18" fill="#182433">O</text><text x="401" y="93" text-anchor="middle" font-size="18" fill="#182433">R</text><text x="358" y="115" text-anchor="middle" font-size="18" fill="#182433">H</text><path d="M82 87L104 87" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M145 87L188 87" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M344 87L390 87" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M338 95L350 104" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M329 56L329 78" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M335 56L335 78" fill="none" stroke="#182433" stroke-width="1.7"/><circle cx="329" cy="32" r="1.7" fill="#182433"/><circle cx="335" cy="32" r="1.7" fill="#182433"/><path d="M160 85Q241 39 320 81" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><path d="M335 66Q355 54 340 47" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><text x="475" y="78" text-anchor="middle" font-size="26" fill="#284355">→</text><text x="505" y="72" text-anchor="start" font-size="15" fill="#182433">R–CH(OZnBr)–CH₂–C≡CH</text><text x="14" y="132" text-anchor="start" font-size="14" fill="#425867">La liaison C–Zn est polarisée vers C.</text></g>
<path d="M12 139H783" stroke="#d1dce1" stroke-width="1"/>
<g transform="translate(0 144)"><text x="12" y="23" text-anchor="start" font-size="17" fill="#284355">2. Protonation de l’alcoolate au traitement aqueux</text><text x="77" y="88" text-anchor="middle" font-size="18" fill="#182433">R′</text><text x="149" y="88" text-anchor="middle" font-size="18" fill="#182433">O⁻</text><text x="254" y="88" text-anchor="middle" font-size="18" fill="#182433">H</text><text x="314" y="88" text-anchor="middle" font-size="18" fill="#182433">O–H</text><path d="M93 82L128 82" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M265 82L291 82" fill="none" stroke="#182433" stroke-width="1.7"/><circle cx="163" cy="70" r="1.7" fill="#182433"/><circle cx="169" cy="70" r="1.7" fill="#182433"/><circle cx="135" cy="59" r="1.7" fill="#182433"/><circle cx="141" cy="59" r="1.7" fill="#182433"/><circle cx="125" cy="96" r="1.7" fill="#182433"/><circle cx="131" cy="96" r="1.7" fill="#182433"/><path d="M166 70Q204 35 246 76" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><path d="M277 80Q290 54 303 75" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><text x="475" y="78" text-anchor="middle" font-size="26" fill="#284355">→</text><text x="505" y="72" text-anchor="start" font-size="15" fill="#182433">R′–OH</text><text x="505" y="95" text-anchor="start" font-size="15" fill="#182433">Zn(OH)Br après hydrolyse</text><text x="14" y="132" text-anchor="start" font-size="14" fill="#425867">R′ désigne le squelette après addition. Le contre-ion ZnBr⁺ est omis dans le dessin.</text></g>
</g></svg>
