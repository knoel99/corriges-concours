<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 795 298" width="795" height="298" role="img" aria-labelledby="titre desc">
<title id="titre">Protection d’un hydroxyle phénolique par MOM</title><desc id="desc">L’oxygène phénolique attaque le méthylène de MOMCl. La rupture de C–Cl forme un oxonium, ensuite déprotoné par la base.</desc>
<defs><marker id="pointe" markerWidth="7" markerHeight="7" refX="8" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0b6f75"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif">
<g transform="translate(0 0)"><text x="12" y="23" text-anchor="start" font-size="17" fill="#284355">1. Substitution nucléophile du chlorure</text><text x="32" y="85" text-anchor="middle" font-size="18" fill="#182433">Ar</text><text x="89" y="85" text-anchor="middle" font-size="18" fill="#182433">O</text><text x="89" y="117" text-anchor="middle" font-size="18" fill="#182433">H</text><text x="262" y="85" text-anchor="middle" font-size="18" fill="#182433">CH₂</text><text x="336" y="85" text-anchor="middle" font-size="18" fill="#182433">Cl</text><text x="262" y="117" text-anchor="middle" font-size="18" fill="#182433">OMe</text><path d="M45 79L75 79" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M89 86L89 103" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M283 79L325 79" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M262 89L262 103" fill="none" stroke="#182433" stroke-width="1.7"/><circle cx="98" cy="67" r="1.7" fill="#182433"/><circle cx="104" cy="67" r="1.7" fill="#182433"/><circle cx="84" cy="61" r="1.7" fill="#182433"/><circle cx="90" cy="61" r="1.7" fill="#182433"/><path d="M101 67Q184 31 246 73" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><path d="M304 77Q318 52 333 71" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><text x="475" y="78" text-anchor="middle" font-size="26" fill="#284355">→</text><text x="505" y="72" text-anchor="start" font-size="15" fill="#182433">Ar–O⁺(H)–CH₂–OMe + Cl⁻</text></g>
<path d="M12 139H783" stroke="#d1dce1" stroke-width="1"/>
<g transform="translate(0 144)"><text x="12" y="23" text-anchor="start" font-size="17" fill="#284355">2. Déprotonation par la diisopropyléthylamine</text><text x="67" y="85" text-anchor="middle" font-size="18" fill="#182433">iPr₂EtN</text><text x="184" y="85" text-anchor="middle" font-size="18" fill="#182433">H</text><text x="251" y="85" text-anchor="middle" font-size="18" fill="#182433">O⁺</text><text x="351" y="85" text-anchor="middle" font-size="18" fill="#182433">CH₂–OMe</text><text x="251" y="116" text-anchor="middle" font-size="18" fill="#182433">Ar</text><path d="M194 79L231 79" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M270 79L304 79" fill="none" stroke="#182433" stroke-width="1.7"/><path d="M251 90L251 104" fill="none" stroke="#182433" stroke-width="1.7"/><circle cx="103" cy="67" r="1.7" fill="#182433"/><circle cx="109" cy="67" r="1.7" fill="#182433"/><path d="M106 67Q148 39 177 73" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><path d="M210 76Q224 50 244 70" fill="none" stroke="#0b6f75" stroke-width="2" marker-end="url(#pointe)"/><text x="475" y="78" text-anchor="middle" font-size="26" fill="#284355">→</text><text x="505" y="72" text-anchor="start" font-size="15" fill="#182433">Ar–O–CH₂–OMe</text><text x="505" y="95" text-anchor="start" font-size="15" fill="#182433">iPr₂EtNH⁺ et Cl⁻</text><text x="14" y="132" text-anchor="start" font-size="14" fill="#425867">La même séquence a lieu sur le second hydroxyle phénolique.</text></g>
</g></svg>
