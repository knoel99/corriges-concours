<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="sans-serif" font-size="14"><rect width="100%" height="100%" fill="white"/><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker><marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b3261e"/></marker><marker id="flb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1a5fb4"/></marker></defs><text x="20.0" y="26.0" font-size="16">Montage à trois électrodes</text><path d="M170,250 L170,400 L550,400 L550,250" fill="none" stroke="#222" stroke-width="2.5"/><rect x="172" y="285" width="376" height="113" fill="#dcecf7"/><rect x="224" y="210" width="12" height="160" fill="#777"/><rect x="354" y="210" width="12" height="160" fill="#444"/><rect x="484" y="210" width="12" height="160" fill="#9a7b2f"/><path d="M230,210 L230,165" fill="none" stroke="#222" stroke-width="2"/><path d="M230,115 L230,70 L275,70" fill="none" stroke="#222" stroke-width="2"/><path d="M325,70 L360,70 L360,210" fill="none" stroke="#222" stroke-width="2"/><path d="M360,140 L465,140" fill="none" stroke="#222" stroke-width="2"/><path d="M490,165 L490,210" fill="none" stroke="#222" stroke-width="2"/><circle cx="360" cy="140" r="4" fill="#222"/><circle cx="230" cy="140" r="25" fill="white" stroke="#222" stroke-width="2"/><text x="230.0" y="147.0" text-anchor="middle" font-size="20">A</text><circle cx="300" cy="70" r="25" fill="white" stroke="#222" stroke-width="2"/><text x="300.0" y="77.0" text-anchor="middle" font-size="20">G</text><circle cx="490" cy="140" r="25" fill="white" stroke="#222" stroke-width="2"/><text x="490.0" y="147.0" text-anchor="middle" font-size="20">V</text><text x="195.0" y="146.0" text-anchor="end" font-size="18">④</text><text x="300.0" y="36.0" text-anchor="middle" font-size="18">⑤</text><text x="525.0" y="146.0" font-size="18">⑥</text><text x="205.0" y="136.0" font-size="12"></text><text x="165.0" y="145.0" text-anchor="end" font-size="13" fill="#b3261e">ampèremètre</text><text x="340.0" y="36.0" font-size="13" fill="#b3261e">générateur de tension réglable</text><text x="555.0" y="140.0" font-size="13" fill="#b3261e">voltmètre (très grande</text><text x="555.0" y="157.0" font-size="13" fill="#b3261e">résistance d'entrée)</text><text x="212.0" y="250.0" text-anchor="end" font-size="18">①</text><text x="342.0" y="250.0" text-anchor="end" font-size="18">②</text><text x="472.0" y="250.0" text-anchor="end" font-size="18">③</text><text x="215.0" y="425.0" text-anchor="middle" font-size="13">contre-électrode</text><text x="215.0" y="442.0" text-anchor="middle" font-size="13">(auxiliaire)</text><text x="360.0" y="425.0" text-anchor="middle" font-size="13">électrode de travail</text><text x="360.0" y="442.0" text-anchor="middle" font-size="13">(platine)</text><text x="505.0" y="425.0" text-anchor="middle" font-size="13">électrode</text><text x="505.0" y="442.0" text-anchor="middle" font-size="13">de référence</text><line x1="242.0" y1="330.0" x2="348.0" y2="330.0" stroke="#b3261e" stroke-width="2" marker-end="url(#flr)" marker-start="url(#flr)"/><text x="295.0" y="322.0" text-anchor="middle" font-size="12" fill="#b3261e">courant i</text><text x="425.0" y="322.0" text-anchor="middle" font-size="12" fill="#1a5fb4">i = 0</text><text x="20.0" y="475.0" font-size="12">Le courant circule entre ① et ② ; le voltmètre mesure le potentiel de ② par rapport à ③, où aucun courant ne passe.</text></svg>
