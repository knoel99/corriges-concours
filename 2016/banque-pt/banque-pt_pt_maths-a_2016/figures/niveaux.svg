<svg xmlns="http://www.w3.org/2000/svg" width="800" height="305" viewBox="0 0 800 305" role="img"><title>Niveaux de la forme quadratique autour du minimum</title><desc>Dans le plan de deux vecteurs propres, les niveaux de la différence au minimum sont des ellipses centrées au minimiseur.</desc><rect width="800" height="305" fill="#fbfaf5"/><text x="18" y="32" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#173e4a" text-anchor="start">Niveaux de la forme quadratique autour du minimum</text><line x1="40" x2="391" y1="166" y2="166" stroke="#45636c" stroke-width="2" /><line x1="211" x2="211" y1="258" y2="57" stroke="#45636c" stroke-width="2" /><text x="384" y="189" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">h₋</text><text x="194" y="54" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">h₊</text><ellipse cx="211" cy="166" rx="143.00" ry="59.23" stroke="#27796f" stroke-width="3" fill="none"/><ellipse cx="211" cy="166" rx="102.12" ry="42.30" stroke="#b37637" stroke-width="3" fill="none"/><ellipse cx="211" cy="166" rx="58.96" ry="24.42" stroke="#5b7396" stroke-width="3" fill="none"/><circle cx="211" cy="166" r="4" fill="#233d49"/><text x="409" y="92" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#173e4a" text-anchor="start">Déplacement h = u − u*</text><text x="409" y="136" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">Sur l’axe h₋ : poids 2 − √2.</text><text x="409" y="170" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">Sur l’axe h₊ : poids 2 + √2.</text><text x="409" y="218" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">Une même variation de J permet</text><text x="409" y="243" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">un écart plus grand sur le premier axe.</text><text x="28" y="284" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#173e4a" text-anchor="start">Coupe h₀ = 0 dans la base propre de la partie I.</text></svg>
