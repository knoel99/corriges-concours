<svg xmlns="http://www.w3.org/2000/svg" width="800" height="305" viewBox="0 0 800 305" role="img"><title>Nombre de piles dans la seconde série</title><desc>Pour une pièce équilibrée, la masse en zéro et la queue géométrique des masses positives proviennent de deux événements différents.</desc><rect width="800" height="305" fill="#fbfaf5"/><text x="18" y="32" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#173e4a" text-anchor="start">Nombre de piles dans la seconde série</text><line x1="52" x2="425" y1="243" y2="243" stroke="#45636c" stroke-width="2" /><line x1="52" x2="52" y1="243" y2="61" stroke="#45636c" stroke-width="2" /><text x="26" y="68" font-family="DejaVu Sans" font-size="14" font-weight="normal" fill="#173e4a" text-anchor="start">0,5</text><text x="417" y="266" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">k</text><text x="480" y="94" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#173e4a" text-anchor="start">Exemple p = 1/2</text><rect x="66" y="124.67" width="29" height="118.33" fill="#b36b35"/><text x="80" y="267" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="middle">0</text><rect x="125" y="85.22" width="29" height="157.78" fill="#27796f"/><text x="139" y="267" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="middle">1</text><rect x="184" y="190.41" width="29" height="52.59" fill="#27796f"/><text x="198" y="267" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="middle">2</text><rect x="243" y="225.47" width="29" height="17.53" fill="#27796f"/><text x="257" y="267" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="middle">3</text><rect x="302" y="237.16" width="29" height="5.84" fill="#27796f"/><text x="316" y="267" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="middle">4</text><rect x="361" y="241.05" width="29" height="1.95" fill="#27796f"/><text x="375" y="267" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="middle">5</text><text x="480" y="141" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">P(X = 0) = 1/3</text><text x="480" y="179" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">P(X = 1) = 4/9</text><text x="480" y="220" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">À partir de k = 1, chaque barre</text><text x="480" y="245" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">vaut un tiers de la précédente.</text></svg>
