<svg xmlns="http://www.w3.org/2000/svg" width="760" height="178" viewBox="0 0 760 178" role="img"><title>Deux mesures dans l’infographie de Focus</title><rect width="760" height="178" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#193746">
<text x="12" y="25" font-size="20" font-weight="700">Deux mesures dans l’infographie de Focus</text>
<rect x="10" y="40" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="63" font-size="17" font-weight="700">Automobile</text>
<path d="M236 57h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="40" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="63" font-size="17" font-weight="400">33,1 % des usages industriels de robots recensés.</text>
