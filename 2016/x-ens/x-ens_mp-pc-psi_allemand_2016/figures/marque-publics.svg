<svg xmlns="http://www.w3.org/2000/svg" width="780" height="221" viewBox="0 0 780 221" role="img"><title>Trois lectures de la confiance après le scandale Volkswagen, dans les pièces de la partie A.</title><rect width="780" height="221" fill="#f5f7f5"/>
<text x="18" y="33" fill="#173c44" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Qui juge le constructeur ?</text>
<rect x="18" y="49" width="744" height="50" fill="#e2efea"/>
<text x="31" y="80" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Dans le magasin</text>
<text x="277" y="70" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Certains acheteurs berlinois</text>
<text x="277" y="91" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">jugent le produit et son prix.</text>
<rect x="18" y="103" width="744" height="50" fill="#edf1f2"/>
<text x="31" y="134" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Dans le débat allemand</text>
<text x="277" y="124" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Le commentaire de Die Zeit</text>
<text x="277" y="145" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">lie produit et réputation morale.</text>
<rect x="18" y="157" width="744" height="50" fill="#e4edf0"/>
<text x="31" y="188" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Dans la lettre ouverte</text>
<text x="277" y="178" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Zhang Danhong, Deutsche Welle</text>
<text x="277" y="199" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">joue ironiquement sur la fidélité.</text></svg>
