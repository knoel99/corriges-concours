<svg xmlns="http://www.w3.org/2000/svg" width="948" height="397" viewBox="0 0 948 397" role="img">
<title>Trois jugements possibles sur une même décision</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Question posée</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Épreuve de vérification</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Registre</text>
<rect x="13" y="62" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Le règlement a-t-il été</text>
<text x="24" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">adopté régulièrement ?</text>
<rect x="323" y="62" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Identifier la règle de</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">compétence et la procédure</text>
<text x="334" y="135" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">suivie</text>
<rect x="633" y="62" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Validité dans un ordre</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">déterminé</text>
<rect x="13" y="163" width="302" height="69" rx="7" fill="#e0edef"/>
<text x="24" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Les services l’appliquent-ils</text>
<text x="24" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">?</text>
<rect x="323" y="163" width="302" height="69" rx="7" fill="#edf1e5"/>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Examiner des dossiers, des</text>
<text x="334" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">pratiques et des décisions</text>
<rect x="633" y="163" width="302" height="69" rx="7" fill="#f7eddf"/>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Efficacité dans les faits</text>
<rect x="13" y="241" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Le critère de répartition</text>
<text x="24" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">est-il juste ?</text>
<rect x="323" y="241" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Expliciter le principe</text>
<text x="334" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">défendu et le confronter aux</text>
<text x="334" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">objections</text>
<rect x="633" y="241" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Appréciation morale ou</text>
<text x="644" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">politique</text>
<text x="19" y="359" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">Un idéal d’égalité inscrit dans un texte positif peut aussi fournir une norme de contrôle</text>
<text x="19" y="383" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">juridique.</text>
</svg>
