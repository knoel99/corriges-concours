<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Pourquoi une objection réfutée ne suffit-elle pas ?</title>
<desc id="description">Accumuler Juxtaposer des anomalies disparates. Impression d’abondance. Contredire Examiner un indice précis. Le reste du dossier demeure. Répondre Distribuer le travail entre citoyens. Rééquilibrer les prises de parole.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Pourquoi une objection réfutée ne suffit-elle pas ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Procédé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Accumuler</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Juxtaposer des anomalies</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">disparates.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Impression d’abondance.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Contredire</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Examiner un indice précis.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le reste du dossier</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">demeure.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Répondre</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Distribuer le travail</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">entre citoyens.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Rééquilibrer les prises de</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">parole.</text>
</g>
</svg>
