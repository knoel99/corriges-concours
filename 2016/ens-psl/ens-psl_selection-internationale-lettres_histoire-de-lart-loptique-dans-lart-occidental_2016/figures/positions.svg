<svg xmlns="http://www.w3.org/2000/svg" width="880" height="342" viewBox="0 0 880 342" role="img"><title>Trois dispositifs, trois positions pour le regard</title><desc>Schémas originaux, sans échelle : miroir convexe, positions de lecture de l’anamorphose, relation entre la plate-forme et la paroi peinte du cyclorama.</desc><rect width="880" height="342" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="24" y="38" font-size="25" fill="#17394c" font-weight="bold">Trois dispositifs, trois positions pour le regard</text><rect x="24" y="59" width="264" height="206" fill="#e7eee9" stroke="#9eab9b" stroke-width="1.5"/><text x="34" y="85" font-size="19" fill="#17394c" font-weight="bold">1  Miroir convexe</text><text x="27" y="295" font-size="15" fill="#17394c">Détail du portrait de Van Eyck.</text><text x="27" y="318" font-size="15" fill="#17394c">Le reflet élargit la vue.</text><rect x="307" y="59" width="264" height="206" fill="#e7eee9" stroke="#9eab9b" stroke-width="1.5"/><text x="317" y="85" font-size="19" fill="#17394c" font-weight="bold">2  Anamorphose</text><text x="310" y="295" font-size="15" fill="#17394c">Deux points de vue chez Holbein.</text><text x="310" y="318" font-size="15" fill="#17394c">Le motif se lit de biais.</text><rect x="590" y="59" width="264" height="206" fill="#e7eee9" stroke="#9eab9b" stroke-width="1.5"/><text x="600" y="85" font-size="19" fill="#17394c" font-weight="bold">3  Cyclorama</text><text x="593" y="295" font-size="15" fill="#17394c">Coupe de la rotonde de Buffalo.</text><text x="593" y="318" font-size="15" fill="#17394c">La peinture entoure le public.</text><circle cx="155" cy="172" r="60" fill="#ccba8e" stroke="#92743b" stroke-width="4"/><circle cx="155" cy="172" r="49" fill="#94adac" stroke="#3f606c" stroke-width="2"/><circle cx="143" cy="160" r="4" fill="#425455" stroke="none" stroke-width="1"/><line x1="143" y1="165" x2="143" y2="177" stroke="#425455" stroke-width="3"/><circle cx="169" cy="161" r="4" f