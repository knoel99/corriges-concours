<svg xmlns="http://www.w3.org/2000/svg" width="948" height="443" viewBox="0 0 948 443" role="img">
<title>Comparer les voies de recours à partir d’un même accident</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Question</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">En France</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="bold" fill="white">Angleterre et pays de Galles</text>
<rect x="13" y="62" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Qui reçoit la demande ?</text>
<rect x="323" y="62" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Identifier la nature du</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">service et de l’acte en cause</text>
<rect x="633" y="62" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Identifier le recours et la</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">juridiction compétente dans</text>
<text x="644" y="135" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">le système judiciaire</text>
<rect x="13" y="163" width="302" height="115" rx="7" fill="#e0edef"/>
<text x="24" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Que demande le requérant ?</text>
<rect x="323" y="163" width="302" height="115" rx="7" fill="#edf1e5"/>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">L’annulation d’un acte et la</text>
<text x="334" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">réparation d’un dommage</text>
<text x="334" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">obéissent à des conditions</text>
<text x="334" y="259" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">distinctes</text>
<rect x="633" y="163" width="302" height="115" rx="7" fill="#f7eddf"/>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Le contrôle de légalité et</text>
<text x="644" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">une action en responsabilité</text>
<text x="644" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">répondent à des conditions</text>
<text x="644" y="259" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">distinctes</text>
<rect x="13" y="287" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">À quoi mesurer la protection</text>
<text x="24" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">?</text>
<rect x="323" y="287" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Accès au juge, délais,</text>
<text x="334" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">indépendance, exécution</text>
<rect x="633" y="287" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Comparer ces mêmes critères à</text>
<text x="644" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">affaires et recours</text>
<text x="644" y="360" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">comparables</text>
<text x="19" y="405" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">Une organisation différente peut remplir des fonctions comparables. La seule existence d’un</text>
<text x="19" y="429" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">juge spécialisé ne mesure pas la protection.</text>
</svg>
