<svg xmlns="http://www.w3.org/2000/svg" width="760" height="238" viewBox="0 0 760 238" role="img" aria-labelledby="title desc">
<title id="title">Présence et détection d’un visage</title><desc id="desc">Les masques donnent un exemple de déclenchement sans visage réel et les visages cachés de l’écart inverse.</desc>
<rect width="760" height="238" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="158" y="34" fill="#1c6667" font-size="19" font-weight="700" text-anchor="start">Mécanisme activé</text>
<text x="464" y="34" fill="#1c6667" font-size="19" font-weight="700" text-anchor="start">Mécanisme silencieux</text>
<text x="14" y="92" fill="#172c37" font-size="18" font-weight="700" text-anchor="start">Visage</text>
<text x="14" y="115" fill="#172c37" font-size="18" font-weight="700" text-anchor="start">présent</text>
<rect x="148" y="52" width="296" height="80" rx="5" fill="#e6f3ef" stroke="none"/>
<text x="160" y="84" fill="#172c37" font-size="20" font-weight="700" text-anchor="start">Visage reconnu</text>
<text x="160" y="112" fill="#172c37" font-size="17" font-weight="400" text-anchor="start">Domaines propre et réel</text>
<rect x="454" y="52" width="296" height="80" rx="5" fill="#fcf0df" stroke="none"/>
<text x="466" y="84" fill="#172c37" font-size="20" font-weight="700" text-anchor="start">Visage dissimulé</text>
<text x="466" y="112" fill="#172c37" font-size="17" font-weight="400" text-anchor="start">Domaine propre seulement</text>
<text x="14" y="182" fill="#172c37" font-size="18" font-weight="700" text-anchor="start">Visage</text>
<text x="14" y="205" fill="#172c37" font-size="18" font-weight="700" text-anchor="start">absent</text>
<rect x="148" y="142" width="296" height="80" rx="5" fill="#fcf0df" stroke="none"/>
<text x="160" y="174" fill="#172c37" font-size="20" font-weight="700" text-anchor="start">Masque évocateur</text>
<text x="160" y="202" fill="#172c37" font-size="17" font-weight="400" text-anchor="start">Domaine réel seulement</text>
<rect x="454" y="142" width="296" height="80" rx="5" fill="#edf0f1" stroke="none"/>
<text x="466" y="174" fill="#172c37" font-size="20" font-weight="700" text-anchor="start">Chaise ordinaire</text>
<text x="466" y="202" fill="#172c37" font-size="17" font-weight="400" text-anchor="start">Hors des deux domaines</text></g>
</svg>
