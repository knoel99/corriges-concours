<svg xmlns="http://www.w3.org/2000/svg" width="760" height="238" viewBox="0 0 760 238" role="img" aria-labelledby="title desc">
<title id="title">Quatre combinaisons de frappe et d’affichage</title><desc id="desc">Expérience 2. Un ralentissement suit les frappes erronées, même corrigées. Le jugement binaire majoritaire suit le mot affiché.</desc>
