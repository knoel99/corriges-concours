<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Où le cas de Harald est-il déterminé ?</title>
<desc id="description">Manquer d’argent Harald · accusatif Le prédicat impose ce cas. Espérer manquer d’argent Haraldur · nominatif Espérer a son propre sujet. Le sujet inférieur est PRO. Sembler manquer d’argent Harald · accusatif Le sujet de manquer monte et conserve son cas.</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Où le cas de Harald est-il déterminé ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Construction</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Nom prononcé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Analyse</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Manquer d’argent</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Harald · accusatif</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le prédicat impose ce cas.</text>
<rect x="10" y="137" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Espérer manquer</text>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">d’argent</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Haraldur · nominatif</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Espérer a son propre sujet.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le sujet inférieur est PRO.</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Sembler manquer</text>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">d’argent</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Harald · accusatif</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Le sujet de manquer monte</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">et conserve son cas.</text>
</g>
</svg>
