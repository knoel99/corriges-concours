<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois effacements qui favorisent CV</title>
<desc id="description">tre.no Retirer la seconde consonne de l’attaque. te.no tja.ra Retirer la semi-voyelle du noyau. ta.ra pas.ta Retirer la coda de la première syllabe. pa.ta</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois effacements qui favorisent CV</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de départ</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Modification</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Point d’arrivée</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">tre.no</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Retirer la seconde</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">consonne de l’attaque.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">te.no</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">tja.ra</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Retirer la semi-voyelle du</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">noyau.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">ta.ra</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">pas.ta</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Retirer la coda de la</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">première syllabe.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">pa.ta</text>
</g>
</svg>
