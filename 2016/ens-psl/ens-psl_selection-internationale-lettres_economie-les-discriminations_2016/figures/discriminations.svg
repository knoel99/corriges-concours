<svg xmlns="http://www.w3.org/2000/svg" width="948" height="420" viewBox="0 0 948 420" role="img">
<title>Ce que chaque comparaison permet d’établir</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Comparaison</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Quantité observée</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Limite</text>
<rect x="13" y="62" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Salaires moyens entre groupes</text>
<rect x="323" y="62" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Écart brut à une date et pour</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">une population données</text>
<rect x="633" y="62" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Temps travaillé, secteur et</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">sélection dans l’emploi</text>
<text x="644" y="135" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">peuvent différer</text>
<rect x="13" y="163" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Salaires à caractéristiques</text>
<text x="24" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">enregistrées comparables</text>
<rect x="323" y="163" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Écart conditionnel aux</text>
<text x="334" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">variables retenues</text>
<rect x="633" y="163" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Certaines variables résultent</text>
<text x="644" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">de traitements inégaux</text>
<text x="644" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">antérieurs</text>
<rect x="13" y="264" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">CV fictifs avec signal</text>
<text x="24" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">assigné au hasard</text>
<rect x="323" y="264" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Différence de rappels causée</text>
<text x="334" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">par le signal dans ce</text>
<text x="334" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">protocole</text>
<rect x="633" y="264" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Ne mesure directement ni les</text>
<text x="644" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">salaires ni l’ensemble des</text>
<text x="644" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">carrières</text>
<text x="19" y="382" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">Une explication du comportement des employeurs et une mesure de ses effets répondent à deux</text>
<text x="19" y="406" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">questions distinctes.</text>
</svg>
