<svg xmlns="http://www.w3.org/2000/svg" width="830" height="195" viewBox="0 0 830 195" role="img"><title>Comment se construit un artisanat local ?</title><rect width="830" height="195" rx="14" fill="#f6f8f5"/><text x="23" y="35" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="23" fill="#153352">Comment se construit un artisanat local ?</text><rect x="22" y="59" width="240" height="114" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/><text x="35" y="88" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="19" fill="#165951">Un projet public</text><text x="35" y="117" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Formation, matériaux</text><text x="35" y="140" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">et modèles proposés.</text><path d="M265 117h19m-7 -6 7 6 -7 6" fill="none" stroke="#315c76" stroke-width="3"/><rect x="292" y="59" width="240" height="114" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/><text x="305" y="88" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="19" fill="#165951">Une appropriation</text><text x="305" y="117" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Des ménages donnent du</text><text x="305" y="140" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">temps au projet.</text><path d="M535 117h19m-7 -6 7 6 -7 6" fill="none" stroke="#315c76" stroke-width="3"/><rect x="562" y="59" width="240" height="114" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/><text x="575" y="88" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="19" fill="#165951">Une pratique suivie</text><text x="575" y="117" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Réunions, production</text><text x="575" y="140" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">et vente en commun.</text></svg>
