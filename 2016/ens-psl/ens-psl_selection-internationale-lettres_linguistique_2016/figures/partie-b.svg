<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Deux configurations où isoler une lecture</title>
<desc id="description">Rhume après une rencontre passée Rencontre, rhume, parole. Le rhume est antérieur à la parole seulement. Arrivée avant une rencontre future Parole, arrivée, rencontre. L’arrivée est antérieure à la rencontre seulement. Rhume avant une rencontre passée Rhume, rencontre, parole. La chronologie seule ne sépare pas les deux lectures.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux configurations où isoler une lecture</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Situation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ordre dans le temps</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conclusion</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Rhume après une</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">rencontre passée</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Rencontre, rhume, parole.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le rhume est antérieur à la</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">parole seulement.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Arrivée avant une</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">rencontre future</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Parole, arrivée,</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">rencontre.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">L’arrivée est antérieure à</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">la rencontre seulement.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Rhume avant une</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">rencontre passée</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Rhume, rencontre, parole.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La chronologie seule ne</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">sépare pas les deux</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">lectures.</text>
</g>
</svg>
