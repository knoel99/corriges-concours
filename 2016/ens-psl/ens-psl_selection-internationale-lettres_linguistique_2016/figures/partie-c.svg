<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Du signe compris à la phonologie</title>
<desc id="description">THÉ Même prototype gestuel, configurations variables. Une même évocation peut tolérer plusieurs formes. Paires minimales Aucune paire assurée dans le matériau recueilli. Indice dépendant de la taille du corpus. Comparaison des générations Suivre la stabilité et le pouvoir distinctif de chaque trait. Mettre à l’épreuve l’hypothèse d’une émergence.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Du signe compris à la phonologie</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Indice</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Observation</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Portée</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">THÉ</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Même prototype gestuel,</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">configurations variables.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Une même évocation peut</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">tolérer plusieurs formes.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Paires minimales</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Aucune paire assurée dans</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">le matériau recueilli.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Indice dépendant de la</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">taille du corpus.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Comparaison des</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">générations</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Suivre la stabilité et le</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">pouvoir distinctif de</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">chaque trait.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Mettre à l’épreuve</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">l’hypothèse d’une</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">émergence.</text>
</g>
</svg>
