<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Où le contraste se voit-il ?</title>
<desc id="description">En bord de mot p simple. La forme de bord ne suffit pas à établir le phonème. Entre deux voyelles Géminée ou fricative. Deux consonnes peuvent contraster ici. Dans le dérivé de « fainéant » Le p final correspond à une fricative intervocalique. L’alternance favorise la lénition de la simple.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Où le contraste se voit-il ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Position</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Série labiale</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce que montre le corpus</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">En bord de mot</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">p simple.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La forme de bord ne suffit</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">pas à établir le phonème.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Entre deux voyelles</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Géminée ou fricative.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Deux consonnes peuvent</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">contraster ici.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Dans le dérivé de «</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">fainéant »</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le p final correspond à</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">une fricative</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">intervocalique.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">L’alternance favorise la</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">lénition de la simple.</text>
</g>
</svg>
