<svg xmlns="http://www.w3.org/2000/svg" width="830" height="228" viewBox="0 0 830 228" role="img"><title>Un comité, deux conceptions de la participation</title><rect width="830" height="228" rx="14" fill="#f6f8f5"/><text x="23" y="35" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="23" fill="#153352">Un comité, deux conceptions de la participation</text><rect x="22" y="53" width="386" height="153" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/><text x="36" y="82" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="20" fill="#165951">Sylvie</text><text x="36" y="113" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Les sociabilités anciennes</text><text x="36" y="136" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">entretiennent l’engagement local.</text><path d="M36 153h356" stroke="#c6d9d3"/><text x="36" y="178" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#284e68">Le lien durable fait autorité.</text><rect x="421" y="53" width="386" height="153" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/><text x="435" y="82" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="20" fill="#165951">Delphine</text><text x="435" y="113" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Un projet partenarial doit accueillir</text><text x="435" y="136" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">les nouveaux venus.</text><path d="M435 153h356" stroke="#c6d9d3"/><text x="435" y="178" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#284e68">Une distance peut protéger l’accès.</text></svg>
