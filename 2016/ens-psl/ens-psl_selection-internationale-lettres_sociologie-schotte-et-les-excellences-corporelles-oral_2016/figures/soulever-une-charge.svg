<svg xmlns="http://www.w3.org/2000/svg" width="830" height="228" viewBox="0 0 830 228" role="img"><title>Que mesure le fait de porter une charge ?</title><rect width="830" height="228" rx="14" fill="#f6f8f5"/><text x="23" y="35" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="23" fill="#153352">Que mesure le fait de porter une charge ?</text><rect x="22" y="53" width="386" height="153" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/><text x="36" y="82" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="20" fill="#165951">Dans un soin</text><text x="36" y="113" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">La charge sert une progression adaptée</text><text x="36" y="136" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">à une personne.</text><path d="M36 153h356" stroke="#c6d9d3"/><text x="36" y="178" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#284e68">Critère : récupération fonctionnelle.</text><rect x="421" y="53" width="386" height="153" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/><text x="435" y="82" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="20" fill="#165951">Dans une compétition</text><text x="435" y="113" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Un règlement rend les performances</text><text x="435" y="136" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">comparables.</text><path d="M435 153h356" stroke="#c6d9d3"/><text x="435" y="178" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="15" fill="#284e68">Critère : classement sportif.</text></svg>
