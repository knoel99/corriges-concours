<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 283" role="img" aria-labelledby="t desc">
<title id="t">Qui les victimes désignent-elles ?</title><desc id="desc">Parmi les femmes victimes, 31 % déclarent un conjoint ou ex-conjoint, 28 % une personne inconnue. Parmi les hommes victimes, ces parts sont 13 % et 51 %.</desc>
<rect width="770" height="283" fill="white"/>
<text x="12" y="28" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="23" fill="#203744">Auteur déclaré parmi les victimes de chaque sexe</text>
<text x="12" y="55" font-family="DejaVu Sans, sans-serif" font-weight="normal" font-size="17" fill="#203744">Violences physiques ou sexuelles au cours des deux années précédentes</text>
<text x="16" y="115" font-family="DejaVu Sans, sans-serif" font-weight="normal" font-size="16" fill="#203744">Femmes</text>
<rect x="119" y="101" height="16" width="217" fill="#155d68"/>
<text x="347" y="115" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="16" fill="#203744">31 %</text>
<text x="16" y="142" font-family="DejaVu Sans, sans-serif" font-weight="normal" font-size="16" fill="#203744">Hommes</text>
<rect x="119" y="128" height="16" width="91" fill="#794b2d"/>
<text x="221" y="142" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="16" fill="#203744">13 %</text>
<text x="16" y="206" font-family="DejaVu Sans, sans-serif" font-weight="normal" font-size="16" fill="#203744">Femmes</text>
<rect x="119" y="192" height="16" width="196" fill="#155d68"/>
<text x="326" y="206" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="16" fill="#203744">28 %</text>
<text x="16" y="233" font-family="DejaVu Sans, sans-serif" font-weight="normal" font-size="16" fill="#203744">Hommes</text>
<rect x="119" y="219" height="16" width="357" fill="#794b2d"/>
<text x="487" y="233" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="16" fill="#203744">51 %</text>
<text x="13" y="88" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="18" fill="#203744">Un conjoint ou un ex-conjoint</text>
<text x="13" y="179" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="18" fill="#203744">Une personne inconnue</text>
<text x="12" y="268" font-family="DejaVu Sans, sans-serif" font-weight="normal" font-size="14" fill="#203744">Champ : victimes de 18 à 75 ans en logement ordinaire, France métropolitaine. Insee, tableau 3.</text>
</svg>
