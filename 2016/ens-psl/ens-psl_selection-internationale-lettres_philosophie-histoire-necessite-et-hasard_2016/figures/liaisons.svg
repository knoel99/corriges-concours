<svg xmlns="http://www.w3.org/2000/svg" width="880" height="347" viewBox="0 0 880 347" role="img"><title>Trois suites, trois rapports entre les états</title><desc>Une règle régulière, des résultats non reliés, puis une seconde série qui transforme la première.</desc><rect width="880" height="347" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="21" y="37" font-size="25" fill="#17394c" font-weight="bold">Trois suites, trois rapports entre les états</text><rect x="22" y="63" width="835" height="66" fill="#eaf0ea" stroke="none" stroke-width="1"/><text x="36" y="92" font-size="16" fill="#17394c" font-weight="bold">Règle fermée</text><text x="370" y="95" font-size="15" fill="#17394c">Les états se déduisent de la règle et de l’état de départ.</text><line x1="236" y1="107" x2="280" y2="107" stroke="#455c69" stroke-width="2"/><line x1="280" y1="107" x2="325" y2="107" stroke="#455c69" stroke-width="2"/><circle cx="236" cy="107" r="5" fill="#31576a" stroke="none" stroke-width="1"/><circle cx="280" cy="107" r="5" fill="#31576a" stroke="none" stroke-width="1"/><circle cx="325" cy="107" r="5" fill="#31576a" stroke="none" stroke-width="1"/><rect x="22" y="140" width="835" height="66" fill="#eaf0ea" stroke="none" stroke-width="1"/><text x="36" y="169" font-size="16" fill="#17394c" font-weight="bold">Tirages indépendants</text><text x="370" y="172" font-size="15" fill="#17394c">Un résultat ne modifie pas les résultats suivants.</text><circle cx="236" cy="184" r="5" fill="#31576a" stroke="none" stroke-width="1"/><circle cx="280" cy="184" r="5" fill="#31576a" stroke="none" stroke-width="1"/><circle cx="325" cy="184" r="5" fill="#31576a" stroke="none" stroke-width="1"/><rect x="22" y="217" width="835" height="66" fill="#eaf0ea" stroke="none" stroke-width="1"/><text x="36" y="246" font-size="16" fill="#17394c" font-weight="bold">Rencontre de séries</text><text x="370" y="249" font-size="15" fill="#17394c">Une rencontre change les positions ultérieures.</text><line x1="236" y1="261" x2="280" y2="261" stroke="#455c69" stroke-width="2"/><line x1="280" y1="261" x2="325" y2="243" stroke="#455c69" stroke-width="2"/><line x1="236" y1="234" x2="280" y2="261" stroke="#9a623a" stroke-width="2"/><circle cx="236" cy="234" r="4" fill="#9a623a" stroke="none" stroke-width="1"/><circle cx="236" cy="261" r="5" fill="#31576a" stroke="none" stroke-width="1"/><circle cx="280" cy="261" r="5" fill="#31576a" stroke="none" stroke-width="1"/><circle cx="325" cy="243" r="5" fill="#31576a" stroke="none" stroke-width="1"/><text x="24" y="326" font-size="15" fill="#17394c">Les points sont des états. Les traits indiquent des relations explicatives, non de simples dates.</text></g></svg>
