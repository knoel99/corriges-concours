<svg xmlns="http://www.w3.org/2000/svg" width="810" height="278" viewBox="0 0 810 278" role="img" aria-labelledby="titre description"><title id="titre">Deux inférences locales possibles devant une rue mouillée</title><desc id="description">La même observation peut activer une conclusion par défaut ou la suspendre selon qu’un souvenir du lavage est saillant. La sélection dépend de ressources limitées.</desc><rect width="810" height="278" fill="#fff"/>
<rect x="9" y="12" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Observation</text>
<text x="167.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">La rue est mouillée</text>
<rect x="384" y="12" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Règle ordinaire disponible</text>
<text x="592.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">La pluie fournit une explication par défaut.</text>
<path d="M330 48 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="100" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Indice de contexte</text>
<text x="167.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">C’est le jour du lavage mensuel</text>
<rect x="384" y="100" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Souvenir du nettoyage rendu saillant</text>
<text x="592.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Un autre traitement obtient des ressources.</text>
<path d="M330 136 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="188" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Conséquence</text>
<text x="167.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">La prémisse par défaut est suspendue</text>
<rect x="384" y="188" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Conclusion révisable</text>
<text x="592.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Le lavage devient une explication possible.</text>
<path d="M330 224 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
</svg>
