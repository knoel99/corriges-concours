<svg xmlns="http://www.w3.org/2000/svg" width="780" height="197" viewBox="0 0 780 197" role="img"><title>Ce que le transfert laisse entre les partenaires.</title><rect width="100%" height="100%" fill="#fbfcf9"/>
<text x="16" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Prestation</text>
<text x="245" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Après le transfert</text>
<text x="490" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Ce qu’il faut observer</text>
<rect x="7" y="43" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Don cérémoniel</text>
<text x="245" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Une obligation de retour</text>
<text x="490" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Rang et alliances</text>
<rect x="7" y="90" width="765" height="40" rx="6" fill="#f1f1e6"/>
<text x="16" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Achat comptant</text>
<text x="245" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Une créance peut s’éteindre</text>
<text x="490" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Règles de vente et garanties</text>
<rect x="7" y="137" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Budget du ménage</text>
<text x="245" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Un usage souvent assigné</text>
<text x="490" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Qui dispose de la somme ?</text></svg>
