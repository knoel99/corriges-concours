<svg xmlns="http://www.w3.org/2000/svg" width="948" height="397" viewBox="0 0 948 397" role="img">
<title>Trois mesures différentes dans le dossier sur la santé</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Ce que l’on observe</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Comment se lit la valeur</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Question laissée ouverte</text>
<rect x="13" y="62" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Dépenses en 2008</text>
<rect x="323" y="62" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">11,2 % du PIB en France ;</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">16,4 % aux États-Unis</text>
<rect x="633" y="62" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Différences de prix, de</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">volumes, de population et de</text>
<text x="644" y="135" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">prise en charge ?</text>
<rect x="13" y="163" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Années de vie à 35 ans en</text>
<text x="24" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">France, 2000–2008</text>
<rect x="323" y="163" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Écart hommes cadres–ouvriers</text>
<text x="334" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">: 47,2 moins 40,9, soit 6,3</text>
<text x="334" y="236" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">ans</text>
<rect x="633" y="163" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Quels déterminants expliquent</text>
<text x="644" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">les écarts observés ?</text>
<rect x="13" y="264" width="302" height="69" rx="7" fill="#e0edef"/>
<text x="24" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Prime annuelle de risque</text>
<rect x="323" y="264" width="302" height="69" rx="7" fill="#edf1e5"/>
<text x="334" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">500 dollars pour un risque</text>
<text x="334" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">additionnel de 1 sur 10 000</text>
<rect x="633" y="264" width="302" height="69" rx="7" fill="#f7eddf"/>
<text x="644" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">À quelles conditions peut-on</text>
<text x="644" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">transférer cette estimation ?</text>
<text x="19" y="359" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">La valeur statistique d’une petite variation du risque sert à comparer des politiques de</text>
<text x="19" y="383" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">prévention.</text>
</svg>
