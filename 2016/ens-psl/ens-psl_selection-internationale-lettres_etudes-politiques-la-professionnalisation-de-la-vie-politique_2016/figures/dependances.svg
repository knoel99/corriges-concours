<svg xmlns="http://www.w3.org/2000/svg" width="830" height="195" viewBox="0 0 830 195" role="img">
<title>Du revenu du mandat à la carrière</title>
<rect width="830" height="195" rx="14" fill="#f6f8f5"/>
<text x="23" y="35" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="23" fill="#153352">Du revenu du mandat à la carrière</text>
<rect x="22" y="59" width="240" height="114" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/>
<text x="35" y="88" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="19" fill="#165951">Entrée</text>
<text x="35" y="117" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Une indemnité libère</text>
<text x="35" y="140" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">du temps.</text>
<path d="M265 117h19m-7 -6 7 6 -7 6" fill="none" stroke="#315c76" stroke-width="3"/>
<rect x="292" y="59" width="240" height="114" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/>
<text x="305" y="88" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="19" fill="#165951">Spécialisation</text>
<text x="305" y="117" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Des savoir-faire et</text>
<text x="305" y="140" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">des réseaux se</text>
<text x="305" y="163" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">forment.</text>
<path d="M535 117h19m-7 -6 7 6 -7 6" fill="none" stroke="#315c76" stroke-width="3"/>
<rect x="562" y="59" width="240" height="114" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/>
<text x="575" y="88" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="19" fill="#165951">Renouvellement</text>
<text x="575" y="117" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">La sélection partisane</text>
<text x="575" y="140" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">pèse sur la carrière.</text>
</svg>
