<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Two measures, two distinct claims</title>
<desc id="description">All offences Since 1995. Total down by almost two thirds. Truancy Compared with 2008. A pupil is one third less likely to play truant. Social repair Interpretation of the trends. Raised as a question.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Two measures, two distinct claims</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Measure</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Comparison</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Result in the text</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">All offences</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Since 1995.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Total down by almost two</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">thirds.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Truancy</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Compared with 2008.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">A pupil is one third less</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">likely to play truant.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Social repair</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Interpretation of the</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">trends.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Raised as a question.</text>
</g>
</svg>
