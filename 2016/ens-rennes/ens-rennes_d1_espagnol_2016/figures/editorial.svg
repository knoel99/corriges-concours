<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">¿Cómo enlaza el editorial los ejemplos?</title>
<desc id="description">Frontera concreta El túnel de la Mancha. Incluso Londres necesita cooperación. Política interior Uso electoral de la inquietud. Los gobiernos deben explicar los costes. Proyecto europeo Asilo y acogida. Una respuesta común acorde con sus valores.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿Cómo enlaza el editorial los ejemplos?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Escala</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ejemplo</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conclusión del periódico</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Frontera concreta</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">El túnel de la Mancha.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Incluso Londres necesita</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">cooperación.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Política interior</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Uso electoral de la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">inquietud.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Los gobiernos deben</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">explicar los costes.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Proyecto europeo</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Asilo y acogida.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Una respuesta común acorde</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">con sus valores.</text>
</g>
</svg>
