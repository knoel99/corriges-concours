<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">La procédure illustrée dans l’article de 2015</title>
<desc id="description">Entrée Italie Premier passage dans l’Union. Demande Allemagne Demande d’asile, puis saisine possible de l’Italie. Transfert éventuel Vers l’Italie Recours possible dans un bref délai.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">La procédure illustrée dans l’article de 2015</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Lieu ou acteur</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Action</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Entrée</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Italie</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Premier passage dans</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">l’Union.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Demande</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Allemagne</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Demande d’asile, puis</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">saisine possible de</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">l’Italie.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Transfert éventuel</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Vers l’Italie</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Recours possible dans un</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">bref délai.</text>
</g>
</svg>
