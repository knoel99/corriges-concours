<svg xmlns="http://www.w3.org/2000/svg" width="830" height="239" viewBox="0 0 830 239" role="img" aria-labelledby="t d"><title id="t">OML Football : immobilisations incorporelles, centre de formation et diagnostic financier</title><desc id="d">En 2016, aux tarifs de référence, la contribution annuelle d’un interne couvre une fraction des frais fixes. La capacité physique du centre fixe la borne supérieure.</desc><rect width="830" height="239" fill="white"/><g fill="#234451" font-family="sans-serif"><rect x="10" y="11" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="47" font-weight="bold" font-size="18">60 joueurs</text><text x="196" y="35" font-size="18" font-weight="bold">Marge sur charges variables : 1 627 200 €</text><text x="196" y="59" font-size="16">Résultat annuel : −398 400 €.</text><rect x="10" y="86" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="122" font-weight="bold" font-size="18">75 joueurs</text><text x="196" y="110" font-size="18" font-weight="bold">Marge sur charges variables : 2 034 000 €</text><text x="196" y="134" font-size="16">Résultat annuel : +8 400 €.</text><rect x="10" y="161" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="197" font-weight="bold" font-size="18">85 joueurs</text><text x="196" y="185" font-size="18" font-weight="bold">Marge sur charges variables : 2 305 200 €</text><text x="196" y="209" font-size="16">Capacité atteinte ; résultat : +279 600 €.</text></g></svg>
