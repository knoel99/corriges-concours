<text x="22" y="215" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Conserver l’abri, choisir ce que l’on chauffe</text>
<text x="22" y="227" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">L’hypothèse est une remise vacante à proximité de services et d’un réseau d’eau. Le propriétaire</text>
<text x="22" y="232" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">s’engage dans un bail stable avant les travaux.</text>
<text x="279" y="74" font-family="DejaVu Sans, sans-serif" font-size="4.9" font-weight="700" fill="#3b665b" text-anchor="start">Le coffret Starck</text>
<text x="279" y="88.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le catalogue des 3 Suisses de 1994 donne au plan une</text>
<text x="279" y="93.2" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">diffusion populaire. Le toit à quatre pentes renvoie</text>
<text x="279" y="98.4" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">à un dessin d’enfance. Seize poteaux de bois</text>
<text x="279" y="103.6" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">permettent des appropriations par sculpture.</text>
<text x="279" y="177.0" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Ici, le coffret devient un carnet de relevé et une</text>
<text x="279" y="182.2" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">convention d’usage. La forme héritée du lieu varie,</text>
<text x="279" y="187.4" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">les points de raccord sont communs.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Source principale : maison Starck, catalogue des 3 Suisses de 1994 et témoignages de Philippe Starck et Patrick Bouchain dans les annexes du</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">sujet.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#3b665b" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
</svg>
