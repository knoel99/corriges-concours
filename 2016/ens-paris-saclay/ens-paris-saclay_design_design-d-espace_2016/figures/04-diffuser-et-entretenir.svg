<rect x="168" y="89" width="19" height="49" rx="0" fill="#e7cca6" stroke="#3b665b" stroke-width="0.75"/>
<rect x="195" y="89" width="19" height="49" rx="0" fill="#e7cca6" stroke="#3b665b" stroke-width="0.75"/>
<rect x="222" y="89" width="19" height="49" rx="0" fill="#e7cca6" stroke="#3b665b" stroke-width="0.75"/>
<text x="148" y="175" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#3b665b" text-anchor="start">2 · Assembler</text>
<text x="148" y="187.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Un professionnel prend en charge structure et</text>
<text x="148" y="192.2" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">réseaux. Les habitants assemblent rangements et</text>
<text x="148" y="197.4" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">finitions sur gabarit.</text>
