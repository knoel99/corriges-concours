<text x="281" y="175" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#3b665b" text-anchor="start">3 · Habiter</text>
<text x="281" y="187.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Suivre les consommations d’hiver et les surchauffes</text>
<text x="281" y="192.2" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">d’été. Déplacer les stores et équipements si les</text>
<text x="281" y="197.4" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">usages changent.</text>
<text x="15" y="229" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Remplacer sans démolir</text>
<text x="15" y="241" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Les fixations restent visitables, les panneaux sont numérotés, les pièces réemployées portent leurs dimensions réelles. Si la famille part, les</text>
<text x="15" y="246" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">rangements suivent le ménage et le noyau peut accueillir un autre foyer.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Ouvrir les plans et les retours d’expérience au réseau des artisans. Les documents avertissent des points qui exigent un recalcul et une</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">autorisation locale.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#3b665b" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
</svg>
