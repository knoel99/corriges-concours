<path d="M109.0 144.5 L109.0 147.5" stroke="#3b665b" stroke-width="0.65" fill="none"/>
<text x="74.5" y="144.3" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#3b665b" text-anchor="middle">relevé</text>
<text x="15" y="175" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#3b665b" text-anchor="start">1 · Relever</text>
<text x="15" y="187.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Relever la remise et les réseaux. Noter les pièces</text>
<text x="15" y="192.2" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">de récupération classées par état et dimensions.</text>
