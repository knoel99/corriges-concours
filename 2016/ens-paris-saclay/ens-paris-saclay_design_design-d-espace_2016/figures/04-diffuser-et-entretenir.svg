<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Transmettre une méthode de chantier</title><desc>La diffusion associe un classeur papier, trois gabarits et un atelier local. L’habitant garde la possibilité de déposer et de réparer.</desc>
