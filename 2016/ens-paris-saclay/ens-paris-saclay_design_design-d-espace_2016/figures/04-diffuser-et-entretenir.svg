<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#3b665b" text-anchor="end">4 / 4</text>
<path d="M13 20 L407 20" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Transmettre une méthode de chantier</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">La diffusion associe un classeur papier, trois gabarits et un atelier local. L’habitant garde la possibilité de déposer et de réparer.</text>
<rect x="15" y="70" width="123" height="87" rx="0" fill="#e5dfca" stroke="none" stroke-width="0.6"/>
