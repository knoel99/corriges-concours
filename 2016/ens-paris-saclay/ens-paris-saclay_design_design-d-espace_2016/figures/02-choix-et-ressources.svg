<text x="281" y="175" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">Partager une grande salle</text>
<text x="281" y="187.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Plusieurs logements se regroupent. Le projet dépend</text>
<text x="281" y="192.1" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">d’accords d’usage et d’un bâtiment plus grand.</text>
<text x="15" y="225" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Répartir les interventions</text>
<text x="15" y="237" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">L’architecte et les artisans examinent structure, état sanitaire, accès et raccordements. Les habitants choisissent et fabriquent des équipements</text>
<text x="15" y="242" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">démontables. Une coopérative prête ses gabarits et tient le stock de pièces.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Le relevé et la validation du changement de destination précèdent tout chantier. L’hypothèse dépend de ce que le bâtiment peut effectivement</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">accueillir.</text>
