<svg xmlns="http://www.w3.org/2000/svg" width="725" height="375" viewBox="0 0 725 375" role="img"><title>Coût salarial (€/unité)</title><desc>À productivité donnée, une hausse du coût horaire renchérit l’unité produite. Mais à 16 unités par heure, un coût horaire de 32 € revient à 2 € par unité, contre 3 € pour 24 € et 8 unités par heure.</desc><rect width="725" height="375" fill="white"/><g font-family="sans-serif" font-size="15" fill="#243b48"><text x="94" y="32" font-weight="bold">Coût salarial (€/unité)</text><path d="M 94 262.00 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="267.0" text-anchor="end">1</text><path d="M 94 212.75 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="217.75" text-anchor="end">2</text><path d="M 94 163.50 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="168.5" text-anchor="end">3</text><path d="M 94 114.25 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="119.25" text-anchor="end">4</text><path d="M 94 65.00 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="70.0" text-anchor="end">5</text><path d="M 94.00 262 v 5" stroke="#243b48"/><text x="94.0" y="285" text-anchor="middle">8</text><path d="M 235.50 262 v 5" stroke="#243b48"/><text x="235.5" y="285" text-anchor="middle">10</text><path d="M 377.00 262 v 5" stroke="#243b48"/><text x="377.0" y="285" text-anchor="middle">12</text><path d="M 518.50 262 v 5" stroke="#243b48"/><text x="518.5" y="285" text-anchor="middle">14</text><path d="M 660.00 262 v 5" stroke="#243b48"/><text x="660.0" y="285" text-anchor="middle">16</text><path d="M 94 65 V 262 H 660" fill="none" stroke="#243b48" stroke-width="2"/><text x="377.0" y="309" text-anchor="middle" font-weight="bold">Productivité (unités par heure)</text><polyline points="94.00,163.50 164.75,179.92 235.50,193.05 306.25,203.80 377.00,212.75 447.75,220.33 518.50,226.82 589.25,232.45 660.00,237.38" fill="none" stroke="#075985" stroke-width="3.5"/><path d="M 94 333 h 23" stroke="#075985" stroke-width="4"/><text x="126" y="338" >Salaire chargé : 24 €/h</text><polyline points="94.00,114.25 164.75,136.14 235.50,153.65 306.25,167.98 377.00,179.92 447.75,190.02 518.50,198.68 589.25,206.18 660.00,212.75" fill="none" stroke="#aa3d36" stroke-width="3.5"/><path d="M 94 356 h 23" stroke="#aa3d36" stroke-width="4"/><text x="126" y="361" >Salaire chargé : 32 €/h</text></g></svg>
