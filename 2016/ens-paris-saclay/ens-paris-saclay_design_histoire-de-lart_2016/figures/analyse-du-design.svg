<svg xmlns="http://www.w3.org/2000/svg" width="840" height="246" viewBox="0 0 840 246" role="img" aria-labelledby="titre description"><title id="titre">Lire la composition de Think Small</title><desc id="description">Schéma de l’annonce. La voiture occupe peu d’espace en haut de la page. Plus bas le titre, puis la copie répartie en colonnes, conduisent de la surprise au raisonnement.</desc><defs><marker id="a" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65639"/></marker></defs><g font-family="DejaVu Sans, sans-serif">
