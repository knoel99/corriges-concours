<text x="366" y="42" text-anchor="start" fill="#233f43" font-size="22" font-weight="700">Petite échelle, grand blanc</text>
<text x="366" y="67" text-anchor="start" fill="#233f43" font-size="20" font-weight="400">L’image rend la taille perceptible.</text>
<text x="366" y="122" text-anchor="start" fill="#233f43" font-size="22" font-weight="700">Un titre bref</text>
<text x="366" y="147" text-anchor="start" fill="#233f43" font-size="20" font-weight="400">Il invite à apprécier cette petitesse.</text>
<text x="366" y="198" text-anchor="start" fill="#233f43" font-size="22" font-weight="700">Argument en colonnes</text>
<text x="366" y="223" text-anchor="start" fill="#233f43" font-size="20" font-weight="400">Le texte donne des raisons d’acheter.</text></g></svg>
