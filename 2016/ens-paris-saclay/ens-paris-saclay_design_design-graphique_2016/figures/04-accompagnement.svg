<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Assurer la médiation après le clic</title><desc>Interface de lecture, aide en bibliothèque et entretien du catalogue. La fiche papier conserve une utilité sans appareil personnel.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#304c68" text-anchor="start">LA BIBLIOTHÈQUE À LA PAGE</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#304c68" text-anchor="end">4 / 4</text>
<path d="M13 20 L407 20" stroke="#304c68" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Assurer la médiation après le clic</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Interface de lecture, aide en bibliothèque et entretien du catalogue. La fiche papier conserve une utilité sans appareil personnel.</text>
<rect x="17" y="70" width="155" height="145" rx="3" fill="#bedad9" stroke="#304c68" stroke-width="0.75"/>
<rect x="24" y="80" width="141" height="123" rx="0" fill="#fcf5e8" stroke="#304c68" stroke-width="0.4"/>
<text x="31" y="97" font-family="DejaVu Sans, sans-serif" font-size="7" font-weight="700" fill="#304c68" text-anchor="start">Le Horla</text>
<text x="31" y="111" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="400" fill="#304c68" text-anchor="start">Aa   Taille du texte</text>
<path d="M31 119 L153 119" stroke="#304c68" stroke-width="0.55" fill="none"/>
<path d="M31 132 L149 132" stroke="#87918d" stroke-width="0.65" fill="none"/>
<path d="M31 140 L137 140" stroke="#87918d" stroke-width="0.65" fill="none"/>
<path d="M31 148 L125 148" stroke="#87918d" stroke-width="0.65" fill="none"/>
<path d="M31 156 L149 156" stroke="#87918d" stroke-width="0.65" fill="none"/>
<path d="M31 164 L137 164" stroke="#87918d" stroke-width="0.65" fill="none"/>
<path d="M31 172 L125 172" stroke="#87918d" stroke-width="0.65" fill="none"/>
<text x="31" y="192" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="700" fill="#304c68" text-anchor="start">Réglages de lecture · Aide</text>
<text x="17" y="236" font-family="DejaVu Sans, sans-serif" font-size="4.4" font-weight="700" fill="#304c68" text-anchor="start">Écran schématique de lecture</text>
<text x="197" y="77" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#304c68" text-anchor="start">Disponibilité et droits</text>
<text x="197" y="88.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">La notice reprend le catalogue municipal. La durée autorisée et les éventuelles restrictions</text>
<text x="197" y="93.25" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">dépendent du prêt et de l’édition.</text>
<text x="197" y="134" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#304c68" text-anchor="start">Accès et confidentialité</text>
<text x="197" y="145.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Une personne sans appareil peut utiliser un point d’accueil. Seules les données nécessaires</text>
<text x="197" y="150.25" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">au prêt sont conservées selon les règles du service.</text>
<text x="197" y="191" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#304c68" text-anchor="start">Exploitation</text>
<text x="197" y="202.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Un gabarit de carte et trois styles de page suffisent au pilote. Tester le parcours avec</text>
<text x="197" y="207.25" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">trois bibliothèques et corriger les blocages observés.</text>
<path d="M13 276 L407 276" stroke="#304c68" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#304c68" text-anchor="start">Évaluer le pilote par les parcours aboutis, les demandes d’aide et les essais de lecture au clavier ou en texte agrandi.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#304c68" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
