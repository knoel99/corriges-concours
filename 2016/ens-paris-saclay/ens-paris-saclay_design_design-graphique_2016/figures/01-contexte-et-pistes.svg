<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Trouver le numérique au rayon des livres</title><desc>Paris en 2016 · le portail des prêts physiques et la bibliothèque numérique se présentent alors sur deux interfaces différentes.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#304c68" text-anchor="start">LA BIBLIOTHÈQUE À LA PAGE</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#304c68" text-anchor="end">1 / 4</text>
<path d="M13 20 L407 20" stroke="#304c68" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Trouver le numérique au rayon des livres</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Paris en 2016 · le portail des prêts physiques et la bibliothèque numérique se présentent alors sur deux interfaces différentes.</text>
