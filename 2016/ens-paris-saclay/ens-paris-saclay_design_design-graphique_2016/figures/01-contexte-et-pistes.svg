<text x="146.4" y="107.8" font-family="DejaVu Sans, sans-serif" font-size="1.6900000000000002" font-weight="700" fill="#304c68" text-anchor="start">BIBLIOTHÈQUES DE PARIS</text>
<path d="M140.55 115.6 L173.05 115.6" stroke="#304c68" stroke-width="0.7150000000000001" fill="none"/>
<text x="139.9" y="131.2" font-family="DejaVu Sans, sans-serif" font-size="3.9000000000000004" font-weight="700" fill="#304c68" text-anchor="start">LE HORLA</text>
<text x="139.9" y="139.0" font-family="DejaVu Sans, sans-serif" font-size="1.9500000000000002" font-weight="700" fill="#304c68" text-anchor="start">G. DE MAUPASSANT</text>
<text x="139.9" y="150.05" font-family="DejaVu Sans, sans-serif" font-size="1.9500000000000002" font-weight="400" fill="#304c68" text-anchor="start">LIRE EN EPUB</text>
<text x="19" y="203" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#304c68" text-anchor="start">Une carte parmi les ouvrages</text>
<text x="19" y="215" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une personne qui fréquente déjà les rayonnages découvre un prêt numérique.</text>
<text x="19" y="220" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Elle peut retrouver le même titre depuis chez elle.</text>
<text x="219" y="76" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#304c68" text-anchor="start">Trois pistes comparées</text>
<text x="219" y="96" font-family="DejaVu Sans, sans-serif" font-size="4.3" font-weight="700" fill="#304c68" text-anchor="start">Une application à part</text>
<text x="219" y="106" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#263944" text-anchor="start">Une installation supplémentaire ajoute une étape au premier emprunt.</text>
<text x="219" y="143" font-family="DejaVu Sans, sans-serif" font-size="4.3" font-weight="700" fill="#304c68" text-anchor="start">Une borne sur place</text>
<text x="219" y="153" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#263944" text-anchor="start">La médiation est immédiate, mais le parcours s’arrête en sortant.</text>
<text x="219" y="190" font-family="DejaVu Sans, sans-serif" font-size="4.3" font-weight="700" fill="#304c68" text-anchor="start">Une carte, un lien, un accueil</text>
<text x="219" y="200" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#263944" text-anchor="start">Le même signe relie rayonnage, mobile et aide humaine. Piste retenue.</text>
<path d="M13 276 L407 276" stroke="#304c68" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#304c68" text-anchor="start">Les nombres et modalités cités décrivent le service dans l’énoncé de 2016. Le projet est une proposition pédagogique pour ce contexte</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#304c68" text-anchor="start">historique.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#304c68" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
</svg>
