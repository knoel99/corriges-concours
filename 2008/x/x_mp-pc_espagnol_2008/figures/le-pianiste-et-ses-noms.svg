<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">Premier concert</title><desc id="d">Borja et Joan désignent ici le même jeune pianiste. L’alternance entre les noms prend son sens au moment où sa mère tente de lui parler.</desc><rect width="760" height="230" fill="white"/><g font-family="sans-serif"><rect x="7" y="9" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="46" fill="#194552" font-size="18" font-weight="bold">Sur scène</text><text x="210" y="33" fill="#173d48" font-size="18" font-weight="bold">Le public acclame Joan.</text><text x="210" y="57" fill="#294650" font-size="16">Le pianiste a repris le nom de son grand-père.</text><rect x="7" y="82" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="119" fill="#194552" font-size="18" font-weight="bold">Dans la loge</text><text x="210" y="106" fill="#173d48" font-size="18" font-weight="bold">Tita cherche une dernière occasion de se rapprocher.</text><text x="210" y="130" fill="#294650" font-size="16">L’ovation prend une autre signification pour la mère.</text><rect x="7" y="155" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="192" fill="#194552" font-size="18" font-weight="bold">À la sortie</text><text x="210" y="179" fill="#173d48" font-size="18" font-weight="bold">« Borja » appelle une rectification de son fils.</text><text x="210" y="203" fill="#294650" font-size="16">Le changement de nom s’entend dans le dialogue.</text></g></svg>
