<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 200" width="670" height="200">
  <title>La capacité des quatre premiers créneaux</title>
  <rect x="105" y="65" width="101" height="42" fill="#dfefeb" stroke="#00645d" stroke-width="1.4" />
  <text x="155" y="91" fill="#00645d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">T2</text>
  <text x="205" y="130" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">1</text>
  <rect x="210" y="65" width="101" height="42" fill="#dfefeb" stroke="#00645d" stroke-width="1.4" />
  <text x="260" y="91" fill="#00645d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">T4</text>
  <text x="310" y="130" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">2</text>
  <rect x="315" y="65" width="101" height="42" fill="#dfefeb" stroke="#00645d" stroke-width="1.4" />
  <text x="365" y="91" fill="#00645d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">T1</text>
  <text x="415" y="130" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">3</text>
  <rect x="420" y="65" width="101" height="42" fill="#dfefeb" stroke="#00645d" stroke-width="1.4" />
  <text x="470" y="91" fill="#00645d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">T3</text>
  <text x="520" y="130" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">4</text>
  <text x="105" y="130" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">0</text>
  <text x="317" y="37" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">Les tâches 2, 4, 1 et 3 occupent déjà quatre créneaux.</text>
  <line x1="105" y1="148" x2="521" y2="148" stroke="#97421e" stroke-width="2" />
  <line x1="105" y1="143" x2="105" y2="153" stroke="#97421e" stroke-width="2" />
  <line x1="521" y1="143" x2="521" y2="153" stroke="#97421e" stroke-width="2" />
  <text x="317" y="182" fill="#97421e" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Ajouter T5 (échéance 1) imposerait cinq fins avant ou au temps 4.</text>
</svg>