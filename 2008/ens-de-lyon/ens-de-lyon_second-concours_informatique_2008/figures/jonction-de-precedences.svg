  <text x="220.5" y="65" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Durée 3</text>
  <text x="90" y="112" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold">B</text>
  <rect x="126" y="89" width="315" height="33" fill="#faf7ef" stroke="#00645d" stroke-width="1.4" />
  <text x="283.5" y="111" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Durée 5</text>
  <text x="90" y="158" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold">C</text>
