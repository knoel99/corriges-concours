  <text x="504.0" y="157" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Durée 2</text>
  <text x="340" y="229" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">A et B précèdent C. Le projet se termine au temps 7.</text>
