<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" width="640" height="244">
  <title>Calendrier au plus tôt pour trois tâches</title>
  <line x1="126" y1="40" x2="126" y2="177" stroke="#d7dfe3" stroke-width="1" />
