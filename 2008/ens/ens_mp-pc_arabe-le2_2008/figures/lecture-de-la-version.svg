<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Comment le surnom de Saïd prend son sens</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">À la maison</text>
<text x="27" y="118" font-size="16">Des enfants auraient</text>
<text x="27" y="137" font-size="16">fait entendre leurs</text>
<text x="27" y="156" font-size="16">premiers pas et leurs</text>
<text x="27" y="175" font-size="16">jeux.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">À la poterie</text>
<text x="298" y="118" font-size="16">Le chat regarde le</text>
<text x="298" y="137" font-size="16">potier travailler et</text>
<text x="298" y="156" font-size="16">répond en ronronnant.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Au village</text>
<text x="569" y="118" font-size="16">Les amis de Saïd le</text>
<text x="569" y="137" font-size="16">surnomment le père de</text>
<text x="569" y="156" font-size="16">Haroun.</text>
</g></svg>
