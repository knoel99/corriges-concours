<title id="titre">Une technique, deux effets</title>
<rect width="720" height="128" rx="8" fill="#f5f8fa"/>
<text x="18" y="27" font-family="DejaVu Sans" font-weight="bold" font-size="17" fill="#193747">Une technique, deux effets</text>
