<svg xmlns="http://www.w3.org/2000/svg" width="870" height="369" viewBox="0 0 870 369" role="img"><title>Qui peut renvoyer les députés devant les électeurs ?</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Qui peut renvoyer les députés devant les électeurs ?</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Régime</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Initiative et condition</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Épreuve de la pratique</text><rect x="12" y="84" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">IIIᵉ République</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Président, avec l’avis</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">conforme du Sénat</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">1877 : la nouvelle Chambre</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">maintient la majorité</text><text x="505" y="158" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">républicaine.</text><rect x="12" y="175" width="842" height="91" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">IVᵉ République</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Décision en Conseil des</text><text x="225" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">ministres sous conditions</text><text x="225" y="249" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">de crises</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">1955 : le chef de l’État prononce</text><text x="505" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">la dissolution décidée par le</text><text x="505" y="249" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Conseil.</text><rect x="12" y="266" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Vᵉ République</text><text x="225" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Président après</text><text x="225" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">consultations sans avis</text><text x="225" y="340" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">conforme</text><text x="505" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">1962 : succès de la majorité</text><text x="505" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">gaulliste. 1997 : majorité</text><text x="505" y="340" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">opposée.</text></svg>
