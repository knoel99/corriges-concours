<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Due dimensioni dell’emancipazione</title>
<desc id="description">Anni Sessanta e Settanta Valori e identità. Distinguersi dagli adulti. Giovani del rapporto 2008 Autonomia economica. Casa, famiglia, posizione lavorativa. Rapporto tra generazioni Disponibilità delle risorse familiari. Risparmi assorbiti da altre necessità.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Due dimensioni dell’emancipazione</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Nel testo</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Questione dominante</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Esempio</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Anni Sessanta e</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">Settanta</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Valori e identità.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Distinguersi dagli adulti.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Giovani del rapporto</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">2008</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Autonomia economica.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Casa, famiglia, posizione</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">lavorativa.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Rapporto tra</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">generazioni</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Disponibilità delle</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">risorse familiari.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Risparmi assorbiti da altre</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">necessità.</text>
</g>
</svg>
