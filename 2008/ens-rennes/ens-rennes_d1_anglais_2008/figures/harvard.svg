<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Which figure answers which question?</title>
<desc id="description">10% Household income of families concerned. Proposed contribution. 40,000 to 60,000 dollars Income ceiling in an earlier policy. Families eligible for free tuition. 33% Number of students from poorer households. Increase since 2004.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Which figure answers which question?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Figure</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Refers to</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Meaning</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">10%</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Household income of</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">families concerned.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Proposed contribution.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">40,000 to 60,000</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">dollars</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Income ceiling in an</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">earlier policy.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Families eligible for free</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">tuition.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">33%</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Number of students from</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">poorer households.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Increase since 2004.</text>
</g>
</svg>
