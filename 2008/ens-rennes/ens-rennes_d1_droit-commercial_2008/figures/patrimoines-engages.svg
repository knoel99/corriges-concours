<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 351" width="990" height="351" role="img" aria-labelledby="title desc">
<title id="title">Un prêt à une SARL peut engager deux personnes</title><desc id="desc">La société doit le prix ou le montant du prêt sur son patrimoine. La caution ajoute un recours réservé à son bénéficiaire.</desc>
<rect width="990" height="351" rx="12" fill="#f5f7f9"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172f41">
<text x="25" y="40" font-size="26" font-weight="bold">Un prêt à une SARL peut engager deux personnes</text>
<text x="25" y="83" font-size="19" font-weight="bold" fill="#365c66">Qualité</text>
<text x="332" y="83" font-size="19" font-weight="bold" fill="#365c66">Fondement</text>
<text x="665" y="83" font-size="19" font-weight="bold" fill="#365c66">Biens ou droits exposés</text>
<rect x="14" y="99" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="138" font-size="18">SARL emprunteuse</text>
<text x="332" y="138" font-size="18">Contrat de prêt</text>
<text x="665" y="138" font-size="18">Patrimoine social</text>
<path d="M 299 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="174" width="962" height="64" rx="8" fill="#edf2e6"/>
<text x="25" y="213" font-size="18">Associée de SARL</text>
<text x="332" y="213" font-size="18">Apport en capital</text>
<text x="665" y="200" font-size="18">Valeur des parts et</text>
<text x="665" y="224" font-size="18">solde de l’apport dû</text>
<path d="M 299 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="249" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="288" font-size="18">Associée également caution</text>
<text x="332" y="275" font-size="18">Cautionnement souscrit</text>
<text x="332" y="299" font-size="18">auprès de la banque</text>
<text x="665" y="275" font-size="18">Patrimoine personnel selon</text>
<text x="665" y="299" font-size="18">les limites de l’acte</text>
<path d="M 299 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
</g>
</svg>
