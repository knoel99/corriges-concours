<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Comment l’auteur met-il une image à l’épreuve ?</title>
<desc id="description">Conversations La question sur le vin allemand. Expériences anecdotiques. Films en boucle Résistants et nazis stéréotypés. Répertoire figé. Personnalités nouvelles Lagerfeld, Cohn-Bendit, Ballack. Autres domaines où se forment des représentations.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment l’auteur met-il une image à l’épreuve ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Appui</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Exemple</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Limite ou portée</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Conversations</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La question sur le vin</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">allemand.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Expériences anecdotiques.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Films en boucle</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Résistants et nazis</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">stéréotypés.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Répertoire figé.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Personnalités</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">nouvelles</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Lagerfeld, Cohn-Bendit,</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Ballack.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Autres domaines où se</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">forment des</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">représentations.</text>
