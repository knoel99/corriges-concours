<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img"><title>Quatre demandes issues d’une même vente ont des fondements différents.</title><rect width="800" height="330" rx="10" fill="#faf9f5"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="24" y="33" fill="#17354b" font-size="22" font-weight="bold">Qui agit après une vente ?</text>
<text x="24" y="70" fill="#355f73" font-size="17" font-weight="bold">Demandeur</text>
<text x="334" y="70" fill="#355f73" font-size="17" font-weight="bold">Objet et fondement</text>
<rect x="14" y="81" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 103h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="81" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="109" fill="#152c3d" font-size="16">Le vendeur</text>
<text x="334" y="109" fill="#152c3d" font-size="16">Le prix, au titre de son contrat</text>
<rect x="14" y="136" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 158h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="136" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="164" fill="#152c3d" font-size="16">Le bénéficiaire désigné</text>
<text x="334" y="164" fill="#152c3d" font-size="16">La prestation promise à son profit</text>
<rect x="14" y="191" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 213h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="191" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="219" fill="#152c3d" font-size="16">Le créancier du vendeur</text>
<text x="334" y="219" fill="#152c3d" font-size="16">La créance de prix, par l’action oblique</text>
<rect x="14" y="246" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 268h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="246" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="274" fill="#152c3d" font-size="16">Le tiers qui subit un dommage</text>
<text x="334" y="274" fill="#152c3d" font-size="16">Sa propre réparation, sur le terrain délictuel</text>
</g></svg>
