<svg xmlns="http://www.w3.org/2000/svg" width="840" height="245" viewBox="0 0 840 245" role="img"><title>Après une hausse du taux directeur, trois conditions de transmission distinctes relient la décision à la dépense réelle.</title><rect width="840" height="245" rx="10" fill="#f7f8f5"/><g font-family="DejaVu Sans, sans-serif" fill="#21394b">
<text x="20" y="33" font-size="22" font-weight="bold">Comment une hausse de taux atteint-elle la dépense ?</text>
<rect x="13" y="53" width="813" height="53" rx="5" fill="#e6f0ee"/>
<text x="22" y="84" font-size="16" font-weight="bold">Taux réels anticipés</text>
<text x="202" y="84" font-size="15">Le coût actualisé augmente</text>
<path d="M511 79h19m-6 -5l6 5 -6 5" fill="none" stroke="#227668" stroke-width="2"/>
<text x="540" y="84" font-size="12">Certains projets sont reportés</text>
<rect x="13" y="113" width="813" height="53" rx="5" fill="#edf0f4"/>
<text x="22" y="144" font-size="16" font-weight="bold">Garantie et crédit</text>
<text x="202" y="144" font-size="15">Les garanties peuvent perdre de la valeur</text>
<path d="M511 139h19m-6 -5l6 5 -6 5" fill="none" stroke="#227668" stroke-width="2"/>
<text x="540" y="144" font-size="12">Les banques limitent certains prêts</text>
<rect x="13" y="173" width="813" height="53" rx="5" fill="#e6f0ee"/>
<text x="22" y="204" font-size="16" font-weight="bold">Taux de change</text>
<text x="202" y="204" font-size="15">L’euro peut s’apprécier</text>
<path d="M511 199h19m-6 -5l6 5 -6 5" fill="none" stroke="#227668" stroke-width="2"/>
<text x="540" y="204" font-size="12">Les exportations deviennent moins compétitives</text>
</g></svg>
