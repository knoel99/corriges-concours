<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>Du fait observé à sa diffusion en 2010, la chaîne du témoignage distingue le récit documenté des embellissements.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Comment l’anecdote nous parvient-elle ?</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Newton</text>
<text x="21" y="110" font-size="15">Il raconte la chute</text>
<text x="21" y="131" font-size="15">observée dans son jardin.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">Stukeley · 1752</text>
<text x="286" y="110" font-size="15">Il consigne le souvenir</text>
<text x="286" y="131" font-size="15">raconté par Newton.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Royal Society</text>
<text x="551" y="110" font-size="15">La mise en ligne donne</text>
<text x="551" y="131" font-size="15">accès au manuscrit.</text>
</g></svg>
