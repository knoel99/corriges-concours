<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>La rectification d’une projection se juge à son échelle et ne suffit pas à écarter toutes les observations sur le climat.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Que peut-on conclure de l’erreur de date ?</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Point reconnu</text>
<text x="21" y="110" font-size="15">La prévision de</text>
<text x="21" y="131" font-size="15">disparition en 2035 est</text>
<text x="21" y="152" font-size="15">erronée.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">Origine proposée</text>
<text x="286" y="110" font-size="15">La BBC évoque une étude</text>
<text x="286" y="131" font-size="15">mentionnant 2350.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Question distincte</text>
<text x="551" y="110" font-size="15">Le réchauffement a des</text>
<text x="551" y="131" font-size="15">preuves indépendantes.</text>
</g></svg>
