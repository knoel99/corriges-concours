<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>L’article passe d’une observation chez la souris à une piste thérapeutique dont la portée humaine reste à vérifier.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Trois statuts différents dans le compte rendu</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Observation animale</text>
<text x="21" y="110" font-size="15">Des performances sont</text>
<text x="21" y="131" font-size="15">comparées chez des souris.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">Indice mesuré</text>
<text x="286" y="110" font-size="15">Une légère hausse de</text>
<text x="286" y="131" font-size="15">température est constatée.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Perspective humaine</text>
<text x="551" y="110" font-size="15">Les auteurs envisagent une</text>
<text x="551" y="131" font-size="15">piste thérapeutique.</text>
</g></svg>
