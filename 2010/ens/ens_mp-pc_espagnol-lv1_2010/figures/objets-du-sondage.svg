<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>Trois réponses politiques différentes dans l’enquête de 2009. Seul le soutien à l’économie de marché est chiffré ici pour les deux années.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Que mesure chaque résultat ?</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Démocratie</text>
<text x="21" y="110" font-size="15">Le soutien au régime</text>
<text x="21" y="131" font-size="15">progresse malgré la</text>
<text x="21" y="152" font-size="15">récession.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">Économie de marché</text>
<text x="286" y="110" font-size="15">Le soutien passe de 52 % à</text>
<text x="286" y="131" font-size="15">59 % en un an.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Chef de l’État</text>
<text x="551" y="110" font-size="15">L’approbation élevée</text>
<text x="551" y="131" font-size="15">inquiète les analystes.</text>
</g></svg>
