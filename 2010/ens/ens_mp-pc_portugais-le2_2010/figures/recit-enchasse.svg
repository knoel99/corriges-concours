<svg xmlns="http://www.w3.org/2000/svg" width="870" height="321" viewBox="0 0 870 321" role="img"><title>De la réunion au récit de l’aigle</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">De la réunion au récit de l’aigle</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Moment</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Dans le récit</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Interprétation possible</text><rect x="12" y="84" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">La réunion</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">La police énumère les</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">sujets interdits.</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">La parole publique est étroitement</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">surveillée.</text><rect x="12" y="151" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Le poulailler</text><text x="225" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">L’aigle se croit poule et</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">picore au sol.</text><text x="505" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Une identité imposée devient une</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">habitude.</text><rect x="12" y="218" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Le précipice</text><text x="225" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Les mêmes paroles</text><text x="225" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">accompagnent enfin</text><text x="225" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">l’envol.</text><text x="505" y="244" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Le geste change de sens lorsque la</text><text x="505" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">situation change.</text></svg>
