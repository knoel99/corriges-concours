<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>Les deux démarches de l’article et la vérification qui donne un sens aux grandeurs retenues.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Qu’est-ce qu’un modèle retient de la réalité ?</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Décrire</text>
<text x="21" y="110" font-size="15">Repérer la diversité des</text>
<text x="21" y="131" font-size="15">manifestations de la</text>
<text x="21" y="152" font-size="15">maladie.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">Modéliser</text>
<text x="286" y="110" font-size="15">Isoler quelques propriétés</text>
<text x="286" y="131" font-size="15">utiles à la question</text>
<text x="286" y="152" font-size="15">posée.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Mesurer</text>
<text x="551" y="110" font-size="15">Confronter les propriétés</text>
<text x="551" y="131" font-size="15">retenues à des</text>
<text x="551" y="152" font-size="15">observations.</text>
</g></svg>
