<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Trois positions dans le raisonnement de Tanja Dückers</title>
<desc id="description">Revenus élevés Plusieurs enfants au foyer. La famille nombreuse peut signaler l’aisance. Classes moyennes Marché du travail flexible, coûts élevés. Avoir plusieurs enfants devient difficile. Classes populaires Autre groupe de familles nombreuses cité. Leur présence nuance un lien linéaire avec le revenu.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois positions dans le raisonnement de Tanja Dückers</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Groupe</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Situation décrite</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Rôle dans l’argument</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Revenus élevés</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Plusieurs enfants au</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">foyer.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La famille nombreuse peut</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">signaler l’aisance.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Classes moyennes</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Marché du travail</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">flexible, coûts élevés.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Avoir plusieurs enfants</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">devient difficile.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Classes populaires</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Autre groupe de familles</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">nombreuses cité.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Leur présence nuance un</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">lien linéaire avec le</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">revenu.</text>
</g>
</svg>
