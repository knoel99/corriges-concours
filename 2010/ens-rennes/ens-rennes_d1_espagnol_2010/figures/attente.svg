<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">L’attente de Teófilo en trois temps</title>
<desc id="description">12 h 12 Rendez-vous prévu. Imparfait pour l’heure fixée. 12 h 30 Le journaliste observe la salle. Présent du reportage. 13 h 37 Le narrateur anticipe la suite. Futur et persistance de l’attente.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">L’attente de Teófilo en trois temps</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Heure</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Repère</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Choix du traducteur</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">12 h 12</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Rendez-vous prévu.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Imparfait pour l’heure</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">fixée.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">12 h 30</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le journaliste observe la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">salle.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Présent du reportage.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">13 h 37</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le narrateur anticipe la</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">suite.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Futur et persistance de</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">l’attente.</text>
</g>
</svg>
