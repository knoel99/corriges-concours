<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="titre description">
<title id="titre">Trois chiffres, trois unités</title>
<desc id="description">3 dollars au plus Par ouvrage. Coût des matériaux. Moins de 100 000 dollars Par machine. Prix du modèle décrit. Jusqu’à 60 000 Ouvrages par an. Capacité annoncée.</desc>
<rect width="720" height="253" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois chiffres, trois unités</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Valeur</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Unité de référence</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est évalué</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">3 dollars au plus</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Par ouvrage.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Coût des matériaux.</text>
<rect x="10" y="137" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Moins de 100 000</text>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">dollars</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Par machine.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Prix du modèle décrit.</text>
<rect x="10" y="204" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Jusqu’à 60 000</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Ouvrages par an.</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Capacité annoncée.</text>
</g>
</svg>
