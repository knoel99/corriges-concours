<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="titre description">
<title id="titre">Quelle fraction du capital serait vendue ?</title>
<desc id="description">Part détenue 57,6 % du capital. Point de départ du projet. Part conservée 25 % plus une action. Seuil souhaité par Gref. Part cédée Environ 32,6 points de capital, moins une action. Près du tiers du capital total.</desc>
<rect width="720" height="253" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quelle fraction du capital serait vendue ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Repère</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Valeur</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Sens</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Part détenue</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">57,6 % du capital.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Point de départ du projet.</text>
<rect x="10" y="137" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Part conservée</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">25 % plus une action.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Seuil souhaité par Gref.</text>
<rect x="10" y="182" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="207" font-size="15" font-weight="700" fill="#162d3b">Part cédée</text>
<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">Environ 32,6 points de</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">capital, moins une action.</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">Près du tiers du capital</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">total.</text>
</g>
</svg>
