<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Qui fait quelle affirmation ?</title>
<desc id="description">Diffuseurs Jusqu’à 140 millions de livres de plus par an. Prévision de recettes. Association médicale Les enfants repèrent mal certaines marques. Motif donné pour l’opposition. Ministre Assouplir les règles des chaînes commerciales. Projet après un revirement.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui fait quelle affirmation ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voix</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Énoncé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Statut</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Diffuseurs</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Jusqu’à 140 millions de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">livres de plus par an.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Prévision de recettes.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Association médicale</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Les enfants repèrent mal</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">certaines marques.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Motif donné pour</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">l’opposition.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Ministre</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Assouplir les règles des</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">chaînes commerciales.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Projet après un revirement.</text>
</g>
</svg>
