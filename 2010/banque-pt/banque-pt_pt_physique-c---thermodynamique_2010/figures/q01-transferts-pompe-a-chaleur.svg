<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="sans-serif" font-size="14">
<rect width="720" height="300" fill="#ffffff"/>
<rect x="30" y="110" width="170" height="80" rx="6" fill="#e3f0fb" stroke="#222" stroke-width="1.5"/>
<text x="115" y="147" text-anchor="middle" font-weight="bold">Air extérieur</text>
<text x="115" y="166" text-anchor="middle" font-size="13">source froide, Ta</text>
<rect x="275" y="110" width="170" height="80" rx="6" fill="#f3f3f3" stroke="#222" stroke-width="1.5"/>
<text x="360" y="147" text-anchor="middle" font-weight="bold">Fluide R410A</text>
<text x="360" y="166" text-anchor="middle" font-size="13">décrit un cycle</text>
<rect x="520" y="110" width="170" height="80" rx="6" fill="#fde8e0" stroke="#222" stroke-width="1.5"/>
<text x="605" y="147" text-anchor="middle" font-weight="bold">Eau du chauffage</text>
<text x="605" y="166" text-anchor="middle" font-size="13">source chaude, Te</text>
<rect x="275" y="10" width="170" height="50" rx="6" fill="#f3f3f3" stroke="#222" stroke-width="1.5"/>
<text x="360" y="40" text-anchor="middle" font-weight="bold">Compresseur</text>
<line x1="200.0" y1="150.0" x2="267.0" y2="150.0" stroke="#1565c0" stroke-width="3"/>
<path d="M0,0 l-13,-6 v12 z" fill="#1565c0" transform="translate(275.0,150.0) rotate(0.0)"/>
<line x1="445.0" y1="150.0" x2="512.0" y2="150.0" stroke="#c62828" stroke-width="3"/>
<path d="M0,0 l-13,-6 v12 z" fill="#c62828" transform="translate(520.0,150.0) rotate(0.0)"/>
<line x1="360.0" y1="60.0" x2="360.0" y2="102.0" stroke="#222" stroke-width="3"/>
<path d="M0,0 l-13,-6 v12 z" fill="#222" transform="translate(360.0,110.0) rotate(90.0)"/>
<text x="237" y="138" text-anchor="middle" fill="#1565c0" font-weight="bold">Q₂ &gt; 0</text>
<text x="482" y="138" text-anchor="middle" fill="#c62828" font-weight="bold">Q₁ &lt; 0</text>
<text x="372" y="90" text-anchor="start" font-weight="bold">W &gt; 0</text>
<text x="237" y="215" text-anchor="middle" font-size="12">chaleur prélevée</text>
<text x="237" y="231" text-anchor="middle" font-size="12">à l'air</text>
<text x="482" y="215" text-anchor="middle" font-size="12">chaleur cédée</text>
<text x="482" y="231" text-anchor="middle" font-size="12">à l'eau</text>
<text x="360" y="270" text-anchor="middle" font-size="13">Grandeurs algébriques reçues par le fluide sur un cycle : W + Q₁ + Q₂ = 0</text>
</svg>
