<svg xmlns="http://www.w3.org/2000/svg" width="760" height="178" viewBox="0 0 760 178" role="img"><title>Que peut une enquête face à une inquiétude collective ?</title><rect width="760" height="178" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#193746">
<text x="12" y="25" font-size="20" font-weight="700">Que peut une enquête face à une inquiétude collective ?</text>
<rect x="10" y="40" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="63" font-size="17" font-weight="700">Crainte vague</text>
<path d="M236 57h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="40" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="63" font-size="14" font-weight="400">Des élèves respirent-ils un air plus pollué à certaines heures ?</text>
<rect x="10" y="81" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="104" font-size="17" font-weight="700">Comparaison</text>
<path d="M236 98h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="81" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="104" font-size="13" font-weight="400">Examiner plusieurs lieux et moments avant d’attribuer une cause.</text>
<rect x="10" y="122" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="145" font-size="17" font-weight="700">Décision collective</text>
<path d="M236 139h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="122" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="145" font-size="17" font-weight="400">Expliquer les limites et négocier les usages de la rue.</text>
</g></svg>
