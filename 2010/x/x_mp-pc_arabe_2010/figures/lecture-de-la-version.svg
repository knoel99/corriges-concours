<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Qui prend la parole devant la sculpture ?</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Pedro</text>
<text x="27" y="118" font-size="16">Il présente Yacine à la</text>
<text x="27" y="137" font-size="16">poétesse en s’efforçant</text>
<text x="27" y="156" font-size="16">de rester sérieux.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Hanine</text>
<text x="298" y="118" font-size="16">Elle reconnaît l’œuvre,</text>
<text x="298" y="137" font-size="16">puis donne son nom et</text>
<text x="298" y="156" font-size="16">évoque son exil.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Yacine</text>
<text x="569" y="118" font-size="16">Il rectifie un titre et</text>
<text x="569" y="137" font-size="16">répond au jugement de</text>
<text x="569" y="156" font-size="16">Hanine sur l’Algérie.</text>
</g></svg>
