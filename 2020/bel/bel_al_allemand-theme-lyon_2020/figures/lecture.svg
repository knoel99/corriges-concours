<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-labelledby="titre description">
<title id="titre">De Maurice à la photographie</title>
<desc id="description">Avant les guerres, Lieux, arbres et proches perdus, hatten … verloren. D’une guerre à l’autre, La guerre les rejoint à Paris, der Krieg holte sie ein. Devant l’album, Catherine et Mathilde dans le jardin, sie stand / Mathilde saß</desc>
<rect width="720" height="218" fill="#f8f7f2"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="17" y="31" font-size="23" font-weight="700" fill="#153c48">De Maurice à la photographie</text>
<rect x="12" y="52" width="219" height="152" rx="5" fill="#dfeee9"/>
<text x="22" y="79" font-size="15" font-weight="700" fill="#18555a">Avant les guerres</text>
<text x="22" y="110" font-size="15" font-weight="400" fill="#20373e">Lieux, arbres et proches</text>
<text x="22" y="128" font-size="15" font-weight="400" fill="#20373e">perdus</text>
<text x="22" y="167" font-size="14" font-weight="700" fill="#193750">hatten … verloren</text>
<path d="M228 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="250" y="52" width="219" height="152" rx="5" fill="#f3e9d8"/>
<text x="260" y="79" font-size="15" font-weight="700" fill="#18555a">D’une guerre à l’autre</text>
<text x="260" y="110" font-size="15" font-weight="400" fill="#20373e">La guerre les rejoint à</text>
<text x="260" y="128" font-size="15" font-weight="400" fill="#20373e">Paris</text>
<text x="260" y="167" font-size="14" font-weight="700" fill="#193750">der Krieg holte sie ein</text>
<path d="M466 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="488" y="52" width="219" height="152" rx="5" fill="#e1eaf0"/>
<text x="498" y="79" font-size="15" font-weight="700" fill="#18555a">Devant l’album</text>
<text x="498" y="110" font-size="15" font-weight="400" fill="#20373e">Catherine et Mathilde</text>
<text x="498" y="128" font-size="15" font-weight="400" fill="#20373e">dans le jardin</text>
<text x="498" y="167" font-size="14" font-weight="700" fill="#193750">sie stand / Mathilde saß</text>
</g>
</svg>
