<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img"><title>How Iris knows what she tells us</title><desc>Iris can date an armistice exactly. The meaning of a gesture remains open.</desc><rect width="960" height="330" rx="12" fill="#f7f7f3"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="37" fill="#19344a" font-size="25" font-weight="700">How Iris knows what she tells us</text><rect x="26" y="54" width="908" height="57" rx="6" fill="#173b4a"/><text x="42" y="88" fill="#ffffff" font-size="21" font-weight="700">The account</text><text x="348" y="89" fill="#ffffff" font-size="18">The war ends and Iris’s father returns to Canada.</text><path d="M480 111v18M176 129h608M176 129v16M480 129v16M784 129v16" fill="none" stroke="#547b80" stroke-width="2.5"/><rect x="26" y="145" width="296" height="104" rx="7" fill="#e3ece9" stroke="#8fa7a6"/><text x="38" y="178" fill="#19344a" font-size="21" font-weight="700">Public record</text><text x="38" y="207" fill="#19344a" font-size="15">The town welcomes a hero.</text><text x="38" y="230" fill="#19344a" font-size="15">The paper names an heir.</text><rect x="332" y="145" width="296" height="104" rx="7" fill="#e3ece9" stroke="#8fa7a6"/><text x="344" y="178" fill="#19344a" font-size="21" font-weight="700">Personal memory</text><text x="344" y="207" fill="#19344a" font-size="15">Bells, cold air, a frozen pond.</text><text x="344" y="230" fill="#19344a" font-size="15">The child asks for her mother.</text><rect x="638" y="145" width="296" height="104" rx="7" fill="#e3ece9" stroke="#8fa7a6"/><text x="650" y="178" fill="#19344a" font-size="21" font-weight="700">Reconstruction</text><text x="650" y="207" fill="#19344a" font-size="15">A kiss and a shared thought.</text><text x="650" y="230" fill="#19344a" font-size="15">The adult narrator infers both.</text><path d="M27 271H933" stroke="#afbbb7"/><text x="27" y="304" fill="#19344a" font-size="18">Iris can date an armistice exactly. The meaning of a gesture remains open.</text></g></svg>
