<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-labelledby="titre description">
<title id="titre">À qui appartient la diatribe ?</title>
<desc id="description">Je → le jeune P., Le narrateur comprend un agacement, me doy cuenta. Tu → nous, Il joue successivement l’accusateur et l’orateur, tú / nuestro cuerpo. Je, en voiture, L’incise finale dévoile la scène, voy soltando</desc>
<rect width="720" height="218" fill="#f8f7f2"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="17" y="31" font-size="23" font-weight="700" fill="#153c48">À qui appartient la diatribe ?</text>
<rect x="12" y="52" width="219" height="152" rx="5" fill="#dfeee9"/>
<text x="22" y="79" font-size="15" font-weight="700" fill="#18555a">Je → le jeune P.</text>
<text x="22" y="110" font-size="15" font-weight="400" fill="#20373e">Le narrateur comprend un</text>
<text x="22" y="128" font-size="15" font-weight="400" fill="#20373e">agacement</text>
<text x="22" y="167" font-size="14" font-weight="700" fill="#193750">me doy cuenta</text>
<path d="M228 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="250" y="52" width="219" height="152" rx="5" fill="#f3e9d8"/>
<text x="260" y="79" font-size="15" font-weight="700" fill="#18555a">Tu → nous</text>
<text x="260" y="110" font-size="15" font-weight="400" fill="#20373e">Il joue successivement</text>
<text x="260" y="128" font-size="15" font-weight="400" fill="#20373e">l’accusateur et l’orateur</text>
<text x="260" y="167" font-size="14" font-weight="700" fill="#193750">tú / nuestro cuerpo</text>
<path d="M466 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="488" y="52" width="219" height="152" rx="5" fill="#e1eaf0"/>
<text x="498" y="79" font-size="15" font-weight="700" fill="#18555a">Je, en voiture</text>
<text x="498" y="110" font-size="15" font-weight="400" fill="#20373e">L’incise finale dévoile la</text>
<text x="498" y="128" font-size="15" font-weight="400" fill="#20373e">scène</text>
<text x="498" y="167" font-size="14" font-weight="700" fill="#193750">voy soltando</text>
</g>
</svg>
