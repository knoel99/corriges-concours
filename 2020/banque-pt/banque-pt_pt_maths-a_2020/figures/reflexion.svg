<svg xmlns="http://www.w3.org/2000/svg" width="730" height="270" viewBox="0 0 730 270"><rect width="730" height="270" fill="white"/><g font-family="DejaVu Sans" fill="#1c4054"><text x="18" y="27" font-size="19">Réflexion dans le plan des deux vecteurs</text><line x1="20" y1="145" x2="332" y2="145" stroke="#5b6f79" stroke-width="2"/><line x1="65" y1="145" x2="219" y2="63" stroke="#33736e" stroke-width="2"/><line x1="65" y1="145" x2="219" y2="227" stroke="#33736e" stroke-width="2"/><line x1="219" y1="63" x2="219" y2="227" stroke="#b47842" stroke-width="2" stroke-dasharray="5 4"/><circle cx="65" cy="145" r="5" fill="#26766b"/><circle cx="219" cy="63" r="5" fill="#26766b"/><circle cx="219" cy="227" r="5" fill="#26766b"/><text x="40" y="163" font-size="16">O</text><text x="232" y="63" font-size="16">x₀</text><text x="231" y="232" font-size="16">y₀</text><text x="305" y="136" font-size="16">H</text><text x="361" y="89" font-size="16">La droite horizontale représente</text><text x="361" y="115" font-size="16">la trace de l’hyperplan fixe H.</text><text x="361" y="167" font-size="16">La réflexion échange x₀ et y₀.</text><text x="361" y="197" font-size="16">Le segment vertical est normal à H.</text></g></svg>