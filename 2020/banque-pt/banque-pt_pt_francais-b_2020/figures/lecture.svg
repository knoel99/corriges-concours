<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Qui intervient dans la décision ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Qui intervient dans la décision ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Préparer le choix</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Les serviteurs de Démos fixent les termes</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">de leur concurrence.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">Les Cavaliers</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Autoriser</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">Un mandat électif peut coexister avec une</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">tutelle quotidienne.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Tocqueville</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Subir les effets</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Les familles déplacées dépendent de choix</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">pris loin de leur foyer.</text>
<text x="549" y="189" font-size="14" font-weight="700" fill="#203c49">Philip Roth</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
