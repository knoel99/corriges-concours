<svg xmlns="http://www.w3.org/2000/svg" width="850" height="272" viewBox="0 0 850 272" role="img"><title>Un même plan avant une visite</title><desc>Le visiteur peut confronter le plan préparé à ce que lui apprend une personne sur place.</desc><rect x="0" y="0" width="850" height="272" fill="#faf9f3"/><text x="25" y="36" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#1d434d">Un même plan avant une visite</text><rect x="24" y="62" width="382" height="154" fill="#e4ede8"/><text x="37" y="94" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#1d434d">Suivre un lieu déjà repéré</text><text x="37" y="128" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Le plan situe une place.</text><text x="37" y="156" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Le visiteur y cadre la photo</text><text x="37" y="184" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">attendue, puis repart.</text><rect x="428" y="62" width="382" height="154" fill="#eee3cc"/><text x="441" y="94" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#1d434d">Revenir sur ce que le plan omet</text><text x="441" y="128" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Une habitante explique le transfert</text><text x="441" y="156" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">du marché. Le visiteur change</text><text x="441" y="184" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">son itinéraire pour le retrouver.</text><text x="25" y="248" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Dans les deux cas, le prix du voyage et le lieu de départ peuvent être identiques.</text></svg>
