<svg xmlns="http://www.w3.org/2000/svg" width="870" height="345" viewBox="0 0 870 345" role="img"><title>How political influence operates outside a campaign</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">How political influence operates outside a campaign</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Speaker</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Publicly reported position</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Crispin’s interpretation</text><rect x="12" y="84" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Barack Obama</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Praises women leaders and</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">calls on older men to</text><text x="225" y="158" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">step aside.</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">A way of criticising the Sanders</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">candidacy indirectly.</text><rect x="12" y="175" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Michelle Obama</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Describes values shared</text><text x="225" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">with George W. Bush.</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Evidence of continuity across</text><text x="505" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">party lines.</text><rect x="12" y="242" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Jessa Crispin</text><text x="225" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Points to conflicts over</text><text x="225" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">health care and wealth</text><text x="225" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">taxation.</text><text x="505" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Policy differences matter more</text><text x="505" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">than a leader’s age alone.</text></svg>
