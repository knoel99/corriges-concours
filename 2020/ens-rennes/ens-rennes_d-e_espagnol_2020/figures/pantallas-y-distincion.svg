<svg xmlns="http://www.w3.org/2000/svg" width="870" height="393" viewBox="0 0 870 393" role="img"><title>De la novedad tecnológica al lujo de desconectar</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">De la novedad tecnológica al lujo de desconectar</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Etapa</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Qué se valora</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Quién puede decidir</text><rect x="12" y="84" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Primeros</text><text x="23" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">dispositivos</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Una tableta por alumno</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">parece un adelanto</text><text x="225" y="158" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">educativo.</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Los centros con medios pueden</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">adquirirla antes.</text><rect x="12" y="175" width="842" height="91" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Difusión masiva</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">El acceso a las pantallas</text><text x="225" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">deja de distinguir a una</text><text x="225" y="249" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">minoría.</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Aumentan las dudas sobre para qué</text><text x="505" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">se utilizan.</text><rect x="12" y="266" width="842" height="115" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Educación sin</text><text x="23" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">pantallas</text><text x="225" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">La disponibilidad de</text><text x="225" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">atención y actividades</text><text x="225" y="340" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">presenciales marca</text><text x="225" y="364" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">distancia.</text><text x="505" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Las familias con tiempo y recursos</text><text x="505" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">pueden elegir alternativas.</text></svg>
