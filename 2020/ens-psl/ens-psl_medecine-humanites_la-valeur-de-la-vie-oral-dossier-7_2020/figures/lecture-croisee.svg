<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 245" width="780" height="245" role="img" aria-labelledby="titre exp"><title id="titre">Que classe-t-on en situation de rareté ?</title><desc id="exp">L’installation, l’aphorisme et le texte de 2020 permettent de distinguer statut, utilité sociale et justification d’une décision.</desc><rect width="780" height="245" rx="14" fill="#f6f4ed"/>
<text x="23" y="37" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#163635">Que classe-t-on en situation de rareté ?</text>
<rect x="20" y="49" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="49" width="5" height="58" fill="#176a63"/>
<text x="38" y="73" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Une figure publique</text>
<text x="233" y="71" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Le corps étendu de Jean-Paul II conserve ses insignes. Sa</text>
<text x="233" y="92" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">vulnérabilité devient visible.</text>
<rect x="20" y="112" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="112" width="5" height="58" fill="#176a63"/>
<text x="38" y="136" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Les actes</text>
<text x="233" y="134" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Nietzsche rapporte les classements moraux aux besoins</text>
<text x="233" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">changeants des collectivités.</text>
<rect x="20" y="175" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="175" width="5" height="58" fill="#176a63"/>
<text x="38" y="199" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Des interventions</text>
<text x="233" y="197" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Le document d’avril 2020 met en tension équité de la</text>
<text x="233" y="218" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">procédure et bénéfice collectif.</text>
</svg>
