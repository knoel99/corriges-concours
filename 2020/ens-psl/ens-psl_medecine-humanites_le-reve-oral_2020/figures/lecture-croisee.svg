<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 245" width="780" height="245" role="img" aria-labelledby="titre exp"><title id="titre">Que reste-t-il au réveil ?</title><desc id="exp">L’image imprimée, le souvenir retrouvé et le récit adressé donnent trois suites distinctes au rêve.</desc><rect width="780" height="245" rx="14" fill="#f6f4ed"/>
<text x="23" y="37" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#163635">Que reste-t-il au réveil ?</text>
<rect x="20" y="49" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="49" width="5" height="58" fill="#176a63"/>
<text x="38" y="73" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Une estampe</text>
<text x="233" y="71" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Chez Goya, la gravure ordonne les figures qui assaillent</text>
<text x="233" y="92" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">le personnage endormi.</text>
<rect x="20" y="112" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="112" width="5" height="58" fill="#176a63"/>
<text x="38" y="136" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Une enquête</text>
<text x="233" y="134" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Chez Freud, un événement ultérieur peut rendre</text>
<text x="233" y="155" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">identifiable la source oubliée d’un rêve.</text>
<rect x="20" y="175" width="740" height="58" rx="6" fill="#ffffff"/><rect x="20" y="175" width="5" height="58" fill="#176a63"/>
<text x="38" y="199" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#163635">Un interlocuteur</text>
<text x="233" y="197" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">Chez Devereux, le récit se prolonge en une question au</text>
<text x="233" y="218" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#163635">thérapeute et en une question morale.</text>
</svg>
