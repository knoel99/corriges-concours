<svg xmlns="http://www.w3.org/2000/svg" width="740" height="220" viewBox="0 0 740 220" role="img" aria-labelledby="title desc"><title id="title">Création de trafic dans une union douanière</title><desc id="desc">Pour une consommation inchangée, substituer le producteur partenaire au producteur national économise deux unités de ressources.</desc><rect width="740" height="220" fill="white"/><g fill="#183642" font-family="sans-serif"><text x="17" y="31" font-size="22" font-weight="bold">Création de trafic dans une union douanière</text><text x="17" y="61" font-size="17">Exemple construit · coût réel par unité de bien</text><path d="M282 79V192" stroke="#8c9ba2"/><text x="17" y="111" font-size="18">Production nationale</text><rect x="282" y="91" width="325.89" height="23" fill="#296175"/><text x="617.89" y="110" font-size="18">14</text><text x="17" y="174" font-size="18">Production chez le partenaire</text><rect x="282" y="154" width="279.34" height="23" fill="#9b511f"/><text x="571.34" y="173" font-size="18">12</text></g></svg>
