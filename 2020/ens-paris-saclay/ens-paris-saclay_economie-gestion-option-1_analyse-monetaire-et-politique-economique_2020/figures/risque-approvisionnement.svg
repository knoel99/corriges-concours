<svg xmlns="http://www.w3.org/2000/svg" width="725" height="375" viewBox="0 0 725 375" role="img"><title>Risque de rupture totale (%)</title><desc>Deux sites pouvant chacun couvrir tout le besoin réduisent le risque de rupture simultanée de p à p² si leurs arrêts sont indépendants. Un choc parfaitement commun laisse le risque à p. Le calcul illustre l’effet de la diversification, sans estimer la fréquence des crises réelles.</desc><rect width="725" height="375" fill="white"/><g font-family="sans-serif" font-size="15" fill="#243b48"><text x="94" y="32" font-weight="bold">Risque de rupture totale (%)</text><path d="M 94 262.00 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="267.0" text-anchor="end">0</text><path d="M 94 222.60 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="227.6" text-anchor="end">10</text><path d="M 94 183.20 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="188.2" text-anchor="end">20</text><path d="M 94 143.80 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="148.8" text-anchor="end">30</text><path d="M 94 104.40 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="109.39999999999998" text-anchor="end">40</text><path d="M 94 65.00 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="70.0" text-anchor="end">50</text><path d="M 94.00 262 v 5" stroke="#243b48"/><text x="94.0" y="285" text-anchor="middle">0</text><path d="M 207.20 262 v 5" stroke="#243b48"/><text x="207.2" y="285" text-anchor="middle">10</text><path d="M 320.40 262 v 5" stroke="#243b48"/><text x="320.4" y="285" text-anchor="middle">20</text><path d="M 433.60 262 v 5" stroke="#243b48"/><text x="433.59999999999997" y="285" text-anchor="middle">30</text><path d="M 546.80 262 v 5" stroke="#243b48"/><text x="546.8" y="285" text-anchor="middle">40</text><path d="M 660.00 262 v 5" stroke="#243b48"/><text x="660.0" y="285" text-anchor="middle">50</text><path d="M 94 65 V 262 H 660" fill="none" stroke="#243b48" stroke-width="2"/><text x="377.0" y="309" text-anchor="middle" font-weight="bold">Risque de panne d’un site (%)</text><polyline points="94.00,262.00 150.60,242.30 207.20,222.60 263.80,202.90 320.40,183.20 377.00,163.50 433.60,143.80 490.20,124.10 546.80,104.40 603.40,84.70 660.00,65.00" fill="none" stroke="#075985" stroke-width="3.5"/><path d="M 94 333 h 23" stroke="#075985" stroke-width="4"/><text x="126" y="338" >Un seul site, ou pannes communes</text><polyline points="94.00,262.00 150.60,261.01 207.20,258.06 263.80,253.13 320.40,246.24 377.00,237.38 433.60,226.54 490.20,213.74 546.80,198.96 603.40,182.21 660.00,163.50" fill="none" stroke="#aa3d36" stroke-width="3.5"/><path d="M 94 356 h 23" stroke="#aa3d36" stroke-width="4"/><text x="126" y="361" >Deux sites indépendants et substituables</text></g></svg>
