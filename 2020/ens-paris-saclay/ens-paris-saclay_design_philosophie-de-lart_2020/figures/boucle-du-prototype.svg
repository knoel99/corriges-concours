<svg xmlns="http://www.w3.org/2000/svg" width="900" height="214" viewBox="0 0 900 214" role="img"><title>Du dessin au geste observé, un essai peut obliger à reformuler le projet.</title><rect width="900" height="214" fill="#faf9f4"/><rect x="267" y="10" width="366" height="55" rx="7" fill="#e3eee8"/><text x="450" y="34" font-weight="700" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21">Lors de l’essai</text><text x="450" y="57" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18">la main retourne le manche.</text><path d="M450 65 V85 H221 V113 M213 102 L221 113 L229 102" fill="none" stroke="#294c58" stroke-width="3" /><path d="M450 85 H680 V113 M672 102 L680 113 L688 102" fill="none" stroke="#294c58" stroke-width="3" /><rect x="31" y="122" width="380" height="78" rx="7" fill="#f3e8d4"/><text x="221" y="151" font-weight="700" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21">Conserver le but prévu</text><text x="221" y="179" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17">Modifier la prise pour guider le geste.</text><rect x="490" y="122" width="380" height="78" rx="7" fill="#e4eaf2"/><text x="680" y="151" font-weight="700" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21">Réexaminer le but</text><text x="680" y="179" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17">Tester l’usage que suggère le geste.</text></svg>
