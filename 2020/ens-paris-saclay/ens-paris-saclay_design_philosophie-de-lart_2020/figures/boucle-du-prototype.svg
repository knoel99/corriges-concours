<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="DejaVu Sans, sans-serif"><title>Du dessin au geste observé, un essai peut obliger à reformuler le projet.</title><rect width="900" height="250" fill="#faf9f4"/><text x="450" y="32" text-anchor="middle" font-size="25" fill="#163945">Un essai peut changer la question de départ</text><rect x="42" y="69" width="230" height="80" fill="#e2eee6" stroke="#335563" stroke-width="2"/><text x="157" y="106" text-anchor="middle" font-size="21" fill="#163945">Esquisse</text><text x="157" y="134" text-anchor="middle" font-size="14" fill="#163945">Une autre prise est pensable.</text><rect x="334" y="69" width="230" height="80" fill="#e2eee6" stroke="#335563" stroke-width="2"/><text x="449" y="106" text-anchor="middle" font-size="21" fill="#163945">Prévision</text><text x="449" y="134" text-anchor="middle" font-size="14" fill="#163945">Le pouce devrait porter ici.</text><rect x="626" y="69" width="230" height="80" fill="#e2eee6" stroke="#335563" stroke-width="2"/><text x="741" y="106" text-anchor="middle" font-size="21" fill="#163945">Prototype</text><text x="741" y="134" text-anchor="middle" font-size="14" fill="#163945">La main tourne le manche.</text><path d="M 272 111 h 48 m -8 -6 l 8 6 l -8 6" fill="none" stroke="#a34a22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 564 111 h 48 m -8 -6 l 8 6 l -8 6" fill="none" stroke="#a34a22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 741 153 v 28 h -579 v -24 m -6 7 l 6 -7 l 6 7" fill="none" stroke="#a34a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="223" text-anchor="middle" font-size="17" fill="#163945">Le geste observé oblige à imaginer et à éprouver une autre forme.</text></svg>
