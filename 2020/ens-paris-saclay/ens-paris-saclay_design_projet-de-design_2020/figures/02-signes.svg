<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Garder un signe que chacun peut tracer</title><desc>Trois pistes graphiques · éviter la promesse commerciale de bienfaits et rendre le parcours visible à peu de frais.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#214e57" text-anchor="start">LE TEMPS DE REMPLIR</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#214e57" text-anchor="end">2 / 4</text>
<path d="M13 20 L407 20" stroke="#214e57" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Garder un signe que chacun peut tracer</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Trois pistes graphiques · éviter la promesse commerciale de bienfaits et rendre le parcours visible à peu de frais.</text>
<rect x="17" y="66" width="120" height="112" rx="0" fill="#e7cca6" stroke="none" stroke-width="0.6"/>
<text x="22" y="80" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#214e57" text-anchor="start">La bouteille</text>
<path d="M68 100 h20 v13 l7 10 v35 h-34 v-35 l7 -10Z" fill="none" stroke="#214e57" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="20" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Une silhouette familière évoque l’eau à</text>
<text x="20" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">emporter, mais elle peut devenir le</text>
<text x="20" y="208" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">signe d’une marque d’eau conditionnée.</text>
<rect x="150" y="66" width="120" height="112" rx="0" fill="#dddfcc" stroke="none" stroke-width="0.6"/>
<text x="155" y="80" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#214e57" text-anchor="start">La strate</text>
<path d="M161 110 Q197 98 218 114 T255 105" fill="none" stroke="#214e57" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M161 118 Q197 107 218 122 T255 113" fill="none" stroke="#214e57" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M161 126 Q197 116 218 130 T255 121" fill="none" stroke="#214e57" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M161 134 Q197 125 218 138 T255 129" fill="none" stroke="#214e57" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M161 142 Q197 134 218 146 T255 137" fill="none" stroke="#214e57" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="153" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Des lignes superposées évoquent la</text>
<text x="153" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">géologie. À distance, la destination à</text>
<text x="153" y="208" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">boire reste difficile à reconnaître.</text>
<rect x="283" y="66" width="120" height="112" rx="0" fill="#d3e4dc" stroke="none" stroke-width="0.6"/>
<text x="288" y="80" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#214e57" text-anchor="start">La goutte stratifiée</text>
<path d="M343 96 C336.0 111.75 320.25 122.25 320.25 134.5 C320.25 159.0 365.75 159.0 365.75 134.5 C365.75 122.25 351.75 111.75 343 96Z" fill="#72a9ad" stroke="#214e57" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M330.75 127.5 L353.5 127.5" stroke="#fcf5e8" stroke-width="0.9625000000000001" fill="none"/>
<path d="M330.75 132.75 L353.5 132.75" stroke="#fcf5e8" stroke-width="0.9625000000000001" fill="none"/>
<path d="M330.75 138.0 L353.5 138.0" stroke="#fcf5e8" stroke-width="0.9625000000000001" fill="none"/>
<text x="286" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">La silhouette annonce l’eau et les trois</text>
<text x="286" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">lignes ouvrent sur l’origine</text>
<text x="286" y="208" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">souterraine. Le motif se reproduit en</text>
<text x="286" y="213" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">deux encres.</text>
<path d="M13 276 L407 276" stroke="#214e57" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#214e57" text-anchor="start">Le projet de budget participatif produit deux panneaux, des cartes de proximité et un guide de maintenance. Les textes sanitaires sont</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#214e57" text-anchor="start">validés et datés par le gestionnaire.</text>
</svg>
