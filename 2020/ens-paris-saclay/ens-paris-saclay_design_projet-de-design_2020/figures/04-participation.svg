<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Une carte de quartier et un vote</title><desc>Un objet de médiation à emporter · circulation par les bibliothèques, les maisons de quartier et le square.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#214e57" text-anchor="start">LE TEMPS DE REMPLIR</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#214e57" text-anchor="end">4 / 4</text>
<path d="M13 20 L407 20" stroke="#214e57" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Une carte de quartier et un vote</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Un objet de médiation à emporter · circulation par les bibliothèques, les maisons de quartier et le square.</text>
<rect x="20" y="78" width="148" height="105" rx="0" fill="#fff1cf" stroke="#214e57" stroke-width="0.65"/>
<path d="M49 88 C45.6 95.65 37.95 100.75 37.95 106.7 C37.95 118.6 60.05 118.6 60.05 106.7 C60.05 100.75 53.25 95.65 49 88Z" fill="#72a9ad" stroke="#214e57" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M43.05 103.3 L54.1 103.3" stroke="#fcf5e8" stroke-width="0.4675" fill="none"/>
<path d="M43.05 105.85 L54.1 105.85" stroke="#fcf5e8" stroke-width="0.4675" fill="none"/>
<path d="M43.05 108.4 L54.1 108.4" stroke="#fcf5e8" stroke-width="0.4675" fill="none"/>
<text x="28" y="134" font-family="DejaVu Sans, sans-serif" font-size="6.5" font-weight="700" fill="#214e57" text-anchor="start">LE TEMPS DE</text>
<text x="28" y="145" font-family="DejaVu Sans, sans-serif" font-size="6.5" font-weight="700" fill="#214e57" text-anchor="start">REMPLIR</text>
<text x="28" y="163" font-family="DejaVu Sans, sans-serif" font-size="3.35" font-weight="400" fill="#214e57" text-anchor="start">Square de la Madone · Paris 18e. Repérez la</text>
<text x="28" y="168" font-family="DejaVu Sans, sans-serif" font-size="3.35" font-weight="400" fill="#214e57" text-anchor="start">goutte à l’entrée.</text>
<rect x="199" y="78" width="148" height="105" rx="0" fill="#dce6d5" stroke="#214e57" stroke-width="0.65"/>
<text x="207" y="95" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#214e57" text-anchor="start">L’EAU ET LE QUARTIER</text>
<text x="207" y="109" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Suivez le panneau dans le square. Le temps du</text>
<text x="207" y="114" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">remplissage, observez le trajet de l’eau et</text>
<text x="207" y="119" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">laissez le passage libre. Consultez sur place</text>
<text x="207" y="124" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">l’avis daté du service de l’eau.</text>
<text x="21" y="205" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#214e57" text-anchor="start">Recto / verso au format A6</text>
<text x="21" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">La carte porte un message autonome pour les personnes sans</text>
<text x="21" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">téléphone. Une version numérique textuelle reprend les</text>
<text x="21" y="227" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">informations validées.</text>
<text x="224" y="205" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#214e57" text-anchor="start">Soumettre le projet aux habitants</text>
<text x="224" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Un essai temporaire confronte le dessin aux files</text>
<text x="224" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">réelles. Relever les questions, puis chiffrer pose,</text>
<text x="224" y="227" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">contrôle, impression et entretien.</text>
<path d="M13 276 L407 276" stroke="#214e57" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#214e57" text-anchor="start">Évaluer le repérage, les conflits dans la file et la lisibilité des consignes. Le service demeure gratuit ; le budget porte sur la médiation</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#214e57" text-anchor="start">et son entretien.</text>
</svg>
