<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Deux panneaux de lecture différente</title><desc>Entrée puis attente · élévations au 1:5 sur A3, dimensions utiles hors support.</desc>
