<rect x="164" y="82" width="130" height="136" rx="0" fill="#edf0de" stroke="#214e57" stroke-width="0.65"/>
<text x="172" y="96" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#214e57" text-anchor="start">PENDANT LE REMPLISSAGE</text>
<ellipse cx="177" cy="116" rx="4" ry="4" fill="#214e57" stroke="none" stroke-width="0.65"/>
<text x="177" y="117.5" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#fcf5e8" text-anchor="middle">1</text>
<text x="185" y="117.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#214e57" text-anchor="start">Utilisez un récipient propre.</text>
<ellipse cx="177" cy="137" rx="4" ry="4" fill="#214e57" stroke="none" stroke-width="0.65"/>
<text x="177" y="138.5" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#fcf5e8" text-anchor="middle">2</text>
<text x="185" y="138.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#214e57" text-anchor="start">Laissez un espace entre le</text>
<text x="185" y="142.8" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#214e57" text-anchor="start">goulot et le bec.</text>
<ellipse cx="177" cy="158" rx="4" ry="4" fill="#214e57" stroke="none" stroke-width="0.65"/>
<text x="177" y="159.5" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#fcf5e8" text-anchor="middle">3</text>
<text x="185" y="159.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#214e57" text-anchor="start">Refermez le récipient après</text>
<text x="185" y="163.8" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#214e57" text-anchor="start">remplissage.</text>
<text x="172" y="187" font-family="DejaVu Sans, sans-serif" font-size="4.2" font-weight="700" fill="#214e57" text-anchor="start">D’où vient l’eau ?</text>
<text x="172" y="197.0" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#214e57" text-anchor="start">D’une nappe profonde du bassin de Paris.</text>
<text x="172" y="201.2" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#214e57" text-anchor="start">Qualité et avis en vigueur figurent sur la</text>
<text x="172" y="205.4" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#214e57" text-anchor="start">fiche datée.</text>
<path d="M164 232 L294 232" stroke="#214e57" stroke-width="0.43" fill="none"/>
<path d="M164.0 230.5 L164.0 233.5" stroke="#214e57" stroke-width="0.65" fill="none"/>
<path d="M294.0 230.5 L294.0 233.5" stroke="#214e57" stroke-width="0.65" fill="none"/>
<text x="229.0" y="230.3" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#214e57" text-anchor="middle">650 mm</text>
<text x="310" y="84" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#214e57" text-anchor="start">Matériaux</text>
<text x="310" y="95" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Deux faces émaillées mates sur</text>
<text x="310" y="100" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">cadres démontables. Pictogrammes</text>
<text x="310" y="105" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">et mots restent contrastés en</text>
<text x="310" y="110" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">plein jour.</text>
<text x="310" y="170" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#214e57" text-anchor="start">Mise à jour</text>
<text x="310" y="181" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Cartouche du gestionnaire</text>
<text x="310" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">remplaçable. Flèche orientée</text>
<text x="310" y="191" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">après vérification du chemin</text>
<text x="310" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">accessible.</text>
<path d="M13 276 L407 276" stroke="#214e57" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#214e57" text-anchor="start">Formats proposés : panneau d’entrée 600 × 850 mm, cartel d’attente 650 × 680 mm. Fixations, hauteur de lecture et dégagement réglementaire à</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#214e57" text-anchor="start">vérifier sur place.</text>
