<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Le square avant la fontaine</title><desc>Paris, 18e arrondissement · choisir le design graphique pour relier une eau souterraine, un trajet de voisinage et un geste ordinaire.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#214e57" text-anchor="start">LE TEMPS DE REMPLIR</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#214e57" text-anchor="end">1 / 4</text>
<path d="M13 20 L407 20" stroke="#214e57" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Le square avant la fontaine</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Paris, 18e arrondissement · choisir le design graphique pour relier une eau souterraine, un trajet de voisinage et un geste ordinaire.</text>
<rect x="15" y="63" width="226" height="137" rx="0" fill="#dfe0c7" stroke="#212e2c" stroke-width="0.4"/>
<path d="M15 172 Q67 163 97 133 T161 103 L240 85" fill="none" stroke="#d7bd95" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M15 177 Q72 165 101 133 T162 104 L240 86" fill="none" stroke="#f4dfba" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="141" y="103" width="22.5" height="41.25" rx="0" fill="#7c9890" stroke="#214e57" stroke-width="0.7"/>
<rect x="139.5" y="101.5" width="25.5" height="2.25" rx="0" fill="#214e57" stroke="#214e57" stroke-width="0.5"/>
<path d="M152.25 103.75 L152.25 143.5" stroke="#626767" stroke-width="0.55" fill="none"/>
<path d="M138.75 140.5 v-10.5 q3.75 -3.75 6.0 0" fill="none" stroke="#214e57" stroke-width="0.6000000000000001" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M165.75 140.5 v-10.5 q3.75 -3.75 6.0 0" fill="none" stroke="#214e57" stroke-width="0.6000000000000001" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="41" cy="100" rx="11" ry="7" fill="#a6ad77" stroke="none" stroke-width="0.65"/>
<ellipse cx="69" cy="104" rx="11" ry="7" fill="#a6ad77" stroke="none" stroke-width="0.65"/>
<ellipse cx="89" cy="179" rx="11" ry="7" fill="#a6ad77" stroke="none" stroke-width="0.65"/>
<ellipse cx="209" cy="136" rx="11" ry="7" fill="#a6ad77" stroke="none" stroke-width="0.65"/>
<ellipse cx="218" cy="165" rx="11" ry="7" fill="#a6ad77" stroke="none" stroke-width="0.65"/>
<text x="22" y="83" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#214e57" text-anchor="start">Schéma d’usage</text>
<text x="27" y="154" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#214e57" text-anchor="start">Entrée</text>
<text x="138" y="161" font-family="DejaVu Sans, sans-serif" font-size="4" font-weight="700" fill="#214e57" text-anchor="start">Fontaine</text>
<text x="261" y="77" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#214e57" text-anchor="start">En passant</text>
<text x="261" y="89" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">À l’entrée du square, identifier la présence de</text>
<text x="261" y="94" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">la fontaine et les heures affichées par la Ville.</text>
<text x="261" y="99" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Un dessin de goutte accompagne le trajet.</text>
<text x="261" y="143" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#214e57" text-anchor="start">En attendant</text>
<text x="261" y="155" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">À la file, lire pourquoi l’eau provient d’une</text>
<text x="261" y="160" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">nappe profonde et comment les services publics la</text>
<text x="261" y="165" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">contrôlent. Préparer son récipient.</text>
<text x="17" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Une photographie du sujet situe les équipements de jeu derrière la fontaine. Les panneaux se posent au bord du chemin</text>
<text x="17" y="227" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">et laissent libre l’approche des robinets.</text>
<path d="M13 276 L407 276" stroke="#214e57" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#214e57" text-anchor="start">La situation et le type de fontaine sont lus dans le plan et les vues du sujet. La géométrie du square dessinée ici est un schéma, à relever</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#214e57" text-anchor="start">avant pose.</text>
</svg>
