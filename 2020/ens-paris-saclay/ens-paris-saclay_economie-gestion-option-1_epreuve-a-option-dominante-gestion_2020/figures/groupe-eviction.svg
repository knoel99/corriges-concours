<svg xmlns="http://www.w3.org/2000/svg" width="830" height="239" viewBox="0 0 830 239" role="img" aria-labelledby="t d"><title id="t">Hôtel Flic-En-Flac : positionnement, petits-déjeuners, équipe des Seychelles et bungalows</title><desc id="d">La contribution directe des 1 050 nuitées sportives est réduite par la marge des 385 nuitées traditionnelles évincées. Les réservations des deux périodes restent avantageuses aux hypothèses retenues.</desc><rect width="830" height="239" fill="white"/><g fill="#234451" font-family="sans-serif"><rect x="10" y="11" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="47" font-weight="bold" font-size="18">Juin</text><text x="196" y="35" font-size="18" font-weight="bold">336 nuitées du groupe ; 78 nuitées habituelles perdues</text><text x="196" y="59" font-size="16">Gain après éviction : 759 120 MUR.</text><rect x="10" y="86" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="122" font-weight="bold" font-size="18">Juillet</text><text x="196" y="110" font-size="18" font-weight="bold">714 nuitées du groupe ; 307 nuitées habituelles perdues</text><text x="196" y="134" font-size="16">Gain après éviction : 511 380 MUR.</text><rect x="10" y="161" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="197" font-weight="bold" font-size="18">Ensemble</text><text x="196" y="185" font-size="18" font-weight="bold">Contribution du groupe 4 273 500 ; éviction 3 003 000</text><text x="196" y="209" font-size="16">Contribution nette supplémentaire : 1 270 500 MUR.</text></g></svg>
