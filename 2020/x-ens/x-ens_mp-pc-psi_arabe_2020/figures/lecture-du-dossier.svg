<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Une même pratique peut servir le lien familial ou lui faire obstacle selon son usage.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Les fêtes</text>
<text x="27" y="118" font-size="16">Les visites donnent une</text>
<text x="27" y="137" font-size="16">forme concrète à la</text>
<text x="27" y="156" font-size="16">transmission entre</text>
<text x="27" y="175" font-size="16">générations.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">L’entreprise</text>
<text x="298" y="118" font-size="16">Le soutien financier</text>
<text x="298" y="137" font-size="16">aide à débuter ; le</text>
<text x="298" y="156" font-size="16">contrôle peut</text>
<text x="298" y="175" font-size="16">restreindre les</text>
<text x="298" y="194" font-size="16">décisions.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Les écrans</text>
<text x="569" y="118" font-size="16">Un groupe familial</text>
<text x="569" y="137" font-size="16">apporte un conseil ;</text>
<text x="569" y="156" font-size="16">l’écran peut aussi</text>
<text x="569" y="175" font-size="16">éloigner les personnes</text>
<text x="569" y="194" font-size="16">réunies.</text>
</g></svg>
