<svg xmlns="http://www.w3.org/2000/svg" width="780" height="221" viewBox="0 0 780 221" role="img"><title>La plaque berlinoise, les souvenirs familiaux et les connaissances scolaires dans le dossier A.</title><rect width="780" height="221" fill="#f5f7f5"/>
<text x="18" y="33" fill="#173c44" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Ce que transmet un lieu de mémoire</text>
<rect x="18" y="49" width="744" height="50" fill="#e2efea"/>
<text x="31" y="80" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Une trace</text>
<text x="277" y="70" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Plaque dans le pavage de Berlin,</text>
<text x="277" y="91" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">sur le tracé de la frontière disparue.</text>
<rect x="18" y="103" width="744" height="50" fill="#edf1f2"/>
<text x="31" y="134" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Une question</text>
<text x="277" y="124" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Les enfants demandent à leurs proches</text>
<text x="277" y="145" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">comment ils ont vécu la division.</text>
<rect x="18" y="157" width="744" height="50" fill="#e4edf0"/>
<text x="31" y="188" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Des repères</text>
<text x="277" y="178" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Le récit historique situe les expériences</text>
<text x="277" y="199" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">et distingue les dates de 1961 et 1989.</text></svg>
