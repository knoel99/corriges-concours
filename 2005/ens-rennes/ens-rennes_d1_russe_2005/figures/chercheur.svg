<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois lieux dans l’entretien de Diakonov</title>
<desc id="description">Danemark Lieu de travail de Diakonov. Le poste occupé est à l’étranger. Allemagne Lieu du congrès scientifique. Un réseau dispersé peut se retrouver. Ex-URSS École scientifique évoquée par l’interviewé. La formation commune perdure malgré la mobilité.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois lieux dans l’entretien de Diakonov</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lieu</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Rôle dans le passage</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’il montre</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Danemark</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Lieu de travail de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Diakonov.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le poste occupé est à</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">l’étranger.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Allemagne</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Lieu du congrès</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">scientifique.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Un réseau dispersé peut se</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">retrouver.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Ex-URSS</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">École scientifique évoquée</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">par l’interviewé.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La formation commune</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">perdure malgré la mobilité.</text>
</g>
</svg>
