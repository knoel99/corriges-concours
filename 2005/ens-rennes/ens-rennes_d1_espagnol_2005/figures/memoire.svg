<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois supports d’une mémoire publique</title>
<desc id="description">Manuel Retenir une explication du coup d’État. Faire apparaître qui porte cette interprétation. Noms de rues Honorer certaines trajectoires. Discuter le patrimoine que l’on transmet. Monuments Rendre visible une figure du passé. Distinguer conservation et célébration.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois supports d’une mémoire publique</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Support</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Choix décrit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Enjeu selon l’autrice</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Manuel</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Retenir une explication du</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">coup d’État.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Faire apparaître qui porte</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">cette interprétation.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Noms de rues</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Honorer certaines</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">trajectoires.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Discuter le patrimoine que</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">l’on transmet.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Monuments</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Rendre visible une figure</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">du passé.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Distinguer conservation et</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">célébration.</text>
</g>
</svg>
