<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Quelles libertés le logiciel donne-t-il ?</title>
<desc id="description">Usage et étude L’utilisateur peut-il examiner le programme ? Comprendre ce qu’il fait. Modification Peut-il l’adapter à ses besoins ? Conserver de l’autonomie. Diffusion Peut-il partager le résultat ? Permettre une coopération entre utilisateurs.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quelles libertés le logiciel donne-t-il ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Dimension</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Question concrète</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Enjeu</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Usage et étude</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">L’utilisateur peut-il</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">examiner le programme ?</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Comprendre ce qu’il fait.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Modification</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Peut-il l’adapter à ses</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">besoins ?</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Conserver de l’autonomie.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Diffusion</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Peut-il partager le</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">résultat ?</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Permettre une coopération</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">entre utilisateurs.</text>
</g>
</svg>
