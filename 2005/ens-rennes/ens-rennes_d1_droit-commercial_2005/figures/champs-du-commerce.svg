<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 351" width="990" height="351" role="img" aria-labelledby="title desc">
<title id="title">Trois questions pour une même activité</title><desc id="desc">L’achat pour revendre, l’activité économique et la forme sociale répondent à trois questions de qualification.</desc>
<rect width="990" height="351" rx="12" fill="#f5f7f9"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172f41">
<text x="25" y="40" font-size="26" font-weight="bold">Trois questions pour une même activité</text>
<text x="25" y="83" font-size="19" font-weight="bold" fill="#365c66">Situation</text>
<text x="332" y="83" font-size="19" font-weight="bold" fill="#365c66">Qualification examinée</text>
<text x="665" y="83" font-size="19" font-weight="bold" fill="#365c66">Conséquence choisie</text>
<rect x="14" y="99" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="125" font-size="18">Achat de meubles</text>
<text x="25" y="149" font-size="18">en vue de les revendre</text>
<text x="332" y="125" font-size="18">Acte de commerce</text>
<text x="332" y="149" font-size="18">par nature</text>
<text x="665" y="125" font-size="18">La qualification vise</text>
<text x="665" y="149" font-size="18">l’opération.</text>
<path d="M 299 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="174" width="962" height="64" rx="8" fill="#edf2e6"/>
<text x="25" y="200" font-size="18">Architecte indépendant</text>
<text x="25" y="224" font-size="18">en nom propre</text>
<text x="332" y="200" font-size="18">Activité de services</text>
<text x="332" y="224" font-size="18">sur un marché</text>
<text x="665" y="200" font-size="18">Le droit de la concurrence</text>
<text x="665" y="224" font-size="18">peut s’appliquer.</text>
<path d="M 299 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="249" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="288" font-size="18">SARL exploitant une ferme</text>
<text x="332" y="275" font-size="18">Société commerciale</text>
<text x="332" y="299" font-size="18">par sa forme</text>
<text x="665" y="275" font-size="18">La société est commerciale</text>
<text x="665" y="299" font-size="18">malgré son objet agricole.</text>
<path d="M 299 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
</g>
</svg>
