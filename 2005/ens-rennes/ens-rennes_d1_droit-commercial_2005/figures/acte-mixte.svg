<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 276" width="990" height="276" role="img" aria-labelledby="title desc">
<title id="title">Une seule vente, deux sens de preuve</title><desc id="desc">La qualité de celui à qui la preuve est opposée explique l’asymétrie du régime de l’acte mixte.</desc>
<rect width="990" height="276" rx="12" fill="#f5f7f9"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172f41">
<text x="25" y="40" font-size="26" font-weight="bold">Une seule vente, deux sens de preuve</text>
<text x="25" y="83" font-size="19" font-weight="bold" fill="#365c66">Qui veut prouver ?</text>
<text x="332" y="83" font-size="19" font-weight="bold" fill="#365c66">Contre qui ?</text>
<text x="665" y="83" font-size="19" font-weight="bold" fill="#365c66">Régime de principe</text>
<rect x="14" y="99" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="138" font-size="18">Particulier acheteur</text>
<text x="332" y="125" font-size="18">Commerçant vendeur</text>
<text x="332" y="149" font-size="18">agissant pour son commerce</text>
<text x="665" y="125" font-size="18">Preuve de l’acte</text>
<text x="665" y="149" font-size="18">par tous moyens</text>
<path d="M 299 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="174" width="962" height="64" rx="8" fill="#edf2e6"/>
<text x="25" y="213" font-size="18">Commerçant vendeur</text>
<text x="332" y="200" font-size="18">Particulier acquérant</text>
<text x="332" y="224" font-size="18">pour son usage privé</text>
<text x="665" y="200" font-size="18">Règles civiles de preuve</text>
<text x="665" y="224" font-size="18">de l’acte juridique</text>
<path d="M 299 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
</g>
</svg>
