<svg xmlns="http://www.w3.org/2000/svg" width="950" height="322" viewBox="0 0 950 322" role="img" aria-labelledby="titre desc">
<title id="titre">La dépense et les fuites à chaque tour du multiplicateur</title>
<desc id="desc">Sur un euro de revenu supplémentaire, 25 centimes vont aux impôts, 15 à l’épargne, 20 aux importations et 40 à la nouvelle demande intérieure.</desc>
<rect width="950" height="322" rx="12" fill="#f7f8fa"/>
<g font-family="DejaVu Sans,sans-serif" fill="#183747">
<text x="23" y="40" font-size="25" font-weight="bold">Où va un euro supplémentaire de revenu ?</text>
<text x="23" y="75" font-size="18">Exemple à prix fixes, sans réaction des taux, pour une petite économie ouverte.</text>
<rect x="25" y="104" width="216" height="53" fill="#597085"/><rect x="241" y="104" width="130" height="53" fill="#734c66"/><rect x="371" y="104" width="173" height="53" fill="#965b29"/><rect x="544" y="104" width="346" height="53" fill="#146353"/>
<g font-size="20" fill="white" text-anchor="middle" font-weight="bold"><text x="133" y="138">0,25 €</text><text x="306" y="138">0,15 €</text><text x="457" y="138">0,20 €</text><text x="717" y="138">0,40 €</text></g>
<g font-size="18" text-anchor="middle"><text x="133" y="185">Impôts</text><text x="306" y="185">Épargne</text><text x="457" y="185">Importations</text><text x="717" y="185">Demande intérieure</text></g>
<path d="M717 197 v24 H465 v14 m-6 -6 6 6 6 -6" fill="none" stroke="#146353" stroke-width="3"/>
<text x="475" y="269" font-weight="bold" font-size="21" text-anchor="middle">Demande produite au tour suivant : 0,40 €</text>
<text x="475" y="299" font-size="17" text-anchor="middle">Le cycle se répète : 1 + 0,40 + 0,16 + … ≈ 1,67 € de production.</text>
</g></svg>
