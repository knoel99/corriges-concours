<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-labelledby="titre desc">
<title id="titre">Un même taux nominal, deux taux réels locaux</title>
<desc id="desc">Pour un taux nominal de 3 %, le taux réel approximatif est de 2 % si l’inflation anticipée est de 1 %, et de 0 % si elle est de 3 %.</desc>
<rect width="920" height="330" rx="12" fill="#f6f8fa"/>
<g font-family="DejaVu Sans,sans-serif" fill="#183747">
<text x="20" y="38" font-size="26" font-weight="bold">Un même taux nominal, deux taux réels locaux</text>
<text x="20" y="70" font-size="18">Illustration à primes de risque identiques · taux nominal commun de 3 %</text>
<text x="40" y="133" font-size="21" font-weight="bold">Pays A</text><text x="40" y="161" font-size="17">Inflation anticipée de 1 %</text>
<text x="40" y="200" font-size="21" font-weight="bold">Pays B</text><text x="40" y="228" font-size="17">Inflation anticipée de 3 %</text>
<g stroke="#d8e2e6" stroke-width="2"><path d="M305 92 v142 M475 92 v142 M645 92 v142 M815 92 v142"/></g>
<path d="M305 135 h340 M305 201 h1" stroke="#26766c" stroke-width="13"/>
<circle cx="645" cy="135" r="9" fill="#185951"/><circle cx="305" cy="201" r="9" fill="#185951"/>
<path d="M305 235 h540" stroke="#48616f" stroke-width="2"/>
<g font-size="17" text-anchor="middle"><text x="305" y="261">0 %</text><text x="475" y="261">1 %</text><text x="645" y="261">2 %</text><text x="815" y="261">3 %</text></g>
<text x="305" y="302" font-size="18">Taux réel local ≈ taux nominal − inflation anticipée</text>
</g></svg>
