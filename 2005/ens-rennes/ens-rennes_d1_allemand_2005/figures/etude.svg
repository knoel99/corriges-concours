<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Trois niveaux de discours sur les aspirations</title>
<desc id="description">Rumeur Une image traditionnelle est attribuée à l’opinion. Ne pas la présenter comme un résultat de l’enquête. Enquête Des jeunes femmes poursuivent leurs études malgré des obstacles. Distinguer l’aide aux devoirs du soutien familial. Question Comparer la préparation au marché du travail. Les groupes proposés ne sont pas nécessairement exclusifs.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois niveaux de discours sur les aspirations</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Niveau</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce que l’on apprend</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Précaution</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Rumeur</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Une image traditionnelle</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">est attribuée à l’opinion.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Ne pas la présenter comme</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">un résultat de l’enquête.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Enquête</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Des jeunes femmes</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">poursuivent leurs études</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">malgré des obstacles.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Distinguer l’aide aux</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">devoirs du soutien</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">familial.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Question</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Comparer la préparation au</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">marché du travail.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Les groupes proposés ne</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">sont pas nécessairement</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">exclusifs.</text>
</g>
</svg>
