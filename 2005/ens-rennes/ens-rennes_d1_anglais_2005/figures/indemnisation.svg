<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">De la pratique avouée à une réparation éventuelle</title>
<desc id="description">Échange de données Une organisation professionnelle suspend la pratique. Les juristes veulent en examiner la conformité. Effet sur les prix Un lien avec l’écart de prix est envisagé. La conditionnelle maintient l’incertitude. Dommage individuel L’acheteur devrait établir un surcoût. La réparation se distingue de l’amende.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De la pratique avouée à une réparation éventuelle</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Élément établi ou supposé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conséquence</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Échange de données</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Une organisation</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">professionnelle suspend la</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">pratique.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les juristes veulent en</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">examiner la conformité.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Effet sur les prix</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Un lien avec l’écart de</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">prix est envisagé.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">La conditionnelle maintient</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">l’incertitude.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Dommage individuel</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">L’acheteur devrait établir</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">un surcoût.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La réparation se distingue</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">de l’amende.</text>
</g>
</svg>
