<svg xmlns="http://www.w3.org/2000/svg" width="800" height="275" viewBox="0 0 800 275" role="img"><title>Trente années d’occupation peuvent conduire à trois solutions distinctes.</title><rect width="800" height="275" rx="10" fill="#faf9f5"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="24" y="33" fill="#17354b" font-size="22" font-weight="bold">Qui a occupé la parcelle pendant trente ans ?</text>
<text x="24" y="70" fill="#355f73" font-size="17" font-weight="bold">Situation à l’origine</text>
<text x="334" y="70" fill="#355f73" font-size="17" font-weight="bold">Raisonnement à conduire</text>
<rect x="14" y="81" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 103h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="81" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="109" fill="#152c3d" font-size="16">Locataire entré avec un bail</text>
<text x="334" y="109" fill="#152c3d" font-size="16">Détention pour autrui, rechercher une interversion</text>
<rect x="14" y="136" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 158h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="136" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="164" fill="#152c3d" font-size="16">Voisin admis par tolérance</text>
<text x="334" y="164" fill="#152c3d" font-size="16">L’autorisation ne fonde pas une possession utile</text>
<rect x="14" y="191" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 213h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="191" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="219" fill="#152c3d" font-size="16">Possesseur à titre de maître</text>
<text x="334" y="219" fill="#152c3d" font-size="16">Si possession utile maintenue, prescription possible</text>
</g></svg>
