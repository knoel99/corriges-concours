<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">Dispute en famille</title><desc id="d">La façon de rester à table ou de la quitter rend visible le désaccord que les trois personnages expriment à peine.</desc><rect width="760" height="230" fill="white"/><g font-family="sans-serif"><rect x="7" y="9" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="46" fill="#194552" font-size="18" font-weight="bold">Le père</text><text x="210" y="33" fill="#173d48" font-size="18" font-weight="bold">Il annonce le voyage puis quitte la table.</text><text x="210" y="57" fill="#294650" font-size="16">Sa colère rompt le rythme du repas.</text><rect x="7" y="82" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="119" fill="#194552" font-size="18" font-weight="bold">La mère</text><text x="210" y="106" fill="#173d48" font-size="18" font-weight="bold">Elle poursuit son repas et refuse de partir.</text><text x="210" y="130" fill="#294650" font-size="16">Son calme rend le refus plus sensible.</text><rect x="7" y="155" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="192" fill="#194552" font-size="18" font-weight="bold">David</text><text x="210" y="179" fill="#173d48" font-size="18" font-weight="bold">Entre ses parents, il hésite à se lever.</text><text x="210" y="203" fill="#294650" font-size="16">Sa faim fait aussi pencher la balance.</text></g></svg>
