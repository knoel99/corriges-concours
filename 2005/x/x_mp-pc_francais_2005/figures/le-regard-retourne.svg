<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="t d"><title id="t">Jacques Derrida, le regard de l’animal et le commencement de la pensée</title><desc id="d">La rencontre change de sens lorsque l’homme cesse d’être le seul observateur. Le dernier mouvement reste une possibilité et suppose une réponse humaine.</desc><rect width="760" height="240" fill="white"/><g font-family="sans-serif"><rect x="10" y="14" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="49" fill="#194754" font-size="18" font-weight="bold">Regard</text><text x="212" y="37" fill="#253a40" font-size="18" font-weight="bold">Le loup surprend les bergers en train de manger.</text><text x="212" y="62" fill="#193f4b" font-size="16" font-weight="normal">Les hommes deviennent eux-mêmes un spectacle.</text><rect x="10" y="88" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="123" fill="#194754" font-size="18" font-weight="bold">Mise à nu</text><text x="212" y="111" fill="#253a40" font-size="18" font-weight="bold">Le privilège du juge apparaît à celui qui est jugé.</text><text x="212" y="136" fill="#193f4b" font-size="16" font-weight="normal">Nos justifications perdent leur évidence.</text><rect x="10" y="162" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="197" fill="#194754" font-size="18" font-weight="bold">Pensée possible</text><text x="212" y="185" fill="#253a40" font-size="18" font-weight="bold">Peut-on entendre un témoin qui nous déplaît ?</text><text x="212" y="210" fill="#193f4b" font-size="16" font-weight="normal">La fable de la couleuvre met la réponse à l’épreuve.</text></g></svg>