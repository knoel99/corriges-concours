<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Le passage de la ville à l’intimité du salon règle le rythme du récit de Mohammed Berrada.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">La ruelle</text>
<text x="27" y="118" font-size="16">Les arbres anciens</text>
<text x="27" y="137" font-size="16">atténuent le poids du</text>
<text x="27" y="156" font-size="16">béton et des voitures.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">L’étage</text>
<text x="298" y="118" font-size="16">La voix d’un récitant</text>
<text x="298" y="137" font-size="16">monte dans la bruine</text>
<text x="298" y="156" font-size="16">avant la rencontre avec</text>
<text x="298" y="175" font-size="16">Zeïnat.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Le souvenir</text>
<text x="569" y="118" font-size="16">Le jeune locataire</text>
<text x="569" y="137" font-size="16">redevient pour son</text>
<text x="569" y="156" font-size="16">hôtesse le familier</text>
<text x="569" y="175" font-size="16">d’autrefois.</text>
</g></svg>
