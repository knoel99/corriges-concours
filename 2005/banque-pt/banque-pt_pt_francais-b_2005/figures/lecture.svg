<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Quelle mesure rencontre-t-on dans les œuvres ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Quelle mesure rencontre-t-on dans les œuvres ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Étalon</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Condillac compare besoin, expérience et</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">apprentissage.</text>
<text x="549" y="62" font-size="14" font-weight="700" fill="#203c49">Facultés à</text>
<text x="549" y="79" font-size="14" font-weight="700" fill="#203c49">examiner</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Miroir</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">Le tribunal des animaux fait voir une cour</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">humaine.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Institution à juger</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Repoussoir</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">La famille de Gregor veut soustraire son</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">corps aux regards.</text>
<text x="549" y="180" font-size="14" font-weight="700" fill="#203c49">Exclusion à</text>
<text x="549" y="197" font-size="14" font-weight="700" fill="#203c49">interroger</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
