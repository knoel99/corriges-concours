<svg xmlns="http://www.w3.org/2000/svg" width="720" height="130" viewBox="0 0 720 130" role="img" aria-labelledby="titre">
<title id="titre">Pourquoi la nouvelle ne change rien</title><rect width="720" height="130" rx="8" fill="#f4f7f7"/><text x="16" y="27" font-family="DejaVu Sans" font-weight="bold" font-size="17" fill="#183541">Pourquoi la nouvelle ne change rien</text>
<rect x="14" y="44" width="216" height="65" rx="8" fill="#ffffff" stroke="#68838d"/><text x="122" y="69" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="14.8" fill="#183541">Rumeur</text><text x="122" y="92" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#193e49">Philippe est malade</text>
<rect x="248" y="44" width="216" height="65" rx="8" fill="#ffffff" stroke="#68838d"/><text x="356" y="69" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="14.8" fill="#183541">Conduite des citoyens</text><text x="356" y="92" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#193e49">La négligence persiste</text>
<rect x="482" y="44" width="216" height="65" rx="8" fill="#ffffff" stroke="#68838d"/><text x="590" y="69" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="14.8" fill="#183541">Conséquence prévue</text><text x="590" y="92" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#193e49">Un autre Philippe</text><path d="M231 77 h15 m-4 -4 l4 4 -4 4 M465 77 h15 m-4 -4 l4 4 -4 4" fill="none" stroke="#345761" stroke-width="1.5"/>
</svg>
