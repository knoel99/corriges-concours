<svg xmlns="http://www.w3.org/2000/svg" width="760" height="219" viewBox="0 0 760 219" role="img"><title>Quatre maillons du système d’alerte</title><rect width="760" height="219" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#193746">
<text x="12" y="25" font-size="20" font-weight="700">Quatre maillons du système d’alerte</text>
<rect x="10" y="40" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="63" font-size="17" font-weight="700">Séisme détecté</text>
<path d="M236 57h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="40" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="63" font-size="17" font-weight="400">Les stations enregistrent la secousse.</text>
<rect x="10" y="81" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="104" font-size="17" font-weight="700">Vague éventuelle</text>
<path d="M236 98h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="81" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="104" font-size="17" font-weight="400">Tout séisme sous-marin ne produit pas un tsunami.</text>
<rect x="10" y="122" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="145" font-size="17" font-weight="700">Message diffusé</text>
<path d="M236 139h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="122" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="145" font-size="17" font-weight="400">Une autorité doit donner la consigne aux radios.</text>
<rect x="10" y="163" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="186" font-size="17" font-weight="700">Habitants avertis</text>
<path d="M236 180h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="163" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="186" font-size="17" font-weight="400">Une évacuation praticable doit pouvoir commencer.</text>
</g></svg>
