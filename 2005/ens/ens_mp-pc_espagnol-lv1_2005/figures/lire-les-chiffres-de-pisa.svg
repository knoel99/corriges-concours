<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">L’Espagne recalée en éducation</title><desc id="d">Trois chiffres éclairent des aspects différents des résultats espagnols en mathématiques. Deux portent sur les difficultés et le troisième sur les meilleurs scores.</desc><rect width="760" height="230" fill="white"/><g font-family="sans-serif"><rect x="7" y="9" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="46" fill="#194552" font-size="18" font-weight="bold">2000</text><text x="210" y="33" fill="#173d48" font-size="18" font-weight="bold">20 % échouent aux exercices de base.</text><text x="210" y="57" fill="#294650" font-size="16">Il s’agit d’une proportion d’élèves espagnols.</text><rect x="7" y="82" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="119" fill="#194552" font-size="18" font-weight="bold">2004</text><text x="210" y="106" fill="#173d48" font-size="18" font-weight="bold">23 % échouent aux exercices de base.</text><text x="210" y="130" fill="#294650" font-size="16">L’écart avec la précédente enquête est de trois points.</text><rect x="7" y="155" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="192" fill="#194552" font-size="18" font-weight="bold">Notes élevées</text><text x="210" y="179" fill="#173d48" font-size="18" font-weight="bold">1 % obtiennent les meilleures notes.</text><text x="210" y="203" fill="#294650" font-size="16">Cet indicateur concerne l’autre bout de la distribution.</text></g></svg>
