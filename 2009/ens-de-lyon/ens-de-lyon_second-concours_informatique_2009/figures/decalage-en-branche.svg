<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 207" width="690" height="207">
  <title>Élimination de la couleur quatre sur une branche</title>
  <line x1="233" y1="84" x2="343" y2="84" stroke="#687585" stroke-width="1.6" />
  <line x1="388" y1="84" x2="498" y2="84" stroke="#687585" stroke-width="1.6" />
  <line x1="233" y1="146" x2="343" y2="146" stroke="#687585" stroke-width="1.6" />
  <line x1="388" y1="146" x2="498" y2="146" stroke="#687585" stroke-width="1.6" />
  <text x="210" y="32" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold">C</text>
  <text x="365" y="32" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold">E</text>
  <text x="520" y="32" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold">G</text>
  <text x="24" y="89" fill="#21394d" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Avant le tour</text>
  <circle cx="210" cy="84" r="19" fill="#faf7ef" stroke="#21394d" stroke-width="1.8" />
  <text x="210" y="90" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">3</text>
  <circle cx="365" cy="84" r="19" fill="#faf7ef" stroke="#21394d" stroke-width="1.8" />
  <text x="365" y="90" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">4</text>
  <circle cx="520" cy="84" r="19" fill="#faf7ef" stroke="#21394d" stroke-width="1.8" />
  <text x="520" y="90" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">1</text>
  <text x="24" y="151" fill="#21394d" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">Après le tour</text>
  <circle cx="210" cy="146" r="19" fill="#faf7ef" stroke="#21394d" stroke-width="1.8" />
  <text x="210" y="152" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">0</text>
  <circle cx="365" cy="146" r="19" fill="#faf7ef" stroke="#21394d" stroke-width="1.8" />
  <text x="365" y="152" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">3</text>
  <circle cx="520" cy="146" r="19" fill="#dfefeb" stroke="#21394d" stroke-width="1.8" />
  <text x="520" y="152" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">0</text>
  <text x="358" y="197" fill="#00645d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">G hériterait de 4. La règle écarte son ancien 1 et le 3 de C, donc G reçoit 0.</text>
</svg>