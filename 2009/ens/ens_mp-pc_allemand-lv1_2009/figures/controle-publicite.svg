<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>Du lancement au retrait du slogan d’Areva, les trois interventions décrites par Dorothea Hahn.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Qui intervient sur le slogan d’Areva ?</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Avant la contestation</text>
<text x="21" y="110" font-size="15">L’ARPP approuve le slogan</text>
<text x="21" y="131" font-size="15">lors de son lancement.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">En décembre</text>
<text x="286" y="110" font-size="15">Les Verts saisissent</text>
<text x="286" y="131" font-size="15">l’ARPP et contestent le</text>
<text x="286" y="152" font-size="15">mot « propre ».</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Après la critique</text>
<text x="551" y="110" font-size="15">Areva retire son slogan</text>
<text x="551" y="131" font-size="15">provisoirement.</text>
</g></svg>
