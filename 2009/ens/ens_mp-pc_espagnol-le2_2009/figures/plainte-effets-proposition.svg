<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>L’article de 2009 sépare le fait divers, l’argument de la plainte et la protection proposée.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Du fait divers à la proposition de Facua</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Affaire Bisbal</text>
<text x="21" y="110" font-size="15">Le chantage est rapporté.</text>
<text x="21" y="131" font-size="15">La façon dont le compte a</text>
<text x="21" y="152" font-size="15">été compromis est une</text>
<text x="21" y="173" font-size="15">question.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">Plainte de Facua</text>
<text x="286" y="110" font-size="15">L’association met en cause</text>
<text x="286" y="131" font-size="15">la robustesse des</text>
<text x="286" y="152" font-size="15">contrôles de récupération.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Protection proposée</text>
<text x="551" y="110" font-size="15">Réserver la récupération à</text>
<text x="551" y="131" font-size="15">des moyens sûrs, dont une</text>
<text x="551" y="152" font-size="15">adresse de secours.</text>
</g></svg>
