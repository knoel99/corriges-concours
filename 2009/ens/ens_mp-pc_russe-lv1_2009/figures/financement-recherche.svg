<svg xmlns="http://www.w3.org/2000/svg" width="794" height="224" viewBox="0 0 794 224" role="img"><title>Les deux enveloppes annoncées en mai 2008</title>
<rect width="794" height="224" rx="10" fill="#f6f6ef"/><g font-family="DejaVu Sans, sans-serif" fill="#1d3b42"><text x="22" y="32" font-size="20" font-weight="bold">Deux annonces de financement dans le discours</text>
<rect x="19" y="52" width="357" height="150" rx="9" fill="#dcebec"/><text x="36" y="85" font-size="18" font-weight="bold">Recherche fondamentale</text><text x="35" y="126" font-size="29" fill="#195963">60 milliards</text><text x="36" y="155" font-size="17">de roubles chaque année</text><text x="36" y="183" font-size="14">Promesse devant l’assemblée de l’Académie</text>
<rect x="389" y="52" width="384" height="150" rx="9" fill="#e1eadc"/><text x="406" y="85" font-size="18" font-weight="bold">Programmes fédéraux ciblés</text><text x="405" y="126" font-size="29" fill="#315b35">Environ 600 milliards</text><text x="406" y="155" font-size="17">de roubles sur 2008–2010</text><text x="406" y="183" font-size="14">Affectés au développement de secteurs choisis</text></g></svg>
