<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>Les trois échelles de l’appel de la gouverneure du Michigan, de la prise du garage au projet fédéral.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Pourquoi financer la voiture rechargeable ?</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Pour le ménage</text>
<text x="21" y="110" font-size="15">La recharge nocturne coûte</text>
<text x="21" y="131" font-size="15">peu et couvre un trajet</text>
<text x="21" y="152" font-size="15">quotidien.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">Pour le Michigan</text>
<text x="286" y="110" font-size="15">Les batteries peuvent</text>
<text x="286" y="131" font-size="15">soutenir l’industrie et</text>
<text x="286" y="152" font-size="15">l’emploi.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Pour le pays</text>
<text x="551" y="110" font-size="15">La recherche fédérale et</text>
<text x="551" y="131" font-size="15">les industriels mettent</text>
<text x="551" y="152" font-size="15">leurs moyens en commun.</text>
</g></svg>
