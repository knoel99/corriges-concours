<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>Les deux groupes décrits dans l’article et l’effet propre du placement des aiguilles que la comparaison cherche à isoler.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Que compare l’étude rapportée ?</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Groupe traditionnel</text>
<text x="21" y="110" font-size="15">Les aiguilles sont placées</text>
<text x="21" y="131" font-size="15">aux points prévus par la</text>
<text x="21" y="152" font-size="15">technique.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">Groupe témoin</text>
<text x="286" y="110" font-size="15">Les aiguilles sont placées</text>
<text x="286" y="131" font-size="15">au hasard ou en d’autres</text>
<text x="286" y="152" font-size="15">points.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Observation</text>
<text x="551" y="110" font-size="15">Les deux groupes signalent</text>
<text x="551" y="131" font-size="15">un soulagement comparable.</text>
</g></svg>
