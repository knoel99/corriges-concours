<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>Le spectre est un exemple de mesure qui renseigne l’astronome sur un objet inaccessible.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">Que peut nous apprendre la lumière d’une étoile ?</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">1. Recevoir</text>
<text x="21" y="110" font-size="15">Le télescope recueille la</text>
<text x="21" y="131" font-size="15">lumière venue de l’étoile.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">2. Séparer</text>
<text x="286" y="110" font-size="15">Un spectrographe révèle</text>
<text x="286" y="131" font-size="15">des raies à des longueurs</text>
<text x="286" y="152" font-size="15">d’onde précises.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">3. Comparer</text>
<text x="551" y="110" font-size="15">Les raies identifiées</text>
<text x="551" y="131" font-size="15">renseignent sur la</text>
<text x="551" y="152" font-size="15">composition du gaz.</text>
</g></svg>
