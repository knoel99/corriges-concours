<svg xmlns="http://www.w3.org/2000/svg" width="800" height="202" viewBox="0 0 800 202" role="img"><title>Les correspondances religieuses que le psychiatre emploie pour décrire un culte de la santé.</title><rect width="800" height="202" rx="9" fill="#f7f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#253a46"><text x="16" y="33" font-size="20" font-weight="bold">L’image filée dans les paroles de Manfred Lütz</text>
<rect x="12" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="21" y="84" font-size="16" font-weight="bold">Textes de référence</text>
<text x="21" y="110" font-size="15">Les guides de santé</text>
<text x="21" y="131" font-size="15">deviennent les Écritures.</text>
<rect x="277" y="54" width="244" height="134" rx="8" fill="#e3ece4"/>
<text x="286" y="84" font-size="16" font-weight="bold">Lieux de culte</text>
<text x="286" y="110" font-size="15">Les cliniques prennent la</text>
<text x="286" y="131" font-size="15">place des cathédrales.</text>
<rect x="542" y="54" width="244" height="134" rx="8" fill="#e1eced"/>
<text x="551" y="84" font-size="16" font-weight="bold">Pèlerinage</text>
<text x="551" y="110" font-size="15">La visite au spécialiste</text>
<text x="551" y="131" font-size="15">devient un voyage de</text>
<text x="551" y="152" font-size="15">pèlerin.</text>
</g></svg>
