<svg xmlns="http://www.w3.org/2000/svg" width="760" height="178" viewBox="0 0 760 178" role="img"><title>Comment la compassion est-elle devenue une catégorie politique ?</title><rect width="760" height="178" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#193746">
<text x="12" y="25" font-size="19" font-weight="700">Comment la compassion est-elle devenue une catégorie politique ?</text>
<rect x="10" y="40" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="63" font-size="17" font-weight="700">Discours du présent</text>
<path d="M236 57h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="40" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="63" font-size="17" font-weight="400">La protection et la fracture dominent le vocabulaire.</text>
<rect x="10" y="81" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="104" font-size="14" font-weight="700">Histoire sociale récente</text>
<path d="M236 98h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="81" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="104" font-size="14" font-weight="400">Chômage et précarité rendent visibles de nouvelles fragilités.</text>
<rect x="10" y="122" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="145" font-size="17" font-weight="700">Longue durée</text>
<path d="M236 139h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="122" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="145" font-size="14" font-weight="400">La ressemblance entre égaux rend la souffrance partageable.</text>
</g></svg>
