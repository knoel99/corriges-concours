<svg xmlns="http://www.w3.org/2000/svg" width="720" height="214" viewBox="0 0 720 214" role="img" aria-labelledby="t d"><title id="t">Subdivision contenant un tiers</title><desc id="d">Les intervalles emboîtés sont de zéro à un, de zéro à un demi, puis d’un quart à un demi. Le point un tiers appartient à chacun.</desc><rect width="720" height="214" fill="white"/><g fill="none" stroke-linecap="round" stroke-width="12"><path d="M60 52H532" stroke="#164e63"/><path d="M60 104H296" stroke="#236c78"/><path d="M178 156H296" stroke="#86431d"/></g><path d="M217.33 28V177" stroke="#69283a" stroke-width="2" stroke-dasharray="5 4"/><g font-family="sans-serif" font-size="16" fill="#172d38"><text x="54" y="30">0</text><text x="523" y="30">1</text><text x="540" y="58">p</text><text x="308" y="110">gauche · [0, 1/2]</text><text x="308" y="162">p/16 · [1/4, 1/2]</text><text x="192" y="199">x = 1/3</text></g></svg>
