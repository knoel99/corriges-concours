<svg xmlns="http://www.w3.org/2000/svg" width="720" height="128" viewBox="0 0 720 128" role="img" aria-labelledby="titre">
<title id="titre">Deux lectures d’un livre tombé</title>
<rect width="720" height="128" rx="8" fill="#f5f8fa"/>
<text x="18" y="27" font-family="DejaVu Sans" font-weight="bold" font-size="17" fill="#193747">Deux lectures d’un livre tombé</text>
<rect x="16" y="44" width="215" height="65" rx="7" fill="#fff" stroke="#597789"/>
<text x="123.5" y="69" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#193747">Le livre glisse</text>
<text x="123.5" y="92" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" fill="#2c4656">Un homme le ramasse</text>
<path d="M 232 77 h 15 m -4 -4 l 4 4 -4 4" fill="none" stroke="#385b68" stroke-width="1.5"/>
<rect x="250" y="44" width="215" height="65" rx="7" fill="#fff" stroke="#597789"/>
<text x="357.5" y="69" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#193747">Son souvenir à elle</text>
<text x="357.5" y="92" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" fill="#2c4656">Elle y voit un signe</text>
<path d="M 466 77 h 15 m -4 -4 l 4 4 -4 4" fill="none" stroke="#385b68" stroke-width="1.5"/>
<rect x="484" y="44" width="215" height="65" rx="7" fill="#fff" stroke="#597789"/>
<text x="591.5" y="69" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#193747">Son récit à lui</text>
<text x="591.5" y="92" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" fill="#2c4656">Il parle de pressentiment</text>
</svg>
