<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Qu’est-ce qui change dans l’enquête sur soi ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Qu’est-ce qui change dans l’enquête sur soi ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Leiris</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Des souvenirs éloignés se répondent dans</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">la composition du portrait.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">Forme littéraire</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Augustin</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">L’examen du présent devient prière</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">adressée et partagée.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Relation nouvelle</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Lorenzo</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Un rôle joué longtemps transforme celui qui</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">le portait.</text>
<text x="549" y="189" font-size="14" font-weight="700" fill="#203c49">Identité modifiée</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
