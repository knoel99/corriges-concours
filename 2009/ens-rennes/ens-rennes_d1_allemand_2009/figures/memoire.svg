<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">À qui attribuer chaque affirmation ?</title>
<desc id="description">Élèves interrogés À qui attribuer le Mur ou des responsables politiques. Réponses au sondage, parfois erronées. Responsable de l’enquête L’image que les jeunes ont de la RDA. Interprétation des résultats. Wolfgang Welsch Le passé vécu par les victimes. Témoignage et refus de tourner la page.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">À qui attribuer chaque affirmation ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voix</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Objet</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Valeur</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Élèves interrogés</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">À qui attribuer le Mur ou</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">des responsables</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">politiques.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Réponses au sondage,</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">parfois erronées.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Responsable de</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">l’enquête</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">L’image que les jeunes ont</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">de la RDA.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Interprétation des</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">résultats.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Wolfgang Welsch</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Le passé vécu par les</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">victimes.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Témoignage et refus de</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">tourner la page.</text>
</g>
</svg>
