<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Three questions in the presidential campaign</title>
<desc id="description">Who can reach high office? Clinton and Palin as candidates. Political representation. What do they advocate? Disagreement over abortion rights. A political programme. How are women addressed? The demand to iron a shirt. Everyday assumptions about gender.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Three questions in the presidential campaign</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Example in the article</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Distinction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Who can reach high</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">office?</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Clinton and Palin as</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">candidates.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Political representation.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">What do they</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">advocate?</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Disagreement over abortion</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">rights.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">A political programme.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">How are women</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">addressed?</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">The demand to iron a</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">shirt.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Everyday assumptions about</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">gender.</text>
</g>
</svg>
