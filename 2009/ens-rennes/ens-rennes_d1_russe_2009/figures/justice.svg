<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois conditions d’une justice effective dans le discours</title>
<desc id="description">Connaître Publier l’information sur les tribunaux. Rendre les procédures compréhensibles. Faire exécuter Établir une responsabilité effective. Donner effet aux décisions. Protéger Peser les peines et protéger les victimes. Humaniser la justice.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois conditions d’une justice effective dans le discours</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Moyen cité</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Résultat recherché</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Connaître</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Publier l’information sur</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">les tribunaux.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Rendre les procédures</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">compréhensibles.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Faire exécuter</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Établir une responsabilité</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">effective.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Donner effet aux décisions.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Protéger</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Peser les peines et</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">protéger les victimes.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Humaniser la justice.</text>
</g>
</svg>
