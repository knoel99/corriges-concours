<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Quale affermazione appartiene a quale registro?</title>
<desc id="description">Personaggi di Shakespeare Segni visibili della passione. Dialogo letterario. Ricercatore citato Osservazioni sulla fiducia. Risultato riferito nell’articolo del 2009. Giornalista Una futura pillola dei sentimenti. Prospettiva al condizionale.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quale affermazione appartiene a quale registro?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voce</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Esempio</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Statuto</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Personaggi di</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">Shakespeare</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Segni visibili della</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">passione.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Dialogo letterario.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Ricercatore citato</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Osservazioni sulla</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">fiducia.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Risultato riferito</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">nell’articolo del 2009.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Giornalista</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Una futura pillola dei</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">sentimenti.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Prospettiva al</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">condizionale.</text>
</g>
</svg>
