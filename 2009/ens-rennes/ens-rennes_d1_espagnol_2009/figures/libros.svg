<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">¿Qué distingue los proyectos citados?</title>
<desc id="description">Alejandría y la Enciclopedia Reunir u ordenar saberes. ¿Cómo transmitir el conocimiento? Biblioteca de Babel Imaginar una colección total. ¿Cómo orientarse en ella? Google Books Digitalizar e indexar obras. ¿Quién decide el acceso y sus condiciones?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿Qué distingue los proyectos citados?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Proyecto</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Gesto principal</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Pregunta que suscita</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Alejandría y la</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">Enciclopedia</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Reunir u ordenar saberes.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">¿Cómo transmitir el</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">conocimiento?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Biblioteca de Babel</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Imaginar una colección</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">total.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">¿Cómo orientarse en ella?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Google Books</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Digitalizar e indexar</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">obras.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">¿Quién decide el acceso y</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">sus condiciones?</text>
</g>
</svg>
