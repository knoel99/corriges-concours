<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">How does the writer explain loneliness?</title>
<desc id="description">Factory closures, cars, screens Structural change. Too little to explain the speed of change. Competition, the insult ‘loser’ An ideology shapes what people value. The writer’s proposed explanation. Two in five older people Television as their main company. Reported consequence, not a causal test.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">How does the writer explain loneliness?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Evidence</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Place in the argument</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Limit</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Factory closures,</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">cars, screens</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Structural change.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Too little to explain the</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">speed of change.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Competition, the</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">insult ‘loser’</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">An ideology shapes what</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">people value.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">The writer’s proposed</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">explanation.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Two in five older</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">people</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Television as their main</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">company.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Reported consequence, not a</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">causal test.</text>
</g>
</svg>
