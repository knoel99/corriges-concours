<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Tre impegni, tre indicazioni diverse</title>
<desc id="description">Operazione Triton Almeno fino alla fine del 2015. Proroga annunciata. Finanziamenti di emergenza 13,7 milioni di euro. Già erogati all’Italia. Progetto Praesidium 1,715 milioni di euro. Da stanziare per proseguire il progetto.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Tre impegni, tre indicazioni diverse</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Misura</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dato</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Stato nel testo</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Operazione Triton</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Almeno fino alla fine del</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">2015.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Proroga annunciata.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Finanziamenti di</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">emergenza</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">13,7 milioni di euro.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Già erogati all’Italia.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Progetto Praesidium</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">1,715 milioni di euro.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Da stanziare per proseguire</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">il progetto.</text>
</g>
</svg>
