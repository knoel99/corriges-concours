<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Trois sens de l’amitié dans le texte</title>
<desc id="description">130 contacts Moyenne indiquée par Facebook. Combien de contacts sont enregistrés ? Éloignement Relation entretenue malgré la distance. Que permet le réseau ? Difficulté réelle Soutien et confiance. Sur qui peut-on compter ?</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois sens de l’amitié dans le texte</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Indice</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Relation visée</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question utile</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">130 contacts</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Moyenne indiquée par</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Facebook.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Combien de contacts sont</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">enregistrés ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Éloignement</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Relation entretenue malgré</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">la distance.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Que permet le réseau ?</text>
<rect x="10" y="226" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Difficulté réelle</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Soutien et confiance.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Sur qui peut-on compter ?</text>
</g>
</svg>
