<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">¿Qué compara cada afirmación?</title>
<desc id="description">Piketty Rendimiento del capital y crecimiento económico. Ventaja acumulada de quien ya tiene patrimonio. OCDE Paro y caída de los ingresos más bajos. Comparación entre países. Periodista Austeridad y recepción del libro. Malestar social y político.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿Qué compara cada afirmación?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Fuente</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Magnitudes</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Alcance</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Piketty</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Rendimiento del capital y</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">crecimiento económico.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Ventaja acumulada de quien</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">ya tiene patrimonio.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">OCDE</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Paro y caída de los</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">ingresos más bajos.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Comparación entre países.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Periodista</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Austeridad y recepción del</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">libro.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Malestar social y político.</text>
</g>
</svg>
