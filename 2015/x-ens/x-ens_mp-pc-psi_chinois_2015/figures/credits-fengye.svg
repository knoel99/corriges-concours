<svg xmlns="http://www.w3.org/2000/svg" width="740" height="212" viewBox="0 0 740 212" role="img"><title>Les 80 crédits du cursus décrit par le groupe 枫叶 dans le document A4.</title><rect width="740" height="212" rx="7" fill="#f5f8f7"/>
<text x="26" y="37" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="23" fill="#173d42">Répartition des crédits</text>
<text x="715" y="37" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#173d42">Minimum requis : 80 crédits</text>
<rect x="27" y="64" width="411" height="43" fill="#206b71"/>
<rect x="438" y="64" width="274" height="43" fill="#bbd6c9"/>
<text x="232" y="92" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#ffffff">48 obligatoires</text>
<text x="574" y="92" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="21" fill="#173d42">32 à option</text>
<text x="26" y="149" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="19" fill="#173d42">Plus de 200 cours proposés pour obtenir les crédits à option.</text>
<text x="26" y="185" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="17" fill="#173d42">Après 15 heures, les apprentissages se poursuivent en club.</text></svg>
