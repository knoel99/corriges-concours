<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="t d"><title id="t">Simone Weil et l’effacement des buts dans la guerre</title><desc id="d">Trois moments où se mesure l’effacement des fins. La dernière ligne montre ce qu’exige le passage du souhait de paix au jugement sur la poursuite du conflit.</desc><rect width="760" height="240" fill="white"/><g font-family="sans-serif"><rect x="10" y="14" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="49" fill="#194754" font-size="18" font-weight="bold">Finalité politique</text><text x="212" y="37" fill="#253a40" font-size="18" font-weight="bold">Quelle situation veut-on rendre possible ?</text><text x="212" y="62" fill="#193f4b" font-size="16" font-weight="normal">Chez Clausewitz, sa valeur mesure le prix acceptable.</text><rect x="10" y="88" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="123" fill="#194754" font-size="18" font-weight="bold">Présent du combat</text><text x="212" y="111" fill="#253a40" font-size="18" font-weight="bold">Que reste-t-il de demain dans la tranchée ?</text><text x="212" y="136" fill="#193f4b" font-size="16" font-weight="normal">Chez Barbusse, le besoin immédiat occupe le temps.</text><rect x="10" y="162" width="185" height="58" rx="5" fill="#e7eff1"/><text x="24" y="197" fill="#194754" font-size="18" font-weight="bold">Jugement retrouvé</text><text x="212" y="185" fill="#253a40" font-size="18" font-weight="bold">Pour qui et à quel prix continuer ?</text><text x="212" y="210" fill="#193f4b" font-size="16" font-weight="normal">La plainte perse oblige les vainqueurs à entendre une perte.</text></g></svg>