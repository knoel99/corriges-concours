<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Les trois mesures de la disponibilité de l’eau mises en relation dans la synthèse.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Le flux</text>
<text x="27" y="123" font-size="16">Les pluies et les</text>
<text x="27" y="145" font-size="16">fleuves alimentent une</text>
<text x="27" y="167" font-size="16">ressource annuelle</text>
<text x="27" y="189" font-size="16">inégalement répartie.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">La réserve</text>
<text x="298" y="123" font-size="16">Un aquifère fossile</text>
<text x="298" y="145" font-size="16">diminue lorsque les</text>
<text x="298" y="167" font-size="16">prélèvements dépassent</text>
<text x="298" y="189" font-size="16">sa recharge.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Le service</text>
<text x="569" y="123" font-size="16">Le dessin oppose une rue</text>
<text x="569" y="145" font-size="16">sous l’eau à un camion-</text>
<text x="569" y="167" font-size="16">citerne en difficulté.</text>
</g></svg>
