<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Quelle vérité demander à une représentation ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Quelle vérité demander à une représentation ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">L’image et l’instant</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Un geste saisi en direct atteste une</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">présence.</text>
<text x="549" y="62" font-size="14" font-weight="700" fill="#203c49">Que laisse-t-il hors</text>
<text x="549" y="79" font-size="14" font-weight="700" fill="#203c49">cadre ?</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Le récit et la durée</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">Un nom entendu au début manque au</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">retour.</text>
<text x="549" y="121" font-size="14" font-weight="700" fill="#203c49">Qui mesure la</text>
<text x="549" y="138" font-size="14" font-weight="700" fill="#203c49">perte ?</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="180" font-size="15" font-weight="700" fill="#203c49">Le concept et la</text>
<text x="19" y="197" font-size="15" font-weight="700" fill="#203c49">relation</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Le conflit fait dépendre chaque volonté</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">d’une autre.</text>
<text x="549" y="180" font-size="14" font-weight="700" fill="#203c49">Que rend-on</text>
<text x="549" y="197" font-size="14" font-weight="700" fill="#203c49">intelligible ?</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
