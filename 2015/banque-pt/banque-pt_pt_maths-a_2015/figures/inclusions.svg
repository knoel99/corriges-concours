<svg xmlns="http://www.w3.org/2000/svg" width="800" height="305" viewBox="0 0 800 305" role="img"><title>Sous-espaces stables de la matrice B</title><desc>Pour trois valeurs propres distinctes, les sous-espaces stables correspondent aux huit choix possibles de droites propres.</desc><rect width="800" height="305" fill="#fbfaf5"/><text x="18" y="32" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#173e4a" text-anchor="start">Sous-espaces stables de la matrice B</text><line x1="190" x2="85" y1="250" y2="183" stroke="#9cafad" stroke-width="2" /><line x1="190" x2="190" y1="250" y2="183" stroke="#9cafad" stroke-width="2" /><line x1="190" x2="295" y1="250" y2="183" stroke="#9cafad" stroke-width="2" /><line x1="85" x2="85" y1="183" y2="104" stroke="#9cafad" stroke-width="2" /><line x1="85" x2="190" y1="183" y2="104" stroke="#9cafad" stroke-width="2" /><line x1="190" x2="85" y1="183" y2="104" stroke="#9cafad" stroke-width="2" /><line x1="190" x2="295" y1="183" y2="104" stroke="#9cafad" stroke-width="2" /><line x1="295" x2="190" y1="183" y2="104" stroke="#9cafad" stroke-width="2" /><line x1="295" x2="295" y1="183" y2="104" stroke="#9cafad" stroke-width="2" /><line x1="85" x2="190" y1="104" y2="49" stroke="#9cafad" stroke-width="2" /><line x1="190" x2="190" y1="104" y2="49" stroke="#9cafad" stroke-width="2" /><line x1="295" x2="190" y1="104" y2="49" stroke="#9cafad" stroke-width="2" /><rect x="151" y="237" width="78" height="24" rx="7" fill="#daece7"/><text x="190" y="255" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#173e4a" text-anchor="middle">0</text><rect x="46" y="170" width="78" height="24" rx="7" fill="#daece7"/><text x="85" y="188" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#173e4a" text-anchor="middle">D₀</text><rect x="151" y="170" width="78" height="24" rx="7" fill="#daece7"/><text x="190" y="188" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#173e4a" text-anchor="middle">D₁</text><rect x="256" y="170" width="78" height="24" rx="7" fill="#daece7"/><text x="295" y="188" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#173e4a" text-anchor="middle">D₂</text><rect x="46" y="91" width="78" height="24" rx="7" fill="#daece7"/><text x="85" y="109" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#173e4a" text-anchor="middle">D₀ + D₁</text><rect x="151" y="91" width="78" height="24" rx="7" fill="#daece7"/><text x="190" y="109" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#173e4a" text-anchor="middle">D₀ + D₂</text><rect x="256" y="91" width="78" height="24" rx="7" fill="#daece7"/><text x="295" y="109" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#173e4a" text-anchor="middle">D₁ + D₂</text><rect x="151" y="36" width="78" height="24" rx="7" fill="#daece7"/><text x="190" y="54" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#173e4a" text-anchor="middle">E</text><text x="395" y="99" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">D₀, D₁, D₂ sont les droites propres.</text><text x="395" y="146" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">Chaque trait ajoute une droite.</text><text x="395" y="196" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">Un plan stable contient exactement</text><text x="395" y="222" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">deux des trois droites propres.</text></svg>
