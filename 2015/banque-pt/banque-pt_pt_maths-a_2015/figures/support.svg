<svg xmlns="http://www.w3.org/2000/svg" width="800" height="305" viewBox="0 0 800 305" role="img"><title>De la loi jointe à la loi de la différence</title><desc>Le changement d’indices transforme le triangle des couples (X,Y) en un quadrant entier pour (Y,Z).</desc><rect width="800" height="305" fill="#fbfaf5"/><text x="18" y="32" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#173e4a" text-anchor="start">De la loi jointe à la loi de la différence</text><text x="39" y="65" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e4a" text-anchor="start">Indices (i,j) de (X,Y)</text><text x="442" y="65" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e4a" text-anchor="start">Indices (j,n) de (Y,Z)</text><line x1="55" x2="256" y1="238" y2="238" stroke="#45636c" stroke-width="2" /><line x1="55" x2="55" y1="238" y2="81" stroke="#45636c" stroke-width="2" /><line x1="456" x2="657" y1="238" y2="238" stroke="#45636c" stroke-width="2" /><line x1="456" x2="456" y1="238" y2="81" stroke="#45636c" stroke-width="2" /><circle cx="55" cy="238" r="4" fill="#27796f"/><circle cx="95" cy="238" r="4" fill="#27796f"/><circle cx="95" cy="206" r="4" fill="#27796f"/><circle cx="135" cy="238" r="4" fill="#27796f"/><circle cx="135" cy="206" r="4" fill="#27796f"/><circle cx="135" cy="174" r="4" fill="#27796f"/><circle cx="175" cy="238" r="4" fill="#27796f"/><circle cx="175" cy="206" r="4" fill="#27796f"/><circle cx="175" cy="174" r="4" fill="#27796f"/><circle cx="175" cy="142" r="4" fill="#27796f"/><circle cx="215" cy="238" r="4" fill="#27796f"/><circle cx="215" cy="206" r="4" fill="#27796f"/><circle cx="215" cy="174" r="4" fill="#27796f"/><circle cx="215" cy="142" r="4" fill="#27796f"/><circle cx="215" cy="110" r="4" fill="#27796f"/><circle cx="456" cy="238" r="4" fill="#27796f"/><circle cx="456" cy="206" r="4" fill="#27796f"/><circle cx="456" cy="174" r="4" fill="#27796f"/><circle cx="456" cy="142" r="4" fill="#27796f"/><circle cx="456" cy="110" r="4" fill="#27796f"/><circle cx="496" cy="238" r="4" fill="#27796f"/><circle cx="496" cy="206" r="4" fill="#27796f"/><circle cx="496" cy="174" r="4" fill="#27796f"/><circle cx="496" cy="142" r="4" fill="#27796f"/><circle cx="496" cy="110" r="4" fill="#27796f"/><circle cx="536" cy="238" r="4" fill="#27796f"/><circle cx="536" cy="206" r="4" fill="#27796f"/><circle cx="536" cy="174" r="4" fill="#27796f"/><circle cx="536" cy="142" r="4" fill="#27796f"/><circle cx="536" cy="110" r="4" fill="#27796f"/><circle cx="576" cy="238" r="4" fill="#27796f"/><circle cx="576" cy="206" r="4" fill="#27796f"/><circle cx="576" cy="174" r="4" fill="#27796f"/><circle cx="576" cy="142" r="4" fill="#27796f"/><circle cx="576" cy="110" r="4" fill="#27796f"/><circle cx="616" cy="238" r="4" fill="#27796f"/><circle cx="616" cy="206" r="4" fill="#27796f"/><circle cx="616" cy="174" r="4" fill="#27796f"/><circle cx="616" cy="142" r="4" fill="#27796f"/><circle cx="616" cy="110" r="4" fill="#27796f"/><text x="260" y="243" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="start">i</text><text x="38" y="84" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="start">j</text><text x="661" y="243" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="start">j</text><text x="439" y="84" font-family="DejaVu Sans" font-size="15" font-weight="normal" fill="#173e4a" text-anchor="start">n</text><text x="285" y="150" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#173e4a" text-anchor="start">n = i − j</text><text x="285" y="181" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">i = j + n</text><text x="34" y="284" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#173e4a" text-anchor="start">Les points représentés sont des couples possibles. Les deux supports se prolongent.</text></svg>
