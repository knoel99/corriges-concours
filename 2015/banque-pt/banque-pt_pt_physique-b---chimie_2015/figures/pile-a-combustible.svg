<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="sans-serif" font-size="15"><rect width="100%" height="100%" fill="white"/><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#b3261e"/></marker><marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1a5fb4"/></marker></defs><text x="20" y="28" text-anchor="start" fill="#222" font-size="17">Cellule de pile à combustible : polarités et sens des électrons</text><rect x="300" y="170" width="200" height="200" fill="#dbe6f4" stroke="#555"/><rect x="270" y="170" width="30" height="200" fill="#4a6fa5" stroke="#222"/><rect x="500" y="170" width="30" height="200" fill="#4a6fa5" stroke="#222"/><path d="M285,170 L285,100 L515,100 L515,170" fill="none" stroke="#222" stroke-width="1.5"/><rect x="365" y="82" width="70" height="36" rx="6" fill="#f3f3f3" stroke="#222"/><text x="400" y="105" text-anchor="middle" fill="#222" font-size="13">récepteur</text><line x1="300.0" y1="70.0" x2="345.0" y2="70.0" stroke="#b3261e" stroke-width="2" marker-end="url(#fr)"/><line x1="455.0" y1="70.0" x2="500.0" y2="70.0" stroke="#b3261e" stroke-width="2" marker-end="url(#fr)"/><text x="400" y="62" text-anchor="middle" fill="#b3261e">électrons : de l'électrode 1 vers l'électrode 2</text><line x1="500.0" y1="140.0" x2="455.0" y2="140.0" stroke="#1a5fb4" stroke-width="2" marker-end="url(#fb)"/><line x1="345.0" y1="140.0" x2="300.0" y2="140.0" stroke="#1a5fb4" stroke-width="2" marker-end="url(#fb)"/><text x="400" y="158" text-anchor="middle" fill="#1a5fb4" font-size="13">courant I</text><text x="285" y="395" text-anchor="middle" fill="#222" font-weight="bold">Électrode 1</text><text x="285" y="414" text-anchor="middle" fill="#222">anode, pôle −</text><text x="515" y="395" text-anchor="middle" fill="#222" font-weight="bold">Électrode 2</text><text x="515" y="414" text-anchor="middle" fill="#222">cathode, pôle +</text><line x1="480.0" y1="270.0" x2="330.0" y2="270.0" stroke="#2e7d32" stroke-width="2.5"/><path d="M330,270 l12,-6 v12 z" fill="#2e7d32"/><text x="400" y="258" text-anchor="middle" fill="#2e7d32">anions O²⁻</text><text x="400" y="300" text-anchor="middle" fill="#555" font-size="13">électrolyte solide</text><line x1="150.0" y1="215.0" x2="262.0" y2="215.0" stroke="#222" stroke-width="1.5" marker-end="url(#fl)"/><text x="60" y="220" text-anchor="start" fill="#222">H₂(g)</text><line x1="262.0" y1="330.0" x2="150.0" y2="330.0" stroke="#222" stroke-width="1.5" marker-end="url(#fl)"/><text x="60" y="335" text-anchor="start" fill="#222">H₂O</text><line x1="650.0" y1="215.0" x2="538.0" y2="215.0" stroke="#222" stroke-width="1.5" marker-end="url(#fl)"/><text x="660" y="220" text-anchor="start" fill="#222">O₂(g), N₂(g)</text><line x1="538.0" y1="330.0" x2="650.0" y2="330.0" stroke="#222" stroke-width="1.5" marker-end="url(#fl)"/><text x="660" y="335" text-anchor="start" fill="#222">H₂O, N₂</text><text x="20" y="445" text-anchor="start" fill="#222">Oxydation : H₂ = 2 H⁺ + 2 e⁻</text><text x="430" y="445" text-anchor="start" fill="#222">Réduction : O₂ + 4 H⁺ + 4 e⁻ = 2 H₂O</text></svg>
