<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif" font-size="15">
<rect width="700" height="400" fill="#ffffff"/>
<rect x="150" y="50" width="200" height="270" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
<rect x="350" y="50" width="200" height="270" fill="#f6e3c5" stroke="#333" stroke-width="1.5"/>
<text x="250" y="42" text-anchor="middle">matériau 1 (λ₁, e₁)</text>
<text x="450" y="42" text-anchor="middle">matériau 2 (λ₂, e₂)</text>
<line x1="60" y1="340" x2="640" y2="340" stroke="#333" stroke-width="1.5"/>
<polygon points="640,335 652,340 640,345" fill="#333"/>
<text x="660" y="345">x</text>
<text x="150" y="360" text-anchor="middle">0</text>
<text x="350" y="360" text-anchor="middle">e₁</text>
<text x="550" y="360" text-anchor="middle">e₁ + e₂</text>
<polyline points="150,90 350,125 550,290" fill="none" stroke="#c0392b" stroke-width="3"/>
<circle cx="150" cy="90" r="5" fill="#c0392b"/>
<circle cx="350" cy="125" r="5" fill="#c0392b"/>
<circle cx="550" cy="290" r="5" fill="#c0392b"/>
<line x1="100" y1="90" x2="150" y2="90" stroke="#888" stroke-dasharray="4 4"/>
<line x1="100" y1="125" x2="350" y2="125" stroke="#888" stroke-dasharray="4 4"/>
<line x1="100" y1="290" x2="550" y2="290" stroke="#888" stroke-dasharray="4 4"/>
<text x="92" y="88" text-anchor="end">T₁</text>
<text x="92" y="132" text-anchor="end">T₀</text>
<text x="92" y="295" text-anchor="end">T₂</text>
<line x1="190" y1="220" x2="310" y2="220" stroke="#1f5fa8" stroke-width="2"/>
<polygon points="310,215 322,220 310,225" fill="#1f5fa8"/>
<line x1="390" y1="85" x2="510" y2="85" stroke="#1f5fa8" stroke-width="2"/>
<polygon points="510,80 522,85 510,90" fill="#1f5fa8"/>
<text x="250" y="245" text-anchor="middle" fill="#1f5fa8">flux j</text>
<text x="450" y="110" text-anchor="middle" fill="#1f5fa8">même flux j</text>
<text x="350" y="388" text-anchor="middle" font-size="14">Cas tracé : T₁ &gt; T₂ et e₁/λ₁ ≪ e₂/λ₂, la chute de température se fait surtout dans le matériau 2</text>
</svg>
