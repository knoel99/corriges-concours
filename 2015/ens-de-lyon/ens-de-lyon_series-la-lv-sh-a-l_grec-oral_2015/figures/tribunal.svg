<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140" role="img" aria-labelledby="t"><title id="t">Trois voix dans les discours judiciaires</title><rect width="720" height="140" fill="#f2f6f5"/><g font-family="DejaVu Sans" fill="#243f47"><text x="14" y="28" font-size="19" font-weight="700">Trois voix dans les discours judiciaires</text><rect x="13" y="44" width="222" height="85" fill="white" rx="5" stroke="#577080"/><text x="124" y="67" text-anchor="middle" font-size="15" font-weight="700">Le témoin</text><text x="124" y="93" text-anchor="middle" font-size="13" font-weight="400">Les choses vues</text><text x="124" y="113" text-anchor="middle" font-size="13" font-weight="400">et les témoins nommés</text><rect x="248" y="44" width="222" height="85" fill="white" rx="5" stroke="#577080"/><text x="359" y="67" text-anchor="middle" font-size="15" font-weight="700">Le prévenu</text><text x="359" y="93" text-anchor="middle" font-size="13" font-weight="400">Une réponse soumise</text><text x="359" y="113" text-anchor="middle" font-size="13" font-weight="400">au contre-interrogatoire</text><rect x="483" y="44" width="222" height="85" fill="white" rx="5" stroke="#577080"/><text x="594" y="67" text-anchor="middle" font-size="15" font-weight="700">Les juges</text><text x="594" y="93" text-anchor="middle" font-size="13" font-weight="400">Des citoyens appelés</text><text x="594" y="113" text-anchor="middle" font-size="13" font-weight="400">à apprécier les preuves</text></g></svg>
