<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="DejaVu Sans, sans-serif"><title>La forme de la porte et la règle du tourniquet n’agissent pas de la même manière.</title><rect width="900" height="250" fill="#faf9f4"/><text x="450" y="33" text-anchor="middle" font-size="25" fill="#163945">Un même trajet, deux manières d’ordonner le passage</text><text x="230" y="73" text-anchor="middle" font-size="20" fill="#163945">Porte à poignée</text><text x="670" y="73" text-anchor="middle" font-size="20" fill="#163945">Tourniquet à validation</text><line x1="52" y1="135" x2="175" y2="135" stroke="#294c58" stroke-width="3"/><line x1="277" y1="135" x2="407" y2="135" stroke="#294c58" stroke-width="3"/><line x1="175" y1="135" x2="175" y2="93" stroke="#294c58" stroke-width="3"/><path d="M 180 95 Q 211 98 216 129" fill="none" stroke="#a34a22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="480" y1="135" x2="596" y2="135" stroke="#294c58" stroke-width="3"/><line x1="729" y1="135" x2="852" y2="135" stroke="#294c58" stroke-width="3"/><rect x="594" y="112" width="18" height="48" fill="#b7d2ce" stroke="#335563" stroke-width="2"/><rect x="709" y="112" width="18" height="48" fill="#b7d2ce" stroke="#335563" stroke-width="2"/><circle cx="655" cy="135" r="8" fill="#c4a866" stroke="#365565" stroke-width="2"/><line x1="655" y1="135" x2="697" y2="123" stroke="#294c58" stroke-width="3"/><line x1="655" y1="135" x2="624" y2="102" stroke="#294c58" stroke-width="3"/><line x1="655" y1="135" x2="644" y2="175" stroke="#294c58" stroke-width="3"/><path d="M 244 186 L 244 111 M 235 120 L 244 110 L 253 120" fill="none" stroke="#a34a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="233" y="217" text-anchor="middle" font-size="18" fill="#163945">Le battant suggère un geste.</text><text x="664" y="217" text-anchor="middle" font-size="18" fill="#163945">Le titre valide autorise un passage.</text></svg>
