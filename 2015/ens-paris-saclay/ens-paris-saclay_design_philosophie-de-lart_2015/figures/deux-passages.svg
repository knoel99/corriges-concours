<svg xmlns="http://www.w3.org/2000/svg" width="900" height="278" viewBox="0 0 900 278" role="img"><title>La forme de la porte et la règle du tourniquet n’agissent pas de la même manière.</title><rect width="900" height="278" fill="#faf9f4"/><text x="450" y="31" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="25">Deux passages vus de dessus</text><text x="228" y="70" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21">Battant marqué « pousser »</text><text x="669" y="70" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21">Tourniquet à validation</text><path d="M45 175 H155 M241 175 H406" fill="none" stroke="#294c58" stroke-width="3" /><path d="M155 175 V89" fill="none" stroke="#236277" stroke-width="5" /><path d="M155 89 A86 86 0 0 1 241 175" fill="none" stroke="#a34a22" stroke-width="2" stroke-dasharray="4 4"/><path d="M211 218 V153 M204 163 L211 152 L218 163" fill="none" stroke="#a34a22" stroke-width="4" /><path d="M480 175 H603 M731 175 H854" fill="none" stroke="#294c58" stroke-width="3" /><rect x="601" y="148" width="16" height="53" fill="#b7d2ce" stroke="#335563" stroke-width="2"/><rect x="716" y="148" width="16" height="53" fill="#b7d2ce" stroke="#335563" stroke-width="2"/><path d="M667 175 l42 -12 M667 175 l-32 -30 M667 175 l-10 42" fill="none" stroke="#294c58" stroke-width="3" /><circle cx="667" cy="175" r="7" fill="#c4a866" stroke="#365565" stroke-width="2"/><text x="227" y="255" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19">La personne pousse pour sortir.</text><text x="668" y="255" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="19">Le réseau valide le titre présenté.</text></svg>
