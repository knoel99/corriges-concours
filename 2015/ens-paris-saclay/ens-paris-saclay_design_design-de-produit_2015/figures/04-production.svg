<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Produire puis entretenir une petite série</title><desc>Deux potelets identiques recoupés à deux longueurs, des cadres remplaçables et une plaque tactile en applique.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#3b665b" text-anchor="start">LE RENDEZ-VOUS DES FEUILLES</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#3b665b" text-anchor="end">4 / 4</text>
<path d="M13 20 L407 20" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Produire puis entretenir une petite série</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Deux potelets identiques recoupés à deux longueurs, des cadres remplaçables et une plaque tactile en applique.</text>
<rect x="16" y="72" width="173" height="141" rx="0" fill="#e6dfca" stroke="none" stroke-width="0.6"/>
<rect x="67" y="131" width="7" height="70" rx="0" fill="#3b665b" stroke="#212e2c" stroke-width="0.5"/>
<rect x="53" y="90" width="36" height="23" rx="1.5" fill="#a6ad77" stroke="#212e2c" stroke-width="0.5"/>
<rect x="55.6" y="92.6" width="30.8" height="17.8" rx="1" fill="#fcf5e8" stroke="#212e2c" stroke-width="0.35"/>
<path d="M70 114 L70 130" stroke="#626767" stroke-width="0.5" fill="none" stroke-dasharray="2 1"/>
<rect x="108" y="143" width="39" height="8" rx="0" fill="#e7cca6" stroke="#212e2c" stroke-width="0.5"/>
<ellipse cx="112" cy="147" rx="1.1" ry="1.1" fill="#212e2c" stroke="none" stroke-width="0.65"/>
<ellipse cx="143" cy="147" rx="1.1" ry="1.1" fill="#212e2c" stroke="none" stroke-width="0.65"/>
<path d="M77 144 L106 146" stroke="#626767" stroke-width="0.5" fill="none" stroke-dasharray="2 1"/>
<text x="19" y="231" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Assemblage réparable</text>
<text x="210" y="77" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#3b665b" text-anchor="start">Fabriquer</text>
<text x="210" y="88.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Tubes métalliques protégés pour l’extérieur, découpe des fenêtres, ébavurage et</text>
<text x="210" y="93.2" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">assemblage de la patte qui porte le cadre.</text>
<text x="210" y="135" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#3b665b" text-anchor="start">Installer</text>
<text x="210" y="146.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Choisir l’orientation avec le jardinier. Vérifier l’état du sol et les réseaux. Le</text>
<text x="210" y="151.2" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">service du parc valide l’ancrage et la tenue mécanique.</text>
<text x="210" y="193" font-family="DejaVu Sans, sans-serif" font-size="4.65" font-weight="700" fill="#3b665b" text-anchor="start">Entretenir</text>
<text x="210" y="204.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Relever les fixations, l’état des chants et le niveau du sol. Nettoyer la plaque de</text>
<text x="210" y="209.2" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">frottage. En cas d’élagage, revalider le cadrage.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Mesurer le temps d’entretien d’une station et les arrêts spontanés avant de reproduire la série dans plusieurs parcs.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#3b665b" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
</svg>
