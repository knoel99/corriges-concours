<text x="282" y="175" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">Cadres fixes</text>
<text x="282" y="187" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Deux hauteurs et un repère tactile pérenne. Le</text>
<text x="282" y="192" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">végétal fournit lui-même chaque image. Piste</text>
<text x="282" y="197" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">retenue.</text>
<text x="16" y="231" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Essai à l’échelle 1</text>
<text x="16" y="243" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Découper deux fenêtres dans du carton, les tenir à plusieurs hauteurs et recommencer depuis un fauteuil, une poussette et en groupe. Noter le recul</text>
<text x="16" y="248" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">nécessaire et la branche effectivement cadrée.</text>
