<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Le projet retient deux niveaux d’observation et laisse un chemin de contournement libre pour les passants qui ne souhaitent pas s’arrêter.</text>
