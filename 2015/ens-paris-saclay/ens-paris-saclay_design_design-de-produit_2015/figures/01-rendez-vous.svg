<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Revenir regarder la même branche</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Au parc de quartier, un enfant, un adulte ou une personne assise peut retrouver un cadrage et suivre son évolution au fil des saisons.</text>
