<text x="17" y="216" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Un rendez-vous de quelques minutes</text>
<text x="17" y="228" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Depuis le chemin, on voit le bourgeon en mars, l’ombre en juin, le vide en hiver. Une marque</text>
<text x="17" y="233" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">tactile permet de consigner la visite sur papier.</text>
<text x="271" y="78" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Usagers et temporalités</text>
<text x="271" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Pour une traversée quotidienne, la halte doit être</text>
<text x="271" y="97.4" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">courte et accessible. Pour une promenade en groupe,</text>
<text x="271" y="102.8" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">deux personnes peuvent regarder côte à côte sans</text>
<text x="271" y="108.2" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">encombrer l’allée.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Implantation proposée près d’un arbre caduc observé depuis un sol durable et un chemin existant. La station ne touche pas l’arbre.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#3b665b" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
