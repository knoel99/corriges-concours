<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Revenir regarder la même branche</title><desc>Au parc de quartier, un enfant, un adulte ou une personne assise peut retrouver un cadrage et suivre son évolution au fil des saisons.</desc>
