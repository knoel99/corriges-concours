<text x="18" y="183" font-family="DejaVu Sans, sans-serif" font-size="4.1" font-weight="700" fill="#3b665b" text-anchor="start">4 couchettes, sas et bloc sanitaire</text>
<text x="18" y="196" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le sas reçoit bottes et vestes. Le matériel d’observation et la régie</text>
<text x="18" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">se rangent sur une seule paroi dans le séjour.</text>
<text x="201" y="73" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Montage réversible</text>
<text x="201" y="84.0" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Quatre travées préassemblées. Ossature et caissons isolés reposent sur le support</text>
<text x="201" y="88.9" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">existant. Un ingénieur vérifie stabilité au vent, fixations réutilisables et charges</text>
<text x="201" y="93.8" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">admissibles.</text>
<text x="201" y="134" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">Manifeste de matériel</text>
<text x="201" y="145.0" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">Caissons, enveloppe et occultations ; lits, linge, cuisine ; réserve d’eau potable et</text>
<text x="201" y="149.95" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">cuves de retour ; aliments et rechanges ; communication, éclairage, batteries,</text>
<text x="201" y="154.9" font-family="DejaVu Sans, sans-serif" font-size="3.45" font-weight="400" fill="#212e2c" text-anchor="start">chauffage de secours, vêtements et premiers soins.</text>
<text x="201" y="205" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">Boucler le cycle</text>
<text x="201" y="217.0" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">Photographier l’état initial. Au départ, démonter, compter les colis, fermer les</text>
<text x="201" y="221.9" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">cuves et les remporter. Comparer le site au relevé initial avec le gestionnaire.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Hypothèse de logistique : 4 personnes × 10 L/jour pour l’eau potable et la cuisine = 560 L par quinzaine. Les autres besoins et les réserves</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">sont comptés séparément.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#3b665b" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
