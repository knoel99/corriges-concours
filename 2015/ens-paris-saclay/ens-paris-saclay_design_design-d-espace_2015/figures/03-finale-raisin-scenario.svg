<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Un jour de tempête, le direct se tient dans le séjour : même durée, carnet d’observation antérieur et décision argumentée de ne pas sortir.</text>
