<text x="20" y="218" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Le camp se raconte depuis un lieu commun.</text>
<text x="20" y="230" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une caméra légère quitte le séjour avec un binôme. Le point fixe permet à un autre membre</text>
<text x="20" y="235" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">d’expliquer le relevé sans multiplier les passages.</text>
<text x="269" y="73" font-family="DejaVu Sans, sans-serif" font-size="4.4" font-weight="700" fill="#3b665b" text-anchor="start">Conducteur quotidien · 5 minutes</text>
<text x="269" y="92" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3b665b" text-anchor="start">0:00–0:40</text>
<text x="306" y="92.0" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">État du ciel, saison et point</text>
<text x="306" y="96.65" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">d’observation.</text>
<text x="269" y="121" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3b665b" text-anchor="start">0:40–2:10</text>
<text x="306" y="121.0" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">Un phénomène suivi depuis le passage</text>
<text x="306" y="125.65" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">autorisé.</text>
<text x="269" y="150" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3b665b" text-anchor="start">2:10–3:35</text>
<text x="306" y="150.0" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">Un scientifique explique la méthode et une</text>
<text x="306" y="154.65" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">incertitude.</text>
<text x="269" y="179" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3b665b" text-anchor="start">3:35–4:35</text>
<text x="306" y="179.0" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">Un geste de vie collective, une ressource</text>
<text x="306" y="183.65" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">comptée.</text>
<text x="269" y="208" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="700" fill="#3b665b" text-anchor="start">4:35–5:00</text>
<text x="306" y="208.0" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">Question laissée ouverte pour le</text>
<text x="306" y="212.65" font-family="DejaVu Sans, sans-serif" font-size="3.2" font-weight="400" fill="#212e2c" text-anchor="start">lendemain.</text>
