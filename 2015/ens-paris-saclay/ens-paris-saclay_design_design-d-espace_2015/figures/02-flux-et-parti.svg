<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">L’accès lourd repose sur la logistique autorisée de la mission. Les secteurs fragiles restent en dehors de l’installation et de la prise de</text>
