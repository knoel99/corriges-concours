<text x="280" y="188.8" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="400" fill="#212e2c" text-anchor="start">et des cabines de repos occultables limitent la</text>
<text x="280" y="193.6" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="400" fill="#212e2c" text-anchor="start">surface et adaptent le quotidien aux saisons.</text>
<text x="15" y="241" font-family="DejaVu Sans, sans-serif" font-size="4.5" font-weight="700" fill="#3b665b" text-anchor="start">Stocker, mesurer, remporter</text>
<text x="15" y="251" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">Entrée : eau, nourriture, consommables, énergie. Sortie : eaux usées, déchets, pièces remplacées, images et relevés. Les documents suivent</text>
<text x="15" y="256" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#212e2c" text-anchor="start">chaque transfert.</text>
