<ellipse cx="107" cy="135" rx="9" ry="4" fill="#a8987c" stroke="#626767" stroke-width="0.3"/>
<text x="17" y="210" font-family="DejaVu Sans, sans-serif" font-size="4.2" font-weight="700" fill="#3b665b" text-anchor="start">Surtsey · schéma non géoréférencé</text>
<text x="17" y="222" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le rivage évolue. La carte sert à discuter érosion, secteurs d’observation et</text>
<text x="17" y="227" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">distances. La position exacte du camp dépend du site autorisé et des données</text>
<text x="17" y="232" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">récentes.</text>
<text x="211" y="76" font-family="DejaVu Sans, sans-serif" font-size="4.9" font-weight="700" fill="#3b665b" text-anchor="start">Le principe d’implantation</text>
<text x="211" y="89.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Réutiliser une emprise scientifique déjà aménagée, si le gestionnaire le permet.</text>
<text x="211" y="94.25" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Suivre les itinéraires autorisés. Le public regarde depuis le continent.</text>
<text x="211" y="147" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Deux pistes écartées</text>
<text x="211" y="159.0" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Le camp disséminé multiplie les passages. L’observatoire flottant supprime le camp</text>
<text x="211" y="164.25" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">terrestre mais reste mal adapté aux tempêtes et aux débarquements quotidiens.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Le sujet donne les vues de Surtsey et les contrastes saisonniers de lumière. L’île réelle est une réserve à accès étroitement contrôlé.</text>
<text x="407" y="292" font-family="DejaVu Sans, sans-serif" font-size="2.7" font-weight="400" fill="#3b665b" text-anchor="end">Proposition pédagogique · GPT-6.2 Astra Ultra · vitesse non renseignée</text>
