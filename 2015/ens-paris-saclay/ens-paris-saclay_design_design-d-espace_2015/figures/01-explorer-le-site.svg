<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Observer sans agrandir la trace</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Recherches A3 · récit scientifique A. Le téléspectateur suit les conditions d’une mesure quotidienne et les limites du campement.</text>
<polygon points="23,158 35,138 46,124 41,110 62,90 83,81 104,84 121,101 143,108 157,131 153,159 139,176 104,188 69,188 45,173" fill="#b1aca0" stroke="#212e2c" stroke-width="0.55" stroke-linejoin="round"/>
