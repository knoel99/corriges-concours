<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Observer sans agrandir la trace</title><desc>Recherches A3 · récit scientifique A. Le téléspectateur suit les conditions d’une mesure quotidienne et les limites du campement.</desc>
