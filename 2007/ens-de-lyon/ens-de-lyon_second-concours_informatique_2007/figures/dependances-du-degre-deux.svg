<svg xmlns="http://www.w3.org/2000/svg" width="640" height="169" viewBox="0 0 640 169"><title>Chaque liaison descend du producteur vers le consommateur. Les deux branches indépendantes convergent dans p02.</title><path d="M146 24 L146 82" stroke="#41667b" stroke-width="2.4"/><path d="M480 24 L480 82" stroke="#41667b" stroke-width="2.4"/><path d="M146 82 L320 143" stroke="#41667b" stroke-width="2.4"/><path d="M480 82 L320 143" stroke="#41667b" stroke-width="2.4"/><rect x="58.5" y="8" width="175" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="146" y="30" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">x2 = x · x</text><rect x="385" y="8" width="190" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="480" y="30" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">a1x = a1 · x</text><rect x="38.5" y="66" width="215" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="146" y="88" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">a2x2 = a2 · x2</text><rect x="371" y="66" width="218" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="480" y="88" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">p01 = a0 + a1x</text><rect x="197" y="127" width="246" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="320" y="149" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">p02 = p01 + a2x2</text></svg>
