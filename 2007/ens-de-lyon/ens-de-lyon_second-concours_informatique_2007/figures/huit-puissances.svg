<svg xmlns="http://www.w3.org/2000/svg" width="640" height="192" viewBox="0 0 640 192"><title>Du haut vers le bas, chaque ligne multiplie des puissances déjà disponibles. Deux opérandes identiques sont indiqués par un carré dans le libellé.</title><path d="M308 18 L310 65" stroke="#41667b" stroke-width="2.4"/><path d="M308 18 L212 117" stroke="#41667b" stroke-width="2.4"/><path d="M310 65 L212 117" stroke="#41667b" stroke-width="2.4"/><path d="M310 65 L437 117" stroke="#41667b" stroke-width="2.4"/><path d="M310 65 L91 167" stroke="#41667b" stroke-width="2.4"/><path d="M212 117 L91 167" stroke="#41667b" stroke-width="2.4"/><path d="M212 117 L246 167" stroke="#41667b" stroke-width="2.4"/><path d="M212 117 L404 167" stroke="#41667b" stroke-width="2.4"/><path d="M437 117 L404 167" stroke="#41667b" stroke-width="2.4"/><path d="M437 117 L560 167" stroke="#41667b" stroke-width="2.4"/><rect x="276" y="2" width="64" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="308" y="24" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">x</text><rect x="249" y="49" width="122" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="310" y="71" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">x² = x · x</text><rect x="139.5" y="101" width="145" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="212" y="123" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">x³ = x · x²</text><rect x="360" y="101" width="154" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="437" y="123" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">x⁴ = (x²)²</text><rect x="17" y="151" width="148" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="91" y="173" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">x⁵ = x² · x³</text><rect x="178.5" y="151" width="135" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="246" y="173" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">x⁶ = (x³)²</text><rect x="329.5" y="151" width="149" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="404" y="173" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">x⁷ = x³ · x⁴</text><rect x="492.5" y="151" width="135" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="560" y="173" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">x⁸ = (x⁴)²</text></svg>
