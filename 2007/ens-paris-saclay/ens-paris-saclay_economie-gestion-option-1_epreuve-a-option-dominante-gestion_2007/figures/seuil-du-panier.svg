<svg xmlns="http://www.w3.org/2000/svg" width="830" height="239" viewBox="0 0 830 239" role="img" aria-labelledby="t d"><title id="t">Comptabilité, coûts de revient et commande supplémentaire</title><desc id="d">Pour conserver le mix des ventes, un panier comprend un A et deux B. La marge de 18 € par panier finance les charges fixes.</desc><rect width="830" height="239" fill="white"/><g fill="#234451" font-family="sans-serif"><rect x="10" y="11" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="47" font-weight="bold" font-size="18">Ventes </text><text x="196" y="35" font-size="18" font-weight="bold">1 A à 15 € et 2 B à 7 €</text><text x="196" y="59" font-size="16">29 € de chiffre d’affaires par panier</text><rect x="10" y="86" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="122" font-weight="bold" font-size="18">Coûts variables</text><text x="196" y="110" font-size="18" font-weight="bold">1 A à 5 € et 2 B à 3 €</text><text x="196" y="134" font-size="16">11 € de coût variable par panier</text><rect x="10" y="161" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="197" font-weight="bold" font-size="18">Seuil </text><text x="196" y="185" font-size="18" font-weight="bold">200 000 € ÷ 18 € de marge par panier</text><text x="196" y="209" font-size="16">11 112 paniers entiers couvrent les charges fixes</text></g></svg>
