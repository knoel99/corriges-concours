<svg xmlns="http://www.w3.org/2000/svg" width="670" height="224" viewBox="0 0 670 224" role="img" aria-labelledby="t d"><title id="t">Arbre des restes sur quatre points</title><desc id="d">Le polynôme 1 plus X carré se réduit à 1 plus X pour les points zéro et un, et à 2 plus 5X pour deux et trois. Les quatre valeurs sont 1, 2, 5 et 3 modulo sept.</desc><rect width="670" height="224" fill="white"/><g stroke="#387182" stroke-width="2" fill="none"><path d="M335 43L180 85M335 43L495 85M180 114L85 155M180 114L250 155M495 114L425 155M495 114L590 155"/></g><g fill="#153f4f" font-family="sans-serif" text-anchor="middle"><text x="335" y="36" font-size="23">1 + X²</text><text x="180" y="105" font-size="20">1 + X</text><text x="495" y="105" font-size="20">2 + 5X</text><g font-size="22"><text x="85" y="177">1</text><text x="250" y="177">2</text><text x="425" y="177">5</text><text x="590" y="177">3</text></g><g font-size="16" fill="#36525c"><text x="85" y="204">α = 0</text><text x="250" y="204">α = 1</text><text x="425" y="204">α = 2</text><text x="590" y="204">α = 3</text></g></g></svg>
