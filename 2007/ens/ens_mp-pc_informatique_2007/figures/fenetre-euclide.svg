<svg xmlns="http://www.w3.org/2000/svg" width="640" height="80" viewBox="0 0 640 80"><title>La bande des rapports perdants est comprise entre les deux seuils du nombre d’or. Les extrémités irrationnelles ne sont jamais atteintes.</title><path d="M100 40 L320 40" stroke="#41667b" stroke-width="2.4"/><path d="M320 40 L540 40" stroke="#41667b" stroke-width="2.4"/><rect x="27.5" y="24" width="145" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="100" y="46" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">r &lt; 1/φ</text><rect x="235" y="24" width="170" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="320" y="46" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">1/φ &lt; r &lt; φ</text><rect x="467.5" y="24" width="145" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="540" y="46" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">r &gt; φ</text></svg>
