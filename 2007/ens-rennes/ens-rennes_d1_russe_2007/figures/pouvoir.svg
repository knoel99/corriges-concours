<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Les trois questions du portrait politique</title>
<desc id="description">Comment arrive-t-on au pouvoir ? Héritage, manœuvres ou autres voies. L’accès au pouvoir ne garantit aucune aptitude à gouverner. Comment Staline le conserve-t-il ? Il est présenté comme un intrigant habile. Reconnaître une aptitude ne règle pas la question morale. Que reste-t-il du projet ? L’URSS a disparu et l’auteur évoque ses débris. La dernière question déplace l’analyse vers le bilan.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Les trois questions du portrait politique</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Réponse de l’auteur</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Distinction</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Comment arrive-t-on</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">au pouvoir ?</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Héritage, manœuvres ou</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">autres voies.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’accès au pouvoir ne</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">garantit aucune aptitude à</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">gouverner.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Comment Staline le</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">conserve-t-il ?</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Il est présenté comme un</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">intrigant habile.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Reconnaître une aptitude ne</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">règle pas la question</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">morale.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Que reste-t-il du</text>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">projet ?</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">L’URSS a disparu et</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">l’auteur évoque ses</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">débris.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">La dernière question</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">déplace l’analyse vers le</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">bilan.</text>
</g>
</svg>
