<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 351" width="990" height="351" role="img" aria-labelledby="title desc">
<title id="title">Deux entrées dans le droit commercial</title><desc id="desc">La qualification d’un acte et celle de son auteur commandent des conséquences différentes.</desc>
<rect width="990" height="351" rx="12" fill="#f5f7f9"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172f41">
<text x="25" y="40" font-size="26" font-weight="bold">Deux entrées dans le droit commercial</text>
<text x="25" y="83" font-size="19" font-weight="bold" fill="#365c66">Situation</text>
<text x="332" y="83" font-size="19" font-weight="bold" fill="#365c66">Question juridique</text>
<text x="665" y="83" font-size="19" font-weight="bold" fill="#365c66">Résultat</text>
<rect x="14" y="99" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="138" font-size="18">Vente de son propre vélo</text>
<text x="332" y="125" font-size="18">Y a-t-il achat préalable</text>
<text x="332" y="149" font-size="18">en vue de revendre ?</text>
<text x="665" y="125" font-size="18">La revente occasionnelle</text>
<text x="665" y="149" font-size="18">du particulier reste civile.</text>
<path d="M 299 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="174" width="962" height="64" rx="8" fill="#edf2e6"/>
<text x="25" y="213" font-size="18">Lots achetés pour revendre</text>
<text x="332" y="200" font-size="18">Quelle était l’intention</text>
<text x="332" y="224" font-size="18">lors de l’acquisition ?</text>
<text x="665" y="200" font-size="18">L’achat en vue de revendre</text>
<text x="665" y="224" font-size="18">est un acte de commerce.</text>
<path d="M 299 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="249" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="288" font-size="18">Négoce pour son compte</text>
<text x="332" y="275" font-size="18">En fait-il sa profession</text>
<text x="332" y="299" font-size="18">habituelle ?</text>
<text x="665" y="275" font-size="18">L’exploitant indépendant</text>
<text x="665" y="299" font-size="18">est commerçant.</text>
<path d="M 299 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
</g>
</svg>
