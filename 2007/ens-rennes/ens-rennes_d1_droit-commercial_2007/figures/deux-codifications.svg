<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 351" width="990" height="351" role="img" aria-labelledby="title desc">
<title id="title">Ce que change la place d’une règle</title><desc id="desc">La recodification rassemble des règles dont les innovations matérielles sont souvent antérieures.</desc>
<rect width="990" height="351" rx="12" fill="#f5f7f9"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172f41">
<text x="25" y="40" font-size="26" font-weight="bold">Ce que change la place d’une règle</text>
<text x="25" y="83" font-size="19" font-weight="bold" fill="#365c66">Objet</text>
<text x="332" y="83" font-size="19" font-weight="bold" fill="#365c66">Réforme de fond</text>
<text x="665" y="83" font-size="19" font-weight="bold" fill="#365c66">Point de lecture en 2007</text>
<rect x="14" y="99" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="138" font-size="18">Sociétés commerciales</text>
<text x="332" y="138" font-size="18">Législation de 1966</text>
<text x="665" y="138" font-size="18">Livre II du Code</text>
<path d="M 299 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="174" width="962" height="64" rx="8" fill="#edf2e6"/>
<text x="25" y="213" font-size="18">Concurrence et prix</text>
<text x="332" y="213" font-size="18">Ordonnance de 1986</text>
<text x="665" y="213" font-size="18">Livre IV du Code</text>
<path d="M 299 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="249" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="288" font-size="18">Entreprises en difficulté</text>
<text x="332" y="288" font-size="18">Sauvegarde créée en 2005</text>
<text x="665" y="275" font-size="18">Livre VI du Code enrichi</text>
<text x="665" y="299" font-size="18">après la recodification</text>
<path d="M 299 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
</g>
</svg>
