<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Les effets possibles d’une libéralisation</title>
<desc id="description">Concurrence des hypermarchés Des stations moins rentables risquent de fermer. Arbitrage entre prix et proximité. Produits plus variés Les recettes de la boutique peuvent compléter celles du carburant. Possibilité d’une baisse du prix du plein. Horaires assouplis Le service pourrait s’étendre à la nuit. Commodité accrue, opposition possible des autres commerçants.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Les effets possibles d’une libéralisation</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Mesure</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Mécanisme</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Enjeu pour le client</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Concurrence des</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">hypermarchés</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Des stations moins</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">rentables risquent de</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">fermer.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Arbitrage entre prix et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">proximité.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Produits plus variés</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Les recettes de la</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">boutique peuvent compléter</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">celles du carburant.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Possibilité d’une baisse du</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">prix du plein.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Horaires assouplis</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Le service pourrait</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">s’étendre à la nuit.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Commodité accrue,</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">opposition possible des</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">autres commerçants.</text>
</g>
</svg>
