<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="titre description">
<title id="titre">Deux projets et deux ordres de grandeur</title>
<desc id="description">Royaume-Uni Amicus et le syndicat des transports. Fusion négociée, environ deux millions de membres si elle aboutit. International IG Metall, Amicus et deux syndicats américains. Accord de coopération, environ 6,3 millions de travailleurs concernés en cas de réussite. Objection Salariés de sites situés dans différents pays. Les règles protectrices et les priorités locales divergent.</desc>
<rect width="720" height="385" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux projets et deux ordres de grandeur</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Niveau</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Partenaires</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">État du projet</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Royaume-Uni</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Amicus et le syndicat des</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">transports.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Fusion négociée, environ</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">deux millions de membres si</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">elle aboutit.</text>
<rect x="10" y="181" width="700" height="105" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">International</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">IG Metall, Amicus et deux</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">syndicats américains.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Accord de coopération,</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">environ 6,3 millions de</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">travailleurs concernés en</text>
<text x="473" y="272" font-size="15" font-weight="400" fill="#162d3b">cas de réussite.</text>
<rect x="10" y="292" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">Objection</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">Salariés de sites situés</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">dans différents pays.</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">Les règles protectrices et</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">les priorités locales</text>
<text x="473" y="361" font-size="15" font-weight="400" fill="#162d3b">divergent.</text>
</g>
</svg>
