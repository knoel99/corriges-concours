<svg xmlns="http://www.w3.org/2000/svg" width="870" height="412" viewBox="0 0 870 412" role="img"><title>Quatre règles générales, quatre titres de compétence</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Quatre règles générales, quatre titres de compétence</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Objet de la règle</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Autorité à rechercher</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Limite déterminante</text><rect x="12" y="84" width="842" height="67" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Exécution d’une</text><text x="23" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">loi</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Premier ministre en</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">principe</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Dispositions de la loi et mesures</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">nécessaires à son application</text><rect x="12" y="151" width="842" height="91" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Décret délibéré en</text><text x="23" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Conseil des</text><text x="23" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">ministres</text><text x="225" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Président de la</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">République</text><text x="505" y="177" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Délibération effective et</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">contreseings requis</text><rect x="12" y="242" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Organisation</text><text x="23" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">interne d’un</text><text x="23" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">service</text><text x="225" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Chef de service</text><text x="505" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Nécessités du fonctionnement du</text><text x="505" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">service</text><rect x="12" y="333" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="359" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Circulation sur</text><text x="23" y="383" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">une voie communale</text><text x="225" y="359" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Maire, dans le champ de</text><text x="225" y="383" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">ses pouvoirs de police</text><text x="505" y="359" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Risque local, nécessité et</text><text x="505" y="383" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">proportion de la mesure</text></svg>
