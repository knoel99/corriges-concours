<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">De la scène de Nairobi à l’argument final</title>
<desc id="description">Porto Alegre puis Nairobi Le relais change de continent. Des acteurs africains peuvent prendre la parole. Information internationale La catastrophe attire l’attention. L’auteur interroge la représentation de l’Afrique. Frontières Les barrières ne peuvent contenir toute fuite. L’inégalité persistante engage les autres pays.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De la scène de Nairobi à l’argument final</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Passage</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Image ou constat</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Fonction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Porto Alegre puis</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">Nairobi</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le relais change de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">continent.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Des acteurs africains</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">peuvent prendre la parole.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Information</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">internationale</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La catastrophe attire</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">l’attention.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">L’auteur interroge la</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">représentation de</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">l’Afrique.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Frontières</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Les barrières ne peuvent</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">contenir toute fuite.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">L’inégalité persistante</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">engage les autres pays.</text>
</g>
</svg>
