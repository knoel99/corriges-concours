<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Qui propose quel remède ?</title>
<desc id="description">Caroline Lucas Elle demande la démission de Pearson. Responsabilité du gouvernement. Ben Duncan Il veut rendre l’avion moins avantageux. Fiscalité des compagnies aériennes. Richard Dyer Il veut limiter l’expansion des aéroports et les allègements fiscaux. Infrastructures et fiscalité.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui propose quel remède ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Interlocuteur</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Diagnostic ou demande</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Levier</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Caroline Lucas</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Elle demande la démission</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">de Pearson.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Responsabilité du</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">gouvernement.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Ben Duncan</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Il veut rendre l’avion</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">moins avantageux.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Fiscalité des compagnies</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">aériennes.</text>
<rect x="10" y="226" width="700" height="105" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Richard Dyer</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Il veut limiter</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">l’expansion des aéroports</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">et les allègements</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">fiscaux.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Infrastructures et</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">fiscalité.</text>
</g>
</svg>
