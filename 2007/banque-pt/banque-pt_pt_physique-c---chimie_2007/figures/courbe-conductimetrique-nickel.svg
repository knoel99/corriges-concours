<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="sans-serif" font-size="15"><rect width="100%" height="100%" fill="white"/>
<text x="20" y="26" text-anchor="start" fill="#222" font-size="16">Allure de la conductance G du mélange M en fonction du volume V</text>
<text x="20" y="46" text-anchor="start" fill="#222" font-size="16">d'acide éthanoïque versé, et interprétation des trois domaines</text>
<line x1="90" y1="400" x2="729.0" y2="400" stroke="#222" stroke-width="1.5"/>
<line x1="90" y1="400" x2="90" y2="80" stroke="#222" stroke-width="1.5"/>
<path d="M729.0 400 l-9 -5 v10 Z" fill="#222"/><path d="M90 80 l-5 9 h10 Z" fill="#222"/>
<text x="78" y="92" text-anchor="end" fill="#222" font-size="15">G</text>
<text x="733.0" y="388" text-anchor="end" fill="#222" font-size="15">V (mL)</text>
<polyline fill="none" stroke="#1f6fb2" stroke-width="2.6" points="90,170 270,310 510,211 690,211"/>
<line x1="270" y1="310" x2="270" y2="400" stroke="#555" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="270" y="420" text-anchor="middle" fill="#222" font-size="15">Ve1 = 6,0</text>
<line x1="510" y1="211" x2="510" y2="400" stroke="#555" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="510" y="420" text-anchor="middle" fill="#222" font-size="15">Ve2 = 14,0</text>
<line x1="690" y1="211" x2="690" y2="400" stroke="#555" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="690" y="420" text-anchor="middle" fill="#222" font-size="15">20,0</text>
<text x="90" y="420" text-anchor="middle" fill="#222" font-size="15">0</text>
<text x="180" y="112" text-anchor="middle" fill="#c64600" font-size="15">HO⁻ remplacé</text>
<text x="180" y="132" text-anchor="middle" fill="#c64600" font-size="15">par AcO⁻</text>
<text x="180" y="152" text-anchor="middle" fill="#c64600" font-size="15">pente &lt; 0</text>
<text x="390" y="112" text-anchor="middle" fill="#c64600" font-size="15">Ni(OH)₂ dissous :</text>
<text x="390" y="132" text-anchor="middle" fill="#c64600" font-size="15">Ni²⁺ et AcO⁻ apparaissent</text>
<text x="390" y="152" text-anchor="middle" fill="#c64600" font-size="15">pente &gt; 0</text>
<text x="606.0" y="112" text-anchor="middle" fill="#c64600" font-size="15">AcOH en excès,</text>
<text x="606.0" y="132" text-anchor="middle" fill="#c64600" font-size="15">très peu dissocié</text>
<text x="606.0" y="152" text-anchor="middle" fill="#c64600" font-size="15">pente ≈ 0</text>
<line x1="270" y1="70" x2="270" y2="160" stroke="#bbb" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="510" y1="70" x2="510" y2="160" stroke="#bbb" stroke-width="1" stroke-dasharray="2 4"/>
<text x="180" y="370" text-anchor="middle" fill="#222" font-size="14">n(HO⁻ libre) = c·Ve1</text>
<text x="390" y="370" text-anchor="middle" fill="#222" font-size="14">2 n(Ni(OH)₂) = c·(Ve2 − Ve1)</text>
<text x="20" y="455" text-anchor="start" fill="#555" font-size="13">Abscisses à l'échelle ; ordonnées arbitraires, pentes dans le rapport −158 / +84 des conductivités.</text>
</svg>
