name: Vérification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  forme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Python système du runner, aucune dépendance : forme des corrigés et
      # absence de fichiers revue*, rapport* ou sujet*.
      - run: python3 scripts/verifier.py
