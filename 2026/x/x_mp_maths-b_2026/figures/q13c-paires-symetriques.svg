<svg xmlns="http://www.w3.org/2000/svg" width="635" height="212" viewBox="0 0 635 212" role="img" aria-labelledby="titre description">
<title id="titre">Les coefficients indépendants dans une matrice symétrique</title>
<desc id="description">Chaque variable hors diagonale occupe deux cases. Dans la somme des carrés des neuf entrées, son carré apparaît deux fois.</desc>
<rect width="635" height="212" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="139" y="25" text-anchor="middle" font-size="16" fill="#172432" font-weight="bold">X₃ multipliée par √3</text>
<rect x="64" y="46" width="50" height="35" fill="#eceff0"/>
<text x="89" y="68.5" text-anchor="middle" font-size="17" fill="#172432">W₁₁</text>
<rect x="116" y="46" width="50" height="35" fill="#dfedf5"/>
<text x="141" y="68.5" text-anchor="middle" font-size="17" fill="#172432">W₁₂</text>
<rect x="168" y="46" width="50" height="35" fill="#f7e4d9"/>
<text x="193" y="68.5" text-anchor="middle" font-size="17" fill="#172432">W₁₃</text>
<rect x="64" y="83" width="50" height="35" fill="#dfedf5"/>
<text x="89" y="105.5" text-anchor="middle" font-size="17" fill="#172432">W₁₂</text>
<rect x="116" y="83" width="50" height="35" fill="#eceff0"/>
<text x="141" y="105.5" text-anchor="middle" font-size="17" fill="#172432">W₂₂</text>
<rect x="168" y="83" width="50" height="35" fill="#dcece4"/>
<text x="193" y="105.5" text-anchor="middle" font-size="17" fill="#172432">W₂₃</text>
<rect x="64" y="120" width="50" height="35" fill="#f7e4d9"/>
<text x="89" y="142.5" text-anchor="middle" font-size="17" fill="#172432">W₁₃</text>
<rect x="116" y="120" width="50" height="35" fill="#dcece4"/>
<text x="141" y="142.5" text-anchor="middle" font-size="17" fill="#172432">W₂₃</text>
<rect x="168" y="120" width="50" height="35" fill="#eceff0"/>
<text x="193" y="142.5" text-anchor="middle" font-size="17" fill="#172432">W₃₃</text>
<path d="M 64 45 h -7 v 111 h 7" stroke="#172432" stroke-width="1.6" fill="none"/>
<path d="M 218 45 h 7 v 111 h -7" stroke="#172432" stroke-width="1.6" fill="none"/>
<text x="255" y="64" text-anchor="start" font-size="16" fill="#172432" font-weight="bold">Sur la diagonale</text>
<text x="255" y="89" text-anchor="start" font-size="15" fill="#172432">3 variables, chacune comptée une fois.</text>
<text x="255" y="121" text-anchor="start" font-size="16" fill="#172432" font-weight="bold">De part et d’autre de la diagonale</text>
<text x="255" y="146" text-anchor="start" font-size="15" fill="#172432">3 paires, une même variable par paire.</text>
<text x="318" y="191" text-anchor="middle" font-size="17" fill="#172432">3 Tr(X₃²) = W₁₁² + W₂₂² + W₃₃² + 2(W₁₂² + W₁₃² + W₂₃²)</text></g>
</svg>
