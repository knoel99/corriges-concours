<svg xmlns="http://www.w3.org/2000/svg" width="650" height="202" viewBox="0 0 650 202" role="img" aria-labelledby="titre description">
<title id="titre">Encadrer une indicatrice par deux fonctions continues</title>
<desc id="description">La minorante descend de 1 à 0 sur [y−η,y]. La majorante descend de 1 à 0 sur [y,y+η].</desc>
<rect width="650" height="202" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="164" y="28" text-anchor="middle" font-size="16" fill="#172432" font-weight="bold">Minorante continue φ⁻</text>
<line x1="35" y1="126" x2="301" y2="126" stroke="#62717b" stroke-width="1.6"/>
<line x1="40" y1="132" x2="40" y2="47" stroke="#62717b" stroke-width="1.6"/>
<line x1="36" y1="63" x2="302" y2="63" stroke="#d4dbdf" stroke-width="1" stroke-dasharray="3 4"/>
<text x="30" y="69" text-anchor="end" font-size="12" fill="#172432">1</text>
<text x="30" y="131" text-anchor="end" font-size="12" fill="#172432">0</text>
<path d="M 122 63 H 176 V 126 Z" stroke="none" stroke-width="0" fill="#cde8e6"/>
<path d="M 41 63 H 122 L 176 126 H 296" stroke="#12695f" stroke-width="3" fill="none"/>
<line x1="176" y1="55" x2="176" y2="131" stroke="#62717b" stroke-width="1" stroke-dasharray="2 3"/>
<path d="M 41 63 H 176 M 176 126 H 296" stroke="#172432" stroke-width="1.6" fill="7 5"/>
<circle cx="176" cy="63" r="3.4" fill="white" stroke="#172432" stroke-width="1.4"/>
<circle cx="176" cy="126" r="3.4" fill="#172432"/>
<line x1="122" y1="127" x2="122" y2="131" stroke="#62717b" stroke-width="1"/>
<text x="122" y="151" text-anchor="middle" font-size="13" fill="#172432">y − η</text>
<line x1="176" y1="127" x2="176" y2="131" stroke="#62717b" stroke-width="1"/>
<text x="176" y="151" text-anchor="middle" font-size="13" fill="#172432">y</text>
<line x1="230" y1="127" x2="230" y2="131" stroke="#62717b" stroke-width="1"/>
<text x="230" y="151" text-anchor="middle" font-size="13" fill="#172432">y + η</text>
<text x="484" y="28" text-anchor="middle" font-size="16" fill="#172432" font-weight="bold">Majorante continue φ⁺</text>
<line x1="355" y1="126" x2="621" y2="126" stroke="#62717b" stroke-width="1.6"/>
<line x1="360" y1="132" x2="360" y2="47" stroke="#62717b" stroke-width="1.6"/>
<line x1="356" y1="63" x2="622" y2="63" stroke="#d4dbdf" stroke-width="1" stroke-dasharray="3 4"/>
<text x="350" y="69" text-anchor="end" font-size="12" fill="#172432">1</text>
<text x="350" y="131" text-anchor="end" font-size="12" fill="#172432">0</text>
<path d="M 496 63 L 550 126 H 496 Z" stroke="none" stroke-width="0" fill="#f8e2d1"/>
<path d="M 361 63 H 496 L 550 126 H 616" stroke="#974114" stroke-width="3" fill="none"/>
<line x1="496" y1="55" x2="496" y2="131" stroke="#62717b" stroke-width="1" stroke-dasharray="2 3"/>
<path d="M 361 63 H 496 M 496 126 H 616" stroke="#172432" stroke-width="1.6" fill="7 5"/>
<circle cx="496" cy="63" r="3.4" fill="white" stroke="#172432" stroke-width="1.4"/>
<circle cx="496" cy="126" r="3.4" fill="#172432"/>
<line x1="442" y1="127" x2="442" y2="131" stroke="#62717b" stroke-width="1"/>
<text x="442" y="151" text-anchor="middle" font-size="13" fill="#172432">y − η</text>
<line x1="496" y1="127" x2="496" y2="131" stroke="#62717b" stroke-width="1"/>
<text x="496" y="151" text-anchor="middle" font-size="13" fill="#172432">y</text>
<line x1="550" y1="127" x2="550" y2="131" stroke="#62717b" stroke-width="1"/>
<text x="550" y="151" text-anchor="middle" font-size="13" fill="#172432">y + η</text>
<line x1="93" y1="179" x2="132" y2="179" stroke="#172432" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="142" y="184" text-anchor="start" font-size="14" fill="#172432">indicatrice de x &lt; y</text>
<rect x="356" y="172" width="20" height="12" fill="#dbe4e1"/>
<text x="385" y="184" text-anchor="start" font-size="14" fill="#172432">zone où les valeurs diffèrent</text></g>
</svg>
