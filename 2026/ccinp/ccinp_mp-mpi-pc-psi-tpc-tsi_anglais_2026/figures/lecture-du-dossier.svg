<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Dette et valeur du diplôme britannique</title>
<desc id="description">Article de 2023 52 % de remboursements intégraux attendus après réforme. Prévision rapportée dans cet article. Témoignage de 2025 65 % annoncés sous le régime réformé. Une seconde estimation, avec son propre contexte. Enquête de 2024 81 % jugent le diplôme utile dans son ensemble. Opinion des diplômés interrogés sur leur expérience.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Dette et valeur du diplôme britannique</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Document</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Mesure rapportée</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Portée</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Article de 2023</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">52 % de remboursements</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">intégraux attendus après</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">réforme.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Prévision rapportée dans</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">cet article.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Témoignage de 2025</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">65 % annoncés sous le</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">régime réformé.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Une seconde estimation,</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">avec son propre contexte.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Enquête de 2024</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">81 % jugent le diplôme</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">utile dans son ensemble.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Opinion des diplômés</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">interrogés sur leur</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">expérience.</text>
</g>
</svg>
