<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">La lecture selon la question posée</title>
<desc id="description">Pratique L’enquête isole les lectures de loisir. Un livre dans l’année suffit à classer un lecteur. Expression Messages fréquents et essai argumenté. Taper souvent ne garantit pas la maîtrise du raisonnement. Destinataire Les lecteurs d’un article ou d’une fanfiction. Publier oblige à réfléchir à la réception du texte.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">La lecture selon la question posée</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Élément observé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Lecture</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Pratique</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">L’enquête isole les</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">lectures de loisir.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Un livre dans l’année</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">suffit à classer un</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">lecteur.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Expression</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Messages fréquents et</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">essai argumenté.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Taper souvent ne garantit</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">pas la maîtrise du</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">raisonnement.</text>
<rect x="10" y="270" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Destinataire</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Les lecteurs d’un article</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">ou d’une fanfiction.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Publier oblige à réfléchir</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">à la réception du texte.</text>
</g>
</svg>
