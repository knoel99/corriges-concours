<title id="titre">Trois schémas de Lewis</title><desc id="desc">Le CO₂ comporte deux doubles liaisons et deux doublets libres sur chaque oxygène. Le méthane comporte quatre liaisons simples. Dans N₂O, l’azote terminal porte un doublet libre et l’oxygène trois.</desc>
