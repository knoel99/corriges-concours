<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">À quelles conditions la vente en ligne tient-elle ses promesses ?</title>
<desc id="description">Entrer dans le métier Licences et petits projets à Oman. Les femmes peuvent créer leur entreprise. Évoluer Le panneau de la caricature et le marchand endormi. Adapter son offre demande du travail. Pouvoir faire confiance Retours, sécurité, biens proposés au Maroc. La règle doit être connue et appliquée.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">À quelles conditions la vente en ligne tient-elle ses promesses ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Élément observé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Lecture</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Entrer dans le métier</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Licences et petits projets</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">à Oman.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les femmes peuvent créer</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">leur entreprise.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Évoluer</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le panneau de la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">caricature et le marchand</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">endormi.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Adapter son offre demande</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">du travail.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Pouvoir faire</text>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">confiance</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Retours, sécurité, biens</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">proposés au Maroc.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La règle doit être connue</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">et appliquée.</text>
</g>
</svg>
