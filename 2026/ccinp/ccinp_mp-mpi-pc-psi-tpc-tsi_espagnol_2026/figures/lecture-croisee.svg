<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Trois lieux de décision face au climat</title>
<desc id="description">Légiférer Restauration de la nature. La majorité dépend de la position autrichienne. Appliquer Traçabilité des importations. La Commission reporte son application. Contester Mobilisation espagnole et recours suisse. Distinguer proportion des poursuites et responsabilité publique.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois lieux de décision face au climat</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Élément observé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Lecture</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Légiférer</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Restauration de la nature.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La majorité dépend de la</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">position autrichienne.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Appliquer</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Traçabilité des</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">importations.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La Commission reporte son</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">application.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Contester</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Mobilisation espagnole et</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">recours suisse.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Distinguer proportion des</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">poursuites et</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">responsabilité publique.</text>
</g>
</svg>
