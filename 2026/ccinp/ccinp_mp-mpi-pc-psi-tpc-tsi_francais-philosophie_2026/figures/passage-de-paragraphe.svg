<svg xmlns="http://www.w3.org/2000/svg" width="846" height="260" viewBox="0 0 846 260" role="img"><title>Passer au paragraphe suivant</title><desc>Extrait du résumé sur une grille pédagogique de cinq mots par ligne. La double barre précède le mot 31.</desc><rect x="0" y="0" width="846" height="260" fill="#faf9f4"/><text x="26" y="37" font-size="26" font-family="DejaVu Sans" font-weight="bold" fill="#123e49">Passer au paragraphe suivant</text><text x="22" y="88" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#123e49">26–30</text><rect x="100" y="63" width="139" height="39" fill="#e1ece6"/><text x="106" y="89" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">à</text><rect x="242" y="63" width="139" height="39" fill="#e1ece6"/><text x="248" y="89" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">notre</text><rect x="384" y="63" width="139" height="39" fill="#e1ece6"/><text x="390" y="89" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">vie</text><rect x="526" y="63" width="139" height="39" fill="#e1ece6"/><text x="532" y="89" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">sans</text><rect x="668" y="63" width="139" height="39" fill="#e1ece6"/><text x="674" y="89" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">mesure.</text><text x="22" y="132" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#123e49">31–35</text><rect x="100" y="107" width="139" height="39" fill="#f1e5ce"/><text x="106" y="133" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">‖ Séparant</text><rect x="242" y="107" width="139" height="39" fill="#f1e5ce"/><text x="248" y="133" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">observateur</text><rect x="384" y="107" width="139" height="39" fill="#f1e5ce"/><text x="390" y="133" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">et</text><rect x="526" y="107" width="139" height="39" fill="#f1e5ce"/><text x="532" y="133" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">objet,</text><rect x="668" y="107" width="139" height="39" fill="#f1e5ce"/><text x="674" y="133" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">la</text><text x="22" y="176" font-size="16" font-family="DejaVu Sans" font-weight="bold" fill="#123e49">36–40</text><rect x="100" y="151" width="139" height="39" fill="#e1ece6"/><text x="106" y="177" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">science</text><rect x="242" y="151" width="139" height="39" fill="#e1ece6"/><text x="248" y="177" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">considère</text><rect x="384" y="151" width="139" height="39" fill="#e1ece6"/><text x="390" y="177" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">un</text><rect x="526" y="151" width="139" height="39" fill="#e1ece6"/><text x="532" y="177" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">ensemble</text><rect x="668" y="151" width="139" height="39" fill="#e1ece6"/><text x="674" y="177" font-size="16" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">depuis</text><text x="24" y="225" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">Le signe occupe le début de la nouvelle unité de sens et ne compte pas pour un mot.</text></svg>
