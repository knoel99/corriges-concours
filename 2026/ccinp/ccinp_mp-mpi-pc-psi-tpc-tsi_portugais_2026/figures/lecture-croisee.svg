<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Comparer les surfaces, les usages et les décisions</title>
<desc id="description">Lire le graphique Parts des causes de 2001 à 2018. Le graphique compte les incendies, pas les hectares. Aménager Entretien du paysage et parcelles agricoles. Les effets dépendent du milieu et des pratiques. Agir dans la durée Prévention collective et diversité des espaces. Distinguer la limitation du feu et la lutte après son départ.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comparer les surfaces, les usages et les décisions</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Élément observé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Lecture</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Lire le graphique</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Parts des causes de 2001 à</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">2018.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le graphique compte les</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">incendies, pas les</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">hectares.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Aménager</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Entretien du paysage et</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">parcelles agricoles.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Les effets dépendent du</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">milieu et des pratiques.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Agir dans la durée</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Prévention collective et</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">diversité des espaces.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Distinguer la limitation du</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">feu et la lutte après son</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">départ.</text>
</g>
</svg>
