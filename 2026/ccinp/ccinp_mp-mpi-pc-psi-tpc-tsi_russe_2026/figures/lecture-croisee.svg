<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Que mesure le prix de la rentrée ?</title>
<desc id="description">Chiffrer 6 850 ou 7 050 roubles, plus 985 de fournitures. Le contenu et la date fixent le sens du total. Comparer Des achats qui varient selon les familles. Le budget réel peut s’écarter de la moyenne. Décider Conseils de préparation des achats. Achat anticipé ou aide ciblée selon la situation.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que mesure le prix de la rentrée ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Élément observé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Lecture</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Chiffrer</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">6 850 ou 7 050 roubles,</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">plus 985 de fournitures.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le contenu et la date</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">fixent le sens du total.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Comparer</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Des achats qui varient</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">selon les familles.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le budget réel peut</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">s’écarter de la moyenne.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Décider</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Conseils de préparation</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">des achats.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Achat anticipé ou aide</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">ciblée selon la situation.</text>
</g>
</svg>
