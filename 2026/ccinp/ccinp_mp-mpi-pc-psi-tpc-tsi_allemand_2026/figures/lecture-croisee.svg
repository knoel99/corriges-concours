<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Qui mesure quoi dans les trois sources ?</title>
<desc id="description">Institut fédéral Dose et forme du produit. Une quantité modérée peut stimuler. Watson Prix et achats transfrontaliers. La même habitude coûte plus cher. Étude citée par le quotidien Indices cardiaques et conduites associées. Distinguer résultat mesuré et risque futur.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui mesure quoi dans les trois sources ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Élément observé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Lecture</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Institut fédéral</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Dose et forme du produit.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Une quantité modérée peut</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">stimuler.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Watson</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Prix et achats</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">transfrontaliers.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La même habitude coûte plus</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">cher.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Étude citée par le</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">quotidien</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Indices cardiaques et</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">conduites associées.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Distinguer résultat mesuré</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">et risque futur.</text>
</g>
</svg>
