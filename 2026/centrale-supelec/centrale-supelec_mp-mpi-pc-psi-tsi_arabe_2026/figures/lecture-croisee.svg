<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">famille et premiers</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">contacts.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Témoignages recueillis à</text>
