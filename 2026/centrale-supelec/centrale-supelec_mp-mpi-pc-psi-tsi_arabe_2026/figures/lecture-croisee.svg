<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">De l’éducation au développement d’une entreprise</title>
<desc id="description">Entrer dans le métier Études, appui de la famille et premiers contacts. Témoignages recueillis à Berlin en 2010. Trouver sa place Concurrence, droits économiques et accès au numérique. Analyse de la Banque mondiale en 2019. Développer le projet Essais du produit, réseau de pairs et incubation. Al-Mashreq yabda’, article de 2023.</desc>
