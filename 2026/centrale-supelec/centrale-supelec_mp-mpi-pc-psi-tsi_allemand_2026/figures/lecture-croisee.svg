<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Trois mesures de la présence des femmes dans les sciences</title>
<desc id="description">29,4 % en 2021 Personnel de recherche et développement en Allemagne. Destatis, moyenne UE de 33,7 %. Environ 15 % Personnes exerçant un métier MINT. MedienFokus, article de 2024. Environ 32 % Personnes qui commencent des études MINT. MedienFokus, article de 2024.</desc>
