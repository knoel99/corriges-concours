<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Personnel de recherche et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">développement en</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">Allemagne.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Destatis, moyenne UE de</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">33,7 %.</text>
