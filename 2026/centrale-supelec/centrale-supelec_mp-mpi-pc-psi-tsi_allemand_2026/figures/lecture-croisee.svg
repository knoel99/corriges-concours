<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">MedienFokus, article de</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">2024.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
