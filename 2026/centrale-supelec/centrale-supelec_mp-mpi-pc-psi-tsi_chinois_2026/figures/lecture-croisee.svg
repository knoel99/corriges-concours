<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">De l’information à l’interprétation</title>
<desc id="description">Au travail Trier les documents ou traiter les données. Définir les besoins et juger les résultats. Dans le dessin Associer les mots à des objets visibles. Comprendre le plat, le proverbe ou le souvenir personnel. À la maison Rechercher une recette ou expliquer un terme. Choisir l’usage en fonction de l’âge et de la situation.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De l’information à l’interprétation</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Situation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce que fait la machine</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Rôle humain</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Au travail</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Trier les documents ou</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">traiter les données.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Définir les besoins et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">juger les résultats.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Dans le dessin</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Associer les mots à des</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">objets visibles.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Comprendre le plat, le</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">proverbe ou le souvenir</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">personnel.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">À la maison</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Rechercher une recette ou</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">expliquer un terme.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Choisir l’usage en fonction</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">de l’âge et de la</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">situation.</text>
</g>
</svg>
