<svg xmlns="http://www.w3.org/2000/svg" width="846" height="260" viewBox="0 0 846 260" role="img"><title>Deux sens du retour au jardin</title><desc>Le retour des pousses en février et la diversité qui amortit une perturbation éclairent deux questions distinctes.</desc><rect x="0" y="0" width="846" height="260" fill="#faf9f4"/><text x="26" y="37" font-size="26" font-family="DejaVu Sans" font-weight="bold" fill="#123e49">Deux sens du retour au jardin</text><rect x="25" y="60" width="388" height="138" fill="#e2ede7"/><text x="38" y="90" font-size="21" font-family="DejaVu Sans" font-weight="bold" fill="#123e49">Le jardin en hiver</text><text x="38" y="119" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">Le jardin paraît mort.</text><text x="38" y="146" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">Les bulbes subsistent.</text><text x="38" y="173" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">Des pousses réapparaissent.</text><rect x="431" y="60" width="388" height="138" fill="#f0e5ce"/><text x="444" y="90" font-size="21" font-family="DejaVu Sans" font-weight="bold" fill="#123e49">Après une perturbation</text><text x="444" y="119" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">Les espèces réagissent différemment.</text><text x="444" y="146" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">Le jardin peut continuer de vivre.</text><text x="444" y="173" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">Sa composition peut changer.</text><text x="26" y="232" font-size="17" font-family="DejaVu Sans" font-weight="normal" fill="#123e49">Retrouver la vie pose une autre question que retrouver exactement les mêmes plantes.</text></svg>
