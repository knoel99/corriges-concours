<svg xmlns="http://www.w3.org/2000/svg" width="850" height="280" viewBox="0 0 850 280" role="img" aria-labelledby="titre desc"><title id="titre">La corneille blanche de Haushofer</title><desc id="desc">Pour ses semblables. La différence visible affecte sa place dans le groupe. Pour la narratrice. La solitude de l’oiseau appelle observation et attention. Pour le lecteur. Une vie peut avoir du sens sans entrer dans un ordre harmonieux.</desc><rect width="850" height="280" fill="#faf9f4"/><g fill="#213c4a" font-family="DejaVu Sans,sans-serif"><text x="24" y="34" font-size="22" font-weight="bold">La corneille blanche de Haushofer</text><rect x="24" y="48" width="802" height="62" rx="5" fill="white" stroke="#afbec0"/><path d="M28 50v58" stroke="#387877" stroke-width="6"/><text x="43" y="73" font-size="17" font-weight="bold">Pour ses semblables</text><text x="43" y="97" font-size="15">La différence visible affecte sa place dans le groupe.</text><rect x="24" y="122" width="802" height="62" rx="5" fill="white" stroke="#afbec0"/><path d="M28 124v58" stroke="#387877" stroke-width="6"/><text x="43" y="147" font-size="17" font-weight="bold">Pour la narratrice</text><text x="43" y="171" font-size="15">La solitude de l’oiseau appelle observation et attention.</text><rect x="24" y="196" width="802" height="62" rx="5" fill="white" stroke="#afbec0"/><path d="M28 198v58" stroke="#387877" stroke-width="6"/><text x="43" y="221" font-size="17" font-weight="bold">Pour le lecteur</text><text x="43" y="245" font-size="15">Une vie peut avoir du sens sans entrer dans un ordre harmonieux.</text></g></svg>
