<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Deux façons de franchir le décor</title>
<desc id="description">Objet ordinaire Un opuscule à la couverture familière. Un fauteuil dans un salon ouvert. Ce qui se révèle Un roman sous la couverture trompeuse. Le décor préhistorique côtoie le salon. Rôle du personnage Trafford invite à imaginer un autre monde. Le casque promet à son porteur un paysage immersif.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux façons de franchir le décor</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Élément</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dans le roman</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Dans la publicité</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Objet ordinaire</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un opuscule à la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">couverture familière.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Un fauteuil dans un salon</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">ouvert.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Ce qui se révèle</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Un roman sous la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">couverture trompeuse.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le décor préhistorique</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">côtoie le salon.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Rôle du personnage</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Trafford invite à imaginer</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">un autre monde.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le casque promet à son</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">porteur un paysage</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">immersif.</text>
</g>
</svg>
