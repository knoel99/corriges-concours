<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Trois dates pour lire le dossier italien</title>
<desc id="description">Novembre 2024 Présentation de la fondation au nom de Giulia Cecchettin. Éducation affective et désaccord sur les causes structurelles. Décembre 2024 Verdict de première instance dans le procès Turetta. La condamnation précède la nouvelle qualification pénale. Décembre 2025 Publication de la loi 181 puis entrée en vigueur. Distinguer le féminicide du projet distinct sur le consentement.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois dates pour lire le dossier italien</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Événement</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Portée</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Novembre 2024</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Présentation de la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">fondation au nom de Giulia</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">Cecchettin.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Éducation affective et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">désaccord sur les causes</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">structurelles.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Décembre 2024</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Verdict de première</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">instance dans le procès</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">Turetta.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">La condamnation précède la</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">nouvelle qualification</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">pénale.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Décembre 2025</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Publication de la loi 181</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">puis entrée en vigueur.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Distinguer le féminicide du</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">projet distinct sur le</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">consentement.</text>
</g>
</svg>
