<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="titre description">
<title id="titre">Qui observe l’expérience numérique des enfants ?</title>
<desc id="description">Article du g1 83 % des internautes de 9 à 17 ans ont un profil. La base est celle des jeunes internautes interrogés. Paroles recueillies 29 % des jeunes évoquent une situation déplaisante, contre 8 % des adultes qui en soupçonnent une. Les deux groupes ne répondent pas depuis le même point de vue. Affiche et dessin Maquillage devant le miroir, jeu de peinture et écran. Ces images montrent les attentes adultes et les usages de l’enfance.</desc>
<rect width="720" height="385" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui observe l’expérience numérique des enfants ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Élément du dossier</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est observé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Portée</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Article du g1</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">83 % des internautes de 9</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">à 17 ans ont un profil.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La base est celle des</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">jeunes internautes</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">interrogés.</text>
<rect x="10" y="181" width="700" height="105" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Paroles recueillies</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">29 % des jeunes évoquent</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">une situation déplaisante,</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">contre 8 % des adultes qui</text>
<text x="229" y="272" font-size="15" font-weight="400" fill="#162d3b">en soupçonnent une.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Les deux groupes ne</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">répondent pas depuis le</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">même point de vue.</text>
<rect x="10" y="292" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">Affiche et dessin</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">Maquillage devant le</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">miroir, jeu de peinture et</text>
<text x="229" y="361" font-size="15" font-weight="400" fill="#162d3b">écran.</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">Ces images montrent les</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">attentes adultes et les</text>
<text x="473" y="361" font-size="15" font-weight="400" fill="#162d3b">usages de l’enfance.</text>
</g>
</svg>
