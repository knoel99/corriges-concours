<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Trois niveaux de preuve sur la messagerie Max</title>
<desc id="description">Analyse prospective Plans attribués aux sources du journaliste. Distinguer les projets des fonctions déjà observées. Témoignages Conséquences des demandes d’installation au travail ou en cours. Attribuer les faits rapportés à leurs témoins. Photographie et capture Symboles soviétiques, téléphone et rivalité entre services. Les illustrations ne prouvent pas l’usage individuel ou le transfert de données.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois niveaux de preuve sur la messagerie Max</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Pièce</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’elle apporte</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Limite</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Analyse prospective</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Plans attribués aux</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">sources du journaliste.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Distinguer les projets des</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">fonctions déjà observées.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Témoignages</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Conséquences des demandes</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">d’installation au travail</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">ou en cours.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Attribuer les faits</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">rapportés à leurs témoins.</text>
<rect x="10" y="248" width="700" height="105" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Photographie et</text>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">capture</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Symboles soviétiques,</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">téléphone et rivalité</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">entre services.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Les illustrations ne</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">prouvent pas l’usage</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">individuel ou le transfert</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">de données.</text>
</g>
</svg>
