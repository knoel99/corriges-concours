<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Une même victoire, trois questions politiques</title>
<desc id="description">ABC Chili et comparaison avec l’Espagne. Interprète le scrutin comme un rejet de la refondation constitutionnelle. La Vanguardia Alternances régionales. Distingue sanction des gouvernants et adhésion à un programme uniforme. El País et dessin Mexique et fragmentation politique. L’unité d’un mouvement peut modifier les effets d’une tendance régionale.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Une même victoire, trois questions politiques</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Texte</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Échelle</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Raisonnement</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">ABC</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Chili et comparaison avec</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">l’Espagne.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Interprète le scrutin comme</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">un rejet de la refondation</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">constitutionnelle.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">La Vanguardia</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Alternances régionales.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Distingue sanction des</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">gouvernants et adhésion à</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">un programme uniforme.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">El País et dessin</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Mexique et fragmentation</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">politique.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">L’unité d’un mouvement peut</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">modifier les effets d’une</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">tendance régionale.</text>
</g>
</svg>
