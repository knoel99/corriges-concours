<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Una crisis, dos momentos de observación</title>
<desc id="description">Público, 8 de noviembre Presión militar, justificaciones, oposición y debate en EEUU. Hay acciones observables e interpretaciones discrepantes. Infobae, 1 de diciembre Llamada entre presidentes y posibles condiciones de salida. La llamada está confirmada, los detalles se atribuyen a fuentes. Comparación La presión pública enmarca los contactos diplomáticos. Ningún artículo da por resuelta la crisis.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Una crisis, dos momentos de observación</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Fuente</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qué documenta</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Grado de certeza</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Público, 8 de</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">noviembre</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Presión militar,</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">justificaciones, oposición</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">y debate en EEUU.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Hay acciones observables e</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">interpretaciones</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">discrepantes.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Infobae, 1 de</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">diciembre</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Llamada entre presidentes</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">y posibles condiciones de</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">salida.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">La llamada está confirmada,</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">los detalles se atribuyen a</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">fuentes.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Comparación</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">La presión pública enmarca</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">los contactos</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">diplomáticos.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Ningún artículo da por</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">resuelta la crisis.</text>
</g>
</svg>
