<svg xmlns="http://www.w3.org/2000/svg" width="720" height="231" viewBox="0 0 720 231" role="img" aria-labelledby="titre description">
<title id="titre">Décider à plusieurs moments de la vie</title>
<desc id="description">À l’école Aptitudes et envies Qui formule le projet ? En formation Essai concret du travail Que découvre-t-on ? En activité Salaire, autonomie, santé Pourquoi se réorienter ?</desc>
<rect width="720" height="231" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Décider à plusieurs moments de la vie</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question ouverte</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">À l’école</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Aptitudes et envies</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Qui formule le projet ?</text>
<rect x="10" y="137" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">En formation</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Essai concret du travail</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Que découvre-t-on ?</text>
<rect x="10" y="182" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="207" font-size="15" font-weight="700" fill="#162d3b">En activité</text>
<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">Salaire, autonomie, santé</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">Pourquoi se réorienter ?</text>
</g>
</svg>
