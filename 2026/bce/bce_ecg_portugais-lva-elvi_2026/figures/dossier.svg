<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" role="img" aria-labelledby="titre description">
<title id="titre">Uma escrita coletiva e a sua receção</title>
<desc id="description">Reescrita As cinco cartas antigas tornam-se um livro de vozes e géneros diversos. Quem pode falar pela experiência feminina? Repressão A censura tenta separar as responsabilidades individuais. Que poder exerce a autoria coletiva? Depois de Abril A absolvição e a ação das mulheres na rua não têm a mesma função. Como passar do direito à participação? Comparação A guerra colonial atravessa a sociedade portuguesa. Onde se cruzam e onde divergem as dominações?</desc>
<rect width="720" height="452" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Uma escrita coletiva e a sua receção</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Plano</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indício concreto</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Questão</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Reescrita</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">As cinco cartas antigas</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">tornam-se um livro de</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">vozes e géneros diversos.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Quem pode falar pela</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">experiência feminina?</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Repressão</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">A censura tenta separar as</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">responsabilidades</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">individuais.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Que poder exerce a autoria</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">coletiva?</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Depois de Abril</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">A absolvição e a ação das</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">mulheres na rua não têm a</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">mesma função.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Como passar do direito à</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">participação?</text>
<rect x="10" y="359" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="384" font-size="15" font-weight="700" fill="#162d3b">Comparação</text>
<text x="229" y="384" font-size="15" font-weight="400" fill="#162d3b">A guerra colonial</text>
<text x="229" y="406" font-size="15" font-weight="400" fill="#162d3b">atravessa a sociedade</text>
<text x="229" y="428" font-size="15" font-weight="400" fill="#162d3b">portuguesa.</text>
<text x="473" y="384" font-size="15" font-weight="400" fill="#162d3b">Onde se cruzam e onde</text>
<text x="473" y="406" font-size="15" font-weight="400" fill="#162d3b">divergem as dominações?</text>
</g>
</svg>
