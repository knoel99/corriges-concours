<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Del desacuerdo político a la reducción del riesgo</title>
<desc id="description">Avisos tardíos RTVE reconstruye la controversia valenciana. Medir cobertura y tiempo de recepción. Calor y sequía El tema y el cartel señalan exposición y degradación. Reducir la vulnerabilidad local. Emisiones El gráfico mide electricidad renovable en 2024. Seguir por separado los avances de cada sector.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Del desacuerdo político a la reducción del riesgo</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Problema</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Prueba del dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Respuesta que se puede evaluar</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Avisos tardíos</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">RTVE reconstruye la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">controversia valenciana.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Medir cobertura y tiempo de</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">recepción.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Calor y sequía</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">El tema y el cartel</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">señalan exposición y</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">degradación.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Reducir la vulnerabilidad</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">local.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Emisiones</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">El gráfico mide</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">electricidad renovable en</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">2024.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Seguir por separado los</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">avances de cada sector.</text>
</g>
</svg>
