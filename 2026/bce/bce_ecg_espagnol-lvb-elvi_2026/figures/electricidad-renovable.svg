<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description"><title id="titre">Aportación de las renovables a la electricidad en España</title><desc id="description">Porcentaje de toda la electricidad generada en 2024 Eólica 23,2 %. Solar fotovoltaica 17 %. Hidráulica 13,3 %. Solar térmica 1,6 %. Otras renovables 1,7 %. Fuente: Red Eléctrica, 18 de marzo de 2025. Las cinco aportaciones suman el 56,8 %.</desc>
<rect width="720" height="341" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#163442">
<text x="12" y="26" font-size="20" font-weight="bold">Aportación de las renovables a la electricidad en España</text><text x="12" y="53" font-size="15">Porcentaje de toda la electricidad generada en 2024</text>
<path d="M240 75v200" stroke="#d0d9db"/><text x="240" y="295" text-anchor="middle" font-size="14">0 %</text>
<path d="M340 75v200" stroke="#d0d9db"/><text x="340" y="295" text-anchor="middle" font-size="14">25 %</text>
<path d="M440 75v200" stroke="#d0d9db"/><text x="440" y="295" text-anchor="middle" font-size="14">50 %</text>
<path d="M540 75v200" stroke="#d0d9db"/><text x="540" y="295" text-anchor="middle" font-size="14">75 %</text>
<path d="M640 75v200" stroke="#d0d9db"/><text x="640" y="295" text-anchor="middle" font-size="14">100 %</text>
<text x="12" y="96" font-size="16">Eólica</text><rect x="240" y="80" width="92.8" height="20" fill="#2e6777"/><text x="339.8" y="96" font-size="15" font-weight="bold">23,2 %</text>
<text x="12" y="136" font-size="16">Solar fotovoltaica</text><rect x="240" y="120" width="68" height="20" fill="#2e6777"/><text x="315" y="136" font-size="15" font-weight="bold">17 %</text>
<text x="12" y="176" font-size="16">Hidráulica</text><rect x="240" y="160" width="53.2" height="20" fill="#2e6777"/><text x="300.2" y="176" font-size="15" font-weight="bold">13,3 %</text>
<text x="12" y="216" font-size="16">Solar térmica</text><rect x="240" y="200" width="6.4" height="20" fill="#2e6777"/><text x="253.4" y="216" font-size="15" font-weight="bold">1,6 %</text>
<text x="12" y="256" font-size="16">Otras renovables</text><rect x="240" y="240" width="6.8" height="20" fill="#2e6777"/><text x="253.8" y="256" font-size="15" font-weight="bold">1,7 %</text>
<text x="12" y="333" font-size="13">Fuente: Red Eléctrica, 18 de marzo de 2025. Las cinco aportaciones suman el 56,8 %.</text></g></svg>