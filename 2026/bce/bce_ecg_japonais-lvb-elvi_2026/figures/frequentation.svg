<svg xmlns="http://www.w3.org/2000/svg" width="890" height="300" viewBox="0 0 890 300" role="img" aria-labelledby="t d"><title id="t">Fréquentation des écoles alternatives pendant une absence</title><desc id="d">Élèves interrogés dans le document 4, p. 19. La fréquence déclarée ne dit pas pourquoi un élève fréquente ou non un lieu.</desc><rect width="890" height="300" fill="#f8f7ec"/><g font-family="DejaVu Sans,sans-serif" fill="#233b42"><text x="27" y="34" font-size="22" font-weight="bold">Fréquentation des écoles alternatives pendant une absence</text><text x="28" y="65" font-size="16">Élèves interrogés dans le document 4, p. 19.</text><text x="30" y="110" font-size="17">Souvent</text><rect x="182" y="93" width="27.52" height="20" fill="#397273"/><text x="223.52" y="110" font-size="17">4,3 %</text><text x="30" y="151" font-size="17">Parfois</text><rect x="182" y="134" width="23.040000000000003" height="20" fill="#397273"/><text x="219.04" y="151" font-size="17">3,6 %</text><text x="30" y="192" font-size="17">Rarement</text><rect x="182" y="175" width="13.440000000000001" height="20" fill="#397273"/><text x="209.44" y="192" font-size="17">2,1 %</text><text x="30" y="233" font-size="17">Jamais</text><rect x="182" y="216" width="576.0" height="20" fill="#397273"/><text x="772.0" y="233" font-size="17">90,0 %</text><text x="28" y="279" font-size="16">La fréquence déclarée ne dit pas pourquoi un élève fréquente ou non un lieu.</text></g></svg>
