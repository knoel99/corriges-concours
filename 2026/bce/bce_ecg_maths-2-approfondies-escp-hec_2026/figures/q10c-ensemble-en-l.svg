<svg xmlns="http://www.w3.org/2000/svg" width="460" height="420" viewBox="0 0 460 420" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect x="0" y="0" width="460" height="420" fill="#ffffff"/>
  <defs>
    <marker id="fleche" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="fleche-bleue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d9f"/>
    </marker>
  </defs>
  <!-- repère : origine (60,380), unité 240 px -->
  <!-- carré [0,1]^2 en pointillés -->
  <rect x="60" y="140" width="240" height="240" fill="none" stroke="#999999" stroke-width="1" stroke-dasharray="5,4"/>
  <!-- ensemble en L : x >= 1/2, y >= 1/2, et (x <= 2/3 ou y <= 2/3) -->
  <polygon points="180,260 420,260 420,220 220,220 220,20 180,20" fill="#cfe0f5" stroke="#2a5d9f" stroke-width="2"/>
  <!-- prolongements à l'infini -->
  <line x1="405" y1="240" x2="438" y2="240" stroke="#2a5d9f" stroke-width="2" marker-end="url(#fleche-bleue)"/>
  <line x1="200" y1="35" x2="200" y2="8" stroke="#2a5d9f" stroke-width="2" marker-end="url(#fleche-bleue)"/>
  <!-- axes -->
  <line x1="30" y1="380" x2="450" y2="380" stroke="#333333" stroke-width="1.5" marker-end="url(#fleche)"/>
  <line x1="60" y1="410" x2="60" y2="10" stroke="#333333" stroke-width="1.5" marker-end="url(#fleche)"/>
  <!-- graduations -->
  <line x1="180" y1="375" x2="180" y2="385" stroke="#333333"/>
  <line x1="220" y1="375" x2="220" y2="385" stroke="#333333"/>
  <line x1="300" y1="375" x2="300" y2="385" stroke="#333333"/>
  <line x1="55" y1="260" x2="65" y2="260" stroke="#333333"/>
  <line x1="55" y1="220" x2="65" y2="220" stroke="#333333"/>
  <line x1="55" y1="140" x2="65" y2="140" stroke="#333333"/>
  <line x1="180" y1="380" x2="180" y2="260" stroke="#999999" stroke-dasharray="3,3"/>
  <line x1="220" y1="380" x2="220" y2="220" stroke="#999999" stroke-dasharray="3,3"/>
  <line x1="60" y1="260" x2="180" y2="260" stroke="#999999" stroke-dasharray="3,3"/>
  <line x1="60" y1="220" x2="220" y2="220" stroke="#999999" stroke-dasharray="3,3"/>
  <text x="168" y="402">1/2</text>
  <text x="214" y="402">2/3</text>
  <text x="296" y="402">1</text>
  <text x="22" y="265">1/2</text>
  <text x="22" y="225">2/3</text>
  <text x="40" y="145">1</text>
  <text x="44" y="398">0</text>
  <text x="440" y="400">x</text>
  <text x="70" y="22">y</text>
  <text x="250" y="166" fill="#555555" font-size="13">min(x, y) &gt; 2/3 : exclu</text>
  <text x="290" y="285" fill="#2a5d9f" font-size="13">bande 1/2 ≤ y ≤ 2/3</text>
  <text x="80" y="90" fill="#2a5d9f" font-size="13">bande</text>
  <text x="80" y="106" fill="#2a5d9f" font-size="13">1/2 ≤ x ≤ 2/3</text>
</svg>
