<svg xmlns="http://www.w3.org/2000/svg" width="720" height="231" viewBox="0 0 720 231" role="img" aria-labelledby="titre description">
<title id="titre">Le prix d’une réputation</title>
<desc id="description">Pays Influence culturelle Quelle valeur est mesurée ? Atelier Temps de confection Qui transmet les gestes ? Sous-traitance Grève à Prato Qui répond des conditions ?</desc>
<rect width="720" height="231" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Le prix d’une réputation</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Échelle</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Élément du dossier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question pour l’essai</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Pays</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Influence culturelle</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Quelle valeur est mesurée ?</text>
<rect x="10" y="137" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Atelier</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Temps de confection</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Qui transmet les gestes ?</text>
<rect x="10" y="182" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="207" font-size="15" font-weight="700" fill="#162d3b">Sous-traitance</text>
<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">Grève à Prato</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">Qui répond des conditions ?</text>
</g>
</svg>
