<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">What stage of enforcement is disputed?</title>
<desc id="description">US cities Selecting people for stops or detention. Constitutional limits and restrictions on warrantless arrests. United Kingdom Deciding when removal can proceed. Family life and protection against inhuman or degrading treatment. Both debates Political leaders claim a need for greater discretion. Critics ask how that discretion affects people beyond the stated target.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What stage of enforcement is disputed?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Case</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Power at issue</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Safeguard invoked</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">US cities</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Selecting people for stops</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">or detention.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Constitutional limits and</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">restrictions on warrantless</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">arrests.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">United Kingdom</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Deciding when removal can</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">proceed.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Family life and protection</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">against inhuman or</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">degrading treatment.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Both debates</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Political leaders claim a</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">need for greater</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">discretion.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Critics ask how that</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">discretion affects people</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">beyond the stated target.</text>
</g>
</svg>
