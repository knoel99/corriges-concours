<svg xmlns="http://www.w3.org/2000/svg" width="890" height="300" viewBox="0 0 890 300" role="img" aria-labelledby="t d"><title id="t">Trois saisons françaises, deux mesures</title><desc id="d">Document 5, p. 24. Les décès sont compris dans le total des accidents. En 2024–2025, le texte 3 indique ensuite 100 accidents et 11 décès.</desc><rect width="890" height="300" fill="#f8f7ec"/><g font-family="DejaVu Sans,sans-serif" fill="#233b42"><text x="27" y="34" font-size="22" font-weight="bold">Trois saisons françaises, deux mesures</text><text x="28" y="65" font-size="16">Document 5, p. 24. Les décès sont compris dans le total des accidents.</text><text x="29" y="107" font-size="17" font-weight="bold">Saison</text><text x="295" y="107" font-size="17" font-weight="bold">Accidents recensés</text><text x="617" y="107" font-size="17" font-weight="bold">Dont décès</text><path d="M27 118 H852" stroke="#acb8ae"/><text x="29" y="143" font-size="17">2003–2004</text><text x="295" y="143" font-size="17">203</text><text x="617" y="143" font-size="17">29</text><path d="M27 158 H852" stroke="#acb8ae"/><text x="29" y="183" font-size="17">2022–2023</text><text x="295" y="183" font-size="17">78</text><text x="617" y="183" font-size="17">6</text><path d="M27 198 H852" stroke="#acb8ae"/><text x="29" y="223" font-size="17">2023–2024</text><text x="295" y="223" font-size="17">97</text><text x="617" y="223" font-size="17">6</text><text x="28" y="279" font-size="16">En 2024–2025, le texte 3 indique ensuite 100 accidents et 11 décès.</text></g></svg>
