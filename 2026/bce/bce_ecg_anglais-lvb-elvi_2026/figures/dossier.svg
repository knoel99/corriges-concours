<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">From an available pitch to a lasting opportunity</title>
<desc id="description">Hall’s research Enjoy sport and gain skills useful later. A welcoming team, a booking slot and affordable access. Scott’s experience Start locally and aspire to professional play. The local field must remain available. Wilson’s reporting Protect community space for future players. Planning safeguards and council resources matter.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">From an available pitch to a lasting opportunity</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Evidence</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Opportunity</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Condition</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Hall’s research</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Enjoy sport and gain</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">skills useful later.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">A welcoming team, a booking</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">slot and affordable access.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Scott’s experience</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Start locally and aspire</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">to professional play.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">The local field must remain</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">available.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Wilson’s reporting</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Protect community space</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">for future players.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Planning safeguards and</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">council resources matter.</text>
</g>
