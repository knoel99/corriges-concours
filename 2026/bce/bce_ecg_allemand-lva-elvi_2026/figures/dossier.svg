<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="titre description">
<title id="titre">Wie entsteht europäische Handlungsfähigkeit?</title>
<desc id="description">Politik Gemeinsame Reformen in Paris, Berlin und Brüssel. Ein gemeinsames Ziel erfordert konkrete Entscheidungen. Arbeitsmarkt Standorte und berufliche Erfahrung lassen sich erhalten. Berufe sind nicht beliebig austauschbar. Öffentliche Mittel Forschung und Bildung eröffnen weitere Möglichkeiten. Exporterlöse allein erfassen den gesellschaftlichen Ertrag nicht.</desc>
<rect width="720" height="385" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Wie entsteht europäische Handlungsfähigkeit?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Ebene</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Gelegenheit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Bedingung oder Risiko</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Politik</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Gemeinsame Reformen in</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Paris, Berlin und Brüssel.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Ein gemeinsames Ziel</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">erfordert konkrete</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">Entscheidungen.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Arbeitsmarkt</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Standorte und berufliche</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">Erfahrung lassen sich</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">erhalten.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Berufe sind nicht beliebig</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">austauschbar.</text>
<rect x="10" y="270" width="700" height="105" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Öffentliche Mittel</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Forschung und Bildung</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">eröffnen weitere</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">Möglichkeiten.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Exporterlöse allein</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">erfassen den</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">gesellschaftlichen Ertrag</text>
<text x="473" y="361" font-size="15" font-weight="400" fill="#162d3b">nicht.</text>
</g>
</svg>
