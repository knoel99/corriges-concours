<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Was sollen Lernende selbst leisten?</title>
<desc id="description">Maas Übernommene Ergebnisse bleiben oberflächlich. Fachwissen erwerben und Ausgaben überprüfen. Mann Auswendig gelernte Antworten verlieren an Wert. Fragen stellen und an offenen Projekten arbeiten. Eigene Position Automatische Lösungen können eigene Urteile verdecken. Eine Entscheidung an Quellen erklären und verteidigen.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Was sollen Lernende selbst leisten?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Perspektive</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Problem</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Folge für den Unterricht</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Maas</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Übernommene Ergebnisse</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">bleiben oberflächlich.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Fachwissen erwerben und</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Ausgaben überprüfen.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Mann</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Auswendig gelernte</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Antworten verlieren an</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">Wert.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Fragen stellen und an</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">offenen Projekten arbeiten.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Eigene Position</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Automatische Lösungen</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">können eigene Urteile</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">verdecken.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Eine Entscheidung an</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Quellen erklären und</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">verteidigen.</text>
</g>
</svg>
