<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Rang d’un pays</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le rang ne décrit pas</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">chacun</text>
