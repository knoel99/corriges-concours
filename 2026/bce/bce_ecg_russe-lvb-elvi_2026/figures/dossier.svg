<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Que mesure-t-on quand on parle de bonheur ?</title>
<desc id="description">Dictionnaires Sens du mot Un usage a plusieurs nuances Série russe Points d’indice Ne pas confondre avec un taux Classement mondial Rang d’un pays Le rang ne décrit pas chacun</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que mesure-t-on quand on parle de bonheur ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Support</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Mesure</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Précaution</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Dictionnaires</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Sens du mot</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Un usage a plusieurs</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">nuances</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Série russe</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Points d’indice</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Ne pas confondre avec un</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">taux</text>
