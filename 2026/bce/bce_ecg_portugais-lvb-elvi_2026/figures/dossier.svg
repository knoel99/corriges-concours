<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="titre description">
<title id="titre">O que se transmite numa refeição?</title>
<desc id="description">Memória Um sabor aprendido na infância acompanha quem come sozinho. Com quem se aprendeu? Circulação Técnicas e ingredientes atravessam fronteiras. Que encontros transformaram a receita? Mercado A uniformização pode ocultar origens e produtores. Quem recebe valor e reconhecimento? Escolha A neta transforma uma receita reconhecida pela avó. O que se pode mudar sem perder a ligação?</desc>
<rect width="720" height="430" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">O que se transmite numa refeição?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Dimensão</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Exemplo</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Pergunta</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Memória</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Um sabor aprendido na</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">infância acompanha quem</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">come sozinho.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Com quem se aprendeu?</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Circulação</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Técnicas e ingredientes</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">atravessam fronteiras.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Que encontros transformaram</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">a receita?</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Mercado</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">A uniformização pode</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">ocultar origens e</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">produtores.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Quem recebe valor e</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">reconhecimento?</text>
<rect x="10" y="337" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="362" font-size="15" font-weight="700" fill="#162d3b">Escolha</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">A neta transforma uma</text>
<text x="229" y="384" font-size="15" font-weight="400" fill="#162d3b">receita reconhecida pela</text>
<text x="229" y="406" font-size="15" font-weight="400" fill="#162d3b">avó.</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">O que se pode mudar sem</text>
<text x="473" y="384" font-size="15" font-weight="400" fill="#162d3b">perder a ligação?</text>
</g>
</svg>
