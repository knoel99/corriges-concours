<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400" font-family="Arial, Helvetica, sans-serif" font-size="15">
  <rect x="0" y="0" width="420" height="400" fill="#ffffff"/>
  <!-- repère : origine (80,330), unité 120 px -->
  <defs>
    <marker id="fleche" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <!-- carré D = [0,1]^2 -->
  <rect x="80" y="210" width="120" height="120" fill="#cfe0f5" stroke="#2a5d9f" stroke-width="2"/>
  <!-- axes -->
  <line x1="40" y1="330" x2="400" y2="330" stroke="#333333" stroke-width="1.5" marker-end="url(#fleche)"/>
  <line x1="80" y1="380" x2="80" y2="20" stroke="#333333" stroke-width="1.5" marker-end="url(#fleche)"/>
  <!-- graduations -->
  <line x1="200" y1="325" x2="200" y2="335" stroke="#333333"/>
  <line x1="320" y1="325" x2="320" y2="335" stroke="#333333"/>
  <line x1="75" y1="210" x2="85" y2="210" stroke="#333333"/>
  <line x1="75" y1="90" x2="85" y2="90" stroke="#333333"/>
  <text x="194" y="352">1</text>
  <text x="314" y="352">2</text>
  <text x="60" y="215">1</text>
  <text x="60" y="95">2</text>
  <text x="62" y="350">0</text>
  <text x="390" y="352">x</text>
  <text x="90" y="30">y</text>
  <!-- C1 : x + y = 1 -->
  <line x1="50" y1="180" x2="230" y2="360" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="80" y1="210" x2="200" y2="330" stroke="#c0392b" stroke-width="3.5"/>
  <!-- C2 : x + y = 2 -->
  <line x1="50" y1="60" x2="350" y2="360" stroke="#1e8449" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="200" cy="210" r="5" fill="#1e8449"/>
  <!-- légendes -->
  <text x="120" y="290" fill="#2a5d9f">D</text>
  <text x="236" y="378" fill="#c0392b">C₁ : x + y = 1</text>
  <text x="300" y="282" fill="#1e8449">C₂ : x + y = 2</text>
  <text x="208" y="200" fill="#1e8449">(1, 1)</text>
  <text x="18" y="160" fill="#c0392b" font-size="13">D ∩ C₁ : segment</text>
</svg>
