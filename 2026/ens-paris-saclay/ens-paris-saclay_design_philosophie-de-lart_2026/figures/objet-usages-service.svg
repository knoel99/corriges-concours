<svg xmlns="http://www.w3.org/2000/svg" width="900" height="245" viewBox="0 0 900 245" role="img"><title>Nombre de bouteilles pour un service fixé</title><rect width="900" height="245" fill="#faf9f4"/><text x="450" y="30" font-weight="700" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23">Cent livraisons d’un litre, deux scénarios illustratifs</text><rect x="23" y="53" width="413" height="113" rx="6" fill="#e3eee8"/><rect x="464" y="53" width="413" height="113" rx="6" fill="#f3e8d4"/><text x="230" y="83" font-weight="700" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20">Cinq utilisations par bouteille</text><text x="670" y="83" font-weight="700" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="20">Deux utilisations par bouteille</text><text x="230" y="122" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23">100 ÷ 5 = 20 bouteilles</text><text x="670" y="122" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="23">100 ÷ 2 = 50 bouteilles</text><text x="450" y="197" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17">Une utilisation correspond à un remplissage suivi d’une livraison.</text><text x="450" y="226" font-weight="400" fill="#163945" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17">Restent à comparer la fabrication, les retours, le lavage et les pertes.</text></svg>
