<svg xmlns="http://www.w3.org/2000/svg" width="840" height="233" viewBox="0 0 840 233" role="img" aria-labelledby="titre description"><title id="titre">Trois objets de comparaison</title><desc id="description">À Pessac, une même longueur revient dans le plan. Aux maisons Jaoul, la voûte de brique repose sur le béton. À Boisbuchet, des maquettes à la même échelle permettent de comparer des habitats.</desc><defs><marker id="a" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65639"/></marker></defs><g font-family="DejaVu Sans, sans-serif">
