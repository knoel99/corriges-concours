<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1260 891" role="img"><title>esquisse — Ce que les essais décideront</title><rect x="0" y="0" width="1260" height="891" fill="#faf8f0" stroke="none" stroke-width="1" /><line x1="54" y1="110" x2="1206" y2="110" stroke="#172c35" stroke-width="3" fill="none" /><text x="54" y="83" fill="#172c35" font-size="32" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">ESQUISSE</text><text x="1206" y="82" fill="#617174" font-size="27" font-weight="normal" text-anchor="end" font-family="DejaVu Sans">9 / 9</text><text x="54" y="184" fill="#172c35" font-size="54" font-weight="normal" text-anchor="start" font-family="DejaVu Serif">Ce que les essais décideront</text><text x="54" y="248" fill="#26736c" font-size="23" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Une observation par personne et par situation</text><rect x="65" y="302" width="344" height="313" fill="#e4ebe1" stroke="#172c35" stroke-width="1.5" /><text x="87" y="357" fill="#225975" font-size="32" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Voir</text><path d="M 133 442 Q 194 385 269 442 Q 204 490 133 442" stroke="#225975" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="204" cy="441" r="18" fill="#225975" stroke="none" stroke-width="1" /><text x="87" y="514" fill="#172c35" font-size="20" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">6 m · dans le hall</text><text x="87" y="555" fill="#172c35" font-size="19" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Noter direction, hésitation</text><text x="87" y="580" fill="#172c35" font-size="19" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">et premier mot lu.</text><rect x="455" y="302" width="344" height="313" fill="#e4ebe1" stroke="#172c35" stroke-width="1.5" /><text x="477" y="357" fill="#225975" font-size="32" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Toucher</text><path d="M 497.00,472.00 L 516.00,419.00 L 533.00,472.00" stroke="#26736c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 536.00,472.00 L 555.00,419.00 L 572.00,472.00" stroke="#26736c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 575.00,472.00 L 594.00,419.00 L 611.00,472.00" stroke="#26736c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 614.00,472.00 L 633.00,419.00 L 650.00,472.00" stroke="#26736c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 653.00,472.00 L 672.00,419.00 L 689.00,472.00" stroke="#26736c" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="477" y="514" fill="#172c35" font-size="20" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">30 cm · à la table</text><text x="477" y="555" fill="#172c35" font-size="19" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Décrire le sens sans suivre</text><text x="477" y="580" fill="#172c35" font-size="19" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">le regard d’autrui.</text><rect x="844" y="302" width="344" height="313" fill="#e4ebe1" stroke="#172c35" stroke-width="1.5" /><text x="866" y="357" fill="#225975" font-size="32" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Remplacer</text><rect x="892" y="423" width="160" height="15" fill="#617174" stroke="none" stroke-width="1" /><path d="M 930 460 l 0 -36 l 20 -25 l 20 25 l 0 36" stroke="#225975" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="989" y1="456" x2="1058" y2="456" stroke="#a34731" stroke-width="3" fill="none" /><line x1="1058" y1="456" x2="1047.2473700296937" y2="461.32737728358626" stroke="#a34731" stroke-width="3" fill="none" /><line x1="1058" y1="456" x2="1047.2473700296937" y2="450.67262271641374" stroke="#a34731" stroke-width="3" fill="none" /><text x="866" y="514" fill="#172c35" font-size="20" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">1 bande · au revers</text><text x="866" y="555" fill="#172c35" font-size="19" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Compter gestes, temps et</text><text x="866" y="580" fill="#172c35" font-size="19" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">pièces à éliminer.</text><text x="66" y="665" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Après un échec de lecture, reprendre le contraste et</text><text x="66" y="696" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">le rapport point / intervalle.</text><text x="683" y="665" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Si le remplacement abîme le support,</text><text x="683" y="696" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">modifier la fente ou changer de fixation.</text><line x1="54" y1="736" x2="1206" y2="736" stroke="#172c35" stroke-width="2.4" fill="none" /><text x="54" y="778" fill="#172c35" font-size="25" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Arbitrage ouvert : conserver, combiner ou abandonner les trois hypothèses.</text><text x="54" y="819" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Une fiche par essai garde le contexte, la réponse et la difficulté. Les résultats appartiendront à</text><text x="54" y="848" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">l’expérimentation future.</text></svg>
