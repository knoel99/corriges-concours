<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1260 891" role="img"><title>esquisse — Changer une bande, conserver le cadre</title><rect x="0" y="0" width="1260" height="891" fill="#faf8f0" stroke="none" stroke-width="1" /><line x1="54" y1="110" x2="1206" y2="110" stroke="#172c35" stroke-width="3" fill="none" /><text x="54" y="83" fill="#172c35" font-size="32" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">ESQUISSE</text><text x="1206" y="82" fill="#617174" font-size="27" font-weight="normal" text-anchor="end" font-family="DejaVu Sans">7 / 9</text><text x="54" y="184" fill="#172c35" font-size="54" font-weight="normal" text-anchor="start" font-family="DejaVu Serif">Changer une bande, conserver le cadre</text><text x="54" y="247" fill="#26736c" font-size="23" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Hypothèse 2 · le relief guide la main et facilite la réparation</text><path d="M 122.00,383.00 L 432.00,383.00 L 378.00,513.00 L 68.00,513.00 Z" stroke="#172c35" stroke-width="2" fill="#d7ded2" stroke-linecap="round" stroke-linejoin="round" /><line x1="145" y1="407" x2="123" y2="467" stroke="#617174" stroke-width="4" fill="none" /><line x1="199" y1="407" x2="177" y2="467" stroke="#617174" stroke-width="4" fill="none" /><line x1="253" y1="407" x2="231" y2="467" stroke="#617174" stroke-width="4" fill="none" /><line x1="307" y1="407" x2="285" y2="467" stroke="#617174" stroke-width="4" fill="none" /><line x1="361" y1="407" x2="339" y2="467" stroke="#617174" stroke-width="4" fill="none" /><path d="M 245.00,344.00 L 568.00,344.00 L 514.00,457.00 L 191.00,457.00 Z" stroke="#26736c" stroke-width="2" fill="#acc8bd" stroke-linecap="round" stroke-linejoin="round" /><line x1="267" y1="367" x2="245" y2="425" stroke="#172c35" stroke-width="4" fill="none" /><line x1="322" y1="367" x2="300" y2="425" stroke="#172c35" stroke-width="4" fill="none" /><line x1="377" y1="367" x2="355" y2="425" stroke="#172c35" stroke-width="4" fill="none" /><line x1="432" y1="367" x2="410" y2="425" stroke="#172c35" stroke-width="4" fill="none" /><line x1="487" y1="367" x2="465" y2="425" stroke="#172c35" stroke-width="4" fill="none" /><path d="M 373.00,313.00 L 391.00,297.00 L 408.00,313.00 L 363.00,409.00 L 346.00,413.00" stroke="#225975" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 422.00,313.00 L 440.00,297.00 L 457.00,313.00 L 412.00,409.00 L 395.00,413.00" stroke="#225975" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 471.00,313.00 L 489.00,297.00 L 506.00,313.00 L 461.00,409.00 L 444.00,413.00" stroke="#225975" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 520.00,313.00 L 538.00,297.00 L 555.00,313.00 L 510.00,409.00 L 493.00,413.00" stroke="#225975" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 569.00,313.00 L 587.00,297.00 L 604.00,313.00 L 559.00,409.00 L 542.00,413.00" stroke="#225975" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="433" y1="264" x2="433" y2="300" stroke="#a34731" stroke-width="2.7" fill="none" /><line x1="433" y1="300" x2="427.67262271641374" y2="289.2473700296937" stroke="#a34731" stroke-width="2.7" fill="none" /><line x1="433" y1="300" x2="438.32737728358626" y2="289.2473700296937" stroke="#a34731" stroke-width="2.7" fill="none" /><line x1="530" y1="345" x2="574" y2="324" stroke="#a34731" stroke-width="2.7" fill="none" /><line x1="574" y1="324" x2="566.590614358464" y2="333.43933283738846" stroke="#a34731" stroke-width="2.7" fill="none" /><line x1="574" y1="324" x2="562.0012963325241" y2="323.82361887827625" stroke="#a34731" stroke-width="2.7" fill="none" /><text x="604" y="318" fill="#a34731" font-size="19" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">1. Plier la chute de coton</text><text x="604" y="379" fill="#a34731" font-size="19" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">2. Passer les retours en fente</text><text x="604" y="440" fill="#a34731" font-size="19" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">3. Bloquer au revers</text><text x="75" y="572" fill="#172c35" font-size="22" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Coupe de principe</text><rect x="313" y="550" width="262" height="11" fill="#172c35" stroke="none" stroke-width="1" /><path d="M 332 579 l 0 -27 l 24 -42 l 25 42 l 0 27" stroke="#225975" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="320" y1="572" x2="398" y2="572" stroke="#a34731" stroke-width="5" fill="none" /><text x="302" y="610" fill="#617174" font-size="19" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">clé de retenue amovible au dos</text><text x="704" y="540" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Éprouvettes à comparer : coton replié,</text><text x="704" y="569" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">bande plate et petite surface céramique</text><text x="704" y="598" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">striée. Même motif, toucher différent.</text><line x1="54" y1="736" x2="1206" y2="736" stroke="#172c35" stroke-width="2.4" fill="none" /><text x="54" y="778" fill="#172c35" font-size="25" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Le volume tactile doit pouvoir être remis en état.</text><text x="54" y="819" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Comparer à plat trois matières. Ne retenir pour le panneau qu’un relief confortable, nettoyable et</text><text x="54" y="848" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">remplaçable sans jeter le support.</text></svg>
