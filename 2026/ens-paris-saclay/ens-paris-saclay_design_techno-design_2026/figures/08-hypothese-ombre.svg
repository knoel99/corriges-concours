 x="1024" y="584" fill="#172c35" font-size="21" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans">Lumière rasante inversée</text><text x="74" y="644" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Comparer de jour et en fin d’après-midi. Garder le</text><text x="74" y="675" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">même relief et relever le sens indiqué.</text><text x="683" y="644" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Témoin constant : mot et flèche imprimés</text><text x="683" y="675" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">contrastés, lisibles quand l’ombre change.</text><line x1="54" y1="736" x2="1206" y2="736" stroke="#172c35" stroke-width="2.4" fill="none" /><text x="54" y="778" fill="#172c35" font-size="25" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Le test porte sur une aide facultative à la lecture.</text><text x="54" y="819" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Un éclairage ajouté mobiliserait une source, du câblage et de l’entretien. La première exploration</text><text x="54" y="848" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">utilise la lumière existante.</text></svg>
