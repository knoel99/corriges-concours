<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1260 891" role="img"><title>esquisse — Deux usages dans le même hall</title><rect x="0" y="0" width="1260" height="891" fill="#faf8f0" stroke="none" stroke-width="1" /><line x1="54" y1="110" x2="1206" y2="110" stroke="#172c35" stroke-width="3" fill="none" /><text x="54" y="83" fill="#172c35" font-size="32" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">ESQUISSE</text><text x="1206" y="82" fill="#617174" font-size="27" font-weight="normal" text-anchor="end" font-family="DejaVu Sans">5 / 9</text><text x="54" y="184" fill="#172c35" font-size="54" font-weight="normal" text-anchor="start" font-family="DejaVu Serif">Deux usages dans le même hall</text><text x="54" y="247" fill="#26736c" font-size="23" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Médiathèque · jour d’atelier</text><text x="822" y="247" fill="#26736c" font-size="23" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Vue sur le seuil</text><rect x="72" y="297" width="645" height="301" fill="#faf8f0" stroke="#172c35" stroke-width="5" /><line x1="350" y1="297" x2="350" y2="384" stroke="#172c35" stroke-width="5" fill="none" /><line x1="350" y1="469" x2="350" y2="598" stroke="#172c35" stroke-width="5" fill="none" /><line x1="568" y1="297" x2="568" y2="396" stroke="#172c35" stroke-width="5" fill="none" /><rect x="66" y="427" width="14" height="86" fill="#faf8f0" stroke="none" stroke-width="1" /><rect x="486" y="402" width="70" height="21" fill="#225975" stroke="none" stroke-width="1" /><text x="497" y="385" fill="#225975" font-size="17" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">panneau</text><line x1="109" y1="490" x2="253" y2="442" stroke="#a34731" stroke-width="4" fill="none" /><line x1="253" y1="442" x2="244.48382415417035" y2="450.4542740056676" stroke="#a34731" stroke-width="4" fill="none" /><line x1="253" y1="442" x2="241.11449491993568" y2="440.3462863029637" stroke="#a34731" stroke-width="4" fill="none" /><line x1="264" y1="438" x2="376" y2="430" stroke="#a34731" stroke-width="4" fill="none" /><line x1="376" y1="430" x2="365.6542556056854" y2="436.0799319837896" stroke="#a34731" stroke-width="4" fill="none" /><line x1="376" y1="430" x2="364.89513577442915" y2="425.4522543462022" stroke="#a34731" stroke-width="4" fill="none" /><line x1="381" y1="430" x2="470" y2="422" stroke="#a34731" stroke-width="4" fill="none" /><line x1="470" y1="422" x2="459.76749049134685" y2="428.2686321598354" stroke="#a34731" stroke-width="4" fill="none" /><line x1="470" y1="422" x2="458.8136055848349" y2="417.6566625748898" stroke="#a34731" stroke-width="4" fill="none" /><rect x="200" y="335" width="72" height="14" fill="#dbe8e2" stroke="#617174" stroke-width="1.5" /><rect x="200" y="375" width="72" height="14" fill="#dbe8e2" stroke="#617174" stroke-width="1.5" /><rect x="610" y="475" width="72" height="14" fill="#dbe8e2" stroke="#617174" stroke-width="1.5" /><rect x="610" y="511" width="72" height="14" fill="#dbe8e2" stroke="#617174" stroke-width="1.5" /><text x="94" y="554" fill="#617174" font-size="19" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">entrée</text><text x="401" y="547" fill="#617174" font-size="19" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">atelier</text><rect x="849" y="321" width="293" height="213" fill="#e6eae1" stroke="#172c35" stroke-width="2" /><rect x="919" y="356" width="169" height="89" fill="#faf8f0" stroke="#225975" stroke-width="2" /><circle cx="948" cy="379" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="953" cy="384" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="958" cy="389" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="938" cy="394" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="943" cy="394" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="948" cy="394" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="953" cy="394" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="958" cy="394" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="963" cy="394" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="958" cy="399" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="953" cy="404" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><circle cx="948" cy="409" r="2.0" fill="#225975" stroke="none" stroke-width="1" /><text x="1001" y="405" fill="#172c35" font-size="12" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">ATELIER</text><circle cx="877" cy="424" r="11" fill="#172c35" stroke="none" stroke-width="1" /><line x1="877" y1="436" x2="877" y2="483" stroke="#172c35" stroke-width="5" fill="none" /><line x1="875" y1="449" x2="899" y2="455" stroke="#172c35" stroke-width="4" fill="none" /><line x1="863" y1="510" x2="1136" y2="510" stroke="#617174" stroke-width="1.5" fill="none" /><text x="72" y="652" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Une personne arrive avec un vêtement à reprendre.</text><text x="72" y="683" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Le choix de direction se fait avant le carrefour.</text><text x="820" y="630" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Une bénévole change le cartel</text><text x="820" y="661" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">quand la salle revient à la</text><text x="820" y="692" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">lecture.</text><line x1="54" y1="736" x2="1206" y2="736" stroke="#172c35" stroke-width="2.4" fill="none" /><text x="54" y="778" fill="#172c35" font-size="25" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Une décision pour le visiteur, un geste pour l’équipe.</text><text x="54" y="819" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Panneau de médiation fixé à l’entrée de la salle. Le parcours de circulation et la signalétique</text><text x="54" y="848" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">réglementaire restent dégagés.</text></svg>
