ht="normal" text-anchor="start" font-family="DejaVu Sans">La courbure distribue l’effet lumineux dans</text><text x="54" y="695" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">l’espace.</text><text x="675" y="664" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">La règle produit des surfaces différentes pour</text><text x="675" y="695" fill="#172c35" font-size="20" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">plusieurs supports.</text><line x1="54" y1="736" x2="1206" y2="736" stroke="#172c35" stroke-width="2.4" fill="none" /><text x="54" y="778" fill="#172c35" font-size="25" font-weight="bold" text-anchor="start" font-family="DejaVu Sans">Une variation perceptible peut coûter en lisibilité.</text><text x="54" y="819" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">Une lampe de galerie met en valeur la variation d’un objet ; une identité commandée par une</text><text x="54" y="848" fill="#617174" font-size="21" font-weight="normal" text-anchor="start" font-family="DejaVu Sans">entreprise doit rester reconnaissable entre affiche et sac.</text></svg>
