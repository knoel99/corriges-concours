<text x="121" y="95" fill="#203c3a" font-size="4" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">2 couchages</text>
<text x="121" y="105" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">0,95 × 2,00 m</text>
<text x="121" y="111" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Hauteur 0,48 m.</text>
<text x="121" y="117" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Au centre, passage</text>
<text x="121" y="123" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">et transfert latéral.</text>
<text x="121" y="129" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Banquette à bagages</text>
<text x="121" y="135" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">près de l’entrée.</text>
<text x="22" y="208" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">En retrait de la halte de jour, deux lits bas et un porche commun.</text>
<text x="22" y="215" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Panneaux opaques côté chemin, volets ajourés à claire-voie côté</text>
<text x="22" y="222" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">prairie. Une lumière basse balise le chemin vers le sanitaire.</text>
<text x="22" y="229" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">La poignée reste manœuvrable de l’intérieur, même sans clé.</text>
