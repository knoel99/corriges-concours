<title>Dormir à Limure, visiter Redon</title>
<rect x="0" y="0" width="420" height="297" fill="#fcfbf6" stroke="none" stroke-width="0.6"/>
<text x="12" y="12" fill="#306b69" font-size="3.1" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">LES PORTIQUES DU HALAGE</text>
<text x="408" y="12" fill="#306b69" font-size="3.1" font-family="DejaVu Sans" font-weight="bold" text-anchor="end">HALTES CYCLISTES   /   5 SUR 6</text>
<line x1="12" y1="17" x2="408" y2="17" stroke="#306b69" stroke-width="0.4" stroke-dasharray="none" stroke-linecap="round"/>
<text x="12" y="32" fill="#203c3a" font-size="9.3" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Dormir à Limure, visiter Redon</text>
<text x="12" y="42" fill="#506765" font-size="4.1" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Deux extensions de 4 × 4 m reprennent le toit, les poteaux et le repère coloré de la halte.</text>
