<text x="326" y="95" fill="#203c3a" font-size="4" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">4 vélos</text>
<text x="326" y="105" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">4 casiers à bagages.</text>
<text x="326" y="111" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Porte coulissante</text>
<text x="326" y="117" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">utile de 1,70 m.</text>
<text x="326" y="123" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Le cadre et une roue</text>
<text x="326" y="129" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">se verrouillent sur</text>
<text x="326" y="135" fill="#203c3a" font-size="3.4" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">le même arceau.</text>
<text x="227" y="208" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">La travée prolonge l’atelier urbain. Les parois en métal ajouré</text>
<text x="227" y="215" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">offrent une surveillance depuis la halte sans exposer les bagages.</text>
<text x="227" y="222" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Des consignes à code mécanique et des arceaux fixes permettent</text>
<text x="227" y="229" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">une visite à pied. La halte publique reste accessible toute la journée.</text>
<text x="12" y="275" fill="#203c3a" font-size="3.5" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Plans au 1:50 sur A3 original. La variante de nuit reste distincte du service de consigne et de ses horaires.</text>
</svg>
