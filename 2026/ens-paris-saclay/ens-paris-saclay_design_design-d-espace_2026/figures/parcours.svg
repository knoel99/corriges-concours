<text x="316" y="138.0" fill="#203c3a" font-size="3.18" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Le parvis ramène au halage.</text>
<text x="316" y="143.9" fill="#203c3a" font-size="3.18" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">À Redon, la visite continue à pied.</text>
<text x="12" y="178" fill="#306b69" font-size="4.6" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Une enveloppe locale</text>
<text x="12" y="188.0" fill="#203c3a" font-size="3.48" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Option retenue. Ossature bois boulonnée, couverture métallique légère,</text>
<text x="12" y="194.8" fill="#203c3a" font-size="3.48" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">remplissage de lattes vissées. Une joue pleine protège la table du vent ;</text>
<text x="12" y="201.6" fill="#203c3a" font-size="3.48" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">sa position dépend du relevé des vents et vues de chaque implantation.</text>
<text x="12" y="208.4" fill="#203c3a" font-size="3.48" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Option étudiée. Cadres en aluminium réemployé et toile tendue démontable.</text>
<text x="12" y="215.2" fill="#203c3a" font-size="3.48" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Plus légers à lever, ils exigent un retensionnement et offrent moins de</text>
<text x="12" y="222.0" fill="#203c3a" font-size="3.48" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">confort acoustique sous la pluie. Réserver la toile aux ombrages saisonniers.</text>
<text x="219" y="178" fill="#306b69" font-size="4.6" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Monter, entretenir, remonter</text>
<text x="219" y="188.0" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">1. Repérer emprise, arbres et réseaux ; isoler la zone de montage.</text>
<text x="219" y="194.8" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">2. Poser les appuis réglables, puis lever les portiques contreventés.</text>
<text x="219" y="201.6" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">3. Visser les cassettes du toit, les parois et le mobilier indépendant.</text>
<text x="219" y="208.4" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">4. Tester les écoulements, les éclairages et la charge avant ouverture.</text>
<text x="219" y="215.2" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">5. Débrancher, déposer les panneaux numérotés et stocker à plat.</text>
<text x="219" y="222.0" fill="#203c3a" font-size="3.45" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Aucun coulage en place dans les variantes de principe proposées.</text>
<line x1="12" y1="238" x2="408" y2="238" stroke="#306b69" stroke-width="0.4" stroke-dasharray="none" stroke-linecap="round"/>
<text x="12" y="249" fill="#306b69" font-size="3.8" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Eau et énergie</text>
<text x="12" y="258.0" fill="#203c3a" font-size="3.47" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Raccorder eau potable et prises protégées sur les sites desservis. En site isolé, prévoir réserve potable entretenue, sanitaire sec avec filière de collecte</text>
<text x="12" y="264.5" fill="#203c3a" font-size="3.47" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">et alimentation à dimensionner selon les charges demandées. Les eaux de toiture servent à l’infiltration, dans une noue à l’écart des circulations.</text>
</svg>
