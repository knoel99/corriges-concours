<text x="12" y="32" fill="#203c3a" font-size="9.3" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Un toit pour ralentir</text>
<text x="12" y="42" fill="#506765" font-size="4.1" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Un portique répétable forme une pièce ouverte entre la voie et le paysage.</text>
