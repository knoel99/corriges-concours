<text x="18" y="202" fill="#306b69" font-size="3.5" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Vue de principe  ·  trois travées de 4 mètres</text>
<text x="277" y="60" fill="#306b69" font-size="4.6" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Trois durées de halte</text>
<text x="277" y="70.0" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Cinq minutes. Remplir le bidon,</text>
<text x="277" y="75.7" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">regonfler une roue, repartir.</text>
<text x="277" y="81.4" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Une heure. Déjeuner à plusieurs,</text>
<text x="277" y="87.1" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">sécher une veste, charger le vélo.</text>
<text x="277" y="92.8" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Une nuit. Isoler deux couchages</text>
<text x="277" y="98.5" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">dans une variante à l’écart du flux.</text>
<text x="277" y="120" fill="#306b69" font-size="4.6" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Deux repères observables</text>
<text x="277" y="130.0" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Le préau d’école abrite une salle</text>
<text x="277" y="135.7" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">sans imposer une entrée unique.</text>
<text x="277" y="141.4" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Le chevalet de réparation porte</text>
<text x="277" y="147.1" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">le vélo et libère les deux mains.</text>
<text x="277" y="152.8" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Le projet associe ces principes</text>
<text x="277" y="158.5" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">sous une même ligne de toit.</text>
<text x="277" y="180" fill="#306b69" font-size="4.6" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">Situation de départ</text>
<text x="277" y="190.0" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Le chemin sert aussi aux piétons.</text>
<text x="277" y="195.7" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Les cycles quittent le halage avant</text>
<text x="277" y="201.4" fill="#203c3a" font-size="3.55" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">de stationner ou de faire la queue.</text>
<rect x="12" y="219" width="127" height="51" fill="#f2f0e7" stroke="none" stroke-width="0.6"/>
<text x="17" y="230" fill="#306b69" font-size="4.6" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">A · Banc continu</text>
<text x="17" y="240" fill="#203c3a" font-size="3.3" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Assise face au canal, pause immédiate.</text>
<text x="17" y="246" fill="#203c3a" font-size="3.3" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">L’averse et l’atelier restent sans abri.</text>
<rect x="146" y="219" width="127" height="51" fill="#f2f0e7" stroke="none" stroke-width="0.6"/>
<text x="151" y="230" fill="#306b69" font-size="4.6" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">B · Kiosque fermé</text>
<text x="151" y="240" fill="#203c3a" font-size="3.3" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Outils et bagages peuvent être gardés.</text>
<text x="151" y="246" fill="#203c3a" font-size="3.3" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Une façade unique concentre les flux.</text>
<rect x="280" y="219" width="127" height="51" fill="#f3e5cf" stroke="none" stroke-width="0.6"/>
<text x="285" y="230" fill="#306b69" font-size="4.6" font-family="DejaVu Sans" font-weight="bold" text-anchor="start">C · Portiques ouverts</text>
<text x="285" y="240" fill="#203c3a" font-size="3.3" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Les usages se partagent trois travées.</text>
<text x="285" y="246" fill="#203c3a" font-size="3.3" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Des parois locales règlent vent et intimité.</text>
</svg>
