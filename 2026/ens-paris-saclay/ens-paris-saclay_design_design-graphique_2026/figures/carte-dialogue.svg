<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 720 900" role="img" aria-labelledby="t d"><title id="t">Carte numérique · Dialogue</title><desc id="d">Deux fauteuils se font face. Entre eux, deux traits courbes se répondent. Une conversation qui peut attendre. Un proche ou un groupe peut vous écouter. Parler, écrire ou rester ensemble en silence : à vous de choisir.</desc><rect x="0" y="0" width="720" height="900" fill="#ed947d"/><text x="42" y="64" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold" fill="#162c30" letter-spacing="1.1">AFFECTIONS POST-COVID</text><text x="40" y="166" font-family="DejaVu Sans,sans-serif" font-size="94" font-weight="bold" fill="#162c30" letter-spacing="-4">Dialogue</text><text x="43" y="228" font-family="DejaVu Serif,serif" font-size="33" font-weight="normal" fill="#162c30">Une conversation qui peut attendre.</text><g transform="translate(15 274) scale(1.01)"><path d="M30 292 C150 288 221 301 336 295 S561 300 649 287" fill="none" stroke="#162c30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 278 Q308 247 659 273 Q377 301 32 288 Z" fill="#fff9e9"/><g transform="translate(69 51) scale(0.98 0.98)"><path d="M49 191 L61 187 51 239 41 240 Z M133 186 L145 185 167 232 157 236 Z" fill="#162c30"/><path d="M39 198 C24 166 14 98 17 54 C18 27 32 9 53 12 C77 15 86 40 87 70 L93 124 C111 116 140 114 158 123 C171 130 170 150 159 162 L125 185 C104 203 71 212 39 198 Z" fill="#162c30"/><path d="M35 77 C31 45 39 24 54 26 C69 29 75 46 75 72 L82 128 C69 133 58 138 49 145 Z" fill="#fff9e9"/><path d="M64 154 C84 138 119 124 145 130 C154 133 157 140 150 146 L118 168 C100 181 80 186 65 178 C55 172 55 162 64 154 Z" fill="#fff9e9"/><path d="M34 146 Q66 126 96 119 Q106 119 109 127 L107 134 Q79 142 49 159 Z" fill="#162c30"/><path d="M50 134 Q67 127 81 124" fill="none" stroke="#fff9e9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(610 5