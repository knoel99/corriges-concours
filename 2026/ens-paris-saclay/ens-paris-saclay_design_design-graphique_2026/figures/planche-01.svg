<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 792 1120" role="img" aria-labelledby="t d"><title id="t">Planche 01 · Laisser une place</title><desc id="d">Un fauteuil disponible rend visibles trois façons d’être auprès de quelqu’un.</desc><rect x="0" y="0" width="792" height="1120" fill="#fff9e9"/><text x="46" y="59" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#162c30" letter-spacing="1">PROJET GRAPHIQUE  /  AFFECTIONS POST-COVID</text><text x="43" y="137" font-family="DejaVu Sans,sans-serif" font-size="52" font-weight="bold" fill="#162c30" letter-spacing="-2">Laisser une place</text><text x="46" y="193" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">Un fauteuil disponible rend visibles trois façons d’être</text><text x="46" y="227" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">auprès de quelqu’un.</text><path d="M46 272 H744" fill="none" stroke="#3b7474" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="313" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#3b7474">A</text><text x="111" y="317" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#162c30">Dans une salle d’attente</text><text x="111" y="357" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">Depuis la porte, lire le nom de la pratique. Une fois</text><text x="111" y="389" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">assis, retrouver une voix, une proposition et une</text><text x="111" y="421" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">adresse à consulter plus tard.</text><path d="M46 506 H744" fill="none" stroke="#3b7474" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="547" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#3b7474">B</text><text x="111" y="551" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#162c30">Depuis chez soi</text><text x="111" y="591" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">Recevoir une carte séparément. Le sujet et la</text><text x="111" y="623" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">ressource doivent rester compréhensibles, même si</text><text x="111" y="655" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">personne ne fait défiler la suite.</text><path d="M46 735 H744" fill="none" stroke="#3b7474" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="776" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#3b7474">C</text><text x="111" y="780" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#162c30">Pour l’entourage</text><text x="111" y="820" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">L’écoute et l’aide concrète occupent une place dans</text><text x="111" y="852" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">chaque message. La personne concernée garde le</text><text x="111" y="884" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">choix du moment et de la forme du soutien.</text><path d="M47 1048 H745" fill="none" stroke="#162c30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="1092" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" fill="#162c30">Dossier de projet</text><text x="662" y="1092" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#162c30">01 / 07</text></svg>
