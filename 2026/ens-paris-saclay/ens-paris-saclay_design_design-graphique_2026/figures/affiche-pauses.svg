<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 792 1120" role="img" aria-labelledby="t d"><title id="t">Affiche A3 · Pauses</title><desc id="d">Un fauteuil de profil accueille un livre posé, auprès d’une tasse. « Ce que je faisais en une heure, je le fais désormais en deux ou en trois. » Une pause avant ou après une activité peut aider à préserver vos forces. Une autre personne peut prendre le relais, si vous le souhaitez.</desc><rect x="0" y="0" width="792" height="1120" fill="#fff9e9"/><rect x="0" y="0" width="792" height="654" fill="#f6d896"/><text x="51" y="60" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#162c30" letter-spacing="1.5">AFFECTIONS POST-COVID</text><text x="48" y="178" font-family="DejaVu Sans,sans-serif" font-size="109" font-weight="bold" fill="#162c30" letter-spacing="-5">Pauses</text><text x="53" y="235" font-family="DejaVu Serif,serif" font-size="29" font-weight="normal" fill="#162c30">Faire une pause, à votre rythme.</text><g transform="translate(4 278) scale(1.15)"><path d="M30 292 C150 288 221 301 336 295 S561 300 649 287" fill="none" stroke="#162c30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 264 C133 248 436 242 609 269 C543 290 129 292 38 272 Z" fill="#fff9e9"/><g transform="translate(107 5) scale(1.17 1.17)"><path d="M49 191 L61 187 51 239 41 240 Z M133 186 L145 185 167 232 157 236 Z" fill="#162c30"/><path d="M39 198 C24 166 14 98 17 54 C18 27 32 9 53 12 C77 15 86 40 87 70 L93 124 C111 116 140 114 158 123 C171 130 170 150 159 162 L125 185 C104 203 71 212 39 198 Z" fill="#162c30"/><path d="M35 77 C31 45 39 24 54 26 C69 29 75 46 75 72 L82 128 C69 133 58 138 49 145 Z" fill="#fff9e9"/><path d="M64 154 C84 138 119 124 145 130 C154 133 157 140 150 146 L118 168 C100 181 80 186 65 178 C55 172 55 162 64 154 Z" fill="#fff9e9"/><path d="M34 146 Q66 126 96 119 Q106 119 109 127 L107 134 Q79 142 49 159 Z" fill="#162c30"/><path d="M50 134 Q67 127 81 124" fill="none" stroke="#fff9e9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M335 243 L508 240 511 248 335 251 Z M353 247 L361 247 352 288 346 288 Z M489 247 L497 247 507 285 500 286 Z" fill="#162c30"/><path d="M356 233 L408 225 456 230 401 240 Z" fill="#fff9e9" stroke="#162c30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M356 235 L403 240 455 232" fill="none" stroke="#162c30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 203 Q468 197 487 203 L484 225 Q469 235 455 227 Z" fill="#3b7474" stroke="#162c30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M487 205 Q506 198 503 211 Q500 219 486 218" fill="none" stroke="#162c30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M463 190 Q455 179 463 172 M477 188 Q470 177 480 165" fill="none" stroke="#162c30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M51 696 L135 696" fill="none" stroke="#3b7474" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="51" y="754" font-family="DejaVu Serif,serif" font-size="31" font-weight="normal" fill="#162c30">« Ce que je faisais en une heure, je le fais</text><text x="51" y="794" font-family="DejaVu Serif,serif" font-size="31" font-weight="normal" fill="#162c30">désormais en deux ou en trois. »</text><text x="51" y="868" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="normal" fill="#162c30">Une pause avant ou après une activité peut aider à</text><text x="51" y="902" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="normal" fill="#162c30">préserver vos forces. Une autre personne peut</text><text x="51" y="936" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="normal" fill="#162c30">prendre le relais, si vous le souhaitez.</text><path d="M51 1012 H741" fill="none" stroke="#162c30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="51" y="1050" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" fill="#162c30">Des ressources pour vous et vos proches</text><text x="51" y="1092" font-family="DejaVu Sans,sans-serif" font-size="33" font-weight="bold" fill="#162c30">apresj20.fr</text><text x="668" y="1088" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#162c30">03 / 07</text></svg>
