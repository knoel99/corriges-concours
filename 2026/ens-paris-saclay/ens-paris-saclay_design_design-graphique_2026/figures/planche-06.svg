<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 792 1120" role="img" aria-labelledby="t d"><title id="t">Planche 06 · Du mur au téléphone</title><desc id="d">La carte porte d’abord une proposition brève. La légende accueille ensuite le témoignage et les ressources.</desc><rect x="0" y="0" width="792" height="1120" fill="#fff9e9"/><text x="46" y="59" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#162c30" letter-spacing="1">PROJET GRAPHIQUE  /  AFFECTIONS POST-COVID</text><text x="43" y="137" font-family="DejaVu Sans,sans-serif" font-size="52" font-weight="bold" fill="#162c30" letter-spacing="-2">Du mur au téléphone</text><text x="46" y="193" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">La carte porte d’abord une proposition brève. La</text><text x="46" y="227" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">légende accueille ensuite le témoignage et les</text><text x="46" y="261" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">ressources.</text><g transform="translate(47 323) scale(.31)"><rect x="0" y="0" width="720" height="900" fill="#f6d896"/><text x="42" y="64" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="bold" fill="#162c30" letter-spacing="1.1">AFFECTIONS POST-COVID</text><text x="40" y="166" font-family="DejaVu Sans,sans-serif" font-size="94" font-weight="bold" fill="#162c30" letter-spacing="-4">Pauses</text><text x="43" y="228" font-family="DejaVu Serif,serif" font-size="33" font-weight="normal" fill="#162c30">Faire une pause, à votre rythme.</text><g transform="translate(15 274) scale(1.01)"><path d="M30 292 C150 288 221 301 336 295 S561 300 649 287" fill="none" stroke="#162c30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 264 C133 248 436 242 609 269 C543 290 129 292 38 272 Z" fill="#fff9e9"/><g transform="translate(107 5) scale(1.1