<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 792 1120" role="img" aria-labelledby="t d"><title id="t">Affiche A3 · Sérénité</title><desc id="d">Un fauteuil et une petite plante partagent un large cercle de lumière. « Je suis un poids pour ma famille, j’en ai marre de ne pas pouvoir aider. » Vos symptômes sont réels. Si l’inquiétude pèse, un proche ou un professionnel peut vous accompagner.</desc><rect x="0" y="0" width="792" height="1120" fill="#fff9e9"/><rect x="0" y="0" width="792" height="654" fill="#c5d996"/><text x="51" y="60" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" fill="#162c30" letter-spacing="1.5">AFFECTIONS POST-COVID</text><text x="48" y="178" font-family="DejaVu Sans,sans-serif" font-size="109" font-weight="bold" fill="#162c30" letter-spacing="-5">Sérénité</text><text x="53" y="235" font-family="DejaVu Serif,serif" font-size="29" font-weight="normal" fill="#162c30">Du soutien, même les jours difficiles.</text><g transform="translate(4 278) scale(1.15)"><path d="M30 292 C150 288 221 301 336 295 S561 300 649 287" fill="none" stroke="#162c30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="370" cy="153" r="126" fill="#fff9e9"/><path d="M57 279 Q296 255 618 273 Q405 300 66 290 Z" fill="#fff9e9"/><g transform="translate(264 14) scale(1.11 1.11)"><path d="M49 191 L61 187 51 239 41 240 Z M133 186 L145 185 167 232 157 236 Z" fill="#162c30"/><path d="M39 198 C24 166 14 98 17 54 C18 27 32 9 53 12 C77 15 86 40 87 70 L93 124 C111 116 140 114 158 123 C171 130 170 150 159 162 L125 185 C104 203 71 212 39 198 Z" fill="#162c30"/><path d="M35 77 C31 45 39 24 54 26 C69 29 75 46 75 72 L82 128 C69 133 58 138 49 145 Z" fill="#ed947d"/><path d="M64 154 C84 138 119 124 145 130 C154 133 157 140 150 146 L118 168 C100 181 80 186 65 178 C55 172 55 162 64 154 Z" fill="#ed947d"/><path d="M34 146 Q66 126 96 119 Q106 119 109 127 L107 134 Q79 142 49 159 Z" fill="#162c30"/><path d="M50 134 Q6