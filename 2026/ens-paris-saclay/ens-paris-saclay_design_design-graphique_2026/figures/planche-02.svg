<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 792 1120" role="img" aria-labelledby="t d"><title id="t">Planche 02 · Trois essais de signe</title><desc id="d">Choisir l’image par ce qu’elle fait comprendre à première vue, puis éprouver ce choix sur les trois sujets.</desc><rect x="0" y="0" width="792" height="1120" fill="#fff9e9"/><text x="46" y="59" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#162c30" letter-spacing="1">PROJET GRAPHIQUE  /  AFFECTIONS POST-COVID</text><text x="43" y="137" font-family="DejaVu Sans,sans-serif" font-size="52" font-weight="bold" fill="#162c30" letter-spacing="-2">Trois essais de signe</text><text x="46" y="193" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">Choisir l’image par ce qu’elle fait comprendre à</text><text x="46" y="227" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">première vue, puis éprouver ce choix sur les trois</text><text x="46" y="261" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">sujets.</text><rect x="45" y="285" width="209" height="185" fill="#f6d896"/><rect x="77" y="344" width="135" height="65" rx="8" fill="none" stroke="#162c30" stroke-width="5"/><rect x="212" y="366" width="9" height="23" fill="#162c30"/><rect x="90" y="356" width="37" height="40" fill="#3b7474"/><text x="278" y="329" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="bold" fill="#162c30">La jauge</text><text x="280" y="374" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">Une batterie indique un niveau</text><text x="280" y="405" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">mesurable. Elle risque de transformer</text><text x="280" y="436" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">une fatigue fluctuante en score ou en</text><text x="280" y="467" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">objectif.</text><rect x="45" y="533" width="209" height="185" fill="#ed947d"/><path d="M67 670 L106 643 L138 659 L177 608 L221 584" fill="none" stroke="#162c30" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="278" y="577" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="bold" fill="#162c30">La courbe</text><text x="280" y="622" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">Une ligne ascendante évoque un</text><text x="280" y="653" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">progrès continu. Le tracé contredit ici</text><text x="280" y="684" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">les journées inégales que raconte</text><text x="280" y="715" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">l’annexe.</text><rect x="45" y="781" width="209" height="185" fill="#c5d996"/><g transform="translate(89 788) scale(0.73 0.73)"><path d="M49 191 L61 187 51 239 41 240 Z M133 186 L145 185 167 232 157 236 Z" fill="#162c30"/><path d="M39 198 C24 166 14 98 17 54 C18 27 32 9 53 12 C77 15 86 40 87 70 L93 124 C111 116 140 114 158 123 C171 130 170 150 159 162 L125 185 C104 203 71 212 39 198 Z" fill="#162c30"/><path d="M35 77 C31 45 39 24 54 26 C69 29 75 46 75 72 L82 128 C69 133 58 138 49 145 Z" fill="#fff9e9"/><path d="M64 154 C84 138 119 124 145 130 C154 133 157 140 150 146 L118 168 C100 181 80 186 65 178 C55 172 55 162 64 154 Z" fill="#fff9e9"/><path d="M34 146 Q66 126 96 119 Q106 119 109 127 L107 134 Q79 142 49 159 Z" fill="#162c30"/><path d="M50 134 Q67 127 81 124" fill="none" stroke="#fff9e9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="278" y="825" font-family="DejaVu Sans,sans-serif" font-size="32" font-weight="bold" fill="#162c30">Le fauteuil</text><text x="280" y="870" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">Une forme familière reste identifiable</text><text x="280" y="901" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">sans visage ni diagnostic figuré. Son</text><text x="280" y="932" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">voisinage raconte du repos, de la</text><text x="280" y="963" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="normal" fill="#162c30">compagnie ou du soutien.</text><path d="M47 1048 H745" fill="none" stroke="#162c30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="1092" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" fill="#162c30">Dossier de projet</text><text x="662" y="1092" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#162c30">02 / 07</text></svg>
