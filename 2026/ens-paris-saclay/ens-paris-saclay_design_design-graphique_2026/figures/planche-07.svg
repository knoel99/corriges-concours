<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 792 1120" role="img" aria-labelledby="t d"><title id="t">Planche 07 · Préparer la diffusion</title><desc id="d">Le même projet doit rester utilisable sur un mur, dans une publication partagée et lorsqu’une personne préfère lire le texte seul.</desc><rect x="0" y="0" width="792" height="1120" fill="#fff9e9"/><text x="46" y="59" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#162c30" letter-spacing="1">PROJET GRAPHIQUE  /  AFFECTIONS POST-COVID</text><text x="43" y="137" font-family="DejaVu Sans,sans-serif" font-size="52" font-weight="bold" fill="#162c30" letter-spacing="-2">Préparer la diffusion</text><text x="46" y="193" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">Le même projet doit rester utilisable sur un mur, dans</text><text x="46" y="227" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">une publication partagée et lorsqu’une personne</text><text x="46" y="261" font-family="DejaVu Serif,serif" font-size="25" font-weight="normal" fill="#162c30">préfère lire le texte seul.</text><path d="M46 278 H744" fill="none" stroke="#3b7474" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="319" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#3b7474">A</text><text x="111" y="323" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#162c30">Imprimer</text><text x="111" y="363" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">A3 vertical, papier mat. Conserver les marges</text><text x="111" y="395" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">intérieures, répéter le titre et l’adresse, vérifier la</text><text x="111" y="427" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">lisibilité sur une sortie à taille réelle.</text><path d="M46 524 H744" fill="none" stroke="#3b7474" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="565" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#3b7474">B</text><text x="111" y="569" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#162c30">Partager</text><text x="111" y="609" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">Exporter chaque carte en 1 080 × 1 350 pixels.</text><text x="111" y="641" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">Publier en carrousel sans son ni défilement imposé,</text><text x="111" y="673" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">avec une légende et trois textes alternatifs.</text><path d="M46 772 H744" fill="none" stroke="#3b7474" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="813" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="#3b7474">C</text><text x="111" y="817" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#162c30">Faire relire</text><text x="111" y="857" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">Demander à une personne concernée et à un</text><text x="111" y="889" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">proche ce que propose chaque image, quelle</text><text x="111" y="921" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="normal" fill="#162c30">phrase pourrait culpabiliser et où chercher de l’aide.</text><path d="M47 1048 H745" fill="none" stroke="#162c30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="1092" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="normal" fill="#162c30">Dossier de projet</text><text x="662" y="1092" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="bold" fill="#162c30">07 / 07</text></svg>
