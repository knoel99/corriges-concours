<svg xmlns="http://www.w3.org/2000/svg" width="780" height="295" viewBox="0 0 780 295" role="img" aria-labelledby="t d"><title id="t">Du prix de vente au résultat unitaire</title><desc id="d">La Demoiselle est vendue sous son coût complet, le Pébroque le dépasse.</desc><rect width="100%" height="100%" fill="#fcfbf6"/><g font-family="DejaVu Sans,sans-serif" fill="#193d4a"><text x="22" y="33" font-size="22" font-weight="bold">Du prix de vente au résultat unitaire</text><text x="22" y="59" font-size="16">Coût complet et prix HT, en euros par parapluie.</text><rect x="27" y="85" width="17" height="13" fill="#316b77"/><text x="53" y="97" font-size="16">Coût complet</text><rect x="220" y="85" width="17" height="13" fill="#ab592e"/><text x="247" y="97" font-size="16">Prix de vente HT</text><text x="22" y="139" font-size="16">Demoiselle</text><rect x="140" y="122" width="312.76007" height="15" fill="#316b77"/><text x="463.76007" y="135" font-size="16">215,70</text><rect x="140" y="143" width="302.0833333333333" height="15" fill="#ab592e"/><text x="453.0833333333333" y="157" font-size="16">208,33</text><text x="140" y="181" font-size="16">Perte unitaire de 7,36 €</text><text x="22" y="231" font-size="16">Pébroque</text><rect x="140" y="214" width="347.30530500000003" height="15" fill="#316b77"/><text x="498.30530500000003" y="227" font-size="16">239,52</text><rect x="140" y="235" width="410.83333333333337" height="15" fill="#ab592e"/><text x="561.8333333333334" y="249" font-size="16">283,33</text><text x="140" y="273" font-size="16">Gain unitaire de 43,81 €</text></g></svg>
