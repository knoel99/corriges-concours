<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Attribuer une interprétation</title>
<desc id="description">Film Un record de recettes Qui interprète le palais ? IA Un élève parle après les cours Pourquoi écrit-il à la machine ? Deux articles Le journaliste choisit une voix Qu’est-ce que cette voix établit ?</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Attribuer une interprétation</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Sujet</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Observation</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question d’entretien</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Film</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un record de recettes</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Qui interprète le palais ?</text>
<rect x="10" y="137" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">IA</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Un élève parle après les</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">cours</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Pourquoi écrit-il à la</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">machine ?</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Deux articles</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Le journaliste choisit une</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">voix</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Qu’est-ce que cette voix</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">établit ?</text>
</g>
</svg>
