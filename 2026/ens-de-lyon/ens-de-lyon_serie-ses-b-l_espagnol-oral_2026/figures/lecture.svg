<svg xmlns="http://www.w3.org/2000/svg" width="720" height="431" viewBox="0 0 720 431" role="img" aria-labelledby="titre description">
<title id="titre">Cinco artículos, cinco distinciones para el comentario</title>
<desc id="description">Molina Ingreso y expectativa de movilidad La vivienda afecta a la legitimidad política. Sanhueza Aplazar y revocar El futuro del lugar depende de un acto jurídico. Munárriz Religiosidad e identidad electoral Los porcentajes dependen del grupo observado. Romero y Cabrera Explorar y explotar La legitimidad social y la prueba técnica difieren. Vera Asilo y solicitud de apatridia Una distinción jurídica tiene efectos desiguales.</desc>
<rect width="720" height="431" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Cinco artículos, cinco distinciones para el comentario</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Artículo</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Distinción decisiva</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué permite entender</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Molina</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Ingreso y expectativa de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">movilidad</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La vivienda afecta a la</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">legitimidad política.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Sanhueza</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Aplazar y revocar</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">El futuro del lugar depende</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">de un acto jurídico.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Munárriz</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Religiosidad e identidad</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">electoral</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Los porcentajes dependen</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">del grupo observado.</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Romero y Cabrera</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Explorar y explotar</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">La legitimidad social y la</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">prueba técnica difieren.</text>
<rect x="10" y="360" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="385" font-size="15" font-weight="700" fill="#162d3b">Vera</text>
<text x="229" y="385" font-size="15" font-weight="400" fill="#162d3b">Asilo y solicitud de</text>
<text x="229" y="407" font-size="15" font-weight="400" fill="#162d3b">apatridia</text>
<text x="473" y="385" font-size="15" font-weight="400" fill="#162d3b">Una distinción jurídica</text>
<text x="473" y="407" font-size="15" font-weight="400" fill="#162d3b">tiene efectos desiguales.</text>
</g>
</svg>
