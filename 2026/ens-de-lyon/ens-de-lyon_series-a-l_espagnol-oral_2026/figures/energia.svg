<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Del precio del crudo al gasto local</title>
<desc id="description">Electricidad renovable Porcentaje de la generación. La energía final tiene otro denominador. Aviación Coste del combustible y del billete. El turista puede limitar sus viajes. Economía del destino Noches, consumo y actividad. Una variación de precio llega al sector local.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Del precio del crudo al gasto local</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Paso</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Variable</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué hay que explicar</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Electricidad</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">renovable</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Porcentaje de la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">generación.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La energía final tiene otro</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">denominador.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Aviación</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Coste del combustible y</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">del billete.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">El turista puede limitar</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">sus viajes.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Economía del destino</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Noches, consumo y</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">actividad.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Una variación de precio</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">llega al sector local.</text>
</g>
</svg>
