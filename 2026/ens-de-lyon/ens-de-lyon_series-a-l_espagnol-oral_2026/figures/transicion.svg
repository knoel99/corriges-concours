<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Dos miradas sobre la Transición</title>
<desc id="description">Constitución de 1978 Una nueva norma jurídica. Cercas fija un comienzo legal. Congreso, 23-F Tres hombres asumen un riesgo. Cercas señala un comienzo simbólico. Calle, 27 de febrero La multitud defiende la democracia. Gustrán destaca la acción colectiva.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Dos miradas sobre la Transición</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Referencia</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qué se observa</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Función en el argumento</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Constitución de 1978</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Una nueva norma jurídica.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Cercas fija un comienzo</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">legal.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Congreso, 23-F</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Tres hombres asumen un</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">riesgo.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Cercas señala un comienzo</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">simbólico.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Calle, 27 de febrero</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">La multitud defiende la</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">democracia.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Gustrán destaca la acción</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">colectiva.</text>
</g>
</svg>
