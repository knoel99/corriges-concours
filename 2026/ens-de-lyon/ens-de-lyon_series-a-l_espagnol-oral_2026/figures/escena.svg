<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Qué transforma la acción en escena</title>
<desc id="description">El disco se atasca. Paulino se vuelve hacia la gramola. Un fallo suena como una llamada. Suena el pasodoble. Carmela baila con su abanico. Un personaje vuelve en un tiempo distinto. La música se apaga. El baile se interrumpe. La distancia entre ambos se oye en el diálogo.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qué transforma la acción en escena</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Se oye</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Se ve</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué cambia</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">El disco se atasca.</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Paulino se vuelve hacia la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">gramola.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Un fallo suena como una</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">llamada.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Suena el pasodoble.</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Carmela baila con su</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">abanico.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Un personaje vuelve en un</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">tiempo distinto.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La música se apaga.</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">El baile se interrumpe.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La distancia entre ambos se</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">oye en el diálogo.</text>
</g>
</svg>
