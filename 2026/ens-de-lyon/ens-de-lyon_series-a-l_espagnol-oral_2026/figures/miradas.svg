<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">A quién miran en la sala de espera</title>
<desc id="description">Lavinia mira alrededor. Los demás apartan los ojos. Ella se siente expuesta. Lavinia baja la vista. Zapatos gastados, suelas y uñas. La espera hace visible una desigualdad. Mira sus propios pies. El cuero italiano de sus sandalias. Se pregunta cómo la verán los demás.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">A quién miran en la sala de espera</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Movimiento</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Detalle visible</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Interpretación</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Lavinia mira</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">alrededor.</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Los demás apartan los</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">ojos.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Ella se siente expuesta.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Lavinia baja la</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">vista.</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Zapatos gastados, suelas y</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">uñas.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La espera hace visible una</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">desigualdad.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Mira sus propios</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">pies.</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">El cuero italiano de sus</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">sandalias.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Se pregunta cómo la verán</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">los demás.</text>
</g>
</svg>
