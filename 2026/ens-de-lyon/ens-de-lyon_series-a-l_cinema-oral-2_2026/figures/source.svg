<svg xmlns="http://www.w3.org/2000/svg" width="880" height="337" viewBox="0 0 880 337" role="img"><title>Trois places différentes pour la lumière</title><desc>Les trois vignettes représentent le scénario proposé, et non le découpage du film de la partie I.</desc><rect width="880" height="337" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="39" font-size="23" fill="#17394c" font-weight="bold">Trois places différentes pour la lumière</text><rect x="27" y="61" width="260" height="157" fill="#e6e9e0" stroke="#96a598" stroke-width="1"/><text x="36" y="89" font-size="18" fill="#17394c" font-weight="bold">Affiche</text><circle cx="154" cy="128" r="18" fill="#b79171" stroke="none" stroke-width="1"/><rect x="132" y="167" width="45" height="18" fill="#fffaf0" stroke="#718984" stroke-width="2"/><line x1="154" y1="164" x2="140" y2="145" stroke="#dca75e" stroke-width="2"/><line x1="154" y1="164" x2="154" y2="145" stroke="#dca75e" stroke-width="2"/><line x1="154" y1="164" x2="168" y2="145" stroke="#dca75e" stroke-width="2"/><text x="29" y="251" font-size="15" fill="#17394c">Le produit semble éclairer</text><text x="29" y="275" font-size="15" fill="#17394c">le visage.</text><rect x="311" y="61" width="260" height="157" fill="#e6e9e0" stroke="#96a598" stroke-width="1"/><text x="320" y="89" font-size="18" fill="#17394c" font-weight="bold">Atelier</text><circle cx="438" cy="128" r="18" fill="#cfb699" stroke="none" stroke-width="1"/><rect x="416" y="167" width="45" height="18" fill="#fffaf0" stroke="#718984" stroke-width="2"/><line x1="391" y1="164" x2="424" y2="145" stroke="#dca75e" stroke-width="2"/><line x1="391" y1="164" x2="438" y2="145" stroke="#dca75e" stroke-width="2"/><line x1="391" y1="164" x2="452" y2="145" stroke="#dca75e" stroke-width="2"/><circle cx="391" cy="169" r="8" fill="#dfc98f" stroke="none" stroke-width="1"/><text x="313" y="251" font-size="15" fill="#17394c">Une lampe distincte crée le</text><text x="313" y="275" font-size="15" fill="#17394c">halo.</text><rect x="595" y="61" width="260" height="157" fill="#e6e9e0" stroke="#96a598" stroke-width="1"/><text x="604" y="89" font-size="18" fill="#17394c" font-weight="bold">Retour au mur</text><circle cx="722" cy="128" r="18" fill="#b79171" stroke="none" stroke-width="1"/><rect x="700" y="167" width="45" height="18" fill="#fffaf0" stroke="#718984" stroke-width="2"/><rect x="683" y="104" width="78" height="86" fill="none" stroke="#b97b38" stroke-width="3"/><text x="597" y="251" font-size="15" fill="#17394c">L’image imprimée conserve</text><text x="597" y="275" font-size="15" fill="#17394c">l’effet.</text><text x="27" y="313" font-size="16" fill="#17394c">Schéma du scénario original proposé pour la partie II.</text></g></svg>
