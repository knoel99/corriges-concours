<svg xmlns="http://www.w3.org/2000/svg" width="880" height="337" viewBox="0 0 880 337" role="img"><title>De la poussière au couloir et au retour à la lumière</title><desc>Les trois vignettes représentent le scénario proposé, et non le découpage du film de la partie I.</desc><rect width="880" height="337" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="39" font-size="23" fill="#17394c" font-weight="bold">De la poussière au couloir et au retour à la lumière</text><rect x="27" y="61" width="260" height="157" fill="#e6e9e0" stroke="#96a598" stroke-width="1"/><text x="36" y="89" font-size="18" fill="#17394c" font-weight="bold">Boulevard</text><line x1="72" y1="176" x2="235" y2="176" stroke="#9aa7a2" stroke-width="3"/><path d="M103 170 Q149 129 197 169" fill="none" stroke="#b97b38" stroke-width="4"/><text x="29" y="251" font-size="15" fill="#17394c">Le pied inscrit un</text><text x="29" y="275" font-size="15" fill="#17394c">demi-cercle.</text><rect x="311" y="61" width="260" height="157" fill="#e6e9e0" stroke="#96a598" stroke-width="1"/><text x="320" y="89" font-size="18" fill="#17394c" font-weight="bold">Sous terre</text><line x1="363" y1="120" x2="389" y2="120" stroke="#26495d" stroke-width="3"/><line x1="389" y1="120" x2="389" y2="131" stroke="#26495d" stroke-width="3"/><line x1="389" y1="131" x2="415" y2="131" stroke="#26495d" stroke-width="3"/><line x1="415" y1="131" x2="415" y2="142" stroke="#26495d" stroke-width="3"/><line x1="415" y1="142" x2="441" y2="142" stroke="#26495d" stroke-width="3"/><line x1="441" y1="142" x2="441" y2="153" stroke="#26495d" stroke-width="3"/><line x1="441" y1="153" x2="467" y2="153" stroke="#26495d" stroke-width="3"/><line x1="467" y1="153" x2="467" y2="164" stroke="#26495d" stroke-width="3"/><line x1="467" y1="164" x2="493" y2="164" stroke="#26495d" stroke-width="3"/><line x1="493" y1="164" x2="493" y2="175" stroke="#26495d" stroke-width="3"/><text x="313" y="251" font-size="15" fill="#17394c">Air et grondement passent</text><text x="313" y="275" font-size="15" fill="#17394c">autrement.</text><rect x="595" y="61" width="260" height="157" fill="#e6e9e0" stroke="#96a598" stroke-width="1"/><text x="604" y="89" font-size="18" fill="#17394c" font-weight="bold">Autre sortie</text><line x1="640" y1="176" x2="803" y2="176" stroke="#9aa7a2" stroke-width="3"/><path d="M671 170 Q717 129 765 169" fill="none" stroke="#b97b38" stroke-width="4"/><path d="M671 170 Q718 198 765 169" fill="none" stroke="#26495d" stroke-width="4"/><text x="597" y="251" font-size="15" fill="#17394c">Le geste se complète</text><text x="597" y="275" font-size="15" fill="#17394c">ailleurs.</text><text x="27" y="313" font-size="16" fill="#17394c">Schéma du scénario original proposé pour la partie II.</text></g></svg>
