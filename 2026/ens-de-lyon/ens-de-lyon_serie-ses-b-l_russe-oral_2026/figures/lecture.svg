<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">От потока сведений к самостоятельной мысли</title>
<desc id="description">Деление и даты Проверить школьный навык Что именно измеряет заминка? Нарды и викторина Тренировать один или несколько навыков Переносится ли успех на другую задачу? Конспект и пересказ Отобрать и связать мысли Что осталось после прослушивания? Тишина за работой Оставить место своей мысли Когда звук помогает, а когда отвлекает?</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">От потока сведений к самостоятельной мысли</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Пример</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Действие читателя</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Вопрос для анализа</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Деление и даты</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Проверить школьный навык</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Что именно измеряет</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">заминка?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Нарды и викторина</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Тренировать один или</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">несколько навыков</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Переносится ли успех на</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">другую задачу?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Конспект и пересказ</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Отобрать и связать мысли</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Что осталось после</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">прослушивания?</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Тишина за работой</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Оставить место своей мысли</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">Когда звук помогает, а</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">когда отвлекает?</text>
</g>
</svg>
