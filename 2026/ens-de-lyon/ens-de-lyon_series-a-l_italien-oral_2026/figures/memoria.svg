<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Che cosa viene reso visibile?</title>
<desc id="description">Ponzani Una fotografia pubblicata con la recensione. Come si costruisce il ricordo della Roma del cinema? Folchi Alcune partigiane sono escluse dal corteo. Chi entra nel racconto pubblico della Liberazione? Brando Una norma medievale su una lavorazione inquinante. Che cosa sapevano del danno coloro che potevano intervenire?</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Che cosa viene reso visibile?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Articolo</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Traccia osservata</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Questione aperta</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Ponzani</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Una fotografia pubblicata</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">con la recensione.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Come si costruisce il</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">ricordo della Roma del</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">cinema?</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Folchi</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Alcune partigiane sono</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">escluse dal corteo.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Chi entra nel racconto</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">pubblico della Liberazione?</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Brando</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Una norma medievale su una</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">lavorazione inquinante.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Che cosa sapevano del danno</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">coloro che potevano</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">intervenire?</text>
</g>
</svg>
