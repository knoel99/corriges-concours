<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Chi parla e quale prova offre?</title>
<desc id="description">Saba Un passante torna a casa. Il pensiero cambia in compagnia di altre persone. Serao Le vecchie etichette tornano nei comizi. Un odore e un gesto ne rivelano la perdita di efficacia. Campanella Il viaggiatore riporta la risposta dei Solari. L’esempio dei bambini lo induce a rivedere il suo giudizio.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Chi parla e quale prova offre?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Testo</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Punto di partenza</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Che cosa cambia</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Saba</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un passante torna a casa.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Il pensiero cambia in</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">compagnia di altre persone.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Serao</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le vecchie etichette</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">tornano nei comizi.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Un odore e un gesto ne</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">rivelano la perdita di</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">efficacia.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Campanella</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Il viaggiatore riporta la</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">risposta dei Solari.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">L’esempio dei bambini lo</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">induce a rivedere il suo</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">giudizio.</text>
</g>
</svg>
