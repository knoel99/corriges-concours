<svg xmlns="http://www.w3.org/2000/svg" width="840" height="219" viewBox="0 0 840 219" role="img" aria-labelledby="titre desc"><title id="titre">Des routes et des foyers de création</title><desc id="desc">À Marseille, le Jeu de Marseille. Breton et Lam passent par la Martinique, où la revue Tropiques est fondée. Lam regagne Cuba, Breton rejoint New York. Mexico figure comme un foyer distinct, avec Varo et Carrington.</desc><defs><marker id="a" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65639"/></marker></defs><g font-family="DejaVu Sans, sans-serif">
