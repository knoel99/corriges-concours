<text x="90" y="102" text-anchor="middle" fill="#233f43" font-size="22" font-weight="700">Marseille</text>
<text x="90" y="128" text-anchor="middle" fill="#233f43" font-size="17" font-weight="400">Jeu de Marseille</text>
<rect x="220" y="72" width="180" height="72" rx="3" fill="#e5efed" stroke="#233f43" stroke-width="1.7"/>
<text x="310" y="100" text-anchor="middle" fill="#233f43" font-size="23" font-weight="700">Martinique</text>
<text x="310" y="129" text-anchor="middle" fill="#233f43" font-size="17" font-weight="400">Tropiques · 1941</text>
<path d="M179 109 H211" fill="none" stroke="#a65639" stroke-width="2" marker-end="url(#a)"/>
<rect x="490" y="8" width="338" height="62" rx="3" fill="#fffaf0" stroke="#233f43" stroke-width="1.7"/>
<text x="659" y="34" text-anchor="middle" fill="#233f43" font-size="21" font-weight="700">La Havane · Lam</text>
<text x="659" y="58" text-anchor="middle" fill="#233f43" font-size="18" font-weight="400">La Jungle, 1942–1943</text>
<rect x="490" y="82" width="338" height="62" rx="3" fill="#e5efed" stroke="#233f43" stroke-width="1.7"/>
<text x="659" y="109" text-anchor="middle" fill="#233f43" font-size="21" font-weight="700">New York · Breton</text>
<text x="659" y="132" text-anchor="middle" fill="#233f43" font-size="17" font-weight="400">First Papers of Surrealism, 1942</text>
<path d="M402 102 L480 45" fill="none" stroke="#a65639" stroke-width="2" marker-end="url(#a)"/>
