<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">How far can this evidence take us?</title>
<desc id="description">A recorded interview What a voter in Mansfield says about a choice. It cannot count all voters with that motive. A standing ovation An audience publicly welcomes a speech. It does not bind governments to act. A governor’s statement An officeholder interprets the cost of fuel. It does not measure each household’s bill.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">How far can this evidence take us?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Evidence</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What it establishes</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Where the inference ends</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">A recorded interview</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">What a voter in Mansfield</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">says about a choice.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">It cannot count all voters</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">with that motive.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">A standing ovation</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">An audience publicly</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">welcomes a speech.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">It does not bind</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">governments to act.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">A governor’s</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">statement</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">An officeholder interprets</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">the cost of fuel.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">It does not measure each</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">household’s bill.</text>
</g>
</svg>
