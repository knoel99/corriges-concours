<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Whose budget and which cost?</title>
<desc id="description">Housing and family size Households must find space they can afford. How often do housing costs change family plans? Cooling a home Equipment and electricity have separate prices. Who can stay safe through a prolonged heatwave? Health insurance Premium and deductible affect payment at different times. How does changing plan alter the household’s risk?</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Whose budget and which cost?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Case</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Immediate exposure</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Further question</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Housing and family</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">size</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Households must find space</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">they can afford.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">How often do housing costs</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">change family plans?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Cooling a home</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Equipment and electricity</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">have separate prices.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Who can stay safe through a</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">prolonged heatwave?</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Health insurance</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Premium and deductible</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">affect payment at</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">different times.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">How does changing plan</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">alter the household’s risk?</text>
</g>
</svg>
