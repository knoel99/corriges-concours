<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">What has actually been decided?</title>
<desc id="description">Supreme Court Interprets a statute authorising emergency powers. Effect on individual prices. Kennedy Center board Votes on the name displayed at a cultural institution. Legal authority to alter a name set by Congress. Employer Reconsiders participation in a workplace programme. The outcome of the case that raised the concern.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What has actually been decided?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Institution</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Recorded action</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What still needs proof</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Supreme Court</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Interprets a statute</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">authorising emergency</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">powers.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Effect on individual</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">prices.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Kennedy Center board</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Votes on the name</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">displayed at a cultural</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">institution.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Legal authority to alter a</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">name set by Congress.</text>
<rect x="10" y="270" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Employer</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Reconsiders participation</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">in a workplace programme.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">The outcome of the case</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">that raised the concern.</text>
</g>
</svg>
