<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Who gives a public object meaning?</title>
<desc id="description">Pike statue A monument in a federal park. Whose history does the inscription select? Koh-i-noor An object held in the Crown Jewels. Which history of ownership accompanies its display? Bradford exhibition An archive about people once put on display. Who interprets the images in the new exhibition?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who gives a public object meaning?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Case</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Public setting</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question for the visitor</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Pike statue</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A monument in a federal</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">park.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Whose history does the</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">inscription select?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Koh-i-noor</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">An object held in the</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Crown Jewels.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Which history of ownership</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">accompanies its display?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Bradford exhibition</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">An archive about people</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">once put on display.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Who interprets the images</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">in the new exhibition?</text>
</g>
</svg>
