<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Wer spricht, wer nimmt wahr?</title>
<desc id="description">Gespräch mit Beineberg Ein Redner entwickelt seine Gründe. Das Netz erscheint in der Wahrnehmung des Zuhörers. Törleß schweigt Eine Formel wird innerlich wiederholt. Aus Behauptungen werden Fragen. Vor den Lehrern Der Erzähler spricht über Gedanken überhaupt. Die spätere Schülerrede wird eigens eingerahmt.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Wer spricht, wer nimmt wahr?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Ausschnitt</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Sprachlicher Wechsel</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Folge für die Deutung</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Gespräch mit</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">Beineberg</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Ein Redner entwickelt</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">seine Gründe.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Das Netz erscheint in der</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Wahrnehmung des Zuhörers.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Törleß schweigt</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Eine Formel wird innerlich</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">wiederholt.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Aus Behauptungen werden</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Fragen.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Vor den Lehrern</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Der Erzähler spricht über</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Gedanken überhaupt.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Die spätere Schülerrede</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">wird eigens eingerahmt.</text>
</g>
</svg>
