<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Welche Quelle trägt welche Aussage?</title>
<desc id="description">Mitgliedskartei Ein Name ist im Archiv verzeichnet. Was belegt das über das spätere Verhalten? WG-Zimmer Ein Mittelwert beschreibt das Hamburger Angebot. Wie lange braucht eine einzelne Person für die Suche? Gedenkfeier Die Tochter spricht ihren Vater öffentlich an. Welche Erfahrungen erhielten zuvor wenig Gehör?</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Welche Quelle trägt welche Aussage?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Fall</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Aussage mit Beleg</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Weiterführende Frage</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Mitgliedskartei</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Ein Name ist im Archiv</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">verzeichnet.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Was belegt das über das</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">spätere Verhalten?</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">WG-Zimmer</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Ein Mittelwert beschreibt</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">das Hamburger Angebot.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Wie lange braucht eine</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">einzelne Person für die</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">Suche?</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Gedenkfeier</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Die Tochter spricht ihren</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Vater öffentlich an.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Welche Erfahrungen</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">erhielten zuvor wenig</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">Gehör?</text>
</g>
</svg>
