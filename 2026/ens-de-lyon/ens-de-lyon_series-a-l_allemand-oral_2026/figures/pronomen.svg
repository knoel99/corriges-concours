<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Wer handelt im Gedicht?</title>
<desc id="description">Einsamkeit II Das Land verlässt die angesprochene Person. Wie erscheint das Exil aus dieser Perspektive? Selbstporträt Die Grenzen bewegen das Ich. Wer gestaltet Zugehörigkeit? Ich denke Am Ende denkt der Tod an das Ich. Was kehrt die letzte Zeile um?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Wer handelt im Gedicht?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Gedicht</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Subjekt und Handlung</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Deutungsfrage</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Einsamkeit II</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Das Land verlässt die</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">angesprochene Person.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Wie erscheint das Exil aus</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">dieser Perspektive?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Selbstporträt</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Die Grenzen bewegen das</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Ich.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Wer gestaltet</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Zugehörigkeit?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Ich denke</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Am Ende denkt der Tod an</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">das Ich.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Was kehrt die letzte Zeile</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">um?</text>
</g>
</svg>
