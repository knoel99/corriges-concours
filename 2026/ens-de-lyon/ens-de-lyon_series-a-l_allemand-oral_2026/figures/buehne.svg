<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Was der Zuschauer wahrnimmt</title>
<desc id="description">Brüsseler Bürger Das Gespräch endet mit einer tätlichen Unterbrechung. Wer darf öffentlich vom Recht sprechen? Egmont und Alba Egmont hält inne, bevor er antwortet. Wie weit darf ein Ratgeber gehen? Urteilsverkündung Eine Datumsangabe wird unverständlich gelesen. Wie wird die Autorität der Urkunde vorgeführt?</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Was der Zuschauer wahrnimmt</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Szene</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Zeichen auf der Bühne</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Politische Frage</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Brüsseler Bürger</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Das Gespräch endet mit</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">einer tätlichen</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">Unterbrechung.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Wer darf öffentlich vom</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Recht sprechen?</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Egmont und Alba</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Egmont hält inne, bevor er</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">antwortet.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Wie weit darf ein Ratgeber</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">gehen?</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Urteilsverkündung</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Eine Datumsangabe wird</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">unverständlich gelesen.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Wie wird die Autorität der</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Urkunde vorgeführt?</text>
</g>
</svg>
