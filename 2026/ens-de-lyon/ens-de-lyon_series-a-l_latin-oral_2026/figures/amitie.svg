<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" role="img" aria-labelledby="titre"><title id="titre">Que fait un ami selon Sénèque ?</title><rect width="720" height="150" fill="#f1f5f4"/><g font-family="DejaVu Sans" fill="#263e48"><text x="14" y="31" font-weight="bold" font-size="19">Que fait un ami selon Sénèque ?</text><rect x="14" y="49" width="216" height="86" rx="6" fill="#fff" stroke="#557080" stroke-width="1.4"/><text x="122" y="73" text-anchor="middle" font-size="15" font-weight="700">Lettre III</text><text x="122" y="100" text-anchor="middle" font-size="13" font-weight="400">Avant l’amitié, juger.</text><text x="122" y="121" text-anchor="middle" font-size="13" font-weight="400">Une fois lié, se confier.</text><path d="M232 92h14m-5 -4 5 4-5 4" fill="none" stroke="#476d75" stroke-width="2"/><rect x="250" y="49" width="216" height="86" rx="6" fill="#fff" stroke="#557080" stroke-width="1.4"/><text x="358" y="73" text-anchor="middle" font-size="15" font-weight="700">Lettre IX</text><text x="358" y="100" text-anchor="middle" font-size="13" font-weight="400">Le sage désire un ami</text><text x="358" y="121" text-anchor="middle" font-size="13" font-weight="400">pour exercer l’amitié.</text><path d="M468 92h14m-5 -4 5 4-5 4" fill="none" stroke="#476d75" stroke-width="2"/><rect x="486" y="49" width="216" height="86" rx="6" fill="#fff" stroke="#557080" stroke-width="1.4"/><text x="594" y="73" text-anchor="middle" font-size="15" font-weight="700">Lettre XXXV</text><text x="594" y="100" text-anchor="middle" font-size="13" font-weight="400">Former l’élève pour</text><text x="594" y="121" text-anchor="middle" font-size="13" font-weight="400">qu’il devienne un égal.</text></g></svg>
