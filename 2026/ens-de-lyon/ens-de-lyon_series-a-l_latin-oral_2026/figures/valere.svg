<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" role="img" aria-labelledby="titre"><title id="titre">Comment lire un chapitre de Valère Maxime ?</title><rect width="720" height="150" fill="#f1f5f4"/><g font-family="DejaVu Sans" fill="#263e48"><text x="14" y="31" font-weight="bold" font-size="19">Comment lire un chapitre de Valère Maxime ?</text><rect x="14" y="49" width="216" height="86" rx="6" fill="#fff" stroke="#557080" stroke-width="1.4"/><text x="122" y="73" text-anchor="middle" font-size="15" font-weight="700">Préambule</text><text x="122" y="100" text-anchor="middle" font-size="13" font-weight="400">Le lien amical est mis</text><text x="122" y="121" text-anchor="middle" font-size="13" font-weight="400">à l’épreuve par le malheur.</text><path d="M232 92h14m-5 -4 5 4-5 4" fill="none" stroke="#476d75" stroke-width="2"/><rect x="250" y="49" width="216" height="86" rx="6" fill="#fff" stroke="#557080" stroke-width="1.4"/><text x="358" y="73" text-anchor="middle" font-size="15" font-weight="700">Exemples romains</text><text x="358" y="100" text-anchor="middle" font-size="13" font-weight="400">La parole, le silence,</text><text x="358" y="121" text-anchor="middle" font-size="13" font-weight="400">le risque couru pour autrui.</text><path d="M468 92h14m-5 -4 5 4-5 4" fill="none" stroke="#476d75" stroke-width="2"/><rect x="486" y="49" width="216" height="86" rx="6" fill="#fff" stroke="#557080" stroke-width="1.4"/><text x="594" y="73" text-anchor="middle" font-size="15" font-weight="700">Exemples étrangers</text><text x="594" y="100" text-anchor="middle" font-size="13" font-weight="400">Le sursis accordé à l’ami</text><text x="594" y="121" text-anchor="middle" font-size="13" font-weight="400">puis les deux Alexandre.</text></g></svg>
