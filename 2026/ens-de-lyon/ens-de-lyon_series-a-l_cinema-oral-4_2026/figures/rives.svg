<svg xmlns="http://www.w3.org/2000/svg" width="880" height="337" viewBox="0 0 880 337" role="img"><title>Le trait interrompu et les deux calques</title><desc>Les trois vignettes représentent le scénario proposé, et non le découpage du film de la partie I.</desc><rect width="880" height="337" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="39" font-size="23" fill="#17394c" font-weight="bold">Le trait interrompu et les deux calques</text><rect x="27" y="61" width="260" height="157" fill="#e6e9e0" stroke="#96a598" stroke-width="1"/><text x="36" y="89" font-size="18" fill="#17394c" font-weight="bold">Premier calque</text><rect x="74" y="108" width="163" height="80" fill="#dae2db" stroke="#7b8f8b" stroke-width="1.5"/><line x1="76" y1="151" x2="136" y2="151" stroke="#26495d" stroke-width="4"/><line x1="173" y1="151" x2="235" y2="151" stroke="#26495d" stroke-width="4"/><text x="29" y="251" font-size="15" fill="#17394c">La ligne du passage</text><text x="29" y="275" font-size="15" fill="#17394c">s’interrompt.</text><rect x="311" y="61" width="260" height="157" fill="#e6e9e0" stroke="#96a598" stroke-width="1"/><text x="320" y="89" font-size="18" fill="#17394c" font-weight="bold">Deux calques</text><rect x="358" y="108" width="163" height="80" fill="#dae2db" stroke="#7b8f8b" stroke-width="1.5"/><line x1="360" y1="151" x2="420" y2="151" stroke="#26495d" stroke-width="4"/><line x1="457" y1="151" x2="519" y2="151" stroke="#26495d" stroke-width="4"/><line x1="419" y1="151" x2="458" y2="151" stroke="#b97b38" stroke-width="5"/><rect x="381" y="103" width="111" height="73" fill="none" stroke="#b97b38" stroke-width="1.5"/><text x="313" y="251" font-size="15" fill="#17394c">Les mains ajustent les deux</text><text x="313" y="275" font-size="15" fill="#17394c">feuilles.</text><rect x="595" y="61" width="260" height="157" fill="#e6e9e0" stroke="#96a598" stroke-width="1"/><text x="604" y="89" font-size="18" fill="#17394c" font-weight="bold">Sur le quai</text><rect x="642" y="108" width="163" height="80" fill="#dae2db" stroke="#7b8f8b" stroke-width="1.5"/><line x1="644" y1="151" x2="704" y2="151" stroke="#26495d" stroke-width="4"/><line x1="741" y1="151" x2="803" y2="151" stroke="#26495d" stroke-width="4"/><line x1="703" y1="151" x2="742" y2="151" stroke="#b97b38" stroke-width="5"/><line x1="671" y1="151" x2="671" y2="173" stroke="#26495d" stroke-width="2"/><line x1="697" y1="151" x2="697" y2="173" stroke="#26495d" stroke-width="2"/><line x1="723" y1="151" x2="723" y2="173" stroke="#26495d" stroke-width="2"/><line x1="749" y1="151" x2="749" y2="173" stroke="#26495d" stroke-width="2"/><text x="597" y="251" font-size="15" fill="#17394c">Le passage a retrouvé un</text><text x="597" y="275" font-size="15" fill="#17394c">usage.</text><text x="27" y="313" font-size="16" fill="#17394c">Schéma du scénario original proposé pour la partie II.</text></g></svg>
