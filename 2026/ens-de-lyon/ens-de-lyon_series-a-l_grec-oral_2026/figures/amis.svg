<svg xmlns="http://www.w3.org/2000/svg" width="760" height="138" viewBox="0 0 760 138" role="img" aria-labelledby="t"><title id="t">Trois manières d’éprouver l’amitié</title><rect width="760" height="138" fill="#f0f4f3"/><g font-family="DejaVu Sans" fill="#213d40"><text x="15" y="28" font-size="19" font-weight="700">Trois manières d’éprouver l’amitié</text><rect x="14" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="130.5" y="65" text-anchor="middle" font-size="15" font-weight="700">Timon</text><text x="130.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Le repas se termine.</text><text x="130.5" y="109" text-anchor="middle" font-size="13" font-weight="400">Les convives disparaissent.</text><rect x="262" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="378.5" y="65" text-anchor="middle" font-size="15" font-weight="700">L’ami de Socrate</text><text x="378.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Il partage la dépense</text><text x="378.5" y="109" text-anchor="middle" font-size="13" font-weight="400">et participe à l’action.</text><rect x="510" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="626.5" y="65" text-anchor="middle" font-size="15" font-weight="700">Alcibiade à Délion</text><text x="626.5" y="89" text-anchor="middle" font-size="13" font-weight="400">À cheval, il accompagne</text><text x="626.5" y="109" text-anchor="middle" font-size="13" font-weight="400">l’ami qui se retire à pied.</text></g></svg>
