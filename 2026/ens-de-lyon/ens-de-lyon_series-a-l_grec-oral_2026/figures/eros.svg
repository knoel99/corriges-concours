<svg xmlns="http://www.w3.org/2000/svg" width="760" height="138" viewBox="0 0 760 138" role="img" aria-labelledby="t"><title id="t">De l’éloge à l’examen dans Le Banquet</title><rect width="760" height="138" fill="#f0f4f3"/><g font-family="DejaVu Sans" fill="#213d40"><text x="15" y="28" font-size="19" font-weight="700">De l’éloge à l’examen dans Le Banquet</text><rect x="14" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="130.5" y="65" text-anchor="middle" font-size="15" font-weight="700">Relation</text><text x="130.5" y="89" text-anchor="middle" font-size="13" font-weight="400">L’amour est amour</text><text x="130.5" y="109" text-anchor="middle" font-size="13" font-weight="400">de quelque chose.</text><rect x="262" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="378.5" y="65" text-anchor="middle" font-size="15" font-weight="700">Désir</text><text x="378.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Ce qui désire éprouve</text><text x="378.5" y="109" text-anchor="middle" font-size="13" font-weight="400">un manque.</text><rect x="510" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="626.5" y="65" text-anchor="middle" font-size="15" font-weight="700">Conséquence</text><text x="626.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Qui désire le beau</text><text x="626.5" y="109" text-anchor="middle" font-size="13" font-weight="400">ne le possède pas.</text></g></svg>
