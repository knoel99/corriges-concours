<svg xmlns="http://www.w3.org/2000/svg" width="760" height="138" viewBox="0 0 760 138" role="img" aria-labelledby="t"><title id="t">Médée adapte sa parole à ceux qui l’écoutent</title><rect width="760" height="138" fill="#f0f4f3"/><g font-family="DejaVu Sans" fill="#213d40"><text x="15" y="28" font-size="19" font-weight="700">Médée adapte sa parole à ceux qui l’écoutent</text><rect x="14" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="130.5" y="65" text-anchor="middle" font-size="15" font-weight="700">Au chœur</text><text x="130.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Les contraintes du mariage</text><text x="130.5" y="109" text-anchor="middle" font-size="13" font-weight="400">préparent une demande.</text><rect x="262" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="378.5" y="65" text-anchor="middle" font-size="15" font-weight="700">À Créon</text><text x="378.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Elle plaide pour pouvoir</text><text x="378.5" y="109" text-anchor="middle" font-size="13" font-weight="400">rester dans le pays.</text><rect x="510" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="626.5" y="65" text-anchor="middle" font-size="15" font-weight="700">À Jason</text><text x="626.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Elle feint de partager</text><text x="626.5" y="109" text-anchor="middle" font-size="13" font-weight="400">le point de vue de son époux.</text></g></svg>
