<svg xmlns="http://www.w3.org/2000/svg" width="760" height="138" viewBox="0 0 760 138" role="img" aria-labelledby="t"><title id="t">Écouter, voir, applaudir chez Xénophon</title><rect width="760" height="138" fill="#f0f4f3"/><g font-family="DejaVu Sans" fill="#213d40"><text x="15" y="28" font-size="19" font-weight="700">Écouter, voir, applaudir chez Xénophon</text><rect x="14" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="130.5" y="65" text-anchor="middle" font-size="15" font-weight="700">Rythme à la flûte</text><text x="130.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Ariane entend</text><text x="130.5" y="109" text-anchor="middle" font-size="13" font-weight="400">Dionysos avant de le voir.</text><rect x="262" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="378.5" y="65" text-anchor="middle" font-size="15" font-weight="700">Gestes du duo</text><text x="378.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Dionysos entre en dansant.</text><text x="378.5" y="109" text-anchor="middle" font-size="13" font-weight="400">Ariane lui répond.</text><rect x="510" y="43" width="233" height="81" rx="4" fill="#ffffff" stroke="#55716e"/><text x="626.5" y="65" text-anchor="middle" font-size="15" font-weight="700">Convives</text><text x="626.5" y="89" text-anchor="middle" font-size="13" font-weight="400">Ils applaudissent</text><text x="626.5" y="109" text-anchor="middle" font-size="13" font-weight="400">et réclament une reprise.</text></g></svg>
