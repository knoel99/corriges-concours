<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Interpréter une association</title>
<desc id="description">Forme de l’usage Conversation ou comparaison Que change le contexte ? Indicateurs Contacts ou solitude perçue Mesure-t-on la même chose ? Résultat associé Plusieurs sens possibles Quelle enquête les distingue ?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Interpréter une association</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Observer</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Comparer</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Discuter</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Forme de l’usage</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Conversation ou</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">comparaison</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Que change le contexte ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Indicateurs</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Contacts ou solitude</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">perçue</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Mesure-t-on la même chose ?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Résultat associé</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Plusieurs sens possibles</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Quelle enquête les</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">distingue ?</text>
</g>
</svg>
