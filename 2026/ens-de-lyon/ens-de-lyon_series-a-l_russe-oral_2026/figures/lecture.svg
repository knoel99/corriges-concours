<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Как меняется точка зрения?</title>
<desc id="description">Цветаева Читатель писем один на сцене. Из многих голосов возвращается одно имя. Толстой Сравниваются две могилы. Третья смерть открывается через звуки леса. Волошин Горечь пейзажа остаётся в путнике. Он принимает соль и приветствует Коктебель.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Как меняется точка зрения?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Отрывок</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Что дано сначала</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">К чему ведёт чтение</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Цветаева</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Читатель писем один на</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">сцене.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Из многих голосов</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">возвращается одно имя.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Толстой</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Сравниваются две могилы.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Третья смерть открывается</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">через звуки леса.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Волошин</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Горечь пейзажа остаётся в</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">путнике.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Он принимает соль и</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">приветствует Коктебель.</text>
</g>
</svg>
