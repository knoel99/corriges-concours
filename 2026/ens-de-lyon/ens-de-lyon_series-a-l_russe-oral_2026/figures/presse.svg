<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">На каком основании говорит автор?</title>
<desc id="description">Куприянов Книготорговец спорит с журналисткой. Отделить цитируемые цифры от его возражений. Сангульник Автор прослеживает путь библиотечного списка. Различить пометку, ограничение выдачи и изъятие. Крячкова Руководитель сопоставляет семейный и профессиональный опыт. Проверить условия перехода на каждой ступени карьеры.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">На каком основании говорит автор?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Статья</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Исходная позиция</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Как проверить вывод</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Куприянов</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Книготорговец спорит с</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">журналисткой.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Отделить цитируемые цифры</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">от его возражений.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Сангульник</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Автор прослеживает путь</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">библиотечного списка.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Различить пометку,</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">ограничение выдачи и</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">изъятие.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Крячкова</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Руководитель сопоставляет</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">семейный и</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">профессиональный опыт.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Проверить условия перехода</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">на каждой ступени карьеры.</text>
</g>
</svg>
