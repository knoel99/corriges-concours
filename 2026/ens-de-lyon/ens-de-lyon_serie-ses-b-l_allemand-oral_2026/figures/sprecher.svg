<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Wer spricht für wen?</title>
<desc id="description">Friederichs, Dortmund Die Veranstalter berufen sich auf die Fankurve. Wer fehlt bei dieser Veranstaltung? Uken, Guangzhou Die Ministerin wirbt für den Standort. Wer entscheidet später über die einzelne Übernahme? Förster, heise Der Kommentator ruft Europa zum Handeln auf. Woran wäre größere Wahlfreiheit zu erkennen?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Wer spricht für wen?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Beobachter</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Öffentliche Äußerung</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Gegenfrage</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Friederichs, Dortmund</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Die Veranstalter berufen</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">sich auf die Fankurve.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Wer fehlt bei dieser</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Veranstaltung?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Uken, Guangzhou</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Die Ministerin wirbt für</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">den Standort.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Wer entscheidet später über</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">die einzelne Übernahme?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Förster, heise</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Der Kommentator ruft</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Europa zum Handeln auf.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Woran wäre größere</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Wahlfreiheit zu erkennen?</text>
</g>
</svg>
