<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Was belegt eine Zahl oder ein Beschluss?</title>
<desc id="description">Deutschlandfunk Der Haushaltsausschuss bewilligt Ausgaben. Welche politischen Ziele werden damit erreicht? Erdmann Die Regierung berechnet Emissionsminderungen. Welche Annahmen tragen diese Erwartung? Sabin Unternehmen besetzen weniger Einstiegsstellen. Welche Gruppen finden weiterhin Arbeit?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Was belegt eine Zahl oder ein Beschluss?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Artikel</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Beobachtung</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Offene Frage</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Deutschlandfunk</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Der Haushaltsausschuss</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">bewilligt Ausgaben.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Welche politischen Ziele</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">werden damit erreicht?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Erdmann</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Die Regierung berechnet</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Emissionsminderungen.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Welche Annahmen tragen</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">diese Erwartung?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Sabin</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Unternehmen besetzen</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">weniger Einstiegsstellen.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Welche Gruppen finden</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">weiterhin Arbeit?</text>
</g>
</svg>
