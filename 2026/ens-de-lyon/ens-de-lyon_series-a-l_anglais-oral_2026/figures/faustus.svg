<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Who can still speak for Faustus?</title>
<desc id="description">Faustus He addresses himself by name. Who can act on his appeal? Mephistopheles He claims a role in the scholar’s reading. Does this erase the scholar’s choice? The Angels They set rival destinies before him. Who can hear the warning, and when?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who can still speak for Faustus?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voice</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Available to a listener</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question for performance</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Faustus</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">He addresses himself by</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">name.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Who can act on his appeal?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Mephistopheles</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">He claims a role in the</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">scholar’s reading.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Does this erase the</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">scholar’s choice?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">The Angels</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">They set rival destinies</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">before him.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Who can hear the warning,</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">and when?</text>
</g>
</svg>
