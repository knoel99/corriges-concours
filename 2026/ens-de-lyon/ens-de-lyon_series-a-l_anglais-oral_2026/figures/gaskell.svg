<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">From an offer to a shared memory</title>
<desc id="description">Investment Margaret sorts papers and explains a sum. She can help reopen the mill. Recognition Thornton kneels and calls her by name. She can answer without a formal declaration. Remembering He places her arms as before the crowd. The old gesture acquires a shared meaning.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">From an offer to a shared memory</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Physical or vocal sign</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What becomes possible</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Investment</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Margaret sorts papers and</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">explains a sum.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">She can help reopen the</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">mill.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Recognition</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Thornton kneels and calls</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">her by name.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">She can answer without a</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">formal declaration.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Remembering</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">He places her arms as</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">before the crowd.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">The old gesture acquires a</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">shared meaning.</text>
</g>
</svg>
