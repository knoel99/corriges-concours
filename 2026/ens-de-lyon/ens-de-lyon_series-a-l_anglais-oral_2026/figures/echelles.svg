<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">How far can one observation travel?</title>
<desc id="description">One club How a group organises a meeting. Evidence from other localities. A participant Why making things together matters to her. Other accounts, including absences. A generational trend A proposed change in how people spend time. Comparable observations over time.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">How far can one observation travel?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Evidence</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What it can show</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What else is needed</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">One club</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">How a group organises a</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">meeting.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Evidence from other</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">localities.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">A participant</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Why making things together</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">matters to her.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Other accounts, including</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">absences.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">A generational trend</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">A proposed change in how</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">people spend time.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Comparable observations</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">over time.</text>
</g>
</svg>
