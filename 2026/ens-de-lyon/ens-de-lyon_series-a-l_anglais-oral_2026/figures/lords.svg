<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Who controls a parliamentary decision?</title>
<desc id="description">Who sits? A hereditary route to membership is removed. What gives a second chamber legitimacy? Who waits? Amendments can postpone a vote. Does there have to be a decision? Who decides? The elected House has already voted. How should disagreement be resolved?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who controls a parliamentary decision?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What the column shows</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Test for the reader</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Who sits?</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A hereditary route to</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">membership is removed.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">What gives a second chamber</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">legitimacy?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Who waits?</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Amendments can postpone a</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">vote.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Does there have to be a</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">decision?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Who decides?</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">The elected House has</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">already voted.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">How should disagreement be</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">resolved?</text>
</g>
</svg>
