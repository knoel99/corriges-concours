<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Which power will the next government inherit?</title>
<desc id="description">First use Checking an applicant’s right to work. Who can correct an error? New purpose A successor changes its priorities. What use is still legally barred? Remedy A worker challenges a refusal. How soon can a binding remedy be obtained?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Which power will the next government inherit?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Stage</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What is being decided</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question left open</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">First use</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Checking an applicant’s</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">right to work.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Who can correct an error?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">New purpose</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">A successor changes its</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">priorities.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">What use is still legally</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">barred?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Remedy</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">A worker challenges a</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">refusal.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">How soon can a binding</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">remedy be obtained?</text>
</g>
</svg>
