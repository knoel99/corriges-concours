<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Who bears the cost of expanding AI?</title>
<desc id="description">Model developer Agents may make a large investment pay. Will customers pay for the service? Beneficiary A patient regains a voice. Scholars recover an ancient text. Who gains, and over what period? Neighbour or utility A power station in Omaha keeps using coal. What would the grid do without the project?</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who bears the cost of expanding AI?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Perspective</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Evidence in the article</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What to ask</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Model developer</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Agents may make a large</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">investment pay.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Will customers pay for the</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">service?</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Beneficiary</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">A patient regains a voice.</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Scholars recover an</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">ancient text.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Who gains, and over what</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">period?</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Neighbour or utility</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">A power station in Omaha</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">keeps using coal.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">What would the grid do</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">without the project?</text>
</g>
</svg>
