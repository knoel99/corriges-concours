<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 307" role="img" aria-labelledby="titre desc"><title id="titre">Que change une règle sur les maillots de natation ?</title><desc id="desc">Du matériau à l’admissibilité en course, une décision collective intervient dans la comparaison des performances.</desc><rect width="900" height="307" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="22" y="37" font-size="25" font-weight="bold" fill="#263e49">Que change une règle sur les maillots de natation ?</text>
<rect x="22" y="62" width="855" height="62" rx="7" fill="#e7eff2"/>
<text x="38" y="87" font-size="18" font-weight="bold" fill="#263e49">Matière et forme</text>
<text x="38" y="111" font-size="17" font-weight="normal" fill="#263e49">La combinaison modifie les interactions du nageur avec l’eau.</text>
<path d="M48 125 v14 m-4 -5 4 5 4 -5" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="22" y="144" width="855" height="62" rx="7" fill="#edf1e5"/>
<text x="38" y="169" font-size="18" font-weight="bold" fill="#263e49">Chronométrage</text>
<text x="38" y="193" font-size="17" font-weight="normal" fill="#263e49">Le temps enregistre ensemble le geste, l’entraînement et le matériel.</text>
<path d="M48 207 v14 m-4 -5 4 5 4 -5" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="22" y="226" width="855" height="62" rx="7" fill="#f5ebde"/>
<text x="38" y="251" font-size="18" font-weight="bold" fill="#263e49">Règlement de 2010</text>
<text x="38" y="275" font-size="17" font-weight="normal" fill="#263e49">La fédération précise les matériaux et les surfaces de couverture admis.</text>
</g></svg>
