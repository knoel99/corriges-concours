<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" role="img" aria-labelledby="titre desc"><title id="titre">Comment deux activités apprécient un même appui</title><desc id="desc">Le basket fauteuil retient des différences fonctionnelles pour composer les équipes ; la chorégraphie travaille des relations entre mouvements.</desc><rect width="900" height="352" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="22" y="37" font-size="25" font-weight="bold" fill="#263e49">Comment deux activités apprécient un même appui</text>
<rect x="248" y="61" width="404" height="67" rx="7" fill="#e8eef1"/>
<text x="265" y="89" font-size="20" font-weight="bold" fill="#263e49">Observer un mouvement du tronc</text>
<text x="265" y="114" font-size="17" font-weight="normal" fill="#263e49">Dans quelle action prend-il son sens ?</text>
<path d="M450 128 v24 H233 v19 m-4 -6 4 6 4 -6 M450 152 H665 v19 m-4 -6 4 6 4 -6" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="22" y="184" width="420" height="149" rx="7" fill="#e4f0ea"/>
<text x="35" y="216" font-size="19" font-weight="bold" fill="#263e49">Un match de basket fauteuil</text>
<text x="35" y="249" font-size="17" font-weight="normal" fill="#263e49">Observer la stabilité en dribble, au tir</text>
<text x="35" y="275" font-size="17" font-weight="normal" fill="#263e49">et dans les déplacements. Une classe</text>
<text x="35" y="301" font-size="17" font-weight="normal" fill="#263e49">fonctionnelle contribue à régler le match.</text>
<rect x="459" y="184" width="420" height="149" rx="7" fill="#f1eaf2"/>
<text x="472" y="216" font-size="19" font-weight="bold" fill="#263e49">Une pièce dansée</text>
<text x="472" y="249" font-size="17" font-weight="normal" fill="#263e49">Observer les trajectoires, les rythmes</text>
<text x="472" y="275" font-size="17" font-weight="normal" fill="#263e49">et les relations aux partenaires. Un autre</text>
<text x="472" y="301" font-size="17" font-weight="normal" fill="#263e49">appui peut transformer la chorégraphie.</text>
</g></svg>
