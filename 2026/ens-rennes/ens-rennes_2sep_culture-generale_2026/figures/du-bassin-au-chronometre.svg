<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 275" role="img" aria-labelledby="titre desc"><title id="titre">Du bassin au chronomètre</title><desc id="desc">Un écart observé après l’apprentissage ne permet pas, à lui seul, d’en identifier la cause.</desc><rect width="900" height="275" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="22" y="37" font-size="25" font-weight="bold" fill="#263e49">Du bassin au chronomètre</text>
<rect x="22" y="77" width="259" height="120" rx="7" fill="#edf3f4"/>
<text x="35" y="111" font-size="19" font-weight="bold" fill="#263e49">Accéder au bassin</text>
<text x="35" y="147" font-size="17" font-weight="normal" fill="#263e49">Transport, créneaux,</text>
<text x="35" y="171" font-size="17" font-weight="normal" fill="#263e49">temps disponible.</text>
<path d="M284 137 h30 m-7 -5 l7 5 -7 5" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="319" y="77" width="259" height="120" rx="7" fill="#e6efea"/>
<text x="332" y="111" font-size="19" font-weight="bold" fill="#263e49">Apprendre à nager</text>
<text x="332" y="147" font-size="17" font-weight="normal" fill="#263e49">Répéter l’expiration</text>
<text x="332" y="171" font-size="17" font-weight="normal" fill="#263e49">et coordonner les appuis.</text>
<path d="M581 137 h30 m-7 -5 l7 5 -7 5" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="616" y="77" width="259" height="120" rx="7" fill="#f5ebdd"/>
<text x="629" y="111" font-size="19" font-weight="bold" fill="#263e49">Passer le test</text>
<text x="629" y="147" font-size="17" font-weight="normal" fill="#263e49">Le chronomètre mesure</text>
<text x="629" y="171" font-size="17" font-weight="normal" fill="#263e49">un temps sur 25 mètres.</text>
<path d="M751 207 v22 H153 v22 m-5 -7 5 7 5 -7" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<text x="166" y="253" font-size="17" font-weight="normal" fill="#263e49">Le classement peut ensuite changer l’accès aux groupes d’entraînement.</text>
</g></svg>
