<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Brasil: tres cifras, tres alcances</title>
<desc id="description">Brasil Casi 985.000 hectáreas perdidas. Un descenso del 20,6 % respecto a 2024. Selva amazónica brasileña Unas 290.000 hectáreas perdidas. El descenso indicado es del 23,5 %. Cerrado Alrededor de la mitad de la pérdida nacional. Es otro bioma brasileño.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Brasil: tres cifras, tres alcances</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Ámbito</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dato de 2025</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Cómo interpretarlo</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Brasil</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Casi 985.000 hectáreas</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">perdidas.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Un descenso del 20,6 %</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">respecto a 2024.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Selva amazónica</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">brasileña</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Unas 290.000 hectáreas</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">perdidas.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">El descenso indicado es del</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">23,5 %.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Cerrado</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Alrededor de la mitad de</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">la pérdida nacional.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Es otro bioma brasileño.</text>
</g>
</svg>
