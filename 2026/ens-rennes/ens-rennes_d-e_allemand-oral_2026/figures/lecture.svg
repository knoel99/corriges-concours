<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Drei Fragen zur Wirkung einer Zuckerabgabe</title>
<desc id="description">Hersteller Die Rezeptur enthält weniger Zucker. Welche Getränke werden verändert? Haushalte Preise oder Geschmack beeinflussen die Wahl. Worauf weichen Käufer aus? Krankenkassen Die Abgabe soll Einnahmen bringen. Wann sind auch Folgen für die Gesundheit messbar?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Drei Fragen zur Wirkung einer Zuckerabgabe</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Wer reagiert?</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Beobachtung</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Offene Frage</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Hersteller</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Die Rezeptur enthält</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">weniger Zucker.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Welche Getränke werden</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">verändert?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Haushalte</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Preise oder Geschmack</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">beeinflussen die Wahl.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Worauf weichen Käufer aus?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Krankenkassen</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Die Abgabe soll Einnahmen</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">bringen.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Wann sind auch Folgen für</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">die Gesundheit messbar?</text>
</g>
</svg>
