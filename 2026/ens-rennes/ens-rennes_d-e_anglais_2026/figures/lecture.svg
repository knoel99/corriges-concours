<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Trois échelles pour évaluer les politiques publiques</title>
<desc id="description">Patients Décès évitables et accès effectif aux soins. Une orientation débouche-t-elle sur des soins disponibles ? Habitants en Équateur Sécurité des civils et confiance dans la justice. Qui supporte les conséquences locales de la violence ? Pays partenaires Effets de la coopération sur les deux populations. Les résultats dans un pays rendent-ils visibles les coûts ailleurs ?</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois échelles pour évaluer les politiques publiques</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Population</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indicateur pertinent</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question à poser</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Patients</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Décès évitables et accès</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">effectif aux soins.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Une orientation débouche-t-</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">elle sur des soins</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">disponibles ?</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Habitants en Équateur</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Sécurité des civils et</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">confiance dans la justice.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Qui supporte les</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">conséquences locales de la</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">violence ?</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Pays partenaires</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Effets de la coopération</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">sur les deux populations.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Les résultats dans un pays</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">rendent-ils visibles les</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">coûts ailleurs ?</text>
</g>
</svg>
