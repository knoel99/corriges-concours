<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">La coofficialité selon Solozábal</title>
<desc id="description">Identité Chaque langue donne accès à une vie culturelle partagée. Le castillan appartient aussi à l’histoire du Pays basque. Protection Une communauté peut promouvoir sa langue historique. Le catalan peut être langue d’enseignement. Garantie commune Aucune des deux langues officielles ne peut être évincée. Le castillan garde une place dans l’école en Catalogne.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">La coofficialité selon Solozábal</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Fondement</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Effet</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Exemple du texte</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Identité</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Chaque langue donne accès</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">à une vie culturelle</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">partagée.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le castillan appartient</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">aussi à l’histoire du Pays</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">basque.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Protection</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Une communauté peut</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">promouvoir sa langue</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">historique.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Le catalan peut être langue</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">d’enseignement.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Garantie commune</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Aucune des deux langues</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">officielles ne peut être</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">évincée.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Le castillan garde une</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">place dans l’école en</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">Catalogne.</text>
</g>
</svg>
