<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Du questionnaire au service militaire</title>
<desc id="description">Questionnaire Hommes et femmes à 18 ans. Réponse obligatoire pour les hommes, facultative pour les femmes. Examen médical Hommes à partir de la classe d’âge 2008. À compter de juillet 2027 selon le projet cité. Service effectif Les volontaires peuvent être recrutés. Un rétablissement de la conscription divise la coalition.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Du questionnaire au service militaire</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Mesure</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Public et rôle</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Portée dans le projet</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Questionnaire</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Hommes et femmes à 18 ans.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Réponse obligatoire pour</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">les hommes, facultative</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">pour les femmes.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Examen médical</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Hommes à partir de la</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">classe d’âge 2008.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">À compter de juillet 2027</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">selon le projet cité.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Service effectif</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Les volontaires peuvent</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">être recrutés.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Un rétablissement de la</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">conscription divise la</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">coalition.</text>
</g>
</svg>
