<svg xmlns="http://www.w3.org/2000/svg" width="760" height="245" viewBox="0 0 760 245" role="img">
<title>Distinguer trois décisions sportives</title><desc>Choisir qui est concerné permet de formuler une mesure précise avant de la défendre dans la copie.</desc>
<rect width="760" height="245" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#1f3447">
<text x="26" y="33" font-size="19" font-weight="bold">Distinguer trois décisions sportives</text>
<rect x="25" y="49" width="262" height="39" rx="5" fill="#e6f1ee"/>
<text x="38" y="74" font-size="16">Athlète à titre individuel</text>
<path d="M296 67 h36 m-8 -5 l8 5 -8 5" fill="none" stroke="#23766d" stroke-width="2"/>
<text x="351" y="74" font-size="16">Admissibilité, critères publiés et recours.</text>
<rect x="25" y="105" width="262" height="39" rx="5" fill="#e6f1ee"/>
<text x="38" y="130" font-size="16">Sélection nationale</text>
<path d="M296 123 h36 m-8 -5 l8 5 -8 5" fill="none" stroke="#23766d" stroke-width="2"/>
<text x="351" y="130" font-size="16">Représentation du pays et conditions de retour.</text>
<rect x="25" y="161" width="262" height="39" rx="5" fill="#e6f1ee"/>
<text x="38" y="186" font-size="16">Organisation d’un événement</text>
<path d="M296 179 h36 m-8 -5 l8 5 -8 5" fill="none" stroke="#23766d" stroke-width="2"/>
<text x="351" y="186" font-size="16">Attribution et contrôle des droits d’accueil.</text>
</g></svg>
