<svg xmlns="http://www.w3.org/2000/svg" width="760" height="245" viewBox="0 0 760 245" role="img">
<title>Identifier qui parle dans chaque phrase</title><desc>Les trois voix du passage imposent des verbes introducteurs et des guillemets distincts.</desc>
<rect width="760" height="245" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#1f3447">
<text x="26" y="33" font-size="19" font-weight="bold">Identifier qui parle dans chaque phrase</text>
<rect x="25" y="49" width="262" height="39" rx="5" fill="#e6f1ee"/>
<text x="38" y="74" font-size="16">Journalistes</text>
<path d="M296 67 h36 m-8 -5 l8 5 -8 5" fill="none" stroke="#23766d" stroke-width="2"/>
<text x="351" y="74" font-size="16">Présentent la réponse et introduisent les citations.</text>
<rect x="25" y="105" width="262" height="39" rx="5" fill="#e6f1ee"/>
<text x="38" y="130" font-size="16">Matvii Bidnyi</text>
<path d="M296 123 h36 m-8 -5 l8 5 -8 5" fill="none" stroke="#23766d" stroke-width="2"/>
<text x="351" y="130" font-size="16">Répond à Infantino et rappelle des chiffres.</text>
<rect x="25" y="161" width="262" height="39" rx="5" fill="#e6f1ee"/>
<text x="38" y="186" font-size="16">Fédération ukrainienne</text>
<path d="M296 179 h36 m-8 -5 l8 5 -8 5" fill="none" stroke="#23766d" stroke-width="2"/>
<text x="351" y="186" font-size="16">Sa position est rapportée par le ministre.</text>
</g></svg>
