<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Lire trois pourcentages du budget scolaire italien</title>
<desc id="description">6,2 % en 2025 Ensemble de la dépense publique. Part estimée pour l’école dans une année en cours. 49 % puis 37 % Dépense publique totale par habitant. Dépense par élève rapportée à ce montant en 2000 puis 2023. 87,4 % en 2024 Enveloppe scolaire d’environ 55,5 milliards d’euros citée. Part absorbée par les rémunérations du personnel.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Lire trois pourcentages du budget scolaire italien</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Nombre</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dénominateur</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Interprétation</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">6,2 % en 2025</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Ensemble de la dépense</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">publique.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Part estimée pour l’école</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">dans une année en cours.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">49 % puis 37 %</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Dépense publique totale</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">par habitant.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Dépense par élève rapportée</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">à ce montant en 2000 puis</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">2023.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">87,4 % en 2024</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Enveloppe scolaire</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">d’environ 55,5 milliards</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">d’euros citée.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Part absorbée par les</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">rémunérations du personnel.</text>
</g>
</svg>
