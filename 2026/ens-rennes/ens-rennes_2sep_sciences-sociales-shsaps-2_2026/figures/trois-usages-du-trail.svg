<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 308" role="img" aria-labelledby="titre desc"><title id="titre">Un parcours de trail, trois usages</title><desc id="desc">Le même parcours devient une épreuve pour son participant, un événement pour son organisateur et une destination pour le territoire.</desc><rect width="900" height="308" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="22" y="37" font-size="25" font-weight="bold" fill="#263e49">Un parcours de trail, trois usages</text>
<rect x="22" y="64" width="854" height="61" rx="7" fill="#e7f0f3"/>
<text x="37" y="89" font-size="19" font-weight="bold" fill="#263e49">Participant</text>
<text x="37" y="113" font-size="17" font-weight="normal" fill="#263e49">Se mesurer à la distance, au dénivelé et à d’autres coureurs.</text>
<rect x="22" y="145" width="854" height="61" rx="7" fill="#e9f1e7"/>
<text x="37" y="170" font-size="19" font-weight="bold" fill="#263e49">Organisateur</text>
<text x="37" y="194" font-size="17" font-weight="normal" fill="#263e49">Baliser les sentiers, organiser les départs et les ravitaillements.</text>
<rect x="22" y="226" width="854" height="61" rx="7" fill="#f6eadd"/>
<text x="37" y="251" font-size="19" font-weight="bold" fill="#263e49">Territoire d’accueil</text>
<text x="37" y="275" font-size="17" font-weight="normal" fill="#263e49">Recevoir les coureurs, mobiliser les bénévoles et les hébergements.</text>
</g></svg>
