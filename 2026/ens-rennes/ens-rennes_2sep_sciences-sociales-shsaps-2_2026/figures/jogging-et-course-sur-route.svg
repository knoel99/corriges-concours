<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 255" role="img" aria-labelledby="titre desc"><title id="titre">Comment une manière de courir se diffuse</title><desc id="desc">La sortie à allure libre, les échanges entre coureurs et l’épreuve organisée peuvent coexister.</desc><rect width="900" height="255" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="22" y="37" font-size="25" font-weight="bold" fill="#263e49">Comment une manière de courir se diffuse</text>
<rect x="22" y="70" width="267" height="112" rx="7" fill="#eaf0f2"/>
<text x="34" y="100" font-size="19" font-weight="bold" fill="#263e49">Le parc</text>
<text x="34" y="135" font-size="17" font-weight="normal" fill="#263e49">Choisir son horaire</text>
<text x="34" y="160" font-size="17" font-weight="normal" fill="#263e49">et son allure.</text>
<path d="M290 125 h24 m-6 -4 6 4 -6 4" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="317" y="70" width="267" height="112" rx="7" fill="#e9f2e8"/>
<text x="329" y="100" font-size="19" font-weight="bold" fill="#263e49">Le groupe</text>
<text x="329" y="135" font-size="17" font-weight="normal" fill="#263e49">Reprendre le parcours,</text>
<text x="329" y="160" font-size="17" font-weight="normal" fill="#263e49">se donner rendez-vous.</text>
<path d="M585 125 h24 m-6 -4 6 4 -6 4" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="612" y="70" width="267" height="112" rx="7" fill="#f4ecdf"/>
<text x="624" y="100" font-size="19" font-weight="bold" fill="#263e49">La course sur route</text>
<text x="624" y="135" font-size="17" font-weight="normal" fill="#263e49">Proposer un départ commun,</text>
<text x="624" y="160" font-size="17" font-weight="normal" fill="#263e49">un dossard, un classement.</text>
<path d="M745 188 v23 H157 v18 m-5 -7 5 7 5 -7" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<text x="172" y="232" font-size="17" font-weight="normal" fill="#263e49">Après l’épreuve, chacun peut retrouver sa pratique informelle.</text>
</g></svg>
