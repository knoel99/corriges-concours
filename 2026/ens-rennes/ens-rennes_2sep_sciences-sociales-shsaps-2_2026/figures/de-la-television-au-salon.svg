<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 295" role="img" aria-labelledby="titre desc"><title id="titre">Comment une émission devient une pratique</title><desc id="desc">Le programme fournit une séance. Son appropriation dépend du temps, de l’espace et des usages du foyer.</desc><rect width="900" height="295" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="22" y="37" font-size="25" font-weight="bold" fill="#263e49">Comment une émission devient une pratique</text>
<rect x="270" y="60" width="356" height="59" rx="7" fill="#e7f0f3"/>
<text x="286" y="85" font-size="19" font-weight="bold" fill="#263e49">Antenne 2, à partir de 1982</text>
<text x="286" y="108" font-size="16" font-weight="normal" fill="#263e49">Gestes montrés, musique, horaire.</text>
<path d="M450 119 v24 H225 v27 m-4 -6 4 6 4 -6 M450 143 H663 v27 m-4 -6 4 6 4 -6" fill="none" stroke="#4c6873" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="22" y="178" width="416" height="98" rx="7" fill="#e8f0e8"/>
<text x="33" y="206" font-size="18" font-weight="bold" fill="#263e49">Une contrainte levée</text>
<text x="33" y="237" font-size="17" font-weight="normal" fill="#263e49">La séance arrive au domicile et</text>
<text x="33" y="261" font-size="17" font-weight="normal" fill="#263e49">épargne un trajet jusqu’à la salle.</text>
<rect x="459" y="178" width="416" height="98" rx="7" fill="#f4ece3"/>
<text x="470" y="206" font-size="18" font-weight="bold" fill="#263e49">Des conditions demeurent</text>
<text x="470" y="237" font-size="17" font-weight="normal" fill="#263e49">Disposer de temps et d’espace,</text>
<text x="470" y="261" font-size="17" font-weight="normal" fill="#263e49">pouvoir interrompre les autres tâches.</text>
</g></svg>
