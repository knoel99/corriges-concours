<svg xmlns="http://www.w3.org/2000/svg" width="850" height="280" viewBox="0 0 850 280" role="img" aria-labelledby="titre desc"><title id="titre">Deux fonctions d’un même terrain</title><desc id="desc">Marcher. Le terrain soutient le corps et permet le déplacement. Prélever une roche. Un fragment du terrain devient un objet offert à l’examen. Examiner. L’observateur et la table ont toujours besoin d’un appui.</desc><rect width="850" height="280" fill="#faf9f4"/><g fill="#213c4a" font-family="DejaVu Sans,sans-serif"><text x="24" y="34" font-size="22" font-weight="bold">Deux fonctions d’un même terrain</text><rect x="24" y="48" width="802" height="62" rx="5" fill="white" stroke="#afbec0"/><path d="M28 50v58" stroke="#387877" stroke-width="6"/><text x="43" y="73" font-size="17" font-weight="bold">Marcher</text><text x="43" y="97" font-size="15">Le terrain soutient le corps et permet le déplacement.</text><rect x="24" y="122" width="802" height="62" rx="5" fill="white" stroke="#afbec0"/><path d="M28 124v58" stroke="#387877" stroke-width="6"/><text x="43" y="147" font-size="17" font-weight="bold">Prélever une roche</text><text x="43" y="171" font-size="15">Un fragment du terrain devient un objet offert à l’examen.</text><rect x="24" y="196" width="802" height="62" rx="5" fill="white" stroke="#afbec0"/><path d="M28 198v58" stroke="#387877" stroke-width="6"/><text x="43" y="221" font-size="17" font-weight="bold">Examiner</text><text x="43" y="245" font-size="15">L’observateur et la table ont toujours besoin d’un appui.</text></g></svg>
