<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="titre description">
<title id="titre">Deux questions à poser sur les techniques climatiques</title>
<desc id="description">Atténuer le réchauffement Une famille de techniques modifie la quantité de lumière réfléchie. La concentration du CO₂ peut continuer à augmenter. Retirer du carbone Les installations décrites par la BBC captent une petite quantité de CO₂. Comparer le volume capté aux émissions sur la même durée. Juger le projet Le dessin relie par un tuyau les entreprises du problème et de la solution. Distinguer la critique du dessinateur des prévisions scientifiques.</desc>
<rect width="720" height="385" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux questions à poser sur les techniques climatiques</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Élément</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est mesuré ou décrit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Comment le lire</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Atténuer le</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">réchauffement</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Une famille de techniques</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">modifie la quantité de</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">lumière réfléchie.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La concentration du CO₂</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">peut continuer à augmenter.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Retirer du carbone</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Les installations décrites</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">par la BBC captent une</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">petite quantité de CO₂.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Comparer le volume capté</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">aux émissions sur la même</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">durée.</text>
<rect x="10" y="270" width="700" height="105" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Juger le projet</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Le dessin relie par un</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">tuyau les entreprises du</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">problème et de la</text>
<text x="229" y="361" font-size="15" font-weight="400" fill="#162d3b">solution.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Distinguer la critique du</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">dessinateur des prévisions</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">scientifiques.</text>
</g>
</svg>
