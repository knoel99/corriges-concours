<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Deux indicateurs de la rareté de l’eau</title>
<desc id="description">500 m³ environ Ressource annuelle par personne en Égypte selon le ministre cité. Une quantité exprimée pour une personne et une année. 127 % en Égypte Rapport entre quantité d’eau utilisée et quantité disponible dans le graphique de 2015. Une proportion supérieure à 100 % signale un dépassement. 151 % en Jordanie Même indicateur et même figure que pour l’Égypte. La comparaison porte sur des proportions.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux indicateurs de la rareté de l’eau</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Élément</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est mesuré ou décrit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Comment le lire</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">500 m³ environ</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Ressource annuelle par</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">personne en Égypte selon</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">le ministre cité.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Une quantité exprimée pour</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">une personne et une année.</text>
<rect x="10" y="181" width="700" height="105" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">127 % en Égypte</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Rapport entre quantité</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">d’eau utilisée et quantité</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">disponible dans le</text>
<text x="229" y="272" font-size="15" font-weight="400" fill="#162d3b">graphique de 2015.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Une proportion supérieure à</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">100 % signale un</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">dépassement.</text>
<rect x="10" y="292" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">151 % en Jordanie</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">Même indicateur et même</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">figure que pour l’Égypte.</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">La comparaison porte sur</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">des proportions.</text>
</g>
</svg>
