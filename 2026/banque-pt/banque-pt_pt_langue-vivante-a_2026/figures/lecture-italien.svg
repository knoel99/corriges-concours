<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Nuitées hôtelières en Italie en 2022</title>
<desc id="description">93,327 millions Nuitées de la clientèle européenne dans les hôtels des régions italiennes. Le tableau compte des nuitées. 29,810 millions Toutes destinations italiennes pour la clientèle allemande. Lecture de la ligne selon la provenance. 20,871 millions Toutes provenances européennes dans le Trentin-Haut-Adige. Lecture de la colonne selon la destination.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Nuitées hôtelières en Italie en 2022</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Élément</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est mesuré ou décrit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Comment le lire</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">93,327 millions</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Nuitées de la clientèle</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">européenne dans les hôtels</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">des régions italiennes.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le tableau compte des</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">nuitées.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">29,810 millions</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Toutes destinations</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">italiennes pour la</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">clientèle allemande.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Lecture de la ligne selon</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">la provenance.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">20,871 millions</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Toutes provenances</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">européennes dans le</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">Trentin-Haut-Adige.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Lecture de la colonne selon</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">la destination.</text>
</g>
</svg>
