<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Lire les voix du tourisme espagnol</title>
<desc id="description">Exceltur Une organisation patronale prévoit une croissance pour 2024. Attribuer la prévision économique. Collectifs d’habitants Ils décrivent les effets du modèle sur le logement et le travail. Rapporter la portée du témoignage. Immeuble dessiné Des logos remplacent les habitants, une annonce donne un prix. Le dessin matérialise l’éviction sans représenter un dernier locataire.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Lire les voix du tourisme espagnol</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Élément</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est mesuré ou décrit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Comment le lire</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Exceltur</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Une organisation patronale</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">prévoit une croissance</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">pour 2024.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Attribuer la prévision</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">économique.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Collectifs</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">d’habitants</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Ils décrivent les effets</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">du modèle sur le logement</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">et le travail.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Rapporter la portée du</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">témoignage.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Immeuble dessiné</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Des logos remplacent les</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">habitants, une annonce</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">donne un prix.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Le dessin matérialise</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">l’éviction sans représenter</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">un dernier locataire.</text>
</g>
</svg>
