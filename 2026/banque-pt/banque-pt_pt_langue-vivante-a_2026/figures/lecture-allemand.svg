<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="titre description">
<title id="titre">De la personne interrogée au lieu cité</title>
<desc id="description">Un salarié sur trois Déclare avoir subi récemment une discrimination dans un domaine de sa vie. Le cadre dépasse le seul lieu de travail. 48,9 % Part des répondants qui désignent le travail comme lieu. Cette part ne dénombre pas les incidents. 484 signalements Incidents déclarés dans l’éducation depuis 2023. Les signalements rendent visible une partie du phénomène.</desc>
<rect width="720" height="385" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De la personne interrogée au lieu cité</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Élément</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est mesuré ou décrit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Comment le lire</text>
<rect x="10" y="92" width="700" height="105" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Un salarié sur trois</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Déclare avoir subi</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">récemment une</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">discrimination dans un</text>
<text x="229" y="183" font-size="15" font-weight="400" fill="#162d3b">domaine de sa vie.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le cadre dépasse le seul</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">lieu de travail.</text>
<rect x="10" y="203" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">48,9 %</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">Part des répondants qui</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">désignent le travail comme</text>
<text x="229" y="272" font-size="15" font-weight="400" fill="#162d3b">lieu.</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">Cette part ne dénombre pas</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">les incidents.</text>
<rect x="10" y="292" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">484 signalements</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">Incidents déclarés dans</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">l’éducation depuis 2023.</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">Les signalements rendent</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">visible une partie du</text>
<text x="473" y="361" font-size="15" font-weight="400" fill="#162d3b">phénomène.</text>
</g>
</svg>
