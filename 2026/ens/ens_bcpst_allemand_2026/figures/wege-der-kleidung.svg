<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" width="860" height="188" role="img"><title>Kleidungsstücke · drei Eingriffsmöglichkeiten</title><desc>Drei Eingriffe setzen an verschiedenen Stellen im Lebenslauf eines Kleidungsstücks an.</desc><rect width="100%" height="100%" fill="#fff"/><text x="20" y="28" fill="#133456" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Kleidungsstücke · drei Eingriffsmöglichkeiten</text><rect x="20" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="32" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Produktion</text><text x="32" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Haltbarkeit und</text><text x="32" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Reparierbarkeit von Anfang</text><text x="32" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">an berücksichtigen.</text><rect x="298" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="310" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Nutzung</text><text x="310" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Länger tragen, reparieren</text><text x="310" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">oder weitergeben.</text><rect x="576" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="588" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Sammlung</text><text x="588" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Nach Qualität sortieren und</text><text x="588" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">den Verbleib überprüfen.</text></svg>
