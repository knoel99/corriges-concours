<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" width="860" height="188" role="img"><title>Was misst die Befragung?</title><desc>Deux pourcentages du document 3 et leur dénominateur.</desc><rect width="100%" height="100%" fill="#fff"/><text x="20" y="28" fill="#133456" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Was misst die Befragung?</text><rect x="20" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="32" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">77 Prozent</text><text x="32" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Anteil aller Befragten, die</text><text x="32" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">aussortierte Kleidung</text><text x="32" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">spenden oder verschenken.</text><rect x="298" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="310" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">87 Prozent</text><text x="310" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Anteil mit derselben</text><text x="310" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Antwort unter den über</text><text x="310" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Sechzigjährigen.</text><rect x="576" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="588" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Aussagegrenze</text><text x="588" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Diese Antworten messen</text><text x="588" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">weder Abfallmengen noch</text><text x="588" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">tatsächliche</text><text x="588" y="155" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Wiederverwendung.</text></svg>
