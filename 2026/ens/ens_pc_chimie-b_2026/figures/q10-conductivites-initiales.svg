<svg xmlns="http://www.w3.org/2000/svg" width="620" height="256" viewBox="0 0 620 256" role="img" aria-labelledby="titre desc"><title id="titre">Conductivité initiale de l’eau minérale</title><desc id="desc">L’intervalle lu de 2,3 à 2,4 millisiemens par centimètre est proche de 2,28 avec paires. Le calcul pour les ions libres donne 4,15.</desc>
<rect width="620" height="256" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#203542"><text x="21" y="31" font-size="21">Conductivité initiale de l’eau minérale</text>
<rect x="374.8" y="53" width="8.0" height="158" fill="#dceff2"/><g stroke="#d4dfe1" stroke-width="1"><path d="M190 53v154 M270 53v154 M350 53v154 M430 53v154 M510 53v154 M590 53v154"/></g>
<g font-size="16"><text x="20" y="85">Mesure graphique</text><text x="20" y="134">Avec paires</text><text x="20" y="182">Tous les ions libres</text></g>
<g stroke="#2c696e" stroke-width="3"><path d="M374 79h8 M374 74v10 M382 74v10"/><circle cx="372.4" cy="128" r="5" fill="#2c696e"/></g><circle cx="522" cy="176" r="5" fill="#99452d"/>
<g font-size="15"><text x="392" y="84">2,3 à 2,4</text><text x="385" y="133">2,28</text><text x="535" y="181">4,15</text></g><path d="M190 209H590" stroke="#465a61"/>
<g font-size="13" text-anchor="middle"><text x="190" y="228">0</text><text x="270" y="228">1</text><text x="350" y="228">2</text><text x="430" y="228">3</text><text x="510" y="228">4</text><text x="590" y="228">5</text></g><text x="390" y="249" font-size="14" text-anchor="middle">Conductivité en mS/cm</text></g></svg>
