<svg xmlns="http://www.w3.org/2000/svg" width="143mm" height="73mm" viewBox="0 0 596 304" role="img" aria-labelledby="t d"><title id="t">Transport polarisé dans un entérocyte</title><desc id="d">Du côté apical, l’entrée de sodium permet celle du glucose. Du côté basolatéral, le glucose sort vers le milieu interstitiel, tandis que la pompe sodium-potassium exporte trois sodium et importe deux potassium en consommant de l’ATP.</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#006b78"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5 0 7Z" fill="#963f27"/></marker></defs>
<rect width="596" height="304" fill="white"/><rect x="181" y="50" width="214" height="207" rx="14" fill="#f1f6f5" stroke="#203d46" stroke-width="3"/>
<g font-family="sans-serif" fill="#192e35" text-anchor="middle" font-size="16"><text x="84" y="29">Lumière intestinale</text><text x="286" y="29">Entérocyte</text><text x="502" y="29">Milieu interstitiel</text>
<text x="102" y="88">Na⁺ et glucose</text><text x="287" y="89">Glucose</text><text x="490" y="88">Glucose</text>
<text x="287" y="150">3 Na⁺</text><text x="479" y="150">3 Na⁺</text>
<text x="287" y="217">2 K⁺</text><text x="479" y="217">2 K⁺</text>
<text x="394" y="191" font-size="14">Pompe · ATP</text><text x="180" y="285">Pôle apical</text><text x="396" y="285">Pôle basolatéral</text></g>
<g fill="none" stroke-width="3"><path d="M75 104H257" stroke="#006b78" marker-end="url(#a)"/><path d="M312 104H506" stroke="#006b78" marker-end="url(#a)"/><path d="M275 165H489" stroke="#963f27" marker-end="url(#b)"/><path d="M489 231H275" stroke="#963f27" marker-end="url(#b)"/></g></svg>
