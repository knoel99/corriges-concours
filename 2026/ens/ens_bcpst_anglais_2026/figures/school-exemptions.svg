<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 285" role="img" aria-labelledby="t d"><title id="t">Two entries from the January 2026 NBC map</title><desc id="d">California : Neither personal nor religious exemptions are shown. Oregon : Both categories of nonmedical exemption are shown. Reading the map : It describes legal categories, not uptake or disease incidence.</desc><rect width="930" height="285" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="18" y="32" font-size="24" font-weight="bold" fill="#253e49">Two entries from the January 2026 NBC map</text>
<rect x="18" y="47" width="892" height="66" rx="7" fill="#e1f0ed"/>
<text x="32" y="72" font-size="19" font-weight="bold" fill="#253e49">California</text>
<text x="32" y="96" font-size="17" font-weight="normal" fill="#253e49">Neither personal nor religious exemptions are shown.</text>
<path d="M48 113 v8 m-3 -3 3 3 3 -3" stroke="#57727d" stroke-width="2" fill="none"/>
<rect x="18" y="124" width="892" height="66" rx="7" fill="#f8efdf"/>
<text x="32" y="149" font-size="19" font-weight="bold" fill="#253e49">Oregon</text>
<text x="32" y="173" font-size="17" font-weight="normal" fill="#253e49">Both categories of nonmedical exemption are shown.</text>
<path d="M48 190 v8 m-3 -3 3 3 3 -3" stroke="#57727d" stroke-width="2" fill="none"/>
<rect x="18" y="201" width="892" height="66" rx="7" fill="#e7ecf5"/>
<text x="32" y="226" font-size="19" font-weight="bold" fill="#253e49">Reading the map</text>
<text x="32" y="250" font-size="17" font-weight="normal" fill="#253e49">It describes legal categories, not uptake or disease incidence.</text>
</g></svg>
