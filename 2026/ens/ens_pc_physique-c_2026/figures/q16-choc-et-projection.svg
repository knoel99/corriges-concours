<svg xmlns="http://www.w3.org/2000/svg" width="760" height="246" viewBox="0 0 760 246" role="img"><title>À chaque collision, la tangente tourne de 60°. La vitesse sortante est la projection de la vitesse entrante sur cette nouvelle tangente. Sa norme est divisée par deux.</title><rect width="760" height="246" fill="white"/><line x1="260.00" y1="119.00" x2="380.37" y2="188.50" stroke="#a44814" stroke-width="2.5" /><path d="M 375.69143341874735 180.8140667312202 L 380.374 188.5 L 371.3765086419202 188.28751644468485" stroke="#a44814" fill="none" stroke-width="2.5" /><line x1="260.00" y1="119.00" x2="320.19" y2="84.25" stroke="#006f73" stroke-width="2.5" /><path d="M 311.1895086419202 84.46248355531516 L 320.187 84.25 L 315.50443341874734 91.93593326877979" stroke="#006f73" fill="none" stroke-width="2.5" /><line x1="320.19" y1="84.25" x2="380.37" y2="188.50" stroke="#536470" stroke-width="2" stroke-dasharray="6 5"/><line x1="260.00" y1="119.00" x2="362.19" y2="60.00" stroke="#c5d3d8" stroke-width="2" /><circle cx="260.00" cy="119.00" r="4" fill="#142d3e"/><text x="245" y="123" fill="#142d3e" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">O</text><text x="307" y="130" fill="#142d3e" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">60°</text><text x="424" y="196" fill="#a44814" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Vitesse avant choc</text><text x="365" y="65" fill="#006f73" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Tangente au nouveau contact</text><text x="91" y="50" fill="#142d3e" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="normal" text-anchor="start">Projection tangentielle</text><text x="107" y="220" fill="#536470" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">L’impulsion normale change la direction et la norme de la vitesse.</text></svg>
