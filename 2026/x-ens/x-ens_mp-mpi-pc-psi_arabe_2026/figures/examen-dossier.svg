<svg xmlns="http://www.w3.org/2000/svg" width="900" height="505" viewBox="0 0 900 505" role="img" aria-labelledby="titre description">
  <title id="titre">La proposition de traitement hybride d’un dossier</title>
  <desc id="description">Dans l’étude citée au document 3, un contrôle automatique initial peut précéder une décision administrative prise par un agent. La transparence compte lorsque les droits d’une personne sont en jeu.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="505" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="42" font-size="27" fill="#182f43" font-weight="bold" text-anchor="start">À qui revient la décision sur un dossier administratif ?</text>
  <rect x="23" y="70" width="853" height="82" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="45" y="102" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Une demande arrive à l’administration.</text>
  <text x="45" y="134" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">L’étude citée par Iman al-Warraqi examine des procédures chinoises.</text>
  <path d="M 451 154 V 189" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="23" y="198" width="853" height="119" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="42" y="231" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Le système effectue une première vérification.</text>
  <text x="42" y="270" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Il applique des règles aux éléments répétitifs du dossier.</text><text x="42" y="297" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Une vérification rapide peut réduire l’attente de l’usager.</text>
  <path d="M 451 320 V 352" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="23" y="360" width="853" height="121" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="42" y="393" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">L’agent apprécie la situation et prend la décision finale.</text>
  <text x="42" y="432" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le besoin de jugement humain augmente avec la complexité du cas.</text><text x="42" y="459" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Pouvoir expliquer la décision permet d’examiner un éventuel biais.</text>
  </g>
</svg>
