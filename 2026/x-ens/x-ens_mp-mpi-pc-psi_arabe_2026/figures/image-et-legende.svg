<svg xmlns="http://www.w3.org/2000/svg" width="900" height="417" viewBox="0 0 900 417" role="img" aria-labelledby="titre description">
  <title id="titre">La fillette de Digital Dubai</title>
  <desc id="description">L’image rend un personnage familier par le regard et le geste. La légende révèle sa nature virtuelle et le rôle de son dialecte. La réception du public reste inconnue.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="417" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="40" font-size="27" fill="#182f43" font-weight="bold" text-anchor="start">Pourquoi Digital Dubai choisit-elle une figure d’enfant ?</text>
  <rect x="23" y="69" width="414" height="154" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="42" y="102" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Ce que montre l’image</text>
  <text x="42" y="141" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Une fillette sourit, joint les doigts</text><text x="42" y="168" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">en cœur et regarde le spectateur.</text><text x="42" y="195" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le logo désigne Digital Dubai.</text>
  <rect x="461" y="69" width="415" height="154" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="480" y="102" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Ce que précise la légende</text>
  <text x="480" y="141" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">L’enfant est un personnage virtuel.</text><text x="480" y="168" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Sa tenue et son parler familier</text><text x="480" y="195" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">l’inscrivent dans le cadre émirati.</text>
  <path d="M 231 227 V 251 H 363 V 270" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 670 227 V 251 H 537 V 270" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="67" y="275" width="766" height="118" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="88" y="312" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Interprétation</text>
  <text x="88" y="347" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">L’institution choisit une figure familière pour s’adresser aux habitants.</text><text x="88" y="374" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le document ne mesure pas la confiance qu’ils lui accordent.</text>
  </g>
</svg>
