<svg xmlns="http://www.w3.org/2000/svg" width="900" height="371" viewBox="0 0 900 371" role="img" aria-labelledby="titre description">
  <title id="titre">Comment vérifier le raisonnement proposé par un assistant</title>
  <desc id="description">En retirant deux fois vingt pour cent du prix restant, on passe de 100 à 80, puis à 64 dinars. Changer le montant initial permet de vérifier que l’élève a compris.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="371" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="41" font-size="26" fill="#182f43" font-weight="bold" text-anchor="start">Deux remises de 20 % donnent-elles une remise de 40 % ?</text>
  <rect x="25" y="92" width="227" height="96" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="138.5" y="124" font-size="17" fill="#182f43" font-weight="bold" text-anchor="middle">Prix de départ</text>
  <text x="138.5" y="164" font-size="27" fill="#182f43" font-weight="bold" text-anchor="middle">100 dinars</text>
  <rect x="338" y="92" width="250" height="96" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="463.0" y="124" font-size="17" fill="#182f43" font-weight="bold" text-anchor="middle">Après la première remise</text>
  <text x="463.0" y="164" font-size="27" fill="#182f43" font-weight="bold" text-anchor="middle">80 dinars</text>
  <rect x="649" y="92" width="227" height="96" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="762.5" y="124" font-size="17" fill="#182f43" font-weight="bold" text-anchor="middle">Après la seconde</text>
  <text x="762.5" y="164" font-size="27" fill="#182f43" font-weight="bold" text-anchor="middle">64 dinars</text>
  <path d="M255 143 H 327" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M590 143 H 641" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="285" y="82" font-size="20" fill="#075d63" font-weight="bold" text-anchor="middle">−20</text>
  <text x="617" y="82" font-size="20" fill="#075d63" font-weight="bold" text-anchor="middle">−16</text>
  <rect x="24" y="231" width="852" height="119" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="45" y="268" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Ce que l’élève peut vérifier sans écran</text>
  <text x="45" y="305" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">La seconde remise porte sur 80 dinars. Un cinquième de 80 vaut 16.</text><text x="45" y="332" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Sur un prix initial de 50 dinars, le même raisonnement conduit à 32.</text>
  </g>
</svg>
