<svg xmlns="http://www.w3.org/2000/svg" width="705" height="310" viewBox="0 0 705 310">
<title>Amplitudes de champ aux étapes des trajets de référence et de sonde</title>
<rect width="705" height="310" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<text x="16" y="33" fill="#18344a" font-size="17" font-weight="600" text-anchor="start">Champ incident : a₀</text>
<text x="230" y="33" fill="#617483" font-size="15" font-weight="400" text-anchor="start">Chaque passage en séparatrice multiplie le champ par 1/√2.</text>
<text x="16" y="110" fill="#13628b" font-size="16" font-weight="600" text-anchor="start">Référence</text>
<line x1="130.00" y1="104.00" x2="535.00" y2="104.00" stroke="#13628b" stroke-width="2"/>
<rect x="104.0" y="87" width="52" height="34" rx="6" fill="white" stroke="#13628b"/>
<text x="130" y="110" fill="#13628b" font-size="16" font-weight="400" text-anchor="middle">S₀  R</text>
<rect x="185.0" y="87" width="52" height="34" rx="6" fill="white" stroke="#13628b"/>
<text x="211" y="110" fill="#13628b" font-size="16" font-weight="400" text-anchor="middle">S₁  T</text>
<rect x="266.0" y="87" width="52" height="34" rx="6" fill="white" stroke="#13628b"/>
<text x="292" y="110" fill="#13628b" font-size="16" font-weight="400" text-anchor="middle">M₁</text>
<rect x="347.0" y="87" width="52" height="34" rx="6" fill="white" stroke="#13628b"/>
<text x="373" y="110" fill="#13628b" font-size="16" font-weight="400" text-anchor="middle">S₁  R</text>
<rect x="428.0" y="87" width="52" height="34" rx="6" fill="white" stroke="#13628b"/>
<text x="454" y="110" fill="#13628b" font-size="16" font-weight="400" text-anchor="middle">S₃  T</text>
<rect x="517.5" y="87" width="35" height="34" rx="6" fill="white" stroke="#13628b"/>
<text x="535" y="110" fill="#13628b" font-size="16" font-weight="400" text-anchor="middle">P</text>
<text x="130" y="146" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/√2</text>
<text x="211" y="146" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/2</text>
<text x="292" y="146" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/2</text>
<text x="373" y="146" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/√8</text>
<text x="454" y="146" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/4</text>
<text x="535" y="146" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/4</text>
<text x="16" y="211" fill="#ab4220" font-size="16" font-weight="600" text-anchor="start">Sonde</text>
<line x1="130.00" y1="205.00" x2="535.00" y2="205.00" stroke="#ab4220" stroke-width="2"/>
<rect x="104.0" y="188" width="52" height="34" rx="6" fill="white" stroke="#ab4220"/>
<text x="130" y="211" fill="#ab4220" font-size="16" font-weight="400" text-anchor="middle">S₀  T</text>
<rect x="185.0" y="188" width="52" height="34" rx="6" fill="white" stroke="#ab4220"/>
<text x="211" y="211" fill="#ab4220" font-size="16" font-weight="400" text-anchor="middle">S₂  T</text>
<rect x="266.0" y="188" width="52" height="34" rx="6" fill="white" stroke="#ab4220"/>
<text x="292" y="211" fill="#ab4220" font-size="16" font-weight="400" text-anchor="middle">M₂</text>
<rect x="347.0" y="188" width="52" height="34" rx="6" fill="white" stroke="#ab4220"/>
<text x="373" y="211" fill="#ab4220" font-size="16" font-weight="400" text-anchor="middle">S₂  R</text>
<rect x="428.0" y="188" width="52" height="34" rx="6" fill="white" stroke="#ab4220"/>
<text x="454" y="211" fill="#ab4220" font-size="16" font-weight="400" text-anchor="middle">S₃  R</text>
<rect x="517.5" y="188" width="35" height="34" rx="6" fill="white" stroke="#ab4220"/>
<text x="535" y="211" fill="#ab4220" font-size="16" font-weight="400" text-anchor="middle">P</text>
<text x="130" y="247" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/√2</text>
<text x="211" y="247" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/2</text>
<text x="292" y="247" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/2</text>
<text x="373" y="247" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/√8</text>
<text x="454" y="247" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/4</text>
<text x="535" y="247" fill="#617483" font-size="14" font-weight="400" text-anchor="middle">a₀/4</text>
<text x="16" y="293" fill="#617483" font-size="15" font-weight="400" text-anchor="start">R : réflexion   ·   T : transmission   ·   M₁ et M₂ : miroirs idéaux</text>
</g>
</svg>
