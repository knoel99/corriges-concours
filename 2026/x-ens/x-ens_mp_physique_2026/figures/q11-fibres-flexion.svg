<svg xmlns="http://www.w3.org/2000/svg" width="620" height="258" viewBox="0 0 620 258">
<title>Trois fibres de même angle dans une plaque fléchie</title>
<rect width="620" height="258" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" stroke-linejoin="round" stroke-linecap="round">
<line x1="190.00" y1="229.00" x2="48.95" y2="118.80" stroke="#617483" stroke-width="1.7"/>
<line x1="190.00" y1="229.00" x2="331.05" y2="118.80" stroke="#617483" stroke-width="1.7"/>
<path d="M 167.94,211.76 A 28,28 0 0 1 212.06,211.76" fill="none" stroke="#617483" stroke-width="1.5"/>
<text x="168" y="196" fill="#617483" font-size="16" font-weight="400" text-anchor="start">θ</text>
<circle cx="190.00" cy="229.00" r="4" fill="#18344a"/>
<text x="172" y="249" fill="#18344a" font-size="16" font-weight="400" text-anchor="start">C</text>
<path d="M 56.04,124.34 A 170,170 0 0 1 323.96,124.34" fill="none" stroke="#ab4220" stroke-width="4"/>
<path d="M 81.25,144.04 A 138,138 0 0 1 298.75,144.04" fill="none" stroke="#13628b" stroke-width="3" stroke-dasharray="8 4"/>
<path d="M 106.47,163.74 A 106,106 0 0 1 273.53,163.74" fill="none" stroke="#18344a" stroke-width="3"/>
<line x1="190.00" y1="225.00" x2="190.00" y2="91.00" stroke="#13628b" stroke-width="1.5"/>
<text x="197" y="203" fill="#13628b" font-size="17" font-weight="400" text-anchor="start">Rc</text>
<line x1="277.00" y1="83.00" x2="317.00" y2="46.00" stroke="#ab4220" stroke-width="1.2"/>
<line x1="265.00" y1="114.00" x2="317.00" y2="100.00" stroke="#13628b" stroke-width="1.2"/>
<line x1="257.00" y1="148.00" x2="317.00" y2="155.00" stroke="#18344a" stroke-width="1.2"/>
<text x="326" y="46" fill="#ab4220" font-size="17" font-weight="600" text-anchor="start">Fibre en extension</text>
<text x="326" y="69" fill="#ab4220" font-size="16" font-weight="400" text-anchor="start">r &gt; 0   ·   arc plus long</text>
<text x="326" y="103" fill="#13628b" font-size="17" font-weight="600" text-anchor="start">Fibre neutre</text>
<text x="326" y="125" fill="#13628b" font-size="16" font-weight="400" text-anchor="start">r = 0   ·   L = Rc θ</text>
<text x="326" y="159" fill="#18344a" font-size="17" font-weight="600" text-anchor="start">Fibre en compression</text>
<text x="326" y="181" fill="#18344a" font-size="16" font-weight="400" text-anchor="start">r &lt; 0   ·   arc plus court</text>
<text x="323" y="227" fill="#617483" font-size="14" font-weight="400" text-anchor="start">Même angle pour les trois fibres.</text>
</g>
</svg>
