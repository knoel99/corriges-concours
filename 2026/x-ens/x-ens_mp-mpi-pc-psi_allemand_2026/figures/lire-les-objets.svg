<svg xmlns="http://www.w3.org/2000/svg" width="760" height="278" viewBox="0 0 760 278" role="img" aria-labelledby="titre description"><title id="titre">Lire les objets de la frise</title><desc id="description">Quatre exemples sélectionnés dans le document officiel. Les positions indiquent leur ordre et les années sont inscrites.</desc><rect width="760" height="278" fill="#ffffff"/><text x="20" y="34" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#182e3d" font-weight="700" text-anchor="start">Une sélection publique de 2017</text><text x="20" y="64" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">La progression du temps relie des objets de statuts très différents.</text><line x1="66" y1="132" x2="689" y2="132" stroke="#48697a" stroke-width="2"/><circle cx="68" cy="132" r="7" fill="#07576a"/><text x="68" y="110" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#07576a" font-weight="700" text-anchor="middle">Buchdruck</text><text x="68" y="163" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#182e3d" font-weight="400" text-anchor="middle">vers 1450</text><circle cx="285" cy="132" r="7" fill="#07576a"/><text x="285" y="173" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#07576a" font-weight="700" text-anchor="middle">Automobil</text><text x="285" y="109" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#182e3d" font-weight="400" text-anchor="middle">1886</text><circle cx="492" cy="132" r="7" fill="#07576a"/><text x="492" y="110" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#07576a" font-weight="700" text-anchor="middle">Computer</text><text x="492" y="163" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#182e3d" font-weight="400" text-anchor="middle">1941</text><circle cx="686" cy="132" r="7" fill="#07576a"/><text x="686" y="173" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#07576a" font-weight="700" text-anchor="middle">Currywurst</text><text x="686" y="109" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#182e3d" font-weight="400" text-anchor="middle">1949</text><rect x="20" y="202" width="720" height="62" rx="8" fill="#e8f2f2"/><text x="34" y="227" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#07576a" font-weight="700" text-anchor="start">Un même patrimoine revendiqué</text><text x="34" y="250" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">Les découvertes techniques côtoient un aliment populaire.</text></svg>
