<svg xmlns="http://www.w3.org/2000/svg" width="760" height="269" viewBox="0 0 760 269" role="img" aria-labelledby="titre description"><title id="titre">Deux mesures distinctes en 2024</title><desc id="description">Les barres indépendantes représentent à la même échelle le recours au numérique, 36 pour cent, et la nouveauté régionale, 15 pour cent.</desc><rect width="760" height="269" fill="#ffffff"/><text x="20" y="34" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#182e3d" font-weight="700" text-anchor="start">Que mesurent les créations de 2024 ?</text><text x="20" y="109" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182e3d" font-weight="400" text-anchor="start">Recours au numérique</text><rect x="279" y="92" width="423" height="18" rx="3" fill="#ebeff1"/><rect x="279" y="92" width="152.28" height="18" rx="3" fill="#07576a"/><text x="439.28" y="107" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#07576a" font-weight="700" text-anchor="start">36 %</text><text x="20" y="168" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#182e3d" font-weight="400" text-anchor="start">Nouveauté dans la région</text><rect x="279" y="151" width="423" height="18" rx="3" fill="#ebeff1"/><rect x="279" y="151" width="63.45" height="18" rx="3" fill="#984322"/><text x="350.45" y="166" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#984322" font-weight="700" text-anchor="start">15 %</text><line x1="279.0" y1="184" x2="279.0" y2="189" stroke="#48697a" stroke-width="2"/><text x="279.0" y="208" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#182e3d" font-weight="400" text-anchor="middle">0 %</text><line x1="384.75" y1="184" x2="384.75" y2="189" stroke="#48697a" stroke-width="2"/><text x="384.75" y="208" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#182e3d" font-weight="400" text-anchor="middle">25 %</text><line x1="490.5" y1="184" x2="490.5" y2="189" stroke="#48697a" stroke-width="2"/><text x="490.5" y="208" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#182e3d" font-weight="400" text-anchor="middle">50 %</text><line x1="596.25" y1="184" x2="596.25" y2="189" stroke="#48697a" stroke-width="2"/><text x="596.25" y="208" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#182e3d" font-weight="400" text-anchor="middle">75 %</text><line x1="702.0" y1="184" x2="702.0" y2="189" stroke="#48697a" stroke-width="2"/><text x="702.0" y="208" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#182e3d" font-weight="400" text-anchor="middle">100 %</text><text x="20" y="251" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#07576a" font-weight="700" text-anchor="start">Un même projet peut répondre aux deux critères.</text></svg>
