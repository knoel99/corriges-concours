<svg xmlns="http://www.w3.org/2000/svg" width="760" height="267" viewBox="0 0 760 267" role="img" aria-labelledby="titre description"><title id="titre">Du raté à la mesure publique</title><desc id="description">Trois étapes de l’argumentation de la partie B. La mesure du chauffage fournit un exemple de ce que signifie apprendre par un nouvel essai.</desc><rect width="760" height="267" fill="#ffffff"/><text x="20" y="34" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#182e3d" font-weight="700" text-anchor="start">Comment répondre à Matzig sur l’éducation ?</text><rect x="20" y="71" width="221" height="134" rx="9" fill="#f9eee9"/><text x="33" y="101" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#984322" font-weight="700" text-anchor="start">Un échec concret</text><text x="33" y="133" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">Le capteur est fixé</text><text x="33" y="157" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">au-dessus du</text><text x="33" y="181" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">radiateur.</text><rect x="267" y="71" width="221" height="134" rx="9" fill="#e8f2f2"/><text x="280" y="101" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#07576a" font-weight="700" text-anchor="start">Une décision</text><text x="280" y="133" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">La classe déplace</text><text x="280" y="157" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">le capteur et refait</text><text x="280" y="181" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">la mesure.</text><rect x="515" y="71" width="221" height="134" rx="9" fill="#e8f2f2"/><text x="528" y="101" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#07576a" font-weight="700" text-anchor="start">Un critère public</text><text x="528" y="133" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">Quel temps accorder</text><text x="528" y="157" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">aux essais et à la</text><text x="528" y="181" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#182e3d" font-weight="400" text-anchor="start">lecture des résultats ?</text><path d="M245,138 h15 m-6,-5 6,5 -6,5" stroke="#476373" stroke-width="2.4" fill="none"/><path d="M493,138 h15 m-6,-5 6,5 -6,5" stroke="#476373" stroke-width="2.4" fill="none"/><text x="20" y="247" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#07576a" font-weight="700" text-anchor="start">Le lecteur peut juger une mesure concrète et ses conditions.</text></svg>
