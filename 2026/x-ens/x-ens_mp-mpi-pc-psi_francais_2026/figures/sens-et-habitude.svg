<svg xmlns="http://www.w3.org/2000/svg" width="900" height="418" viewBox="0 0 900 418" role="img" aria-labelledby="titre description">
  <title id="titre">Du signal donné à l’habitude acquise</title>
  <desc id="description">Les sensations orientent une première réaction. La mémoire permet de reconnaître les circonstances et d’anticiper une situation future. Le foin préparé en été sert à nourrir Bella en hiver.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="418" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="42" font-size="29" fill="#182f43" font-weight="bold" text-anchor="start">Quand un signal devient-il une habitude ?</text>
  <rect x="24" y="69" width="398" height="138" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="43" y="105" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Première rencontre</text>
  <text x="43" y="145" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le corps éprouve un plaisir</text><text x="43" y="172" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">ou une douleur et réagit.</text>
  <rect x="478" y="69" width="398" height="138" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="497" y="105" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Rencontre ultérieure</text>
  <text x="497" y="145" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le souvenir fait reconnaître</text><text x="497" y="172" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">la situation et guide le geste.</text>
  <path d="M 424 136 H 467" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 674 210 V 236 H 452 V 253" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="159" y="261" width="582" height="135" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="178" y="297" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Une saison à venir</text>
  <text x="178" y="337" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">À la belle saison, préparer le foin de Bella</text><text x="178" y="364" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">permet de devancer la pénurie de l’hiver.</text>
  </g>
</svg>
