<svg xmlns="http://www.w3.org/2000/svg" width="900" height="448" viewBox="0 0 900 448" role="img" aria-labelledby="titre description">
  <title id="titre">La paroi du Nautilus</title>
  <desc id="description">Aronnax confronte une hypothèse animale et une hypothèse technique, puis change d’interprétation devant la sonorité métallique et les plaques boulonnées.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="448" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="42" font-size="29" fill="#182f43" font-weight="bold" text-anchor="start">Que touche Aronnax ?</text>
  <rect x="24" y="65" width="852" height="88" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="43" y="99" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">La surface est dure.</text>
  <text x="43" y="131" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">À elle seule, cette sensation reste compatible avec deux interprétations.</text>
  <path d="M 450 156 V 179 H 230 V 196" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M450 179 H 669 V 196" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="24" y="203" width="415" height="141" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="43" y="239" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Un animal à carapace</text>
  <text x="43" y="279" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Hypothèse encore possible</text><text x="43" y="306" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">pour le naturaliste.</text>
  <rect x="460" y="203" width="416" height="141" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="479" y="239" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Une construction humaine</text>
  <text x="479" y="279" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le son métallique et les plaques</text><text x="479" y="306" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">boulonnées étayent cette lecture.</text>
  <path d="M 666 347 V 368 H 449 V 386" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <text x="450" y="425" font-size="23" fill="#182f43" font-weight="bold" text-anchor="middle">La question passe de l’espèce à l’auteur de l’objet.</text>
  </g>
</svg>
