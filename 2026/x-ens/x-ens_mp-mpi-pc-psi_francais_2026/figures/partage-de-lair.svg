<svg xmlns="http://www.w3.org/2000/svg" width="900" height="491" viewBox="0 0 900 491" role="img" aria-labelledby="titre description">
  <title id="titre">Un même besoin, deux interprétations du don</title>
  <desc id="description">Les compagnons choisissent de partager l’air. Ned interprète le geste comme un calcul de valeur. Aronnax y reconnaît un lien de gratitude.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="491" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="42" font-size="29" fill="#182f43" font-weight="bold" text-anchor="start">À qui donner l’air disponible ?</text>
  <rect x="24" y="68" width="852" height="90" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="43" y="104" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Sous les glaces</text>
  <text x="43" y="135" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Aronnax, Conseil et Ned ont le même besoin de respirer.</text>
  <path d="M 450 160 V 190" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="24" y="199" width="852" height="86" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="43" y="234" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Le choix des compagnons</text>
  <text x="43" y="265" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Conseil et Ned réservent à Aronnax de quoi reprendre haleine.</text>
  <path d="M 450 287 V 310 H 231 V 329" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 450 310 H 668 V 329" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="24" y="336" width="416" height="132" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="43" y="372" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Ned justifie son geste.</text>
  <text x="43" y="412" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Il suppose plus précieuse</text><text x="43" y="439" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">l’existence du professeur.</text>
  <rect x="459" y="336" width="417" height="132" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="478" y="372" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Aronnax lui répond.</text>
  <text x="478" y="412" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Il rejette cette hiérarchie</text><text x="478" y="439" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">et reconnaît ce qu’il leur doit.</text>
  </g>
</svg>
