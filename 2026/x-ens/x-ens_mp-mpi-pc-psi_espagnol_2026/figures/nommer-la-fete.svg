<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 255" role="img" aria-labelledby="titre description">
<title id="titre">Les mots qui désignent le 12 octobre</title><desc id="description">Comparer une loi espagnole, une décision argentine et une prise de parole gouvernementale.</desc>
<rect x="1" y="1" width="778" height="253" rx="8" fill="#fffdf8" stroke="#bfb6a6"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="33" fill="#202527" font-size="20" font-weight="600">Les mots qui désignent le 12 octobre</text>
<rect x="22" y="54" width="233" height="122" fill="white" stroke="#205358" rx="5"/><rect x="22" y="54" width="233" height="5" fill="#205358"/>
<text x="33" y="87" fill="#205358" font-size="17" font-weight="600">Espagne · 1987</text>
<text x="33" y="115" fill="#202527" font-size="15" font-weight="400">La loi consacre la</text>
<text x="33" y="137" fill="#202527" font-size="15" font-weight="400">Fiesta Nacional de España.</text>
<path d="M 138 176 v 18" fill="none" stroke="#205358" stroke-width="2"/>
<rect x="273" y="54" width="233" height="122" fill="white" stroke="#853b28" rx="5"/><rect x="273" y="54" width="233" height="5" fill="#853b28"/>
<text x="284" y="87" fill="#853b28" font-size="17" font-weight="600">Argentine · 2010</text>
<text x="284" y="115" fill="#202527" font-size="15" font-weight="400">La journée met en avant</text>
<text x="284" y="137" fill="#202527" font-size="15" font-weight="400">la diversité culturelle.</text>
<path d="M 389 176 v 18" fill="none" stroke="#853b28" stroke-width="2"/>
<rect x="524" y="54" width="233" height="122" fill="white" stroke="#503862" rx="5"/><rect x="524" y="54" width="233" height="5" fill="#503862"/>
<text x="535" y="87" fill="#503862" font-size="17" font-weight="600">Argentine · 2025</text>
<text x="535" y="115" fill="#202527" font-size="15" font-weight="400">Le discours officiel réemploie</text>
<text x="535" y="137" fill="#202527" font-size="15" font-weight="400">une ancienne dénomination.</text>
<path d="M 640 176 v 18" fill="none" stroke="#503862" stroke-width="2"/>
<path d="M 138 194 H 640" stroke="#756b61" stroke-width="2" fill="none"/>
<text x="24" y="231" fill="#202527" font-size="16" font-weight="600">En Argentine, le vocabulaire de 2025 et le nom légal sont à distinguer.</text>
</g></svg>
