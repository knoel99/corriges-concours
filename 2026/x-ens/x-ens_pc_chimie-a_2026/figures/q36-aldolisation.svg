<svg xmlns="http://www.w3.org/2000/svg" width="560" height="329" viewBox="0 0 560 329" role="img" aria-labelledby="title desc"><title id="title">Addition aldolique : formation de la liaison C16–C17</title><desc id="desc">Le doublet de la forme carbonée de l’énolate attaque le carbone de l’aldéhyde. Le doublet π du carbonyle rejoint son oxygène.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#076561"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#192c3b"><text x="22" y="27" font-size="20" text-anchor="start" fill="#192c3b">Formation de la liaison C16–C17</text><text x="22" y="56" font-size="14" text-anchor="start" fill="#192c3b">Forme carbonée de l’énolate</text><text x="254" y="56" font-size="14" text-anchor="start" fill="#192c3b">Aldéhyde</text><text x="20" y="146" font-size="22" text-anchor="start" fill="#192c3b">Rᴮ</text><line x1="49" y1="138" x2="75" y2="122" stroke="#243d50" stroke-width="2"/><text x="77" y="128" font-size="23" text-anchor="start" fill="#192c3b">C</text><line x1="92" y1="121" x2="121" y2="136" stroke="#243d50" stroke-width="2"/><text x="124" y="146" font-size="23" text-anchor="start" fill="#192c3b">CH₂</text><line x1="83" y1="106" x2="83" y2="86" stroke="#243d50" stroke-width="2"/><line x1="89" y1="106" x2="89" y2="86" stroke="#243d50" stroke-width="2"/><text x="78" y="81" font-size="23" text-anchor="start" fill="#192c3b">O</text><text x="155" y="132" font-size="17" text-anchor="start" fill="#192c3b">−</text><circle cx="157" cy="119" r="2" fill="#076561"/><circle cx="163" cy="119" r="2" fill="#076561"/><text x="218" y="141" font-size="22" text-anchor="start" fill="#192c3b">+</text><text x="277" y="143" font-size="23" text-anchor="start" fill="#192c3b">C</text><line x1="294" y1="137" x2="319" y2="151" stroke="#243d50" stroke-width="2"/><text x="322" y="162" font-size="22" text-anchor="start" fill="#192c3b">Rᶜ</text><line x1="273" y1="139" x2="256" y2="151" stroke="#243d50" stroke-width="2"/><text x="241" y="163" font-size="19" text-anchor="start" fill="#192c3b">H</text><line x1="284" y1="122" x2="284" y2="97" stroke="#243d50" stroke-width="2"/><line x1="291" y1="122" x2="291" y2="97" stroke="#243d50" stroke-width="2"/><text x="277" y="89" font-size="23" text-anchor="start" fill="#192c3b">O</text><path d="M164 115 Q216 68 276 127" fill="none" stroke="#076561" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M294 110 Q322 105 299 87" fill="none" stroke="#076561" stroke-width="2.3" marker-end="url(#arrow)"/><text x="145" y="172" font-size="14" text-anchor="middle" fill="#076561">C16</text><text x="288" y="172" font-size="14" text-anchor="middle" fill="#076561">C17</text><line x1="18" y1="192" x2="550" y2="192" stroke="#d2dfe1" stroke-width="1"/><text x="22" y="220" font-size="15" text-anchor="start" fill="#192c3b">Alcoolate formé</text><text x="28" y="261" font-size="22" text-anchor="start" fill="#192c3b">Rᴮ–C(=O)–CH₂</text><line x1="200" y1="255" x2="239" y2="255" stroke="#076561" stroke-width="3"/><text x="244" y="261" font-size="22" text-anchor="start" fill="#192c3b">CH(O⁻)–Rᶜ</text><text x="205" y="282" font-size="13" text-anchor="middle" fill="#076561">C16–C17</text><text x="22" y="310" font-size="14" text-anchor="start" fill="#192c3b">La protonation de l’oxygène conduit à la β-hydroxycétone.</text></g></svg>
