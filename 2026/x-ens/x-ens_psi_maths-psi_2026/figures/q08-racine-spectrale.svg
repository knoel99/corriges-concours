<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 286" role="img"><title>Racine positive sur un espace propre multiple</title><desc>Pour A = diag(4,4,1), toute racine symétrique positive agit par 2 sur le plan propre de 4 et par 1 sur la droite propre de 1.</desc><rect width="650" height="286" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="32" y="29" fill="#182f34" font-size="20" text-anchor="start" font-weight="700">La racine positive sur chaque espace propre</text><text x="111" y="80" fill="#51666c" font-size="14" text-anchor="middle" font-weight="700">Valeur propre de A</text><rect x="27" y="102" width="167" height="49" rx="3" fill="#e6f2f4" stroke="none"/><text x="111" y="133" fill="#15607b" font-size="20" text-anchor="middle" font-weight="400">λ = 4</text><line x1="198.00" y1="127.00" x2="231.00" y2="127.00" stroke="#51666c" stroke-width="2" stroke-dasharray=""/><polyline fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#51666c" stroke-width="2" points="224.00,122.00 231.00,127.00 224.00,132.00"/><rect x="27" y="172" width="167" height="49" rx="3" fill="#e6f2f4" stroke="none"/><text x="111" y="203" fill="#15607b" font-size="20" text-anchor="middle" font-weight="400">λ = 1</text><line x1="198.00" y1="197.00" x2="231.00" y2="197.00" stroke="#51666c" stroke-width="2" stroke-dasharray=""/><polyline fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#51666c" stroke-width="2" points="224.00,192.00 231.00,197.00 224.00,202.00"/><text x="322" y="80" fill="#51666c" font-size="14" text-anchor="middle" font-weight="700">Carré de M sur Eλ</text><rect x="238" y="102" width="167" height="49" rx="3" fill="#e6f2f4" stroke="none"/><text x="322" y="133" fill="#15607b" font-size="20" text-anchor="middle" font-weight="400">M² = 4 I</text><line x1="409.00" y1="127.00" x2="442.00" y2="127.00" stroke="#51666c" stroke-width="2" stroke-dasharray=""/><polyline fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#51666c" stroke-width="2" points="435.00,122.00 442.00,127.00 435.00,132.00"/><rect x="238" y="172" width="167" height="49" rx="3" fill="#e6f2f4" stroke="none"/><text x="322" y="203" fill="#15607b" font-size="20" text-anchor="middle" font-weight="400">M² = I</text><line x1="409.00" y1="197.00" x2="442.00" y2="197.00" stroke="#51666c" stroke-width="2" stroke-dasharray=""/><polyline fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#51666c" stroke-width="2" points="435.00,192.00 442.00,197.00 435.00,202.00"/><text x="533" y="80" fill="#51666c" font-size="14" text-anchor="middle" font-weight="700">M positive sur Eλ</text><rect x="449" y="102" width="167" height="49" rx="3" fill="#f9eae6" stroke="none"/><text x="533" y="133" fill="#ad4836" font-size="20" text-anchor="middle" font-weight="400">M = 2 I</text><rect x="449" y="172" width="167" height="49" rx="3" fill="#f9eae6" stroke="none"/><text x="533" y="203" fill="#ad4836" font-size="20" text-anchor="middle" font-weight="400">M = I</text><text x="325" y="261" fill="#51666c" font-size="15" text-anchor="middle" font-weight="400">L’espace propre de 4 peut avoir dimension supérieure à un.</text></g></svg>
