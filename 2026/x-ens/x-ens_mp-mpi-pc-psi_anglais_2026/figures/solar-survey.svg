<svg xmlns="http://www.w3.org/2000/svg" width="900" height="396" viewBox="0 0 900 396" role="img" aria-labelledby="titre description">
  <title id="titre">Expected effects of a nearby solar farm</title>
  <desc id="description">Two questions from the 2024 Pew survey. On the landscape, 45 percent answered yes, 42 no and 13 were unsure. On lower electricity prices, the figures were 44, 37 and 19 percent. There is no information on which individuals held both expectations.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="396" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="41" font-size="28" fill="#182f43" font-weight="bold" text-anchor="start">What do US adults expect from a nearby solar farm?</text>
  <text x="24" y="79" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Selected questions from the Pew survey, May 2024. Each strip represents 100%.</text>
  <text x="24" y="122" font-size="21" fill="#182f43" font-weight="bold" text-anchor="start">Would it make the landscape unattractive?</text>
  <rect x="24" y="136" width="382.5" height="58" fill="#075d63"/>
  <text x="215.25" y="172" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">Yes 45%</text>
  <rect x="406.5" y="136" width="357.0" height="58" fill="#445d74"/>
  <text x="585.0" y="172" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">No 42%</text>
  <rect x="763.5" y="136" width="110.5" height="58" fill="#e8dfe5"/>
  <text x="818.75" y="172" font-size="16" fill="#182f43" font-weight="bold" text-anchor="middle">Unsure 13%</text>
  <text x="24" y="243" font-size="21" fill="#182f43" font-weight="bold" text-anchor="start">Would it lower the price you pay for electricity?</text>
  <rect x="24" y="257" width="374.0" height="58" fill="#075d63"/>
  <text x="211.0" y="293" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">Yes 44%</text>
  <rect x="398.0" y="257" width="314.5" height="58" fill="#445d74"/>
  <text x="555.25" y="293" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">No 37%</text>
  <rect x="712.5" y="257" width="161.5" height="58" fill="#e8dfe5"/>
  <text x="793.25" y="293" font-size="16" fill="#182f43" font-weight="bold" text-anchor="middle">Unsure 19%</text>
  <text x="24" y="368" font-size="19" fill="#182f43" font-weight="normal" text-anchor="start">Each question has its own distribution. The chart does not link individual answers.</text>
  </g>
</svg>
