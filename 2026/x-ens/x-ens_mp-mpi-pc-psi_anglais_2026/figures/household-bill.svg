<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" role="img" aria-labelledby="titre description">
  <title id="titre">Two ways to lower a tenant’s bill</title>
  <desc id="description">A discount lowers what the customer pays. Insulation reduces the electricity needed for cooling. A tenant and a landlord have different powers to secure each benefit.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="432" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="42" font-size="27" fill="#182f43" font-weight="bold" text-anchor="start">What would lower the electricity bill for a rented flat?</text>
  <rect x="24" y="70" width="412" height="143" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="45" y="106" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Price per unit</text>
  <text x="45" y="144" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">A bill discount lowers what an</text><text x="45" y="171" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">eligible customer has to pay.</text>
  <rect x="462" y="70" width="414" height="143" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="483" y="106" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Units needed for cooling</text>
  <text x="483" y="144" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Insulating a flat can help keep it</text><text x="483" y="171" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">cool with less electricity.</text>
  <path d="M 231 216 V 240 H 315 V 258" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 670 216 V 240 H 583 V 258" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="153" y="264" width="594" height="83" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="450" y="297" font-size="24" fill="#182f43" font-weight="bold" text-anchor="middle">Household bill</text>
  <text x="450" y="328" font-size="20" fill="#182f43" font-weight="normal" text-anchor="middle">The tariff and the amount used both matter.</text>
  <text x="24" y="401" font-size="19" fill="#182f43" font-weight="normal" text-anchor="start">A tenant may qualify for a discount while still depending on the owner to insulate.</text>
  </g>
</svg>
