<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-labelledby="titre description">
  <title id="titre">Two sites in the energy transition</title>
  <desc id="description">The Economist describes an existing grid connection in Chile. Bernhard reports disagreement over the location of a proposed Nevada mine. Those examples bring out opposite implications of where a project is sited.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="455" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="25" y="42" font-size="27" fill="#182f43" font-weight="bold" text-anchor="start">What makes a particular site attractive or contentious?</text>
  <rect x="24" y="70" width="414" height="141" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="45" y="106" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Tamaya, Chile</text>
  <text x="45" y="144" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Former diesel site</text><text x="45" y="171" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Solar panels and storage</text>
  <rect x="461" y="70" width="415" height="141" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="482" y="106" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Ash Meadows, Nevada</text>
  <text x="482" y="144" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Proposed lithium mine</text><text x="482" y="171" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">On the edge of a wildlife refuge</text>
  <path d="M 232 214 V 242" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 667 214 V 242" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="24" y="249" width="414" height="143" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="45" y="285" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">A connection already exists</text>
  <text x="45" y="323" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">The developer can reuse the point</text><text x="45" y="350" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">where electricity enters the grid.</text>
  <rect x="461" y="249" width="415" height="143" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="482" y="285" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">The location is disputed</text>
  <text x="482" y="323" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Batteries need lithium. Which habitats</text><text x="482" y="350" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">might a mine harm?</text>
  <text x="450" y="430" font-size="21" fill="#182f43" font-weight="bold" text-anchor="middle">Infrastructure and habitats both attach value to particular places.</text>
  </g>
</svg>
