<svg xmlns="http://www.w3.org/2000/svg" width="910" height="347" viewBox="0 0 910 347" role="img" aria-labelledby="titre desc"><title id="titre">Voisinage au quartier du Port en 2018</title><desc id="desc">Documents 6 et 7 · En % des habitants enquêtés dans ce quartier ; Participer à des visites de convivialité 55 % ; Échanger des services 80 % ; Avoir eu un conflit depuis son installation 22 % ; S’être senti jugé par certains voisins 18 %. Une personne peut être comptée dans plusieurs barres.</desc><rect width="910" height="347" fill="#fbfaf6"/><g font-family="DejaVu Sans,sans-serif" fill="#193a40"><text x="18" y="29" font-size="20" font-weight="bold">Voisinage au quartier du Port en 2018</text><text x="18" y="55" font-size="15">Documents 6 et 7 · En % des habitants enquêtés dans ce quartier</text><text x="18" y="94" font-size="14">Participer à des visites de convivialité</text><rect x="367" y="75" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="75" width="264.0" height="24" fill="#367a77"/><text x="854" y="94" font-size="15">55 %</text><text x="18" y="142" font-size="14">Échanger des services</text><rect x="367" y="123" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="123" width="384.0" height="24" fill="#367a77"/><text x="854" y="142" font-size="15">80 %</text><text x="18" y="190" font-size="14">Avoir eu un conflit depuis son installation</text><rect x="367" y="171" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="171" width="105.6" height="24" fill="#367a77"/><text x="854" y="190" font-size="15">22 %</text><text x="18" y="238" font-size="14">S’être senti jugé par certains voisins</text><rect x="367" y="219" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="219" width="86.4" height="24" fill="#367a77"/><text x="854" y="238" font-size="15">18 %</text><text x="367" y="267" text-anchor="middle" font-size="13">0</text><text x="487" y="267" text-anchor="middle" font-size="13">25</text><text x="607" y="267" text-anchor="middle" font-size="13">50</text><text x="727" y="267" text-anchor="middle" font-size="13">75</text><text x="847" y="267" text-anchor="middle" font-size="13">100</text><text x="18" y="310" font-size="14">Une personne peut être comptée dans plusieurs barres.</text></g></svg>
