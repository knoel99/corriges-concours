<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="titre desc">
  <title id="titre">Du logement au stockage dans le regard de Sylvaine</title>
  <desc id="desc">Pour le narrateur, les nourrices sont hébergées. Pour Sylvaine, le bâtiment plein ressemble à un entrepôt de marchandises, ce qui lui fait employer le mot eingelagert. Le dessin met les deux lectures du même lieu face à face.</desc>
  <rect width="720" height="240" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="18" y="30" fill="#203542" font-size="20" font-weight="bold">Deux mots pour le même lieu</text>
    <rect x="19" y="56" width="309" height="108" rx="5" fill="#e6f2f0" stroke="#346959" stroke-width="2"/>
    <text x="37" y="82" fill="#284e41" font-size="16" font-weight="bold">Description de l’hébergement</text>
    <text x="37" y="111" fill="#233e35" font-size="20" font-style="italic">untergebracht</text>
    <text x="37" y="141" fill="#233e35" font-size="15">Des femmes attendent du travail.</text>
    <path d="M337 109 H382 M373 102 L382 109 L373 116" fill="none" stroke="#445560" stroke-width="2.5"/>
    <rect x="392" y="56" width="309" height="108" rx="5" fill="#fcf1dd" stroke="#8b682e" stroke-width="2"/>
    <text x="410" y="82" fill="#63491f" font-size="16" font-weight="bold">Pensée de Sylvaine</text>
    <text x="410" y="111" fill="#614318" font-size="20" font-style="italic">eingelagert</text>
    <text x="410" y="141" fill="#614318" font-size="15">On dirait des marchandises.</text>
    <text x="19" y="197" fill="#263944" font-size="16">La vue du hangar fait changer le verbe.</text>
    <text x="19" y="220" fill="#263944" font-size="15">Le lieu et les femmes qui s’y trouvent sont les mêmes.</text>
  </g>
</svg>
