<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Qui reconnaît qui dans le récit ?</title>
<desc id="description">Les frères L’un est plus léger et plus agile. Le père peut choisir qui descendra. Les voyageurs Leurs vêtements, leurs cheveux puis leurs visages se ressemblent. Grigori reconnaît des traits, pas des identités. Le père et sa fille Losaneta reprend la main levée puis les mots paternels. La même autorité continue à agir après le départ du père.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui reconnaît qui dans le récit ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de départ</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice dans le texte</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conséquence</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Les frères</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">L’un est plus léger et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">plus agile.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le père peut choisir qui</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">descendra.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Les voyageurs</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Leurs vêtements, leurs</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">cheveux puis leurs visages</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">se ressemblent.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Grigori reconnaît des</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">traits, pas des identités.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Le père et sa fille</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Losaneta reprend la main</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">levée puis les mots</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">paternels.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La même autorité continue à</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">agir après le départ du</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">père.</text>
</g>
</svg>
