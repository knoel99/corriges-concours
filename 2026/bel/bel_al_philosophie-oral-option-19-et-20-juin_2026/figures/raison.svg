<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img"><title>Trois inférences à examiner</title><desc>I, appendice. Il reste une cause inconnue.. Cette ignorance suffit-elle à prouver une intention ? II, XL. Plusieurs images se superposent.. La généralité du mot suffit-elle à établir une propriété commune ? II, XLIX. Un cheval ailé est imaginé.. Une autre idée vient-elle exclure son existence présente ?</desc><rect width="880" height="300" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="42" font-size="26" fill="#17394c" font-weight="bold">Trois inférences à examiner</text><rect x="24" y="61" width="832" height="67" fill="#e8eee8" stroke="none" stroke-width="1"/><rect x="24" y="61" width="8" height="67" fill="#967043" stroke="none" stroke-width="1"/><text x="43" y="98" font-size="16" fill="#17394c" font-weight="bold">I, appendice</text><text x="217" y="88" font-size="18" fill="#17394c" font-weight="bold">Il reste une cause inconnue.</text><text x="217" y="113" font-size="15" fill="#17394c">Cette ignorance suffit-elle à prouver une intention ?</text><rect x="24" y="138" width="832" height="67" fill="#e8eee8" stroke="none" stroke-width="1"/><rect x="24" y="138" width="8" height="67" fill="#967043" stroke="none" stroke-width="1"/><text x="43" y="175" font-size="16" fill="#17394c" font-weight="bold">II, XL</text><text x="217" y="165" font-size="18" fill="#17394c" font-weight="bold">Plusieurs images se superposent.</text><text x="217" y="190" font-size="15" fill="#17394c">La généralité du mot suffit-elle à établir une propriété commune ?</text><rect x="24" y="215" width="832" height="67" fill="#e8eee8" stroke="none" stroke-width="1"/><rect x="24" y="215" width="8" height="67" fill="#967043" stroke="none" stroke-width="1"/><text x="43" y="252" font-size="16" fill="#17394c" font-weight="bold">II, XLIX</text><text x="217" y="242" font-size="18" fill="#17394c" font-weight="bold">Un cheval ailé est imaginé.</text><text x="217" y="267" font-size="15" fill="#17394c">Une autre idée vient-elle exclure son existence présente ?</text></g></svg>
