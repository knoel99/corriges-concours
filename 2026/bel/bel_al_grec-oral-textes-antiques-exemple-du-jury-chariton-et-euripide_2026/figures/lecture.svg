<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Comment la nourrice change-t-elle la question ?</title>
<desc id="description">439–450 Cypris agit sur tous les êtres. La passion paraît commune à tous. 451–472 Dieux amoureux, époux et pères accommodants. La nourrice conseille d’accepter une part d’imperfection. 473–481 Injonctions, maladie, remède, expédients. La consolation tend à devenir un projet d’action.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment la nourrice change-t-elle la question ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Vers</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Argument mobilisé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet sur Phèdre</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">439–450</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Cypris agit sur tous les</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">êtres.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La passion paraît commune à</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">tous.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">451–472</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Dieux amoureux, époux et</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">pères accommodants.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La nourrice conseille</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">d’accepter une part</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">d’imperfection.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">473–481</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Injonctions, maladie,</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">remède, expédients.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La consolation tend à</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">devenir un projet d’action.</text>
</g>
</svg>
