<svg xmlns="http://www.w3.org/2000/svg" width="780" height="439" viewBox="0 0 780 439" role="img" aria-labelledby="titre description">
<title id="titre">Les deux partages de la période de Plutarque</title>
<desc id="description">Particuliers et pauvres : Au génitif absolu, ils accueillent son appel.. Position sociale. Puissants : Au datif, ils reçoivent la proposition de Thésée.. Position sociale. Les uns : À l’accusatif, ils sont les objets de sa persuasion.. Réaction. Les autres : Au nominatif, ils acquiescent aussi par crainte.. Réaction.</desc>
<rect width="100%" height="100%" fill="#fcfbf6"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="28" y="32" font-size="19" font-weight="bold" fill="#183c50">Les deux partages de la période de Plutarque</text>
<rect x="26" y="50" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="50" width="8" height="76" fill="#183c50"/>
<text x="48" y="79" font-size="19" font-weight="bold" fill="#183c50">Particuliers et pauvres</text>
<text x="48" y="107" font-size="17" fill="#283740">Au génitif absolu, ils accueillent son appel.</text>
<text x="724" y="79" text-anchor="end" fill="#475b65" font-size="15">Position sociale</text>
<path d="M390 126v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="146" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="146" width="8" height="76" fill="#205455"/>
<text x="48" y="175" font-size="19" font-weight="bold" fill="#205455">Puissants</text>
<text x="48" y="203" font-size="17" fill="#283740">Au datif, ils reçoivent la proposition de Thésée.</text>
<text x="724" y="175" text-anchor="end" fill="#475b65" font-size="15">Position sociale</text>
<path d="M390 222v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="242" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="242" width="8" height="76" fill="#775133"/>
<text x="48" y="271" font-size="19" font-weight="bold" fill="#775133">Les uns</text>
<text x="48" y="299" font-size="17" fill="#283740">À l’accusatif, ils sont les objets de sa persuasion.</text>
<text x="724" y="271" text-anchor="end" fill="#475b65" font-size="15">Réaction</text>
<path d="M390 318v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="338" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="338" width="8" height="76" fill="#523f65"/>
<text x="48" y="367" font-size="19" font-weight="bold" fill="#523f65">Les autres</text>
<text x="48" y="395" font-size="17" fill="#283740">Au nominatif, ils acquiescent aussi par crainte.</text>
<text x="724" y="367" text-anchor="end" fill="#475b65" font-size="15">Réaction</text>
</g>
</svg>
