<svg xmlns="http://www.w3.org/2000/svg" width="720" height="231" viewBox="0 0 720 231" role="img" aria-labelledby="titre description">
<title id="titre">Classer les citoyens, administrer la collectivité</title>
<desc id="description">Recenser Auguste, Res gestae 8 Donner un nombre au peuple Réviser les rangs Censure de 184 av. J.-C. Apprécier la dignité Ouvrir les honneurs Table de Claude, 48 Redéfinir le recrutement</desc>
<rect width="720" height="231" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Classer les citoyens, administrer la collectivité</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Opération</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Témoin</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet politique</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Recenser</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Auguste, Res gestae 8</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Donner un nombre au peuple</text>
<rect x="10" y="137" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Réviser les rangs</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Censure de 184 av. J.-C.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Apprécier la dignité</text>
<rect x="10" y="182" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="207" font-size="15" font-weight="700" fill="#162d3b">Ouvrir les honneurs</text>
<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">Table de Claude, 48</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">Redéfinir le recrutement</text>
</g>
</svg>
