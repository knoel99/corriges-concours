<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="titre description">
<title id="titre">Rendre une filiation politiquement efficace</title>
<desc id="description">Funérailles aristocratiques Éloge et insignes au Forum Le fils doit encore être élu Testament de César Nom, soutiens et monnaie La concurrence demeure Adoptions du prince Honneurs et reconnaissance La succession reste ouverte</desc>
<rect width="720" height="253" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Rendre une filiation politiquement efficace</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Geste familial</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Relais public</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Limite</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Funérailles</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">aristocratiques</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Éloge et insignes au Forum</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le fils doit encore être</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">élu</text>
<rect x="10" y="159" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Testament de César</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Nom, soutiens et monnaie</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La concurrence demeure</text>
<rect x="10" y="204" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Adoptions du prince</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Honneurs et reconnaissance</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">La succession reste ouverte</text>
</g>
</svg>
