<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">El mismo lance pasa por tres voces</title>
<desc id="description">Alarma doméstica Le indigna el trato del hermano mayor. Oye una posible acusación. Plaza narrada Vio callarse y huir a una tapada. Reconoce su propia fuga. Consejo moral Cree oír a una hermana prudente. Se representa censurando a la desconocida.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">El mismo lance pasa por tres voces</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Momento</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qué sabe Luis</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué hace Ángela</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Alarma doméstica</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le indigna el trato del</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">hermano mayor.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Oye una posible acusación.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Plaza narrada</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Vio callarse y huir a una</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">tapada.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Reconoce su propia fuga.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Consejo moral</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Cree oír a una hermana</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">prudente.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Se representa censurando a</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">la desconocida.</text>
</g>
</svg>
