<svg xmlns="http://www.w3.org/2000/svg" width="780" height="439" viewBox="0 0 780 439" role="img" aria-labelledby="titre description">
<title id="titre">Suivre les sujets du discours indirect</title>
<desc id="description">La reine reconnaît être venue : fateri → se uenisse : Thalestris est le sujet des deux infinitifs.. Aveu. Le roi aurait des héritiers : ex qua … ipse : le relatif désigne la reine, le pronom masculin le roi.. Justification. La reine disposerait de l’enfant : retenturam / reddituram : les futurs renvoient tous deux à la reine.. Promesse. Le roi peut la laisser repartir : pateretur → se abire : Alexandre déciderait, Thalestris repartirait.. Prière.</desc>
<rect width="100%" height="100%" fill="#fcfbf6"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="28" y="32" font-size="19" font-weight="bold" fill="#183c50">Suivre les sujets du discours indirect</text>
<rect x="26" y="50" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="50" width="8" height="76" fill="#183c50"/>
<text x="48" y="79" font-size="19" font-weight="bold" fill="#183c50">La reine reconnaît être venue</text>
<text x="48" y="107" font-size="17" fill="#283740">fateri → se uenisse : Thalestris est le sujet des deux infinitifs.</text>
<text x="724" y="79" text-anchor="end" fill="#475b65" font-size="15">Aveu</text>
<path d="M390 126v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="146" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="146" width="8" height="76" fill="#205455"/>
<text x="48" y="175" font-size="19" font-weight="bold" fill="#205455">Le roi aurait des héritiers</text>
<text x="48" y="203" font-size="17" fill="#283740">ex qua … ipse : le relatif désigne la reine, le pronom masculin le roi.</text>
<text x="724" y="175" text-anchor="end" fill="#475b65" font-size="15">Justification</text>
<path d="M390 222v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="242" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="242" width="8" height="76" fill="#775133"/>
<text x="48" y="271" font-size="19" font-weight="bold" fill="#775133">La reine disposerait de l’enfant</text>
<text x="48" y="299" font-size="17" fill="#283740">retenturam / reddituram : les futurs renvoient tous deux à la reine.</text>
<text x="724" y="271" text-anchor="end" fill="#475b65" font-size="15">Promesse</text>
<path d="M390 318v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="338" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="338" width="8" height="76" fill="#523f65"/>
<text x="48" y="367" font-size="19" font-weight="bold" fill="#523f65">Le roi peut la laisser repartir</text>
<text x="48" y="395" font-size="17" fill="#283740">pateretur → se abire : Alexandre déciderait, Thalestris repartirait.</text>
<text x="724" y="367" text-anchor="end" fill="#475b65" font-size="15">Prière</text>
</g>
</svg>
