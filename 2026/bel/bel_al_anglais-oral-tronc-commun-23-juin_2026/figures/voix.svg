<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">What changes between the opening and the close?</title>
<desc id="description">Bradstreet The book is taken from its mother. The mother now sends it out herself. Browning Porphyria acts; the speaker listens. He speaks for her and hears no answer. Hardy The wreck lies apart from human society. Two separate histories are made to collide. Cohen A voice promises to become something for you. Historical suffering challenges the listener.</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What changes between the opening and the close?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Text</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Opening position</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What the ending alters</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Bradstreet</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">The book is taken from its</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">mother.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">The mother now sends it out</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">herself.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Browning</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Porphyria acts; the</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">speaker listens.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">He speaks for her and hears</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">no answer.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Hardy</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">The wreck lies apart from</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">human society.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Two separate histories are</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">made to collide.</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Cohen</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">A voice promises to become</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">something for you.</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">Historical suffering</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">challenges the listener.</text>
</g>
</svg>
