<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">Reversals of knowledge and judgment</title>
<desc id="description">McKay Hatred is guarded inside the heart. It conditions the sweetness of looking at the city. Sidney The neighbours must mourn dead Love. The lover publicly retracts his own news. Keats Sleep can gently close the eyes. Conscience calls for a deeper kind of closure. Radcliffe, chapter IV A hiding place should end the search. A further door renews the desire to know.</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Reversals of knowledge and judgment</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Text</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Starting assumption</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Turn to test in the text</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">McKay</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Hatred is guarded inside</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">the heart.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">It conditions the sweetness</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">of looking at the city.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Sidney</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">The neighbours must mourn</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">dead Love.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">The lover publicly retracts</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">his own news.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Keats</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Sleep can gently close the</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">eyes.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Conscience calls for a</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">deeper kind of closure.</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Radcliffe, chapter IV</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">A hiding place should end</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">the search.</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">A further door renews the</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">desire to know.</text>
</g>
</svg>
