<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Qui regarde, qui se reproche, qui décide ?</title>
<desc id="description">Édouard observe Le regard habituel manque ce soir-là. Imparfait de l’habitude et plus-que-parfait du geste accompli. Albert se juge Le prix des souliers devient une exclamation. Garder le ton de la pensée et le pluriel des dettes. Édouard se décide Son ami est triste. Lui-même brûle de parler. Nommer la décision, puis distinguer ses deux motifs.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui regarde, qui se reproche, qui décide ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Foyer du récit</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice dans la scène</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Choix de traduction</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Édouard observe</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le regard habituel manque</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">ce soir-là.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Imparfait de l’habitude et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">plus-que-parfait du geste</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">accompli.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Albert se juge</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Le prix des souliers</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">devient une exclamation.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Garder le ton de la pensée</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">et le pluriel des dettes.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Édouard se décide</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Son ami est triste. Lui-</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">même brûle de parler.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Nommer la décision, puis</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">distinguer ses deux motifs.</text>
</g>
</svg>
