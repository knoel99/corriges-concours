<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" role="img" aria-labelledby="titre description">
<title id="titre">Who claims to represent whom?</title>
<desc id="description">Lucas Brighton and voices without seats A victory raises questions about the electoral system. Farage Rally audiences and non-members A party public is presented as a national coalition. Lammy Named constituents and citizens Casework becomes evidence against a government policy. Wilkinson Independent women in lodgings Work is regulated before workers can elect representatives.</desc>
<rect width="720" height="408" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who claims to represent whom?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Speaker</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Constituency invoked</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Political consequence</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Lucas</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Brighton and voices</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">without seats</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">A victory raises questions</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">about the electoral system.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Farage</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Rally audiences and non-</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">members</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">A party public is presented</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">as a national coalition.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Lammy</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Named constituents and</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">citizens</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Casework becomes evidence</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">against a government</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">policy.</text>
<rect x="10" y="315" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">Wilkinson</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">Independent women in</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">lodgings</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Work is regulated before</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">workers can elect</text>
<text x="473" y="384" font-size="15" font-weight="400" fill="#162d3b">representatives.</text>
</g>
</svg>
