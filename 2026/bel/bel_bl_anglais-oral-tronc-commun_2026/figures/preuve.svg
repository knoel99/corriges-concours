<svg xmlns="http://www.w3.org/2000/svg" width="720" height="431" viewBox="0 0 720 431" role="img" aria-labelledby="titre description">
<title id="titre">Persuading a public to see an injury</title>
<desc id="description">Kennedy A British poll on withdrawal Consent to a united Ireland is a separate question. Attlee An entrepreneur welcomes insurance. One example illustrates a possible incentive. London Output figures and hungry bodies Who gains matters as much as what is produced. Liverpool pamphleteer A sailor recalls his own impressment. He cannot speak for the people enslaved abroad. Cunningham The Arts Council fears censorship. A risk can exist before any prosecution.</desc>
<rect width="720" height="431" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Persuading a public to see an injury</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Speaker</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Evidence offered</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What the evidence leaves open</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Kennedy</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A British poll on</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">withdrawal</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Consent to a united Ireland</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">is a separate question.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Attlee</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">An entrepreneur welcomes</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">insurance.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">One example illustrates a</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">possible incentive.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">London</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Output figures and hungry</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">bodies</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Who gains matters as much</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">as what is produced.</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Liverpool pamphleteer</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">A sailor recalls his own</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">impressment.</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">He cannot speak for the</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">people enslaved abroad.</text>
<rect x="10" y="360" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="385" font-size="15" font-weight="700" fill="#162d3b">Cunningham</text>
<text x="229" y="385" font-size="15" font-weight="400" fill="#162d3b">The Arts Council fears</text>
<text x="229" y="407" font-size="15" font-weight="400" fill="#162d3b">censorship.</text>
<text x="473" y="385" font-size="15" font-weight="400" fill="#162d3b">A risk can exist before any</text>
<text x="473" y="407" font-size="15" font-weight="400" fill="#162d3b">prosecution.</text>
</g>
</svg>
