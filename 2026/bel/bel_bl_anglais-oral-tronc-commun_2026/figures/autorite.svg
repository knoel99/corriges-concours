<svg xmlns="http://www.w3.org/2000/svg" width="720" height="431" viewBox="0 0 720 431" role="img" aria-labelledby="titre description">
<title id="titre">From experience and precedent to authority</title>
<desc id="description">Darwin What travellers can actually witness Could an enslaved informant answer freely? Southern Manifesto Court precedents and custom Whose consent vanishes from this history? Mother Jones Three boys and official correspondence Who can decide to hear children speak? O’Sullivan Statehood treated as accomplished Who lacks a voice in the welcome? Clark The reversal of policy in 1917 Who bears the cost of protecting trade?</desc>
<rect width="720" height="431" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">From experience and precedent to authority</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Speaker</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Main claim to authority</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question for a listener</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Darwin</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">What travellers can</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">actually witness</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Could an enslaved informant</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">answer freely?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Southern Manifesto</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Court precedents and</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">custom</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Whose consent vanishes from</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">this history?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Mother Jones</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Three boys and official</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">correspondence</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Who can decide to hear</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">children speak?</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">O’Sullivan</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Statehood treated as</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">accomplished</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">Who lacks a voice in the</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">welcome?</text>
<rect x="10" y="360" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="385" font-size="15" font-weight="700" fill="#162d3b">Clark</text>
<text x="229" y="385" font-size="15" font-weight="400" fill="#162d3b">The reversal of policy in</text>
<text x="229" y="407" font-size="15" font-weight="400" fill="#162d3b">1917</text>
<text x="473" y="385" font-size="15" font-weight="400" fill="#162d3b">Who bears the cost of</text>
<text x="473" y="407" font-size="15" font-weight="400" fill="#162d3b">protecting trade?</text>
</g>
</svg>
