<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 193" width="800" height="193" role="img" aria-labelledby="titre description">
<title id="titre">Le nom de Léry dans la rencontre</title>
<desc id="description">De la prononciation de Jean en Nian, au rapprochement avec une huître, puis au nom que le voyageur se donne. La médiation implique successivement les hôtes, le truchement et le voyageur.</desc>
<rect width="800" height="193" fill="white"/>
<rect x="9" y="28" width="230" height="135" rx="12" fill="#edf5f5" stroke="#426378" stroke-width="2"/><text x="24" y="63" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#19334a">Les hôtes</text><text x="24" y="103" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#19334a">« Jean » devient</text><text x="24" y="131" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#19334a">« Nian » à l’oreille.</text><path d="M242 96 H271 M263 90 l8 6 -8 6" fill="none" stroke="#3c5464" stroke-width="2.5"/><rect x="278" y="28" width="238" height="135" rx="12" fill="#f2f1fa" stroke="#625780" stroke-width="2"/><text x="293" y="63" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#19334a">Le truchement</text><text x="293" y="103" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#19334a">« Léry » désigne</text><text x="293" y="131" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#19334a">aussi une huître.</text><path d="M518 96 H546 M538 90 l8 6 -8 6" fill="none" stroke="#3c5464" stroke-width="2.5"/><rect x="553" y="28" width="239" height="135" rx="12" fill="#fff6e7" stroke="#946a3c" stroke-width="2"/><text x="568" y="63" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" fill="#19334a">Le voyageur</text><text x="568" y="103" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#19334a">Il se présente comme</text><text x="568" y="131" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#19334a">« Léry-oussou ».</text>
</svg>
