<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 255" width="800" height="255" role="img" aria-labelledby="titre description">
<title id="titre">Du voyage au pèlerinage</title>
<desc id="description">À gauche, le pèlerinage est une espèce de voyage. À droite, Viegnes étend son orientation spirituelle à tout voyage. Le passage de l’un à l’autre appelle une justification.</desc>
<rect width="800" height="255" fill="white"/>
<rect x="14" y="22" width="348" height="211" rx="12" fill="#eff6f8" stroke="#426378" stroke-width="2"/><text x="34" y="55" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#19334a">Sens courant</text><text x="34" y="89" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#19334a">Ensemble des voyages</text><rect x="46" y="109" width="277" height="98" rx="12" fill="#fff" stroke="#426378" stroke-width="2"/><text x="64" y="140" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#19334a">Pèlerinages</text><text x="64" y="168" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#19334a">Un lieu de dévotion,</text><text x="64" y="190" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#19334a">un itinéraire orienté.</text><path d="M372 127 H420 M412 121 l8 6 -8 6" fill="none" stroke="#3c5464" stroke-width="2.5"/><rect x="430" y="22" width="356" height="211" rx="12" fill="#fff6e7" stroke="#946a3c" stroke-width="2"/><text x="450" y="55" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#19334a">Hypothèse de Viegnes</text><text x="450" y="97" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#19334a">Chaque voyage</text><text x="450" y="128" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal" fill="#19334a">serait aussi un pèlerinage.</text><text x="450" y="170" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#19334a">Quelle destination donner</text><text x="450" y="194" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" fill="#19334a">alors à une errance ?</text>
</svg>
