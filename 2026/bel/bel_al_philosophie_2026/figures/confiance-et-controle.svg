<svg xmlns="http://www.w3.org/2000/svg" width="900" height="407" viewBox="0 0 900 407" role="img" aria-labelledby="titre description">
  <title id="titre">Confiance et contrôle dans une enquête statistique</title>
  <desc id="description">La division du travail permet au lecteur de critiquer le résultat publié en examinant comment la population et les critères ont été définis.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="407" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="39" font-size="29" fill="#182f43" font-weight="bold" text-anchor="start">Qui peut contrôler un taux de chômage ?</text>
  <rect x="24" y="66" width="852" height="88" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="44" y="117" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Enquêteurs</text>
  <path d="M 242 84 V 136" fill="none" stroke="#b4c2c9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="263" y="100" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Interroger un échantillon</text>
  <text x="263" y="130" font-size="19" fill="#182f43" font-weight="normal" text-anchor="start">Préciser la population et la période.</text>
  <path d="M 457 156 v 20" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="24" y="181" width="852" height="88" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="44" y="232" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Statisticiens</text>
  <path d="M 242 199 V 251" fill="none" stroke="#b4c2c9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="263" y="215" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Construire le taux</text>
  <text x="263" y="245" font-size="19" fill="#182f43" font-weight="normal" text-anchor="start">Appliquer une définition explicite du chômage.</text>
  <path d="M 457 271 v 20" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="24" y="296" width="852" height="88" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="44" y="347" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Lecteurs</text>
  <path d="M 242 314 V 366" fill="none" stroke="#b4c2c9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="263" y="330" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Interroger le résultat</text>
  <text x="263" y="360" font-size="19" fill="#182f43" font-weight="normal" text-anchor="start">Examiner la définition et sa sensibilité aux choix retenus.</text>
  </g>
</svg>
