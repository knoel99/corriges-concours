<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="titre description">
  <title id="titre">Expertise et décision publique</title>
  <desc id="description">Deux justifications alimentent une même décision : la modélisation du risque de crue et la délibération sur les priorités des personnes concernées.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="390" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="39" font-size="29" fill="#182f43" font-weight="bold" text-anchor="start">Faut-il construire la digue ?</text>
  <rect x="24" y="65" width="417" height="139" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="43" y="100" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Expertise hydrologique</text>
  <text x="43" y="136" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Quels quartiers seraient inondés ?</text><text x="43" y="163" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">À quel débit et avec quelle</text><text x="43" y="190" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">incertitude ?</text>
  <rect x="459" y="65" width="417" height="139" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="479" y="100" font-size="22" fill="#075d63" font-weight="bold" text-anchor="start">Délibération sur les priorités</text>
  <text x="479" y="136" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Quels dommages éviter en priorité ?</text><text x="479" y="163" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Qui supporterait les coûts et</text><text x="479" y="190" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">le déplacement du risque ?</text>
  <path d="M 234 209 V 234 H 414 L 445 259" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 667 209 V 234 H 486 L 455 259" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="151" y="267" width="598" height="99" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="450" y="304" font-size="24" fill="#6b4261" font-weight="bold" text-anchor="middle">Décision à justifier</text>
  <text x="450" y="341" font-size="21" fill="#182f43" font-weight="normal" text-anchor="middle">Comparer les options et expliciter le choix retenu.</text>
  </g>
</svg>
