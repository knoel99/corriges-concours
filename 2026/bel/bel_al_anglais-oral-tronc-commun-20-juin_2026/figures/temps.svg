<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">How does an ordinary object measure a life?</title>
<desc id="description">Eliot A coffee spoon at the table A repeated gesture becomes a unit of personal time. Larkin A locked door at college A familiar room makes the earlier self inaccessible. Larkin Lines of rail in moonlight Their divergence can be seen long after a life has taken its course.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">How does an ordinary object measure a life?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Poem</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Object</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">The change in scale</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Eliot</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A coffee spoon at the</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">table</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">A repeated gesture becomes</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">a unit of personal time.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Larkin</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">A locked door at college</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">A familiar room makes the</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">earlier self inaccessible.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Larkin</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Lines of rail in moonlight</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Their divergence can be</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">seen long after a life has</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">taken its course.</text>
</g>
</svg>
