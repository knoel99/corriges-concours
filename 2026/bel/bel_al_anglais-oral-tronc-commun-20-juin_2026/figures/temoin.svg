<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">What is the witness able to prove?</title>
<desc id="description">Pages 25–27 The narrator closely describes the eyes of Ligeia. What gives them their extraordinary expression? Pages 32–34 He built a room where looking can mislead. What did he actually see fall into the cup? Pages 35–37 He recognises the eyes and cries out a name. Who else can confirm the identity?</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What is the witness able to prove?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">American Museum</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Evidence in the story</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What remains open</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Pages 25–27</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">The narrator closely</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">describes the eyes of</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">Ligeia.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">What gives them their</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">extraordinary expression?</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Pages 32–34</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">He built a room where</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">looking can mislead.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">What did he actually see</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">fall into the cup?</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Pages 35–37</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">He recognises the eyes and</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">cries out a name.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Who else can confirm the</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">identity?</text>
</g>
</svg>
