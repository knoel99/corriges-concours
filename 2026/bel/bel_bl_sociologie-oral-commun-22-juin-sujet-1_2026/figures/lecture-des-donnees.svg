<svg xmlns="http://www.w3.org/2000/svg" width="910" height="251" viewBox="0 0 910 251" role="img" aria-labelledby="titre desc"><title id="titre">Consignes strictement appliquées selon la position au travail</title><desc id="desc">Document 3 · Salariés en 1991 · En % de chaque groupe ; Cadres et professions intellectuelles supérieures 20.5 % ; Ouvriers 52.8 %. Un écart de 32,3 points sur les consignes ne mesure pas un vote individuel.</desc><rect width="910" height="251" fill="#fbfaf6"/><g font-family="DejaVu Sans,sans-serif" fill="#193a40"><text x="18" y="29" font-size="20" font-weight="bold">Consignes strictement appliquées selon la position au travail</text><text x="18" y="55" font-size="15">Document 3 · Salariés en 1991 · En % de chaque groupe</text><text x="18" y="94" font-size="14">Cadres et professions intellectuelles supérieures</text><rect x="367" y="75" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="75" width="98.4" height="24" fill="#367a77"/><text x="854" y="94" font-size="15">20,5 %</text><text x="18" y="142" font-size="14">Ouvriers</text><rect x="367" y="123" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="123" width="253.4" height="24" fill="#367a77"/><text x="854" y="142" font-size="15">52,8 %</text><text x="367" y="171" text-anchor="middle" font-size="13">0</text><text x="487" y="171" text-anchor="middle" font-size="13">25</text><text x="607" y="171" text-anchor="middle" font-size="13">50</text><text x="727" y="171" text-anchor="middle" font-size="13">75</text><text x="847" y="171" text-anchor="middle" font-size="13">100</text><text x="18" y="214" font-size="14">Un écart de 32,3 points sur les consignes ne mesure pas un vote individuel.</text></g></svg>
