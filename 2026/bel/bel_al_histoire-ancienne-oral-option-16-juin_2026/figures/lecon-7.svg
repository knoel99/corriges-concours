<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="titre description">
<title id="titre">Tâche, durée et sortie de la dictature</title>
<desc id="description">Fabius, 217 av. J.-C. Répondre à une crise Pouvoir provisoire Sylla, 82 av. J.-C. Réorganiser la République Renonciation ultérieure César puis Auguste Titre perpétuel puis refusé Mémoire d’un seuil franchi</desc>
<rect width="720" height="253" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Tâche, durée et sortie de la dictature</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Mission ou formule</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question de durée</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Fabius, 217 av. J.-C.</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Répondre à une crise</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Pouvoir provisoire</text>
<rect x="10" y="137" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Sylla, 82 av. J.-C.</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Réorganiser la République</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Renonciation ultérieure</text>
<rect x="10" y="182" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="207" font-size="15" font-weight="700" fill="#162d3b">César puis Auguste</text>
<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">Titre perpétuel puis</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">refusé</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">Mémoire d’un seuil franchi</text>
</g>
</svg>
