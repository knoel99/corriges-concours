<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="titre description">
<title id="titre">Lire la ville par ses usages</title>
<desc id="description">Forum d’Auguste Mars Ultor et grands hommes Juger et commémorer Champ de Mars Ara Pacis Sacrifier et représenter Quartiers Vici, cultes et vigiles Habiter et administrer</desc>
<rect width="720" height="253" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Lire la ville par ses usages</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lieu</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Réalisation</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Usage du lieu</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Forum d’Auguste</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Mars Ultor et grands</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">hommes</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Juger et commémorer</text>
<rect x="10" y="159" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Champ de Mars</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Ara Pacis</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Sacrifier et représenter</text>
<rect x="10" y="204" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Quartiers</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Vici, cultes et vigiles</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Habiter et administrer</text>
</g>
</svg>
