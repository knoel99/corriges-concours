<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Trois façons de lire le Pirée</title>
<desc id="description">Bassins portuaires Loges et inventaires Entretenir un bien commun Emporion Contrat et contrôle du grain Nourrir le port et la ville Mounichie et dème Récit de 404–403 Se réunir et refaire la cité</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois façons de lire le Pirée</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Espace</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Trace</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Relation civique</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Bassins portuaires</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Loges et inventaires</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Entretenir un bien commun</text>
<rect x="10" y="137" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Emporion</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Contrat et contrôle du</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">grain</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Nourrir le port et la ville</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Mounichie et dème</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Récit de 404–403</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Se réunir et refaire la</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">cité</text>
</g>
</svg>
