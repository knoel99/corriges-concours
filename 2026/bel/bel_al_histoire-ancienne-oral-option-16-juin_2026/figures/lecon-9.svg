<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Des rives dominées à une capitale approvisionnée</title>
<desc id="description">Limiter une puissance navale Paix de 201 av. J.-C. Clauses chez Polybe Garantir la circulation Commandement de 67 Plaidoyer de Cicéron Acheminer le blé Port de Claude et Néron Monnaie et pertes de 62</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Des rives dominées à une capitale approvisionnée</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Relation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Témoin</text>
