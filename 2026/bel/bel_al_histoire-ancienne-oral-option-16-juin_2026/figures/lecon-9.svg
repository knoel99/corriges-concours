<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Limiter une puissance</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">navale</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Paix de 201 av. J.-C.</text>
