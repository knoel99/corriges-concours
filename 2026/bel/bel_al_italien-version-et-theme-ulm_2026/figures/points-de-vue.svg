<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre desc">
<title id="titre">À qui appartient chaque conclusion ?</title><desc id="desc">Successivement le citoyen, le narrateur et la police jugent les mêmes institutions ou les mêmes pièces depuis des situations différentes.</desc>
<rect width="720" height="341" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="20" y="31" fill="#253e49" font-size="20" font-weight="bold">À qui appartient chaque conclusion ?</text>
<rect x="19" y="52" width="681" height="55" rx="5" fill="#ecf4f1" stroke="#71838a"/>
<text x="32" y="84" fill="#253e49" font-size="16" font-weight="bold">Le citoyen</text>
<text x="224" y="75" fill="#253e49" font-size="15">Il découvre la police en demandant son aide.</text>
<text x="224" y="95" fill="#253e49" font-size="15">Son expérience nourrit sa défiance.</text>
<rect x="19" y="119" width="681" height="55" rx="5" fill="#f3f3f8" stroke="#71838a"/>
<text x="32" y="151" fill="#253e49" font-size="16" font-weight="bold">Le narrateur</text>
<text x="224" y="142" fill="#253e49" font-size="15">Il relit les pièces trente-sept ans plus tard.</text>
<text x="224" y="162" fill="#253e49" font-size="15">Il reconnaît la part d’impatience dans son jugement.</text>
<rect x="19" y="186" width="681" height="55" rx="5" fill="#fbf3e4" stroke="#71838a"/>
<text x="32" y="218" fill="#253e49" font-size="16" font-weight="bold">La police</text>
<text x="224" y="209" fill="#253e49" font-size="15">Elle tient compte des deux lettres et des cas connus.</text>
<text x="224" y="229" fill="#253e49" font-size="15">Elle suppose que le lieu et l’heure ont changé.</text>
<text x="20" y="267" fill="#253e49" font-size="15">La dernière déduction est attribuée à la police.</text>
<text x="20" y="288" fill="#253e49" font-size="15">Aucune découverte nouvelle ne vient la vérifier dans cet extrait.</text>
</g></svg>
