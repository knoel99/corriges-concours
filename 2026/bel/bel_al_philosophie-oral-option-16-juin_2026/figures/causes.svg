<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img"><title>Trois opérations sur les causes</title><desc>I, XVII. Un même nom. Le nom « entendement » invite à comparer les rapports de causalité. I, appendice. Un usage constaté. Voir grâce à l’œil ne prouve pas un dessein antérieur de la nature. IV, préface. Un logement projeté. Le désir présent de l’habiter explique l’acte de construire.</desc><rect width="880" height="300" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="26" y="42" font-size="26" fill="#17394c" font-weight="bold">Trois opérations sur les causes</text><rect x="24" y="61" width="832" height="67" fill="#e8eee8" stroke="none" stroke-width="1"/><rect x="24" y="61" width="8" height="67" fill="#967043" stroke="none" stroke-width="1"/><text x="43" y="98" font-size="16" fill="#17394c" font-weight="bold">I, XVII</text><text x="217" y="88" font-size="18" fill="#17394c" font-weight="bold">Un même nom</text><text x="217" y="113" font-size="15" fill="#17394c">Le nom « entendement » invite à comparer les rapports de causalité.</text><rect x="24" y="138" width="832" height="67" fill="#e8eee8" stroke="none" stroke-width="1"/><rect x="24" y="138" width="8" height="67" fill="#967043" stroke="none" stroke-width="1"/><text x="43" y="175" font-size="16" fill="#17394c" font-weight="bold">I, appendice</text><text x="217" y="165" font-size="18" fill="#17394c" font-weight="bold">Un usage constaté</text><text x="217" y="190" font-size="15" fill="#17394c">Voir grâce à l’œil ne prouve pas un dessein antérieur de la nature.</text><rect x="24" y="215" width="832" height="67" fill="#e8eee8" stroke="none" stroke-width="1"/><rect x="24" y="215" width="8" height="67" fill="#967043" stroke="none" stroke-width="1"/><text x="43" y="252" font-size="16" fill="#17394c" font-weight="bold">IV, préface</text><text x="217" y="242" font-size="18" fill="#17394c" font-weight="bold">Un logement projeté</text><text x="217" y="267" font-size="15" fill="#17394c">Le désir présent de l’habiter explique l’acte de construire.</text></g></svg>
