<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Comment change la place de Droujok ?</title>
<desc id="description">Au village Il attend aux côtés de Bobyl. Le village conseille de se séparer de lui. En chemin Il trotte contre le vieillard et lève les yeux. Le regard suscite un dialogue. Sur la tombe Il voudrait creuser pour se coucher près de lui. Le même désir persiste jusqu’à sa mort.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment change la place de Droujok ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Scène</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Position du chien</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Au village</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Il attend aux côtés de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Bobyl.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le village conseille de se</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">séparer de lui.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">En chemin</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Il trotte contre le</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">vieillard et lève les</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">yeux.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le regard suscite un</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">dialogue.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Sur la tombe</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Il voudrait creuser pour</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">se coucher près de lui.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Le même désir persiste</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">jusqu’à sa mort.</text>
</g>
</svg>
