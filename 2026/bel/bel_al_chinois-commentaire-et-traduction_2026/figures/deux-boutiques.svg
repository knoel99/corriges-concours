<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Le prix de la lecture et du plaisir</title>
<desc id="description">Une faim double Le ventre et la tête paraissent également vides. Le choix suppose que les deux boutiques soient voisines. De un à deux fen Lire sur place coûte moins cher que louer à la journée. Le partage entre enfants élargit le choix. Cinq fen en poche À la fermeture, la lecture s’arrête brusquement. Le lecteur s’offre enfin une pâtisserie.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Le prix de la lecture et du plaisir</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Le seuil</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dans la boutique</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">À la sortie</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Une faim double</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le ventre et la tête</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">paraissent également</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">vides.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le choix suppose que les</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">deux boutiques soient</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">voisines.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">De un à deux fen</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Lire sur place coûte moins</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">cher que louer à la</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">journée.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Le partage entre enfants</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">élargit le choix.</text>
<rect x="10" y="270" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Cinq fen en poche</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">À la fermeture, la lecture</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">s’arrête brusquement.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Le lecteur s’offre enfin</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">une pâtisserie.</text>
</g>
</svg>
