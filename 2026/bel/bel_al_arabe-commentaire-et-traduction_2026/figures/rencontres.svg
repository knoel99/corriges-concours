<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Deux rencontres et une limite du regard</title>
<desc id="description">Dans la voiture Deux personnes, des visages calmes, un silence. Il tient leur amour pour certain. À la fenêtre Une rue vide et quelques points de lumière. Il se voit dans un article de journal. Au seuil Des pas, puis deux silhouettes mal éclairées. Sa question reste sans réponse dans l’extrait.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux rencontres et une limite du regard</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’il perçoit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’il en conclut</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Dans la voiture</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Deux personnes, des</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">visages calmes, un</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">silence.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Il tient leur amour pour</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">certain.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">À la fenêtre</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Une rue vide et quelques</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">points de lumière.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Il se voit dans un article</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">de journal.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Au seuil</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Des pas, puis deux</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">silhouettes mal éclairées.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Sa question reste sans</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">réponse dans l’extrait.</text>
</g>
</svg>
