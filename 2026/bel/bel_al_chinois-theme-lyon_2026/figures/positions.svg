<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Qui est dans le café ?</title>
<desc id="description">La jeune femme Une place fixe, des heures changeantes. Les adverbes de fréquence portent l’habitude. Le narrateur Il hésite sur l’âge et sur l’origine de l’étrangeté. Faire entendre le doute au présent du souvenir. Le lecteur On lui bande les yeux, puis on les découvre. Il lui faut tirer une conclusion des gens qu’il observe.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui est dans le café ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de vue</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Marque de la voix</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet en chinois</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">La jeune femme</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Une place fixe, des heures</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">changeantes.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les adverbes de fréquence</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">portent l’habitude.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le narrateur</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Il hésite sur l’âge et sur</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">l’origine de l’étrangeté.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Faire entendre le doute au</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">présent du souvenir.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le lecteur</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">On lui bande les yeux,</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">puis on les découvre.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Il lui faut tirer une</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">conclusion des gens qu’il</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">observe.</text>
</g>
</svg>
