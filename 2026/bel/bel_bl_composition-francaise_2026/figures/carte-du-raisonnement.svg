<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">Ce que change chaque étape de la discussion</title><desc id="desc">I · Prendre la thèse au sérieux : Sarraute et Perec interrompent des récits trop assurés. II · Opposer une difficulté : Chez Hugo, une forme régulière provoque la surprise. III · Déplacer le critère : La double adresse d’Incendies oblige à revoir une filiation.</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">Ce que change chaque étape de la discussion</text>
<rect x="17" y="57" width="271" height="205" rx="8" fill="#dceff2"/>
<text x="30" y="91" font-size="18" font-weight="bold" fill="#213b4a">I · Prendre la thèse</text>
<text x="30" y="112" font-size="18" font-weight="bold" fill="#213b4a">au sérieux</text>
<text x="30" y="151" font-size="17" font-weight="normal" fill="#213b4a">Sarraute et Perec</text>
<text x="30" y="175" font-size="17" font-weight="normal" fill="#213b4a">interrompent des récits</text>
<text x="30" y="199" font-size="17" font-weight="normal" fill="#213b4a">trop assurés.</text>
<path d="M292 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="318" y="57" width="271" height="205" rx="8" fill="#f7ebd5"/>
<text x="331" y="91" font-size="18" font-weight="bold" fill="#213b4a">II · Opposer une</text>
<text x="331" y="112" font-size="18" font-weight="bold" fill="#213b4a">difficulté</text>
<text x="331" y="151" font-size="17" font-weight="normal" fill="#213b4a">Chez Hugo, une forme</text>
<text x="331" y="175" font-size="17" font-weight="normal" fill="#213b4a">régulière provoque la</text>
<text x="331" y="199" font-size="17" font-weight="normal" fill="#213b4a">surprise.</text>
<path d="M593 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="619" y="57" width="271" height="205" rx="8" fill="#e7ecf6"/>
<text x="632" y="91" font-size="18" font-weight="bold" fill="#213b4a">III · Déplacer le</text>
<text x="632" y="112" font-size="18" font-weight="bold" fill="#213b4a">critère</text>
<text x="632" y="151" font-size="17" font-weight="normal" fill="#213b4a">La double adresse</text>
<text x="632" y="175" font-size="17" font-weight="normal" fill="#213b4a">d’Incendies oblige à</text>
<text x="632" y="199" font-size="17" font-weight="normal" fill="#213b4a">revoir une filiation.</text>
</g></svg>
