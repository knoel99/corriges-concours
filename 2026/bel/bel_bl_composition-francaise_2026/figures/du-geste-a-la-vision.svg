<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">Le trajet de la formule de Mouawad</title><desc id="desc">À l’origine : Une expérience ébranle celui qui va écrire. Dans la phrase : La figure du tremblement donne une forme visible à une hésitation. À la lecture : Une perception devient possible à travers cet écart.</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">Le trajet de la formule de Mouawad</text>
<rect x="17" y="49" width="876" height="66" rx="7" fill="#dceff2"/>
<text x="33" y="75" font-size="19" font-weight="bold" fill="#213b4a">À l’origine</text>
<text x="33" y="100" font-size="17" font-weight="normal" fill="#213b4a">Une expérience ébranle celui qui va écrire.</text>
<path d="M48 115 v9 m-3 -4 3 4 3 -4" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="17" y="127" width="876" height="66" rx="7" fill="#f7ebd5"/>
<text x="33" y="153" font-size="19" font-weight="bold" fill="#213b4a">Dans la phrase</text>
<text x="33" y="178" font-size="17" font-weight="normal" fill="#213b4a">La figure du tremblement donne une forme visible à une hésitation.</text>
<path d="M48 193 v9 m-3 -4 3 4 3 -4" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="17" y="205" width="876" height="66" rx="7" fill="#e7ecf6"/>
<text x="33" y="231" font-size="19" font-weight="bold" fill="#213b4a">À la lecture</text>
<text x="33" y="256" font-size="17" font-weight="normal" fill="#213b4a">Une perception devient possible à travers cet écart.</text>
</g></svg>
