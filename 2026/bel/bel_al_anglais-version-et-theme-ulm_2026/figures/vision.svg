<svg xmlns="http://www.w3.org/2000/svg" width="720" height="265" viewBox="0 0 720 265" role="img" aria-labelledby="titre description">
<title id="titre">Du rocher au visage</title>
<desc id="description">En trois temps, le contour incertain d’un rocher devient une image du narrateur avant de disparaître quand il rouvre les yeux.</desc>
<rect width="720" height="265" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="18" y="30" text-anchor="start" fill="#202f37" font-size="21" font-weight="bold">Du rocher au visage</text>
<rect x="16" y="54" width="214" height="190" rx="5" fill="#f2f5f5"/>
<text x="123" y="80" text-anchor="middle" fill="#202f37" font-size="15" font-weight="bold">Le fil apparaît</text>
<path d="M 49 150 Q 60 120 90 115 Q 118 96 157 118 L 193 143 L 174 164 Q 119 171 63 161 Z" fill="#c4cecf" stroke="#798990" stroke-width="2"/>
<path d="M 50 150 Q 61 122 91 115 Q 119 97 157 118 L 193 143 L 174 164 Q 119 171 63 161" fill="none" stroke="#ab3d2e" stroke-width="3"/>
<text x="123" y="205" text-anchor="middle" fill="#202f37" font-size="14" font-weight="normal">Un trait écarlate semble</text>
<text x="123" y="226" text-anchor="middle" fill="#202f37" font-size="14" font-weight="normal">faire le tour du rocher.</text>
<line x1="232" y1="147" x2="245" y2="147" stroke="#115b61" stroke-width="2"/>
<path d="M241 143 L250 147 L241 151 Z" fill="#115b61"/>
<rect x="252" y="54" width="214" height="190" rx="5" fill="#f2f5f5"/>
<text x="359" y="80" text-anchor="middle" fill="#202f37" font-size="15" font-weight="bold">Le visage se forme</text>
<path d="M 285 150 Q 296 120 326 115 Q 354 96 393 118 L 429 143 L 410 164 Q 355 171 299 161 Z" fill="#c4cecf" stroke="#798990" stroke-width="2"/>
<path d="M 286 150 Q 297 122 327 115 Q 355 97 393 118 L 429 143 L 410 164 Q 355 171 299 161" fill="none" stroke="#ab3d2e" stroke-width="3"/>
<path d="M 398 122 Q 390 127 399 132 L 405 136 L 398 138 M 399 146 Q 386 155 371 156" fill="none" stroke="#ab3d2e" stroke-width="2" stroke-dasharray="3 2"/>
<text x="359" y="205" text-anchor="middle" fill="#202f37" font-size="14" font-weight="normal">Le grimpeur prête ses traits</text>
<text x="359" y="226" text-anchor="middle" fill="#202f37" font-size="14" font-weight="normal">au contour qui palpite.</text>
<line x1="468" y1="147" x2="481" y2="147" stroke="#115b61" stroke-width="2"/>
<path d="M477 143 L486 147 L477 151 Z" fill="#115b61"/>
<rect x="488" y="54" width="214" height="190" rx="5" fill="#f2f5f5"/>
<text x="595" y="80" text-anchor="middle" fill="#202f37" font-size="15" font-weight="bold">Les yeux se rouvrent</text>
<path d="M 521 150 Q 532 120 562 115 Q 590 96 629 118 L 665 143 L 646 164 Q 591 171 535 161 Z" fill="#c4cecf" stroke="#798990" stroke-width="2"/>
<text x="595" y="205" text-anchor="middle" fill="#202f37" font-size="14" font-weight="normal">Le trait a disparu. Il reste</text>
<text x="595" y="226" text-anchor="middle" fill="#202f37" font-size="14" font-weight="normal">la certitude de l’avoir vu.</text>
</g></svg>
