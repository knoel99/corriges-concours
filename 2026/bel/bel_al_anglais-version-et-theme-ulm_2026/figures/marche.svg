<svg xmlns="http://www.w3.org/2000/svg" width="720" height="254" viewBox="0 0 720 254" role="img" aria-labelledby="titre description">
<title id="titre">Les deux temps de la reconnaissance</title>
<desc id="description">Deux lignes parallèles suivent Claire et Madame Ladon. Claire relie la voix et la bague à un nom, puis le répète. Madame Ladon ne tourne son visage qu’au second appel.</desc>
<rect width="720" height="254" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="18" y="30" text-anchor="start" fill="#202f37" font-size="21" font-weight="bold">Les deux temps de la reconnaissance</text>
<text x="20" y="78" text-anchor="start" fill="#115b61" font-size="16" font-weight="bold">Claire</text>
<text x="20" y="174" text-anchor="start" fill="#82501c" font-size="16" font-weight="bold">Mme Ladon</text>
<line x1="125" y1="88" x2="688" y2="88" stroke="#115b61" stroke-width="2"/>
<path d="M684 84 L693 88 L684 92 Z" fill="#115b61"/>
<circle cx="155" cy="88" r="5" fill="#115b61"/>
<circle cx="391" cy="88" r="5" fill="#115b61"/>
<circle cx="601" cy="88" r="5" fill="#115b61"/>
<line x1="125" y1="183" x2="688" y2="183" stroke="#82501c" stroke-width="2"/>
<path d="M684 179 L693 183 L684 187 Z" fill="#82501c"/>
<circle cx="155" cy="183" r="5" fill="#82501c"/>
<circle cx="391" cy="183" r="5" fill="#82501c"/>
<circle cx="601" cy="183" r="5" fill="#82501c"/>
<text x="153" y="61" text-anchor="start" fill="#115b61" font-size="14" font-weight="bold">Voix puis bague</text>
<text x="391" y="61" text-anchor="middle" fill="#115b61" font-size="14" font-weight="bold">Premier appel</text>
<text x="601" y="61" text-anchor="middle" fill="#115b61" font-size="14" font-weight="bold">Second appel</text>
<text x="155" y="114" text-anchor="start" fill="#455660" font-size="13" font-weight="normal">Claire reconnaît la cliente.</text>
<text x="391" y="114" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">À voix basse.</text>
<text x="601" y="114" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">Plus fort.</text>
<line x1="391" y1="121" x2="391" y2="172" stroke="#455660" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="601" y1="121" x2="601" y2="172" stroke="#455660" stroke-width="1" stroke-dasharray="4 4"/>
<text x="155" y="211" text-anchor="start" fill="#455660" font-size="13" font-weight="normal">Elle passe commande.</text>
<text x="391" y="211" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">Elle ne se retourne pas.</text>
<text x="601" y="211" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">Elle se tourne et</text>
<text x="601" y="232" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">dévisage Claire.</text>
</g></svg>
