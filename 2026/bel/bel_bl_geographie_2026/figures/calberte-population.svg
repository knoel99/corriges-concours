<svg xmlns="http://www.w3.org/2000/svg" width="750" height="290" viewBox="0 0 750 290" role="img" aria-labelledby="t d"><title id="t">Saint-Germain-de-Calberte, population communale de 1968 à 2022</title><desc id="d">Effectifs au recensement. 1968, 462 habitants, 1975, 446 habitants, 1982, 445 habitants, 1990, 478 habitants, 1999, 485 habitants, 2006, 444 habitants, 2011, 454 habitants, 2016, 441 habitants, 2022, 477 habitants. L’axe des effectifs commence à 430 habitants.</desc><rect width="750" height="290" fill="#fff"/><g font-family="DejaVu Sans, sans-serif" fill="#1b423a"><text x="24" y="32" font-size="21" font-weight="bold">Saint-Germain-de-Calberte, les inflexions du peuplement</text><text x="24" y="55" font-size="14">Population de la commune, en habitants · Recensements de 1968 à 2022</text><path d="M57 197.0 H685" stroke="#c9d4cf" fill="none"/><text x="50" y="201.0" text-anchor="end" font-size="13">430</text><path d="M57 159.0 H685" stroke="#c9d4cf" fill="none"/><text x="50" y="163.0" text-anchor="end" font-size="13">450</text><path d="M57 121.0 H685" stroke="#c9d4cf" fill="none"/><text x="50" y="125.0" text-anchor="end" font-size="13">470</text><path d="M57 83.0 H685" stroke="#c9d4cf" fill="none"/><text x="50" y="87.0" text-anchor="end" font-size="13">490</text><polyline points="63.00,136.20 142.07,166.60 221.15,168.50 311.52,105.80 413.19,92.50 492.26,170.40 548.74,151.40 605.22,176.10 673.00,107.70" fill="none" stroke="#206957" stroke-width="3"/><circle cx="63.00" cy="136.20" r="4" fill="#206957"/><text x="73.00" y="126.20" text-anchor="middle" font-size="13">462</text><text x="63.00" y="220" text-anchor="middle" font-size="13">1968</text><circle cx="142.07" cy="166.60" r="4" fill="#206957"/><text x="142.07" y="183.60" text-anchor="middle" font-size="13">446</text><text x="142.07" y="220" text-anchor="middle" font-size="13">1975</text><circle cx="221.15" cy="168.50" r="4" fill="#206957"/><text x="221.15" y="185.50" text-anchor="middle" font-size="13">445</text><text x="221.15" y="220" text-anchor="middle" font-size="13">1982</text><circle cx="311.52" cy="105.80" r="4" fill="#206957"/><text x="311.52" y="95.80" text-anchor="middle" font-size="13">478</text><text x="311.52" y="220" text-anchor="middle" font-size="13">1990</text><circle cx="413.19" cy="92.50" r="4" fill="#206957"/><text x="413.19" y="82.50" text-anchor="middle" font-size="13">485</text><text x="413.19" y="220" text-anchor="middle" font-size="13">1999</text><circle cx="492.26" cy="170.40" r="4" fill="#206957"/><text x="492.26" y="187.40" text-anchor="middle" font-size="13">444</text><text x="492.26" y="220" text-anchor="middle" font-size="13">2006</text><circle cx="548.74" cy="151.40" r="4" fill="#206957"/><text x="548.74" y="141.40" text-anchor="middle" font-size="13">454</text><text x="548.74" y="220" text-anchor="middle" font-size="13">2011</text><circle cx="605.22" cy="176.10" r="4" fill="#206957"/><text x="605.22" y="193.10" text-anchor="middle" font-size="13">441</text><text x="605.22" y="220" text-anchor="middle" font-size="13">2016</text><circle cx="673.00" cy="107.70" r="4" fill="#206957"/><text x="673.00" y="97.70" text-anchor="middle" font-size="13">477</text><text x="673.00" y="220" text-anchor="middle" font-size="13">2022</text><text x="24" y="250" font-size="13">Les points donnent les observations. Les lignes les relient pour guider la lecture.</text><text x="24" y="273" font-size="13">Source : Insee, dossier communal, tableau POP T1, géographie au 1ᵉʳ janvier 2025.</text></g></svg>
