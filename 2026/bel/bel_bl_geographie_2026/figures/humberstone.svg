<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">Humberstone après le salpêtre, de la place à l’atelier</title>
  <desc id="desc">Deux croquis réunissent des motifs de l’ancien camp du nord chilien. Le premier montre la place depuis le camp, avec les logements bas et le volume du théâtre en bois. Le second entre dans la Maestranza où subsistent des machines et outils de réparation. Après la fermeture vers 1960, le site est devenu un lieu de visite et de mémoire.</desc>
  <defs>
    <pattern id="planches" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#b88b59"/><path d="M4 0v9" stroke="#8f6844" stroke-width="1"/>
    </pattern>
    <pattern id="tole" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#d1c8b5"/><path d="M3 0v9m3-9v9" stroke="#aaa08e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="720" height="450" fill="#fff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#39362c">
    <text x="20" y="31" font-size="25" font-weight="bold">Humberstone après le salpêtre</text>
    <text x="20" y="57" font-size="17">Pampa du Tamarugal · Région de Tarapacá, nord du Chili</text>
    <text x="20" y="88" font-size="17" font-weight="bold">Depuis la place de l’ancien camp</text>
    <text x="464" y="88" font-size="17" font-weight="bold">À l’intérieur de l’atelier</text>
    <!-- Repères du camp et du secteur industriel réunis en deux champs distincts. -->
    <rect x="20" y="98" width="428" height="149" fill="#f6f5ed" stroke="#b0aa98"/>
    <path d="m21 152 39-4 25 1 40-4 19 1 38-4 36 2 35-3 24 1 34-3 18 1 15-2 31 3 38-1 34 2v103H21Z" fill="#ded0ad"/>
    <path d="m21 178 427-7v75H21Z" fill="#e6d8b9"/>
    <!-- Logements et théâtre sur le pourtour de la place. -->
    <g stroke="#60523c" stroke-linejoin="round">
      <path d="m27 164 163-4 16 7-179 9Z" fill="#94785b" stroke-width="1.8"/>
      <path d="m27 176 179-9v22l-179 13Z" fill="#d5ba8e" stroke-width="1.8"/>
      <path d="m37 178 9-.6v20l-9 .5zm33-3 8-.3v20l-8 .6zm31-1 8-.4v19l-8 .6zm30-2 7-.3v18l-7 .4zm29-2 6-.4v18l-6 .5zm25-1 6-.4v17l-6 .5Z" fill="#7d6349" stroke-width="1"/>
      <path d="m54 179 8-.5v7l-8 .5zm31-2 8-.4v7l-8 .5zm30-2 8-.4v7l-8 .4zm30-2 7-.4v6l-7 .5zm26-1.5 7-.4v6l-7 .4Z" fill="#a9b2a0" stroke-width="1"/>
      <path d="m232 146 178-6 19 9v39l-194 7Z" fill="url(#planches)" stroke-width="2"/>
      <path d="m227 145 13-7 168-6 26 10-9 4-188 7Z" fill="#937257" stroke-width="2"/>
      <path d="m238 142 169-6 4 5-171 6Z" fill="#ad9d7c" stroke-width="1.2"/>
      <path d="m248 153 9-.4v40l-9 .4zm36-1.5 8-.4v39l-8 .3zm41-1.5 8-.3v39l-8 .4zm41-1.4 7-.3v37l-7 .4zm36-1.5 7-.3v37l-7 .4Z" fill="#7d5c3d" stroke-width="0.7"/>
      <path d="m265 170 11-.4v21l-11 .5zm35-1.5 12-.4v21l-12 .4zm46-1.5 10-.4v21l-10 .4Z" fill="#654b37" stroke-width="1.2"/>
      <path d="m242 162 162-6" fill="none" stroke-width="2"/>
    </g>
    <!-- Bordures et allées de la place : premier plan. -->
    <path d="m33 244 101-42 53-3-86 45Zm175 0 25-47 13-.5-8 47Z" fill="#f3e9ce"/>
    <path d="m112 241 76-37 29-2-20 39Z" fill="#c8c2a2" stroke="#a79775"/>
    <path d="m314 201 121-5m-117 8 108-4" stroke="#b1a080" stroke-width="1.2"/>
    <text x="259" y="232" font-size="16" font-style="italic">Plaza de Humberstone</text>
    <g font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
      <circle cx="70" cy="183" r="12" fill="#4c4336"/><text x="70" y="189">1</text>
      <circle cx="376" cy="171" r="12" fill="#4c4336"/><text x="376" y="177">2</text>
    </g>
    <!-- Maestranza : halle en tôle et outillage de réparation. -->
    <rect x="464" y="98" width="236" height="149" fill="#dfd9c7" stroke="#a79b84"/>
    <path d="m465 100 116 24 118-24v73l-117 24-117-31Z" fill="url(#tole)"/>
    <path d="m465 99 116 25 118-25" fill="#c1b49a" stroke="#6d6356" stroke-width="3"/>
    <path d="m465 119 116 17 118-22M465 158l116 16 118-18M483 105v66m34-57v64m32-58v66m34-62v71m33-77v66m33-75v64m31-71v65" fill="none" stroke="#847764" stroke-width="2.1"/>
    <path d="m473 102 40 6-22 9Zm208 3-31 6 11 7Z" fill="#fbf8e9" stroke="#807465"/>
    <path d="m465 166 117 30 117-23v73H465Z" fill="#d6cab2"/>
    <path d="m468 229 114-33 99 49m-134-1 38-44m-107 22 158-1" stroke="#b4a78d" fill="none"/>
    <!-- Profil schématique d’une machine-outil sur son bâti. -->
    <g stroke="#524d40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m493 195 146-4 5 6-157 5Z" fill="#887a62"/>
      <path d="m496 202 13-.4-2 17-14 1Zm126-4 12-.4 4 15-14 1Z" fill="#92856c"/>
      <path d="m505 190 1-19 18-1 7 17 50-2 2-9 13-1 5 10 26-.6 2 7-130 4Z" fill="#8a816d"/>
      <circle cx="518" cy="175" r="10" fill="#877c67"/><circle cx="518" cy="175" r="3" fill="#d4cbb5"/>
      <path d="m531 183 45-1m-13-5 3 9m-13 0 18-.5"/>
      <circle cx="581" cy="191" r="5" fill="#d4cbb5"/>
      <path d="m479 163 16 .8v18l-16-1Z" fill="#978b75"/>
    </g>
    <circle cx="656" cy="199" r="12" fill="#4c4336"/><text x="656" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
    <text x="20" y="272" font-size="16">Deux vues de synthèse · La place couvre environ 2 800 m².</text>
    <path d="M20 287h680" stroke="#b0aa98"/>
    <text x="20" y="314" font-size="18" font-weight="bold">La vie du camp salpêtrier</text>
    <text x="20" y="340" font-size="17">1  Logements ouvriers</text>
    <text x="20" y="364" font-size="17">2  Théâtre en bois face à la place</text>
    <text x="20" y="388" font-size="17">3  Maestranza, atelier de réparation</text>
    <text x="410" y="314" font-size="18" font-weight="bold">Conserver et visiter</text>
    <text x="410" y="340" font-size="17">Vers 1960, l’exploitation ferme.</text>
    <text x="410" y="364" font-size="17">En 2005, l’UNESCO inscrit le site</text>
    <text x="410" y="388" font-size="17">avec celui de Santa Laura.</text>
    <text x="20" y="430" font-size="14" fill="#5e5544">D’après la Corporación Museo del Salitre et le Servicio Nacional del Patrimonio Cultural.</text>
  </g>
</svg>
