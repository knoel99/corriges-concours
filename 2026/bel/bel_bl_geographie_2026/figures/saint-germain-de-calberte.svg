    <text x="20" y="60" font-size="18">Déprise agricole et maintien des terrasses dans la vallée du Gardon</text>
    <text x="20" y="95" font-size="19" font-weight="700">À l’échelle d’un versant</text>
    <text x="403" y="95" font-size="19" font-weight="700">Aux jardins des Calquières</text>
