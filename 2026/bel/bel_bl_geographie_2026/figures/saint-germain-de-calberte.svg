<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" width="780" height="490" role="img" aria-labelledby="titre description">
  <title id="titre">Saint-Germain-de-Calberte : le bois gagne du terrain, des jardins restent cultivés</title>
  <desc id="description">Deux vues de synthèse d'après le sentier du Parc national des Cévennes. À l'échelle du versant les feuillages masquent d'anciennes terrasses. Aux Calquières, sur le versant exposé au sud-est, les jardins forment toujours des replats soutenus par des murets de pierre sèche. Les vues obliques ne partagent pas d'échelle métrique.</desc>
