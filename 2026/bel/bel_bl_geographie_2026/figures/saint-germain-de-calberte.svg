    <g font-size="17">
      <circle cx="31" cy="348" r="10" fill="#54765f"/><text x="49" y="354" font-weight="700">Taillis et bois</text>
      <text x="20" y="379">La végétation masque des replats</text><text x="20" y="402">dont l’entretien a cessé.</text>
      <rect x="404" y="339" width="22" height="16" fill="url(#pierre)" stroke="#645a4c"/><text x="436" y="354" font-weight="700">Murets de pierre sèche</text>
      <text x="403" y="379">Les jardins toujours travaillés</text><text x="403" y="402">dessinent des lignes ouvertes.</text>
    </g>
    <path d="M20 425h739" stroke="#c6cecb"/>
    <g font-size="15" fill="#344e50">
      <text x="20" y="449">Deux vues de synthèse. À droite, détail du versant exposé au sud-est. Plans sans échelle commune.</text>
      <text x="20" y="472">D’après les notices du sentier de Saint-Germain-de-Calberte, Parc national des Cévennes.</text>
