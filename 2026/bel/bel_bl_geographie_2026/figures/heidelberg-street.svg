<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" role="img" aria-labelledby="title desc">
  <title id="title">Heidelberg Street, une rue habitée et transformée par l’art</title>
  <desc id="desc">Dans l’est de Détroit, le projet de Tyree Guyton a investi à partir de 1986 des maisons délaissées et des parcelles vacantes, dans un quartier toujours habité. Cette vue de synthèse depuis la chaussée rapproche quatre motifs du secteur, sans reproduire un alignement cadastral.</desc>
  <defs>
    <pattern id="herbes" width="20" height="12" patternUnits="userSpaceOnUse">
      <rect width="20" height="12" fill="#e3e7c8"/>
      <path d="m3 10 3-5m0 5 4-3m4 0 1-4" fill="none" stroke="#758657" stroke-width="1.4"/>
    </pattern>
    <pattern id="pois" width="29" height="25" patternUnits="userSpaceOnUse">
      <rect width="29" height="25" fill="#fff7de"/>
      <circle cx="6" cy="6" r="4" fill="#bf5739"/>
      <circle cx="20" cy="13" r="5" fill="#2f7582"/>
      <circle cx="7" cy="21" r="2.7" fill="#cb9829"/>
    </pattern>
  </defs>
  <rect width="720" height="438" fill="#fff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#213932">
    <text x="20" y="31" font-size="25" font-weight="bold">Sur Heidelberg Street, la rue change d’usage</text>
    <text x="20" y="57" font-size="17">Est de Détroit (Michigan) · Quartier de McDougall-Hunt</text>
    <rect x="20" y="73" width="680" height="179" fill="#f4f7f3" stroke="#aab9ab"/>
    <path d="M21 174q26-14 55-2 25-20 48-7 24-12 40 0 19-11 40 1 25-9 38-1 27-14 52-3 20-11 37-2 26-21 54-7 25-16 46-3 25-11 50 0 26-13 55-5 22-9 48 1 24-14 55-4 27-10 50 1l10 0v37H21Z" fill="#c1ceba"/>
    <path d="m21 188 679-13v40l-679 16Z" fill="#d4debe"/>
    <!-- Maison habitée : porche, pelouse et allée. -->
    <g stroke="#3e5147" stroke-width="2.3" stroke-linejoin="round">
      <path d="m38 140 60-40 58 38-1 65-116 3Z" fill="#fff1d2"/>
      <path d="m31 140 67-48 65 44-7 6-58-39-60 42Z" fill="#737f70"/>
      <path d="m42 161 107-3 11 11-121 4Z" fill="#83917e"/>
      <path d="M47 172v31m101-34v31m-97-9 90-2" fill="none"/>
      <path d="m58 177 17-.5v12l-17 .3zm59-2 18-.6v12l-18 .4zm-31-46 21-1v14l-21 .7Z" fill="#9cbcc1"/>
      <path d="m91 175 15-.3v26l-15 .5Z" fill="#a98a65"/>
      <path d="m83 204 32-1 2 4-38 1Z" fill="#beb49c"/>
    </g>
    <path d="m94 208 14-.4 7 14-24 1Z" fill="#efe7d5"/>
    <!-- Maison à l'écart de l'usage résidentiel. -->
    <g stroke="#514a40" stroke-width="2" stroke-linejoin="round">
      <path d="m180 145 40-33 47 30v57l-86 2Z" fill="#c3bcaa"/>
      <path d="m175 144 45-39 54 36-7 6-47-30-38 33Z" fill="#807d71"/>
      <path d="m188 160 18-.5v18l-18 .4zm45-2 19-.5v19l-19 .4zm-19 20 16-.5v21l-16 .4Z" fill="#9b8a74"/>
      <path d="m187 162 20 14m26-17 19 15m-37 6 14 14" stroke="#675b49" stroke-width="3"/>
    </g>
    <!-- L’intervalle entre les façades ouvre une vue sur le fond de la parcelle. -->
    <path d="m275 183 162-3 16 30-185 5Z" fill="url(#herbes)" stroke="#7c896b" stroke-width="1.2"/>
    <path d="m285 179 139-4m-128-3v12m29-13v12m31-13v11m30-12v12m31-12v11" fill="none" stroke="#7b8779" stroke-width="1.7"/>
    <!-- Façade simplifiée de la Dotty Wotty House. -->
    <g stroke="#3b4943" stroke-width="2.2" stroke-linejoin="round">
      <path d="m476 127 147-3v67l-147 5Z" fill="url(#pois)"/>
      <path d="m464 130 29-42 97-3 45 41-12 3-147 4Z" fill="#727973"/>
      <path d="m521 108 15-15 15 14v16l-30 1Z" fill="url(#pois)"/>
      <path d="m530 109 12-.3v10l-12 .3Z" fill="#b6cccd"/>
      <path d="m487 138 20-.4v16l-20 .4zm34-1 20-.5v17l-20 .5zm53-.8 21-.5v16l-21 .5Z" fill="#acc6c6"/>
      <path d="m468 162 152-4 11 9-169 5Z" fill="#74887d"/>
      <path d="M473 171v24m148-28v24m-117-21v24m86-27v25" fill="none" stroke-width="3"/>
      <path d="m542 169 19-.6v24l-19 .5Z" fill="#65716d"/>
      <path d="m470 195 156-4v5l-156 4Z" fill="#ab9e87"/>
    </g>
    <path d="m21 224 679-18v8l-679 18Z" fill="#eee9dc" stroke="#839284" stroke-width="1"/>
    <path d="m21 233 679-18v36H21Z" fill="#c7cac4"/>
    <text x="41" y="245" transform="rotate(-1.5 41 245)" font-size="15" font-style="italic">Heidelberg Street</text>
    <g font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
      <circle cx="54" cy="190" r="12" fill="#273f38"/><text x="54" y="196">1</text>
      <circle cx="261" cy="184" r="12" fill="#273f38"/><text x="261" y="190">2</text>
      <circle cx="361" cy="201" r="12" fill="#273f38"/><text x="361" y="207">3</text>
      <circle cx="632" cy="178" r="12" fill="#273f38"/><text x="632" y="184">4</text>
    </g>
    <text x="20" y="276" font-size="16">Vue composée depuis la chaussée · Projet étendu sur deux îlots</text>
    <path d="M20 289h680" stroke="#aab9ab"/>
    <text x="20" y="315" font-size="18" font-weight="bold">Une rue inégalement occupée</text>
    <text x="20" y="340" font-size="17">1  Maison habitée</text>
    <text x="20" y="365" font-size="17">2  Maison délaissée</text>
    <text x="20" y="390" font-size="17">3  Parcelle sans bâtiment</text>
    <text x="371" y="315" font-size="18" font-weight="bold">Un nouvel usage dès 1986</text>
    <text x="371" y="340" font-size="17">4  Dotty Wotty House</text>
    <text x="394" y="365" font-size="17">Les pois peints font de la façade</text>
    <text x="394" y="389" font-size="17">une œuvre visible depuis la rue.</text>
    <text x="20" y="424" font-size="14" fill="#475849">D’après le Heidelberg Project et la Detroit Historical Society.</text>
  </g>
</svg>
