<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">Como se forma a autoridade da imprensa?</title><desc id="desc">I · Circular : Examinar censura, mercado e desigualdades de acesso. II · Representar : Identificar quem toma a palavra em nome dos leitores. III · Verificar : Comparar o trabalho das fontes com os indicadores de confiança.</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">Como se forma a autoridade da imprensa?</text>
<rect x="17" y="57" width="271" height="205" rx="8" fill="#dceff2"/>
<text x="30" y="91" font-size="18" font-weight="bold" fill="#213b4a">I · Circular</text>
<text x="30" y="151" font-size="17" font-weight="normal" fill="#213b4a">Examinar censura,</text>
<text x="30" y="175" font-size="17" font-weight="normal" fill="#213b4a">mercado e desigualdades</text>
<text x="30" y="199" font-size="17" font-weight="normal" fill="#213b4a">de acesso.</text>
<path d="M292 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="318" y="57" width="271" height="205" rx="8" fill="#f7ebd5"/>
<text x="331" y="91" font-size="18" font-weight="bold" fill="#213b4a">II · Representar</text>
<text x="331" y="151" font-size="17" font-weight="normal" fill="#213b4a">Identificar quem toma a</text>
<text x="331" y="175" font-size="17" font-weight="normal" fill="#213b4a">palavra em nome dos</text>
<text x="331" y="199" font-size="17" font-weight="normal" fill="#213b4a">leitores.</text>
<path d="M593 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="619" y="57" width="271" height="205" rx="8" fill="#e7ecf6"/>
<text x="632" y="91" font-size="18" font-weight="bold" fill="#213b4a">III · Verificar</text>
<text x="632" y="151" font-size="17" font-weight="normal" fill="#213b4a">Comparar o trabalho das</text>
<text x="632" y="175" font-size="17" font-weight="normal" fill="#213b4a">fontes com os</text>
<text x="632" y="199" font-size="17" font-weight="normal" fill="#213b4a">indicadores de</text>
<text x="632" y="223" font-size="17" font-weight="normal" fill="#213b4a">confiança.</text>
</g></svg>
