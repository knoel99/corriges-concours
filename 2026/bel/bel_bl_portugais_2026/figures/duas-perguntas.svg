<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">O que medem os percentuais brasileiros?</title><desc id="desc">82% · Preocupação : Entrevistados preocupados com informações falsas. 54% · Confiança : Entrevistados que confiam nas notícias. Interpretação : As perguntas são diferentes. Algumas pessoas podem estar nos dois grupos.</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">O que medem os percentuais brasileiros?</text>
<rect x="17" y="49" width="876" height="66" rx="7" fill="#dceff2"/>
<text x="33" y="75" font-size="19" font-weight="bold" fill="#213b4a">82% · Preocupação</text>
<text x="33" y="100" font-size="17" font-weight="normal" fill="#213b4a">Entrevistados preocupados com informações falsas.</text>
<path d="M48 115 v9 m-3 -4 3 4 3 -4" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="17" y="127" width="876" height="66" rx="7" fill="#f7ebd5"/>
<text x="33" y="153" font-size="19" font-weight="bold" fill="#213b4a">54% · Confiança</text>
<text x="33" y="178" font-size="17" font-weight="normal" fill="#213b4a">Entrevistados que confiam nas notícias.</text>
<path d="M48 193 v9 m-3 -4 3 4 3 -4" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="17" y="205" width="876" height="66" rx="7" fill="#e7ecf6"/>
<text x="33" y="231" font-size="19" font-weight="bold" fill="#213b4a">Interpretação</text>
<text x="33" y="256" font-size="17" font-weight="normal" fill="#213b4a">As perguntas são diferentes. Algumas pessoas podem estar nos dois grupos.</text>
</g></svg>
