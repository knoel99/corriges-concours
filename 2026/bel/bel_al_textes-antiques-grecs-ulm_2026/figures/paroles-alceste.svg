<svg xmlns="http://www.w3.org/2000/svg" width="780" height="439" viewBox="0 0 780 439" role="img" aria-labelledby="titre description">
<title id="titre">Qui voit, qui parle et à qui ?</title>
<desc id="description">Le chœur voit la servante en pleurs : Une question sur la vie ou la mort appelle un témoignage.. Devant le palais. La servante raconte ce qu’elle a vu : Le récit ouvre aux spectateurs l’espace privé de la maison.. Dans le palais. Alceste prie, puis parle au lit : La servante restitue deux adresses dont les destinataires diffèrent.. Foyer et chambre. Chaque serviteur reçoit la parole : Au terme du récit, la perte touche la maison entière.. Maison d’Admète.</desc>
<rect width="100%" height="100%" fill="#fcfbf6"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="28" y="32" font-size="19" font-weight="bold" fill="#183c50">Qui voit, qui parle et à qui ?</text>
<rect x="26" y="50" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="50" width="8" height="76" fill="#183c50"/>
<text x="48" y="79" font-size="19" font-weight="bold" fill="#183c50">Le chœur voit la servante en pleurs</text>
<text x="48" y="107" font-size="17" fill="#283740">Une question sur la vie ou la mort appelle un témoignage.</text>
<text x="724" y="79" text-anchor="end" fill="#475b65" font-size="15">Devant le palais</text>
<path d="M390 126v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="146" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="146" width="8" height="76" fill="#205455"/>
<text x="48" y="175" font-size="19" font-weight="bold" fill="#205455">La servante raconte ce qu’elle a vu</text>
<text x="48" y="203" font-size="17" fill="#283740">Le récit ouvre aux spectateurs l’espace privé de la maison.</text>
<text x="724" y="175" text-anchor="end" fill="#475b65" font-size="15">Dans le palais</text>
<path d="M390 222v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="242" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="242" width="8" height="76" fill="#775133"/>
<text x="48" y="271" font-size="19" font-weight="bold" fill="#775133">Alceste prie, puis parle au lit</text>
<text x="48" y="299" font-size="17" fill="#283740">La servante restitue deux adresses dont les destinataires diffèrent.</text>
<text x="724" y="271" text-anchor="end" fill="#475b65" font-size="15">Foyer et chambre</text>
<path d="M390 318v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="338" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="338" width="8" height="76" fill="#523f65"/>
<text x="48" y="367" font-size="19" font-weight="bold" fill="#523f65">Chaque serviteur reçoit la parole</text>
<text x="48" y="395" font-size="17" fill="#283740">Au terme du récit, la perte touche la maison entière.</text>
<text x="724" y="367" text-anchor="end" fill="#475b65" font-size="15">Maison d’Admète</text>
</g>
</svg>
