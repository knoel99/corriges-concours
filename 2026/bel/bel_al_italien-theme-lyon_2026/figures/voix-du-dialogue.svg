<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre desc">
<title id="titre">Du regard de Dechartre à sa déclaration</title><desc id="desc">Trois étapes font passer du récit de la rencontre au discours direct de la femme puis aux paroles rapportées de Dechartre.</desc>
<rect width="720" height="341" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="20" y="31" fill="#253e49" font-size="20" font-weight="bold">Du regard de Dechartre à sa déclaration</text>
<rect x="19" y="52" width="681" height="55" rx="5" fill="#ecf4f1" stroke="#71838a"/>
<text x="32" y="84" fill="#253e49" font-size="16" font-weight="bold">La rencontre</text>
<text x="224" y="75" fill="#253e49" font-size="15">Le narrateur suit leurs pas et leurs regards.</text>
<text x="224" y="95" fill="#253e49" font-size="15">Elle ouvre la conversation.</text>
<rect x="19" y="119" width="681" height="55" rx="5" fill="#f3f3f8" stroke="#71838a"/>
<text x="32" y="151" fill="#253e49" font-size="16" font-weight="bold">Ses répliques à elle</text>
<text x="224" y="142" fill="#253e49" font-size="15">Elle parle en son nom et s’adresse à Dechartre.</text>
<text x="224" y="162" fill="#253e49" font-size="15">Ses gestes à lui interrompent brièvement le dialogue.</text>
<rect x="19" y="186" width="681" height="55" rx="5" fill="#fbf3e4" stroke="#71838a"/>
<text x="32" y="218" fill="#253e49" font-size="16" font-weight="bold">Sa réponse à lui</text>
<text x="224" y="209" fill="#253e49" font-size="15">Il lui déclare son amour. Le narrateur rapporte</text>
<text x="224" y="229" fill="#253e49" font-size="15">ses paroles et le souvenir de Fiesole.</text>
<text x="20" y="267" fill="#253e49" font-size="15">Pour chaque troisième personne, identifier celui qui parle et celui dont on parle.</text>
</g></svg>
