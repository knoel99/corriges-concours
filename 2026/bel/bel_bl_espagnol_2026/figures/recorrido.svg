<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">Del consentimiento a las decisiones compartidas</title><desc id="desc">I · Justificar : ¿Quién atribuye a los pueblos americanos una voluntad común? II · Organizar : ¿Quién elige los recursos, participantes y contenidos del intercambio? III · Cooperar : ¿Qué pueden decidir por separado los Estados que se reúnen?</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">Del consentimiento a las decisiones compartidas</text>
<rect x="17" y="57" width="271" height="205" rx="8" fill="#dceff2"/>
<text x="30" y="91" font-size="18" font-weight="bold" fill="#213b4a">I · Justificar</text>
<text x="30" y="151" font-size="17" font-weight="normal" fill="#213b4a">¿Quién atribuye a los</text>
<text x="30" y="175" font-size="17" font-weight="normal" fill="#213b4a">pueblos americanos una</text>
<text x="30" y="199" font-size="17" font-weight="normal" fill="#213b4a">voluntad común?</text>
<path d="M292 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="318" y="57" width="271" height="205" rx="8" fill="#f7ebd5"/>
<text x="331" y="91" font-size="18" font-weight="bold" fill="#213b4a">II · Organizar</text>
<text x="331" y="151" font-size="17" font-weight="normal" fill="#213b4a">¿Quién elige los</text>
<text x="331" y="175" font-size="17" font-weight="normal" fill="#213b4a">recursos, participantes</text>
<text x="331" y="199" font-size="17" font-weight="normal" fill="#213b4a">y contenidos del</text>
<text x="331" y="223" font-size="17" font-weight="normal" fill="#213b4a">intercambio?</text>
<path d="M593 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="619" y="57" width="271" height="205" rx="8" fill="#e7ecf6"/>
<text x="632" y="91" font-size="18" font-weight="bold" fill="#213b4a">III · Cooperar</text>
<text x="632" y="151" font-size="17" font-weight="normal" fill="#213b4a">¿Qué pueden decidir por</text>
<text x="632" y="175" font-size="17" font-weight="normal" fill="#213b4a">separado los Estados que</text>
<text x="632" y="199" font-size="17" font-weight="normal" fill="#213b4a">se reúnen?</text>
</g></svg>
