<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">¿En qué dirección circula la cultura?</title><desc id="desc">En el Instituto : Un público de Madrid escucha música hispanoamericana. En Sevilla : El rey reconoce la aportación literaria recibida desde América. Para comparar : El movimiento de las obras y el poder de decidir pueden diferir.</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">¿En qué dirección circula la cultura?</text>
<rect x="17" y="49" width="876" height="66" rx="7" fill="#dceff2"/>
<text x="33" y="75" font-size="19" font-weight="bold" fill="#213b4a">En el Instituto</text>
<text x="33" y="100" font-size="17" font-weight="normal" fill="#213b4a">Un público de Madrid escucha música hispanoamericana.</text>
<path d="M48 115 v9 m-3 -4 3 4 3 -4" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="17" y="127" width="876" height="66" rx="7" fill="#f7ebd5"/>
<text x="33" y="153" font-size="19" font-weight="bold" fill="#213b4a">En Sevilla</text>
<text x="33" y="178" font-size="17" font-weight="normal" fill="#213b4a">El rey reconoce la aportación literaria recibida desde América.</text>
<path d="M48 193 v9 m-3 -4 3 4 3 -4" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="17" y="205" width="876" height="66" rx="7" fill="#e7ecf6"/>
<text x="33" y="231" font-size="19" font-weight="bold" fill="#213b4a">Para comparar</text>
<text x="33" y="256" font-size="17" font-weight="normal" fill="#213b4a">El movimiento de las obras y el poder de decidir pueden diferir.</text>
</g></svg>
