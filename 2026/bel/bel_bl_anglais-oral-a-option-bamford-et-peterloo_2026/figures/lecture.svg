<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Who can speak, and when?</title>
<desc id="description">Lydgate Women vote on resolutions and form political unions. Who receives credit in the memoir? Manchester, 1819 Bamford remembers a crowd gathered for reform. What could one witness see and hear? London, 1893 An editor republishes the memoir for later readers. Which earlier ambitions still matter to them?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who can speak, and when?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What the text records</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question for the reader</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Lydgate</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Women vote on resolutions</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">and form political unions.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Who receives credit in the</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">memoir?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Manchester, 1819</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Bamford remembers a crowd</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">gathered for reform.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">What could one witness see</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">and hear?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">London, 1893</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">An editor republishes the</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">memoir for later readers.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Which earlier ambitions</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">still matter to them?</text>
</g>
</svg>
