<svg xmlns="http://www.w3.org/2000/svg" width="910" height="299" viewBox="0 0 910 299" role="img" aria-labelledby="titre desc"><title id="titre">Hébergement chez des parents ou amis en 1989</title><desc id="desc">Document 5 · En % des séjours de chaque catégorie de ménage ; Cadres et professions intellectuelles supérieures 41.4 % ; Employés 50.2 % ; Ouvriers 46.2 %. Le réseau familial et amical contribue à l’accès à un lieu de séjour.</desc><rect width="910" height="299" fill="#fbfaf6"/><g font-family="DejaVu Sans,sans-serif" fill="#193a40"><text x="18" y="29" font-size="20" font-weight="bold">Hébergement chez des parents ou amis en 1989</text><text x="18" y="55" font-size="15">Document 5 · En % des séjours de chaque catégorie de ménage</text><text x="18" y="94" font-size="14">Cadres et professions intellectuelles supérieures</text><rect x="367" y="75" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="75" width="198.7" height="24" fill="#367a77"/><text x="854" y="94" font-size="15">41,4 %</text><text x="18" y="142" font-size="14">Employés</text><rect x="367" y="123" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="123" width="241.0" height="24" fill="#367a77"/><text x="854" y="142" font-size="15">50,2 %</text><text x="18" y="190" font-size="14">Ouvriers</text><rect x="367" y="171" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="171" width="221.8" height="24" fill="#367a77"/><text x="854" y="190" font-size="15">46,2 %</text><text x="367" y="219" text-anchor="middle" font-size="13">0</text><text x="487" y="219" text-anchor="middle" font-size="13">25</text><text x="607" y="219" text-anchor="middle" font-size="13">50</text><text x="727" y="219" text-anchor="middle" font-size="13">75</text><text x="847" y="219" text-anchor="middle" font-size="13">100</text><text x="18" y="262" font-size="14">Le réseau familial et amical contribue à l’accès à un lieu de séjour.</text></g></svg>
