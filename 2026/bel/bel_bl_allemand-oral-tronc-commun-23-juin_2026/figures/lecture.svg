<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Drei journalistische Ansprüche an die Leser</title>
<desc id="description">Christian Staas Eine digitalisierte Kartei wird öffentlich durchsuchbar. Welche Aussage trägt der Eintrag? Lisa Plank Ein freundlich klingender Auftritt eröffnet das Porträt. An welcher Stelle kippt der Ton? Habermas-Nachruf Eine Lebenserfahrung beleuchtet die öffentliche Rolle. Wer kann in einem Gespräch widersprechen?</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Drei journalistische Ansprüche an die Leser</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Artikel</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Verfahren</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Prüffrage</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Christian Staas</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Eine digitalisierte Kartei</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">wird öffentlich</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">durchsuchbar.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Welche Aussage trägt der</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Eintrag?</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Lisa Plank</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Ein freundlich klingender</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">Auftritt eröffnet das</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">Porträt.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">An welcher Stelle kippt der</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">Ton?</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Habermas-Nachruf</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Eine Lebenserfahrung</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">beleuchtet die öffentliche</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">Rolle.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Wer kann in einem Gespräch</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">widersprechen?</text>
</g>
</svg>
