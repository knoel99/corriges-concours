<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Reading a place of burial</title>
<desc id="description">Barrett Browning A name carved in stone and covered by moss A lasting mark is being gently reprinted. Muldoon, Coulter A rise or a hollow in the graveyard The gravedigger can identify the family buried there. Muldoon, close Family names beside scattered pieces of furniture Recognition gives way to the difficulty of placing each object.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Reading a place of burial</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Passage</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Material sign</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What it can tell us</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Barrett Browning</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A name carved in stone and</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">covered by moss</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">A lasting mark is being</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">gently reprinted.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Muldoon, Coulter</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">A rise or a hollow in the</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">graveyard</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">The gravedigger can</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">identify the family buried</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">there.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Muldoon, close</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Family names beside</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">scattered pieces of</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">furniture</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Recognition gives way to</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">the difficulty of placing</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">each object.</text>
</g>
</svg>
