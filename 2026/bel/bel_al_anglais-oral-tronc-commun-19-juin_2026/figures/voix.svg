<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Whom can the speaker address?</title>
<desc id="description">Bradstreet The lost house, then her own heart What can the speaker command herself to let go? Donne The beloved at the point of parting Who may weep, and who must hold back? Barrett Browning Her heart, a listener, the remembered Ralph How does her speech change when someone answers?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Whom can the speaker address?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Poem</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Addressee</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question for the listener</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Bradstreet</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">The lost house, then her</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">own heart</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">What can the speaker</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">command herself to let go?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Donne</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">The beloved at the point</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">of parting</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Who may weep, and who must</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">hold back?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Barrett Browning</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Her heart, a listener, the</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">remembered Ralph</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">How does her speech change</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">when someone answers?</text>
</g>
</svg>
