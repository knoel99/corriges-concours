<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Quem assiste a quem?</title>
<desc id="description">Juca recusa o troco. A moça deve admirar sua generosidade. O narrador comenta a encenação com ironia. O narrador pisa no pé de Juca. Juca crê que a moça corresponde. A dor obriga o narrador a interromper a brincadeira. O narrador fala francês. A vizinha deve admirar sua instrução. A velha ouve outro nome. A moça e o rival riem.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quem assiste a quem?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Em cena</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Público desejado</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">O que de fato acontece</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Juca recusa o troco.</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A moça deve admirar sua</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">generosidade.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">O narrador comenta a</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">encenação com ironia.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">O narrador pisa no pé</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">de Juca.</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Juca crê que a moça</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">corresponde.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">A dor obriga o narrador a</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">interromper a brincadeira.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">O narrador fala</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">francês.</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">A vizinha deve admirar sua</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">instrução.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">A velha ouve outro nome. A</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">moça e o rival riem.</text>
</g>
</svg>
