<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" role="img" aria-labelledby="titre desc">
  <title id="titre">Les trois regards sur la cour</title>
  <desc id="desc">Depuis le bureau, l’entrée et la cour sont visibles. Dans l’autre sens, l’ouvrier distingue à peine les contours du bureau. Des fenêtres des ateliers, les autres ouvriers voient leur camarade exposé dans la cour.</desc>
  <rect width="720" height="278" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="20" y="31" fill="#203542" font-size="21" font-weight="bold">Les trois regards sur la cour</text>
    <rect x="22" y="66" width="147" height="76" rx="6" fill="#e3efef" stroke="#35685c" stroke-width="1.5"/>
    <text x="95" y="95" text-anchor="middle" fill="#214d43" font-size="17" font-weight="bold">Bureau</text>
    <text x="95" y="119" text-anchor="middle" fill="#214d43" font-size="14">derrière le voilage</text>
    <rect x="520" y="66" width="177" height="126" rx="6" fill="#fcf1da" stroke="#805c27" stroke-width="1.5"/>
    <text x="609" y="116" text-anchor="middle" fill="#654817" font-size="17" font-weight="bold">Cour</text>
    <text x="609" y="144" text-anchor="middle" fill="#654817" font-size="14">ouvrier à découvert</text>
    <path d="M180 83 H507 M499 77 L507 83 L499 89" fill="none" stroke="#286255" stroke-width="2.5"/>
    <text x="342" y="71" text-anchor="middle" fill="#244f44" font-size="15">Vue sur l’entrée et la cour</text>
    <path d="M507 122 H181" fill="none" stroke="#66737c" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M188 116 L180 122 L188 128" fill="none" stroke="#66737c" stroke-width="2"/>
    <text x="343" y="147" text-anchor="middle" fill="#44535c" font-size="15">Au retour, des contours flous</text>
    <rect x="22" y="190" width="147" height="60" rx="6" fill="#eef1f5" stroke="#586b83" stroke-width="1.5"/>
    <text x="95" y="215" text-anchor="middle" fill="#324963" font-size="17" font-weight="bold">Ateliers</text>
    <text x="95" y="237" text-anchor="middle" fill="#324963" font-size="14">depuis les fenêtres</text>
    <path d="M180 219 H399 Q421 219 443 205 L509 172 M501 170 L509 172 L505 180" fill="none" stroke="#405b7b" stroke-width="2.5"/>
    <text x="323" y="245" text-anchor="middle" fill="#324963" font-size="15">Les camarades le voient et ricanent.</text>
  </g>
</svg>
