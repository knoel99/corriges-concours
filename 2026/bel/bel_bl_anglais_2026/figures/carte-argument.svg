<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">Following the argument across the five documents</title><desc id="desc">I · Observe : Use Novak to read households and county institutions. II · Compare : Ask how Dix and Joseph use the idea of independence. III · Interpret : Test Joseph’s and Obama’s national stories against their sources.</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">Following the argument across the five documents</text>
<rect x="17" y="57" width="271" height="205" rx="8" fill="#dceff2"/>
<text x="30" y="91" font-size="18" font-weight="bold" fill="#213b4a">I · Observe</text>
<text x="30" y="151" font-size="17" font-weight="normal" fill="#213b4a">Use Novak to read</text>
<text x="30" y="175" font-size="17" font-weight="normal" fill="#213b4a">households and county</text>
<text x="30" y="199" font-size="17" font-weight="normal" fill="#213b4a">institutions.</text>
<path d="M292 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="318" y="57" width="271" height="205" rx="8" fill="#f7ebd5"/>
<text x="331" y="91" font-size="18" font-weight="bold" fill="#213b4a">II · Compare</text>
<text x="331" y="151" font-size="17" font-weight="normal" fill="#213b4a">Ask how Dix and Joseph</text>
<text x="331" y="175" font-size="17" font-weight="normal" fill="#213b4a">use the idea of</text>
<text x="331" y="199" font-size="17" font-weight="normal" fill="#213b4a">independence.</text>
<path d="M593 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="619" y="57" width="271" height="205" rx="8" fill="#e7ecf6"/>
<text x="632" y="91" font-size="18" font-weight="bold" fill="#213b4a">III · Interpret</text>
<text x="632" y="151" font-size="17" font-weight="normal" fill="#213b4a">Test Joseph’s and</text>
<text x="632" y="175" font-size="17" font-weight="normal" fill="#213b4a">Obama’s national stories</text>
<text x="632" y="199" font-size="17" font-weight="normal" fill="#213b4a">against their sources.</text>
