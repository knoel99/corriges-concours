<svg xmlns="http://www.w3.org/2000/svg" width="910" height="299" viewBox="0 0 910 299" role="img" aria-labelledby="titre desc"><title id="titre">Emploi en entreprise privée dix ans après la sortie de l’ENA</title><desc id="desc">Document 4 · Ensemble des énarques de chaque cohorte · En % ; Cohorte 1969, observée en 1980 8.3 % ; Cohorte 1989, observée en 2000 14.5 % ; Cohorte 1999, observée en 2010 9.5 %. Une photographie à dix ans ne mesure pas la durée des passages antérieurs dans le privé.</desc><rect width="910" height="299" fill="#fbfaf6"/><g font-family="DejaVu Sans,sans-serif" fill="#193a40"><text x="18" y="29" font-size="20" font-weight="bold">Emploi en entreprise privée dix ans après la sortie de l’ENA</text><text x="18" y="55" font-size="15">Document 4 · Ensemble des énarques de chaque cohorte · En %</text><text x="18" y="94" font-size="14">Cohorte 1969, observée en 1980</text><rect x="367" y="75" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="75" width="39.8" height="24" fill="#367a77"/><text x="854" y="94" font-size="15">8,3 %</text><text x="18" y="142" font-size="14">Cohorte 1989, observée en 2000</text><rect x="367" y="123" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="123" width="69.6" height="24" fill="#367a77"/><text x="854" y="142" font-size="15">14,5 %</text><text x="18" y="190" font-size="14">Cohorte 1999, observée en 2010</text><rect x="367" y="171" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="171" width="45.6" height="24" fill="#367a77"/><text x="854" y="190" font-size="15">9,5 %</text><text x="367" y="219" text-anchor="middle" font-size="13">0</text><text x="487" y="219" text-anchor="middle" font-size="13">25</text><text x="607" y="219" text-anchor="middle" font-size="13">50</text><text x="727" y="219" text-anchor="middle" font-size="13">75</text><text x="847" y="219" text-anchor="middle" font-size="13">100</text><text x="18" y="262" font-size="14">Une photographie à dix ans ne mesure pas la durée des passages antérieurs dans le privé.</text></g></svg>
