<svg xmlns="http://www.w3.org/2000/svg" width="820" height="285" viewBox="0 0 820 285" role="img" aria-labelledby="titre desc"><title id="titre">De la parole de Prométhée au jugement sur sa peine</title><desc id="desc">Condition au futur : Prométhée poursuit ses propos. Possibilité à l’optatif : Zeus pourrait l’entendre. Conséquence à l’infinitif : ses maux présents sembleraient légers à Prométhée.</desc><rect width="820" height="285" fill="#fffdf7"/><g font-family="DejaVu Sans,sans-serif" fill="#193f4a"><text x="24" y="34" font-size="21" font-weight="bold">De la parole de Prométhée au jugement sur sa peine</text><rect x="25" y="50" width="765" height="61" rx="5" fill="white" stroke="#97aeb0"/><rect x="25" y="50" width="7" height="61" fill="#337570"/><text x="43" y="75" font-size="18" font-weight="bold">Si Prométhée parle encore ainsi</text><text x="43" y="98" font-size="15">Condition au futur dans le texte grec.</text><path d="M405 112v11m-4 -4 4 4 4 -4" fill="none" stroke="#38656b" stroke-width="2"/><rect x="25" y="126" width="765" height="61" rx="5" fill="white" stroke="#97aeb0"/><rect x="25" y="126" width="7" height="61" fill="#337570"/><text x="43" y="151" font-size="18" font-weight="bold">Zeus pourrait l’entendre</text><text x="43" y="174" font-size="15">Optatif avec la particule de possibilité.</text><path d="M405 188v11m-4 -4 4 4 4 -4" fill="none" stroke="#38656b" stroke-width="2"/><rect x="25" y="202" width="765" height="61" rx="5" fill="white" stroke="#97aeb0"/><rect x="25" y="202" width="7" height="61" fill="#337570"/><text x="43" y="227" font-size="18" font-weight="bold">Les peines actuelles lui sembleraient un jeu</text><text x="43" y="250" font-size="15">Conséquence envisagée du point de vue de Prométhée.</text></g></svg>
