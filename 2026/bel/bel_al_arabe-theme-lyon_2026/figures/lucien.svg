<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Du regard sur la ville au regard sur soi</title>
<desc id="description">Le nouvel arrivant Les magasins, les immeubles, les voitures. L’ensemble s’impose avant les visages. Le provincial Les marques de considération qu’il recevait chez lui. À Paris, sa valeur sociale semble se dissoudre. Le jeune poète Un écho, un confident, une âme qui partage. Dans la foule, il pressent le désert.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Du regard sur la ville au regard sur soi</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Qui perçoit ?</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Objet de l’attention</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conséquence</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le nouvel arrivant</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Les magasins, les</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">immeubles, les voitures.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’ensemble s’impose avant</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">les visages.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le provincial</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Les marques de</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">considération qu’il</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">recevait chez lui.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">À Paris, sa valeur sociale</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">semble se dissoudre.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Le jeune poète</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Un écho, un confident, une</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">âme qui partage.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Dans la foule, il pressent</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">le désert.</text>
</g>
</svg>
