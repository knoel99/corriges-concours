<svg xmlns="http://www.w3.org/2000/svg" width="720" height="238" viewBox="0 0 720 238" role="img" aria-labelledby="titre description">
<title id="titre">La soirée comme point de repère</title>
<desc id="description">Le trait part du milieu de l’après-midi et atteint le retour du père. Depuis le retour, le récit mesure combien de temps le commentaire télévisé a déjà duré.</desc>
<rect width="720" height="238" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="18" y="30" text-anchor="start" fill="#202f37" font-size="21" font-weight="bold">La soirée comme point de repère</text>
<text x="18" y="64" text-anchor="start" fill="#202f37" font-size="16" font-weight="bold">Milieu de l’après-midi</text>
<text x="685" y="64" text-anchor="end" fill="#202f37" font-size="16" font-weight="bold">Dans la soirée</text>
<line x1="40" y1="91" x2="680" y2="91" stroke="#115b61" stroke-width="2"/>
<path d="M676 87 L685 91 L676 95 Z" fill="#115b61"/>
<circle cx="70" cy="91" r="7" fill="#115b61"/>
<circle cx="608" cy="91" r="7" fill="#115b61"/>
<text x="18" y="121" text-anchor="start" fill="#202f37" font-size="14" font-weight="normal">Les présentateurs</text>
<text x="18" y="140" text-anchor="start" fill="#202f37" font-size="14" font-weight="normal">commencent à parler.</text>
<text x="685" y="121" text-anchor="end" fill="#202f37" font-size="14" font-weight="normal">Le père retrouve</text>
<text x="685" y="140" text-anchor="end" fill="#202f37" font-size="14" font-weight="normal">sa famille.</text>
<line x1="70" y1="146" x2="70" y2="191" stroke="#455660" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="608" y1="146" x2="608" y2="191" stroke="#455660" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="70" y="160" width="538" height="34" rx="5" fill="#dfefeb"/>
<text x="339" y="182" text-anchor="middle" fill="#115b61" font-size="15" font-weight="bold">Commentaires télévisés déjà en cours depuis plusieurs heures</text>
<text x="70" y="220" text-anchor="start" fill="#455660" font-size="14" font-weight="normal">since midafternoon</text>
<text x="608" y="220" text-anchor="end" fill="#455660" font-size="14" font-weight="normal">had been doing</text>
</g></svg>
