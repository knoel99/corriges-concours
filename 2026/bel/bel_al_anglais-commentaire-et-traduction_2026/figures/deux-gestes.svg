<svg xmlns="http://www.w3.org/2000/svg" width="720" height="242" viewBox="0 0 720 242" role="img" aria-labelledby="titre description">
<title id="titre">Le geste répété à la fenêtre</title>
<desc id="description">Le monstre peut montrer un corps à Victor. Victor montre à la foule le point où le monstre a disparu, sans pouvoir rendre ce dernier visible.</desc>
<rect width="720" height="242" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="18" y="30" text-anchor="start" fill="#202f37" font-size="21" font-weight="bold">Le geste répété à la fenêtre</text>
<rect x="18" y="57" width="139" height="44" rx="5" fill="#dfefeb"/>
<text x="87" y="85" text-anchor="middle" fill="#115b61" font-size="15" font-weight="bold">Le monstre</text>
<line x1="161" y1="79" x2="217" y2="79" stroke="#115b61" stroke-width="2"/>
<path d="M213 75 L222 79 L213 83 Z" fill="#115b61"/>
<rect x="227" y="55" width="224" height="48" rx="5" fill="#f2f5f5"/>
<text x="339" y="74" text-anchor="middle" fill="#202f37" font-size="15" font-weight="bold">Le corps</text>
<text x="339" y="93" text-anchor="middle" fill="#202f37" font-size="15" font-weight="normal">d’Elizabeth</text>
<line x1="455" y1="79" x2="513" y2="79" stroke="#115b61" stroke-width="2"/>
<path d="M509 75 L518 79 L509 83 Z" fill="#115b61"/>
<rect x="522" y="57" width="177" height="44" rx="5" fill="#dfefeb"/>
<text x="611" y="85" text-anchor="middle" fill="#115b61" font-size="15" font-weight="bold">Victor</text>
<text x="192" y="119" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">montre</text>
<text x="486" y="119" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">à</text>
<text x="611" y="121" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">Le corps reste visible.</text>
<rect x="18" y="149" width="139" height="44" rx="5" fill="#f7ecda"/>
<text x="87" y="177" text-anchor="middle" fill="#82501c" font-size="15" font-weight="bold">Victor</text>
<line x1="161" y1="171" x2="217" y2="171" stroke="#82501c" stroke-width="2"/>
<path d="M213 167 L222 171 L213 175 Z" fill="#82501c"/>
<rect x="227" y="147" width="224" height="48" rx="5" fill="#f2f5f5"/>
<text x="339" y="166" text-anchor="middle" fill="#202f37" font-size="15" font-weight="bold">Le point de disparition</text>
<text x="339" y="185" text-anchor="middle" fill="#202f37" font-size="15" font-weight="normal">sur le lac</text>
<line x1="455" y1="171" x2="513" y2="171" stroke="#82501c" stroke-width="2"/>
<path d="M509 167 L518 171 L509 175 Z" fill="#82501c"/>
<rect x="522" y="149" width="177" height="44" rx="5" fill="#f7ecda"/>
<text x="611" y="177" text-anchor="middle" fill="#82501c" font-size="15" font-weight="bold">La foule</text>
<text x="192" y="211" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">montre</text>
<text x="486" y="211" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">à</text>
<text x="611" y="213" text-anchor="middle" fill="#455660" font-size="13" font-weight="normal">Le meurtrier s’est dérobé.</text>
</g></svg>
