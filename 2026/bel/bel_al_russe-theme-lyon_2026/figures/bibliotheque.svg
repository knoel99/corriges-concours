<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Deux temps dans la bibliothèque</title>
<desc id="description">Cette réception Laura et des invités rassemblés pour le soir. Elle bâille puis se retire. Cinq ans plus tôt Ses amis et son amant d’alors. Elle retrouve une confiance qu’ils croyaient durable. Du souvenir au fauteuil Josée quitte son fauteuil. La joie passée lui serre la gorge.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux temps dans la bibliothèque</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Repère</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Personnes présentes</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce que ressent Josée</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Cette réception</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Laura et des invités</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">rassemblés pour le soir.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Elle bâille puis se retire.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Cinq ans plus tôt</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Ses amis et son amant</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">d’alors.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Elle retrouve une confiance</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">qu’ils croyaient durable.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Du souvenir au</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">fauteuil</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Josée quitte son fauteuil.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La joie passée lui serre la</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">gorge.</text>
</g>
</svg>
