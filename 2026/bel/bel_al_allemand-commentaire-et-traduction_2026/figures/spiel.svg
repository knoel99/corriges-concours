<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Wer führt die Bewegung aus, wer beherrscht sie?</title>
<desc id="description">Auf der Bühne Der Clown spielt Ankunft und Abfahrt. Das Publikum verwechselt die eine mit der anderen. Im Hotel Hans sucht die Abfahrtstafel und rennt zur Treppe. Seine eigene Erfindung führt ihn irre. Vor dem Auftritt Hans macht sich in der Angst selbst zur Marionette. Die Kritiker glauben, das Herz des Clowns zu hören.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Wer führt die Bewegung aus, wer beherrscht sie?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Situation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Körper und Bewegung</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Wirkung</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Auf der Bühne</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Der Clown spielt Ankunft</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">und Abfahrt.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Das Publikum verwechselt</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">die eine mit der anderen.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Im Hotel</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Hans sucht die</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Abfahrtstafel und rennt</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">zur Treppe.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Seine eigene Erfindung</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">führt ihn irre.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Vor dem Auftritt</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Hans macht sich in der</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Angst selbst zur</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">Marionette.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Die Kritiker glauben, das</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Herz des Clowns zu hören.</text>
</g>
</svg>
