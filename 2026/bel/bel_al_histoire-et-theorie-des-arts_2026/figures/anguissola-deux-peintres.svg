<svg xmlns="http://www.w3.org/2000/svg" width="707" height="271" viewBox="0 0 707 271" role="img" aria-labelledby="t d"><title id="t">Qui peint qui chez Anguissola ?</title><desc id="d">Deux cadres emboîtés distinguent la toile réelle, due à Anguissola, et le portrait intérieur, que le maître est montré en train de peindre.</desc><rect x="0" y="0" width="707" height="271" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.8"/><rect x="25" y="20" width="655" height="231" rx="6" fill="#f4eee2" stroke="#52626a" stroke-width="1.8"/>
<text x="45" y="53" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#152e3b" font-weight="700">Toile peinte par Sofonisba Anguissola</text>
<rect x="330" y="78" width="315" height="126" rx="3" fill="#e2f0ef" stroke="#176478" stroke-width="1.8"/>
<text x="348" y="108" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#176478" font-weight="700">Portrait dans la toile</text>
<text x="348" y="143" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#152e3b" font-weight="400">Sofonisba apparaît</text>
<text x="348" y="170" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#152e3b" font-weight="400">comme modèle.</text>
<text x="54" y="115" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#152e3b" font-weight="700">Bernardino Campi</text>
<text x="54" y="143" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#152e3b" font-weight="400">figure en peintre.</text>
<line x1="236" y1="138" x2="324" y2="138" stroke="#a9432b" stroke-width="2"/>
<polyline points="315,132 324,138 315,144" fill="none" stroke="#a9432b" stroke-width="2"/>
<text x="46" y="230" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#152e3b" font-weight="700">La peintre réelle décide des deux rôles que nous regardons.</text></svg>
