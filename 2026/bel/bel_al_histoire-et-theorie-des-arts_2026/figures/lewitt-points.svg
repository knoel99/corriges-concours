<svg xmlns="http://www.w3.org/2000/svg" width="700" height="254" viewBox="0 0 700 254" role="img" aria-labelledby="t d"><title id="t">Deux applications schématiques d’une instruction</title><desc id="d">Exercice sur deux murs fictifs. En reliant tous les points deux à deux, des géométries différentes produisent des réseaux différents.</desc><rect x="0" y="0" width="700" height="254" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.8"/><text x="26" y="33" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152e3b" font-weight="700">L’instruction de LeWitt change d’effet avec le mur</text>
