<svg xmlns="http://www.w3.org/2000/svg" width="715" height="266" viewBox="0 0 715 266" role="img" aria-labelledby="t d"><title id="t">L’Atelier du peintre, organisation de l’allégorie</title><desc id="d">Diagramme de lecture du tableau de Courbet. Son centre associe plusieurs témoins et un paysage peint, entre les figures sociales et les soutiens du peintre.</desc><rect x="0" y="0" width="715" height="266" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.8"/><text x="25" y="32" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#152e3b" font-weight="700">Le centre et les groupes latéraux</text>
<rect x="25" y="49" width="665" height="167" rx="3" fill="none" stroke="#52626a" stroke-width="1.8"/>
<text x="40" y="87" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#52626a" font-weight="700">À gauche</text>
<text x="40" y="122" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="400">Figures de diverses</text>
<text x="40" y="146" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="400">conditions sociales</text>
<text x="251" y="87" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#176478" font-weight="700">Au centre</text>
<text x="251" y="122" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="400">Courbet au chevalet,</text>
<text x="251" y="146" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="400">un modèle, un enfant</text>
<text x="476" y="87" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#52626a" font-weight="700">À droite</text>
<text x="476" y="122" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="400">Amis et soutiens,</text>
<text x="476" y="146" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="400">dont Baudelaire lisant</text>
<line x1="230" y1="72" x2="230" y2="196" stroke="#b7c5c7" stroke-width="1"/>
<line x1="450" y1="72" x2="450" y2="196" stroke="#b7c5c7" stroke-width="1"/>
<rect x="250" y="162" width="183" height="36" rx="3" fill="#e3f0ed" stroke="#176478" stroke-width="1.8"/>
<text x="341" y="186" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176478" font-weight="700">Paysage sur la toile</text>
<text x="31" y="245" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#152e3b" font-weight="400">Le motif peint au centre diffère du modèle présent dans l’atelier.</text></svg>
