<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Les relais du geste d’Isménodore</title>
<desc id="description">Isménodore Elle guette l’heure et touche la chlamyde. Trajet vers la palestre et seuil de la maison. Amis, femmes, serviteurs Ils saisissent Bacchon, changent son vêtement et couronnent les portes. Intérieur, puis les deux demeures. Spectateurs et gymnasiarques Les uns rient et les autres demandent une intervention. Rue et espace civique.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Les relais du geste d’Isménodore</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Acteurs</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Geste</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Espace</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Isménodore</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Elle guette l’heure et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">touche la chlamyde.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Trajet vers la palestre et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">seuil de la maison.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Amis, femmes,</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">serviteurs</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Ils saisissent Bacchon,</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">changent son vêtement et</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">couronnent les portes.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Intérieur, puis les deux</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">demeures.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Spectateurs et</text>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">gymnasiarques</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Les uns rient et les</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">autres demandent une</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">intervention.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Rue et espace civique.</text>
</g>
</svg>
