<svg xmlns="http://www.w3.org/2000/svg" width="720" height="282" viewBox="0 0 720 282" role="img" aria-labelledby="titre desc">
  <title id="titre">Les deux amorces de la phrase du souvenir</title>
  <desc id="desc">Une première amorce, nunca veían surgir, est suspendue par trois temporelles sur la rue, les vitrines et la loge. La seconde amorce, nunca veían alzarse, aboutit aux trois images du souvenir, le mur, les pavés et les marches.</desc>
  <rect width="720" height="282" fill="white"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="18" y="30" font-size="20" font-weight="bold" fill="#263943">Les deux amorces de la phrase du souvenir</text>
    <rect x="18" y="49" width="187" height="51" rx="5" fill="#e2f1ee" stroke="#22685c"/>
    <text x="111" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#204d45">Première amorce</text>
    <text x="111" y="89" font-size="14" text-anchor="middle" font-style="italic" fill="#204d45">nunca veían surgir</text>
    <path d="M205 75 H239 M232 70 L239 75 L232 80" stroke="#394b56" fill="none" stroke-width="2"/>
    <rect x="245" y="49" width="457" height="51" rx="5" fill="#eef2f5" stroke="#647986"/>
    <text x="474" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#344952">Trois gestes dans le quartier</text>
    <text x="474" y="89" font-size="14" text-anchor="middle" fill="#344952">Marcher dans la rue · regarder les vitrines · saluer</text>
    <path d="M475 100 V122 H111 V145 M106 138 L111 145 L116 138" fill="none" stroke="#394b56" stroke-width="2"/>
    <rect x="18" y="151" width="187" height="51" rx="5" fill="#e2f1ee" stroke="#22685c"/>
    <text x="111" y="172" font-size="15" text-anchor="middle" font-weight="bold" fill="#204d45">Reprise</text>
    <text x="111" y="191" font-size="14" text-anchor="middle" font-style="italic" fill="#204d45">nunca veían alzarse</text>
    <path d="M205 176 H239 M232 171 L239 176 L232 181" stroke="#394b56" fill="none" stroke-width="2"/>
    <rect x="245" y="151" width="457" height="51" rx="5" fill="#fcf2df" stroke="#8e6528"/>
    <text x="474" y="172" font-size="15" font-weight="bold" text-anchor="middle" fill="#664719">Trois images qui pourraient leur revenir</text>
    <text x="474" y="191" font-size="14" text-anchor="middle" fill="#664719">Le mur · les pavés · les marches</text>
    <text x="18" y="241" font-size="15" fill="#263943">Les gestes habituels retardent l’apparition des trois images dans la phrase.</text>
    <text x="18" y="263" font-size="15" fill="#263943">Dans la mémoire des personnages, ces images ne surgissent jamais.</text>
  </g>
</svg>
