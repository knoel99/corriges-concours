<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Un cuarto, dos explicaciones de lo ocurrido</title>
<desc id="description">Alacena Entran y salen las dos mujeres. Cosme encuentra la sala vacía. Retrato y billete Ángela mira y deja una carta. El destinatario llegará después. Monedas y carbón Isabel sustituye los cuartos. Cosme invoca un duendecillo.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Un cuarto, dos explicaciones de lo ocurrido</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Objeto</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Acción vista por el público</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Lectura parcial</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Alacena</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Entran y salen las dos</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">mujeres.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Cosme encuentra la sala</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">vacía.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Retrato y billete</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Ángela mira y deja una</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">carta.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">El destinatario llegará</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">después.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Monedas y carbón</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Isabel sustituye los</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">cuartos.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Cosme invoca un</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">duendecillo.</text>
</g>
</svg>
