<svg xmlns="http://www.w3.org/2000/svg" width="910" height="299" viewBox="0 0 910 299" role="img" aria-labelledby="titre desc"><title id="titre">Trois souhaits professionnels des jeunes salariés</title><desc id="desc">Document 7 · Dans les cinq années à venir · En % des salariés du champ ; Changer d’emploi ou d’entreprise 59 % ; Prendre davantage de responsabilités 73 % ; Faire évoluer le contenu de l’activité 79 %. Plusieurs souhaits peuvent être exprimés par une même personne.</desc><rect width="910" height="299" fill="#fbfaf6"/><g font-family="DejaVu Sans,sans-serif" fill="#193a40"><text x="18" y="29" font-size="20" font-weight="bold">Trois souhaits professionnels des jeunes salariés</text><text x="18" y="55" font-size="15">Document 7 · Dans les cinq années à venir · En % des salariés du champ</text><text x="18" y="94" font-size="14">Changer d’emploi ou d’entreprise</text><rect x="367" y="75" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="75" width="283.2" height="24" fill="#367a77"/><text x="854" y="94" font-size="15">59 %</text><text x="18" y="142" font-size="14">Prendre davantage de responsabilités</text><rect x="367" y="123" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="123" width="350.4" height="24" fill="#367a77"/><text x="854" y="142" font-size="15">73 %</text><text x="18" y="190" font-size="14">Faire évoluer le contenu de l’activité</text><rect x="367" y="171" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="171" width="379.2" height="24" fill="#367a77"/><text x="854" y="190" font-size="15">79 %</text><text x="367" y="219" text-anchor="middle" font-size="13">0</text><text x="487" y="219" text-anchor="middle" font-size="13">25</text><text x="607" y="219" text-anchor="middle" font-size="13">50</text><text x="727" y="219" text-anchor="middle" font-size="13">75</text><text x="847" y="219" text-anchor="middle" font-size="13">100</text><text x="18" y="262" font-size="14">Plusieurs souhaits peuvent être exprimés par une même personne.</text></g></svg>
