<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="titre description">
<title id="titre">Un sacerdoce, une compétence et une trajectoire</title>
<desc id="description">Décemvirs des rites Consulter les livres Répondre à une crise Vestales Service de Vesta Autorité publique féminine Grand pontife Présider le collège pontifical Continuité sous Auguste</desc>
<rect width="720" height="253" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Un sacerdoce, une compétence et une trajectoire</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Fonction</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Exercice</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Enjeu politique</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Décemvirs des rites</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Consulter les livres</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Répondre à une crise</text>
