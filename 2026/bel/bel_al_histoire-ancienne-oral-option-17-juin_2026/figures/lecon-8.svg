<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">Présider le collège</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">pontifical</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">Continuité sous Auguste</text>
