<svg xmlns="http://www.w3.org/2000/svg" width="720" height="231" viewBox="0 0 720 231" role="img" aria-labelledby="titre description">
<title id="titre">Qu’est-ce qui fait reconnaître le chevalier ?</title>
<desc id="description">Cité censitaire Cheval public et revue Censeurs Justice provinciale Accès à certains jurys Lois républicaines Principat Préfecture d’Égypte Choix du prince</desc>
<rect width="720" height="231" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qu’est-ce qui fait reconnaître le chevalier ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Cadre</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Marque ou charge</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Autorité déterminante</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Cité censitaire</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Cheval public et revue</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Censeurs</text>
<rect x="10" y="137" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Justice provinciale</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Accès à certains jurys</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Lois républicaines</text>
<rect x="10" y="182" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="207" font-size="15" font-weight="700" fill="#162d3b">Principat</text>
<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">Préfecture d’Égypte</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">Choix du prince</text>
</g>
</svg>
