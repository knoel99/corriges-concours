<svg xmlns="http://www.w3.org/2000/svg" width="720" height="231" viewBox="0 0 720 231" role="img" aria-labelledby="titre description">
<title id="titre">Les liens familiaux à l’épreuve des institutions</title>
<desc id="description">Transmettre des biens Héritiers de Gortyne Règles inscrites Entrer dans le dème Parents et témoins Vote des démotes Honorer les morts Proches et orateur Funérailles par tribus</desc>
<rect width="720" height="231" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
