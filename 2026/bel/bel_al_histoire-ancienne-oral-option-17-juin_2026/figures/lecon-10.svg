<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Trois changements légitimés par le passé</title>
<desc id="description">Introduire la Grande Mère Livres et décision du Sénat Élargir le culte public Redistribuer les terres Ancienne limite invoquée Débat sur le tribunat Admettre des notables Intégrations précédentes Recrutement du Sénat</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois changements légitimés par le passé</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Changement</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Passé mobilisé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Introduire la Grande</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">Mère</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Livres et décision du</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Sénat</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Élargir le culte public</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Redistribuer les</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">terres</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Ancienne limite invoquée</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Débat sur le tribunat</text>
<rect x="10" y="226" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Admettre des notables</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Intégrations précédentes</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Recrutement du Sénat</text>
</g>
</svg>
