<desc id="description">Demande d’un foyer Prière et promesse Dédicace votive Événement extraordinaire Sénat et spécialistes Rites prescrits Retour du prince Décision sénatoriale Sacrifice à l’autel de Paix</desc>
<rect width="720" height="253" fill="#fcfbf7"/>
