<svg xmlns="http://www.w3.org/2000/svg" width="720" height="231" viewBox="0 0 720 231" role="img" aria-labelledby="titre description">
<title id="titre">Une décision n’acquiert son sens qu’avec le temps</title>
<desc id="description">Revenus du Laurion Choisir un usage commun Prévoyance prêtée au chef Salamine, 480 Maintenir une coalition Gloires concurrentes Ostracisme puis exil Écarter un citoyen Portrait de Thucydide</desc>
<rect width="720" height="231" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Une décision n’acquiert son sens qu’avec le temps</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Enjeu immédiat</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Mémoire ultérieure</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Revenus du Laurion</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Choisir un usage commun</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Prévoyance prêtée au chef</text>
<rect x="10" y="137" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Salamine, 480</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Maintenir une coalition</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Gloires concurrentes</text>
<rect x="10" y="182" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="207" font-size="15" font-weight="700" fill="#162d3b">Ostracisme puis exil</text>
<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">Écarter un citoyen</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">Portrait de Thucydide</text>
</g>
</svg>
