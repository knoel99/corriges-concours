<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Trois façons de rendre la disparition perceptible</title>
<desc id="description">Avant la disparition Un récit anonyme circule entre les clients. Qui a vu emporter les livres ou leurs libraires ? Pendant l’absence Le silence du téléphone et le magasin fermé donnent l’alerte. Personne ne voit la scène du rapt. Chez la cliente Un appel au colonel fait espérer un retour. La famille entend sa nièce, jamais sa réponse.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois façons de rendre la disparition perceptible</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui se sait</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui le fait savoir</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui échappe</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Avant la disparition</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un récit anonyme circule</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">entre les clients.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Qui a vu emporter les</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">livres ou leurs libraires ?</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Pendant l’absence</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le silence du téléphone et</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">le magasin fermé donnent</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">l’alerte.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Personne ne voit la scène</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">du rapt.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Chez la cliente</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Un appel au colonel fait</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">espérer un retour.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La famille entend sa nièce,</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">jamais sa réponse.</text>
</g>
</svg>
