<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">Leer señales en el viaje de regreso</title>
<desc id="description">El muchacho, a bordo Primero la estela, luego los muertos a proa Deduce lo sucedido a partir de huellas. Los marineros Caras conocidas entre los cuerpos Reconocerlos no impide dejarlos a la deriva. El primer cura El joven al que cuida y teme Las preguntas proyectan su propia sospecha. El viejo que recuerda Quesada y el pueblo en la colina La discreción permite un recuerdo compartible.</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Leer señales en el viaje de regreso</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Observador</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Objeto de la mirada</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Resultado</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">El muchacho, a bordo</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Primero la estela, luego</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">los muertos a proa</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Deduce lo sucedido a partir</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">de huellas.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Los marineros</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Caras conocidas entre los</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">cuerpos</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Reconocerlos no impide</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">dejarlos a la deriva.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">El primer cura</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">El joven al que cuida y</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">teme</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Las preguntas proyectan su</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">propia sospecha.</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">El viejo que recuerda</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Quesada y el pueblo en la</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">colina</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">La discreción permite un</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">recuerdo compartible.</text>
</g>
</svg>
