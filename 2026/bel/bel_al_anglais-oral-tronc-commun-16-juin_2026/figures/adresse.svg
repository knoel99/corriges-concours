<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">What changes when someone answers?</title>
<desc id="description">Solie A passer-by reads a warning posted by tenants. A question turns back on the person who asks it. Donne The two lovers appear to stand outside time. Both must keep faith to continue their reign. Kunial A son judges his father’s grammar. The word he once criticised gives the advice its lasting shape.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What changes when someone answers?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Work</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">First position</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">The relation changes</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Solie</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A passer-by reads a</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">warning posted by tenants.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">A question turns back on</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">the person who asks it.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Donne</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">The two lovers appear to</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">stand outside time.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Both must keep faith to</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">continue their reign.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Kunial</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">A son judges his father’s</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">grammar.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">The word he once criticised</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">gives the advice its</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">lasting shape.</text>
</g>
</svg>
