<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">What does a second look make possible?</title>
<desc id="description">Jewett A heron and the place it lives Decide who may have the knowledge Sylvia has gained Rich An apparently perfect toy in a window Give it the life a player and a receiver would make Hawthorne A young woman seen from an upper window Tell an observer what kind of life she desires</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What does a second look make possible?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Work</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What can be seen</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What sight alone cannot do</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Jewett</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A heron and the place it</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">lives</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Decide who may have the</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">knowledge Sylvia has gained</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Rich</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">An apparently perfect toy</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">in a window</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Give it the life a player</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">and a receiver would make</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Hawthorne</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">A young woman seen from an</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">upper window</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Tell an observer what kind</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">of life she desires</text>
</g>
</svg>
