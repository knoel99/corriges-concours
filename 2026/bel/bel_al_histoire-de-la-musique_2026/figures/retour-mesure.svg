<svg xmlns="http://www.w3.org/2000/svg" width="715" height="253" viewBox="0 0 715 253" role="img" aria-labelledby="t d"><title id="t">Le cadre métrique de l’Essai</title><desc id="d">Les chiffres deux, trois et deux renvoient aux signes de mesure. Les largeurs des plages ne mesurent pas les durées.</desc><rect x="0" y="0" width="715" height="253" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.8"/><text x="28" y="34" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#152e3b" font-weight="700">Un encadrement à deux temps</text>
<rect x="28" y="55" width="180" height="117" rx="5" fill="#e5f1f0" stroke="#176478" stroke-width="1.8"/>
<text x="40" y="79" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176478" font-weight="700">p. 6</text>
<text x="40" y="125" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#176478" font-weight="700">2</text>
<text x="79" y="115" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="700">Grave pointé</text>
<text x="40" y="154" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="400">Élégance et élan</text>
<rect x="226" y="55" width="235" height="117" rx="5" fill="#fcf0e7" stroke="#a9432b" stroke-width="1.8"/>
<text x="238" y="79" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#a9432b" font-weight="700">p. 7 et début p. 8</text>
<text x="238" y="125" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#a9432b" font-weight="700">3</text>
<text x="277" y="115" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="700">Mouvement léger</text>
<text x="238" y="154" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="400">Motif en imitation</text>
<rect x="479" y="55" width="209" height="117" rx="5" fill="#e5f1f0" stroke="#176478" stroke-width="1.8"/>
