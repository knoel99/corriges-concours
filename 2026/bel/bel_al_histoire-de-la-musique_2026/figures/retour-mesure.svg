<text x="530" y="115" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="700">Retour modéré</text>
<text x="491" y="154" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#152e3b" font-weight="400">Phrase de clôture</text>
