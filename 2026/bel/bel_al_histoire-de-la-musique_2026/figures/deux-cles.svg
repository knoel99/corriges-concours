<svg xmlns="http://www.w3.org/2000/svg" width="710" height="265" viewBox="0 0 710 265" role="img" aria-labelledby="t d"><title id="t">Lire le premier son sur les deux portées</title><desc id="d">La ligne bleue porte le sol de référence et le point rouge le premier ré joué. Il est écrit une ligne plus haut dans la lecture italienne.</desc><rect x="0" y="0" width="710" height="265" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.8"/><text x="35" y="36" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152e3b" font-weight="700">Dessus de Lully</text>
<text x="35" y="62" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#52626a" font-weight="400">Clé française</text>
<line x1="35" y1="164" x2="270" y2="164" stroke="#176478" stroke-width="2"/>
<line x1="35" y1="148" x2="270" y2="148" stroke="#94a3a6" stroke-width="1"/>
<line x1="35" y1="132" x2="270" y2="132" stroke="#94a3a6" stroke-width="1"/>
<line x1="35" y1="116" x2="270" y2="116" stroke="#94a3a6" stroke-width="1"/>
<line x1="35" y1="100" x2="270" y2="100" stroke="#94a3a6" stroke-width="1"/>
<text x="279" y="169" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176478" font-weight="700">sol</text>
<ellipse cx="147" cy="132" rx="9" ry="6" fill="#a9432b" transform="rotate(-18 147 132)"/>
<text x="35" y="202" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#a9432b" font-weight="700">Ré sur la 3e ligne</text>
<text x="375" y="36" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152e3b" font-weight="700">Dessus de Corelli</text>
<text x="375" y="62" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#52626a" font-weight="400">Clé italienne</text>
<line x1="375" y1="164" x2="610" y2="164" stroke="#94a3a6" stroke-width="1"/>
<line x1="375" y1="148" x2="610" y2="148" stroke="#176478" stroke-width="2"/>
<line x1="375" y1="132" x2="610" y2="132" stroke="#94a3a6" stroke-width="1"/>
<line x1="375" y1="116" x2="610" y2="116" stroke="#94a3a6" stroke-width="1"/>
<line x1="375" y1="100" x2="610" y2="100" stroke="#94a3a6" stroke-width="1"/>
<text x="619" y="153" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#176478" font-weight="700">sol</text>
<ellipse cx="487" cy="116" rx="9" ry="6" fill="#a9432b" transform="rotate(-18 487 116)"/>
<text x="375" y="202" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#a9432b" font-weight="700">Ré sur la 4e ligne</text>
<line x1="35" y1="219" x2="670" y2="219" stroke="#adbbbd" stroke-width="1"/>
<text x="35" y="245" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#152e3b" font-weight="400">Les lignes sont comptées depuis le bas. La note sonne à l’unisson.</text></svg>
