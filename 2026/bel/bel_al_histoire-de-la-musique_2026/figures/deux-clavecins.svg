<svg xmlns="http://www.w3.org/2000/svg" width="708" height="246" viewBox="0 0 708 246" role="img" aria-labelledby="t d"><title id="t">Le trio aux deux clavecins</title><desc id="d">Chaque main droite tient un dessus distinct. La partie de basse est confiée aux deux mains gauches.</desc><rect x="0" y="0" width="708" height="246" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.8"/><text x="30" y="35" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#152e3b" font-weight="700">Trois parties écrites, deux interprètes</text>
<rect x="32" y="55" width="294" height="106" rx="6" fill="none" stroke="#176478" stroke-width="1.8"/>
<text x="47" y="84" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#176478" font-weight="700">Clavecin I</text>
<text x="47" y="116" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#52626a" font-weight="400">Main droite</text>
<text x="148" y="116" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#152e3b" font-weight="700">premier dessus</text>
<text x="47" y="145" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#52626a" font-weight="400">Main gauche</text>
<text x="148" y="145" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#152e3b" font-weight="700">basse</text>
<rect x="382" y="55" width="294" height="106" rx="6" fill="none" stroke="#a9432b" stroke-width="1.8"/>
<text x="397" y="84" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#a9432b" font-weight="700">Clavecin II</text>
<text x="397" y="116" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#52626a" font-weight="400">Main droite</text>
<text x="498" y="116" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#152e3b" font-weight="700">second dessus</text>
<text x="397" y="145" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#52626a" font-weight="400">Main gauche</text>
<text x="498" y="145" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#152e3b" font-weight="700">basse</text>
<polyline points="180,161 180,184 350,184 350,198" fill="none" stroke="#176478" stroke-width="2"/>
<polyline points="529,161 529,184 350,184" fill="none" stroke="#a9432b" stroke-width="2"/>
<text x="350" y="224" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#152e3b" font-weight="700">Les deux mains gauches jouent la même ligne à l’unisson.</text></svg>
