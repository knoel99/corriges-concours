<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="t d"><title id="t">Voitures et bœuf : comparer des coûts d’opportunité</title><desc id="d">Exemple fictif : coûts de cinq et neuf unités de bœuf, échange à sept.</desc><rect width="100%" height="100%" fill="#fbfaf3"/><g font-family="DejaVu Sans,sans-serif" fill="#193b48"><text x="25" y="37" font-size="22">Voitures et bœuf : comparer des coûts d’opportunité</text><text x="25" y="67" font-size="16">Quantité de bœuf à laquelle il faut renoncer pour produire une voiture.</text><text x="25" y="111" font-size="16">Union européenne</text><rect x="228" y="93" width="230" height="22" fill="#386f76"/><text x="468" y="111" font-size="16">5</text><text x="25" y="160" font-size="16">Prix d’échange illustratif</text><rect x="228" y="142" width="322" height="22" fill="#a74e29"/><text x="560" y="160" font-size="16">7</text><text x="25" y="209" font-size="16">Mercosur</text><rect x="228" y="191" width="414" height="22" fill="#386f76"/><text x="652" y="209" font-size="16">9</text><text x="25" y="266" font-size="16">Entre 5 et 9, chaque partenaire obtient davantage en échangeant.</text></g></svg>
