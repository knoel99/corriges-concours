<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="t d"><title id="t">Moyenne, médiane et déciles de patrimoine</title><desc id="d">La moyenne est supérieure à la médiane ; le neuvième décile se situe à 857 700 euros.</desc><rect width="100%" height="100%" fill="#fbfaf3"/><g font-family="DejaVu Sans,sans-serif" fill="#193b48"><text x="25" y="37" font-size="22">Moyenne, médiane et déciles de patrimoine</text><text x="25" y="69" font-size="16">Patrimoine brut du ménage, France hors Mayotte, début 2024. Échelle linéaire.</text><line x1="72" y1="173" x2="706" y2="173" stroke="#607882" stroke-width="2" /><line x1="76.34" y1="173" x2="76.34" y2="198" stroke="#8caaa9" stroke-width="2" /><circle cx="76.34" cy="173" r="6" fill="#236c71"/><text x="53.34" y="216" font-size="15">1er décile : 6 200 €</text><line x1="215.57" y1="173" x2="215.57" y2="135" stroke="#8caaa9" stroke-width="2" /><circle cx="215.57" cy="173" r="6" fill="#236c71"/><text x="163.57" y="130" font-size="15">Médiane : 205 100 €</text><line x1="334.43" y1="173" x2="334.43" y2="214" stroke="#8caaa9" stroke-width="2" /><circle cx="334.43" cy="173" r="6" fill="#236c71"/><text x="284.43" y="232" font-size="15">Moyenne : 374 900 €</text><line x1="672.39" y1="173" x2="672.39" y2="124" stroke="#8caaa9" stroke-width="2" /><circle cx="672.39" cy="173" r="6" fill="#236c71"/><text x="583.39" y="119" font-size="15">9e décile : 857 700 €</text><text x="25" y="276" font-size="16">Source : Insee, enquête Histoire de vie et Patrimoine 2023–2024.</text></g></svg>
