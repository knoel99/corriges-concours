<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" role="img" aria-labelledby="t d"><title id="t">Un équilibre de marché sous le prix zéro</title><desc id="d">L’offre croissante et la demande décroissante se rencontrent dans la zone de prix négatif.</desc><rect width="100%" height="100%" fill="#fbfaf3"/><g font-family="DejaVu Sans,sans-serif" fill="#193b48"><text x="25" y="37" font-size="22">Un équilibre de marché sous le prix zéro</text><text x="26" y="68" font-size="16">Schéma de court terme pour un lieu et une heure donnés.</text><line x1="100" y1="78" x2="100" y2="260" stroke="#607882" stroke-width="2" /><line x1="90" y1="160" x2="628" y2="160" stroke="#607882" stroke-width="2" /><text x="109" y="94" font-size="16">Prix</text><text x="61" y="165" font-size="16">0</text><text x="501" y="182" font-size="16">Quantité</text><line x1="174" y1="244" x2="535" y2="100" stroke="#27717a" stroke-width="4" /><line x1="140" y1="96" x2="443" y2="245" stroke="#aa5734" stroke-width="4" /><text x="540" y="104" font-size="16">Offre</text><text x="453" y="248" font-size="16">Demande</text><line x1="100" y1="185.20" x2="321.40" y2="185.20" stroke="#7e898a" stroke-width="1" stroke-dasharray="5 4"/><circle cx="321.40" cy="185.20" r="5" fill="#24384d"/><text x="110" y="224" font-size="15">Prix négatif</text><text x="25" y="298" font-size="16">Une offre peu flexible et une demande faible peuvent se croiser sous zéro.</text></g></svg>
