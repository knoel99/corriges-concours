<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment gagner sa place à table ?</title>
<desc id="description">Se servir Chacun prélève une part mesurée. Il apprend à demander du beurre. Remuer la salade Un seul des huit s’en charge devant tous. Cette invitation devient un honneur. Trouver un convive à sa place On cède la place sans discussion. Le lecteur est invité à faire le geste à son tour.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment gagner sa place à table ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Règle tacite</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Place du narrateur</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Se servir</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Chacun prélève une part</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">mesurée.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Il apprend à demander du</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">beurre.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Remuer la salade</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Un seul des huit s’en</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">charge devant tous.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Cette invitation devient un</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">honneur.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Trouver un convive à</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">sa place</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">On cède la place sans</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">discussion.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le lecteur est invité à</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">faire le geste à son tour.</text>
</g>
</svg>
