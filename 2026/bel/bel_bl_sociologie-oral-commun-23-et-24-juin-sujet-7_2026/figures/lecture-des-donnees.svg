<svg xmlns="http://www.w3.org/2000/svg" width="910" height="347" viewBox="0 0 910 347" role="img" aria-labelledby="titre desc"><title id="titre">Contraintes et ressources déclarées sur les plateformes</title><desc id="desc">Document 5 · France hors Mayotte, 2023 · En % des travailleurs de plateforme ; Au moins une contrainte 34 % ; Au moins une ressource 26 % ; Au moins l’une des deux 44 % ; Les deux à la fois (calcul) 16 %. La dernière barre est calculée par inclusion-exclusion, à l’arrondi des données près.</desc><rect width="910" height="347" fill="#fbfaf6"/><g font-family="DejaVu Sans,sans-serif" fill="#193a40"><text x="18" y="29" font-size="20" font-weight="bold">Contraintes et ressources déclarées sur les plateformes</text><text x="18" y="55" font-size="15">Document 5 · France hors Mayotte, 2023 · En % des travailleurs de plateforme</text><text x="18" y="94" font-size="14">Au moins une contrainte</text><rect x="367" y="75" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="75" width="163.2" height="24" fill="#367a77"/><text x="854" y="94" font-size="15">34 %</text><text x="18" y="142" font-size="14">Au moins une ressource</text><rect x="367" y="123" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="123" width="124.8" height="24" fill="#367a77"/><text x="854" y="142" font-size="15">26 %</text><text x="18" y="190" font-size="14">Au moins l’une des deux</text><rect x="367" y="171" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="171" width="211.2" height="24" fill="#367a77"/><text x="854" y="190" font-size="15">44 %</text><text x="18" y="238" font-size="14">Les deux à la fois (calcul)</text><rect x="367" y="219" width="480" height="24" fill="#e7e9e2"/><rect x="367" y="219" width="76.8" height="24" fill="#367a77"/><text x="854" y="238" font-size="15">16 %</text><text x="367" y="267" text-anchor="middle" font-size="13">0</text><text x="487" y="267" text-anchor="middle" font-size="13">25</text><text x="607" y="267" text-anchor="middle" font-size="13">50</text><text x="727" y="267" text-anchor="middle" font-size="13">75</text><text x="847" y="267" text-anchor="middle" font-size="13">100</text><text x="18" y="310" font-size="14">La dernière barre est calculée par inclusion-exclusion, à l’arrondi des données près.</text></g></svg>
