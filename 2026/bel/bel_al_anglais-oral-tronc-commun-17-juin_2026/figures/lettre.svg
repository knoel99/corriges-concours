<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">When is what the letter says true?</title>
<desc id="description">The letter is written. An unfamiliar hand signs for Pete. The writer expects improvement. The family reads. The daughter repeats the hopeful words. She treats them as news about the present. The narrator intervenes. We learn when Pete died. The mother is now the one who needs to recover.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">When is what the letter says true?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Who reads or knows?</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Meaning of the prognosis</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">The letter is</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">written.</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">An unfamiliar hand signs</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">for Pete.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">The writer expects</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">improvement.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">The family reads.</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">The daughter repeats the</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">hopeful words.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">She treats them as news</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">about the present.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">The narrator</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">intervenes.</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">We learn when Pete died.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">The mother is now the one</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">who needs to recover.</text>
</g>
</svg>
