<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Where does the map fail?</title>
<desc id="description">At friends’ pools His name will open doors and secure a drink. The expedition begins with invitations. At the empty pool A continuous chain of water A material gap he cannot swim across At his own house A family following its usual Sunday routine A locked house that looks empty inside</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Where does the map fail?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Place</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Neddy expects</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What he finds</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">At friends’ pools</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">His name will open doors</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">and secure a drink.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">The expedition begins with</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">invitations.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">At the empty pool</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">A continuous chain of</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">water</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">A material gap he cannot</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">swim across</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">At his own house</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">A family following its</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">usual Sunday routine</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">A locked house that looks</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">empty inside</text>
</g>
</svg>
