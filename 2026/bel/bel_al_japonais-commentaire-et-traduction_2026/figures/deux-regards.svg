<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Quand la silhouette devient-elle visible ?</title>
<desc id="description">Première phrase Le lecteur connaît Yōko et sa position. L’homme n’a pas encore été introduit. Dans le lit du torrent Yōko regarde un petit cairn. Quand sa silhouette a-t-elle frappé l’œil du marcheur ? Dernières questions Les rochers semblent renfermer des silhouettes. Fatigue de la perception et vie du corps restent deux hypothèses.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quand la silhouette devient-elle visible ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de vue</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui est donné</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui reste ouvert</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Première phrase</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le lecteur connaît Yōko et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">sa position.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’homme n’a pas encore été</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">introduit.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Dans le lit du</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">torrent</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Yōko regarde un petit</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">cairn.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Quand sa silhouette a-t-</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">elle frappé l’œil du</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">marcheur ?</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Dernières questions</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Les rochers semblent</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">renfermer des silhouettes.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Fatigue de la perception et</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">vie du corps restent deux</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">hypothèses.</text>
</g>
</svg>
