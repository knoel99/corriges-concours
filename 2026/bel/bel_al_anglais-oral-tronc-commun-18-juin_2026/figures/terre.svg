<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Who speaks for the land?</title>
<desc id="description">The body Eyes, ears and mouth register events. The land is already a witness. The circle Humans, birds, wind and grass are named in pairs. The community gives up a hierarchy of beings. The smallest voice Someone leans in to listen. Those asking for a blessing recognise themselves as land.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who speaks for the land?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Action</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Change in perspective</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">The body</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Eyes, ears and mouth</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">register events.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">The land is already a</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">witness.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">The circle</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Humans, birds, wind and</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">grass are named in pairs.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">The community gives up a</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">hierarchy of beings.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">The smallest voice</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Someone leans in to</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">listen.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Those asking for a blessing</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">recognise themselves as</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">land.</text>
</g>
</svg>
