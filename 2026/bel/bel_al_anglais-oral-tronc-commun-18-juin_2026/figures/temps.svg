<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">What can fifteen dollars buy?</title>
<desc id="description">The household She plans better shoes and new stockings. The budget will save labour spent on repairs. The restaurant She reads, tastes, sips and moves her toes. Her own dinner can take as long as she pleases. The cable car She imagines the journey continuing. The remaining stretch of freedom has a limit.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What can fifteen dollars buy?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Scene</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Action</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Time made available</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">The household</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">She plans better shoes and</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">new stockings.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">The budget will save labour</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">spent on repairs.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">The restaurant</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">She reads, tastes, sips</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">and moves her toes.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Her own dinner can take as</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">long as she pleases.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">The cable car</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">She imagines the journey</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">continuing.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">The remaining stretch of</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">freedom has a limit.</text>
</g>
</svg>
