<svg xmlns="http://www.w3.org/2000/svg" width="780" height="439" viewBox="0 0 780 439" role="img" aria-labelledby="titre description">
<title id="titre">Du signe céleste aux deux exemples historiques</title>
<desc id="description">Ciel → champs et villes : Les feux célestes annoncent la stérilité puis la maladie.. v. 1–8. Athènes : La peste prive les morts des rites et les survivants de descendance.. v. 9–16. Comètes → bûchers et guerre : Le poète revient aux présages et leur donne une portée militaire.. v. 17–22. Germanie : Les lueurs de tout le ciel accompagnent la disparition de Varus.. v. 23–28.</desc>
<rect width="100%" height="100%" fill="#fcfbf6"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="28" y="32" font-size="19" font-weight="bold" fill="#183c50">Du signe céleste aux deux exemples historiques</text>
<rect x="26" y="50" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="50" width="8" height="76" fill="#183c50"/>
<text x="48" y="79" font-size="19" font-weight="bold" fill="#183c50">Ciel → champs et villes</text>
<text x="48" y="107" font-size="17" fill="#283740">Les feux célestes annoncent la stérilité puis la maladie.</text>
<text x="724" y="79" text-anchor="end" fill="#475b65" font-size="15">v. 1–8</text>
<path d="M390 126v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="146" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="146" width="8" height="76" fill="#205455"/>
<text x="48" y="175" font-size="19" font-weight="bold" fill="#205455">Athènes</text>
<text x="48" y="203" font-size="17" fill="#283740">La peste prive les morts des rites et les survivants de descendance.</text>
<text x="724" y="175" text-anchor="end" fill="#475b65" font-size="15">v. 9–16</text>
<path d="M390 222v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="242" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="242" width="8" height="76" fill="#775133"/>
<text x="48" y="271" font-size="19" font-weight="bold" fill="#775133">Comètes → bûchers et guerre</text>
<text x="48" y="299" font-size="17" fill="#283740">Le poète revient aux présages et leur donne une portée militaire.</text>
<text x="724" y="271" text-anchor="end" fill="#475b65" font-size="15">v. 17–22</text>
<path d="M390 318v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="338" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="338" width="8" height="76" fill="#523f65"/>
<text x="48" y="367" font-size="19" font-weight="bold" fill="#523f65">Germanie</text>
<text x="48" y="395" font-size="17" fill="#283740">Les lueurs de tout le ciel accompagnent la disparition de Varus.</text>
<text x="724" y="367" text-anchor="end" fill="#475b65" font-size="15">v. 23–28</text>
</g>
</svg>
