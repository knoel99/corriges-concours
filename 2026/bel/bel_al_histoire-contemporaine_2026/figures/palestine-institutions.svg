<svg xmlns="http://www.w3.org/2000/svg" width="900" height="428" viewBox="0 0 900 428" role="img" aria-labelledby="titre description">
  <title id="titre">Institutions et déplacements en Palestine autour de 1948</title>
  <desc id="description">Deux expériences de la guerre et de la fin du mandat : l’État d’Israël peut s’appuyer sur les institutions du Yichouv. Les réfugiés palestiniens dépendent de droits et de services qui varient selon leur lieu d’accueil.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="428" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="40" font-size="29" fill="#182f43" font-weight="bold" text-anchor="start">Palestine : que change la rupture de 1948 ?</text>
  <rect x="24" y="63" width="852" height="102" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="44" y="100" font-size="23" fill="#182f43" font-weight="bold" text-anchor="start">Sous mandat britannique</text>
  <text x="44" y="133" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Des projets nationaux concurrents se développent sur le même territoire.</text>
  <path d="M 450 167 V 187 H 232 V 207" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 450 187 H 669 V 207" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="24" y="216" width="416" height="189" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="42" y="252" font-size="21" fill="#075d63" font-weight="bold" text-anchor="start">Le Yichouv et l’État d’Israël</text>
  <text x="42" y="290" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Les services et la représentation</text><text x="42" y="317" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">du Yichouv fournissent des moyens</text><text x="42" y="344" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">de gouvernement à l’État proclamé</text><text x="42" y="371" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">le 14 mai 1948.</text>
  <rect x="458" y="216" width="418" height="189" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="476" y="252" font-size="21" fill="#6b4261" font-weight="bold" text-anchor="start">Les Palestiniens et la Nakba</text>
  <text x="476" y="290" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">La guerre entraîne expulsions et exil.</text><text x="476" y="317" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Dès 1950, l’UNRWA assure</text><text x="476" y="344" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">des services de secours, de santé</text><text x="476" y="371" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">et d’enseignement aux réfugiés.</text>
  </g>
</svg>
