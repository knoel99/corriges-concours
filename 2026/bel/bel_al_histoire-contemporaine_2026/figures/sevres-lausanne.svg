<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="titre description">
  <title id="titre">San Remo, Sèvres, Lausanne</title>
  <desc id="description">Deux chronologies se rejoignent lors de la négociation de Lausanne. Les alliés attribuent les mandats en 1920 pendant que le pouvoir national s’institue à Ankara. Le traité de Sèvres n’entre pas en vigueur.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="550" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="40" font-size="29" fill="#182f43" font-weight="bold" text-anchor="start">1920–1923 : qui décide du règlement de paix ?</text>
  <text x="28" y="81" font-size="22" fill="#6b4261" font-weight="bold" text-anchor="start">Négociations internationales</text>
  <text x="469" y="81" font-size="22" fill="#075d63" font-weight="bold" text-anchor="start">Construction du pouvoir à Ankara</text>
  <rect x="24" y="98" width="416" height="130" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="42" y="133" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Avril 1920 · San Remo</text>
  <text x="42" y="165" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Les Alliés attribuent les mandats</text><text x="42" y="192" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">sur les anciennes provinces arabes.</text>
  <rect x="458" y="98" width="418" height="130" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="478" y="133" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Avril 1920 · Ankara</text>
  <text x="478" y="165" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Des députés constituent une</text><text x="478" y="192" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Grande Assemblée nationale.</text>
  <path d="M 232 229 V 252" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="24" y="260" width="416" height="122" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="42" y="299" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Août 1920 · Sèvres</text>
  <text x="42" y="331" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le gouvernement ottoman signe.</text><text x="42" y="358" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le traité reste inappliqué.</text>
  <rect x="458" y="260" width="418" height="122" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="478" y="299" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">1920–1922 · Anatolie</text>
  <text x="478" y="331" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Le mouvement national impose</text><text x="478" y="358" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">sa place dans les négociations.</text>
  <path d="M 664 229 V 252" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 232 384 V 406 H 417 L 447 425" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <path d="M 664 384 V 406 H 482 L 453 425" fill="none" stroke="#182f43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/>
  <rect x="88" y="432" width="724" height="98" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="450" y="468" font-size="23" fill="#182f43" font-weight="bold" text-anchor="middle">Juillet 1923 · Lausanne</text>
  <text x="450" y="503" font-size="21" fill="#182f43" font-weight="normal" text-anchor="middle">La délégation d’Ankara négocie un nouveau traité.</text>
  </g>
</svg>
