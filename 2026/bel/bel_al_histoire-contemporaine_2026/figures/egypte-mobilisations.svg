<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-labelledby="titre description">
  <title id="titre">Trois mobilisations en Égypte</title>
  <desc id="description">Une organisation féministe, la protestation sur les prix et une grève dans le textile illustrent des demandes politiques, budgétaires et salariales adressées à des gouvernements différents.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#182f43" stroke-width="1.2"/></marker></defs>
  <rect width="900" height="455" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif">
  <text x="24" y="40" font-size="29" fill="#182f43" font-weight="bold" text-anchor="start">Égypte : trois façons d’interpeller l’État</text>
  <path d="M 113 112 V 384" fill="none" stroke="#075d63" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="113" cy="112" r="7" fill="#075d63"/>
  <text x="91" y="120" font-size="23" fill="#182f43" font-weight="bold" text-anchor="end">1923</text>
  <rect x="140" y="67" width="736" height="110" rx="12" fill="#e9f5ef" stroke="none" stroke-width="2"/>
  <text x="159" y="100" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Union féministe égyptienne</text>
  <text x="159" y="133" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Des militantes revendiquent l’accès à l’éducation</text><text x="159" y="160" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">et des droits politiques dans la nouvelle monarchie.</text>
  <circle cx="113" cy="239" r="7" fill="#075d63"/>
  <text x="91" y="247" font-size="23" fill="#182f43" font-weight="bold" text-anchor="end">1977</text>
  <rect x="140" y="194" width="736" height="110" rx="12" fill="#f6edf3" stroke="none" stroke-width="2"/>
  <text x="159" y="227" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Manifestations contre la hausse des prix</text>
  <text x="159" y="260" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">L’annonce de coupes dans les subventions suscite</text><text x="159" y="287" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">des protestations. Le gouvernement retire les mesures.</text>
  <circle cx="113" cy="366" r="7" fill="#075d63"/>
  <text x="91" y="374" font-size="23" fill="#182f43" font-weight="bold" text-anchor="end">2006</text>
  <rect x="140" y="321" width="736" height="110" rx="12" fill="#e9f1f7" stroke="none" stroke-width="2"/>
  <text x="159" y="354" font-size="22" fill="#182f43" font-weight="bold" text-anchor="start">Grève du textile à Mahalla al-Kubra</text>
  <text x="159" y="387" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">Les salariés d’une entreprise publique réclament</text><text x="159" y="414" font-size="20" fill="#182f43" font-weight="normal" text-anchor="start">le versement d’une prime à leur employeur.</text>
  </g>
</svg>
