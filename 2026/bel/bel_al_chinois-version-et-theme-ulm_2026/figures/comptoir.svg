<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Trois points de vue devant le comptoir</title>
<desc id="description">Hai Xibin Il renvoie de bonne foi aux étiquettes. Il demande ce que veut dire « un peu ». Le directeur Il croit mourir après la première réponse. Il vient de se croire sauvé et redoute une autre gaffe. Jiang Qing Elle donne une leçon au nom des clients. Elle tapote l’épaule du garçon et invoque le service du peuple.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois points de vue devant le comptoir</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Personnage</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">La demande de prix</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">La demande de quantité</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Hai Xibin</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Il renvoie de bonne foi</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">aux étiquettes.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Il demande ce que veut dire</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">« un peu ».</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le directeur</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Il croit mourir après la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">première réponse.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Il vient de se croire sauvé</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">et redoute une autre gaffe.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Jiang Qing</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Elle donne une leçon au</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">nom des clients.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Elle tapote l’épaule du</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">garçon et invoque le</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">service du peuple.</text>
</g>
</svg>
