<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" width="860" height="188" role="img"><title>Что именно измеряет показатель?</title><desc>Три показателя отвечают на разные вопросы. Число рождений за год не равно итоговому числу детей у поколения.</desc><rect width="100%" height="100%" fill="#fff"/><text x="20" y="28" fill="#133456" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">Что именно измеряет показатель?</text><rect x="20" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="32" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Число рождений</text><text x="32" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Зависит и от возрастного</text><text x="32" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">состава, и от частоты</text><text x="32" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">рождений.</text><rect x="298" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="310" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Коэффициент</text><text x="310" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Обобщает возрастные</text><text x="310" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">показатели одного периода.</text><rect x="576" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="588" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Итог поколения</text><text x="588" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Требует проследить реальное</text><text x="588" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">поколение во времени.</text></svg>
