<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" width="860" height="188" role="img"><title>От общей цели к решению конкретной семьи</title><desc>Государственная цель, реальные возможности семьи и индивидуальное решение.</desc><rect width="100%" height="100%" fill="#fff"/><text x="20" y="28" fill="#133456" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">От общей цели к решению конкретной семьи</text><rect x="20" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="32" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Цель</text><text x="32" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Государство считает</text><text x="32" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">многодетность желательной.</text><rect x="298" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="310" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Возможности</text><text x="310" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Поддержка семьи может</text><text x="310" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">снизить материальные</text><text x="310" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">барьеры.</text><rect x="576" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="588" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Граница</text><text x="588" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Решение остаётся личным.</text><text x="588" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Его нельзя вывести из</text><text x="588" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">статистики.</text></svg>
