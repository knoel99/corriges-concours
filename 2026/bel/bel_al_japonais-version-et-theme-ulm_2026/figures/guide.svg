<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Que peut fournir le Baedeker ?</title>
<desc id="description">Histoire de la salle Donner une information inaccessible à l’œil. Il en reconnaît l’intérêt. Vue de la fenêtre Indiquer ce qu’il convient d’admirer. Il voudrait juger par lui-même. Adresses en ville Signaler un lieu susceptible de changer. Même la dernière édition peut se tromper.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que peut fournir le Baedeker ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Objet</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Rôle du guide</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Réaction du voyageur</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Histoire de la salle</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Donner une information</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">inaccessible à l’œil.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Il en reconnaît l’intérêt.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Vue de la fenêtre</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Indiquer ce qu’il convient</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">d’admirer.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Il voudrait juger par lui-</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">même.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Adresses en ville</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Signaler un lieu</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">susceptible de changer.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Même la dernière édition</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">peut se tromper.</text>
</g>
</svg>
