<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre desc">
<title id="titre">Trois épreuves du regard de Simonini</title><desc id="desc">La chemise passée imite l’ancienneté, l’acclamation du public masque des versions contradictoires et le regard de Bixio fascine aussi le sceptique.</desc>
<rect width="720" height="341" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="20" y="31" fill="#253e49" font-size="20" font-weight="bold">Trois épreuves du regard de Simonini</text>
<rect x="19" y="52" width="681" height="55" rx="5" fill="#ecf4f1" stroke="#71838a"/>
<text x="32" y="84" fill="#253e49" font-size="16" font-weight="bold">L’habit</text>
<text x="224" y="75" fill="#253e49" font-size="15">La chemise usée devrait signaler un vétéran.</text>
<text x="224" y="95" fill="#253e49" font-size="15">Simonini vient de l’acheter.</text>
<rect x="19" y="119" width="681" height="55" rx="5" fill="#f3f3f8" stroke="#71838a"/>
<text x="32" y="151" fill="#253e49" font-size="16" font-weight="bold">L’acclamation</text>
<text x="224" y="142" fill="#253e49" font-size="15">La foule semble parler d’une seule voix.</text>
<text x="224" y="162" fill="#253e49" font-size="15">Un homme ignore même qui il acclame.</text>
<rect x="19" y="186" width="681" height="55" rx="5" fill="#fbf3e4" stroke="#71838a"/>
<text x="32" y="218" fill="#253e49" font-size="16" font-weight="bold">Le regard de Bixio</text>
<text x="224" y="209" fill="#253e49" font-size="15">Le volontaire admire l’éclat des yeux du chef.</text>
<text x="224" y="229" fill="#253e49" font-size="15">Simonini a lui-même été saisi par ce regard.</text>
<text x="20" y="267" fill="#253e49" font-size="15">À chaque fois, un détail particulier oblige à reconsidérer le tableau collectif.</text>
</g></svg>
