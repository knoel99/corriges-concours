<svg xmlns="http://www.w3.org/2000/svg" width="720" height="147" viewBox="0 0 720 147" role="img" aria-labelledby="t"><title id="t">Trois preuves au sujet des femmes et de la parole</title><rect width="720" height="147" fill="#eff5f4"/><g font-family="DejaVu Sans" fill="#223f4b"><text x="14" y="29" font-size="19" font-weight="700">Trois preuves au sujet des femmes et de la parole</text><rect x="12" y="47" width="224" height="88" rx="6" fill="white" stroke="#56747d"/><text x="124" y="71" font-size="15" font-weight="700" text-anchor="middle">Cornélie</text><text x="124" y="98" font-size="12.7" font-weight="400" text-anchor="middle">Ses lettres conservent</text><text x="124" y="120" font-size="12.7" font-weight="400" text-anchor="middle">l’écho de sa conversation.</text><rect x="248" y="47" width="224" height="88" rx="6" fill="white" stroke="#56747d"/><text x="360" y="71" font-size="15" font-weight="700" text-anchor="middle">Laelia</text><text x="360" y="98" font-size="12.7" font-weight="400" text-anchor="middle">Sa parole reproduit</text><text x="360" y="120" font-size="12.7" font-weight="400" text-anchor="middle">la distinction de son père.</text><rect x="484" y="47" width="224" height="88" rx="6" fill="white" stroke="#56747d"/><text x="596" y="71" font-size="15" font-weight="700" text-anchor="middle">Hortensia</text><text x="596" y="98" font-size="12.7" font-weight="400" text-anchor="middle">Son discours public</text><text x="596" y="120" font-size="12.7" font-weight="400" text-anchor="middle">reste lu pour sa qualité.</text></g></svg>
