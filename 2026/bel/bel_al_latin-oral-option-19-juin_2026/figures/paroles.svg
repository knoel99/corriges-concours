<svg xmlns="http://www.w3.org/2000/svg" width="720" height="147" viewBox="0 0 720 147" role="img" aria-labelledby="t"><title id="t">Deux poètes mettent en scène une voix</title><rect width="720" height="147" fill="#eff5f4"/><g font-family="DejaVu Sans" fill="#223f4b"><text x="14" y="29" font-size="19" font-weight="700">Deux poètes mettent en scène une voix</text><rect x="12" y="47" width="224" height="88" rx="6" fill="white" stroke="#56747d"/><text x="124" y="71" font-size="15" font-weight="700" text-anchor="middle">Ovide XIII</text><text x="124" y="98" font-size="12.7" font-weight="400" text-anchor="middle">Les yeux baissés, puis levés,</text><text x="124" y="120" font-size="12.7" font-weight="400" text-anchor="middle">précèdent la parole d’Ulysse.</text><rect x="248" y="47" width="224" height="88" rx="6" fill="white" stroke="#56747d"/><text x="360" y="71" font-size="15" font-weight="700" text-anchor="middle">Silius I</text><text x="360" y="98" font-size="12.7" font-weight="400" text-anchor="middle">Hamilcar examine son fils</text><text x="360" y="120" font-size="12.7" font-weight="400" text-anchor="middle">puis lui souffle des mots.</text><rect x="484" y="47" width="224" height="88" rx="6" fill="white" stroke="#56747d"/><text x="596" y="71" font-size="15" font-weight="700" text-anchor="middle">Qui parle en son nom ?</text><text x="596" y="98" font-size="12.7" font-weight="400" text-anchor="middle">L’un prépare sa posture.</text><text x="596" y="120" font-size="12.7" font-weight="400" text-anchor="middle">L’autre prononce le serment.</text></g></svg>
