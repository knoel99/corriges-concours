<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">Parcours de la dissertation</title><desc id="desc">I · Observer : Une croyance peut s’éteindre avant que je le constate. II · Intervenir : Je peux instruire un doute en conservant des appuis pour l’enquête. III · Répondre de mes actes : Je dois décider comment écouter, vérifier et faire droit à autrui.</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">Parcours de la dissertation</text>
<rect x="17" y="57" width="271" height="205" rx="8" fill="#dceff2"/>
<text x="30" y="91" font-size="18" font-weight="bold" fill="#213b4a">I · Observer</text>
<text x="30" y="151" font-size="17" font-weight="normal" fill="#213b4a">Une croyance peut</text>
<text x="30" y="175" font-size="17" font-weight="normal" fill="#213b4a">s’éteindre avant que je</text>
<text x="30" y="199" font-size="17" font-weight="normal" fill="#213b4a">le constate.</text>
<path d="M292 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="318" y="57" width="271" height="205" rx="8" fill="#f7ebd5"/>
<text x="331" y="91" font-size="18" font-weight="bold" fill="#213b4a">II · Intervenir</text>
<text x="331" y="151" font-size="17" font-weight="normal" fill="#213b4a">Je peux instruire un</text>
<text x="331" y="175" font-size="17" font-weight="normal" fill="#213b4a">doute en conservant des</text>
<text x="331" y="199" font-size="17" font-weight="normal" fill="#213b4a">appuis pour l’enquête.</text>
<path d="M593 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="619" y="57" width="271" height="205" rx="8" fill="#e7ecf6"/>
<text x="632" y="91" font-size="18" font-weight="bold" fill="#213b4a">III · Répondre de</text>
<text x="632" y="112" font-size="18" font-weight="bold" fill="#213b4a">mes actes</text>
<text x="632" y="151" font-size="17" font-weight="normal" fill="#213b4a">Je dois décider comment</text>
<text x="632" y="175" font-size="17" font-weight="normal" fill="#213b4a">écouter, vérifier et</text>
<text x="632" y="199" font-size="17" font-weight="normal" fill="#213b4a">faire droit à autrui.</text>
</g></svg>
