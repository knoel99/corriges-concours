<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">Que devient mon assentiment ?</title><desc id="desc">Démenti : Je rencontre mon ami ici. Je le sais présent. Suspension : Un changement de projet est signalé. Je ne tranche plus. Érosion : Des engagements manqués finissent par modifier ma confiance.</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">Que devient mon assentiment ?</text>
<rect x="17" y="49" width="876" height="66" rx="7" fill="#dceff2"/>
<text x="33" y="75" font-size="19" font-weight="bold" fill="#213b4a">Démenti</text>
<text x="33" y="100" font-size="17" font-weight="normal" fill="#213b4a">Je rencontre mon ami ici. Je le sais présent.</text>
<path d="M48 115 v9 m-3 -4 3 4 3 -4" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="17" y="127" width="876" height="66" rx="7" fill="#f7ebd5"/>
<text x="33" y="153" font-size="19" font-weight="bold" fill="#213b4a">Suspension</text>
<text x="33" y="178" font-size="17" font-weight="normal" fill="#213b4a">Un changement de projet est signalé. Je ne tranche plus.</text>
<path d="M48 193 v9 m-3 -4 3 4 3 -4" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="17" y="205" width="876" height="66" rx="7" fill="#e7ecf6"/>
<text x="33" y="231" font-size="19" font-weight="bold" fill="#213b4a">Érosion</text>
<text x="33" y="256" font-size="17" font-weight="normal" fill="#213b4a">Des engagements manqués finissent par modifier ma confiance.</text>
</g></svg>
