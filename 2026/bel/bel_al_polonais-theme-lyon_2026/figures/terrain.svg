<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Pourquoi le narrateur reste-t-il sur place ?</title>
<desc id="description">Sur la route Le bus rejoint le marché en quelques minutes. À pied, il faut une heure. Le chercheur mesure une distance et note une habitude. Dans la salle du café Il ressent physiquement son isolement. Le sentiment d’abandon éprouve sa décision. Dans le journal Il consigne les découvertes et les questions, ajoute des croquis. L’isolement devient une condition du travail de terrain.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Pourquoi le narrateur reste-t-il sur place ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de départ</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice dans le texte</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conséquence</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Sur la route</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le bus rejoint le marché</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">en quelques minutes. À</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">pied, il faut une heure.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le chercheur mesure une</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">distance et note une</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">habitude.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Dans la salle du café</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Il ressent physiquement</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">son isolement.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Le sentiment d’abandon</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">éprouve sa décision.</text>
<rect x="10" y="248" width="700" height="105" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Dans le journal</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Il consigne les</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">découvertes et les</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">questions, ajoute des</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">croquis.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">L’isolement devient une</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">condition du travail de</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">terrain.</text>
</g>
</svg>
