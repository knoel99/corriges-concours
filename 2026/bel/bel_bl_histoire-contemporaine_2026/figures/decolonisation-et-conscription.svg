<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" width="860" height="188" role="img"><title>1945–1962 · Deux façons de rencontrer les guerres coloniales</title><desc>La composition des forces aide à comprendre la place différente des deux conflits dans les familles.</desc><rect width="100%" height="100%" fill="#fff"/><text x="20" y="28" fill="#133456" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">1945–1962 · Deux façons de rencontrer les guerres coloniales</text><rect x="20" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="32" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Indochine</text><text x="32" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Le corps expéditionnaire</text><text x="32" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">est constitué de</text><text x="32" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">professionnels, de</text><text x="32" y="155" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">volontaires et de forces</text><text x="32" y="174" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">locales.</text><rect x="298" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="310" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Algérie</text><text x="310" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">L’envoi massif d’appelés et</text><text x="310" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">de rappelés atteint des</text><text x="310" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">familles métropolitaines</text><text x="310" y="155" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">nombreuses.</text><rect x="576" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="588" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Après 1962</text><text x="588" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Exil, retour, indépendance</text><text x="588" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">ou abandon donnent à la fin</text><text x="588" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">de la guerre des sens</text><text x="588" y="155" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">différents.</text></svg>
