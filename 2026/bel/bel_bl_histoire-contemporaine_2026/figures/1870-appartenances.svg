<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 188" width="860" height="188" role="img"><title>1870–1871 · Une défaite, plusieurs ruptures</title><desc>Trois ruptures politique, sociale et territoriale nées de la guerre de 1870.</desc><rect width="100%" height="100%" fill="#fff"/><text x="20" y="28" fill="#133456" font-size="20" font-weight="bold" font-family="DejaVu Sans, sans-serif">1870–1871 · Une défaite, plusieurs ruptures</text><rect x="20" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="32" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Septembre 1870</text><text x="32" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Sedan précipite la fin de</text><text x="32" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">l’Empire. La République</text><text x="32" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">poursuit la guerre.</text><rect x="298" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="310" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Mars–mai 1871</text><text x="310" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">La Commune et sa répression</text><text x="310" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">divisent durablement la</text><text x="310" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">société parisienne.</text><rect x="576" y="47" width="264" height="128" rx="8" fill="#eff4f7"/><text x="588" y="73" fill="#884219" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Mai 1871</text><text x="588" y="98" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">Le traité de Francfort</text><text x="588" y="117" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">déplace la frontière et</text><text x="588" y="136" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">impose des choix de</text><text x="588" y="155" fill="#18354c" font-size="14" font-weight="normal" font-family="DejaVu Sans, sans-serif">nationalité.</text></svg>
