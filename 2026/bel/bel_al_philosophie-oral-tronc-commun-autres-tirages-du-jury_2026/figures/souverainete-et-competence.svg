<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="titre desc"><title id="titre">Le peuple, la Constitution et l’assemblée</title><desc id="desc">Du titulaire de la souveraineté à son exercice selon des règles. Le cas final demande comment contrôler une décision qui excéderait la compétence de son auteur.</desc><rect width="960" height="460" fill="#faf8f3"/><g font-family="DejaVu Sans, sans-serif" fill="#183b4f"><text x="30" y="49" font-size="30" font-weight="700" text-anchor="start">Le peuple, la Constitution et l’assemblée</text>
<text x="30" y="81" font-size="20" font-weight="400" text-anchor="start">Qui autorise qui à décider ?</text>
<rect x="30" y="111" width="265" height="190" rx="11" fill="#eee3d3" stroke="#58727a" stroke-width="1.4"/>
<rect x="346" y="111" width="265" height="190" rx="11" fill="#e1eee8" stroke="#58727a" stroke-width="1.4"/>
<rect x="662" y="111" width="268" height="190" rx="11" fill="#e5ebf3" stroke="#58727a" stroke-width="1.4"/>
<text x="52" y="155" font-size="25" font-weight="700" text-anchor="start">Titulaire</text>
<text x="52" y="204" font-size="18" font-weight="400" text-anchor="start">Le peuple est désigné</text>
<text x="52" y="235" font-size="18" font-weight="400" text-anchor="start">comme titulaire de la</text>
<text x="52" y="266" font-size="18" font-weight="400" text-anchor="start">souveraineté.</text>
<text x="368" y="155" font-size="25" font-weight="700" text-anchor="start">Règle</text>
<text x="368" y="204" font-size="18" font-weight="400" text-anchor="start">La Constitution répartit</text>
<text x="368" y="235" font-size="18" font-weight="400" text-anchor="start">les compétences entre</text>
<text x="368" y="266" font-size="18" font-weight="400" text-anchor="start">les organes publics.</text>
<text x="684" y="155" font-size="25" font-weight="700" text-anchor="start">Organe</text>
<text x="684" y="204" font-size="18" font-weight="400" text-anchor="start">L’assemblée adopte</text>
<text x="684" y="235" font-size="18" font-weight="400" text-anchor="start">une loi dans le champ</text>
<text x="684" y="266" font-size="18" font-weight="400" text-anchor="start">de ses compétences.</text>
<path d="M303 206 h31 m-8 -7 8 7 -8 7" fill="none" stroke="#356866" stroke-width="3.5"/>
<path d="M619 206 h31 m-8 -7 8 7 -8 7" fill="none" stroke="#356866" stroke-width="3.5"/>
<rect x="30" y="331" width="900" height="100" rx="11" fill="#f3f2e8" stroke="#58727a" stroke-width="1.4"/>
<text x="51" y="367" font-size="21" font-weight="700" text-anchor="start">Cas à examiner</text>
<text x="51" y="399" font-size="18" font-weight="400" text-anchor="start">Une majorité vote au-delà de sa compétence. Qui peut contrôler la validité de sa décision ?</text></g></svg>
