<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="titre desc"><title id="titre">Après un tort, qui peut juger ?</title><desc id="desc">Deux réponses à un tort sont comparées selon la place de la partie lésée, le rôle du tiers et la possibilité de contester la décision.</desc><rect width="960" height="460" fill="#faf8f3"/><g font-family="DejaVu Sans, sans-serif" fill="#183b4f"><text x="30" y="49" font-size="30" font-weight="700" text-anchor="start">Après un tort, qui peut juger ?</text>
<rect x="261" y="79" width="438" height="62" rx="11" fill="#f2e8d8" stroke="#58727a" stroke-width="1.4"/>
<text x="480" y="118" font-size="23" font-weight="700" text-anchor="middle">Une personne se dit lésée.</text>
<path d="M480 159 H252 V202" fill="none" stroke="#356866" stroke-width="3"/><path d="M246 200 L252 210 L258 200" fill="none" stroke="#356866" stroke-width="3"/>
<path d="M480 159 H708 V202" fill="none" stroke="#356866" stroke-width="3"/><path d="M702 200 L708 210 L714 200" fill="none" stroke="#356866" stroke-width="3"/>
<path d="M480 141 V159" stroke="#356866" stroke-width="3" fill="none"/>
<rect x="35" y="219" width="429" height="173" rx="11" fill="#e5ebf3" stroke="#58727a" stroke-width="1.4"/>
<rect x="496" y="219" width="429" height="173" rx="11" fill="#e1eee8" stroke="#58727a" stroke-width="1.4"/>
<text x="55" y="259" font-size="22" font-weight="700" text-anchor="start">Riposte de la partie lésée</text>
<text x="55" y="302" font-size="17" font-weight="400" text-anchor="start">La personne évalue elle-même le tort</text>
<text x="55" y="331" font-size="17" font-weight="400" text-anchor="start">et décide de la réponse.</text>
<text x="55" y="360" font-size="17" font-weight="400" text-anchor="start">L’autre partie peut contester sa mesure.</text>
<text x="516" y="259" font-size="22" font-weight="700" text-anchor="start">Procédure devant un tiers</text>
<text x="516" y="302" font-size="17" font-weight="400" text-anchor="start">Chaque partie peut présenter ses raisons.</text>
<text x="516" y="331" font-size="17" font-weight="400" text-anchor="start">Le tiers motive sa décision selon une règle.</text>
<text x="516" y="360" font-size="17" font-weight="400" text-anchor="start">Les voies de recours en permettent l’examen.</text>
<text x="35" y="435" font-size="18" font-weight="400" text-anchor="start">Comment justifier la réponse donnée au tort devant les deux parties ?</text></g></svg>
