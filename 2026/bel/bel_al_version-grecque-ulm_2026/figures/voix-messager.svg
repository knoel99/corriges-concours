<svg xmlns="http://www.w3.org/2000/svg" width="780" height="439" viewBox="0 0 780 439" role="img" aria-labelledby="titre description">
<title id="titre">Les voix dans le récit du messager</title>
<desc id="description">Le père → ses deux filles : Le présent de la séparation débouche sur un futur au duel.. v. 1–9. Le messager → son auditoire : Les trois personnages pleurent. Une voix rompt le silence.. v. 10–16. Le dieu → Œdipe : Le « nous » qui presse le départ devient un reproche adressé à « toi ».. v. 17–18. Œdipe → Thésée, puis aux filles : La main offerte au père appelle un geste des filles envers Thésée.. v. 19–23.</desc>
<rect width="100%" height="100%" fill="#fcfbf6"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="28" y="32" font-size="19" font-weight="bold" fill="#183c50">Les voix dans le récit du messager</text>
<rect x="26" y="50" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="50" width="8" height="76" fill="#183c50"/>
<text x="48" y="79" font-size="19" font-weight="bold" fill="#183c50">Le père → ses deux filles</text>
<text x="48" y="107" font-size="17" fill="#283740">Le présent de la séparation débouche sur un futur au duel.</text>
<text x="724" y="79" text-anchor="end" fill="#475b65" font-size="15">v. 1–9</text>
<path d="M390 126v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="146" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="146" width="8" height="76" fill="#205455"/>
<text x="48" y="175" font-size="19" font-weight="bold" fill="#205455">Le messager → son auditoire</text>
<text x="48" y="203" font-size="17" fill="#283740">Les trois personnages pleurent. Une voix rompt le silence.</text>
<text x="724" y="175" text-anchor="end" fill="#475b65" font-size="15">v. 10–16</text>
<path d="M390 222v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="242" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="242" width="8" height="76" fill="#775133"/>
<text x="48" y="271" font-size="19" font-weight="bold" fill="#775133">Le dieu → Œdipe</text>
<text x="48" y="299" font-size="17" fill="#283740">Le « nous » qui presse le départ devient un reproche adressé à « toi ».</text>
<text x="724" y="271" text-anchor="end" fill="#475b65" font-size="15">v. 17–18</text>
<path d="M390 318v14m-5 -5 5 5 5 -5" stroke="#475b65" stroke-width="2" fill="none"/>
<rect x="26" y="338" width="728" height="76" rx="6" fill="white" stroke="#b5c6c8"/>
<rect x="26" y="338" width="8" height="76" fill="#523f65"/>
<text x="48" y="367" font-size="19" font-weight="bold" fill="#523f65">Œdipe → Thésée, puis aux filles</text>
<text x="48" y="395" font-size="17" fill="#283740">La main offerte au père appelle un geste des filles envers Thésée.</text>
<text x="724" y="367" text-anchor="end" fill="#475b65" font-size="15">v. 19–23</text>
</g>
</svg>
