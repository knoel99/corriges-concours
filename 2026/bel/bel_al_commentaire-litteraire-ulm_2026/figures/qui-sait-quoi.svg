<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 421" role="img" aria-labelledby="t d"><title id="t">Distribution des rôles lors de la visite</title><desc id="d">Mme Tim Peut avancer les frais de l’ouvrage. Elle soutient le dialogue avec la brodeuse. La brodeuse Souhaite accepter une commande délicate. Ses mains tremblent devant l’enjeu du travail. Saucisse Fait durer l’examen d’une étoffe. Elle en profite pour observer son ami. Langlois Se tient à l’abri des oreillettes. Ce qu’il éprouve demeure inaccessible.</desc><rect width="850" height="421" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="20" y="38" fill="#183343" font-size="27" font-weight="bold">Distribution des rôles lors de la visite</text>
<rect x="20" y="55" width="810" height="77" rx="7" fill="#e9f2f1"/>
<text x="35" y="87" fill="#183343" font-size="20" font-weight="bold">Mme Tim</text>
<text x="218" y="84" fill="#183343" font-size="18" font-weight="normal">Peut avancer les frais de l’ouvrage.</text>
<text x="218" y="110" fill="#183343" font-size="17" font-weight="normal">Elle soutient le dialogue avec la brodeuse.</text>
<rect x="20" y="144" width="810" height="77" rx="7" fill="#f4eddf"/>
<text x="35" y="176" fill="#183343" font-size="20" font-weight="bold">La brodeuse</text>
<text x="218" y="173" fill="#183343" font-size="18" font-weight="normal">Souhaite accepter une commande délicate.</text>
<text x="218" y="199" fill="#183343" font-size="17" font-weight="normal">Ses mains tremblent devant l’enjeu du travail.</text>
<rect x="20" y="233" width="810" height="77" rx="7" fill="#e9edf6"/>
<text x="35" y="265" fill="#183343" font-size="20" font-weight="bold">Saucisse</text>
<text x="218" y="262" fill="#183343" font-size="18" font-weight="normal">Fait durer l’examen d’une étoffe.</text>
<text x="218" y="288" fill="#183343" font-size="17" font-weight="normal">Elle en profite pour observer son ami.</text>
<rect x="20" y="322" width="810" height="77" rx="7" fill="#f4e8ef"/>
<text x="35" y="354" fill="#183343" font-size="20" font-weight="bold">Langlois</text>
<text x="218" y="351" fill="#183343" font-size="18" font-weight="normal">Se tient à l’abri des oreillettes.</text>
<text x="218" y="377" fill="#183343" font-size="17" font-weight="normal">Ce qu’il éprouve demeure inaccessible.</text>
</g></svg>
