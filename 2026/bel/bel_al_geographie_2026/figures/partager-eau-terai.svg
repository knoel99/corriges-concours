<text x="183.0" y="235.0" font-size="16" font-weight="normal" fill="#243c47">Parcelles desservies par des prises successives</text>
<text x="22.0" y="301.0" font-size="17" font-weight="normal" fill="#243c47">L’ordre spatial des prises compte. Le calendrier de distribution et le droit de participer aux décisions</text>
<text x="22.0" y="327.0" font-size="17" font-weight="normal" fill="#243c47">déterminent aussi si l’eau arrive au bon moment dans une parcelle.</text>
