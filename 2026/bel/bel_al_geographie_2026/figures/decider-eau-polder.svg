<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 414" role="img" aria-labelledby="t d"><title id="t">Dans un polder, la vanne concerne plusieurs habitants</title><desc id="d">Schéma conceptuel du sud-ouest du Bangladesh. L’ouverture d’une vanne peut apporter l’eau saumâtre recherchée pour un bassin aquacole. À proximité, ménages et riziculteurs cherchent à préserver des ressources en eau douce.</desc><rect width="920" height="414" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="34.0" font-size="24" font-weight="bold" fill="#243c47">Dans un polder, la vanne concerne plusieurs habitants</text>
<text x="20.0" y="60.0" font-size="16" font-weight="normal" fill="#243c47">Sud-ouest du Bangladesh, situation schématique de Khulna–Satkhira</text>
<rect x="21" y="81" width="172" height="186" fill="#ddecf3" stroke="#ffffff" rx="0"/>
<rect x="194" y="81" width="699" height="186" fill="#e8f1e5" stroke="#ffffff" rx="0"/>
<text x="36.0" y="113.0" font-size="18" font-weight="bold" fill="#2f708c">Bras de marée</text>
<text x="36.0" y="139.0" font-size="16" font-weight="normal" fill="#2f708c">Eau saumâtre</text>
<line x1="197.0" y1="84.0" x2="197.0" y2="156.0" stroke="#9a7344" stroke-width="8"/>
<line x1="197.0" y1="183.0" x2="197.0" y2="265.0" stroke="#9a7344" stroke-width="8"/>
<text x="215.0" y="241.0" font-size="16" font-weight="normal" fill="#77542c">Digue</text>
<text x="219.0" y="192.0" font-size="15" font-weight="bold" fill="#243c47">Vanne</text>
<line x1="114.0" y1="171.0" x2="256.0" y2="171.0" stroke="#2f708c" stroke-width="3"/><path d="M247.9,175.0 256.0,171.0 247.9,167.0" fill="none" stroke="#2f708c" stroke-width="3" stroke-linejoin="round"/>
<line x1="255.0" y1="171.0" x2="339.0" y2="119.0" stroke="#2f708c" stroke-width="2"/><path d="M334.2,126.6 339.0,119.0 330.0,119.8" fill="none" stroke="#2f708c" stroke-width="2" stroke-linejoin="round"/>
<rect x="342" y="93" width="200" height="59" fill="#bcdce3" stroke="#6e9aa0" rx="0"/>
<text x="352.0" y="127.0" font-size="16" font-weight="bold" fill="#2f708c">Bassin à crevettes</text>
<rect x="592" y="177" width="253" height="63" fill="#d2e3ba" stroke="#a6b78e" rx="0"/>
<text x="606.0" y="214.0" font-size="17" font-weight="bold" fill="#243c47">Rizières et eau douce</text>
<text x="595.0" y="124.0" font-size="16" font-weight="bold" fill="#243c47">Habitations</text>
<path d="M620.0,165.0 620.0,149.0 632.0,140.0 644.0,149.0 644.0,165.0" fill="#f6eee1" stroke="#876b4a" stroke-width="1" stroke-linejoin="round"/>
<path d="M664.0,165.0 664.0,149.0 676.0,140.0 688.0,149.0 688.0,165.0" fill="#f6eee1" stroke="#876b4a" stroke-width="1" stroke-linejoin="round"/>
<text x="22.0" y="304.0" font-size="17" font-weight="normal" fill="#243c47">La valeur des crevettes encourage certains exploitants à faire entrer l’eau saumâtre.</text>
<text x="22.0" y="334.0" font-size="17" font-weight="normal" fill="#243c47">Les besoins des foyers et des cultures en eau douce peuvent entrer en conflit avec cet usage.</text>
<text x="22.0" y="376.0" font-size="14" font-weight="normal" fill="#243c47">Le tracé illustre des relations fonctionnelles. Les parcelles ne représentent pas des exploitations localisées.</text>
</g></svg>
