<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">Dalla definizione alla partecipazione</title><desc id="desc">I · Definire : Chi usa il criterio, e che cosa permette di conoscere? II · Verificare : Che cosa accade quando qualcuno deve provare di appartenere? III · Discutere : Chi può modificare il racconto del patrimonio comune?</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">Dalla definizione alla partecipazione</text>
<rect x="17" y="57" width="271" height="205" rx="8" fill="#dceff2"/>
<text x="30" y="91" font-size="18" font-weight="bold" fill="#213b4a">I · Definire</text>
<text x="30" y="151" font-size="17" font-weight="normal" fill="#213b4a">Chi usa il criterio, e</text>
<text x="30" y="175" font-size="17" font-weight="normal" fill="#213b4a">che cosa permette di</text>
<text x="30" y="199" font-size="17" font-weight="normal" fill="#213b4a">conoscere?</text>
<path d="M292 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="318" y="57" width="271" height="205" rx="8" fill="#f7ebd5"/>
<text x="331" y="91" font-size="18" font-weight="bold" fill="#213b4a">II · Verificare</text>
<text x="331" y="151" font-size="17" font-weight="normal" fill="#213b4a">Che cosa accade quando</text>
<text x="331" y="175" font-size="17" font-weight="normal" fill="#213b4a">qualcuno deve provare di</text>
<text x="331" y="199" font-size="17" font-weight="normal" fill="#213b4a">appartenere?</text>
<path d="M593 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="619" y="57" width="271" height="205" rx="8" fill="#e7ecf6"/>
<text x="632" y="91" font-size="18" font-weight="bold" fill="#213b4a">III · Discutere</text>
<text x="632" y="151" font-size="17" font-weight="normal" fill="#213b4a">Chi può modificare il</text>
<text x="632" y="175" font-size="17" font-weight="normal" fill="#213b4a">racconto del patrimonio</text>
<text x="632" y="199" font-size="17" font-weight="normal" fill="#213b4a">comune?</text>
</g></svg>
