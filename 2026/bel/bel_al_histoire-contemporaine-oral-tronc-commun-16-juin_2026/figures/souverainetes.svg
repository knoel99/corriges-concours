<svg xmlns="http://www.w3.org/2000/svg" width="900" height="483" viewBox="0 0 900 483" role="img" aria-labelledby="h d"><title id="h">Quatre trajectoires de construction de l’État</title><desc id="d">Turquie 1922, fin du sultanat. 1923, république. 1924, abolition du califat. Irak 1921, monarchie hachémite. 1932, entrée à la SDN. 1958, chute de la monarchie. Égypte 1952, départ de Farouk. 1953, république. 1956, nationalisation de la Compagnie du canal. Iran 1925, avènement des Pahlavi. 1951, pétrole nationalisé. 1979, révolution et République islamique. Comparer Distinguer changement de souverain, indépendance juridique et capacité administrative effective.</desc><rect width="900" height="483" fill="#faf8f3"/><g font-family="DejaVu Sans,sans-serif" fill="#183b4f"><text x="25" y="41" font-weight="bold" font-size="27">Quatre trajectoires de construction de l’État</text><rect x="24" y="58" width="852" height="70" rx="7" fill="white" stroke="#9aacaf"/><rect x="24" y="58" width="239" height="70" rx="7" fill="#e4eeec"/><text x="39" y="99" font-weight="bold" font-size="19">Turquie</text><text x="280" y="87" font-size="18">1922, fin du sultanat. 1923, république.</text><text x="280" y="112" font-size="18">1924, abolition du califat.</text><rect x="24" y="140" width="852" height="70" rx="7" fill="white" stroke="#9aacaf"/><rect x="24" y="140" width="239" height="70" rx="7" fill="#e4eeec"/><text x="39" y="181" font-weight="bold" font-size="19">Irak</text><text x="280" y="169" font-size="18">1921, monarchie hachémite. 1932, entrée à la SDN.</text><text x="280" y="194" font-size="18">1958, chute de la monarchie.</text><rect x="24" y="222" width="852" height="70" rx="7" fill="white" stroke="#9aacaf"/><rect x="24" y="222" width="239" height="70" rx="7" fill="#e4eeec"/><text x="39" y="263" font-weight="bold" font-size="19">Égypte</text><text x="280" y="251" font-size="18">1952, départ de Farouk. 1953, république.</text><text x="280" y="276" font-size="18">1956, nationalisation de la Compagnie du canal.</text><rect x="24" y="304" width="852" height="70" rx="7" fill="white" stroke="#9aacaf"/><rect x="24" y="304" width="239" height="70" rx="7" fill="#e4eeec"/><text x="39" y="345" font-weight="bold" font-size="19">Iran</text><text x="280" y="333" font-size="18">1925, avènement des Pahlavi. 1951, pétrole nationalisé.</text><text x="280" y="358" font-size="18">1979, révolution et République islamique.</text><rect x="24" y="386" width="852" height="70" rx="7" fill="white" stroke="#9aacaf"/><rect x="24" y="386" width="239" height="70" rx="7" fill="#e4eeec"/><text x="39" y="427" font-weight="bold" font-size="19">Comparer</text><text x="280" y="415" font-size="18">Distinguer changement de souverain, indépendance</text><text x="280" y="440" font-size="18">juridique et capacité administrative effective.</text></g></svg>
