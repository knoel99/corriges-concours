<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">Del contacto de las manos a la escala del río</title>
<desc id="description">Dedos, fruta y rama Reconoce intenciones por sus efectos. La traducción del vocablo aún queda abierta. Manos bajo los codos Cesan las vibraciones; el suelo parece liso. La vista depende del tacto y la postura. Sueño y despertar Una luz se vuelve luna al reconocerla. Percibir y nombrar llevan tiempos distintos. Soltarlo en la barranca El mundo oscila cuando él ya está quieto. La impresión de infinito nace de un cuerpo situado.</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Del contacto de las manos a la escala del río</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Detalle del relato</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Lo que siente el joven</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Lo que aprende el lector</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Dedos, fruta y rama</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Reconoce intenciones por</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">sus efectos.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La traducción del vocablo</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">aún queda abierta.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Manos bajo los codos</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Cesan las vibraciones; el</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">suelo parece liso.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La vista depende del tacto</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">y la postura.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Sueño y despertar</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Una luz se vuelve luna al</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">reconocerla.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Percibir y nombrar llevan</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">tiempos distintos.</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Soltarlo en la</text>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">barranca</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">El mundo oscila cuando él</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">ya está quieto.</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">La impresión de infinito</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">nace de un cuerpo situado.</text>
</g>
</svg>
