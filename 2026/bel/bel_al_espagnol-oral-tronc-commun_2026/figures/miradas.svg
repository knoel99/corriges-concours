<svg xmlns="http://www.w3.org/2000/svg" width="720" height="252" viewBox="0 0 720 252" role="img" aria-labelledby="titre description">
<title id="titre">¿Qué cambia de manos en el relato?</title>
<desc id="description">Borges Un visitante descubre una pieza en un cajón. El objeto acaba pareciendo sujeto de una voluntad. Ribeyro Juan inventa una cara para entrar en la fiesta. Los anfitriones imponen su propia idea de lo que es una cara.</desc>
<rect width="720" height="252" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿Qué cambia de manos en el relato?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Texto</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Gesto inicial</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Desenlace</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Borges</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un visitante descubre una</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">pieza en un cajón.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">El objeto acaba pareciendo</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">sujeto de una voluntad.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Ribeyro</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Juan inventa una cara para</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">entrar en la fiesta.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Los anfitriones imponen su</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">propia idea de lo que es</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">una cara.</text>
</g>
</svg>
