<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">¿Quién puede hablar al final?</title>
<desc id="description">Champourcín Al grupo se le exige que hable. Decide callar para escuchar una voz distinta. Zambrano Una piedra explica cómo fue tomada. La cosa que servía de soporte juzga a quien la posee. Reyes Una voz ofrece el nudo que la sostiene. Las posibilidades opuestas terminan dentro de su cuerpo.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿Quién puede hablar al final?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Texto</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Comienzo</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Cambio</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Champourcín</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Al grupo se le exige que</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">hable.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Decide callar para escuchar</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">una voz distinta.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Zambrano</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Una piedra explica cómo</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">fue tomada.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La cosa que servía de</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">soporte juzga a quien la</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">posee.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Reyes</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Una voz ofrece el nudo que</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">la sostiene.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Las posibilidades opuestas</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">terminan dentro de su</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">cuerpo.</text>
</g>
</svg>
