<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">¿Qué puede hacer presente una ausencia?</title>
<desc id="description">Aramburu Bittori se dirige al Txato en Polloe. Su relato imagina las objeciones del muerto. Mesa La hermana recuerda la posición de la mano. Las dos memorias conservan detalles distintos. Sainz Borgo Un mechero queda en casa de otra persona. La pregunta por el gesto de Vestrini sigue abierta.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿Qué puede hacer presente una ausencia?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Texto</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Huella conservada</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Límite de lo que se sabe</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Aramburu</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Bittori se dirige al Txato</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">en Polloe.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Su relato imagina las</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">objeciones del muerto.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Mesa</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La hermana recuerda la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">posición de la mano.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Las dos memorias conservan</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">detalles distintos.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Sainz Borgo</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Un mechero queda en casa</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">de otra persona.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La pregunta por el gesto de</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Vestrini sigue abierta.</text>
</g>
</svg>
