<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois directions du regard dans l’auberge</title>
<desc id="description">Les parents La télévision depuis le seuil. Les attitudes annoncent d’autres épisodes. Le garçon Son adversaire imaginaire. Il est absorbé par sa propre scène. Le voyageur Toute la pièce puis deux régions européennes. La dernière comparaison appartient à sa voix.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois directions du regard dans l’auberge</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Qui regarde ?</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Vers quoi ?</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Indice de lecture</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Les parents</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La télévision depuis le</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">seuil.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les attitudes annoncent</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">d’autres épisodes.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le garçon</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Son adversaire imaginaire.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Il est absorbé par sa</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">propre scène.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le voyageur</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Toute la pièce puis deux</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">régions européennes.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La dernière comparaison</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">appartient à sa voix.</text>
</g>
</svg>
