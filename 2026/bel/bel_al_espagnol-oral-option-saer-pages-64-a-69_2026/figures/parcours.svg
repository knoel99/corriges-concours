<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">De la orientación común a la mirada del superviviente</title>
<desc id="description">A bordo, antes del alba El yo que despierta entre voces Hay un mundo común antes de distinguirlo con los ojos. El prado, con el sol alto Once hombres miran juntos Suponer que nadie más mira es una hipótesis. La orilla, a mediodía El capitán señala; el joven oye El recuerdo certifica dónde se cortó la frase. La carrera y la parada El superviviente, entre dos guías El movimiento de su cuerpo altera lo visible.</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De la orientación común a la mirada del superviviente</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lugar y hora</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Quién percibe</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué se puede afirmar</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">A bordo, antes del</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">alba</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">El yo que despierta entre</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">voces</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Hay un mundo común antes de</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">distinguirlo con los ojos.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">El prado, con el sol</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">alto</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Once hombres miran juntos</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Suponer que nadie más mira</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">es una hipótesis.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La orilla, a mediodía</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">El capitán señala; el</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">joven oye</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">El recuerdo certifica dónde</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">se cortó la frase.</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">La carrera y la</text>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">parada</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">El superviviente, entre</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">dos guías</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">El movimiento de su cuerpo</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">altera lo visible.</text>
</g>
</svg>
