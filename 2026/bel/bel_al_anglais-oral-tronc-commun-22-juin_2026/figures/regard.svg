<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Who gets to see what?</title>
<desc id="description">Auden A private conversation on a lawn Distant people bear the possible cost of a word. Boland A forest on a map The unfinished road recalls a history of hunger. Mahon A bright London morning The Belfast return qualifies the expatriate view.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who gets to see what?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Text</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">First view</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What changes</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Auden</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A private conversation on</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">a lawn</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Distant people bear the</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">possible cost of a word.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Boland</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">A forest on a map</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">The unfinished road recalls</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">a history of hunger.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Mahon</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">A bright London morning</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">The Belfast return</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">qualifies the expatriate</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">view.</text>
</g>
</svg>
