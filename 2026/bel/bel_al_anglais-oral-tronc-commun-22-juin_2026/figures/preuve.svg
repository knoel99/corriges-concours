<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">How does evidence change meaning?</title>
<desc id="description">Lowell A snapshot fixes facts. Naming a person gives accuracy an ethical purpose. Poe, chapter X A sailor appears to smile. New sensory evidence undoes the hope of rescue. Lessing, opening A newspaper offers a motive. The response exposes the interests of its readers.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">How does evidence change meaning?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Text</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">What looks like evidence</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What the reader discovers</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Lowell</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">A snapshot fixes facts.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Naming a person gives</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">accuracy an ethical</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">purpose.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Poe, chapter X</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">A sailor appears to smile.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">New sensory evidence undoes</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">the hope of rescue.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Lessing, opening</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">A newspaper offers a</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">motive.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">The response exposes the</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">interests of its readers.</text>
</g>
</svg>
