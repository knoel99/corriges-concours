<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img" aria-labelledby="t d"><title id="t">Variations de population à Detroit, dans le comté d’Oakland, au Japon et à Tokyo</title><desc id="d">Detroit perd 10,5 % et le comté voisin d’Oakland gagne 6,0 % de 2010 à 2020. Le Japon perd 0,7 % et la préfecture de Tokyo gagne 3,9 % de 2015 à 2020.</desc><rect width="820" height="380" fill="#fcfbf6"/><g font-family="DejaVu Sans,sans-serif" fill="#183c50"><text x="26" y="35" font-size="22" font-weight="bold">Un même intervalle, des trajectoires de sens contraire</text><text x="26" y="74" font-size="17" font-weight="bold">Région de Detroit · territoires voisins · 2010–2020</text><text x="26" y="208" font-size="17" font-weight="bold">Japon · territoires emboîtés · 2015–2020</text>
<text x="28" y="115" font-size="17">Detroit, municipalité</text><rect x="315.0" y="96" width="210.0" height="22" fill="#a55b40"/><text x="308.0" y="114" text-anchor="end" font-size="15" font-weight="bold">−10,5 %</text>
<text x="28" y="163" font-size="17">Oakland, comté</text><rect x="525" y="144" width="120.0" height="22" fill="#247974"/><text x="652.0" y="162" text-anchor="start" font-size="15" font-weight="bold">+6,0 %</text>
<text x="28" y="249" font-size="17">Japon, pays</text><rect x="511.0" y="230" width="14.0" height="22" fill="#a55b40"/><text x="504.0" y="248" text-anchor="end" font-size="15" font-weight="bold">−0,7 %</text>
<text x="28" y="297" font-size="17">Tokyo, préfecture</text><rect x="525" y="278" width="78.0" height="22" fill="#247974"/><text x="610.0" y="296" text-anchor="start" font-size="15" font-weight="bold">+3,9 %</text>
