<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 294" role="img" aria-labelledby="titre desc"><title id="titre">Évaluer la réforme des formations</title><desc id="desc">I · Changer d’échelle : Comparer les anticipations de l’étudiante et la stratégie nationale. II · Lire les mesures : Distinguer les cursus, les étudiants et les emplois. III · Tester les effets : Suivre les compétences acquises et les parcours après le diplôme.</desc><rect width="910" height="294" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="17" y="33" font-size="24" font-weight="bold" fill="#213b4a">Évaluer la réforme des formations</text>
<rect x="17" y="57" width="271" height="205" rx="8" fill="#dceff2"/>
<text x="30" y="91" font-size="18" font-weight="bold" fill="#213b4a">I · Changer</text>
<text x="30" y="112" font-size="18" font-weight="bold" fill="#213b4a">d’échelle</text>
<text x="30" y="151" font-size="17" font-weight="normal" fill="#213b4a">Comparer les</text>
<text x="30" y="175" font-size="17" font-weight="normal" fill="#213b4a">anticipations de</text>
<text x="30" y="199" font-size="17" font-weight="normal" fill="#213b4a">l’étudiante et la</text>
<text x="30" y="223" font-size="17" font-weight="normal" fill="#213b4a">stratégie nationale.</text>
<path d="M292 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="318" y="57" width="271" height="205" rx="8" fill="#f7ebd5"/>
<text x="331" y="91" font-size="18" font-weight="bold" fill="#213b4a">II · Lire les</text>
<text x="331" y="112" font-size="18" font-weight="bold" fill="#213b4a">mesures</text>
<text x="331" y="151" font-size="17" font-weight="normal" fill="#213b4a">Distinguer les cursus,</text>
<text x="331" y="175" font-size="17" font-weight="normal" fill="#213b4a">les étudiants et les</text>
<text x="331" y="199" font-size="17" font-weight="normal" fill="#213b4a">emplois.</text>
<path d="M593 162 h17 m-6 -5 6 5 -6 5" fill="none" stroke="#4f6a74" stroke-width="2"/>
<rect x="619" y="57" width="271" height="205" rx="8" fill="#e7ecf6"/>
<text x="632" y="91" font-size="18" font-weight="bold" fill="#213b4a">III · Tester les</text>
<text x="632" y="112" font-size="18" font-weight="bold" fill="#213b4a">effets</text>
<text x="632" y="151" font-size="17" font-weight="normal" fill="#213b4a">Suivre les compétences</text>
<text x="632" y="175" font-size="17" font-weight="normal" fill="#213b4a">acquises et les parcours</text>
<text x="632" y="199" font-size="17" font-weight="normal" fill="#213b4a">après le diplôme.</text>
</g></svg>
