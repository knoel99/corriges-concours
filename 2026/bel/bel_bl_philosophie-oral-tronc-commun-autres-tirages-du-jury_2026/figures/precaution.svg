<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="263" viewBox="0 0 1020 263" role="img" aria-labelledby="title description"><title id="title">Décider sous incertitude environnementale</title><desc id="description">Qualification Dommage grave et irréversible ? Évaluer le risque plausible. Action Mesure provisoire, proportionnée. Examiner aussi l’inaction. Réexamen Qu’apprend-on de nouveau ? Adapter ou lever la mesure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#306965"/></marker></defs><rect width="1020" height="263" fill="#f6f5f0"/><g font-family="DejaVu Sans, sans-serif" fill="#193836"><text x="24" y="46" font-size="26" font-weight="bold">Décider sous incertitude environnementale</text><rect x="24" y="81" width="305" height="140" rx="8" fill="white" stroke="#96b0a6"/><path d="M36 102 h25" stroke="#4e806b" stroke-width="5"/><text x="36" y="136" font-size="21" font-weight="bold">Qualification</text><text x="36" y="173" font-size="16">Dommage grave et irréversible ?</text><text x="36" y="198" font-size="16">Évaluer le risque plausible.</text><line x1="331" y1="151" x2="351" y2="151" stroke="#306965" stroke-width="2" marker-end="url(#arrow)"/><rect x="356" y="81" width="305" height="140" rx="8" fill="white" stroke="#96b0a6"/><path d="M368 102 h25" stroke="#4e806b" stroke-width="5"/><text x="368" y="136" font-size="21" font-weight="bold">Action</text><text x="368" y="173" font-size="16">Mesure provisoire, proportionnée.</text><text x="368" y="198" font-size="16">Examiner aussi l’inaction.</text><line x1="663" y1="151" x2="683" y2="151" stroke="#306965" stroke-width="2" marker-end="url(#arrow)"/><rect x="688" y="81" width="305" height="140" rx="8" fill="white" stroke="#96b0a6"/><path d="M700 102 h25" stroke="#4e806b" stroke-width="5"/><text x="700" y="136" font-size="21" font-weight="bold">Réexamen</text><text x="700" y="173" font-size="16">Qu’apprend-on de nouveau ?</text><text x="700" y="198" font-size="16">Adapter ou lever la mesure.</text></g></svg>
