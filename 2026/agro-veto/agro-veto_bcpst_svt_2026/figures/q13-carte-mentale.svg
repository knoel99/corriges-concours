<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120mm" height="81mm" viewBox="0 0 340.157 229.606" data-name="q13-carte-mentale"><defs/><rect x="0" y="0" width="340.15748031496065" height="229.60629921259846" fill="#fff" data-role="background"/><g id="root"><rect x="92.079" y="6" width="156" height="21.2" rx="3" ry="3" fill="#f2f2f2" stroke="#2b2b2b" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="170.07874015748033" y="12.8" font-family="Arial, Helvetica, sans-serif" font-size="6.6" font-weight="bold" fill="#1a1a1a" text-anchor="middle" data-role="label" transform="translate(0 2.250)"><tspan x="170.07874015748033">Transmission de </tspan><tspan font-style="italic">Wolbachia</tspan><tspan> d'un hôte à l'autre</tspan></text><text x="170.07874015748033" y="20.4" font-family="Arial, Helvetica, sans-serif" font-size="6.6" font-weight="bold" fill="#1a1a1a" text-anchor="middle" data-role="label" transform="translate(0 2.250)"><tspan x="170.07874015748033">chez les Arthropodes</tspan></text><rect x="30" y="42" width="108" height="13.6" rx="3" ry="3" fill="#e3eef8" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="48.8" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="bold" fill="#1a1a1a" text-anchor="middle" data-role="label" transform="translate(0 1.875)"><tspan x="84">VERTICALE (maternelle)</tspan></text><rect x="196" y="42" width="112" height="13.6" rx="3" ry="3" fill="#fbeedd" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="252" y="48.8" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="bold" fill="#1a1a1a" text-anchor="middle" data-role="label" transform="translate(0 1.875)"><tspan x="252">HORIZONTALE (entre hôtes)</tspan></text><polyline points="140.079,27.2 140.079,32 84,32 84,42" fill="none" stroke="#1f6fb2" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="200.079,27.2 200.079,32 252,32 252,42" fill="none" stroke="#c46a00" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="70" width="138" height="21.2" rx="3" ry="3" fill="#ffffff" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="76.8" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="24" font-weight="bold">voie</tspan><tspan> : bactéries dans le cytoplasme</tspan></text><text x="24" y="84.4" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="24">de l'ovocyte (doc. 9A, 9C)</tspan></text><line x1="14" y1="80.6" x2="20" y2="80.6" fill="none" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="96.2" width="138" height="28.8" rx="3" ry="3" fill="#ffffff" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="103" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="24" font-weight="bold">pas par le mâle</tspan><tspan> : aucune bactérie dans</tspan></text><text x="24" y="110.6" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="24">les spermatozoïdes, éliminées avec</tspan></text><text x="24" y="118.2" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="24">le cytoplasme (doc. 9B)</tspan></text><line x1="14" y1="110.6" x2="20" y2="110.6" fill="none" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="130" width="138" height="28.8" rx="3" ry="3" fill="#ffffff" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="136.8" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="24" font-weight="bold">conséquence</tspan><tspan> : toute la descendance</tspan></text><text x="24" y="144.4" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="24">d'une femelle infectée est infectée</tspan></text><text x="24" y="152" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="24">(doc. 5)</tspan></text><line x1="14" y1="144.4" x2="20" y2="144.4" fill="none" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="14" y1="61" x2="14" y2="144.4" fill="none" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="184" y="70" width="146" height="28.8" rx="3" ry="3" fill="#ffffff" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="188" y="76.8" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188" font-weight="bold">preuve</tspan><tspan> : même espèce de </tspan><tspan font-style="italic">Wolbachia</tspan><tspan> chez</tspan></text><text x="188" y="84.4" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188">des genres non apparentés, groupes</tspan></text><text x="188" y="92" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188">polyphylétiques (doc. 10)</tspan></text><line x1="178" y1="84.4" x2="184" y2="84.4" fill="none" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="184" y="103.8" width="146" height="28.8" rx="3" ry="3" fill="#ffffff" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="188" y="110.6" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188" font-weight="bold">mécanisme cellulaire</tspan><tspan> : adhésion à une</tspan></text><text x="188" y="118.19999999999999" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188">cellule vivante puis endocytose, bloquée</tspan></text><text x="188" y="125.8" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188">par la chlorpromazine (doc. 11)</tspan></text><line x1="178" y1="118.2" x2="184" y2="118.2" fill="none" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="184" y="137.6" width="146" height="28.8" rx="3" ry="3" fill="#ffffff" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="188" y="144.4" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188" font-weight="bold">vection</tspan><tspan> : la guêpe </tspan><tspan font-style="italic">Eretmocerus</tspan><tspan> transmet</tspan></text><text x="188" y="152" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188">la bactérie d'une larve d'aleurode à</tspan></text><text x="188" y="159.6" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188">l'autre, dans les 2 jours (doc. 12)</tspan></text><line x1="178" y1="152" x2="184" y2="152" fill="none" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="184" y="171.4" width="146" height="21.2" rx="3" ry="3" fill="#ffffff" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="188" y="178.2" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188" font-weight="bold">autres contacts</tspan><tspan> : prédation, cannibalisme,</tspan></text><text x="188" y="185.79999999999998" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="188">échanges de nourriture, partage du nid</tspan></text><line x1="178" y1="182" x2="184" y2="182" fill="none" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="178" y1="61" x2="178" y2="182" fill="none" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="84" y1="55.6" x2="84" y2="61" fill="none" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="14" y1="61" x2="84" y2="61" fill="none" stroke="#1f6fb2" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="252" y1="55.6" x2="252" y2="61" fill="none" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="178" y1="61" x2="252" y2="61" fill="none" stroke="#c46a00" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="202.6" width="320.157" height="21.2" rx="3" ry="3" fill="#e8f4ec" stroke="#2e7d4f" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/><text x="14" y="209.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="14" font-weight="bold">Articulation</tspan><tspan> : une infection acquise horizontalement ne devient héréditaire que si la bactérie</tspan></text><text x="14" y="216.99999999999997" font-family="Arial, Helvetica, sans-serif" font-size="6.2" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label" transform="translate(0 1.875)"><tspan x="14">atteint la lignée germinale femelle ; l'incompatibilité cytoplasmique (thème 2) assure ensuite son invasion.</tspan></text><g data-part="arrow"><path d="M89,158.8 L89,200.52" fill="none" stroke="#2e7d4f" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 1.2" data-part="arrow-shaft"/><polygon points="89,202.6 87.4,200 89,200.468 90.6,200" fill="#2e7d4f" stroke="none" data-part="arrowhead"/></g><g data-part="arrow"><path d="M257,192.6 L257,200.52" fill="none" stroke="#2e7d4f" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 1.2" data-part="arrow-shaft"/><polygon points="257,202.6 255.4,200 257,200.468 258.6,200" fill="#2e7d4f" stroke="none" data-part="arrowhead"/></g></g></svg>