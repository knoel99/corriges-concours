<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Du quota à la marge des éleveurs</title>
<desc id="description">99 000 tonnes Quota de viande entrant à droits réduits. Un volume autorisé ne garantit aucun prix de vente. Morceaux de valeur Témoignage du second éleveur irlandais. La concurrence touche une source importante de revenu. Normes sanitaires Critiques formulées par les éleveurs. Distinguer leurs craintes des faits établis par le journaliste.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Du quota à la marge des éleveurs</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Élément</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Source et portée</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Lien avec la question</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">99 000 tonnes</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Quota de viande entrant à</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">droits réduits.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Un volume autorisé ne</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">garantit aucun prix de</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">vente.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Morceaux de valeur</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Témoignage du second</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">éleveur irlandais.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">La concurrence touche une</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">source importante de</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">revenu.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Normes sanitaires</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Critiques formulées par</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">les éleveurs.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Distinguer leurs craintes</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">des faits établis par le</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">journaliste.</text>
</g>
</svg>
