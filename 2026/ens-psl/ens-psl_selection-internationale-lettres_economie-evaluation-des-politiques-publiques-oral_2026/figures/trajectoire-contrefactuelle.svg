<svg xmlns="http://www.w3.org/2000/svg" width="840" height="365" viewBox="0 0 840 365" role="img" aria-labelledby="t d"><title id="t">Reconstruire la trajectoire absente</title><desc id="d">L’emploi passe de 50 % à 60 % chez les traités et de 40 % à 43 % chez les témoins. Sous l’hypothèse de tendances parallèles, le taux contrefactuel des traités est 53 %, soit un effet de sept points.</desc><rect x="0" y="0" width="840" height="365" fill="#ffffff"/><text x="19" y="34" font-size="22" fill="#203446" font-weight="bold" text-anchor="start" font-family="DejaVu Sans,sans-serif">Reconstruire la trajectoire absente</text><text x="20" y="61" font-size="17" fill="#426174" font-weight="normal" text-anchor="start" font-family="DejaVu Sans,sans-serif">Part en emploi, en % • deux groupes et deux dates fictifs</text><line x1="84" y1="261" x2="680" y2="261" stroke="#d4dfe3" stroke-width="1"/><text x="65" y="266" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">40</text><line x1="84" y1="226" x2="680" y2="226" stroke="#d4dfe3" stroke-width="1"/><text x="65" y="231" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">45</text><line x1="84" y1="191" x2="680" y2="191" stroke="#d4dfe3" stroke-width="1"/><text x="65" y="196" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">50</text><line x1="84" y1="156" x2="680" y2="156" stroke="#d4dfe3" stroke-width="1"/><text x="65" y="161" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">55</text><line x1="84" y1="121" x2="680" y2="121" stroke="#d4dfe3" stroke-width="1"/><text x="65" y="126" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">60</text><line x1="200" y1="261" x2="575" y2="240" stroke="#426174" stroke-width="3"/><line x1="200" y1="191" x2="575" y2="121" stroke="#006b65" stroke-width="4"/><line x1="200" y1="191" x2="575" y2="170" stroke="#9b471b" stroke-width="3" stroke-dasharray="8 7"/><circle cx="200" cy="261" r="6" fill="#426174"/><circle cx="200" cy="191" r="6" fill="#006b65"/><circle cx="575" cy="240" r="6" fill="#426174"/><circle cx="575" cy="121" r="6" fill="#006b65"/><circle cx="575" cy="170" r="6" fill="#9b471b"/><text x="179" y="266" font-size="16" fill="#426174" font-weight="bold" text-anchor="end" font-family="DejaVu Sans,sans-serif">40</text><text x="179" y="196" font-size="16" fill="#006b65" font-weight="bold" text-anchor="end" font-family="DejaVu Sans,sans-serif">50</text><text x="596" y="245" font-size="16" fill="#426174" font-weight="bold" text-anchor="start" font-family="DejaVu Sans,sans-serif">43 • témoin</text><text x="596" y="126" font-size="16" fill="#006b65" font-weight="bold" text-anchor="start" font-family="DejaVu Sans,sans-serif">60 • traité</text><text x="596" y="175" font-size="16" fill="#9b471b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans,sans-serif">53 • contrefactuel</text><text x="200" y="307" font-size="17" fill="#203446" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Avant la réforme</text><text x="575" y="307" font-size="17" fill="#203446" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Après la réforme</text><text x="22" y="346" font-size="17" fill="#203446" font-weight="normal" text-anchor="start" font-family="DejaVu Sans,sans-serif">L’évolution du témoin (+3 points) est reportée sur le niveau initial du groupe traité.</text></svg>
