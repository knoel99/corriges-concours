<svg xmlns="http://www.w3.org/2000/svg" width="720" height="474" viewBox="0 0 720 474" role="img" aria-labelledby="titre description">
<title id="titre">Qui porte, qui dirige, qui regarde ?</title>
<desc id="description">Autour du ring Le vert se détache parmi des tenues et des regards différents. La visiteuse devient le centre de l’attention. Au sol Des hommes plient tandis que Jackie demeure droite ou s’allonge sur leurs dos. L’aisance apparente rend visible le travail collectif. Du sol au ring Les cordes et le rebord donnent des repères au porté. Le groupe facilite l’accès de Jackie à la scène. Sur le ring Le corps en vert reste identifiable parmi des danseurs à sa hauteur. La place de vedette s’accorde avec le rythme partagé.</desc>
<rect width="720" height="474" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui porte, qui dirige, qui regarde ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Configuration</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce que montre le cadre</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet produit</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Autour du ring</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le vert se détache parmi</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">des tenues et des regards</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">différents.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La visiteuse devient le</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">centre de l’attention.</text>
<rect x="10" y="181" width="700" height="105" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Au sol</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Des hommes plient tandis</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">que Jackie demeure droite</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">ou s’allonge sur leurs</text>
<text x="229" y="272" font-size="15" font-weight="400" fill="#162d3b">dos.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">L’aisance apparente rend</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">visible le travail</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">collectif.</text>
<rect x="10" y="292" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">Du sol au ring</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">Les cordes et le rebord</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">donnent des repères au</text>
<text x="229" y="361" font-size="15" font-weight="400" fill="#162d3b">porté.</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">Le groupe facilite l’accès</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">de Jackie à la scène.</text>
<rect x="10" y="381" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="406" font-size="15" font-weight="700" fill="#162d3b">Sur le ring</text>
<text x="229" y="406" font-size="15" font-weight="400" fill="#162d3b">Le corps en vert reste</text>
<text x="229" y="428" font-size="15" font-weight="400" fill="#162d3b">identifiable parmi des</text>
<text x="229" y="450" font-size="15" font-weight="400" fill="#162d3b">danseurs à sa hauteur.</text>
<text x="473" y="406" font-size="15" font-weight="400" fill="#162d3b">La place de vedette</text>
<text x="473" y="428" font-size="15" font-weight="400" fill="#162d3b">s’accorde avec le rythme</text>
<text x="473" y="450" font-size="15" font-weight="400" fill="#162d3b">partagé.</text>
</g>
</svg>
