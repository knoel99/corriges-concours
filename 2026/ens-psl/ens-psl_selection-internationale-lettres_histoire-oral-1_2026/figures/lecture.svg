<svg xmlns="http://www.w3.org/2000/svg" width="720" height="408" viewBox="0 0 720 408" role="img" aria-labelledby="titre description">
<title id="titre">Comment Delage fait accepter les émigrés</title>
<desc id="description">Naufrage et efforts Le récit transforme la détresse en mérite. Qui raconte l’exil ? Appel à la police Un soupçon est anticipé et réfuté par autorité. Quels chiffres sont donnés ? Œuvres et métiers L’entraide utilise fortune, relations et savoir-faire. Qui finance et qui reçoit ? Éloge final L’emploi et la fidélité à la France couronnent le récit. Que diraient les salariés ?</desc>
<rect width="720" height="408" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment Delage fait accepter les émigrés</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Indice de lecture</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce qu’il établit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question à poursuivre</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Naufrage et efforts</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le récit transforme la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">détresse en mérite.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Qui raconte l’exil ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Appel à la police</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Un soupçon est anticipé et</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">réfuté par autorité.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Quels chiffres sont donnés</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">?</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Œuvres et métiers</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">L’entraide utilise</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">fortune, relations et</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">savoir-faire.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Qui finance et qui reçoit ?</text>
<rect x="10" y="315" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">Éloge final</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">L’emploi et la fidélité à</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">la France couronnent le</text>
<text x="229" y="384" font-size="15" font-weight="400" fill="#162d3b">récit.</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Que diraient les salariés ?</text>
</g>
</svg>
