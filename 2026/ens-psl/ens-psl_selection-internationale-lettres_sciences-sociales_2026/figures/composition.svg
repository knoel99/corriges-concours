<svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 900 315" role="img" aria-labelledby="t d"><title id="t">Un effet de composition sur un exemple fictif</title><desc id="d">Enquête 1, 300 A et 100 B. Enquête 2, 100 A et 300 B. La proportion totale passe de 15 à 25 %. </desc><rect width="900" height="315" fill="#f7f7f0"/><g font-family="DejaVu Sans,sans-serif" fill="#213c43"><text x="27" y="36" font-size="21" font-weight="bold">Un effet de composition sur un exemple fictif</text><text x="27" y="72" font-size="16" font-weight="normal">Part du groupe A et du groupe B dans chacune des deux enquêtes de 400 personnes.</text><text x="27" y="128" font-size="17" font-weight="bold">Enquête 1</text><rect x="142" y="103" width="396.0" height="37" fill="#386f70"/><rect x="538.0" y="103" width="132.0" height="37" fill="#a65537"/><text x="151" y="127" font-size="16" fill="white">300 A</text><text x="547.0" y="127" font-size="16" fill="white">100 B</text><text x="693" y="128" font-size="17" font-weight="bold">60 cas / 400</text><text x="27" y="208" font-size="17" font-weight="bold">Enquête 2</text><rect x="142" y="183" width="132.0" height="37" fill="#386f70"/><rect x="274.0" y="183" width="396.0" height="37" fill="#a65537"/><text x="151" y="207" font-size="16" fill="white">100 A</text><text x="283.0" y="207" font-size="16" fill="white">300 B</text><text x="693" y="208" font-size="17" font-weight="bold">100 cas / 400</text><text x="27" y="267" font-size="17" font-weight="normal">À chaque date, la proportion de cas est de 10 % dans A et de 30 % dans B.</text><text x="27" y="294" font-size="17" font-weight="normal">L’indicateur total passe de 15 % à 25 % du seul fait des poids respectifs de A et B.</text></g></svg>
