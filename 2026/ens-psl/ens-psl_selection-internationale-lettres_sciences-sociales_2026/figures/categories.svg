<svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 900 315" role="img" aria-labelledby="t d"><title id="t">Trois descriptions d’une interruption du travail</title><desc id="d">Une expérience, une décision et un comptage supposent des sources différentes.</desc><rect width="900" height="315" fill="#f7f7f0"/><g font-family="DejaVu Sans,sans-serif" fill="#213c43"><text x="27" y="36" font-size="21" font-weight="bold">Trois descriptions d’une interruption du travail</text><rect x="27" y="61" width="846" height="66" rx="6" fill="white" stroke="#91a5a1"/><text x="44" y="86" font-size="18" font-weight="bold">Situation vécue</text><text x="44" y="112" font-size="17" font-weight="normal">Quels mots emploie une personne qui cherche un travail ?</text><rect x="27" y="140" width="846" height="66" rx="6" fill="white" stroke="#91a5a1"/><text x="44" y="165" font-size="18" font-weight="bold">Règle institutionnelle</text><text x="44" y="191" font-size="17" font-weight="normal">À quelles conditions un guichet accorde-t-il un secours ?</text><rect x="27" y="219" width="846" height="66" rx="6" fill="white" stroke="#91a5a1"/><text x="44" y="244" font-size="18" font-weight="bold">Catégorie de mesure</text><text x="44" y="270" font-size="17" font-weight="normal">Quelles réponses permettent à un statisticien de compter un cas ?</text></g></svg>
