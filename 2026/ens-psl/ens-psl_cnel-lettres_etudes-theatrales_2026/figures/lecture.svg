<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Une même parole, plusieurs effets de scène</title>
<desc id="description">Elmire tousse. Tartuffe et Orgon donnent deux sens au même signal. Quand une preuve devient-elle suffisante ? Théramène raconte. Le père entend ce que le spectateur ne voit pas. Que fait un récit à son destinataire ? Les personnages de Beckett veulent partir. La décision est prononcée et les corps demeurent immobiles. Que change le temps après les mots ?</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Une même parole, plusieurs effets de scène</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Situation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce que la salle perçoit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question à développer</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Elmire tousse.</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Tartuffe et Orgon donnent</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">deux sens au même signal.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Quand une preuve devient-</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">elle suffisante ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Théramène raconte.</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le père entend ce que le</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">spectateur ne voit pas.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Que fait un récit à son</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">destinataire ?</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Les personnages de</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Beckett veulent</text>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">partir.</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">La décision est prononcée</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">et les corps demeurent</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">immobiles.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Que change le temps après</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">les mots ?</text>
</g>
</svg>
