<svg xmlns="http://www.w3.org/2000/svg" width="840" height="379" viewBox="0 0 840 379" role="img" aria-labelledby="t d"><title id="t">Prévoir un même trimestre à plusieurs dates</title><desc id="d">À la mi-avril, l’estimation est de +0,4 %. Une surprise de production la porte à +0,6 %. La première mesure atteint +0,5 % et la révision +0,8 %. Toutes ces valeurs sont fictives et concernent le même trimestre.</desc><rect x="0" y="0" width="840" height="379" fill="#ffffff"/><text x="19" y="34" font-size="22" fill="#203446" font-weight="bold" text-anchor="start" font-family="DejaVu Sans,sans-serif">Prévoir un même trimestre à plusieurs dates</text><text x="19" y="60" font-size="17" fill="#426174" font-weight="normal" text-anchor="start" font-family="DejaVu Sans,sans-serif">Taux de croissance trimestriel du PIB, en % • exemple fictif</text><line x1="90" y1="275" x2="800" y2="275" stroke="#d4dfe3" stroke-width="1"/><text x="72" y="281" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">0</text><line x1="90" y1="232.0" x2="800" y2="232.0" stroke="#d4dfe3" stroke-width="1"/><text x="72" y="238.0" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">0,2</text><line x1="90" y1="189.0" x2="800" y2="189.0" stroke="#d4dfe3" stroke-width="1"/><text x="72" y="195.0" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">0,4</text><line x1="90" y1="146.0" x2="800" y2="146.0" stroke="#d4dfe3" stroke-width="1"/><text x="72" y="152.0" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">0,6</text><line x1="90" y1="103.0" x2="800" y2="103.0" stroke="#d4dfe3" stroke-width="1"/><text x="72" y="109.0" font-size="16" fill="#426174" font-weight="normal" text-anchor="end" font-family="DejaVu Sans,sans-serif">0,8</text><line x1="160" y1="189.0" x2="351" y2="146.0" stroke="#006b65" stroke-width="3"/><line x1="440" y1="82" x2="440" y2="279" stroke="#426174" stroke-width="1" stroke-dasharray="8 7"/><circle cx="160" cy="189.0" r="8" fill="#006b65"/><text x="160" y="176.0" font-size="18" fill="#006b65" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">+0,4</text><text x="160" y="306" font-size="17" fill="#203446" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Mi-avril</text><text x="160" y="329" font-size="15" fill="#426174" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Avant la nouvelle</text><circle cx="351" cy="146.0" r="8" fill="#006b65"/><text x="351" y="133.0" font-size="18" fill="#006b65" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">+0,6</text><text x="351" y="306" font-size="17" fill="#203446" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Fin avril</text><text x="351" y="329" font-size="15" fill="#426174" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Après la nouvelle</text><rect x="528" y="160.5" width="14" height="14" fill="#9b471b"/><text x="535" y="154.5" font-size="18" fill="#9b471b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">+0,5</text><text x="535" y="306" font-size="17" fill="#203446" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Mai</text><text x="535" y="329" font-size="15" fill="#426174" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Première publication</text><rect x="720" y="96.0" width="14" height="14" fill="#9b471b"/><text x="727" y="90.0" font-size="18" fill="#9b471b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">+0,8</text><text x="727" y="306" font-size="17" fill="#203446" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">Plus tard</text><text x="727" y="329" font-size="15" fill="#426174" fo