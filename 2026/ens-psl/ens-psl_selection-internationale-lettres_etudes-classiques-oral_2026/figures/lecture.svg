<svg xmlns="http://www.w3.org/2000/svg" width="720" height="541" viewBox="0 0 720 541" role="img" aria-labelledby="titre description">
<title id="titre">Cinq textes, cinq gestes de la louange</title>
<desc id="description">Thucydide II, 41 La puissance de la cité éclaire le choix des soldats. Les citoyens survivants. Lysias, premier extrait Les honneurs publics éclairent la reconnaissance du service. Le détail correspond au §66. La cité qui ensevelit et honore. Lysias, §70 Servir autrui protège la patrie, mais la perte demeure. La cité et ceux qui ont élevé les morts. Cicéron, De oratore II L’usage des biens reçus rend la vertu perceptible. L’auditoire que l’orateur doit convaincre. Cicéron, Caton majeur 12 L’éloge du fils témoigne de la constance du père. Caton et les lecteurs de l’oraison.</desc>
<rect width="720" height="541" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Cinq textes, cinq gestes de la louange</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Texte</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Preuve du mérite</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qui garde la mémoire ?</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Thucydide II, 41</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La puissance de la cité</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">éclaire le choix des</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">soldats.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les citoyens survivants.</text>
<rect x="10" y="181" width="700" height="127" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Lysias, premier</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">extrait</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Les honneurs publics</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">éclairent la</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">reconnaissance du service.</text>
<text x="229" y="272" font-size="15" font-weight="400" fill="#162d3b">Le détail correspond au</text>
<text x="229" y="294" font-size="15" font-weight="400" fill="#162d3b">§66.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">La cité qui ensevelit et</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">honore.</text>
<rect x="10" y="314" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="339" font-size="15" font-weight="700" fill="#162d3b">Lysias, §70</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">Servir autrui protège la</text>
<text x="229" y="361" font-size="15" font-weight="400" fill="#162d3b">patrie, mais la perte</text>
<text x="229" y="383" font-size="15" font-weight="400" fill="#162d3b">demeure.</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">La cité et ceux qui ont</text>
<text x="473" y="361" font-size="15" font-weight="400" fill="#162d3b">élevé les morts.</text>
<rect x="10" y="403" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="428" font-size="15" font-weight="700" fill="#162d3b">Cicéron, De oratore</text>
<text x="24" y="450" font-size="15" font-weight="700" fill="#162d3b">II</text>
<text x="229" y="428" font-size="15" font-weight="400" fill="#162d3b">L’usage des biens reçus</text>
<text x="229" y="450" font-size="15" font-weight="400" fill="#162d3b">rend la vertu perceptible.</text>
<text x="473" y="428" font-size="15" font-weight="400" fill="#162d3b">L’auditoire que l’orateur</text>
<text x="473" y="450" font-size="15" font-weight="400" fill="#162d3b">doit convaincre.</text>
<rect x="10" y="470" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="495" font-size="15" font-weight="700" fill="#162d3b">Cicéron, Caton majeur</text>
<text x="24" y="517" font-size="15" font-weight="700" fill="#162d3b">12</text>
<text x="229" y="495" font-size="15" font-weight="400" fill="#162d3b">L’éloge du fils témoigne</text>
<text x="229" y="517" font-size="15" font-weight="400" fill="#162d3b">de la constance du père.</text>
<text x="473" y="495" font-size="15" font-weight="400" fill="#162d3b">Caton et les lecteurs de</text>
<text x="473" y="517" font-size="15" font-weight="400" fill="#162d3b">l’oraison.</text>
</g>
</svg>
