<svg xmlns="http://www.w3.org/2000/svg" width="840" height="353" viewBox="0 0 840 353" role="img" aria-labelledby="t d"><title id="t">Quand une bourse change qui entre dans la moyenne</title><desc id="d">Quarante élèves toujours inscrits ont un score moyen de 70 sans bourse et de 72 avec bourse. Vingt inscrits supplémentaires ont un score de 55 avec bourse. La moyenne des 60 inscrits avec bourse est 66,3.</desc><rect x="0" y="0" width="840" height="353" fill="#ffffff"/><text x="19" y="34" font-size="22" fill="#203446" font-weight="bold" text-anchor="start" font-family="DejaVu Sans,sans-serif">Quand une bourse change qui entre dans la moyenne</text><text x="20" y="63" font-size="17" fill="#426174" font-weight="normal" text-anchor="start" font-family="DejaVu Sans,sans-serif">Deux situations fictives pour une même cohorte de 100 élèves</text><text x="20" y="125" font-size="19" fill="#203446" font-weight="bold" text-anchor="start" font-family="DejaVu Sans,sans-serif">Sans bourse</text><rect x="185" y="94" width="320" height="53" fill="#006b65"/><text x="345" y="126" font-size="17" fill="white" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">40 inscrits • score moyen 70</text><text x="185" y="172" font-size="17" fill="#203446" font-weight="normal" text-anchor="start" font-family="DejaVu Sans,sans-serif">Moyenne des 40 inscrits : 70</text><text x="20" y="234" font-size="19" fill="#203446" font-weight="bold" text-anchor="start" font-family="DejaVu Sans,sans-serif">Avec bourse</text><rect x="185" y="201" width="320" height="53" fill="#006b65"/><rect x="505" y="201" width="160" height="53" fill="#c78849"/><text x="345" y="235" font-size="17" fill="white" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">40 inscrits • score moyen 72</text><text x="585" y="225" font-size="15" fill="#203446" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,sans-serif">20 entrants</text><text x="585" y="244" font-size="15" fill="#203446" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans,sans-serif">score moyen 55</text><text x="185" y="282" font-size="17" fill="#203446" font-weight="normal" text-anchor="start" font-family="DejaVu Sans,sans-serif">Moyenne des 60 inscrits : (40 × 72 + 20 × 55) / 60 ≈ 66,3</text><line x1="20" y1="303" x2="820" y2="303" stroke="#d4dfe3" stroke-width="1"/><text x="20" y="334" font-size="17" fill="#426174" font-weight="normal" text-anchor="start" font-family="DejaVu Sans,sans-serif">La longueur représente les effectifs. Le score est exprimé sur 100.</text></svg>
