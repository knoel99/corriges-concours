<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">D’une lecture à une question actuelle</title>
<desc id="description">L’ode de Sophocle Choisir un mot français pour deinon. Une traduction change le jugement porté sur la scène. Un dialogue de Cicéron Définir le peuple avant de traduire res publica. Une parenté de mots peut cacher un désaccord. La tablette de Severa Distinguer le contenu, les mains et le support. La transmission rend visibles certaines voix. Une réécriture d’Antigone Situer les choix de la pièce de 1944. Une tradition se construit aussi par transformation.</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">D’une lecture à une question actuelle</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Objet précis</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Décision à justifier</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce que j’en retire</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">L’ode de Sophocle</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Choisir un mot français</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">pour deinon.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Une traduction change le</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">jugement porté sur la</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">scène.</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Un dialogue de</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">Cicéron</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Définir le peuple avant de</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">traduire res publica.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Une parenté de mots peut</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">cacher un désaccord.</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">La tablette de Severa</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Distinguer le contenu, les</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">mains et le support.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La transmission rend</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">visibles certaines voix.</text>
<rect x="10" y="315" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">Une réécriture</text>
<text x="24" y="362" font-size="15" font-weight="700" fill="#162d3b">d’Antigone</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">Situer les choix de la</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">pièce de 1944.</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Une tradition se construit</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">aussi par transformation.</text>
</g>
</svg>
