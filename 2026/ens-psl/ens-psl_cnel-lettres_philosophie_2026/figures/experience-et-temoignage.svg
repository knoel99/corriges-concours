<svg xmlns="http://www.w3.org/2000/svg" width="165mm" height="142mm" viewBox="0 0 165 142"><title>Le fait, les raisons du témoin et celles des auditeurs</title>
<rect x="0" y="0" width="165" height="142" fill="#fbfaf5"/>
<text x="4" y="7" fill="#1d3836" font-family="DejaVu Sans" font-size="4.35" font-weight="700">Un même fait, quatre situations de jugement</text>
<text x="4" y="14" fill="#1d3836" font-family="DejaVu Sans" font-size="3.2" font-weight="400">De l’eau gelée peut porter le poids d’un homme.</text>
<rect x="4" y="20" width="68" height="32" fill="#dcece8"/>
<text x="7" y="26" fill="#1d3836" font-family="DejaVu Sans" font-size="3.35" font-weight="700">Le témoin voit la scène</text>
<text x="7" y="34" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="400">Évidence sensible directe.</text>
<text x="7" y="41" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="400">Il acquiert une connaissance</text>
<text x="7" y="47" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="400">du fait observé.</text>
<rect x="81" y="20" width="80" height="32" fill="#efe4cf"/>
<text x="84" y="26" fill="#1d3836" font-family="DejaVu Sans" font-size="3.35" font-weight="700">Les auditeurs reçoivent un récit</text>
<text x="84" y="34" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="400">Sans perception directe du fait, ils</text>
<text x="84" y="40" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="400">évaluent le témoignage et sa cohérence</text>
<text x="84" y="46" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="400">avec leur propre expérience.</text>
<path d="M72 36 L80 36" fill="none" stroke="#50726b" stroke-width="0.6"/>
<path d="M78.2 35 L80 36 L78.2 37" fill="none" stroke="#50726b" stroke-width="0.6"/>
<path d="M121 52 L121 58" fill="none" stroke="#50726b" stroke-width="0.6"/>
<path d="M120 56.2 L121 58 L122 56.2" fill="none" stroke="#50726b" stroke-width="0.6"/>
<rect x="4" y="59" width="157" height="16" fill="#ecf2ef"/>
<text x="7" y="65" fill="#1d3836" font-family="DejaVu Sans" font-size="3.25" font-weight="700">En Angleterre</text>
<text x="39" y="65" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="400">L’expérience des hivers confirme le récit.</text>
<text x="39" y="71" fill="#1d3836" font-family="DejaVu Sans" font-size="2.95" font-weight="400">La confiance demeure sensible à la crédibilité de la source.</text>
<rect x="4" y="77" width="157" height="16" fill="#ecf2ef"/>
<text x="7" y="83" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="700">Sous les tropiques</text>
<text x="47" y="83" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="400">Le phénomène est inédit pour cet auditeur.</text>
<text x="47" y="89" fill="#1d3836" font-family="DejaVu Sans" font-size="2.9" font-weight="400">Sa confiance dépend des témoins, de leur probité et de leur intérêt.</text>
<rect x="4" y="95" width="157" height="16" fill="#ecf2ef"/>
<text x="7" y="101" fill="#1d3836" font-family="DejaVu Sans" font-size="3.25" font-weight="700">Au Siam</text>
<text x="33" y="101" fill="#1d3836" font-family="DejaVu Sans" font-size="3.15" font-weight="400">Le roi oppose son expérience au récit de l’ambassadeur.</text>
<text x="33" y="107" fill="#1d3836" font-family="DejaVu Sans" font-size="2.95" font-weight="400">Il passe du doute sur la glace à l’accusation de mensonge.</text>
<path d="M83 111 L83 117" fill="none" stroke="#50726b" stroke-width="0.6"/>
<path d="M82 115.2 L83 117 L84 115.2" fill="none" stroke="#50726b" stroke-width="0.6"/>
<rect x="4" y="118" width="157" height="20" fill="#f0dfd3"/>
<text x="7" y="125" fill="#713e2d" font-family="DejaVu Sans" font-size="3.25" font-weight="700">Le problème soulevé par le corrigé</text>
<text x="7" y="132" fill="#1d3836" font-family="DejaVu Sans" font-size="2.98" font-weight="400">Quelles raisons autorisent à douter d’un fait, puis à imputer une intention de tromper ?</text>
</svg>
