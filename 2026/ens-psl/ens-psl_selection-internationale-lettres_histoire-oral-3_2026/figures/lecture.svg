<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="titre description">
<title id="titre">Ce que protège la constitution Habita</title>
<desc id="description">Aller étudier et séjourner ailleurs Protection des écoliers mobiles et de leurs représentants. Reconnaissance d’une condition particulière. Un compatriote a commis un délit Interdiction des représailles et sanctions des violations et négligences. La communauté d’origine ne suffit pas pour poursuivre. L’écolier est lui-même poursuivi Choix entre son maître et l’évêque de la cité. Une règle de compétence encadre le procès. Transmettre la décision Insertion dans les constitutions impériales. La protection entre dans le droit savant.</desc>
<rect width="720" height="430" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Ce que protège la constitution Habita</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Situation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Décision impériale</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Portée</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Aller étudier et</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">séjourner ailleurs</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Protection des écoliers</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">mobiles et de leurs</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">représentants.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Reconnaissance d’une</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">condition particulière.</text>
<rect x="10" y="181" width="700" height="105" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Un compatriote a</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">commis un délit</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Interdiction des</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">représailles et sanctions</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">des violations et</text>
<text x="229" y="272" font-size="15" font-weight="400" fill="#162d3b">négligences.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">La communauté d’origine ne</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">suffit pas pour poursuivre.</text>
<rect x="10" y="292" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="317" font-size="15" font-weight="700" fill="#162d3b">L’écolier est lui-</text>
<text x="24" y="339" font-size="15" font-weight="700" fill="#162d3b">même poursuivi</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">Choix entre son maître et</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">l’évêque de la cité.</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">Une règle de compétence</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">encadre le procès.</text>
<rect x="10" y="359" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="384" font-size="15" font-weight="700" fill="#162d3b">Transmettre la</text>
<text x="24" y="406" font-size="15" font-weight="700" fill="#162d3b">décision</text>
<text x="229" y="384" font-size="15" font-weight="400" fill="#162d3b">Insertion dans les</text>
<text x="229" y="406" font-size="15" font-weight="400" fill="#162d3b">constitutions impériales.</text>
<text x="473" y="384" font-size="15" font-weight="400" fill="#162d3b">La protection entre dans le</text>
<text x="473" y="406" font-size="15" font-weight="400" fill="#162d3b">droit savant.</text>
</g>
</svg>
