<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Trois dates, trois positions françaises</title>
<desc id="description">Février 1955 Une supposée mentalité de repli subsiste malgré le pacte américain. Rapprocher le voisin de l’Europe occidentale. Mai 1962 La demande au Marché commun est interprétée comme autodiscipline. Lire une évolution durable dans un geste limité. Mai 1965 L’exemple américain concurrence la perspective européenne. Devenir le guide de Madrid sans heurter sa souveraineté.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois dates, trois positions françaises</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Date du rapport</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Lecture de l’Espagne</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Enjeu pour la France</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Février 1955</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Une supposée mentalité de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">repli subsiste malgré le</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">pacte américain.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Rapprocher le voisin de</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">l’Europe occidentale.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Mai 1962</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">La demande au Marché</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">commun est interprétée</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">comme autodiscipline.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Lire une évolution durable</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">dans un geste limité.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Mai 1965</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">L’exemple américain</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">concurrence la perspective</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">européenne.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Devenir le guide de Madrid</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">sans heurter sa</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">souveraineté.</text>
</g>
</svg>
