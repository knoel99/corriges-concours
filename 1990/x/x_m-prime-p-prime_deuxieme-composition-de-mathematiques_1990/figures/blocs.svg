<svg xmlns="http://www.w3.org/2000/svg" width="680" height="248" viewBox="0 0 680 248"><rect width="680" height="248" fill="white"/><g font-family="DejaVu Sans" fill="#183d53"><text x="15" y="26" font-size="19">Décomposition selon E = V ⊕ W</text><g font-size="16" text-anchor="middle"><text x="152" y="64">entrée V</text><text x="265" y="64">entrée W</text><text x="54" y="118">sortie V</text><text x="54" y="185">sortie W</text><rect x="96" y="77" width="112" height="66" fill="#c9e5e0"/><rect x="209" y="77" width="112" height="66" fill="#f4e0cb"/><rect x="96" y="144" width="112" height="66" fill="#eef1f3"/><rect x="209" y="144" width="112" height="66" fill="#c9e5e0"/><text x="152" y="118">gᵥ</text><text x="265" y="118">B</text><text x="152" y="185">0</text><text x="265" y="185">qg | W</text></g><g font-size="15"><text x="345" y="100">La stabilité de V impose le bloc nul.</text><text x="345" y="135">Le bloc B décrit la composante dans V</text><text x="345" y="158">de l’image d’un vecteur de W.</text><text x="345" y="193">Le quotient se lit sur le bloc inférieur droit.</text></g></g></svg>