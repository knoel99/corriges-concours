<svg xmlns="http://www.w3.org/2000/svg" width="720" height="231" viewBox="0 0 720 231" role="img" aria-labelledby="titre description">
<title id="titre">Comparer les chiffres rapportés dans l’article</title>
<desc id="description">Femmes et hommes 45 à 49 ans. 3,6 %. Hommes 65 à 70 ans. 9,6 %. Femmes 65 à 70 ans. 7,4 %.</desc>
<rect width="720" height="231" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comparer les chiffres rapportés dans l’article</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Groupe</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Âge</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Recul cité</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Femmes et hommes</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">45 à 49 ans.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">3,6 %.</text>
<rect x="10" y="137" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Hommes</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">65 à 70 ans.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">9,6 %.</text>
<rect x="10" y="182" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="207" font-size="15" font-weight="700" fill="#162d3b">Femmes</text>
<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">65 à 70 ans.</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">7,4 %.</text>
</g>
</svg>
