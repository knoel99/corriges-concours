<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Quelle partie du portrait de Juan Carlos traduire ?</title>
<desc id="description">Début Revenu des ménages espagnols. Point de départ de la version. Fin demandée Première phrase sur Juan Carlos. Traduire jusqu’à « sociedad española ». Suite du portrait Téléphone, assurance, alimentation. Contexte pour discuter l’expression.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quelle partie du portrait de Juan Carlos traduire ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Position</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Contenu du feuillet</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Usage dans la copie</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Début</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Revenu des ménages</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">espagnols.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Point de départ de la</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">version.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Fin demandée</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Première phrase sur Juan</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Carlos.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Traduire jusqu’à « sociedad</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">española ».</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Suite du portrait</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Téléphone, assurance,</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">alimentation.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Contexte pour discuter</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">l’expression.</text>
</g>
</svg>
