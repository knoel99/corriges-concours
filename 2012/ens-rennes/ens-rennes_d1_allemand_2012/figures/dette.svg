<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="titre description">
<title id="titre">Trois montants dans la comptabilité des diplômés</title>
<desc id="description">50 000 livres Dette des deux diplômés. Somme à rembourser. 57 500 euros environ Même dette, autre monnaie. Équivalent indiqué par le texte. 4 500 livres Vingt premiers jours. Recettes déjà perçues.</desc>
<rect width="720" height="253" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois montants dans la comptabilité des diplômés</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Montant</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Période ou base</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Fonction</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">50 000 livres</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Dette des deux diplômés.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Somme à rembourser.</text>
<rect x="10" y="137" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">57 500 euros environ</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Même dette, autre monnaie.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Équivalent indiqué par le</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">texte.</text>
<rect x="10" y="204" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">4 500 livres</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Vingt premiers jours.</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Recettes déjà perçues.</text>
</g>
</svg>
