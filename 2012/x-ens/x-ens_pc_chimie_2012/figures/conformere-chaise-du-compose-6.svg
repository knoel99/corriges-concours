<text x="560.0" y="90.0" text-anchor="start" fill="#111111" font-size="13">Tz = 4,5-bis(éthoxycarbonyl)-</text>
<text x="560.0" y="108.0" text-anchor="start" fill="#111111" font-size="13">1,2,3-triazol-1-yle</text>
