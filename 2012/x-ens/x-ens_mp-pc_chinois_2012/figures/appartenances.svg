<svg xmlns="http://www.w3.org/2000/svg" width="740" height="202" viewBox="0 0 740 202" role="img"><title>Comment la pluralité des appartenances ouvre un espace de choix chez Mona Ozouf.</title><rect width="100%" height="100%" fill="#fafbf9"/>
