<text x="119" y="74" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#172e3b" text-anchor="middle" font-weight="700">Hériter</text>
<text x="119" y="112" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172e3b" text-anchor="middle" font-weight="400">Une famille, une langue,</text>
<text x="119" y="136" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172e3b" text-anchor="middle" font-weight="400">un lieu où grandir</text>
<text x="367" y="74" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#172e3b" text-anchor="middle" font-weight="700">Comparer</text>
<text x="367" y="112" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172e3b" text-anchor="middle" font-weight="400">Plusieurs liens font voir</text>
<text x="367" y="136" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172e3b" text-anchor="middle" font-weight="400">des usages différents</text>
<text x="619" y="74" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#172e3b" text-anchor="middle" font-weight="700">Choisir</text>
<text x="619" y="112" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172e3b" text-anchor="middle" font-weight="400">Cultiver une fidélité</text>
<text x="619" y="136" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172e3b" text-anchor="middle" font-weight="400">ou s’en déprendre</text>
