<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 326" font-family="DejaVu Sans, sans-serif" fill="#173e40"><title>De la plainte à la règle commune</title><desc>Sentir un manque Oranges détruites, familles affamées Une privation organisée Deux plaintes Oreste, fils de deux parents Une riposte crée un tort Éprouver une règle Tribunal et camp de Weedpatch Décider, puis vivre ensemble</desc><rect width="870" height="326" fill="#fbfaf4"/><text x="18" y="37" font-size="23" font-weight="700">De la plainte à la règle commune</text><rect x="15" y="60" width="840" height="75" rx="5" fill="#eaf1ec"/><path d="M27 72v50" stroke="#257265" stroke-width="4"/><text x="44" y="92" font-size="18" font-weight="700">Sentir un manque</text><text x="252" y="89" font-size="18" font-weight="700">Oranges détruites, familles affamées</text><text x="252" y="115" font-size="16" font-weight="400">Une privation organisée</text><rect x="15" y="146" width="840" height="75" rx="5" fill="#eaf1ec"/><path d="M27 158v50" stroke="#257265" stroke-width="4"/><text x="44" y="178" font-size="18" font-weight="700">Deux plaintes</text><text x="252" y="175" font-size="18" font-weight="700">Oreste, fils de deux parents</text><text x="252" y="201" font-size="16" font-weight="400">Une riposte crée un tort</text><rect x="15" y="232" width="840" height="75" rx="5" fill="#eaf1ec"/><path d="M27 244v50" stroke="#257265" stroke-width="4"/><text x="44" y="264" font-size="18" font-weight="700">Éprouver une règle</text><text x="252" y="261" font-size="18" font-weight="700">Tribunal et camp de Weedpatch</text><text x="252" y="287" font-size="16" font-weight="400">Décider, puis vivre ensemble</text></svg>
