<svg xmlns="http://www.w3.org/2000/svg" width="700" height="180" viewBox="0 0 700 180"><rect width="700" height="180" fill="white"/><g font-family="sans-serif" text-anchor="middle" fill="#183b49"><text x="350" y="24" font-size="19">Découpage de l’intégrale au seuil 1/x</text><rect x="8" y="42" width="333" height="125" rx="6" fill="#edf6f6" stroke="#397279"/><text x="174" y="72" font-size="17">Entre 0 et 1/x</text><text x="174" y="109" font-size="15">Comparer 1 − exp(−xλ) à xλ.</text><text x="174" y="141" font-size="15">La moyenne de |f|λ tend vers zéro.</text><rect x="358" y="42" width="333" height="125" rx="6" fill="#fbf4ea" stroke="#ac7047"/><text x="524" y="72" font-size="17">Au-delà de 1/x</text><text x="524" y="109" font-size="15">Utiliser λ(t) ≥ Kt et |f|λ ≤ ε.</text><text x="524" y="141" font-size="15">Après u = xt, la borne est uniforme.</text></g></svg>
