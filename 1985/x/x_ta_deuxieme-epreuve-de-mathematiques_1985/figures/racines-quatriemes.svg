<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img"><title>Racines quatrièmes et formule binomiale</title><desc>Sur le cercle unité, les points 1, i, −1 et −i sont aux distances 2, racine de 2, 0 et racine de 2 du point −1.</desc><rect width="720" height="290" fill="white"/><circle cx="150" cy="140" r="89" fill="none" stroke="#819396" stroke-width="2"/><path d="M40 140H265M150 27V251" fill="none" stroke="#a3b0b5"/><path d="M61 140L150 51M61 140L150 229" fill="none" stroke="#007575" stroke-width="3"/><path d="M61 140H239" stroke="#683e85" stroke-width="4"/><circle cx="61" cy="140" r="4" fill="#283e4d"/><text x="28" y="147" fill="#273a4a" font-family="sans-serif" font-size="16" text-anchor="start">−1</text><circle cx="239" cy="140" r="4" fill="#283e4d"/><text x="247" y="145" fill="#273a4a" font-family="sans-serif" font-size="16" text-anchor="start">1</text><circle cx="150" cy="51" r="4" fill="#283e4d"/><text x="159" y="48" fill="#273a4a" font-family="sans-serif" font-size="16" text-anchor="start">i</text><circle cx="150" cy="229" r="4" fill="#283e4d"/><text x="159" y="242" fill="#273a4a" font-family="sans-serif" font-size="16" text-anchor="start">−i</text><text x="330" y="69" fill="#273a4a" font-family="sans-serif" font-size="20" text-anchor="start">Distances au point −1</text><text x="330" y="111" fill="#683e85" font-family="sans-serif" font-size="20" text-anchor="start">Au point 1 : 2</text><text x="330" y="151" fill="#007575" font-family="sans-serif" font-size="20" text-anchor="start">Aux points i et −i : √2</text><text x="330" y="191" fill="#273a4a" font-family="sans-serif" font-size="20" text-anchor="start">Au point −1 : 0</text></svg>