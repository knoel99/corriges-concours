<svg xmlns="http://www.w3.org/2000/svg" width="640" height="112" viewBox="0 0 640 112"><title>Pour trois bits vrais parmi cinq, le dernier seuil vrai a l’indice 3. C’est la seule sortie active du code exact.</title><rect x="45" y="13" width="110" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="100" y="35" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">indice</text><rect x="185" y="13" width="330" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="350" y="35" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">0     1     2     3     4     5</text><rect x="45" y="50" width="110" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="100" y="72" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">seuil</text><rect x="185" y="50" width="330" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="350" y="72" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">1     1     1     1     0     0</text><rect x="45" y="84" width="110" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="100" y="106" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">exact</text><rect x="185" y="84" width="330" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="350" y="106" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">0     0     0     1     0     0</text></svg>
