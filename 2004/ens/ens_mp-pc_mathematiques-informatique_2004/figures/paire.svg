<svg xmlns="http://www.w3.org/2000/svg" width="640" height="130" viewBox="0 0 640 130"><title>Pour un ordre fixe de trois questions, les deux entrées d’une paire répondent de la même manière aux premières questions et diffèrent seulement à la dernière.</title><path d="M78 65 L246 65" stroke="#41667b" stroke-width="2.4"/><path d="M246 65 L466 33" stroke="#41667b" stroke-width="2.4"/><path d="M246 65 L466 102" stroke="#41667b" stroke-width="2.4"/><rect x="19" y="49" width="118" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="78" y="71" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">v₁ : oui</text><rect x="183.5" y="49" width="125" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="246" y="71" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">v₂ : non</text><rect x="337" y="17" width="258" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="466" y="39" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">v₃ : non  →  {v₁}</text><rect x="337" y="86" width="258" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="466" y="108" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">v₃ : oui  →  {v₁,v₃}</text></svg>
