<svg xmlns="http://www.w3.org/2000/svg" width="700" height="357" viewBox="0 0 700 357" role="img" aria-labelledby="tit des">
<title id="tit">Produits de facteurs définis positifs</title><desc id="des">Le quadrant positif est défini positif. Dans le quadrant négatif, seuls les scalaires négatifs demandent cinq facteurs. Une mise à l’échelle de la première entrée fait sortir de cette diagonale.</desc>
<rect width="700" height="357" fill="#fcfbf7"/>
<text x="20" y="29" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#263d43">Combien de facteurs pour une matrice diagonale ?</text>
<text x="22" y="53" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#263d43">En dimension 2, on représente diag(a,b) par le point (a,b).</text>
<rect x="75.80000000000001" y="203" width="129.2" height="107.19999999999999" fill="#e6edf2"/>
<rect x="205" y="89.10000000000001" width="136.8" height="113.89999999999999" fill="#d7ebe2"/>
<polyline points="68.20,203.00 349.40,203.00" fill="none" stroke="#586d68" stroke-width="1.3" />
<polyline points="205.00,320.25 205.00,79.05" fill="none" stroke="#586d68" stroke-width="1.3" />
<text x="352" y="199" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#263d43">a</text>
<text x="212" y="83" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#263d43">b</text>
<polyline points="85.68,308.19 203.10,204.68" fill="none" stroke="#a0412e" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="129" cy="270" r="5" fill="#a0412e"/>
<circle cx="167.0" cy="270" r="5" fill="#2c6674"/>
<polyline points="129.00,200.00 129.00,206.00" fill="none" stroke="#586d68" stroke-width="1" />
<text x="129" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#263d43">−1</text>
<polyline points="167.00,200.00 167.00,206.00" fill="none" stroke="#586d68" stroke-width="1" />
<text x="167.0" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#263d43">−½</text>
<polyline points="281.00,200.00 281.00,206.00" fill="none" stroke="#586d68" stroke-width="1" />
<text x="281" y="195" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="400" fill="#263d43">1</text>
<polyline points="133.28,270.00 159.28,270.00" fill="none" stroke="#3f6268" stroke-width="1.6" />
<polyline points="155.28,267.00 159.28,270.00 155.28,273.00" fill="none" stroke="#3f6268" stroke-width="1.4" />
<text x="385" y="100" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#263d43">Deux valeurs positives</text>
<text x="385" y="123" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#263d43">La matrice est définie positive.</text>
<text x="385" y="161" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#263d43">Deux valeurs négatives distinctes</text>
<text x="385" y="183" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#263d43">Quatre facteurs suffisent.</text>
<text x="385" y="221" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#263d43">Diagonale rouge</text>
<text x="385" y="242" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#263d43">Les scalaires négatifs exigent</text>
<text x="385" y="262" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="400" fill="#263d43">un cinquième facteur.</text>
<text x="42" y="340" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#263d43">(−1,−1) → (−½,−1) par multiplication par diag(½,1).</text>
</svg>
