<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Three voices in a debate about English</title>
<desc id="description">Narrator An informal filler in the opening. Introduces the debate with humour. Queen’s English Society A collective statement in quotation marks. Advocates an accepted standard. Candidate A concrete contrast between uses. Judges what protection could achieve.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Three voices in a debate about English</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voice</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Language signal</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Stance</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Narrator</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">An informal filler in the</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">opening.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Introduces the debate with</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">humour.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Queen’s English</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Society</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">A collective statement in</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">quotation marks.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Advocates an accepted</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">standard.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Candidate</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">A concrete contrast</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">between uses.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Judges what protection</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">could achieve.</text>
</g>
</svg>
