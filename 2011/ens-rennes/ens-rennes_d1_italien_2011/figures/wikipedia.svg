<svg xmlns="http://www.w3.org/2000/svg" width="720" height="253" viewBox="0 0 720 253" role="img" aria-labelledby="titre description">
<title id="titre">Trois mesures de Wikipédia en janvier 2011</title>
<desc id="description">Audience 410 millions par mois. Lecteurs. Contenu 17 millions. Articles. Couverture linguistique 270. Langues de rédaction.</desc>
<rect width="720" height="253" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois mesures de Wikipédia en janvier 2011</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Mesure</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Valeur dans le texte</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Objet compté</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Audience</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">410 millions par mois.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Lecteurs.</text>
<rect x="10" y="137" width="700" height="39" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Contenu</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">17 millions.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Articles.</text>
<rect x="10" y="182" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="207" font-size="15" font-weight="700" fill="#162d3b">Couverture</text>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">linguistique</text>
<text x="229" y="207" font-size="15" font-weight="400" fill="#162d3b">270.</text>
<text x="473" y="207" font-size="15" font-weight="400" fill="#162d3b">Langues de rédaction.</text>
</g>
</svg>
