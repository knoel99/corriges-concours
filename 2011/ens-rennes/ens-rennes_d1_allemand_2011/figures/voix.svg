<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois points de vue sur une manifestation</title>
<desc id="description">La journaliste Avant le passage du convoi. Décrit le sentiment de Martina. Martina Souvenir de sa scolarité. Se rappelle le sentiment d’être du bon côté. Niklas Avant le rassemblement du samedi. Explique comment sa compréhension a changé.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois points de vue sur une manifestation</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voix</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Indice de lecture</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">La journaliste</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Avant le passage du</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">convoi.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Décrit le sentiment de</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">Martina.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Martina</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Souvenir de sa scolarité.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Se rappelle le sentiment</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">d’être du bon côté.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Niklas</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Avant le rassemblement du</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">samedi.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Explique comment sa</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">compréhension a changé.</text>
</g>
</svg>
