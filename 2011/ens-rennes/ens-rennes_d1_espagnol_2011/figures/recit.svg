<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">¿En qué orden conoce el lector los hechos?</title>
<desc id="description">Apertura Ángeles intenta hablar y Luis la ayuda. El lector percibe las consecuencias. Segundo párrafo La pareja sale del tribunal. La sentencia identifica la responsabilidad jurídica. Vuelta al pasado Las horas en el hospital en 2001. La espera se lee a la luz de sus consecuencias.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">¿En qué orden conoce el lector los hechos?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lugar en el relato</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Escena</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Efecto</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Apertura</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Ángeles intenta hablar y</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Luis la ayuda.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">El lector percibe las</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">consecuencias.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Segundo párrafo</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La pareja sale del</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">tribunal.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La sentencia identifica la</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">responsabilidad jurídica.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Vuelta al pasado</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Las horas en el hospital</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">en 2001.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La espera se lee a la luz</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">de sus consecuencias.</text>
</g>
</svg>
