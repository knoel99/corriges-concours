<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Trois regards dans la maison racontée par l’enfant.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">La voisine</text>
<text x="27" y="123" font-size="16">Dona Libânia sait même</text>
<text x="27" y="145" font-size="16">ce qui arrive hors de sa</text>
<text x="27" y="167" font-size="16">vue.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">À table</text>
<text x="298" y="123" font-size="16">Grand-mère Catarina</text>
<text x="298" y="145" font-size="16">observe les enfants et</text>
<text x="298" y="167" font-size="16">règle leurs gestes.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">À la fenêtre</text>
<text x="569" y="123" font-size="16">Le regard de l’enfant</text>
<text x="569" y="145" font-size="16">compose une photographie</text>
<text x="569" y="167" font-size="16">avec la chouette et la</text>
<text x="569" y="189" font-size="16">lune.</text>
</g></svg>
