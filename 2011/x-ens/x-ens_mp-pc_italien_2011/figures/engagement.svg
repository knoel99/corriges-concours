<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Le même soir du 31 décembre envisagé par deux personnages.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Projet commun</text>
<text x="27" y="123" font-size="16">Quelques mois plus tôt,</text>
<text x="27" y="145" font-size="16">ils imaginaient ensemble</text>
<text x="27" y="167" font-size="16">la fête à l’auberge.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Pour Giuseppe</text>
<text x="298" y="123" font-size="16">Il fixe déjà la tenue,</text>
<text x="298" y="145" font-size="16">le trajet en voiture, le</text>
<text x="298" y="167" font-size="16">vin et la danse.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Pour Violaine</text>
<text x="569" y="123" font-size="16">Un rappel à Turin reste</text>
<text x="569" y="145" font-size="16">possible. Elle refuse de</text>
<text x="569" y="167" font-size="16">s’engager.</text>
</g></svg>
