<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>L’écart entre le lieu de naissance de Iouri et la patrie qu’il se reconnaît.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">1928</text>
<text x="27" y="123" font-size="16">Après dix ans au volant</text>
<text x="27" y="145" font-size="16">d’un taxi parisien, le</text>
<text x="27" y="167" font-size="16">père achète une ferme en</text>
<text x="27" y="189" font-size="16">Bretagne.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">1929 puis 1930</text>
<text x="298" y="123" font-size="16">Il y amène son épouse</text>
<text x="298" y="145" font-size="16">russe. Leur fils naît au</text>
<text x="298" y="167" font-size="16">printemps suivant.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Le départ</text>
<text x="569" y="123" font-size="16">Iouri vend la ferme pour</text>
<text x="569" y="145" font-size="16">gagner une Russie où il</text>
<text x="569" y="167" font-size="16">n’a encore jamais</text>
<text x="569" y="189" font-size="16">séjourné.</text>
</g></svg>
