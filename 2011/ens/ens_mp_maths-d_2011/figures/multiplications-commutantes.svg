<svg xmlns="http://www.w3.org/2000/svg" width="595" height="192" viewBox="0 0 595 192" role="img" aria-labelledby="titre desc"><title id="titre">Multiplications par X et Y</title><desc id="desc">Le vecteur 1 se dirige vers X et Y. Ces deux branches aboutissent à XY par les deux compositions commutatives.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#19566a"/></marker></defs><g fill="none" stroke="#19566a" stroke-width="2" marker-end="url(#a)"><path d="M96 90 L244 38"/><path d="M96 105 L244 153"/><path d="M299 37 L464 90"/><path d="M299 154 L464 105"/></g><g font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="19"><text x="76" y="103">1</text><text x="270" y="39">X</text><text x="270" y="162">Y</text><text x="496" y="105">XY</text><g font-size="15" fill="#794323"><text x="165" y="55">u</text><text x="166" y="149">v</text><text x="392" y="54">v</text><text x="392" y="151">u</text></g></g></svg>
