<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Du comportement de l’effendi au droit de recours de l’usager.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Au bureau</text>
<text x="27" y="123" font-size="16">Arrivée tardive. Le</text>
<text x="27" y="145" font-size="16">registre est déjà chez</text>
<text x="27" y="167" font-size="16">le chef.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">À la conférence</text>
<text x="298" y="123" font-size="16">La machine doit</text>
<text x="298" y="145" font-size="16">fonctionner. Le</text>
<text x="298" y="167" font-size="16">serviteur doit rendre un</text>
<text x="298" y="189" font-size="16">service.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Devant le contrôle</text>
<text x="569" y="123" font-size="16">Une plainte déclenche</text>
<text x="569" y="145" font-size="16">une enquête. L’agent</text>
<text x="569" y="167" font-size="16">rend des comptes.</text>
</g></svg>
