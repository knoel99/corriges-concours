<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 179" width="740" height="179" role="img"><title>Comment la réflexion d’un élève devient une discussion entre camarades au lycée de Kōchi.</title><rect width="100%" height="100%" fill="#fbfcfa"/><g font-family="DejaVu Sans, sans-serif" fill="#1b303b">
<rect x="10" y="24" width="222" height="126" rx="7" fill="#e3eef0"/>
<text x="121" y="66" font-size="21" text-anchor="middle" font-weight="700">Lire</text>
<text x="121" y="99" font-size="16" text-anchor="middle" font-weight="400">Le témoignage</text>
<text x="121" y="122" font-size="16" text-anchor="middle" font-weight="400">d’une personnalité</text>
<rect x="257" y="24" width="222" height="126" rx="7" fill="#edf0e6"/>
<text x="368" y="66" font-size="21" text-anchor="middle" font-weight="700">Prendre la parole</text>
<text x="368" y="99" font-size="16" text-anchor="middle" font-weight="400">Un élève le relie</text>
<text x="368" y="122" font-size="16" text-anchor="middle" font-weight="400">à sa propre expérience</text>
<rect x="505" y="24" width="222" height="126" rx="7" fill="#f4eadf"/>
<text x="616" y="66" font-size="21" text-anchor="middle" font-weight="700">Partager</text>
<text x="616" y="99" font-size="16" text-anchor="middle" font-weight="400">Le groupe discute</text>
<text x="616" y="122" font-size="16" text-anchor="middle" font-weight="400">avec l’appui de l’adulte</text>
