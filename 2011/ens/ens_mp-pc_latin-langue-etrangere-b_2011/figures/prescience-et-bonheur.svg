<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 230" width="740" height="230" role="img"><title>À quel moment la connaissance de leur fin aurait-elle atteint les quatre personnages ?</title><rect width="100%" height="100%" fill="#fbfcfa"/><g font-family="DejaVu Sans, sans-serif" fill="#1b303b">
<text x="16" y="29" font-size="18" text-anchor="start" font-weight="700">Personnage</text>
<text x="172" y="29" font-size="18" text-anchor="start" font-weight="700">Une vie encore ouverte</text>
<text x="420" y="29" font-size="18" text-anchor="start" font-weight="700">Ce que l’avenir réserve</text>
<rect x="8" y="42" width="724" height="38" rx="7" fill="#e3eef0"/>
<text x="16" y="67" font-size="16" text-anchor="start" font-weight="700">Priam</text>
<text x="172" y="67" font-size="16" text-anchor="start" font-weight="400">Sa jeunesse</text>
<text x="420" y="67" font-size="16" text-anchor="start" font-weight="400">Les épreuves du vieil âge</text>
<rect x="8" y="86" width="724" height="38" rx="7" fill="#edf0e6"/>
<text x="16" y="111" font-size="16" text-anchor="start" font-weight="700">Crassus</text>
<text x="172" y="111" font-size="16" text-anchor="start" font-weight="400">Fortune et puissance</text>
<text x="420" y="111" font-size="16" text-anchor="start" font-weight="400">La perte des siens et la mort</text>
<rect x="8" y="130" width="724" height="38" rx="7" fill="#e3eef0"/>
<text x="16" y="155" font-size="16" text-anchor="start" font-weight="700">Pompée</text>
<text x="172" y="155" font-size="16" text-anchor="start" font-weight="400">Consulats et triomphes</text>
<text x="420" y="155" font-size="16" text-anchor="start" font-weight="400">La défaite, puis la fin en Égypte</text>
<rect x="8" y="174" width="724" height="38" rx="7" fill="#edf0e6"/>
<text x="16" y="199" font-size="16" text-anchor="start" font-weight="700">César</text>
<text x="172" y="199" font-size="16" text-anchor="start" font-weight="400">Les honneurs qu’il accorde</text>
<text x="420" y="199" font-size="16" text-anchor="start" font-weight="400">La trahison au Sénat</text></g></svg>
