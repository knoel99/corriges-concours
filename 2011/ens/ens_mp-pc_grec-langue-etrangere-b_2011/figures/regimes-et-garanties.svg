<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 208" width="740" height="208" role="img"><title>Les garanties et les dangers qu’Eschine associe aux deux types de régime.</title><rect width="100%" height="100%" fill="#fbfcfa"/><g font-family="DejaVu Sans, sans-serif" fill="#1b303b">
<text x="18" y="29" font-size="18" text-anchor="start" font-weight="700">Régime</text>
<text x="244" y="29" font-size="18" text-anchor="start" font-weight="700">Protection</text>
<text x="470" y="29" font-size="18" text-anchor="start" font-weight="700">Menace selon l’orateur</text>
<rect x="8" y="44" width="724" height="66" rx="7" fill="#edf0e4"/>
<text x="18" y="82" font-size="17" text-anchor="start" font-weight="400">Tyrannie, oligarchie</text>
<text x="244" y="70" font-size="17" text-anchor="start" font-weight="400">Défiance,</text>
<text x="244" y="92" font-size="17" text-anchor="start" font-weight="400">garde armée</text>
<text x="470" y="70" font-size="17" text-anchor="start" font-weight="400">Le renversement</text>
<text x="470" y="92" font-size="17" text-anchor="start" font-weight="400">par la force</text>
<rect x="8" y="123" width="724" height="66" rx="7" fill="#e2ecef"/>
<text x="18" y="161" font-size="17" text-anchor="start" font-weight="400">Démocratie</text>
<text x="244" y="161" font-size="17" text-anchor="start" font-weight="400">Lois en vigueur</text>
<text x="470" y="149" font-size="17" text-anchor="start" font-weight="400">Des paroles ou des actes</text>
<text x="470" y="171" font-size="17" text-anchor="start" font-weight="400">contraires aux lois</text></g></svg>
