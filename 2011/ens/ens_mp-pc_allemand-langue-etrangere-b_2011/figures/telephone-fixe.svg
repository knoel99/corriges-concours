<svg xmlns="http://www.w3.org/2000/svg" width="820" height="231" viewBox="0 0 820 231" role="img">
<title>Pourquoi le téléphone fixe ne suffit pas</title><desc>Le téléphone fixe est autorisé, mais la possibilité matérielle d’appeler ne suffit pas à établir un contact.</desc>
<rect width="820" height="231" fill="#f7f6f0" rx="14"/>
<text x="24" y="42" fill="#152535" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold">Pourquoi le téléphone fixe ne suffit pas</text>
<rect x="22" y="66" width="249" height="145" rx="10" fill="#ffffff" stroke="#cad2d4"/>
<path d="M35 81 H87" stroke="#12566a" stroke-width="5"/>
<text x="35" y="112" fill="#12566a" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold">Autorisé</text>
<text x="35" y="149" fill="#182d3b" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">das Festnetztelefon</text>
<text x="35" y="180" fill="#384750" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Le poste est disponible.</text>
<rect x="285" y="66" width="249" height="145" rx="10" fill="#ffffff" stroke="#cad2d4"/>
<path d="M298 81 H350" stroke="#984826" stroke-width="5"/>
<text x="298" y="112" fill="#984826" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold">Obstacle</text>
<text x="298" y="149" fill="#182d3b" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">keine Nummer auswendig</text>
<text x="298" y="180" fill="#384750" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Elle ignore les numéros.</text>
<rect x="548" y="66" width="249" height="145" rx="10" fill="#ffffff" stroke="#cad2d4"/>
<path d="M561 81 H613" stroke="#485987" stroke-width="5"/>
<text x="561" y="112" fill="#485987" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold">Conséquence</text>
<text x="561" y="149" fill="#182d3b" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">auf einen Anruf warten</text>
<text x="561" y="180" fill="#384750" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal">Elle attend un appel.</text>
</svg>
