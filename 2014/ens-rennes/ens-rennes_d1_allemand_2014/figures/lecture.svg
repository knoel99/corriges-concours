<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Deux parcours, deux chronologies</title>
<desc id="description">Avant de partir Offre interne chez Henkel. Démission et candidatures. Départ Trois mois de préparation. Déplacement pour prospecter. Issue Installation en Asie. Prise de poste encore conditionnelle.</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux parcours, deux chronologies</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Alexander Altmann</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Manuela S.</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Avant de partir</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Offre interne chez Henkel.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Démission et candidatures.</text>
<rect x="10" y="137" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Départ</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Trois mois de préparation.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Déplacement pour</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">prospecter.</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Issue</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Installation en Asie.</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Prise de poste encore</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">conditionnelle.</text>
</g>
</svg>
