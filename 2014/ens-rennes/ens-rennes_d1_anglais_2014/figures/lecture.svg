<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">What can a final stop suggest?</title>
<desc id="description">Short reply after an argument The sender might want to end the discussion. Does this person usually omit the stop? Carefully punctuated correspondence The stop can simply close a sentence. What does this writing situation require? Switch to a longer email Boundaries help the reader follow an argument. Is the sign guiding the reader through syntax?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What can a final stop suggest?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Reader’s cue</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Likely inference</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">What to check</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Short reply after an</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">argument</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">The sender might want to</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">end the discussion.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Does this person usually</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">omit the stop?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Carefully punctuated</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">correspondence</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">The stop can simply close</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">a sentence.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">What does this writing</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">situation require?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Switch to a longer</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">email</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Boundaries help the reader</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">follow an argument.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Is the sign guiding the</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">reader through syntax?</text>
</g>
</svg>
