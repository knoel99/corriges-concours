<rect x="450.0" y="136.0" width="22.0" height="68.0" fill="#bbbbbb" stroke="#222222" stroke-width="1.4"/>
<text x="460.0" y="128.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">palier A</text>
<text x="460.0" y="222.0" font-family="sans-serif" font-size="11" fill="#888888" text-anchor="middle">(axe y)</text>
<rect x="682.0" y="179.0" width="16.0" height="80.0" fill="#bbbbbb" stroke="#222222" stroke-width="1.4"/>
<text x="676.0" y="230.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="end">axe de roue</text>
<rect x="656.0" y="232.0" width="68.0" height="26.0" fill="#f3f3f3" stroke="#222222" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="690.0" y="274.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">roue (plan médian)</text>
<circle cx="690.0" cy="245.0" r="8.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="690.0" cy="245.0" r="2.6" fill="#c0392b" stroke="#c0392b" stroke-width="0.5"/>
<text x="704.0" y="249.0" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">F</text>
<line x1="430.0" y1="170.0" x2="735.0" y2="170.0" stroke="#888888" stroke-width="1.0" stroke-dasharray="8 3 2 3"/>
<polygon points="740.0,170.0 731.0,166.4 731.0,173.6" fill="#888888"/>
<text x="744.0" y="174.0" font-family="sans-serif" font-size="12" fill="#888888" text-anchor="start">x<tspan font-size="75%" dy="3.5">3</tspan></text>
<line x1="529.0" y1="220.0" x2="529.0" y2="105.0" stroke="#888888" stroke-width="1.0"/>
<polygon points="529.0,100.0 525.4,109.0 532.6,109.0" fill="#888888"/>
<text x="535.0" y="106.0" font-family="sans-serif" font-size="12" fill="#888888" text-anchor="start">y</text>
<line x1="716.0" y1="170.0" x2="716.0" y2="245.0" stroke="#222222" stroke-width="0.9"/>
<line x1="711.0" y1="170.0" x2="721.0" y2="170.0" stroke="#222222" stroke-width="0.9"/>
<line x1="711.0" y1="245.0" x2="721.0" y2="245.0" stroke="#222222" stroke-width="0.9"/>
<text x="722.0" y="212.0" font-family="sans-serif" font-size="13" fill="#222222" text-anchor="start">δ</text>
<text x="440.0" y="345.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="start">F est déportée de δ suivant y :</text>
<text x="440.0" y="363.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="start">torsion du bras, M<tspan font-size="75%" dy="3.5">t</tspan><tspan dx="3.4" dy="-3.5">= F·δ·cos α, autour de x</tspan><tspan font-size="75%" dy="3.5">3</tspan><tspan dy="-3.5">,</tspan></text>
<text x="440.0" y="381.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="start">et flexion autour de z<tspan font-size="75%" dy="3.5">3</tspan><tspan dx="3.4" dy="-3.5">si un effort latéral</tspan></text>
<text x="440.0" y="399.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="start">(dérapage, vent) s'exerce sur la roue.</text>
