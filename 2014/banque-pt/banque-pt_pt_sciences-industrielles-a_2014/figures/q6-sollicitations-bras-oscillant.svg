<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<text x="20.0" y="24.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Vue dans le plan de symétrie (x<tspan font-size="75%" dy="3.5">g</tspan><tspan dy="-3.5">, z</tspan><tspan font-size="75%" dy="3.5">g</tspan><tspan dy="-3.5">)</tspan></text>
<line x1="70.0" y1="150.0" x2="286.1" y2="228.7" stroke="#222222" stroke-width="7.0"/>
