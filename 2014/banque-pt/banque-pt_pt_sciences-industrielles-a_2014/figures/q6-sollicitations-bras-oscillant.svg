<text x="359.4" y="261.3" font-family="sans-serif" font-size="12" fill="#888888" text-anchor="start">x<tspan font-size="75%" dy="3.5">3</tspan></text>
<text x="132.0" y="167.0" font-family="sans-serif" font-size="12" fill="#888888" text-anchor="middle">α</text>
<line x1="286.1" y1="323.7" x2="286.1" y2="241.7" stroke="#c0392b" stroke-width="2.2"/>
<polygon points="286.1,236.7 282.5,245.7 289.7,245.7" fill="#c0392b"/>
<text x="294.1" y="308.7" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="start">F (sol → roue → bras)</text>
<line x1="199.7" y1="87.2" x2="199.7" y2="184.2" stroke="#1f5fa8" stroke-width="2.2"/>
<polygon points="199.7,189.2 203.3,180.2 196.1,180.2" fill="#1f5fa8"/>
<text x="207.7" y="102.2" font-family="sans-serif" font-size="12" fill="#1f5fa8" text-anchor="start">F<tspan font-size="75%" dy="3.5">C</tspan><tspan dx="3.4" dy="-3.5">= F·(a+b)/a  (vérin)</tspan></text>
<line x1="70.0" y1="220.0" x2="70.0" y2="163.0" stroke="#2e7d32" stroke-width="2.2"/>
<polygon points="70.0,158.0 66.4,167.0 73.6,167.0" fill="#2e7d32"/>
<text x="64.0" y="238.0" font-family="sans-serif" font-size="12" fill="#2e7d32" text-anchor="start">F<tspan font-size="75%" dy="3.5">A</tspan><tspan dx="3.4" dy="-3.5">= F·b/a  (pivot)</tspan></text>
<text x="20.0" y="345.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="start">Trois forces parallèles : poutre sur deux appuis en porte-à-faux.</text>
<text x="20.0" y="363.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="start">Flexion autour de y, maximale en C : M<tspan font-size="75%" dy="3.5">f</tspan><tspan dx="3.4" dy="-3.5">= F·b·cos α.</tspan></text>
<text x="20.0" y="381.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="start">Composantes suivant x<tspan font-size="75%" dy="3.5">3</tspan><tspan dx="3.4" dy="-3.5">: effort normal F·sin α (traction-compression).</tspan></text>
<text x="20.0" y="399.0" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="start">Composantes suivant z<tspan font-size="75%" dy="3.5">3</tspan><tspan dx="3.4" dy="-3.5">: effort tranchant.</tspan></text>
<line x1="420.0" y1="10.0" x2="420.0" y2="420.0" stroke="#888888" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="440.0" y="24.0" font-family="sans-serif" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">Vue suivant z<tspan font-size="75%" dy="3.5">3</tspan><tspan dx="3.9" dy="-3.5">: plan (x</tspan><tspan font-size="75%" dy="3.5">3</tspan><tspan dy="-3.5">, y)</tspan></text>
