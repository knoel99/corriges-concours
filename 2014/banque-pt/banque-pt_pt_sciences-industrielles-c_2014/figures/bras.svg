<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="465" height="230" viewBox="0 0 465 230"><defs><pattern id="hach" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 6L6 0" stroke="#7a9299" stroke-width=".8"/></pattern><marker id="ar" orient="auto-start-reverse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" viewBox="0 0 6 6"><path d="M0 0L6 3 0 6Z" fill="context-stroke"/></marker></defs><text x="6" y="20" font-family="DejaVu Sans" font-size="15" fill="#183d52" text-anchor="start">Fixation du bras sur la bride, côté rotor</text><circle cx="115" cy="135" r="81" fill="none" stroke="#183d52" stroke-width="1.5"/><circle cx="115" cy="135" r="62" fill="none" stroke="#183d52" stroke-width="0.8"/><g transform="translate(115 135) rotate(0)"><path d="M-13 -4Q-18 -43 -23 -60L-16 -79H16L23 -60Q17 -44 13 -4Z" fill="#d9eaf0" stroke="#0c5087" stroke-width="1.2" /><circle cx="-10" cy="-68" r="3.5" fill="white" stroke="#183d52" stroke-width="1"/><circle cx="10" cy="-68" r="3.5" fill="white" stroke="#183d52" stroke-width="1"/></g><g transform="translate(115 135) rotate(120)"><path d="M-13 -4Q-18 -43 -23 -60L-16 -79H16L23 -60Q17 -44 13 -4Z" fill="#d9eaf0" stroke="#0c5087" stroke-width="1.2" /><circle cx="-10" cy="-68" r="3.5" fill="white" stroke="#183d52" stroke-width="1"/><circle cx="10" cy="-68" r="3.5" fill="white" stroke="#183d52" stroke-width="1"/></g><g transform="translate(115 135) rotate(240)"><path d="M-13 -4Q-18 -43 -23 -60L-16 -79H16L23 -60Q17 -44 13 -4Z" fill="#d9eaf0" stroke="#0c5087" stroke-width="1.2" /><circle cx="-10" cy="-68" r="3.5" fill="white" stroke="#183d52" stroke-width="1"/><circle cx="10" cy="-68" r="3.5" fill="white" stroke="#183d52" stroke-width="1"/></g><circle cx="115" cy="135" r="23" fill="#e0ebe1" stroke="#086854" stroke-width="1.3"/><text x="220" y="69" font-family="DejaVu Sans" font-size="13" fill="#183d52" text-anchor="start">Vue axiale. Trois bras à 120°.</text><text x="220" y="86" font-family="DejaVu Sans" font-size="13" fill="#183d52" text-anchor="start">Pied élargi, deux boulons figurés</text><text x="220" y="103" font-family="DejaVu Sans" font-size="13" fill="#183d52" text-anchor="start">par bras sur cette proposition.</text><text x="220" y="120" font-family="DejaVu Sans" font-size="13" fill="#183d52" text-anchor="start">Appui plan et centrage court.</text><text x="220" y="137" font-family="DejaVu Sans" font-size="13" fill="#183d52" text-anchor="start">Les portées de roulement sont</text><text x="220" y="154" font-family="DejaVu Sans" font-size="13" fill="#183d52" text-anchor="start">distinctes de cette fixation.</text></svg>