<svg xmlns="http://www.w3.org/2000/svg" width="750" height="189" viewBox="0 0 750 189" role="img">
<title>Quelles charges subsistent après la suppression du retour ?</title>
<rect width="750" height="189" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="17" y="26" font-size="20" font-weight="bold" fill="#192e46">Quelles charges subsistent après la suppression du retour ?</text>
<rect x="12" y="40" width="233" height="40" rx="4" fill="#d9eae9"/>
<text x="24" y="66" font-size="17" font-weight="bold" fill="#174547">Pendant le voyage</text>
<path d="M250 60h21m-7 -5 7 5 -7 5" fill="none" stroke="#456c72" stroke-width="2"/>
<rect x="279" y="40" width="458" height="40" rx="4" fill="#edf0f5"/>
<text x="292" y="66" font-size="17" fill="#192e46">Le rayonnement demeure un risque.</text>
<rect x="12" y="88" width="233" height="40" rx="4" fill="#d9eae9"/>
<text x="24" y="114" font-size="17" font-weight="bold" fill="#174547">À la surface</text>
<path d="M250 108h21m-7 -5 7 5 -7 5" fill="none" stroke="#456c72" stroke-width="2"/>
<rect x="279" y="88" width="458" height="40" rx="4" fill="#edf0f5"/>
<text x="292" y="114" font-size="17" fill="#192e46">Soins et ravitaillement restent nécessaires.</text>
<rect x="12" y="136" width="233" height="40" rx="4" fill="#d9eae9"/>
<text x="24" y="162" font-size="17" font-weight="bold" fill="#174547">Sur Terre</text>
<path d="M250 156h21m-7 -5 7 5 -7 5" fill="none" stroke="#456c72" stroke-width="2"/>
<rect x="279" y="136" width="458" height="40" rx="4" fill="#edf0f5"/>
<text x="292" y="162" font-size="17" fill="#192e46">Les futurs financeurs gardent une obligation.</text>
</g></svg>
