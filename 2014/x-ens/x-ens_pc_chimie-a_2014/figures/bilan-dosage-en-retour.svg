<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="sans-serif" font-size="15">
<rect width="700" height="250" fill="#ffffff"/>
<text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold">Ions argent introduits : 1,50 mmol (15,0 mL à 0,1 mol/L)</text>
<path d="M50 50 L50 42 L650 42 L650 50" fill="none" stroke="#333" stroke-width="1.5"/>
<rect x="50" y="70" width="256" height="70" fill="#c9d6ea" stroke="#1f3a5f" stroke-width="1.5"/>
<rect x="306" y="70" width="344" height="70" fill="#f3d9b1" stroke="#7a4b00" stroke-width="1.5"/>
<text x="178" y="100" text-anchor="middle" font-weight="bold">0,64 mmol</text>
<text x="178" y="122" text-anchor="middle">précipités en AgCl</text>
<text x="478" y="100" text-anchor="middle" font-weight="bold">0,86 mmol</text>
<text x="478" y="122" text-anchor="middle">en excès dans le filtrat</text>
<text x="178" y="168" text-anchor="middle" font-size="14">= quantité d'ions chlorure</text>
<text x="178" y="188" text-anchor="middle" font-size="14">de la prise d'essai (10,0 mL)</text>
<text x="478" y="168" text-anchor="middle" font-size="14">titrés par le thiocyanate :</text>
<text x="478" y="188" text-anchor="middle" font-size="14">17,2 mL à 0,05 mol/L (précipité AgSCN)</text>
<text x="350" y="230" text-anchor="middle" font-size="15">n(chlorure) = 1,50 − 0,86 = 0,64 mmol, soit 6,4 × 10⁻² mol/L</text>
</svg>