<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Trois questions à poser aux observations du dossier.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Accéder à l’école</text>
<text x="27" y="123" font-size="16">Documents 2 et 3.</text>
<text x="27" y="145" font-size="16">Distinguer inscription,</text>
<text x="27" y="167" font-size="16">poursuite des études et</text>
<text x="27" y="189" font-size="16">alphabétisation.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Apprendre en classe</text>
<text x="298" y="123" font-size="16">Documents 1 et 4. Relier</text>
<text x="298" y="145" font-size="16">le cartable démesuré au</text>
<text x="298" y="167" font-size="16">poids des programmes.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Mobiliser ses acquis</text>
<text x="569" y="123" font-size="16">Documents 1 à 3. Relier</text>
<text x="569" y="145" font-size="16">les filières et les</text>
<text x="569" y="167" font-size="16">moyens de recherche aux</text>
<text x="569" y="189" font-size="16">besoins du pays.</text>
</g></svg>
