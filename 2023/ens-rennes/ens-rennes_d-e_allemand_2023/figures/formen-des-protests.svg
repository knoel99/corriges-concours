<svg xmlns="http://www.w3.org/2000/svg" width="870" height="345" viewBox="0 0 870 345" role="img"><title>Wer protestiert und mit welchem Ziel?</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Wer protestiert und mit welchem Ziel?</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Akteure</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Aktion</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Ziel</text><rect x="12" y="84" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Fußballkneipen</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Keine Übertragung,</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">stattdessen Quiz oder</text><text x="225" y="158" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Lesung</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Gemeinschaft ohne Werbung für die</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">WM.</text><rect x="12" y="175" width="842" height="67" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Faninitiativen</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Banner und selbst</text><text x="225" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">organisierte Spiele</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Eine andere Fußballkultur über das</text><text x="505" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Turnier hinaus.</text><rect x="12" y="242" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Initiative Romero</text><text x="225" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Kritik an den</text><text x="225" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Lieferketten großer</text><text x="225" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Sportfirmen</text><text x="505" y="268" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Bessere Arbeitsbedingungen auch</text><text x="505" y="292" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">außerhalb Katars.</text></svg>
