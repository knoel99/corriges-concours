<svg xmlns="http://www.w3.org/2000/svg" width="800" height="195" viewBox="0 0 800 195" role="img"><title>Am Tag des Atomausstiegs beantworten die drei Politiker unterschiedliche Fragen zur Zukunft der Anlagen.</title><rect width="800" height="195" rx="9" fill="#f6f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#1b3342"><text x="16" y="32" font-size="20" font-weight="bold">Was soll nach der Abschaltung geschehen?</text>
<rect x="12" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="22" y="84" font-size="16" font-weight="bold">Lindner · FDP</text>
<text x="22" y="111" font-size="15">Reserve erwägen, Rückkehr</text>
<text x="22" y="133" font-size="15">für unrealistisch halten.</text>
<rect x="277" y="55" width="244" height="125" rx="8" fill="#e3eee6"/>
<text x="287" y="84" font-size="16" font-weight="bold">Söder · CSU</text>
<text x="287" y="111" font-size="15">Längere Laufzeiten oder</text>
<text x="287" y="133" font-size="15">eine Rückkehr prüfen.</text>
<rect x="542" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="552" y="84" font-size="16" font-weight="bold">Trittin · Grüne</text>
<text x="552" y="111" font-size="15">Ausstieg abschließen und</text>
<text x="552" y="133" font-size="15">Endlagersuche</text>
<text x="552" y="155" font-size="15">beschleunigen.</text>
</g></svg>
