<svg xmlns="http://www.w3.org/2000/svg" width="800" height="195" viewBox="0 0 800 195" role="img"><title>Das Landbeispiel zeigt, wie rechtliche Stellung, Finanzierung und Mitsprache zusammenhängen.</title><rect width="800" height="195" rx="9" fill="#f6f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#1b3342"><text x="16" y="32" font-size="20" font-weight="bold">Drei Fragen an ein landwirtschaftliches Projekt</text>
<rect x="12" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="22" y="84" font-size="16" font-weight="bold">Rechte</text>
<text x="22" y="111" font-size="15">Wer darf über die</text>
<text x="22" y="133" font-size="15">bewirtschaftete Fläche</text>
<text x="22" y="155" font-size="15">verfügen?</text>
<rect x="277" y="55" width="244" height="125" rx="8" fill="#e3eee6"/>
<text x="287" y="84" font-size="16" font-weight="bold">Ressourcen</text>
<text x="287" y="111" font-size="15">Wer kann einen Kredit für</text>
<text x="287" y="133" font-size="15">Investitionen aufnehmen?</text>
<rect x="542" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="552" y="84" font-size="16" font-weight="bold">Repräsentanz</text>
<text x="552" y="111" font-size="15">Wer entscheidet über</text>
<text x="552" y="133" font-size="15">Regeln und</text>
<text x="552" y="155" font-size="15">Vergabekriterien?</text>
</g></svg>
