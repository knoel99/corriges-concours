<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-labelledby="titre description"><title id="titre">Le parcours de l’enquête de Galien à Lemnos</title><desc id="description">Le récit de Dioscoride conduit à une visite, puis à deux enquêtes distinctes, sur le contenu du cachet et sur les effets que lui attribuent ses utilisateurs.</desc><rect width="720" height="286" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#173747"><text x="18" y="30" font-weight="bold" font-size="19">À Lemnos, deux affirmations à éprouver</text></g><g fill="#eff5f3" stroke="#6b9288" stroke-width="2"><rect x="18" y="48" width="305" height="65" rx="8"/><rect x="394" y="48" width="308" height="65" rx="8"/><rect x="18" y="175" width="330" height="94" rx="8"/><rect x="371" y="175" width="331" height="94" rx="8"/></g><g fill="none" stroke="#38655e" stroke-width="3"><path d="M326 80h58 M375 73l10 7-10 7 M547 114v24H185v28 M179 157l6 10 6-10 M547 138v28 M541 157l6 10 6-10"/></g><g font-family="DejaVu Sans, sans-serif" fill="#172f45" font-size="16"><text x="33" y="74" font-weight="bold">Le livre suscite le voyage</text><text x="33" y="98">Dioscoride évoque un mélange.</text><text x="410" y="74" font-weight="bold">Galien interroge sur place</text><text x="410" y="98">Prêtresse, lettrés, écrit local.</text><text x="32" y="199" font-weight="bold">De quoi le cachet est-il fait ?</text><text x="32" y="227">Rite observé, tradition du sang</text><text x="32" y="250">récusée par les témoins locaux.</text><text x="384" y="199" font-weight="bold">Quels effets lui prête-t-on ?</text><text x="384" y="227">Essais revendiqués par Galien,</text><text x="384" y="250">autres usages seulement rapportés.</text></g></svg>
