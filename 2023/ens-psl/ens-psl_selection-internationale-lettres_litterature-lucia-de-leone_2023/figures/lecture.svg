<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois lectures d’un même espace</title>
<desc id="description">Virgile Tityre demeure, Mélibée part Qui dispose du lieu ? Sand Deux images du labour Qui voit le savoir du travailleur ? Schweblin Amanda interrogée par David Quand le contact est-il devenu dangereux ?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois lectures d’un même espace</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Œuvre</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Relation décisive</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet sur la lecture</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Virgile</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Tityre demeure, Mélibée</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">part</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Qui dispose du lieu ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Sand</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Deux images du labour</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Qui voit le savoir du</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">travailleur ?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Schweblin</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Amanda interrogée par</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">David</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Quand le contact est-il</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">devenu dangereux ?</text>
