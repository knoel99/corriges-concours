<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="titre description"><title id="titre">Une rétroaction à tester dans le système semencier</title><desc id="description">Un diagnostic climatique justifie une intervention publique. Si elle réduit les choix semenciers, la vulnérabilité peut croître et appeler de nouvelles interventions. Un complément aux échanges existants peut produire un autre effet.</desc><rect width="720" height="240" fill="#fff"/><g font-family="DejaVu Sans, sans-serif" font-size="16" fill="#243640"><text x="18" y="27" font-weight="bold">Hypothèse du projet sur les semences</text><rect x="18" y="51" width="190" height="70" rx="7" fill="#e9f1f0" stroke="#45756e"/><rect x="271" y="51" width="179" height="70" rx="7" fill="#e9f1f0" stroke="#45756e"/><rect x="503" y="51" width="199" height="70" rx="7" fill="#e9f1f0" stroke="#45756e"/><text x="30" y="82">Risque climatique</text><text x="30" y="105">mis à l’agenda</text><text x="284" y="82">Programme de</text><text x="284" y="105">distribution</text><text x="513" y="82">Moins de variétés</text><text x="513" y="105">si substitution</text><text x="170" y="176">Vulnérabilité accrue à certains aléas</text><text x="18" y="223">Autre issue possible : le programme enrichit les choix existants.</text></g><g fill="none" stroke="#38655e" stroke-width="2.8"><path d="M210 86h52 M252 79l11 7-11 7 M452 86h43 M485 79l10 7-10 7 M600 124v46h-90 M520 164l-10 6 10 6 M153 170h-42v-42 M104 139l7-11 7 11"/></g></svg>
