<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Trois mécanismes pour analyser l’intervention du religieux dans un conflit social ou politique.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="39" font-size="15" fill="white">Qualifier un</text><text x="13" y="56" font-size="15" fill="white">différend</text><text x="237" y="39" font-size="15" fill="#173946">Quel tort les acteurs nomment-ils ? Chercher dans les</text><text x="237" y="56" font-size="15" fill="#173946">discours qui invoque la foi, la justice ou la nation.</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="117" font-size="15" fill="white">Mobiliser</text><text x="237" y="109" font-size="15" fill="#173946">Quels lieux, réseaux et porte-parole rendent l’action</text><text x="237" y="126" font-size="15" fill="#173946">collective possible ? Identifier les acteurs absents.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="187" font-size="15" fill="white">Négocier</text><text x="237" y="179" font-size="15" fill="#173946">Quelles autorités et garanties rendent un compromis</text><text x="237" y="196" font-size="15" fill="#173946">acceptable ? Examiner les divisions internes.</text></g></svg>
