<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">Deux morphèmes /na/, deux dérivations</title>
<desc id="description">Domaine du verbe kihim-na : accent sur la syllabe fermée him kihim-Ø : accent initial, dernière syllabe fermée Syncope du verbe Le premier i sans accent tombe Les deux i sont protégés Ajout de l’objet Aucun objet à ajouter Le clitique -na s’attache au verbe déjà formé Accent de surface khímna kihímna, sans nouvelle syncope</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux morphèmes /na/, deux dérivations</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Stade</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Sujet « nous »</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Objet « nous »</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Domaine du verbe</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">kihim-na : accent sur la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">syllabe fermée him</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">kihim-Ø : accent initial,</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">dernière syllabe fermée</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Syncope du verbe</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le premier i sans accent</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">tombe</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Les deux i sont protégés</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Ajout de l’objet</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Aucun objet à ajouter</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le clitique -na s’attache</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">au verbe déjà formé</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Accent de surface</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">khímna</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">kihímna, sans nouvelle</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">syncope</text>
</g>
</svg>
