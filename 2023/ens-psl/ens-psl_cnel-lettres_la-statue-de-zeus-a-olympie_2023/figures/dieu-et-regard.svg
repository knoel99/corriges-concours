<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img" aria-labelledby="ttl desc">
<title id="ttl">Zeus assis, attributs et position du visiteur</title><desc id="desc">Les lignes repèrent côté gauche de l'image la main droite du dieu portant la Victoire, côté droit la main gauche, le sceptre et l’aigle. L’entrée est le repère utilisé par Pausanias pour identifier un barreau du trône. Schéma de lecture, sans restitution ni échelle.</desc>
<rect width="900" height="465" fill="#faf8f3"/><g font-family="DejaVu Sans,sans-serif" fill="#183a4b"><text x="30" y="45" font-size="26" font-weight="bold">Lire la description de face</text><text x="30" y="77" font-size="17">Schéma de position, sans échelle architecturale</text>
<g stroke="#617e81" stroke-width="3" fill="none"><path d="M324 149v165h251V149"/><path d="M359 316v30m182-30v30"/></g><g fill="#d5ac63" stroke="#7c5b2b" stroke-width="2"><circle cx="450" cy="140" r="23"/><path d="M417 177q33-19 66 0l14 71h-94z"/><path d="M406 249h88l-4 66h-28l-13-43-9 43h-29z"/></g>
<g stroke="#7c5b2b" fill="none" stroke-width="8" stroke-linecap="round"><path d="M417 181l-34 34-34-12m133-23l31 43 27-37"/></g><path d="M542 142v171" stroke="#7c5b2b" stroke-width="5"/>
<g stroke="#617e81" stroke-width="2" fill="none"><path d="M208 184h113l23 13m202-47 29-22h92M369 321l-61 45h-99"/></g>
<g font-size="18"><text x="32" y="170" font-weight="bold">Main droite</text><text x="32" y="198">Victoire d’or et d’ivoire</text><text x="678" y="127" font-weight="bold">Main gauche</text><text x="678" y="154">Sceptre et aigle</text><text x="31" y="359" font-weight="bold">Barreau de face</text><text x="31" y="386">Sept figures conservées</text></g>
<path d="M443 397v-39l-8 10m8-10 8 10" stroke="#387875" stroke-width="3" fill="none"/><text x="450" y="428" text-anchor="middle" font-size="19" font-weight="bold">Point de vue depuis l’entrée</text>
</g></svg>
