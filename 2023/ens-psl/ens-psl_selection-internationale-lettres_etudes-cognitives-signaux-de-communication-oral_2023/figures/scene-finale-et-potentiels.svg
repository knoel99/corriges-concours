<svg xmlns="http://www.w3.org/2000/svg" width="725" height="254" viewBox="0 0 725 254" role="img" aria-labelledby="ti de"><title id="ti">Deux comparaisons dans les potentiels évoqués</title><desc id="de">Cette figure résume des directions d’effet. Les amplitudes ne sont pas représentées. Le profil de la N300 suit la configuration finale, tandis que la N400 dépend des indices antérieurs.</desc><rect width="725" height="254" fill="#ffffff"/><g font-family="DejaVu Sans, sans-serif">
<text x="15" y="28" fill="#1d6569" font-size="22" font-weight="700" text-anchor="start">À l’apparition de la troisième image</text>
<text x="15" y="61" fill="#20353c" font-size="17" font-weight="400" text-anchor="start">Les acteurs regardent la même tasse ou des tasses différentes.</text>
<rect x="15" y="87" width="338" height="113" rx="7" fill="#e7f0f0"/>
<text x="27" y="120" fill="#1d6569" font-size="19" font-weight="700" text-anchor="start">N300 · configuration finale</text>
<text x="27" y="151" fill="#20353c" font-size="16" font-weight="400" text-anchor="start">Négativité plus marquée</text>
<text x="27" y="176" fill="#20353c" font-size="16" font-weight="400" text-anchor="start">quand les regards divergent.</text>
<rect x="367" y="87" width="338" height="113" rx="7" fill="#f5ecde"/>
<text x="379" y="120" fill="#1d6569" font-size="19" font-weight="700" text-anchor="start">N400 · contexte antérieur</text>
<text x="379" y="151" fill="#20353c" font-size="16" font-weight="400" text-anchor="start">Négativité plus marquée sans regard</text>
<text x="379" y="176" fill="#20353c" font-size="16" font-weight="400" text-anchor="start">mutuel ou sans pointage perçu.</text>
<text x="15" y="232" fill="#20353c" font-size="17" font-weight="400" text-anchor="start">La N400 ne montre pas d’effet principal significatif de l’issue finale.</text></g></svg>
