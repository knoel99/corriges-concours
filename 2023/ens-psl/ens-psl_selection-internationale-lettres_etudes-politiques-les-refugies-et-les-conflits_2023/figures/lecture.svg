<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Suivre un déplacement à trois moments pour distinguer les causes du départ des conditions de protection.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="47" font-size="15" fill="white">Territoire d’origine</text><text x="237" y="31" font-size="15" fill="#173946">Qui est menacé ? Qui a les moyens de se déplacer ?</text><text x="237" y="48" font-size="15" fill="#173946">Distinguer fuite interne et franchissement d’une</text><text x="237" y="65" font-size="15" fill="#173946">frontière.</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="117" font-size="15" fill="white">État d’accueil</text><text x="237" y="109" font-size="15" fill="#173946">Quelle autorité accorde quel statut ? Observer droits,</text><text x="237" y="126" font-size="15" fill="#173946">services, ressources et décisions des personnes.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="187" font-size="15" fill="white">Après la guerre</text><text x="237" y="171" font-size="15" fill="#173946">Qui peut choisir de rentrer, de rester ou de partir</text><text x="237" y="188" font-size="15" fill="#173946">ailleurs ? Examiner sécurité, attaches et droits</text><text x="237" y="205" font-size="15" fill="#173946">effectifs.</text></g></svg>
