<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244" role="img" aria-labelledby="t d"><title id="t">Comment attribuer le reverdissement des champs ?</title><desc id="d">Un indice satellitaire mesure le signal végétal, des images détaillées révèlent les arbres et le terrain éclaire la conduite des repousses. Les trois observations doivent être confrontées à des séries de pluies.</desc><rect width="720" height="244" fill="#fff"/><g fill="#f0f3ec" stroke="#69856f" stroke-width="2"><rect x="15" y="16" width="215" height="90" rx="7"/><rect x="253" y="16" width="215" height="90" rx="7"/><rect x="491" y="16" width="214" height="90" rx="7"/><rect x="120" y="158" width="480" height="69" rx="7"/></g><g font-family="DejaVu Sans, sans-serif" fill="#20372b" font-size="17" text-anchor="middle"><text x="123" y="44" font-weight="bold">Signal de verdure</text><text x="123" y="71">Quantité de végétation</text><text x="123" y="94">active dans le pixel</text><text x="360" y="44" font-weight="bold">Images détaillées</text><text x="360" y="71">Arbres dans les champs</text><text x="360" y="94">à plusieurs dates</text><text x="598" y="44" font-weight="bold">Terrain et entretiens</text><text x="598" y="71">Espèces, jeunes tiges,</text><text x="598" y="94">usages et droits</text><text x="360" y="185" font-weight="bold">Confronter ces indices aux séries de pluies</text><text x="360" y="210">Identifier des mécanismes et leurs limites locales</text></g><g stroke="#446a52" fill="none" stroke-width="2.8"><path d="M123 108v20h235 M597 108v20H360 M360 108v43 M353 142l7 9 7-9"/></g></svg>
