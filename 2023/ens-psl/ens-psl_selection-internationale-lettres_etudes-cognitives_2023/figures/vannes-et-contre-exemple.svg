<circle cx="214" cy="122" r="9" fill="white" stroke="#1d6569" stroke-width="3"/>
<text x="236" y="129" fill="#1d6569" font-size="15" font-weight="700" text-anchor="start">C ouverte</text>
<circle cx="452" cy="105" r="9" fill="white" stroke="#924e2b" stroke-width="3"/>
<path d="M444 105 H460" fill="none" stroke="#924e2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<text x="368" y="127" fill="#924e2b" font-size="15" font-weight="700" text-anchor="start">A fermée</text>
<circle cx="584" cy="105" r="9" fill="white" stroke="#1d6569" stroke-width="3"/>
<text x="607" y="111" fill="#1d6569" font-size="15" font-weight="700" text-anchor="start">B ouverte</text>
