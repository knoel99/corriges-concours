<text x="16" y="254" fill="#20353c" font-size="17" font-weight="400" text-anchor="start">C ouverte assure le passage,</text>
<text x="16" y="278" fill="#20353c" font-size="17" font-weight="400" text-anchor="start">même si B reste fermée.</text>
<text x="377" y="254" fill="#20353c" font-size="17" font-weight="400" text-anchor="start">C fermée arrête les deux trajets,</text>
<text x="377" y="278" fill="#20353c" font-size="17" font-weight="400" text-anchor="start">même si B reste ouverte.</text></g></svg>
