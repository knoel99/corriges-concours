<svg xmlns="http://www.w3.org/2000/svg" width="727" height="298" viewBox="0 0 727 298" role="img" aria-labelledby="ti de"><title id="ti">Deux contre-exemples à la nécessité de B</title><desc id="de">Schémas de connexions. Le sens de la proposition est l’ouverture dans le Y et la fermeture dans le losange. Le trajet passant par C suffit à réaliser chaque contre-exemple.</desc><rect width="727" height="298" fill="#ffffff"/><g font-family="DejaVu Sans, sans-serif">
<text x="16" y="26" fill="#1d6569" font-size="21" font-weight="700" text-anchor="start">Y · l’eau passe</text>
<text x="377" y="26" fill="#1d6569" font-size="21" font-weight="700" text-anchor="start">Losange · l’eau est bloquée</text>
<path d="M148 52 V68 M148 68 H82 V194 H148 M148 68 H214 V194 H148 M148 194 V218" fill="none" stroke="#687b83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
