<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Ce que fait un spécialiste des langues anciennes</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Ce que fait un spécialiste des langues anciennes</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Lire et établir</text>
<text x="75" y="129" font-size="17">Les formes de la langue et les témoins matériels limitent les</text>
<text x="75" y="151" font-size="17">interprétations possibles.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">Interroger autrement</text>
<text x="75" y="219" font-size="17">Une question actuelle conduit à regarder les mains d’une tablette ou les</text>
<text x="75" y="241" font-size="17">pigments du marbre.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">Rendre vérifiable</text>
<text x="75" y="309" font-size="17">Édition, traduction et corpus explicitent leurs choix pour permettre une</text>
<text x="75" y="331" font-size="17">nouvelle lecture.</text>
</g></svg>
