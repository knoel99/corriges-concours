<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Trois lieux où l’articulation entre classe, racialisation et genre peut être observée dans le travail.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="39" font-size="15" fill="white">Sélection par un</text><text x="13" y="56" font-size="15" fill="white">employeur</text><text x="237" y="39" font-size="15" fill="#173946">À candidatures comparables, qui obtient une réponse et</text><text x="237" y="56" font-size="15" fill="#173946">quelle qualification se voit reconnue ?</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="109" font-size="15" fill="white">Organisation du</text><text x="13" y="126" font-size="15" fill="white">travail</text><text x="237" y="109" font-size="15" fill="#173946">Qui dispose de son horaire, réalise les tâches</text><text x="237" y="126" font-size="15" fill="#173946">invisibles et peut refuser une mission ?</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="179" font-size="15" fill="white">Représentation</text><text x="13" y="196" font-size="15" fill="white">collective</text><text x="237" y="179" font-size="15" fill="#173946">Quelles expériences les recours individuels et les</text><text x="237" y="196" font-size="15" fill="#173946">revendications syndicales font-ils apparaître ?</text></g></svg>
