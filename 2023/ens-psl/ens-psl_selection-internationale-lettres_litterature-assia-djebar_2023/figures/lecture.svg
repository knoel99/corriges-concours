<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">De l’obligation de parler à la limite de la parole</title>
<desc id="description">Corriger le nom de son origine Quelle expérience excède une étiquette ? La phrase reprend et précise son point de départ Garder trace Qui a pu produire et conserver un récit ? Plusieurs sources et voix restent distinctes Ne jamais pouvoir dire Quelle expérience est inaccessible ? Le récit conserve les lacunes du témoignage Devoir taire De quel droit parler à la place d’autrui ? La retenue engage la responsabilité de celui qui raconte</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De l’obligation de parler à la limite de la parole</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Formule ou geste</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Question de lecture</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet dans l’écriture</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Corriger le nom de</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">son origine</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Quelle expérience excède</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">une étiquette ?</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La phrase reprend et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">précise son point de départ</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Garder trace</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Qui a pu produire et</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">conserver un récit ?</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Plusieurs sources et voix</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">restent distinctes</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Ne jamais pouvoir</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">dire</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Quelle expérience est</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">inaccessible ?</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le récit conserve les</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">lacunes du témoignage</text>
<rect x="10" y="293" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Devoir taire</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">De quel droit parler à la</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">place d’autrui ?</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">La retenue engage la</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">responsabilité de celui qui</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">raconte</text>
</g>
</svg>
