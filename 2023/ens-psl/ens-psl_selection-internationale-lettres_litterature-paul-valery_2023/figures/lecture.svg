<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">Le retour du sens à la forme</title>
<desc id="description">Entendre « Il pleure » suscite une attente Le pronom laisse le sujet incertain Comprendre La pluie dans la ville éclaire la comparaison Deux phénomènes se rapprochent Relire Le voisinage de « pleure » et « pleut » s’entend La proximité sonore transforme l’idée de comparaison Transposer Refrain, scène, calligramme Le retour engage aussi la mémoire et le regard</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Le retour du sens à la forme</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Expérience chez Verlaine</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui change au retour</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Entendre</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">« Il pleure » suscite une</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">attente</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le pronom laisse le sujet</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">incertain</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Comprendre</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La pluie dans la ville</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">éclaire la comparaison</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Deux phénomènes se</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">rapprochent</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Relire</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le voisinage de « pleure »</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">et « pleut » s’entend</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La proximité sonore</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">transforme l’idée de</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">comparaison</text>
<rect x="10" y="315" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">Transposer</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">Refrain, scène,</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">calligramme</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Le retour engage aussi la</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">mémoire et le regard</text>
</g>
</svg>
