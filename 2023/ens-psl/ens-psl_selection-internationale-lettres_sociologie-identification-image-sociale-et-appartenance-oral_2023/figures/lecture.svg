<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Trois objets d’enquête à distinguer lorsque des acteurs revendiquent ou contestent une identité.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="47" font-size="15" fill="white">Identification</text><text x="237" y="39" font-size="15" fill="#173946">Qui classe qui ? Relever l’auteur, la procédure et les</text><text x="237" y="56" font-size="15" fill="#173946">effets du classement.</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="117" font-size="15" fill="white">Image sociale</text><text x="237" y="109" font-size="15" fill="#173946">Que donne-t-on à voir du collectif ? Comparer les</text><text x="237" y="126" font-size="15" fill="#173946">images, leurs publics et leurs usages.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="187" font-size="15" fill="white">Appartenance</text><text x="237" y="179" font-size="15" fill="#173946">Qui se reconnaît, agit ou se lie à qui ? Suivre les</text><text x="237" y="196" font-size="15" fill="#173946">relations au fil des situations.</text></g></svg>
