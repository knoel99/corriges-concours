<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Les trois familles d’intervention de la conclusion et le résultat à mesurer pour chacune.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="47" font-size="15" fill="white">Accès aux études</text><text x="237" y="39" font-size="15" fill="#173946">Qui serait sorti plus tôt ? Suivre la scolarité</text><text x="237" y="56" font-size="15" fill="#173946">supplémentaire et ses débouchés.</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="117" font-size="15" fill="white">Prévention précoce</text><text x="237" y="109" font-size="15" fill="#173946">Quelles capacités se développent ? Distinguer l’effet</text><text x="237" y="126" font-size="15" fill="#173946">scolaire immédiat des trajectoires ultérieures.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="187" font-size="15" fill="white">Rattrapage</text><text x="237" y="179" font-size="15" fill="#173946">Qui entre en formation ? Observer l’accès à un poste, sa</text><text x="237" y="196" font-size="15" fill="#173946">durée et les emplois disponibles.</text></g></svg>
