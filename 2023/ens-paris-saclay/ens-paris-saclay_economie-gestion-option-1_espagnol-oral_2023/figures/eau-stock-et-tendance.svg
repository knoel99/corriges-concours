<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" width="820" height="255" role="img" aria-labelledby="titre desc"><title id="titre">Lire les réserves de la cuenca del Ebro</title><desc id="desc">Semaine observée. 4 198 hm³ stockés pour une capacité de 7 961 hm³, soit 52,7 % selon l’article. Un an auparavant. Les barrages étaient remplis à 75,6 % au point de comparaison de 2022. Moyenne 2018–2022. Le volume moyen était de 6 218 hm³ et le taux de remplissage de 78,1 %.</desc><rect width="820" height="255" fill="#f6f5ef"/><g font-family="DejaVu Sans, sans-serif" fill="#153139"><text x="24" y="32" font-size="22" font-weight="bold">Lire les réserves de la cuenca del Ebro</text><path d="M24 62h241" stroke="#39756e" stroke-width="4"/><text x="24" y="93" font-size="18" font-weight="bold">Semaine observée</text><text x="24" y="123" font-size="15">4 198 hm³ stockés pour une</text><text x="24" y="145" font-size="15">capacité de 7 961 hm³, soit</text><text x="24" y="167" font-size="15">52,7 % selon l’article.</text><path d="M289 62h241" stroke="#39756e" stroke-width="4"/><text x="289" y="93" font-size="18" font-weight="bold">Un an auparavant</text><text x="289" y="123" font-size="15">Les barrages étaient</text><text x="289" y="145" font-size="15">remplis à 75,6 % au point</text><text x="289" y="167" font-size="15">de comparaison de 2022.</text><path d="M554 62h241" stroke="#39756e" stroke-width="4"/><text x="554" y="93" font-size="18" font-weight="bold">Moyenne 2018–2022</text><text x="554" y="123" font-size="15">Le volume moyen était de 6</text><text x="554" y="145" font-size="15">218 hm³ et le taux de</text><text x="554" y="167" font-size="15">remplissage de 78,1 %.</text></g></svg>
