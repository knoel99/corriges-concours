<svg xmlns="http://www.w3.org/2000/svg" width="820" height="296" viewBox="0 0 820 296" role="img"><title>Dover, deux usages du vitrage</title><desc>Dans la maison de 1948, le vitrage du capteur et les fenêtres ont des fonctions distinctes.</desc><rect x="0" y="0" width="820" height="296" fill="#fbfaf5" stroke="none"/><text x="26" y="42" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#203f49">Dover, deux usages du vitrage</text><text x="34" y="85" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#203f49">En hauteur, le capteur</text><text x="438" y="85" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#203f49">Dans la pièce, la fenêtre</text><line x1="94" y1="105" x2="94" y2="220" stroke="#458598" stroke-width="4" stroke-linecap="round"/><line x1="104" y1="105" x2="104" y2="220" stroke="#458598" stroke-width="4" stroke-linecap="round"/><line x1="494" y1="105" x2="494" y2="220" stroke="#458598" stroke-width="4" stroke-linecap="round"/><line x1="504" y1="105" x2="504" y2="220" stroke="#458598" stroke-width="4" stroke-linecap="round"/><line x1="145" y1="105" x2="145" y2="220" stroke="#303b3c" stroke-width="9" stroke-linecap="round"/><rect x="107" y="107" width="33" height="111" fill="#f1deab" stroke="none"/><text x="169" y="142" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">Air chauffé devant</text><text x="169" y="168" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">la tôle sombre</text><text x="531" y="143" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">La lumière atteint</text><text x="531" y="169" font-family="DejaVu Sans" font-size="17" font-weight="normal" fill="#203f49">le volume habité</text><line x1="39" y1="110" x2="87" y2="125" stroke="#b57c2d" stroke-width="3" stroke-linecap="round"/><line x1="39" y1="146" x2="87" y2="161" stroke="#b57c2d" stroke-width="3" stroke-linecap="round"/><line x1="39" y1="182" x2="87" y2="197" stroke="#b57c2d" stroke-width="3" stroke-linecap="round"/><line x1="439" y1="110" x2="487" y2="125" stroke="#b57c2d" stroke-width="3" stroke-linecap="round"/><line x1="439" y1="146" x2="487" y2="161" stroke="#b57c2d" stroke-width="3" stroke-linecap="round"/><line x1="439" y1="182" x2="487" y2="197" stroke="#b57c2d" stroke-width="3" stroke-linecap="round"/><text x="34" y="255" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#203f49">L’air transporte la chaleur vers la réserve.</text><text x="438" y="255" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#203f49">Le vitrage donne aussi une vue.</text><text x="34" y="284" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#203f49">Coupe simplifiée des fonctions, sans échelle.</text></svg>
