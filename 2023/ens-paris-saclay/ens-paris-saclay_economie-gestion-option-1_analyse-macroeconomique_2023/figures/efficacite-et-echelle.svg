<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 353" width="830" height="353" role="img" aria-labelledby="t d"><title id="t">Émissions totales pour une même innovation technique</title><desc id="d">Avec des émissions unitaires réduites de 30 %, l’effet sur les émissions totales dépend du nombre d’unités produites. Le seuil de compensation est 142,86 unités pour 100 au départ.</desc><rect width="830" height="353" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#193946"><text x="18" y="28" font-size="21" font-weight="bold">Émissions totales pour une même innovation technique</text><text x="18" y="52" font-size="15">Émissions, indice initial = 100</text><text x="18" y="84" font-size="17" font-weight="bold">Situation initiale</text><text x="18" y="107" font-size="15">100 unités × 1</text><rect x="291" y="71" width="371.67" height="24" fill="#315775"/><text x="670.67" y="90" font-weight="bold" font-size="17">100</text><text x="18" y="148" font-size="17" font-weight="bold">Activité inchangée</text><text x="18" y="171" font-size="15">100 unités × 0,70</text><rect x="291" y="135" width="260.17" height="24" fill="#28776c"/><text x="559.17" y="154" font-weight="bold" font-size="17">70</text><text x="18" y="212" font-size="17" font-weight="bold">Activité accrue de 20 %</text><text x="18" y="235" font-size="15">120 unités × 0,70</text><rect x="291" y="199" width="312.20" height="24" fill="#456e8d"/><text x="611.20" y="218" font-weight="bold" font-size="17">84</text><text x="18" y="276" font-size="17" font-weight="bold">Activité accrue de 50 %</text><text x="18" y="299" font-size="15">150 unités × 0,70</text><rect x="291" y="263" width="390.25" height="24" fill="#956648"/><text x="689.25" y="282" font-weight="bold" font-size="17">105</text><line x1="662.6666666666667" x2="662.6666666666667" y1="62" y2="335" stroke="#555" stroke-dasharray="3 4" /></g></svg>
