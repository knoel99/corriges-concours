<text x="292" y="174" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">La fenêtre relie salon et écran.</text>
<path d="M13 276 L407 276" stroke="#183453" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#183453" text-anchor="start">L’affiche nationale annonce le festival. Le dockëur choisit les films et les heures locales ; les rencontres en ligne gardent leurs horaires</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#183453" text-anchor="start">communs.</text>
