<text x="19" y="201" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#183453" text-anchor="start">Un réseau de petites fenêtres</text>
<text x="19" y="213" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">De loin, le même cadre identifie l’ensemble national. De près,</text>
<text x="19" y="218" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">chaque volet s’ouvre sur une séance organisée par un foyer.</text>
<text x="248" y="77" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#183453" text-anchor="start">Trois essais de signe</text>
<rect x="249" y="99" width="25" height="12" rx="0" fill="#183453" stroke="#212e2c" stroke-width="0.6"/>
<polygon points="249,96 272,91 274,95 251,100" fill="#f3c448" stroke="#183453" stroke-width="0.65" stroke-linejoin="round"/>
<text x="283" y="102" font-family="DejaVu Sans, sans-serif" font-size="4.3" font-weight="700" fill="#183453" text-anchor="start">A</text>
<text x="292" y="102" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le clap évoque le tournage.</text>
<polygon points="248,136 256,126 268,131 273,138 266,145 253,143" fill="#dae6db" stroke="#183453" stroke-width="0.65" stroke-linejoin="round"/>
<text x="283" y="138" font-family="DejaVu Sans, sans-serif" font-size="4.3" font-weight="700" fill="#183453" text-anchor="start">B</text>
<text x="292" y="138" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">La carte situe le réseau national.</text>
