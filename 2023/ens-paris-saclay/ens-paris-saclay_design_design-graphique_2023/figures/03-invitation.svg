<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Une invitation à remplir</title><desc>Gabarit A5 paysage à taille réelle · sélectionner les projections et les annoncer à son voisinage.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#183453" text-anchor="start">LES FENÊTRES ALLUMÉES</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="end">3 / 5</text>
<path d="M13 20 L407 20" stroke="#183453" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Une invitation à remplir</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Gabarit A5 paysage à taille réelle · sélectionner les projections et les annoncer à son voisinage.</text>
<g transform="translate(18 70) scale(1)">
<rect x="0" y="0" width="210" height="148" rx="0" fill="#fffdf3" stroke="#183453" stroke-width="0.65"/>
<g transform="translate(12 11) scale(1.15)">
<rect x="0" y="0" width="38" height="30" rx="0" fill="#f3c448" stroke="#183453" stroke-width="1.5"/>
<polygon points="0,0 12,5 12,25 0,30" fill="#fcf5e8" stroke="#183453" stroke-width="1.25" stroke-linejoin="round"/>
<polygon points="38,0 28,6 28,24 38,30" fill="#fcf5e8" stroke="#183453" stroke-width="1.25" stroke-linejoin="round"/>
<path d="M17 32 L22 32" stroke="#183453" stroke-width="1.3" fill="none"/>
</g>
<text x="66" y="18" font-family="DejaVu Sans, sans-serif" font-size="4.4" font-weight="700" fill="#183453" text-anchor="start">FESTIVAL / 5e ÉDITION</text>
<text x="65" y="33" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#183453" text-anchor="start">Doc chez</text>
<text x="65" y="47" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#183453" text-anchor="start">l’habitant</text>
<text x="13" y="61" font-family="DejaVu Sans, sans-serif" font-size="7" font-weight="700" fill="#183453" text-anchor="start">26 — 28 JANVIER 2024</text>
<path d="M13 67 L197 67" stroke="#183453" stroke-width="0.75" fill="none"/>
<rect x="14" y="75" width="4" height="4" rx="0" fill="none" stroke="#183453" stroke-width="0.5"/>
<text x="23" y="79" font-family="DejaVu Sans, sans-serif" font-size="4.15" font-weight="700" fill="#183453" text-anchor="start">Flee</text>
<path d="M117 79 L195 79" stroke="#183453" stroke-width="0.45" fill="none"/>
<rect x="14" y="87" width="4" height="4" rx="0" fill="none" stroke="#183453" stroke-width="0.5"/>
<text x="23" y="91" font-family="DejaVu Sans, sans-serif" font-size="4.15" font-weight="700" fill="#183453" text-anchor="start">Little Palestine. Journal d’un siège</text>
<path d="M117 91 L195 91" stroke="#183453" stroke-width="0.45" fill="none"/>
<rect x="14" y="99" width="4" height="4" rx="0" fill="none" stroke="#183453" stroke-width="0.5"/>
<text x="23" y="103" font-family="DejaVu Sans, sans-serif" font-size="4.15" font-weight="700" fill="#183453" text-anchor="start">Éclaireuses</text>
<path d="M117 103 L195 103" stroke="#183453" stroke-width="0.45" fill="none"/>
<text x="13" y="122" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#183453" text-anchor="start">Lieu / contact</text>
<path d="M49 122 L196 122" stroke="#183453" stroke-width="0.5" fill="none"/>
<text x="13" y="137" font-family="DejaVu Sans, sans-serif" font-size="4.1" font-weight="400" fill="#183453" text-anchor="start">Accueil sur réponse · participation à prix libre</text>
</g>
<text x="247" y="79" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#183453" text-anchor="start">Imprimer · cocher · écrire</text>
<text x="247" y="93" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Imprimer à 100 %, découper le rectangle A5 ou le</text>
<text x="247" y="98" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">photocopier. Un stylo suffit pour cocher les</text>
<text x="247" y="103" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">films, inscrire les horaires et indiquer comment</text>
<text x="247" y="108" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">joindre l’hôte.</text>
<text x="247" y="145" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#183453" text-anchor="start">Rester joignable</text>
<text x="247" y="157" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">L’adhésion de 5 € concerne le dockëur. Le</text>
<text x="247" y="162" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">spectateur participe à prix libre. Donner</text>
<text x="247" y="167" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">l’adresse privée sur réponse selon le choix de</text>
<text x="247" y="172" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">l’hôte.</text>
<text x="20" y="237" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#183453" text-anchor="start">Variante sans imprimante</text>
<text x="20" y="250" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Sur une feuille pliée, recopier le signe, le nom et les dates, le titre choisi, son heure puis le contact. Photographier la</text>
<text x="20" y="255" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">feuille à plat, bien éclairée.</text>
<path d="M13 276 L407 276" stroke="#183453" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#183453" text-anchor="start">Le gabarit mesure 210 × 148 mm sur la planche A3 imprimée à 100 %. L’heure inscrite à côté de chaque film est celle de la projection locale.</text>
</svg>
