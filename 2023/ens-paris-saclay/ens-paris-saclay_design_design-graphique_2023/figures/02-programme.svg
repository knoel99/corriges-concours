<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Attribuer un signe à chaque film</title><desc>Trois cartes-programme originales · les titres restent lisibles en noir et blanc et à petite taille.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#183453" text-anchor="start">LES FENÊTRES ALLUMÉES</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="end">2 / 5</text>
<path d="M13 20 L407 20" stroke="#183453" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Attribuer un signe à chaque film</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Trois cartes-programme originales · les titres restent lisibles en noir et blanc et à petite taille.</text>
<rect x="17" y="65" width="119" height="178" rx="0" fill="#f3c448" stroke="none" stroke-width="0.6"/>
<g transform="translate(27 80) scale(2.9)">
<rect x="0" y="0" width="30" height="20" rx="0" fill="none" stroke="#183453" stroke-width="1"/>
<path d="M3 16 Q10 11 12 12 T20 9 T27 4" fill="none" stroke="#183453" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="22" cy="6" rx="2" ry="2" fill="#f3c448" stroke="#183453" stroke-width="0.55"/>
</g>
<text x="24" y="164" font-family="DejaVu Sans, sans-serif" font-size="6.3" font-weight="700" fill="#183453" text-anchor="start">Flee</text>
<text x="24" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#183453" text-anchor="start">Jonas Poher Rasmussen · 2021 · 89 min</text>
<text x="24" y="207" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="start">Un trajet interrompu puis repris. Amin</text>
<text x="24" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="start">confie, au Danemark, son histoire d’exil</text>
<text x="24" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="start">depuis l’Afghanistan.</text>
<rect x="151" y="65" width="119" height="178" rx="0" fill="#dae6db" stroke="none" stroke-width="0.6"/>
<g transform="translate(161 80) scale(2.9)">
<rect x="0" y="0" width="30" height="20" rx="0" fill="none" stroke="#183453" stroke-width="1"/>
<rect x="3" y="10" width="5" height="7" rx="0" fill="#dae6db" stroke="#183453" stroke-width="0.6"/>
<rect x="9" y="6" width="5" height="11" rx="0" fill="#dae6db" stroke="#183453" stroke-width="0.6"/>
<rect x="16" y="13" width="5" height="4" rx="0" fill="#dae6db" stroke="#183453" stroke-width="0.6"/>
<rect x="21" y="8" width="5" height="9" rx="0" fill="#dae6db" stroke="#183453" stroke-width="0.6"/>
</g>
<text x="158" y="164" font-family="DejaVu Sans, sans-serif" font-size="6.3" font-weight="700" fill="#183453" text-anchor="start">Little Palestine.</text>
<text x="158" y="172" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#183453" text-anchor="start">Journal d’un siège</text>
<text x="158" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#183453" text-anchor="start">Abdallah Al-Khatib · 2022 · 89 min</text>
<text x="158" y="207" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="start">Un horizon urbain fragmenté. Le film</text>
<text x="158" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="start">témoigne de la vie des habitants de</text>
<text x="158" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="start">Yarmouk assiégé.</text>
<rect x="285" y="65" width="119" height="178" rx="0" fill="#e9bdaf" stroke="none" stroke-width="0.6"/>
<g transform="translate(295 80) scale(2.9)">
<rect x="0" y="0" width="30" height="20" rx="0" fill="none" stroke="#183453" stroke-width="1"/>
<polygon points="6,6 12,4 16,7 19,5 25,6 25,15 18,13 15,16 12,13 6,15" fill="#f3c448" stroke="#183453" stroke-width="0.65" stroke-linejoin="round"/>
</g>
<text x="292" y="164" font-family="DejaVu Sans, sans-serif" font-size="6.3" font-weight="700" fill="#183453" text-anchor="start">Éclaireuses</text>
<text x="292" y="186" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#183453" text-anchor="start">Lydie Wisshaupt-Claudel · 2022 · 90</text>
<text x="292" y="191" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#183453" text-anchor="start">min</text>
<text x="292" y="207" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="start">Un cahier tenu ouvert. À Bruxelles, une</text>
<text x="292" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="start">école accueille des enfants aux parcours</text>
<text x="292" y="217" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="start">scolaires discontinus.</text>
<path d="M13 276 L407 276" stroke="#183453" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#183453" text-anchor="start">Chaque film associe titre, durée et dessin distinct. Le pictogramme facilite le repérage sur le programme sans remplacer les titres ni les</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#183453" text-anchor="start">crédits.</text>
</svg>
