<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Passer le programme de main en main</title><desc>Des outils pour les dockëurs et les invités · un message texte demeure possible sans image ni application dédiée.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#183453" text-anchor="start">LES FENÊTRES ALLUMÉES</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#183453" text-anchor="end">5 / 5</text>
<path d="M13 20 L407 20" stroke="#183453" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Passer le programme de main en main</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Des outils pour les dockëurs et les invités · un message texte demeure possible sans image ni application dédiée.</text>
<rect x="18" y="62" width="127" height="183" rx="6" fill="#183453" stroke="none" stroke-width="1"/>
<rect x="23" y="74" width="117" height="155" rx="3" fill="#fcf5e8" stroke="none" stroke-width="0.4"/>
<g transform="translate(29 80) scale(0.58)">
<rect x="0" y="0" width="38" height="30" rx="0" fill="#f3c448" stroke="#183453" stroke-width="1.5"/>
<polygon points="0,0 12,5 12,25 0,30" fill="#fcf5e8" stroke="#183453" stroke-width="1.25" stroke-linejoin="round"/>
<polygon points="38,0 28,6 28,24 38,30" fill="#fcf5e8" stroke="#183453" stroke-width="1.25" stroke-linejoin="round"/>
<path d="M17 32 L22 32" stroke="#183453" stroke-width="1.3" fill="none"/>
</g>
<text x="56" y="88" font-family="DejaVu Sans, sans-serif" font-size="4.35" font-weight="700" fill="#183453" text-anchor="start">Doc chez l’habitant</text>
<text x="29" y="110" font-family="DejaVu Sans, sans-serif" font-size="6.5" font-weight="700" fill="#183453" text-anchor="start">Flee chez nous</text>
<text x="29" y="123" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#183453" text-anchor="start">Vendredi 26 janvier, 19 h 45. Film</text>
<text x="29" y="128" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#183453" text-anchor="start">de 89 min. La visio avec le</text>
<text x="29" y="133" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#183453" text-anchor="start">producteur commence à 21 h 30.</text>
<text x="29" y="138" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#183453" text-anchor="start">Participation à prix libre. Répondez</text>
<text x="29" y="143" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="400" fill="#183453" text-anchor="start">pour le lieu et le nombre de places.</text>
<ellipse cx="82" cy="237" rx="3" ry="3" fill="#dae6db" stroke="none" stroke-width="0.65"/>
<text x="164" y="74" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#183453" text-anchor="start">01 / Association</text>
<text x="164" y="86" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Envoyer un fichier imprimable, le texte de base, les titres et les horaires</text>
<text x="164" y="91" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">nationaux. Les mises à jour portent une date.</text>
<text x="164" y="133" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#183453" text-anchor="start">02 / Dockëur</text>
<text x="164" y="145" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Choisir, remplir et transférer aux voisins. Une affiche locale mentionne le</text>
<text x="164" y="150" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">contact et l’accueil ; l’adresse privée se communique selon la préférence de</text>
<text x="164" y="155" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">l’hôte.</text>
<text x="164" y="192" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#183453" text-anchor="start">03 / Invité</text>
<text x="164" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Lire le message même sans image, confirmer sa présence, recevoir l’adresse et</text>
<text x="164" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">la marche à suivre pour la participation libre.</text>
<path d="M13 276 L407 276" stroke="#183453" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#183453" text-anchor="start">Avant diffusion, faire relire le message à un voisin : film, jour, heure, contact, paiement et éventuelle rencontre doivent être retrouvés</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#183453" text-anchor="start">sans aide.</text>
</svg>
