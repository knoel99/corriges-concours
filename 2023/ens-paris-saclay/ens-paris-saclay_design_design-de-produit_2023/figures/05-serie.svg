<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>De la matière à la série</title><desc>Une gamme démontable fabriquée par usinage répétable · mesurer les pertes et tester les pièces avant diffusion.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#65493d" text-anchor="start">À VOIX BASSE</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#65493d" text-anchor="end">5 / 5</text>
<path d="M13 20 L407 20" stroke="#65493d" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">De la matière à la série</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Une gamme démontable fabriquée par usinage répétable · mesurer les pertes et tester les pièces avant diffusion.</text>
<text x="18" y="74" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#65493d" text-anchor="start">Débiter</text>
<text x="18" y="86" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Pain de 600 × 500 × 900 mm environ. Scier</text>
<text x="18" y="91" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">des plaques aux épaisseurs requises, puis</text>
<text x="18" y="96" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">les ébauches rectangulaires.</text>
<text x="150" y="74" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#65493d" text-anchor="start">Usiner</text>
<text x="150" y="86" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Gabarit de bridage large. Contour puis</text>
<text x="150" y="91" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">poches sur la navette ; tournage ou</text>
<text x="150" y="96" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">fraisage circulaire sur les deux autres</text>
<text x="150" y="101" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">formats.</text>
<text x="282" y="74" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#65493d" text-anchor="start">Éprouver</text>
<text x="282" y="86" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Brosser et aspirer les grains libres.</text>
<text x="282" y="91" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Peser, mouiller puis sécher, placer des</text>
<text x="282" y="96" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">bouteilles, vérifier les éclats après</text>
<text x="282" y="101" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">chutes contrôlées.</text>
<rect x="20" y="152" width="182" height="97" rx="0" fill="#e7d6c0" stroke="#412f2a" stroke-width="0.6"/>
<rect x="25" y="158" width="81" height="36" rx="4" fill="#977564" stroke="#412f2a" stroke-width="0.5"/>
<rect x="110" y="158" width="81" height="36" rx="4" fill="#977564" stroke="#412f2a" stroke-width="0.5"/>
<rect x="25" y="198" width="81" height="36" rx="4" fill="#977564" stroke="#412f2a" stroke-width="0.5"/>
<rect x="110" y="198" width="81" height="36" rx="4" fill="#977564" stroke="#412f2a" stroke-width="0.5"/>
<text x="25" y="242" font-family="DejaVu Sans, sans-serif" font-size="3.5" font-weight="700" fill="#412f2a" text-anchor="start">Schéma de répétition des ébauches</text>
<text x="224" y="155" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#65493d" text-anchor="start">Ordre de grandeur</text>
<text x="224" y="168" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Volume de l’ébauche de navette : 1,196 L. À 100–120 kg/m³,</text>
<text x="224" y="173" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">elle pèse environ 120–144 g avant usinage. Peser le lot de</text>
<text x="224" y="178" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">haute densité réellement livré.</text>
<text x="224" y="218" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Trier copeaux et poudre suivant la pratique du fabricant. La</text>
<text x="224" y="223" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">sangle amovible se lave et se remplace séparément.</text>
<path d="M13 276 L407 276" stroke="#65493d" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#65493d" text-anchor="start">Séparer les débits de textile et de liège. Le prototype permettra de comparer le coût par pièce, la tenue et la qualité de la prise.</text>
</svg>
