<text x="234" y="176" font-family="DejaVu Sans, sans-serif" font-size="4.8" font-weight="700" fill="#3b665b" text-anchor="start">Arriver depuis le stationnement</text>
<text x="234" y="188" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">À pied, quitter le parking par une allée continue, sans</text>
<text x="234" y="193" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">traverser une pompe ni une bretelle. Le mur lourd tourne son</text>
<text x="234" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">dos à la circulation. L’entrée se dérobe derrière ce mur.</text>
