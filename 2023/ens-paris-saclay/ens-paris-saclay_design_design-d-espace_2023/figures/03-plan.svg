<text x="288" y="89" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Six places le long du mur haut, trois</text>
<text x="288" y="94" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">sur le côté, une place de 0,80 × 1,30</text>
<text x="288" y="99" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">m pour un fauteuil ou un visiteur</text>
<text x="288" y="104" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">debout.</text>
<text x="288" y="135" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Derrière le seuil</text>
<text x="288" y="146" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le retour protège les regards. Le</text>
<text x="288" y="151" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">battant offre environ 1,05 m de</text>
<text x="288" y="156" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">passage. Le cercle central vérifie la</text>
<text x="288" y="161" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">rotation.</text>
<text x="288" y="192" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Livre d’or</text>
<text x="288" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Tablette à 0,75 m, dégagement dessous,</text>
<text x="288" y="208" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">éclairage latéral. La sortie repasse</text>
<text x="288" y="213" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">par le même seuil.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Les bancs accueillent neuf visiteurs assis. L’espace libre accueille le dixième. Le plan de travail donne 50 cm par assise.</text>
