<text x="283" y="202" font-family="DejaVu Sans, sans-serif" font-size="3.75" font-weight="400" fill="#212e2c" text-anchor="start">Le livre est proposé à chacun. Laisser la</text>
<text x="283" y="207" font-family="DejaVu Sans, sans-serif" font-size="3.75" font-weight="400" fill="#212e2c" text-anchor="start">page blanche est une manière possible</text>
<text x="283" y="212" font-family="DejaVu Sans, sans-serif" font-size="3.75" font-weight="400" fill="#212e2c" text-anchor="start">d’occuper le lieu.</text>
