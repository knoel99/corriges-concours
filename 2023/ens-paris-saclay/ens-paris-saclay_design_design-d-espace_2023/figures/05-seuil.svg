<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Tester le trajet avec plusieurs visiteurs, debout et assis, et écouter porte ouverte puis fermée. Le projet se règle à partir de ces</text>
