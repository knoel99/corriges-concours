<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Chercher une forme du silence</title><desc>Trois expériences sur le seuil · tourner autour, descendre, traverser un pli.</desc>
