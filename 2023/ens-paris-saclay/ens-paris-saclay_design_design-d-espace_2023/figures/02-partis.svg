<text x="19" y="195" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">Un mur circulaire enveloppe un arbre. La</text>
<text x="19" y="200" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">cour reçoit directement le bruit routier</text>
<text x="19" y="205" font-family="DejaVu Sans, sans-serif" font-size="3.8" font-weight="400" fill="#212e2c" text-anchor="start">et la pluie.</text>
