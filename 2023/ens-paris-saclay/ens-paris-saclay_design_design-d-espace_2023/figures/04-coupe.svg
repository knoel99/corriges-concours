<text x="130.0" y="251.3" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#3b665b" text-anchor="middle">5,00 m</text>
<text x="264" y="85" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Lumière réfléchie</text>
<text x="264" y="97" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le vitrage en retrait éclaire d’abord une joue</text>
<text x="264" y="102" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">claire. Depuis l’assise, sa réflexion est</text>
<text x="264" y="107" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">visible au-dessus du mur.</text>
<text x="264" y="150" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Absorber et isoler</text>
<text x="264" y="162" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une double paroi lourde côté route limite la</text>
<text x="264" y="167" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">transmission. Un plafond de lattes disjointes</text>
<text x="264" y="172" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">sur absorbant corrige les résonances de la</text>
<text x="264" y="177" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">petite salle.</text>
<text x="264" y="219" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#3b665b" text-anchor="start">Essai sur maquette</text>
<text x="264" y="231" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Orienter le modèle selon le site et faire varier</text>
<text x="264" y="236" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">le soleil. Réduire la fente si elle éblouit une</text>
<text x="264" y="241" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">personne assise.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Coupe de principe. En phase technique, accorder la pente du toit, la découpe haute, les reprises de charge et les évacuations d’eau.</text>
