<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">Who gives, who chooses, who receives?</title>
<desc id="description">Morgan Curtis Inheritance and part of earnings Directed towards grassroots movements Marlene Engelhorn Campaign for general taxation Allocation by public institutions Yvon Chouinard Trust and environmental nonprofit Voting rights safeguard a defined mission Giving USA, 2021 67% of dollars came from individuals No breakdown by donor wealth or motive</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Who gives, who chooses, who receives?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Case</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Disposition of resources</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Decision-making power</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Morgan Curtis</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Inheritance and part of</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">earnings</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Directed towards grassroots</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">movements</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Marlene Engelhorn</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Campaign for general</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">taxation</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Allocation by public</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">institutions</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Yvon Chouinard</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Trust and environmental</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">nonprofit</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Voting rights safeguard a</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">defined mission</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Giving USA, 2021</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">67% of dollars came from</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">individuals</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">No breakdown by donor</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">wealth or motive</text>
</g>
</svg>
