<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">De la mobilisation aux garanties concrètes</title>
<desc id="description">Premières décisions dans La Manada Critique de l’exigence de résistance Le Tribunal suprême requalifie les faits en 2019 Pancartes des manifestantes Refuser le jugement sur la tenue de la victime Un slogan exprime une revendication sociale Qualification pénale Le consentement devient central La charge de la preuve reste à l’accusation Assistance intégrale Centres de crise et accueil spécialisé Les services ont leur propre calendrier</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De la mobilisation aux garanties concrètes</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de départ</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Changement</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui doit être distingué</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Premières décisions</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">dans La Manada</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Critique de l’exigence de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">résistance</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le Tribunal suprême</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">requalifie les faits en</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">2019</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Pancartes des</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">manifestantes</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Refuser le jugement sur la</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">tenue de la victime</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Un slogan exprime une</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">revendication sociale</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Qualification pénale</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Le consentement devient</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">central</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La charge de la preuve</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">reste à l’accusation</text>
<rect x="10" y="315" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">Assistance intégrale</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">Centres de crise et</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">accueil spécialisé</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Les services ont leur</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">propre calendrier</text>
</g>
</svg>
