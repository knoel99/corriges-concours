<svg xmlns="http://www.w3.org/2000/svg" width="720" height="364" viewBox="0 0 720 364" role="img" aria-labelledby="titre description">
<title id="titre">Où se mesure la coopération franco-allemande ?</title>
<desc id="description">Symbole Poignée de main du cinquantenaire en 2013 Les bras démesurés compensent l’éloignement Institutions Aix-la-Chapelle et coopérations locales Des désaccords subsistent sur les priorités Frontière Soins et centre de dépistage communs Contrôles rétablis unilatéralement en 2020 Jeunesse Échanges soutenus depuis 1963 Faible présence des jeunes des Länder orientaux</desc>
<rect width="720" height="364" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Où se mesure la coopération franco-allemande ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Échelle</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Preuve de rapprochement</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Épreuve de la distance</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Symbole</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Poignée de main du</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">cinquantenaire en 2013</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les bras démesurés</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">compensent l’éloignement</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Institutions</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Aix-la-Chapelle et</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">coopérations locales</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Des désaccords subsistent</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">sur les priorités</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Frontière</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Soins et centre de</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">dépistage communs</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Contrôles rétablis</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">unilatéralement en 2020</text>
<rect x="10" y="293" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="318" font-size="15" font-weight="700" fill="#162d3b">Jeunesse</text>
<text x="229" y="318" font-size="15" font-weight="400" fill="#162d3b">Échanges soutenus depuis</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">1963</text>
<text x="473" y="318" font-size="15" font-weight="400" fill="#162d3b">Faible présence des jeunes</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">des Länder orientaux</text>
</g>
</svg>
