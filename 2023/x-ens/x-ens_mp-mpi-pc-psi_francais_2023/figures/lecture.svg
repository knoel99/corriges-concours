<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">Qu’est-ce qui peut dédommager du travail ?</title>
<desc id="description">Cultiver et greffer Ajuster le geste et en voir l’effet Disposer du temps et pouvoir compter sur la récolte Observer une poulie Percevoir un rythme et en saisir le sens L’attention suppose du temps et une formation Imaginer un produit Éprouver le plaisir d’une invention commune La fin commerciale est fixée avant la discussion Interrompre le travail Reprendre la parole dans l’atelier Pouvoir agir ensuite sur les règles et les horaires</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qu’est-ce qui peut dédommager du travail ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Situation</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Plaisir possible</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Condition ou limite</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Cultiver et greffer</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Ajuster le geste et en</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">voir l’effet</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Disposer du temps et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">pouvoir compter sur la</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">récolte</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Observer une poulie</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Percevoir un rythme</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">et en saisir le sens</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">L’attention suppose</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">du temps et une formation</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Imaginer un produit</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Éprouver le plaisir d’une</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">invention commune</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">La fin commerciale est</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">fixée avant la discussion</text>
<rect x="10" y="315" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">Interrompre le</text>
<text x="24" y="362" font-size="15" font-weight="700" fill="#162d3b">travail</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">Reprendre la parole dans</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">l’atelier</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Pouvoir agir ensuite sur</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">les règles et les horaires</text>
</g>
</svg>
