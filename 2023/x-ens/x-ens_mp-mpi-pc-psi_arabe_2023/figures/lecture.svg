<svg xmlns="http://www.w3.org/2000/svg" width="720" height="386" viewBox="0 0 720 386" role="img" aria-labelledby="titre description">
<title id="titre">Qui peut financer les réponses à la crise climatique ?</title>
<desc id="description">Réduction des émissions Énergie, charbon et objectifs nationaux Les choix de court terme contredisent des engagements Adaptation Eau, villes et terres agricoles La protection coûte avant que le dommage soit évité Pertes et dommages Débat préalable à la COP27 Qui doit assumer les préjudices déjà subis ? Expérience vécue Femme accroupie devant un sol fendillé Les populations exposées disposent de moyens inégaux</desc>
<rect width="720" height="386" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui peut financer les réponses à la crise climatique ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Enjeu</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Échelle ou indice</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conflit de priorités</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Réduction des</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">émissions</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Énergie, charbon et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">objectifs nationaux</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Les choix de court terme</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">contredisent des</text>
<text x="473" y="161" font-size="15" font-weight="400" fill="#162d3b">engagements</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Adaptation</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Eau, villes et terres</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">agricoles</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">La protection coûte avant</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">que le dommage soit évité</text>
<rect x="10" y="248" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Pertes et dommages</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Débat préalable à la COP27</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Qui doit assumer les</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">préjudices déjà subis ?</text>
<rect x="10" y="315" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="340" font-size="15" font-weight="700" fill="#162d3b">Expérience vécue</text>
<text x="229" y="340" font-size="15" font-weight="400" fill="#162d3b">Femme accroupie devant un</text>
<text x="229" y="362" font-size="15" font-weight="400" fill="#162d3b">sol fendillé</text>
<text x="473" y="340" font-size="15" font-weight="400" fill="#162d3b">Les populations exposées</text>
<text x="473" y="362" font-size="15" font-weight="400" fill="#162d3b">disposent de moyens inégaux</text>
</g>
</svg>
