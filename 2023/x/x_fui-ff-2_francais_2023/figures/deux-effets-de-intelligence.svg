<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 212" role="img" aria-labelledby="titre description">
<title id="titre">Deux conséquences d’une même faculté</title>
<desc id="description">Bergson rattache deux difficultés parallèles à la réflexion humaine. Anticiper rend l’action incertaine et comparer les intérêts peut conduire à l’égoïsme.</desc>
<rect x="0" y="0" width="900" height="212" rx="0" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="10" y="70" width="241" height="88" rx="8" fill="#e5eff0"/>
<text x="29" y="106" font-size="24" font-weight="bold" fill="#173749">L’intelligence</text>
<text x="29" y="137" font-size="21" font-weight="normal" fill="#173749">permet de réfléchir.</text>
<path d="M251 114 L275 114" fill="none" stroke="#236278" stroke-width="3"/>
<path d="M275 56 L275 173" fill="none" stroke="#236278" stroke-width="3"/>
<path d="M275 56 L307 56" fill="none" stroke="#236278" stroke-width="3"/><polygon points="297.0,61.0 307.0,56.0 297.0,51.0" fill="#236278"/>
<path d="M275 173 L307 173" fill="none" stroke="#236278" stroke-width="3"/><polygon points="297.0,178.0 307.0,173.0 297.0,168.0" fill="#236278"/>
<rect x="311" y="13" width="573" height="84" rx="8" fill="#f5ebe2"/>
<rect x="311" y="124" width="573" height="79" rx="8" fill="#e7f0e9"/>
<text x="329" y="46" font-size="23" font-weight="bold" fill="#173749">Imaginer plusieurs avenirs</text>
<text x="329" y="77" font-size="21" font-weight="normal" fill="#173749">Le choix devient source de crainte ou d’espoir.</text>
<text x="329" y="157" font-size="23" font-weight="bold" fill="#173749">Comparer mon intérêt à celui du groupe</text>
<text x="329" y="188" font-size="21" font-weight="normal" fill="#173749">Je peux préférer mon avantage au bien commun.</text>
</g>
</svg>
