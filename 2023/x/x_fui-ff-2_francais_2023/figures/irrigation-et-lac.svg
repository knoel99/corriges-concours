<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 211" role="img" aria-labelledby="titre description">
<title id="titre">L’eau des fleuves à l’échelle du bassin de l’Aral</title>
<desc id="description">Les dérivations vers les cultures diminuent les apports au lac. Le barrage de 2005 a ensuite retenu une partie de l’eau dans le bassin nord.</desc>
<rect x="0" y="0" width="900" height="211" rx="0" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="10" y="43" font-size="23" font-weight="bold" fill="#173749">Les fleuves</text>
<text x="10" y="73" font-size="21" font-weight="normal" fill="#173749">alimentent le lac.</text>
<path d="M196 61 L232 61" fill="none" stroke="#236278" stroke-width="3"/>
<path d="M232 53 L232 153" fill="none" stroke="#236278" stroke-width="3"/>
<path d="M232 53 L274 53" fill="none" stroke="#236278" stroke-width="3"/><polygon points="264.0,58.0 274.0,53.0 264.0,48.0" fill="#236278"/>
<path d="M232 153 L274 153" fill="none" stroke="#236278" stroke-width="3"/><polygon points="264.0,158.0 274.0,153.0 264.0,148.0" fill="#236278"/>
<rect x="277" y="12" width="602" height="82" rx="8" fill="#f5ebe2"/>
<rect x="277" y="110" width="602" height="86" rx="8" fill="#e5eff0"/>
<text x="296" y="44" font-size="22" font-weight="bold" fill="#173749">L’eau dérivée irrigue les cultures.</text>
<text x="296" y="74" font-size="21" font-weight="normal" fill="#173749">Les apports au lac diminuent.</text>
<text x="296" y="142" font-size="22" font-weight="bold" fill="#173749">Au nord, le barrage retient de l’eau.</text>
<text x="296" y="174" font-size="21" font-weight="normal" fill="#173749">La salinité baisse et la pêche redevient possible.</text>
</g>
</svg>
