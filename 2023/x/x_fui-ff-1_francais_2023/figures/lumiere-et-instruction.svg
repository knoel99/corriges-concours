<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 207" role="img" aria-labelledby="titre description">
<title id="titre">La rue et l’esprit dans le discours de Hugo</title>
<desc id="description">La rue, le promeneur et le voleur trouvent trois correspondants dans la métaphore. Le mot « surtout » conduit de la sécurité urbaine à la priorité donnée à l’instruction.</desc>
<rect x="0" y="0" width="900" height="207" rx="0" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="32" font-size="23" font-weight="bold" fill="#173749">Sécurité des rues</text>
<text x="479" y="32" font-size="23" font-weight="bold" fill="#173749">Formation du jugement</text>
<text x="12" y="81" font-size="21" font-weight="normal" fill="#173749">Une rue peut rester dans le noir.</text>
<path d="M398 74 L455 74" fill="none" stroke="#236278" stroke-width="3"/><polygon points="445.0,79.0 455.0,74.0 445.0,69.0" fill="#236278"/>
<text x="479" y="81" font-size="21" font-weight="normal" fill="#173749">L’ignorance laisse l’esprit obscur.</text>
<text x="12" y="134" font-size="21" font-weight="normal" fill="#173749">Un voleur peut s’y dissimuler.</text>
<path d="M398 127 L455 127" fill="none" stroke="#236278" stroke-width="3"/><polygon points="445.0,132.0 455.0,127.0 445.0,122.0" fill="#236278"/>
<text x="479" y="134" font-size="21" font-weight="normal" fill="#173749">L’erreur peut passer inaperçue.</text>
<text x="12" y="187" font-size="21" font-weight="normal" fill="#173749">Un éclairage rend le danger visible.</text>
<path d="M398 180 L455 180" fill="none" stroke="#236278" stroke-width="3"/><polygon points="445.0,185.0 455.0,180.0 445.0,175.0" fill="#236278"/>
<text x="479" y="187" font-size="21" font-weight="normal" fill="#173749">L’instruction aide à le reconnaître.</text>
</g>
</svg>
