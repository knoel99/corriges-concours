<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 316" role="img" aria-labelledby="titre desc"><title id="titre">Comment se construit l’image de la lumière</title><desc id="desc">La rue : Un éclairage permet de repérer un danger.. Le jugement : L’instruction aide à distinguer une erreur ou un mensonge.. La décision publique : Hugo demande aux législateurs de multiplier les lieux de formation.</desc><rect width="890" height="316" fill="white"/><g font-family="DejaVu Sans, sans-serif">
<text x="20" y="35" font-size="24" font-weight="bold" fill="#243c46">Comment se construit l’image de la lumière</text>
<rect x="20" y="57" width="849" height="68" rx="7" fill="#e5eff1"/>
<text x="35" y="84" font-size="19" font-weight="bold" fill="#243c46">La rue</text>
<text x="35" y="110" font-size="17" font-weight="normal" fill="#243c46">Un éclairage permet de repérer un danger.</text>
<path d="M49 125 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="142" width="849" height="68" rx="7" fill="#f4ebdd"/>
<text x="35" y="169" font-size="19" font-weight="bold" fill="#243c46">Le jugement</text>
<text x="35" y="195" font-size="17" font-weight="normal" fill="#243c46">L’instruction aide à distinguer une erreur ou un mensonge.</text>
<path d="M49 210 v13 m-4 -5 4 5 4 -5" fill="none" stroke="#476772" stroke-width="2"/>
<rect x="20" y="227" width="849" height="68" rx="7" fill="#e7efdf"/>
<text x="35" y="254" font-size="19" font-weight="bold" fill="#243c46">La décision publique</text>
<text x="35" y="280" font-size="17" font-weight="normal" fill="#243c46">Hugo demande aux législateurs de multiplier les lieux de formation.</text>
</g></svg>
