<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 208" role="img" aria-labelledby="titre description">
<title id="titre">Relire la première page de Germinal</title>
<desc id="description">Trois démarches articulent lecture sensible d’Étienne, consultation d’archives minières et retour aux choix de narration de Zola.</desc>
<rect x="0" y="0" width="900" height="208" rx="0" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="11" y="12" width="274" height="182" rx="8" fill="#e5eff0"/>
<rect x="309" y="12" width="274" height="182" rx="8" fill="#f4e9df"/>
<rect x="607" y="12" width="280" height="182" rx="8" fill="#e5efea"/>
<text x="26" y="46" font-size="24" font-weight="bold" fill="#173749">Le roman</text>
<text x="26" y="88" font-size="21" font-weight="normal" fill="#173749">Étienne avance</text>
<text x="26" y="116" font-size="21" font-weight="normal" fill="#173749">dans la nuit. Le lecteur</text>
<text x="26" y="144" font-size="21" font-weight="normal" fill="#173749">partage son trouble.</text>
<text x="324" y="46" font-size="24" font-weight="bold" fill="#173749">Les archives</text>
<text x="324" y="88" font-size="21" font-weight="normal" fill="#173749">Photographies et plans</text>
<text x="324" y="116" font-size="21" font-weight="normal" fill="#173749">aident à situer la mine</text>
<text x="324" y="144" font-size="21" font-weight="normal" fill="#173749">dans son paysage.</text>
<text x="622" y="46" font-size="24" font-weight="bold" fill="#173749">La relecture</text>
<text x="622" y="88" font-size="21" font-weight="normal" fill="#173749">Que nous laisse voir</text>
<text x="622" y="116" font-size="21" font-weight="normal" fill="#173749">Zola à la hauteur</text>
<text x="622" y="144" font-size="21" font-weight="normal" fill="#173749">du voyageur ?</text>
<path d="M282 168 L307 168" fill="none" stroke="#236278" stroke-width="3"/><polygon points="297.0,173.0 307.0,168.0 297.0,163.0" fill="#236278"/>
<path d="M580 168 L605 168" fill="none" stroke="#236278" stroke-width="3"/><polygon points="595.0,173.0 605.0,168.0 595.0,163.0" fill="#236278"/>
</g>
</svg>
