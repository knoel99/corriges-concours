<svg xmlns="http://www.w3.org/2000/svg" width="850" height="272" viewBox="0 0 850 272" role="img"><title>Deux ouvriers reprennent un assemblage</title><desc>Comparer les motifs qui conduisent deux artisans à corriger le même défaut.</desc><rect x="0" y="0" width="850" height="272" fill="#faf9f3"/><text x="25" y="36" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#1d434d">Deux ouvriers reprennent un assemblage</text><rect x="24" y="62" width="382" height="154" fill="#e4ede8"/><text x="37" y="94" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#1d434d">Une inspection est annoncée</text><text x="37" y="128" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Le défaut serait sanctionné.</text><text x="37" y="156" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">La réparation renseigne sur</text><text x="37" y="184" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">le respect du contrôle.</text><rect x="428" y="62" width="382" height="154" fill="#eee3cc"/><text x="441" y="94" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#1d434d">Le défaut restera invisible</text><text x="441" y="128" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">Le défaut sera dangereux à terme.</text><text x="441" y="156" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">La réparation protège la personne</text><text x="441" y="184" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">qui utilisera le meuble.</text><text x="25" y="248" font-family="DejaVu Sans" font-size="18" font-weight="normal" fill="#1d434d">La qualité observable de la pièce laisse ouverte la question de la vertu.</text></svg>
