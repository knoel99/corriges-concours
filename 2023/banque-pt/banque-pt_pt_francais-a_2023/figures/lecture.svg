<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Que doit-on à celui qui a fait le travail ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Que doit-on à celui qui a fait le travail ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Voir l’activité</text>
<text x="201" y="71" font-size="15" font-weight="400" fill="#203c49">Le jardin de Corycos rend visible un savoir.</text>
<text x="549" y="62" font-size="14" font-weight="700" fill="#203c49">Reconnaître la</text>
<text x="549" y="79" font-size="14" font-weight="700" fill="#203c49">qualité</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="121" font-size="15" font-weight="700" fill="#203c49">Identifier la</text>
<text x="19" y="138" font-size="15" font-weight="700" fill="#203c49">personne</text>
<text x="201" y="130" font-size="15" font-weight="400" fill="#203c49">La marque recouvre une pluralité de voix.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Identifier la dette</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Donner des droits</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">En 1936, les ouvriers se réapproprient</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">l’atelier.</text>
<text x="549" y="180" font-size="14" font-weight="700" fill="#203c49">Reconnaître en</text>
<text x="549" y="197" font-size="14" font-weight="700" fill="#203c49">actes</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
