<text x="196" y="267" fill="#a96528" text-anchor="start" font-weight="400" font-size="13">Fécondation</text>
<text x="405" y="286" fill="#247b93" text-anchor="start" font-weight="400" font-size="14">Bleu : phase haploïde.</text>
<text x="405" y="311" fill="#397451" text-anchor="start" font-weight="400" font-size="14">Vert : phase diploïde.</text>
<text x="405" y="336" fill="#253e49" text-anchor="start" font-weight="400" font-size="13">La mitose se produit dans les deux phases.</text>
