<text x="185.0" y="91.5" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Sporophyte diploïde (2n)</text>
<text x="185.0" y="110.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Fougère adulte portant des sporanges.</text>
<rect x="410" y="64" width="312" height="64" rx="8" fill="#eaf3f6" stroke="#247b93" stroke-width="1.8"/>
<text x="566.0" y="91.5" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Spores haploïdes (n)</text>
<text x="566.0" y="110.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">La méiose a lieu dans les sporanges.</text>
