<path d="M404 98 L396.1 93.69" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<rect x="410" y="178" width="312" height="61" rx="8" fill="#eaf3f6" stroke="#247b93" stroke-width="1.8"/>
<text x="566.0" y="204.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Gamétophyte haploïde (n)</text>
<text x="566.0" y="223.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Prothalle issu des mitoses de la spore.</text>
