<svg xmlns="http://www.w3.org/2000/svg" width="750" height="366" viewBox="0 0 750 366"><rect width="750" height="366" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#253e49">
<text x="17" y="31" fill="#253e49" text-anchor="start" font-weight="700" font-size="21">Chez le Polypode, les mitoses développent deux générations</text>
