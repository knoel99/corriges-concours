<text x="185.0" y="204.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Gamètes haploïdes (n)</text>
<text x="185.0" y="223.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Produits par le gamétophyte.</text>
