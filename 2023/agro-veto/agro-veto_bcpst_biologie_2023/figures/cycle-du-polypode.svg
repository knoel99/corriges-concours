<text x="185.0" y="309.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Zygote diploïde (2n)</text>
<text x="185.0" y="328.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Sa descendance mitotique forme la fougère.</text>
