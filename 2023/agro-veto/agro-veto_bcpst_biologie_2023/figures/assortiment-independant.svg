<text x="554" y="254" fill="#397451" text-anchor="middle" font-weight="400" font-size="14">Au pôle supérieur : Ab</text>
<text x="38" y="303" fill="#253e49" text-anchor="start" font-weight="400" font-size="14">Dans une même méiose, les deux pôles reçoivent des combinaisons complémentaires.</text>
<text x="38" y="330" fill="#253e49" text-anchor="start" font-weight="400" font-size="14">Au fil des méioses : AB et ab, ou Ab et aB. Chaque X représente un chromosome dupliqué.</text>
