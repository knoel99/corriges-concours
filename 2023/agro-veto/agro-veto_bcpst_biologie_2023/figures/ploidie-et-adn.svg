<svg xmlns="http://www.w3.org/2000/svg" width="750" height="368" viewBox="0 0 750 368"><rect width="750" height="368" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#253e49">
<text x="17" y="31" fill="#253e49" text-anchor="start" font-weight="700" font-size="21">Comparer ploïdie et quantité d’ADN par noyau</text>
<rect x="230" y="53" width="291" height="49" rx="8" fill="#ecf4f5" stroke="#247b93" stroke-width="1.8"/>
<text x="375.5" y="82.5" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Cellule diploïde en G1 : 2n, 2C</text>
<path d="M375 104 L375 126" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M375 126 L370.69 118.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M375 126 L379.31 118.1" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<rect x="228" y="130" width="295" height="54" rx="8" fill="#ecf4f5" stroke="#247b93" stroke-width="1.8"/>
<text x="375.5" y="152.5" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Après l’unique phase S : 2n, 4C</text>
<text x="375.5" y="171.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">Chaque chromosome porte deux sœurs.</text>
<path d="M374 186 L374 199" fill="none" stroke="#253e49" stroke-width="2" stroke-dasharray="none"/>
<path d="M184 199 L562 199" fill="none" stroke="#253e49" stroke-width="2" stroke-dasharray="none"/>
<path d="M184 198 L184 218" fill="none" stroke="#397451" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M184 218 L179.69 210.1" fill="none" stroke="#397451" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M184 218 L188.31 210.1" fill="none" stroke="#397451" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M562 198 L562 218" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M562 218 L557.69 210.1" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M562 218 L566.31 210.1" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<rect x="23" y="221" width="322" height="63" rx="8" fill="#e8f1e5" stroke="#397451" stroke-width="1.8"/>
<text x="184.0" y="248.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Mitose : séparation des sœurs</text>
<text x="184.0" y="267.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">2 noyaux à 2n, 2C.</text>
<rect x="398" y="221" width="328" height="60" rx="8" fill="#f8edde" stroke="#a96528" stroke-width="1.8"/>
<text x="562.0" y="246.5" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Méiose I : séparation des homologues</text>
<text x="562.0" y="265.5" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">2 noyaux à n, 2C.</text>
<path d="M562 283 L562 301" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M562 301 L557.69 293.1" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M562 301 L566.31 293.1" fill="none" stroke="#a96528" stroke-width="2.2" stroke-dasharray="none"/>
<rect x="398" y="304" width="328" height="53" rx="8" fill="#f8edde" stroke="#a96528" stroke-width="1.8"/>
<text x="562.0" y="326.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">Méiose II : séparation des sœurs</text>
<text x="562.0" y="345.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">4 noyaux à n, 1C.</text>
<text x="29" y="316" fill="#253e49" text-anchor="start" font-weight="400" font-size="14">n : un jeu chromosomique.</text>
<text x="29" y="337" fill="#253e49" text-anchor="start" font-weight="400" font-size="14">C : ADN d’un jeu non répliqué.</text>
</g></svg>
