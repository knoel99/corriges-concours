<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">Pourquoi changer le nom d’une espèce pose-t-il problème ?</title>
<desc id="description">Nom problématique Hommage contesté ou dommage pour l’espèce. Modifier le nom d’usage et expliquer le changement. Stabilité scientifique Retrouver les travaux antérieurs dans plusieurs langues. Conserver une correspondance vérifiable entre les noms. Priorité de publication Un tiers peut publier à partir des observations d’autrui. Distinguer la validité du nom et le crédit du travail scientifique.</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Pourquoi changer le nom d’une espèce pose-t-il problème ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Dimension</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Intérêt en jeu</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Réponse possible</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Nom problématique</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Hommage contesté ou</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">dommage pour l’espèce.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Modifier le nom d’usage et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">expliquer le changement.</text>
<rect x="10" y="159" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Stabilité</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">scientifique</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Retrouver les travaux</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">antérieurs dans plusieurs</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">langues.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Conserver une</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">correspondance vérifiable</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">entre les noms.</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Priorité de</text>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">publication</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Un tiers peut publier à</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">partir des observations</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">d’autrui.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Distinguer la validité du</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">nom et le crédit du travail</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">scientifique.</text>
</g>
</svg>
