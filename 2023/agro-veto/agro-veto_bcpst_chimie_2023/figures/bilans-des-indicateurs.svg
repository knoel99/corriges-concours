<svg xmlns="http://www.w3.org/2000/svg" width="750" height="332" viewBox="0 0 750 332"><rect width="750" height="332" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#253e49">
<text x="17" y="31" fill="#253e49" text-anchor="start" font-weight="700" font-size="21">Les deux équivalences comptent des quantités de protons différentes</text>
<text x="46" y="79" fill="#253e49" text-anchor="start" font-weight="700" font-size="16">Départ</text>
<text x="272" y="79" fill="#253e49" text-anchor="start" font-weight="700" font-size="16">Premier virage</text>
<text x="522" y="79" fill="#253e49" text-anchor="start" font-weight="700" font-size="16">Second virage</text>
<rect x="27" y="102" width="170" height="67" rx="8" fill="#f7f7f1" stroke="#247b93" stroke-width="1.8"/>
<text x="112.0" y="131.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">OH⁻ et CO₃²⁻</text>
<text x="112.0" y="150.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">en solution</text>
<rect x="270" y="102" width="178" height="67" rx="8" fill="#f7f7f1" stroke="#a96528" stroke-width="1.8"/>
<text x="359.0" y="131.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">HCO₃⁻ majoritaire</text>
<text x="359.0" y="150.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">OH⁻ consommé</text>
<rect x="515" y="102" width="207" height="67" rx="8" fill="#f7f7f1" stroke="#397451" stroke-width="1.8"/>
<text x="618.5" y="131.0" fill="#253e49" text-anchor="middle" font-weight="700" font-size="14">CO₂ dissous / H₂CO₃</text>
<text x="618.5" y="150.0" fill="#253e49" text-anchor="middle" font-weight="400" font-size="14">prédominants</text>
<path d="M201 135 L264 135" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M264 135 L256.1 139.31" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M264 135 L256.1 130.69" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M451 135 L509 135" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M509 135 L501.1 139.31" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<path d="M509 135 L501.1 130.69" fill="none" stroke="#253e49" stroke-width="2.2" stroke-dasharray="none"/>
<text x="36" y="216" fill="#253e49" text-anchor="start" font-weight="400" font-size="16">Acide cumulé au premier virage : n(OH⁻) + n(CO₃²⁻).</text>
<text x="36" y="248" fill="#253e49" text-anchor="start" font-weight="400" font-size="16">Acide cumulé au second virage : n(OH⁻) + 2 n(CO₃²⁻).</text>
<text x="36" y="293" fill="#397451" text-anchor="start" font-weight="400" font-size="14">La différence entre les volumes mesure une seule fois la quantité initiale de carbonate.</text>
</g></svg>
