<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Ce qu’Angelica peut encore faire</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Ce qu’Angelica peut encore faire</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">Une lettre reçue ?</text>
<text x="205" y="62" font-size="15">Mara possède peut-être une nouvelle</text>
<text x="205" y="79" font-size="15">de Michele.</text>
<text x="524" y="70" font-size="15">Savoir</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">Une chambre visitée</text>
<text x="205" y="123" font-size="15">Les affaires du frère sont visibles. Ses</text>
<text x="205" y="140" font-size="15">derniers jours échappent.</text>
<text x="524" y="131" font-size="15">Constater</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">Un enfant à aider</text>
<text x="205" y="184" font-size="15">La parenté est incertaine. La famille</text>
<text x="205" y="201" font-size="15">envisage un envoi d’argent.</text>
<text x="524" y="192" font-size="15">Décider</text>
</g></svg>
