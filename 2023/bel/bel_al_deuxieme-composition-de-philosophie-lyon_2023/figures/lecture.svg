<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img"><title>Quel est le critère qui permet de compter les mondes ?</title><defs><marker id="end" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#496976"/></marker></defs><rect width="880" height="220" fill="white"/><rect x="18" y="20" width="265" height="88" rx="8" fill="#e4f0ee"/><text x="150.5" y="61.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Tout ce qui existe</text><text x="150.5" y="90.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">une totalité absolue</text><rect x="309" y="20" width="265" height="88" rx="8" fill="#f4ecde"/><text x="441.5" y="61.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Un ordre constitué</text><text x="441.5" y="90.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">unité de relations</text><rect x="600" y="20" width="265" height="88" rx="8" fill="#e8edf5"/><text x="732.5" y="61.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700">Un monde possible</text><text x="732.5" y="90.0" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">un tout cohérent</text><text x="150" y="145" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Rien ne lui est extérieur.</text><text x="440" y="145" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">On peut en comparer deux.</text><text x="734" y="145" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">Son actualité reste à établir.</text><text x="440" y="197" text-anchor="middle" fill="#17354a" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400">Compter suppose d’indiquer ce qui distingue chaque unité et en quel sens elle existe.</text></svg>
