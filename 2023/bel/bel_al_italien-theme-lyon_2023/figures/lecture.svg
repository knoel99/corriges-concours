<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Les destinataires du voyage</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Les destinataires du voyage</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">La voix du récit</text>
<text x="205" y="62" font-size="15">Tu traverses des villes où personne ne</text>
<text x="205" y="79" font-size="15">t’attend.</text>
<text x="524" y="70" font-size="15">Tu générique</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">Oswald en route</text>
<text x="205" y="123" font-size="15">La guerre commande le détour, la</text>
<text x="205" y="140" font-size="15">maladie impose la halte.</text>
<text x="524" y="131" font-size="15">Bisognava</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">Oswald se parle</text>
<text x="205" y="184" font-size="15">La patrie peut exiger un service ; un</text>
<text x="205" y="201" font-size="15">père recueillerait son fils.</text>
<text x="524" y="192" font-size="15">Ti accoglierebbe</text>
</g></svg>
