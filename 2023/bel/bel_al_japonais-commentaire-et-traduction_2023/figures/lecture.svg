<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Comment le regard du voyageur se corrige</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Comment le regard du voyageur se corrige</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">La voiture</text>
<text x="205" y="62" font-size="15">Les mots du récit suggèrent une prise.</text>
<text x="205" y="79" font-size="15">Les garçons sont propriétaires.</text>
<text x="524" y="70" font-size="15">Une lecture rectifiée</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">Les poissons</text>
<text x="205" y="115" font-size="15">Les nageurs ressemblent à des</text>
<text x="205" y="132" font-size="15">sportifs, puis les chemises aux</text>
<text x="205" y="149" font-size="15">poissons.</text>
<text x="524" y="123" font-size="15">Une comparaison</text>
<text x="524" y="140" font-size="15">réversible</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">L’île et Tokyo</text>
<text x="205" y="184" font-size="15">Les Nisei comparent deux façons</text>
<text x="205" y="201" font-size="15">d’accueillir les violonistes.</text>
<text x="524" y="184" font-size="15">Un observateur</text>
<text x="524" y="201" font-size="15">observé</text>
</g></svg>
