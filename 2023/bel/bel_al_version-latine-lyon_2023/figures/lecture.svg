<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Le fleuve change de fonction</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Le fleuve change de fonction</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">Vers 1–8</text>
<text x="205" y="62" font-size="15">Tant que le Danube coule, il fait écran.</text>
<text x="205" y="79" font-size="15">L’hiver paraît.</text>
<text x="524" y="70" font-size="15">Une frontière</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">Vers 9–22</text>
<text x="205" y="123" font-size="15">Neige, cheveux et vin rendent le gel</text>
<text x="205" y="140" font-size="15">sensible à l’œil et à l’oreille.</text>
<text x="524" y="131" font-size="15">Une expérience</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">Vers 23–28</text>
<text x="205" y="184" font-size="15">L’eau court sous la glace. Le cheval</text>
<text x="205" y="201" font-size="15">passe sur le fleuve.</text>
<text x="524" y="192" font-size="15">Un chemin</text>
</g></svg>
