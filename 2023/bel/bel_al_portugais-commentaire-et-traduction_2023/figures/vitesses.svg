<svg xmlns="http://www.w3.org/2000/svg" width="780" height="174" viewBox="0 0 780 174" role="img"><title>Quelles vitesses la chronique fait-elle sentir ?</title><rect width="780" height="174" fill="white"/><rect x="8" y="12" width="249" height="148" rx="6" fill="#eef4f7" stroke="#2a586a"/><text x="132.5" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2a586a">3 km/h</text><text x="132.5" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#2a586a">La machine de Patrocínio</text><text x="132.5" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#2a586a">et l’arbre de la rue</text><rect x="266" y="12" width="249" height="148" rx="6" fill="#edf5f1" stroke="#1f6d62"/><text x="390.5" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f6d62">Quelques initiales</text><text x="390.5" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1f6d62">La parole accélérée</text><text x="390.5" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#1f6d62">puis longuement décodée</text><rect x="524" y="12" width="249" height="148" rx="6" fill="#f7f2ea" stroke="#79532c"/><text x="648.5" y="51" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#79532c">120 km/h</text><text x="648.5" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#79532c">Une voiture de course</text><text x="648.5" y="123" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#79532c">et une carrière fulgurante</text></svg>