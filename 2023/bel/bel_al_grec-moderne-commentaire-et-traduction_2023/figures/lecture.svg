<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" role="img" aria-labelledby="t">
<title id="t">Où la tradition reste-t-elle vivante ?</title>
<g font-family="DejaVu Sans, sans-serif" fill="#233d48">
<text x="12" y="26" font-size="21" font-weight="bold">Où la tradition reste-t-elle vivante ?</text>
<rect x="8" y="38" width="704" height="57" rx="5" fill="#deedec"/>
<text x="19" y="70" font-size="15">Une voix partagée</text>
<text x="205" y="62" font-size="15">Le « nous » du début parle avec la</text>
<text x="205" y="79" font-size="15">voix de Makriyannis.</text>
<text x="524" y="70" font-size="15">Une expérience</text>
<rect x="8" y="99" width="704" height="57" rx="5" fill="#f3e9d8"/>
<text x="19" y="131" font-size="15">Un lieu de culte</text>
<text x="205" y="123" font-size="15">Les chrétiens réemploient les pierres</text>
<text x="205" y="140" font-size="15">et les emplacements.</text>
<text x="524" y="131" font-size="15">Deux formes</text>
<rect x="8" y="160" width="704" height="57" rx="5" fill="#e1ebf4"/>
<text x="19" y="192" font-size="15">Un regard divisé</text>
<text x="205" y="184" font-size="15">Autour de 1821, la ruine devient</text>
<text x="205" y="201" font-size="15">l’objet d’une nostalgie.</text>
<text x="524" y="192" font-size="15">Un changement</text>
</g></svg>
