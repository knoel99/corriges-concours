<svg xmlns="http://www.w3.org/2000/svg" width="840" height="164" viewBox="0 0 840 164" role="img"><title>Les étapes de la visite et le regard de Romuald</title><rect width="840" height="164" fill="white"/><rect x="8" y="9" width="264" height="143" rx="10" fill="#e3eee9"/><text x="140" y="45" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Le messager</text><text x="140" y="84" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">Barbara avertit le prêtre</text><text x="140" y="125" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">cause réelle</text><rect x="288" y="9" width="264" height="143" rx="10" fill="#f4ecdf"/><text x="420" y="45" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">La visite</text><text x="420" y="84" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">Des questions sans suite</text><text x="420" y="125" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">retard</text><rect x="568" y="9" width="264" height="143" rx="10" fill="#e2eaf1"/><text x="700" y="45" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">La nouvelle</text><text x="700" y="84" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400">La voix devient une trompette</text><text x="700" y="125" fill="#153842" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400">perception de Romuald</text><line x1="273" x2="286" y1="79" y2="79" stroke="#426776" stroke-width="3" /><line x1="553" x2="566" y1="79" y2="79" stroke="#426776" stroke-width="3" /></svg>
