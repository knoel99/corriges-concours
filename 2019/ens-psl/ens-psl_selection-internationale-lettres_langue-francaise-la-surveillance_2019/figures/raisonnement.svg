<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment le désir de contrôle circule-t-il ?</title>
<desc id="description">État Recueillir les traces de communication. Surveillance à très grande échelle. Entreprises Convertir les données en profils. Exploitation commerciale. Particuliers Suivre les autres ou se mesurer soi-même. Acceptation quotidienne du contrôle.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment le désir de contrôle circule-t-il ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Acteur</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Geste</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">État</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Recueillir les traces de</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">communication.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Surveillance à très grande</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">échelle.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Entreprises</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Convertir les données en</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">profils.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Exploitation commerciale.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Particuliers</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Suivre les autres ou se</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">mesurer soi-même.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Acceptation quotidienne du</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">contrôle.</text>
</g>
</svg>
