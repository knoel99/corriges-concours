<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Trois opérations permettant de comparer les fonctions et l’effectivité des normes du travail.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="47" font-size="15" fill="white">Protéger</text><text x="237" y="39" font-size="15" fill="#173946">Une norme impérative limite certains choix contractuels</text><text x="237" y="56" font-size="15" fill="#173946">pour protéger repos, santé ou sécurité.</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="117" font-size="15" fill="white">Négocier</text><text x="237" y="109" font-size="15" fill="#173946">Une règle collective peut renforcer un plancher ou</text><text x="237" y="126" font-size="15" fill="#173946">redéfinir les marges d’adaptation d’une entreprise.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="187" font-size="15" fill="white">Faire appliquer</text><text x="237" y="179" font-size="15" fill="#173946">La portée d’un engagement dépend de son champ, de</text><text x="237" y="196" font-size="15" fill="#173946">l’autorité compétente et des recours accessibles.</text></g></svg>
