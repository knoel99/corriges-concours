<svg xmlns="http://www.w3.org/2000/svg" width="880" height="301" viewBox="0 0 880 301" role="img"><title>Quel est l’objet du jugement ?</title><desc>Comparaison de situations. Un acte : Contester le calcul ; L’interlocutrice peut vérifier les raisons de l’objection.. Un bien : Renoncer à un avantage ; La valeur du bien pour autrui peut différer de la mienne.. Une personne : Lui retirer toute importance ; Son droit de répondre est lui-même écarté.</desc><rect width="880" height="301" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="21" y="37" font-size="25" fill="#17394c" font-weight="bold">Quel est l’objet du jugement ?</text><rect x="24" y="61" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="61" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="89" font-size="16" fill="#17394c" font-weight="bold">Un acte</text><text x="231" y="86" font-size="18" fill="#17394c" font-weight="bold">Contester le calcul</text><text x="231" y="111" font-size="15" fill="#17394c">L’interlocutrice peut vérifier les raisons de l’objection.</text><rect x="24" y="136" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="136" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="164" font-size="16" fill="#17394c" font-weight="bold">Un bien</text><text x="231" y="161" font-size="18" fill="#17394c" font-weight="bold">Renoncer à un avantage</text><text x="231" y="186" font-size="15" fill="#17394c">La valeur du bien pour autrui peut différer de la mienne.</text><rect x="24" y="211" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="211" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="239" font-size="16" fill="#17394c" font-weight="bold">Une personne</text><text x="231" y="236" font-size="18" fill="#17394c" font-weight="bold">Lui retirer toute importance</text><text x="231" y="261" font-size="15" fill="#17394c">Son droit de répondre est lui-même écarté.</text></g></svg>
