<svg xmlns="http://www.w3.org/2000/svg" width="810" height="278" viewBox="0 0 810 278" role="img" aria-labelledby="titre description"><title id="titre">Trois opérations qui font parler une apparence</title><desc id="description">L’orateur exige que le soupçon de débauche soit corroboré, le biographe compose une série d’écarts vestimentaires, l’historien reconstruit les règles qui rendent ces écarts lisibles.</desc><rect width="810" height="278" fill="#fff"/>
<rect x="9" y="12" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Cicéron · Plaidoyer</text>
<text x="167.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Asie, danse, train de vie présumé</text>
<rect x="384" y="12" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Tester une accusation</text>
<text x="592.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Quels faits établiraient cette conduite ?</text>
<path d="M330 48 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="100" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Suétone · Biographie</text>
<text x="167.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Insignes du triomphe portés d’avance</text>
<rect x="384" y="100" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Composer un portrait</text>
<text x="592.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Quel privilège le geste anticipe-t-il ?</text>
<path d="M330 136 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="188" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Barthes · Histoire sociale</text>
<text x="167.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Forme de l’habit, qualité du porteur</text>
<rect x="384" y="188" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Reconstituer une institution</text>
<text x="592.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Qui peut porter quoi, quand et où ?</text>
