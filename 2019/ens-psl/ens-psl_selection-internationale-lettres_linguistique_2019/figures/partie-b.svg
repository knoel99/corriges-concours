<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Que faut-il comparer pour tester une grammaire ?</title>
<desc id="description">Proportion brute de noms avec deux articles Dépend notamment du nombre d’occurrences. Peu de diversité ne suffit pas à conclure. Modèle combinatoire indépendant Prédit la diversité pour la taille du corpus et les fréquences. Accord étroit avec les échantillons humains étudiés. Paires mémorisées Restitue les couples observés auprès des adultes. Moins de diversité que dans le langage enfantin.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que faut-il comparer pour tester une grammaire ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Mesure ou modèle</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Rôle</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Résultat</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Proportion brute de</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">noms avec deux</text>
<text x="24" y="161" font-size="15" font-weight="700" fill="#162d3b">articles</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Dépend notamment du nombre</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">d’occurrences.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Peu de diversité ne suffit</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">pas à conclure.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Modèle combinatoire</text>
<text x="24" y="228" font-size="15" font-weight="700" fill="#162d3b">indépendant</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Prédit la diversité pour</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">la taille du corpus et les</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">fréquences.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Accord étroit avec les</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">échantillons humains</text>
<text x="473" y="250" font-size="15" font-weight="400" fill="#162d3b">étudiés.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Paires mémorisées</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">Restitue les couples</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">observés auprès des</text>
<text x="229" y="339" font-size="15" font-weight="400" fill="#162d3b">adultes.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Moins de diversité que dans</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">le langage enfantin.</text>
</g>
</svg>
