<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="titre description">
<title id="titre">Deux histoires de largeur qui dissocient les lectures</title>
<desc id="description">10 puis 12 puis 15 m Deux élargissements. 15 m n’avait encore jamais été atteint. 15 puis 10 puis 15 m Un seul élargissement. La valeur initiale de 15 m est retrouvée.</desc>
<rect width="720" height="230" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux histoires de largeur qui dissocient les lectures</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Histoire</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Répétition du changement</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Retour à une valeur</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">10 puis 12 puis 15 m</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Deux élargissements.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">15 m n’avait encore jamais</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">été atteint.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">15 puis 10 puis 15 m</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Un seul élargissement.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La valeur initiale de 15 m</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">est retrouvée.</text>
</g>
</svg>
