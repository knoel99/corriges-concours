<svg xmlns="http://www.w3.org/2000/svg" width="948" height="397" viewBox="0 0 948 397" role="img">
<title>Qui épargne, qui finance, et à quel moment ?</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Décision initiale</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Transmission</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Résultat possible</text>
<rect x="13" y="62" width="302" height="69" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Un ménage consomme moins</text>
<rect x="323" y="62" width="302" height="69" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Il conserve un dépôt</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">disponible</text>
<rect x="633" y="62" width="302" height="69" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Une dépense imprévue devient</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">supportable</text>
<rect x="13" y="140" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="167" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Une entreprise commande une</text>
<text x="24" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">machine</text>
<rect x="323" y="140" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="167" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Le crédit permet de payer le</text>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">constructeur</text>
<rect x="633" y="140" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="167" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">La production crée des</text>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">revenus, donc une épargne</text>
<text x="644" y="213" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">réalisée</text>
<rect x="13" y="241" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Tous souhaitent accroître</text>
<text x="24" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">leur réserve</text>
<rect x="323" y="241" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Si les ventes baissent, les</text>
<text x="334" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">entreprises ajustent leur</text>
<text x="334" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">production</text>
<rect x="633" y="241" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">À investissement inchangé, le</text>
<text x="644" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">revenu baisse et l’épargne</text>
<text x="644" y="314" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">totale reste égale à I</text>
<text x="19" y="359" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">La dernière ligne suppose une économie fermée sans État, des prix fixes et des capacités</text>
<text x="19" y="383" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">disponibles.</text>
</svg>
