<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" role="img">
<title>Trois sens de la durée</title>
<rect width="800" height="358" fill="#faf7ef"/>
<g font-family="DejaVu Sans, sans-serif" fill="#182f38">
<text x="30" y="48" font-size="25" font-weight="bold">Trois sens de la durée</text>
<path d="M 46 90 V 290" fill="none" stroke="#47726b" stroke-width="4"/>
<circle cx="46" cy="96" r="9" fill="#28665e"/>
<text x="75" y="101" font-size="20" font-weight="bold">Une méthode réutilisable</text>
<text x="75" y="129" font-size="17">Thucydide confronte les témoignages. Euclide transmet un raisonnement</text>
<text x="75" y="151" font-size="17">vérifiable.</text>
<circle cx="46" cy="186" r="9" fill="#28665e"/>
<text x="75" y="191" font-size="20" font-weight="bold">Des supports transformés</text>
<text x="75" y="219" font-size="17">Papyrus fragmentaires et compilations juridiques imposent de reconstruire</text>
<text x="75" y="241" font-size="17">la transmission.</text>
<circle cx="46" cy="276" r="9" fill="#28665e"/>
<text x="75" y="281" font-size="20" font-weight="bold">Un usage critique</text>
<text x="75" y="309" font-size="17">L’objet préservé permet aussi de comprendre une institution que l’on ne</text>
<text x="75" y="331" font-size="17">reprend pas.</text>
</g></svg>
