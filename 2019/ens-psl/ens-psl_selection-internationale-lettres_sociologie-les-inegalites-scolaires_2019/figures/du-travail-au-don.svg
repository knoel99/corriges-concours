<svg xmlns="http://www.w3.org/2000/svg" width="780" height="197" viewBox="0 0 780 197" role="img"><title>À quelle étape une performance est-elle interprétée comme un don ?</title><rect width="100%" height="100%" fill="#fbfcf9"/>
<text x="16" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Moment</text>
<text x="245" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Observation</text>
<text x="490" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Interprétation à vérifier</text>
<rect x="7" y="43" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Avant l’épreuve</text>
<text x="245" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Occasions de pratiquer</text>
<text x="490" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Comment se forme l’aisance ?</text>
<rect x="7" y="90" width="765" height="40" rx="6" fill="#f1f1e6"/>
<text x="16" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Pendant l’épreuve</text>
<text x="245" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Une performance évaluée</text>
<text x="490" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Qu’attend le correcteur ?</text>
<rect x="7" y="137" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Après l’épreuve</text>
<text x="245" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Une aptitude attribuée</text>
<text x="490" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Sur quelles preuves ?</text></svg>
