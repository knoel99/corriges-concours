<svg xmlns="http://www.w3.org/2000/svg" width="880" height="304" viewBox="0 0 880 304" role="img"><title>Comment la lecture répond à une solitude</title><desc>Le monde. Les sentiments sont mal compris.. La condamnation sociale touche aussi la personne. Le conditionnel. Le lecteur risquerait de se croire seul.. La seconde conséquence serait de se détester. Le livre. Une voix peut parvenir jusqu’à lui.. La solitude devient un lieu possible de reconnaissance.</desc><rect width="880" height="304" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="23" y="38" font-size="24" fill="#17394c" font-weight="bold">Comment la lecture répond à une solitude</text><rect x="23" y="59" width="833" height="71" fill="#e6edef" stroke="none" stroke-width="1"/><rect x="23" y="59" width="7" height="71" fill="#92652f" stroke="none" stroke-width="1"/><text x="43" y="96" font-size="16" fill="#17394c" font-weight="bold">Le monde</text><text x="224" y="87" font-size="17" fill="#17394c" font-weight="bold">Les sentiments sont mal compris.</text><text x="224" y="112" font-size="15" fill="#17394c">La condamnation sociale touche aussi la personne.</text><rect x="23" y="139" width="833" height="71" fill="#e6edef" stroke="none" stroke-width="1"/><rect x="23" y="139" width="7" height="71" fill="#92652f" stroke="none" stroke-width="1"/><text x="43" y="176" font-size="16" fill="#17394c" font-weight="bold">Le conditionnel</text><text x="224" y="167" font-size="17" fill="#17394c" font-weight="bold">Le lecteur risquerait de se croire seul.</text><text x="224" y="192" font-size="15" fill="#17394c">La seconde conséquence serait de se détester.</text><rect x="23" y="219" width="833" height="71" fill="#e6edef" stroke="none" stroke-width="1"/><rect x="23" y="219" width="7" height="71" fill="#92652f" stroke="none" stroke-width="1"/><text x="43" y="256" font-size="16" fill="#17394c" font-weight="bold">Le livre</text><text x="224" y="247" font-size="17" fill="#17394c" font-weight="bold">Une voix peut parvenir jusqu’à lui.</text><text x="224" y="272" font-size="15" fill="#17394c">La solitude devient un lieu possible de reconnaissance.</text></g></svg>
