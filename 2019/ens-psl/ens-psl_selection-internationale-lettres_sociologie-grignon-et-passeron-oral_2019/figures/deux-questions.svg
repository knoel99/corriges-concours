<svg xmlns="http://www.w3.org/2000/svg" width="780" height="197" viewBox="0 0 780 197" role="img"><title>Deux questions complémentaires pour une même pratique culturelle.</title><rect width="100%" height="100%" fill="#fbfcf9"/>
<text x="16" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Point d’observation</text>
<text x="245" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Exemple de question</text>
<text x="490" y="29" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="17" fill="#183342">Matériau possible</text>
<rect x="7" y="43" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Sens interne</text>
<text x="245" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Qui est estimé par les siens ?</text>
<text x="490" y="68" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Observations et entretiens</text>
<rect x="7" y="90" width="765" height="40" rx="6" fill="#f1f1e6"/>
<text x="16" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Rapports de pouvoir</text>
<text x="245" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Où est-elle reconnue ?</text>
<text x="490" y="115" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Accès aux lieux, jugements</text>
<rect x="7" y="137" width="765" height="40" rx="6" fill="#e3efee"/>
<text x="16" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Croisement</text>
<text x="245" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Sa valeur varie-t-elle ?</text>
<text x="490" y="162" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#183342">Comparer les situations</text></svg>
