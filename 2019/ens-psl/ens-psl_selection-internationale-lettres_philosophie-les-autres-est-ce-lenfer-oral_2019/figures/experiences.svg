<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 217" role="img" aria-labelledby="titre description">
<title id="titre">Jugement et réponse dans une scène de classe</title>
<desc id="description">Une même hésitation peut être interprétée comme une incapacité définitive, ou laisser place à une parole nouvelle. Les réactions du groupe transforment la portée du jugement.</desc>
<rect width="900" height="217" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="8" y="64" width="271" height="87" rx="6" fill="#eaf0f1"/>
<text x="24" y="100" font-size="23" font-weight="bold" fill="#19384a">Une élève hésite</text>
<text x="24" y="130" font-size="21" font-weight="normal" fill="#19384a">pendant son exposé.</text>
<path d="M 280 105 L 318 105 M 318 53 L 318 164 M 318 53 L 349 53 m -8 -6 l 8 6 l -8 6 M 318 164 L 349 164 m -8 -6 l 8 6 l -8 6" fill="none" stroke="#316579" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="356" y="13" width="535" height="82" rx="6" fill="#f5e9df"/>
<text x="371" y="45" font-size="22" font-weight="bold" fill="#19384a">Le groupe parle à sa place.</text>
<text x="371" y="76" font-size="21" font-weight="normal" fill="#19384a">Son hésitation devient une réputation.</text>
<rect x="356" y="123" width="535" height="82" rx="6" fill="#e7efe9"/>
<text x="371" y="155" font-size="22" font-weight="bold" fill="#19384a">Un camarade attend et lui répond.</text>
<text x="371" y="186" font-size="21" font-weight="normal" fill="#19384a">Sa parole peut modifier le premier jugement.</text>
</g></svg>
