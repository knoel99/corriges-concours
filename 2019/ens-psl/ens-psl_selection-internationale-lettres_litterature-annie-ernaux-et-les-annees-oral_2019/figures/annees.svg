<svg xmlns="http://www.w3.org/2000/svg" width="810" height="282" viewBox="0 0 810 282" role="img" aria-labelledby="titre description">
<title id="titre">À quelle échelle s’écrit le souvenir ?</title>
<desc id="description">Les jeunes ménages — Le crédit et la télévision règlent le temps.. Le banc du jardin — Le souci des enfants redistribue les rôles.. La table de famille — Le calcul du coût du travail devient un sujet de conversation..</desc>
<rect width="810" height="282" fill="#ffffff" rx="6"/>
<rect x="1" y="1" width="808" height="51" fill="#234555" rx="5"/>
<text x="17" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Point d’observation</text>
<text x="311" y="34" fill="#ffffff" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700">Détail qui change de sens</text>
<rect x="1" y="56" width="808" height="70" rx="3" fill="#edf4f3"/>
<text x="17" y="99" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Les jeunes ménages</text>
<text x="311" y="85" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Le crédit et la télévision règlent le</text>
<text x="311" y="110" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">temps.</text>
<rect x="1" y="130" width="808" height="70" rx="3" fill="#f4f2ed"/>
<text x="17" y="173" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">Le banc du jardin</text>
<text x="311" y="159" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Le souci des enfants redistribue les</text>
<text x="311" y="184" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">rôles.</text>
<rect x="1" y="204" width="808" height="70" rx="3" fill="#edf1f8"/>
<text x="17" y="247" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700">La table de famille</text>
<text x="311" y="233" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">Le calcul du coût du travail devient un</text>
<text x="311" y="258" fill="#182c3a" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400">sujet de conversation.</text>
<path d="M292 55 V274" stroke="#acb9bc" stroke-width="1"/>
</svg>
