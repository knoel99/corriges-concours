<svg xmlns="http://www.w3.org/2000/svg" width="760" height="228" viewBox="0 0 760 228" role="img"><title>Trois fonctions à distinguer chez Kelsen pour analyser une même controverse d’interprétation.</title><g font-family="DejaVu Sans, sans-serif"><rect x="2" y="9" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="9" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="47" font-size="15" fill="white">Science juridique</text><text x="237" y="31" font-size="15" fill="#173946">Dégager les significations possibles et les arguments</text><text x="237" y="48" font-size="15" fill="#173946">qui les soutiennent. Résultat attendu : un cadre</text><text x="237" y="65" font-size="15" fill="#173946">explicité.</text><rect x="2" y="79" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="79" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="117" font-size="15" fill="white">Politique juridique</text><text x="237" y="109" font-size="15" fill="#173946">Préférer une solution et chercher à en convaincre</text><text x="237" y="126" font-size="15" fill="#173946">autrui. Sa justification comporte un jugement de valeur.</text><rect x="2" y="149" width="218" height="65" rx="4" fill="#18465a"/><rect x="225" y="149" width="533" height="65" rx="4" fill="#eaf1f3"/><text x="13" y="187" font-size="15" fill="white">Organe compétent</text><text x="237" y="179" font-size="15" fill="#173946">Décider dans les formes du droit positif. L’habilitation</text><text x="237" y="196" font-size="15" fill="#173946">donne effet à l’acte dans l’ordre juridique.</text></g></svg>
