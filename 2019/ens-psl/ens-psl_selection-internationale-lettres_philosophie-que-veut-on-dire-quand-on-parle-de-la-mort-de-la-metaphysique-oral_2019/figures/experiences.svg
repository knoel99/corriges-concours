<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 212" role="img" aria-labelledby="titre description">
<title id="titre">Trois diagnostics sur la métaphysique</title>
<desc id="description">Le constat d’un recul historique, la critique des limites du savoir et l’examen du sens d’une phrase demandent chacun une preuve distincte.</desc>
<rect width="900" height="212" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="32" font-size="23" font-weight="bold" fill="#19384a">Quel diagnostic pose-t-on ?</text>
<text x="459" y="32" font-size="23" font-weight="bold" fill="#19384a">Que faudrait-il montrer ?</text>
<rect x="8" y="47" width="883" height="47" rx="6" fill="#edf2f1"/>
<text x="18" y="78" font-size="20" font-weight="normal" fill="#19384a">Une doctrine a perdu son autorité.</text>
<text x="459" y="78" font-size="20" font-weight="normal" fill="#19384a">Comparer ses usages à deux époques.</text>
<rect x="8" y="98" width="883" height="47" rx="6" fill="#f4ece1"/>
<text x="18" y="129" font-size="20" font-weight="normal" fill="#19384a">Un savoir sort de son domaine.</text>
<text x="459" y="129" font-size="20" font-weight="normal" fill="#19384a">Montrer la limite de son raisonnement.</text>
<rect x="8" y="149" width="883" height="47" rx="6" fill="#edf2f1"/>
<text x="18" y="180" font-size="20" font-weight="normal" fill="#19384a">Un mot fait croire à un objet.</text>
<text x="459" y="180" font-size="20" font-weight="normal" fill="#19384a">Vérifier le rôle logique de ses mots.</text>
</g></svg>
