<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titre" viewBox="0 0 720 170">
<title id="titre">Le scrutin, l’appartenance et le lieu de résidence.</title><rect width="720" height="170" fill="white"/>
<rect x="6" y="6" width="230" height="155" rx="9" stroke="#acc5c7" fill="#f2f7f6"/><path d="M18 57 h206" stroke="#b8caca"/>
<text x="19" y="41" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#17363b">Française majeure</text>
<text x="19" y="86" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">Résidant en France,</text>
<text x="19" y="113" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">elle peut participer</text>
<text x="19" y="140" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">à la présidentielle.</text>
<rect x="245" y="6" width="230" height="155" rx="9" stroke="#acc5c7" fill="#f2f7f6"/><path d="M257 57 h206" stroke="#b8caca"/>
<text x="258" y="41" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#17363b">Italien majeur</text>
<text x="258" y="86" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">Résidant en France,</text>
<text x="258" y="113" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">il peut voter aux</text>
<text x="258" y="140" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">municipales françaises.</text>
<rect x="484" y="6" width="230" height="155" rx="9" stroke="#acc5c7" fill="#f2f7f6"/><path d="M496 57 h206" stroke="#b8caca"/>
<text x="497" y="41" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" fill="#17363b">État tiers</text>
<text x="497" y="86" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">Pour ce ressortissant,</text>
<text x="497" y="113" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">vivre en France</text>
<text x="497" y="140" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" fill="#17363b">ne suffit pas pour voter.</text>
</svg>
