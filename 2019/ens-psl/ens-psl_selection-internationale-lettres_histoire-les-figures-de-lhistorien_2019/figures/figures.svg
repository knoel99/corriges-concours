<svg xmlns="http://www.w3.org/2000/svg" width="880" height="376" viewBox="0 0 880 376" role="img"><title>Que cherche le lecteur dans ces quatre enquêtes ?</title><desc>Comparaison de lectures. Michelet : Présence et continuité ; Comment faire sentir plusieurs dimensions d’une vie passée ?. Braudel : Présence et mécanisme ; Que change la superposition de temporalités distinctes ?. Ginzburg : Enquête par indices ; Que peut-on inférer des paroles consignées par les juges ?. Scott : Catégorie d’analyse ; Quelle relation de pouvoir une distinction rend-elle visible ?</desc><rect width="880" height="376" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="21" y="37" font-size="25" fill="#17394c" font-weight="bold">Que cherche le lecteur dans ces quatre enquêtes ?</text><rect x="24" y="61" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="61" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="89" font-size="16" fill="#17394c" font-weight="bold">Michelet</text><text x="240" y="86" font-size="18" fill="#17394c" font-weight="bold">Présence et continuité</text><text x="240" y="111" font-size="15" fill="#17394c">Comment faire sentir plusieurs dimensions d’une vie passée ?</text><rect x="24" y="136" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="136" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="164" font-size="16" fill="#17394c" font-weight="bold">Braudel</text><text x="240" y="161" font-size="18" fill="#17394c" font-weight="bold">Présence et mécanisme</text><text x="240" y="186" font-size="15" fill="#17394c">Que change la superposition de temporalités distinctes ?</text><rect x="24" y="211" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="211" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="239" font-size="16" fill="#17394c" font-weight="bold">Ginzburg</text><text x="240" y="236" font-size="18" fill="#17394c" font-weight="bold">Enquête par indices</text><text x="240" y="261" font-size="15" fill="#17394c">Que peut-on inférer des paroles consignées par les juges ?</text><rect x="24" y="286" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="286" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="314" font-size="16" fill="#17394c" font-weight="bold">Scott</text><text x="240" y="311" font-size="18" fill="#17394c" font-weight="bold">Catégorie d’analyse</text><text x="240" y="336" font-size="15" fill="#17394c">Quelle relation de pouvoir une distinction rend-elle visible ?</text></g></svg>
