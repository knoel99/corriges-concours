<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Quel élément donne son terme à l’événement ?</title>
<desc id="description">Manger une pomme La quantité consommée mesure la progression. La pomme entière fournit une borne. Trouver de l’or La découverte est elle-même le résultat. La découverte suffit, même avec un nom massif. Observer un glaçon L’objet peut rester intact. Aucune fin de l’observation n’est imposée.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quel élément donne son terme à l’événement ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Prédicat</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Rapport à l’objet</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Conséquence</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Manger une pomme</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La quantité consommée</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">mesure la progression.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La pomme entière fournit</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">une borne.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Trouver de l’or</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">La découverte est elle-</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">même le résultat.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La découverte suffit, même</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">avec un nom massif.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Observer un glaçon</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">L’objet peut rester</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">intact.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Aucune fin de l’observation</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">n’est imposée.</text>
</g>
</svg>
