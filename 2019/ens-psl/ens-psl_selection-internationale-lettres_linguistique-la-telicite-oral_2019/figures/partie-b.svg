<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois contrôles qui isolent la structure temporelle</title>
<desc id="description">LIS · expérience 2 Les deux réponses ont le même domaine. 84,72 % de traductions exactes. LIS · expérience 3 Aucune réponse ne traduit le signe. 65,40 % de choix de même télicité. Signes artificiels · expérience 6 Une borne saillante ou un mouvement répété. 64,29 % de choix de la classe attendue.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois contrôles qui isolent la structure temporelle</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Comparaison</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Indice encore disponible</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Résultat</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
