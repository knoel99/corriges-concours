<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Les deux réponses ont le</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">même domaine.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">84,72 % de traductions</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">exactes.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">LIS · expérience 3</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Aucune réponse ne traduit</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">le signe.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">65,40 % de choix de même</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">télicité.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Signes artificiels ·</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">expérience 6</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Une borne saillante ou un</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">mouvement répété.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">64,29 % de choix de la</text>
