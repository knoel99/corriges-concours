<svg xmlns="http://www.w3.org/2000/svg" width="948" height="374" viewBox="0 0 948 374" role="img">
<title>Lire les indicateurs du vieillissement avec le bon dénominateur</title>
<rect x="13" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="25" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Indicateur</text>
<rect x="323" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="335" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Calcul de l’indicateur</text>
<rect x="633" y="10" width="302" height="43" rx="7" fill="#164958"/>
<text x="645" y="38" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="bold" fill="white">Usage</text>
<rect x="13" y="62" width="302" height="69" rx="7" fill="#e0edef"/>
<text x="24" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Part des 65 ans ou plus</text>
<rect x="323" y="62" width="302" height="69" rx="7" fill="#edf1e5"/>
<text x="334" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Personnes âgées de 65 ans ou</text>
<text x="334" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">plus / population totale</text>
<rect x="633" y="62" width="302" height="69" rx="7" fill="#f7eddf"/>
<text x="644" y="89" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Décrire la structure</text>
<text x="644" y="112" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">démographique</text>
<rect x="13" y="140" width="302" height="69" rx="7" fill="#e0edef"/>
<text x="24" y="167" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Rapport de financement</text>
<rect x="323" y="140" width="302" height="69" rx="7" fill="#edf1e5"/>
<text x="334" y="167" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Cotisants / pensionnés dans</text>
<text x="334" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">le régime étudié</text>
<rect x="633" y="140" width="302" height="69" rx="7" fill="#f7eddf"/>
<text x="644" y="167" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Relier emploi, cotisations et</text>
<text x="644" y="190" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">pensions</text>
<rect x="13" y="218" width="302" height="92" rx="7" fill="#e0edef"/>
<text x="24" y="245" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Dépenses de soins de longue</text>
<text x="24" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">durée</text>
<rect x="323" y="218" width="302" height="92" rx="7" fill="#edf1e5"/>
<text x="334" y="245" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Dépenses mesurées / PIB</text>
<rect x="633" y="218" width="302" height="92" rx="7" fill="#f7eddf"/>
<text x="644" y="245" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">Apprécier le financement en</text>
<text x="644" y="268" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">explicitant la couverture des</text>
<text x="644" y="291" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="normal" fill="#1b3445">soins</text>
<text x="19" y="336" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">Une personne âgée peut rester autonome ou travailler. L’âge, la dépendance fonctionnelle et</text>
<text x="19" y="360" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal" fill="#1b3445">la retraite répondent à des définitions différentes.</text>
</svg>
