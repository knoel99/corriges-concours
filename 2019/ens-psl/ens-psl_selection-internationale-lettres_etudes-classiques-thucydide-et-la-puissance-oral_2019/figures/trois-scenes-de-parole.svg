<svg xmlns="http://www.w3.org/2000/svg" width="810" height="278" viewBox="0 0 810 278" role="img" aria-labelledby="titre description"><title id="titre">Trois usages d’une même idée de la puissance</title><desc id="description">À Sparte, Athènes justifie le maintien de l’empire. À Géla, Hermocrate mobilise une alliance contre cette emprise. À Mélos, les Athéniens déclarent la domination naturelle.</desc><rect width="810" height="278" fill="#fff"/>
<rect x="9" y="12" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Sparte · 432 av. J.-C.</text>
<text x="167.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Les Athéniens s’expliquent</text>
<rect x="384" y="12" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="41" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Origine consentie, retrait périlleux</text>
<text x="592.5" y="65" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">L’empire se dit contraint de durer.</text>
<path d="M330 48 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="100" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Géla · 424 av. J.-C.</text>
<text x="167.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Hermocrate exhorte les Siciliens</text>
<rect x="384" y="100" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="129" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">S’accorder entre cités de Sicile</text>
<text x="592.5" y="153" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">L’entente ôte son appui à l’intervenant.</text>
<path d="M330 136 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
<rect x="9" y="188" width="317" height="72" rx="9" fill="#e5f2f0" stroke="#546378" stroke-width="1.5"/>
<text x="167.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Mélos · 416 av. J.-C.</text>
<text x="167.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Les Athéniens font pression</text>
<rect x="384" y="188" width="417" height="72" rx="9" fill="#edf0fa" stroke="#546378" stroke-width="1.5"/>
<text x="592.5" y="217" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172638">Ériger le fait en règle universelle</text>
<text x="592.5" y="241" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#172638">Le fort prête son propre calcul au faible.</text>
<path d="M330 224 h46 m-8 -6 8 6 -8 6" fill="none" stroke="#485a70" stroke-width="2.5"/>
</svg>
