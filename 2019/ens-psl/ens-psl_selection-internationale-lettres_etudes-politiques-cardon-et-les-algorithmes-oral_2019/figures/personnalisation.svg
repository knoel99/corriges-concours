<svg xmlns="http://www.w3.org/2000/svg" width="830" height="195" viewBox="0 0 830 195" role="img">
<title>Des traces à la recommandation suivante</title>
<rect width="830" height="195" rx="14" fill="#f6f8f5"/>
<text x="23" y="35" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="23" fill="#153352">Des traces à la recommandation suivante</text>
<rect x="22" y="59" width="240" height="114" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/>
<text x="35" y="88" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="19" fill="#165951">Traces</text>
<text x="35" y="117" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Des actions</text>
<text x="35" y="140" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">antérieures sont</text>
<text x="35" y="163" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">enregistrées.</text>
<path d="M265 117h19m-7 -6 7 6 -7 6" fill="none" stroke="#315c76" stroke-width="3"/>
<rect x="292" y="59" width="240" height="114" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/>
<text x="305" y="88" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="19" fill="#165951">Classement</text>
<text x="305" y="117" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Les résultats visibles</text>
<text x="305" y="140" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">sont ordonnés.</text>
<path d="M535 117h19m-7 -6 7 6 -7 6" fill="none" stroke="#315c76" stroke-width="3"/>
<rect x="562" y="59" width="240" height="114" rx="11" fill="#ffffff" stroke="#7b9e98" stroke-width="2"/>
<text x="575" y="88" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="19" fill="#165951">Actions suivantes</text>
<text x="575" y="117" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">Les choix alimentent</text>
<text x="575" y="140" font-family="DejaVu Sans, sans-serif" font-weight="400" font-size="16" fill="#172f43">de nouvelles traces.</text>
</svg>
