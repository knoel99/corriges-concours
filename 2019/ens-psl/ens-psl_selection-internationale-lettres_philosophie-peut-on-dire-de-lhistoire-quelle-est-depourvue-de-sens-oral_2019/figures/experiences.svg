<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 205" role="img" aria-labelledby="titre description">
<title id="titre">Devant un monument aux morts</title>
<desc id="description">À partir de la même inscription, l’historien tente d’établir des faits, le philosophe discute l’orientation de l’histoire et les vivants choisissent le sens d’une commémoration.</desc>
<rect width="900" height="205" fill="white"/>
<g font-family="DejaVu Sans, sans-serif">
<rect x="8" y="9" width="287" height="186" rx="6" fill="#e7efee"/>
<text x="20" y="43" font-size="22" font-weight="bold" fill="#19384a">Expliquer</text>
<text x="20" y="87" font-size="19" font-weight="normal" fill="#19384a">Qui a été mobilisé ?</text>
<text x="20" y="124" font-size="19" font-weight="normal" fill="#19384a">Les registres permettent</text>
<text x="20" y="152" font-size="19" font-weight="normal" fill="#19384a">de vérifier des faits.</text>
<rect x="306" y="9" width="287" height="186" rx="6" fill="#f5eadd"/>
<text x="318" y="43" font-size="22" font-weight="bold" fill="#19384a">Chercher une fin</text>
<text x="318" y="87" font-size="19" font-weight="normal" fill="#19384a">Vers quoi irait l’histoire ?</text>
<text x="318" y="124" font-size="19" font-weight="normal" fill="#19384a">Le monument seul</text>
<text x="318" y="152" font-size="19" font-weight="normal" fill="#19384a">ne donne pas de réponse.</text>
<rect x="604" y="9" width="287" height="186" rx="6" fill="#e9eff4"/>
<text x="616" y="43" font-size="22" font-weight="bold" fill="#19384a">Commémorer</text>
<text x="616" y="87" font-size="19" font-weight="normal" fill="#19384a">Que faire de ces noms ?</text>
<text x="616" y="124" font-size="19" font-weight="normal" fill="#19384a">La cérémonie engage</text>
<text x="616" y="152" font-size="19" font-weight="normal" fill="#19384a">ceux qui la préparent.</text>
</g></svg>
