<svg xmlns="http://www.w3.org/2000/svg" width="830" height="239" viewBox="0 0 830 239" role="img" aria-labelledby="t d"><title id="t">ABECO : espace de coworking, marges par prestation et financement d’une extension</title><desc id="d">La trésorerie nette passe de 27 000 € à −75 000 €. L’exploitation dégage des liquidités mais les achats d’actifs, les remboursements et les distributions les dépassent.</desc><rect width="830" height="239" fill="white"/><g fill="#234451" font-family="sans-serif"><rect x="10" y="11" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="47" font-weight="bold" font-size="18">Activité</text><text x="196" y="35" font-size="18" font-weight="bold">+61 000 €</text><text x="196" y="59" font-size="16">80 000 de bénéfice, +64 000 d’amortissements, −83 000 de BFR.</text><rect x="10" y="86" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="122" font-weight="bold" font-size="18">Investissement</text><text x="196" y="110" font-size="18" font-weight="bold">−66 000 €</text><text x="196" y="134" font-size="16">6 000 de logiciel et 60 000 de matériel.</text><rect x="10" y="161" width="170" height="60" rx="5" fill="#e5eff2"/><text x="22" y="197" font-weight="bold" font-size="18">Financement</text><text x="196" y="185" font-size="18" font-weight="bold">−97 000 €</text><text x="196" y="209" font-size="16">28 000 remboursés et 69 000 distribués aux associés.</text></g></svg>
