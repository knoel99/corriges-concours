<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Las relaciones que distingue la tribuna de Borges</title>
<desc id="description">Venezuela hacia Cuba Apoyo vinculado al petróleo. Compara el auge y los envíos de 2019. Cuba hacia Venezuela Influencia sobre instituciones. El autor cita un informe de Almagro. Venezuela y la región Desplazamiento de población. La crisis alcanza a países vecinos.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Las relaciones que distingue la tribuna de Borges</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Dirección</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Relación descrita</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Cómo se sostiene</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Venezuela hacia Cuba</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Apoyo vinculado al</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">petróleo.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Compara el auge y los</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">envíos de 2019.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Cuba hacia Venezuela</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Influencia sobre</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">instituciones.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">El autor cita un informe de</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Almagro.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Venezuela y la región</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Desplazamiento de</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">población.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La crisis alcanza a países</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">vecinos.</text>
</g>
</svg>
