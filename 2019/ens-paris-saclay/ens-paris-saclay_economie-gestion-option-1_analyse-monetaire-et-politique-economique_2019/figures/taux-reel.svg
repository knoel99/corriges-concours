<svg xmlns="http://www.w3.org/2000/svg" width="725" height="375" viewBox="0 0 725 375" role="img"><title>Taux réel approximatif (%)</title><desc>Un même taux nominal donne des taux réels différents selon l’inflation anticipée. À 2 % nominal, une inflation anticipée de 1 % implique environ 1 % réel, contre −1 % si elle atteint 3 %.</desc><rect width="725" height="375" fill="white"/><g font-family="sans-serif" font-size="15" fill="#243b48"><text x="94" y="32" font-weight="bold">Taux réel approximatif (%)</text><path d="M 94 262.00 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="267.0" text-anchor="end">-3</text><path d="M 94 229.17 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="234.16666666666669" text-anchor="end">-2</text><path d="M 94 196.33 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="201.33333333333334" text-anchor="end">-1</text><path d="M 94 163.50 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="168.5" text-anchor="end">0</text><path d="M 94 130.67 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="135.66666666666669" text-anchor="end">1</text><path d="M 94 97.83 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="102.83333333333331" text-anchor="end">2</text><path d="M 94 65.00 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="70.0" text-anchor="end">3</text><path d="M 94.00 262 v 5" stroke="#243b48"/><text x="94.0" y="285" text-anchor="middle">0</text><path d="M 235.50 262 v 5" stroke="#243b48"/><text x="235.5" y="285" text-anchor="middle">1</text><path d="M 377.00 262 v 5" stroke="#243b48"/><text x="377.0" y="285" text-anchor="middle">2</text><path d="M 518.50 262 v 5" stroke="#243b48"/><text x="518.5" y="285" text-anchor="middle">3</text><path d="M 660.00 262 v 5" stroke="#243b48"/><text x="660.0" y="285" text-anchor="middle">4</text><path d="M 94 65 V 262 H 660" fill="none" stroke="#243b48" stroke-width="2"/><text x="377.0" y="309" text-anchor="middle" font-weight="bold">Inflation attendue (%)</text><polyline points="94.00,97.83 660.00,229.17" fill="none" stroke="#075985" stroke-width="3.5"/><path d="M 94 333 h 23" stroke="#075985" stroke-width="4"/><text x="126" y="338" >Taux nominal : 2 %</text><polyline points="94.00,130.67 660.00,262.00" fill="none" stroke="#aa3d36" stroke-width="3.5"/><path d="M 94 356 h 23" stroke="#aa3d36" stroke-width="4"/><text x="126" y="361" >Taux nominal : 1 %</text></g></svg>
