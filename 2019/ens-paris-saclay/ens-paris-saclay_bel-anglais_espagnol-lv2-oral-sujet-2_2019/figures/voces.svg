<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Las voces que hablan de la conquista</title>
<desc id="description">López Obrador Pide una disculpa al rey. El autor discute el gesto desde el presente. Cronista Imagina una respuesta del rey. No se trata de una réplica pronunciada. Intelectuales citados Critican la primacía peninsular. Su protesta cierra el fragmento.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Las voces que hablan de la conquista</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voz</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Intervención</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Alcance</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">López Obrador</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Pide una disculpa al rey.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">El autor discute el gesto</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">desde el presente.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Cronista</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Imagina una respuesta del</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">rey.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">No se trata de una réplica</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">pronunciada.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Intelectuales citados</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Critican la primacía</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">peninsular.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Su protesta cierra el</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">fragmento.</text>
</g>
</svg>
