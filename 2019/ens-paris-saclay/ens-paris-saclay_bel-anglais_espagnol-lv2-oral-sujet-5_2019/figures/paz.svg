<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Qué se necesita para sostener la paz</title>
<desc id="description">Desarrollo rural Faltan servicios y oportunidades. Que sea viable vivir y trabajar en el campo. Justicia transicional Se discuten sanciones y reglas. Verdad para las víctimas y reglas fiables. Apoyo exterior Se pide cooperación regional. Que el apoyo llegue a las zonas afectadas.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qué se necesita para sostener la paz</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Compromiso</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Problema señalado</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Criterio de evaluación</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Desarrollo rural</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Faltan servicios y</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">oportunidades.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Que sea viable vivir y</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">trabajar en el campo.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Justicia transicional</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Se discuten sanciones y</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">reglas.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Verdad para las víctimas y</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">reglas fiables.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Apoyo exterior</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Se pide cooperación</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">regional.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Que el apoyo llegue a las</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">zonas afectadas.</text>
</g>
</svg>
