<svg xmlns="http://www.w3.org/2000/svg" width="740" height="220" viewBox="0 0 740 220" role="img" aria-labelledby="title desc"><title id="title">Élargissement du marché et coût unitaire</title><desc id="desc">À coût fixe de 120 et coût variable unitaire de 2, doubler la production ramène le coût moyen de 6 à 4.</desc><rect width="740" height="220" fill="white"/><g fill="#183642" font-family="sans-serif"><text x="17" y="31" font-size="22" font-weight="bold">Élargissement du marché et coût unitaire</text><text x="17" y="61" font-size="17">Exemple construit · coût par unité produite</text><path d="M282 79V192" stroke="#8c9ba2"/><text x="17" y="111" font-size="18">Production de 30 unités</text><rect x="282" y="91" width="325.89" height="23" fill="#296175"/><text x="617.89" y="110" font-size="18">6</text><text x="17" y="174" font-size="18">Production de 60 unités</text><rect x="282" y="154" width="217.26" height="23" fill="#9b511f"/><text x="509.26" y="173" font-size="18">4</text></g></svg>
