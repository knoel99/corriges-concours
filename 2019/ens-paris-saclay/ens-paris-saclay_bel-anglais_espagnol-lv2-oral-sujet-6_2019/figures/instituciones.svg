<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">De una suspensión a una interpretación editorial</title>
<desc id="description">Constitucional español Suspende un pleno concreto. Se discute el efecto sobre derechos. Tribunal de Estrasburgo Declara inadmisible la demanda. Examina la actuación impugnada. Editorial de El País Invoca la plenitud democrática. Propone una conclusión general.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De una suspensión a una interpretación editorial</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Quién</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qué hace</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Alcance</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Constitucional</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">español</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Suspende un pleno</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">concreto.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Se discute el efecto sobre</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">derechos.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Tribunal de</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Estrasburgo</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Declara inadmisible la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">demanda.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Examina la actuación</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">impugnada.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Editorial de El País</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Invoca la plenitud</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">democrática.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Propone una conclusión</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">general.</text>
</g>
</svg>
