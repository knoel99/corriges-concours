<svg xmlns="http://www.w3.org/2000/svg" width="720" height="275" viewBox="0 0 720 275" role="img" aria-labelledby="titre description">
<title id="titre">Del proyecto escolar al voto</title>
<desc id="description">Documento del centro Una directriz escrita. Cómo la aplica cada centro. Vida escolar Uso en el aula y fuera de ella. Qué oportunidades tiene el alumnado. Representación política Presencia de diputados rupturistas. Cómo se demostraría un efecto causal.</desc>
<rect width="720" height="275" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Del proyecto escolar al voto</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Escala</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Lo que se examina</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué falta establecer</text>
<rect x="10" y="92" width="700" height="39" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Documento del centro</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Una directriz escrita.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Cómo la aplica cada centro.</text>
<rect x="10" y="137" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="162" font-size="15" font-weight="700" fill="#162d3b">Vida escolar</text>
<text x="229" y="162" font-size="15" font-weight="400" fill="#162d3b">Uso en el aula y fuera de</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">ella.</text>
<text x="473" y="162" font-size="15" font-weight="400" fill="#162d3b">Qué oportunidades tiene el</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">alumnado.</text>
<rect x="10" y="204" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="229" font-size="15" font-weight="700" fill="#162d3b">Representación</text>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">política</text>
<text x="229" y="229" font-size="15" font-weight="400" fill="#162d3b">Presencia de diputados</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">rupturistas.</text>
<text x="473" y="229" font-size="15" font-weight="400" fill="#162d3b">Cómo se demostraría un</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">efecto causal.</text>
</g>
</svg>
