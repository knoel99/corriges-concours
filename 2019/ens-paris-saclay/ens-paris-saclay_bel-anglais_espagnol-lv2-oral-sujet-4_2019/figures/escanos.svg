<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Tres momentos de la interpretación electoral</title>
<desc id="description">Antes del recuento Se auguran 40 a 60 escaños a Vox. Una expectativa influye en la campaña. Tras el recuento Vox consigue 24 escaños. Entra en el Congreso por debajo del pronóstico. Después de las urnas Sánchez necesita apoyos. La alianza aún es una hipótesis.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Tres momentos de la interpretación electoral</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Momento</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dato del artículo</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Qué permite decir</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Antes del recuento</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Se auguran 40 a 60 escaños</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">a Vox.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Una expectativa influye en</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">la campaña.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Tras el recuento</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Vox consigue 24 escaños.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Entra en el Congreso por</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">debajo del pronóstico.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Después de las urnas</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Sánchez necesita apoyos.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La alianza aún es una</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">hipótesis.</text>
</g>
</svg>
