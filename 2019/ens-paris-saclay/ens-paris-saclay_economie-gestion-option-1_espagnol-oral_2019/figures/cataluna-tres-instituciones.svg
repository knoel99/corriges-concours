<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" width="820" height="255" role="img" aria-labelledby="titre desc"><title id="titre">Trois rôles à distinguer</title><desc id="desc">Commission européenne. Elle intervient dans le débat institutionnel européen et laisse la question territoriale au cadre constitutionnel espagnol. Juridictions nationales. Elles examinent les demandes de coopération judiciaire selon le droit applicable. Leur décision répond à une question précise. Cour de Strasbourg. Elle relève du Conseil de l’Europe. Un recours en matière de droits fondamentaux suit une procédure distincte.</desc><rect width="820" height="255" fill="#f6f5ef"/><g font-family="DejaVu Sans, sans-serif" fill="#153139"><text x="24" y="32" font-size="22" font-weight="bold">Trois rôles à distinguer</text><path d="M24 62h241" stroke="#39756e" stroke-width="4"/><text x="24" y="93" font-size="18" font-weight="bold">Commission européenne</text><text x="24" y="123" font-size="15">Elle intervient dans le</text><text x="24" y="145" font-size="15">débat institutionnel</text><text x="24" y="167" font-size="15">européen et laisse la</text><text x="24" y="189" font-size="15">question territoriale au</text><text x="24" y="211" font-size="15">cadre constitutionnel</text><text x="24" y="233" font-size="15">espagnol.</text><path d="M289 62h241" stroke="#39756e" stroke-width="4"/><text x="289" y="93" font-size="18" font-weight="bold">Juridictions nationales</text><text x="289" y="123" font-size="15">Elles examinent les</text><text x="289" y="145" font-size="15">demandes de coopération</text><text x="289" y="167" font-size="15">judiciaire selon le droit</text><text x="289" y="189" font-size="15">applicable. Leur décision</text><text x="289" y="211" font-size="15">répond à une question</text><text x="289" y="233" font-size="15">précise.</text><path d="M554 62h241" stroke="#39756e" stroke-width="4"/><text x="554" y="93" font-size="18" font-weight="bold">Cour de Strasbourg</text><text x="554" y="123" font-size="15">Elle relève du Conseil de</text><text x="554" y="145" font-size="15">l’Europe. Un recours en</text><text x="554" y="167" font-size="15">matière de droits</text><text x="554" y="189" font-size="15">fondamentaux suit une</text><text x="554" y="211" font-size="15">procédure distincte.</text></g></svg>
