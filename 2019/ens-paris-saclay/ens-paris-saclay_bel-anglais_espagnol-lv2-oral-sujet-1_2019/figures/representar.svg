<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Tres sentidos de representar</title>
<desc id="description">Pregunta inicial Representar a España ante Europa. Se discute la legitimidad de un cargo. Parejas de políticos Pertenecer al Estado actual. Adversarios comparten esa relación. Último párrafo Encarnar una España que escucha. Es la aspiración política de Rahola.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Tres sentidos de representar</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lugar del texto</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qué significa</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Prueba o límite</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Pregunta inicial</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Representar a España ante</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">Europa.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Se discute la legitimidad</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">de un cargo.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Parejas de políticos</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Pertenecer al Estado</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">actual.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Adversarios comparten esa</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">relación.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Último párrafo</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Encarnar una España que</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">escucha.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Es la aspiración política</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">de Rahola.</text>
</g>
</svg>
