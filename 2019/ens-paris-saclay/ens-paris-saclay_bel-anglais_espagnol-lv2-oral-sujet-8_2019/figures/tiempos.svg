<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Tres tiempos para evaluar una política pública</title>
<desc id="description">Gobiernos anteriores La tasa de homicidios más que se duplicó. Es un cambio relativo. Cuatro primeros meses Unas 2.500 víctimas al mes. Es un recuento mensual aproximado. Más de un sexenio Hacen falta instituciones duraderas. Es un horizonte de acción política.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Tres tiempos para evaluar una política pública</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Escala temporal</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qué dice el texto</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Cómo leerlo</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Gobiernos anteriores</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La tasa de homicidios más</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">que se duplicó.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Es un cambio relativo.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Cuatro primeros meses</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Unas 2.500 víctimas al</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">mes.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Es un recuento mensual</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">aproximado.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Más de un sexenio</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Hacen falta instituciones</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">duraderas.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Es un horizonte de acción</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">política.</text>
</g>
</svg>
