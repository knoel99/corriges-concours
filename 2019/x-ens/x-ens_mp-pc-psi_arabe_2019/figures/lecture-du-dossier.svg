<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Trois étapes qui expliquent la transformation du rôle social de l’école.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Entrer à l’école</text>
<text x="27" y="118" font-size="16">La gratuité et la</text>
<text x="27" y="137" font-size="16">construction</text>
<text x="27" y="156" font-size="16">d’établissements</text>
<text x="27" y="175" font-size="16">élargissent l’accès.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Apprendre en classe</text>
<text x="298" y="118" font-size="16">Effectifs, langues et</text>
<text x="298" y="137" font-size="16">matériel font diverger</text>
<text x="298" y="156" font-size="16">les conditions d’étude.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Utiliser le diplôme</text>
<text x="569" y="118" font-size="16">La formation et les</text>
<text x="569" y="137" font-size="16">ressources familiales</text>
<text x="569" y="156" font-size="16">pèsent sur les</text>
<text x="569" y="175" font-size="16">débouchés.</text>
</g></svg>
