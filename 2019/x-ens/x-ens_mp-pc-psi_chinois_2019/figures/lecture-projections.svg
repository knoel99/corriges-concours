<svg xmlns="http://www.w3.org/2000/svg" width="740" height="215" viewBox="0 0 740 215" role="img"><title>Les quatre séries du graphique A4 et le passage aux projections après 2010.</title>
<rect x="0" y="0" width="740" height="215" fill="#f4f8f6"/>
<text x="22" y="32" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start">De 1950 à 2050</text>
<text x="22" y="69" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">Natalité et mortalité</text>
<text x="382" y="69" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Pour 1 000 habitants</text>
<text x="22" y="101" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start">Fécondité</text>
<text x="382" y="101" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Enfants par femme</text>
<text x="22" y="134" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start">Espérance de vie à la naissance</text>
<text x="382" y="134" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start">Années, sur l’axe de droite</text>
<path d="M22 157H407" stroke="#297a78" stroke-width="4"/><path d="M407 157H717" stroke="#297a78" stroke-width="4" stroke-dasharray="8 6"/>
<text x="22" y="190" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start">1950</text>
<text x="409" y="190" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle">2010</text>
<text x="563" y="190" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Projections</text>
<text x="715" y="190" fill="#193e43" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="end">2050</text></svg>
