<svg xmlns="http://www.w3.org/2000/svg" width="780" height="221" viewBox="0 0 780 221" role="img"><title>Trois façons dont les usages des plateformes de la partie A influent sur une décision.</title><rect width="780" height="221" fill="#f5f7f5"/>
<text x="18" y="33" fill="#173c44" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Trois décisions derrière un écran</text>
<rect x="18" y="49" width="744" height="50" fill="#e2efea"/>
<text x="31" y="80" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Travail</text>
<text x="277" y="70" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Des sociétés tirent une note de risque</text>
<text x="277" y="91" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">de traces laissées par un candidat.</text>
<rect x="18" y="103" width="744" height="50" fill="#edf1f2"/>
<text x="31" y="134" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Presse</text>
<text x="277" y="124" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">L’ordre du fil de Facebook influe</text>
<text x="277" y="145" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">sur les lecteurs atteints par un journal.</text>
<rect x="18" y="157" width="744" height="50" fill="#e4edf0"/>
<text x="31" y="188" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Conversation</text>
<text x="277" y="178" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Sur le banc de Hubbe, les logos remplacent</text>
<text x="277" y="199" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">les gestes et les paroles attendus.</text></svg>
