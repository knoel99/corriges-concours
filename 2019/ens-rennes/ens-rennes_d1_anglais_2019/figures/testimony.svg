<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">What can change after testimony is shared?</title>
<desc id="description">Speaking publicly Separate experiences become visible together. Contributors can choose how to take part. Organising support People can reach groups and advisers. Information is accessible and reliable. Institutional response Procedures and practices may change. Decision makers act on the evidence.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">What can change after testimony is shared?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Stage</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Possibility</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Condition</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Speaking publicly</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Separate experiences</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">become visible together.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Contributors can choose how</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">to take part.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Organising support</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">People can reach groups</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">and advisers.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Information is accessible</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">and reliable.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Institutional</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">response</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Procedures and practices</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">may change.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Decision makers act on the</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">evidence.</text>
</g>
</svg>
