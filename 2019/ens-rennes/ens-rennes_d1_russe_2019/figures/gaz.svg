<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Volumes observés ou conditionnels dans le texte</title>
<desc id="description">49,6 milliards de m³ Livraisons algériennes à l’Europe en 2017. Donnée historique. 121,4 milliards de m³ Exportations norvégiennes en 2022. Prévision révisée à la baisse. Plus de 50 milliards de m³ Besoin européen additionnel d’autres sources. Scénario conditionnel de l’expert.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Volumes observés ou conditionnels dans le texte</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Valeur</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Objet</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Statut</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">49,6 milliards de m³</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Livraisons algériennes à</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">l’Europe en 2017.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Donnée historique.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">121,4 milliards de m³</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Exportations norvégiennes</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">en 2022.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Prévision révisée à la</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">baisse.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Plus de 50 milliards</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">de m³</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Besoin européen</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">additionnel d’autres</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">sources.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Scénario conditionnel de</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">l’expert.</text>
</g>
</svg>
