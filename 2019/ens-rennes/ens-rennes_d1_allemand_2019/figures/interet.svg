<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Deux comparaisons dans le temps</title>
<desc id="description">Intérêt pour la politique 30 % en 2002. 40 %. Crainte de la xénophobie 40 % en 2010. 48 %. Crainte de l’immigration Pas de taux antérieur dans ce passage. 29 %.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux comparaisons dans le temps</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Indicateur</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Auparavant</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Dans l&#x27;étude 2015</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Intérêt pour la</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">politique</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">30 % en 2002.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">40 %.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Crainte de la</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">xénophobie</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">40 % en 2010.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">48 %.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Crainte de</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">l’immigration</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Pas de taux antérieur dans</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">ce passage.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">29 %.</text>
</g>
</svg>
