<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Tre aspetti che il testo distingue</title>
<desc id="description">Apprendimento Capire rapidamente. Tempi scolastici poco adatti. Vita emotiva Riconoscere una situazione. Non averla ancora assimilata. Contesto Esprimere capacità differenti. Le esperienze variano da una persona all’altra.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Tre aspetti che il testo distingue</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Aspetto</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Possibilità</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Difficoltà descritta</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Apprendimento</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Capire rapidamente.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Tempi scolastici poco</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">adatti.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Vita emotiva</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Riconoscere una</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">situazione.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Non averla ancora</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">assimilata.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Contesto</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Esprimere capacità</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">differenti.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le esperienze variano da</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">una persona all’altra.</text>
</g>
</svg>
