<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Deux portes institutionnelles dans la chronique</title>
<desc id="description">Université Accès soumis à une surveillance. L’admission donne-t-elle une égalité réelle ? Prisons Conditions dissimulées au public. Comment juger un acte et respecter une personne ? Mémoire collective Une réformatrice à redécouvrir. Que choisit-on de transmettre ?</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Deux portes institutionnelles dans la chronique</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Lieu</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce que découvre Arenal</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Interrogation actuelle</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Université</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Accès soumis à une</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">surveillance.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">L’admission donne-t-elle</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">une égalité réelle ?</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Prisons</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Conditions dissimulées au</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">public.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Comment juger un acte et</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">respecter une personne ?</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Mémoire collective</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Une réformatrice à</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">redécouvrir.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Que choisit-on de</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">transmettre ?</text>
</g>
</svg>
