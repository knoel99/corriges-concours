<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois usages du nom dans le récit</title>
<desc id="description">Wheelwright La grand-mère et son petit-fils La réputation s’exerce au présent. Sagamore Le voisin, l’enfant et le narrateur Une circulation du nom peut en masquer l’origine. Gravesend Des archives et des hypothèses Le récit indique ses degrés de certitude.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois usages du nom dans le récit</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Nom</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Voix ou support</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui se révèle</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Wheelwright</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La grand-mère et son</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">petit-fils</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La réputation s’exerce au</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">présent.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Sagamore</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le voisin, l’enfant et le</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">narrateur</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Une circulation du nom peut</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">en masquer l’origine.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Gravesend</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Des archives et des</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">hypothèses</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le récit indique ses degrés</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">de certitude.</text>
</g>
</svg>
