<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Du club au souvenir de la voix</title>
<desc id="description">Les quinze aubes Un souvenir cadre des habitudes Prétérit, puis reprises itératives. La salle et la scène L’auditrice se dit une amie Maintenir la répétition et la rectification. Le portrait rétrospectif Une intimité ignorait le passé Faire revenir le même aveu d’ignorance.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Du club au souvenir de la voix</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Échelle</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Déplacement</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Choix anglais</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Les quinze aubes</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un souvenir cadre des</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">habitudes</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Prétérit, puis reprises</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">itératives.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">La salle et la scène</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">L’auditrice se dit une</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">amie</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Maintenir la répétition et</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">la rectification.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le portrait</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">rétrospectif</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Une intimité ignorait le</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">passé</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Faire revenir le même aveu</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">d’ignorance.</text>
</g>
</svg>
