<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Ce qui se transmet dans la cuisine</title>
<desc id="description">L’odeur et le couteau La convalescence Le soin se reconnaît avant d’être nommé. Le menu en français Présent et années d’études Les parents disparus ont transmis une langue. La main et la morsure Le retour du poste de police La confiance s’est construite par des actes répétés.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Ce qui se transmet dans la cuisine</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Indice</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Temps du récit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce que découvre le lecteur</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">L’odeur et le couteau</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La convalescence</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le soin se reconnaît avant</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">d’être nommé.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le menu en français</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Présent et années d’études</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Les parents disparus ont</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">transmis une langue.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La main et la morsure</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le retour du poste de</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">police</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La confiance s’est</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">construite par des actes</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">répétés.</text>
</g>
</svg>
