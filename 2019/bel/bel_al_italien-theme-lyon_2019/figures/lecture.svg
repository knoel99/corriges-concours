<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Le narrateur observe un dîner</title>
<desc id="description">La surprise d’Elsa Deux explications envisagées Interrogation et hypothèse passée. Le visage d’Harmelin Aucun sentiment assuré Rapporter les points où il pose les yeux. Les gestes pendant le repas Un indice répété de sollicitude Opposer le destinataire des mots et celui du soin.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Le narrateur observe un dîner</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Objet du regard</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Degré de certitude</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Marque dans la traduction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">La surprise d’Elsa</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Deux explications</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">envisagées</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Interrogation et hypothèse</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">passée.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le visage d’Harmelin</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Aucun sentiment assuré</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Rapporter les points où il</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">pose les yeux.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Les gestes pendant le</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">repas</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Un indice répété de</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">sollicitude</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Opposer le destinataire des</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">mots et celui du soin.</text>
</g>
</svg>
