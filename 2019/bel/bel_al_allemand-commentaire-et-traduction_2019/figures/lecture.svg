<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">La naissance d’une seconde voix</title>
<desc id="description">Le jardin Les frères nomment et encouragent les voitures Un jeu prend fin dans l’obscurité. Le café Jacques mime le violon, le narrateur entre Chacun entend ce que l’autre imagine. La conversation Les deux amis parcourent les images Les couleurs et la parole reprennent vie.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">La naissance d’une seconde voix</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Scène</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Geste partagé</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet sur le narrateur</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le jardin</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Les frères nomment et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">encouragent les voitures</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Un jeu prend fin dans</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">l’obscurité.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le café</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Jacques mime le violon, le</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">narrateur entre</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Chacun entend ce que</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">l’autre imagine.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La conversation</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Les deux amis parcourent</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">les images</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Les couleurs et la parole</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">reprennent vie.</text>
</g>
</svg>
