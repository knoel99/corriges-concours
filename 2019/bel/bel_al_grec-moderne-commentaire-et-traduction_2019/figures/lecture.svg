<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Un lecteur change de personne et de temps</title>
<desc id="description">Le livre projeté Un interlocuteur encore inconnu Écrire ensemble reste une hypothèse. La scène du café Un garçon observé, une objection inventée Le lecteur peut refuser le livre. Une dizaine d’années après Il devient peut-être « toi » Le mot patrie peut recevoir un autre nom.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Un lecteur change de personne et de temps</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Figure du lecteur</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Effet de l’adresse</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le livre projeté</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un interlocuteur encore</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">inconnu</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Écrire ensemble reste une</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">hypothèse.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">La scène du café</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Un garçon observé, une</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">objection inventée</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le lecteur peut refuser le</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">livre.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Une dizaine d’années</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">après</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Il devient peut-être « toi</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">»</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le mot patrie peut recevoir</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">un autre nom.</text>
</g>
</svg>
