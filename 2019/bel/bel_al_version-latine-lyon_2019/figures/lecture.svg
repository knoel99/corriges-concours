<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment le secours devient-il incendie ?</title>
<desc id="description">Thaïs et les convives Ils évoquent la vengeance des Grecs. Ils incitent le roi à agir. Alexandre Le roi agit le premier. Le palais s’embrase et l’armée accourt. Les soldats Ils voient le roi nourrir le feu. Ils abandonnent l’eau et alimentent les flammes.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment le secours devient-il incendie ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Acteurs</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Perception ou motif</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Action</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Thaïs et les convives</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Ils évoquent la vengeance</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">des Grecs.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Ils incitent le roi à agir.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Alexandre</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le roi agit le premier.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le palais s’embrase et</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">l’armée accourt.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Les soldats</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Ils voient le roi nourrir</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">le feu.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Ils abandonnent l’eau et</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">alimentent les flammes.</text>
</g>
</svg>
