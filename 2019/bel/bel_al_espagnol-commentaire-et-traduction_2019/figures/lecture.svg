<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Qui règle les gestes de la cérémonie ?</title>
<desc id="description">La cathédrale rêvée Elle se compose un souvenir Se donner le temps d’être regardée. Le registre Elle demande la réciprocité des noms Le général redéfinit la protection. Le petit déjeuner Elle commande un jus L’autorité s’exerce jusque dans le détail.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Qui règle les gestes de la cérémonie ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Scène</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Parole de Catalina</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Pouvoir en jeu</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">La cathédrale rêvée</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Elle se compose un</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">souvenir</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Se donner le temps d’être</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">regardée.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le registre</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Elle demande la</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">réciprocité des noms</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le général redéfinit la</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">protection.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le petit déjeuner</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Elle commande un jus</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">L’autorité s’exerce jusque</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">dans le détail.</text>
</g>
</svg>
