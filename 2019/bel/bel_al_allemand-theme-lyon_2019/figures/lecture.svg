<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">De la côte à l’idée d’Europe</title>
<desc id="description">Le père Un horizon désigné du doigt La voix reste audible après sa disparition. L’adulte en France Une idée à laquelle on se rallie Relier l’adhésion intime au mot européen. Les enfants Les marins et les tatouages La mer fonde leur géographie imaginaire.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">De la côte à l’idée d’Europe</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Point de vue</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Image ou parole</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Articulation à conserver</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le père</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Un horizon désigné du</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">doigt</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">La voix reste audible après</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">sa disparition.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">L’adulte en France</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Une idée à laquelle on se</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">rallie</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Relier l’adhésion intime au</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">mot européen.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Les enfants</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Les marins et les</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">tatouages</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">La mer fonde leur</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">géographie imaginaire.</text>
</g>
</svg>
