<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Comment Modesta s’approprie les mots</title>
<desc id="description">Le couloir Écouter le tissu, les soupirs, les voix Le corps distingue avant de nommer. La leçon Se mordre la langue et saisir les mots La discipline éveille aussi le plaisir du son. La fin Baisser les yeux, puis écrire Ce qui paraissait obéissance donne accès aux mots.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment Modesta s’approprie les mots</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Geste</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce qui se transforme</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le couloir</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Écouter le tissu, les</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">soupirs, les voix</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Le corps distingue avant de</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">nommer.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">La leçon</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Se mordre la langue et</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">saisir les mots</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">La discipline éveille aussi</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">le plaisir du son.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La fin</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Baisser les yeux, puis</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">écrire</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Ce qui paraissait</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">obéissance donne accès aux</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">mots.</text>
</g>
</svg>
