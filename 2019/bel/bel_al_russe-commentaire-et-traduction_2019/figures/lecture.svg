<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment faire sentir la différence entre deux libertés</title>
<desc id="description">Le printemps Des forces débordent et appellent Faire sentir le mot avant de le définir. Les deux marcheurs Montre ou horizon, chapeau ou cheveux au vent Donner une forme visible à deux expériences. Le vagabond Il abandonne le voyage qu’on lui offre Écarter la destination comme explication.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment faire sentir la différence entre deux libertés</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Ce que le lecteur perçoit</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Fonction dans le raisonnement</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le printemps</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Des forces débordent et</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">appellent</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Faire sentir le mot avant</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">de le définir.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Les deux marcheurs</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Montre ou horizon, chapeau</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">ou cheveux au vent</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Donner une forme visible à</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">deux expériences.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le vagabond</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Il abandonne le voyage</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">qu’on lui offre</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Écarter la destination</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">comme explication.</text>
</g>
</svg>
