<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Une discussion racontée par le propriétaire</title>
<desc id="description">Le projet de mariage Le propriétaire choisit des qualités Une personne lui échappe. Près de la chapelle Trois hommes discutent de propriété Le patron répond par l’injure. Le sermon du soir Le propriétaire entend démontrer Le silence et les gestes traduisent la peur.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Une discussion racontée par le propriétaire</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Moment</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Qui dispose de la parole ?</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Ce que le récit fait voir</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le projet de mariage</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le propriétaire choisit</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">des qualités</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Une personne lui échappe.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Près de la chapelle</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Trois hommes discutent de</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">propriété</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le patron répond par</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">l’injure.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le sermon du soir</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le propriétaire entend</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">démontrer</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le silence et les gestes</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">traduisent la peur.</text>
</g>
</svg>
