<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Comment une pensée arrive dans la nasse</title>
<desc id="description">Les Problèmes Le sérieux tourne court Donner une marque visible à l’emphase. Le souvenir des jambes Le détail concret l’emporte Conserver la pointe du contraste. La nasse relevée Il peut n’y avoir aucune prise Laisser les crustacés faire surgir la métaphore.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Comment une pensée arrive dans la nasse</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Phrase ou image</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Mouvement</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Choix de traduction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Les Problèmes</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Le sérieux tourne court</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Donner une marque visible à</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">l’emphase.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le souvenir des</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">jambes</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le détail concret</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">l’emporte</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Conserver la pointe du</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">contraste.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La nasse relevée</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Il peut n’y avoir aucune</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">prise</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Laisser les crustacés faire</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">surgir la métaphore.</text>
</g>
</svg>
