<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Temps du récit et voix rapportées</title>
<desc id="description">Marthe au narrateur La rencontre avant son mariage Irréel du passé et antériorité. Jacques dans les lettres L’épouse lui paraît irréprochable Distinguer sa voix du récit extérieur. Le narrateur Mars et les jours qui se répètent Conserver l’habitude et la résolution.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Temps du récit et voix rapportées</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Qui parle ?</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Repère</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Point de traduction</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Marthe au narrateur</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">La rencontre avant son</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">mariage</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Irréel du passé et</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">antériorité.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Jacques dans les</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">lettres</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">L’épouse lui paraît</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">irréprochable</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Distinguer sa voix du récit</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">extérieur.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le narrateur</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Mars et les jours qui se</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">répètent</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Conserver l’habitude et la</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">résolution.</text>
</g>
</svg>
