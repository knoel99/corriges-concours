<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Du souvenir de la chaleur à la question du vrai</title>
<desc id="description">La ville épuisée Des habitudes, puis une envie soudaine Changer d’aspect à l’apparition du désir. Le père Le vieil homme le rappelle sans le nommer Garder la médiation de la voix et du regard. Le métier de biographe Trois questions avant une règle Reprendre le mot vérité et son incertitude.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Du souvenir de la chaleur à la question du vrai</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Repère</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Voix ou geste</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Choix russe</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">La ville épuisée</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Des habitudes, puis une</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">envie soudaine</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Changer d’aspect à</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">l’apparition du désir.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Le père</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Le vieil homme le rappelle</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">sans le nommer</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Garder la médiation de la</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">voix et du regard.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Le métier de</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">biographe</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Trois questions avant une</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">règle</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Reprendre le mot vérité et</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">son incertitude.</text>
</g>
</svg>
