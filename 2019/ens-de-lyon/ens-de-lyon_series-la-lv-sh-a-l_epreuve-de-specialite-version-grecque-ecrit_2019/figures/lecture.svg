<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Quel maître impose le plus de contraintes ?</title>
<desc id="description">Le tyran Les égards peuvent le calmer. On peut parfois l’apprivoiser. La bête Les soins peuvent l’adoucir. Le comportement peut changer. La gloire L’obéissance excite ses exigences. Le serviteur docile reçoit toujours de nouveaux ordres.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quel maître impose le plus de contraintes ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Figure</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Relation aux soins</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Résultat</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Le tyran</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Les égards peuvent le</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">calmer.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">On peut parfois</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">l’apprivoiser.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">La bête</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Les soins peuvent</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">l’adoucir.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Le comportement peut</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">changer.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">La gloire</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">L’obéissance excite ses</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">exigences.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Le serviteur docile reçoit</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">toujours de nouveaux</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">ordres.</text>
</g>
</svg>
