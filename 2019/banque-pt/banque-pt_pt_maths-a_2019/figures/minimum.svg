"16" fill="#1b4052">X</text><text x="53" y="62" font-size="16" fill="#1b4052">Y</text><text x="300" y="96" font-size="16" fill="#1b4052">Vert : X = Y, donc T = 0.</text><text x="300" y="142" font-size="16" fill="#1b4052">Brun : X = Y + 1, donc T = 1.</text><text x="300" y="185" font-size="16" fill="#1b4052">Sur cette diagonale, le minimum Z prend</text><text x="300" y="214" font-size="16" fill="#1b4052">les valeurs 0, 1, 2, 3 aux points dessinés.</text></g></svg>