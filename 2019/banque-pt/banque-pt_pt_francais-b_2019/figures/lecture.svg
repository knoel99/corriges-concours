<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>De la valeur reconnue à l’obligation</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">De la valeur reconnue à l’obligation</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Fidélité</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Titania protège le fils de son amie, même</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">après la mort de celle-ci.</text>
<text x="549" y="62" font-size="14" font-weight="700" fill="#203c49">Une valeur</text>
<text x="549" y="79" font-size="14" font-weight="700" fill="#203c49">défendue</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Illusion</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">Héléna expose Hermia pour obtenir la</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">faveur de Démétrius.</text>
<text x="549" y="121" font-size="14" font-weight="700" fill="#203c49">Un jugement à</text>
<text x="549" y="138" font-size="14" font-weight="700" fill="#203c49">éprouver</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Conflit</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Clélia protège Fabrice tout en se sachant</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">liée à son père.</text>
<text x="549" y="180" font-size="14" font-weight="700" fill="#203c49">Deux biens</text>
<text x="549" y="197" font-size="14" font-weight="700" fill="#203c49">reconnus</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
