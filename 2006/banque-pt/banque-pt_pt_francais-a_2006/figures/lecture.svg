<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>D’un malheur subi à une conduite envers autrui</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">D’un malheur subi à une conduite envers autrui</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Sérébriakov</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">L’entourage doit régler ses heures sur ses</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">inquiétudes.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">Dépendance</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Alexis</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">Le rêve du trésor donne au présent le prix</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">d’une attente.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Désir réorientable</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Sonia</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Sans être heureuse, elle offre à Vania une</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">présence.</text>
<text x="549" y="189" font-size="14" font-weight="700" fill="#203c49">Contre-exemple</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
