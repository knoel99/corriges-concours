<text x="480.0" y="90.0" text-anchor="start" fill="#222" font-size="15">Sommets : 8 × 1/8 = 1 atome</text>
<text x="480.0" y="114.0" text-anchor="start" fill="#222" font-size="15">Centres des faces : 6 × 1/2 = 3 atomes</text>
<text x="480.0" y="138.0" text-anchor="start" fill="#222" font-size="15">Soit 4 atomes par maille</text>
<text x="480.0" y="186.0" text-anchor="start" fill="#c64600" font-size="15">Contact sur la diagonale d'une face :</text>
<text x="480.0" y="210.0" text-anchor="start" fill="#c64600" font-size="15">4 R = a √2, soit R ≈ 0,138 nm</text>
<text x="480.0" y="234.0" text-anchor="start" fill="#c64600" font-size="15">Plus courte distance : a √2 / 2 ≈ 0,276 nm</text>
<text x="480.0" y="282.0" text-anchor="start" fill="#2a7d3f" font-size="15">Site tétraédrique : centre d'un huitième</text>
<text x="480.0" y="306.0" text-anchor="start" fill="#2a7d3f" font-size="15">de cube, à a √3 / 4 de ses 4 voisins ;</text>
<text x="480.0" y="330.0" text-anchor="start" fill="#2a7d3f" font-size="15">8 sites par maille, tous intérieurs</text>
