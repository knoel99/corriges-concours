<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Comment vie heureuse et vie bonne se rejoignent-elles ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Comment vie heureuse et vie bonne se rejoignent-elles ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Russell</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Une affection sincère associe le bien de</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">l’autre au mien.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">Convergence</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="130" font-size="15" font-weight="700" fill="#203c49">Sénèque</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">La vertu fournit la mesure d’une vie</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">heureuse.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Priorité morale</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Tchékhov</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Sonia console alors que son propre bonheur</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">reste à venir.</text>
<text x="549" y="189" font-size="14" font-weight="700" fill="#203c49">Écart possible</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
