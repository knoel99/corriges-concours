<svg xmlns="http://www.w3.org/2000/svg" width="870" height="417" viewBox="0 0 870 417" role="img"><title>À qui demander réparation et qui en supportera la charge ?</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">À qui demander réparation et qui en supportera la charge ?</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Faute en cause</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Action de la victime</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Répartition ultérieure</text><rect x="12" y="84" width="842" height="115" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Faute de service</text><text x="23" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">seule</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Contre la personne</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">publique, en principe</text><text x="225" y="158" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">devant le juge</text><text x="225" y="182" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">administratif</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">La personne publique assume la</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">charge.</text><rect x="12" y="199" width="842" height="91" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Faute personnelle</text><text x="23" y="249" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">sans lien avec le</text><text x="23" y="273" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">service</text><text x="225" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Contre l’agent devant le</text><text x="225" y="249" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">juge judiciaire</text><text x="505" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">L’agent répond seul de la faute.</text><rect x="12" y="290" width="842" height="115" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Faute personnelle</text><text x="23" y="340" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">liée au service</text><text x="225" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Action possible contre la</text><text x="225" y="340" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">personne publique ou</text><text x="225" y="364" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">contre l’agent selon le</text><text x="225" y="388" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">fondement</text><text x="505" y="316" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Une seule réparation. Des recours</text><text x="505" y="340" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">peuvent ensuite répartir la</text><text x="505" y="364" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">charge.</text></svg>
