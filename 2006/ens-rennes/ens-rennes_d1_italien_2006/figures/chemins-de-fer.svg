<svg xmlns="http://www.w3.org/2000/svg" width="720" height="319" viewBox="0 0 720 319" role="img" aria-labelledby="titre description">
<title id="titre">Du défaut de matériel à la critique des budgets</title>
<desc id="description">Accident Tringle d’aiguillage endommagée. Première cause matérielle avancée. Réseau local Les cheminots évoquent des pannes récurrentes. Leur témoignage dépasse le cas de Crevalcore. Décision publique Le journaliste oppose entretien et grande vitesse. Il met en débat le partage des crédits.</desc>
<rect width="720" height="319" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Du défaut de matériel à la critique des budgets</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Niveau</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Élément du texte</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Interprétation</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Accident</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Tringle d’aiguillage</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">endommagée.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Première cause matérielle</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">avancée.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Réseau local</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Les cheminots évoquent des</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">pannes récurrentes.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Leur témoignage dépasse le</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">cas de Crevalcore.</text>
<rect x="10" y="226" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Décision publique</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Le journaliste oppose</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">entretien et grande</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">vitesse.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Il met en débat le partage</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">des crédits.</text>
</g>
</svg>
