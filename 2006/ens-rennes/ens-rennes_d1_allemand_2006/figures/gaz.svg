<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Que dit chaque intervenant de l’approvisionnement ?</title>
<desc id="description">Wintershall Quantités reçues via l’Ukraine. Baisse déjà constatée. Michael Glos Importations russes prévues. Conditionnées à des livraisons fiables. Werner Hoyer Levier de pression possible. Demande de diversification.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Que dit chaque intervenant de l’approvisionnement ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Voix</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Objet</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Portée</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Wintershall</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Quantités reçues via</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">l’Ukraine.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Baisse déjà constatée.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Michael Glos</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">Importations russes</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">prévues.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Conditionnées à des</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">livraisons fiables.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Werner Hoyer</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">Levier de pression</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">possible.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">Demande de diversification.</text>
</g>
</svg>
