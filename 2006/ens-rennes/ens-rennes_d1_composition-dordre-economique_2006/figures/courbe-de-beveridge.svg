<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img">
<title>Courbe de Beveridge, récession et difficultés d’appariement</title>
<rect width="760" height="350" rx="10" fill="#faf9f5"/>
<g fill="#17354b" font-family="DejaVu Sans, sans-serif">
<text x="20" y="28" font-size="19" font-weight="bold">Taux d’emplois vacants</text>
<path d="M75 48V280H718 M70 56l5 -9 5 9 M708 275l10 5 -10 5" stroke="#17354b" stroke-width="2" fill="none"/>
<text x="525" y="315" font-size="19">Taux de chômage</text>
<path d="M155 59C167 146 211 220 405 251" fill="none" stroke="#187571" stroke-width="4"/>
<path d="M350 59C362 146 406 220 600 251" fill="none" stroke="#97542a" stroke-dasharray="8 5" stroke-width="4"/>
<path d="M171 123 L365 123" fill="none" stroke="#97542a" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M355 118l10 5 -10 5" fill="none" stroke="#97542a" stroke-width="2"/>
<circle cx="171" cy="123" r="5" fill="#17354b"/><text x="148" y="118" font-size="18">A</text>
<circle cx="366" cy="123" r="5" fill="#97542a"/><text x="377" y="118" font-size="18">C</text>
<circle cx="269" cy="210" r="5" fill="#187571"/><text x="250" y="234" font-size="18">B</text>
<text x="424" y="79" font-size="16">A → C : appariement dégradé</text>
<text x="424" y="103" font-size="15">À taux de vacances donné,</text><text x="424" y="125" font-size="15">le chômage est plus élevé.</text>
<text x="104" y="308" font-size="16">A → B : ralentissement conjoncturel</text>
<text x="104" y="332" font-size="15">Moins de postes à pourvoir et davantage de chômeurs.</text>
</g></svg>
