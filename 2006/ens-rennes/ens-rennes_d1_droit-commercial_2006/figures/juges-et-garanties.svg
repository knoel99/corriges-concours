<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 351" width="990" height="351" role="img" aria-labelledby="title desc">
<title id="title">Ce que modifient les trois solutions institutionnelles</title><desc id="desc">Spécialité de la formation, expérience économique et garanties d’indépendance peuvent être organisées de plusieurs manières.</desc>
<rect width="990" height="351" rx="12" fill="#f5f7f9"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172f41">
<text x="25" y="40" font-size="26" font-weight="bold">Ce que modifient les trois solutions institutionnelles</text>
<text x="25" y="83" font-size="19" font-weight="bold" fill="#365c66">Composition envisagée</text>
<text x="332" y="83" font-size="19" font-weight="bold" fill="#365c66">Atout recherché</text>
<text x="665" y="83" font-size="19" font-weight="bold" fill="#365c66">Condition de réussite</text>
<rect x="14" y="99" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="138" font-size="18">Juges consulaires élus</text>
<text x="332" y="138" font-size="18">Expérience du commerce</text>
<text x="665" y="125" font-size="18">Formation juridique et</text>
<text x="665" y="149" font-size="18">traitement des conflits</text>
<path d="M 299 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="174" width="962" height="64" rx="8" fill="#edf2e6"/>
<text x="25" y="213" font-size="18">Juges professionnels seuls</text>
<text x="332" y="213" font-size="18">Pratique du procès</text>
<text x="665" y="200" font-size="18">Spécialisation économique</text>
<text x="665" y="224" font-size="18">et moyens disponibles</text>
<path d="M 299 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="249" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="288" font-size="18">Formation mixte</text>
<text x="332" y="275" font-size="18">Regards économique</text>
<text x="332" y="299" font-size="18">et juridique réunis</text>
<text x="665" y="275" font-size="18">Répartition des rôles et</text>
<text x="665" y="299" font-size="18">délibéré réellement collégial</text>
<path d="M 299 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
</g>
</svg>
