<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 351" width="990" height="351" role="img" aria-labelledby="title desc">
<title id="title">Quel juge pour trois difficultés d’une même usine ?</title><desc id="desc">La compétence varie avec la nature du litige ou la qualité du débiteur, même lorsque les affaires concernent une seule société.</desc>
<rect width="990" height="351" rx="12" fill="#f5f7f9"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172f41">
<text x="25" y="40" font-size="26" font-weight="bold">Quel juge pour trois difficultés d’une même usine ?</text>
<text x="25" y="83" font-size="19" font-weight="bold" fill="#365c66">Affaire</text>
<text x="332" y="83" font-size="19" font-weight="bold" fill="#365c66">Critère décisif</text>
<text x="665" y="83" font-size="19" font-weight="bold" fill="#365c66">Juridiction en principe</text>
<rect x="14" y="99" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="138" font-size="18">Facture d’un fournisseur</text>
<text x="332" y="125" font-size="18">Engagement professionnel</text>
<text x="332" y="149" font-size="18">entre deux commerçants</text>
<text x="665" y="138" font-size="18">Tribunal de commerce</text>
<path d="M 299 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 130 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="174" width="962" height="64" rx="8" fill="#edf2e6"/>
<text x="25" y="213" font-size="18">Salarié réclamant son salaire</text>
<text x="332" y="200" font-size="18">Litige individuel né du</text>
<text x="332" y="224" font-size="18">contrat de travail</text>
<text x="665" y="213" font-size="18">Conseil de prud’hommes</text>
<path d="M 299 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 205 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<rect x="14" y="249" width="962" height="64" rx="8" fill="#e5eef2"/>
<text x="25" y="288" font-size="18">Sauvegarde de la SARL</text>
<text x="332" y="275" font-size="18">Débitrice commerciale</text>
<text x="332" y="299" font-size="18">demandant la sauvegarde</text>
<text x="665" y="288" font-size="18">Tribunal de commerce</text>
<path d="M 299 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
<path d="M 632 280 h 16 m -5 -5 l 5 5 -5 5" fill="none" stroke="#406873" stroke-width="2"/>
</g>
</svg>
