<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="titre description">
<title id="titre">Quel usage de la ville pour quels habitants ?</title>
<desc id="description">Espace concentré Une part croissante de la population occupe les villes. Des usages incompatibles peuvent s’y rencontrer. Vie nocturne Une partie de la jeunesse recherche des loisirs bruyants. Les riverains ont aussi besoin de calme. Règles L’autorité peut être perçue comme arbitraire. Expliquer et discuter une règle permet d’en juger la légitimité.</desc>
<rect width="720" height="363" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Quel usage de la ville pour quels habitants ?</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Élément</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Dans l’article</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Dans la discussion</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Espace concentré</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Une part croissante de la</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">population occupe les</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">villes.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Des usages incompatibles</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">peuvent s’y rencontrer.</text>
<rect x="10" y="181" width="700" height="83" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Vie nocturne</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">Une partie de la jeunesse</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">recherche des loisirs</text>
<text x="229" y="250" font-size="15" font-weight="400" fill="#162d3b">bruyants.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Les riverains ont aussi</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">besoin de calme.</text>
<rect x="10" y="270" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="295" font-size="15" font-weight="700" fill="#162d3b">Règles</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">L’autorité peut être</text>
<text x="229" y="317" font-size="15" font-weight="400" fill="#162d3b">perçue comme arbitraire.</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">Expliquer et discuter une</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">règle permet d’en juger la</text>
<text x="473" y="339" font-size="15" font-weight="400" fill="#162d3b">légitimité.</text>
</g>
</svg>
