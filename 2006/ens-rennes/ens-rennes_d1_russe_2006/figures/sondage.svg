<svg xmlns="http://www.w3.org/2000/svg" width="720" height="297" viewBox="0 0 720 297" role="img" aria-labelledby="titre description">
<title id="titre">Trois objets de comparaison dans le sondage de 2005</title>
<desc id="description">Amélioration économique nationale Près du tiers des sondés l’attend. 19 % l’attendent. Amélioration matérielle familiale 27,7 % l’attendent. Moins du quart l’attend. Bon état d’esprit ou état satisfaisant 85 % des sondés. 81 % des sondés.</desc>
<rect width="720" height="297" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">Trois objets de comparaison dans le sondage de 2005</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Objet</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Réponses en Russie</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Réponses en Europe</text>
<rect x="10" y="92" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Amélioration</text>
<text x="24" y="139" font-size="15" font-weight="700" fill="#162d3b">économique nationale</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Près du tiers des sondés</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">l’attend.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">19 % l’attendent.</text>
<rect x="10" y="159" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="184" font-size="15" font-weight="700" fill="#162d3b">Amélioration</text>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">matérielle familiale</text>
<text x="229" y="184" font-size="15" font-weight="400" fill="#162d3b">27,7 % l’attendent.</text>
<text x="473" y="184" font-size="15" font-weight="400" fill="#162d3b">Moins du quart l’attend.</text>
<rect x="10" y="226" width="700" height="61" rx="3" fill="#e7efed"/>
<text x="24" y="251" font-size="15" font-weight="700" fill="#162d3b">Bon état d’esprit ou</text>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">état satisfaisant</text>
<text x="229" y="251" font-size="15" font-weight="400" fill="#162d3b">85 % des sondés.</text>
<text x="473" y="251" font-size="15" font-weight="400" fill="#162d3b">81 % des sondés.</text>
</g>
</svg>
