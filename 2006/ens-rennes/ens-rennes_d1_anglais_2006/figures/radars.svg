<svg xmlns="http://www.w3.org/2000/svg" width="720" height="341" viewBox="0 0 720 341" role="img" aria-labelledby="titre description">
<title id="titre">D’un constat commun à deux interprétations</title>
<desc id="description">Enquête Des infractions semblables sont sanctionnées de façon inégale. Que mesure la différence locale ? Partisans La sécurité exige un message cohérent. Les radars réduisent-ils le risque ? Opposants Certains y voient un impôt déguisé. Les emplacements servent-ils la prévention ou les recettes ?</desc>
<rect width="720" height="341" fill="#fcfbf7"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="22" y="38" font-size="22" font-weight="700" fill="#192f42">D’un constat commun à deux interprétations</text>
<text x="24" y="77" font-size="16" font-weight="700" fill="#226369">Étape</text>
<text x="229" y="77" font-size="16" font-weight="700" fill="#226369">Faits ou propos</text>
<text x="473" y="77" font-size="16" font-weight="700" fill="#226369">Question</text>
<rect x="10" y="92" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="117" font-size="15" font-weight="700" fill="#162d3b">Enquête</text>
<text x="229" y="117" font-size="15" font-weight="400" fill="#162d3b">Des infractions semblables</text>
<text x="229" y="139" font-size="15" font-weight="400" fill="#162d3b">sont sanctionnées de façon</text>
<text x="229" y="161" font-size="15" font-weight="400" fill="#162d3b">inégale.</text>
<text x="473" y="117" font-size="15" font-weight="400" fill="#162d3b">Que mesure la différence</text>
<text x="473" y="139" font-size="15" font-weight="400" fill="#162d3b">locale ?</text>
<rect x="10" y="181" width="700" height="61" rx="3" fill="#f2ebdf"/>
<text x="24" y="206" font-size="15" font-weight="700" fill="#162d3b">Partisans</text>
<text x="229" y="206" font-size="15" font-weight="400" fill="#162d3b">La sécurité exige un</text>
<text x="229" y="228" font-size="15" font-weight="400" fill="#162d3b">message cohérent.</text>
<text x="473" y="206" font-size="15" font-weight="400" fill="#162d3b">Les radars réduisent-ils le</text>
<text x="473" y="228" font-size="15" font-weight="400" fill="#162d3b">risque ?</text>
<rect x="10" y="248" width="700" height="83" rx="3" fill="#e7efed"/>
<text x="24" y="273" font-size="15" font-weight="700" fill="#162d3b">Opposants</text>
<text x="229" y="273" font-size="15" font-weight="400" fill="#162d3b">Certains y voient un impôt</text>
<text x="229" y="295" font-size="15" font-weight="400" fill="#162d3b">déguisé.</text>
<text x="473" y="273" font-size="15" font-weight="400" fill="#162d3b">Les emplacements servent-</text>
<text x="473" y="295" font-size="15" font-weight="400" fill="#162d3b">ils la prévention ou les</text>
<text x="473" y="317" font-size="15" font-weight="400" fill="#162d3b">recettes ?</text>
</g>
</svg>
