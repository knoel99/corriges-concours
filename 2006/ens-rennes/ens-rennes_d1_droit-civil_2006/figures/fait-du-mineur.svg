<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img"><title>Un même accident peut faire naître des actions aux conditions distinctes.</title><rect width="800" height="330" rx="10" fill="#faf9f5"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="24" y="33" fill="#17354b" font-size="22" font-weight="bold">Qui peut répondre du coup de ballon ?</text>
<text x="24" y="70" fill="#355f73" font-size="17" font-weight="bold">Fondement examiné</text>
<text x="334" y="70" fill="#355f73" font-size="17" font-weight="bold">Ce que la victime doit notamment établir</text>
<rect x="14" y="81" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 103h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="81" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="109" fill="#152c3d" font-size="16">Faute personnelle de l’enfant</text>
<text x="334" y="109" fill="#152c3d" font-size="16">Une faute objective en lien avec le dommage</text>
<rect x="14" y="136" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 158h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="136" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="164" fill="#152c3d" font-size="16">Garde du ballon par l’enfant</text>
<text x="334" y="164" fill="#152c3d" font-size="16">Une garde effective et le rôle causal de la chose</text>
<rect x="14" y="191" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 213h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="191" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="219" fill="#152c3d" font-size="16">Responsabilité des parents</text>
<text x="334" y="219" fill="#152c3d" font-size="16">Un fait causal du mineur et les conditions familiales</text>
<rect x="14" y="246" width="266" height="43" rx="5" fill="#e5eff2"/>
<path d="M288 268h29m-7 -6l7 6 -7 6" fill="none" stroke="#31746e" stroke-width="2.8"/>
<rect x="323" y="246" width="463" height="43" rx="5" fill="#e7f1ea"/>
<text x="24" y="274" fill="#152c3d" font-size="16">Faute d’un surveillant</text>
<text x="334" y="274" fill="#152c3d" font-size="16">Un défaut de surveillance causal qui lui est imputable</text>
</g></svg>
