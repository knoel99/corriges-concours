<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="t d"><title id="t">Un nouvel élève en classe</title><desc id="d">La transgression tient à quelques boutons. Ce qui la rend décisive aux yeux du narrateur est le contraste avec la règle collective et l’absence de sanction.</desc><rect width="760" height="230" fill="white"/><g font-family="sans-serif"><rect x="7" y="9" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="46" fill="#194552" font-size="18" font-weight="bold">La règle</text><text x="210" y="33" fill="#173d48" font-size="18" font-weight="bold">Il faut fermer sa blouse jusqu’au cou.</text><text x="210" y="57" fill="#294650" font-size="16">Le narrateur dit que tous détestaient cette contrainte.</text><rect x="7" y="82" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="119" fill="#194552" font-size="18" font-weight="bold">Le geste</text><text x="210" y="106" fill="#173d48" font-size="18" font-weight="bold">Pineda laisse quelques boutons ouverts.</text><text x="210" y="130" fill="#294650" font-size="16">Un petit écart visible suffit à émerveiller ses camarades.</text><rect x="7" y="155" width="189" height="61" rx="6" fill="#e5eff3"/><text x="20" y="192" fill="#194552" font-size="18" font-weight="bold">L’interprétation</text><text x="210" y="179" fill="#173d48" font-size="18" font-weight="bold">Aucun professeur ne réagit.</text><text x="210" y="203" fill="#294650" font-size="16">Les dons de la famille éclairent cette impunité.</text></g></svg>
