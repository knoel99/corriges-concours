<svg xmlns="http://www.w3.org/2000/svg" width="760" height="178" viewBox="0 0 760 178" role="img"><title>Pourquoi se donner des règles professionnelles ?</title><rect width="760" height="178" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#193746">
<text x="12" y="25" font-size="20" font-weight="700">Pourquoi se donner des règles professionnelles ?</text>
<rect x="10" y="40" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="63" font-size="17" font-weight="700">Réacteur</text>
<path d="M236 57h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="40" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="63" font-size="16" font-weight="400">Erreurs humaines et défauts techniques se combinent.</text>
<rect x="10" y="81" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="104" font-size="17" font-weight="700">Recherche</text>
<path d="M236 98h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="81" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="104" font-size="17" font-weight="400">Les autorités peinent à suivre des évolutions rapides.</text>
<rect x="10" y="122" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="145" font-size="17" font-weight="700">Espace</text>
<path d="M236 139h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="122" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="145" font-size="17" font-weight="400">Un conflit menacerait des services civils partagés.</text>
</g></svg>
