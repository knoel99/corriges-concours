<svg xmlns="http://www.w3.org/2000/svg" width="650" height="224" viewBox="0 0 650 224" role="img" aria-labelledby="t d"><title id="t">Trie des deux mots a et ab</title><desc id="d">Dans le trie tabulé, a possède deux branches sortantes, une terminaison et b, puis b mène à une terminaison. En binaire le premier enfant de a est la terminaison, dont le frère à droite est b.</desc><rect width="650" height="224" fill="white"/><g font-family="sans-serif" fill="#1c414e" text-anchor="middle"><text x="161" y="24" font-size="18">Trie tabulé</text><text x="493" y="24" font-size="18">Premier fils et frère suivant</text></g><g fill="none" stroke="#275e72" stroke-width="2.8"><path d="M163 49V87M163 91L113 141M163 91L216 141M216 148V190M480 57L438 112M447 120H544M550 132L512 181"/></g><g fill="#1f6572"><circle cx="163" cy="49" r="6"/><circle cx="163" cy="91" r="6"/><circle cx="113" cy="145" r="6"/><circle cx="216" cy="145" r="6"/><circle cx="216" cy="193" r="6"/></g><g font-family="sans-serif" fill="#173a47" text-anchor="middle"><g font-size="18"><text x="185" y="76">a</text><text x="120" y="116">$</text><text x="205" y="114">b</text><text x="236" y="178">$</text></g><g font-size="23"><text x="487" y="56">a</text><text x="435" y="131">$</text><text x="553" y="129">b</text><text x="504" y="204">$</text></g><g font-size="14"><text x="439" y="76">fils</text><text x="494" y="109">frère</text></g></g></svg>
