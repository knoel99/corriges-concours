<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Pourquoi une inondation paraît soudain heureuse</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">La sonnette</text>
<text x="27" y="118" font-size="16">À deux heures du matin,</text>
<text x="27" y="137" font-size="16">un bruit annonce une</text>
<text x="27" y="156" font-size="16">visite imprévue.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Le gardien</text>
<text x="298" y="118" font-size="16">Sa présence habituelle</text>
<text x="298" y="137" font-size="16">lors des arrestations</text>
<text x="298" y="156" font-size="16">nourrit la peur.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">La fuite</text>
<text x="569" y="118" font-size="16">L’absence de policiers</text>
<text x="569" y="137" font-size="16">donne au dégât des eaux</text>
<text x="569" y="156" font-size="16">un sens inattendu.</text>
</g></svg>
