<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 199" width="620" height="199">
  <title>Rencontre à une étape ou au milieu d’un tronçon</title>
  <circle cx="70" cy="86" r="9" fill="#dfefeb" stroke="#00645d" stroke-width="1.8" />
  <text x="70" y="63" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold">A</text>
  <circle cx="190" cy="86" r="9" fill="#dfefeb" stroke="#00645d" stroke-width="1.8" />
  <text x="190" y="63" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold">C</text>
  <circle cx="550" cy="86" r="9" fill="#dfefeb" stroke="#00645d" stroke-width="1.8" />
  <text x="550" y="63" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold">B</text>
  <line x1="79" y1="86" x2="181" y2="86" stroke="#21394d" stroke-width="3" />
  <line x1="199" y1="86" x2="541" y2="86" stroke="#21394d" stroke-width="3" />
  <text x="129" y="111" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">2</text>
  <text x="371" y="111" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal">6</text>
  <line x1="309" y1="76" x2="309" y2="125" stroke="#97421e" stroke-width="2" />
  <text x="309" y="151" fill="#97421e" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal">Milieu du trajet</text>
  <text x="309" y="182" fill="#21394d" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal">4 unités de temps depuis A comme depuis B.</text>
</svg>