<svg xmlns="http://www.w3.org/2000/svg" width="640" height="94" viewBox="0 0 640 94"><title>Pour D égal à x puissance quatre plus un, les quotients complets reviennent au même état dès le premier rang positif.</title><path d="M130 47 L469 47" stroke="#41667b" stroke-width="2.4"/><rect x="22" y="31" width="216" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="130" y="53" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">P₀ = 0, Q₀ = 1</text><rect x="362" y="31" width="214" height="32" rx="5" fill="#eef5f7" stroke="#41667b" stroke-width="1.4"/><text x="469" y="53" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#17354b" text-anchor="middle">P₁ = x², Q₁ = 1</text></svg>
