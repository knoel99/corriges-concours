<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Les trois décisions successives déplacent le pouvoir d’agir de Zeth.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Son projet</text>
<text x="27" y="118" font-size="16">Zeth veut étudier le</text>
<text x="27" y="137" font-size="16">journalisme et gagner sa</text>
<text x="27" y="156" font-size="16">vie dans la presse.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Le refus</text>
<text x="298" y="118" font-size="16">Abdel-Méguid lui demande</text>
<text x="298" y="137" font-size="16">de consacrer tout son</text>
<text x="298" y="156" font-size="16">temps à la maison.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Le poste</text>
<text x="569" y="118" font-size="16">La vie devient chère.</text>
<text x="569" y="137" font-size="16">Son mari lui trouve un</text>
<text x="569" y="156" font-size="16">emploi par relations.</text>
</g></svg>
