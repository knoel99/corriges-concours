<svg xmlns="http://www.w3.org/2000/svg" width="720" height="130" viewBox="0 0 720 130" role="img" aria-labelledby="titre">
<title id="titre">Deux hypothèses, une objection</title><rect width="720" height="130" rx="8" fill="#f4f7f7"/><text x="16" y="27" font-family="DejaVu Sans" font-weight="bold" font-size="17" fill="#183541">Deux hypothèses, une objection</text>
<rect x="14" y="44" width="216" height="65" rx="8" fill="#ffffff" stroke="#68838d"/><text x="122" y="69" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="14.8" fill="#183541">S’il savait</text><text x="122" y="92" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#193e49">Il devait avertir la cité</text>
<rect x="248" y="44" width="216" height="65" rx="8" fill="#ffffff" stroke="#68838d"/><text x="356" y="69" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="14.8" fill="#183541">S’il ignorait</text><text x="356" y="92" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#193e49">Il partageait l’ignorance</text>
<rect x="482" y="44" width="216" height="65" rx="8" fill="#ffffff" stroke="#68838d"/><text x="590" y="69" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="14.8" fill="#183541">Accusation tardive</text><text x="590" y="92" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#193e49">Sur quel fondement ?</text><path d="M122 110 V120 H590 V111 M356 110 V120 M586 115 l4 -4 4 4" fill="none" stroke="#345761" stroke-width="1.5"/>
