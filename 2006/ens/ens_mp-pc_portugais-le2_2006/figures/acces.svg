<svg xmlns="http://www.w3.org/2000/svg" width="760" height="178" viewBox="0 0 760 178" role="img"><title>À quelles conditions le crédit réduit-il l’exclusion ?</title><rect width="760" height="178" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#193746">
<text x="12" y="25" font-size="20" font-weight="700">À quelles conditions le crédit réduit-il l’exclusion ?</text>
<rect x="10" y="40" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="63" font-size="17" font-weight="700">Proximité</text>
<path d="M236 57h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="40" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="63" font-size="17" font-weight="400">Combien coûte un trajet jusqu’au point de service ?</text>
<rect x="10" y="81" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="104" font-size="17" font-weight="700">Prix du crédit</text>
<path d="M236 98h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="81" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="104" font-size="17" font-weight="400">Que devra-t-on rembourser en tout ?</text>
<rect x="10" y="122" width="218" height="34" rx="3" fill="#d6e9e8"/>
<text x="19" y="145" font-size="17" font-weight="700">Revenus irréguliers</text>
<path d="M236 139h23m-6 -5 6 5 -6 5" stroke="#527778" fill="none" stroke-width="2"/>
<rect x="268" y="122" width="480" height="34" rx="3" fill="#eef2ef"/>
<text x="277" y="145" font-size="17" font-weight="400">L’échéancier résiste-t-il à une mauvaise semaine ?</text>
</g></svg>
