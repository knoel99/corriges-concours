<svg xmlns="http://www.w3.org/2000/svg" width="724" height="140" viewBox="0 0 724 140" role="img"><title>Le monument relie plusieurs moments de la vie civique à Dresde.</title><rect x="5" y="5" width="711" height="40" rx="6" fill="#e2efeb"/><text x="20" y="31" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1c3e49">XVIIIᵉ siècle</text><text x="298" y="31" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1c3e49">Collecte pour bâtir l’église</text><rect x="5" y="49" width="711" height="40" rx="6" fill="#eaf1f4"/><text x="20" y="75" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1c3e49">Après la destruction</text><text x="298" y="75" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1c3e49">Soixante années en ruine</text><rect x="5" y="93" width="711" height="40" rx="6" fill="#f4efe3"/><text x="20" y="119" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1c3e49">Octobre 2005</text><text x="298" y="119" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1c3e49">Nouvelle consécration</text></svg>
