<svg xmlns="http://www.w3.org/2000/svg" width="724" height="140" viewBox="0 0 724 140" role="img"><title>Trois mesures différentes dans le texte publié en 2006.</title><rect x="5" y="5" width="711" height="40" rx="6" fill="#e2efeb"/><text x="20" y="31" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1c3e49">Suédoises en 1840</text><text x="298" y="31" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1c3e49">45 ans d’espérance de vie</text><rect x="5" y="49" width="711" height="40" rx="6" fill="#eaf1f4"/><text x="20" y="75" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1c3e49">Japonaises selon l’article</text><text x="298" y="75" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1c3e49">85 ans en moyenne</text><rect x="5" y="93" width="711" height="40" rx="6" fill="#f4efe3"/><text x="20" y="119" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" fill="#1c3e49">Limite supposée</text><text x="298" y="119" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#1c3e49">Environ 130 ans</text></svg>
