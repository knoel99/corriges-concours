<svg xmlns="http://www.w3.org/2000/svg" width="730" height="270" viewBox="0 0 730 270"><rect width="730" height="270" fill="white"/><g font-family="DejaVu Sans" fill="#1c4054"><text x="18" y="27" font-size="19">Entrelacement pour une compression de dimension 3 à 2</text><line x1="155" y1="69" x2="155" y2="167" stroke="#d5dfe0" stroke-width="2" stroke-dasharray="5 4"/><line x1="227" y1="69" x2="227" y2="167" stroke="#d5dfe0" stroke-width="2" stroke-dasharray="5 4"/><line x1="299" y1="69" x2="299" y2="167" stroke="#d5dfe0" stroke-width="2" stroke-dasharray="5 4"/><line x1="371" y1="69" x2="371" y2="167" stroke="#d5dfe0" stroke-width="2" stroke-dasharray="5 4"/><line x1="155" y1="100" x2="371" y2="100" stroke="#5a6b76" stroke-width="2"/><line x1="155" y1="164" x2="371" y2="164" stroke="#5a6b76" stroke-width="2"/><text x="24" y="106" font-size="16">A</text><text x="24" y="170" font-size="16">QᵀAQ</text><circle cx="155" cy="100" r="5" fill="#26766b"/><text x="151" y="83" font-size="15">1</text><circle cx="299" cy="100" r="5" fill="#26766b"/><text x="295" y="83" font-size="15">3</text><circle cx="371" cy="100" r="5" fill="#26766b"/><text x="367" y="83" font-size="15">4</text><circle cx="227" cy="164" r="5" fill="#ac7342"/><text x="222" y="191" font-size="15">2</text><circle cx="371" cy="164" r="5" fill="#ac7342"/><text x="366" y="191" font-size="15">4</text><text x="405" y="80" font-size="16">A a pour diagonale (1, 3, 4).</text><text x="405" y="117" font-size="16">Le plan retenu est engendré par</text><text x="405" y="146" font-size="16">(e₁ + e₂)/√2 et e₃.</text><text x="405" y="189" font-size="16">Les valeurs comprimées sont 2 et 4.</text><text x="66" y="236" font-size="15">Sur cet exemple, la seconde borne supérieure est atteinte.</text></g></svg>