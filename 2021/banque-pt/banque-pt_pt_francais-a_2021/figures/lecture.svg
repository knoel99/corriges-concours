<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Trois façons de vivre avec ce qui échappe</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Trois façons de vivre avec ce qui échappe</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="71" font-size="15" font-weight="700" fill="#203c49">Ignorer un risque</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">Un jardin familier ne montre pas le danger</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">de la contamination.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">La Supplication</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="121" font-size="15" font-weight="700" fill="#203c49">Se représenter le</text>
<text x="19" y="138" font-size="15" font-weight="700" fill="#203c49">retour</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">Une hypothèse sur toute une vie éprouve</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">ce que nous voudrions revivre.</text>
<text x="549" y="121" font-size="14" font-weight="700" fill="#203c49">Le Gai Savoir, §</text>
<text x="549" y="138" font-size="14" font-weight="700" fill="#203c49">341</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="189" font-size="15" font-weight="700" fill="#203c49">Donner rendez-vous</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">Le deuil devient une marche possible vers</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">une tombe connue.</text>
<text x="549" y="189" font-size="14" font-weight="700" fill="#203c49">Pauca meae</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
