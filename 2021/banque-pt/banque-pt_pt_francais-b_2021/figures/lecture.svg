<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img">
<title>Que devient le lien après la perte ?</title>
<g font-family="DejaVu Sans, sans-serif">
<text x="12" y="27" font-size="22" font-weight="700" fill="#193e48">Que devient le lien après la perte ?</text>
<rect x="9" y="39" width="702" height="54" rx="5" fill="#e2eeeb"/>
<text x="19" y="62" font-size="15" font-weight="700" fill="#203c49">Relâcher une</text>
<text x="19" y="79" font-size="15" font-weight="700" fill="#203c49">attente</text>
<text x="201" y="62" font-size="15" font-weight="400" fill="#203c49">À Villequier, la demande faite à la vie se</text>
<text x="201" y="79" font-size="15" font-weight="400" fill="#203c49">transforme en consentement.</text>
<text x="549" y="71" font-size="14" font-weight="700" fill="#203c49">Victor Hugo</text>
<path d="M188 49v34 M537 49v34" stroke="#9db1b4"/>
<rect x="9" y="98" width="702" height="54" rx="5" fill="#f4ead8"/>
<text x="19" y="121" font-size="15" font-weight="700" fill="#203c49">Changer de</text>
<text x="19" y="138" font-size="15" font-weight="700" fill="#203c49">jugement</text>
<text x="201" y="121" font-size="15" font-weight="400" fill="#203c49">Le convalescent réévalue les certitudes de</text>
<text x="201" y="138" font-size="15" font-weight="400" fill="#203c49">son ancien état.</text>
<text x="549" y="130" font-size="14" font-weight="700" fill="#203c49">Friedrich Nietzsche</text>
<path d="M188 108v34 M537 108v34" stroke="#9db1b4"/>
<rect x="9" y="157" width="702" height="54" rx="5" fill="#e3ecf4"/>
<text x="19" y="180" font-size="15" font-weight="700" fill="#203c49">Faire entendre un</text>
<text x="19" y="197" font-size="15" font-weight="700" fill="#203c49">lien</text>
<text x="201" y="180" font-size="15" font-weight="400" fill="#203c49">La parole des témoins garde une place au</text>
<text x="201" y="197" font-size="15" font-weight="400" fill="#203c49">monde dévasté.</text>
<text x="549" y="180" font-size="14" font-weight="700" fill="#203c49">Svetlana</text>
<text x="549" y="197" font-size="14" font-weight="700" fill="#203c49">Alexievitch</text>
<path d="M188 167v34 M537 167v34" stroke="#9db1b4"/>
</g></svg>
