<svg xmlns="http://www.w3.org/2000/svg" width="780" height="221" viewBox="0 0 780 221" role="img"><title>Les conditions qui séparent un lieu connecté d’un lieu propice au travail dans le dossier A.</title><rect width="780" height="221" fill="#f5f7f5"/>
<text x="18" y="33" fill="#173c44" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Comparer les conditions de travail</text>
<rect x="18" y="49" width="744" height="50" fill="#e2efea"/>
<text x="31" y="80" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Activité</text>
<text x="277" y="70" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Travail à distance possible pour certaines</text>
<text x="277" y="91" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">tâches, présence requise pour d’autres.</text>
<rect x="18" y="103" width="744" height="50" fill="#edf1f2"/>
<text x="31" y="134" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Organisation</text>
<text x="277" y="124" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">Un équipement, des horaires et des temps</text>
<text x="277" y="145" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">d’échange restent nécessaires.</text>
<rect x="18" y="157" width="744" height="50" fill="#e4edf0"/>
<text x="31" y="188" fill="#173c44" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="700" text-anchor="start">Vie familiale</text>
<text x="277" y="178" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">La présence d’un parent ne remplace pas</text>
<text x="277" y="199" fill="#173c44" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="400" text-anchor="start">la garde et des temps protégés.</text></svg>
