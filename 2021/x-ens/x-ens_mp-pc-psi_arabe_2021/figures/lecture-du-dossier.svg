<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Trois questions distinctes posées par la confrontation entre les sources anciennes et la crise de 2020.</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Qui sait ?</text>
<text x="27" y="118" font-size="16">Le médecin observe ;</text>
<text x="27" y="137" font-size="16">l’étiquette de remède</text>
<text x="27" y="156" font-size="16">ancien ne garantit</text>
<text x="27" y="175" font-size="16">aucune efficacité.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Qui écrit ?</text>
<text x="298" y="118" font-size="16">Les sources historiques</text>
<text x="298" y="137" font-size="16">retiennent certaines</text>
<text x="298" y="156" font-size="16">questions plutôt que</text>
<text x="298" y="175" font-size="16">d’autres.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Qui décide ?</text>
<text x="569" y="118" font-size="16">Les initiatives</text>
<text x="569" y="137" font-size="16">nationales posent la</text>
<text x="569" y="156" font-size="16">question des moyens de</text>
<text x="569" y="175" font-size="16">la coopération</text>
<text x="569" y="194" font-size="16">régionale.</text>
</g></svg>
