<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img"><title>What does Miss Clack’s evidence establish?</title><desc>An authenticated document can preserve an opinion as accurately as an observation.</desc><rect width="960" height="330" rx="12" fill="#f7f7f3"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="37" fill="#19344a" font-size="25" font-weight="700">What does Miss Clack’s evidence establish?</text><rect x="26" y="54" width="908" height="57" rx="6" fill="#173b4a"/><text x="42" y="88" fill="#ffffff" font-size="21" font-weight="700">An entry in the diary</text><text x="348" y="89" fill="#ffffff" font-size="18">She visits her aunt’s London house on 3 July 1848.</text><path d="M480 111v18M176 129h608M176 129v16M480 129v16M784 129v16" fill="none" stroke="#547b80" stroke-width="2.5"/><rect x="26" y="145" width="296" height="104" rx="7" fill="#e3ece9" stroke="#8fa7a6"/><text x="38" y="178" fill="#19344a" font-size="21" font-weight="700">What she observes</text><text x="38" y="207" fill="#19344a" font-size="15">The blinds are up.</text><text x="38" y="230" fill="#19344a" font-size="15">The servant says nothing.</text><rect x="332" y="145" width="296" height="104" rx="7" fill="#e3ece9" stroke="#8fa7a6"/><text x="344" y="178" fill="#19344a" font-size="21" font-weight="700">What she infers</text><text x="344" y="207" fill="#19344a" font-size="15">Silence amounts to insolence.</text><text x="344" y="230" fill="#19344a" font-size="15">A pamphlet will do some good.</text><rect x="638" y="145" width="296" height="104" rx="7" fill="#e3ece9" stroke="#8fa7a6"/><text x="650" y="178" fill="#19344a" font-size="21" font-weight="700">What Blake promises</text><text x="650" y="207" fill="#19344a" font-size="15">To print her words unaltered.</text><text x="650" y="230" fill="#19344a" font-size="15">They also disclose her character.</text><path d="M27 271H933" stroke="#afbbb7"/><text x="27" y="304" fill="#19344a" font-size="18">An authenticated document can preserve an opinion as accurately as an observation.</text></g></svg>
