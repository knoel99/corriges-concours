<rect x="307" y="4" width="281" height="153" rx="6" fill="#f7efdd"/>
<text x="447" y="37" font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="24" font-weight="700" fill="#1f3944">La niña</text>
<text x="447" y="76" font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="18" font-weight="400" fill="#1f3944">Ella sigue a la paloma,</text>
<text x="447" y="99" font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="18" font-weight="400" fill="#1f3944">él sigue esperando</text>
<text x="447" y="134" font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#1f3944">l. 12–26</text>
