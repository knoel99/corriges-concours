<svg xmlns="http://www.w3.org/2000/svg" width="900" height="161" viewBox="0 0 900 161" role="img" aria-labelledby="t d">
<title id="t">Trois présences dans les derniers mots d’Ojos Azules</title>
<desc id="d">Los compañeros Cigarros y canciones guardan sus nombres l. 1–11 La niña Ella sigue a la paloma, él sigue esperando l. 12–26 Justino La traición se lee bajo coacción l. 27–38</desc>
