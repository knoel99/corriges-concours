<text x="145" y="76" font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="18" font-weight="400" fill="#1f3944">Cigarros y canciones</text>
<text x="145" y="99" font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="18" font-weight="400" fill="#1f3944">guardan sus nombres</text>
<text x="145" y="134" font-family="DejaVu Sans, sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#1f3944">l. 1–11</text>
