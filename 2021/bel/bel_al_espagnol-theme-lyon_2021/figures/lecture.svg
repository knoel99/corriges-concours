<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-labelledby="titre description">
<title id="titre">La fortune vue de Bordeaux</title>
<desc id="description">1800–1812, Le mari reçoit et paie, casa abierta. 1813 et la Restauration, Veuvage, héritage, départs, fortuna → capital. Nathalie, Les fêtes font croire à la richesse, en apariencia</desc>
<rect width="720" height="218" fill="#f8f7f2"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="17" y="31" font-size="23" font-weight="700" fill="#153c48">La fortune vue de Bordeaux</text>
<rect x="12" y="52" width="219" height="152" rx="5" fill="#dfeee9"/>
<text x="22" y="79" font-size="15" font-weight="700" fill="#18555a">1800–1812</text>
<text x="22" y="110" font-size="15" font-weight="400" fill="#20373e">Le mari reçoit et paie</text>
<text x="22" y="167" font-size="14" font-weight="700" fill="#193750">casa abierta</text>
<path d="M228 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="250" y="52" width="219" height="152" rx="5" fill="#f3e9d8"/>
<text x="260" y="79" font-size="15" font-weight="700" fill="#18555a">1813 et la</text>
<text x="260" y="97" font-size="15" font-weight="700" fill="#18555a">Restauration</text>
<text x="260" y="110" font-size="15" font-weight="400" fill="#20373e">Veuvage, héritage,</text>
<text x="260" y="128" font-size="15" font-weight="400" fill="#20373e">départs</text>
<text x="260" y="167" font-size="14" font-weight="700" fill="#193750">fortuna → capital</text>
<path d="M466 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="488" y="52" width="219" height="152" rx="5" fill="#e1eaf0"/>
<text x="498" y="79" font-size="15" font-weight="700" fill="#18555a">Nathalie</text>
<text x="498" y="110" font-size="15" font-weight="400" fill="#20373e">Les fêtes font croire à la</text>
<text x="498" y="128" font-size="15" font-weight="400" fill="#20373e">richesse</text>
<text x="498" y="167" font-size="14" font-weight="700" fill="#193750">en apariencia</text>
</g>
</svg>
