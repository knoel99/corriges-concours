<svg xmlns="http://www.w3.org/2000/svg" width="720" height="218" viewBox="0 0 720 218" role="img" aria-labelledby="titre description">
<title id="titre">Qui répond des faits ?</title>
<desc id="description">Le narrateur raconte, Une dame le gronde, schalt mich. La dame accuse, Les miettes auraient endommagé la machine, sie habe / hätte. Le règlement fait foi, L’étiquette est donnée comme preuve, „SB“</desc>
<rect width="720" height="218" fill="#f8f7f2"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="17" y="31" font-size="23" font-weight="700" fill="#153c48">Qui répond des faits ?</text>
<rect x="12" y="52" width="219" height="152" rx="5" fill="#dfeee9"/>
<text x="22" y="79" font-size="15" font-weight="700" fill="#18555a">Le narrateur raconte</text>
<text x="22" y="110" font-size="15" font-weight="400" fill="#20373e">Une dame le gronde</text>
<text x="22" y="167" font-size="14" font-weight="700" fill="#193750">schalt mich</text>
<path d="M228 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="250" y="52" width="219" height="152" rx="5" fill="#f3e9d8"/>
<text x="260" y="79" font-size="15" font-weight="700" fill="#18555a">La dame accuse</text>
<text x="260" y="110" font-size="15" font-weight="400" fill="#20373e">Les miettes auraient</text>
<text x="260" y="128" font-size="15" font-weight="400" fill="#20373e">endommagé la machine</text>
<text x="260" y="167" font-size="14" font-weight="700" fill="#193750">sie habe / hätte</text>
<path d="M466 133h15m-6 -5l6 5 -6 5" fill="none" stroke="#386166" stroke-width="2"/>
<rect x="488" y="52" width="219" height="152" rx="5" fill="#e1eaf0"/>
<text x="498" y="79" font-size="15" font-weight="700" fill="#18555a">Le règlement fait foi</text>
<text x="498" y="110" font-size="15" font-weight="400" fill="#20373e">L’étiquette est donnée</text>
<text x="498" y="128" font-size="15" font-weight="400" fill="#20373e">comme preuve</text>
<text x="498" y="167" font-size="14" font-weight="700" fill="#193750">„SB“</text>
</g>
</svg>
