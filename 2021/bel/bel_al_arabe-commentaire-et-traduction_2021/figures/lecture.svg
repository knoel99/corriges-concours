<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 132" width="900" height="132" role="img"><title>Les deux camps européens partagent un premier accord. En Orient le désaccord porte déjà sur les études et la liberté civile.</title><rect width="900" height="132" rx="8" fill="#f6f9f9"/><rect x="12" y="10" width="269" height="112" rx="6" fill="#deecea"/><text x="146.5" y="43" font-weight="700" font-size="23" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Le foyer</text><text x="146.5" y="75" font-weight="400" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Travail rendu visible</text><text x="146.5" y="104" font-weight="400" font-size="17" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">l. 1–10</text><path d="M285 66 h23 m-7 -6 l7 6 -7 6" fill="none" stroke="#395667" stroke-width="2"/><rect x="315" y="10" width="269" height="112" rx="6" fill="#f5e9d3"/><text x="449.5" y="43" font-weight="700" font-size="23" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">En Europe</text><text x="449.5" y="75" font-weight="400" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Égalité et charges</text><text x="449.5" y="104" font-weight="400" font-size="17" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">l. 11–25</text><path d="M588 66 h23 m-7 -6 l7 6 -7 6" fill="none" stroke="#395667" stroke-width="2"/><rect x="618" y="10" width="269" height="112" rx="6" fill="#e2e9f2"/><text x="752.5" y="43" font-weight="700" font-size="23" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">En Orient</text><text x="752.5" y="75" font-weight="400" font-size="18" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">Études et droits</text><text x="752.5" y="104" font-weight="400" font-size="17" text-anchor="middle" font-family="DejaVu Sans, sans-serif" fill="#102a3f">l. 26–34</text></svg>
