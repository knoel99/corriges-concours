<svg xmlns="http://www.w3.org/2000/svg" width="840" height="241" viewBox="0 0 840 241" role="img" aria-labelledby="titre description"><title id="titre">Reconstituer une modification de tournée</title><desc id="description">Demande, arbitrage et conséquences. Les cases contiennent des questions d’enquête.</desc><rect x="0.5" y="0.5" width="839" height="240" rx="12" fill="#fbfaf6" stroke="#a8b4b3"/><g font-family="DejaVu Sans, sans-serif" fill="#172f3a"><text x="22" y="33" font-size="22" font-weight="bold" text-anchor="start">Que devient une demande de changement d’horaire ?</text><rect x="22" y="57" width="244" height="117" rx="6" fill="#eef2ed" stroke="#6f8988"/><text x="34" y="83" font-size="19" font-weight="bold" text-anchor="start">Une demande</text><text x="34" y="110" font-size="15" font-weight="bold" text-anchor="start">Personne aidée ou proche</text><text x="34" y="139" font-size="15" font-weight="normal" text-anchor="start">Quel horaire est souhaité ?</text><text x="34" y="160" font-size="15" font-weight="normal" text-anchor="start">Y a-t-il une autre solution ?</text><path d="M269 114h21m-6 -5l6 5-6 5" fill="none" stroke="#25646a" stroke-width="2.5"/><rect x="296" y="57" width="244" height="117" rx="6" fill="#dcebe8" stroke="#6f8988"/><text x="308" y="83" font-size="19" font-weight="bold" text-anchor="start">Un arbitrage</text><text x="308" y="110" font-size="15" font-weight="bold" text-anchor="start">Service et intervenante</text><text x="308" y="139" font-size="15" font-weight="normal" text-anchor="start">Qui décide du nouveau</text><text x="308" y="160" font-size="15" font-weight="normal" text-anchor="start">créneau ? Qui est prévenu ?</text><path d="M543 114h21m-6 -5l6 5-6 5" fill="none" stroke="#25646a" stroke-width="2.5"/><rect x="570" y="57" width="244" height="117" rx="6" fill="#eef2ed" stroke="#6f8988"/><text x="582" y="83" font-size="19" font-weight="bold" text-anchor="start">Une conséquence</text><text x="582" y="110" font-size="15" font-weight="bold" text-anchor="start">Visites suivantes</text><text x="582" y="139" font-size="15" font-weight="normal" text-anchor="start">Qui peut prendre le relais ?</text><text x="582" y="160" font-size="15" font-weight="normal" text-anchor="start">Qui attend ou rappelle ?</text><text x="22" y="203" font-size="15" font-weight="normal" text-anchor="start">Comparer une demande acceptée et une demande refusée. Recouper planning et récits.</text><text x="22" y="226" font-size="14" font-weight="normal" text-anchor="start">Schéma du protocole proposé. Les conséquences seraient à établir sur le terrain.</text></g></svg>
