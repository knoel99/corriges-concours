<svg xmlns="http://www.w3.org/2000/svg" width="840" height="249" viewBox="0 0 840 249" role="img" aria-labelledby="titre description"><title id="titre">Travail à distance selon la profession</title><desc id="description">Trois barres sur la même échelle : cadres 80 %, employés 35 %, ouvriers 6 %.</desc><rect x="0.5" y="0.5" width="839" height="248" rx="12" fill="#fbfaf6" stroke="#a8b4b3"/><g font-family="DejaVu Sans, sans-serif" fill="#172f3a"><text x="22" y="33" font-size="22" font-weight="bold" text-anchor="start">Qui a travaillé à distance en mai 2020 ?</text><path d="M205 60V163" fill="none" stroke="#cad2d1" stroke-width="1"/><text x="205" y="183" font-size="15" font-weight="normal" text-anchor="middle">0 %</text><path d="M327.5 60V163" fill="none" stroke="#cad2d1" stroke-width="1"/><text x="327.5" y="183" font-size="15" font-weight="normal" text-anchor="middle">25 %</text><path d="M450 60V163" fill="none" stroke="#cad2d1" stroke-width="1"/><text x="450" y="183" font-size="15" font-weight="normal" text-anchor="middle">50 %</text><path d="M572.5 60V163" fill="none" stroke="#cad2d1" stroke-width="1"/><text x="572.5" y="183" font-size="15" font-weight="normal" text-anchor="middle">75 %</text><path d="M695 60V163" fill="none" stroke="#cad2d1" stroke-width="1"/><text x="695" y="183" font-size="15" font-weight="normal" text-anchor="middle">100 %</text><text x="28" y="77" font-size="18" font-weight="normal" text-anchor="start">Cadres</text><rect x="205" y="59" width="392" height="23" rx="3" fill="#25646a"/><text x="606" y="77" font-size="17" font-weight="bold" text-anchor="start">80 %</text><text x="28" y="114" font-size="18" font-weight="normal" text-anchor="start">Employés</text><rect x="205" y="96" width="171.5" height="23" rx="3" fill="#25646a"/><text x="385.5" y="114" font-size="17" font-weight="bold" text-anchor="start">35 %</text><text x="28" y="151" font-size="18" font-weight="normal" text-anchor="start">Ouvriers</text><rect x="205" y="133" width="29.4" height="23" rx="3" fill="#25646a"/><text x="243.4" y="151" font-size="17" font-weight="bold" text-anchor="start">6 %</text><text x="22" y="212" font-size="15" font-weight="normal" text-anchor="start">Personnes en activité, semaine précédant l’enquête. Télétravail au moins partiel.</text><text x="22" y="233" font-size="14" font-weight="normal" text-anchor="start">Source : enquête EpiCoV, vague 1, exploitation Insee, octobre 2020.</text></g></svg>
