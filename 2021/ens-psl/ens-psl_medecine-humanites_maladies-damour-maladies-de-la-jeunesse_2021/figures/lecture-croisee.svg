<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img">
<title>Trois questions pour lire un récit de souffrance</title>
<rect width="820" height="230" rx="9" fill="#f2f6f5"/>
<g font-family="DejaVu Sans,sans-serif" fill="#153941">
<rect x="15" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="28" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="27" y="73" font-size="19" font-weight="bold">Qui parle ?</text>
<text x="27" y="118" font-size="16">Un médecin, une personne</text>
<text x="27" y="137" font-size="16">concernée ou une</text>
<text x="27" y="156" font-size="16">association prend la</text>
<text x="27" y="175" font-size="16">parole.</text>
<path d="M264 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="286" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="299" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="298" y="73" font-size="19" font-weight="bold">Que sait-on ?</text>
<text x="298" y="118" font-size="16">Un signe observé, un</text>
<text x="298" y="137" font-size="16">récit et une hypothèse</text>
<text x="298" y="156" font-size="16">causale ont des portées</text>
<text x="298" y="175" font-size="16">différentes.</text>
<path d="M535 115 h19 m-6 -5 6 5 -6 5" fill="none" stroke="#487775" stroke-width="2"/>
<rect x="557" y="18" width="249" height="193" rx="9" fill="#fff" stroke="#487775" stroke-width="2"/>
<rect x="570" y="37" width="29" height="5" rx="2" fill="#147771"/>
<text x="569" y="73" font-size="19" font-weight="bold">Qui peut agir ?</text>
<text x="569" y="118" font-size="16">L’enjeu varie entre</text>
<text x="569" y="137" font-size="16">obéir à une norme, être</text>
<text x="569" y="156" font-size="16">entendu et prévenir un</text>
<text x="569" y="175" font-size="16">risque.</text>
</g></svg>
