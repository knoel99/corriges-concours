<svg xmlns="http://www.w3.org/2000/svg" width="840" height="248" viewBox="0 0 840 248" role="img"><title>Qui qualifie la faute dans la fable ?</title><desc>Dans le livre VII des Fables, la qualification des fautes change avec le pouvoir de celui qui les avoue.</desc><rect width="840" height="248" fill="#faf9f2"/><text x="25" y="36" fill="#193e46" font-size="25" font-family="DejaVu Sans" font-weight="bold" >Qui qualifie la faute dans la fable ?</text><rect x="23" y="60" width="793" height="48" fill="#e3ede8"/><text x="36" y="90" fill="#193e46" font-size="18" font-family="DejaVu Sans" font-weight="bold" >Le lion</text><text x="240" y="90" fill="#193e46" font-size="17" font-family="DejaVu Sans" font-weight="normal" >Il reconnaît avoir mangé des moutons et leur berger.</text><rect x="23" y="118" width="793" height="48" fill="#eee4d0"/><text x="36" y="148" fill="#193e46" font-size="18" font-family="DejaVu Sans" font-weight="bold" >Le renard</text><text x="240" y="148" fill="#193e46" font-size="17" font-family="DejaVu Sans" font-weight="normal" >Il change la prédation du roi en honneur pour les victimes.</text><rect x="23" y="176" width="793" height="48" fill="#e3ede8"/><text x="36" y="206" fill="#193e46" font-size="18" font-family="DejaVu Sans" font-weight="bold" >Le tribunal</text><text x="240" y="206" fill="#193e46" font-size="17" font-family="DejaVu Sans" font-weight="normal" >Le peu d’herbe pris par l’âne devient une faute mortelle.</text></svg>
