<svg xmlns="http://www.w3.org/2000/svg" width="880" height="376" viewBox="0 0 880 376" role="img"><title>Ce qu’une reprise change et ce qu’elle doit établir</title><desc>Comparaison de lectures. Bloch : Un problème à expliquer ; De quelle façon une méprise circule-t-elle pendant la guerre ?. Du Bois : D’autres acteurs au centre ; Quel effet collectif produit le retrait des travailleurs asservis ?. Valla : Une attribution réfutée ; La pièce témoigne de sa fabrication et de ses usages ultérieurs.. Paxton : Les initiatives à réattribuer ; Les archives allemandes permettent de confronter les décisions.</desc><rect width="880" height="376" fill="#fcf8ee"/><g font-family="DejaVu Sans,sans-serif" fill="#17394c"><text x="21" y="37" font-size="25" fill="#17394c" font-weight="bold">Ce qu’une reprise change et ce qu’elle doit établir</text><rect x="24" y="61" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="61" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="89" font-size="16" fill="#17394c" font-weight="bold">Bloch</text><text x="240" y="86" font-size="18" fill="#17394c" font-weight="bold">Un problème à expliquer</text><text x="240" y="111" font-size="15" fill="#17394c">De quelle façon une méprise circule-t-elle pendant la guerre ?</text><rect x="24" y="136" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="136" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="164" font-size="16" fill="#17394c" font-weight="bold">Du Bois</text><text x="240" y="161" font-size="18" fill="#17394c" font-weight="bold">D’autres acteurs au centre</text><text x="240" y="186" font-size="15" fill="#17394c">Quel effet collectif produit le retrait des travailleurs asservis ?</text><rect x="24" y="211" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="211" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="239" font-size="16" fill="#17394c" font-weight="bold">Valla</text><text x="240" y="236" font-size="18" fill="#17394c" font-weight="bold">Une attribution réfutée</text><text x="240" y="261" font-size="15" fill="#17394c">La pièce témoigne de sa fabrication et de ses usages ultérieurs.</text><rect x="24" y="286" width="831" height="66" fill="#ecf0e9" stroke="none" stroke-width="1"/><rect x="24" y="286" width="6" height="66" fill="#9a7445" stroke="none" stroke-width="1"/><text x="43" y="314" font-size="16" fill="#17394c" font-weight="bold">Paxton</text><text x="240" y="311" font-size="18" fill="#17394c" font-weight="bold">Les initiatives à réattribuer</text><text x="240" y="336" font-size="15" fill="#17394c">Les archives allemandes permettent de confronter les décisions.</text></g></svg>
