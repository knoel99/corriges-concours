<svg xmlns="http://www.w3.org/2000/svg" width="846" height="284" viewBox="0 0 846 284" role="img"><title>Que compare le passage de 2020 ?</title><desc>Du cas chinois au critère libéral, l’extrait change trois fois de question.</desc><rect x="0" y="0" width="846" height="284" fill="#faf9f3"/><text x="24" y="38" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1d434d">Que compare le passage de 2020 ?</text><rect x="24" y="67" width="798" height="53" fill="#e4ede8"/><text x="36" y="100" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Que sait-on ?</text><text x="260" y="100" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#1d434d">L’OMS salue un résultat dont il reste à mesurer la portée.</text><rect x="24" y="134" width="798" height="53" fill="#efe4d1"/><text x="36" y="167" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Que compare-t-on ?</text><text x="260" y="167" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#1d434d">Ressources, usage des données, consentement et habitudes.</text><rect x="24" y="201" width="798" height="53" fill="#e4ede8"/><text x="36" y="234" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Qui est protégé ?</text><text x="260" y="234" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#1d434d">Un tiers exposé donne une raison de discuter la contrainte.</text></svg>
