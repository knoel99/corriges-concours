<svg xmlns="http://www.w3.org/2000/svg" width="846" height="284" viewBox="0 0 846 284" role="img"><title>De quelle information a-t-on besoin ?</title><desc>Deux questions publiques, deux besoins d’information</desc><rect x="0" y="0" width="846" height="284" fill="#faf9f3"/><text x="24" y="38" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#1d434d">De quelle information a-t-on besoin ?</text><rect x="24" y="67" width="798" height="53" fill="#e4ede8"/><text x="36" y="100" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Mesurer un flux</text><text x="260" y="100" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#1d434d">Combien de personnes prennent un train surchargé ?</text><rect x="24" y="134" width="798" height="53" fill="#efe4d1"/><text x="36" y="167" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Donner l’alerte</text><text x="260" y="167" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#1d434d">Qui doit recevoir un avertissement après une exposition ?</text><rect x="24" y="201" width="798" height="53" fill="#e4ede8"/><text x="36" y="234" font-family="DejaVu Sans" font-size="18" font-weight="bold" fill="#1d434d">Éprouver le moyen</text><text x="260" y="234" font-family="DejaVu Sans" font-size="16" font-weight="normal" fill="#1d434d">Une donnée requise pour un but peut être superflue pour l’autre.</text></svg>
