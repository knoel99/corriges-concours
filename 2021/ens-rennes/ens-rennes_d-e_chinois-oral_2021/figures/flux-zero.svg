<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 252" width="730" height="252" role="img"><title>从源头到处理：减少垃圾的三个环节</title><rect width="730" height="252" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#203446"><text x="20" y="38" font-size="25" font-weight="bold">从源头到处理：减少垃圾的三个环节</text><g fill="#e6f4f0" stroke="#218679" stroke-width="2"><rect x="20" y="60" width="206" height="115" rx="8"/><rect x="262" y="60" width="206" height="115" rx="8"/><rect x="504" y="60" width="206" height="115" rx="8"/></g><g text-anchor="middle"><g font-size="23" font-weight="bold"><text x="123" y="98">生产</text><text x="365" y="98">消费</text><text x="607" y="98">处理</text></g><g font-size="17"><text x="123" y="135">是否需要一次性包装？</text><text x="365" y="135">能否自带容器按需购买？</text><text x="607" y="135">剩下的垃圾如何分类？</text></g></g><g fill="#218679"><path d="M230 110h17v-6l12 10-12 10v-6h-17z"/><path d="M472 110h17v-6l12 10-12 10v-6h-17z"/></g><text x="22" y="216" font-size="18">前端少产生一件包装，末端就少处理一件；剩余垃圾仍需分类。</text></g></svg>
