<svg xmlns="http://www.w3.org/2000/svg" width="800" height="195" viewBox="0 0 800 195" role="img"><title>Giving teachers discretion, moderating grades and hearing appeals answer three separate questions.</title><rect width="800" height="195" rx="9" fill="#f6f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#1b3342"><text x="16" y="32" font-size="20" font-weight="bold">What does each part of an assessment system do?</text>
<rect x="12" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="22" y="84" font-size="16" font-weight="bold">Teacher assessment</text>
<text x="22" y="111" font-size="15">What did this particular</text>
<text x="22" y="133" font-size="15">pupil demonstrate?</text>
<path d="M258 115h15m-5 -4l5 4 -5 4" stroke="#407366" stroke-width="2" fill="none"/>
<rect x="277" y="55" width="244" height="125" rx="8" fill="#e3eee6"/>
<text x="287" y="84" font-size="16" font-weight="bold">Moderation</text>
<text x="287" y="111" font-size="15">Do similar standards apply</text>
<text x="287" y="133" font-size="15">across schools?</text>
<path d="M523 115h15m-5 -4l5 4 -5 4" stroke="#407366" stroke-width="2" fill="none"/>
<rect x="542" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="552" y="84" font-size="16" font-weight="bold">Appeal</text>
<text x="552" y="111" font-size="15">Was an individual decision</text>
<text x="552" y="133" font-size="15">reached fairly?</text>
</g></svg>
