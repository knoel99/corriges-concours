<svg xmlns="http://www.w3.org/2000/svg" width="800" height="195" viewBox="0 0 800 195" role="img"><title>A 74% annual rise and a doubling from one quarter to the next refer to different comparisons.</title><rect width="800" height="195" rx="9" fill="#f6f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#1b3342"><text x="16" y="32" font-size="20" font-weight="bold">What doubled in the article?</text>
<rect x="12" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="22" y="84" font-size="16" font-weight="bold">Annual change</text>
<text x="22" y="111" font-size="15">2,112 claims in 2019 rose</text>
<text x="22" y="133" font-size="15">to 3,668 in 2020.</text>
<rect x="277" y="55" width="244" height="125" rx="8" fill="#e3eee6"/>
<text x="287" y="84" font-size="16" font-weight="bold">Two quarters</text>
<text x="287" y="111" font-size="15">750 claims increased to</text>
<text x="287" y="133" font-size="15">1,500 in the account.</text>
<rect x="542" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="552" y="84" font-size="16" font-weight="bold">Tribunal outcomes</text>
<text x="552" y="111" font-size="15">These counts do not say</text>
<text x="552" y="133" font-size="15">which claims succeeded.</text>
</g></svg>
