<svg xmlns="http://www.w3.org/2000/svg" width="800" height="195" viewBox="0 0 800 195" role="img"><title>The proposal would give the cohort money now while distributing later costs according to graduates’ repayment paths.</title><rect width="800" height="195" rx="9" fill="#f6f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#1b3342"><text x="16" y="32" font-size="20" font-weight="bold">How could a rebate redistribute the cost?</text>
<rect x="12" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="22" y="84" font-size="16" font-weight="bold">A rebate today</text>
<text x="22" y="111" font-size="15">Students receive a</text>
<text x="22" y="133" font-size="15">proposed one-off £2,700.</text>
<rect x="277" y="55" width="244" height="125" rx="8" fill="#e3eee6"/>
<text x="287" y="84" font-size="16" font-weight="bold">Debt written off</text>
<text x="287" y="111" font-size="15">Extra interest may never</text>
<text x="287" y="133" font-size="15">be repaid in full.</text>
<rect x="542" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="552" y="84" font-size="16" font-weight="bold">Loan repaid in full</text>
<text x="552" y="111" font-size="15">A higher rate can raise</text>
<text x="552" y="133" font-size="15">lifetime payments.</text>
</g></svg>
