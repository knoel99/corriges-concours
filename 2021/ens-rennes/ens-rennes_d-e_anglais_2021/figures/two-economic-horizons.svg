<svg xmlns="http://www.w3.org/2000/svg" width="870" height="278" viewBox="0 0 870 278" role="img"><title>Two economic challenges facing the incoming administration</title><rect width="100%" height="100%" fill="white"/><text x="18" y="31" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="bold">Two economic challenges facing the incoming administration</text><rect x="12" y="45" width="842" height="39" fill="#18465a"/><text x="23" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Horizon</text><text x="225" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Economic mechanism</text><text x="505" y="71" fill="white" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Policy question</text><rect x="12" y="84" width="842" height="91" fill="#eef4f6" stroke="#b1c5c9"/><text x="23" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Immediate</text><text x="225" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Restrictions and</text><text x="225" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">voluntary distancing</text><text x="225" y="158" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">reduce spending.</text><text x="505" y="110" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Can incomes and viable firms</text><text x="505" y="134" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">survive until reopening?</text><rect x="12" y="175" width="842" height="91" fill="#ffffff" stroke="#b1c5c9"/><text x="23" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="bold">Longer term</text><text x="225" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Digital investment</text><text x="225" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">changes jobs and rewards</text><text x="225" y="249" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">established platforms.</text><text x="505" y="201" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">Can workers move between jobs</text><text x="505" y="225" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">without losing essential</text><text x="505" y="249" fill="#1b3143" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="normal">protections?</text></svg>
