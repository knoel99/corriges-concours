<svg xmlns="http://www.w3.org/2000/svg" width="800" height="195" viewBox="0 0 800 195" role="img"><title>La elección de la Convención permite redactar una propuesta cuya adopción exige todavía una nueva votación.</title><rect width="800" height="195" rx="9" fill="#f6f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#1b3342"><text x="16" y="32" font-size="20" font-weight="bold">Chile: tres decisiones con objetos diferentes</text>
<rect x="12" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="22" y="84" font-size="16" font-weight="bold">Octubre de 2020</text>
<text x="22" y="111" font-size="15">La ciudadanía aprueba</text>
<text x="22" y="133" font-size="15">abrir el proceso.</text>
<path d="M258 115h15m-5 -4l5 4 -5 4" stroke="#407366" stroke-width="2" fill="none"/>
<rect x="277" y="55" width="244" height="125" rx="8" fill="#e3eee6"/>
<text x="287" y="84" font-size="16" font-weight="bold">Mayo de 2021</text>
<text x="287" y="111" font-size="15">Se elige a quienes</text>
<text x="287" y="133" font-size="15">redactarán el proyecto.</text>
<path d="M523 115h15m-5 -4l5 4 -5 4" stroke="#407366" stroke-width="2" fill="none"/>
<rect x="542" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="552" y="84" font-size="16" font-weight="bold">Votación prevista</text>
<text x="552" y="111" font-size="15">El electorado aceptará o</text>
<text x="552" y="133" font-size="15">rechazará el texto.</text>
</g></svg>
