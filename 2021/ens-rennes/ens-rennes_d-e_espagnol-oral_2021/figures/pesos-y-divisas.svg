<svg xmlns="http://www.w3.org/2000/svg" width="800" height="195" viewBox="0 0 800 195" role="img"><title>La retirada del CUC simplifica la unidad de cuenta nacional y deja abierta la cuestión del acceso a las divisas.</title><rect width="800" height="195" rx="9" fill="#f6f6f2"/><g font-family="DejaVu Sans, sans-serif" fill="#1b3342"><text x="16" y="32" font-size="20" font-weight="bold">Cuba: dos problemas monetarios distintos</text>
<rect x="12" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="22" y="84" font-size="16" font-weight="bold">Antes de la reforma</text>
<text x="22" y="111" font-size="15">CUP y CUC circulan en la</text>
<text x="22" y="133" font-size="15">economía.</text>
<path d="M258 115h15m-5 -4l5 4 -5 4" stroke="#407366" stroke-width="2" fill="none"/>
<rect x="277" y="55" width="244" height="125" rx="8" fill="#e3eee6"/>
<text x="287" y="84" font-size="16" font-weight="bold">Medida anunciada</text>
<text x="287" y="111" font-size="15">El CUP sustituye al CUC</text>
<text x="287" y="133" font-size="15">como moneda corriente.</text>
<path d="M523 115h15m-5 -4l5 4 -5 4" stroke="#407366" stroke-width="2" fill="none"/>
<rect x="542" y="55" width="244" height="125" rx="8" fill="#e2edf0"/>
<text x="552" y="84" font-size="16" font-weight="bold">Pregunta pendiente</text>
<text x="552" y="111" font-size="15">¿Quién puede pagar en las</text>
<text x="552" y="133" font-size="15">tiendas en divisas?</text>
</g></svg>
