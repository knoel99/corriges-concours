<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="DejaVu Sans, sans-serif"><title>Inverser un signe modifie l’instruction sans déplacer l’ouverture.</title><rect width="900" height="250" fill="#faf9f4"/><text x="450" y="30" text-anchor="middle" font-size="25" fill="#163945">Que change une flèche si on la retourne ?</text><rect x="73" y="77" width="300" height="90" fill="#d8e8df" stroke="#335563" stroke-width="2"/><line x1="83" y1="157" x2="363" y2="157" stroke="#7595a0" stroke-width="3"/><rect x="193" y="114" width="53" height="42" fill="#ead3a5" stroke="#335563" stroke-width="2"/><rect x="486" y="77" width="300" height="90" fill="#d8e8df" stroke="#335563" stroke-width="2"/><line x1="496" y1="157" x2="776" y2="157" stroke="#7595a0" stroke-width="3"/><rect x="606" y="114" width="53" height="42" fill="#ead3a5" stroke="#335563" stroke-width="2"/><path d="M 251 97 h 64 m -12 -9 l 12 9 l -12 9" fill="none" stroke="#a34a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 625 97 h -64 m 12 -9 l -12 9 l 12 9" fill="none" stroke="#a34a22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="205" text-anchor="middle" font-size="17" fill="#163945">Le signe dirige vers la droite.</text><text x="640" y="205" text-anchor="middle" font-size="17" fill="#163945">Le signe dirige vers la gauche.</text><text x="450" y="235" text-anchor="middle" font-size="17" fill="#163945">L’ouverture matérielle reste à la même place.</text></svg>
