<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Ralentir le regard</title><desc>Théâtre Nanterre-Amandiers · cinq affiches qui demandent au passant de compléter une image avant de lire le programme.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#24232a" text-anchor="start">À VOUS DE LIRE</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#24232a" text-anchor="end">1 / 8</text>
<path d="M13 20 L407 20" stroke="#24232a" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Ralentir le regard</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Théâtre Nanterre-Amandiers · cinq affiches qui demandent au passant de compléter une image avant de lire le programme.</text>
<rect x="17" y="63" width="121" height="112" rx="0" fill="#e6be53" stroke="none" stroke-width="0.6"/>
<text x="22" y="77" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#24232a" text-anchor="start">Portrait</text>
<ellipse cx="76" cy="116" rx="14" ry="20" fill="none" stroke="#24232a" stroke-width="1.1"/>
<path d="M49 153 Q77 127 105 153" fill="none" stroke="#24232a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="19" y="193" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">La photographie de vedette identifie un</text>
<text x="19" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">visage mais apprend peu au passant qui ne</text>
<text x="19" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">le connaît pas.</text>
<rect x="150" y="63" width="121" height="112" rx="0" fill="#a699d9" stroke="none" stroke-width="0.6"/>
<text x="155" y="77" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#24232a" text-anchor="start">Calendrier</text>
<text x="170" y="138" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#24232a" text-anchor="start">19</text>
<path d="M165 144 L240 144" stroke="#24232a" stroke-width="1.2" fill="none"/>
<text x="152" y="193" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">La date seule s’aperçoit de loin. Le</text>
<text x="152" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">spectacle disparaît derrière la</text>
<text x="152" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">succession des rendez-vous.</text>
<rect x="283" y="63" width="121" height="112" rx="0" fill="#7db8c1" stroke="none" stroke-width="0.6"/>
<text x="288" y="77" font-family="DejaVu Sans, sans-serif" font-size="4.7" font-weight="700" fill="#24232a" text-anchor="start">Question dessinée</text>
<g transform="translate(310 91) scale(1.2)">
<path d="M3 10 Q8 5 23 9 Q38 6 43 12 Q37 20 39 32 Q27 30 12 33 Q10 22 3 10Z" fill="#fffaed" stroke="#24232a" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M18 24 Q29 15 43 20 Q57 22 57 34 Q55 47 37 45 L24 53 L27 42 Q14 38 18 24Z" fill="none" stroke="#24232a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M27 29 L27 36" stroke="#24232a" stroke-width="1" fill="none"/>
<path d="M32 27 L32 38" stroke="#24232a" stroke-width="1" fill="none"/>
<path d="M37 29 L37 36" stroke="#24232a" stroke-width="1" fill="none"/>
<path d="M42 27 L42 38" stroke="#24232a" stroke-width="1" fill="none"/>
</g>
<text x="285" y="193" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Une scène tient dans deux contours qui se</text>
<text x="285" y="198" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">rencontrent. La question ouvre une</text>
<text x="285" y="203" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">lecture à une personne qui ne connaît pas</text>
<text x="285" y="208" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">le théâtre.</text>
<path d="M13 276 L407 276" stroke="#24232a" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#24232a" text-anchor="start">Le logo original de l’annexe 1 accompagne les cinq affiches et les trois supports. Les dates proviennent de la brochure 2019–2020 fournie au</text>
<text x="14" y="287.5" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#24232a" text-anchor="start">concours.</text>
</svg>
