<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#24232a" text-anchor="start">À VOUS DE LIRE</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#24232a" text-anchor="end">3 / 8</text>
<path d="M13 20 L407 20" stroke="#24232a" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Désordre du discours</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Affiche de série · composition verticale pour impression grand format, réduite ici pour la présentation.</text>
<g transform="translate(25 57) scale(1)">
<rect x="0" y="0" width="145" height="205" rx="0" fill="#a699d9" stroke="#24232a" stroke-width="0.65"/>
