</g>
<text x="8" y="139" font-family="DejaVu Sans, sans-serif" font-size="15.5" font-weight="700" fill="#24232a" text-anchor="start">DÉSORDRE</text>
<text x="8" y="154" font-family="DejaVu Sans, sans-serif" font-size="15.5" font-weight="700" fill="#24232a" text-anchor="start">DU DISCOURS</text>
<text x="8" y="167" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="700" fill="#24232a" text-anchor="start">Fanny de Chaillé</text>
<text x="8" y="179" font-family="DejaVu Sans, sans-serif" font-size="4.45" font-weight="700" fill="#24232a" text-anchor="start">6 — 7 novembre 2019</text>
<text x="8" y="191.0" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#24232a" text-anchor="start">À qui appartient la voix ?</text>
<rect x="118.3" y="168.3" width="19.4" height="23.39014778325123" rx="0" fill="white" stroke="none" stroke-width="0.6"/>
<image xmlns:xlink="http://www.w3.org/1999/xlink" x="119" y="169" width="18" height="21.99014778325123" xlink:href="data:image/png;base64,"/>
</g>
<text x="199" y="79" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#24232a" text-anchor="start">Le spectacle</text>
<text x="199" y="91" font-family="DejaVu Sans, sans-serif" font-size="3.75" font-weight="400" fill="#212e2c" text-anchor="start">Une performance reprend la leçon de Michel Foucault, L’Ordre du</text>
<text x="199" y="96" font-family="DejaVu Sans, sans-serif" font-size="3.75" font-weight="400" fill="#212e2c" text-anchor="start">discours, à partir de la trace écrite et de la voix absente.</text>
<text x="199" y="142" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#24232a" text-anchor="start">Texte et image</text>
<text x="199" y="154" font-family="DejaVu Sans, sans-serif" font-size="3.75" font-weight="400" fill="#212e2c" text-anchor="start">Les lignes de texte se décalent les unes par rapport aux autres. Un</text>
<text x="199" y="159" font-family="DejaVu Sans, sans-serif" font-size="3.75" font-weight="400" fill="#212e2c" text-anchor="start">intervalle vide donne une place à la voix qui manque.</text>
<text x="199" y="213" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#24232a" text-anchor="start">Question de rue</text>
<text x="199" y="226" font-family="DejaVu Sans, sans-serif" font-size="4.2" font-weight="400" fill="#24232a" text-anchor="start">À qui appartient la voix ?</text>
<path d="M13 276 L407 276" stroke="#24232a" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#24232a" text-anchor="start">Saison 2019–2020, d’après la brochure de Nanterre-Amandiers. La date reste dans un bandeau constant quelle que soit la grammaire de l’image.</text>
</svg>
