<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Désordre du discours</title><desc>Affiche de série · composition verticale pour impression grand format, réduite ici pour la présentation.</desc>
