<text x="269" y="77" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#438a94" text-anchor="start">Percevoir</text>
<text x="269" y="88" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Comparer l’air près de deux zones du linge</text>
<text x="269" y="93" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">à celui de la pièce.</text>
<text x="269" y="127" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#438a94" text-anchor="start">Décider</text>
<text x="269" y="138" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Si une zone renvoie une humidité</text>
<text x="269" y="143" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">persistante, y orienter le souffle ; en cas</text>
<text x="269" y="148" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">de doute demander un geste humain.</text>
<text x="269" y="188" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#438a94" text-anchor="start">Agir</text>
<text x="269" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Un volet interne dirige un ventilateur</text>
<text x="269" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">basse tension vers la moitié retenue. La</text>
<text x="269" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">touche arrête le mouvement.</text>
<path d="M13 276 L407 276" stroke="#438a94" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#438a94" text-anchor="start">L’étendoir existe déjà. Le robot s’ajoute comme un petit objet au sol ; il n’a besoin ni d’un visage ni d’un accès à la vie privée du foyer.</text>
</svg>
