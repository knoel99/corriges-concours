<text x="285" y="195" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">Lorsque les écarts diminuent, le flux</text>
<text x="285" y="200" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">s’arrête et un témoin invite à toucher</text>
<text x="285" y="205" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">le linge. La personne décide de le</text>
<text x="285" y="210" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#212e2c" text-anchor="start">ranger ou de relancer.</text>
<path d="M13 276 L407 276" stroke="#438a94" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#438a94" text-anchor="start">Mesurer la durée, le bruit et l’énergie consommée face au séchage passif. Une forte humidité ambiante peut rendre le dispositif peu utile.</text>
