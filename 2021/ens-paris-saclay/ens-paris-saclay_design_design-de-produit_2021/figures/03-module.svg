<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Une boîte, deux directions</title><desc>Vue éclatée et plan d’encombrement · 260 × 150 × 125 mm · support stable et ouïes protégées.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#438a94" text-anchor="start">ENTRE LES DRAPS</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#438a94" text-anchor="end">3 / 4</text>
<path d="M13 20 L407 20" stroke="#438a94" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Une boîte, deux directions</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Vue éclatée et plan d’encombrement · 260 × 150 × 125 mm · support stable et ouïes protégées.</text>
<rect x="28" y="169" width="130" height="75" rx="12" fill="#d9ded0" stroke="#212e2c" stroke-width="0.65"/>
<rect x="38" y="184" width="43" height="24" rx="2" fill="#438a94" stroke="#212e2c" stroke-width="0.55"/>
<rect x="85" y="184" width="43" height="24" rx="2" fill="#438a94" stroke="#212e2c" stroke-width="0.55"/>
<rect x="132" y="218" width="16" height="8" rx="2" fill="#c55d42" stroke="#212e2c" stroke-width="0.4"/>
<path d="M28 257 L158 257" stroke="#438a94" stroke-width="0.43" fill="none"/>
<path d="M28.0 255.5 L28.0 258.5" stroke="#438a94" stroke-width="0.65" fill="none"/>
<path d="M158.0 255.5 L158.0 258.5" stroke="#438a94" stroke-width="0.65" fill="none"/>
<text x="93.0" y="255.3" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#438a94" text-anchor="middle">260 mm</text>
<path d="M18 169 L18 244" stroke="#438a94" stroke-width="0.43" fill="none"/>
<path d="M19.5 169.0 L16.5 169.0" stroke="#438a94" stroke-width="0.65" fill="none"/>
<path d="M19.5 244.0 L16.5 244.0" stroke="#438a94" stroke-width="0.65" fill="none"/>
<text x="16.3" y="206.5" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#438a94" text-anchor="middle" transform="rotate(-90 16.3 206.5)">150 mm</text>
<text x="29" y="155" font-family="DejaVu Sans, sans-serif" font-size="4.2" font-weight="700" fill="#438a94" text-anchor="start">Plan 1:2 sur A3</text>
<rect x="30" y="77" width="72" height="5" rx="1" fill="#a6ad77" stroke="#212e2c" stroke-width="0.5"/>
<path d="M104 79 L114 79" stroke="#212e2c" stroke-width="0.4" fill="none"/>
<text x="116" y="81" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Grille extérieure</text>
<rect x="30" y="96" width="72" height="5" rx="1" fill="#e7cca6" stroke="#212e2c" stroke-width="0.5"/>
<path d="M104 98 L114 98" stroke="#212e2c" stroke-width="0.4" fill="none"/>
<text x="116" y="100" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Volet oscillant</text>
<rect x="30" y="115" width="72" height="5" rx="1" fill="#438a94" stroke="#212e2c" stroke-width="0.5"/>
<path d="M104 117 L114 117" stroke="#212e2c" stroke-width="0.4" fill="none"/>
<text x="116" y="119" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Ventilateur</text>
<rect x="30" y="134" width="72" height="5" rx="1" fill="#626767" stroke="#212e2c" stroke-width="0.5"/>
<path d="M104 136 L114 136" stroke="#212e2c" stroke-width="0.4" fill="none"/>
<text x="116" y="138" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Fond lesté et pieds souples</text>
<text x="223" y="78" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#438a94" text-anchor="start">L’air suit le volet</text>
<text x="223" y="91" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Une grille protège les doigts. Le volet reste à</text>
<text x="223" y="96" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">l’intérieur, en aval du ventilateur. Le socle tient hors de</text>
<text x="223" y="101" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">la zone de gouttage.</text>
<text x="223" y="149" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#438a94" text-anchor="start">Un signal sous le doigt</text>
<text x="223" y="163" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le témoin gauche ou droit s’allume quand cette zone reçoit</text>
<text x="223" y="168" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">le flux. Un appui coupe le ventilateur et immobilise le</text>
<text x="223" y="173" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">volet.</text>
<text x="223" y="218" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#438a94" text-anchor="start">Entretien</text>
<text x="223" y="230" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Débrancher et retirer le filtre accessible. Le socle et les</text>
<text x="223" y="235" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">deux pinces se rangent ensemble.</text>
<path d="M13 276 L407 276" stroke="#438a94" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#438a94" text-anchor="start">Séparer alimentation et zones humides. Les cotes et la vitesse du souffle sont des hypothèses de conception à vérifier sur un prototype.</text>
</svg>
