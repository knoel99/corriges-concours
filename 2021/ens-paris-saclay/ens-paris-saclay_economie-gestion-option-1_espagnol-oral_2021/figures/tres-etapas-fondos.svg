<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 255" width="820" height="255" role="img" aria-labelledby="titre desc"><title id="titre">De la promesse européenne au résultat local</title><desc id="desc">Approuver un plan. L’État expose ses réformes et ses investissements. Leur cohérence est examinée au niveau européen. Verser une tranche. Les versements dépendent des étapes et objectifs convenus. Le montant annoncé ne constitue pas une recette déjà encaissée. Mesurer un effet. Une dépense exécutée se compare à un résultat concret, par exemple le gain énergétique réel dans les bâtiments rénovés.</desc><rect width="820" height="255" fill="#f6f5ef"/><g font-family="DejaVu Sans, sans-serif" fill="#153139"><text x="24" y="32" font-size="22" font-weight="bold">De la promesse européenne au résultat local</text><path d="M24 62h241" stroke="#39756e" stroke-width="4"/><text x="24" y="93" font-size="18" font-weight="bold">Approuver un plan</text><text x="24" y="123" font-size="15">L’État expose ses réformes</text><text x="24" y="145" font-size="15">et ses investissements.</text><text x="24" y="167" font-size="15">Leur cohérence est examinée</text><text x="24" y="189" font-size="15">au niveau européen.</text><path d="M289 62h241" stroke="#39756e" stroke-width="4"/><text x="289" y="93" font-size="18" font-weight="bold">Verser une tranche</text><text x="289" y="123" font-size="15">Les versements dépendent</text><text x="289" y="145" font-size="15">des étapes et objectifs</text><text x="289" y="167" font-size="15">convenus. Le montant</text><text x="289" y="189" font-size="15">annoncé ne constitue pas</text><text x="289" y="211" font-size="15">une recette déjà encaissée.</text><path d="M554 62h241" stroke="#39756e" stroke-width="4"/><text x="554" y="93" font-size="18" font-weight="bold">Mesurer un effet</text><text x="554" y="123" font-size="15">Une dépense exécutée se</text><text x="554" y="145" font-size="15">compare à un résultat</text><text x="554" y="167" font-size="15">concret, par exemple le</text><text x="554" y="189" font-size="15">gain énergétique réel dans</text><text x="554" y="211" font-size="15">les bâtiments rénovés.</text></g></svg>
