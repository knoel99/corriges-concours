<text x="507" y="158" text-anchor="middle" fill="#233f43" font-size="18" font-weight="400">Loger</text>
<text x="720" y="67" text-anchor="middle" fill="#233f43" font-size="18" font-weight="400">Travailler</text>
<text x="756" y="158" text-anchor="middle" fill="#233f43" font-size="18" font-weight="400">Se distraire</text>
<text x="198" y="212" text-anchor="middle" fill="#233f43" font-size="21" font-weight="400">Rapprocher trois postes.</text>
<text x="636" y="212" text-anchor="middle" fill="#233f43" font-size="21" font-weight="400">Relier des lieux éloignés.</text></g></svg>
