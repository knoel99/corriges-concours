<svg xmlns="http://www.w3.org/2000/svg" width="840" height="235" viewBox="0 0 840 235" role="img" aria-labelledby="titre description"><title id="titre">Gagner du temps, changer de trajet</title><desc id="description">À gauche, les trois postes de la cuisine sont voisins. À droite, trois lieux séparés dans la ville sont reliés par des trajets imposés. Ces schémas ne représentent aucun plan particulier.</desc><defs><marker id="a" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a65639"/></marker></defs><g font-family="DejaVu Sans, sans-serif">
<text x="197" y="27" text-anchor="middle" fill="#233f43" font-size="25" font-weight="700">Cuisine intégrée</text>
<text x="636" y="27" text-anchor="middle" fill="#233f43" font-size="23" font-weight="700">Ville aux fonctions séparées</text>
<rect x="12" y="43" width="372" height="134" rx="3" fill="#fffaf1" stroke="#233f43" stroke-width="1.7"/>
<rect x="34" y="60" width="67" height="83" rx="3" fill="#dcece7" stroke="#233f43" stroke-width="1.7"/>
<rect x="155" y="60" width="85" height="35" rx="3" fill="#f3e8d3" stroke="#233f43" stroke-width="1.7"/>
