<text x="68" y="108" text-anchor="middle" fill="#233f43" font-size="18" font-weight="400">Évier</text>
<text x="198" y="85" text-anchor="middle" fill="#233f43" font-size="18" font-weight="400">Plan</text>
<text x="322" y="108" text-anchor="middle" fill="#233f43" font-size="18" font-weight="400">Feux</text>
