<text x="152" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Isoler la zone, lever sur quatre vérins</text>
<text x="152" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">synchronisés, retirer le plateau puis</text>
<text x="152" y="209" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">abaisser sur calages.</text>
