<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Le véhicule de 5,00 × 2,20 × 2,20 m donne le gabarit de charge. Le transporteur et le constructeur valident poids, stabilité et manutention.</text>
