<text x="285" y="199" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Installer la rampe et le palier,</text>
<text x="285" y="204" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">verrouiller l’auvent sur ses deux</text>
