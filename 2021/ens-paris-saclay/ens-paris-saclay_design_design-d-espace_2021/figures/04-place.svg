<text x="237" y="77" font-family="DejaVu Sans, sans-serif" font-size="4.9" font-weight="700" fill="#3b665b" text-anchor="start">Matin / informer</text>
<text x="237" y="88" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le panneau visible depuis la rue donne les permanences,</text>
<text x="237" y="93" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">les services disponibles et la prochaine étape de la</text>
<text x="237" y="98" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">tournée.</text>
<text x="237" y="130" font-family="DejaVu Sans, sans-serif" font-size="4.9" font-weight="700" fill="#3b665b" text-anchor="start">Après-midi / apprendre</text>
<text x="237" y="141" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Le médiateur fait pratiquer un rendez-vous en ligne sur</text>
<text x="237" y="146" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">un exemple fictif. Le bureau reste disponible pour un</text>
<text x="237" y="151" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">échange réservé.</text>
<text x="237" y="190" font-family="DejaVu Sans, sans-serif" font-size="4.9" font-weight="700" fill="#3b665b" text-anchor="start">Fin de journée / se rencontrer</text>
<text x="237" y="201" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">L’auvent peut accueillir une projection ou une</text>
<text x="237" y="206" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">permanence associative. Le rangement et les accès aux</text>
<text x="237" y="211" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">établissements voisins sont vérifiés avant le départ.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Les panneaux communaux annoncent le retour du même auvent. Un cahier de fréquentation anonyme permet d’adapter les jours et les horaires.</text>
</svg>
