<text x="16.3" y="122.0" font-family="DejaVu Sans, sans-serif" font-size="3.4" font-weight="700" fill="#3b665b" text-anchor="middle" transform="rotate(-90 16.3 122.0)">2,10 m</text>
<text x="270" y="84" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">Démarches individuelles</text>
<text x="270" y="96" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">La porte donne sur le bureau, écran tourné</text>
<text x="270" y="101" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">hors du regard des passants. Le conseiller</text>
<text x="270" y="106" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">et l’usager voient le même document.</text>
<text x="270" y="148" font-family="DejaVu Sans, sans-serif" font-size="4.6" font-weight="700" fill="#3b665b" text-anchor="start">Apprendre à deux</text>
<text x="270" y="160" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Deux terminaux permettent un atelier</text>
<text x="270" y="165" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">numérique. Une séparation coulissante isole</text>
<text x="270" y="170" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">la conversation. Le passage sous auvent</text>
<text x="270" y="175" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">accueille l’attente.</text>
<text x="270" y="220" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">À droite, la rampe franchit 0,20 m à 5 %.</text>
<text x="270" y="225" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">Prévoir paliers horizontaux et mains</text>
<text x="270" y="230" font-family="DejaVu Sans, sans-serif" font-size="3.55" font-weight="400" fill="#212e2c" text-anchor="start">courantes selon le site.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Le plan de déploiement se retourne suivant l’orientation de la place. Les extensions se replient avant transport. Cotes en mètres.</text>
</svg>
