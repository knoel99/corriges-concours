<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297" role="img"><title>Une adresse qui se déplace</title><desc>Meuse · la même maison de services vient au village, ouvre son auvent puis laisse la place à ses usages habituels.</desc>
<rect x="0" y="0" width="420" height="297" rx="0" fill="#fcf5e8" stroke="none" stroke-width="0.6"/>
<text x="13" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="700" fill="#3b665b" text-anchor="start">LA HALTE COMMUNE</text>
<text x="407" y="15" font-family="DejaVu Sans, sans-serif" font-size="3.6" font-weight="400" fill="#3b665b" text-anchor="end">1 / 4</text>
<path d="M13 20 L407 20" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="13" y="34" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#212e2c" text-anchor="start">Une adresse qui se déplace</text>
<text x="13" y="44" font-family="DejaVu Sans, sans-serif" font-size="3.65" font-weight="400" fill="#212e2c" text-anchor="start">Meuse · la même maison de services vient au village, ouvre son auvent puis laisse la place à ses usages habituels.</text>
<rect x="18" y="73" width="119" height="75" rx="0" fill="#e6e7d2" stroke="#212e2c" stroke-width="0.4"/>
<polygon points="27,92 70,80 81,102 38,118" fill="#afa999" stroke="#212e2c" stroke-width="0.65" stroke-linejoin="round"/>
<path d="M21 131 L112 98" fill="none" stroke="#626767" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="84" y="109" width="12" height="5" rx="0" fill="#3b665b" stroke="#212e2c" stroke-width="0.4"/>
<rect x="84" y="114" width="12" height="5" rx="0" fill="#e0ac71" stroke="#212e2c" stroke-width="0.2"/>
<text x="18" y="165" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Dun-sur-Meuse</text>
<text x="18" y="179" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Près de l’église, se placer le long du</text>
<text x="18" y="184" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">chemin sur un sol portant. Garder</text>
<text x="18" y="189" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">l’accès à l’édifice et les arbres</text>
<text x="18" y="194" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">libres.</text>
<rect x="150" y="73" width="119" height="75" rx="0" fill="#e6e7d2" stroke="#212e2c" stroke-width="0.4"/>
<path d="M153 138 L201 105 L261 93" fill="none" stroke="#626767" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="221" y="79" width="27" height="13" rx="0" fill="#e7cca6" stroke="#212e2c" stroke-width="0.45"/>
<ellipse cx="172" cy="108" rx="10" ry="7" fill="#a6ad77" stroke="none" stroke-width="0.65"/>
<rect x="187" y="116" width="12" height="5" rx="0" fill="#3b665b" stroke="#212e2c" stroke-width="0.4"/>
<rect x="187" y="121" width="12" height="5" rx="0" fill="#e0ac71" stroke="#212e2c" stroke-width="0.2"/>
<text x="150" y="165" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Sivry-sur-Meuse</text>
<text x="150" y="179" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">En retrait de l’intersection, orienter</text>
<text x="150" y="184" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">l’auvent vers le cheminement de la</text>
<text x="150" y="189" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">mairie. Conserver les triangles de</text>
<text x="150" y="194" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">visibilité.</text>
<rect x="282" y="73" width="119" height="75" rx="0" fill="#e6e7d2" stroke="#212e2c" stroke-width="0.4"/>
<rect x="285" y="76" width="110" height="9" rx="0" fill="#e7cca6" stroke="#212e2c" stroke-width="0.4"/>
<rect x="290" y="128" width="90" height="12" rx="0" fill="#e7cca6" stroke="#212e2c" stroke-width="0.4"/>
<rect x="307" y="95" width="18" height="21" rx="0" fill="#e7cca6" stroke="#212e2c" stroke-width="0.4"/>
<rect x="362" y="91" width="24" height="13" rx="0" fill="#e7cca6" stroke="#212e2c" stroke-width="0.4"/>
<rect x="335" y="104" width="12" height="5" rx="0" fill="#3b665b" stroke="#212e2c" stroke-width="0.4"/>
<rect x="335" y="109" width="12" height="5" rx="0" fill="#e0ac71" stroke="#212e2c" stroke-width="0.2"/>
<text x="282" y="165" font-family="DejaVu Sans, sans-serif" font-size="5" font-weight="700" fill="#3b665b" text-anchor="start">Stenay</text>
<text x="282" y="179" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Place de la République, réserver</text>
<text x="282" y="184" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">temporairement des places côté mairie.</text>
<text x="282" y="189" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">Maintenir la traversée de la place et</text>
<text x="282" y="194" font-family="DejaVu Sans, sans-serif" font-size="3.7" font-weight="400" fill="#212e2c" text-anchor="start">l’accès des secours.</text>
<path d="M13 276 L407 276" stroke="#3b665b" stroke-width="0.5" fill="none"/>
<text x="14" y="283.0" font-family="DejaVu Sans, sans-serif" font-size="3.25" font-weight="400" fill="#3b665b" text-anchor="start">Croquis de principe tirés des trois plans et photographies fournis. La case verte désigne la caisse, la case ocre son seuil couvert.</text>
</svg>
