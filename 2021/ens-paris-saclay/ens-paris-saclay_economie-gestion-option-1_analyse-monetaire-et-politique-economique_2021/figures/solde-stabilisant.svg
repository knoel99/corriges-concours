<svg xmlns="http://www.w3.org/2000/svg" width="725" height="375" viewBox="0 0 725 375" role="img"><title>Excédent primaire requis (% du PIB)</title><desc>Pour une dette initiale égale à 100 % du PIB, le solde primaire stabilisant dépend de l’écart entre taux d’intérêt et croissance nominaux. Un taux d’intérêt de 2 % exige un excédent si la croissance est de 1 %, et autorise un déficit si elle est de 3 %.</desc><rect width="725" height="375" fill="white"/><g font-family="sans-serif" font-size="15" fill="#243b48"><text x="94" y="32" font-weight="bold">Excédent primaire requis (% du PIB)</text><path d="M 94 262.00 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="267.0" text-anchor="end">-3</text><path d="M 94 233.86 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="238.85714285714286" text-anchor="end">-2</text><path d="M 94 205.71 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="210.71428571428572" text-anchor="end">-1</text><path d="M 94 177.57 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="182.57142857142856" text-anchor="end">0</text><path d="M 94 149.43 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="154.42857142857144" text-anchor="end">1</text><path d="M 94 121.29 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="126.28571428571428" text-anchor="end">2</text><path d="M 94 93.14 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="98.14285714285714" text-anchor="end">3</text><path d="M 94 65.00 H 660" stroke="#d3dcdf" stroke-width="1"/><text x="85" y="70.0" text-anchor="end">4</text><path d="M 94.00 262 v 5" stroke="#243b48"/><text x="94.0" y="285" text-anchor="middle">0</text><path d="M 207.20 262 v 5" stroke="#243b48"/><text x="207.2" y="285" text-anchor="middle">1</text><path d="M 320.40 262 v 5" stroke="#243b48"/><text x="320.4" y="285" text-anchor="middle">2</text><path d="M 433.60 262 v 5" stroke="#243b48"/><text x="433.59999999999997" y="285" text-anchor="middle">3</text><path d="M 546.80 262 v 5" stroke="#243b48"/><text x="546.8" y="285" text-anchor="middle">4</text><path d="M 660.00 262 v 5" stroke="#243b48"/><text x="660.0" y="285" text-anchor="middle">5</text><path d="M 94 65 V 262 H 660" fill="none" stroke="#243b48" stroke-width="2"/><text x="377.0" y="309" text-anchor="middle" font-weight="bold">Taux d’intérêt effectif nominal (%)</text><polyline points="94.00,205.44 207.20,177.57 320.40,149.71 433.60,121.84 546.80,93.98 660.00,66.11" fill="none" stroke="#075985" stroke-width="3.5"/><path d="M 94 333 h 23" stroke="#075985" stroke-width="4"/><text x="126" y="338" >Croissance nominale : 1 %</text><polyline points="94.00,259.54 207.20,232.22 320.40,204.89 433.60,177.57 546.80,150.25 660.00,122.93" fill="none" stroke="#aa3d36" stroke-width="3.5"/><path d="M 94 356 h 23" stroke="#aa3d36" stroke-width="4"/><text x="126" y="361" >Croissance nominale : 3 %</text></g></svg>
