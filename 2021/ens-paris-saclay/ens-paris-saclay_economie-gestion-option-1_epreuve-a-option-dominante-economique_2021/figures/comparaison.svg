<svg xmlns="http://www.w3.org/2000/svg" width="740" height="220" viewBox="0 0 740 220" role="img" aria-labelledby="title desc"><title id="title">Deux hausses identiques de la production</title><desc id="desc">Une même production finale de 120 représente une productivité de 1 ou de 1,2 selon les heures mobilisées.</desc><rect width="740" height="220" fill="white"/><g fill="#183642" font-family="sans-serif"><text x="17" y="31" font-size="22" font-weight="bold">Deux hausses identiques de la production</text><text x="17" y="61" font-size="17">Exemple construit · unités produites par heure à la fin</text><path d="M282 79V192" stroke="#8c9ba2"/><text x="17" y="111" font-size="18">120 unités en 120 heures</text><rect x="282" y="91" width="271.58" height="23" fill="#296175"/><text x="563.58" y="110" font-size="18">1</text><text x="17" y="174" font-size="18">120 unités en 100 heures</text><rect x="282" y="154" width="325.89" height="23" fill="#9b511f"/><text x="617.89" y="173" font-size="18">1,2</text></g></svg>
